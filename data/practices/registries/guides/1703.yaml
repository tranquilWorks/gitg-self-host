- id: file-later-packet-md
  title: Later packet
  body: 'Supplied fiction, not actual participant evidence.


    Eri declines Saturday 7 November at 15:00 because they need a quiet weekend. No alternative date is
    agreed. The specific invitation was made, but the future interaction was not mutually scheduled.


    You follow up on Sunday 8 November at 18:00: “How did the next sketch go, if you feel like sharing?”
    This is six days after the Monday 2 November conversation, within the original seven-day window. Eri
    replies that they have not drawn again and are enjoying a rest. You acknowledge that without trying
    to turn rest into a problem.


    The topic-based follow-up does not require a completed drawing. The reply does not retroactively schedule
    Saturday, and Eri''s lack of project progress does not make the friendship practice a failure. Keep
    the fourteen-day practice and original action markers unchanged. No actual app event, completion,
    score or replay is created by this packet.'
sections:
- id: teaching
  kind: concept
  title: Learn and try
  body: 'A friendship can receive attention through remembering, contacting, inviting, celebrating, assisting
    and staying present during unremarkable weeks. This companion supports the existing **Deepen One Existing
    Friendship** practice. Its fourteen-day duration and three actions remain unchanged. Choose one existing
    friend you value, where contact is welcome; defer without penalty if none is suitable. This is not
    a way to revive unwanted contact or handle abuse, stalking, crisis or unsafe dependence.


    ### Maintain continuity without making a loyalty test


    Remembering means carrying forward a non-sensitive detail the person freely shared. Contact makes
    that attention visible. An invitation offers a specific opportunity to spend time together. Celebration
    responds to actual good news, assistance responds to an actual need with permission, and ordinary
    presence keeps care from appearing only when there is a crisis. These forms overlap, but none entitles
    you to a response.


    Feeney and Collins''s theoretical model includes relational support during adversity and opportunities
    for growth [S13](https://pubmed.ncbi.nlm.nih.gov/25125368/). The inspected abstract motivates attention
    beyond crises; it does not validate this practice''s duration or establish that one cycle deepens
    a friendship. The legacy timing comes from the existing protocol, not from a research-derived dose.


    Depth does not require a traumatic disclosure. A hobby goal, a busy season, good news or a meaningful
    everyday change can support a substantive conversation. Ask what the friend wants to discuss and follow
    their actual interest. If they prefer lighter contact, honor it. A lower-intensity interaction can
    be relationally worthwhile without satisfying a more demanding action description.


    ### The three existing actions


    **A1, Listen to what matters now:** initiate a substantive conversation about something currently
    meaningful in the friend''s life and spend at least ten minutes primarily listening. Let the friend
    set disclosure depth. A genuine follow-up question can show attention, but do not keep questioning
    to force “meaningful information.” Use a mutually workable medium, including accessible or asynchronous
    communication; do not invent elapsed listening time from an unopened message.


    **A2, Make a specific invitation:** propose an activity and date. Include practical access, distance,
    cost and energy constraints. A proposal and a mutually scheduled interaction are different facts.
    “Maybe someday” is vague; “Would a free twenty-minute call on Sunday at 16:00 work?” is specific,
    yet remains unconfirmed until the other person agrees.


    **A3, Follow up:** within seven days, refer to something the person actually shared and ask how it
    developed. The existing seven-day follow-up remains intact. A follow-up can welcome ordinary news
    without demanding progress or explanation. Set yourself a private reminder that contains no sensitive
    detail.


    Keep the account of actual contact honest and minimal. In particular, user initiation does not establish
    reciprocity, and a specific proposal does not establish the original “future interaction scheduled”
    marker. Internal resistance, expected reciprocity and observed reciprocity remain separate. Completing
    the practice never establishes mastery or the quality of the friendship.


    ### Worked example: interest without an invoice


    Mara''s friend is learning a short piece of music and is pleased with a small improvement. Mara listens,
    asks what part was satisfying and celebrates that reported progress. Mara offers a free shared listening
    session on a particular date, with no assumption that performance is owed. If the friend declines
    because of fatigue, Mara can accept that and follow up about the original topic within seven days
    if contact remains welcome.


    Mara need not send advice, purchase a gift or turn the conversation into coaching. Assistance might
    fit if the friend asks for help finding a practice space; it does not fit merely because Mara wants
    to be useful. Staying present can mean remembering the topic in a later ordinary exchange rather than
    generating a new emotional event.


    ### Your case: a friend''s small project


    All facts are fictional. You and Eri already enjoy occasional contact. Eri has said that completing
    a small balcony drawing matters to them and welcomes a call on Monday 2 November at 18:00. During
    the call, Eri talks about choosing a view and enjoying the process. You primarily listen for twelve
    minutes, then exchange practical news for three minutes. Eri says no help is needed and mentions hoping
    to try another sketch by the weekend.


    1. **Prepare the real-world equivalent carefully.** Choose a welcome friend and medium, allow enough
    time for the existing listening action and identify a non-sensitive starting topic. Do not tell the
    friend they must help you complete a metric. Output: a contact plan and permission-sensitive opening.

    2. **Separate what happened from what you hoped.** In the supplied case, twelve minutes primarily
    listening meets the stated ten-minute duration; the extra three practical minutes are not needed to
    inflate it. Note the actual meaningful topic without copying private details. Output: listening duration
    and observed action facts, with reciprocity still not owed.

    3. **Offer one specific shared activity and date.** For Eri, propose a free twenty-minute remote sketch
    session on Saturday 7 November at 15:00, allowing another option or decline. Celebrate the reported
    enjoyment; do not offer unsolicited instruction after Eri declined help. Output: invitation status,
    not an assumed booking.

    4. **Save your account, then read the [later packet](?resource=file-later-packet-md).** Check the
    follow-up interval and record the invitation''s actual disposition. Output: attempted/completed/pending
    facts tied to the existing actions, with no rewritten rules.


    ### Sustain a form both people can bear


    For support, choose a free remote activity, written contact, AAC or a lower-sensory setting that fits
    both people. If the substantive listening requirement is not met, report that honestly rather than
    rounding up. The existing completion process remains responsible for deciding completion from the
    original actions and fields; the companion does not award it.


    For a harder attempt, you feel disappointed after a declined invitation. Notice the expectation privately,
    accept the answer and avoid turning follow-up into a request for reassurance. For transfer, revisit
    the friendship after ordinary time has passed: what form of presence was actually welcome, and what
    cadence fits care, work and distance? Do not infer consistent reciprocal investment from one fictional
    or real cycle. Answer the [fresh checks](?attempt=practice-checks) before reading their key.'
- id: practice-checks
  kind: prompt
  title: Practice checks
  body: 'Apply the unchanged legacy practice to these fictional facts before [the key](?check=practice-answers).


    1. You primarily listened for eight minutes and exchanged logistics for seven. Can you record at least
    ten minutes primarily listening because the call lasted fifteen?

    2. You propose Tuesday at 17:00 for a free call; your friend replies, “Maybe, I''ll see.” Which invitation
    facts are established?

    3. A meaningful conversation was on Monday 2 November at 18:00. Follow-up occurs Tuesday 10 November
    at 18:00. Is that within seven days? How should a kind but late attempt be recorded?'
  check_id: practice-answers
  attempt_mode: practice
checks:
- id: practice-answers
  title: Compare your responses
  body: '1. No. Eight minutes primarily listening is two minutes short; logistics do not change that.
    The interaction can still matter personally. Preserve the actual facts and unchanged action requirement
    instead of redefining completion.

    2. A specific invitation was initiated; a future interaction has not been mutually scheduled. “Maybe”
    leaves agreement pending. Do not press for acceptance to satisfy a marker or infer a lack of care.

    3. Eight days elapsed, so the follow-up is outside seven days. Record the actual follow-up and unmet
    timing marker. Kindness does not authorize a false date; a missed marker does not rate the person''s
    worth or the friendship.'
  criteria:
  - Compare each saved response with its matching explanation; keep revisions separate from your initial
    attempt.
