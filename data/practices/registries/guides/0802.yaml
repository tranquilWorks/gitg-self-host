sections:
- id: teaching
  kind: concept
  title: Learn and try
  body: '### Optional extensions to the same route-card activity


    Use the same complete packet in each window. Besides the four original relations, the fictional courtyard
    contains a bench at its center, a tree beside the west water point and a noticeboard just inside the
    south entrance. The east reading room has a public desk; the north staff door remains unavailable.
    At an ordinary pace, draw or describe the layout, trace the south-entrance-to-reading-room route,
    describe the return route and inspect whether any imagined shortcut used the staff door. You may compare
    a verbal description with a simple sketch or reread the whole card. These are optional ways to stay
    with the activity, not outputs to finish or score. Keep task material and access supports comparable
    across usual, changed-condition and repeat windows.


    ### Optional material for the existing attention window


    For the existing fifteen-minute attention experiment, choose one ordinary anchor: contact with a supported
    chair, ambient sound at a comfortable level, or visual details of a familiar object. Use a harmless
    object already available; do not seek distracting or distressing sensations. If the first observation
    feels complete, revisit it slowly: notice color or texture, then notice what has changed in attention,
    then return to the chosen anchor. No minimum number of details, uninterrupted-focus target or written
    product is required. Pause or stop when needed and record what actually happened. These optional prompts
    fill out the task without extending its window, adding an action or turning distraction into failure.


    ### Return to one present activity under workable conditions


    Present attention means noticing when attention has moved away and returning to the current task,
    body, person or surroundings. It does not demand an empty mind, perfect stillness or uninterrupted
    concentration. Catching drift earlier may be a private observation; counting distractions can itself
    become another task. NCCIH [S04](https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety)
    notes uncertainty and safety limits in mindfulness research. This ordinary attention experiment is
    not meditation treatment or a substitute for care.


    This companion follows the existing presence practice: one usual fifteen-minute window, one fifteen-minute
    window with exactly one changed condition, and a fifteen-minute repeat of the more workable condition
    within seven days of the first attempt. Allow five to fifteen minutes of setup and a brief final review
    within the ten-day protocol. The first action is due by day three; plan the repeat early enough to
    meet the seven-day interval. Keep the standard windows distinct from an accessible duration adaptation;
    never treat an imagined repeat as performed.


    ### A complete, ordinary activity


    Fictional Dana chooses a quiet task of arranging a small paper route card. The whole material is:
    “The entrance is south of the courtyard. The reading room is east of the courtyard. The water point
    is west of the courtyard. The north door is staff-only.” Draw or describe these four relations, check
    them against the text and reread at an ordinary pace for the remaining window. Accuracy and output
    quantity are not the experiment''s score. No real navigation depends on this card.


    Dana''s usual setup places an optional puzzle magazine beside the card. The single changed condition
    will put that magazine on a shelf. Lighting, chair, task and access aids stay the same as far as practical.
    Essential alerts, medication routines, movement and fidgets remain available. A necessary interruption
    is recorded honestly, never suppressed to earn completion. Do not use driving, machinery or another
    hazardous activity as the attention task.


    Other appropriate anchors can be an ordinary external sensation, a consenting person''s words or a
    comfortable body sensation. These are choices, not four required tests. If inward attention is distressing,
    choose an external activity or stop; eye closure and breath control are unnecessary. A person is never
    an object to monitor, and conversation requires their ordinary consent.


    1. Choose the safe activity and usual arrangement. Begin deliberately and try the fifteen-minute window.
    When you notice drift, return gently to the chosen activity without tallying it. Afterwards record
    whether the window was actually attempted and completed, and a brief qualitative note if useful.

    2. Change only the optional magazine placement for a second fifteen-minute attempt. Compare which
    condition was more workable and what else differed. Save the comparison before the [repeat record](?resource=file-later-packet-md).
    “No clear difference” is an honest result; choose a safe feasible condition for repetition without
    inventing a winner.

    3. Repeat that condition within seven days of the first attempt, then review all three. A repeat scheduled
    or occurring later cannot be called an on-time repeat. The existing practice requires all three actions
    attempted, at least two completed, a comparison, the timely repeat and final review; this source does
    not loosen those requirements.


    For support, use accessible text, dictation, movement or a different suitable activity. The existing
    protocol also permits consistently shortened windows when fifteen minutes is not workable: choose
    a comparable shorter duration for all windows and record that limitation, without relabeling them
    full fifteen-minute windows. Deferral or another practice remains available. For a harder case, a
    necessary call interrupts the changed window: preserve the interruption and compare only what was
    observed. No productivity ranking, surveillance or clinical claim follows from the result. Broader
    presence with people or under stress remains future work, not established by one paper task.


    ### Use the result at its proper scale


    Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
    diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
    consent, authority and support.


    Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
- id: practice-checks
  kind: prompt
  title: Practice checks
  body: 'Attempt these before opening [answers](?check=practice-answers).


    1. The third window is planned for six days later but has not occurred. Does it satisfy the repeat
    requirement?


    2. An access aid seems distracting. Must it be removed to make the changed condition count?


    3. Both conditions seem equally workable. Should a winner or distraction count be invented?'
  check_id: practice-answers
  attempt_mode: practice
checks:
- id: practice-answers
  title: Compare your responses
  body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
    a learner score.


    1. No. Planning is not an attempted repeat. Preserve the actual dates and apply the existing within-seven-days
    requirement only to a performed action.


    2. No. Preserve essential alerts, prescribed routines and accessibility supports. Change one optional
    condition, select a suitable alternative or defer.


    3. No. Record an inconclusive comparison and choose a safe feasible condition to repeat. No fabricated
    winner, drift tally or productivity measure is required.'
  criteria:
  - Compare each saved response with its matching explanation; keep revisions separate from your initial
    attempt.
