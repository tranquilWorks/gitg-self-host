- id: file-later-packet-md
  title: Later packet
  body: 'Supplied fictional reply: “I was checking when the next activity starts. The earlier session
    could work, but I need to check transport. Please give me the options in a message.”


    Compare this with your first interpretation. The clock concern is reported; an earlier start is possible
    but unconfirmed. Transport remains unknown. If you had inferred rejection or irritation, retain the
    contradiction rather than rewriting the original guess. The reply does not identify the cause of every
    posture change or establish a particular feeling.


    A useful next action is to offer the actual options in the requested medium with a reasonable response
    window. It does not require a second emotion question. Your own slower pace and extra distance may
    reduce pressure, but no actual benefit has been observed in this paper case.


    Alternate outcome: “I don''t want to explain. Let''s stop planning now.” Stop. The reason remains
    unknown; refusal is not proof of anger, concealment or a false answer.


    In real legacy practice, compare any later clarification within its existing seven-day follow-up,
    using only its existing fields. A supplied reply does not complete a real interaction, the ten-day
    practice or any original action.'
sections:
- id: teaching
  kind: concept
  title: Learn and try
  body: 'Nonverbal communication offers information about an interaction, but a movement is not a transparent
    label for an inner state. This companion helps you describe cues cautiously, adjust your own delivery
    and accept direct clarification. It supports the ten-day emotional-cue practice. Keep the ten-day
    practice and seven-day follow-up distinct from a short paper rehearsal. Record only what you actually
    observed and any direct clarification; do not monitor people to manufacture an observation.


    ### Read the situation without claiming a hidden answer


    Posture can change with fatigue or furniture; a facial movement may have several meanings; looking
    away may help someone think. Distance has practical and interpersonal functions. Gesture, pace and
    tone can make a message easier or harder to receive. None of these observations alone proves anger,
    lying, attraction, competence or consent. A review by Barrett and colleagues describes substantial
    variation in how facial movements relate to emotion [S02](https://pmc.ncbi.nlm.nih.gov/articles/PMC6640856/).
    Its focus is facial inference, not a universal theory covering every gesture, voice or culture.


    Use three levels. First describe what was available to you: “The answer became shorter after the schedule
    question.” Then form tentative explanations: the question was unwelcome, the person was distracted,
    or they had little time. Finally identify a welcome clarification that can change what you do: “Would
    it help to pause this planning, or is now still okay?” This is narrower than asking someone to explain
    their whole emotional life. A refusal to answer leaves the interpretation unknown; it does not confirm
    the most worrying hypothesis.


    Context includes what the person has chosen to tell you, the setting, access needs, timing and the
    relationship. It does not license replacing one stereotype with another: “People from that culture
    avoid eye contact” is still an unsupported inference about this person. You need no eye-contact quota,
    face recording, emotion-recognition software or covert test. Report only cues you actually had access
    to, and mark the rest unobserved.


    ### Worked example: the doorway


    During an ordinary planning exchange, Ren moves farther from a noisy doorway and turns one shoulder
    toward the hall. Jo first thinks Ren wants to leave. Jo notices their own voice has become louder
    over the noise and asks, “Would a quieter spot or a pause work better?” Ren says, “A quieter place,
    please; I still want to finish the plan.” The words contradict the leaving interpretation and identify
    a practical adjustment. They do not prove exactly which feeling Ren had or why their shoulder turned.


    Jo moves only after agreement, lowers volume enough for the quieter setting and checks audibility.
    This is using one''s own distance, orientation and tone to support access. It is not mirroring movements
    to manufacture trust. A smooth interaction cannot retroactively turn the initial guess into a correct
    reading.


    ### Your case: a weekend plan


    Allow fifteen minutes for the paper attempt and, only when welcome, a brief ordinary interaction.
    The fictional observation is this: while discussing a weekend hobby session, Mika usually gives full
    sentences. When you ask about starting earlier, Mika answers “Maybe,” pauses, glances toward a wall
    clock and shifts a chair backward. You notice you have leaned forward and sped up while listing reasons.
    The room is warm and another activity starts soon. You do not know Mika''s preference, schedule or
    feelings. No recording is available or needed.


    1. **Inventory the available cues.** Describe posture, face, optional gaze, distance, gesture, pace
    and tone in separate short rows. Only some are supplied here. Mark facial movement and tone unobserved
    rather than inventing a frown or sharp voice. Include the clock glance and your own lean and faster
    pace. Output: observation rows that another reader can distinguish from interpretation.

    2. **Keep alternatives alive.** Write at least two explanations, including one unrelated to you. For
    each, name an answer that would count against it. “Mika is upset, even if they deny it” cannot be
    corrected and is unsuitable. Note what you actually need to decide: continue, slow down, defer or
    use another medium. Output: tentative hypotheses with disconfirming information.

    3. **Change your contribution and ask once.** Rehearse settling at an agreed comfortable distance,
    allowing time and offering a neutral question. Do not touch, block an exit, insist on eye contact
    or imitate a mannerism. Accept “I don''t want to discuss it.” Output: a short clarification and controlled
    adjustment; a solo rehearsal stays a rehearsal.

    4. **Compare with the [later packet](?resource=file-later-packet-md).** Preserve your original interpretation
    and write what the fictional reply supports, contradicts and leaves unknown. Do not score success
    by the number of emotions guessed. Output: an update with at least one retained unknown.


    ### Follow-up and transfer


    If a real welcome exchange occurs within the existing practice, record only a minimal observation
    and actual clarification permitted by its original evidence fields. Within the existing seven-day
    follow-up, compare later information or a welcome correction with the initial interpretation. Lack
    of later information means inconclusive, not silently correct. Preserve the original ten-day practice
    and seven-day follow-up rather than treating this short paper exercise as a replacement.


    For support, use text to ask about timing or audibility and omit visual cues entirely when unavailable.
    A blind, low-vision, nonspeaking or remote participant need not simulate access they do not have.
    A person may prefer more distance, a quieter place, slower pacing or no adjustment; ask rather than
    assigning needs from a diagnosis. Do not make them justify an accommodation with private history.


    For a harder attempt, words and cues appear inconsistent: someone says the time is fine while repeatedly
    checking the door. Offer a practical exit or later option and accept the expressed choice unless a
    separate concrete safety concern requires another response. You cannot settle the mismatch through
    more confident mind-reading. For real transfer, use one low-stakes already welcome conversation and
    look for whether your adjustment helped the actual task. Do not practice on disciplinary interviews,
    suspected deception, abuse assessment or a stranger unaware of observation.


    The [fresh checks](?attempt=practice-checks) ask you to retain uncertainty under pressure. The desired
    progress is responsible use of cues and clarification, including correction of your own first guess.'
- id: practice-checks
  kind: prompt
  title: Practice checks
  body: '1. Someone folds their arms during your proposal and says the room is cold. What can you record,
    and what would make “They secretly reject the proposal” an unjustified conclusion?

    2. Your colleague says your rapid delivery is hard to follow. Name one adjustment and a check that
    does not require them to display a particular posture or expression.

    3. A person declines your clarification question. Seven days later you have no new information. How
    should the initial “probably annoyed” inference be handled?'
  check_id: practice-answers
  attempt_mode: practice
checks:
- id: practice-answers
  title: Compare your responses
  body: '1. Record folded arms and the person''s cold-room explanation. Their decision on the proposal
    remains unstated. An inner rejection claim goes beyond these observations; treating their explanation
    as a denial that confirms your guess makes the inference impossible to correct. Ask about the practical
    proposal only if welcome and necessary.

    2. Slow down, present one step at a time or offer text according to their preference. Ask whether
    they can follow the task or which step needs clarification. Audibility/comprehension evidence is more
    relevant than judging engagement from eye contact.

    3. Preserve the initial inference as unconfirmed and record that clarification was declined and no
    later information was obtained. Do not relabel it correct, penalize refusal or invent follow-up. Existing
    legacy timing and fields remain unchanged; this companion supplies no new credit rule.'
  criteria:
  - Compare each saved response with its matching explanation; keep revisions separate from your initial
    attempt.
