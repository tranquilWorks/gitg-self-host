- id: file-later-packet-md
  title: Later packet
  body: '**A — limit maintained and duties closed:** At 17:15 the person states the saved limit. The organizer
    replies, “I wish you could stay.” All six tables receive their pack by 17:50. At 17:55 the organizer
    receives the key. The person leaves at 18:00. No threat, retaliation or unsafe dependency is reported.
    The organizer never says they approve of the refusal.


    **B — clear limit, incomplete existing promise:** The same statement occurs at 17:15. At 17:55 only
    five tables have their pack; one pack was not supplied despite the original packet''s expectation.
    The key is returned directly at 17:55. The person tells the organizer about the missing pack before
    leaving at 18:00 and proposes asking the authorized supply contact for a replacement next morning.
    No acceptance or repair completion is supplied. Preserve the changed external condition and incomplete
    original result.


    **C — control and danger:** Instead of stating a self-directed limit, the person threatens to keep
    the key unless the organizer cancels the display. The organizer responds with a credible threat of
    retaliation. Do not continue this interaction as the exercise. Identify both the inappropriate coercive
    action and the new safety boundary, and use an appropriate support process. No successful boundary
    or safe key return is established by this packet.


    **D — preparation only:** The person privately drafts a statement but the meeting is cancelled and
    no request or interaction occurs. The stored key''s actual return state is not supplied. No direct
    statement or follow-through is observed; retain the resource question rather than inventing a return.'
sections:
- id: teaching
  kind: concept
  title: Learn and try
  body: '### Reclaim attention while closing what you owe


    Saying no concerns an optional demand. Ending responsibly also asks what promises, resources and dependencies
    remain when a goal, project or relationship stops. You can release an obsolete goal without pretending
    it was achieved. You can set a legitimate boundary without another person''s agreement. An existing
    promise may still need completion or an agreed revision.


    This guide teaches those distinctions through a complete fictional hobby-group case, an obsolete-project
    release and a safe optional relationship ending. Allow 20–30 minutes for the paper route and 10 minutes
    for the separate checks. Use paper, dictation, signed/augmentative or supported communication. No
    real confrontation, purchase, account, private disclosure or contact is required. Your default output
    is a limit, notice, handoff plan and branch-specific closure record; rehearsal is not a communicated
    live boundary.


    Choose only a low-stakes situation where your own participation is within your control and direct
    communication is reasonably safe. Do not use this exercise for abuse, coercive control, likely retaliation,
    stalking, unsafe dependency or material danger. Employment, housing, essential caregiving and consequential
    relationships may need organizational, trusted or qualified support. Do not withdraw essential care
    or encourage unsafe confrontation to finish a lesson.


    ### Reference: refusal, renegotiation and closure


    A **refusal** says an optional new request will not be taken on. A **boundary** states your involvement
    and the proportionate action you control. It does not require the other person to approve, become
    pleased or stop asking. Avoid threats, punishment, silent tests and demands to control their response.


    A **renegotiation** changes an existing accepted promise and needs the relevant agreement. If you
    promised one hour and want to leave after 30 minutes, “my boundary changed” does not itself settle
    the missing half-hour. Where a serious safety issue arises, prioritize the appropriate safety response
    and record the unresolved duty; do not force continued exposure for tidy paperwork.


    An **obsolete goal** is no longer useful or appropriate. Record why it ends, what will no longer be
    done and who or what may still rely on it. Sunk effort alone does not require continuing an optional
    goal. **Responsible closure** accounts for notice, remaining promises, borrowed resources, the handoff
    and unresolved items. Closure need not mean universal agreement, emotional resolution or no discomfort.


    A relationship ending can concern a voluntary, low-stakes activity partnership. Be direct about ending
    that activity and settle concrete shared obligations. This practice does not instruct separation from
    a dependent, termination of essential support or ending a dangerous relationship without appropriate
    help.


    ### A different worked example


    You agreed to lend a puzzle until Saturday and now want to stop lending it in future. “Please return
    it Saturday as agreed; I won''t lend it again after this” preserves the current promise while declining
    future lending. Demanding an immediate return as punishment changes the arrangement. When the puzzle
    returns, record receipt; the other person''s dislike of your future limit does not by itself make
    that limit invalid.


    ### Complete practice packet: one agreed hour, no extra setup


    The fictional hobby group meets Friday. You agreed on Monday to set out the paper materials from 17:00
    to 18:00. Your promised result is six tables each receiving one blank-card pack by 18:00. The organizer
    has promised to supply all six packs at the start; actual supply and placement are established by
    the later branches. This is ordinary optional hobby work, with no essential care or safety role. You
    may complete it seated or with already available assistance. No further tasks were promised.


    At 17:15 the organizer asks you to stay until 19:00 and decorate an additional display. That request
    is optional; nobody has agreed you will do it. You intend to leave at 18:00. You hold the group''s
    labeled storage key temporarily and must return it. The agreed receiving arrangement is the organizer
    in the room at 17:55; if they are unexpectedly absent, a designated labeled return envelope in the
    room is explicitly authorized for the key. The organizer has agreed to collect that envelope. The
    case does not require a stranger to accept custody.


    The supplied low-stakes facts rule out known retaliation or unsafe dependency. In a real situation,
    recheck rather than borrowing that fictional assurance. Your goal is to complete the agreed hour/result,
    give notice that the extra hour is unavailable and return the key. The organizer''s agreement to the
    new refusal is not a completion condition.


    #### Action 1 — Define the limit and the duties that remain


    Write `optional request | existing promise | own limit | proportionate follow-through | resources
    | notice | handoff/fallback | unresolved item`.


    An appropriate limit is: “I can finish the agreed setup until six; after that I will leave. I cannot
    take on the additional display.” The follow-through is your own departure, not making the organizer
    cancel the display or agree with you. Keep all six packs and key return in the responsibility record.
    A request you dislike is not automatically optional; here optionality is explicitly supplied by the
    case.


    Also examine the obsolete goal and relationship mini-cases below. Each needs a different closure artifact,
    not the same refusal with a noun changed.


    #### Action 2 — Give useful notice without forcing approval


    Draft a direct statement at 17:15 while the organizer can still plan: “I can complete the agreed six-table
    setup by six, then I will leave. I can''t stay for the display. I''ll return the key at 17:55 using
    our agreed arrangement.” If a promised detail is genuinely uncertain, clarify that detail without
    turning your availability into unlimited bargaining.


    This paper script is not a sent statement. Save it, then open [later-packet.md](?resource=file-later-packet-md)
    and analyze the supplied responses. The relevant evidence is what the person safely said and did,
    including handoff; another person''s disappointment is not an outcome to force away.


    #### Action 3 — Follow through and account for closure


    In each fictional branch record `notice event | agreed work result | limit maintained | key route/receipt
    | open duty | next action`. If the agreed work is incomplete, retain that fact and propose an appropriate
    repair without pretending the promise vanished. If a resource return is unknown, leave that obligation
    open. Emerging danger overrides the exercise and calls for appropriate support; a completed worksheet
    is never more important than safety.


    On the optional live route, the existing boundary practice spans ten days, with about 20–40 minutes
    plus the naturally occurring interaction. Define, state and follow through within its existing action
    windows: define within three days and follow through within seven days when the relevant situation
    arises. Do not invent an opportunity or reset dates to manufacture follow-through. Use the actual
    practice sequence for a real boundary attempt; a reading check is rehearsal.


    ### Complete mini-case: release an obsolete project


    You planned to make ten paper tickets for a now-cancelled optional game. Three blank ticket drafts
    exist; nobody paid or relied on receiving them. You borrowed a template sheet, due back Saturday by
    noon. The owner has already agreed you may return it through their labeled indoor return box and record
    that placement; no other resources were borrowed.


    Write a cancellation/closure card: why the game-ticket goal no longer serves its purpose, which work
    stops, what draft material is retained or discarded under your authority, and the template-return
    obligation. A goal released is not ten tickets completed. In simulation, write the return action as
    pending until a supplied or actual event supports it. Do not claim the actual return of a fictional
    object. Reclaimed attention can be described as future work no longer undertaken, not a measured emotional
    benefit.


    ### Complete mini-case: end an optional activity partnership


    Two fictional adults, you and Sam, have an optional monthly puzzle exchange. There is no dependency,
    paid agreement, shared account, care duty or known safety concern. You no longer want to continue.
    Sam''s puzzle is in your possession under an agreed return next Saturday at 11:00 in the hobby room.
    No other item is owed. Sam has not been promised another exchange after that return.


    Draft a clear ending of the exchange and preserve the return: “I am ending the monthly puzzle exchange.
    I will return your puzzle Saturday at eleven as agreed; I won''t arrange another exchange.” You need
    not obtain permission to stop future optional meetings. You do need to keep or properly address the
    existing return arrangement. Do not demand a reply, forgiveness or a matching explanation. A missing
    reply leaves any new proposed return method unaccepted, but does not create an obligation to keep
    the optional exchange going. A real emotionally consequential ending deserves context-specific care
    beyond this bounded example.


    Attempt [check-prompts.md](?attempt=practice-checks) before [check-answers.md](?check=practice-answers).
    Finish with distinct closure records for setup, obsolete tickets and the exchange, including what
    remains open. These reading checks do not establish that an actual boundary was stated or maintained.


    ### Supported routes, challenge and later transfer


    Use culturally suitable timing and directness, written or augmentative communication and an agreed
    support person. Private rehearsal is the appropriate route when there is no safe opportunity; label
    it preparation. It does not become live follow-through by being detailed. A support person cannot
    consent to an unrelated person''s changed promise on their behalf without real authority.


    For greater challenge, add the later packet''s unfinished-duty branch and choose a proportionate repair.
    Keep the optional extra display separate from the incomplete agreed setup. This tests whether a clear
    refusal can coexist with accountability. Do not broaden the challenge into high-stakes conflict.


    For transfer, use one naturally occurring safe optional request or one obsolete personal goal. Preserve
    actual notice, action and resource disposition. Review whether attention was freed without unannounced
    duties being abandoned. Do not infer relationship health, general assertiveness or freedom from guilt
    from one record.


    **Supportive:** The extra request is declined, agreed setup and key return occur, and the person leaves
    as stated without forcing approval.


    **Mixed:** The limit is maintained but a promised item or return remains unresolved and has a repair
    action.


    **Contradictory:** Essential care is withdrawn, a silent test punishes someone, or the original promise
    is erased under a boundary label.


    **Inconclusive:** Only a private script exists, no suitable live opportunity arose or safety uncertainty
    prevents use.


    See [source notes](?resource=sources). This companion is not a new clinical, relationship-safety or
    scoring protocol.'
- id: practice-checks
  kind: prompt
  title: Practice checks
  body: '### Check 1 — An unpleasant duty is still a duty


    A fictional volunteer promised to return a borrowed display stand Saturday by noon through an agreed
    staffed desk. On Friday they decide not to participate in future optional displays and draft a refusal
    of next month''s invitation. They also propose leaving the stand outside overnight; the owner has
    not replied. Classify the future invitation, current return and proposed new method. Draft a responsible
    ending without forcing approval or neglecting the stand.


    ### Check 2 — No opportunity is not follow-through


    A person defines a safe low-stakes boundary and privately rehearses it. During the ten-day practice
    no relevant situation occurs. They answer both reading checks correctly and want to mark “direct statement”
    and “follow-through within seven days” observed. Are those claims supported? What honest next state
    is available, and must they create a disagreement or extend dates retrospectively to complete the
    practice?'
  check_id: practice-answers
  attempt_mode: practice
checks:
- id: practice-answers
  title: Compare your responses
  body: '### Default and mini-cases


    A supports direct statement, proportionate departure, completion of the six-pack promise and key receipt.
    The organizer''s disappointment does not require further agreement to the legitimate limit. B supports
    the statement and departure with a returned key, but only five of six promised packs. The missing
    supply is an external change, not evidence of a completed result. Retain the incomplete promise and
    proposed repair; another person''s acceptance and actual repair remain unestablished. The extra display
    remains optional.


    C is not a successful boundary: withholding the key to force cancellation is coercive. New retaliation
    risk stops the practice; appropriate trusted or qualified support must address safe resolution. Do
    not prescribe another confrontation or fabricate key receipt. D is preparation only, with no direct
    statement or follow-through. Unknown key return remains unknown.


    For the obsolete project, cancel the ten-ticket goal because the game was cancelled; preserve three
    drafts as drafts and return the borrowed template under the existing Saturday-noon arrangement. The
    paper route can only record a planned return unless an event is supplied. Do not award completion
    of ten tickets.


    For the exchange, end future optional meetings clearly while retaining the Saturday 11:00 puzzle return.
    Approval of the relationship ending is not required by these low-stakes facts. A new return method
    would need agreement; the old return remains the duty until addressed. No relationship-health or live
    closure result is established by the draft.


    ### Check 1


    The future invitation is optional and can be declined without approval. The current stand return remains
    an existing promise. The outdoor drop-off is a proposed revision, unaccepted and not the agreed staffed
    route. A suitable message preserves Saturday-noon return and says future displays are declined; if
    that return becomes infeasible, communicate risk early and seek an agreed safe alternative. Leaving
    the stand outside or ignoring its return would not be responsible closure. The refusal should not
    demand that the owner become pleased or cancel the display.


    ### Check 2


    The evidence supports defining and rehearsing, plus reading comprehension. It supports neither a direct
    communicated statement nor actual proportionate follow-through. Preserve no-opportunity/inconclusive
    status under the existing practice and use the appropriate defer/stop/review route without inventing
    a completed action. Do not manufacture a conflict, backdate an event or revise the original ten-day/seven-day
    history. Reading checks are not replacement application evidence, action units or new completion rules.'
  criteria:
  - Compare each saved response with its matching explanation; keep revisions separate from your initial
    attempt.
