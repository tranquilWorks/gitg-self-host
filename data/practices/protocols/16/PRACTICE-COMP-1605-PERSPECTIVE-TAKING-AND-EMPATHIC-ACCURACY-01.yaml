      - [Correction to Huang et al. (2017), It does not hurt to ask (2025)](https://pubmed.ncbi.nlm.nih.gov/40111841/)

      - [Kluger and Malloy (2019), Question asking as a dyadic behavior](https://pubmed.ncbi.nlm.nih.gov/31714108/)

      - [Eyal, Steffel and Epley (2018), Perspective mistaking](https://www.nicholasepley.com/publications)

      - [GSA Digital.gov — Write for the reader](https://digital.gov/guides/plain-language/principles/write-for-reader)

      - [W3C WAI — Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [MIT OpenCourseWare — Giving and Receiving Feedback Activity, Christine Kelly course (2008)](https://ocw.mit.edu/courses/15-277-special-seminar-in-communications-leadership-and-personal-effectiveness-coaching-fall-2008/37362bb8a9db0e92731e53a1a2099373_guide_02.pdf)

      - [Aristotle — Rhetoric, Book I, W. Rhys Roberts translation](https://classics.mit.edu/Aristotle/rhetoric.1.i.html)

      - [Dahlstrom (2014), Using narratives and storytelling to communicate science with nonexpert audiences](https://pubmed.ncbi.nlm.nih.gov/25225368/)

      - [MIT NSE Communication Lab — Delivery and Q&A](https://mitcommlab.mit.edu/nse/commkit/delivery-and-qa/)

      - [Harvard HMS/HSDM/HSPH Ombuds — Seven Elements of Effective Negotiations, Jerome Slavik (2008)](https://hms.harvard.edu/sites/default/files/Departments/Ombuds%20Office/files/SEVEN%20ELEMENTS%20OF%20EFFECTIVE%20NEGOTIATIONS.pdf)

      - [Harvard PON — BATNA Analysis Can Help You Avoid the Agreement Trap (2025)](https://www.pon.harvard.edu/daily/batna/too-eager-to-close-nb/)

      - [Acas — Challenging conversations and how to manage them (July 2014)](https://www.acas.org.uk/sites/default/files/2021-04/challenging-conversations-and-how-to-manage-them.pdf)

      - [Kant and Norman (2019), You Must Be Joking!](https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2019.01380/full)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Morgan''s fictional reply: “I''d like the museum, and the ticket price is okay. I''m waiting
      to hear whether I need to collect a parcel Saturday morning. I should know Friday at 18:00. I don''t
      want you to buy me a ticket now.”


      Update rather than retrofit. Preference for the museum and the stated parcel uncertainty are supported
      by the reply. A guessed dislike of museums or a price objection is contradicted. The parcel outcome,
      Saturday attendance and wider personality remain unknown.


      A fair account is: “Morgan wants the museum but cannot commit until the parcel timing is known Friday
      evening. They do not authorize a ticket purchase now.” Keep your finish-by-14:00 constraint visible.
      You might reserve only for yourself if suitable, choose the flexible park option together if actually
      agreed, or wait while accepting museum availability risk. Do not describe an option as jointly agreed
      before Morgan accepts it.


      Alternate reply: “I don''t want to explain; please make your own plan.” Respect the refusal and
      make your own arrangement. The reason for waiting remains unknown. Neither fictional reply counts
      as actual empathic accuracy with a real person.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Perspective taking can help you generate possibilities beyond your own preferred explanation.
      Empathic accuracy requires checking those possibilities against information from the person. This
      practice asks you to represent another view fairly, revise it when contradicted and keep disagreement
      visible. Use an ordinary outing or scheduling choice, with fifteen minutes to prepare and one welcome
      clarification. It is not a method for diagnosing motives, extracting private history or deciding
      whether harm was deserved.


      ### Fair representation is revisable


      Suppose you prefer a fixed plan and another person wants flexibility. “They don''t value my time”
      reduces a practical difference to a moral story. “They may not know their schedule yet” is a hypothesis
      that opens a question. It is still a guess. A warm tone, a detailed imagined biography or confidence
      that you are compassionate does not turn it into knowledge.


      Eyal, Steffel and Epley''s experiments distinguish imagining a perspective from obtaining new information
      through conversation [S05](https://www.nicholasepley.com/publications). The author-hosted abstract
      reports that imagined perspective taking did not consistently improve accuracy across their tasks,
      while direct conversation helped in a final experiment. This is a reason to check assumptions, not
      a claim that every report is complete or that one conversation makes you accurate in all relationships.


      Use three headings: observed, inferred and only the person can report. Then separate what they report
      from your interpretation of that report. If a person says they need a later start, you know the
      stated constraint. You may still not know the reason, whether it will change or what feeling accompanies
      it. People can be uncertain, change their minds or decline to explain. A useful representation can
      preserve those limits while identifying the practical choice.


      ### Worked example: a quieter café


      Dee suggests a quieter café after Arlo proposes a busy market. Arlo imagines Dee dislikes markets
      and might be anxious about crowds. Instead of presenting either as truth, Arlo asks, “What matters
      most about the quieter option for this visit?” Dee says, “I want to hear the conversation, and I
      have only forty minutes. I actually enjoy markets when we have longer.”


      Arlo''s revised account is: “For this meeting, Dee wants an easy conversation within forty minutes.
      A market isn''t ruled out generally, but it doesn''t serve this visit as well.” Arlo can still prefer
      the market and propose another day. Accuracy here involves keeping the time and conversation priorities,
      correcting the broad dislike inference and not adding an unreported diagnosis. The account remains
      an illustrative fictional one.


      ### Your case: decide now or later?


      You and Morgan are choosing a Saturday outing. You want to reserve the 10:00 museum entry by Thursday
      because there are limited places. Morgan writes, “Can we decide on Saturday morning?” The museum
      also offers untimed entry later in the day, but availability is not guaranteed. A free park walk
      requires no reservation. You can attend either option but need to finish by 14:00. Morgan''s schedule,
      preferences and reasons are unknown. You have not been authorized to buy a ticket for them.


      1. **Describe the difference without moralizing.** Put the exact request and known ticket conditions
      under observed. Put your guesses about spontaneity, cost, energy or other commitments under inferred.
      Under only-the-person-can-report, list which preference or constraint would help choose. Output:
      three short columns, with your own end time included as your constraint rather than Morgan''s motive.

      2. **Generate competing reasonable accounts.** Write at least two explanations under which Morgan
      is trying to meet a legitimate need, including one that differs from your own preference. For each,
      name information that would weaken it. Do not make “Morgan just doesn''t care” the default that
      all refusals supposedly confirm. Output: two tentative accounts and a genuinely open question.

      3. **Ask for the practical perspective with permission.** Rehearse a question about what matters
      in waiting and which option would be workable. Let Morgan decline or answer only at the level of
      logistics. Avoid “Isn''t this just your fear of commitment?” or questions designed to secure agreement
      with your preferred plan. Output: a clarification that could change your choice, including what
      you will do if no answer comes.

      4. **Open the [later packet](?resource=file-later-packet-md).** Compare Morgan''s supplied report
      with each hypothesis. Write a two-sentence representation that Morgan could correct, then name your
      remaining disagreement or need. Output: supported, contradicted and unknown claims plus a practical
      next step that does not purchase or commit on their behalf.


      ### Respect is compatible with a boundary


      A fair representation does not require giving up your own end time, accepting every proposal or
      explaining away harmful conduct. It requires stating the other position in terms consistent with
      their report before deciding what you can do. If the options cannot meet both people''s constraints,
      separate plans may be the honest outcome. You can acknowledge a reason without endorsing a demand.


      For support, use a short written exchange, an interpreter or a prepared “I thought / you said /
      I now understand” table. Ask only about the practical issue, not intimate background. If no partner
      is available, use this case and describe the result as hypothesis revision from supplied information.
      Delayed self-reflection cannot substitute for the other person''s report.


      For a harder attempt, Morgan gives a new constraint after your summary. Preserve the earlier and
      later reports with their timing; ask what governs the current decision rather than accusing them
      of inconsistency. A real contradiction can remain unresolved. Do not claim certainty about whether
      the change reflects forgetfulness, new information or concealment.


      For real transfer, choose one safe, welcome difference of view within a week. Offer your short representation
      and invite correction without demanding praise for your empathy. Keep the actual correction, the
      revised account and the decision separate. A person saying “close, but…” may provide stronger learning
      material than a vague agreeable response. Do not retain sensitive reasons when the practical constraint
      is sufficient.


      Use the [fresh checks](?attempt=practice-checks) to test whether you can leave an unknown unknown.
      Your aim is an account that another person can recognize and revise, not the feeling that you have
      entered their mind.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. You infer a friend dislikes long visits. They say, “I enjoy them, but the last bus is early
      tonight.” What changes in your representation, and what stays unknown?

      2. A person confirms your summary of their preference but rejects your proposed solution. Has empathic
      accuracy necessarily failed? Explain.

      3. Someone declines to explain why they prefer a written exchange. What practical response can respect
      that preference without inventing an explanation?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Replace the general dislike claim with the reported transport constraint for tonight and
      their stated enjoyment. Future transport, other occasions and private feelings remain unknown. Calling
      the explanation an excuse without evidence would protect your original guess from correction.

      2. No. A fair account of a preference does not guarantee that your solution meets all interests
      or that the person will agree. Ask what about the proposal is unworkable if welcome, preserve their
      refusal and revise the decision separately from the understood perspective.

      3. Use writing if workable, clarify the practical question and allow response time. No diagnosis,
      cultural explanation or personal history is needed. If the format cannot serve the task, state that
      concrete limitation and seek an acceptable alternative rather than demanding disclosure.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
