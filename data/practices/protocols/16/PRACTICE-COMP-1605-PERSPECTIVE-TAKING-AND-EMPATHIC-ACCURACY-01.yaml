meaning_and_fit:
  purpose: Represent another person’s perspective fairly while keeping your inferences provisional and
    allowing their account to correct yours.
  why_recommended: Represent another person’s perspective fairly while keeping your inferences provisional
    and allowing their account to correct yours.
  claims:
  - statement: Represent another person’s perspective fairly while keeping your inferences provisional
      and allowing their account to correct yours.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Perspective taking and empathic accuracy practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Perspective taking and empathic accuracy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use writing, more time or a neutral facilitator for a safe low-stakes disagreement.
    Do not apply this exercise to assess dangerous intent or override evidence of harm; those situations
    require appropriate safety and professional support.
  opportunity_considerations: 'Default disagreement: one person wants to plan an outing in advance and
    another prefers to decide later. Use three headings: what I observed, what I think may matter to them
    and what only they can tell me. The other person may choose not to explain or may use a fictional
    role.'
  prerequisites:
  - 'Default disagreement: one person wants to plan an outing in advance and another prefers to decide
    later. Use three headings: what I observed, what I think may matter to them and what only they can
    tell me. The other person may choose not to explain or may use a fictional role.'
  dependencies: []
  safe_alternatives:
  - Use writing, more time or a neutral facilitator for a safe low-stakes disagreement. Do not apply this
    exercise to assess dangerous intent or override evidence of harm; those situations require appropriate
    safety and professional support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Perspective taking and empathic accuracy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Perspective taking and empathic
    accuracy as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default disagreement: one person wants to plan an outing in advance and another prefers to decide
    later. Use three headings: what I observed, what I think may matter to them and what only they can
    tell me. The other person may choose not to explain or may use a fictional role. Goal: Represent another
    person’s perspective fairly while keeping your inferences provisional and allowing their account to
    correct yours. Scope: Use a willing ordinary disagreement, not trauma exploration, mind-reading, adjudication
    or an attempt to make someone justify private motives. Time and effort: Ten minutes for a private
    hypothesis, a ten-minute willing conversation and a five-minute comparison. Adaptation: Use writing,
    more time or a neutral facilitator for a safe low-stakes disagreement. Do not apply this exercise
    to assess dangerous intent or override evidence of harm; those situations require appropriate safety
    and professional support. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, more time or a neutral facilitator for a safe low-stakes disagreement.
    Do not apply this exercise to assess dangerous intent or override evidence of harm; those situations
    require appropriate safety and professional support.
  expected_burden: Ten minutes for a private hypothesis, a ten-minute willing conversation and a five-minute
    comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Perspective taking and empathic accuracy protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Perspective taking and empathic accuracy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    more time or a neutral facilitator for a safe low-stakes disagreement. Do not apply this exercise
    to assess dangerous intent or override evidence of harm; those situations require appropriate safety
    and professional support.
  actions:
  - stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01-A1
    sequence: 1
    title: Form more than one plausible account of the other viewpoint
    instructions: 'Write the observable disagreement and at least two possible priorities behind the other
      preference. Deciding later might preserve flexibility, accommodate uncertain energy or avoid committing
      before costs are known; it need not mean indifference. Include a reasoned account that you could
      respect even while choosing differently. Identify which parts are guesses and what information would
      make you revise them.


      Observation checks: The observable disagreement is separated from interpretation; At least two plausible
      priorities are considered; One account is represented in terms the other person could recognize;
      Guesses and revision conditions are explicit. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01
      action_stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01-A1
      competency_stable_id: '16.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1605_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1605_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_observable_disagreement_is_separated_from_interpretation
        - at_least_two_plausible_priorities_are_considered
        - one_account_is_represented_in_terms_the_other_person_could_recognize
        - guesses_and_revision_conditions_are_explicit
      - measurement_id: c1605_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1605_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01-A2
    sequence: 2
    title: Ask about the relevant concern without demanding a motive
    instructions: 'With permission, ask what matters most about their preferred timing and what makes
      the alternative difficult. Reflect their answer in ordinary language and invite correction. Do not
      ask leading questions that confirm your favorite explanation or demand access to private history.
      When they decline, accept that limit and keep the perspective uncertain; refusal is not evidence
      that the least charitable explanation was correct.


      Observation checks: Questions address the practical concern without presuming the answer; The person
      can correct the reflected account; Private history and disclosure remain optional; A refusal leaves
      uncertainty rather than confirming a negative story. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01
      action_stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01-A2
      competency_stable_id: '16.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1605_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1605_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - questions_address_the_practical_concern_without_presuming_the_answer
        - the_person_can_correct_the_reflected_account
        - private_history_and_disclosure_remain_optional
        - a_refusal_leaves_uncertainty_rather_than_confirming_a_negative_story
      - measurement_id: c1605_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1605_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01-A3
    sequence: 3
    title: Revise your representation before choosing a response
    instructions: 'Compare the reported concern with your earlier possibilities. Mark each as supported,
      contradicted or still unknown, then write a revised two-sentence account of their position and one
      remaining point of disagreement. Choose a response that acknowledges the verified concern, such
      as a refundable plan or a later decision deadline, without pretending the conflict has vanished.
      A fictional role-play tests perspective construction, not accuracy about a real person.


      Observation checks: The original hypotheses are compared with actual reported information; Supported
      contradicted and unknown elements remain distinct; The revised account preserves a real disagreement
      when one remains; The next response addresses the verified concern rather than the initial guess.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Which assumption did the person correct, and how did that correction change the response
      without requiring you to agree with everything?


      Examples: Supportive: The participant learned that uncertain transport, not lack of interest, drove
      the delay and proposed a decision point that respected both constraints.


      Mixed: The conversation clarified one practical concern but left the person’s broader preference
      unknown, so the account remained limited.


      Contradictory: The participant insisted that they knew the person’s true motive better than the
      person did or used questions to force disclosure.


      Inconclusive: A sympathetic story was written but never checked against the person’s report.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01
      action_stable_id: PRACTICE-COMP-1605-PERSPECTIVE-TAKING-AND-EMPATHIC-ACCURACY-01-A3
      competency_stable_id: '16.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1605_a3_primary
      transfer_disposition: context_bound
      measurements:
