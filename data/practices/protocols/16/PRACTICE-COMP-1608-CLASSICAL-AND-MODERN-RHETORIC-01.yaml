  purpose: Use credibility, feeling, reasons, framing and narrative deliberately without concealing material
    costs, uncertainty or alternatives.
  why_recommended: Use credibility, feeling, reasons, framing and narrative deliberately without concealing
    material costs, uncertainty or alternatives.
  claims:
  - statement: Use credibility, feeling, reasons, framing and narrative deliberately without concealing
      material costs, uncertainty or alternatives.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Classical and modern rhetoric practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Classical and modern rhetoric as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a written paragraph, audio or accessible presentation. Analyze a public
    low-stakes message rather than manipulating a real audience. Political, commercial or professional
    communications may carry additional rules; this exercise does not determine compliance.
  opportunity_considerations: 'Use this fictional appeal: Everyone who cares about the neighborhood must
    support our garden; imagine children learning outside, and remember that three volunteers already
    offered help. The actual proposal is one trial planting day on an approved site, with a small fixed
    budget and uncertain future maintenance.'
