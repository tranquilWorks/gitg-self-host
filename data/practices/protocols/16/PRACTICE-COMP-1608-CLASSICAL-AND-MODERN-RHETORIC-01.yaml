      - [W3C WAI — Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [MIT OpenCourseWare — Giving and Receiving Feedback Activity, Christine Kelly course (2008)](https://ocw.mit.edu/courses/15-277-special-seminar-in-communications-leadership-and-personal-effectiveness-coaching-fall-2008/37362bb8a9db0e92731e53a1a2099373_guide_02.pdf)

      - [Aristotle — Rhetoric, Book I, W. Rhys Roberts translation](https://classics.mit.edu/Aristotle/rhetoric.1.i.html)

      - [Dahlstrom (2014), Using narratives and storytelling to communicate science with nonexpert audiences](https://pubmed.ncbi.nlm.nih.gov/25225368/)

      - [MIT NSE Communication Lab — Delivery and Q&A](https://mitcommlab.mit.edu/nse/commkit/delivery-and-qa/)

      - [Harvard HMS/HSDM/HSPH Ombuds — Seven Elements of Effective Negotiations, Jerome Slavik (2008)](https://hms.harvard.edu/sites/default/files/Departments/Ombuds%20Office/files/SEVEN%20ELEMENTS%20OF%20EFFECTIVE%20NEGOTIATIONS.pdf)

      - [Harvard PON — BATNA Analysis Can Help You Avoid the Agreement Trap (2025)](https://www.pon.harvard.edu/daily/batna/too-eager-to-close-nb/)

      - [Acas — Challenging conversations and how to manage them (July 2014)](https://www.acas.org.uk/sites/default/files/2021-04/challenging-conversations-and-how-to-manage-them.pdf)

      - [Kant and Norman (2019), You Must Be Joking!](https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2019.01380/full)'
  - id: file-later-packet-md
    title: Later packet
    body: 'A fictional reader says, “Great—three people have committed to looking after it, and the budget
      leaves money for extra watering.” Neither inference is supported. The three offers cover the morning
      only. Materials plus cleanup cost 48 + 12 = 60 tokens, leaving zero reserve. Water access and ongoing
      maintenance are unresolved.


      Revise the proposal where those inferences arose. Say that proceeding requires a workable maintenance
      decision, or narrow the present request to discussing the plan. Do not repair the pitch by silently
      dropping cleanup from the budget or inventing another donation. A favorable reaction to a misleading
      message is a reason to repair it.


      Another reader dislikes the idea even after accurately identifying the limited trial and open conditions.
      Their disagreement is legitimate. You can ask whether they wish to explain a practical concern,
      but no further persuasion is required. Record comprehension separately from support. The supplied
      readers are fictional and establish no real audience acceptance.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Rhetoric concerns how a message gains attention, credibility and assent. Ethical skill involves
      recognizing those mechanisms and making a case without hiding material truth. This practice analyzes
      an appeal and builds a short proposal that an audience can question or decline. Allow twenty minutes
      for analysis, a one-minute draft and a short willing reader check. The case is a fictional community
      activity, not a targeted political campaign or a plan to exploit someone''s vulnerability.


      ### Distinguish persuasive force from grounds for belief


      In the classical account, ethos concerns the speaker''s presented character or credibility, pathos
      the audience''s emotions and logos the argument''s reasoning [S09](https://classics.mit.edu/Aristotle/rhetoric.1.i.html).
      These are analytic categories, not three mandatory tricks. A speaker can be sincere and mistaken;
      a moving example can be true but unrepresentative; a numerical claim can be precise and irrelevant.
      Identify what each device is doing before deciding whether the conclusion follows.


      Framing makes some features more prominent: “a modest trial” emphasizes reversibility, while “our
      only chance” emphasizes loss and urgency. A narrative can make a consequence concrete. Repetition
      can help an audience remember a decision, but repeating a claim adds no independent support. A visual,
      spoken talk and short message permit different levels of detail and follow-up. Audience psychology
      includes attention, prior commitments and social pressure; understanding these factors should help
      you make reasons usable, not conceal weaknesses.


      Dahlstrom''s science-communication discussion links narrative''s appeal with ethical questions about
      its persuasive use [S10](https://pubmed.ncbi.nlm.nih.gov/25225368/). Here the teaching application
      is an original claim-and-burden audit. Neither a story nor an audience''s favorable reaction establishes
      that the proposed activity will deliver its promised benefits. Material uncertainty needs to remain
      visible in the message itself, not hidden in a source list no recipient will read.


      ### Worked example: the tool shelf


      A speaker says, “Everyone in a caring neighborhood wants a borrowing shelf. Imagine children learning
      to build; twelve people liked our post, so the shelf will pay for itself.” The first sentence makes
      disagreement a test of belonging. The image supplies an appealing possible benefit. Twelve reactions
      indicate interest in a post, not funding, demand or repayment. The financial conclusion has no supplied
      evidence.


      A more defensible pitch would request a small, separately approved trial, identify what is known
      about space and costs, and ask who will maintain it. A listener can support the goal yet prefer
      another option. Removing a false guarantee may make the pitch less forceful while making the decision
      better informed. Do not replace one fabricated number with a more plausible fabricated number.


      ### Your proposal: one planting morning


      Original fictional appeal: “Everyone who cares about this neighborhood must support the garden.
      Picture children learning outside instead of wasting another season. Three volunteers are ready,
      so lasting success is assured. Say yes now.”


      Approved facts: the site owner permits one supervised planting morning on a small marked plot. A
      one-time supplies budget of 60 tokens is available and cannot be increased. Materials cost 48 tokens
      and cleanup supplies cost 12. Three adults have offered to attend that morning; none has agreed
      to ongoing maintenance. Future water access is unconfirmed. No evidence of learning outcomes or
      neighborhood-wide support has been collected. Alternatives are to postpone, hold a discussion without
      planting or decline. The actual decision requested is whether to proceed with this bounded morning,
      subject to a workable maintenance decision, not whether to approve a permanent garden.


      1. **Annotate the appeal.** Identify ethos, pathos, logos, framing, narrative imagery, repetition
      if you add any, medium and likely audience assumptions. Mark where the language substitutes moral
      pressure or imagined benefits for evidence. If a mechanism is absent, say so; do not force every
      label onto every sentence. Output: a device/claim/support table.

      2. **Audit material truth.** Separate confirmed permission, available money, attendance offers and
      unknown maintenance. Calculate the supplies total and remaining reserve. State which conclusions
      are unsupported: permanence, guaranteed education, complete local support and future volunteer commitment.
      Output: a claim ledger with a decision-relevant limit beside each important fact.

      3. **Write a one-minute proposal.** Use a reason to care and a concrete image if helpful, then state
      the bounded decision, costs, unresolved condition and alternatives. Represent the three offers as
      attendance offers only. If you repeat a key phrase, repeat the trial''s limit as well as its attraction.
      Choose a medium that leaves the facts and response route available. Output: a complete proposal
      with a real decline path.

      4. **Check what the audience thinks is justified.** Ask a willing reader to identify the decision,
      strongest reason, emotional appeal, main uncertainty and option to refuse before seeing your ledger.
      Then open the [later packet](?resource=file-later-packet-md). Output: mistaken inference, revised
      claim and unresolved decision status. Being persuaded is not the same as understanding the grounds.


      ### Increase clarity without manufacturing assent


      For support, begin with a four-line proposal: purpose, known facts, unresolved condition and choice.
      Use plain language, accessible text and enough response time. Do not rely on an attractive image
      to carry a material condition. A reader should not need to share the speaker''s cultural references
      to identify what is being requested.


      For a harder attempt, a supporter asks you to remove the maintenance uncertainty because “it will
      scare people off.” Retain it. You can explain how it could be resolved or narrow the proposal to
      planning only, but cannot imply a solution exists. Distinguish a legitimate deadline from invented
      urgency. Publicly attributing support to silent people or a respected organization without authorization
      remains misleading even if it would help the proposal.


      For real transfer, choose a low-stakes proposal you are authorized to make. Verify claims with their
      actual sources, get permission for any personal story, name burdens and invite objections. Record
      whether readers understood the proposition and its limits; do not claim ethical quality solely because
      they agreed. The [fresh checks](?attempt=practice-checks) ask whether you can improve an argument
      while retaining facts that make it less convenient to sell.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A popular speaker repeats a claim three times and displays many positive reactions. What
      does that establish about the evidence for the claim?

      2. A trial has a 90-token budget, 65-token materials and 30-token required cleanup. The pitch says
      it is fully funded. Repair the factual claim and the decision request.

      3. “If you care about newcomers, you''ll endorse my proposal tonight.” Identify the pressure and
      rewrite the invitation to decide without erasing the underlying value.'
    check_id: practice-answers
    attempt_mode: practice
