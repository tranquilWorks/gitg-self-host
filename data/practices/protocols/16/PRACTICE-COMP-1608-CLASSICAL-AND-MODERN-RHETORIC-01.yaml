  - id: practice-answers
    title: Compare your responses
    body: '1. It establishes repetition and visible reactions, not independent corroboration or correctness.
      Credibility and popularity can affect persuasion; inspect the evidence and reasoning that actually
      bear on the claim. Reactions might also come from an unrepresentative audience.

      2. Required costs total 95 tokens, so there is a 5-token shortfall. State it, then request discussion
      of a legitimate funding or scope change, postponement or refusal. Do not call it funded by hiding
      required cleanup or assuming an unoffered contribution.

      3. It ties moral belonging to one proposal and uses an unexplained immediate deadline. For example:
      “The goal is to make participation easier for newcomers. Here is the proposal, its costs and alternatives;
      please consider whether it serves that goal, and declining or suggesting another approach is welcome.”
      A genuine deadline can be stated with its reason.'
