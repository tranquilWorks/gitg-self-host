intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use this fictional appeal: Everyone who cares about the neighborhood must support our garden;
    imagine children learning outside, and remember that three volunteers already offered help. The actual
    proposal is one trial planting day on an approved site, with a small fixed budget and uncertain future
    maintenance. Goal: Use credibility, feeling, reasons, framing and narrative deliberately without concealing
    material costs, uncertainty or alternatives. Scope: This is an analysis and writing exercise for a
    harmless proposal. It does not authorize manipulation, fabricated evidence, targeted exploitation
    or claims that rhetorical effectiveness establishes truth. Time and effort: Twenty minutes to analyze
    a sample and twenty minutes to write and test a short proposal. Adaptation: Use a written paragraph,
    audio or accessible presentation. Analyze a public low-stakes message rather than manipulating a real
    audience. Political, commercial or professional communications may carry additional rules; this exercise
    does not determine compliance. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written paragraph, audio or accessible presentation. Analyze a public low-stakes
    message rather than manipulating a real audience. Political, commercial or professional communications
    may carry additional rules; this exercise does not determine compliance.
  expected_burden: Twenty minutes to analyze a sample and twenty minutes to write and test a short proposal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Classical and modern rhetoric protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Classical and modern rhetoric action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written
    paragraph, audio or accessible presentation. Analyze a public low-stakes message rather than manipulating
    a real audience. Political, commercial or professional communications may carry additional rules;
    this exercise does not determine compliance.
  actions:
  - stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01-A1
    sequence: 1
    title: Identify what each part of the appeal asks the audience to trust
    instructions: 'Mark the credibility appeal, emotional image and stated reason. Identify the frame
      created by everyone who cares, the implied story, any repetition and the effect of the chosen medium.
      Separate the true fictional facts from the unsupported suggestion that opponents do not care. Ask
      what the audience would still need to know about site permission, cost, maintenance and alternatives
      before making a responsible decision.


      Observation checks: Credibility emotion and reasoning are identified separately; Framing narrative
      repetition and medium are examined; An unsupported moral pressure claim is distinguished from the
      stated facts; Material missing information is named. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01
      action_stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01-A1
      competency_stable_id: '16.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1608_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1608_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - credibility_emotion_and_reasoning_are_identified_separately
        - framing_narrative_repetition_and_medium_are_examined
        - an_unsupported_moral_pressure_claim_is_distinguished_from_the_stated_facts
        - material_missing_information_is_named
      - measurement_id: c1608_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1608_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01-A2
    sequence: 2
    title: Write an honest one-minute version for a defined audience
    instructions: 'Address willing residents deciding whether to try the planting day. State the proposal,
      the limited evidence of volunteer interest, a concrete picture of the possible benefit and the unresolved
      maintenance burden. Include the option to decline or choose a smaller trial. Use a memorable repeated
      phrase only if it summarizes the actual proposal, not if it turns uncertainty into certainty or
      paints disagreement as disloyalty.


      Observation checks: The audience and decision are explicit; Credibility feeling and reasons support
      the same bounded proposal; Costs uncertainty and alternatives remain visible; Repetition does not
      replace evidence or stigmatize disagreement. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01
      action_stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01-A2
      competency_stable_id: '16.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
