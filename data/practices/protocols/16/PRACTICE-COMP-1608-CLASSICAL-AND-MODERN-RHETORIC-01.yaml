  - stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01-A3
    sequence: 3
    title: Ask a reader to separate persuasion from grounds for belief
    instructions: 'Have a willing reader identify the requested decision, strongest reason, emotional
      appeal and largest unresolved issue. Ask which sentence felt persuasive but was not evidence. Revise
      any line that caused them to infer a guarantee, false consensus or hidden obligation. Preserve a
      copy of the original and revised message so you can explain the rhetorical choice and the truth
      boundary it needed.


      Observation checks: The reader distinguishes the requested decision from its appeals; A persuasive
      sentence is checked for unsupported inference; A misleading implication is removed or qualified;
      The revision can be explained without claiming persuasion proves truth. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which rhetorical device made the proposal easier to understand, and which device risked
      making the audience believe more than the evidence supported?


      Examples: Supportive: The writer retained a vivid example but replaced the loyalty test with an
      explicit trial proposal, costs and an honest maintenance uncertainty.


      Mixed: The revised message was clear, but the reader still inferred that volunteer interest guaranteed
      long-term staffing, prompting another qualification.


      Contradictory: The writer fabricated endorsements, hid a material cost or used shame to make refusal
      socially unsafe.


      Inconclusive: Rhetorical terms were labeled without producing or checking a truthful persuasive
      message.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01
      action_stable_id: PRACTICE-COMP-1608-CLASSICAL-AND-MODERN-RHETORIC-01-A3
