  - id: file-later-packet-md
    title: Later packet
    body: 'The fictional speaker corrects one interpretation: “It isn’t that I hate planning. A timed
      exhibition ticket is fine. I don''t want every hour filled. I need to be home by five, and I want
      us to choose where to sit afterward on the day.”


      A revised reflection should retain: wants the exhibition together; accepts a timed ticket; wants
      an uncommitted choice afterward; needs to be home by five. “Out until five” was ambiguous if travel
      home also takes time. Ask about the return journey before proposing a time that uses the whole window
      away from home.


      The fictional speaker then says, “Yes, that''s what I mean. I''d like one suggestion, not a whole
      schedule.” A response with five competing itineraries would ignore the newly expressed request even
      if the summary was accurate. Offer one scoped suggestion only after the confirmation step in this
      simulated exchange.


      Alternative outcomes matter: if the speaker declines feedback, confirmation is unknown; if the listener
      says “you just dislike planning,” the correction was ignored; if the speaker confirms but disagrees
      with a suggestion, understanding and agreement differ. If no real partner took part, no real speaker
      has confirmed anything.


      Your actual artifact is the reflection and revision you wrote or rehearsed. The supplied “yes” is
      a learning example, never observer evidence about your real listening.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let the speaker correct your understanding before you respond


      Start with the fictional conversation below, or invite a willing person to discuss a low-stakes
      shared plan for ten to fifteen minutes. You will listen for meaning, offer a tentative reflection,
      ask a genuine clarifying question and revise before giving your view. The speaker may decline, stop
      or withhold feedback. There is no requirement for eye contact, a particular posture, emotional disclosure
      or agreement with you.


      ### Attention is available room for the other person''s meaning


      Full attention does not mean displaying one culturally preferred listening style. It means reducing
      avoidable competing tasks and following the communication as well as your access needs allow. Keep
      captions, interpreters, notes or communication devices that help. If you miss a point, say so and
      ask for repetition rather than nodding to appear attentive. A shorter conversation with a clear
      pause can be more usable than one you cannot follow.


      Preparing a rebuttal can crowd out what is actually being said. Notice the moment you start building
      your answer. You can mentally park one word about your response, then return to the speaker''s account.
      You are not promising never to disagree; you are delaying your response long enough to check that
      it addresses their real position. Listening is neither surrender nor an obligation to remain in
      an unsafe or abusive exchange.


      Reflection distinguishes content, importance and constraints. Content is what happened or what someone
      proposes. Importance is why it matters to them, stated tentatively if inferred. A constraint is
      a limit that a response should respect. Repeating words without connecting these elements may miss
      the point; adding a diagnosis or motive can replace the person''s account with yours. “You want
      some quiet time before the visit because the week felt full; is that close?” is checkable. “You
      always avoid people” imports a general judgment.


      A clarifying question should change your understanding. “Which part feels most important to keep?”
      invites new information. “Don''t you think my plan is better?” prepares an argument in question
      form. One useful question followed by attention can be better than a rapid interview. Reflection
      and questions are tools for understanding, not techniques to extract agreement.


      Research by Weger and colleagues compared active-listening responses, advice and acknowledgments
      in initial interactions. Participants receiving active-listening responses felt more understood;
      satisfaction did not distinguish active listening from advice in that study. This supports studying
      listening while leaving broad relationship or therapeutic claims unproven. See S19 in [SOURCES](?resource=sources).
      The exercise''s particular prompts are original teaching materials, not a validated instrument.


      ### Worked example with a correction


      Morgan says, “I want to see everyone, but I don''t want the whole afternoon scheduled.” Taylor first
      reflects, “You don''t want to go.” Morgan corrects: “I do want to go; I want an hour without commitments
      beforehand.” Taylor revises: “The visit matters to you, and you want a free hour first. Have I got
      that right?” Only after Morgan confirms does Taylor ask whether a suggestion would be welcome. The
      correction is evidence of learning, not a reason to defend the first paraphrase.


      ### Complete fictional practice conversation


      Speaker card: “I’d like us to visit the exhibition together on Saturday. I don’t want to book a
      whole-day outing. Last time every hour was decided, and I came home feeling like I had rushed through
      someone else’s plan. I can be out between two and five. I want one part of the afternoon that we
      choose on the day.”


      Listener''s private first impulse: “But buying timed tickets now would be more efficient. I should
      explain why a full itinerary is sensible.” Treat this as a temptation to notice, not the correct
      answer.


      Before opening any later response, note three anchors: the proposed activity, why the speaker wants
      a different kind of plan, and the stated time/choice constraints. Do not infer that the speaker
      dislikes you, dislikes all planning or has a particular psychological trait. The fictional card
      contains enough information to begin without requiring a personal disclosure.


      ### Listen, clarify and revise


      1. If using a partner, agree the topic, time and right to stop. Choose a real low-stakes preference
      only if they freely want to share; otherwise use the fictional speaker card. Ask how they prefer
      to communicate and what would make listening easier. Do not record audio or private details.

      2. Read or hear the whole account. Notice your response impulse and park it briefly. Write only
      the three anchors, using the speaker''s terms where possible. If this is a real conversation, notes
      should be minimal and acceptable to the speaker.

      3. Offer a tentative reflection that preserves the desire to visit and the limits on scheduling.
      Label an inferred feeling as tentative. Avoid appending “but” and your argument. Ask whether your
      understanding is close, leaving room for correction or no feedback.

      4. Ask one neutral question whose answer would affect a plan: for example, whether the unscheduled
      portion must be before the exhibition or can come afterward. Do not supply an answer on behalf of
      a real speaker. In the fictional route, save your first reflection and question before opening the
      [later packet](?resource=file-later-packet-md).

      5. Revise the reflection using the actual reply or supplied fictional correction. If a speaker declines
      confirmation, record that understanding was not confirmed and do not press for a reassuring yes.
      If the topic is finished, respect that boundary.

      6. Once understanding is confirmed in a real exchange, ask whether the person wants your view, possible
      ideas or simply acknowledgment. Respond to that request within your own boundaries. The fictional
      packet can illustrate this sequence but cannot produce an actual speaker''s agreement.


      Your compact record is the initial reflection, the clarification/correction, the revised reflection
      and feedback status. Keep only what is needed and agreed; do not save sensitive narratives to prove
      listening. A real speaker''s “yes, that is what I meant” supports this exchange, not permanent listening
      mastery or agreement with the plan.


      ### Use disagreement and uncertainty well


      If the speaker confirms the summary but rejects your proposal, understanding may have succeeded
      while agreement did not. If they politely say “fine” and change the subject, the meaning of that
      response can remain uncertain. Do not treat silence, a smile or lack of challenge as reliable confirmation,
      especially where power differences make disagreement costly. Conversely, a correction can be a useful
      sign that the process allowed the speaker''s meaning to become clearer.


      For a lighter route, reflect the stated activity and one constraint before adding inferred meaning.
      Use written exchange, captions, pauses or a helper/interpreter with everyone''s agreement, preserving
      their contribution. A harder version contains two competing wishes; hold both in the summary rather
      than resolving the tension for the speaker.


      For real transfer, invite one ordinary planning conversation, obtain permission to try a brief summary,
      and let the person correct it. If no one is available, complete the fictional work and keep real
      speaker confirmation pending. Do not practice on a distressed person as an assessment exercise or
      remain in coercive conversation to earn completion. Finish the [fresh checks](?attempt=practice-checks)
      before the [corrective key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A colleague says, “I want to join the project, but I cannot work evenings.” Your summary
      is “You aren''t interested.” Correct it and give one useful clarifying question.

      2. A speaker confirms your understanding and then disagrees with your proposal. Does that invalidate
      the listening result?

      3. A junior colleague smiles and says “fine” after you summarize. You did not explicitly invite
      correction, and they change the subject. What may you record?'
