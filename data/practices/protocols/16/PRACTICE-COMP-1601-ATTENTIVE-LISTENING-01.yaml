meaning_and_fit:
  purpose: Listen for the speaker’s actual meaning, clarify uncertainty and let them correct your summary
    before you respond with advice or disagreement.
  why_recommended: Listen for the speaker’s actual meaning, clarify uncertainty and let them correct your
    summary before you respond with advice or disagreement.
  claims:
  - statement: Listen for the speaker’s actual meaning, clarify uncertainty and let them correct your
      summary before you respond with advice or disagreement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Attentive listening practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Attentive listening as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use text, signing, speech-to-text, an interpreter or more processing time.
    A partner may decline the exercise or feedback without penalty. Choose a different context when power,
    conflict or privacy makes genuine correction unsafe.
  opportunity_considerations: Invite a willing person to discuss an ordinary choice such as how to spend
    a shared afternoon. Ask whether they are comfortable with you practicing a brief summary before responding.
    Put away optional distractions while preserving communication aids. They may choose a fictional preference
    instead of a personal concern.
  prerequisites:
  - Invite a willing person to discuss an ordinary choice such as how to spend a shared afternoon. Ask
    whether they are comfortable with you practicing a brief summary before responding. Put away optional
    distractions while preserving communication aids. They may choose a fictional preference instead of
    a personal concern.
  dependencies: []
  safe_alternatives:
  - Use text, signing, speech-to-text, an interpreter or more processing time. A partner may decline the
    exercise or feedback without penalty. Choose a different context when power, conflict or privacy makes
    genuine correction unsafe.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Attentive listening differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Attentive listening as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Invite a willing person to discuss an ordinary choice such as how to spend a shared afternoon.
    Ask whether they are comfortable with you practicing a brief summary before responding. Put away optional
    distractions while preserving communication aids. They may choose a fictional preference instead of
    a personal concern. Goal: Listen for the speaker’s actual meaning, clarify uncertainty and let them
    correct your summary before you respond with advice or disagreement. Scope: This is a willing low-stakes
    conversation, not counseling, interrogation or an obligation to disclose personal material. Agreement
    with the speaker is not required. Time and effort: Five minutes to prepare, a ten-minute conversation
    and a five-minute private review. Adaptation: Use text, signing, speech-to-text, an interpreter or
    more processing time. A partner may decline the exercise or feedback without penalty. Choose a different
    context when power, conflict or privacy makes genuine correction unsafe. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, signing, speech-to-text, an interpreter or more processing time. A partner
    may decline the exercise or feedback without penalty. Choose a different context when power, conflict
    or privacy makes genuine correction unsafe.
  expected_burden: Five minutes to prepare, a ten-minute conversation and a five-minute private review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Attentive listening protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Attentive listening action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, signing,
    speech-to-text, an interpreter or more processing time. A partner may decline the exercise or feedback
    without penalty. Choose a different context when power, conflict or privacy makes genuine correction
    unsafe.
  actions:
  - stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01-A1
    sequence: 1
    title: Hear the account without building a counterargument
    instructions: 'Let the person explain their preference and reasons without interrupting to solve the
      problem. Notice the urge to rehearse your reply and redirect attention to their words. Keep only
      three private anchors if needed: what they want, why it matters and what constraint they named.
      Do not require eye contact, a particular posture or uninterrupted speech as proof of attention;
      use the communication mode that works for both people.


      Observation checks: The speaker chooses a welcome low-stakes topic; Preference reason and constraint
      are heard as separate elements; Advice or rebuttal is withheld during the first account; Communication
      supports and natural pauses remain available. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01
      action_stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01-A1
      competency_stable_id: '16.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1601_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1601_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_speaker_chooses_a_welcome_low_stakes_topic
        - preference_reason_and_constraint_are_heard_as_separate_elements
        - advice_or_rebuttal_is_withheld_during_the_first_account
        - communication_supports_and_natural_pauses_remain_available
      - measurement_id: c1601_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1601_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01-A2
    sequence: 2
    title: Offer a tentative summary and one real clarification
    instructions: 'Say the meaning in your own words: You would prefer a quiet afternoon because the week
      was tiring, but you still want some time together; have I understood? Ask one neutral question about
      a genuine uncertainty rather than a disguised objection. Invite correction and replace the inaccurate
      part of your summary. Do not treat a polite yes or silence as proof of understanding when the person
      signals uncertainty or cannot freely disagree.


      Observation checks: The summary includes the speaker’s reason and constraint; A neutral question
      addresses a real uncertainty; Correction is invited and incorporated without defense; Silence or
      politeness is not automatically counted as confirmation. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01
      action_stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01-A2
      competency_stable_id: '16.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
