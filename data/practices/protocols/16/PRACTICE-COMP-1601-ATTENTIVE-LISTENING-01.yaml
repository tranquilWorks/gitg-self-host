  - id: practice-answers
    title: Compare your responses
    body: '1. Preserve both interest and the limit: “You want to contribute within daytime availability.”
      Ask, for example, “Which daytime hours could work?” Do not turn a constraint into disinterest or
      use “Why can''t you just do evenings?” as disguised persuasion.

      2. No. Confirmed understanding and agreement are different outcomes. Record the confirmation for
      this exchange, then engage respectfully with the disagreement without claiming the speaker accepted
      your plan.

      3. Feedback is ambiguous; understanding is not clearly confirmed. You may gently allow correction
      without pressure if the conversation remains open, or leave confirmation pending. A smile or lack
      of challenge, especially across a power difference, is not reliable proof of agreement or understanding.'
