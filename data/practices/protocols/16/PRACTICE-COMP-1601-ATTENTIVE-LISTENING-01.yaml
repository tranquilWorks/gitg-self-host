  - stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01-A3
    sequence: 3
    title: Respond only after the speaker has checked the meaning
    instructions: 'Ask whether they want your view, practical ideas or simply acknowledgment. Give the
      chosen response and, when relevant, state your own preference without erasing theirs. At the end,
      ask whether your summary captured what mattered and record only their broad confirmation, correction
      or declined feedback. A fictional role-play counts as listening rehearsal, not evidence of understanding
      this person’s real feelings.


      Observation checks: The response mode is checked rather than assumed; Your position is distinguished
      from the speaker’s position; The speaker’s actual feedback or refusal remains visible; Rehearsal
      and real relational understanding are distinguished. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which part of the speaker’s meaning changed after clarification, and did your eventual
      response address that corrected meaning?


      Examples: Supportive: The listener discovered that the issue was exhaustion rather than disinterest
      and changed the proposed activity while retaining their own wish for time together.


      Mixed: The summary was mostly accurate, but one leading question pushed the speaker toward agreement
      and needed a more neutral retry.


      Contradictory: The listener used the summary to trap the speaker into a concession or diagnose an
      emotion they had not reported.


      Inconclusive: The listener waited silently but never checked meaning with the speaker before giving
      advice.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01
      action_stable_id: PRACTICE-COMP-1601-ATTENTIVE-LISTENING-01-A3
