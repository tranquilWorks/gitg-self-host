  - stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01-A3
    sequence: 3
    title: Use the retelling to repair the story
    instructions: 'Ask a willing listener to retell what happened and the lesson in their own words, without
      supplying the answer first. Note whether they remembered the causal problem or only an amusing detail.
      Correct any factual distortion, shorten a distracting passage or strengthen the missing transition,
      then tell the revised section. If working alone, use a delayed self-retelling and label it as a
      weaker check than another person’s understanding.


      Observation checks: The listener retells before receiving the intended answer; Remembered details
      are compared with the essential causal point; A specific distortion or omission guides the revision;
      Self-retelling is distinguished from listener evidence. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What did the listener retain, and did the memorable part carry the intended meaning
      or distract from it?


      Examples: Supportive: The listener retold the conflicting-sign problem and the need to remove obsolete
      instructions, while recognizing the analogy’s limit.


      Mixed: The listener remembered the volunteer but not why the error recurred, so the causal link
      was made more explicit.


      Contradictory: A real person’s private mistake was exposed for humor or a fictional story was presented
      as evidence that an event occurred.


      Inconclusive: A polished story was written without any retelling or check of the essential message.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01
