meaning_and_fit:
  purpose: Use sequence, a concrete character, tension, an example and a resolution to make a point understandable
    without distorting the underlying facts.
  why_recommended: Use sequence, a concrete character, tension, an example and a resolution to make a
    point understandable without distorting the underlying facts.
  claims:
  - statement: Use sequence, a concrete character, tension, an example and a resolution to make a point
      understandable without distorting the underlying facts.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Storytelling and explanation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Storytelling and explanation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use pictures, text, signed storytelling or audio. A short factual sequence
    may be more suitable than a dramatic narrative in some contexts. Do not use trauma, confidential work
    or another person’s identity to make the story more compelling.
  opportunity_considerations: Use the fictional story of a volunteer who keeps arriving at the wrong room
    because an old sign was never removed. The intended point is that changing a plan includes retiring
    the old instructions, not merely adding new ones. No real person’s embarrassing incident is needed.
  prerequisites:
  - Use the fictional story of a volunteer who keeps arriving at the wrong room because an old sign was
    never removed. The intended point is that changing a plan includes retiring the old instructions,
    not merely adding new ones. No real person’s embarrassing incident is needed.
  dependencies: []
  safe_alternatives:
  - Use pictures, text, signed storytelling or audio. A short factual sequence may be more suitable than
    a dramatic narrative in some contexts. Do not use trauma, confidential work or another person’s identity
    to make the story more compelling.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Storytelling and explanation differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Storytelling and explanation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional story of a volunteer who keeps arriving at the wrong room because an old sign
    was never removed. The intended point is that changing a plan includes retiring the old instructions,
    not merely adding new ones. No real person’s embarrassing incident is needed. Goal: Use sequence,
    a concrete character, tension, an example and a resolution to make a point understandable without
    distorting the underlying facts. Scope: Use a fictional or permission-safe story. Memorability does
    not justify exposing someone’s private experience, inventing a real event or treating an analogy as
    proof. Time and effort: Fifteen minutes to draft, five minutes to tell and retell, and ten minutes
    to revise. Adaptation: Use pictures, text, signed storytelling or audio. A short factual sequence
    may be more suitable than a dramatic narrative in some contexts. Do not use trauma, confidential work
    or another person’s identity to make the story more compelling. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use pictures, text, signed storytelling or audio. A short factual sequence may
    be more suitable than a dramatic narrative in some contexts. Do not use trauma, confidential work
    or another person’s identity to make the story more compelling.
  expected_burden: Fifteen minutes to draft, five minutes to tell and retell, and ten minutes to revise.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Storytelling and explanation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Storytelling and explanation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use pictures,
    text, signed storytelling or audio. A short factual sequence may be more suitable than a dramatic
    narrative in some contexts. Do not use trauma, confidential work or another person’s identity to make
    the story more compelling.
  actions:
  - stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01-A1
    sequence: 1
    title: Build a causal sequence rather than a collection of details
    instructions: 'Write five short beats: the volunteer’s goal, the old sign they follow, the mismatch
      they encounter, the discovery that two instructions coexist and the correction that removes the
      obsolete sign. Give the character a reasonable aim and make the tension arise from the situation
      rather than incompetence. Include only details that help explain why the problem happened and what
      changed.


      Observation checks: The story has a goal obstacle discovery correction and result; Events are linked
      by a clear cause or decision; The character is treated fairly rather than used for ridicule; Decorative
      details do not hide the essential sequence. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01
      action_stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01-A1
      competency_stable_id: '16.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1610_a1_primary
      transfer_disposition: context_bound
      measurements:
