  - id: file-later-packet-md
    title: Later packet
    body: 'Fictional retelling: “Ivo forgot to read the new sign because volunteers don''t pay attention.
      Then the organizer explained the room.”


      Compare with the supplied facts. Ivo followed the sign at the entrance; the new sign was beside
      Room C, not at the place Ivo was deciding where to go. The repair removed the obsolete entrance
      direction and installed the correct one there. The retelling changes a conflicting-information mechanism
      into blame and omits the physical correction.


      Revise the transition that makes the two sign locations clear. Preserve Ivo''s reasonable goal and
      say what the organizer changed. A better retelling need not repeat the story word for word, but
      should retain old direction at decision point, conflicting new direction elsewhere and corrected
      entrance instruction.


      A second fictional retelling gets that mechanism right but concludes that all mistakes come from
      outdated signs. State the limit: this case explains one preventable source of error; other causes
      require their own evidence. These supplied retellings are practice material, not an actual listener''s
      response or proof of long-term retention.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'A story can make a sequence memorable while also distorting what a listener takes away. This
      practice builds a short fictional story around a causal point, uses one bounded analogy and checks
      what a listener actually retells. Allow fifteen minutes to draft, five minutes to tell and hear
      a retelling, and ten minutes to revise. You do not need a dramatic personal event, private confession
      or someone else''s embarrassing mistake.


      ### Give the character a reasonable goal


      A useful explanatory story connects actions and consequences. A character wants something, encounters
      an obstacle, discovers a relevant feature of the situation and changes an action or condition. The
      resolution should address that obstacle. Adding colorful detail can increase interest while drawing
      attention away from the causal point; a listener who remembers a funny hat but not the conflicting
      instructions has learned a different story.


      Treat the character fairly. If the person followed the only sign they saw, portraying them as foolish
      changes the explanation from an information problem to a defect in a person. You may write a fictional
      character, but disclose the fiction before the audience treats it as a report. A composite also
      needs an honest label; changing names does not make a real private event yours to tell.


      Dahlstrom discusses narrative''s appeal and the ethical questions raised by its persuasive force
      [S10](https://pubmed.ncbi.nlm.nih.gov/25225368/). This companion applies those concerns through
      original causal and retelling tasks. It does not claim that stories always outperform direct instructions
      or that a memorable case proves a general rule. A story can explain why something happened within
      its stated facts; evidence for how often it happens elsewhere is a separate matter.


      An analogy maps a useful relationship between two situations. “Two different maps at the entrance”
      can help explain conflicting directions. It does not mean every confusing interaction has two literal
      instructions, nor that removing one instruction always solves the problem. State the similarity
      and at least one point where the analogy stops. Otherwise the memorable comparison may silently
      import a false causal claim.


      ### Worked example: the duplicate checklist


      A volunteer packs event materials from a printed checklist. A new digital checklist adds name cards
      but the old printed copy remains on the packing table. The volunteer uses the old copy, so the name
      cards are absent. The organizer discovers both versions, removes the obsolete one and labels the
      current checklist with its date. At the next fictional packing attempt, the volunteer uses the current
      list and includes the cards.


      The point is not “paper is bad” or “volunteers forget details.” It is that updating a process can
      require retiring obsolete instructions at the point of use. A listener who concludes “use digital
      tools for everything” has overgeneralized. The resolution supports a narrower within-case explanation;
      it does not guarantee that removing an old checklist prevents every packing error.


      ### Your story facts: the wrong room


      This is an original fictional case. A volunteer named Ivo wants to help set out chairs for a workshop.
      An old sign at the main entrance directs helpers to Room A. The organizer has moved the workshop
      to Room C and posted a new sign beside Room C, but left the old entrance sign in place. Ivo follows
      the entrance sign and waits at Room A. A second helper does the same. They compare instructions
      with the organizer, who removes the old sign and places the correct direction at the entrance. A
      later helper follows that updated entrance sign to Room C. Nothing here establishes that Ivo ignored
      a notice or that all future navigation errors are solved.


      The intended lesson is: changing a plan includes retiring obsolete instructions where people still
      encounter them. Use sequence, character, tension, a concrete example and a resolution to carry that
      point. The tension can be the gap between trying to help and being sent to the wrong place; no villain
      or humiliation is needed.


      1. **Draft five connected beats.** Write the goal, followed instruction, mismatch, discovery and
      correction/result. For each transition, state why the next event happened rather than merely “and
      then.” Retain both signs and their locations, because the explanation depends on where the new information
      was available. Output: a short beat map with causal links.

      2. **Tell the story in about two minutes.** Label it fictional, keep Ivo''s reasonable goal visible
      and remove a detail that competes with the point. Add an analogy only if it clarifies conflicting
      directions; state its limit in ordinary language. Output: a complete draft with an explicit resolution
      and bounded lesson.

      3. **Listen to an uncoached retelling.** Ask a willing listener what happened, why it happened and
      what changed before giving them your intended lesson. Record a minimal account with permission.
      Look for causal omissions, invented facts and overgeneralization, not exact wording. If alone, do
      a delayed self-retelling and label it a weaker check. Output: the retelling as obtained and its
      evidence status.

      4. **Repair the meaning, then use the [later packet](?resource=file-later-packet-md).** Change the
      part that led to the wrong inference, tell that section again and ask what the listener now understands.
      Do not just repeat the lesson louder. Output: before/after passage and the specific meaning repaired
      or still unresolved.


      ### Make the explanation usable in another form


      For support, use five pictures with accessible descriptions, text, signed storytelling or audio.
      A plain factual sequence may work better than dramatic narration. A person who prefers a direct
      explanation is not failing to appreciate storytelling. You can shorten the story while retaining
      the causal mechanism; cutting the old sign''s location would be a more damaging omission than cutting
      Ivo''s name.


      For a harder attempt, a listener says, “So removing the old sign always fixes communication.” Add
      a boundary case: if the remaining sign gives the wrong room, removing duplicates does not make it
      correct. Distinguish reducing conflicting versions from verifying the surviving instruction. The
      analogy must not expand beyond what the case can support.


      For real transfer, explain a harmless process through an explicitly fictional example or a real
      event you have permission to share. Ask someone to retell the essential mechanism and its limit.
      Keep their actual response separate from your judgment of how engaging you were. Retelling checks
      one listener''s understanding at one time; later recall and use remain unobserved unless actually
      checked. Finish with the [fresh checks](?attempt=practice-checks), which test whether the memorable
      part carries the intended meaning.'
