  - stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01-A2
    sequence: 2
    title: Add one analogy and mark where it stops working
    instructions: 'Explain the point with a simple analogy, such as leaving two different maps at the
      entrance. State the useful similarity—conflicting directions—and the limit: not every confusing
      interaction is caused by outdated instructions. Tell the story in about two minutes with a clear
      resolution and no claim that one example proves a universal rule. Make its fictional status clear
      before the listener interprets it as a real report.


      Observation checks: One analogy supports the intended point; The analogy’s limit is stated explicitly;
      The story reaches a resolution linked to the original problem; Fictional status and limits of one
      example are clear. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1610-STORYTELLING-AND-EXPLANATION-01
