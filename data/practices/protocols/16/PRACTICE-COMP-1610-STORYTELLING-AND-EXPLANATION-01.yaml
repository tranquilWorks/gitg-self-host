      recall of the wrong thing.

      2. Preserve the within-case causal claim and state its boundary: this delay arose from the missing
      note, while other delays may have other causes. An analogy or one example cannot establish prevalence
      or a universal explanation. Ask what evidence would be needed for the wider claim.

      3. No. Recognizable details can still expose the person; a changed name is not permission. Use an
