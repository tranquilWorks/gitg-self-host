meaning_and_fit:
  purpose: Adapt detail, language, medium, timing and tone while preserving the same material facts, uncertainty
    and required action.
  why_recommended: Adapt detail, language, medium, timing and tone while preserving the same material
    facts, uncertainty and required action.
  claims:
  - statement: Adapt detail, language, medium, timing and tone while preserving the same material facts,
      uncertainty and required action.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Audience and context adaptation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Audience and context adaptation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use translation, captions, audio, plain text or a supported reader. For real
    notices, verify access details with the responsible organizer and recipients. A fictional two-audience
    test demonstrates message design, not live organizational communication.
  opportunity_considerations: 'Use the fictional notice: a community workshop moves from Room A to Room
    C this Saturday; the start stays at 10 a.m.; the step-free entrance is on the east side; people needing
    assistance can contact the organizer. Audience one is a first-time visitor; audience two is the setup
    team that already knows the building.'
  prerequisites:
  - 'Use the fictional notice: a community workshop moves from Room A to Room C this Saturday; the start
    stays at 10 a.m.; the step-free entrance is on the east side; people needing assistance can contact
    the organizer. Audience one is a first-time visitor; audience two is the setup team that already knows
    the building.'
  dependencies: []
  safe_alternatives:
  - Use translation, captions, audio, plain text or a supported reader. For real notices, verify access
    details with the responsible organizer and recipients. A fictional two-audience test demonstrates
    message design, not live organizational communication.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
