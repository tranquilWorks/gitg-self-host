  - id: file-later-packet-md
    title: Later packet
    body: 'Fictional reader results: the visitor says, “Room C at 10:00 Saturday; I''ll use the west entrance
      because that''s the one I saw on the old map.” The setup reader says, “Sol moves the sign, Kit brings
      the paper boxes, and we can start at 09:15.” They do not know when setup must finish.


      Repair the visitor''s route prominence and retain the east-entrance help window. Repair the setup
      deadline to 09:40; do not change the 10:00 public start to make the times match. The full setup
      window is 25 minutes. These misunderstandings indicate specific omissions or weak emphasis, not
      poor ability in the readers.


      A second supplied reply says the visitor now identifies the east entrance but the setup reader is
      unavailable for another check. Record visitor route corrected in the fictional response, setup copy
      revised but retest pending. Do not invent a successful retest, mark the boxes moved or say every
      attendee was notified. Real reader evidence, if you obtain it, must remain separate from these supplied
      outcomes.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Audience adaptation changes what you emphasize and how people receive it. It must not change
      material facts, conceal a burden or invent a person''s needs from their age, role, language or culture.
      In this practice you prepare two messages about one fictional room change and test whether their
      recipients can take different next actions. Allow twenty minutes to write, two short willing reader
      checks and ten minutes to repair a mismatch.


      ### Start with the decision each reader faces


      A visitor needs to find the event. A setup volunteer needs to move the right items at the right
      time. Giving both the same long operational note may hide the visitor''s route; giving both the
      same short invitation may leave the volunteer without responsibilities. GSA''s audience guidance
      recommends learning what users need and separating material for distinct audiences [S06](https://digital.gov/guides/plain-language/principles/write-for-reader).
      That supports task-based adaptation, not an assumption that one group is less intelligent.


      Use a stable fact list before drafting. Then ask what the audience already knows, what they need
      to do and what could make the channel unusable. Language, detail, medium and timing work together:
      an urgent text may fit a last-minute change, while a long image-only poster may not be readable
      or available on the journey. Essential information should remain usable with relevant access supports;
      W3C guidance discusses advance materials and accessible presentation methods [S07](https://www.w3.org/WAI/teach-advocate/accessible-presentations/).
      It is not proof that a particular message worked for a particular person.


      Emotion and urgency also need calibration. A routine room change does not justify “Emergency!” A
      person who has already traveled to the old location may need acknowledgment of the inconvenience
      and a clear route. Culture and role can affect greeting, formality and consultation expectations,
      but ask or use known local guidance instead of performing a stereotype. Keep the practical decision
      visible even when a respectful introduction is appropriate.


      ### Worked example: the same delayed collection


      A hobby organizer knows that finished clay pieces will be ready Monday, not Friday; collection remains
      at the same desk. Visitors need the new day and reassurance they need not make a wasted trip. Desk
      volunteers need to replace the Friday label and use Monday in replies. A visitor version can begin,
      “Please collect your finished piece from the usual desk on Monday; it won''t be ready Friday.” A
      volunteer version adds who changes the sign and when.


      Neither version should invent opening hours or guarantee that every visitor received the update.
      A polite thank-you from a volunteer does not prove the label was replaced. A visitor who says “I''ll
      come Friday afternoon instead” reveals a comprehension problem despite a friendly response. Repair
      the date prominence and check the affected action again.


      ### Your fact card: Saturday workshop


      The fictional workshop moves from Room A to Room C. Saturday''s start remains 10:00. The east entrance
      is step-free and leads to Room C along the signed ground-floor corridor; the west entrance has stairs.
      Organizer Neri will be at the east entrance from 09:40 to 10:10 to help. The setup team may enter
      Room C at 09:15 and must finish by 09:40. Team member Sol has agreed to move the sign from Room
      A; team member Kit has agreed to bring two boxes of paper materials. No other equipment or transport
      is promised. The organizer has approved sending a room-change notice; this fictional approval authorizes
      no real-world message.


      Visitor profile: a first-time attendee is reading on a phone and wants to know where to arrive.
      Setup profile: two returning volunteers know the building but need timing and responsibilities.
      These profiles describe task knowledge, not demographic traits. Translation or another format can
      be requested without a diagnosis or explanation.


      1. **Freeze the facts.** List room, day, unchanged start, usable entrance, help route and setup
      responsibilities separately. Mark what is unknown, such as parking or additional equipment. Output:
      a fact card that can be compared with both drafts.

      2. **Write for each next action.** Produce a visitor message and a setup message. Keep the visitor''s
      arrival route prominent and the team''s access window and named tasks explicit. Choose a medium
      and send time for each; explain why these fit the task. Do not bury the step-free route or remove
      it because volunteers know the building. Output: two complete messages with the same material facts
      where relevant.

      3. **Audit adaptation dimensions.** For each version, inspect language, amount of detail, medium,
      timing, emotional tone, local formality, role and urgency. Name one thing changed for a reason and
      one assumption you still need to check. Replace unsupported shorthand such as “the usual accessible
      way.” Output: a brief adaptation rationale, not a personality profile of the readers.

      4. **Test an action, then use the [later packet](?resource=file-later-packet-md).** Ask two willing
      readers to act as the respective audiences. Before coaching them, ask the visitor where and when
      they would arrive and how they would seek help; ask the team who does what and by when. A role-play
      checks the message in rehearsal, not real event participation. Output: actual reader answers if
      available, each mismatch, corrected copy and retest status.


      ### Keep the limits of a successful version


      You may find both messages understandable to your two readers and still have unknowns about translation,
      device access or delivery to other recipients. Do not infer universal accessibility. If a channel
      cannot carry essential information, change or supplement it rather than asking the recipient to
      work harder. A message being sent, opened, understood and acted upon are separate states.


      For support, use a short heading plus three action lines, an accessible text version and more processing
      time. Have a willing reader identify unexplained abbreviations. For a harder attempt, the room changes
      again after some visitors have departed. Decide who needs a timely update, where an authorized sign
      is needed and what cannot be assumed about receipt. Do not solve the problem by merely rewriting
      a document no one will see.


      For real transfer, choose one authorized low-stakes notice with two materially different audiences.
      Confirm the facts with its owner, obtain any needed permission to distribute, and test the actual
      recipient tasks. Record the version used and remaining reach/access gaps. This source exercise itself
      sends nothing. Finish the [fresh checks](?attempt=practice-checks) by asking what a reader could
      actually do, rather than which version sounds most polished.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. An event moves to Hall D but keeps its 14:00 start. Your volunteer version says “arrive
      at 13:30” and the visitor version says “14:00.” Is that necessarily a contradiction? What labeling
      is needed?

      2. A technical reviewer needs the uncertainty interval; a public reader needs the main finding and
      its limits. Can adaptation remove the uncertainty from the public version because it feels complex?

      3. Your phone-sized image has all the correct facts, but a recipient cannot extract its text. What
      remains unresolved and what should you change?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No, if 13:30 is an authorized setup arrival and 14:00 is the public start. Label both roles/times
      clearly and preserve the unchanged event start. Without that distinction a reader may act on the
      wrong time; factual consistency is about meaning, not identical strings.

      2. No. Explain uncertainty in usable language while preserving its material implications. Simplifying
      presentation cannot turn an uncertain result into a guarantee. Check what the reader thinks the
      finding allows them to conclude.

      3. Usable access remains unresolved even though the facts are present visually. Provide an accessible
      text version or another agreed format and check the actual task in that format. A file''s existence
      or a delivery receipt does not establish comprehension.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
