  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Audience and context adaptation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional notice: a community workshop moves from Room A to Room C this Saturday; the
    start stays at 10 a.m.; the step-free entrance is on the east side; people needing assistance can
    contact the organizer. Audience one is a first-time visitor; audience two is the setup team that already
    knows the building. Goal: Adapt detail, language, medium, timing and tone while preserving the same
    material facts, uncertainty and required action. Scope: Adaptation is not concealment or a license
    to stereotype an audience. Use a harmless fictional notice or an authorized real message, not confidential
    or high-stakes instructions. Time and effort: Twenty minutes to prepare two versions and ten minutes
    for two comprehension checks. Adaptation: Use translation, captions, audio, plain text or a supported
    reader. For real notices, verify access details with the responsible organizer and recipients. A fictional
    two-audience test demonstrates message design, not live organizational communication. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use translation, captions, audio, plain text or a supported reader. For real notices,
    verify access details with the responsible organizer and recipients. A fictional two-audience test
    demonstrates message design, not live organizational communication.
  expected_burden: Twenty minutes to prepare two versions and ten minutes for two comprehension checks.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Audience and context adaptation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Audience and context adaptation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use translation,
    captions, audio, plain text or a supported reader. For real notices, verify access details with the
    responsible organizer and recipients. A fictional two-audience test demonstrates message design, not
    live organizational communication.
  actions:
  - stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01-A1
    sequence: 1
    title: Fix the facts and identify each audience’s task
    instructions: 'Write the unchanged facts once, including what is not changing. For the visitor, identify
      the need to find the room and accessible entrance; for the setup team, identify the need to redirect
      signs and equipment. Note what each audience already knows, what terms need explanation, which channel
      reaches them and when they need the message. Do not infer needs from age, nationality or job title
      alone when they can be checked.


      Observation checks: A single factual baseline includes unchanged details; Each audience has a concrete
      different task; Knowledge medium timing and access needs are considered; Audience assumptions remain
      checkable rather than stereotyped. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01-A1
      competency_stable_id: '16.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1606_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1606_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_single_factual_baseline_includes_unchanged_details
        - each_audience_has_a_concrete_different_task
        - knowledge_medium_timing_and_access_needs_are_considered
        - audience_assumptions_remain_checkable_rather_than_stereotyped
      - measurement_id: c1606_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1606_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01-A2
    sequence: 2
    title: Write two versions with different emphasis and the same material content
    instructions: 'Draft a short visitor message leading with the new room and arrival route, and a setup
      message leading with the sign and equipment changes. Explain room directions where needed and keep
      the unchanged start time visible in both. Adjust formality and urgency to the situation without
      exaggerating inconvenience or inventing a safety claim. Include an accessible text route rather
      than relying solely on a picture of the floor plan.


      Observation checks: The versions prioritize different audience actions; Room time and entrance facts
      remain consistent; Tone and urgency do not distort the significance of the change; Essential information
      is available outside an image alone. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01-A2
      competency_stable_id: '16.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1606_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1606_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_versions_prioritize_different_audience_actions
        - room_time_and_entrance_facts_remain_consistent
        - tone_and_urgency_do_not_distort_the_significance_of_the_change
        - essential_information_is_available_outside_an_image_alone
      - measurement_id: c1606_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1606_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1606-AUDIENCE-AND-CONTEXT-ADAPTATION-01-A3
    sequence: 3
    title: Test what each reader would do next
    instructions: 'Ask a willing reader for each version to state where they would go or what they would
      change and when. They may role-play the audiences but should not be coached before answering. Compare
      errors with the factual baseline, revise one problem and repeat the affected question. Record whether
      the issue came from missing facts, unfamiliar language, medium or timing; do not equate approval
      of the wording with successful comprehension.


      Observation checks: Two audience-specific comprehension checks occur; Readers explain the action
      rather than merely rate the prose; Errors are traced to a specific communication choice; A revision
      is checked against the same factual baseline. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What changed between the two versions, what had to remain identical, and which adaptation
      actually improved the reader’s next action?


      Examples: Supportive: The visitor could locate the east entrance while the setup volunteer knew
      to move signs, and both retained the same start time.


      Mixed: One version was friendlier but omitted the unchanged time, producing a misunderstanding that
      was corrected and retested.


      Contradictory: The writer hid a material restriction from one audience or used cultural stereotypes
      to decide what they could understand.


      Inconclusive: Two versions used different adjectives but were never tested for distinct audience
      tasks.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
