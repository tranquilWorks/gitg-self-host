  - stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01-A3
    sequence: 3
    title: Check understanding and contribution without testing the person’s worth
    instructions: 'Ask the participant to use the information for the real task, such as choosing an option
      or asking a question, with the agreed support. Frame any misunderstanding as a chance to improve
      the communication, not an exam of the person. Correct one barrier and repeat the affected part.
      Confirm that they can decline, disagree or propose another option, and record only the barrier reduced
      and what remains unresolved.


      Observation checks: The participant can act or contribute using the material; The check evaluates
      communication rather than personal ability; A barrier is corrected and the affected part is retried;
      Disagreement refusal and unresolved access needs remain legitimate. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What could the person actually do after the change that was difficult before, and
      what evidence came from their participation rather than your assumption that the material was accessible?


      Examples: Supportive: A text version and additional response time let the participant compare options
      and disagree with the proposed date, revealing genuine participation rather than passive receipt.


      Mixed: Captions were enabled but key names were wrong, so the organizer corrected the terms and
      repeated the relevant explanation.


      Contradictory: The organizer guessed a disability, demanded a diagnosis or used an unqualified helper
      for sensitive interpretation.


      Inconclusive: An accessible-looking file was created without checking access or giving the person
      a way to contribute.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
