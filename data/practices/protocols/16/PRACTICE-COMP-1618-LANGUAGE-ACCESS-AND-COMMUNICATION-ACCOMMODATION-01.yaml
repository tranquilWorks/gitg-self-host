  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [The Principles of Etiquette](https://emilypost.com/advice/the-principles-of-etiquette)

      - [What is emotional abuse?](https://www.thehotline.org/resources/what-is-emotional-abuse/)

      - [What is gaslighting?](https://www.thehotline.org/resources/what-is-gaslighting/)

      - [Technology Safety Plan: A Guide for Survivors and Advocates](https://www.techsafety.org/resources-survivors/technology-safety-plan)

      - [How To Avoid a Scam](https://consumer.ftc.gov/articles/how-avoid-scam)

      - [The logic of indirect speech](https://pubmed.ncbi.nlm.nih.gov/18199841/)

      - [Autobiography of Intercultural Encounters](https://rm.coe.int/autobiography-of-intercultural-encounters/16806bf02d)

      - [Communication Access](https://www.asha.org/practice/communication-access/)

      - [Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [National CLAS Standards](https://thinkculturalhealth.hhs.gov/clas/standards)

      - [Mistakenly Seeking Solitude](https://faculty.haas.berkeley.edu/jschroeder/Publications/Epley&Schroeder2014.pdf)

      - [How many hours does it take to make a friend?](https://journals.sagepub.com/doi/10.1177/0265407518761225)

      - [A new look at social support: a theoretical perspective on thriving through relationships](https://pubmed.ncbi.nlm.nih.gov/25125368/)

      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The host confirms a level east entrance and says the west door has steps. Ren reads the revised
      text and correctly identifies the free event, 14:00–15:00 time and right to choose neither. Ren
      types “quiet reading” and asks whether the room is noisy, but the reply form expires after thirty
      seconds before the AAC response can be submitted. The helper suggests choosing drawing because it
      looks more social.


      Ren''s unsubmitted words remain Ren''s expressed preference in this fictional account; the host
      has not received a booking. Do not replace them with the helper''s preference. Offer an agreed written
      route without the short timeout, convey the question with permission, and check receipt. The room''s
      noise level is still unknown.


      The retest has not happened. Report comprehension as supported by the supplied case, submission
      as failed, the repair as proposed and real participation as unobserved. A technically changed form
      would still need the agreed task attempted again.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'A message is not accessible merely because you supplied a second format. The person needs a
      workable way to understand the choices and express a preference, question or disagreement. This
      practice repairs one communication barrier in an ordinary invitation or small activity, then checks
      the actual task through the person''s preferred route. Allow twenty minutes to prepare, a short
      willing-participant check and ten minutes to repair.


      ### Match the support to the barrier and the person


      Ask privately what would help; a diagnosis is not required. ASHA''s communication-access guidance
      emphasizes asking about preferences, communicating with the person and checking understanding in
      both directions [S08](https://www.asha.org/practice/communication-access/). Its healthcare context
      does not turn this informal exercise into clinical service. We apply the participation principle
      to a low-stakes choice.


      An **interpreter** supports exchange across languages, including signed languages; agree language,
      role, confidentiality and competence for the setting. **Plain language** makes purpose, choices
      and actions explicit without removing important facts. **Captions** make spoken content available
      as text, but need usable timing and accuracy. **Augmentative and alternative communication (AAC)**
      can include a person''s communication board, writing or device; allow their response time and do
      not speak over them. **Written follow-up** provides a usable record of decisions, questions and
      changes. **Accessible formats** may involve structured text, large print, essential image descriptions
      or a compatible file instead of an image-only announcement.


      These are options to select with someone, not six treatments to impose on every person. Captions
      will not by themselves translate an unfamiliar language, and large print will not solve an inaccessible
      reply form. An assistant may support expression without replacing the person''s answer. Avoid requiring
      quick speech as proof that someone understood.


      W3C''s event guidance covers advance materials, captioning/interpreting arrangements and participation
      activities [S09](https://www.w3.org/WAI/teach-advocate/accessible-presentations/). The task below
      is our own small usability check, not a claim of full accessibility or legal compliance. For healthcare
      or other regulated high-stakes decisions, use the responsible service''s qualified language-access
      process. HHS CLAS guidance discourages untrained or minor interpreters in healthcare [S10](https://thinkculturalhealth.hhs.gov/clas/standards);
      a child, relative or unverified machine translation is not a default substitute for qualified support.


      ### Worked example: the readable invitation still has no answer route


      Dev replaces an image-only invitation with readable text. A participant can now identify the event
      time, but the only response button requires a rapid voice call. Dev has repaired the incoming message
      while leaving outgoing communication blocked. A useful second version allows the participant''s
      preferred written reply and enough time to use it. Completion of the edit is not proof the person
      has successfully responded.


      A check should resemble the real task: “What are your options, and how would you tell me your choice?”
      It should not be a public literacy test or require the expected positive answer. A clear no may
      demonstrate effective access better than an agreeable yes obtained through a helper.


      ### Your case: choose an activity and ask a question


      Fictional invitation: “Saturday 21 November, 14:00–15:00, Room E, free. Choose a drawing table,
      a quiet reading table or neither. Materials supplied. Reply by Thursday 19 November, 17:00. You
      may change your choice on arrival. Jo is the private contact for access questions.” The original
      announcement is an image; it gives choices only through blue and green boxes and asks for a telephone
      reply. It does not state where the room entrance is.


      Participant Ren requests selectable text, written replies and time to respond using an AAC device.
      Ren does not request an interpreter. Ren''s helper is present but has not been authorized to choose.
      You can confirm the entrance with the host, and you control the invitation text and reply route.


      1. **Specify the participation task.** Ren should be able to identify time, place, cost, choices
      and response date, then state a choice or disagreement and ask an access question. Ask how Ren wants
      the helper involved; do not ask for medical history. Output: a task and agreed support preference.

      2. **Repair the material.** Write a complete selectable-text invitation with named options, not
      color-only meaning. Ask the host about the entrance instead of inventing access details. Provide
      the written reply route and adequate response time. Output: the revised invitation with any unresolved
      entrance fact clearly pending.

      3. **Check the actual route.** With a willing participant, use their real device or chosen format.
      Address them directly, wait for their answer and allow corrections. If interpretation or captioning
      is needed in a different case, arrange it and share non-sensitive terms beforehand; naming the service
      is not arranging it. Output: actual task result or “not yet tested.”

      4. **Read the [later packet](?resource=file-later-packet-md), repair and retry.** Separate successful
      comprehension from inability to submit a response. Preserve a declined invitation as a valid choice.
      Output: barrier found, concrete repair, retest result and remaining uncertainty.


      ### Keep the person in charge of meaning


      Written follow-up should preserve the person''s actual choice and unresolved questions, not silently
      convert uncertainty into agreement. Ask whether the record is usable before sending sensitive content.
      Do not save diagnoses, private messages or identifiable access histories merely to prove that you
      completed the exercise.


      For support, narrow the task to a free familiar activity and one willing partner''s stated preference.
      You can prepare alone, but a self-audit cannot establish another person''s participation. If a partner
      is unavailable, retain the task as pending. For a harder attempt, the requested format works but
      the response route fails; repair the route and obtain a fresh response rather than asking the helper
      to guess.


      For transfer, use another ordinary decision where you can control the material or ask an authorized
      organizer for a change. Review both reception and expression, including the possibility of refusal.
      Record one practical difference made and one limit still present. Do not claim all future interactions
      are accessible because a single person completed one task. The [fresh checks](?attempt=practice-checks)
      distinguish format production, usable choice and actual participation.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Fictional cases only. See [answers](?check=practice-answers) after attempting them.


      1. A captioned invitation accurately shows the time, but a participant cannot express “neither option”
      through the response form. Has the task become accessible?

      2. Someone uses an AAC device and takes longer to answer. Their companion supplies an answer instead.
      What should you verify before accepting it?

      3. A hospital asks a patient''s child to interpret an important decision because the child speaks
      both languages. Does this informal accommodation exercise establish that as adequate?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Only one barrier may have been reduced. Add a usable refusal/alternative response route
      and check the person''s actual attempt. An accessible incoming message does not establish two-way
      participation.

      2. Verify the person''s preference for assistance and allow their own response through the chosen
      method. Do not equate speed with competence or assume the companion has authority to choose. A helper''s
      contribution can support communication when agreed without substituting meaning.

      3. No. Use the responsible healthcare organization''s qualified language-assistance process and
      applicable requirements. HHS guidance discourages untrained individuals and minors as interpreters.
      This source companion cannot certify competence, give jurisdiction-specific legal advice or authorize
      a shortcut.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
