  - stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01-A2
    sequence: 2
    title: Provide the information in the agreed usable form
    instructions: 'Rewrite the invitation with the decision, date, location, cost if any and response
      route together. Supply text rather than only a screenshot, describe essential visuals, and arrange
      requested captioning or interpretation through a suitable service. Give interpreters or captioners
      relevant non-sensitive terms in advance when appropriate. Check that the person can access the material
      on their actual device or format; a file existing somewhere is not the same as usable access.


      Observation checks: Essential facts are grouped in clear language; Information is not restricted
      to an inaccessible image or channel; Requested support is actually arranged rather than merely offered;
      Access is checked in the person’s intended format. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01
      action_stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01-A2
      competency_stable_id: '16.18'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
