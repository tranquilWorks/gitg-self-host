  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Language access and communication accommodation; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - A self-audit using accessibility guidance can identify likely issues when no participant is available,
      but it cannot establish that another person participated meaningfully. Use qualified interpreters
      and required services for medical, legal or other high-stakes communication; do not substitute unverified
      machine translation for those obligations.
    cultural_context:
    - Adapt the expression of Language access and communication accommodation to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - A self-audit using accessibility guidance can identify likely issues when no participant is available,
      but it cannot establish that another person participated meaningfully. Use qualified interpreters
      and required services for medical, legal or other high-stakes communication; do not substitute unverified
      machine translation for those obligations.
  pause_conditions:
  - Pause Language access and communication accommodation when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Language access and communication accommodation practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Language access and communication accommodation situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
