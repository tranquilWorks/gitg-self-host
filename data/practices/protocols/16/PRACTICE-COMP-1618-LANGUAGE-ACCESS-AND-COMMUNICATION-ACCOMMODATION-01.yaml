meaning_and_fit:
  purpose: Choose an accommodation with the participant, provide essential information in a usable form
    and verify that the person can contribute rather than merely receive material.
  why_recommended: Choose an accommodation with the participant, provide essential information in a usable
    form and verify that the person can contribute rather than merely receive material.
  claims:
  - statement: Choose an accommodation with the participant, provide essential information in a usable
      form and verify that the person can contribute rather than merely receive material.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Language access and communication accommodation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Language access and communication accommodation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: A self-audit using accessibility guidance can identify likely issues when
    no participant is available, but it cannot establish that another person participated meaningfully.
    Use qualified interpreters and required services for medical, legal or other high-stakes communication;
    do not substitute unverified machine translation for those obligations.
  opportunity_considerations: Use a low-stakes meeting invitation or a five-minute activity explanation.
    Ask a willing participant what format or support would help, without asking for a diagnosis. Available
    options may include plain language, captions, an interpreter, AAC, text, audio, advance materials
    or written follow-up; use what is actually requested and feasible.
  prerequisites:
  - Use a low-stakes meeting invitation or a five-minute activity explanation. Ask a willing participant
    what format or support would help, without asking for a diagnosis. Available options may include plain
    language, captions, an interpreter, AAC, text, audio, advance materials or written follow-up; use
    what is actually requested and feasible.
  dependencies: []
  safe_alternatives:
  - A self-audit using accessibility guidance can identify likely issues when no participant is available,
    but it cannot establish that another person participated meaningfully. Use qualified interpreters
    and required services for medical, legal or other high-stakes communication; do not substitute unverified
    machine translation for those obligations.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Language access and communication accommodation differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Language access and communication
    accommodation as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a low-stakes meeting invitation or a five-minute activity explanation. Ask a willing participant
    what format or support would help, without asking for a diagnosis. Available options may include plain
    language, captions, an interpreter, AAC, text, audio, advance materials or written follow-up; use
    what is actually requested and feasible. Goal: Choose an accommodation with the participant, provide
    essential information in a usable form and verify that the person can contribute rather than merely
    receive material. Scope: Do not simulate another person’s disability or assume an accommodation from
    a diagnosis. High-stakes interpretation and regulated accessibility duties require appropriate qualified
    services and local requirements. Time and effort: Twenty minutes to prepare accessible material, one
    short voluntary participation check and ten minutes to correct a barrier. Adaptation: A self-audit
    using accessibility guidance can identify likely issues when no participant is available, but it cannot
    establish that another person participated meaningfully. Use qualified interpreters and required services
    for medical, legal or other high-stakes communication; do not substitute unverified machine translation
    for those obligations. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A self-audit using accessibility guidance can identify likely issues when no participant
    is available, but it cannot establish that another person participated meaningfully. Use qualified
    interpreters and required services for medical, legal or other high-stakes communication; do not substitute
    unverified machine translation for those obligations.
  expected_burden: Twenty minutes to prepare accessible material, one short voluntary participation check
    and ten minutes to correct a barrier.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Language access and communication accommodation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Language access and communication accommodation action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A self-audit
    using accessibility guidance can identify likely issues when no participant is available, but it cannot
    establish that another person participated meaningfully. Use qualified interpreters and required services
    for medical, legal or other high-stakes communication; do not substitute unverified machine translation
    for those obligations.
  actions:
  - stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01-A1
    sequence: 1
    title: Identify the task and ask about the barrier privately
    instructions: 'State what the person needs to be able to do, such as understand the meeting choice
      and express a preference. Ask which communication format or support works for them and whether they
      want time or material in advance. Consider language, hearing, vision, processing, speech and connection
      constraints without assigning a deficit. Confirm privacy and any interpreter or helper role; do
      not automatically use a relative or child for sensitive interpretation.


      Observation checks: The intended participation task is concrete; The person’s preference guides
      the accommodation; No diagnosis or unnecessary personal information is demanded; Privacy and the
      helper or interpreter role are agreed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01
      action_stable_id: PRACTICE-COMP-1618-LANGUAGE-ACCESS-AND-COMMUNICATION-ACCOMMODATION-01-A1
      competency_stable_id: '16.18'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1618_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1618_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_intended_participation_task_is_concrete
        - the_person_s_preference_guides_the_accommodation
        - no_diagnosis_or_unnecessary_personal_information_is_demanded
        - privacy_and_the_helper_or_interpreter_role_are_agreed
      - measurement_id: c1618_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1618_a1_adverse
        kind: boolean
