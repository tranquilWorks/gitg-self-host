meaning_and_fit:
  purpose: State the observation, reasoning, feeling or need, requested action and controllable boundary
    plainly enough that the recipient does not have to decode hints.
  why_recommended: State the observation, reasoning, feeling or need, requested action and controllable
    boundary plainly enough that the recipient does not have to decode hints.
  claims:
  - statement: State the observation, reasoning, feeling or need, requested action and controllable boundary
      plainly enough that the recipient does not have to decode hints.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Clear and direct expression practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Clear and direct expression as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a shorter text, supported communication, translation or an intermediary
    agreed by both parties. Directness can be respectful without being abrupt; adapt formality while preserving
    the concrete request. Use appropriate support instead of this exercise where retaliation or abuse
    is plausible.
  opportunity_considerations: 'Default case: a shared item is repeatedly unavailable when needed. Start
    from the vague message It would be nice if people were more considerate. Use a private draft and prepare
    a respectful direct version; a fictional role-play is available when no safe real request exists.'
  prerequisites:
  - 'Default case: a shared item is repeatedly unavailable when needed. Start from the vague message It
    would be nice if people were more considerate. Use a private draft and prepare a respectful direct
    version; a fictional role-play is available when no safe real request exists.'
  dependencies: []
  safe_alternatives:
  - Use a shorter text, supported communication, translation or an intermediary agreed by both parties.
    Directness can be respectful without being abrupt; adapt formality while preserving the concrete request.
    Use appropriate support instead of this exercise where retaliation or abuse is plausible.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Clear and direct expression differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Clear and direct expression
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: a shared item is repeatedly unavailable when needed. Start from the vague message
    It would be nice if people were more considerate. Use a private draft and prepare a respectful direct
    version; a fictional role-play is available when no safe real request exists. Goal: State the observation,
    reasoning, feeling or need, requested action and controllable boundary plainly enough that the recipient
    does not have to decode hints. Scope: Choose an ordinary request you are entitled to make. Clear expression
    does not guarantee agreement and must not become a threat, demand for disclosure or unsafe confrontation.
    Time and effort: Fifteen minutes to draft, one brief willing exchange and five minutes to revise or
    confirm. Adaptation: Use a shorter text, supported communication, translation or an intermediary agreed
    by both parties. Directness can be respectful without being abrupt; adapt formality while preserving
    the concrete request. Use appropriate support instead of this exercise where retaliation or abuse
    is plausible. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a shorter text, supported communication, translation or an intermediary agreed
    by both parties. Directness can be respectful without being abrupt; adapt formality while preserving
    the concrete request. Use appropriate support instead of this exercise where retaliation or abuse
    is plausible.
  expected_burden: Fifteen minutes to draft, one brief willing exchange and five minutes to revise or
    confirm.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Clear and direct expression protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Clear and direct expression action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a shorter
    text, supported communication, translation or an intermediary agreed by both parties. Directness can
    be respectful without being abrupt; adapt formality while preserving the concrete request. Use appropriate
    support instead of this exercise where retaliation or abuse is plausible.
  actions:
  - stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01-A1
    sequence: 1
    title: Separate the message into five concrete parts
    instructions: 'Write the observable event without always, never or a motive claim. Then state its
      practical effect, the feeling or need you choose to share, the reason the issue matters and the
      specific change requested. For the default: The tool was not on its shelf yesterday; I could not
      finish the repair; I need a reliable return place; please put it back after use. Remove any claim
      that a reasonable person should simply know.


      Observation checks: The event is observable rather than a character judgment; Effect feeling or
      need and reason are distinguishable; The requested action is specific enough to perform; Hints and
      mind-reading expectations are removed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01-A1
      competency_stable_id: '16.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1602_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1602_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_event_is_observable_rather_than_a_character_judgment
        - effect_feeling_or_need_and_reason_are_distinguishable
        - the_requested_action_is_specific_enough_to_perform
        - hints_and_mind_reading_expectations_are_removed
      - measurement_id: c1602_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1602_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01-A2
    sequence: 2
    title: Add a proportionate boundary and test the wording
    instructions: 'Where a boundary is necessary, name only your own future participation, such as I can
      lend it when we agree where and when it will return. Read the message aloud or in the intended medium
      and remove extra explanation that hides the request. Ask a willing reader to identify what happened,
      what is requested and what you will do. Revise any part they cannot identify without coaching them
      to the answer.


      Observation checks: Any boundary concerns your own controllable action; The main request is not
      buried in excess explanation; A reader identifies the intended action without being supplied the
      answer; Ambiguous wording is revised after the comprehension check. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01-A2
      competency_stable_id: '16.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1602_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1602_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - any_boundary_concerns_your_own_controllable_action
        - the_main_request_is_not_buried_in_excess_explanation
        - a_reader_identifies_the_intended_action_without_being_supplied_the_answer
        - ambiguous_wording_is_revised_after_the_comprehension_check
      - measurement_id: c1602_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1602_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01-A3
    sequence: 3
    title: Deliver or rehearse and distinguish understanding from consent
    instructions: 'Ask for an appropriate time, send or speak the message in the agreed channel, and invite
      clarification. Record whether the recipient understood the request and whether they accepted, declined
      or proposed another arrangement. Respond to a refusal with a safe decision within your control rather
      than repeating the message until they submit. Label a role-play honestly and keep personal wording
      outside the application.


      Observation checks: Timing and channel are appropriate to the recipient; Understanding and agreement
      are recorded separately; A refusal does not trigger pressure or punishment; Actual delivery and
      rehearsal remain distinct. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Could the recipient accurately name the requested action even if they disagreed with
      it, and what did your first draft leave them to guess?


      Examples: Supportive: The revised message named the missing tool and return location, and the recipient
      understood it but proposed a different mutually workable shelf.


      Mixed: The request was clear, but the boundary still depended on forcing an apology and was rewritten
      around lending conditions.


      Contradictory: The person used clarity as an excuse for insults, threats or repeated pressure after
      a refusal.


      Inconclusive: The message became longer and more emotional without stating an observable request.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01
      action_stable_id: PRACTICE-COMP-1602-CLEAR-AND-DIRECT-EXPRESSION-01-A3
      competency_stable_id: '16.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
