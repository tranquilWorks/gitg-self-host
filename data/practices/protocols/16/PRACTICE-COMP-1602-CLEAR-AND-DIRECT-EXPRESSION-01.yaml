  - id: file-later-packet-md
    title: Later packet
    body: 'Open after drafting and preserving your first message. All replies below are supplied fiction,
      not observer evidence.


      Ari replies Thursday at 16:00: “I understand you need it by Friday at 17:00 and won''t lend again
      without a return plan. I can bring it Friday at 18:00, or you can collect Thursday at 18:30. I can''t
      leave it outside.”


      Write a reply that distinguishes comprehension from the available arrangement. Friday at 18:00 misses
      the need by one hour. Thursday at 18:30 fits your stated collection window, but requires an agreed
      location and acknowledgment; it is not permission to enter or take anything unannounced. A workable
      answer confirms that option and asks where to meet. Preserve the future lending boundary without
      adding a punishment for the delay.


      Then change one fact: you can no longer collect Thursday. Do not retain the old agreement as feasible.
      Ask whether a different timely return is possible or use a real alternative for Friday''s activity.
      The reason for the original delay remains unknown; a counteroffer supplies no evidence of carelessness
      or malice.


      Record: message understood in the fictional reply; Thursday option proposed/confirmed only as the
      dialogue supports; actual return unobserved. A clear exchange does not establish completed return
      or successful real-world communication.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'A useful difficult message lets the recipient identify the event, why it matters, the requested
      action and your own next step. It can be understood and still declined. The practice is to remove
      avoidable decoding while preserving the other person''s freedom to disagree. Allow twenty minutes
      for drafting, a short voluntary rehearsal and ten minutes for revision. Choose an ordinary shared-item
      problem; do not use an unsafe relationship as a practice opportunity.


      ### Separate the parts before choosing the wording


      An observation names an event someone could check: the projector was not on its agreed shelf at
      18:00. “You never think of others” is an interpretation of character. Reasoning explains the connection
      between an event and your concern: without the projector you could not run the planned screening.
      A feeling belongs to the speaker; “I felt dismissed” may contain a claim about someone else''s intention,
      whereas “I was frustrated and uncertain about the plan” makes less of that assumption.


      A need names what matters, such as dependable access to shared equipment. A request proposes a specific
      action someone can accept, decline or counter. A boundary describes what you will do within your
      authority: lend your own projector only when a return arrangement is confirmed. It cannot turn a
      shared asset into your private property or make another person''s compliance inevitable. These distinctions
      are planning tools, not a required six-sentence speech or a demand to disclose every feeling.


      The NVC teaching aid separates observation, feeling, need and request [S01](https://www.nonviolentcommunication.com/bookshare/4_components_of_NVC_4_rev_6.20.19.pdf).
      This companion adds explicit reasoning and a controlled boundary to meet this competency''s wider
      scope. It does not treat one communication tradition as culturally superior or promise that careful
      words prevent conflict. A formal note, indirect respectful opening, signed exchange or brief text
      can all carry a clear request.


      ### Worked example: a late file


      Sam agreed to share the rehearsal file by Tuesday evening; on Wednesday morning it is absent. A
      first draft says, “Apparently the group doesn''t matter.” That mixes a real delay with an unsupported
      motive and leaves the next action obscure. A repaired message is: “The file wasn''t in our folder
      this morning, after the Tuesday plan. I need it to prepare Thursday''s rehearsal, and I''m concerned
      about time. Can you upload the current version by 15:00, or tell me by noon if that won''t work?
      If I don''t have a usable version, I''ll prepare the shorter exercise I already have.”


      The alternative is Sam''s to choose and the fallback is the speaker''s to implement. If Sam accurately
      repeats the request but says 15:00 is impossible, clarity may have improved without agreement. If
      Sam thinks a finished polished file is required, the writer should clarify “current version” rather
      than repeat the same message more forcefully. The example is fictional; no delivery or understanding
      has been observed.


      ### Your case: the missing projector


      These are the complete fictional facts. You own a small projector and lent it to Ari. The agreed
      return was Wednesday at 18:00 to the hobby-room shelf. You arrived at 18:15 and it was absent. You
      used a paper activity instead. You have no information about why the return was missed. You need
      the projector for Friday at 17:00; you can collect it on Thursday between 18:00 and 19:00 if Ari
      agrees, but cannot travel on Friday. You want dependable returns and are willing to pause further
      lending until a workable return plan is agreed. Ari has not yet replied. Your draft reads: “It would
      be nice if people were more considerate.”


      1. **Make a fact-and-purpose note.** List the observed absence and agreed time separately from assumptions
      about Ari. Write the practical effect, your reasoning about Friday, one honest feeling if useful,
      and the underlying need. Mark the reason for the delay unknown. Output: six short planning lines,
      with no accusation disguised as a fact.

      2. **Draft a request and a boundary.** Ask for a return arrangement that could actually meet Friday''s
      need. Include a response time appropriate to the Thursday collection window. State what you control
      about future lending. Do not imply you may enter Ari''s space or collect without agreement. Output:
      a message of roughly five sentences, with an answerable request and feasible fallback.

      3. **Check decoding before using it.** Read or render the message in your intended medium. Remove
      one vague pronoun, hidden deadline or unnecessary explanation. Ask a willing rehearsal reader what
      happened, what Ari is being asked to do, and what you intend to do. Let them answer before showing
      your planning note. Record their actual wording or a minimal accurate summary with permission. If
      alone, do a delayed reread and label it self-review. Output: first version, comprehension mismatch
      and revision.

      4. **Open the [later packet](?resource=file-later-packet-md).** Respond to the supplied counteroffer
      without converting understanding into agreement. Keep drafted, rehearsed, delivered, understood
      and agreed statuses separate. Output: your final practical disposition and remaining uncertainty.


      ### Adjust difficulty without changing the task


      For support, use a two-column event/request card and add the boundary only after both are concrete.
      Have a trusted willing reader check language, use translation or AAC, or allow asynchronous processing.
      Keep private emotional details out if they do not help the practical decision. Clarity does not
      require a confrontational tone or a public conversation.


      For a harder attempt, Ari disputes the original return time. Preserve the disagreement, refer only
      to an existing mutually available record if there is one, and ask what can be arranged now. Do not
      invent a screenshot, demand an admission or settle the history by repeating your version. The practical
      request may remain clear while the historical claim is unresolved.


      For real transfer, choose one welcome low-stakes request within the next week. Get permission for
      a short clarity check, use a suitable time and channel, and record whether the recipient understood
      the request, accepted it, declined it or suggested another option. Do not send this fictional message
      to a real Ari. An actual artifact plus an actual recipient response can inform review; your satisfaction
      alone cannot show understanding.


      Finish with the [fresh checks](?attempt=practice-checks). Keep an example of an understood refusal
      in your review: it prevents you from learning that communication only worked when someone complied.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Answer before opening the corrective key.


      1. A colleague says, “I know you want the notes before 11:00; I can''t do that, but can send them
      at 14:00.” What is established, and what must you decide before replying?

      2. Rewrite “If you respected me, you''d stop changing things” using only these facts: a shared agenda
      changed twice after you printed it; you need a stable copy by 16:00; you control when you print,
      not whether others edit.

      3. Your message reader thinks your optional request is an instruction from the organizer. What should
      change, and what would constitute a useful retest?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The colleague reports understanding the requested time and declines that time. They have
      not agreed to 11:00. Check whether 14:00 still serves the task; accept, counter or use your alternative.
      Repeating the deadline as if misunderstanding were the problem would miss the actual constraint.

      2. For example: “The agenda changed twice after I printed it, so the copies no longer matched. Could
      we agree a stable version by 16:00? I''ll wait to print until that version is confirmed; if it isn''t,
      I''ll use the digital copy.” This states event, reason, need, request and controlled action without
      claiming to know respect or forbidding authorized edits. A feeling can be included honestly, but
      is not mandatory disclosure.

      3. Clarify your actual role and that declining is allowed. Ask a willing reader to identify who
      is asking, whether it is optional and what action is requested, without supplying those answers
      first. Pleasant wording alone does not repair misleading authority.'
    criteria:
