      - [MIT OpenCourseWare — Giving and Receiving Feedback Activity, Christine Kelly course (2008)](https://ocw.mit.edu/courses/15-277-special-seminar-in-communications-leadership-and-personal-effectiveness-coaching-fall-2008/37362bb8a9db0e92731e53a1a2099373_guide_02.pdf)

      - [Aristotle — Rhetoric, Book I, W. Rhys Roberts translation](https://classics.mit.edu/Aristotle/rhetoric.1.i.html)

