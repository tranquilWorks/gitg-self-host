  - id: practice-answers
    title: Compare your responses
    body: '1. You know the colleague has not committed. State the real cutoff through a welcome channel
      and obtain whatever explicit authorization the shared-funds process requires. Without it, do not
      order on their behalf. Indirectness cannot substitute for authority.

      2. Retain individual preferences as unknown and offer an appropriate voluntary way to respond or
      decline, where the process permits it. Do not label silence agreement or infer fear as a fact. Clarify
      who actually has decision authority.

      3. Share only the attendance disposition if authorized or required by the agreed process; do not
      reveal the private reason or invent a different one. A neutral “They won''t be joining” can preserve
      coordination without turning confidentiality into deception.'
