      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Ari accepts a brief private check and says: “I don''t want to join an extra group. I changed the
      topic because we were running late. Please don''t give my personal reason to the room.” No personal
      reason is then disclosed. Ari adds: “Others can decide for themselves; I wasn''t speaking for them.”


      Your scheduling-obstacle hypothesis was possible but is not Ari''s volunteered disposition. Do not
      propose a more convenient time to overcome a clear refusal. The public update can say that the idea
      remains optional and no group decision has been made. Ari''s permission for others to choose is
      not their endorsement of your proposal.


      For comparison, imagine Ari had not answered at all. The correct status would remain unconfirmed,
      not the same clear refusal and not agreement. Explain the difference between the actual fictional
      clarification and this counterfactual, then choose a next step that uses neither silence nor seniority
      as authorization.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'A person may communicate disagreement by softening a phrase, delaying an answer or moving a
      discussion out of a public setting. Those signals can also have other explanations. This practice
      asks you to hold several interpretations, identify the practical decision that actually needs clarification,
      and offer a response route with room for refusal. Allow fifteen minutes to prepare and a short written
      or spoken rehearsal.


      ### Interpret provisionally; act within permission


      An indirect response contains information without necessarily settling its meaning. “That may be
      difficult” could refer to cost, timing, disagreement, authority to decide or a wish to decline politely.
      A pause may reflect thought, translation, fatigue, a connection delay or discomfort. Treating it
      as a secret universal code merely replaces one assumption with another.


      Pinker, Nowak and Lee''s theoretical account describes language as carrying information while negotiating
      relationships [S06](https://pubmed.ncbi.nlm.nih.gov/18199841/). Only the abstract is used here.
      It explains why indirectness can have a social function; it does not provide a decoder, justify
      concealed coercion or establish a superior communication style. Our clarification exercise is an
      original application with explicit permission limits.


      “Face” here means the social standing or dignity someone may want to preserve in an interaction.
      Publicly requiring a junior participant to contradict a senior person may carry a cost that a private
      practical question does not. Yet privacy is not automatically welcome, and status does not give
      someone authority to consent for another. Ask whether a different channel would help; do not move
      a person into isolation or treat hierarchy as consent.


      Respect, disagreement, refusal and emotion can each be conveyed with different degrees of directness.
      You can acknowledge a concern without demanding an emotional confession: “We can leave the plan
      open.” You can also communicate a direct limit gently: “I can''t commit our group without a decision.”
      The aim is enough clarity for the next action, not complete access to somebody''s inner life.


      ### Worked example: a suggestion at the end of a meeting


      Neri proposes an extra optional session. An experienced member says, “We already have a busy month,”
      and begins packing. Neri initially hears rejection. A more careful account has at least three possibilities:
      the member is declining, identifying a scheduling problem or simply leaving for another obligation.
      Neri knows only the words and the timing.


      Neri can ask, if welcome, “Would it help to revisit this later, change the timing, or leave it aside?”
      If there is no answer, Neri does not add the member''s name to an attendance list. A reversible
      next action might be drafting an uncirculated outline or waiting. It would not include booking a
      nonrefundable room using shared money or announcing group support.


      ### Your case: the optional reading group


      At a fictional community meeting, you propose a free, optional twenty-minute reading group before
      the next regular session. There is no deadline and no booking. Ari, an experienced participant,
      says, “That may be difficult,” then changes the topic to the normal agenda. Four newer members are
      present. Ari is not authorized to decide for everyone. You do not know Ari''s schedule, preference,
      feelings or reason for the topic change. The only decision now is whether to continue developing
      the idea; no one''s participation has been agreed.


      1. **Write the observation and competing interpretations.** Preserve the exact supplied words and
      context. Add a scheduling obstacle, polite refusal, uncertainty and need to consult as possibilities.
      Explain what evidence could distinguish them without demanding private reasons. Output: observation/hypotheses/unknowns,
      with no nationality or age stereotype.

      2. **Identify the smallest needed clarification.** You need a disposition for the proposal, not
      Ari''s emotional history. Draft a private-channel offer or a low-pressure question at a suitable
      later moment: “Would you prefer that I pause, adjust something, or leave this idea aside? You don''t
      need to explain.” Output: a question that genuinely permits stopping.

      3. **Prepare actions for different answers.** For a clear refusal, stop recruiting Ari. For a practical
      obstacle, check whether an adjustment is desired before fixing it. For more time, agree only a welcome
      way to revisit. For silence, leave participation unconfirmed. Output: four next actions that do
      not manufacture consent.

      4. **Read the [later packet](?resource=file-later-packet-md).** Replace hypotheses with the volunteered
      clarification, but retain what was not said. Decide what can be relayed to others and what should
      remain private. Output: a revised proposal status and a short public account limited to authorized
      information.


      ### Check your own contribution to ambiguity


      A speaker can also use indirectness to avoid responsibility. “Someone should probably arrange it”
      does not identify an owner. When an actual commitment is necessary, clarify the action, authority
      and timing while allowing a respectful refusal. In consent-sensitive, contractual or formal decisions,
      follow the applicable explicit process instead of treating hints as sufficient. This companion does
      not replace those requirements.


      For support, write your alternative readings before choosing one, or rehearse a question with an
      informed willing partner who can point out pressure in its wording. A role-play response tests your
      revision, not a real person''s meaning. For a harder attempt, a senior person says “everyone is
      happy” while a junior person remains silent. Preserve the unconfirmed individual choices and seek
      an appropriate voluntary channel; do not require a public contradiction.


      For transfer, use an existing ordinary ambiguity where clarification is welcome. Record your initial
      interpretation, the actual volunteered response and the action it changed. A useful result can be
      a clearer no, an unresolved question or an agreed pause. Judge whether you reduced an unnecessary
      burden without overriding choice, not whether you extracted a definite answer. Some interpretations
      remain unknowable, and you can still avoid acting beyond permission. The [fresh checks](?attempt=practice-checks)
      ask you to reason through different contexts rather than memorize a phrase.'
  - id: practice-checks
