  - stable_id: PRACTICE-COMP-1616-HIGH-CONTEXT-INDIRECT-AND-FACE-SENSITIVE-COMMUNICATION-01-A2
    sequence: 2
    title: Offer a private clarification with a genuine refusal route
    instructions: 'When welcome, say something like I heard that the plan may be difficult; should I pause
      it, change a practical detail or leave it aside? Make clear that declining is acceptable and that
      an immediate answer is not required. Use a respectful medium and timing for the actual person, not
      a stereotype. If asking in public would create pressure, choose an appropriate private route or
      defer.


      Observation checks: The clarification presents more than a forced yes-or-no choice; Declining and
      taking time are both legitimate options; Medium and privacy reduce avoidable social pressure; The
      wording is adapted to the person rather than a cultural caricature. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
