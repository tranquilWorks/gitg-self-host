  - stable_id: PRACTICE-COMP-1616-HIGH-CONTEXT-INDIRECT-AND-FACE-SENSITIVE-COMMUNICATION-01-A3
    sequence: 3
    title: Act on what was clarified and preserve what was not
    instructions: 'Record whether the person asked to pause, revise, decline or leave the matter uncertain.
      Confirm only the practical next step and avoid publicly explaining their private reasons. If there
      is no answer, do not advertise agreement or proceed on their behalf; choose a reversible action
      or wait as appropriate. Compare the outcome with your original interpretations and note how respect
      and clarity were both preserved.


      Observation checks: The actual disposition governs the next step; Private reasons are not repeated
      without permission; No answer is not converted into authorization; Original interpretations are
      revised from the clarified information. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: How did the clarification make the practical decision clearer without making the person
      pay a public social cost for disagreeing?


      Examples: Supportive: The member privately explained a scheduling conflict, and the organizer paused
      the proposal without announcing that the person had approved it.


      Mixed: The person remained uncertain, so the organizer preserved that status rather than treating
      politeness as a commitment.


      Contradictory: Silence was treated as consent or the person was publicly cornered into rejecting
      the proposal.


      Inconclusive: A cultural rule was used to decode the phrase without any contextual check.'
