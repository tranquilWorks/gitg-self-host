meaning_and_fit:
  purpose: Interpret implication, timing, silence, hierarchy and relational context cautiously while making
    room for disagreement or refusal that preserves dignity.
  why_recommended: Interpret implication, timing, silence, hierarchy and relational context cautiously
    while making room for disagreement or refusal that preserves dignity.
  claims:
  - statement: Interpret implication, timing, silence, hierarchy and relational context cautiously while
      making room for disagreement or refusal that preserves dignity.
    classification: product_design_judgment
