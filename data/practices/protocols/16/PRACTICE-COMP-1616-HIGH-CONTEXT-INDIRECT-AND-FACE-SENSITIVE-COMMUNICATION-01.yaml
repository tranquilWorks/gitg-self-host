    body: 'All cases are fictional; consult [the key](?check=practice-answers) afterward.


      1. A colleague says, “I''ll think about it.” You must order materials tomorrow using shared funds.
      What do you know, and what may you authorize?

      2. A senior member says everyone supports a change. A junior member says nothing. How can you avoid
      both assuming assent and forcing public dissent?

      3. Someone privately says they cannot attend and asks you not to repeat their reason. Another participant
