    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded High-context, indirect, and face-sensitive communication
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record High-context, indirect, and face-sensitive communication as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use written options, translation, a trusted mutually agreed intermediary or
    more processing time. In legal, medical, sexual or other consent-sensitive situations, required explicit
    consent and qualified communication processes take priority over interpreting indirect signals.
  opportunity_considerations: 'Fictional case: after you propose a group event, an experienced member
    says That may be difficult, then changes the subject. The event is optional and no urgent decision
    is needed. Prepare two interpretations and a private, low-pressure way to ask what decision or constraint
    needs clarification.'
  prerequisites:
  - 'Fictional case: after you propose a group event, an experienced member says That may be difficult,
    then changes the subject. The event is optional and no urgent decision is needed. Prepare two interpretations
    and a private, low-pressure way to ask what decision or constraint needs clarification.'
  dependencies: []
  safe_alternatives:
  - Use written options, translation, a trusted mutually agreed intermediary or more processing time.
    In legal, medical, sexual or other consent-sensitive situations, required explicit consent and qualified
    communication processes take priority over interpreting indirect signals.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
