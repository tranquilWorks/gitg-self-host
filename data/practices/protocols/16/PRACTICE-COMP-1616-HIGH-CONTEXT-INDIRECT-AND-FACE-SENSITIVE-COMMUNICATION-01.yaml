intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Fictional case: after you propose a group event, an experienced member says That may be difficult,
    then changes the subject. The event is optional and no urgent decision is needed. Prepare two interpretations
    and a private, low-pressure way to ask what decision or constraint needs clarification. Goal: Interpret
    implication, timing, silence, hierarchy and relational context cautiously while making room for disagreement
    or refusal that preserves dignity. Scope: This does not assign a communication style to a nationality
    or diagnose hidden meaning. Indirectness and directness are both context-dependent tools, not ranks
    of honesty. Time and effort: Fifteen minutes for a fictional case and one brief welcome clarification
    or rehearsal. Adaptation: Use written options, translation, a trusted mutually agreed intermediary
    or more processing time. In legal, medical, sexual or other consent-sensitive situations, required
    explicit consent and qualified communication processes take priority over interpreting indirect signals.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written options, translation, a trusted mutually agreed intermediary or more
    processing time. In legal, medical, sexual or other consent-sensitive situations, required explicit
    consent and qualified communication processes take priority over interpreting indirect signals.
  expected_burden: Fifteen minutes for a fictional case and one brief welcome clarification or rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the High-context, indirect, and face-sensitive communication protocol to rank worth, coerce
    participation, demand disclosure, override rest or care, certify competence, or justify decisions
    beyond the recorded context.
  - Treating a completed High-context, indirect, and face-sensitive communication action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written
    options, translation, a trusted mutually agreed intermediary or more processing time. In legal, medical,
    sexual or other consent-sensitive situations, required explicit consent and qualified communication
    processes take priority over interpreting indirect signals.
  actions:
  - stable_id: PRACTICE-COMP-1616-HIGH-CONTEXT-INDIRECT-AND-FACE-SENSITIVE-COMMUNICATION-01-A1
    sequence: 1
    title: List plausible meanings and the context that could distinguish them
    instructions: 'Consider that the answer may express a practical obstacle, a polite refusal, uncertainty,
      a wish to consult others or simply limited time to discuss it. Note who was present, whether the
      person had authority, the timing and what relationship expectations may matter. Do not infer agreement
      from silence or refusal from one phrase alone. Identify what you actually need to know to proceed
      rather than trying to decode the person’s whole inner state.


      Observation checks: Several meanings remain plausible rather than one hidden answer; Timing audience
      hierarchy and relationship are considered; Silence and implication are not treated as automatic
      consent; The needed practical clarification is narrower than mind-reading. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1616-HIGH-CONTEXT-INDIRECT-AND-FACE-SENSITIVE-COMMUNICATION-01
