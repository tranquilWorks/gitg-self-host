meaning_and_fit:
  purpose: Recognize observable pressure, separate it from ordinary disagreement and choose verification,
    a boundary, support or distance appropriate to the risk.
  why_recommended: Recognize observable pressure, separate it from ordinary disagreement and choose verification,
    a boundary, support or distance appropriate to the risk.
  claims:
  - statement: Recognize observable pressure, separate it from ordinary disagreement and choose verification,
      a boundary, support or distance appropriate to the risk.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Manipulation and coercion literacy practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Manipulation and coercion literacy as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use fictional cases only when real relationship material would be unsafe or
    overwhelming. A specialist advocate can help with individualized safety planning; do not surprise
    an unsafe person with a confrontation, threaten exposure or promise that a boundary will end coercion.
  opportunity_considerations: 'Use seven fictional pressure statements: After all I did, you owe me; You
    will regret saying no; That never happened despite the saved agreement; You are perfect, now commit
    immediately; Decide in five minutes or lose everything; Everyone else says you are the problem; I
    gave you a gift so you must agree. Do not collect private evidence about a real person for this exercise.'
  prerequisites:
  - 'Use seven fictional pressure statements: After all I did, you owe me; You will regret saying no;
    That never happened despite the saved agreement; You are perfect, now commit immediately; Decide in
    five minutes or lose everything; Everyone else says you are the problem; I gave you a gift so you
    must agree. Do not collect private evidence about a real person for this exercise.'
  dependencies: []
  safe_alternatives:
  - Use fictional cases only when real relationship material would be unsafe or overwhelming. A specialist
    advocate can help with individualized safety planning; do not surprise an unsafe person with a confrontation,
    threaten exposure or promise that a boundary will end coercion.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Manipulation and coercion literacy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Manipulation and coercion
    literacy as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use seven fictional pressure statements: After all I did, you owe me; You will regret saying
    no; That never happened despite the saved agreement; You are perfect, now commit immediately; Decide
    in five minutes or lose everything; Everyone else says you are the problem; I gave you a gift so you
    must agree. Do not collect private evidence about a real person for this exercise. Goal: Recognize
    observable pressure, separate it from ordinary disagreement and choose verification, a boundary, support
    or distance appropriate to the risk. Scope: This is literacy and safe response rehearsal, not a diagnostic
    checklist or a requirement to confront an abusive person. One phrase alone cannot establish a whole
    relationship pattern. Time and effort: Twenty minutes to examine fictional examples, ten minutes to
    rehearse a response and ten minutes to verify support routes. Adaptation: Use fictional cases only
    when real relationship material would be unsafe or overwhelming. A specialist advocate can help with
    individualized safety planning; do not surprise an unsafe person with a confrontation, threaten exposure
    or promise that a boundary will end coercion. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fictional cases only when real relationship material would be unsafe or overwhelming.
    A specialist advocate can help with individualized safety planning; do not surprise an unsafe person
    with a confrontation, threaten exposure or promise that a boundary will end coercion.
  expected_burden: Twenty minutes to examine fictional examples, ten minutes to rehearse a response and
    ten minutes to verify support routes.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Manipulation and coercion literacy protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Manipulation and coercion literacy action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fictional
    cases only when real relationship material would be unsafe or overwhelming. A specialist advocate
    can help with individualized safety planning; do not surprise an unsafe person with a confrontation,
    threaten exposure or promise that a boundary will end coercion.
  actions:
  - stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01-A1
    sequence: 1
    title: Identify the pressure mechanism and the missing information
    instructions: 'For each statement, identify the possible mechanism: guilt, intimidation, reality denial,
      intense praise tied to commitment, false urgency, triangulation or exploitative reciprocity. Describe
      the observable demand and what makes refusal harder. Then state what remains unknown, including
      context, repetition and whether the person can safely decline. Distinguish a genuine deadline or
      mistaken memory from a conclusion of manipulation; look for evidence and effects rather than applying
      a label as a weapon.


      Observation checks: All seven pressure mechanisms receive a concrete example; The demand and cost
      of refusal are identified; Context pattern and safety remain explicit unknowns; Ordinary error or
      a real deadline is not automatically called abuse. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01
      action_stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01-A1
      competency_stable_id: '16.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1615_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1615_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_seven_pressure_mechanisms_receive_a_concrete_example
        - the_demand_and_cost_of_refusal_are_identified
        - context_pattern_and_safety_remain_explicit_unknowns
        - ordinary_error_or_a_real_deadline_is_not_automatically_called_abuse
      - measurement_id: c1615_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1615_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01-A2
    sequence: 2
    title: Rehearse a response to the safest low-stakes example
    instructions: 'Choose the gift-obligation example for a harmless rehearsal. Say: I appreciate the
      gift, but I did not agree to that commitment; I will decide separately. Practice asking for the
      actual terms or taking time to verify them through an independent source. Repeat with the other
      person declining to clarify, and choose a controlled next action such as not committing rather than
      escalating into an accusation or a debate over their character.


      Observation checks: A low-stakes example is selected rather than a dangerous confrontation; The
      response separates gratitude from an unagreed obligation; Clarification or independent verification
      is requested; Refused clarification leads to a controllable decision rather than escalation. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01
      action_stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01-A2
      competency_stable_id: '16.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1615_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1615_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
