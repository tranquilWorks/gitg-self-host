        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01-A3
    sequence: 3
    title: Create a support route for patterns that exceed the rehearsal
    instructions: 'Identify an appropriate trusted, organizational or specialist support route for threats,
      isolation, coercion, stalking or repeated reality-undermining behavior. Verify how to contact it
      safely in your location and consider whether a monitored device makes written planning risky. Record
      only that the route is available, not sensitive allegations in the application. Immediate danger
      takes priority over gathering more examples; a person does not need a perfect label before seeking
      help.


      Observation checks: Higher-risk patterns are routed beyond ordinary communication practice; The
      support route is verified for the actual location; Device monitoring and safe record-keeping are
      considered; Help is not delayed until a diagnostic label or complete case is assembled. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What observable pressure did you identify, and did your response protect choice without
      depending on proving the other person’s diagnosis or motive?


      Examples: Supportive: The participant separated a gift from an unagreed demand, rehearsed declining
      the commitment and verified a specialist route for threatening patterns.


      Mixed: The examples were recognized, but the first response used an accusation rather than a controllable
      decision and was revised.


      Contradictory: A checklist was used to diagnose someone, justify surveillance or force a confrontation
      in an unsafe relationship.


      Inconclusive: Terms such as gaslighting were memorized without identifying a demand, uncertainty
      or safe response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1615-MANIPULATION-AND-COERCION-LITERACY-01
