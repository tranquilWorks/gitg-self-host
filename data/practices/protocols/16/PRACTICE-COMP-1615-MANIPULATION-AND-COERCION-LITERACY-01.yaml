  title: 16.15 — Recognize pressure and choose a proportionate response
  scored: false
  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [The Principles of Etiquette](https://emilypost.com/advice/the-principles-of-etiquette)

      - [What is emotional abuse?](https://www.thehotline.org/resources/what-is-emotional-abuse/)

      - [What is gaslighting?](https://www.thehotline.org/resources/what-is-gaslighting/)

      - [Technology Safety Plan: A Guide for Survivors and Advocates](https://www.techsafety.org/resources-survivors/technology-safety-plan)

      - [How To Avoid a Scam](https://consumer.ftc.gov/articles/how-avoid-scam)

      - [The logic of indirect speech](https://pubmed.ncbi.nlm.nih.gov/18199841/)

      - [Autobiography of Intercultural Encounters](https://rm.coe.int/autobiography-of-intercultural-encounters/16806bf02d)

      - [Communication Access](https://www.asha.org/practice/communication-access/)

      - [Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [National CLAS Standards](https://thinkculturalhealth.hhs.gov/clas/standards)

      - [Mistakenly Seeking Solitude](https://faculty.haas.berkeley.edu/jschroeder/Publications/Epley&Schroeder2014.pdf)

      - [How many hours does it take to make a friend?](https://journals.sagepub.com/doi/10.1177/0265407518761225)

      - [A new look at social support: a theoretical perspective on thriving through relationships](https://pubmed.ncbi.nlm.nih.gov/25125368/)

      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'All statements below are supplied fiction, not actual participant evidence.


      Ordinary branch: Kim replies, “I won''t explain who said it. Just cover the shift.” The coordinator
      separately confirms that shifts are voluntary and the notebook was unrelated. Kim''s motive remains
      unknown; your lack of availability is unchanged. A proportionate response can end the exchange and
      leave the shift unaccepted. Do not announce that everyone has disproved Kim or recruit the coordinator
      into a personal trial.


      Separate branch, not an escalation you should enact: a person threatens to wait outside your home
      if you refuse and appears to know private messages. The ordinary gift script is no longer the task.
      Seek a safe channel to an appropriate local advocate or trusted support person; in immediate danger,
      use local emergency options when safe. Do not confront, announce evidence collection or assume a
      browser''s private mode prevents monitoring.


      Record which branch applies and why. A planned support contact is not a completed contact, and a
      completed contact does not establish an exit or guarantee safety.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Pressure becomes easier to evaluate when you separate the requested action, the claimed obligation
      and the consequence of refusing. You do not need a personality diagnosis to slow down a low-stakes
      decision or seek support about a threat. Spend twenty minutes on the supplied cases, ten rehearsing
      the ordinary branch and ten verifying a usable support route if a real concern exists. Do not create
      a risky encounter to complete an exercise.


      ### Seven mechanisms, different questions


      The labels below describe possible tactics, not a test that classifies a whole person. The Hotline''s
      emotional-abuse guidance identifies control, threats and affection used for manipulation [S02](https://www.thehotline.org/resources/what-is-emotional-abuse/).
      Its gaslighting resource concerns patterns that undermine confidence in reality [S03](https://www.thehotline.org/resources/what-is-gaslighting/).
      A single memory disagreement does not settle intent or establish that pattern.


      | Supplied fictional statement | What to examine | Proportionate ordinary response |

      | --- | --- | --- |

      | “After all I did, you owe me.” | Guilt makes refusal seem like proof of bad character | Separate
      appreciation from the present request and any actual agreement |

      | “You will regret saying no.” | Intimidation raises a possible cost of refusal | Assess safety
      before replying; a threat can justify support immediately |

      | “That never happened,” despite a saved agreement | Reality denial conflicts with available evidence
      | Check your own safely available record; do not stage a confrontation to prove memory |

      | “You are perfect; now commit immediately.” | Love-bombing can link intense approval to rapid dependence
      | Keep pace and commitment voluntary; praise alone is not proof of manipulation |

      | “Decide in five minutes or lose everything.” | False urgency prevents independent checking | Verify
      the deadline through a trusted route; genuine deadlines also exist |

      | “Everyone else says you are the problem.” | Triangulation recruits absent people''s supposed opinions
      | Ask about the concrete issue, without contacting a crowd to defend yourself |

      | “I gave you a gift, so you must agree.” | Exploitative reciprocity turns an unagreed gift into
      leverage | Check whether an obligation was freely agreed; gratitude does not create unlimited debt
      |


      Mechanisms can overlap. Guilt and a gift demand may occur together. What matters for action is the
      demand, evidence, available refusal and safety, not getting the most labels correct. The FTC''s
      scam guidance treats immediate pressure as a reason to pause and verify independently [S05](https://consumer.ftc.gov/articles/how-avoid-scam);
      that consumer guidance does not diagnose relationships.


      ### Worked example: a real deadline with a real choice


      A coordinator says, “The room booking closes at noon. If you want to join, tell me by then; otherwise
      I''ll book for those already confirmed.” You check the venue''s stated cutoff. You can decline without
      a personal penalty. This is a time constraint, not enough evidence of coercion. By contrast, “If
      you cared about us you would pay now, and don''t ask the venue” adds moral pressure and blocks verification.
      You can withhold a low-stakes commitment without proving that the speaker intended harm.


      Evidence here means what you already know or can safely verify through an independent route. It
      does not mean secretly recording, accessing accounts, baiting a confession or accumulating a case
      file in this application. If documenting a real situation might increase danger, obtain individualized
      advice before changing your recording or device habits.


      ### Your case: a gift becomes a demand


      In this original fictional case, Kim gave you an ordinary notebook last week with no terms attached.
      Today Kim asks you to cover a voluntary two-hour stall shift tomorrow. You are unavailable. Kim
      says, “I gave you that notebook, so you need to do this. Everyone thinks you never help.” No threat,
      stalking, dependence or safety concern is supplied. The shift is optional and another coordinator
      handles staffing. You are not required to find a substitute.


      1. **Describe the pressure without a verdict.** Write the requested shift, the claimed gift obligation,
      the absent-group claim and your actual availability. Mark unknown whether anyone else said this
      and whether Kim routinely responds this way. Identify exploitative reciprocity and possible triangulation
      as mechanisms in the words, not diagnoses. Output: four factual lines and one uncertainty.

      2. **Choose clarification and a controlled boundary.** Rehearse: “Thank you for the notebook. I
      didn''t agree to a shift in exchange, and I''m unavailable tomorrow.” You may ask for concrete staffing
      information through the coordinator if useful. Do not debate your whole history of generosity. Output:
      a reply that states your decision without threatening or demanding an apology.

      3. **Use the [later packet](?resource=file-later-packet-md).** Revise when clarification is refused.
      A boundary controls your commitment; it cannot force Kim to understand or stop pressing. Output:
      the next action you can carry out and what remains unresolved.

      4. **Choose the correct safety branch.** Reconsider the response if new facts include threats, monitoring,
      isolation or retaliation. End the confrontation rehearsal. Verify an appropriate local specialist
      or trusted support route using a device and channel safe for you. Output: route availability and
      a safe next step, never identifying allegations in a practice log.


      ### Support is not a reward for proving the label


      For real danger or credible threat, use local emergency help if safe and appropriate; do not wait
      to finish seven examples. For continuing coercion, an advocate can help consider options and individualized
      safety planning [S04](https://www.techsafety.org/resources-survivors/technology-safety-plan). Digital
      activity may be monitored; private browsing or clearing history is not a guarantee. Avoid abrupt
      device changes as a universal instruction. The cited services are US resources; verify availability,
      language, accessibility and safe contact arrangements where you are.


      For support with the ordinary practice, write the reply rather than delivering it and have a willing
      reader check whether it states a genuine choice. That tests wording only. A harder safe case mixes
      genuine past assistance with an unrelated demand: acknowledge the assistance while checking whether
      this new commitment was ever agreed. For transfer, use an existing low-stakes pressure situation
      only when safe, record your own action minimally and review whether you preserved choice. A refused
      clarification is still useful information; it is not proof that a relationship is now safe. Finish
      with the [fresh cases](?attempt=practice-checks).'
