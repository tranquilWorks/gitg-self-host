        - the_response_separates_gratitude_from_an_unagreed_obligation
        - clarification_or_independent_verification_is_requested
        - refused_clarification_leads_to_a_controllable_decision_rather_than_escalation
      - measurement_id: c1615_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1615_a2_adverse
        kind: boolean
