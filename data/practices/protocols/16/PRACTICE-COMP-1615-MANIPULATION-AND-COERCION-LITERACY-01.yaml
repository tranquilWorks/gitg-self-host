  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Manipulation and coercion literacy; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use fictional cases only when real relationship material would be unsafe or overwhelming. A specialist
      advocate can help with individualized safety planning; do not surprise an unsafe person with a confrontation,
      threaten exposure or promise that a boundary will end coercion.
    cultural_context:
    - Adapt the expression of Manipulation and coercion literacy to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use fictional cases only when real relationship material would be unsafe or overwhelming. A specialist
      advocate can help with individualized safety planning; do not surprise an unsafe person with a confrontation,
      threaten exposure or promise that a boundary will end coercion.
  pause_conditions:
  - Pause Manipulation and coercion literacy when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Manipulation and coercion literacy practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Manipulation and coercion literacy situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
