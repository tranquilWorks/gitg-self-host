meaning_and_fit:
  purpose: Structure, rehearse and deliver a short talk, respond honestly to a question and revise a specific
    weakness observed by an audience.
  why_recommended: Structure, rehearse and deliver a short talk, respond honestly to a question and revise
    a specific weakness observed by an audience.
  claims:
  - statement: Structure, rehearse and deliver a short talk, respond honestly to a question and revise
      a specific weakness observed by an audience.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Public speaking and presentation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Public speaking and presentation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use seated delivery, captions, AAC, a recorded or asynchronous talk and additional
    processing time. No eye-contact quota or memorization requirement applies. A solo rehearsal remains
    preparation when no audience is available.
  opportunity_considerations: 'Default topic: how a shared borrowing shelf works. The audience needs to
    know where items go, how returns are recorded and whom to ask about a missing item. Use no more than
    one page or three simple slides, with essential information available as text or spoken description.'
  prerequisites:
  - 'Default topic: how a shared borrowing shelf works. The audience needs to know where items go, how
    returns are recorded and whom to ask about a missing item. Use no more than one page or three simple
    slides, with essential information available as text or spoken description.'
  dependencies: []
  safe_alternatives:
  - Use seated delivery, captions, AAC, a recorded or asynchronous talk and additional processing time.
    No eye-contact quota or memorization requirement applies. A solo rehearsal remains preparation when
    no audience is available.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Public speaking and presentation differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Public speaking and presentation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default topic: how a shared borrowing shelf works. The audience needs to know where items go,
    how returns are recorded and whom to ask about a missing item. Use no more than one page or three
    simple slides, with essential information available as text or spoken description. Goal: Structure,
    rehearse and deliver a short talk, respond honestly to a question and revise a specific weakness observed
    by an audience. Scope: This is a small voluntary presentation, not a public-performance requirement
    or proof of broad speaking confidence. The audience may be one willing person. Time and effort: Twenty
    minutes to prepare, two three-minute rehearsals, a short delivery and a ten-minute revision. Adaptation:
    Use seated delivery, captions, AAC, a recorded or asynchronous talk and additional processing time.
    No eye-contact quota or memorization requirement applies. A solo rehearsal remains preparation when
    no audience is available. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use seated delivery, captions, AAC, a recorded or asynchronous talk and additional
    processing time. No eye-contact quota or memorization requirement applies. A solo rehearsal remains
    preparation when no audience is available.
  expected_burden: Twenty minutes to prepare, two three-minute rehearsals, a short delivery and a ten-minute
    revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Public speaking and presentation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Public speaking and presentation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use seated
    delivery, captions, AAC, a recorded or asynchronous talk and additional processing time. No eye-contact
    quota or memorization requirement applies. A solo rehearsal remains preparation when no audience is
    available.
  actions:
  - stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01-A1
    sequence: 1
    title: Build a talk around one audience action
    instructions: 'Write the sentence you want the audience to be able to act on: Borrow freely within
      the agreed rules and return items to the labeled shelf. Organize three parts—why the system exists,
      the borrowing and return sequence, and what to do when something is missing. Add one concrete example
      and remove facts that do not serve this purpose. Plan an opening and a closing rather than reading
      a list until time runs out.


      Observation checks: One intended audience action guides the structure; The talk has a clear opening
      sequence and closing; A concrete example explains the process; Unnecessary material is removed rather
      than spoken faster. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01
      action_stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01-A1
      competency_stable_id: '16.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1609_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1609_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_intended_audience_action_guides_the_structure
        - the_talk_has_a_clear_opening_sequence_and_closing
        - a_concrete_example_explains_the_process
        - unnecessary_material_is_removed_rather_than_spoken_faster
      - measurement_id: c1609_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
