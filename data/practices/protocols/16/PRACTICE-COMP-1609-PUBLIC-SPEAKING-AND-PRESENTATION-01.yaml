      No eye-contact quota or memorization requirement applies. A solo rehearsal remains preparation when
      no audience is available.
    cultural_context:
    - Adapt the expression of Public speaking and presentation to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use seated delivery, captions, AAC, a recorded or asynchronous talk and additional processing time.
      No eye-contact quota or memorization requirement applies. A solo rehearsal remains preparation when
      no audience is available.
  pause_conditions:
  - Pause Public speaking and presentation when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Public speaking and presentation practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
