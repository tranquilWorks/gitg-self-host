  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fictional response: “I write the item code before borrowing. When finished I put it
      directly on the green-labeled shelf. If it is missing I ask Neri in the group thread.”


      The borrowing and help route are represented correctly, but the return location is wrong. Revise
      and redeliver the return section with an explicit contrast between taking from the shelf and returning
      to the RETURNS tray. Include marking the return column. Do not spend the revision on a more entertaining
      opening while leaving the failed step untouched.


      The fictional listener then asks, “Does contacting Neri mean I automatically get another week?”
      Answer no automatic extension is specified; contact begins arranging a new plan. Do not invent a
      seven-day entitlement. A second fictional explanation gets the tray right but omits the log update.
      Preserve that residual gap and repair/recheck it if a reader is available. Do not label the whole
      process mastered.


      These outcomes are supplied for diagnosis. They do not substitute for two actual rehearsals, actual
      delivery or actual audience evidence.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'A presentation succeeds at its purpose when an audience can follow the intended idea or action,
      including the part that was initially unclear. Slides, rehearsal time and reduced nerves are useful
      inputs, not evidence of comprehension. Here you prepare a three-minute explanation of a fictional
      borrowing shelf, rehearse twice, deliver to a willing audience and revise one observed weakness.
      Allow twenty minutes to prepare, two actual three-minute rehearsals, delivery and ten minutes to
      repair a section.


      ### Structure around the audience''s next action


      Choose one purpose: a first-time user should know how to borrow and return an item and where to
      ask when something is missing. Begin by giving a reason to care, then explain the sequence with
      a concrete example, and close by restating the action and help route. Transitions tell the audience
      why the next part follows. A list of details without those connections can be accurate but hard
      to use.


      MIT''s presentation guidance treats rehearsal as a way to revise content and transitions, not simply
      memorize a script [S11](https://mitcommlab.mit.edu/nse/commkit/delivery-and-qa/). W3C''s event guidance
      supports accessible advance material and conveying essential information beyond a single sensory
      channel [S07](https://www.w3.org/WAI/teach-advocate/accessible-presentations/). This companion does
      not require standing, eye contact, a particular accent, a loud expressive style or unaided speech.
      Composure includes pausing, using notes and saying when an answer must be checked.


      Audience adaptation during delivery can mean slowing at a confusing step, describing a visual, accepting
      a written question or shortening an aside. Do not infer understanding from nods. You need an actual
      response to a task, such as the listener explaining where a returned item goes. A question can reveal
      a missing assumption rather than a weakness in the questioner.


      ### Worked example: an unclear return step


      A speaker says, “Put it back where you found it and update the card.” In rehearsal they realize
      the return area is different from the borrowing shelf. They revise: “Place returned items in the
      tray labeled RETURNS, then mark the return column on your borrowing row. A steward will put the
      item back on the shelf.” The transition now explains why the tray exists: it gives the steward a
      chance to check the item.


      During delivery, a listener asks whether damaged items also go in that tray. If the rules do not
      specify a damage process, a composed answer is, “That isn''t covered on this card; please check
      with the steward before returning a damaged item.” Inventing a fine or repair policy to sound decisive
      would undermine the explanation. The example is a rehearsal model, not an actual audience result.


      ### Your complete fictional shelf rules


      Only items with a green BORROW label may be borrowed. Read the item''s own use instructions; this
      practice teaches the shelf process, not safe operation of equipment. Before taking an item, write
      the item code, your chosen borrower label and planned return day on the paper log. Do not add private
      contact details. Return it to the RETURNS tray and mark the return column. Steward Neri checks the
      tray and puts items back. If an item is missing, ask Neri through the existing group message thread.
      If you cannot return it on the planned day, contact Neri to discuss a new plan; no extension is
      automatic. The rules specify no fine, damage procedure or ability to reserve an item.


      Use one page or at most three simple slides. No slide file or public upload is necessary. Keep essential
      instructions available as text or spoken/signed description as appropriate. The audience may be
      one willing person. If none is available, complete preparation and mark audience delivery and response
      unattempted.


      1. **Build the three-minute route.** Write the intended audience action, an opening, the borrowing/return
      sequence, a missing-item route and a close. Include a concrete green-labeled item example. Remove
      details that do not serve the action. Output: a complete outline or script and any accessible support
      page.

      2. **Rehearse twice in the actual delivery form.** On pass one, record the actual duration and where
      sequence or timing breaks. On pass two, edit excess material rather than accelerating everything,
      describe essential visuals and pause after a key instruction. Insert “What if I cannot return it
      on time?” and answer from the supplied rules. Output: two actual rehearsal durations, a change between
      them and an uncertainty response. Imagining delivery is not a timed rehearsal.

      3. **Deliver and hear a question.** With consent, present to the audience and invite a question
      through their usable channel. Let the question finish, clarify if necessary, then answer within
      the known rules. Do not record anyone without agreement. Output: delivery status and an actual question/response,
      or explicit pending status.

      4. **Test and repair comprehension.** Ask the listener to explain borrowing, return location and
      missing-item help in their own words before you supply the answer. Identify one observed weakness,
      revise that section and redeliver it. Then open the [later packet](?resource=file-later-packet-md)
      for the separate fictional outcome. Output: audience response, targeted repair and retest result
      or remaining gap.


      ### Transfer the method, not a performance ideal


      For support, use seated delivery, notes, AAC, captions, interpretation, recorded/asynchronous delivery
      or a longer response window. An asynchronous audience must actually access and respond before it
      supplies audience evidence. The three-minute target is a practice constraint, not a universal pace
      requirement; agree a reasonable accommodation and record it. Do not penalize the access support
      as evidence of poor speaking.


      For a harder attempt, the visual aid fails. Explain the route from your outline and offer the essential
      text afterward in a usable way. Alternatively, handle a question whose answer is genuinely absent
      from the rules. State the limit, name who can verify it and keep the unresolved answer visible instead
      of filling the silence with invented policy.


      For real transfer, explain one harmless process you understand and are authorized to describe. Verify
      its current rules, rehearse, deliver and ask for a task-based account. Compare the same section
      before and after revision. Your improved confidence may matter to you, but the separate question
      is what the audience could understand and use. The [fresh checks](?attempt=practice-checks) help
      keep those outcomes separate.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A talk must fit roughly four minutes. Your rehearsal takes six. Why might speaking 50% faster
      be a poor first repair, and what should you change instead?

      2. A listener applauds but explains the steps in the wrong order. What evidence should guide the
      next revision?

      3. During Q&A you are asked about a policy absent from your source. Give a composed response and
      state what remains unresolved afterward.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Compressing the same material into less time can damage comprehension and access. Identify
      the audience''s essential action, remove nonessential content, strengthen transitions and rehearse
      the edited version. If accommodation requires more time, agree and record that separately; the numerical
      target is not proof of delivery quality.

      2. Use the actual sequencing error to revise the relevant transition or example, then ask for another
      uncoached account. Applause shows a reaction, not correct procedural understanding. Do not redesign
      a successful section merely because it is easier to polish.

      3. For example: “That policy isn''t in the material I verified. I need to check with the responsible
      organizer before giving you an answer.” Clarify the question and use an authorized follow-up route
      if available. The answer remains pending until actually verified; confidence cannot fill the gap.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
