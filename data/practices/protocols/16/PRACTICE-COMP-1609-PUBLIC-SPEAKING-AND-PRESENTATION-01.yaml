  - stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01-A3
    sequence: 3
    title: Deliver to a willing audience and revise one observed problem
    instructions: 'Give the talk to a willing person or small group and invite one question. Ask them
      afterward to explain the borrowing sequence and missing-item route. Use their actual response to
      identify one unclear transition, omitted fact or pacing issue, then revise and redeliver that section.
      Audience politeness or your own reduced nervousness is not sufficient evidence that the instructions
      were understood.


      Observation checks: A willing audience hears the actual talk; A question is handled without inventing
      information; Comprehension is checked through the audience’s explanation; One observed weakness
      is revised and redelivered. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What did the audience actually misunderstand, and how did your revision change the
      explanation rather than merely make you feel more polished?


      Examples: Supportive: The audience understood borrowing but missed the late-return route, so the
      speaker added that step and successfully retested the explanation.


      Mixed: Timing improved in rehearsal, but no audience delivery occurred and audience response remained
      untested.


      Contradictory: The speaker hid uncertainty with an invented rule or required an unwilling person
      to serve as an audience.


      Inconclusive: Slides were completed but the talk was never spoken or checked for comprehension.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01
