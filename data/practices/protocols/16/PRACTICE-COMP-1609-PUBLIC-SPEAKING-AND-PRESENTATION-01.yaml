        expected: true
  - stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01-A2
    sequence: 2
    title: Rehearse timing access and a likely interruption
    instructions: 'Deliver the talk twice to an empty room, recording only if you choose and can keep
      it private. On the first pass, check whether the sequence fits roughly three minutes without rushing.
      On the second, practice describing any visual and pausing after a key instruction. Insert the sample
      question What happens if I cannot return it on time? Answer from the agreed rules or state what
      must be checked; do not invent a policy to appear composed.


      Observation checks: Two actual rehearsals occur; Timing is adjusted by editing rather than rushing;
      Visual information is also conveyed accessibly; An uncertain question receives an honest check-needed
      response. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01
      action_stable_id: PRACTICE-COMP-1609-PUBLIC-SPEAKING-AND-PRESENTATION-01-A2
      competency_stable_id: '16.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1609_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1609_a2_primary
        kind: artifact
        role: primary
        weight: '1'
