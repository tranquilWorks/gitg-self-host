  - stable_id: PRACTICE-COMP-1617-INTERCULTURAL-COMMUNICATION-AND-CODE-SWITCHING-01-A3
    sequence: 3
    title: Review effectiveness, integrity and the cost of adaptation
    instructions: 'Compare what the recipient understood with your intended proposal. Name exactly what
      you changed, what boundary you retained and whether the adaptation imposed excessive effort or concealed
      disagreement. Revise one practical mismatch, such as allowing a longer response window, while retaining
      the person’s right to decline. A fictional comparison demonstrates design reasoning only, not successful
      cross-cultural participation.


      Observation checks: Understanding is checked rather than inferred from politeness; Changed features
      and retained boundaries are named separately; The effort and possible concealment costs are considered;
      A practical mismatch is revised without erasing integrity. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which adaptation improved mutual understanding, and where would further adaptation
      have crossed from flexibility into dishonesty or self-erasure?


      Examples: Supportive: The committee received a clear agenda item with consultation time while the
      peer group received a short message; both understood the voluntary nature of the orientation.


      Mixed: The format fit better, but the writer initially concealed a disagreement to appear polite
      and later stated it respectfully.


      Contradictory: A person’s culture was caricatured or adaptation was used to hide a material condition
      from the audience.


      Inconclusive: Different greetings were used without examining authority, privacy, timing or actual
      comprehension.'
    expected_time: 15-25 minutes
    due_within_days: 10
