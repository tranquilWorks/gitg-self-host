  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [The Principles of Etiquette](https://emilypost.com/advice/the-principles-of-etiquette)

      - [What is emotional abuse?](https://www.thehotline.org/resources/what-is-emotional-abuse/)

      - [What is gaslighting?](https://www.thehotline.org/resources/what-is-gaslighting/)

      - [Technology Safety Plan: A Guide for Survivors and Advocates](https://www.techsafety.org/resources-survivors/technology-safety-plan)

      - [How To Avoid a Scam](https://consumer.ftc.gov/articles/how-avoid-scam)

      - [The logic of indirect speech](https://pubmed.ncbi.nlm.nih.gov/18199841/)

      - [Autobiography of Intercultural Encounters](https://rm.coe.int/autobiography-of-intercultural-encounters/16806bf02d)

      - [Communication Access](https://www.asha.org/practice/communication-access/)

      - [Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [National CLAS Standards](https://thinkculturalhealth.hhs.gov/clas/standards)

      - [Mistakenly Seeking Solitude](https://faculty.haas.berkeley.edu/jschroeder/Publications/Epley&Schroeder2014.pdf)

      - [How many hours does it take to make a friend?](https://journals.sagepub.com/doi/10.1177/0265407518761225)

      - [A new look at social support: a theoretical perspective on thriving through relationships](https://pubmed.ncbi.nlm.nih.gov/25125368/)

      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The peer reader accurately reports that attendance is free, optional and does not commit anyone
      to volunteering. They ask whether “twelve places” means they can promise places to twelve friends.
      It does not: requests still go to the organizer and no places have yet been confirmed.


      The committee secretary says the next discussion is Wednesday 11 November, one day after the reply
      date. They propose sending all members'' private phone numbers to you for faster decisions. They
      have not obtained permission. The room''s availability beyond the present booking is unknown.


      Keep the contact boundary and acknowledge the timing conflict. You may ask whether members can opt
      in through an authorized channel before Tuesday, or agree a different date only after checking feasibility.
      Do not say the deadline has moved, a second session exists or the committee has approved attendance.
      A respectful format alone has not resolved the scheduling problem.


      Identify one accurate comprehension result, one remaining misunderstanding and one process issue.
      The supplied replies cannot count as an actual cross-cultural encounter.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Communicating across groups often requires changing the pace, channel or degree of formality.
      Integrity requires that the actual offer and its limits remain true in every version. In this practice,
      prepare two messages about the same voluntary activity, identify the local preferences behind each
      adaptation, and check whether a willing recipient understands the choice. Allow twenty minutes for
      drafting, a brief comprehension check and ten minutes for revision.


      ### Learn a local practice rather than assigning a cultural type


      A cultural encounter can occur between organizations, generations, regions or communities within
      one country. The Council of Europe''s Autobiography uses reflection on a particular encounter [S07](https://rm.coe.int/autobiography-of-intercultural-encounters/16806bf02d).
      That focus helps keep an account tied to people and events rather than treating an imagined national
      character as evidence. This companion uses original cases; it does not reproduce the Autobiography''s
      questionnaire or claim to validate intercultural competence.


      Consider seven dimensions as questions. **Directness:** is a request preferred early or after context?
      **Hierarchy:** who can decide, advise or circulate an idea? **Turn-taking:** do people speak freely,
      wait for a chair or use a written queue? **Emotion:** what expression is welcome, and what might
      remain private? **Time:** which deadlines are fixed and which consultation intervals are needed?
      **Privacy:** who may receive names or contact details? **Formality:** which greeting, title and
      document structure fit the stated situation?


      These are not opposite ends of a national ranking. A person may prefer formal writing for committee
      business and informal conversation elsewhere. What you observed once may not generalize. Check a
      consequential unknown with a practical question: “Should I send this to the chair for the agenda,
      or is direct circulation welcome?” Do not ask a person to speak for an entire ethnicity or infer
      values from accent.


      Code-switching can describe changes in language or register across settings. It may be useful, costly,
      welcome or imposed. The task does not require imitating an accent, concealing identity, suppressing
      a legitimate disagreement or tolerating discrimination. A fair adjustment can also be mutual: the
      group may provide an agenda, permit written contributions or explain unfamiliar procedures.


      ### Worked example: the same invitation has two entry points


      An informal peer group wants the request first: “Would you like an optional one-hour orientation?”
      A committee asks for a short purpose statement followed by an agenda item. The committee version
      can add that structure without claiming that attendance is mandatory or endorsed by the chair. Both
      versions must retain the same time, cost, consent and privacy limits.


      A poor adaptation hides “optional” because a formal invitation supposedly sounds stronger. Another
      poor adaptation says “everyone''s already keen” to fit a friendly tone. Both distort the decision.
      Better adaptation makes the same real choice easier to consider. Effectiveness includes being understood
      well enough to decline.


      ### Your case: one orientation, two groups


      All facts are fictional. You are offering a free one-hour volunteer orientation on Saturday 14 November,
      10:00–11:00, in Room D, with a written overview available by request. Attendance is optional and
      creates no commitment to volunteer. The room has twelve places. Reply to you by Tuesday 10 November
      at 18:00; if more than twelve people request places, you will ask about a second session before
      promising one. Private contact details may not be forwarded without each person''s permission.


      Peer group: its organizer has asked for a short group-chat message, plain greeting and direct question.
      Committee: its secretary has requested a titled note for the agenda, sent through the secretary;
      members need time to discuss before replying. No preferred emotional tone, title for individuals
      or turn-taking norm beyond this is known. Neither group has agreed to attend.


      1. **Build an adaptation record.** For each of the seven dimensions, mark known preference, unknown
      or fixed constraint. Distinguish the secretary''s circulation role from power to consent for members.
      Ask how a reply can be gathered before the stated cutoff if consultation time is uncertain. Output:
      seven short entries, without invented cultural labels.

      2. **Draft both versions.** Put the peer question near the start. Give the committee a purpose,
      facts and requested decision in its agreed channel. Preserve all material facts, including the capacity
      limit and unconfirmed second session. Output: two usable invitations, not just advice to be culturally
      sensitive.

      3. **Check meaning and format separately.** Ask a willing reader what attendance commits them to,
      when to reply and whether they may forward private contacts. Then ask whether the format fits their
      actual process. A suggestion about form is not authorization to change the offer. Output: a comprehension
      account, a format preference and what remains untested.

      4. **Open the [later packet](?resource=file-later-packet-md).** Respond to the consultation obstacle
      and contact-sharing suggestion without pretending either is already resolved. Output: a revised
      process with an explicit unchanged boundary.


      ### Review the cost as well as the success


      After a real exchange, name what you changed and what you held constant. Did the adaptation clarify
      the decision? Did it require hiding uncertainty or imply agreement that did not exist? Who did the
      extra work? A recipient can understand accurately while disliking the proposal; that is not a communication
      failure by itself.


      For support, compare two written versions side by side and highlight time, cost, obligation and
      privacy. Use an interpreter or an informed willing reader when needed, agreeing confidentiality
      before sharing material. Their judgment concerns this situation, not an entire culture. If no reader
      is available, mark the work as drafting and self-audit, not demonstrated intercultural effectiveness.


      For a harder case, the usual local practice conflicts with a boundary: “We always publish everyone''s
      number.” Explain the legitimate purpose, offer an opt-in contact route and seek a process that respects
      choice. You need not adopt a harmful custom to count as adaptable. If discrimination or a power
      imbalance makes the exchange unsafe, use appropriate organizational support or another route rather
      than escalating a performance exercise.


      For transfer, choose a real welcome interaction across a difference in communication practice, record
      the recipient''s actual interpretation and review one revision. Do not manufacture an encounter
      with someone selected only to represent a category. Finish the [fresh checks](?attempt=practice-checks)
      by defending both an adaptation and a limit.'
