  - stable_id: PRACTICE-COMP-1617-INTERCULTURAL-COMMUNICATION-AND-CODE-SWITCHING-01-A2
    sequence: 2
    title: Communicate the same proposal in the context’s workable form
    instructions: 'Prepare a brief peer-group message and a committee version with the decision requested,
      agenda context and consultation time. Adjust greeting, level of detail and turn-taking expectations
      without inventing endorsement or hiding that attendance is optional. In a real willing exchange,
      use the appropriate version and ask whether the format gives people what they need to respond. Do
      not copy an accent or perform an identity as a substitute for respectful adaptation.


      Observation checks: The same substantive proposal appears in both versions; Form timing and detail
      are adapted to the decision process; Voluntary participation and privacy remain unchanged; The actual
      recipient can comment on the communication format. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
