    title: Compare your responses
    body: '1. It removes a decision-relevant limit and is a material change. Restore voluntariness in
      a form that fits the document. Formal tone does not authorize a false obligation.

      2. No. Record that person''s stated preference for this interaction, then verify in a new setting.
      A useful local observation becomes a stereotype when projected onto everyone in a category.

      3. Ask for an opt-in contact channel or an authorized intermediary, and explain the privacy boundary.
      Check that the route permits timely replies. Do not forward details first and seek retrospective
      permission, or promise an unverified alternative.


      ### Changed-case answer


      Make the privacy and publication conditions explicit, allow a name-only or task-focused introduction
      and a pass, and obtain permission for what enters public notes. Voluntary speaking does not authorize
      publication of every detail. Ask about needed process changes without attributing the request to
      a nationality or universal cultural rule.'
