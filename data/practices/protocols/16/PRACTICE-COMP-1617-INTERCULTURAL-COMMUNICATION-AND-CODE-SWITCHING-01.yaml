meaning_and_fit:
  purpose: Communicate across differing norms of directness, hierarchy, turn-taking, emotion, time, privacy
    and formality without falsifying your position or demanding assimilation.
  why_recommended: Communicate across differing norms of directness, hierarchy, turn-taking, emotion,
    time, privacy and formality without falsifying your position or demanding assimilation.
  claims:
  - statement: Communicate across differing norms of directness, hierarchy, turn-taking, emotion, time,
      privacy and formality without falsifying your position or demanding assimilation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Intercultural communication and code-switching practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Intercultural communication and code-switching as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use interpreters, written follow-up or a mutually acceptable facilitator.
    Code-switching may be burdensome and is not an obligation to hide identity or tolerate discrimination.
    If the setting demands harmful concealment or coercion, seek support or another route rather than
    perfecting the performance.
  opportunity_considerations: 'Default comparison: a casual peer group plans by quick informal messages,
    while a community committee prefers an agenda and time to consult before agreeing. The same proposal
    is a one-hour volunteer orientation. Your fixed boundary is that attendance remains voluntary and
    no private contact details are shared without permission.'
  prerequisites:
  - 'Default comparison: a casual peer group plans by quick informal messages, while a community committee
    prefers an agenda and time to consult before agreeing. The same proposal is a one-hour volunteer orientation.
    Your fixed boundary is that attendance remains voluntary and no private contact details are shared
    without permission.'
  dependencies: []
  safe_alternatives:
  - Use interpreters, written follow-up or a mutually acceptable facilitator. Code-switching may be burdensome
    and is not an obligation to hide identity or tolerate discrimination. If the setting demands harmful
    concealment or coercion, seek support or another route rather than perfecting the performance.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Intercultural communication and code-switching differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Intercultural communication
    and code-switching as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default comparison: a casual peer group plans by quick informal messages, while a community
    committee prefers an agenda and time to consult before agreeing. The same proposal is a one-hour volunteer
    orientation. Your fixed boundary is that attendance remains voluntary and no private contact details
    are shared without permission. Goal: Communicate across differing norms of directness, hierarchy,
    turn-taking, emotion, time, privacy and formality without falsifying your position or demanding assimilation.
    Scope: Use an actual willing cross-context exchange or a fictional comparison. Do not treat a person
    as a representative of an entire culture or make them responsible for educating you. Time and effort:
    Fifteen minutes to compare contexts, one short exchange and ten minutes to review what changed. Adaptation:
    Use interpreters, written follow-up or a mutually acceptable facilitator. Code-switching may be burdensome
    and is not an obligation to hide identity or tolerate discrimination. If the setting demands harmful
    concealment or coercion, seek support or another route rather than perfecting the performance. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use interpreters, written follow-up or a mutually acceptable facilitator. Code-switching
    may be burdensome and is not an obligation to hide identity or tolerate discrimination. If the setting
    demands harmful concealment or coercion, seek support or another route rather than perfecting the
    performance.
  expected_burden: Fifteen minutes to compare contexts, one short exchange and ten minutes to review what
    changed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Intercultural communication and code-switching protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Intercultural communication and code-switching action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use interpreters,
    written follow-up or a mutually acceptable facilitator. Code-switching may be burdensome and is not
    an obligation to hide identity or tolerate discrimination. If the setting demands harmful concealment
    or coercion, seek support or another route rather than perfecting the performance.
  actions:
  - stable_id: PRACTICE-COMP-1617-INTERCULTURAL-COMMUNICATION-AND-CODE-SWITCHING-01-A1
    sequence: 1
    title: Compare the interaction norms without ranking the people
    instructions: 'For each context, note what you know about directness, decision authority, turn-taking,
      emotional expression, timing, privacy and formality. Mark unknowns and check the most consequential
      one through a public guide, organizer or willing participant. Distinguish observed local practice
      from a claim about a whole nationality or age group. Identify the core facts and ethical boundary
      that must remain unchanged across versions.


      Observation checks: Seven communication dimensions are considered explicitly; Observed norms are
      separated from group stereotypes; A consequential unknown is checked respectfully; Core facts and
      a nonnegotiable ethical boundary are fixed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1617-INTERCULTURAL-COMMUNICATION-AND-CODE-SWITCHING-01
      action_stable_id: PRACTICE-COMP-1617-INTERCULTURAL-COMMUNICATION-AND-CODE-SWITCHING-01-A1
      competency_stable_id: '16.17'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
