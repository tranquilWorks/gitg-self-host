meaning_and_fit:
  purpose: Identify interests, constraints, alternatives and fair trades before proposing an agreement,
    and distinguish a principled refusal from reactive bargaining.
  why_recommended: Identify interests, constraints, alternatives and fair trades before proposing an agreement,
    and distinguish a principled refusal from reactive bargaining.
  claims:
  - statement: Identify interests, constraints, alternatives and fair trades before proposing an agreement,
      and distinguish a principled refusal from reactive bargaining.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Negotiation practice fit the person's current role,
    pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Negotiation as not applicable, consciously unchosen, or deferred without
    penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use written proposals, more processing time or a neutral facilitator for a
    safe voluntary case. Where rights, livelihood, legal obligations or coercion are involved, use qualified
    advice and the appropriate formal process instead of this exercise.
  opportunity_considerations: 'Default case: two friends want to share a hobby space for two hours; one
    needs quiet preparation time and the other wants company while working. Each has the option to work
    separately. Use a real willing discussion or assign the fictional roles without money or binding commitments.'
  prerequisites:
  - 'Default case: two friends want to share a hobby space for two hours; one needs quiet preparation
    time and the other wants company while working. Each has the option to work separately. Use a real
    willing discussion or assign the fictional roles without money or binding commitments.'
  dependencies: []
  safe_alternatives:
  - Use written proposals, more processing time or a neutral facilitator for a safe voluntary case. Where
    rights, livelihood, legal obligations or coercion are involved, use qualified advice and the appropriate
    formal process instead of this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Negotiation differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Negotiation as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: two friends want to share a hobby space for two hours; one needs quiet preparation
    time and the other wants company while working. Each has the option to work separately. Use a real
    willing discussion or assign the fictional roles without money or binding commitments. Goal: Identify
    interests, constraints, alternatives and fair trades before proposing an agreement, and distinguish
    a principled refusal from reactive bargaining. Scope: Use a low-stakes voluntary arrangement, not
    legal settlement, employment leverage, essential care, housing, debt collection or a power-imbalanced
    dispute. Time and effort: Fifteen minutes to prepare, a fifteen-minute conversation or role-play and
    a ten-minute written recap. Adaptation: Use written proposals, more processing time or a neutral facilitator
    for a safe voluntary case. Where rights, livelihood, legal obligations or coercion are involved, use
    qualified advice and the appropriate formal process instead of this exercise. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written proposals, more processing time or a neutral facilitator for a safe
    voluntary case. Where rights, livelihood, legal obligations or coercion are involved, use qualified
    advice and the appropriate formal process instead of this exercise.
  expected_burden: Fifteen minutes to prepare, a fifteen-minute conversation or role-play and a ten-minute
    written recap.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Negotiation protocol to rank worth, coerce participation, demand disclosure, override rest
    or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Negotiation action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written
    proposals, more processing time or a neutral facilitator for a safe voluntary case. Where rights,
    livelihood, legal obligations or coercion are involved, use qualified advice and the appropriate formal
    process instead of this exercise.
  actions:
  - stable_id: PRACTICE-COMP-1611-NEGOTIATION-01-A1
    sequence: 1
    title: Separate positions from interests and alternatives
    instructions: 'Write your preferred arrangement, the need behind it, actual time or access constraints
      and what you will do if no agreement is reached. Imagine at least two possible interests on the
      other side but keep them tentative until asked. Identify a fair reference such as equal usable time
      or alternating the preferred period, and name any leverage you should not exploit, including dependency
      or private information. Set a walk-away condition before the discussion.


      Observation checks: Position interest constraint and alternative are separate; The other person’s
      interests remain hypotheses until checked; A fair reference and an unacceptable leverage tactic
      are named; A genuine walk-away condition exists before bargaining. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1611-NEGOTIATION-01
      action_stable_id: PRACTICE-COMP-1611-NEGOTIATION-01-A1
      competency_stable_id: '16.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1611_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1611_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - position_interest_constraint_and_alternative_are_separate
        - the_other_person_s_interests_remain_hypotheses_until_checked
        - a_fair_reference_and_an_unacceptable_leverage_tactic_are_named
        - a_genuine_walk_away_condition_exists_before_bargaining
      - measurement_id: c1611_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1611_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1611-NEGOTIATION-01-A2
    sequence: 2
    title: Ask, propose a trade and preserve the option to decline
    instructions: 'Ask what matters most to the other person and reflect it back. Offer a specific package,
      such as thirty minutes of quiet preparation followed by ninety minutes of shared work, with an agreed
      signal for interruptions. Explain what each person gains and gives up. Invite a counterproposal
      and consider a second package rather than splitting every issue mechanically. Do not imply that
      friendship requires accepting your terms.


      Observation checks: The other person’s stated interests inform the proposal; The package specifies
      time conditions and responsibilities; Gains and concessions on both sides are explicit; A counterproposal
      or refusal remains socially safe. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1611-NEGOTIATION-01
      action_stable_id: PRACTICE-COMP-1611-NEGOTIATION-01-A2
      competency_stable_id: '16.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1611_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1611_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
