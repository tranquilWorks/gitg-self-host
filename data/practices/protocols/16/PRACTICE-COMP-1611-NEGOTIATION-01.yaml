  - id: file-later-packet-md
    title: Later packet
    body: 'With the original facts, quiet preparation from 14:00–14:30 followed by shared work from 14:30–15:45
      gives A 30 quiet minutes and B 75 shared minutes. B leaves by 15:45; A may use the remaining room
      time alone. Agree a visible end to the quiet interval and how either can request a change. This
      is a feasible candidate, not automatic consent or observed follow-through.


      Changed fictional fact: B now must leave at 15:00 and still needs at least 60 minutes of shared
      work for today''s room plan to be worthwhile. After A''s initial 30 quiet minutes, only 30 shared
      minutes remain. There is a 30-minute shortfall against B''s minimum. Splitting the quiet requirement
      to 15 minutes would violate A''s stated constraint; extending the room would not solve B''s departure.


      If neither freely revises a constraint, use separate plans and consider another day. Do not guilt
      either friend into lowering a minimum to rescue agreement. State what changed and preserve the relationship
      without punishment. Your written role-play result establishes case reasoning only; no actual booking,
      consent or performance has occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Negotiation is a joint search for terms that can serve interests within real constraints. Agreement
      is one possible result; a reasoned refusal can be better than an arrangement that either person
      cannot carry out. This practice uses two friends sharing a hobby room, with no money or binding
      commitment. Allow fifteen minutes to prepare, a fifteen-minute voluntary role-play and ten minutes
      for a recap. Do not use housing, livelihood, legal settlement, essential care or coercive dependency
      as the practice case.


      ### Know what you need and what you can do without a deal


      A position states preferred terms: “I want the room quiet for the whole session.” An interest explains
      the purpose: “I need uninterrupted preparation before I can work alongside someone.” A constraint
      rules out some options: the room closes at 16:00. An alternative is what you can actually do if
      no agreement is reached. BATNA means the best available alternative to a negotiated agreement; it
      is not a threat, an imaginary option or a desired deal you have not secured.


      A walk-away condition identifies terms you cannot accept. Fairness criteria help compare options
      without making power the only rule: equal useful access, alternating preferred periods or a mutually
      accepted allocation can each be relevant. Equal minutes are not always equal benefit. A package
      trades across issues, such as quiet time, shared time and interruption rules, instead of splitting
      every demand mechanically.


      Harvard''s Ombuds teaching material separates interests, options, alternatives, legitimacy and implementation
      commitments [S12](https://hms.harvard.edu/sites/default/files/Departments/Ombuds%20Office/files/SEVEN%20ELEMENTS%20OF%20EFFECTIVE%20NEGOTIATIONS.pdf).
      This companion does not adopt its suggestion to worsen the other party''s alternative. The original
      case instead preserves refusal without punishment. PON''s discussion of the agreement trap reinforces
      comparing a deal with a feasible alternative [S13](https://www.pon.harvard.edu/daily/batna/too-eager-to-close-nb/);
      no result from a business simulation guarantees a good outcome between friends.


      ### Worked example: the display table


      One friend wants a display table all morning to lay out work; the other wants it for a twenty-minute
      photograph. Their positions appear incompatible until they identify the time-sensitive part. A package
      allows setup first, a twenty-minute photo interval and then continued display, with a clear rule
      about who moves items. Both compare this with using separate tables.


      The package is useful only if space, time and handling permissions are real. “You can photograph
      it later” does not work if daylight is unavailable then. A person may decline because moving fragile
      work is unacceptable. That refusal is information about the options, not evidence that the friendship
      lacks goodwill.


      ### Your role cards: two hours in the hobby room


      Shared facts: the room is available from 14:00 to 16:00, with no extension. Both people can work
      separately at home at no cost. No one may commit the other person without agreement. This is a fictional
      rehearsal; no booking occurs.


      Role A: you need at least 30 uninterrupted minutes of quiet preparation at the start. Afterward
      you would enjoy shared work. During preparation, headphones alone do not solve interruptions; you
      need no conversation directed at you. Your alternative is to work at home, quietly, for the full
      two hours. Your walk-away condition is a proposal that does not protect the initial 30 minutes or
      requires staying beyond 16:00.


      Role B: you want at least 60 minutes of shared working time, enjoy company and are willing to begin
      with a quiet task. You must leave at 15:45. Your alternative is to work at home and arrange company
      another day; today''s alternative does not provide company. You do not accept being responsible
      for remembering A''s preparation time unless a visible agreed timer or written time boundary is
      used. These preferences belong to the role, not a real person''s inferred mind.


      1. **Prepare before making an offer.** Separate your position, interest, constraint, alternative
      and walk-away condition. List two possible interests for the other person as hypotheses, then consult
      their role card in rehearsal or ask them in a real willing exchange. Name a fairness reference and
      one leverage tactic you will not use, such as making friendship conditional on assent. Output: a
      preparation sheet that distinguishes feasible alternatives from wishful ones.

      2. **Ask and build two packages.** Reflect the stated interests and propose exact times, an interruption
      rule and responsibilities. Consider a second package or a separate-plan alternative rather than
      demanding a midpoint. Explain gains and concessions for both people. Output: two compared options
      with arithmetic and constraints visible.

      3. **Confirm or refuse clearly.** Ask each person to restate the selected terms, who does what and
      how a change can be requested. If a condition is not met, state the reason briefly and use the prepared
      alternative without retaliation. Output: a plain-language agreement or refusal, with implementation
      still unobserved.

      4. **Open the [later packet](?resource=file-later-packet-md).** Recompute after a time constraint
      changes. Do not keep a once-feasible package by silently relaxing the other person''s minimum or
      adding nonexistent room time. Output: revised feasibility and chosen disposition.


      ### What a better outcome means here


      For the original facts, compare a package with reactive bargaining such as both insisting on the
      full period. The comparison should name which interests are served, what remains sacrificed and
      whether both can actually carry out the terms. Agreement quality and later follow-through are separate:
      a confirmed plan does not prove the timer was used or the quiet interval respected.


      For support, exchange written proposals, give processing time or use a mutually acceptable neutral
      facilitator in a safe case. A person may prefer to state a constraint without its private reason.
      For a harder attempt, a feasible alternative becomes unavailable. Reassess honestly rather than
      pretending your leverage is unchanged. You may still decline an unsuitable agreement; an attractive
      BATNA is not a condition of deserving respect.


      For real transfer, choose a voluntary low-stakes shared arrangement and verify actual alternatives
      and authority. Record the terms or principled refusal, then separately review follow-through at
      the agreed time. Where rights, legal obligations or coercion arise, use the appropriate qualified
      or formal process rather than expanding this rehearsal into advice. The [fresh checks](?attempt=practice-checks)
      test whether you can recognize a respectful no-deal outcome as competent negotiation.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A room is available 09:00–10:30. A needs the first 20 minutes quiet; B must leave at 10:00
      and needs 45 shared minutes. Is quiet-then-shared feasible? Show the gap.

      2. You list “use another venue” as your alternative, but have not checked whether it is available.
      How should that affect your negotiation preparation?

      3. Both sides clearly understand a proposed agreement, but one declines because it is worse than
      their workable alternative. What distinguishes a principled refusal from a failed communication
      or a threat?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Only 40 shared minutes remain from 09:20 to 10:00, so the package is 5 minutes short. The
      room staying open later does not change B''s departure. Seek a genuinely revised option or decline;
      do not describe the arithmetic as a fair compromise that meets both minima.

      2. It is a possible alternative, not a verified available one. Check access, timing, costs and authority
      before relying on it. If it cannot be verified, retain that uncertainty and consider another feasible
      route rather than bluffing about guaranteed access.

      3. The refusal names the unmet interest or constraint and uses an actual alternative without imposing
      punishment. Clear understanding and no agreement can coexist. A threat instead tries to make refusal
      costly through an imposed adverse consequence; neither comprehension nor affection obligates acceptance.'
    criteria:
