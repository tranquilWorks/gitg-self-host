        criteria:
        - the_other_person_s_stated_interests_inform_the_proposal
        - the_package_specifies_time_conditions_and_responsibilities
        - gains_and_concessions_on_both_sides_are_explicit
        - a_counterproposal_or_refusal_remains_socially_safe
      - measurement_id: c1611_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1611_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1611-NEGOTIATION-01-A3
    sequence: 3
    title: Confirm the agreement or carry out the principled refusal
    instructions: 'Summarize the selected arrangement, who does what, when it starts and how either person
      can request a change. Ask the other person to confirm the same understanding. If the walk-away condition
      is reached, state the reason briefly and use the prepared alternative without punishment or last-minute
      pressure. Review whether the outcome addressed the interests better than the initial positional
      demand, while keeping any untested future performance visible.


      Observation checks: The final terms or refusal are stated unambiguously; Both people understand
      responsibilities and change conditions; A refusal uses the alternative without retaliation; Agreement
      quality is distinguished from later follow-through. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which trade addressed the real interests, and what did your walk-away option prevent
      you from agreeing to merely to end discomfort?


      Examples: Supportive: The friends agreed on quiet preparation followed by shared work and both could
      explain the interruption rule and review point.


      Mixed: A package was accepted, but one person’s constraint was still unclear, so the agreement remained
      provisional.


      Contradictory: The negotiator used guilt, confidential information or dependency to make refusal
      costly.


      Inconclusive: The conversation ended with a vague compromise but no terms, responsibilities or alternative.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1611-NEGOTIATION-01
      action_stable_id: PRACTICE-COMP-1611-NEGOTIATION-01-A3
