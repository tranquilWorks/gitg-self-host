        expected: true
  - stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01-A2
    sequence: 2
    title: Balance turns and include without spotlighting
    instructions: 'In a willing small group, follow the existing topic before introducing your own. Make
      one connection between contributions, leave space after speaking and invite an overlooked participant
      only in a way they can decline, such as We have been discussing routes; any thoughts you would like
      to add? Do not demand an opinion, finish someone’s sentences or turn a quiet person into a public
      inclusion project. Notice whether your contribution opens or closes space for others.


      Observation checks: The existing topic is understood before a new one is introduced; Your own speaking
      leaves space for other contributions; An invitation is optional rather than a demand to perform;
      Quiet participation is not interpreted as a defect. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01
      action_stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01-A2
      competency_stable_id: '16.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1604_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1604_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_existing_topic_is_understood_before_a_new_one_is_introduced
        - your_own_speaking_leaves_space_for_other_contributions
        - an_invitation_is_optional_rather_than_a_demand_to_perform
        - quiet_participation_is_not_interpreted_as_a_defect
      - measurement_id: c1604_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1604_a2_adverse
        kind: boolean
