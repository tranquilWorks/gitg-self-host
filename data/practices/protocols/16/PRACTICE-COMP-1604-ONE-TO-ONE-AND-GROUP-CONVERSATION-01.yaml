        expected: true
  - stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01-A3
    sequence: 3
    title: Use a clear transition or close and review reciprocity
    instructions: 'At a natural point, either bridge to a related topic or close with a brief acknowledgment:
      Good talking about the route; I am going to rejoin the activity. Make a future invitation only when
      genuinely intended. After both conversations, record one moment of listening, one of sharing, one
      inclusion choice and how the ending worked. Missing a group opportunity remains untested rather
      than being replaced by an imagined conversation.


      Observation checks: The transition or ending is explicit and considerate; Future contact is suggested
      only when genuinely intended; Both listening and contribution appear in the review; One-to-one and
      group experience are reported separately. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Where did the exchange become reciprocal, and what did you do when the other person’s
      preferred pace or ending differed from yours?


      Examples: Supportive: The participant opened with the shared activity, contributed briefly, invited
      an optional group response and ended without an empty promise to meet again.


      Mixed: The one-to-one exchange was balanced, but the group conversation was dominated by the participant’s
      explanation and needed a shorter contribution next time.


      Contradictory: A quiet person was pressured to speak or an unwilling person was pursued after trying
      to end the exchange.


      Inconclusive: Conversation tips were read without an actual opening, reciprocal exchange or close.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01
