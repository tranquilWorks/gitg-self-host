  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      One-to-one and group conversation; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use text groups, a smaller gathering, a quiet environment or prepared opening phrases. Different
      cultures and neurotypes have different turn-taking rhythms; ask or observe respectfully rather than
      enforcing a single style. Rest and opting out are legitimate.
    cultural_context:
    - Adapt the expression of One-to-one and group conversation to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use text groups, a smaller gathering, a quiet environment or prepared opening phrases. Different
      cultures and neurotypes have different turn-taking rhythms; ask or observe respectfully rather than
      enforcing a single style. Rest and opting out are legitimate.
  pause_conditions:
  - Pause One-to-one and group conversation when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the One-to-one and group conversation practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a One-to-one and group conversation situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
