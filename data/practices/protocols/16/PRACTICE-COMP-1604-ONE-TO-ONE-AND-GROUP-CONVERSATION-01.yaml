meaning_and_fit:
  purpose: Initiate and sustain reciprocal conversation, include another participant and end or transition
    respectfully in both one-to-one and small-group settings.
  why_recommended: Initiate and sustain reciprocal conversation, include another participant and end or
    transition respectfully in both one-to-one and small-group settings.
  claims:
  - statement: Initiate and sustain reciprocal conversation, include another participant and end or transition
      respectfully in both one-to-one and small-group settings.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded One-to-one and group conversation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record One-to-one and group conversation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text groups, a smaller gathering, a quiet environment or prepared opening
    phrases. Different cultures and neurotypes have different turn-taking rhythms; ask or observe respectfully
    rather than enforcing a single style. Rest and opting out are legitimate.
  opportunity_considerations: Use a familiar social or hobby setting. Prepare a context-linked opening
    such as Have you tried this activity before? and a small relevant contribution of your own. Plan one
    one-to-one exchange and one willing small-group exchange, without approaching someone who is busy,
    isolated for privacy or signaling that they want to leave.
  prerequisites:
  - Use a familiar social or hobby setting. Prepare a context-linked opening such as Have you tried this
    activity before? and a small relevant contribution of your own. Plan one one-to-one exchange and one
    willing small-group exchange, without approaching someone who is busy, isolated for privacy or signaling
    that they want to leave.
  dependencies: []
  safe_alternatives:
  - Use text groups, a smaller gathering, a quiet environment or prepared opening phrases. Different cultures
    and neurotypes have different turn-taking rhythms; ask or observe respectfully rather than enforcing
    a single style. Rest and opting out are legitimate.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    One-to-one and group conversation differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about One-to-one and group conversation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a familiar social or hobby setting. Prepare a context-linked opening such as Have you tried
    this activity before? and a small relevant contribution of your own. Plan one one-to-one exchange
    and one willing small-group exchange, without approaching someone who is busy, isolated for privacy
    or signaling that they want to leave. Goal: Initiate and sustain reciprocal conversation, include
    another participant and end or transition respectfully in both one-to-one and small-group settings.
    Scope: Ordinary conversation is not a performance contest. Participation, disclosure and continued
    conversation must remain voluntary; a polite ending is a valid outcome. Time and effort: Ten minutes
    to prepare and two short ordinary conversations over a week, followed by a ten-minute review. Adaptation:
    Use text groups, a smaller gathering, a quiet environment or prepared opening phrases. Different cultures
    and neurotypes have different turn-taking rhythms; ask or observe respectfully rather than enforcing
    a single style. Rest and opting out are legitimate. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text groups, a smaller gathering, a quiet environment or prepared opening phrases.
    Different cultures and neurotypes have different turn-taking rhythms; ask or observe respectfully
    rather than enforcing a single style. Rest and opting out are legitimate.
  expected_burden: Ten minutes to prepare and two short ordinary conversations over a week, followed by
    a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the One-to-one and group conversation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed One-to-one and group conversation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text groups,
    a smaller gathering, a quiet environment or prepared opening phrases. Different cultures and neurotypes
    have different turn-taking rhythms; ask or observe respectfully rather than enforcing a single style.
    Rest and opting out are legitimate.
  actions:
  - stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01-A1
    sequence: 1
    title: Open with context and allow an easy exit
    instructions: 'Choose a moment when conversation is reasonably welcome, introduce yourself or refer
      to the shared activity, and ask one open but nonintrusive question. Listen to the answer and share
      one related detail rather than firing another question immediately. If the person gives little response
      or needs to leave, acknowledge it and end politely; do not treat persistence as the skill being
      practiced.


      Observation checks: The opening fits the shared setting; One question is balanced with a relevant
      contribution; The other person has room to choose depth and duration; Low interest or an exit cue
      is respected. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01
      action_stable_id: PRACTICE-COMP-1604-ONE-TO-ONE-AND-GROUP-CONVERSATION-01-A1
      competency_stable_id: '16.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1604_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1604_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_opening_fits_the_shared_setting
        - one_question_is_balanced_with_a_relevant_contribution
        - the_other_person_has_room_to_choose_depth_and_duration
        - low_interest_or_an_exit_cue_is_respected
      - measurement_id: c1604_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1604_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
