  - id: file-later-packet-md
    title: Later packet
    body: 'These are fictional developments, not real conversation evidence.


      Jules says: “I wasn''t really asking how to schedule it. I just liked showing something I made.”
      Acknowledge the correction. Return to the creation or its enjoyment if welcome; do not defend unsolicited
      productivity advice. Your five-minute limit still applies, so use a clear ending rather than launching
      a fresh interview.


      In the group, Em says: “I''ll watch for now.” Accept this, leave physical and conversational access
      available and return to the display task. Em later submits a written suggestion to place the blue
      items near the entrance. Tavi says that would narrow the walkway. Connect both contributions: placement
      preference and usable space need consideration together. Ask for a layout that preserves the walkway
      rather than declaring that including Em requires using the suggestion.


      A useful review distinguishes invitation offered, participation chosen, idea considered and idea
      adopted. These are four different events. None establishes what Em privately felt. If no real group
      exchange occurred, group conversation remains rehearsed only.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Conversation involves more than asking good questions. People need opportunities to begin,
      contribute, follow a topic, move between topics, participate without being cornered and finish.
      This practice separates a one-to-one exchange from a small group so that success in one does not
      imply success in both. Set aside ten minutes to prepare, two ordinary willing opportunities over
      a week and a short review. Fictional rehearsal is available when people or suitable settings are
      unavailable.


      ### Reciprocity is a pattern, not a quota


      A follow-up connects to what a person just offered. “What made that part interesting?” follows their
      experience; “What''s your job?” may switch the topic. Either can be appropriate, but repeated switches
      can leave an exchange feeling like an interview. Sharing a related detail of your own gives the
      other person something to respond to. A long autobiography does not become reciprocal merely because
      you end with a question.


      Research on question asking includes both positive findings and a methodological dispute about speed-dating
      data. The 2025 correction reports unchanged conclusions; a separate reanalysis challenges broader
      interpretations [S03–S04](https://pubmed.ncbi.nlm.nih.gov/40111841/). This practice uses no question
      quota, promised increase in liking or equation between question count and listening. The observable
      aim is responsiveness to contributions and a workable opening for others.


      In a group, inclusion is not compulsory speech. An open invitation, time to respond, a text channel
      or an accessible way to join may help. Calling a quiet person out by name and demanding their view
      can increase pressure. Silence can mean many things, and some groups use overlapping speech while
      others prefer explicit turns. Ask about a workable process when needed. Balance concerns the opportunity
      to participate, not identical seconds or a universal norm of quick replies.


      ### Worked example: two topics collide


      At a puzzle club, Lee says, “The large pieces helped me finish this one.” Mo begins a story about
      a difficult puzzle, then notices it is taking over. Mo stops at the relevant point: “I had trouble
      telling the edge pieces apart. Did the larger pieces help with that too?” Lee explains that the
      issue was handling, not seeing. Mo follows the correction and offers to leave larger pieces on the
      shared table.


      When Pat joins, Mo says, “We''re comparing which pieces are comfortable to use; there''s room here
      if you''d like.” Pat can join, watch or decline without explaining. Later Mo closes with, “I need
      to leave in five minutes; thanks for showing me the different pieces.” No promise of a future meeting
      is invented to soften the ending. The exchange is fictional and does not establish anyone''s actual
      ease or satisfaction.


      ### Your two settings


      Use these supplied role facts for rehearsal. In the pair, Jules has just said: “I tried making a
      small planter; the painting was fun, but finding time to finish was harder.” You enjoy choosing
      colors and have only five minutes before a scheduled task. Jules has not asked for productivity
      advice. In the group, three willing hobby members are arranging a display. Noor discusses colors,
      Tavi discusses table space, and Em joins after the conversation has begun. No one has asked Em to
      speak. The group has ten minutes before setup must start and can accept spoken or written suggestions.


      1. **Open and sustain the pair exchange.** Use a context-linked opener that makes it easy to decline.
      Follow one part of Jules''s contribution, then offer a brief related experience of your own. Avoid
      diagnosing poor time management or supplying a solution to an unrequested problem. Output: a short
      rehearsal sequence or minimal notes from an actual welcome exchange, identifying how your next contribution
      connected.

      2. **Transition and close the pair.** Decide whether there is time for another topic. State the
      real ending constraint and close without an empty promise. If you interrupt accidentally, return
      the floor: “I cut across your point; did you want to finish?” Output: the transition/ending used
      and whether Jules had a chance to complete the thought. An ending is allowed even if every topic
      is unfinished.

      3. **Join the group without replacing its purpose.** Briefly connect Noor''s and Tavi''s contributions,
      then offer Em an optional way to join. Suggest how spoken and written ideas can be considered before
      setup. Leave time for actual responses. Output: one connection between existing contributions, an
      invitation with an opt-out and a clear move toward the group''s next activity.

      4. **Use the [later packet](?resource=file-later-packet-md).** Respond to a correction in the pair
      and an opted-out invitation in the group. Output: what changes in your next turn, not a judgment
      about anyone''s friendliness.


      ### Observe the exchange fairly


      After a real attempt, note one place where you followed rather than switched, one contribution of
      your own, an inclusion opportunity and the ending. If a willing person offers feedback, preserve
      their actual description, including “that felt like too many questions” or “I wanted more time.”
      Do not secretly count another person''s words or record their private story. Your review can contain
      only the interaction pattern needed to improve your part.


      For support, practice with two prepared topic links, a quiet familiar setting, a written exchange
      or a mutually agreed turn cue. AAC and longer response times are compatible with reciprocity. A
      group that cannot provide enough time may need a format change. Do not interpret a slower response
      as disinterest or a quick interruption as a stable character flaw.


      For a harder attempt, two members speak at once while another posts a text suggestion. Acknowledge
      the competing contributions, suggest a temporary order with agreement and bring the text idea into
      consideration without appropriating it. Let the task determine what needs a decision now; do not
      require everybody to share personal material to count as included.


      For real transfer, attempt the pair and group separately over the week. A missing group opportunity
      stays unattempted. Compare what you actually did in each setting and choose one change for the next
      conversation. A partner''s politeness is not proof that the exchange felt reciprocal; an honest
      correction is useful evidence. The [fresh checks](?attempt=practice-checks) focus on situations
      where doing more talking or more asking would not solve the problem.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. You ask six questions in a row and your partner says, “What about you?” What should your
      next contribution do, and why is another question an incomplete response?

      2. A group member uses text and is being missed while spoken turns continue. Offer a process adjustment
      without requiring them to speak aloud.

      3. You must leave in two minutes while someone is midway through a long story. Give an honest closing
      route that does not promise a future meeting you do not intend.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Share a relevant, bounded experience or view and leave room for response. The partner is
      asking for reciprocity; increasing question volume does not address it. Avoid replacing the interview
      with a monologue.

      2. With the group''s agreement, pause to read or otherwise include the text contribution, credit
      its author and allow their preferred response format. Inclusion requires usable access and consideration,
      not a compulsory spoken turn or automatic adoption of the idea.

      3. State the constraint respectfully, offer time for the immediate point if feasible and close at
      the stated time: “I need to leave in two minutes; what''s the part you''d most like to finish before
      I go?” Do not use an abrupt disappearance or a false promise to conceal the limit. The storyteller
      can also prefer to stop now.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
