      2. You failed to confirm an assignment. The other person demands you also accept responsibility
      for their insulting messages. What can you own without manufacturing equal blame?

      3. A proposed remedy starts at 16:20, needs 35 minutes and both people must leave at 16:45. What
      should change in the next-step discussion?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Ownership and acknowledgment remain absent. Seek a willing named owner, concrete action,
      deadline and confirmation route, or explicitly choose postponement/cancellation if nobody accepts.
      Apology and lower tension do not execute a task.

      2. Acknowledge your specific omission and its practical effect. Their insulting conduct remains
      theirs to answer for; you need not accept it as caused or justified by your mistake. Set an appropriate
      boundary or end the exchange if necessary. Proportionate responsibility does not mean equal blame.

      3. Only 25 minutes are available, creating a 10-minute shortfall. Choose a genuinely useful shorter
      task if one is agreed, another feasible time or an honest cancellation. Do not preserve a calm-looking
      agreement with impossible timing or pressure someone to stay beyond their constraint.'
