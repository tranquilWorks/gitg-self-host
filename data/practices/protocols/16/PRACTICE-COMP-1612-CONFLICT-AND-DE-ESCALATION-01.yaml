meaning_and_fit:
  purpose: Interrupt escalation, identify the actual disputed issue, own your contribution and agree a
    bounded next step or a clear safe ending.
  why_recommended: Interrupt escalation, identify the actual disputed issue, own your contribution and
    agree a bounded next step or a clear safe ending.
  claims:
  - statement: Interrupt escalation, identify the actual disputed issue, own your contribution and agree
      a bounded next step or a clear safe ending.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Conflict and de-escalation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Conflict and de-escalation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing, accessible communication, a smaller issue or an agreed neutral
    mediator. Do not require direct confrontation with an unsafe person or use a pause as silent punishment.
    Formal workplace, legal or safeguarding processes may take priority.
  opportunity_considerations: 'Default disagreement: two people each believed the other would book a meeting
    room. The room is unavailable and both are frustrated. Prepare a pause-and-return phrase, a neutral
    event description and one action you can take without requiring the other person to admit fault.'
  prerequisites:
  - 'Default disagreement: two people each believed the other would book a meeting room. The room is unavailable
    and both are frustrated. Prepare a pause-and-return phrase, a neutral event description and one action
    you can take without requiring the other person to admit fault.'
  dependencies: []
  safe_alternatives:
  - Use writing, accessible communication, a smaller issue or an agreed neutral mediator. Do not require
    direct confrontation with an unsafe person or use a pause as silent punishment. Formal workplace,
    legal or safeguarding processes may take priority.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Conflict and de-escalation differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Conflict and de-escalation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default disagreement: two people each believed the other would book a meeting room. The room
    is unavailable and both are frustrated. Prepare a pause-and-return phrase, a neutral event description
    and one action you can take without requiring the other person to admit fault. Goal: Interrupt escalation,
    identify the actual disputed issue, own your contribution and agree a bounded next step or a clear
    safe ending. Scope: Use a willing low-stakes disagreement or fictional rehearsal. Abuse, threats,
    retaliation and coercive control are not mutual communication problems to solve through this exercise.
    Time and effort: Ten minutes to prepare, a fifteen-minute conversation or rehearsal and a brief follow-up
    at the agreed time. Adaptation: Use writing, accessible communication, a smaller issue or an agreed
    neutral mediator. Do not require direct confrontation with an unsafe person or use a pause as silent
    punishment. Formal workplace, legal or safeguarding processes may take priority. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, accessible communication, a smaller issue or an agreed neutral mediator.
    Do not require direct confrontation with an unsafe person or use a pause as silent punishment. Formal
    workplace, legal or safeguarding processes may take priority.
  expected_burden: Ten minutes to prepare, a fifteen-minute conversation or rehearsal and a brief follow-up
    at the agreed time.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Conflict and de-escalation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Conflict and de-escalation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    accessible communication, a smaller issue or an agreed neutral mediator. Do not require direct confrontation
    with an unsafe person or use a pause as silent punishment. Formal workplace, legal or safeguarding
    processes may take priority.
  actions:
  - stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01-A1
    sequence: 1
    title: Lower the interaction’s intensity without abandoning the issue
    instructions: 'Name your own early escalation cue, such as speaking faster or repeating an accusation.
      Use a short pause, changed medium or agreed later time if needed, and state when you will return.
      Describe the shared problem as the room was not booked rather than you never take responsibility.
      Check whether both people are willing and safe to continue; a refusal or threat changes the task
      to ending the exchange and seeking appropriate support.


      Observation checks: Your own escalation cue is identified; Any pause includes a clear return or
      ending condition; The issue is described without global blame; Willingness and safety are checked
      before continuing. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01
      action_stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01-A1
      competency_stable_id: '16.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1612_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1612_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - your_own_escalation_cue_is_identified
        - any_pause_includes_a_clear_return_or_ending_condition
        - the_issue_is_described_without_global_blame
        - willingness_and_safety_are_checked_before_continuing
      - measurement_id: c1612_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1612_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01-A2
    sequence: 2
    title: Clarify the mismatch and own a specific contribution
    instructions: 'Ask what each person understood about the booking responsibility and when that understanding
      arose. Separate the missed room from questions of respect or reliability that may need another conversation.
      State your own concrete contribution, such as not confirming the owner, without taking responsibility
      for everything or demanding an equal confession. Reflect one point the other person reports before
      proposing a solution.


      Observation checks: Each person’s understanding of the task is elicited; The immediate issue is
      separated from broader character claims; Your contribution is specific and proportionate; The other
      account is reflected before a solution is proposed. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01
      action_stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01-A2
      competency_stable_id: '16.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1612_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1612_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_person_s_understanding_of_the_task_is_elicited
        - the_immediate_issue_is_separated_from_broader_character_claims
        - your_contribution_is_specific_and_proportionate
        - the_other_account_is_reflected_before_a_solution_is_proposed
      - measurement_id: c1612_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1612_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01-A3
    sequence: 3
    title: Agree a next action and test the repaired process
    instructions: 'Choose an immediate remedy within both people’s authority, such as finding another
      room or rescheduling, and define a future booking owner with a confirmation deadline. Confirm who
      will send the acknowledgment and when you will check it. If no safe agreement is possible, end with
      a clear boundary rather than an endless argument. At the next booking, verify whether the confirmation
      occurred; a calm conversation alone is not evidence that the process changed.


      Observation checks: The next action has an owner and a time; Future responsibility includes a confirmation
      mechanism; An unresolved conflict can end with a safe explicit boundary; Follow-through is checked
      separately from reduced tension. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What became more specific or safer, and did the agreed next step reduce the original
      ambiguity rather than merely stop the argument?


      Examples: Supportive: The pair identified an unconfirmed assumption, assigned the next booking and
      later verified the acknowledgment without settling every broader concern.


      Mixed: The conversation became calmer but the new owner was never named, leaving the original failure
      mode intact.


      Contradictory: The exercise pressured someone to share blame for abuse or treated a threat as a
      cue to communicate more skillfully.


      Inconclusive: Both people apologized generally without clarifying the issue or taking a next action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01
      action_stable_id: PRACTICE-COMP-1612-CONFLICT-AND-DE-ESCALATION-01-A3
      competency_stable_id: '16.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
