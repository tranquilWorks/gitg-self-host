  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fictional continuation: Rowan says, “I assumed looking at the timetable meant booking;
      I didn''t ask for confirmation.” Ellis confirms that distinction and volunteers to ask the desk
      by 14:15. This is an accepted task, not yet a booked room.


      At 14:12 Ellis reports that Room B is confirmed for 14:30. The 25-minute meeting ends at 14:55,
      leaving five minutes before both must leave. This supports the immediate remedy within the case.
      It does not establish a repaired future process.


      For next week, Rowan volunteers to book and send confirmation by Tuesday at 17:00. At Tuesday 17:10
      there is no message. Record confirmation overdue and room status unknown. A welcome check can ask
      whether booking occurred and whether help or a new plan is needed; do not announce that the room
      is booked or that Rowan deliberately ignored the agreement. The quieter conversation did not complete
      the future acknowledgment.


      Alternate branch: one participant makes a threat and will not stop. End the ordinary exercise and
      use an appropriate safe support route. Do not require a contribution-to-blame statement from the
      threatened person. All outcomes here are supplied fiction, not actual conflict resolution evidence.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'An ordinary disagreement becomes more workable when people can identify the disputed event,
      hear each account and choose a safe next step. Calmness is useful but not enough: the original failure
      can recur if responsibility remains vague. This practice uses a missed room booking, with ten minutes
      to prepare, a fifteen-minute willing discussion or rehearsal and a later process check. Abuse, threats,
      retaliation and coercive control are not mutual communication problems to solve by sharing blame.


      ### Regulate your contribution without controlling another person''s feelings


      Notice your own early escalation cue: speaking faster, repeating an accusation, raising volume or
      feeling unable to hear the answer. A pause can create room to think if it has a clear return arrangement
      or ending condition. It becomes punitive when used to keep someone indefinitely uncertain or force
      an apology. “I need ten minutes; can we resume at 15:20?” is different from disappearing until the
      other person gives in.


      Describe the immediate problem in terms both people can inspect. “The room isn''t booked” leaves
      open how that happened. “You never take responsibility” adds a global judgment and invites an argument
      about character. Other concerns about trust may be real, but they need their own evidence and conversation.
      Narrowing the present issue does not require denying them.


      Owning a contribution means naming what you actually did or omitted. It does not mean taking all
      responsibility, inventing equal fault or requiring a matching confession before acting. A useful
      acknowledgment might be, “I assumed you had accepted the booking without checking.” It should not
      be followed by “but you made me assume it,” which shifts the same accusation into another form.


      Acas''s guide covers preparation, listening, managing difficult exchanges and agreed next steps
      in a UK workplace context [S14](https://www.acas.org.uk/sites/default/files/2021-04/challenging-conversations-and-how-to-manage-them.pdf).
      This source companion borrows only bounded communication principles for a fictional peer case. It
      does not import employment rules, managerial authority, requirements to disclose health information
      or a universal obligation to continue an unsafe exchange.


      ### Worked example: a missing pickup


      Two volunteers each thought the other would collect a box. The box is still at the desk. One says,
      “I sent a question but treated the lack of an answer as acceptance.” The other says, “I saw the
      message late and didn''t reply that I couldn''t do it.” They arrange an immediate pickup within
      someone''s actual availability, then agree that future task ownership requires an explicit acknowledgment.


      Their accounts need not be morally equal. The useful repair is a clear assignment and confirmation
      mechanism. If no one can collect today, a truthful cancellation is better than another vague promise.
      The conversation may become calmer while the box remains uncollected; those are separate outcomes.


      ### Your case: the unbooked room


      These are the complete fictional records. At 11:00 Monday, Rowan wrote, “Could you check about Room
      C for Thursday?” At 11:10, Ellis replied, “I''ll look at the timetable after lunch.” No later booking
      confirmation was sent. On Thursday at 14:00 they find Room C occupied. Rowan says, “You said you''d
      handle it.” Ellis says, “I only said I''d look.” Both are frustrated but have agreed to a low-stakes
      rehearsal without insults or threats.


      The desk can offer Room B at 14:30 if someone confirms by 14:15. Both volunteers can stay until
      15:00, and a useful shortened meeting needs 25 minutes. Neither can displace the existing Room C
      booking. For the next week''s meeting, either may request the room, but the owner must accept the
      task and send the desk''s confirmation by Tuesday at 17:00. No future owner has yet agreed.


      1. **Prepare a pause and neutral issue.** Name your own escalation cue, a return-time request and
      an ending condition if continuing is unwelcome or unsafe. Describe the missed room without “always”
      or “never.” Output: a short opening that reduces threat while retaining the issue.

      2. **Clarify accounts before assigning motive.** Ask what each person understood and which message
      supports that understanding. Distinguish checking availability from making a reservation and from
      confirming it. Own the specific contribution supported by your role''s record; do not invent a confession
      for the other person. Reflect one reported point before proposing a solution. Output: event/account/unknown
      notes and your proportionate acknowledgment.

      3. **Choose a bounded remedy.** Check whether the 14:30 option can fit the 25-minute meeting before
      15:00 and who has authority and availability to confirm by 14:15. If no one accepts, preserve the
      risk of losing it. State the immediate owner, deadline and acknowledgment. Separately propose next
      week''s owner and confirmation mechanism, asking for actual acceptance. Output: an immediate plan
      and a future process with pending items marked.

      4. **Open the [later packet](?resource=file-later-packet-md) and check follow-through.** Compare
      reduced tension with actual room confirmation. At the next booking, inspect whether the agreed acknowledgment
      occurred. Output: what became safer/more specific, what was actually completed and what remains
      unresolved.


      ### A safe ending is also an outcome


      If a person refuses the conversation, state what you can do next within your authority and end the
      exchange. A threat changes the task to leaving or obtaining appropriate support; do not insist on
      another empathic question, shared blame or a face-to-face repair. Formal workplace, legal or safeguarding
      processes can take priority. The ordinary peer exercise must not be used to pressure a harmed person
      into reconciliation.


      For support, use a written exchange, a smaller issue, a quiet space, accessible communication or
      a mutually agreed neutral mediator in a safe setting. Allow time to formulate a response. Regulation
      need not look like a calm facial expression or soft voice; assess your controllable actions and
      the exchange''s safety, not a performance of serenity.


      For a harder attempt, the immediate room option disappears while the conversation continues. Update
      the plan to rescheduling or a suitable alternative instead of treating continued discussion as progress.
      You can repair the future process even when today''s outcome cannot be recovered. Avoid assigning
      a new owner by public pressure merely because time is short.


      For real transfer, choose a welcome low-stakes disagreement and verify the facts, roles and available
      remedies. Keep minimal non-sensitive notes. Review the next agreed action at the stated time; a
      sincere apology can coexist with a missed deadline. The [fresh checks](?attempt=practice-checks)
      test that you can tell a quieter interaction from a corrected process.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. Two people apologize, but neither accepts the next task. What defect in the process remains,
