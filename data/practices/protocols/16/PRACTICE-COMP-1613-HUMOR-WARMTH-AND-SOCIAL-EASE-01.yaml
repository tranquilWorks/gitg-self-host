        expected: true
  - stable_id: PRACTICE-COMP-1613-HUMOR-WARMTH-AND-SOCIAL-EASE-01-A2
    sequence: 2
    title: Offer it once and leave space for the response
    instructions: 'At a natural welcome moment, use the brief observation or choose a simple warm acknowledgment
      instead. Do not interrupt someone’s serious point to deliver it, explain why it is funny or repeat
      it to force a reaction. Attend to the actual verbal response and context, while keeping nonverbal
      interpretations tentative. If it does not land, return to the activity without making the group
      responsible for rescuing your performance.


      Observation checks: The moment fits rather than interrupts the interaction; The playful comment
      is offered once without pressure; The actual response is observed without mind-reading; A quiet
      or neutral response can be accepted gracefully. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1613-HUMOR-WARMTH-AND-SOCIAL-EASE-01
      action_stable_id: PRACTICE-COMP-1613-HUMOR-WARMTH-AND-SOCIAL-EASE-01-A2
      competency_stable_id: '16.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1613_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1613_a2_primary
        kind: artifact
        role: primary
        weight: '1'
