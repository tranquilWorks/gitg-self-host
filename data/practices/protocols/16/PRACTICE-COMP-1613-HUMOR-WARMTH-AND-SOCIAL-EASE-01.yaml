  - id: file-later-packet-md
    title: Later packet
    body: 'Fictional continuation after the prepared line: Pat says, “That sounds like you''re mocking
      the work I put into making the rules usable.” Rem smiles; Casey remains quiet.


      Respond to Pat''s stated concern rather than using Rem''s smile as a vote that the joke was fine.
      A proportionate repair might be, “I can see how that landed as criticism of your work. I''m sorry;
      I''ll leave that joke and help with the setup.” Do not ask Pat to reassure you that you are a good
      person. Then follow through: answer the first-page question or ask whether clearing space for the
      large-print sheet would help. Wait for permission before moving someone''s material.


      No conclusion about Casey''s feelings follows from quietness. If nobody comments in an alternate
      version, you may return to the activity without repetition; absence of objection is not proof that
      everyone enjoyed it.


      Record the supplied objection, stopped line and proposed warmth action separately. A planned repair
      is not an attempted one, and the fictional exchange is not real evidence of increased connection.
      At the next actual welcome opportunity, review the warmth action on its own merits rather than seeking
      a successful joke to erase this mismatch.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Humor can add lightness to a welcome moment, but it is optional. Social ease also comes from
      making participation comfortable, remembering a preference and accepting a quiet response without
      demanding reassurance. This practice asks you to consider the target, timing and social cost of
      a playful comment, offer it at most once when appropriate, and respond to its actual effect. Allow
      ten minutes to prepare, one natural low-stakes opportunity and five minutes to review.


      ### The speaker''s intention is not the whole interaction


      A line may seem harmless to its author while making someone else feel exposed or excluded. Laughter
      can reflect amusement, politeness, nervousness or pressure; silence can have several meanings too.
      Keep interpretations tentative and take a direct objection seriously. You do not need to solve a
      person''s inner state before stopping a line they say is unwelcome.


      Kant and Norman''s conceptual analysis discusses how social distance, power and culture can shape
      whether humor seems benign [S15](https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2019.01380/full).
      It is a theoretical discussion, not a validated formula for classifying a joke as safe or predicting
      how every person will react. This companion''s target/timing/cost check is an original practical
      safeguard, not a diagnostic humor scale.


      A shared harmless situation can offer playfulness without making a person the cost: an unnecessarily
      elaborate game setup might be “our opening puzzle.” Even that line can land poorly if someone has
      worked hard on the setup or is struggling to access it. Kindness means remaining willing to change
      course. Self-deprecation also needs care: a small non-sensitive mishap can be light, but “I''m useless;
      someone tell me I''m not” recruits others to repair your self-worth.


      Humor is not an obligation to be quick, extroverted or culturally fluent. Quiet assistance, clear
      welcome and allowing a pass can create warmth. You need not laugh at ridicule to demonstrate resilience,
      prove belonging or preserve someone else''s performance. Grief, danger, distress or a serious disclosure
      may call for straightforward attention instead of an attempt to lighten the mood.


      ### Worked example: too many instruction cards


      At a familiar hobby session, a table contains several harmless instruction cards. Uma considers
      saying, “The instructions have brought their own instructions.” Before speaking, Uma notices someone
      is seriously asking for help finding the first step. Uma answers that question instead of interrupting
      it for the joke. Later, during a relaxed pause, Uma may offer the line once or simply say, “I''m
      glad we can work through this together.”


      If no one laughs, Uma returns to the task. Explaining the joke, repeating it louder or asking “Was
      that not funny?” makes others responsible for rescuing the performance. If a participant says the
      line felt like criticism of their preparation, Uma can acknowledge that effect and stop without
      arguing about intent. Neither the imagined good timing nor the supplied response is real social
      evidence.


      ### Your case: a board-game setup


      The fictional group is setting up a game with a large instruction pile. Pat is hosting, Casey is
      new and using a large-print rule sheet, and Rem is quietly sorting pieces. Pat says, “I spent a
      while getting these versions ready.” Casey asks which page starts the game. Rem has not spoken.
      You have prepared, “Looks like the instruction pile is tonight''s first puzzle.” No one has invited
      jokes about reading, slowness, accent, memory or skill.


      You also have three non-humorous options: point out the first-step heading without taking over,
      ask whether a clear space for the large-print sheet would help, or offer a warm greeting and let
      people settle. No diagnosis or explanation is needed for the format preference. A quiet person can
      participate without being made a target or called upon to perform sociability.


      1. **Check target, timing and cost.** Write what your line is about, who might feel implicated,
      whether a serious question is pending and whether anyone would find it costly to object. Ask whether
      the line would still be acceptable if no one laughed. Remove any dependence on private vulnerabilities,
      identity, humiliation or insider exclusion. Output: a decision to use, revise, defer or omit the
      joke, with a concrete reason.

      2. **Choose a moment or choose warmth.** Rehearse responding to Casey''s practical question first.
      If play later becomes welcome, offer a brief line once and leave space. A simple warm acknowledgment
      is an equally valid choice. Do not require laughter or a reciprocal joke. Output: your chosen contribution
      and why it fits the current activity rather than merely your prepared material.

      3. **Attend and repair without mind-reading.** Note actual words and context, keeping nonverbal
      interpretations tentative. If someone reports discomfort, acknowledge it briefly, stop the line
      and restore the practical activity. Do not insist that the person recognize your good intention
      before you repair. Output: a response plan that works for amusement, neutrality or an objection.

      4. **Open the [later packet](?resource=file-later-packet-md) and add a warmth action.** Compare
      intended lightness with the supplied effect, then identify one practical or relational contribution
      independent of humor. In a real welcome opportunity, attempt it and review whether participation
      became easier. Output: impact/uncertainty notes and attempted or pending warmth status.


      ### Review connection without turning people into ratings


      Ask whether your contribution helped people join, distracted from a task or excluded someone. These
      are distinct questions. A group can laugh while one member is hurt, or remain quiet while a helpful
      gesture makes participation easier. Do not tally smiles, rank people by humor tolerance or use an
      objection as evidence that they lack social skill. The useful learning target is how you respond
      and adjust.


      For support, use a written greeting, remembering a stated preference, offering practical help with
      permission or making room without a speech. A person using AAC need not produce rapid banter. Avoid
      copied cultural references that require someone to pretend understanding to belong. If unsure about
      timing, omit the joke; the exercise remains substantive through the context decision, response and
      warmth action.


      For a harder attempt, others laugh but the person implicated says the line hurt. Acknowledge that
      report and stop, even when the majority liked it. Do not poll the group to overrule the objection
      or turn your apology into a request for public absolution. A proportionate repair can be brief,
      followed by changed behavior.


      For real transfer, use an ordinary familiar setting where your presence is welcome. Never manufacture
      distress or test a sensitive joke to gather a response. Preserve only minimal non-sensitive notes
      about your own action, any volunteered feedback and what you did next. If the attempt stays fictional,
      social connection remains unobserved. The [fresh checks](?attempt=practice-checks) emphasize the
      ability to stay present and kind when humor receives no reward.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. Most people laugh at your comment, but the person it refers to says it hurt. What should
      guide your next action?

      2. Your light comment gets no response. Give a next move that does not make the group responsible
      for your confidence, and name what remains unknown.

      3. You dislike joking in groups. Describe a complete attempt at this competency using warmth and
      social awareness without performing a joke.


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A manager jokes about being slow with a new system. A new employee laughs once, then asks for the
      instructions again. The deadline is close. Decide whether to extend the joking and explain what
      the laugh does and does not establish.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Take the reported impact seriously, acknowledge it, stop the line and make a proportionate
      repair. Majority laughter cannot cancel the person''s experience or establish consent. Do not insist
      on “only joking,” request a vote or repeat the comment to prove its harmlessness.

      2. Return to the shared activity, respond to another person''s contribution or offer ordinary practical
      warmth. Whether people were amused, distracted or uncomfortable remains unknown unless clarified
      voluntarily. Repetition, explanation and fishing for reassurance would add pressure.

      3. Read the timing and practical needs, choose a welcome greeting or permission-based helpful action,
      allow a neutral response and review its actual effect. For example, ask whether space for someone''s
      materials would help, act if welcome and notice whether they can join the task. Record actual action
      separately from a plan. Quick wit and extroversion are not requirements.


      ### Changed-case answer


      Return to a clear explanation and check access to the task. One laugh in a power-asymmetric setting
      does not establish comfort or consent to more humor. The request and deadline favor helpful clarity;
      warmth can be expressed without another joke. Do not infer offense either.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
