meaning_and_fit:
  purpose: Offer warmth or lightness that leaves others free not to laugh, and respond to the actual effect
    rather than performing for approval.
  why_recommended: Offer warmth or lightness that leaves others free not to laugh, and respond to the
    actual effect rather than performing for approval.
  claims:
  - statement: Offer warmth or lightness that leaves others free not to laugh, and respond to the actual
      effect rather than performing for approval.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Humor, warmth, and social ease practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Humor, warmth, and social ease as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Warmth can be quiet, written, practical or nonverbal; no quick wit or extroversion
    is required. Avoid humor as a test of cultural belonging, emotional resilience or willingness to accept
    disrespect.
  opportunity_considerations: 'Choose a familiar willing social setting, such as a hobby session. Prepare
    a harmless observation about the shared task, not a person’s body, identity, mistake, insecurity or
    private life. Default example: when arranging an overcomplicated board-game setup, lightly call the
    instruction pile the evening’s first puzzle.'
  prerequisites:
  - 'Choose a familiar willing social setting, such as a hobby session. Prepare a harmless observation
    about the shared task, not a person’s body, identity, mistake, insecurity or private life. Default
    example: when arranging an overcomplicated board-game setup, lightly call the instruction pile the
    evening’s first puzzle.'
  dependencies: []
  safe_alternatives:
  - Warmth can be quiet, written, practical or nonverbal; no quick wit or extroversion is required. Avoid
    humor as a test of cultural belonging, emotional resilience or willingness to accept disrespect.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Humor, warmth, and social ease differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Humor, warmth, and social
    ease as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a familiar willing social setting, such as a hobby session. Prepare a harmless observation
    about the shared task, not a person’s body, identity, mistake, insecurity or private life. Default
    example: when arranging an overcomplicated board-game setup, lightly call the instruction pile the
    evening’s first puzzle. Goal: Offer warmth or lightness that leaves others free not to laugh, and
    respond to the actual effect rather than performing for approval. Scope: Humor is optional and culturally
    contextual. This is not a requirement to entertain, tolerate ridicule or use jokes in grief, danger
    or an unwelcome setting. Time and effort: Ten minutes to prepare, one natural low-stakes opportunity
    and five minutes to review. Adaptation: Warmth can be quiet, written, practical or nonverbal; no quick
    wit or extroversion is required. Avoid humor as a test of cultural belonging, emotional resilience
    or willingness to accept disrespect. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Warmth can be quiet, written, practical or nonverbal; no quick wit or extroversion
    is required. Avoid humor as a test of cultural belonging, emotional resilience or willingness to accept
    disrespect.
  expected_burden: Ten minutes to prepare, one natural low-stakes opportunity and five minutes to review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Humor, warmth, and social ease protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Humor, warmth, and social ease action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Warmth can
    be quiet, written, practical or nonverbal; no quick wit or extroversion is required. Avoid humor as
    a test of cultural belonging, emotional resilience or willingness to accept disrespect.
  actions:
  - stable_id: PRACTICE-COMP-1613-HUMOR-WARMTH-AND-SOCIAL-EASE-01-A1
    sequence: 1
    title: Check the target, timing and cost of the joke
    instructions: 'Write the intended light moment and identify who or what bears its cost. Prefer a shared
      harmless situation or your own small non-sensitive mishap, without turning self-deprecation into
      an invitation for reassurance. Ask whether the setting allows play, whether someone is currently
      distressed and whether the line would still be acceptable if nobody laughed. Remove any dependence
      on humiliation, insider exclusion or a person’s inability to object.


      Observation checks: The joke’s target and possible social cost are explicit; Timing and the current
      emotional setting are considered; No private vulnerability or identity becomes the price of humor;
      The line remains acceptable without laughter or reassurance. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1613-HUMOR-WARMTH-AND-SOCIAL-EASE-01
      action_stable_id: PRACTICE-COMP-1613-HUMOR-WARMTH-AND-SOCIAL-EASE-01-A1
      competency_stable_id: '16.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1613_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1613_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_joke_s_target_and_possible_social_cost_are_explicit
        - timing_and_the_current_emotional_setting_are_considered
        - no_private_vulnerability_or_identity_becomes_the_price_of_humor
        - the_line_remains_acceptable_without_laughter_or_reassurance
      - measurement_id: c1613_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1613_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
