        criteria:
        - the_moment_fits_rather_than_interrupts_the_interaction
        - the_playful_comment_is_offered_once_without_pressure
        - the_actual_response_is_observed_without_mind_reading
        - a_quiet_or_neutral_response_can_be_accepted_gracefully
      - measurement_id: c1613_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1613_a2_adverse
        kind: boolean
