meaning_and_fit:
  purpose: Use greeting, timing, appearance, manners and attention to show respect for a setting without
    treating one class-coded or cultural style as universal superiority.
  why_recommended: Use greeting, timing, appearance, manners and attention to show respect for a setting
    without treating one class-coded or cultural style as universal superiority.
  claims:
  - statement: Use greeting, timing, appearance, manners and attention to show respect for a setting without
      treating one class-coded or cultural style as universal superiority.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Etiquette, courtesy, and first impressions practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Etiquette, courtesy, and first impressions as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a written introduction, interpreter, support person, sensory accommodations
    or advance access request. Courtesy includes receiving accommodations without shame and respecting
    another person’s limits. A fictional visit plan is preparation, not evidence of a considerate actual
    interaction.
  opportunity_considerations: 'Default setting: attending a community workshop for the first time. Use
    the invitation or organizer’s information to check arrival time, location, practical clothing needs,
    participation expectations and access arrangements. Do not buy new clothing or invent a formal dress
    code when none is stated.'
  prerequisites:
  - 'Default setting: attending a community workshop for the first time. Use the invitation or organizer’s
    information to check arrival time, location, practical clothing needs, participation expectations
    and access arrangements. Do not buy new clothing or invent a formal dress code when none is stated.'
  dependencies: []
  safe_alternatives:
  - Use a written introduction, interpreter, support person, sensory accommodations or advance access
    request. Courtesy includes receiving accommodations without shame and respecting another person’s
    limits. A fictional visit plan is preparation, not evidence of a considerate actual interaction.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Etiquette, courtesy, and first impressions differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Etiquette, courtesy, and first
    impressions as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default setting: attending a community workshop for the first time. Use the invitation or organizer’s
    information to check arrival time, location, practical clothing needs, participation expectations
    and access arrangements. Do not buy new clothing or invent a formal dress code when none is stated.
    Goal: Use greeting, timing, appearance, manners and attention to show respect for a setting without
    treating one class-coded or cultural style as universal superiority. Scope: This is contextual courtesy,
    not a judgment of attractiveness, wealth, accent or social rank. Necessary access supports and personal
    dignity take priority over unexamined conventions. Time and effort: Fifteen minutes to prepare, one
    ordinary meeting or visit and a five-minute follow-up. Adaptation: Use a written introduction, interpreter,
    support person, sensory accommodations or advance access request. Courtesy includes receiving accommodations
    without shame and respecting another person’s limits. A fictional visit plan is preparation, not evidence
    of a considerate actual interaction. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written introduction, interpreter, support person, sensory accommodations
    or advance access request. Courtesy includes receiving accommodations without shame and respecting
    another person’s limits. A fictional visit plan is preparation, not evidence of a considerate actual
    interaction.
  expected_burden: Fifteen minutes to prepare, one ordinary meeting or visit and a five-minute follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Etiquette, courtesy, and first impressions protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Etiquette, courtesy, and first impressions action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written
    introduction, interpreter, support person, sensory accommodations or advance access request. Courtesy
    includes receiving accommodations without shame and respecting another person’s limits. A fictional
    visit plan is preparation, not evidence of a considerate actual interaction.
  actions:
  - stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01-A1
    sequence: 1
    title: Distinguish stated requirements from assumptions
    instructions: 'Read the actual invitation and note the start time, arrival route, what to bring and
      any practical safety or clothing requirement. Separate these from your guesses about formality,
      greetings or status. Verify one uncertainty with the organizer when it matters, such as whether
      late arrival disrupts the session. Plan transport and a modest arrival buffer, with a notification
      route if a delay occurs.


      Observation checks: The invitation’s actual requirements are identified; Assumed formality is not
      presented as a rule; One consequential uncertainty is checked when needed; Arrival and delay notification
      are planned realistically. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01
      action_stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01-A1
      competency_stable_id: '16.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1614_a1_primary
      transfer_disposition: context_bound
      measurements:
