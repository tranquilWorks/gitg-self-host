      - [How To Avoid a Scam](https://consumer.ftc.gov/articles/how-avoid-scam)

      - [The logic of indirect speech](https://pubmed.ncbi.nlm.nih.gov/18199841/)

      - [Autobiography of Intercultural Encounters](https://rm.coe.int/autobiography-of-intercultural-encounters/16806bf02d)

      - [Communication Access](https://www.asha.org/practice/communication-access/)

      - [Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [National CLAS Standards](https://thinkculturalhealth.hhs.gov/clas/standards)

      - [Mistakenly Seeking Solitude](https://faculty.haas.berkeley.edu/jschroeder/Publications/Epley&Schroeder2014.pdf)

      - [How many hours does it take to make a friend?](https://journals.sagepub.com/doi/10.1177/0265407518761225)

      - [A new look at social support: a theoretical perspective on thriving through relationships](https://pubmed.ncbi.nlm.nih.gov/25125368/)

      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Read after making the first arrival plan.


      Lee replies: “The side entrance is level, but it is locked until 13:50. Wait under the covered sign
      there; I will meet you. Phone communication aids are welcome. Please photograph only your own finished
      work after checking with me; some participants do not want their projects included.”


      On Saturday the earlier bus is delayed and now reaches the stop at 13:58. The six-minute walk is
      unchanged. You can safely send Lee a short message before walking. Lee later says, “Thanks for the
      update. Come directly to Room B; don''t wait for me at the side door because another helper will
      open it.”


      Recompute expected arrival as 14:04, four minutes after the start. Notify Lee with that estimate
      and follow the changed entry instruction. Do not preserve a tidy punctuality claim or assume that
      a helper opening the door proves all access needs were met. The supplied host response acknowledges
      the update; it does not describe every participant''s experience. A photo request remains a request
      until permission is actually given. Name a specific repair and retain the uncertainty about the
      visit as a whole.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Courtesy makes a shared situation easier to navigate. It includes arriving when expected, choosing
      practical clothing, acknowledging people, respecting their space and keeping small commitments.
      It is not a competition in polish. In this practice, prepare for one ordinary first visit, check
      a consequential uncertainty, then compare your preparation with what actually helped. Allow fifteen
      minutes to prepare, the visit itself and five minutes afterward.


      ### Separate respect from a familiar manner


      The Emily Post Institute distinguishes its principles of consideration, respect and honesty from
      particular manners [S01](https://emilypost.com/advice/the-principles-of-etiquette). This is first-party
      etiquette guidance, not evidence that one social code works everywhere. Here, a manner earns its
      place through its effect in this setting. A greeting can recognize someone without a handshake.
      Attention can include looking away to process speech. Appropriate dress can mean clothes that permit
      safe participation, not expensive clothes or conformity to a gender expectation.


      Read an invitation in two columns: stated requirements and your assumptions. “Closed shoes for the
      craft room” is different from “everyone probably dresses formally.” Requirements can also need clarification
      or accommodation; an invitation does not make an inaccessible rule reasonable. Ask about the practical
      purpose and alternatives. Do not buy an outfit to pass this exercise, or treat another person''s
      accent, grooming resources, mobility or appearance as a measure of respect.


      Punctuality involves other people''s coordination, but delays are not always within your control.
      Plan from the requested arrival time, allow a reasonable buffer, and know whom to notify if the
      plan changes. Excessively early arrival can burden a host who is still preparing. Considerate repair
      means giving useful information and reducing disruption, not demanding that others reassure you
      about being late.


      ### Worked example: the rehearsal is not open yet


      Jo is invited to a rehearsal starting at 18:00. The organizer says doors open at 17:50 and asks
      visitors to use the side entrance. Jo''s usual bus would arrive at 17:57 with an eight-minute walk.
      That is too late for the start even though the bus arrives before 18:00. Jo chooses an earlier route,
      waits outside the preparation area until doors open, and checks whether the side entrance has steps.
      This is a coordination decision, not proof that Jo has made a good impression.


      At the door, Jo says their name and that they are visiting, then asks where to put a bag. A person
      using a phone to communicate should not have to put it away to satisfy a blanket “devices off” rule.
      Jo reduces optional distractions while keeping needed access tools available. The useful question
      is whether attention can be shared, not whether attention looks conventional.


      ### Your case: first community workshop


      This fictional invitation is complete: “Saturday, 14:00–15:30, paper-making workshop in Room B.
      Doors open 13:50. Free; materials and aprons supplied. Wear clothes you do not mind marking and
      closed shoes. No food in the work area. Ask Lee, the host, before photographs. Reply to Lee by Thursday
      if attending or if you need an access arrangement.” The main entrance has three steps; the side
      entrance''s access is not stated. Your bus reaches the stop at 13:42; the walk takes six minutes.
      A later bus arrives at 13:55. You have suitable clothes already, use your phone for a written communication
      aid, and would like to photograph your own finished sheet.


      1. **Prepare the visit, not a persona.** Record the stated time, place, cost, practical clothing,
      supplied items and permissions. Mark the side entrance as unknown. Choose the earlier bus: arrival
      at 13:48 leaves two minutes before doors open and twelve before the start. Ask Lee about an appropriate
      waiting place and usable access route if these matter to you. Output: a compact arrival plan with
      one actual question, not a guess about the building.

      2. **Prepare a greeting and attention arrangement.** Rehearse “Hello, I''m here for the workshop;
      where should I put my bag?” Adapt speech or writing to your needs. Keep the communication aid available,
      silence avoidable alerts and ask how instructions will be shared. Do not promise uninterrupted eye
      contact. Output: a greeting and an attention choice that could work during the activity.

      3. **Participate with permission.** Follow practical directions about materials and food, ask before
      moving another person''s work, and request permission for the photograph without including other
      people or their details by default. A refusal leaves you free to keep a memory without a picture.
      Output: what you actually asked or did, with any unanswered permission left pending.

      4. **Close and repair.** Return borrowed items, thank the host for something specific and fulfill
      any commitment you made. If late, briefly acknowledge the disruption and ask how to join without
      restarting the group. Open the [later packet](?resource=file-later-packet-md) only after saving
      your first plan. Output: a corrected plan and one assumption checked against the supplied information.


      ### Evaluate effects without inventing approval


      After a real visit, ask a narrow welcome question if appropriate: “Was my arrival arrangement workable?”
      A volunteered response can tell you more than your own impression of looking composed. It still
      concerns this interaction, not your universal social competence. If no feedback is available, record
      the action and uncertainty. Do not translate a smile into proof that everyone experienced you as
      considerate.


      A meaningful attempt may include an awkward greeting, a declined photograph or a delay followed
      by repair. A polished written plan with no visit remains preparation. Notice whether your behavior
      reduced confusion, respected an explicit request or created an avoidable burden. Avoid keeping private
      observations about the host''s personality in the application.


      For support, use a short written arrival card, travel with a welcome companion, request directions
      in an accessible format or choose a familiar venue for the first attempt. The task should not require
      shopping, touch or accent change. For a harder attempt, the host''s routine conflicts with a needed
      access tool: explain the tool''s function and seek a workable adjustment without apologizing for
      needing it. For transfer, try a different ordinary setting and identify one manner you changed because
      the context changed. Answer the [fresh checks](?attempt=practice-checks) before consulting the key.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These cases are fictional. Answer before opening [the key](?check=practice-answers).


      1. Doors open at 09:50, the activity starts at 10:00, and your transport arrives at 09:47 with a
      seven-minute walk. When would you reach the door? Is arriving before the doors open necessary?

      2. A host calls phone use rude, but a guest uses a phone to communicate. What should change, and
      what would be an inappropriate inference about the guest?

      3. You dressed carefully and sent a thank-you, but the host says you photographed their work without
      permission. What does a useful review and repair include?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Arrival is 09:54: four minutes after opening and six before the start. That fits the stated
      window if the route is usable. Earlier is not automatically more considerate; verify any task-specific
      check-in need rather than inventing it.

      2. Preserve the communication aid and agree how to share attention, while reducing optional distraction
      where feasible. Device use does not establish disrespect. Requiring speech or eye contact to prove
      consideration defeats the practical purpose of courtesy.

      3. Acknowledge the unpermitted photograph and seek the owner''s direction about a proportionate
      remedy, such as removing it from your own use or sharing. Follow through within your control. Clothing
      and thanks do not cancel a specific privacy mistake, and a sincere apology does not prove the effect
      is repaired.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
