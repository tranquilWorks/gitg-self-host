  - stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01-A3
    sequence: 3
    title: Close responsibly and check one assumption
    instructions: 'Thank the host for something specific, return shared items and fulfill any small commitment
      you made. If you arrived late or caused inconvenience, acknowledge the concrete effect and repair
      what is within your control. Afterward compare one initial assumption with what the setting actually
      required. Record considerate actions and remaining uncertainty rather than rating your social impression
      from imagined judgments.


      Observation checks: The interaction ends with specific acknowledgment and returned resources; A
      small commitment or inconvenience receives follow-through; One assumption is compared with the observed
      context; Imagined approval is not used as the evidence of courtesy. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which preparation reduced a real burden on the host or participants, and which convention
      did you discover was only an assumption?


      Examples: Supportive: The visitor verified the practical clothing requirement, arrived with the
      needed materials and returned the borrowed items without assuming a formal dress standard.


      Mixed: The greeting went well, but an unannounced delay disrupted the host and prompted a concrete
      apology and better notification plan.


      Contradictory: A person’s disability support, accent or inexpensive clothing was treated as evidence
      of poor manners.


      Inconclusive: The participant focused on looking impressive but ignored timing, shared resources
      and follow-through.'
