  - stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01-A2
    sequence: 2
    title: Enter and participate with attention to the host’s work
    instructions: 'Use a greeting and introduction appropriate to the setting, follow the host’s direction
      about seating or materials and ask before taking photos or sharing others’ contact information.
      Keep optional device use from displacing attention while preserving access needs. Make room for
      other participants and handle shared resources as instructed. No handshake, eye contact or particular
      accent is required to demonstrate courtesy.


      Observation checks: Greeting and introduction fit the actual setting; Shared-space and resource
      instructions are followed; Photography and personal-information sharing require permission; Respect
      is not equated with one bodily or cultural convention. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01
      action_stable_id: PRACTICE-COMP-1614-ETIQUETTE-COURTESY-AND-FIRST-IMPRESSIONS-01-A2
      competency_stable_id: '16.14'
