        - assumed_formality_is_not_presented_as_a_rule
        - one_consequential_uncertainty_is_checked_when_needed
        - arrival_and_delay_notification_are_planned_realistically
      - measurement_id: c1614_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
