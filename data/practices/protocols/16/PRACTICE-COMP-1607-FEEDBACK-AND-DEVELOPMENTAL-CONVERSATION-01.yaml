  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Feedback and developmental conversation; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use asynchronous text, a model comparison or self-review when a partner is unavailable; self-review
      cannot be reported as received interpersonal feedback. In evaluative or power-imbalanced settings,
      follow the formal process and seek appropriate support instead of staging a supposedly voluntary
      exchange.
    cultural_context:
    - Adapt the expression of Feedback and developmental conversation to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use asynchronous text, a model comparison or self-review when a partner is unavailable; self-review
      cannot be reported as received interpersonal feedback. In evaluative or power-imbalanced settings,
      follow the formal process and seek appropriate support instead of staging a supposedly voluntary
      exchange.
  pause_conditions:
  - Pause Feedback and developmental conversation when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Feedback and developmental conversation practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Feedback and developmental conversation situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
