  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Feedback connects an observed feature to its practical effect and a possible improvement. A
      developmental conversation also gives the recipient room to explain, correct the observation, choose
      a response and review a later attempt. This practice has two directions: you give feedback on a
      fictional invitation and receive feedback on your own revision. Allow fifteen minutes to prepare,
      a short willing exchange and ten minutes to revise. Use a harmless artifact, not a surprise appraisal
      of someone''s personality or a disciplinary matter.


      ### Observation, effect and proposal are different claims


      “The invitation says ‘usual place’” is an observable feature. “A first-time visitor may not know
      where to go” explains a plausible effect; if a reader actually went to the wrong place, report that
      narrower observed event. “Use a large map” is one possible solution, not a fact proved by the problem.
      A text address or clear room name may solve the same issue more accessibly.


      A useful comment names what should continue as specifically as what should change. “The reply deadline
      is easy to find; keep it beside the response route” identifies a working feature. Generic praise
      followed by a hidden criticism can leave the person unsure which part matters. Timeliness means
      the feedback arrives while the recipient can use it and is welcome; it does not justify public interruption
      or constant monitoring.


      MIT''s teaching activity distinguishes description from evaluation and asks the recipient to identify
      the behavior, evidence, effect and request [S08](https://ocw.mit.edu/courses/15-277-special-seminar-in-communications-leadership-and-personal-effectiveness-coaching-fall-2008/37362bb8a9db0e92731e53a1a2099373_guide_02.pdf).
      This companion uses an original invitation case and permits accepting, adapting or declining a proposed
      fix. It does not require scripted feelings, public disclosure or role-playing a distressing real
      conflict.


      ### Worked example: a useful correction to your correction


      A reviewer says, “The activity sheet is confusing; make it more colorful.” The author asks which
      task was difficult. The reviewer explains they could not tell whether to submit one answer or both.
      The author restates the actual problem, then changes the instruction to “Choose one of the two questions
      and submit one answer.” They decline the color suggestion because it does not resolve the ambiguity
      and would not help a monochrome printout.


      The reviewer tries again and correctly identifies one answer. That supports the specific repair
      in that attempt; it does not validate every instruction on the sheet. Receiving feedback well did
      not require agreeing with the first solution or displaying gratitude on command. It required understanding
      the observation, responding with reasons and checking the relevant result.


      ### Your artifact: the invitation


      Here is the complete fictional first draft: “Making afternoon. Saturday 7 November, 14:00–15:30.
      Come to the usual room. Beginners welcome; bring the necessary things. Reply to Neri by Thursday
      5 November at 18:00 if you want a place.” The approved facts are: Room C in the community building;
      east step-free entrance; paper and pencils supplied; no purchase required; participants may bring
      an optional example of their own work; Neri accepts replies through the group''s existing message
      thread. This is a local fictional exercise, not an actual event notice.


      A willing partner can act as the author or reviewer. Agree to focus only on whether a first-time
      participant can find the session and know what to bring. Do not evaluate graphic style, the author''s
      diligence or unrelated writing ability. If working alone, preserve the distinction between self-review
      and an interpersonal feedback exchange.


      1. **Give one bounded piece of feedback.** Identify a strength worth keeping and a specific ambiguous
      phrase within the agreed scope. Explain the task consequence, ask what the author intended and propose
      one change. Keep your proposed solution separate from the observed defect. Output: a comment someone
      could act on without inferring a character judgment.

      2. **Produce your own revised invitation.** Use the approved facts and no invented requirements.
      Preserve date, start/end, reply deadline and response route while clarifying location and supplies.
      Give it to a willing reader and ask what they would do to attend. Output: the actual revision, not
      merely a plan to “be clearer.”

      3. **Receive criticism before defending.** Ask for one specific difficulty. Restate the observation
      and effect; if the criticism is vague, request an example. Decide whether to accept, adapt or decline
      the proposed fix and explain the decision against the task. Do not demand positive feedback to offset
      criticism or agree to an inaccurate claim simply to appear receptive. Output: feedback as received,
      your understanding and your reasoned disposition.

      4. **Use the [later packet](?resource=file-later-packet-md) and review.** Apply a justified change,
      then ask the same reader to retry the original attendance task where possible. Record what should
      continue, what changed and what will be reviewed when. Output: before/after artifacts and a retest
      result or explicit pending status.


      ### Receptivity includes limits


      You may pause if flooded or ask to continue in writing. You may refuse abuse, public humiliation
      or an out-of-scope critique. A proportionate boundary can preserve a useful review: “I can discuss
      the invitation wording; I won''t continue with personal insults.” This exercise is for voluntary
      peers and cannot replace formal responsibilities where employment, safeguarding or rights are at
      issue.


      For support, ask the reviewer to mark one exact phrase and describe one attempted action. Use a
      written comment, accessible format or additional processing time. A person who uses direct language
      need not add a performance of warmth, and a person who prefers a gentle opening can keep it while
      making the observation specific.


      For a harder attempt, two reviewers propose incompatible solutions. Compare the tasks they were
      trying to perform, test a version that addresses the actual problems and retain any tradeoff. Do
      not average suggestions blindly or choose the more senior person''s preference as evidence. Explain
      why a proposed solution was declined without dismissing the experience that prompted it.


      For real transfer, obtain permission to review one low-stakes artifact while it can still be revised.
      Agree the feature and review point, make the actual change and invite a task-based retry. Record
      the artifact and the other person''s actual response separately from self-report. Fictional model
      feedback cannot supply a second independent evidence type or show that an interpersonal conversation
      occurred. The [fresh checks](?attempt=practice-checks) focus on criticism that contains useful information
      even when its proposed solution is poor.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A reviewer says, “This is amateurish.” Give a response that seeks actionable information
      without accepting the global label.

      2. A reader couldn''t find a deadline and proposes using all capital letters throughout. How can
      you accept the observation while declining the solution?

      3. You revise the deadline placement but no one retries the task. Which claims about improvement
      can you make, and which remain pending?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Ask for a specific feature and the task it affected: “Which part made it hard to use, and
      what were you trying to find?” You need not accept a judgment of your ability. If the person continues
      with insults rather than useful information, end or bound the review.

      2. Acknowledge that the deadline was hard to locate, place it in a clear labeled line near the required
      action and explain that all capitals throughout would not distinguish the deadline. Retest finding
      the deadline rather than treating the reviewer''s preferred formatting as the only valid repair.

      3. You can show the concrete edit and its intended mechanism. Improved reader performance remains
      untested; neither feeling less defensive nor receiving the suggestion proves the repair worked.
      Record the retest as pending and retain the before/after copy.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
