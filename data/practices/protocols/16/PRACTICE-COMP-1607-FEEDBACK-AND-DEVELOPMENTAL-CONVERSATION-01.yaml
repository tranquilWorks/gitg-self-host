      - [Kluger and Malloy (2019), Question asking as a dyadic behavior](https://pubmed.ncbi.nlm.nih.gov/31714108/)

      - [Eyal, Steffel and Epley (2018), Perspective mistaking](https://www.nicholasepley.com/publications)

      - [GSA Digital.gov — Write for the reader](https://digital.gov/guides/plain-language/principles/write-for-reader)

      - [W3C WAI — Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [MIT OpenCourseWare — Giving and Receiving Feedback Activity, Christine Kelly course (2008)](https://ocw.mit.edu/courses/15-277-special-seminar-in-communications-leadership-and-personal-effectiveness-coaching-fall-2008/37362bb8a9db0e92731e53a1a2099373_guide_02.pdf)

      - [Aristotle — Rhetoric, Book I, W. Rhys Roberts translation](https://classics.mit.edu/Aristotle/rhetoric.1.i.html)

      - [Dahlstrom (2014), Using narratives and storytelling to communicate science with nonexpert audiences](https://pubmed.ncbi.nlm.nih.gov/25225368/)

      - [MIT NSE Communication Lab — Delivery and Q&A](https://mitcommlab.mit.edu/nse/commkit/delivery-and-qa/)

      - [Harvard HMS/HSDM/HSPH Ombuds — Seven Elements of Effective Negotiations, Jerome Slavik (2008)](https://hms.harvard.edu/sites/default/files/Departments/Ombuds%20Office/files/SEVEN%20ELEMENTS%20OF%20EFFECTIVE%20NEGOTIATIONS.pdf)

      - [Harvard PON — BATNA Analysis Can Help You Avoid the Agreement Trap (2025)](https://www.pon.harvard.edu/daily/batna/too-eager-to-close-nb/)

      - [Acas — Challenging conversations and how to manage them (July 2014)](https://www.acas.org.uk/sites/default/files/2021-04/challenging-conversations-and-how-to-manage-them.pdf)

      - [Kant and Norman (2019), You Must Be Joking!](https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2019.01380/full)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fictional feedback on your revision: “I can find Room C and the time, but ‘optional
      example’ sounded as if I might be turned away without one. Put a red warning box saying NO EXAMPLE
      REQUIRED.”


      Restate the observation: the reader inferred a condition that the event does not impose. The proposed
      red box is one solution, not a requirement. You could instead write, “Everything needed is supplied.
      You do not need to bring anything; you may bring an example of your work if you want.” Keep the
      location, times and reply route that already work. Explain why the wording change addresses the
      inference without depending on color.


      The supplied reader retries: “I can come empty-handed and use the supplied paper and pencils.” This
      supports the supplies clarification within the fictional test. It does not prove the whole invitation
      works, that a real reader participated or that the event happened.


      Now suppose a real reader is unavailable after your edit. Record revision completed, retest pending.
      Write the next review task and time without inventing a confirmation. Both sides should be able
      to identify continue/change/review; agreement with every suggestion is not required.'
