meaning_and_fit:
  purpose: Give specific feedback that can guide a change and receive correction without treating it as
    a verdict on personal worth or automatically defending the original approach.
  why_recommended: Give specific feedback that can guide a change and receive correction without treating
    it as a verdict on personal worth or automatically defending the original approach.
  claims:
  - statement: Give specific feedback that can guide a change and receive correction without treating
      it as a verdict on personal worth or automatically defending the original approach.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Feedback and developmental conversation practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Feedback and developmental conversation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use asynchronous text, a model comparison or self-review when a partner is
    unavailable; self-review cannot be reported as received interpersonal feedback. In evaluative or power-imbalanced
    settings, follow the formal process and seek appropriate support instead of staging a supposedly voluntary
    exchange.
  opportunity_considerations: Use a harmless one-page event invitation or similar draft. Ask a willing
    partner to exchange feedback. Each person chooses the feature they want reviewed, such as whether
    the time and location are easy to find, and may decline comments on unrelated personal qualities.
  prerequisites:
  - Use a harmless one-page event invitation or similar draft. Ask a willing partner to exchange feedback.
    Each person chooses the feature they want reviewed, such as whether the time and location are easy
    to find, and may decline comments on unrelated personal qualities.
  dependencies: []
  safe_alternatives:
  - Use asynchronous text, a model comparison or self-review when a partner is unavailable; self-review
    cannot be reported as received interpersonal feedback. In evaluative or power-imbalanced settings,
    follow the formal process and seek appropriate support instead of staging a supposedly voluntary exchange.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Feedback and developmental conversation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Feedback and developmental
    conversation as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a harmless one-page event invitation or similar draft. Ask a willing partner to exchange
    feedback. Each person chooses the feature they want reviewed, such as whether the time and location
    are easy to find, and may decline comments on unrelated personal qualities. Goal: Give specific feedback
    that can guide a change and receive correction without treating it as a verdict on personal worth
    or automatically defending the original approach. Scope: Use an ordinary voluntary work sample or
    shared task. This is not a disciplinary process, performance rating, therapy or feedback to someone
    who cannot safely decline. Time and effort: Ten minutes to prepare, a fifteen-minute exchange and
    one short follow-up after a revised attempt. Adaptation: Use asynchronous text, a model comparison
    or self-review when a partner is unavailable; self-review cannot be reported as received interpersonal
    feedback. In evaluative or power-imbalanced settings, follow the formal process and seek appropriate
    support instead of staging a supposedly voluntary exchange. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous text, a model comparison or self-review when a partner is unavailable;
    self-review cannot be reported as received interpersonal feedback. In evaluative or power-imbalanced
    settings, follow the formal process and seek appropriate support instead of staging a supposedly voluntary
    exchange.
  expected_burden: Ten minutes to prepare, a fifteen-minute exchange and one short follow-up after a revised
    attempt.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Feedback and developmental conversation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Feedback and developmental conversation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    text, a model comparison or self-review when a partner is unavailable; self-review cannot be reported
    as received interpersonal feedback. In evaluative or power-imbalanced settings, follow the formal
    process and seek appropriate support instead of staging a supposedly voluntary exchange.
  actions:
  - stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01-A1
    sequence: 1
    title: Give an observation linked to the requested outcome
    instructions: 'Inspect the agreed feature and name a specific example: I found the date quickly, but
      I had to reread the paragraph to find the room. Explain the practical effect and offer one possible
      adjustment, such as placing date, time and room together. Ask whether the observation fits the author’s
      intention. Include what should continue, not only what is wrong, and avoid interpreting carelessness
      or ability from one draft.


      Observation checks: Feedback stays within the agreed feature and sample; A specific observation
      is linked to its practical effect; One actionable adjustment and one useful existing feature are
      named; Character and motive judgments are excluded. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01
      action_stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01-A1
      competency_stable_id: '16.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1607_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1607_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - feedback_stays_within_the_agreed_feature_and_sample
        - a_specific_observation_is_linked_to_its_practical_effect
        - one_actionable_adjustment_and_one_useful_existing_feature_are_named
        - character_and_motive_judgments_are_excluded
      - measurement_id: c1607_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1607_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01-A2
    sequence: 2
    title: Receive one correction with clarification before judgment
    instructions: 'Invite feedback on your own sample and first restate what you heard. Ask for an example
      or the desired outcome when the comment is vague. Distinguish the observation from the suggested
      solution: you may accept that the room is hard to find while choosing a different layout. Record
      what you will try, what you will not change and why, without dismissing the person or pretending
      every suggestion must be adopted.


      Observation checks: The received feedback is restated before defending the draft; Vague comments
      are clarified with an example or outcome; Observation and proposed solution are evaluated separately;
      A reasoned acceptance adaptation or refusal is explicit. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01
      action_stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01-A2
      competency_stable_id: '16.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1607_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1607_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_received_feedback_is_restated_before_defending_the_draft
        - vague_comments_are_clarified_with_an_example_or_outcome
        - observation_and_proposed_solution_are_evaluated_separately
        - a_reasoned_acceptance_adaptation_or_refusal_is_explicit
      - measurement_id: c1607_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1607_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01-A3
    sequence: 3
    title: Make one revision and compare the result together
    instructions: 'Apply the chosen change to a copy and ask the same reviewer to perform the original
      task again, such as finding when and where to attend. Compare the result with the earlier difficulty.
      Agree what should continue, what still needs change and whether another review is useful. Keep feedback
      wording and identities private; a completed exchange does not prove professional competence or a
      permanently safe feedback culture.


      Observation checks: A real revision is made rather than only promised; The same practical task is
      checked again; Continue change and next-review decisions are explicit; The outcome remains limited
      to the reviewed sample and exchange. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which observation led to a concrete revision, and did the second attempt solve the
      reader’s problem rather than merely satisfy the reviewer?


      Examples: Supportive: Both authors identified a usable feature and one confusing detail, revised
      their drafts and checked that the date and room could be found.


      Mixed: The feedback was specific but no second attempt occurred, so the proposed improvement remained
      untested.


      Contradictory: Criticism became a personality judgment or the receiver was pressured to accept every
      suggestion as proof of humility.


      Inconclusive: General praise and criticism were exchanged without an example, adjustment or review
      point.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01
      action_stable_id: PRACTICE-COMP-1607-FEEDBACK-AND-DEVELOPMENTAL-CONVERSATION-01-A3
      competency_stable_id: '16.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
