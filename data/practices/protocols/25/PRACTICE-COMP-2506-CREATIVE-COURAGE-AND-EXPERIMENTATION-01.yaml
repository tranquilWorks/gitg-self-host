  - stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01-A2
    sequence: 2
    title: Ask for bounded feedback on unfinished work
    instructions: 'Show one or two drafts to a willing reader and state that they are experiments. Ask
      where they became interested and where they lost the thread. Request observations, not a global
      rating of you or the work. Accept a declined review and do not seek escalating reassurance. If no
      reviewer is available, return after a break and mark the exact sentence where your own understanding
      falters, labeling this self-review rather than independent feedback.


      Observation checks: The unfinished status and feedback purpose are clear; Feedback asks about specific
      moments and effects; Participation is voluntary and no reassurance pressure is used; Self-review
      is not represented as another person’s judgment. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01
      action_stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01-A2
      competency_stable_id: '25.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
