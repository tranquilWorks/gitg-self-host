  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Clearer reference, with the original question only partly resolved


      Version A2 changes sentence five and preserves all other sentences:


      > At dusk Mina carried the returned umbrella past the florist.\

      > Ten minutes earlier, the florist had pointed to the blue ribbon on its handle.\

      > Before that, Mina had said the ribbon belonged to her.\

      > Earlier, a cyclist had brought the umbrella into the shop.\

      > Before that, the cyclist had lifted it from the rain beside the bus stop.\

      > At noon, Mina had left it leaning against the bus-stop bench.


      The supplied reader now identifies the cyclist as the finder without a hint. The reader still says
      that the repeated time markers make the piece feel like a timeline rather than a surprising story.
      The reference repair helped this fictional reader; the larger effect of curiosity remains uncertain.


      Do not erase A or announce that reverse chronology failed as a form. The next possible experiment
      is to vary one time marker while preserving event order, but it has not been attempted. The maker
      instead stops after the agreed retry and keeps the flower-stem comparison from C as a detail to
      revisit later. No actual reader, repeated learner practice or improvement in courage has been observed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Try three different ways of returning a lost umbrella, then learn from one choice that does
      not work. Allow three ten-minute drafts, fifteen minutes for critique or delayed self-review, and
      one ten-minute retry. The finished record contains alternatives and a reasoned change; it does not
      rate your courage or talent.


      ### Make an uncertainty small enough to examine


      A creative experiment changes a constraint so that an effect can be noticed. Telling an event backward
      might create curiosity, or might obscure who did what. Dialogue can reveal relationships while withholding
      context. An object''s imagined viewpoint can make the familiar strange, but may become an explanation
      disguised as a voice. State which uncertainty each attempt explores before deciding whether you
      like it.


      The Montana State University Writing Center''s [feedback guidance, S01](https://www.montana.edu/writingcenter/writing_resources/feedback.html)
      supports requests directed at a particular writing goal and consideration of suggestions against
      that goal. It does not prescribe these umbrella stories or validate a courage assessment. The examples,
      time limits and fictional responses here belong to the curriculum exercise.


      Low stakes matter because you need room to keep an unsuccessful draft. Use invented ordinary events,
      familiar materials and an audience small enough to be freely chosen. Sharing is optional when delayed
      self-review is the available route. Humiliation, private trauma, dangerous performance and escalating
      requests for reassurance do not make an experiment more useful.


      ### Supplied experiment file U9


      The common event is simple: Mina leaves an umbrella at a bus stop, a cyclist finds it, and a florist
      returns it. A blue ribbon helps identify it. The first version tests backward order, the second
      only dialogue, and the third the umbrella''s fictional perspective. Each is six sentences and is
      retained as drafted. No actual learner wrote these passages in three measured sessions.


      **Version A: backward order.** Question: does reverse chronology invite reconstruction while leaving
      each actor clear?


      > At dusk Mina carried the returned umbrella past the florist.\

      > Ten minutes earlier, the florist had pointed to the blue ribbon on its handle.\

      > Before that, Mina had said the ribbon belonged to her.\

      > Earlier, a cyclist had brought the umbrella into the shop.\

      > Before that, she had lifted it from the rain beside the bus stop.\

      > At noon, Mina had left it leaning against the bus-stop bench.


      The order moves from return to loss, but sentence five''s “she” leaves the finder unclear. A reader
      might attach it to Mina rather than the cyclist. Keep that defect in Version A; do not silently
      replace it before inviting critique. The problem concerns the reference of a word in a sequence,
      not the writer''s identity.


      **Version B: dialogue only.** Question: can an exchange supply the necessary event without a narrator
      explaining it?


      > “Does this blue ribbon belong to you?”\

      > “It was tied to my umbrella.”\

      > “Then you left a small flag at the bus stop.”\

      > “I thought the umbrella was gone.”\

      > “The cyclist next door brought it in.”\

      > “I will leave the ribbon on so it can find me again.”


      The last line treats the ribbon as an aid to return and gives the exchange a playful turn. The voices
      are not named inside the piece; that may keep it light or make the participants hard to distinguish.
      This remains a separate uncertainty from Version A''s chronology. Dialogue-only does not mean the
      reader must infer every practical fact correctly on the first pass.


      **Version C: umbrella viewpoint.** Question: can an imagined object carry surprise without requiring
      a lesson at the end?


      > My blue ribbon spent the afternoon waving for someone who had already left.\

      > Rain collected in my folded sleeves.\

      > A cyclist lifted me by the handle and carried me into the flower shop.\

      > For an hour I stood among stems that were much better at drinking.\

      > Then Mina recognized the ribbon and took me outside.\

      > I opened over her as if returning a small favor.


      The object voice allows an invented comparison between wet fabric and flower stems. It does not
      report an object''s actual feelings or claim novelty beyond this small work. One reader may enjoy
      the final courtesy; another may find it too neatly sentimental. That disagreement can become a new
      question instead of a contest over the correct response.


      ### Ask about a moment, not a verdict


      The supplied maker chooses Versions A and C for a private review. The fictional request is: “These
      are short experiments about the same event. Would you be willing to read them in plain text and
      say where you became curious or lost track of the action?” A decline ends the request. No explanation,
      praise or replacement reviewer is owed.


      The fictional reader accepts the format and identifies sentence five of A as the point where the
      finder becomes unclear. For C, the reader notices the flower-stem comparison but says the last sentence
      explains the kindness more than needed. These are supplied responses to particular features. They
      do not establish actual outside feedback, consensus or the best version for all audiences.


      Separate observation, suggestion and decision. “I lost track at sentence five” is a reception observation;
      “name the cyclist” is a possible repair; choosing that repair belongs to the maker. A reviewer can
      help without taking control of the work. You can reject a suggestion with a purpose-based reason
      while still keeping the observed difficulty in the record.


      ### Retry one feature and retain the original


      Choose A''s reference problem for the ten-minute retry. Change only the uncertain actor in sentence
      five, leaving its position and the six-sentence structure intact. This keeps the comparison interpretable.
      If you also changed the ending, tense and viewpoint, a clearer result would be harder to attribute
      to the named repair.


      Before opening the [later packet](?resource=file-later-packet-md), write what a useful result would
      look like: a reader can identify the cyclist as finder without needing a hint. Curiosity is a second
      question, not automatically resolved by correct reference. An unsuccessful retry may lead to another
      bounded experiment or a stop. There is no requirement to keep working until the exercise appears
      successful.


      ### Produce the experiment record


      1. State three uncertainties and make the three constrained versions within their separate ten-minute
      windows. For the default, retain backward order, dialogue-only and object viewpoint, with six sentences
      each.

      2. Keep all drafts and name one surprise and one failure in the work. Describe choices and effects
      rather than calling yourself creative or uncreative.

      3. Invite a willing small audience to one or two drafts with a specific question, or return after
      a break. Label a delayed self-review accurately; it is not another person''s response.

      4. Save the original, select one feature and make a bounded retry. Compare against the original
      question and preserve incomplete or negative results.

      5. Choose a next experiment, a pause or a stop. Keep sharing scope and participation voluntary throughout.


      For support, work from the supplied common event so inventing plot does not consume the whole session.
      For a harder pass, change the unreliable pronoun without adding a sentence, then see whether reverse
      order still serves the intended effect. Drawing panels, audio or movement notation may carry comparable
      constraints through a safe accessible form. An actual attempt needs actual made work; reading these
      specimens is preparation.


      The evidence can show repeated exploration and a traceable response to critique under the recorded
      conditions. It cannot establish stable courage, universal originality or a successful audience relationship.
      Keeping the awkward version visible is part of making the learning inspectable.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A backward draft confuses a reader, so you replace it with a polished chronological draft before
      saving anything. What evidence was lost?

      2. A reviewer declines your short piece. Must you obtain praise elsewhere to finish the feedback
      part?

      3. Naming the finder fixes a pronoun problem, but the story still feels flat. Did the retry prove
      the whole experiment successful?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The initial experimental result and the specific source of confusion are no longer inspectable.
      Retain the original, identify the feature at issue and label a new draft as a revision rather than
      pretending the first attempt worked.

      2. No. Respect the decline. Use delayed self-review when appropriate and label it as such, or record
      that audience feedback is unavailable. A request for useful observations does not create a duty
      to reassure you.

      3. No. It supports a narrow reference improvement for the observed reader or review. Keep the unresolved
      effect visible and choose a bounded next change or stop without making the result a talent verdict.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
