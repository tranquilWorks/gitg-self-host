        criteria:
        - the_unfinished_status_and_feedback_purpose_are_clear
        - feedback_asks_about_specific_moments_and_effects
        - participation_is_voluntary_and_no_reassurance_pressure_is_used
        - self_review_is_not_represented_as_another_person_s_judgment
      - measurement_id: c2506_a2_boundary
        kind: boolean
