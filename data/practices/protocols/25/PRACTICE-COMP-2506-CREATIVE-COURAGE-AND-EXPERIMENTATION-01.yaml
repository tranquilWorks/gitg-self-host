        expected: true
  - stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01-A3
    sequence: 3
    title: Retry one choice and state what remains unknown
    instructions: 'Select one concrete suggestion or observed problem and revise only that feature, such
      as moving one clue or shortening a line. Compare the revised passage with the original and explain
      whether the change served the tested purpose. Keep an unsuccessful retry as useful information and
      choose a next experiment or a stop. The goal is a learning cycle, not proving that every risk produces
      better art.


      Observation checks: One concrete feature is revised rather than everything at once; The comparison
      refers to the original experimental question; An unsuccessful retry can remain a valid result; The
      next choice is bounded and does not require proving talent. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which failed attempt taught something that a safe first draft would not, and what
      kind of critique helped without taking control of the work?


      Examples: Supportive: The backward version confused the reader, one clue was moved and the retry
      clarified the intended surprise without erasing the original experiment.


      Mixed: All drafts were made, but self-review rather than outside critique left audience reception
      uncertain.


      Contradictory: A critical response became a worth verdict or a reviewer was pressured to praise
      the unfinished work.


      Inconclusive: Only one safe draft was polished repeatedly, with no alternatives, retained failure
      or specific critique.'
    expected_time: 15-25 minutes
    due_within_days: 10
