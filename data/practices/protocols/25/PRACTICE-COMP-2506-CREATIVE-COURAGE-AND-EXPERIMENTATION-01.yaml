meaning_and_fit:
  purpose: Generate alternatives, tolerate an unsuccessful attempt and use feedback on unfinished work
    without turning each result into a verdict about identity.
  why_recommended: Generate alternatives, tolerate an unsuccessful attempt and use feedback on unfinished
    work without turning each result into a verdict about identity.
  claims:
  - statement: Generate alternatives, tolerate an unsuccessful attempt and use feedback on unfinished
      work without turning each result into a verdict about identity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Creative courage and experimentation practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Creative courage and experimentation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use audio, drawing, movement notation or another accessible safe form. Share
    privately with a trusted person or use delayed self-review. Do not expose sensitive material, accept
    humiliating feedback or perform physically risky acts to demonstrate creative courage.
  opportunity_considerations: 'Use the original prompt of a lost umbrella being returned. Produce three
    six-sentence versions: one told backward, one using only dialogue and one from the umbrella’s fictional
    point of view. Set a small private audience and a feedback question about clarity or surprise. Do
    not use real private incidents or imitate someone’s trauma.'
  prerequisites:
  - 'Use the original prompt of a lost umbrella being returned. Produce three six-sentence versions: one
    told backward, one using only dialogue and one from the umbrella’s fictional point of view. Set a
    small private audience and a feedback question about clarity or surprise. Do not use real private
    incidents or imitate someone’s trauma.'
  dependencies: []
  safe_alternatives:
  - Use audio, drawing, movement notation or another accessible safe form. Share privately with a trusted
    person or use delayed self-review. Do not expose sensitive material, accept humiliating feedback or
    perform physically risky acts to demonstrate creative courage.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Creative courage and experimentation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Creative courage and experimentation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the original prompt of a lost umbrella being returned. Produce three six-sentence versions:
    one told backward, one using only dialogue and one from the umbrella’s fictional point of view. Set
    a small private audience and a feedback question about clarity or surprise. Do not use real private
    incidents or imitate someone’s trauma. Goal: Generate alternatives, tolerate an unsuccessful attempt
    and use feedback on unfinished work without turning each result into a verdict about identity. Scope:
    Three small experiments test willingness to explore and revise, not courage as a trait or a requirement
    for public exposure. Critique must be voluntary and respectful. Time and effort: Three ten-minute
    drafts, a fifteen-minute critique or self-review and one ten-minute retry. Adaptation: Use audio,
    drawing, movement notation or another accessible safe form. Share privately with a trusted person
    or use delayed self-review. Do not expose sensitive material, accept humiliating feedback or perform
    physically risky acts to demonstrate creative courage. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use audio, drawing, movement notation or another accessible safe form. Share privately
    with a trusted person or use delayed self-review. Do not expose sensitive material, accept humiliating
    feedback or perform physically risky acts to demonstrate creative courage.
  expected_burden: Three ten-minute drafts, a fifteen-minute critique or self-review and one ten-minute
    retry.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Creative courage and experimentation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Creative courage and experimentation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use audio,
    drawing, movement notation or another accessible safe form. Share privately with a trusted person
    or use delayed self-review. Do not expose sensitive material, accept humiliating feedback or perform
    physically risky acts to demonstrate creative courage.
  actions:
  - stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01-A1
    sequence: 1
    title: Make alternatives before choosing a winner
    instructions: 'Create the three constrained versions within the same short time limit. Keep each draft
      even if it is awkward and mark one uncertainty you were testing, such as whether backward order
      creates curiosity or confusion. Do not quietly replace an unsuccessful draft with a polished one
      before review. Identify one surprise and one failure without attaching either to being talented
      or untalented.


      Observation checks: All three distinct constraints are attempted; Each draft has a stated creative
      uncertainty; An unsuccessful draft is retained honestly; Observations concern the experiment rather
      than personal identity. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01
      action_stable_id: PRACTICE-COMP-2506-CREATIVE-COURAGE-AND-EXPERIMENTATION-01-A1
      competency_stable_id: '25.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2506_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2506_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_three_distinct_constraints_are_attempted
        - each_draft_has_a_stated_creative_uncertainty
        - an_unsuccessful_draft_is_retained_honestly
