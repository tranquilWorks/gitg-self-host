meaning_and_fit:
  purpose: Choose a coherent arrangement of dress, space or objects that expresses identity and beauty
    while respecting function, access and hospitality rather than copying status cues.
  why_recommended: Choose a coherent arrangement of dress, space or objects that expresses identity and
    beauty while respecting function, access and hospitality rather than copying status cues.
  claims:
  - statement: Choose a coherent arrangement of dress, space or objects that expresses identity and beauty
      while respecting function, access and hospitality rather than copying status cues.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Personal style and aesthetic environment practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Personal style and aesthetic environment as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a clothing combination, digital workspace or tactile arrangement when
    a physical corner is unavailable. Preserve assistive devices and sensory needs. Aesthetic coherence
    can be achieved without buying, discarding useful possessions or conforming to gender, class or cultural
    stereotypes.
  opportunity_considerations: 'Choose a small surface or reading corner already under your control. Use
    only existing safe items: a book, a useful container and one object you enjoy. The intended effect
    is calm and welcoming while keeping the surface usable. Do not move another person’s possessions or
    obstruct exits, mobility routes, ventilation or necessary equipment.'
  prerequisites:
  - 'Choose a small surface or reading corner already under your control. Use only existing safe items:
    a book, a useful container and one object you enjoy. The intended effect is calm and welcoming while
    keeping the surface usable. Do not move another person’s possessions or obstruct exits, mobility routes,
    ventilation or necessary equipment.'
  dependencies: []
  safe_alternatives:
  - Use a clothing combination, digital workspace or tactile arrangement when a physical corner is unavailable.
    Preserve assistive devices and sensory needs. Aesthetic coherence can be achieved without buying,
    discarding useful possessions or conforming to gender, class or cultural stereotypes.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Personal style and aesthetic environment differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Personal style and aesthetic
    environment as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a small surface or reading corner already under your control. Use only existing safe
    items: a book, a useful container and one object you enjoy. The intended effect is calm and welcoming
    while keeping the surface usable. Do not move another person’s possessions or obstruct exits, mobility
    routes, ventilation or necessary equipment. Goal: Choose a coherent arrangement of dress, space or
    objects that expresses identity and beauty while respecting function, access and hospitality rather
    than copying status cues. Scope: One small arrangement tests fit and consideration, not a makeover,
    a purchase recommendation or a universal standard of taste. Time and effort: Twenty minutes to define
    the effect, a twenty-minute rearrangement and two short use checks. Adaptation: Use a clothing combination,
    digital workspace or tactile arrangement when a physical corner is unavailable. Preserve assistive
    devices and sensory needs. Aesthetic coherence can be achieved without buying, discarding useful possessions
    or conforming to gender, class or cultural stereotypes. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a clothing combination, digital workspace or tactile arrangement when a physical
    corner is unavailable. Preserve assistive devices and sensory needs. Aesthetic coherence can be achieved
    without buying, discarding useful possessions or conforming to gender, class or cultural stereotypes.
  expected_burden: Twenty minutes to define the effect, a twenty-minute rearrangement and two short use
    checks.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Personal style and aesthetic environment protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Personal style and aesthetic environment action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a clothing
    combination, digital workspace or tactile arrangement when a physical corner is unavailable. Preserve
    assistive devices and sensory needs. Aesthetic coherence can be achieved without buying, discarding
    useful possessions or conforming to gender, class or cultural stereotypes.
  actions:
  - stable_id: PRACTICE-COMP-2511-PERSONAL-STYLE-AND-AESTHETIC-ENVIRONMENT-01-A1
    sequence: 1
    title: Name the function and aesthetic intention together
    instructions: 'Write what the space must enable, who uses it and what feeling or identity you hope
      it expresses. Choose two organizing principles, such as a clear working area and a repeated material
      or shape, rather than an expensive brand or copied photograph. Identify a practical constraint and
      another user’s access need. Distinguish what you genuinely enjoy from what you hope will impress
      someone.


      Observation checks: Function users and intended effect are explicit; Two coherent organizing principles
      guide the change; A practical and an access constraint are identified; Personal enjoyment is separated
      from status imitation. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2511-PERSONAL-STYLE-AND-AESTHETIC-ENVIRONMENT-01
      action_stable_id: PRACTICE-COMP-2511-PERSONAL-STYLE-AND-AESTHETIC-ENVIRONMENT-01-A1
      competency_stable_id: '25.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
