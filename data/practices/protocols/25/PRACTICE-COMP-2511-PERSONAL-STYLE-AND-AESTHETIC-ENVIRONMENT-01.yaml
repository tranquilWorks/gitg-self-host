  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### A practical correction awaiting another use


      Jules moves the note container to the near left of the surface without blocking the open-book area.
      The keepsake moves farther back on Jules''s own side. A larger plain heading identifies the current
      note. The fixed lamp and shared approach remain as before.


      This is a fictional completed rearrangement, followed by a pending use check. There is no third
      use in the supplied record. The visitor has not returned, so comfort and legibility after the change
      remain unconfirmed. The smaller visual imbalance is an accepted tradeoff because the earlier two
      uses identified reach as the more pressing concern.


      The next question is specific: can the intended user reach and identify the current note while the
      book is open? A compliment about the color or a tidy photograph would not answer it. Jules can keep
      the personal keepsake without treating it as proof of status or requiring the visitor to value its
      meaning.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Make one small area easier to use and more recognizably yours. Spend twenty minutes defining
      purposes and constraints, twenty minutes rearranging existing items, then check it during two ordinary
      uses. No purchase, fashionable look or public photograph is required. The goal is a coherent and
      considerate choice that can be examined in use.


      ### Give beauty a job without reducing it to efficiency


      An environment can help you reach a book and also offer pleasure, memory or a sense of welcome.
      Those purposes sometimes conflict: an attractive arrangement may block a frequently used object,
      while a perfectly empty surface may remove something that makes the place feel inhabited. State
      the purposes first so a revision can respond to a real tradeoff rather than to an imagined audience''s
      status judgment.


      NC State''s [history of universal design, S08](https://research.design.ncsu.edu/allianceforinclusivedesign/history/)
      lists principles including flexibility, perceptible information, low effort and space for approach
      and use. These provide questions for attending to differences among users. This small exercise applies
      no dimensional building standard and certifies neither universal access nor legal compliance. Ask
      the actual willing user what helps instead of deciding that a layout works for everyone.


      Personal style may also appear in dress, a digital workspace or objects carried each day. In each
      setting, function, beauty, identity and hospitality can be considered together. Coherence can mean
      a repeated material, a visual rhythm or a practical organizing principle; it need not mean matching
      purchases. Clothes need not express wealth, and a room need not express any prescribed gender, culture
      or taste.


      ### Supplied corner file E9


      The fictional maker, Jules, controls a small reading surface next to a shared sitting area. A fixed
      lamp lights the surface. Jules owns the book, shallow container, small round wooden keepsake and
      loose notes being arranged; another person''s possessions are outside the task. The lamp stays in
      its existing position, with no electrical work or claim about a lighting standard.


      **Purposes:** leave a clear place for an open book; keep the current book and notes easy to reach;
      retain the wooden keepsake because its shape and familiar texture are pleasant; let a willing visitor
      use the surface without having to interpret a private display.


      **Constraints:** the furniture and lamp cannot move; nothing new is bought; the shared approach
      must stay clear; Jules usually reaches from the left. The visitor''s preferred reach and reading
      conditions are not yet known. That unknown is a reason for a use check, not evidence of a deficiency
      in the visitor.


      Two organizing principles are chosen: reserve the front center as a clear use zone, and repeat round
      shapes in the container and keepsake at the back. These are hypotheses about use and appearance.
      The first has practical priority when the second obstructs it.


      ### Before and after, with all choices visible


      **Before:** the closed book lies across the front center. Loose notes sit partly underneath it.
      The shallow container is near the left front edge, and the keepsake is directly in front of the
      fixed lamp. Jules likes seeing the keepsake but often moves the book twice to uncover a note. A
      visitor cannot readily tell where an open book should go.


      **First rearrangement:** put loose notes in the container with the current note on top. Move that
      container to the back right. Place the closed book along the left side, with its opening facing
      the clear center. Move the keepsake to the back left, outside the lamp''s base. Leave the front
      center empty for reading. Keep the shared approach unobstructed.


      The maker chooses back-right storage to balance the two rounded objects visually. This is not yet
      evidence that reaching works. The proposed layout retains a familiar object, gives the book a location
      and makes an intended use zone visible. It also introduces a possible conflict between visual balance
      and a reader reaching from the left.


      **Use check 1:** Jules reads for an ordinary short period. The book opens in the center, and the
      clear space helps. Reaching for the container requires leaning across the open book. Jules initially
      treats that as a minor inconvenience because the arrangement looks settled.


      **Use check 2:** a fictional willing visitor tries the space and says the notes are difficult to
      reach from the left and that the top note''s small heading is hard to distinguish. The visitor likes
      having a clear surface and does not ask for the keepsake to be removed. This is a supplied case
      response, not an actual access evaluation or approval of Jules''s taste.


      ### Revise the conflict that use revealed


      The two use checks point to a location problem and a legibility preference. In the [later packet](?resource=file-later-packet-md),
      the maker moves the container to the near left, leaving the front center open, and writes a larger,
      plain heading on the current note. The keepsake moves farther back on Jules''s own side. The visual
      repetition remains possible, but symmetry no longer decides the location of a frequently reached
      item.


      A revised arrangement must still be tried. Do not convert “I moved it closer” into “the visitor
      can now use it comfortably.” The visitor may prefer a different location or an alternative format.
      A request for larger writing in this case does not diagnose eyesight or justify asking for private
      health information.


      Identity and hospitality need not erase each other. Jules keeps the meaningful object while responding
      to a stated use difficulty. Conversely, a visitor''s aesthetic dislike alone would not oblige Jules
      to remove a personal object. Explain which purpose a change serves, whose preference it addresses,
      and what remains unresolved.


      ### Produce the small design record


      1. Name one controlled area, two or three purposes, a meaningful personal choice and the practical
      constraints. Separate ownership and shared-use decisions.

      2. Choose two organizing principles and rearrange only what you have authority to move. Record the
      before and after in words or an optional private image.

      3. Check two ordinary uses, including another willing user when appropriate and available. If both
      are your own uses, label them as such; do not invent outside reception.

      4. Record one thing that helped and one friction or uncertainty. Revise the relevant feature while
      preserving the intended use.

      5. State what a later use would need to establish. Stop before the exercise becomes an expensive
      redesign or a search for social approval.


      For support, change only the location of the book and container while retaining the supplied purposes.
      For a harder attempt, compare two locations against reach, visibility and the valued object without
      making a weighted status score. A digital folder area or a set of clothing already owned can substitute
      when a physical surface is unavailable: preserve an actual use test and the distinction between
      personal taste and another person''s stated access need.


      The result can show deliberate aesthetic choices that respond to use, identity and welcome. It cannot
      show that the maker has superior taste, that a visitor feels at home in every circumstance, or that
      the setting is accessible to everyone.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A layout photographs well but a user must lean across an open book to reach notes. Which evidence
      should guide the next change?

      2. A visitor asks for a clearer note heading. Does that authorize a diagnosis or moving their belongings?

      3. The container has been moved and the note relabeled, but nobody has used the revised arrangement.
      What can be claimed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Use the observed reach difficulty and the stated reading purpose to revise location, then
      test the revision in use. Visual appeal remains relevant, but a photograph does not establish practical
      access.

      2. No. Respond to the stated preference within the maker’s authority. Ask only what is useful for
      the arrangement, preserve ownership boundaries, and do not infer private health information.

      3. The rearrangement and its rationale are complete. Improved reach and legibility are predictions
      awaiting use; the prior two checks do not count as a test of the new version.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
