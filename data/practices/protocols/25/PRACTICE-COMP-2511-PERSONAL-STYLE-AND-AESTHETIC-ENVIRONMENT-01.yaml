  - stable_id: PRACTICE-COMP-2511-PERSONAL-STYLE-AND-AESTHETIC-ENVIRONMENT-01-A2
    sequence: 2
    title: Rearrange existing items within permission and safety
    instructions: 'Remove only items you control from the small area, restore the necessary functional
      objects first and then place the enjoyed object deliberately. Check reach, visibility, stability,
      lighting and clear passage without modifying electrical fittings or furniture structure. Compare
      the arrangement with the two principles and make one adjustment. No purchase is required and another
      person’s different taste does not authorize replacing their belongings.


      Observation checks: The change uses existing items within the participant’s control; Function and
      safe access are restored before decoration; Placement follows the chosen principles; No unauthorized
      possession change or hazardous modification occurs. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
