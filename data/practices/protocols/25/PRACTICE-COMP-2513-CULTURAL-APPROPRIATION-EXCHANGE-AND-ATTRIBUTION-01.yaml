  - stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01-A2
    sequence: 2
    title: Trace attribution benefit and power before choosing
    instructions: 'Ask who receives credit, money, visibility or risk and who controls how the material
      is described. Identify stereotype, false authenticity or missing community benefit where supported
      by the fictional facts. For the public lesson, retain the stated attribution conditions; for the
      unverified ceremony, defer use pending appropriate authorization; for the seller, remove unsupported
      representation and investigate legitimate permission and benefit. State what remains uncertain rather
      than treating a slogan as the analysis.


      Observation checks: Credit benefit control and risk are traced concretely; Misrepresentation is
      identified from facts rather than identity assumptions; Each case receives a proportionate permission
      disposition; Uncertainty and different perspectives are retained. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01-A2
      competency_stable_id: '25.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2513_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2513_a2_primary
        kind: artifact
        role: primary
