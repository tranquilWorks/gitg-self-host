  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Two proposed expansions that exceed the evidence


      In A, a participant suggests posting a video of the demonstration. Ren''s offer allowed only one
      unrecorded noncommercial demonstration. There is no new response from Ren. The video is not made
      or posted; silence is not approval. The existing offer can still support its original narrow use
      if its conditions are met.


      In C, the seller''s first alternative draft drops the motif but keeps the phrase “inspired by the
      community''s official style.” That phrase still uses an unsupported representation claim as marketing.
      The revised description becomes “An original geometric arrangement of lines and circles.” The community
      name and endorsement language are removed.


      This is a supplied planning revision, not a completed product, sale, consultation or legal review.
      No community contribution has been obtained. A future paid collaboration remains a possible separate
      route, requiring actual agreement about scope and benefit rather than a token credit or a presumed
      duty to advise for free.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare three proposed cultural uses for thirty minutes, then spend twenty minutes writing
      one exact revised plan. Work from the complete fictional cards below. No actual motif, restricted
      recording or protected expression needs to be copied, and no publication or sale occurs during this
      exercise.


      ### Permission belongs to a particular use


      Viewing a resource, learning privately, adapting it, teaching it and selling something based on
      it are different acts. Credit identifies a contribution; permission concerns what may be done. Payment
      may fairly compensate work but does not automatically buy every use or establish community endorsement.
      A respectful decision can be to proceed within a clear invitation, ask a narrower question, or choose
      an original alternative.


      [Local Contexts, S09](https://localcontexts.org/labels/traditional-knowledge-labels/) describes
      Indigenous community-defined provenance, protocol and permission labels. The relevant lesson is
      to attend to the appropriate holders and actual conditions, not to apply a label yourself or treat
      every community as having one rule. [WIPO''s overview, S10](https://www.wipo.int/en/web/traditional-knowledge/traditional-cultural-expressions/index)
      describes traditional cultural expressions and the variety of related protection questions. It is
      not a legal clearance service for these fictional cases.


      Keep three questions separate. Legal rights concern applicable permissions and law; customary restrictions
      concern the practice''s own authorities and protocols; ethical judgment concerns representation,
      consent, benefit and power. They can overlap without being identical. A claim that a use is legally
      possible would not itself settle the other two, and this exercise makes no jurisdiction-specific
      legal determination.


      ### Three complete proposed-use cards


      **Case A — Public beginner lesson.** A fictional community teacher, Ren, openly offers an ordinary
      beginner pattern for private practice and one unrecorded noncommercial class demonstration. The
      written offer requires the credit “Beginner pattern taught by Ren through the community workshop”
      and prohibits copying the lesson diagrams. The teacher agrees the listed workshop fee covers this
      scope; all learners may decline the demonstration. Adaptation, recorded teaching and product sales
      are outside the offer and require a new discussion. No actual pattern or diagram is supplied here.


      **Case B — Unverified ceremony recording.** A clip is publicly reachable on an unrelated account.
      Its caption calls it a sacred community ceremony, but the uploader''s identity, authority, original
      audience and consent to recording are unknown. A viewer proposes to download it, edit it into a
      public presentation and teach its movements. No authorized community contact or use conditions have
      been established. Do not reproduce the clip while investigating whether it is restricted.


      **Case C — Commercial representation.** A fictional seller plans thirty cards using a community-associated
      motif found online and the phrase “Official community design, authentically endorsed.” There is
      no permission, endorsement, documented source or benefit agreement. No cards have been produced,
      no orders taken and no money collected. The seller would receive sales income and control the description;
      the community would receive neither stated credit nor compensation and might bear misrepresentation
      risk. The facts concern an unsupported claim, not an assumption about the seller''s ethnicity.


      ### Distinguish the five uses in each case


      | Use | A: teacher''s offer | B: ceremony clip | C: proposed motif cards |

      | --- | --- | --- | --- |

      | View | Included in the public lesson invitation | Online access exists; legitimate recording and
      audience remain unknown | Online access does not establish source or authority |

      | Learn privately | Explicitly allowed for this beginner pattern | Not established; defer copying
      or practicing the ceremony | Not established by the supplied facts |

      | Adapt | Outside the stated offer; ask separately | Not authorized; defer | Not authorized; do
      not use motif in the proposed design |

      | Teach | One unrecorded noncommercial demonstration with required credit | Not authorized; defer
      presentation and movement teaching | No teaching permission or representative authority established
      |

      | Sell | Outside the offer; a new agreement would be needed | No sale permission established | No
      permission or endorsement; current plan cannot proceed as described |


      The table does not declare that merely encountering a public page is a moral offense or that cultural
      exchange is generally forbidden. It distinguishes what is known from what is missing for a proposed
      action. Nor does it turn one willing practitioner into a universal representative who can settle
      every disagreement.


      ### Trace who gets what and who decides


      In A, the teacher receives the agreed workshop fee and explicit credit, retains limits on diagrams
      and wider reuse, and has authorized a bounded learning exchange. Those conditions do not prove that
      all possible community members agree, but the learner can identify the invitation being relied on.
      A request to expand the use should include new audience, recording and compensation details without
      demanding unpaid cultural education.


      In B, an unknown uploader controls circulation while the depicted people may face exposure outside
      the intended setting. Those people receive no established benefit in the supplied facts. A suitable
      authorized practitioner, institution or rights holder may help clarify access, but choosing any
      person who identifies with the community would not automatically resolve authority. Until a legitimate
      route and scope are established, defer the proposed reuse. A refusal or inability to establish permission
      is a valid stopping point.


      In C, the unsupported endorsement helps market the seller''s product while moving representation
      risk to people who have not agreed. A donation made afterward would not repair missing consent or
      make the authenticity claim true. Remove the claim and the unverified motif. If a future collaboration
      is desired, negotiate actual scope, credit, control and fair compensation with appropriately authorized
      partners before using their contribution.


      ### Exact revised plan for Case C


      “I will not use the unverified motif or the phrases ‘official,’ ‘authentic community design’ or
      ‘endorsed.’ I will make an original arrangement of ordinary lines and circles without copying this
      motif, and describe it as my own geometric card design. No community name will market the alternative.
      No cards will be offered during this exercise. If I later seek a community collaboration, I will
      first establish the appropriate authority and agree the contribution, permitted uses, review control,
      credit and compensation; declining collaboration remains acceptable.”


      The alternative removes the unsupported material rather than merely adding a credit to it. It does
      not prove that any future design is legally cleared or free from every resemblance. If a collaborator
      contributes, their actual contribution must be credited accurately; the seller cannot keep calling
      the entire result solely their own. The original plan had no existing stock or paid orders, so no
      invented recall or refund is reported.


      ### Make a decision someone can inspect


      1. Identify source, context, proposed use, audience and possible authority for all three cards.
      Keep unknowns visible.

      2. Compare the five uses and separate legal, customary and ethical questions. Do not let credit
      stand in for permission.

      3. Trace money, visibility, control and risk. Name misrepresentation only where the facts support
      it.

      4. Write one plan specifying material used and excluded, required consent, attribution and benefit.
      A decision not to use the material is complete work.

      5. Open the [later packet](?resource=file-later-packet-md) and examine what happens when the audience
      or representation changes.


      For support, use the cards without investigating real restricted material. For a harder pass, explain
      how two community members could reasonably disagree and what their actual authority would allow
      you to conclude. An accessible conversation or authorized description may inform a real case, but
      neither pressure nor unnecessary disclosure is justified to finish the exercise. The product is
      a bounded permission analysis, not a universal rule about who may create.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A public lesson permits private practice and one unrecorded class demonstration. A learner adds
      the teacher’s name to a commercial video. What is missing?

      2. A sacred ceremony clip is downloadable and one unfamiliar commenter says it is fine to reuse.
      Does that establish authority?

      3. The seller removes a copied motif but keeps “officially endorsed” and promises a donation. Is
      the revised plan adequate?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Permission for recording, publication and commercial use is missing. Credit does not expand
      the stated offer. Pause that use and seek a specific agreement, or stay within the existing scope.

      2. No. Neither technical access nor an unverified commenter establishes recording consent, authorized
      audience or teaching permission. Defer reuse and use an appropriate authorized route without circulating
      restricted material to ask about it.

      3. No. The endorsement remains unsupported and a donation does not create consent. Remove the representation
      claim, describe the actual original alternative accurately, and negotiate any future contribution
      and benefit before using it.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
