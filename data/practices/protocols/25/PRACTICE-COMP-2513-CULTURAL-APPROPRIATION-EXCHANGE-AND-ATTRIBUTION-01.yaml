meaning_and_fit:
  purpose: Distinguish respectful exchange from extraction, stereotype or misrepresentation by checking
    context, permission, attribution, benefit and power in a specific proposed use.
  why_recommended: Distinguish respectful exchange from extraction, stereotype or misrepresentation by
    checking context, permission, attribution, benefit and power in a specific proposed use.
  claims:
  - statement: Distinguish respectful exchange from extraction, stereotype or misrepresentation by checking
      context, permission, attribution, benefit and power in a specific proposed use.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cultural appropriation, exchange, and attribution
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cultural appropriation, exchange, and attribution as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use the fictional cases when cultural access or power dynamics are uncertain.
    Seek an appropriately authorized practitioner, community institution, rights holder or legal adviser
    for real use. Do not demand free cultural education, force consensus among community members or disclose
    restricted material while asking whether it is restricted.
  opportunity_considerations: 'Use three fictional cases: a community teacher offers a public beginner
    pattern with attribution conditions; a sacred ceremony recording appears online without clear authorization;
    and a commercial seller uses a community motif while claiming to represent that community. No actual
    motif, ceremony or protected expression needs to be reproduced.'
  prerequisites:
  - 'Use three fictional cases: a community teacher offers a public beginner pattern with attribution
    conditions; a sacred ceremony recording appears online without clear authorization; and a commercial
    seller uses a community motif while claiming to represent that community. No actual motif, ceremony
    or protected expression needs to be reproduced.'
  dependencies: []
  safe_alternatives:
  - Use the fictional cases when cultural access or power dynamics are uncertain. Seek an appropriately
    authorized practitioner, community institution, rights holder or legal adviser for real use. Do not
    demand free cultural education, force consensus among community members or disclose restricted material
    while asking whether it is restricted.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cultural appropriation, exchange, and attribution differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cultural appropriation, exchange,
    and attribution as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three fictional cases: a community teacher offers a public beginner pattern with attribution
    conditions; a sacred ceremony recording appears online without clear authorization; and a commercial
    seller uses a community motif while claiming to represent that community. No actual motif, ceremony
    or protected expression needs to be reproduced. Goal: Distinguish respectful exchange from extraction,
    stereotype or misrepresentation by checking context, permission, attribution, benefit and power in
    a specific proposed use. Scope: This is an ethical and permission review, not a universal rule about
    who may create what or a legal determination of copyright. Community, rights-holder and individual
    perspectives may differ. Time and effort: Thirty minutes to compare three cases and twenty minutes
    to revise one proposed use. Adaptation: Use the fictional cases when cultural access or power dynamics
    are uncertain. Seek an appropriately authorized practitioner, community institution, rights holder
    or legal adviser for real use. Do not demand free cultural education, force consensus among community
    members or disclose restricted material while asking whether it is restricted. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional cases when cultural access or power dynamics are uncertain. Seek
    an appropriately authorized practitioner, community institution, rights holder or legal adviser for
    real use. Do not demand free cultural education, force consensus among community members or disclose
    restricted material while asking whether it is restricted.
  expected_burden: Thirty minutes to compare three cases and twenty minutes to revise one proposed use.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cultural appropriation, exchange, and attribution protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Cultural appropriation, exchange, and attribution action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    cases when cultural access or power dynamics are uncertain. Seek an appropriately authorized practitioner,
    community institution, rights holder or legal adviser for real use. Do not demand free cultural education,
    force consensus among community members or disclose restricted material while asking whether it is
    restricted.
  actions:
  - stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01-A1
    sequence: 1
    title: Separate access from permission and representation
    instructions: 'For each case, identify the source, context, proposed use, audience and who could authorize
      or object to that use. Distinguish viewing, learning privately, adapting, teaching and selling;
      permission for one is not permission for all. Note legal rights, customary restrictions and ethical
      concerns separately. Avoid assuming either that online availability permits everything or that one
      person can give universal consent for an entire community.


      Observation checks: Source context use and audience are explicit in all three cases; Viewing learning
      adaptation teaching and sale are distinguished; Legal customary and ethical questions remain separate;
      No online availability or single representative is treated as unlimited permission. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01-A1
      competency_stable_id: '25.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2513_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2513_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - source_context_use_and_audience_are_explicit_in_all_three_cases
        - viewing_learning_adaptation_teaching_and_sale_are_distinguished
        - legal_customary_and_ethical_questions_remain_separate
        - no_online_availability_or_single_representative_is_treated_as_unlimited_permission
      - measurement_id: c2513_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
