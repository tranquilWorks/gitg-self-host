        - misrepresentation_is_identified_from_facts_rather_than_identity_assumptions
        - each_case_receives_a_proportionate_permission_disposition
        - uncertainty_and_different_perspectives_are_retained
      - measurement_id: c2513_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2513_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2513-CULTURAL-APPROPRIATION-EXCHANGE-AND-ATTRIBUTION-01-A3
    sequence: 3
    title: Rewrite the proposed use into a respectful or declined action
    instructions: 'Choose one case and write the exact revised plan: what will be used, what will not,
      who must consent, how attribution appears and how benefit or compensation will be handled. A valid
      result may be not to use the material and create an original alternative. Recheck that credit is
      not being used as a substitute for permission and that consent can be revisited if the scope changes.
      No publication or commercial sale occurs during the exercise.


      Observation checks: The revised plan specifies use limits consent and attribution; Benefit or compensation
      is addressed where relevant; Declining use and making an original alternative remain legitimate;
      A scope change requires renewed permission rather than presumed consent. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which part of the proposed use changes the power or benefit relationship, and what
      permission or representation claim must be corrected before proceeding?


      Examples: Supportive: The learner retained attribution for the public lesson, deferred the unverified
      recording and replaced a false community endorsement with an honest limited description.


      Mixed: Legal reuse looked possible, but customary restrictions and benefit questions remained unresolved,
      so publication was deferred.


      Contradictory: Credit was treated as permission or a community’s disagreement was dismissed because
      the material could be downloaded.


      Inconclusive: Appropriation was approved or condemned in general terms without examining a specific
      use, authority, benefit or context.'
    expected_time: 15-25 minutes
    due_within_days: 10
