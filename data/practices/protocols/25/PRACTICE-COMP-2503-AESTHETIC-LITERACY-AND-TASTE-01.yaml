meaning_and_fit:
  purpose: Develop appreciation and criticism through choices, effects, context and standards rather than
    treating personal liking as the entire aesthetic judgment.
  why_recommended: Develop appreciation and criticism through choices, effects, context and standards
    rather than treating personal liking as the entire aesthetic judgment.
  claims:
  - statement: Develop appreciation and criticism through choices, effects, context and standards rather
      than treating personal liking as the entire aesthetic judgment.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Aesthetic literacy and taste practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Aesthetic literacy and taste as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use spoken phrases, simple drawings, music fragments created by you or accessible
    descriptions under the same purpose-and-effect comparison. Do not require familiarity with prestigious
    works. Cultural conventions can change interpretation; name the assumed audience and keep alternative
    standards discussable.
  opportunity_considerations: 'Compare these original teaching samples describing a person leaving home:
    A: The room was sad and everything was very emotional. B: She left the room and closed the door. C:
    She took the key, then set it beside the cup and closed the door without locking it. The intended
    effect is a restrained sense of departure with room for uncertainty, not a rule that one style is
    always superior.'
  prerequisites:
  - 'Compare these original teaching samples describing a person leaving home: A: The room was sad and
    everything was very emotional. B: She left the room and closed the door. C: She took the key, then
    set it beside the cup and closed the door without locking it. The intended effect is a restrained
    sense of departure with room for uncertainty, not a rule that one style is always superior.'
  dependencies: []
  safe_alternatives:
  - Use spoken phrases, simple drawings, music fragments created by you or accessible descriptions under
    the same purpose-and-effect comparison. Do not require familiarity with prestigious works. Cultural
    conventions can change interpretation; name the assumed audience and keep alternative standards discussable.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Aesthetic literacy and taste differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Aesthetic literacy and taste
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Compare these original teaching samples describing a person leaving home: A: The room was sad
    and everything was very emotional. B: She left the room and closed the door. C: She took the key,
    then set it beside the cup and closed the door without locking it. The intended effect is a restrained
    sense of departure with room for uncertainty, not a rule that one style is always superior. Goal:
    Develop appreciation and criticism through choices, effects, context and standards rather than treating
    personal liking as the entire aesthetic judgment. Scope: A comparison of original sample sentences
    teaches a small aesthetic judgment. It does not establish a universal ranking of art or dismiss different
    cultural standards. Time and effort: Twenty minutes for comparison and twenty minutes for a revision
    and reader check. Adaptation: Use spoken phrases, simple drawings, music fragments created by you
    or accessible descriptions under the same purpose-and-effect comparison. Do not require familiarity
    with prestigious works. Cultural conventions can change interpretation; name the assumed audience
    and keep alternative standards discussable. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken phrases, simple drawings, music fragments created by you or accessible
    descriptions under the same purpose-and-effect comparison. Do not require familiarity with prestigious
    works. Cultural conventions can change interpretation; name the assumed audience and keep alternative
    standards discussable.
  expected_burden: Twenty minutes for comparison and twenty minutes for a revision and reader check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Aesthetic literacy and taste protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Aesthetic literacy and taste action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken
    phrases, simple drawings, music fragments created by you or accessible descriptions under the same
    purpose-and-effect comparison. Do not require familiarity with prestigious works. Cultural conventions
    can change interpretation; name the assumed audience and keep alternative standards discussable.
  actions:
  - stable_id: PRACTICE-COMP-2503-AESTHETIC-LITERACY-AND-TASTE-01-A1
    sequence: 1
    title: State the intended effect before ranking the samples
    instructions: 'Read each sample aloud or silently and note your immediate response separately from
      analysis. Compare specificity, rhythm, implied action, ambiguity and fit to the stated purpose.
      A names emotion directly, B reports action plainly and C uses selected actions to invite an inference;
      these are choices to test, not automatic grades. Name a context in which each approach could be
      useful, such as direct explanation, concise stage direction or a suggestive story opening.


      Observation checks: Immediate preference is separated from analysis; Five supplied comparison dimensions
      are considered; Each version’s choices are connected to possible effects; A legitimate context is
      considered even for a less preferred version. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2503-AESTHETIC-LITERACY-AND-TASTE-01
      action_stable_id: PRACTICE-COMP-2503-AESTHETIC-LITERACY-AND-TASTE-01-A1
      competency_stable_id: '25.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2503_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2503_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - immediate_preference_is_separated_from_analysis
        - five_supplied_comparison_dimensions_are_considered
        - each_version_s_choices_are_connected_to_possible_effects
        - a_legitimate_context_is_considered_even_for_a_less_preferred_version
      - measurement_id: c2503_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
