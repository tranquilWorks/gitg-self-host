  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### The intended departure reads as ordinary tidying


      A supplied willing reader says the three-sentence coat-and-chair revision feels calm but reads as
      “tidying before stepping out.” The reader notices the chair turned toward the window and remains
      unsure whether the departure is important. This response partly fits restraint but does not establish
      the intended uncertainty about returning.


      The maker keeps the concrete action and tries changing the second sentence to: “At the doorway,
      she turned the chair away from her place at the table.” The revision changes the relation between
      person and room without adding an explicit feeling or copying the key sequence. It could also suggest
      a practical rearrangement; the meaning is still open.


      A supplied delayed self-review prefers the first version''s gentler movement but finds the second
      more suggestive of separation. That is the maker''s later response, not a second independent reader.
      No actual audience has reviewed either specimen. Keep both and state the tradeoff rather than claiming
      the revision now reliably communicates the intended effect.


      The next decision is conditional: retain the first for a scene about an ordinary temporary departure,
      or test the second if a more significant separation is the goal. The comparison remains grounded
      in purpose, particular choices and incomplete reception evidence.'
