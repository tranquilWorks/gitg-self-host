  - stable_id: PRACTICE-COMP-2503-AESTHETIC-LITERACY-AND-TASTE-01-A2
    sequence: 2
    title: Make a reasoned criticism with a counterexample
    instructions: 'Choose the version that best serves the stated purpose and support the judgment with
      two exact features. Explain one weakness or ambiguity in that same version and one merit in another.
      Change the purpose to urgent factual instructions and reconsider the ranking. This tests whether
      your standard follows the task rather than loyalty to a style. Avoid claims about the author’s intelligence,
      culture or character.


      Observation checks: The judgment cites two specific textual choices; A weakness in the preferred
      sample remains visible; A changed purpose can change the ranking; Criticism concerns the work rather
      than the author’s worth. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2503-AESTHETIC-LITERACY-AND-TASTE-01
      action_stable_id: PRACTICE-COMP-2503-AESTHETIC-LITERACY-AND-TASTE-01-A2
      competency_stable_id: '25.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2503_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2503_a2_primary
        kind: artifact
