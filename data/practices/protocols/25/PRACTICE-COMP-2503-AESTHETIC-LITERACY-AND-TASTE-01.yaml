    kind: concept
    title: Learn and try
    body: 'Explain how a work''s choices serve a purpose, then test your judgment when the purpose changes.
      Allow twenty minutes for comparison and twenty for a revision and reader check. You do not need
      familiarity with prestigious works or a publicly defensible favorite. The task is to connect a specific
      choice with a possible effect.


      ### Separate response from analysis


      Your immediate response belongs in the record: perhaps a sentence feels flat, vivid, uncomfortable
      or pleasing. That response is useful but does not by itself explain the work. Analysis asks what
      language, structure, timing or omission could produce the response for this audience and purpose.
      An aesthetic judgment can be reasoned and still leave room for another interpretation.


      The Open University''s [selected fiction-writing sections, S14](https://www.open.edu/openlearn/history-the-arts/creative-writing/start-writing-fiction/content-section-3.3/?printable=1)
      discuss concrete details, actions and settings as choices available to a writer. The UNC Writing
      Center''s [reading-aloud guidance, S16](https://writingcenter.unc.edu/tips-and-tools/reading-aloud/)
      describes how another encounter with a draft can reveal features missed in silent reading. These
      sources support looking at choices and reception; they do not establish a universal style ranking.
      This exercise''s sentences and revisions are original teaching material.


      The supplied purpose is **a restrained sense of departure with room for uncertainty**. Assume a
      short fictional story opening for a reader willing to infer meaning from action. That audience assumption
      matters: a practical notice, oral tale or explanatory summary may work under different conventions.
      Do not turn one convention into a claim about an author''s intelligence, culture or human worth.


      ### Read three original teaching samples


      A: “The room was sad and everything was very emotional.”


      B: “She left the room and closed the door.”


      C: “She took the key, then set it beside the cup and closed the door without locking it.”


      Write your immediate preference before reading the comparison. The worked response favors C for
      the supplied purpose, but that is a hypothesis to support, not the answer required of every learner.
      You can defend another choice if you connect its features with the stated effect and acknowledge
      its limits.


      | Dimension | A | B | C |

      | --- | --- | --- | --- |

      | Specificity | Names sadness and emotion broadly; gives no particular object or gesture | Identifies
      leaving and closing as concrete actions | Adds key, cup, placement and an unlocked door |

      | Rhythm | Repeats a broad emotional statement across two linked clauses | Short sequence moves
      directly through two actions | Longer sequence delays departure with taking and setting down |

      | Implied action | Little visible action; directs attention to a declared mood | Someone departs,
      with motive unstated | Taking then relinquishing the key invites questions about the choice |

      | Ambiguity | Cause of sadness is open, but the emotional label is explicit | Many motives fit the
      plain action | The key and unlocked door suggest possibilities without settling them |

      | Fit to purpose | Direct labeling may reduce the desired restraint | Restrained, though possibly
      too sparse to suggest a significant departure | Particular actions can support restrained uncertainty,
      though they may distract |


      Each approach has a legitimate use. A could serve a direct explanation of a scene''s declared emotional
      tone. B could be a concise stage direction or factual account of movement. C could open a story
      that gives objects and omissions significance. These uses do not make every sentence equally effective
      for every purpose; they make the standard explicit enough to discuss.


      ### Support a preference and retain its weakness


      The worked choice of C rests on two exact features. First, “took the key, then set it” reverses
      an action and gives the reader something to interpret. Second, “without locking it” marks an omission
      that could matter to the departure. Neither phrase names a feeling, which fits the proposed restraint.
      The reasoning is about the text rather than a guess that the writer is more sophisticated.


      C also has a weakness: the cup may attract attention without a clear function, and an unlocked door
      could mean forgetfulness rather than a charged departure. A reader might infer routine carelessness,
      a safe household or a plan to return soon. Acknowledging those readings improves the judgment. It
      prevents the intended effect from being treated as an observed response before anyone has read the
      work.


      B''s merit is economy. Its actions are easy to follow and do not demand an object-based interpretation.
      A''s merit is directness about the stated feeling. If the task were a brief summary of emotional
      tone, A''s explicitness could be useful even though “everything” and “very” offer little precision.
      Criticism should name a choice that could be changed, not dismiss the whole approach as bad writing
      by definition.


      ### Change the purpose and reconsider


      Now the task is **urgent factual instructions**. B is closest to a concise action-focused style,
      but none of the samples is itself an adequate instruction: all are descriptive past-tense sentences,
      and no required action or operational facts are supplied. C''s suggestive objects and uncertainty
      would impede this new purpose. A''s emotional labeling would not tell a reader what to do.


      Do not simply declare B a safe instruction. For a low-stakes fictional rehearsal with an approved
      instruction to leave through this door at the end, a new version could read: “At the end of the
      rehearsal, leave through this door.” This is a separate supplied instruction, not advice for an
      emergency or an inference from the original scene. The changed purpose alters what counts as effective,
      while the need for correct facts remains.


      ### Revise without copying C''s mechanism


      Return to restrained departure. Rewrite A or B in at most three sentences, without borrowing C''s
      key, cup and unlocked-door sequence. The supplied revision of B is:


      > She lifted her coat from the chair and smoothed the cover where it had rested.\

      > At the doorway, she turned the chair back toward the window.\

      > Then she left.


      The coat and chair provide physical actions; the pause to arrange the room can suggest care, delay
      or ordinary tidiness. The three sentences narrow in length, ending with departure. No emotion is
      named. This is a concrete attempt to serve the purpose, not proof that the purpose was achieved.


      Before checking reception, write the intended effect: quiet departure with uncertainty about whether
      the person expects to return. A willing reader may say what stood out and what remains uncertain,
      without being told which mood to report. Alternatively, save the draft and return after a break.
      A delayed self-review is useful process evidence but not an independent reader response. Do not
      invent a reader to satisfy the exercise.


      ### Produce the judgment-and-revision record


      1. Record immediate responses to A, B and C separately from analysis. State the intended purpose
      and assumed audience.

      2. Compare all five dimensions and name a legitimate context for each approach. Choose a provisional
      favorite with two exact features, one weakness and one merit in another version.

      3. Change to urgent factual instructions and explain why the standard changes. Keep the distinction
      between a concise style and an actually usable instruction.

      4. Make a new revision of A or B in no more than three sentences. Identify two choices that aim
      at restraint without copying C.

      5. Save the revision, then consult the [later packet](?resource=file-later-packet-md) or obtain
      a willing reader response. Record a reason to keep or change one feature and an uncertainty that
      remains.


      For support, underline actions and circle emotional labels before discussing effects. For a harder
      pass, defend B under the original purpose while explaining what its economy loses. Use accessible
      text, speech, original drawings or another familiar form with the same purpose-and-effect comparison.
      Speech is optional; prestigious vocabulary and agreement with the author are not requirements.


      An actual comparison artifact with a revised work and reception evidence can show more than liking
      alone. It still cannot determine universal aesthetic merit. Reader disagreement is information about
      a work meeting a person in a context, not a final verdict on taste or a license to dismiss that
      person''s background.


      ### Use the result at its proper scale


      Creative cultivation is optional; access adaptations do not lower human worth. Fiction and no attempt
      are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. You prefer a richly ambiguous sentence. The new task is a brief factual notice. Must the same
      sentence remain the best choice?

      2. A reader interprets your restrained departure as routine tidying. Is that proof of poor taste
      or proof that the work has no value?

      3. You reread your own revision after a break and notice a stronger pause. Can you label that independent
      audience feedback?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Explain which choices serve each purpose. Ambiguity can invite interpretation in a story
      while undermining a notice; preference alone does not settle fit, and a concise style still needs
      correct practical facts.

      2. Neither. Record the response as reception evidence, inspect the choices that allowed it and decide
      whether to revise for the intended audience. Do not judge the reader or author as a person.

      3. No. It is delayed self-review. It can support a reasoned revision but must remain distinct from
      an actual willing reader response, and neither alone establishes universal merit.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
