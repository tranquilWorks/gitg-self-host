  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### A changed description changes the obstacle


      A second supplied description keeps the cup, handle and curled paper corner but places the paper
      one cup-width farther away. The loop-shaped shadow now ends on the bare table before reaching the
      paper. Mark D7 as changed for this second scene. Do not silently replace the first description or
      claim you watched the paper move.


      Alternative 2''s doorway-at-the-boundary premise no longer has the same support. One revision begins:
      “The handle''s shadow stopped on the bare table, short of the paper.” The imagined goal of reaching
      shelter can remain, but the obstacle is now a gap rather than the paper''s edge. D6 and D8 still
      supply the loop and raised corner.


      A supplied delayed self-review finds the original miniature''s “journey” line more abstract than
      the concrete shadow and paper details. The maker tries replacing it with: “Beyond the loop, the
      curled corner kept its little patch of shade.” This is a new imagined sentence, not a physical observation.
      Whether the revision communicates more clearly to another reader remains unknown.


      Keep both versions and explain which change follows the new source detail and which follows an aesthetic
      preference. No actual observer, reader, movement record or independent content acceptance has been
      supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Use specific details to generate possibilities that a broad first impression would miss. Allow
      ten minutes for observation, twenty for alternatives and ten for comparison. You will make one miniature
      and trace its invented relationships to details you actually had available.


      ### Describe before assigning a story


      “An ordinary cup” names a category. “A loop-shaped handle shadow reaches the edge of a sheet of
      paper” describes a relationship that can become material for a scene. Close attention does not require
      declaring an object beautiful or finding a hidden symbolic meaning. The distinction between observation
      and interpretation lets imagination remain free without being mistaken for evidence.


      Project Zero at Harvard Graduate School of Education discusses observation and interpretation in
      [See, Think, Wonder, S15](https://pz.harvard.edu/resources/see-think-wonder). That resource is a
      conceptual reference only. The eight-detail exercise, transformations and texts here are original
      teaching material drawn from this curriculum''s task; they do not reproduce or adapt its branded
      routine or worksheet. No effect study or validated assessment is claimed.


      Choose a familiar safe object, an accessible image description, a sound or a verbal scene. You do
      not need every sense. Mark unavailable information rather than filling it with an imagined sensation
      and calling it observed. Do not watch private behavior, record strangers or infer a person''s motives
      from a gesture. An object and supplied description are enough for this attempt.


      ### Supplied verbal scene O8


      A white cup stands on a table with a window to its left. Its rim appears oval from the described
      viewpoint. A blue band circles the lower body. The handle points right. A narrow bright reflection
      runs along the upper-left rim. The handle casts a loop-shaped shadow to the right, ending at the
      near edge of a sheet of paper. The paper''s corner curls upward. No sound, movement, temperature,
      smell or tactile texture is described.


      Spend five minutes attending to the description or an equivalent actual object, without inventing
      missing observations. The supplied first broad impression is “a plain cup beside paper.” The detail
      record below extracts what the description actually supplies. Tag these entries **S**, meaning supplied
      description. In an actual observation, tag what you directly notice **O** and keep your interpretations
      in a separate column.


      | Detail | Available description | Status |

      | --- | --- | --- |

      | D1 | Rim appears oval from this viewpoint | S; apparent shape, not a claim that the rim is physically
      oval |

      | D2 | Body is white | S; no material or temperature specified |

      | D3 | Blue band circles the lower body | S |

      | D4 | Handle points right | S |

      | D5 | Narrow bright reflection at upper-left rim | S |

      | D6 | Handle shadow has a loop shape to the right | S |

      | D7 | Shadow ends at the near edge of the paper | S |

      | D8 | One paper corner curls upward | S |


      Sound, smell, touch and actual movement remain unavailable. “Someone abandoned the cup” is an inference
      with no supporting history. “The cup is lonely” may be an imaginative premise, but is not an observation.
      A precise record can include absence of information without becoming incomplete or inferior.


      ### Transform relationships in three ways


      **Alternative 1: cup as a place.** The oval rim becomes a harbor boundary, and the blue band becomes
      a shoreline visible below it. A traveler on that shoreline can see the bright rim reflection as
      a narrow opening in the weather. D1, D3 and D5 remain traceable while a household object becomes
      a navigable place. The change is in scale and possible movement, not simply renaming the cup a castle.


      **Alternative 2: shadow as the main character.** The loop-shaped shadow wants to cross onto the
      paper, but its leading edge stops at the paper boundary. The curled corner becomes a raised threshold
      that the shadow cannot lift. D6, D7 and D8 now determine an obstacle for an invented agent. The
      unexpected connection is that a flat boundary can function as a doorway without the cup itself moving.


      **Alternative 3: one change in light.** Imagine moving the light source to the cup''s right while
      keeping the cup, right-pointing handle and curled paper corner fixed. The shadow would extend in
      the other direction under the simplified imagined setup, so the paper would no longer be its destination.
      D4 and D8 remain, but their relationship to the imagined light and shadow changes. The exact physical
      shape is not observed or calculated; label the result as an imagined variant, not a new actual observation.


      An unsuccessful early possibility was “the cup is a magical castle.” It used a new noun but did
      not make the oval rim or blue band affect anything. Keep that failed attempt in the record. Alternative
      1 revises it by making the rim a boundary, the band a route and the reflection a condition the traveler
      can respond to. The detail now does work in the imagined situation.


      ### Make a complete miniature


      The supplied choice is Alternative 2. Here is its original six-sentence passage:


      > The handle''s shadow waited at the edge of the paper.\

      > Its loop made a doorway, but the doorway could not step through itself.\

      > Ahead, one corner of the sheet lifted like a small roof.\

      > The shadow tried to shelter beneath it without leaving the cup behind.\

      > Nothing on the table moved.\

      > Still, the distance between shade and shelter had become a journey.


      The loop, paper edge and raised corner come from D6–D8. Waiting, trying and experiencing a journey
      are invented. “Nothing on the table moved” is part of this imagined scene; the source description
      did not supply an actual five-minute movement observation. Keeping that distinction visible prevents
      a creative sentence from rewriting the observation log.


      Compared with “a plain cup beside paper,” the miniature uses an overlooked alignment between shadow
      and paper. Its specificity does not prove universal originality or that a reader will share its
      associations. A reader might find the personification too abstract. That response can guide another
      version while leaving the original observation record intact.


      ### Produce your observation-to-making record


      1. Record the first broad impression, the information source and at least eight concrete details.
      Use available senses or a descriptive source; mark unavailable channels honestly.

      2. Separate interpretations from observations. Preserve source tags so supplied wording does not
      become a claim that you directly saw or heard something.

      3. Make all three alternatives: object as place, shadow as focus, and one changed light or position.
      Map at least two details into each and describe the changed relationship.

      4. Keep one unsuccessful possibility and revise it beyond a noun swap. Choose an alternative and
      make a six-sentence passage, brief sound sketch or accessible arrangement.

      5. Save the miniature and compare it with the first impression. Name one newly noticed connection
      and identify the invented elements. Then open the [later packet](?resource=file-later-packet-md)
      to test what happens when a supporting detail changes.


      For support, number details and draw simple arrows from two of them to each alternative. For a harder
      pass, keep the same facts while removing personification, so a spatial or rhythmic relationship
      must carry the piece. Work privately unless a willing audience would help your purpose. You may
      stop if the setting becomes uncomfortable; no sensory intensity, touching or performance is required.


      An actual record paired with a made miniature can show that particular details affected the work.
      A list of vivid adjectives alone cannot show transformation, and a polished fictional passage alone
      cannot establish observation. The claim stays small: richer attention supplied options that were
      absent from the first broad impression.


      ### Use the result at its proper scale


      Creative cultivation is optional; access adaptations do not lower human worth. Fiction and no attempt
      are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A description gives a red box and a torn label but no sound. May you log a creak as an observed
      detail to reach eight entries?

      2. You rename a cup a fortress but its shape, light and position change nothing in the scene. What
      would make this a stronger transformation?

      3. A later description moves the paper beyond the shadow. Can you keep your earlier observed alignment
      as a fact about the new scene?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Mark sound unavailable and use additional details that are actually available, or select
      an accessible source with enough information. A creak can be invented for the miniature only if
      labeled invention.

      2. Give at least two available details a new relationship or consequence, such as a rim controlling
      entry and a shadow defining a route. A fantastical noun alone does not show close details shaping
      possibilities.

      3. No. Preserve the earlier record, mark the new alignment and revise the dependent premise. You
      may keep a creative association as invention, but should not present it as the updated observation.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
