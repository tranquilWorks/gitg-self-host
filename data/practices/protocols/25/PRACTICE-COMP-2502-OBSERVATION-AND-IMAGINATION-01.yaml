meaning_and_fit:
  purpose: Notice concrete form, pattern, language, movement and sound before using those details to imagine
    possibilities that are not merely generic impressions.
  why_recommended: Notice concrete form, pattern, language, movement and sound before using those details
    to imagine possibilities that are not merely generic impressions.
  claims:
  - statement: Notice concrete form, pattern, language, movement and sound before using those details
      to imagine possibilities that are not merely generic impressions.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Observation and imagination practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Observation and imagination as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a tactile object, sound, accessible image description or verbal scene
    when a sense is unavailable. Observe objects or willing participants, not private behavior. Use familiar
    safe materials and a short duration; no sensory overload or forced public performance is required.
  opportunity_considerations: Choose an ordinary safe object and setting, such as a cup on a table near
    a window. Use a private page with headings for shape, surface, light, position, sound, movement and
    possible associations. Internal bodily focus, touching and visual observation are optional; choose
    accessible senses without forcing them.
  prerequisites:
  - Choose an ordinary safe object and setting, such as a cup on a table near a window. Use a private
    page with headings for shape, surface, light, position, sound, movement and possible associations.
    Internal bodily focus, touching and visual observation are optional; choose accessible senses without
    forcing them.
  dependencies: []
  safe_alternatives:
  - Use a tactile object, sound, accessible image description or verbal scene when a sense is unavailable.
    Observe objects or willing participants, not private behavior. Use familiar safe materials and a short
    duration; no sensory overload or forced public performance is required.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Observation and imagination differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Observation and imagination
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary safe object and setting, such as a cup on a table near a window. Use a private
    page with headings for shape, surface, light, position, sound, movement and possible associations.
    Internal bodily focus, touching and visual observation are optional; choose accessible senses without
    forcing them. Goal: Notice concrete form, pattern, language, movement and sound before using those
    details to imagine possibilities that are not merely generic impressions. Scope: One observation-to-making
    sequence tests attention and imaginative transformation. It does not authorize surveillance, recording
    strangers or claims about another person’s inner life. Time and effort: Ten minutes of observation,
    twenty minutes of alternatives and a ten-minute comparison. Adaptation: Use a tactile object, sound,
    accessible image description or verbal scene when a sense is unavailable. Observe objects or willing
    participants, not private behavior. Use familiar safe materials and a short duration; no sensory overload
    or forced public performance is required. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a tactile object, sound, accessible image description or verbal scene when
    a sense is unavailable. Observe objects or willing participants, not private behavior. Use familiar
    safe materials and a short duration; no sensory overload or forced public performance is required.
  expected_burden: Ten minutes of observation, twenty minutes of alternatives and a ten-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Observation and imagination protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Observation and imagination action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a tactile
    object, sound, accessible image description or verbal scene when a sense is unavailable. Observe objects
    or willing participants, not private behavior. Use familiar safe materials and a short duration; no
    sensory overload or forced public performance is required.
  actions:
  - stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A1
    sequence: 1
    title: Record details before assigning meaning
    instructions: 'Observe for five minutes and record at least eight specific details across available
      senses or descriptive sources. For the default, notice an uneven rim reflection, a handle shadow
      or the sound when the cup is set down rather than writing only beautiful or boring. Mark an unavailable
      sense as unavailable. Separate what was noticed from an inference, such as the cup being abandoned,
      and do not infer a person’s feelings from a posture or expression.


      Observation checks: At least eight specific details or accessible observations are recorded; Descriptions
      are more concrete than broad judgments; Unavailable senses are not filled with invented observations;
      Observed facts and imagined meanings are separated. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01
      action_stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A1
      competency_stable_id: '25.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2502_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2502_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - at_least_eight_specific_details_or_accessible_observations_are_recorded
        - descriptions_are_more_concrete_than_broad_judgments
        - unavailable_senses_are_not_filled_with_invented_observations
        - observed_facts_and_imagined_meanings_are_separated
      - measurement_id: c2502_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2502_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A2
    sequence: 2
    title: Generate alternatives that use the actual details
    instructions: 'Create three short possibilities: describe the cup as a place, make the shadow rather
      than the cup the main character, and imagine the same scene after one small change in light or position.
      Each version must retain two observed details while changing their relationship or significance.
      Do not merely replace a noun with a fantastical one. Note one unexpected connection and one possibility
      that did not work.


      Observation checks: Three distinct transformations are attempted; Each transformation retains two
      actual observed details; Relationships or viewpoint change rather than only surface labels; An unsuccessful
      possibility remains part of the record. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01
      action_stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A2
      competency_stable_id: '25.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2502_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2502_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_distinct_transformations_are_attempted
        - each_transformation_retains_two_actual_observed_details
        - relationships_or_viewpoint_change_rather_than_only_surface_labels
        - an_unsuccessful_possibility_remains_part_of_the_record
      - measurement_id: c2502_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2502_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A3
    sequence: 3
    title: Make one miniature and compare it with the first impression
    instructions: 'Choose one alternative and produce a six-sentence passage, short sound sketch or simple
      arrangement using the selected details. Compare it with your first broad impression and identify
      what became noticeable only after looking or listening closely. State what is factual observation
      and what is creative invention. Keep the miniature private or share only with a willing audience;
      the aim is richer attention, not proof of originality.


      Observation checks: A small creative output is actually made; Its details can be traced to the observation;
      One previously missed connection is identified; Factual and invented elements remain clearly distinguished.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Which detail changed the imagined possibilities, and what would have been lost if
      you had stopped at the first impression?


      Examples: Supportive: A moving handle shadow became the scene’s focus, and the finished passage
      used details absent from the initial description of a boring cup.


      Mixed: The observations were specific, but two alternatives only changed labels, so one was revised
      around a different relationship.


      Contradictory: A stranger’s behavior was secretly recorded or an invented motive was presented as
      observed fact.


      Inconclusive: Imaginative adjectives were listed without close observation, alternatives or a made
      miniature.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01
      action_stable_id: PRACTICE-COMP-2502-OBSERVATION-AND-IMAGINATION-01-A3
      competency_stable_id: '25.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
