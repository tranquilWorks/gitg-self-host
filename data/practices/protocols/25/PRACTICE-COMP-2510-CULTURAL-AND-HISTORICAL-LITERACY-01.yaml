  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Correct a caption without inventing a new certainty


      A supplied fictional caption reads: “Hokusai painted this in 1832. Its national love of nature directly
      caused Van Gogh''s anxious painting.” Keep the flawed caption visible, then replace it with:


      “Under the Wave off Kanagawa is catalogued as a woodblock print from approximately 1830–32. Wheat
      Field with Cypresses is catalogued as an 1889 oil painting. Their records support a comparison of
      medium, form and making context; this study does not establish a direct influence between these
      particular objects or a psychological explanation for either.”


      The correction restores medium and date range, removes a national stereotype, and withdraws unsupported
      causal and mental-state claims. It does not assert that no influence existed. That remains a different
      historical question requiring specific evidence.


      A second reader asks whether the print''s engraver has been identified. The registered general essay
      explains production roles, not this impression''s named workers. Write “not established by the inspected
      sources,” rather than assigning an uncredited person''s work to Hokusai by default. The proposed
      textile study remains unselected; there has been no additional artwork inspection or actual audience
      feedback.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Study two particular works before making a claim about a tradition. Use two twenty-minute studies
      and a twenty-minute comparison. This route uses museum catalogue text and a transcript; no artwork
      image or audio was inspected for these supplied observations. Direct looking or listening is an
      optional route when accessible, and must be labeled separately from reading someone else''s description.


      ### Route beyond the two visual works


      Use one additional medium at a time. For literature, choose one lawfully accessible short text with
      its author, language, date and translation credit; distinguish what the narrator says from a historical
      claim about the author’s community. For music, use an authorized recording or score with performer,
      composer or tradition attribution where known; compare one audible or described feature with a documented
      account of its use rather than guessing emotion from nationality. For ritual or everyday custom,
      start with a community member’s public explanation that expressly welcomes outsiders; observation
      does not authorize reenactment, recording or sacred access. For each route, retain two inspectable
      details, one contextual source, an alternative interpretation and a question the sources cannot
      answer. Ask who made, transmitted, adapted or was excluded from the account. A next study is ready
      only when the actual text, recording or account and access route are identified; until then it remains
      a plan. The two supplied museum works establish an initial visual comparison, not completed study
      of every medium.


      ### Separate the object, the account and your interpretation


      A title, date range, medium and collection number help identify which object you mean. A museum''s
      interpretation helps situate it, but does not exhaust its meanings or include every maker, audience
      and history. Keep three kinds of statement distinct: a documented catalogue fact, an observation
      from a specified access route, and your own interpretation or unanswered question.


      The two works below let you compare different media and conditions of making. They cannot stand
      for all Japanese and European culture. Avoid turning preference for one work into a ranking of peoples
      or treating a famous maker as the sole source of a tradition. Literature, music, ritual, stories,
      design and everyday custom need their own contextual study; this first comparison does not supply
      it.


      ### Study A: a print with a production history


      The Met identifies Katsushika Hokusai''s **Under the Wave off Kanagawa**, from *Thirty-six Views
      of Mount Fuji*, as approximately 1830–32, an Edo-period woodblock print in ink and color on paper.
      The museum URL''s object identifier is 45434; the actual collection number is **JP1847**. These
      are different identifiers. See the inspected [catalogue record, S05](https://www.metmuseum.org/art/collection/search/45434).


      The supplied text-mediated detail record contains three features from the catalogue description:
      the cresting wave curves around the view; Mount Fuji appears as a small triangle within that framing;
      and the palette includes indigo and imported Prussian blue. These are not newly observed image details.
      The reader has not counted boats, examined paper texture or heard a museum audio track.


      A separate Met essay, [Woodblock Prints in the Ukiyo-e Style, S07](https://www.metmuseum.org/essays/woodblock-prints-in-the-ukiyo-e-style),
      describes a divided production process involving designer, engraver, printer and publisher, with
      registered blocks used for color printing. That supports a question about collaborative making behind
      a named design. It does not identify the individual workers, edition size or first buyer of this
      particular impression.


      **Original appreciation A:** “The catalogue''s contrast between a curving wave and a small mountain
      makes me curious about how a stable landmark can be framed by a threatening movement. Knowing this
      is a print changes my first assumption that the object is a single painted surface produced by one
      person''s hand.”


      The appreciation connects a particular formal contrast with a revised understanding of medium. It
      does not claim the museum proved that the wave feels threatening to everyone. The inherited landscape
      subject and the catalogue''s imported pigment detail make continuity and exchange visible; neither
      establishes a simple story of isolated, unchanging national tradition.


      ### Study B: a painting within a sequence of versions


      The Met identifies Vincent van Gogh''s **Wheat Field with Cypresses** as an oil painting on canvas
      from 1889. Its URL object identifier is 436535, and its collection number is **1993.132**. The catalogue
      places it among his Saint-Rémy work and distinguishes this outdoor study from two later studio versions.
      See [S06](https://www.metmuseum.org/art/collection/search/436535).


      The supplied reader uses the catalogue and the page''s written audio transcript, without playing
      audio. Three text-mediated features are a horizontal composition, thick paint handling, and dark
      upright cypresses against a brighter field. The transcript''s description may guide a later accessible
      encounter with the work, but is not a substitute for pretending to have seen brushwork at close
      range.


      **Original appreciation B:** “The described upright trees against the field give me a way to think
      about stillness within an active painted surface. The existence of later versions changes my first
      impression of a wholly unrepeated spontaneous moment into a question about how an outdoor study
      can inform subsequent work.”


      That question concerns practice and form. The colors and brushwork do not justify diagnosing the
      artist or inventing what he felt on a particular day. A biography or medical claim would require
      different evidence and a reason to introduce it; neither is needed for this study.


      ### Compare without flattening the differences


      | Question | Supplied print study | Supplied painting study |

      | --- | --- | --- |

      | What material distinction matters? | A printed impression on paper, within a reproducible making
      process | Oil paint on canvas, with later versions distinguished from this object |

      | What inherited practice or context is visible? | Landscape subject, woodblock production and pigment
      exchange | Outdoor study followed by studio repetitions within the documented period |

      | What first assumption changed? | Famous designer does not mean single-person physical production
      | Energetic handling does not mean only one unrepeated version |

      | What is still missing? | Specific production workers, original purchasers and their responses
      | Original audience reception and detailed evidence about differences among versions |


      The comparison concerns these records. It does not show that Hokusai''s particular print caused
      the choices in this particular painting. Similar subject matter or a general historical influence
      claim cannot fill that gap. Nor does a museum''s possession imply that all cultural perspectives
      are represented by its catalogue.


      Selection itself deserves attention. Both examples are famous works attributed to named men and
      held by one collecting institution. Makers whose work was anonymous, collaborative, excluded from
      collection or transmitted through performance are less visible in this tiny sample. Naming that
      limit is more accurate than claiming to have corrected it through two readings.


      ### Produce a contextual appreciation


      1. Record the exact title, attributed maker, medium, date or date range and collection identifier
      for each work. Keep uncertain dating uncertain.

      2. Identify three details per work and state how you encountered them: image, audio, object, description
      or transcript. Never substitute a route that did not happen.

      3. Link one detail to documented context and write a short original appreciation. Separate an inference
      about effect from a fact about production.

      4. Compare inheritance, adaptation, exchange and one missing perspective without ranking traditions.
      Preserve at least one changed first impression.

      5. Open the [later packet](?resource=file-later-packet-md), correct the supplied misleading caption,
      and choose a concrete next question beyond these two canonical examples.


      For support, use the supplied catalogue facts and detail records; no new image access is necessary.
      For a harder pass, choose one claim about original reception and identify exactly what further evidence
      would be needed before stating it. An accessible transcript or description is a legitimate study
      route, with its mediation named.


      The next proposed study is an attributed everyday textile documented with its makers'' own account
      of learning and use. The question is how transmission and collective labor appear when the finished
      object is not explained through one famous name. No textile or account has yet been selected or
      inspected. This is a bounded next step, not a claim that all omissions are repaired.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
