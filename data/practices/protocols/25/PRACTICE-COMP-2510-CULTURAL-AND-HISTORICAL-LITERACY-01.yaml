meaning_and_fit:
  purpose: Study creative inheritance across time and place while distinguishing observation, historical
    context, interpretation and the limits of one work’s representativeness.
  why_recommended: Study creative inheritance across time and place while distinguishing observation,
    historical context, interpretation and the limits of one work’s representativeness.
  claims:
  - statement: Study creative inheritance across time and place while distinguishing observation, historical
      context, interpretation and the limits of one work’s representativeness.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cultural and historical literacy practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cultural and historical literacy as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use museum audio, text descriptions, large print or a library’s accessible
    catalog. Choose other publicly documented works if the defaults are inaccessible or unsuitable. Respect
    customary access, religious meaning and community authority; availability online does not settle every
    ethical reuse question.
  opportunity_considerations: Use The Metropolitan Museum of Art’s official records for Hokusai’s Under
    the Wave off Kanagawa, object 45434, and Vincent van Gogh’s Wheat Field with Cypresses, object 436535,
    or accessible catalog descriptions of them. Read the objects’ own dates, materials and context rather
    than relying on a social-media caption. No museum travel or image copying is required.
  prerequisites:
  - Use The Metropolitan Museum of Art’s official records for Hokusai’s Under the Wave off Kanagawa, object
    45434, and Vincent van Gogh’s Wheat Field with Cypresses, object 436535, or accessible catalog descriptions
    of them. Read the objects’ own dates, materials and context rather than relying on a social-media
    caption. No museum travel or image copying is required.
  dependencies: []
  safe_alternatives:
  - Use museum audio, text descriptions, large print or a library’s accessible catalog. Choose other publicly
    documented works if the defaults are inaccessible or unsuitable. Respect customary access, religious
    meaning and community authority; availability online does not settle every ethical reuse question.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cultural and historical literacy differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cultural and historical literacy
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use The Metropolitan Museum of Art’s official records for Hokusai’s Under the Wave off Kanagawa,
    object 45434, and Vincent van Gogh’s Wheat Field with Cypresses, object 436535, or accessible catalog
    descriptions of them. Read the objects’ own dates, materials and context rather than relying on a
    social-media caption. No museum travel or image copying is required. Goal: Study creative inheritance
    across time and place while distinguishing observation, historical context, interpretation and the
    limits of one work’s representativeness. Scope: Two museum records begin cultural literacy; they do
    not represent entire cultures or establish authority to reproduce restricted material. Historical
    interpretation remains revisable. Time and effort: Two twenty-minute study periods and a twenty-minute
    contextual comparison. Adaptation: Use museum audio, text descriptions, large print or a library’s
    accessible catalog. Choose other publicly documented works if the defaults are inaccessible or unsuitable.
    Respect customary access, religious meaning and community authority; availability online does not
    settle every ethical reuse question. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use museum audio, text descriptions, large print or a library’s accessible catalog.
    Choose other publicly documented works if the defaults are inaccessible or unsuitable. Respect customary
    access, religious meaning and community authority; availability online does not settle every ethical
    reuse question.
  expected_burden: Two twenty-minute study periods and a twenty-minute contextual comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cultural and historical literacy protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Cultural and historical literacy action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use museum
    audio, text descriptions, large print or a library’s accessible catalog. Choose other publicly documented
    works if the defaults are inaccessible or unsuitable. Respect customary access, religious meaning
    and community authority; availability online does not settle every ethical reuse question.
  actions:
  - stable_id: PRACTICE-COMP-2510-CULTURAL-AND-HISTORICAL-LITERACY-01-A1
    sequence: 1
    title: Separate visible choices from the catalog’s historical claims
    instructions: 'For each work, note three formal details available through the image or accessible
      description, then separately record maker, date or date range, medium and one contextual fact supported
      by the museum record. Mark uncertainty and distinguish the museum’s interpretation from your own
      response. Do not infer the artist’s mental state or the values of an entire nation from one work.
      Keep enough source information to revisit the record.


      Observation checks: Three formal observations are separated from contextual claims; Maker date medium
      and one sourced context fact are recorded; Interpretation and uncertainty are labeled; One object
      is not treated as a complete culture or psychological diagnosis. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2510-CULTURAL-AND-HISTORICAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2510-CULTURAL-AND-HISTORICAL-LITERACY-01-A1
      competency_stable_id: '25.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
