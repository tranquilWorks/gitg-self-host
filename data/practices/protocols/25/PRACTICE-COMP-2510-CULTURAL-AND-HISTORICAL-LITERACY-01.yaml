  - stable_id: PRACTICE-COMP-2510-CULTURAL-AND-HISTORICAL-LITERACY-01-A2
    sequence: 2
    title: Compare material tradition and historical change
    instructions: 'Ask how a woodblock print and an oil painting make different expressive choices and
      what production, circulation or audience questions arise. Identify one inherited convention, one
      possible adaptation and one missing perspective, using an additional museum or community-authored
      source when needed. Compare without ranking the cultures as advanced or primitive. Note that surviving
      museum collections are selective and that absence from a collection is not absence of cultural achievement.


      Observation checks: The two media and their expressive constraints are compared; Inheritance adaptation
      and a missing perspective are considered; A further claim is sourced or explicitly left unresolved;
      The comparison avoids ranking cultures or treating collections as complete. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2510-CULTURAL-AND-HISTORICAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2510-CULTURAL-AND-HISTORICAL-LITERACY-01-A2
      competency_stable_id: '25.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
