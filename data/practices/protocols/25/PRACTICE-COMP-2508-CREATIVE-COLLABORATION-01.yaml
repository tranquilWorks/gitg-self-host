  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### A shared file is not permission to post a new version


      The fictional Rowan proposes putting the invitation on a public neighborhood page and changes line
      four back to “quiet stories” without asking. Ellis objects: the private agreement did not authorize
      public use, and the restored wording recreates the speaking expectation they had jointly removed.


      Rowan restores “quiet company” in the approved private version and keeps the public proposal separate.
      No post is made. Ellis is willing to revisit the proposed audience another day, but has not approved
      it now. Record the decision as private version finished, public use pending, not as consent obtained
      through silence.


      The original contribution note also understated Ellis''s creative wording. Both keep the corrected
      joint credit and agree to leave more decision time in any future session. This repairs the supplied
      process at the scale shown; it does not prove an enduring equal partnership or settle legal rights.


      If the edit had already been shared, a real correction would need to address the actual distribution
      with appropriate agreement. Here that event did not occur. No real collaborator, public audience,
      message or ownership transfer exists.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Give another person real influence over a small work, then examine how the result and control
      were shared. Allow fifteen minutes to agree, thirty to make and fifteen for a joint review. The
      default is a six-line invitation to a fictional celebration; a solo rehearsal can prepare the process
      but cannot establish actual collaboration.


      ### Shared authorship needs more than two names


      A collaborator should be able to change a meaningful choice, explain a concern and decline an unagreed
      use. Dividing typing duties while one person decides everything is not the same as shared creative
      influence. Equal dignity does not imply identical time, skills or contribution; credit should describe
      what actually happened rather than force an artificial fifty-fifty story.


      The University of Vermont''s [group-writing guide, S03](https://www.uvm.edu/writingcenters/undergradwriting/group-writing-guide)
      compares working together, dividing sections and layering contributions, with different coordination
      and participation costs. Its educational advice does not decide ownership or guarantee a good creative
      result. Here the supplied makers rotate roles so an idea originator also has a turn shaping clarity
      and a structure editor also contributes an expressive choice.


      Keep the agreement proportionate. Two people making a private miniature need clear purpose, time,
      decision rights, credit and sharing limits. Paid work or public licensing may need a more formal
      appropriate agreement. This exercise creates no contract, payment obligation or ownership transfer,
      and a confident or experienced participant does not gain unilateral control by default.


      ### Supplied collaboration C9


      Fictional adults Rowan and Ellis agree to invite neighbors to a small indoor celebration, warm and
      lightly playful without putting reluctant guests on the spot. The invented event is Saturday, 4–5
      p.m., in Maple Room at Orchard Hall, through an east level entrance. Bringing a snack is optional;
      quiet attendance and leaving early are welcome. No actual event or venue access is asserted.


      They agree to keep the result private unless both later approve a specific use. Rowan begins with
      images and ideas; Ellis shapes order and clarity. After fifteen minutes they exchange roles. Each
      has thirty minutes to make, can request a pause and can reject use of their name outside the agreed
      context. Their disagreement method is to explain the intended effect, try both short versions and
      choose together against the invitation''s purpose.


      The initial credit note would say: “Words by Rowan; editing by Ellis.” It is provisional, because
      a contribution cannot be accurately assigned before the work occurs. If Ellis supplies an image
      or Rowan reorganizes the notice, the final credit must reflect that change. Neither may publish
      a discarded draft just because they typed it.


      ### Start with a joint working draft


      Original six-line draft:


      > Saturday, 4–5 p.m., a small neighborhood celebration.\

      > Maple Room, Orchard Hall; use the east level entrance.\

      > Bring a snack if you wish, or come empty-handed.\

      > A chair is waiting for your quiet stories.\

      > Stay for a little while or leave early.\

      > Even the biscuits have practiced their welcome.


      Rowan proposes the waiting chair and comic biscuits. Ellis supplies the ordered time/place/access
      information and the explicit optional snack. After swapping roles, Rowan shortens the event line
      and Ellis proposes changing “stories” to “company,” because a quiet guest should not feel required
      to speak. That changes meaning, not just punctuation.


      A genuine difference remains at the ending. Rowan wants a playful last beat; Ellis thinks the biscuits
      sound like a performance expectation when combined with “stories.” Neither dismisses the other as
      humorless or unserious. Each explains the effect sought: gentle amusement for Rowan, permission
      to be present without contributing for Ellis.


      ### Try both endings before choosing


      Alternative A is Rowan''s line: “Even the biscuits have practiced their welcome.” Alternative B
      is Ellis''s quieter line: “There is room for you without a story to tell.” Read each after the same
      first five lines. The first adds a comic image, but “practiced” echoes performance. The second makes
      welcome explicit but repeats the idea of stories and may overexplain.


      The jointly selected ending combines playfulness with freedom from performance: “The biscuits will
      not ask you to make a speech.” This is a new shared choice, not an automatic compromise because
      it contains pieces from both people. They choose it because it serves the stated audience and purpose.
      If neither version did that, separate versions or a pause would be legitimate.


      Final six-line miniature:


      > Saturday, 4–5 p.m., a small neighborhood celebration.\

      > Maple Room, Orchard Hall; use the east level entrance.\

      > Bring a snack if you wish, or come empty-handed.\

      > A chair is waiting for your quiet company.\

      > Stay for a little while or leave early.\

      > The biscuits will not ask you to make a speech.


      The invitation keeps every practical fact while changing the guest''s implied obligation. Rowan''s
      image now works with Ellis''s welcome concern. That visible interaction is better evidence of collaboration
      than a claim that teamwork made the piece better in every respect. A different reader could still
      find the joke distracting; no actual audience response is supplied.


      ### Review credit and control before any sharing


      Rowan says Ellis''s change removed an unintended demand to entertain. Ellis says Rowan''s image
      kept the notice from sounding procedural. These fictional statements identify the other''s effect
      on the work. Ellis also says the last choice felt rushed near the time limit. A useful final result
      can coexist with a process concern; do not delete it to portray mature collaboration as conflict-free.


      The revised credit reads: “Created together by Rowan and Ellis: initial images and event phrasing
      by Rowan; notice structure and quiet-company wording by Ellis; final ending selected and rewritten
      together.” They both approve that description for the private case. Credit records contribution
      but does not itself grant publication or reuse permission.


      The [later packet](?resource=file-later-packet-md) introduces an unagreed edit and a request for
      a broader use. Save the approved private version first. Compare the new proposal with the actual
      agreement instead of assuming that a shared file is available for whoever wishes to post it.


      ### Produce the collaboration record


      1. Agree on purpose, six-line scope, time, chosen contributions, a role swap and a disagreement
      method. Record credit and specific sharing/reuse limits before making.

      2. Make a joint draft and pause at one real difference. Preserve both alternatives and each person''s
      intended effect.

      3. Select, combine or keep alternatives by agreement. Identify exactly how each person changed the
      result, including any substantive contribution beyond the initial role.

      4. Review the piece together for strength and constraint. Correct inaccurate credit or an unagreed
      edit before release.

      5. Decide mutually to finish, revise once or keep separate versions. Mark collaboration incomplete
      if consent or control could not be balanced.


      For support, work asynchronously with one visible proposal and one response at a time. AAC, translation
      or extra decision time may be part of equal influence, not a penalty. For a harder pass, let the
      preferred ending fail the shared purpose and agree to remove it. Do not manufacture disagreement
      merely to check a box; an actual difference can concern timing, access, tone or permission.


      An actual joint artifact plus each participant''s account of influence can support a bounded collaboration
      claim. The invented case provides no real collaborator, consent or attribution receipt. A solo learner
      may rehearse every decision while leaving actual shared authorship pending.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A more experienced collaborator types the final file. Does that give them authority to publish
      both contributors’ work?

      2. Two names appear on a draft, but only one person chose images, wording and structure. What remains
      unestablished?

      3. Your collaborator likes the private version but has not answered a request to post it publicly.
      Can you treat their earlier approval as enough?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Typing, expertise and ownership of a file do not replace the agreed decision and sharing
      rights. Confirm the specific use and correct attribution before release.

      2. Substantive shared influence. Examine what each person actually changed and whether they could
      question decisions; two names alone do not demonstrate collaboration.

      3. No. The audience and use changed. Keep the approved private version separate and the public proposal
      pending until the relevant agreement is explicit; silence is not consent.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
