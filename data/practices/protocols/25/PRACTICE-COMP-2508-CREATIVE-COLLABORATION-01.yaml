        expected: true
      - measurement_id: c2508_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01-A2
    sequence: 2
    title: Create two alternatives at the point of disagreement
    instructions: 'Build the miniature together and deliberately pause at one genuine difference, such
      as a comic versus quiet ending. Each person explains the intended effect, then make both short alternatives
      without ridicule. Compare them against the shared purpose and audience rather than rank or confidence.
      Select, combine or leave the disagreement visible by agreement, and record how the second person’s
      contribution changed the result.


      Observation checks: Both collaborators make a substantive contribution; A real difference receives
      two trial alternatives; The shared purpose guides the choice; The result visibly incorporates rather
      than merely tolerates the other contribution. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01
      action_stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01-A2
      competency_stable_id: '25.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
