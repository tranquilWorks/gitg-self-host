        - the_shared_purpose_guides_the_choice
        - the_result_visibly_incorporates_rather_than_merely_tolerates_the_other_contribution
      - measurement_id: c2508_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
