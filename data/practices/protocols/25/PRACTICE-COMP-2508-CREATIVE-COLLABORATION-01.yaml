        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01-A3
    sequence: 3
    title: Review control credit and the work’s actual strength
    instructions: 'Read the final miniature together and ask each person what is stronger because of collaboration
      and what felt constrained. Correct an inaccurate credit or an unagreed edit before any sharing.
      Decide jointly whether to finish, revise once or keep separate versions. Record a failed collaboration
      honestly if consent or control could not be balanced; the existence of a joint file alone is not
      evidence of mature collaboration.


      Observation checks: Each person can name the other’s effect on the work; Control and discomfort
      are discussed without retaliation; Credit and unagreed changes are corrected before release; The
      final sharing or revision decision is genuinely mutual. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What became possible because the other person had real influence, and did the credit
      and decision process reflect that influence?


      Examples: Supportive: Two endings were tried and a combined version served the invitation better;
      both collaborators approved credit and private sharing.


      Mixed: The output was useful, but one person felt rushed, so the next collaboration changed decision
      timing.


      Contradictory: One contributor’s work was published or claimed without permission, or seniority
      replaced the agreed decision process.


      Inconclusive: A file had two names but only one person made decisions or contributions.'
    expected_time: 15-25 minutes
    due_within_days: 10
