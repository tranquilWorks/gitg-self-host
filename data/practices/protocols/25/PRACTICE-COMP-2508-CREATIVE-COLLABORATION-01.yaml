meaning_and_fit:
  purpose: Combine different strengths in a small creative work while negotiating authorship, disagreement
    and credit without one person quietly taking over.
  why_recommended: Combine different strengths in a small creative work while negotiating authorship,
    disagreement and credit without one person quietly taking over.
  claims:
  - statement: Combine different strengths in a small creative work while negotiating authorship, disagreement
      and credit without one person quietly taking over.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Creative collaboration practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Creative collaboration as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use asynchronous text, AAC, translated communication or a small accessible
    division of labor. A solo rehearsal can practice negotiating alternatives but cannot establish actual
    collaboration. For paid or public work, clarify rights and compensation through an appropriate agreement
    rather than relying on this exercise.
  opportunity_considerations: With one willing adult, create a six-line invitation to a fictional celebration
    or a short original dialogue. One person proposes images or ideas and the other shapes order and clarity,
    then exchange roles once. Agree that the draft stays private unless both later approve a specific
    use. No payment or legal transfer is involved.
  prerequisites:
  - With one willing adult, create a six-line invitation to a fictional celebration or a short original
    dialogue. One person proposes images or ideas and the other shapes order and clarity, then exchange
    roles once. Agree that the draft stays private unless both later approve a specific use. No payment
    or legal transfer is involved.
  dependencies: []
  safe_alternatives:
  - Use asynchronous text, AAC, translated communication or a small accessible division of labor. A solo
    rehearsal can practice negotiating alternatives but cannot establish actual collaboration. For paid
    or public work, clarify rights and compensation through an appropriate agreement rather than relying
    on this exercise.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Creative collaboration differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Creative collaboration as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'With one willing adult, create a six-line invitation to a fictional celebration or a short original
    dialogue. One person proposes images or ideas and the other shapes order and clarity, then exchange
    roles once. Agree that the draft stays private unless both later approve a specific use. No payment
    or legal transfer is involved. Goal: Combine different strengths in a small creative work while negotiating
    authorship, disagreement and credit without one person quietly taking over. Scope: One voluntary collaboration
    tests a shared process, not a professional contract or proof of equal contribution. Ownership and
    publication terms need explicit agreement appropriate to the context. Time and effort: Fifteen minutes
    to agree, thirty minutes to make together and a fifteen-minute joint review. Adaptation: Use asynchronous
    text, AAC, translated communication or a small accessible division of labor. A solo rehearsal can
    practice negotiating alternatives but cannot establish actual collaboration. For paid or public work,
    clarify rights and compensation through an appropriate agreement rather than relying on this exercise.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous text, AAC, translated communication or a small accessible division
    of labor. A solo rehearsal can practice negotiating alternatives but cannot establish actual collaboration.
    For paid or public work, clarify rights and compensation through an appropriate agreement rather than
    relying on this exercise.
  expected_burden: Fifteen minutes to agree, thirty minutes to make together and a fifteen-minute joint
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Creative collaboration protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Creative collaboration action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    text, AAC, translated communication or a small accessible division of labor. A solo rehearsal can
    practice negotiating alternatives but cannot establish actual collaboration. For paid or public work,
    clarify rights and compensation through an appropriate agreement rather than relying on this exercise.
  actions:
  - stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01-A1
    sequence: 1
    title: Agree on purpose decision rights and credit before making
    instructions: 'State the desired effect, the small scope and each person’s available time. Ask what
      contribution each wants to make and how disagreements will be resolved: explain the effect sought,
      try both versions and choose together. Decide how credit will name actual contributions and who
      may share or reuse the result. A more experienced person can guide technique without acquiring unilateral
      control over the other’s words or identity.


      Observation checks: Purpose scope and time are mutually agreed; Each collaborator chooses a contribution
      and a turn at shaping the work; A disagreement method is agreed before conflict; Credit sharing
      and reuse expectations are explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01
      action_stable_id: PRACTICE-COMP-2508-CREATIVE-COLLABORATION-01-A1
      competency_stable_id: '25.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2508_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2508_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - purpose_scope_and_time_are_mutually_agreed
        - each_collaborator_chooses_a_contribution_and_a_turn_at_shaping_the_work
        - a_disagreement_method_is_agreed_before_conflict
        - credit_sharing_and_reuse_expectations_are_explicit
      - measurement_id: c2508_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
