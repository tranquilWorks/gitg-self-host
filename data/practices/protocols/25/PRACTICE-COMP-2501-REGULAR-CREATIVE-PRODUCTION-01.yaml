meaning_and_fit:
  purpose: Establish a repeatable act of making without waiting for inspiration, a creative identity or
    permission to be excellent.
  why_recommended: Establish a repeatable act of making without waiting for inspiration, a creative identity
    or permission to be excellent.
  claims:
  - statement: Establish a repeatable act of making without waiting for inspiration, a creative identity
      or permission to be excellent.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Regular creative production practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Regular creative production as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Dictate, use symbols, make a short sound sequence or use another accessible
    safe medium. A five-minute version is legitimate when capacity is limited, but record its actual size.
    Avoid hazardous tools, copyrighted copying presented as original work and pressure to monetize or
    expose unfinished work publicly.
  opportunity_considerations: Use paper, a text editor or an accessible voice recorder. The supplied writing
    prompt is a six-sentence scene in which an ordinary object is unexpectedly missing. Session one uses
    a cup, session two a key and session three a chair. Use fictional people and no private history; another
    safe medium is acceptable if the same small scope can be completed.
  prerequisites:
  - Use paper, a text editor or an accessible voice recorder. The supplied writing prompt is a six-sentence
    scene in which an ordinary object is unexpectedly missing. Session one uses a cup, session two a key
    and session three a chair. Use fictional people and no private history; another safe medium is acceptable
    if the same small scope can be completed.
  dependencies: []
  safe_alternatives:
  - Dictate, use symbols, make a short sound sequence or use another accessible safe medium. A five-minute
    version is legitimate when capacity is limited, but record its actual size. Avoid hazardous tools,
    copyrighted copying presented as original work and pressure to monetize or expose unfinished work
    publicly.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Regular creative production differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Regular creative production
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper, a text editor or an accessible voice recorder. The supplied writing prompt is a six-sentence
    scene in which an ordinary object is unexpectedly missing. Session one uses a cup, session two a key
    and session three a chair. Use fictional people and no private history; another safe medium is acceptable
    if the same small scope can be completed. Goal: Establish a repeatable act of making without waiting
    for inspiration, a creative identity or permission to be excellent. Scope: Three brief pieces test
    continuity of production, not artistic mastery, productivity or the obligation to publish. Small and
    imperfect work is legitimate evidence of making. Time and effort: Three fifteen-minute sessions within
    seven days and a ten-minute comparison. Adaptation: Dictate, use symbols, make a short sound sequence
    or use another accessible safe medium. A five-minute version is legitimate when capacity is limited,
    but record its actual size. Avoid hazardous tools, copyrighted copying presented as original work
    and pressure to monetize or expose unfinished work publicly. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Dictate, use symbols, make a short sound sequence or use another accessible safe
    medium. A five-minute version is legitimate when capacity is limited, but record its actual size.
    Avoid hazardous tools, copyrighted copying presented as original work and pressure to monetize or
    expose unfinished work publicly.
  expected_burden: Three fifteen-minute sessions within seven days and a ten-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Regular creative production protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Regular creative production action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Dictate, use
    symbols, make a short sound sequence or use another accessible safe medium. A five-minute version
    is legitimate when capacity is limited, but record its actual size. Avoid hazardous tools, copyrighted
    copying presented as original work and pressure to monetize or expose unfinished work publicly.
  actions:
  - stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01-A1
    sequence: 1
    title: Choose a small form and finish the first attempt
    instructions: 'Set three ordinary session times and a limit of fifteen minutes each. For the first
      scene, write where the cup should be, what someone notices, what they try, an unexpected detail,
      a small choice and an ending. Do not stop to decide whether you are a writer or search for a better
      tool. Save the piece when the interval ends, even if it is rough, and record what material you actually
      made rather than how inspired you felt.


      Observation checks: Three realistic session times and a small form are selected; The first piece
      contains an observable beginning change and ending; A rough completed attempt is retained instead
      of endlessly prepared; Making is recorded separately from inspiration or self-judgment. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01
      action_stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01-A1
      competency_stable_id: '25.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2501_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2501_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_realistic_session_times_and_a_small_form_are_selected
        - the_first_piece_contains_an_observable_beginning_change_and_ending
        - a_rough_completed_attempt_is_retained_instead_of_endlessly_prepared
        - making_is_recorded_separately_from_inspiration_or_self_judgment
      - measurement_id: c2501_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2501_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01-A2
    sequence: 2
    title: Return twice without raising the required standard
    instructions: 'At the next two chosen times, use the key and chair versions of the prompt. Keep the
      same scope and time limit rather than turning the second session into a major project. Change one
      detail freely, such as point of view, place or mood, while still producing a finished small piece.
      If a session is missed, record the actual reason and reschedule once; do not invent a streak or
      compensate with an exhausting marathon.


      Observation checks: Two further actual making sessions occur or are honestly marked missed; The
      same bounded scope survives changing motivation; Each piece includes at least one freely chosen
      variation; Missed work is not hidden or repaid through excessive effort. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01
      action_stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01-A2
      competency_stable_id: '25.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2501_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2501_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_further_actual_making_sessions_occur_or_are_honestly_marked_missed
        - the_same_bounded_scope_survives_changing_motivation
        - each_piece_includes_at_least_one_freely_chosen_variation
        - missed_work_is_not_hidden_or_repaid_through_excessive_effort
      - measurement_id: c2501_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2501_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01-A3
    sequence: 3
    title: Select a sustainable return rather than a talent verdict
    instructions: 'Place the three pieces together and identify one detail worth keeping and one process
      obstacle that recurred. Choose the next manageable form, material and session time based on actual
      burden and enjoyment. You may keep every piece private. State whether the evidence shows repeated
      making, only one attempt or no workable routine yet; none of those is a judgment of creative worth.


      Observation checks: The actual pieces are compared rather than only intentions; One useful detail
      and one recurring obstacle are identified; The next session has a concrete sustainable scope; The
      conclusion concerns practice continuity rather than talent or worth. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What made returning possible on an ordinary day, and what small constraint helped
      you produce rather than prepare?


      Examples: Supportive: Three imperfect scenes were completed at the planned times and a simpler opening
      helped the person return without needing inspiration.


      Mixed: Two pieces were made and one session was missed; the next plan reduced the scope instead
      of claiming perfect consistency.


      Contradictory: The person exhausted themselves to protect a streak or copied another work while
      claiming original production.


      Inconclusive: Tools and ideas were collected without a finished small piece or a repeated making
      attempt.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01
      action_stable_id: PRACTICE-COMP-2501-REGULAR-CREATIVE-PRODUCTION-01-A3
