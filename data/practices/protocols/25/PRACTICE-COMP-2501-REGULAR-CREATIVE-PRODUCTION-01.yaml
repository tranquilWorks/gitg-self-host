  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Regular creative production; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Dictate, use symbols, make a short sound sequence or use another accessible safe medium. A five-minute
      version is legitimate when capacity is limited, but record its actual size. Avoid hazardous tools,
      copyrighted copying presented as original work and pressure to monetize or expose unfinished work
      publicly.
    cultural_context:
    - Adapt the expression of Regular creative production to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Dictate, use symbols, make a short sound sequence or use another accessible safe medium. A five-minute
      version is legitimate when capacity is limited, but record its actual size. Avoid hazardous tools,
      copyrighted copying presented as original work and pressure to monetize or expose unfinished work
      publicly.
  pause_conditions:
  - Pause Regular creative production when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Regular creative production practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Regular creative production situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
