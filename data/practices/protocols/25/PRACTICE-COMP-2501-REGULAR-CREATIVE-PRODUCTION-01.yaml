  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### The missed day remains in the record


      The supplied Wednesday session is missed because an existing meeting runs late. No scene is produced
      that day. The maker chooses one replacement on Thursday for ten minutes. Friday''s session then
      takes twelve minutes. The fictional actual making days are **Monday, Thursday and Friday**, with
      durations **15, 10 and 12 minutes**, totaling **37**. Wednesday remains a missed planned session;
      there is no uninterrupted planned streak.


      #### Second supplied scene: the key


      > Arun patted the empty hook beside the rehearsal-room door.\

      > His key had a square red tag that was hard to mistake.\

      > He followed a trail of paper scraps to the far end of the hall.\

      > There, a cardboard king wore the tag as a medal.\

      > Arun bowed to the king and unfastened the string.\

      > The door opened with rather less ceremony.


      This scene uses a third-person viewpoint, a hall setting and a playful discovery. It is a complete
      original six-sentence specimen. The recorded process change is that the notebook was already open,
      so starting did not require a search.


      #### Third supplied scene: the chair


      > The rehearsal could not begin because the detective''s chair was missing.\

      > Everyone searched behind the curtains while the detective waited on one knee.\

      > A muffled complaint came from the prop cupboard.\

      > We opened it to find the chair supporting an impressive tower of hats.\

      > The detective carried the whole arrangement onto the stage.\

      > For that evening, the mystery had excellent headwear.


      This six-sentence specimen shifts to a collective viewpoint and makes the missing object part of
      a humorous resolution. It does not prove that a real audience laughed.


      The Thursday and Friday records both note hesitation over choosing an ending, even after the notebook-location
      problem was reduced. That is the recurring process obstacle; the missing-object pattern was still
      enjoyable for this fictional maker. The supplied comparison keeps the concrete action before each
      discovery and notes that all three endings rely on finding the object. A future small scene could
      leave the object missing while still ending with a decision. The next plan is one five-minute attempt
      the following Tuesday at 7:10 p.m., with the notebook already open and one possible ending chosen,
      not a promise of daily output. These three supplied texts and their invented record are learning
      material, not your actual longitudinal evidence.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Finish a small piece on three ordinary days and learn which conditions make returning possible.
      The default is a six-sentence scene about a missing ordinary object, with each session capped at
      fifteen minutes. Plan all three within seven days and allow ten minutes afterward for comparison.
      Creative cultivation is optional. The exercise concerns making and returning, not earning an identity
      as an artist.


      ### Give the work a small finish line


      A bounded piece gives a session an endpoint that can be recognized without an audience or a perfect
      idea. Six sentences can establish an object, a place, a change and a response. They need not contain
      a dramatic revelation or autobiographical material. Stop when the scene is complete within the agreed
      time; do not turn an ordinary missed session into a debt that demands a marathon.


      The Open University''s [selected fiction-writing material, S14](https://www.open.edu/openlearn/history-the-arts/creative-writing/start-writing-fiction/content-section-3.3/?printable=1)
      discusses notebooks, concrete details and the possibilities of ordinary actions and settings. It
      does not validate this three-session schedule as a habit intervention. This companion supplies original
      examples and a practical recording method. Reading three examples in one sitting is not evidence
      that you made work on three days.


      Choose a freely selected medium and a finishable unit. The default uses writing, but a short original
      melody, arrangement, design sketch or accessible dictated scene can serve the same making-and-returning
      purpose when its finish line is explicit. Keep the unit manageable and materials familiar. You do
      not need to purchase tools, perform publicly or disclose private experiences.


      ### Supplied plan P8


      The fictional maker chooses Monday, Wednesday and Friday at 7:10 p.m., with a fifteen-minute maximum.
      The materials are one existing notebook and a pen, or an accessible text entry method. The prompt
      is “an ordinary object is unexpectedly missing”: use a cup for session one, a key for session two
      and a chair for session three. Each scene must differ in viewpoint, setting or mood; a single piece
      copied three times would not provide three making attempts.


      The initial plan leaves the notebook beside the chosen seat, opens to the next page and writes the
      prompt before the session. Its purpose is to reduce the next start to one visible action. If the
      time becomes unavailable, record that fact and offer one feasible replacement. The user of the plan
      may decline, shorten or stop it without a negative judgment about worth.


      The record has planned day, actual day, time used, finished artifact, starting obstacle and one
      next adjustment. It does not require a mood score, streak display or proof of enthusiasm. A completed
      piece can be awkward. A thoughtful unfinished attempt can still reveal a constraint, but should
      remain marked unfinished rather than renamed complete.


      ### First supplied scene: the cup


      These six sentences are an original teaching specimen, not an actual learner artifact:


      > I opened the kitchen cupboard and found a pale circle where the blue cup usually stood.\

      > Behind me, the kettle clicked itself quiet.\

      > I checked the drying rack, then the shelf where we kept the chipped bowls.\

      > A folded towel rose and fell on the table as if something underneath it were breathing.\

      > I lifted one corner and found the cup warming beside a small covered loaf.\

      > Whoever had set breakfast out had left my place ready.


      The scene gives the missing object an ordinary use and changes its meaning through a discovery.
      The kettle provides an action outside the search; the towel suggests movement before the simple
      explanation. The ending closes this small unit without explaining a whole household history. You
      may find the breathing comparison too dramatic for the setting; that is a legitimate later revision
      question, not a reason the first session cannot finish.


      The supplied first session takes **15 minutes** and produces these six sentences. The maker records
      a concrete obstacle: several minutes were lost looking for the previous draft. The next adjustment
      is to leave the notebook at the correct page. That is more usable than a general pledge to become
      disciplined. It does not prove that storage was the only barrier or that the next session will occur.


      ### Make before evaluating the whole practice


      During your first actual writing session, use the cup and a place you can invent safely. Write an
      opening that establishes the absence, then give the viewpoint something to do. Finish with a changed
      situation or a deliberate unresolved choice. If the time limit arrives first, save exactly what
      exists and record whether your chosen unit was finished. A shorter accessible unit may be appropriate
      for a later attempt; do not retroactively alter the agreed finish line to disguise the result.


      For sessions two and three, use the key and chair respectively, changing one meaningful condition
      while keeping the scale small. A new viewpoint might notice different information; a different setting
      changes what actions are possible; a humorous mood changes timing. This provides a small comparison
      across artifacts without requiring every piece to be novel in every respect. Keep your original
      drafts so that revision does not erase evidence of how the session went.


      After each session, name one detail worth keeping and one process observation. “The object turns
      up” describes plot; “the search passes three specific places before the reveal” describes a choice.
      “I am uncreative” is not a useful process observation. “I spent five minutes selecting a new app
      and had two minutes left to write” points to a condition that can be changed.


      ### Complete the three-day record


      1. Choose three ordinary session opportunities, a unit and a maximum burden. Name the medium, where
      work will be saved and the first visible action.

      2. Make the first piece, save it unchanged and record the actual day and duration. Compare it with
      the cup example only after your own attempt.

      3. On later ordinary days, make two further pieces with at least one different viewpoint, setting
      or mood. Do not compress three days into one session to make the record look complete.

      4. Keep a missed session visible and choose a feasible response. The [later packet](?resource=file-later-packet-md)
      supplies two more original scenes and an interrupted schedule for analysis; these do not substitute
      for your own attempts.

      5. Compare all three artifacts for one repeated strength, one recurring obstacle and one manageable
      next making commitment. An actual incomplete sequence remains incomplete, with its constraints recorded.


      For the supplied case, a modest next commitment is a five-minute scene on the following Tuesday
      at 7:10 p.m., using the same notebook already open and choosing one possible ending before starting.
      This choice follows the observed difficulty finding work and the later recurring hesitation over
      endings, not an assumption that more output is always better. The maker can also stop after the
      three-session trial. Repetition here is an invitation to build a usable practice, not a demand to
      optimize all free time.


      ### Read the evidence at its proper scale


      Three actual artifacts on three recorded days would show repeated production under those conditions.
      They would not establish a permanent habit, artistic excellence, public value or a new identity.
      A self-reported schedule without work attached cannot show that production occurred. Conversely,
      a polished sample with no session record cannot establish consistency across time.


      For support, prepare the place and object before the session and dictate or use a familiar communication
      method. For a harder pass, hold the six-sentence limit while varying the viewpoint rather than enlarging
      the project. Ask for audience response only if someone freely agrees and it serves your chosen purpose.
      Private work, a missed day or no attempt remains a legitimate outcome.


      The useful question is concrete: what made this small act of making possible, and what would make
      the next return manageable? Answer from the artifacts and the record rather than waiting for inspiration
      to certify that you may begin.


      ### Use the result at its proper scale


      Creative cultivation is optional; access adaptations do not lower human worth. Fiction and no attempt
      are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. You read three completed examples in one evening and save their titles. Does that meet a three-day
      making attempt?

      2. A planned Tuesday session is missed, but a small piece is finished Thursday. How should the record
      show it?

      3. Three small pieces are finished on different days but one is awkward. What is supported?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Reading examples is preparation. Repeated production needs your own actual artifacts
      and actual session days; supplied examples and invented dates cannot establish that evidence.

      2. Keep Tuesday as missed and Thursday as the actual making day, with its duration and artifact.
      Do not backdate, invent a streak or require an exhausting compensatory session.

      3. Repeated production occurred under those recorded conditions. Quality can be examined through
      particular choices and revision; the awkward piece does not erase the making record, and three pieces
      do not prove a permanent habit or artistic excellence.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
