meaning_and_fit:
  purpose: Practice a creative form with attention to its lineage, community standards and permitted transmission
    rather than treating inherited craft as raw material for isolated self-expression.
  why_recommended: Practice a creative form with attention to its lineage, community standards and permitted
    transmission rather than treating inherited craft as raw material for isolated self-expression.
  claims:
  - statement: Practice a creative form with attention to its lineage, community standards and permitted
      transmission rather than treating inherited craft as raw material for isolated self-expression.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Communal craft and tradition-bearing practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Communal craft and tradition-bearing as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a publicly shared accessible beginner form or an ordinary inherited practice
    freely offered by someone you know. Declining access is a legitimate boundary, not an obstacle to
    bypass. Do not record secretly, commercialize the lesson or pressure a practitioner to share protected
    knowledge.
  opportunity_considerations: Choose a form explicitly offered for learning, such as a simple ensemble
    rhythm, ordinary family stitch or publicly taught folding pattern. Ask a willing knowledgeable practitioner
    or use a clearly authorized community-produced beginner resource. Prepare questions about where the
    form comes from, its purpose, one foundation technique and what may be shared. Do not assume a sacred
    or restricted form is available because it appears online.
  prerequisites:
  - Choose a form explicitly offered for learning, such as a simple ensemble rhythm, ordinary family stitch
    or publicly taught folding pattern. Ask a willing knowledgeable practitioner or use a clearly authorized
    community-produced beginner resource. Prepare questions about where the form comes from, its purpose,
    one foundation technique and what may be shared. Do not assume a sacred or restricted form is available
    because it appears online.
  dependencies: []
  safe_alternatives:
  - Use a publicly shared accessible beginner form or an ordinary inherited practice freely offered by
    someone you know. Declining access is a legitimate boundary, not an obstacle to bypass. Do not record
    secretly, commercialize the lesson or pressure a practitioner to share protected knowledge.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Communal craft and tradition-bearing differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Communal craft and tradition-bearing
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a form explicitly offered for learning, such as a simple ensemble rhythm, ordinary family
    stitch or publicly taught folding pattern. Ask a willing knowledgeable practitioner or use a clearly
    authorized community-produced beginner resource. Prepare questions about where the form comes from,
    its purpose, one foundation technique and what may be shared. Do not assume a sacred or restricted
    form is available because it appears online. Goal: Practice a creative form with attention to its
    lineage, community standards and permitted transmission rather than treating inherited craft as raw
    material for isolated self-expression. Scope: One short lesson is an introduction, not membership,
    mastery or authority to teach restricted knowledge. The community or practitioner’s boundaries govern
    access and sharing. Time and effort: Fifteen minutes to arrange permission, one bounded lesson or
    documented tutorial and a twenty-minute practice review. Adaptation: Use a publicly shared accessible
    beginner form or an ordinary inherited practice freely offered by someone you know. Declining access
    is a legitimate boundary, not an obstacle to bypass. Do not record secretly, commercialize the lesson
    or pressure a practitioner to share protected knowledge. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a publicly shared accessible beginner form or an ordinary inherited practice
    freely offered by someone you know. Declining access is a legitimate boundary, not an obstacle to
    bypass. Do not record secretly, commercialize the lesson or pressure a practitioner to share protected
    knowledge.
  expected_burden: Fifteen minutes to arrange permission, one bounded lesson or documented tutorial and
    a twenty-minute practice review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Communal craft and tradition-bearing protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Communal craft and tradition-bearing action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a publicly
    shared accessible beginner form or an ordinary inherited practice freely offered by someone you know.
    Declining access is a legitimate boundary, not an obstacle to bypass. Do not record secretly, commercialize
    the lesson or pressure a practitioner to share protected knowledge.
  actions:
  - stable_id: PRACTICE-COMP-2512-COMMUNAL-CRAFT-AND-TRADITION-BEARING-01-A1
    sequence: 1
    title: Ask about the form’s history standards and sharing limits
    instructions: 'Confirm that the teacher or resource is authorized and willing to share this beginner
      form. Ask what community or lineage sustains it, what makes an attempt recognizable, what should
      not be changed yet and whether you may later demonstrate it. Agree on time, any fair compensation
      and recording rules before the lesson. A person can speak from their own practice without being
      required to represent an entire culture.


      Observation checks: The learning invitation and teacher’s scope are confirmed; History purpose and
      one recognizable standard are discussed; Recording teaching and later sharing limits are explicit;
      Time compensation and representation are handled respectfully. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2512-COMMUNAL-CRAFT-AND-TRADITION-BEARING-01
      action_stable_id: PRACTICE-COMP-2512-COMMUNAL-CRAFT-AND-TRADITION-BEARING-01-A1
