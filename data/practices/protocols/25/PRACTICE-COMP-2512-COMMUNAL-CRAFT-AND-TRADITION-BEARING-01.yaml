  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### A limited next step, with wider sharing still closed


      Tarin asks Jo: “May I show this beginner fold once, in person, to my adult cousin who wants to learn,
      crediting you and Mae as my learning line? No recording, public group or sale.” In this supplied
      fiction, Jo agrees to that specific demonstration and asks Tarin to state that they are a beginner.
      Jo does not approve a video or a club class.


      The cousin has not yet confirmed a time and the demonstration has not occurred. The next step is
      permitted in scope but remains unperformed. There is no teaching-success evidence, no endorsement
      by a whole community and no permission to distribute a recording.


      The technique record remains two full attempts plus alignment practice on a component. The second
      fan works more smoothly but is not evenly aligned. Tarin chooses another private practice before
      arranging the permitted demonstration. Credit now names the known teaching line without assigning
      invention to Mae. More polished work would not expand the permission by itself.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Learn an explicitly shareable beginner form from a willing knowledgeable practitioner or authorized
      resource. Allow fifteen minutes to arrange permission, one bounded lesson, and twenty minutes to
      review practice. This supplied case uses an ordinary accordion paper fan and a fictional family
      teaching line. It claims no actual cultural authority, sacred form or authenticated historical origin.


      ### A form arrives with relationships


      Learning an inherited practice involves more than extracting a technique. A teacher can show what
      makes an attempt recognizable, why the form matters in that setting, how people learned it and what
      may be passed on. One person can describe their own practice without representing a whole culture.
      An invitation to learn privately does not automatically authorize recording, public teaching or
      sale.


      [Local Contexts'' TK Labels, S09](https://localcontexts.org/labels/traditional-knowledge-labels/)
      illustrate community-specific authority and conditions for access and use in Indigenous contexts.
      Their labels are not a universal tagging scheme for every hobby, and none is applied here. [WIPO''s
      overview of traditional cultural expressions, S10](https://www.wipo.int/en/web/traditional-knowledge/traditional-cultural-expressions/index)
      explains the relation between expressive forms, community identity and intergenerational transmission.
      Neither page grants permission for a particular lesson or determines ownership of this ordinary
      fold.


      The fictional example lets you rehearse respectful questions and follow a complete technique. Reading
      it does not create an actual teacher relationship. For a real attempt, use an offered form whose
      teaching source and permission can be established. If that is unavailable, preparation or no attempt
      is legitimate; do not replace a refusal with an unauthorized online copy.


      ### Supplied lesson agreement T9


      Jo learned this family version of an accordion fan from Mae and uses it at neighborhood summer gatherings.
      Jo offers Tarin a thirty-minute beginner lesson with two ordinary sheets of paper already available.
      The supplied agreement states that Jo is willing, considers this ordinary family version shareable
      for this lesson, and asks for no payment on this occasion. That voluntary choice is not a rule that
      practitioners owe free teaching.


      Private learning and practice are allowed. There will be no recording. Public posting, selling and
      teaching a group have not been authorized. Tarin may ask about a later demonstration, but the answer
      will be specific to that request. The family connection concerns this teaching line, not a claim
      that Mae invented accordion folding or that Jo speaks for all paper-folding communities.


      Jo explains the purpose: a simple handheld fan made together from familiar material, with attention
      to repeating folds neatly enough to open and close. The beginner standard has four parts: eight
      reasonably even panels, seven alternating creases, upper edges kept aligned, and a fan that opens
      and closes without one crease buckling the wrong way. The practice begins with that standard before
      inventing a different version.


      ### Complete beginner sequence


      Use an ordinary rectangular sheet in landscape orientation, long edges running left to right. Keep
      the same top edge throughout. A supported, seated or larger-paper route is legitimate when it makes
      the folds easier to handle; pause if the movement is uncomfortable. No cutting or special tool is
      needed.


      1. Fold the right short edge to meet the left short edge. Align the upper corners and crease the
      vertical fold. Fold the resulting stack in half the same way twice more. Unfold completely. There
      are eight narrow columns separated by seven vertical creases; the edges of the sheet are not counted
      as creases.

      2. Turn the sheet so the original top edge is still at the top. Refold crease one as a valley: the
      two adjacent panels come toward each other on the side facing you. Refold crease two the opposite
      way, as a mountain rising toward you. Continue **valley, mountain, valley, mountain, valley, mountain,
      valley** across all seven creases. Reverse a pre-existing crease gently when necessary.

      3. Bring the panels together into an accordion stack, checking that the upper edges align. Hold
      the bottom of the stack in one hand and spread the upper ends with the other. The paper opens into
      a fan while the bottom remains held. Close it by bringing the panels back together; no glued handle
      is claimed.

      4. Compare the result with Jo''s four-part standard. Identify one component to practice, keeping
      the first attempt intact for comparison when possible.


      This sequence is original instructional prose for the fictional ordinary lesson. It is not copied
      from an inaccessible tutorial or presented as a named community''s protected pattern. An actual
      teacher''s offered variant may use a different count or method; agree on that variant''s standard
      before claiming to have followed it.


      ### Two attempts and one correction


      **Attempt 1:** Tarin makes eight panels and seven creases, but crease four is a valley where the
      sequence requires a mountain. Opening the fan makes the center buckle. The count alone is therefore
      insufficient: sequence affects function. Jo points to crease four and asks Tarin to compare its
      direction with creases three and five.


      **Attempt 2:** a second sheet has the correct alternating directions and opens without the earlier
      buckle. The upper edges are uneven because the corners slipped during the initial folds. Jo''s specific
      correction is to align the upper corners before pressing the fold and to hold them in place while
      beginning the crease.


      Tarin repeats that alignment component with two folds on an offcut from one of the two supplied
      sheets. The corners meet more closely in this supplied component practice. There is no third complete
      fan and no independent assessment of mastery. Both whole attempts, the sequence error and the remaining
      alignment issue stay in the record.


      Technique and responsibility belong together. A technically neater object would not authorize public
      teaching. Likewise, respectful credit alone would not show that the foundational fold was learned.
      The review needs an inspectable attempt and a truthful account of the learning relationship.


      ### Return the learning accurately


      Tarin''s first wording is “Mae''s original fan design, taught by Jo.” Jo corrects it: the family
      uses this version, but Mae is not known to have invented it. The revised attribution is “I learned
      this family version from Jo, who learned it from Mae; in their gatherings it is made as a simple
      handheld fan.” That statement credits the known line without claiming origin or endorsement beyond
      it.


      Before the [later packet](?resource=file-later-packet-md), decide what a limited demonstration request
      must specify: who will see it, what will be shown, whether recording occurs and whether money or
      promotion is involved. Keep private practice available even when wider sharing remains unapproved.


      For your own attempt, retain the agreement, the form''s purpose, the stated beginner standard, two
      attempts, one practiced correction and the permitted next step. Private notes can omit names when
      identification is unnecessary. Do not upload a teacher''s words, image or restricted material simply
      to prove participation.


      For support, work through the supplied sequence as preparation and use a larger sheet or assistance
      chosen by the learner. For a harder pass, explain why a count-correct fan can still buckle, then
      demonstrate the correction only within the actual permission given. One short lesson is an introduction
      to a practice and its responsibilities; it confers neither membership nor authority to teach unlearned
      material.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


