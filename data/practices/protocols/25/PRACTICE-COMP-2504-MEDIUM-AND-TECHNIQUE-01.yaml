meaning_and_fit:
  purpose: Discover how a medium’s tools, constraints and conventions shape expression by executing a
    small technique and choosing a form for a reason.
  why_recommended: Discover how a medium’s tools, constraints and conventions shape expression by executing
    a small technique and choosing a form for a reason.
  claims:
  - statement: Discover how a medium’s tools, constraints and conventions shape expression by executing
      a small technique and choosing a form for a reason.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Medium and technique practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Medium and technique as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use text, tactile arrangement, gesture, sound notation or another familiar
    safe medium with equivalent comparison. Assistive technology is part of the medium, not a penalty.
    Do not introduce solvents, cutting tools, loud sound or physical strain to make the task more authentic.
  opportunity_considerations: 'Use the original line: I thought the door was closed. Prepare a written
    version and a spoken or rhythm-marked version. For writing, use punctuation, sentence breaks and one
    added concrete detail. For speech, use a comfortable pause and emphasis without strain. A non-speaking
    participant can mark pauses and emphasis on paper or use a preferred communication device.'
  prerequisites:
  - 'Use the original line: I thought the door was closed. Prepare a written version and a spoken or rhythm-marked
    version. For writing, use punctuation, sentence breaks and one added concrete detail. For speech,
    use a comfortable pause and emphasis without strain. A non-speaking participant can mark pauses and
    emphasis on paper or use a preferred communication device.'
  dependencies: []
  safe_alternatives:
  - Use text, tactile arrangement, gesture, sound notation or another familiar safe medium with equivalent
    comparison. Assistive technology is part of the medium, not a penalty. Do not introduce solvents,
    cutting tools, loud sound or physical strain to make the task more authentic.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Medium and technique differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Medium and technique as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the original line: I thought the door was closed. Prepare a written version and a spoken
    or rhythm-marked version. For writing, use punctuation, sentence breaks and one added concrete detail.
    For speech, use a comfortable pause and emphasis without strain. A non-speaking participant can mark
    pauses and emphasis on paper or use a preferred communication device. Goal: Discover how a medium’s
    tools, constraints and conventions shape expression by executing a small technique and choosing a
    form for a reason. Scope: The default compares written and spoken language without equipment purchases.
    It is a foundational experiment, not training for hazardous tools or professional performance. Time
    and effort: Two fifteen-minute technique sessions and a fifteen-minute comparison. Adaptation: Use
    text, tactile arrangement, gesture, sound notation or another familiar safe medium with equivalent
    comparison. Assistive technology is part of the medium, not a penalty. Do not introduce solvents,
    cutting tools, loud sound or physical strain to make the task more authentic. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, tactile arrangement, gesture, sound notation or another familiar safe
    medium with equivalent comparison. Assistive technology is part of the medium, not a penalty. Do not
    introduce solvents, cutting tools, loud sound or physical strain to make the task more authentic.
  expected_burden: Two fifteen-minute technique sessions and a fifteen-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Medium and technique protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Medium and technique action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, tactile
    arrangement, gesture, sound notation or another familiar safe medium with equivalent comparison. Assistive
    technology is part of the medium, not a penalty. Do not introduce solvents, cutting tools, loud sound
    or physical strain to make the task more authentic.
  actions:
  - stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01-A1
    sequence: 1
    title: Learn the small technique through controlled variations
    instructions: 'Write the line as a statement, a question and two short clauses separated by a pause.
      Read or mark each version and note how punctuation or emphasis changes certainty and implication.
      Practice one chosen variation three times while preserving the words so the changed technique is
      visible. Use a comfortable volume or silent notation; do not force a voice, movement or sensory
      task that is painful or inaccessible.


      Observation checks: Three variations isolate punctuation pause or emphasis; The words remain stable
      while the technique changes; One foundational variation is practiced three times; Comfort and access
      limits are respected. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01
      action_stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01-A1
      competency_stable_id: '25.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2504_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2504_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_variations_isolate_punctuation_pause_or_emphasis
        - the_words_remain_stable_while_the_technique_changes
        - one_foundational_variation_is_practiced_three_times
        - comfort_and_access_limits_are_respected
      - measurement_id: c2504_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
