  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### More clarity, with an expressive cost


      A supplied private reader compares two additional silent notation cards: “I [emphasis on I] thought
      the door was closed” and “I thought [emphasis on thought] the door was closed.” The reader imagines
      the first as accusatory, while the second points more clearly to uncertain belief. This is a fictional
      comparison, not an actual audio test. Keep the chosen focus on the belief rather than copying an
      emphasis pattern without considering its effect.


      For the revised written exchange, the supplied reader notices “thought, not checked” and understands
      the distinction. The reader also says the explanation makes the scene less mysterious, and does
      not notice the note under the latch on first reading. That is partial communication, not an all-purpose
      improvement.


      The maker chooses the clearer first line for this private reader and adds a blank line before the
      final turn in a new layout trial, hoping to give the note more attention. The words remain the same
      in that layout trial. No later response is supplied, so its effect remains untested. The four spoken
      turns remain four lines of dialogue even with extra spacing.


      The record retains three controlled passes, two forms, a medium choice and an incomplete reception
      result. None establishes professional performance, a played recording or universal superiority of
      written language. An actual attempt can use delayed self-review instead of another person, labeled
      accordingly.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Keep a small idea stable while changing how the medium carries it. Use two fifteen-minute technique
      sessions and a fifteen-minute comparison. You will practice a controlled variation, make a four-line
      exchange in two forms and choose a form for a named audience and effect.


      ### A medium gives possibilities and constraints


      Written language can use punctuation, line breaks and a reader''s ability to return to earlier words.
      Spoken language can use timing and emphasis, but a listener may not be able to revisit a phrase
      immediately. A marked performance script can make intended timing visible without requiring speech.
      An assistive communication device also has expressive possibilities and limits; it is part of the
      medium, not a lesser substitute.


      The UNC Writing Center''s [reading-aloud guidance, S16](https://writingcenter.unc.edu/tips-and-tools/reading-aloud/)
      describes how changing the encounter with a text can reveal tone, rhythm and omissions. It does
      not require a particular voice or equipment here. This companion''s examples and notation are original.
      No audio was generated or performance recorded; a written rendering should not be described as a
      heard result.


      The foundational technique is a controlled change in pause or emphasis while preserving words. If
      everything changes at once, you cannot tell whether a new effect came from vocabulary, timing or
      context. Comfort sets the limit: use silent notation, familiar text or a preferred communication
      method. There is no need for loudness, breath strain, painful movement or equipment purchases.


      ### Isolate three variations of one line


      The exact starting line is **“I thought the door was closed.”** Preserve its words while exploring
      these variants:


      | Variant | Written or marked line | Possible effect to test |

      | --- | --- | --- |

      | Statement | I thought the door was closed. | Reports a previous belief; context may imply it changed
      |

      | Question | I thought the door was closed? | In dialogue, rising uncertainty may ask for confirmation;
      the grammar alone does not fix delivery |

      | Pause between clauses | I thought—the door was closed. | Separates “I thought” and “the door was
      closed,” potentially making the second clause sound like a new assertion |


      The dash variant exposes an ambiguity: the pause could communicate hesitation, or it could make
      the second clause sound more certain. Record what your actual rendering does rather than assuming
      punctuation has one universal emotional meaning. The six words stay fixed. Typographic marks, rhythm
      and emphasis are the variables.


      Choose one controlled variation and practice it three times. The supplied choice uses a short pause
      after “thought” and emphasizes that word, aiming to suggest a belief now in doubt. For a silent
      route, actually write or mark each pass and compare the notation; reading the table three times
      without making or executing the chosen variation is not the same attempt.


      | Supplied pass | Marking made | Process observation |

      | --- | --- | --- |

      | 1 | I THOUGHT [long pause] the door was closed. | The separation may sound or read like two disconnected
      claims |

      | 2 | I THOUGHT [short pause] the door was closed. | The shorter pause keeps the idea more connected
      |

      | 3 | I THOUGHT [short pause] the door was closed. | The chosen mark is repeated consistently; no
      actual listener response is supplied |


      The bracketed instructions and capitals are notation, not added spoken words. The first pass tests
      an overly long pause; the next two stabilize a shorter one. In your record, note what you actually
      marked, performed or played through your chosen device. Repetition of supplied text does not establish
      an unobserved spoken skill.


      ### Make the same exchange in two forms


      The supplied written piece aims at quiet uncertainty in a fictional rehearsal room. It uses four
      lines and concrete details: a ribbon, a window, a note and a latch.


      > A: I thought the door was closed.\

      > B: Then why is the ribbon moving?\

      > A: The window is shut.\

      > B: Read the note under the latch.


      Line breaks give each response a separate turn. The ribbon makes uncertainty visible without explicitly
      naming it. The note leaves a small question unresolved; this is a fictional scene, not an instruction
      for checking a real building or an emergency. A reader can return to the earlier line to consider
      why the window matters.


      The second form is an original marked performance script of the **same spoken words**:


      > A: I THOUGHT [short pause] the door was closed.\

      > B: Then why is the RIBBON moving? [one beat]\

      > A: The WINDOW is shut.\

      > B: [brief pause] Read the note under the latch.


      This is an accessible rendering attempt on the page, not a claim that someone performed or heard
      it. It places timing instructions where the written version relied on turn structure and rereading.
      If you choose speech or a device in an actual attempt, use a comfortable delivery and record what
      happened. A device''s pause controls may differ; do not pretend the notation guarantees the same
      result in every medium.


      Written form affords precise spacing and rereading, but cannot guarantee which word a silent reader
      stresses. A performance affords timing and emphasis, but can pass too quickly and may be inaccessible
      without an agreed alternative. A marked script exposes timing choices visually, but cannot itself
      establish acoustic tone or a listener''s experience. Compare what each form actually supplies, rather
      than declaring one more artistic.


      ### Choose a form for a reason


      The supplied context is a private reader who wants to revisit lines at their own pace. The maker
      chooses written text with a small amount of visible emphasis because the reader controls pace and
      the materials are already available. The intended effect remains uncertainty about the speaker''s
      earlier belief, not accusation toward the other person.


      The revised written piece is:


      > A: I thought the door was closed—thought, not checked.\

      > B: Then why is the ribbon moving?\

      > A: The window is shut.\

      > B: There is a note under the latch.


      Now vocabulary changes deliberately after the controlled technique exercise. The first line states
      the distinction between belief and checking, while the final declarative sentence softens the command.
      This revision may be clearer but less subtle. Explain that tradeoff; do not claim it preserves the
      exact original words, which was a constraint on the earlier practice and same-exchange rendering.


      ### Produce the technique-and-medium record


      1. Write or render the three starting variants with the six words stable. Note how statement, question
      and pause alter possible meaning.

      2. Practice the chosen variation three times in an accessible form. Save a notation or actual process
      record without fabricating sound, timing precision or audience evidence.

      3. Make a four-line exchange with one concrete detail and deliberate turns. Render the same exchange
      in a second accessible form and identify one affordance and limitation of each.

      4. Name the audience and intended effect, choose a medium and revise from the comparison. Keep the
      original alongside the revision so the reason for change is visible.

      5. Use a willing reader or delayed self-review, then open the [later packet](?resource=file-later-packet-md)
      for the supplied reception case. Decide what to keep and what remains uncertain.


      For support, mark only one emphasis and one pause per line. For a harder pass, hold all words stable
      in the final revision too and test whether spacing alone helps. A tactile arrangement, gesture or
      sound notation may replace the default when it preserves a comparable controlled technique and two-form
      comparison. Familiar safe materials are sufficient.


      Actual progress combines making, a traceable technique choice and a reception check at its proper
      scale. Choosing a medium by prestige, owning equipment or imagining a performance is insufficient.
      A quiet marked script can demonstrate deliberate technique without proving any unperformed vocal
      skill.


      ### Use the result at its proper scale


      Creative cultivation is optional; access adaptations do not lower human worth. Fiction and no attempt
      are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. You change punctuation, replace half the words and add a new setting, then attribute the effect
      entirely to a pause. What is missing?

      2. A non-speaking maker marks three passes and produces a performance script. Must they claim an
      audible performance to count their work?

      3. A reader understands the revised line but finds it less mysterious. Did the revision simply fail?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A controlled comparison. Keep the words stable while first testing pause or emphasis, then
      identify later vocabulary and context changes separately. Otherwise the evidence cannot isolate
      the technique.

      2. No. The actual marked rendering is legitimate within the accessible route. Describe what was
      made and observed; do not fabricate speech, acoustic tone or listener evidence.

      3. Not necessarily. The change improved one effect and reduced another. Choose according to the
      named purpose and audience, preserve the tradeoff and test any further revision instead of declaring
      one medium inherently better.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
