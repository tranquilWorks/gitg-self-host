        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01-A2
    sequence: 2
    title: Make a short piece in two forms
    instructions: 'Create a four-line written exchange about the door using one concrete detail and deliberate
      line breaks. Then render the same exchange in speech, a communication device or a marked performance
      script, deciding where timing carries meaning that the written page supplied differently. Record
      one affordance and one limitation of each medium. Do not judge the second form solely by how closely
      it imitates the first.


      Observation checks: A short written piece uses the chosen technique; A second accessible rendering
      is actually attempted; Each medium has an identified affordance and limitation; The comparison allows
      different means to serve the same expressive purpose. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01
      action_stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01-A2
      competency_stable_id: '25.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
