  - stable_id: PRACTICE-COMP-2504-MEDIUM-AND-TECHNIQUE-01-A3
    sequence: 3
    title: Choose the medium that serves a named audience and effect
    instructions: 'Select an intended effect, such as uncertainty, humor or urgency, and a willing audience
      or private-use context. Choose one medium and revise the piece using what the comparison revealed.
      Ask a reader or listener to describe the effect, or conduct a delayed self-review. Explain the choice
      in terms of material, technique, constraint and audience access rather than equipment prestige or
      a belief that one medium is inherently more artistic.


      Observation checks: A specific effect and audience guide the choice; The piece is revised from the
      two-medium comparison; Reception is checked without requiring approval; The medium choice has a
      technique and access rationale. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What could one medium express with less effort or greater clarity, and which foundational
      technique made that difference possible?


      Examples: Supportive: A pause carried uncertainty in the spoken version while a concrete detail
      did it on the page, leading to a deliberate audience-fit choice.


      Mixed: Both forms were attempted but the second lacked an accessible delivery method, so the final
      form was changed.


      Contradictory: A painful technique was forced or expensive equipment was treated as proof of expressive
      quality.


      Inconclusive: A medium was selected without practicing a technique, producing two forms or explaining
      their constraints.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
