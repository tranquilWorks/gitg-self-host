    kind: concept
    title: Learn and try
    body: 'Make an invitation in which influences help solve the same communication problem. Allow twenty
      minutes to map influences, thirty to make and fifteen to review. The work is eight lines long and
      fictional. Its aim is an inviting tone with clear time, place and access, not proof of legal originality
      or a reason to imitate a recognizable artist.


      ### Translate influences into functions


      The three supplied influences are the rhythm of an ordinary knock, the structure of a clear event
      notice and the image of a light left on for someone arriving late. They can contribute pacing, practical
      clarity and welcome. Listing them beside one another is not yet synthesis. They begin to interact
      when a rhythm must accommodate a necessary fact, or an image changes how a late arrival is addressed.


      You may tap an ordinary comfortable rhythm, mark it silently or use the supplied pattern of two
      short beats followed by a pause. Record whether a pattern is actually your observation or a supplied
      prompt. Do not claim you heard a real knock when you only read its description. No external music,
      poem, image or artist''s wording is needed for this exercise.


      The Creative Commons [considerations for licensors and licensees, S17](https://creativecommons.org/share-your-work/licensing-considerations/version4/)
      support checking rights, license conditions and the intended use of external material. Credit alone
      does not give permission, and one license does not settle every third-party right. This exercise
      uses original teaching prompts and newly authored text; the source was not used to clear a particular
      artwork or provide a legal originality determination.


      If you choose external influences in an actual attempt, identify what you are taking: a general
      structural idea, an observed pattern or protected expression. Check permission and conditions for
      the particular reuse before including it. Cultural or restricted material may also require appropriate
      community context. A long list of sources does not turn copied wording into an original work.


      ### Supplied invitation brief I8


      The fictional neighborhood reading evening takes place **Friday, 7–8 p.m., in Juniper Room at Cedar
      Hall**. The **east entrance has a step-free route** to the room. People may bring a page or attend
      just to listen, arrive during the stated hour, and leave early. These are invented event facts for
      the exercise, not a real venue''s accessibility information or an invitation to a live event. The
      case assumes the route stated on the card; no actual site has been inspected.


      The eight-line limit is part of the making problem. Put essential facts inside the invitation, rather
      than hiding them in an explanation readers would not receive. A warm metaphor cannot substitute
      for a time or an entrance. Welcome also needs freedom to decline: participation, sharing a page
      and staying the full hour are optional in this fictional brief.


      | Influence | Function | Decision it should affect |

      | --- | --- | --- |

      | Two short beats and a pause | A compact opening followed by room to continue | Vary line length
      without losing necessary information |

      | Clear event notice | Orient the reader to purpose, time, place and access | Reserve enough space
      for accurate facts and an unambiguous entrance |

      | Light for a late arrival | Make welcome concrete | Address late arrival without pressure or an
      implied obligation to attend |


      The supplied author has not observed an actual knock. The pattern, notice function, light image
      and event card are teaching inputs. The wording and arrangement below are new work made for this
      case. Keep those categories visible in the influence note; honest debts are compatible with synthesis.


      ### Make a complete eight-line draft


      Fictional draft:


      > Two quick knocks.\

      > Then room to breathe.\

      > Friday, 7–8 p.m., a neighborhood reading evening.\

      > Juniper Room, Cedar Hall.\

      > Use the east entrance for the step-free route to our room.\

      > Bring a page, or come to listen.\

      > We leave a light for anyone arriving during the hour.\

      > Come if you wish; leaving early is welcome.


      The first two lines imitate the supplied rhythm literally, then the longer notice line introduces
      practical information. The fifth line is longer than the opening pattern would suggest. That is
      deliberate: the entrance and route are essential to access. Do not remove “east” or “to our room”
      just to make the rhythm tidy. The seventh line ties the image to arrival within the stated hour
      instead of implying an unlimited opening time.


      This draft has a weakness. “Two quick knocks” could be read as an entry instruction rather than
      a pacing cue. It also reproduces the prompt''s surface image instead of transforming its function.
      A reader should not need the author''s commentary to know whether knocking is required. The weak
      line is worth revising even though all three influences are present.


      ### Resolve the conflict through the actual problem


      The useful question is what the opening should do for a person deciding whether to attend. It can
      suggest a small amount of reading and room to pause, while the notice supplies logistics and the
      light suggests welcome. The rhythm can survive without mentioning a knock. That turns a borrowed-looking
      surface feature into a functional choice.


      The revised eight-line invitation is:


      > A page.\

      > A pause.\

      > Friday, 7–8 p.m., a neighborhood reading evening.\

      > Juniper Room, Cedar Hall.\

      > Use the east entrance for the step-free route to our room.\

      > Bring a page, or come to listen.\

      > We leave a light for anyone arriving during the hour.\

      > Come if you wish; leaving early is welcome.


      The two short opening lines preserve the two-beat pattern, but now point to the event''s activity
      and unhurried tone. The necessary longer access line still interrupts the rhythm. This is an integration
      decision: the notice''s clarity constrains the rhythm, and the welcome image stays within the notice''s
      time boundary. The influences affect one another rather than appearing as three decorations.


      A remaining weakness is that “a page” appears again in line six. Repetition may create cohesion
      or feel redundant. Do not automatically remove it: line six performs the practical task of making
      contribution optional. A later revision could change the opening while keeping the participation
      choice explicit. The sample is finished within its brief without claiming every phrase is optimal.


      ### Write an honest influence note


      The supplied note reads: “This fictional invitation uses three original teaching prompts: a two-beat
      rhythm, an event-notice structure and a welcoming light image. The event facts are supplied fiction.
      I transformed the rhythm into two short opening lines, kept the access instruction despite its length,
      and limited the light image to the event''s stated hour. No external artwork or wording was copied,
      and no actual knock or venue visit is claimed.”


      In an actual attempt, revise that note to match what you really used. Name an observed rhythm only
      if you observed or made it, and identify external sources and required permissions when they exist.
      Do not use the sample note as a blanket declaration of ownership or clearance for different material.
      The finished work can acknowledge its influences without claiming that influence itself is a defect.


      ### Produce the synthesis-and-review record


      1. Map each influence to its function and state the actual invitation problem. Distinguish supplied
      prompts, your observations and any borrowed expression.

      2. Make an eight-line draft containing purpose, time, place, access and voluntary participation.
      Keep the event facts visibly fictional in the surrounding record.

      3. Identify a conflict between influences and preserve the practical information when resolving
      it. Save the draft before revising.

      4. Ask a willing reader about coherence and confusing or derivative elements, or return after a
      break. The [later packet](?resource=file-later-packet-md) supplies an incomplete reception case,
      not actual feedback on your work.

      5. Transform one weakly integrated element and write the influence note. Explain what function changed
      and what remains uncertain about reception or permission.


      For support, reserve lines three through six for essential facts before shaping the opening and
      ending. For a harder pass, change the fictional access instruction and rework the rhythm without
      dropping information. An accessible spoken or graphic arrangement can serve the same three functions
      with a clearly defined equivalent constraint. Sharing is optional, and no real invitation is sent
      by this exercise.


      Progress would combine the made artifact, a traceable revision and evidence of reception at its
      proper scale. Three named influences alone do not establish synthesis. The stronger evidence is
      a visible decision that changes an influence so it serves the same purpose as the others.


      ### Use the result at its proper scale


      Creative cultivation is optional; access adaptations do not lower human worth. Fiction and no attempt
      are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. You combine three copied passages and add their authors in a note. Does the number of sources
      or the credit establish permission and originality?

      2. An entrance direction makes one line longer than your rhythm permits. What should guide the revision?

      3. A reader mistakes a decorative knock image for an entry requirement. How could synthesis improve
      the line?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Check rights and conditions for the actual reuse, distinguish ideas from copied expression
      and explain the transformation. Attribution does not itself grant permission or establish legal
      originality.

      2. Preserve accurate access information and alter the rhythm or surrounding lines to serve the invitation
      problem. Removing a necessary direction for a neat pattern would defeat practical clarity.

      3. Keep the rhythm as pacing while replacing the literal knock wording with something that serves
      the event, then check reception. This transforms a function instead of simply adding another decoration
      or dismissing the reader.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
