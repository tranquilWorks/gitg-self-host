      - [Framework for responsible research and innovation](https://www.ukri.org/who-we-are/epsrc/our-policies-and-standards/framework-for-responsible-innovation/)

      - [International Trade: Commerce among Nations](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/trade)

