meaning_and_fit:
  purpose: Create an original small work by integrating observed details, a useful structure and a chosen
    constraint while honestly identifying its influences.
  why_recommended: Create an original small work by integrating observed details, a useful structure and
    a chosen constraint while honestly identifying its influences.
  claims:
  - statement: Create an original small work by integrating observed details, a useful structure and a
      chosen constraint while honestly identifying its influences.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Originality through synthesis practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Originality through synthesis as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible spoken invitation, simple graphic arrangement or another
    safe form with the same three functions. For external works, verify permission and license conditions
    before reuse, and remember that credit does not itself grant permission. Cultural or restricted material
    needs the appropriate community and rights-holder context.
  opportunity_considerations: 'Make a short fictional invitation to a neighborhood reading evening. Use
    three supplied influences: the rhythm of an ordinary knock you can tap safely, the structure of a
    clear event notice and the image of a light left on for someone arriving late. Limit the result to
    eight lines. These prompts are original teaching material; no external artwork needs to be copied.'
  prerequisites:
  - 'Make a short fictional invitation to a neighborhood reading evening. Use three supplied influences:
    the rhythm of an ordinary knock you can tap safely, the structure of a clear event notice and the
    image of a light left on for someone arriving late. Limit the result to eight lines. These prompts
    are original teaching material; no external artwork needs to be copied.'
  dependencies: []
  safe_alternatives:
  - Use an accessible spoken invitation, simple graphic arrangement or another safe form with the same
    three functions. For external works, verify permission and license conditions before reuse, and remember
    that credit does not itself grant permission. Cultural or restricted material needs the appropriate
    community and rights-holder context.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Originality through synthesis differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Originality through synthesis
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Make a short fictional invitation to a neighborhood reading evening. Use three supplied influences:
    the rhythm of an ordinary knock you can tap safely, the structure of a clear event notice and the
    image of a light left on for someone arriving late. Limit the result to eight lines. These prompts
    are original teaching material; no external artwork needs to be copied. Goal: Create an original small
    work by integrating observed details, a useful structure and a chosen constraint while honestly identifying
    its influences. Scope: The exercise tests synthesis, not a legal originality determination or permission
    to copy protected expression. Influences must be available for the intended use and credited appropriately.
    Time and effort: Twenty minutes to map influences, thirty minutes to make and fifteen minutes to review.
    Adaptation: Use an accessible spoken invitation, simple graphic arrangement or another safe form with
    the same three functions. For external works, verify permission and license conditions before reuse,
    and remember that credit does not itself grant permission. Cultural or restricted material needs the
    appropriate community and rights-holder context. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible spoken invitation, simple graphic arrangement or another safe
    form with the same three functions. For external works, verify permission and license conditions before
    reuse, and remember that credit does not itself grant permission. Cultural or restricted material
    needs the appropriate community and rights-holder context.
  expected_burden: Twenty minutes to map influences, thirty minutes to make and fifteen minutes to review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Originality through synthesis protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Originality through synthesis action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    spoken invitation, simple graphic arrangement or another safe form with the same three functions.
    For external works, verify permission and license conditions before reuse, and remember that credit
    does not itself grant permission. Cultural or restricted material needs the appropriate community
    and rights-holder context.
  actions:
  - stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01-A1
    sequence: 1
    title: Extract a function from each influence
    instructions: 'Describe what each influence contributes: rhythm can shape pacing, the notice structure
      can preserve practical clarity and the light image can convey welcome. Write the actual problem
      the work must solve: invite without pressure and make time, place and access clear. Identify which
      parts are your observations and which are supplied prompts or borrowed ideas. Do not begin by imitating
      a recognizable creator’s surface manner or copying their wording.


      Observation checks: Each influence is translated into a function; The work has a concrete communicative
      problem; Observed supplied and borrowed material are identified; No external wording or surface
      style is copied as a substitute for synthesis. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01
      action_stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01-A1
      competency_stable_id: '25.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2505_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2505_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_influence_is_translated_into_a_function
        - the_work_has_a_concrete_communicative_problem
        - observed_supplied_and_borrowed_material_are_identified
        - no_external_wording_or_surface_style_is_copied_as_a_substitute_for_synthesis
      - measurement_id: c2505_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2505_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01-A2
    sequence: 2
    title: Make a draft in which the influences interact
    instructions: 'Write the eight-line invitation using the rhythm to vary line length, the notice structure
      to place essential facts and the light image to shape the tone. Include fictional event details
      and mark them as fictional. Change one feature when influences conflict, such as preserving an access
      instruction even when it disrupts the rhythm. Keep a brief note of the decision so the work shows
      integration under constraints rather than three unrelated decorations.


      Observation checks: An eight-line draft combines all three functions; Essential practical details
      remain clear and fictional; A conflict between influences is resolved deliberately; The influences
      alter the structure rather than merely decorate it. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01
      action_stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01-A2
      competency_stable_id: '25.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2505_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2505_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_eight_line_draft_combines_all_three_functions
        - essential_practical_details_remain_clear_and_fictional
        - a_conflict_between_influences_is_resolved_deliberately
        - the_influences_alter_the_structure_rather_than_merely_decorate_it
      - measurement_id: c2505_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2505_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01-A3
    sequence: 3
    title: Explain the synthesis and revise a borrowed-looking element
    instructions: 'Ask a willing reader what feels coherent, confusing or too derivative, or review after
      a break. Identify one element that is mostly imitation and transform it by returning to the actual
      invitation problem. Add a short influence note stating what was supplied, observed or otherwise
      borrowed and any required attribution. Explain what the finished work does differently; do not claim
      originality merely because many sources were mixed.


      Observation checks: A reader or delayed review examines coherence and derivation; One weakly integrated
      element is revised; Influences and any required permissions are acknowledged; The explanation identifies
      a transformed function rather than a number of sources. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which influence changed because it had to serve the same problem as the others, and
      what debt should remain visible in the finished work?


      Examples: Supportive: The light image shaped the invitation’s tone while the event facts controlled
      its structure, and the influence note honestly named the supplied prompts.


      Mixed: All influences appeared, but one remained decorative and was revised to solve an actual clarity
      problem.


      Contradictory: Uncredited copied expression was called original because it was mixed with other
      material.


      Inconclusive: Influences were collected without an integrated work, a resolved constraint or an
      honest account of debts.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01
      action_stable_id: PRACTICE-COMP-2505-ORIGINALITY-THROUGH-SYNTHESIS-01-A3
