  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### A response arrives after the initial silence


      The supplied reader later says the stitched moon stayed with them, but they read “the room seemed
      warmer” as a change in actual room temperature. They understood the object was found and noticed
      Noor touching it. The finding and recognizable detail were received; the intended emotional relief
      remains uncertain.


      The maker chooses to leave Version 2 finished for this small release and carry the lesson into the
      next work: use a concrete action when an emotional atmosphere might sound like a physical event.
      This is a deliberate closure, not a claim that the reader was wrong. Versions 0, 1 and 2 stay saved.


      An optional Version 3 would replace sentence five with “Noor pressed the stitched moon once before
      closing her hand.” It has not been sent and has not received a response. The original permission
      covered one private piece, not all future revisions. If it were shared later, record a new version
      and a welcome exchange separately.


      The initial nonresponse remains in the timeline rather than being overwritten by the later reply.
      All delivery and reception here are supplied fiction; no actual reader, message or publication occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Bring one small work to a defined finish, share it appropriately and let actual reception inform
      closure. Allow twenty minutes to define and revise, one short release and fifteen minutes for feedback
      review. A private willing reader is a sufficient audience; public acclaim and commercial publication
      are not required.


      ### Define done before adding another polish pass


      Finishing is a decision against a purpose and a usable set of criteria. It is not a promise that
      no better sentence exists. The supplied criteria are a coherent beginning and ending, one deliberate
      expressive choice, corrected distracting errors and a format the intended audience can access. If
      a criterion remains unmet after two editing passes, repair that specific issue; otherwise stop revising
      long enough to let someone encounter the work.


      The UNC Writing Center''s [revision guidance, S02](https://writingcenter.unc.edu/tips-and-tools/revising-drafts/)
      distinguishes reconsidering meaning from final proofreading. This companion uses that distinction
      in a small creative case. It does not reproduce the handout or claim that exactly two passes are
      sufficient for every project. A novel, public exhibition or professional production would have its
      own scope and standards.


      A work can be finished for one purpose and reopened for another. Keep versions so a later change
      does not erase what the audience actually received. An unsent draft, a sent piece and a reader''s
      response are different events. Self-review can prepare a release but cannot establish that another
      person encountered the work.


      ### Supplied piece F9, Version 0


      The fictional maker wants to convey quiet relief when a lost mitten is found. The piece contains
      six original sentences:


      > The mitten was gone from the bench.\

      > Noor checked under it and behind the door.\

      > A cleaner held up a red mitten with a white moon stitched on the palm.\

      > She said it had been there all morning.\

      > Noor tucked it into her pocket and the room seem warmer.\

      > The bus arrived outside.


      The opening establishes absence and the last sentence gives a departure point. However, “under it”
      is less clear than naming the bench, “there” leaves the mitten''s earlier location uncertain, and
      “seem” is a distracting tense error. The intended relief depends on recognizing the object, but
      the relationship between recognition and the final warmth is thin. These are repairable features,
      not a reason to call the work worthless.


      ### Pass one: meaning and sequence


      Save Version 0. The meaning pass names the search location, clarifies where the mitten was found
      and gives Noor an action that connects it to recognition. Do not spend this pass changing typefaces
      or choosing a title. Version 1 reads:


      > The mitten was gone from the bench.\

      > Noor checked beneath the bench and behind the door.\

      > A cleaner held up a red mitten with a white moon stitched on the palm.\

      > It had been caught behind the bench leg.\

      > Noor traced the little moon and the room seem warmer.\

      > She slipped the mitten into her pocket as the bus arrived.


      The location and order are now clearer, and tracing the stitched moon is the deliberate expressive
      choice. It connects a small object with relief without requiring a speech about its value. The tense
      error remains visible because proofreading has not yet occurred. Preserving this intermediate state
      demonstrates the different purposes of the two passes.


      ### Pass two: presentation and access


      Correct “seem” to “seemed.” The fictional intended reader prefers plain text with each sentence
      on its own line and no decorative background. The maker supplies that format with the title **The
      Little Moon**. No borrowed text, image or real private story is present in this original supplied
      specimen.


      Finished Version 2:


      > The mitten was gone from the bench.\

      > Noor checked beneath the bench and behind the door.\

      > A cleaner held up a red mitten with a white moon stitched on the palm.\

      > It had been caught behind the bench leg.\

      > Noor traced the little moon and the room seemed warmer.\

      > She slipped the mitten into her pocket as the bus arrived.


      Check the four criteria separately. The search and departure provide a beginning and ending. The
      stitched moon and tracing action are intentional. The known distracting error is corrected. The
      format matches the fictional reader''s stated preference. This is a bounded completion decision,
      not proof of literary merit or universal accessibility. Another reader could need a different format.


      ### Prepare an actual release without assuming consent


      The supplied invitation asks: “Would you be willing to receive a six-sentence fictional scene in
      plain text and tell me which moment stayed with you?” The fictional reader agrees to receive this
      one piece privately. That agreement does not authorize public posting, quoting their response by
      name or sending endless revisions. Title, brief fictional context and one feedback question accompany
      Version 2.


      In the supplied simulation, Version 2 is delivered through the agreed private channel. No real message
      is sent by this exercise. If you undertake an actual release, record the actual date, version and
      confirmation of willingness using only information needed for your private process. Avoid storing
      contact details or the reader''s personal history in the practice record. If consent or a usable
      format is absent, keep the work prepared and release pending.


      At the first fictional check, the reader has not replied. Delivery is established in the case; impact
      is not. Silence could reflect timing, availability or preference and does not establish rejection.
      Do not repeatedly prompt for reassurance or invent a favorable response to make the exercise complete.
      The [later packet](?resource=file-later-packet-md) supplies a later mixed response and a closure
      decision for analysis.


      ### Use reception to choose closure or one justified change


      Compare the intended quiet relief with the actual response if one arrives. A reader may notice the
      stitched moon but interpret the warmth literally. That is information about the text in a context,
      not a universal failure. You can leave the piece finished, make one versioned revision if a criterion
      or purpose warrants it, or carry the lesson into a different work.


      If a revision is made, do not assume the original reader wants it. Ask only when further sharing
      is appropriate and welcome; a private revision can stay private. A muted response does not undo
      responsible release, while a strong response does not authorize wider distribution of the work or
      of the reader''s words.


      ### Produce the finish-and-release record


      1. Choose a small original piece or make the default six-sentence lost-object scene. State its purpose
      and all four completion criteria.

      2. Save the earlier version, edit meaning first and presentation second, and name one specific change
      from each pass. Keep unresolved criteria explicit.

      3. Confirm a willing audience and accessible format. Supply a title, needed context and accurate
      attribution; then distinguish prepared from actually shared.

      4. Record the response or nonresponse without making up an effect. Compare what happened with what
      you intended.

      5. Close, reopen once for a reason, or carry the lesson into new work. Label any new version and
      respect the scope of the audience''s consent.


      For support, use the four criteria as four short notes and one reader rather than a public platform.
      For a harder pass, compare whether a single concrete gesture can replace an explanatory sentence
      without losing clarity. An audio piece may need a transcript; a sketch may need an accessible description.
      Self-only review remains a valid preparation route, with reaching an audience still unestablished.


      Actual progress here needs more than a polished file: a meaningful creation reaches an appropriate
      audience and reception or its absence is honestly reviewed. This supplied sequence teaches that
      distinction but is not evidence that you released work or received feedback.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A draft meets your four completion criteria, but you have not asked anyone to receive it. Is
      publication established?

      2. You fix spelling but leave the order of events confusing. Have both required edits been completed?

      3. A willing reader has not responded, and you imagine they liked the ending. What can the record
      say?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. It may be finished and prepared. Reaching an appropriate audience requires actual sharing
