  - stable_id: PRACTICE-COMP-2507-REVISION-FINISHING-AND-PUBLICATION-01-A2
    sequence: 2
    title: Present the work with consent and accurate attribution
    instructions: 'Ask the intended person whether they are willing to receive a brief piece and through
      which format. Share the finished version with a title, any necessary context and honest attribution
      for borrowed material. State one feedback question, such as what moment remained with them or where
      the meaning became unclear. Do not post publicly, disclose private stories or reuse protected material
      without appropriate permission merely to satisfy release.


      Observation checks: A real willing audience and accessible format are confirmed; The finished version
      is actually shared; Attribution and privacy are checked before release; One focused feedback question
      accompanies the work. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2507-REVISION-FINISHING-AND-PUBLICATION-01
