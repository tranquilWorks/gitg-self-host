meaning_and_fit:
  purpose: Define done, revise for purpose, present accessibly and obtain actual audience response instead
    of indefinitely preparing or treating release as the end of learning.
  why_recommended: Define done, revise for purpose, present accessibly and obtain actual audience response
    instead of indefinitely preparing or treating release as the end of learning.
  claims:
  - statement: Define done, revise for purpose, present accessibly and obtain actual audience response
      instead of indefinitely preparing or treating release as the end of learning.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Revision, finishing, and publication practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Revision, finishing, and publication as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a private accessible exchange, read aloud, provide a transcript or choose
    a small trusted audience. A self-only review can prepare the piece but does not count as reaching
    another person. Defer release when safety, privacy or permission cannot be protected.
  opportunity_considerations: Use a short original paragraph, poem, sketch description or audio piece
    already made, or create a six-sentence scene about finding a lost object. Choose one willing reader
    or listener. Define done as a coherent beginning and ending, one deliberate expressive choice, corrected
    distracting errors and a format the audience can access. No public platform is required.
  prerequisites:
  - Use a short original paragraph, poem, sketch description or audio piece already made, or create a
    six-sentence scene about finding a lost object. Choose one willing reader or listener. Define done
    as a coherent beginning and ending, one deliberate expressive choice, corrected distracting errors
    and a format the audience can access. No public platform is required.
  dependencies: []
  safe_alternatives:
  - Use a private accessible exchange, read aloud, provide a transcript or choose a small trusted audience.
    A self-only review can prepare the piece but does not count as reaching another person. Defer release
    when safety, privacy or permission cannot be protected.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Revision, finishing, and publication differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Revision, finishing, and publication
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a short original paragraph, poem, sketch description or audio piece already made, or create
    a six-sentence scene about finding a lost object. Choose one willing reader or listener. Define done
    as a coherent beginning and ending, one deliberate expressive choice, corrected distracting errors
    and a format the audience can access. No public platform is required. Goal: Define done, revise for
    purpose, present accessibly and obtain actual audience response instead of indefinitely preparing
    or treating release as the end of learning. Scope: One small release samples completion and reception,
    not public acclaim, commercial publication or broad artistic success. An invited private audience
    is sufficient. Time and effort: Twenty minutes to define and revise, one short release and a fifteen-minute
    feedback review. Adaptation: Use a private accessible exchange, read aloud, provide a transcript or
    choose a small trusted audience. A self-only review can prepare the piece but does not count as reaching
    another person. Defer release when safety, privacy or permission cannot be protected. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a private accessible exchange, read aloud, provide a transcript or choose a
    small trusted audience. A self-only review can prepare the piece but does not count as reaching another
    person. Defer release when safety, privacy or permission cannot be protected.
  expected_burden: Twenty minutes to define and revise, one short release and a fifteen-minute feedback
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Revision, finishing, and publication protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Revision, finishing, and publication action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a private
    accessible exchange, read aloud, provide a transcript or choose a small trusted audience. A self-only
    review can prepare the piece but does not count as reaching another person. Defer release when safety,
    privacy or permission cannot be protected.
  actions:
  - stable_id: PRACTICE-COMP-2507-REVISION-FINISHING-AND-PUBLICATION-01-A1
    sequence: 1
    title: Set completion criteria and perform two different edits
    instructions: 'Write the piece’s purpose and the four supplied completion criteria. First edit for
      meaning: remove a confusing turn or add a necessary detail. Then edit for presentation: correct
      distracting errors and check readability, audio clarity or accessible description. Stop after these
      two passes unless a criterion is still unmet; perfection is not the standard. Preserve an earlier
      version so the revision can be explained.


      Observation checks: Purpose and four completion criteria are explicit; Meaning and presentation
      receive separate editing passes; A previous version is preserved for comparison; Completion is based
      on criteria rather than endless polish. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2507-REVISION-FINISHING-AND-PUBLICATION-01
      action_stable_id: PRACTICE-COMP-2507-REVISION-FINISHING-AND-PUBLICATION-01-A1
      competency_stable_id: '25.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
