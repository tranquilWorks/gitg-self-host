  - stable_id: PRACTICE-COMP-2507-REVISION-FINISHING-AND-PUBLICATION-01-A3
    sequence: 3
    title: Use reception to close or deliberately reopen the piece
    instructions: 'Record the audience’s actual response or lack of response without inventing impact.
      Compare the response with the intended effect and identify one supported insight. Choose leave finished,
      make one justified revision or carry the lesson into a new work. If you revise, label the version
      and share again only if welcome. A quiet or mixed response does not undo the fact of a responsible
      release.


      Observation checks: Actual audience response or nonresponse remains honest; Intention and reception
      are compared; Closure or revision has a specific reason; Further sharing respects the audience’s
      willingness. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What did an actual audience reveal that editing alone did not, and is the work finished
      or being reopened for a concrete reason?


      Examples: Supportive: The piece met its defined criteria, reached a willing reader and a specific
      response informed the next work rather than another endless edit.


      Mixed: The release occurred but the intended effect was only partly received, leading to one bounded
      revision.


      Contradictory: Private material was posted without consent or imagined audience praise was recorded
      as feedback.


      Inconclusive: The work was repeatedly polished but never shared with an appropriate audience or
      reviewed against a definition of done.'
    expected_time: 15-25 minutes
    due_within_days: 10
