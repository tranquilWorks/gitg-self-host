        - a_concrete_memory_object_and_access_detail_are_included
        - the_conflict_is_summarized_plainly_before_artistic_treatment
      - measurement_id: c2509_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
