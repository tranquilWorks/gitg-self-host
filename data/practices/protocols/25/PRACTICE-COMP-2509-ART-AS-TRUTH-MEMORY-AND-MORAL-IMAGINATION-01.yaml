    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A reader finds the repair advocate cold. The writer replies that the character was intended to
      be kind. What would make the next step inspectable?

      2. A convincing fictional scene describes a displaced gathering. May it be reported as evidence
      of what the actual neighborhood experienced?

      3. The two characters agree to carry the sign. Does the ending resolve the access issue or demonstrate
      moral growth?'
    check_id: practice-answers
