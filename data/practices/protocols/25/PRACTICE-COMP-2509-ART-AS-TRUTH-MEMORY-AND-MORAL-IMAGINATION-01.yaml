  - stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01-A2
    sequence: 2
    title: Write the scene through action rather than a final sermon
    instructions: 'Show the two people encountering the object while a repair notice is posted. Give each
      one action and one line of dialogue that reveals their concern without announcing the correct moral.
      Let the ending contain a choice, unresolved tension or small hope consistent with the facts. Avoid
      using suffering as spectacle or assigning a real cultural identity you have not responsibly researched
      simply to add emotional weight.


      Observation checks: Both perspectives appear through action and dialogue; The object and access
      detail carry part of the meaning; The ending permits a truthful unresolved tension or bounded hope;
      No real group or trauma is used as decorative suffering. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01
      action_stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01-A2
      competency_stable_id: '25.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
