meaning_and_fit:
  purpose: Explore ambiguity, memory, identity, suffering and hope through artistic choices that reveal
    more than a straightforward statement of the lesson.
  why_recommended: Explore ambiguity, memory, identity, suffering and hope through artistic choices that
    reveal more than a straightforward statement of the lesson.
  claims:
  - statement: Explore ambiguity, memory, identity, suffering and hope through artistic choices that reveal
      more than a straightforward statement of the lesson.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Art as truth, memory, and moral imagination practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Art as truth, memory, and moral imagination as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a dialogue, audio description, collage of original words or another safe
    accessible form. Keep the case fictional when real experience is painful or private. Art is not a
    substitute for professional support, historical research or the right of people to tell their own
    stories.
  opportunity_considerations: Use a fictional community room being closed for repairs. One person values
    the place because it holds memories; another wants the repair because unsafe access excludes people.
    Write a short scene of no more than 300 words or an accessible equivalent. No actual tragedy, private
    history or harmful confrontation is needed.
  prerequisites:
  - Use a fictional community room being closed for repairs. One person values the place because it holds
    memories; another wants the repair because unsafe access excludes people. Write a short scene of no
    more than 300 words or an accessible equivalent. No actual tragedy, private history or harmful confrontation
    is needed.
  dependencies: []
  safe_alternatives:
  - Use a dialogue, audio description, collage of original words or another safe accessible form. Keep
    the case fictional when real experience is painful or private. Art is not a substitute for professional
    support, historical research or the right of people to tell their own stories.
  role_conditions:
  - This competency is elective cultivation; roles, duties, and authority must be explicitly chosen or
    actually held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Art as truth, memory, and moral imagination differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Art as truth, memory, and
    moral imagination as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional community room being closed for repairs. One person values the place because
    it holds memories; another wants the repair because unsafe access excludes people. Write a short scene
    of no more than 300 words or an accessible equivalent. No actual tragedy, private history or harmful
    confrontation is needed. Goal: Explore ambiguity, memory, identity, suffering and hope through artistic
    choices that reveal more than a straightforward statement of the lesson. Scope: A fictional scene
    practices moral imagination, not testimony, therapy or representation of a community’s lived experience.
    Personal trauma or disclosure is not required. Time and effort: Twenty minutes to prepare two perspectives,
    thirty minutes to make and a fifteen-minute reception review. Adaptation: Use a dialogue, audio description,
    collage of original words or another safe accessible form. Keep the case fictional when real experience
    is painful or private. Art is not a substitute for professional support, historical research or the
    right of people to tell their own stories. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a dialogue, audio description, collage of original words or another safe accessible
    form. Keep the case fictional when real experience is painful or private. Art is not a substitute
    for professional support, historical research or the right of people to tell their own stories.
  expected_burden: Twenty minutes to prepare two perspectives, thirty minutes to make and a fifteen-minute
    reception review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Art as truth, memory, and moral imagination protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Art as truth, memory, and moral imagination action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a dialogue,
    audio description, collage of original words or another safe accessible form. Keep the case fictional
    when real experience is painful or private. Art is not a substitute for professional support, historical
    research or the right of people to tell their own stories.
  actions:
  - stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01-A1
    sequence: 1
    title: Give both people a genuine good and an uncertainty
    instructions: 'For each fictional person, state what they are protecting, what they fear losing and
      what they do not know about the other. Add one ordinary object that carries memory, such as a worn
      sign, and one practical access detail. Do not make one person a villain merely to make the message
      easy. Write a direct summary of the conflict first so you can later compare what the artistic form
      adds.


      Observation checks: Both perspectives protect a legitimate good; Each person has an uncertainty
      rather than complete moral knowledge; A concrete memory object and access detail are included; The
      conflict is summarized plainly before artistic treatment. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01
      action_stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01-A1
      competency_stable_id: '25.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
