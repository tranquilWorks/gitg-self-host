  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Keep the response and identify the action or wording that produced it. Try a visible change
      while preserving the legitimate access concern, retain both versions, and distinguish the writer’s
      prediction from a new reader response.

      2. No. It may explore possibilities, but it is invented. Historical or community claims require
      their own evidence and appropriate voices; plausibility and emotional force do not turn a scene
      into testimony.

      3. No. It supplies a limited shared action while the meeting place and repairs remain unresolved.
      The work can carry that ambiguity without awarding moral improvement to a writer, reader or character.'
