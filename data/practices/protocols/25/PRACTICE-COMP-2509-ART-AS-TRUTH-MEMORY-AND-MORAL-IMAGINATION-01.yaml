  - stable_id: PRACTICE-COMP-2509-ART-AS-TRUTH-MEMORY-AND-MORAL-IMAGINATION-01-A3
    sequence: 3
    title: Compare what the work carries with the plain explanation
    instructions: 'Share with a willing reader and ask what each person might be protecting, what remains
      ambiguous and which detail mattered. Compare that response with the initial direct summary. Identify
      something the scene communicated differently, such as the coexistence of memory and exclusion, and
      one risk of misreading. Revise a caricature or unintended implication while preserving complexity;
      the work need not force agreement or a single moral conclusion.


      Observation checks: A reader or delayed self-review examines both perspectives; The scene is compared
      with the original direct summary; A distinct artistic contribution and a possible misreading are
      identified; Revision removes caricature without erasing legitimate ambiguity. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What could the scene let a reader feel or notice that the summary could not fully
      carry, and where did imagination risk misrepresenting someone?


      Examples: Supportive: The reader understood both attachment to the room and the exclusion caused
      by its access, and the worn sign carried their tension without a moral speech.


      Mixed: The scene conveyed loss but flattened the access concern, so the second person gained a more
      concrete action.


      Contradictory: A real person’s trauma was exposed or a cultural stereotype was used to make the
      story emotionally persuasive.


      Inconclusive: The piece merely restated a lesson and gave no concrete action, ambiguity or comparison
      with a direct explanation.'
    expected_time: 15-25 minutes
    due_within_days: 10
