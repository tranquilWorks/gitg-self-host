  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Reception and a small change


      The supplied fictional reader says Amir''s attachment is clear, but reads Tess''s looking away as
      rejection of his memory. The reader also notices the tested paint on the back and understands why
      the sign matters. This is one invented reception account, not an actual learner or community response.


      Version 2 preserves the entire scene except this complete replacement paragraph:


      > Tess steadied the sign against his coat before its lower edge slipped. “Neither do I.”


      Replace only “Tess looked away toward the street. ‘Neither do I.’” with the paragraph above. It
      gives Tess a concrete act of care without making her responsible for comforting Amir or yielding
      on the entrance. All other paragraphs, including the uncertain library room and the sign not yet
      facing outward, remain unchanged; the revised scene also stays below 300 words.


      The writer believes the change better holds both concerns. There is no second reader response. Do
      not mark the revision as successfully received or claim that Tess now represents everyone with an
      access need. The next practical question remains whether a suitable meeting room exists; no permission,
      booking or access inspection has occurred.


      Compare the versions and the plain explanation. The repair gives care a physical action, while the
      worn sign and hidden paint trials carry memory through an object. The scene leaves room for an unsettled
      response. That is a reasoned account of the work, not a validated empathy outcome.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Write a scene in which two legitimate concerns remain present. Allow twenty minutes to prepare
      two perspectives, thirty minutes to make a scene of no more than 300 words, and fifteen minutes
      for reception or delayed self-review. The task is to let a reader encounter a tension through a
      work, not to prove that fiction has made anyone more empathetic.


      ### Give each perspective something to protect


      An explanation can state that a community room needs repairs and that its closure disrupts belonging.
      A scene can make the same tension felt through objects, timing, speech and incomplete action. Neither
      form replaces evidence about an actual building or community. In invented work you can explore how
      care for memory and care for access become difficult to reconcile without pretending to report another
      person''s life.


      The selected character discussion in OpenLearn''s [Start writing fiction, S04](https://www.open.edu/openlearn/history-the-arts/creative-writing/start-writing-fiction/content-section-3.3/?printable=1)
      supports moving beyond flat labels and imagining a character''s particular circumstances. Only the
      registered discussion passages were read; the linked book extract and course activities are not
      supplied here. Our scene, perspective cards and revision are original. Complex characterization
      is a craft aim, not evidence that the writer understands every group represented.


      Choose a low-stakes invented setting. Do not needlessly borrow private trauma, sacred stories or
      an identifiable person''s suffering. You can give characters conflicting priorities without assigning
      moral superiority to a cultural identity or disability. Let each have an action, a fear and something
      they do not know about the other. An unresolved ending is acceptable when the unresolved issue is
      made intelligible.


      ### Supplied preparation file M9


      The fictional neighborhood room will close for repairs. Its entrance threshold is difficult for
      some users, and a loose board needs attention. No qualified building finding or actual repair decision
      is being made. The work concerns two people responding to a supplied closure, not deciding whether
      the room is safe to keep using.


      **Amir''s perspective.** He helped his late neighbor paint the room''s wooden welcome sign. He values
      the record of ordinary people making a place together. He fears that relocation will disperse the
      gathering and that the worn sign will be discarded. He does not yet know whether Tess wants any
      familiar objects kept.


      **Tess''s perspective.** She uses a walking frame and has repeatedly needed help at the entrance.
      She values being able to enter without negotiating assistance. She fears that nostalgia will become
      a reason to postpone work again. She does not know the sign''s personal history, and she also wants
      the group to keep meeting.


      Neither card establishes what all longtime residents or all people using mobility aids feel. Each
      is one invented person''s situation. Before writing, identify a possible point of encounter: the
      sign is movable, while the inaccessible threshold requires material change. Saving an object cannot
      substitute for that change.


      **Plain explanation for comparison:** Amir wants to preserve the room''s memories, while Tess needs
      the entrance repaired. They have not yet found an accessible place for the gathering during the
      closure. They might preserve the sign and continue looking for a place together.


      ### Complete original scene, Version 1


      > Amir rubbed the thumb-sized hollow in the wooden welcome sign. “Nadia painted this letter twice.
      She said a welcome should survive the rain.”

      >

      > Tess waited beside the doorway with her frame. The loose board made a pale line beneath her front
      wheel. “It should survive being stepped over, too.”

      >

      > He reached for the nail holding the sign, then stopped. “If they put us somewhere else, people
      will forget the Thursdays.”

      >

      > “I remember every Thursday I had to ask someone to lift this.” Tess tapped the frame. “I want
      to arrive before the conversation starts.”

      >

      > From inside came the scrape of chairs being stacked. Amir took the sign down and held it against
      his coat.

      >

      > “I don''t know where we''ll meet,” he said.

      >

      > Tess looked away toward the street. “Neither do I.”

      >

      > He turned the sign over. On its back Nadia had tested three shades of green. He had never noticed
      that before.

      >

      > “We could ask about the library room,” Tess said. “Ask about the entrance first.”

      >

      > Amir offered her one end of the sign. She took it, and they carried it as far as the gate. Neither
      turned it outward yet.


      The sign carries public welcome, private memory and an unfinished practical question. Its unpainted
      back reveals trial colors that the explanation cannot make a reader encounter in quite the same
      way. Tess''s account connects access with participation in the conversation, rather than treating
      access as a decorative kindness. These are readings supported by choices in the text, not mandatory
      emotions for every reader.


      ### Receive a response without demanding agreement


      Ask a willing reader: “What does each person seem to protect, and where did a detail change your
      understanding?” They can decline or respond only to the work. Do not ask them to disclose matching
      experiences. If no reader is available, set the piece aside and read it later, explicitly calling
      that delayed self-review.


      Before opening the [later packet](?resource=file-later-packet-md), mark one line that may flatten
      either character. Version 1''s “looked away” may convey uncertainty, impatience or indifference.
      An author cannot settle the question merely by announcing a kind intention. A reader''s account
      identifies a possible effect; it does not authorize that reader to speak for an entire community.


      Keep the plain explanation and the scene together. Name what the scene adds, what remains ambiguous,
      and what factual work it cannot do. It does not identify a usable replacement room, assess the building,
      confirm shared consent or resolve whose needs take priority. Hope can be a concrete next question
      rather than a false happy ending.


      ### Make and review your own bounded work


      1. Use the supplied cards or invent two perspectives with a value, fear and unknown for each. Spend
      the preparation window making both intelligible.

      2. Draft no more than 300 words. Give each person an action or line that matters to the outcome.
      Keep a direct explanation beside it for comparison.

      3. Invite a freely chosen reader or use delayed self-review. Preserve the particular response and
      its source without converting it into testimony about real people.

      4. Revise one choice that obstructs the intended tension. Retain the original, the reason and any
      uncertainty after the change.

      5. Identify a limit: whose voice is still missing, what practical issue remains, or what another
      form might express differently.


      For support, retain the room, sign and two cards, changing only one action. For a harder attempt,
      write a different ending that preserves both the unresolved access question and the significance
      of the sign without explaining either in a final moral. An audio scene, image sequence with descriptions
      or another accessible form may serve the same comparison. A listener''s response is evidence only
      if someone actually listened and freely responded.


      The product can show a traceable use of artistic form to carry memory, suffering, hope and ambiguity.
      It cannot demonstrate moral improvement, historical accuracy or knowledge of a lived experience
      the writer has not investigated.


      ### Use the result at its proper scale


      Creative cultivation is optional. Fiction and no attempt are legitimate. Human dignity is never
      scored.


