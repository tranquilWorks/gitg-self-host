meaning_and_fit:
  purpose: Distinguish comparative advantage from absolute productivity and examine how logistics, labor,
    exchange rates, bargaining power and disruption change a cross-border trade judgment.
  why_recommended: Distinguish comparative advantage from absolute productivity and examine how logistics,
    labor, exchange rates, bargaining power and disruption change a cross-border trade judgment.
  claims:
  - statement: Distinguish comparative advantage from absolute productivity and examine how logistics,
      labor, exchange rates, bargaining power and disruption change a cross-border trade judgment.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Global trade, development, and supply chains practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Global trade, development, and supply chains as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use tokens and a hand-drawn chain. Real cross-border transactions can involve
    complex legal, safety, labor and tax requirements; consult current official authorities and qualified
    professionals. Do not contact restricted parties, move controlled goods or attempt to evade any rule
    as an exercise.
  opportunity_considerations: In one hour, fictional producer A can make six bread units or three cloth
    units; B can make four bread or four cloth. Assume linear production only for this example. A proposed
    exchange is one cloth for one and a half bread. Draw a separate generic cross-border chain from raw
    material to worker, producer, shipper, customs, buyer and end user; no real shipment is planned.
  prerequisites:
  - In one hour, fictional producer A can make six bread units or three cloth units; B can make four bread
    or four cloth. Assume linear production only for this example. A proposed exchange is one cloth for
    one and a half bread. Draw a separate generic cross-border chain from raw material to worker, producer,
    shipper, customs, buyer and end user; no real shipment is planned.
  dependencies: []
  safe_alternatives:
  - Use tokens and a hand-drawn chain. Real cross-border transactions can involve complex legal, safety,
    labor and tax requirements; consult current official authorities and qualified professionals. Do not
    contact restricted parties, move controlled goods or attempt to evade any rule as an exercise.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Global trade, development, and supply chains differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Global trade, development,
    and supply chains as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'In one hour, fictional producer A can make six bread units or three cloth units; B can make
    four bread or four cloth. Assume linear production only for this example. A proposed exchange is one
    cloth for one and a half bread. Draw a separate generic cross-border chain from raw material to worker,
    producer, shipper, customs, buyer and end user; no real shipment is planned. Goal: Distinguish comparative
    advantage from absolute productivity and examine how logistics, labor, exchange rates, bargaining
    power and disruption change a cross-border trade judgment. Scope: The fictional production model illustrates
    opportunity cost, not a trade forecast, sanctions determination or instruction to import or export
    goods. Time and effort: Thirty minutes for the production example and twenty minutes for a supply-chain
    stress explanation. Adaptation: Use tokens and a hand-drawn chain. Real cross-border transactions
    can involve complex legal, safety, labor and tax requirements; consult current official authorities
    and qualified professionals. Do not contact restricted parties, move controlled goods or attempt to
    evade any rule as an exercise. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use tokens and a hand-drawn chain. Real cross-border transactions can involve complex
    legal, safety, labor and tax requirements; consult current official authorities and qualified professionals.
    Do not contact restricted parties, move controlled goods or attempt to evade any rule as an exercise.
  expected_burden: Thirty minutes for the production example and twenty minutes for a supply-chain stress
    explanation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Global trade, development, and supply chains protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Global trade, development, and supply chains action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use tokens
    and a hand-drawn chain. Real cross-border transactions can involve complex legal, safety, labor and
    tax requirements; consult current official authorities and qualified professionals. Do not contact
    restricted parties, move controlled goods or attempt to evade any rule as an exercise.
  actions:
  - stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01-A1
    sequence: 1
    title: Calculate opportunity costs before claiming an advantage
    instructions: 'For A, one cloth costs two bread forgone; for B, one cloth costs one bread. Thus B
      has the lower opportunity cost in cloth, while A has the lower opportunity cost in bread. Explain
      why A’s greater bread output and B’s greater cloth output are absolute productivity facts, not the
      definition of comparative advantage. Show why one cloth for 1.5 bread lies between the two cloth
      opportunity costs under the assumptions, without claiming every participant must benefit in real
      life.


      Observation checks: Both cloth opportunity costs are calculated correctly; Comparative advantage
      is defined by opportunity cost; Absolute output and comparative advantage are distinguished; The
      proposed terms are evaluated only within the simple model. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01
      action_stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01-A1
      competency_stable_id: '24.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2414_a1_primary
      transfer_disposition: context_bound
      measurements:
