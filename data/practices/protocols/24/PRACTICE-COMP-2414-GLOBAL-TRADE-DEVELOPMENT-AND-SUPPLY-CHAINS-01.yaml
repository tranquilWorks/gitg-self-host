        - comparative_advantage_is_defined_by_opportunity_cost
        - absolute_output_and_comparative_advantage_are_distinguished
        - the_proposed_terms_are_evaluated_only_within_the_simple_model
      - measurement_id: c2414_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
