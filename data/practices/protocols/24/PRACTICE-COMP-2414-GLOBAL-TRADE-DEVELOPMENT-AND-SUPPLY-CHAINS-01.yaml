        expected: true
  - stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01-A3
    sequence: 3
    title: Stress a disruption and compare resilience options
    instructions: 'Introduce a fictional shipping delay and a single-source supplier failure. Compare
      holding a modest buffer, a second lawful source, local production or accepting a longer lead time,
      naming cost and environmental or labor tradeoffs. Choose a conditional response and the information
      needed to judge it. Explain the original comparative-advantage result alongside these limits rather
      than using the extra complexity to deny all gains from trade or using the arithmetic to dismiss
      resilience.


      Observation checks: Two disruptions are traced to actual chain consequences; At least three resilience
      options have costs and benefits; The response identifies missing evidence and lawful verification;
      The final explanation retains both trade gains and their practical limits. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which assumption makes the simple trade beneficial, and which supply-chain or distributional
      fact could change the responsible real-world choice?


      Examples: Supportive: The learner calculated the opportunity costs and then showed how a supplier
      failure could justify a costlier second source without denying the original trade advantage.


      Mixed: The arithmetic was sound, but exchange and customs costs remained unknown, preventing a real
      sourcing decision.


      Contradictory: A low foreign price was treated as legal permission or aggregate gains were used
      to dismiss worker harm and concentration risk.


      Inconclusive: Trade was praised or rejected without opportunity-cost calculations, a chain map or
      a disruption comparison.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01
