  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Demand increases while the alternative remains unverified


      During the supplied delay, weekly demand rises from ten to **15 cloth units**. The 20-unit buffer
      now covers **1⅓ weeks**, not two. Over three weeks, demand is **45**, leaving **25 units uncovered**
      if no new supply arrives. The original ten-unit gap applied only to the earlier demand assumption.


      The proposed second source provides a price but no confirmed capacity, quality evidence or lawful-transaction
      review. The original supplier still has no recovery date. Record the alternative as under investigation,
      not available stock. Tell the fictional decision record which commitments must remain provisional;
      no real buyer or supplier is contacted.


      Keep the original opportunity costs and the 1.5-bread terms result as a valid conclusion under the
      original model. The demand increase and disruption concern whether those abstract gains can be realized
      through this chain. They do not prove trade is always harmful or always sufficient.


      The worked next decision retains honest longer lead times and seeks the missing evidence before
      committing to another source. A local offer is also conditional on capacity, quality, labor, environmental
      and legal requirements. Neither location nor a quoted price supplies those answers.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Explain why a trade could help under a simple model, then test how a real chain of obligations
      could change that judgment. Allow thirty minutes for production and twenty for disruption. Your
      output is a conditional trade explanation with named risk bearers, not an import plan.


      ### Start with the forgone alternative


      Comparative advantage concerns opportunity cost: what a producer gives up to make an additional
      unit of something else. Absolute productivity concerns how much it can produce with the stated resources.
      These questions differ. The IMF''s [trade explanation, S11](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/trade)
      supports the opportunity-cost distinction and the need to consider distribution. Its historical
      trade figures are not used as current facts here.


      Fictional producer A can use one hour to make **six bread units or three cloth units**. B can make
      **four bread or four cloth**. Assume linear production, divisible units and no transport, transaction
      or adjustment costs only for this calculation. It is not a claim about actual workers, countries,
      wages or technology.


      A gives up six bread to make three cloth: **one cloth costs two bread**. B gives up four bread for
      four cloth: **one cloth costs one bread**. Thus B has the lower opportunity cost in cloth. For bread,
      A gives up half a cloth per bread, while B gives up one cloth; A has the comparative advantage in
      bread. A''s six versus four bread per hour and B''s four versus three cloth are separate absolute-productivity
      comparisons.


      The proposed exchange is **one cloth for 1.5 bread**. That cloth price lies between the producers''
      opportunity costs of one and two bread. A can obtain cloth more cheaply than making it, and B receives
      more bread than it forgoes. This conclusion depends on the model''s assumptions and terms of exchange,
      not on a slogan that every trade benefits everyone.


      ### Show the gain rather than merely naming it


      If A makes six bread and exchanges 1.5 for one cloth, A retains **4.5 bread and one cloth**. Producing
      one cloth itself would use one-third of its hour, leaving **four bread and one cloth**. The exchange
      adds half a bread relative to that comparison.


      If B makes four cloth and exchanges one for 1.5 bread, B retains **three cloth and 1.5 bread**.
      Producing 1.5 bread itself would use three-eighths of its hour, leaving **2.5 cloth and 1.5 bread**.
      The exchange adds half a cloth. Compare the same desired bundle component before declaring a gain;
      do not add bread and cloth into an unexplained total.


      These examples do not allocate gains among owners, employees or consumers. Even when total possibilities
      expand, a worker or place may lose employment, income or bargaining power, and adjustment may take
      time. Nor does the model describe development as a single income number: capabilities, infrastructure,
      institutions and distribution can affect who can use a new opportunity. Those questions require
      evidence beyond the two production ratios.


      ### Trace a separate generic cloth chain


      The chain is raw material, worker, producer, shipper, customs process, buyer and end user. It is
      generic and fictional; it does not imply that any real country, product or party is approved for
      trade. Trace the movement of goods, information, payment and risk as separate relationships.


      | Stage | What needs checking | Supplied risk allocation or unknown |

      | --- | --- | --- |

      | Raw material and worker | Inputs, working conditions, compensation, safety and resource use |
      Actual labor and environmental evidence is absent; a low input price proves neither fair nor unfair
      conditions |

      | Producer | Capacity, quality specification and payment timing | The toy buyer pays a deposit;
      producer funds work before the balance, creating cash-flow exposure |

      | Shipper and storage | Transit time, damage, energy, holding cost and responsibility | The toy
      buyer bears agreed delay and storage cost; actual carriage terms are not supplied |

      | Customs and authorities | Classification, tariffs, product rules, sanctions and export controls
      | Current jurisdiction-specific authority and qualified review are required; no clearance is assumed
      |

      | Buyer | Currency, inventory, rejection decisions and supplier leverage | A foreign-currency invoice
      assigns the modeled exchange movement to the buyer |

      | End user | Availability, suitability, access and cost passed onward | A stockout postpones delivery;
      the buyer must disclose the limit rather than promise supply |


      For a **100 foreign-unit invoice**, an exchange rate of **1.2 domestic units per foreign unit**
      costs **120 domestic units**. A move to **1.3** raises that to **130**, a ten-unit increase for
      this buyer under the stated invoice. Different invoice or hedging terms could assign exposure differently;
      none is supplied. Do not reverse the units or treat a currency move as equally beneficial to every
      party.


      For the toy quality agreement, a rejected batch leaves the producer responsible for replacement
      production and the buyer responsible for already-agreed storage. This does not establish lawful
      real contract terms. A powerful buyer delaying the final payment could transfer financing pressure
      to the producer and workers. That is a risk mechanism, not an allegation about an actual factory.
      Record who can reject, whose evidence determines quality and how disputes could be reviewed.


      The OFAC [introductory sanctions FAQs, S12](https://ofac.treasury.gov/faqs/topic/1501) and BIS [export-compliance
      overview, S13](https://www.bis.gov/developing-an-export-compliance-program) identify why current
      authoritative checks matter. Neither page constitutes screening of this chain. No parties, goods,
      classifications, licenses, tariffs or product requirements have been checked for a transaction.
      Permission cannot be inferred from the comparative-advantage calculation, a cheap offer or an educational
      source link.


      ### Compare responses to two disruptions


      The buyer needs **ten cloth units per week**. A **20-unit buffer** covers two weeks if demand is
      unchanged. A supplied shipping delay lasts **three weeks**, leaving **one week, or ten units**,
      uncovered. The buffer is useful but insufficient. A separate single-source failure has no confirmed
      recovery date; stock cannot solve an indefinite interruption.


      | Option | Benefit | Cost and evidence needed |

      | --- | --- | --- |

      | Twenty-unit buffer | Covers two ordinary weeks | Two storage units per week, tied-up resources
      and possible damage; not a complete answer to a three-week delay |

      | Second lawful source | Could reduce one-source dependence | Four extra units per cloth and 15
      qualification units; capacity, labor, quality and legal checks remain open |

      | Local production | Could shorten one transport path | Six extra units per cloth in the toy quote;
      local does not automatically mean cleaner, fairer or sufficiently capable |

      | Longer lead time | Avoids a promise the stock cannot meet | Users wait and may need alternatives;
      lost use and downstream work are costs even without an extra invoice |


      For the short delay, use the existing buffer only with honest availability information and an agreed
      longer lead time for the uncovered week. For supplier failure, investigate a qualified second source
      while keeping demand commitments provisional. This is a conditional analysis, not a purchase or
      contact instruction. Do not assume the second source is ready just because its price is listed.


      ### Produce the connected explanation


      1. Show both cloth opportunity costs, both bread opportunity costs and the two worked bundle comparisons.
      State every simplifying assumption.

      2. Draw or describe the seven-stage chain and assign delay, rejection, currency and bargaining-power
      exposure. Mark unknown labor and environmental conditions.

      3. Calculate the delay gap and currency change. Compare all four resilience responses with costs
      and limits.

      4. Save the conditional response, then open the [later packet](?resource=file-later-packet-md).
      Explain the original potential gain alongside the new constraints.

      5. Name the evidence and lawful authority needed before any actual transaction. Keep aggregate benefit
      distinct from worker, place and user outcomes.


      Use tokens and a verbal chain if tables are difficult. A harder pass changes demand or the invoice
      currency without changing the production ratios. Progress requires an analysis that can explain
      both gains and limits. The existence of friction does not erase the simple model''s result; the
      model''s result does not settle a real supply decision.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Producer P makes eight grain or four cloth per hour; Q makes six grain or six cloth. Who has
      comparative advantage in cloth, and would 1.5 grain per cloth lie between their opportunity costs?

      2. A 24-unit buffer faces three weeks at 12 units per week. How much demand remains uncovered without
      replenishment?

      3. A 200 foreign-unit invoice changes from 0.8 to 0.9 domestic units per foreign unit. What changes,
      and does a cheap quote establish lawful supply?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. P gives up two grain per cloth; Q gives up one. Q has comparative advantage in cloth, and
      1.5 lies between one and two under the linear model. This alone does not settle logistics, distribution
      or permission to trade.

      2. Demand is 36, so 12 units remain uncovered. The buffer covers two weeks, not the entire delay.
      Name the changed commitment or alternative instead of labeling the stock fully resilient.

      3. The domestic cost rises from 160 to 180, a 20-unit increase for the party bearing this invoice
      exposure. Price establishes neither lawful permission nor verified labor, quality or capacity conditions.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
