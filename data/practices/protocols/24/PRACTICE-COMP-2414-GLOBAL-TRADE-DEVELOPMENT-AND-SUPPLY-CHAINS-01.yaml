        expected: true
  - stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01-A2
    sequence: 2
    title: Add the costs and people absent from the simple model
    instructions: 'Trace transport time, storage, quality, labor conditions, energy, customs, exchange-rate
      exposure and buyer or supplier bargaining power through the chain. Identify who bears a delay, currency
      change or rejected shipment. Mark sanctions, export controls, tariffs and product rules as current
      jurisdiction-specific checks requiring authoritative guidance; do not infer permission from a low
      price. Explain how aggregate gains can coexist with losses for particular workers or places.


      Observation checks: The chain includes logistics labor and currency exposure; Risk-bearing and bargaining
      power are assigned explicitly; Legal trade restrictions remain subject to current verification;
      Aggregate gains are not assumed to benefit every affected person. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01
      action_stable_id: PRACTICE-COMP-2414-GLOBAL-TRADE-DEVELOPMENT-AND-SUPPLY-CHAINS-01-A2
      competency_stable_id: '24.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2414_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2414_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_chain_includes_logistics_labor_and_currency_exposure
        - risk_bearing_and_bargaining_power_are_assigned_explicitly
        - legal_trade_restrictions_remain_subject_to_current_verification
        - aggregate_gains_are_not_assumed_to_benefit_every_affected_person
      - measurement_id: c2414_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2414_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
