meaning_and_fit:
  purpose: Compare ownership and organizational forms by who supplies capital, controls decisions, bears
    risk and holds the enterprise accountable to its purpose.
  why_recommended: Compare ownership and organizational forms by who supplies capital, controls decisions,
    bears risk and holds the enterprise accountable to its purpose.
  claims:
  - statement: Compare ownership and organizational forms by who supplies capital, controls decisions,
      bears risk and holds the enterprise accountable to its purpose.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Ownership, governance, and alternative enterprise
    forms practice fit the person's current role, pathway, capacity, authority, resources, and safety
    conditions?
  not_applicable_behavior: Record Ownership, governance, and alternative enterprise forms as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use a diagram or role cards with an accessible explanation. A sole person
    can compare models without pretending to speak for future members. Actual worker, cooperative, nonprofit,
    public and investor arrangements require their own lawful authority and informed consent.
  opportunity_considerations: A fictional group wants to operate a small shared learning-resource service.
    Its goals are reliable access, fair worker treatment and enough income to maintain the service. Compare
    sole ownership, partnership, investor-owned corporation, worker or user cooperative, employee ownership,
    nonprofit and public provision. Do not assume all are legally available in every jurisdiction.
  prerequisites:
  - A fictional group wants to operate a small shared learning-resource service. Its goals are reliable
    access, fair worker treatment and enough income to maintain the service. Compare sole ownership, partnership,
    investor-owned corporation, worker or user cooperative, employee ownership, nonprofit and public provision.
    Do not assume all are legally available in every jurisdiction.
  dependencies: []
  safe_alternatives:
  - Use a diagram or role cards with an accessible explanation. A sole person can compare models without
    pretending to speak for future members. Actual worker, cooperative, nonprofit, public and investor
    arrangements require their own lawful authority and informed consent.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Ownership, governance, and alternative enterprise forms differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Ownership, governance, and
    alternative enterprise forms as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'A fictional group wants to operate a small shared learning-resource service. Its goals are reliable
    access, fair worker treatment and enough income to maintain the service. Compare sole ownership, partnership,
    investor-owned corporation, worker or user cooperative, employee ownership, nonprofit and public provision.
    Do not assume all are legally available in every jurisdiction. Goal: Compare ownership and organizational
    forms by who supplies capital, controls decisions, bears risk and holds the enterprise accountable
    to its purpose. Scope: This is a fictional governance comparison, not entity formation or legal, tax,
    securities or liability advice. Legal forms and ownership models are related but not interchangeable.
    Time and effort: Thirty minutes to map alternatives and twenty minutes to test two governance conflicts.
    Adaptation: Use a diagram or role cards with an accessible explanation. A sole person can compare
    models without pretending to speak for future members. Actual worker, cooperative, nonprofit, public
    and investor arrangements require their own lawful authority and informed consent. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a diagram or role cards with an accessible explanation. A sole person can compare
    models without pretending to speak for future members. Actual worker, cooperative, nonprofit, public
    and investor arrangements require their own lawful authority and informed consent.
  expected_burden: Thirty minutes to map alternatives and twenty minutes to test two governance conflicts.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Ownership, governance, and alternative enterprise forms protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Ownership, governance, and alternative enterprise forms action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a diagram
    or role cards with an accessible explanation. A sole person can compare models without pretending
    to speak for future members. Actual worker, cooperative, nonprofit, public and investor arrangements
    require their own lawful authority and informed consent.
  actions:
  - stable_id: PRACTICE-COMP-2412-OWNERSHIP-GOVERNANCE-AND-ALTERNATIVE-ENTERPRISE-FORMS-01-A1
    sequence: 1
    title: Make control and financing visible for every option
    instructions: 'For each of the seven options, record who could contribute capital, who appoints decision
      makers, how surplus is used, who bears losses and whom the organization must answer to. Use official
      educational material for definitions and mark local legal and tax details unknown. Distinguish an
      employee share arrangement from democratic worker control and a nonprofit mission from an absence
      of revenue or paid staff. Identify which models conflict with the supplied mission before choosing
      one.


      Observation checks: All seven options receive capital control and accountability entries; Employee
      ownership and democratic control are not conflated; Nonprofit status is not equated with no revenue
      or no paid labor; Local legal tax and liability questions remain unverified. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2412-OWNERSHIP-GOVERNANCE-AND-ALTERNATIVE-ENTERPRISE-FORMS-01
      action_stable_id: PRACTICE-COMP-2412-OWNERSHIP-GOVERNANCE-AND-ALTERNATIVE-ENTERPRISE-FORMS-01-A1
      competency_stable_id: '24.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2412_a1_primary
      transfer_disposition: context_bound
      measurements:
