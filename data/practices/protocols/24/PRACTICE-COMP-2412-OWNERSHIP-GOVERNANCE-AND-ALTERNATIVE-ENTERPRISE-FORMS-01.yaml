  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### The preferred form cannot yet authorize the proposal


      At the supplied cooperative meeting, only two of five members attend. The routine quorum is three
      and routine approval requires three affirmative votes. The attendees can discuss alternatives and
      record concerns; they **cannot authorize a fee or funding decision** under the card. No emergency
      exception is supplied.


      One absent member reports that the proposed meeting time conflicts with care responsibilities. The
      secretary proposes an accessible alternative time and asks what participation route would be usable.
      This is a proposal, not evidence that the next meeting will reach quorum. Record the governance
      burden and obtain agreement on a valid process before another vote.


      The nonprofit comparison has two directors ready to discuss the fee proposal, enough for an ordinary
      decision, but the funder''s condition would conflict with the mission commitment and needs the separate
      all-three procedure and hearing. Meeting a routine threshold does not grant authority over every
      kind of decision.


      Keep the cooperative recommendation conditional. The launch gap remains **120**, and the full proposed
      fee reduction would create a **20 operating deficit**. Participation design needs revision; no new
      funds, lawful documents or fair outcomes have been established. All votes and responses are supplied
      fiction.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare who supplies resources, who decides, who bears loss and who can challenge a decision.
      Allow thirty minutes to map alternatives and twenty to test the two governance conflicts. Your output
      is a conditional institutional choice with unresolved constraints, not incorporation paperwork.


      ### A name does not settle control


      Ownership can provide economic rights, voting rights or both, depending on the arrangement. Governance
      specifies who makes which decisions, under what duties and procedures. Management carries out operations
      within that authority. A person may manage work without owning the enterprise, and an employee may
      hold a financial stake without having equal votes over every decision.


      The SBA''s [business-structure overview, S07](https://www.sba.gov/counseling/launch-your-business/)
      supplies introductory distinctions among several forms. Its context is the United States; legal,
      tax and liability details do not transfer automatically to other jurisdictions. The Department of
      Labor''s [employee-ownership landing page, S08](https://www.dol.gov/agencies/ebsa/about-ebsa/our-activities/programs-and-initiatives/employee-ownership-initiative)
      identifies multiple employee-ownership arrangements. It does not establish that every arrangement
      provides direct democratic control.


      The OECD''s [selected state-owned-enterprise chapter passages, S09](https://www.oecd.org/en/publications/ownership-and-governance-of-state-owned-enterprises-2024_395c9956-en/full-report/component-4.html)
      discuss public ownership or control, economic activity and public-policy objectives. A public service
      is not necessarily an enterprise, and a government-owned enterprise is not identical to a ministry.
      Compare actual governing documents rather than inferring accountability from a label.


      ### Compare all seven forms


      | Form | Capital and control | Surplus, loss and accountability questions |

      | --- | --- | --- |

      | Sole ownership | One owner supplies or arranges capital and normally holds decision authority
      | Who bears obligations, keeps residual returns and hears affected users? Exact liability depends
      on lawful structure |

      | Partnership | Partners contribute under an agreement allocating authority | How are profit, loss,
      work and disputes shared; can one partner bind others? |

      | Corporation with investor ownership | Investors supply equity; voting and board arrangements govern
      control | How do investor returns, board duties and stakeholder effects interact? Shares need not
      carry identical rights |

      | Cooperative | Members participate under a defined membership and voting system | Which workers
      or users qualify, how are returns allocated, and whose interests remain outside membership? |

      | Employee ownership | Workers hold an economic stake through a specified arrangement | Inspect
      plan, trust and governing rules for actual voting, exit, concentration and benefit rights |

      | Nonprofit | Funding may include earned revenue, donations or grants; a governing body directs
      the mission | Revenue and paid work are possible; owner-profit distribution is constrained by the
      form, with exact duties and tax status requiring advice |

      | Public enterprise | A public body owns or controls an economic enterprise under a defined mandate
      | Public reporting, oversight, service obligations and commercial objectives may conflict; identify
      the actual accountable authority |


      For capital and loss, the map needs a second pass. A sole owner or partners arrange funding and
      residual returns under their lawful arrangement; investor shareholders elect or otherwise appoint
      directors under the share rules, with company resources and any specific guarantees determining
      loss exposure. Cooperative members may contribute capital, elect the governing body and allocate
      surplus or absorb losses according to their rules. Employee owners may supply value through a plan
      or trust; the plan defines economic downside and whether employees appoint decision makers. Nonprofit
      funders do not automatically appoint directors; the charter and lawful rules govern appointment,
      mission use of any surplus and treatment of deficits. A public owner appoints or oversees decision
      makers through its authorized structure; surplus use and public exposure to losses depend on that
      mandate, with no automatic unlimited bailout. Borrowing and outside support can exist in several
      forms and require their own conditions. These are questions to resolve, not universal liability
      promises.


      Public provision is the broader alternative: an authority might provide the service directly, contract
      for it or own an enterprise. The public-enterprise row describes the ownership option within that
      broader category. None of the seven labels inherently violates the learning-service mission; a specific
      concentration of control, funding condition or inability to provide access can conflict with it.


      This is a comparison tool, not a ranking from selfish to good. Each form can be well or poorly governed.
      A cooperative can exclude nonmember users; a nonprofit can have an unresponsive board; a public
      owner can demand conflicting goals. Specific rights, accessible participation, clear duties and
      usable challenge routes matter.


      ### Supplied service G8


      A fictional learning-resource service wants reliable access, fair worker treatment and enough maintenance
      capacity. Launch requires **300 units**; confirmed resources are **180**, leaving a **120 gap**.
      A prospective funder offers 120 only if it receives sole veto power to reduce the service from four
      open hours to two whenever it chooses. The service''s proposed mission commitment requires at least
      **four open hours**.


      The recurring budget forecasts **200 revenue**, **140 worker cost** and **40 maintenance**, leaving
      **20 for reserve**. Users propose a fee reduction that would lower revenue by **40**, to **160**.
      With costs unchanged at 180, the service would have a **20 operating deficit**, not a zero balance.
      The forecasted reserve contribution disappears; it is not an existing reserve that can be spent
      indefinitely. No other subsidy or spare worker capacity is supplied.


      Two fictional governance cards let you test the conflicts. These rules are exercise assumptions,
      not legal models. In the cooperative card, five members comprise two workers, two users and one
      community member. Routine decisions require three affirmative votes with at least three members
      present. Changing the four-hour mission commitment requires four of five members after notice to
      affected users. No funder receives votes automatically. Members can request a recorded reconsideration
      through a designated secretary.


      In the nonprofit card, three independent directors govern; routine decisions require two votes.
      Changing the mission commitment requires all three after an announced user-and-worker hearing. A
      funding agreement cannot silently override that rule. An accessible written concern goes to a named
      board secretary and must enter the next decision agenda. The hearing supplies input, not a promise
      that participants can compel their preferred outcome.


      ### Test two conflicts in both forms


      For the funding conflict, the cooperative members and nonprofit directors must each identify who
      can consider the offer, the requested change in control and the conflict with four-hour access.
      Both can decline the conditions and retain the mission. Neither can assume that money will appear
      afterward: **120 remains unfunded**. If either proposes a lawful mission change, the relevant heightened
      procedure, stakeholder effects and qualified review must be explicit. An informal manager acceptance
      is insufficient under either supplied card.


      For the fee conflict, both forms must show the revised 160 revenue and 180 costs. In the cooperative,
      worker and user members can voice the conflicting interests, while nonmember users need a route
      to be heard. In the nonprofit, the board hears both groups before its vote. Neither form gives an
      automatic right to cut worker pay or neglect maintenance. A smaller fee change, external support
      or a reduced service commitment might be considered, but each needs facts and appropriate authority.
      Do not turn an uncosted wish into an approved solution.


      The worked provisional choice is the cooperative because the service wants users and workers to
      share formal participation. This reason concerns the fictional mission, not superiority of the form.
      The decision remains contingent on legal feasibility, participants'' willingness, accessible meeting
      arrangements and financing. If members cannot sustain governance work, a responsive nonprofit with
      concrete participation rights could become more suitable. Name the fact that would change the recommendation.


      ### Make the decision inspectable


      1. Complete the seven-form comparison using capital, control, mission, accountability and stakeholder
      effects. Mark which conclusions require governing documents or qualified advice.

      2. Use both cards to record each conflict: decision owner, required procedure, affected people,
      numerical consequence, challenge route and unresolved result.

      3. Write the conditional choice and the changed fact that would reverse it. Keep the launch gap
      and operating deficit visible.

      4. Prepare three questions for a qualified adviser: which forms and membership arrangements are
      available; how voting, duties, liability and funder conditions can lawfully interact; and what tax,
      reporting and paid-worker obligations apply. These are questions, not drafted legal terms.

      5. Save your recommendation, then open the [later packet](?resource=file-later-packet-md) to test
      whether the preferred form can actually make its next decision.


      For support, compare just the two supplied cards after reading the seven-form map. For a harder
      pass, add an affected nonmember who cannot attend meetings and design a feasible input route without
      falsely granting a vote. An actual institutional recommendation would need verified law, governing
      documents, consent and financial evidence. This exercise requires none of the learner''s private
      employment or ownership history.


      Progress is an analysis that connects an institutional form to actual rights and consequences. Selecting
      the most appealing label does not demonstrate capital adequacy, fair governance or mission achievement.
      The later failure matters precisely because a good intention cannot substitute for a decision procedure
      that works.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Workers hold shares through an employee-ownership arrangement. Can you infer that every worker
      has one vote over all enterprise decisions?

      2. A service has 240 revenue and 210 operating costs. A fee reduction removes 50 revenue. Is the
      original 30 reserve contribution enough to make the new operation balanced?

      3. A nonprofit holds a public hearing. Does that prove affected users can control the board decision?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Economic ownership and governance rights differ. Inspect the plan, trust or governing
      documents and the applicable law; employee ownership alone does not establish direct equal voting.

      2. New revenue is 190 against 210 costs, a 20 deficit. The former 30 surplus was a forecasted contribution,
      not an additional source of recurring income or evidence of an existing reserve.

      3. No. Distinguish input, voting, duties, appeal and actual control. Inspect the promised procedure,
      who decides and how concerns are answered; a nonprofit label or hearing alone does not establish
      accountability.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
