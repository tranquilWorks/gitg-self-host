        criteria:
        - all_seven_options_receive_capital_control_and_accountability_entries
        - employee_ownership_and_democratic_control_are_not_conflated
        - nonprofit_status_is_not_equated_with_no_revenue_or_no_paid_labor
        - local_legal_tax_and_liability_questions_remain_unverified
      - measurement_id: c2412_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
