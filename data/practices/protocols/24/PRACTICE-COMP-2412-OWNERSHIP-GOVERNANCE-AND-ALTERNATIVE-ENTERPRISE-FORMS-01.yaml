  - stable_id: PRACTICE-COMP-2412-OWNERSHIP-GOVERNANCE-AND-ALTERNATIVE-ENTERPRISE-FORMS-01-A2
    sequence: 2
    title: Test capital pressure and member disagreement
    instructions: 'Apply two fictional conflicts: a funder offers essential capital in exchange for control
      that could reduce access, and users want lower prices while workers need sustainable compensation.
      For two plausible forms, trace who can decide, who has voice, what disclosure or vote is required
      and how an affected person can challenge the result. Do not assume any form guarantees fairness;
      write one governance failure each could still produce.


      Observation checks: Both conflicts are tested under two plausible forms; Decision rights voice and
      challenge routes are specified; Capital conditions are evaluated against mission rather than accepted
      automatically; Each form retains a possible governance failure. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2412-OWNERSHIP-GOVERNANCE-AND-ALTERNATIVE-ENTERPRISE-FORMS-01
      action_stable_id: PRACTICE-COMP-2412-OWNERSHIP-GOVERNANCE-AND-ALTERNATIVE-ENTERPRISE-FORMS-01-A2
      competency_stable_id: '24.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
