    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Business, markets, and economics practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Business, markets, and economics as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use tokens or a diagram and keep all transactions fictional. An actual enterprise
    requires its own accounting, worker, privacy, consumer and tax obligations. Do not enter customer
    identifiers or perform a real regulated service to complete the case.
  opportunity_considerations: Use a fictional service that formats approved event notices. It receives
    four orders at 50 each, pays direct labor and materials of 25 per order and has 60 in period overhead.
    Two customers pay this period and two next period. Opening cash is 100; all stated costs are paid
    now. No other costs, taxes or movements are included in the example.
  prerequisites:
