  - stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01-A2
    sequence: 2
    title: Reconcile orders profit and cash with the supplied numbers
    instructions: 'Calculate revenue of 200, direct costs of 100 and period overhead of 60, leaving 40
      before omitted taxes or other costs. Cash receipts are only 100 now, so opening cash 100 plus receipts
      100 less payments 160 leaves 40. The unpaid 100 is a receivable, not spendable cash. Draw the sequence
      from inquiry to approval, production, delivery, invoice and collection; identify where errors or
      delays create costs.


      Observation checks: Revenue direct cost overhead and provisional profit reconcile; Current receipts
      are distinguished from total orders; Closing cash equals 40 under the stated assumptions; The operating
      sequence includes approval delivery and collection. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01-A2
      competency_stable_id: '24.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
