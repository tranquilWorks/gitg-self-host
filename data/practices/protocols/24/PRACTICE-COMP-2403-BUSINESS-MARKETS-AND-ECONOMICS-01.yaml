  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Rework reduces both profit and cash


      One delivered notice requires correction in the supplied later record. The customer-approved source
      had been copied incorrectly. The correction costs **15**, paid in the same period, with no additional
      revenue. Provisional profit becomes **25** and closing cash becomes **25**. The two unpaid invoices
      still total **100**; do not add them to available cash.


      One of those 50-unit invoices is now expected a period later than originally agreed. The expectation
      is not a receipt and does not by itself cancel the receivable or determine its accounting treatment.
      A real overdue balance would require the applicable collection and accounting process; this case
      supplies no write-off or new loan.


      The owner proposes a source-to-final fact check before delivery, but its future effort and effectiveness
      are not yet measured. Record it as a proposed control rather than a proven elimination of rework.
      The original customer acceptance did not prevent the later correction.


      Update the operating explanation, the two financial calculations and the timing uncertainty. The
      business still shows positive provisional profit under the simplified inputs, while its buffer has
      shrunk and some obligations were never modeled. “Revenue 200” remains true and insufficient to assess
      continuity.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Explain a small business as a connected set of incentives, operations and financial flows.
      Allow thirty minutes to reconstruct the supplied four-order month and ten to revise it. Your product
      is a business account that survives a rework cost and a late payment instead of relying on revenue
      alone.


      ### Follow value, promises and money separately


      A business makes an offer to customers, arranges inputs, delivers work and receives payment under
      terms. Those events need not happen on the same date. Revenue describes sales recognized in the
      stated accounting example; profit subtracts the relevant costs; cash reflects money actually available.
      An unpaid invoice can be an asset and still be unusable for paying today''s supplier. The SEC''s
      [financial-statements guide, S12](https://www.sec.gov/investor/pubs/begfinstmtguide.htm) supports
      this distinction. It is an educational explanation, not an accounting policy for a real enterprise.


      Incentives matter at every stage. A customer wants a useful result at an acceptable cost. A worker
      needs manageable, compensated work. A supplier wants payment; the owner may seek margin and continuity;
      an approver may care about accuracy and reputation. Competition gives users alternatives, but switching
      can require effort. Pricing and marketing therefore need a credible account of the benefit, the
      alternative and the full delivery burden.


      The SBA''s [planning overview, S10](https://www.sba.gov/counseling/plan-your-business/) connects
      market questions with costs and competitors. This exercise adds original numbers and a complete
      transaction sequence. It does not treat a business slogan, a forecast or a break-even estimate as
      evidence of viability.


      ### Supplied notice-formatting operation E2


      An owner produces formatted notices from customer-approved facts. The service does not invent event
      details or certify legal wording. Four customers each order one notice at **50 units**, all delivered
      and accepted within the fictional period. Variable cost is **25 per order** and period overhead
      is **60**. All those costs are paid during the period. Taxes, depreciation, financing, owner drawings
      and additional obligations are omitted and must stay explicitly outside the result.


      Two customers pay their 50-unit invoices now. Two owe 50 each next period. Opening cash is **100**.
      No loan, grant, new owner contribution or other cash movement is supplied. The production process
      is inquiry, scope and fact approval, formatting, quality check, delivery, invoice, then collection.
      Invoicing and collecting are separate stages.


      | Period calculation | Amount |

      | --- | ---: |

      | Revenue: 4 × 50 | 200 |

      | Variable cost: 4 × 25 | 100 |

      | Overhead | 60 |

      | Provisional profit before omitted items: 200 − 100 − 60 | 40 |

      | Cash receipts from two paid invoices | 100 |

      | Cash paid for variable costs and overhead | 160 |

      | Closing cash: opening 100 + receipts 100 − payments 160 | 40 |

      | Unpaid customer invoices | 100 |


      Profit and closing cash happen to equal 40 here. That numerical coincidence does not make them the
      same concept. Opening cash and unpaid invoices explain why the cash calculation needs its own inputs.
      The receivable is still exposed to delay or nonpayment, and cash 40 says nothing about costs not
      included in this simplified period.


      ### Explain the market beyond the price tag


      The target user needs an accurate readable notice; the buyer approves the price and terms. A customer
      could instead use an existing template, a volunteer or another provider. Their total cost includes
      supplying facts, reviewing the draft and handling mistakes. Marketing should state the formatting
      scope and approval requirement, without promising guaranteed attendance or compliance.


      The owner supplies coordination and some work; a worker or subcontractor may supply production.
      Their compensation and employment status require actual terms and qualified review where relevant.
      A facts approver controls source accuracy; the formatter does not gain that authority merely by
      editing text. Taxes, privacy, contract obligations and applicable accessibility or sector requirements
      must be checked through the relevant qualified routes before a real service operates.


      Macroeconomic conditions can affect this small operation through specific channels. Broad input-price
      increases may raise printing or supplier costs. Lower customer income can reduce discretionary orders.
      Interest-rate changes can alter financing cost or customer spending. Exchange-rate changes matter
      if inputs or customers cross currencies. These are conditional mechanisms, not claims that any particular
      economic event is occurring or forecasts of its effect. Separate such economy-wide influences from
      a single customer''s late payment or an internal quality failure.


      For a simple cost sensitivity, if variable cost rose from 25 to **30** on each of four orders, provisional
      profit would fall from 40 to **20**, with all other assumptions held constant. That calculation
      does not show that the owner can raise price without losing demand. The relevant next questions
      are whether the cost is real, what alternatives customers have and whether capacity or quality changes
      at another volume.


      ### Produce the business explanation


      1. Draw or list the seven operating stages and assign the customer, facts approver, producer and
      person responsible for collection. Mark which promises exist before payment and which facts need
      approval.

      2. Explain each party''s incentive and at least two substitutes for the service. Describe a truthful
      marketing claim and one tempting claim the evidence cannot support.

      3. Reconcile revenue, costs, provisional profit, cash and receivables using separate lines. State
      the omitted items and why the result is not spendable owner income.

      4. Identify one internal operational risk and one conditional macroeconomic channel. Work the 30-unit
      variable-cost sensitivity without assuming a price rise, a loan or more orders.

      5. Save a short account of what would have to stay true for continuity: demand, delivery capacity,
      reliable records and payment timing. Open the [later packet](?resource=file-later-packet-md) and
      update the affected lines without reclassifying an unpaid invoice as cash.


      ### Use the model to ask better questions


      For support, begin with the four customer invoices and mark paid or unpaid, then add costs. Use
      counters if the distinction between a sale and a receipt is unfamiliar. For a harder pass, move
      one payment another period later and ask which commitments can still be met from actual cash. Do
      not solve the problem with an unapproved credit line.


      An optional actual transfer is a redacted explanation of a small operation you own or are authorized
      to inspect, or a public business model with missing figures labeled unknown. Do not obtain private
      books, investigate an employer or make legal determinations. A balanced toy ledger demonstrates
      reasoning about supplied inputs; it is not an audit, a tax filing, proof of customer demand or evidence
      that a real business can continue. Useful progress combines an inspectable account with a later
      check against authorized operating or financial evidence.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Use fiction or privately redacted records; keep credentials and sensitive
      identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A service earns 300 revenue, incurs 220 costs and collects only 100, with opening cash 50 and
      all 220 of costs due now, before payment; no overdraft or other funding is available. What are provisional
      profit and the cash requirement if all costs are to be paid?

      2. An owner says higher economy-wide interest rates must have caused one missed invoice. What is
      missing?

      3. A formatter approves wording because the customer is slow to respond. Has the process simply
      become more efficient?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Provisional profit is 80, but projected cash is 50 + 100 − 220 = minus 70. The negative
      amount is an unfunded cash requirement, not permission to overdraw; unpaid revenue is not available
      cash.

      2. A specific causal connection and evidence. Rates can affect financing or demand, but an individual
      delay has other possible causes. Keep the macroeconomic mechanism conditional and inspect the actual
      payment record.

      3. No. Speed does not grant source or legal approval authority. Keep release pending or use an actually
      authorized alternate process; account for the delay and its costs honestly.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
