  - stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01-A3
    sequence: 3
    title: Explain a disruption across the whole system
    instructions: 'Test a customer correction that requires unpaid rework and a payment delay affecting
      the remaining two orders. Trace the consequences for capacity, quality, cash, customer trust and
      future pricing without inventing a new forecast. Propose one operational control, such as approved
      source text before formatting, and one information needed to judge whether the price covers all
      costs. Explain the service in plain language to a listener or recording, correcting any claim that
      sales alone establish health.


      Observation checks: Rework and payment delay are traced beyond the sales figure; A concrete preventive
      control is proposed; An omitted cost or demand uncertainty is identified; The final explanation
      distinguishes business mechanisms from a success prediction. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which operating or cash constraint could make the service fail despite positive sales,
      and what would you verify first?


      Examples: Supportive: The learner distinguished 40 provisional profit from the timing of cash and
      identified approval-before-production as a control on rework.


      Mixed: The operating map was sound, but an omitted tax or labor cost prevented a viability conclusion.


      Contradictory: Receivables were treated as available cash or the small size of the service was used
      to dismiss legal and worker obligations.


      Inconclusive: Revenue was calculated without explaining costs, incentives, competition, delivery
      or collection.'
    expected_time: 15-25 minutes
