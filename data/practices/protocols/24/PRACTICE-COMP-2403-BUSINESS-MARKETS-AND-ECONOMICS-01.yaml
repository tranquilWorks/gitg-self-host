intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional service that formats approved event notices. It receives four orders at 50 each,
    pays direct labor and materials of 25 per order and has 60 in period overhead. Two customers pay this
    period and two next period. Opening cash is 100; all stated costs are paid now. No other costs, taxes
    or movements are included in the example. Goal: Connect customer incentives, competition, pricing,
    marketing, operations, accounting and regulation in one coherent business model. Scope: The fictional
    service map is business literacy, not a compliance determination or prediction of commercial success.
    Revenue alone is not profit or cash available. Time and effort: Thirty minutes for the operating map
    and twenty minutes for a failure-scenario explanation. Adaptation: Use tokens or a diagram and keep
    all transactions fictional. An actual enterprise requires its own accounting, worker, privacy, consumer
    and tax obligations. Do not enter customer identifiers or perform a real regulated service to complete
    the case. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use tokens or a diagram and keep all transactions fictional. An actual enterprise
    requires its own accounting, worker, privacy, consumer and tax obligations. Do not enter customer
    identifiers or perform a real regulated service to complete the case.
  expected_burden: Thirty minutes for the operating map and twenty minutes for a failure-scenario explanation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Business, markets, and economics protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Business, markets, and economics action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use tokens
    or a diagram and keep all transactions fictional. An actual enterprise requires its own accounting,
    worker, privacy, consumer and tax obligations. Do not enter customer identifiers or perform a real
    regulated service to complete the case.
  actions:
  - stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01-A1
    sequence: 1
    title: Map why each participant chooses the service
    instructions: 'Identify user, buyer, worker, supplier and any approver or regulator. State the problem
      solved, an alternative such as doing the task internally, the buyer’s reason to pay 50 and the worker’s
      incentive to deliver accurately. Describe one truthful marketing channel and one potential conflict
      between attracting sales and maintaining quality. Mark privacy, licensing, contract, employment
      and tax questions for local verification rather than assuming a tiny service is exempt.


      Observation checks: User buyer worker supplier and oversight roles are distinct; The offer is compared
      with a real alternative to buying; Incentives and a quality-versus-sales tension are explained;
      Relevant compliance questions are left for actual verification. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2403-BUSINESS-MARKETS-AND-ECONOMICS-01-A1
      competency_stable_id: '24.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2403_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2403_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - user_buyer_worker_supplier_and_oversight_roles_are_distinct
        - the_offer_is_compared_with_a_real_alternative_to_buying
        - incentives_and_a_quality_versus_sales_tension_are_explained
        - relevant_compliance_questions_are_left_for_actual_verification
      - measurement_id: c2403_a1_boundary
        kind: boolean
        role: supporting
