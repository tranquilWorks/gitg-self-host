  - stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01-A2
    sequence: 2
    title: Test acquisition pricing and payment timing separately
    instructions: 'Calculate acquisition cost as 30 divided by ten, or 3 per new customer, and reduce
      the base month’s 100 provisional profit to 70 if that campaign occurs in the same month. Do not
      invent lifetime value from unknown retention. At a price of 10 with unchanged variable cost, contribution
      becomes 3 and at least 34 whole units are needed to cover 100 fixed cost. If customers pay later
      but labor and materials are due now, describe the funding gap separately from accounting profit.


      Observation checks: Acquisition cost equals three per new customer; The separate campaign is counted
      once and leaves seventy in the base case; The lower-price break-even is rounded up to thirty-four
      units; Unknown retention and collection timing remain separate uncertainties. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01-A2
      competency_stable_id: '24.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
