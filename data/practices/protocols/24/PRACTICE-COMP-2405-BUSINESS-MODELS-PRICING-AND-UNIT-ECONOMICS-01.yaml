        criteria:
        - variable_cost_equals_seven_and_contribution_equals_five
        - base_revenue_cost_and_provisional_profit_reconcile
        - break_even_equals_twenty_units_under_the_stated_assumptions
        - omitted_costs_and_nonpositive_contribution_are_addressed_explicitly
      - measurement_id: c2405_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
