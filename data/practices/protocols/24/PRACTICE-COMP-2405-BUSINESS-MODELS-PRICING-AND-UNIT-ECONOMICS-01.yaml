meaning_and_fit:
  purpose: Relate price, variable cost, fixed cost, acquisition, retention and payment timing to a conditional
    viability judgment rather than revenue enthusiasm.
  why_recommended: Relate price, variable cost, fixed cost, acquisition, retention and payment timing
    to a conditional viability judgment rather than revenue enthusiasm.
  claims:
  - statement: Relate price, variable cost, fixed cost, acquisition, retention and payment timing to a
      conditional viability judgment rather than revenue enthusiasm.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Business models, pricing, and unit economics practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Business models, pricing, and unit economics as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a calculator, counters or a simple handwritten table. Keep all inputs
    fictional unless authorized to use non-sensitive business records. Actual pricing, tax, employment
    and financing decisions may require qualified advice; no sale, loan or securities offer is required.
  opportunity_considerations: A fictional label-formatting service charges 12 per unit. Variable cost
    is materials 2, direct labor 4 and transaction cost 1. Monthly fixed cost is 100. The base month sells
    40 units. Separately, a 30 acquisition campaign brings ten new customers; repeat purchase and future
    retention are unknown. Treat the campaign as an additional cost, not included in the base fixed or
    variable figures.
  prerequisites:
  - A fictional label-formatting service charges 12 per unit. Variable cost is materials 2, direct labor
    4 and transaction cost 1. Monthly fixed cost is 100. The base month sells 40 units. Separately, a
    30 acquisition campaign brings ten new customers; repeat purchase and future retention are unknown.
    Treat the campaign as an additional cost, not included in the base fixed or variable figures.
  dependencies: []
  safe_alternatives:
  - Use a calculator, counters or a simple handwritten table. Keep all inputs fictional unless authorized
    to use non-sensitive business records. Actual pricing, tax, employment and financing decisions may
    require qualified advice; no sale, loan or securities offer is required.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Business models, pricing, and unit economics differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Business models, pricing,
    and unit economics as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'A fictional label-formatting service charges 12 per unit. Variable cost is materials 2, direct
    labor 4 and transaction cost 1. Monthly fixed cost is 100. The base month sells 40 units. Separately,
    a 30 acquisition campaign brings ten new customers; repeat purchase and future retention are unknown.
    Treat the campaign as an additional cost, not included in the base fixed or variable figures. Goal:
    Relate price, variable cost, fixed cost, acquisition, retention and payment timing to a conditional
    viability judgment rather than revenue enthusiasm. Scope: This is a fictional single-product model
    with deliberately stated assumptions. It is not a valuation, accounting standard, investment recommendation
    or demand forecast. Time and effort: Thirty minutes for the model and twenty minutes for price, volume
    and cash stress tests. Adaptation: Use a calculator, counters or a simple handwritten table. Keep
    all inputs fictional unless authorized to use non-sensitive business records. Actual pricing, tax,
    employment and financing decisions may require qualified advice; no sale, loan or securities offer
    is required. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a calculator, counters or a simple handwritten table. Keep all inputs fictional
    unless authorized to use non-sensitive business records. Actual pricing, tax, employment and financing
    decisions may require qualified advice; no sale, loan or securities offer is required.
  expected_burden: Thirty minutes for the model and twenty minutes for price, volume and cash stress tests.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Business models, pricing, and unit economics protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Business models, pricing, and unit economics action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a calculator,
    counters or a simple handwritten table. Keep all inputs fictional unless authorized to use non-sensitive
    business records. Actual pricing, tax, employment and financing decisions may require qualified advice;
    no sale, loan or securities offer is required.
  actions:
  - stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01-A1
    sequence: 1
    title: Calculate contribution and break-even with all assumptions visible
    instructions: 'Total variable cost as 7 and contribution per unit as 5. Calculate the base 40-unit
      revenue as 480, variable cost as 280 and profit before the separate campaign, taxes and omitted
      costs as 100. Break-even is 100 divided by 5, or 20 units. Identify what labor, capacity, refunds,
      tax or support costs may still be missing in an actual offer. If contribution is zero or negative,
      more units do not cover positive fixed costs under this model.


      Observation checks: Variable cost equals seven and contribution equals five; Base revenue cost and
      provisional profit reconcile; Break-even equals twenty units under the stated assumptions; Omitted
      costs and nonpositive contribution are addressed explicitly. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01-A1
      competency_stable_id: '24.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
