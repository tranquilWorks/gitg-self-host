        expected: true
  - stable_id: PRACTICE-COMP-2405-BUSINESS-MODELS-PRICING-AND-UNIT-ECONOMICS-01-A3
    sequence: 3
    title: Make a conditional viability decision and the next measurement
    instructions: 'Choose proceed to a bounded test, redesign or stop, citing the decisive assumption.
      Set a maximum affordable trial cost and a capacity limit, and specify one measurement such as actual
      support time per order, paid conversion or repeat use. State a stop condition for negative contribution,
      poor delivery or unacceptable harm. A mathematically positive model is not proof that forty customers
      exist or that scaling preserves labor, quality and cost.


      Observation checks: The decision names its most consequential assumption; A bounded trial budget
      and capacity limit are specified; One real-world measurement would resolve a stated uncertainty;
      Scale and demand are not inferred from the arithmetic alone. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which assumption could reverse the viability judgment, and what is the cheapest honest
      way to measure it before increasing commitment?


      Examples: Supportive: The learner calculated contribution correctly, counted the campaign once and
      selected actual support time as the next uncertainty to test.


      Mixed: The model was positive at forty units but payment delay and unknown demand made a larger
      launch premature.


      Contradictory: Revenue was called profit, acquisition was double-counted or omitted, or a lifetime
      value was invented from one purchase.


      Inconclusive: A price was chosen without variable costs, break-even, timing or a conditional next
      test.'
    expected_time: 15-25 minutes
