  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Support costs change the decision


      The supplied pilot review reveals that delivery labor would cost **6 per pack**, not the assumed
      4. Materials remain 2 and handling 1, so variable cost becomes **9**. At the original price 12,
      contribution is **3** and fixed-cost-only break-even is **34 packs**. At 40 packs, provisional profit
      before the campaign is **20**; after the 30 campaign it is **minus 10**.


      The originally proposed 10-pack pilot would now require **100 + 90 = 190** before receipts, leaving
      only **10** of the available 200. Even if all ten sold at 12, modeled loss would be **70**. No actual
      cost was incurred, customer recruited or pack sold. The owner chooses to keep the work analytical
      and redesign the support burden before deciding whether to spend.


      Do not keep calling the offer profitable by using the old labor assumption. Nor does a 34-pack fixed-cost
      break-even establish demand or accommodate the campaign at the stated capacity: covering 130 at
      contribution 3 requires 44 packs. Expansion beyond 40 may require new fixed costs and staffing,
      so linear scaling is unverified.


      Retain the first model, the new labor evidence supplied in the fiction and the stop decision. Retention
      and willingness to pay remain unknown; a prudent revision is a valid learning outcome without any
      commercial success claim.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Determine what one sale contributes, how much volume covers fixed cost and whether payment
      timing leaves enough cash to operate. Allow thirty minutes for the supplied model and ten for the
      later cost change. You will produce an assumption register and bounded test, with demand and viability
      left open where the evidence stops.


      ### An attractive margin can hide a fragile model


      A business model connects a recipient''s benefit with a way to receive revenue and bear the costs
      of delivery. The user, buyer and payer can differ. A positive unit contribution is useful but does
      not establish that enough units can be sold, that acquisition is affordable, that customers return
      or that delivery capacity scales. A one-time offer and a recurring service have different support
      and retention burdens.


      Separate variable costs, which change with the modeled unit volume, from fixed costs for the stated
      period and capacity. Contribution per unit is price minus variable cost. Break-even volume divides
      fixed cost by positive contribution, rounding up when only whole units can be sold. The SBA''s [planning
      page, S10](https://www.sba.gov/counseling/plan-your-business/) supplies that basic formula. Its
      estimate is not proof of viability; all examples here are recomputed from original inputs. No source''s
      incidental monthly conversion example is used.


      If price equals variable cost, contribution is zero and no finite volume covers positive fixed cost.
      If price is below variable cost, each additional unit increases the shortfall under that model.
      Do not divide by a nonpositive contribution and call a negative or undefined result a viable sales
      target.


      Cash conversion asks when money leaves and when it returns. Inventory, work in progress and invoices
      can require funding before collection. Retention measures whether customers return over an appropriate
      period; do not infer it from units sold in a single month. Customer acquisition cost needs a defined
      spend and a count of newly acquired customers, not an arbitrary division by every unit delivered.


      ### Supplied offer U8


      A fictional label-formatting service sells one standardized label unit for **12 units**. A “pack”
      below means one such unit, not an extra sale. Per pack, materials cost **2**, delivery labor **4**
      and transaction or delivery handling **1**, totaling **7 variable cost**. Period fixed cost is **100**,
      covering the stated capacity of up to 40 packs. These are complete inputs for this simplified model
      only; tax, financing and other unlisted obligations are omitted. No real product, customer or selling
      price is being recommended.


      At **40 packs**, revenue is **480**, variable cost **280**, contribution **200** and provisional
      operating profit **100** before acquisition spending and omitted items. Per-pack contribution is
      **5**, or about **41.67% of the 12-unit price**. Fixed-cost break-even is **100 / 5 = 20 packs**.
      This is break-even under these assumptions, not evidence that 20 customers exist.


      A separate **30-unit campaign** produces **10 new customers** in the supplied period. Acquisition
      cost is **3 per new customer**. It is not 30/40 unless the claim is explicitly campaign cost per
      unit, a different measure. Those 10 customers need not account for all 40 packs, and the total number
      of customers or repeat purchase pattern is not supplied. Including the campaign once reduces modeled
      period profit to **70**; do not also subtract 3 from every pack as though all 40 were newly acquired
      customers.


      ### Compare price and timing, not just revenue


      If price falls to **10** while variable cost stays 7, contribution falls to **3**. Fixed-cost-only
      break-even becomes **34 whole packs**, since 33 packs contribute 99 and do not cover 100. Including
      the same 30 campaign cost would require **44 packs** to cover 130 at a contribution of 3, which
      exceeds the stated 40-pack capacity. The lower price may or may not increase demand; the arithmetic
      does not supply that response.


      For the original 12-unit, 40-pack case, assume all modeled costs are paid before day 30 and all
      customer receipts arrive on day 30. Opening available cash is **200**. Payments before collection
      are **280 variable + 100 fixed + 30 campaign = 410**. The projected trough is **minus 210**, an
      unfunded requirement. Positive 70 provisional profit does not pay those earlier costs. Do not assume
      an overdraft, customer prepayment or financing facility exists.


      If all 480 is eventually collected as assumed, arithmetic cash after collection would be 270, but
      only if the earlier gap had somehow been funded and the costs of doing so were addressed. That conditional
      ending balance cannot make the unfunded plan feasible. A smaller batch, changed terms or verified
      funding would each change the model and require legitimate agreement.


      ### Design a bounded learning test


      For a separate prospective pilot, suppose the owner has only the same **200** available and has
      not incurred the monthly fixed cost yet. A maximum **10-pack** pilot at variable cost 7 plus fixed
      cost 100 would require **170** before receipts, leaving a 30 buffer. It has **no campaign** and
      no assumed customers or sales. At most 120 revenue from ten packs would leave a **50-unit modeled
      loss** against those 170 costs even if all sold. State that possible loss before treating the pilot
      as acceptable learning.


      The owner must decide whether that loss and effort are affordable and worthwhile; this lesson authorizes
      no spending. A paper redesign or a no-cost usability check may be preferable. The pilot is a candidate
      test of delivery effort and recipient benefit, not a profitable launch plan. Its fixed costs, scope
      and cash ceiling are explicit so “small test” does not hide a larger commitment.


      ### Produce the unit-economics brief


      1. Identify the unit, recipient, payer, period and capacity. List every supplied cost and mark omitted
      obligations, demand and retention unknown.

      2. Calculate contribution, margin, 40-pack profit and fixed-cost break-even. Include acquisition
      separately with the correct new-customer denominator.

      3. Recalculate at price 10, both without and with the campaign. Compare required volume with capacity
      instead of assuming limitless scale.

      4. Construct the dated original cash path and label the 210 funding gap. Do not represent projected
      negative cash as an authorized transaction.

      5. Compare the 10-pack pilot, a paper redesign and stopping. State the maximum loss, what the test
      could teach and its unresolved permissions. Save the brief before opening the [later packet](?resource=file-later-packet-md).


      For support, use a single-unit card and twenty counters before moving to the cash dates. For greater
      difficulty, change labor cost while keeping price and capacity fixed. An optional actual attempt
      uses only authorized redacted records or a genuinely affordable, consented test after relevant professional
      questions are resolved. Do not contact prospects, advertise, take payment or incur costs to satisfy
      the source exercise.


      Evidence of progress would explain whether a real offer creates and captures enough value under
      its actual conditions, using artifacts and later observations. A forecast, a break-even number and
      a fictional campaign cannot supply repeat demand, retention, scalable delivery or commercial viability.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Use fiction or privately redacted records; keep credentials and sensitive
      identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Price is 15, variable cost 9 and monthly fixed cost 125. How many whole units cover fixed cost?

      2. A campaign costs 60, brings 12 new customers and accompanies 30 units sold. What is customer
      acquisition cost?

      3. A forecast shows 90 profit but needs 250 paid before customer receipts and has 100 available.
      Is it funded?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Contribution is 6; 125/6 is about 20.83, so 21 whole units. Twenty contribute only 120.
      This excludes any omitted acquisition, tax or financing costs and does not establish demand.

      2. Five per new customer: 60/12. Two per unit is a different allocation. Do not infer that all 30
      units came from distinct new customers or that any customer will return.

      3. No. There is a 150 funding gap before receipts. Profitability and liquidity differ; changed terms,
      smaller scope or financing must be real, agreed and costed, or the activity remains unfunded.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
