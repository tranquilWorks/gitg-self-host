        - the_guide_contains_the_five_specified_practical_elements
        - facts_and_accessibility_are_checked_before_permitted_use
        - no_commercial_demand_or_testimonial_is_invented
      - measurement_id: c2402_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
