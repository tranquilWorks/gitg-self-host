  - stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01-A2
    sequence: 2
    title: Agree on and deliver one small usable outcome
    instructions: 'Propose an approved guide containing event purpose, time, location or access method,
      what to bring and one contact route. Agree on a delivery date and a limit of one revision. Produce
      the guide using accurate approved information, accessible formatting and no unsupported claims.
      Have the organizer confirm facts before any permitted use. Do not call interest a purchase, use
      fake testimonials or promise a full service beyond the small offer.


      Observation checks: The offered result and delivery limit are agreed; The guide contains the five
      specified practical elements; Facts and accessibility are checked before permitted use; No commercial
      demand or testimonial is invented. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01
      action_stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01-A2
      competency_stable_id: '24.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2402_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2402_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
