  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Better finding, higher organizer burden


      After the fictional event, Sol reports two logistics questions at two minutes each: **4 minutes**,
      compared with the previous cycle''s 12. However, source approval and maintaining the new guide took
      **10 additional minutes** this cycle. Total recorded organizer effort is therefore **14 minutes**,
      two more than the original 12. The provider''s separate 40 minutes are not included in Sol''s comparison;
      a combined first-cycle total would be 54, with no claim that future costs will repeat unchanged.


      The guide helped one later reader find the entrance, but it did not demonstrate a net organizer
      time saving in this cycle. Attendance and question mix may also differ. Sol is willing to retain
      the five-field template only if a future update can fit the ordinary workflow; no second delivery
      has been promised or tested.


      Revise the claim to “one access-finding correction, with higher measured fictional organizer effort.”
      Proposed next test: let Sol replace only the time field from an approved card and measure that work.
      Acceptance, maintenance time and future demand remain unknown. Nobody bought the guide, so willingness
      to pay is still untested.


      Retain the failed task and the added burden. A small useful artifact does not justify calling the
      offer commercially validated or the first event an unqualified success.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Design and deliver one tiny offer, then compare the intended benefit with the user''s result
      and the provider''s effort. Allow thirty minutes for the supplied case and ten for its revision.
      The finished artifact should solve a bounded problem for someone who wants it; a persuasive description
      of a future business is not enough.


      ### Value is an effect on a person or task


      A problem is economically interesting when someone experiences a cost and an offer could reduce
      it in a way they value. The user, buyer and person approving the work may be different. A free prototype
      can reveal usability, but it does not establish willingness to pay. A purchase can reveal demand
      without proving that the product helped. Keep these claims separate so an attractive idea does not
      become its own evidence.


      Start with the current workaround and its burden. A proposed offer should specify what it does,
      who it is for, how the result will be checked and what it asks from the recipient. The work needed
      to supply accurate facts, maintain the artifact, answer questions and make corrections belongs in
      the cost of delivery. Moving that work onto an organizer without agreement can make a tidy product
      more burdensome than the original process.


      The SBA''s [business-planning material, S10](https://www.sba.gov/counseling/plan-your-business/)
      supports inspecting demand, alternatives and customer information. This companion''s event and observations
      are original fiction. No market study, sales contact or real customer validation occurred. An actual
      attempt would need willing participation and an authorized, low-stakes problem.


      ### Supplied offer V7


      A fictional organizer, Sol, runs a **Local History Table** event. In the previous event cycle, Sol
      answered six repeated logistics questions at two minutes each: **12 minutes** of recorded response
      time. This is a small baseline from one cycle, not a forecast of every future event. The existing
      workaround is a long email containing all the facts, including unrelated background.


      Sol wants a one-page visitor guide. The approved source card says:


      | Field | Approved fictional fact |

      | --- | --- |

      | Purpose | Share and discuss copies of local historical photographs |

      | Time | Saturday 2–3 p.m.; visitors may arrive during that hour |

      | Location and access | Cedar Hall, East Room; use the East entrance, which has a step-free route
      |

      | Bring | A printed copy of a photograph is optional; do not bring original irreplaceable items
      |

      | Contact | Ask Sol through the event''s existing organizer channel |


      The place and event are invented. These facts are not advice about an actual venue''s accessibility.
      Sol is the authorized approver of this source card within the case. The offer is one guide using
      those five fields, delivered for a simulated Thursday review, with one revision and a **40-minute
      provider ceiling**. No fee, live publication, mailing list or ongoing maintenance service is included.


      ### Deliver a complete first version


      A workable first draft reads: “Local History Table: discuss copies of local historical photographs.
      Saturday, 2–3 p.m.; arrive during that hour. Cedar Hall, East Room; East entrance offers the step-free
      route. Bring a printed photo copy if you want; originals are unnecessary. Questions: use the existing
      organizer channel to reach Sol.” All five fields are present. Sol''s supplied first review approves
      the facts but asks to make the entrance instruction easier to locate before release.


      One fictional intended reader, N, attempts two information tasks without hints. N finds the start
      time correctly in 20 seconds. Asked which entrance provides the step-free route, N answers “the
      main entrance” after 35 seconds. Do not score the second answer as correct because the text technically
      included the right fact. The task revealed that one important fact was not found accurately under
      the supplied conditions.


      The revised guide gives “Use the East entrance for the step-free route” its own clearly labeled
      access line. Sol approves the revision in the case before the simulated visitor use. A different
      invented reader, O, finds the East entrance in 18 seconds. This supports a limited usability observation,
      not proof that all access needs are met or that the event will receive fewer questions.


      ### Reconcile benefit and delivery effort


      Provider effort is 10 minutes organizing the source, 18 drafting, 8 reviewing and revising, and
      4 recording the outcome: **40 minutes**. The ceiling was met exactly; no spare capacity for ongoing
      updates has been established. Sol''s review and future maintenance are additional burdens, not hidden
      inside the provider''s time.


      N''s first two tasks show **one of two correct**. After revision, a different single reader succeeds
      at the previously failed access task. Do not combine that into “three successful tasks” or claim
      a controlled improvement from incomparable tiny samples. The useful conclusion is that a specific
      failure prompted an approved correction with one later successful check. Whether the guide reduces
      the organizer''s total effort remains a question for the later packet.


      ### Produce the value-delivery record


      1. Identify the recipient, user, facts approver and possible buyer. Record the six-question baseline
      and the current email workaround. Keep payment demand unknown because the offer is free.

      2. Write a tiny offer with the five fields, delivery date, approval step, one-revision limit and
      40-minute ceiling. Check consent and permissions before any actual delivery; the supplied appointments
      apply only to V7.

      3. Create the full first guide from the source card. Do not invent missing venue facts or collect
      visitor details. Record approval status separately from drafting status.

      4. Run the supplied reader tasks analytically, preserving the wrong entrance response. Revise the
      access line and use the supplied later reader result with its sample-size limitation. Keep original
      and revised artifacts findable.

      5. Record provider effort and set a total-burden check for Sol after the event. Save the initial
      claim before opening the [later packet](?resource=file-later-packet-md). A reader''s success and
      an organizer''s saved time are different outcomes.


      ### Learn before expanding the promise


      For support, create a five-row guide directly from the card and practice identifying who can approve
      each fact. A helper may assist with layout, with that assistance recorded. For a harder pass, have
      the organizer change the time after approval; define how the current version would be corrected
      without pretending old copies disappear.


      Optional real transfer could be one small, authorized improvement for a willing club or colleague,
      with a complete artifact and a later task observation. No outreach, actual publication or purchase
      is required by the supplied case. Respect privacy, copyright and the owner''s actual approval process.
      Do not advertise a measured saving until the record supports it.


      Progress would include actual delivery and a measurable benefit to a real recipient, alongside the
      burdens or failures encountered. These invented records let a learner practice that reasoning while
      leaving actual value creation unproven. A narrower offer or a decision to stop can be the appropriate
      entrepreneurial response when the total burden exceeds the benefit.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Use fiction or privately redacted records; keep credentials and sensitive
      identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A free template receives compliments, but nobody uses it for the intended task. What has been
      established?

      2. An offer removes 15 minutes of questions but adds 20 minutes of preparation for the recipient.
      Can you claim net time saved?

      3. You drafted a useful visitor sheet from unapproved access details. May it be released as completed
      value delivery?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Positive feedback only. Actual task benefit, delivery fit, willingness to pay and repeat
      demand remain unverified. Ask a willing user to attempt a relevant task without supplying the answer.

      2. No. On those stated costs the recipient spends five more minutes. Report the specific benefit
      and added burden separately, then test a narrower or easier-to-maintain offer.

      3. No. Keep it a draft and obtain the actual facts owner’s approval. An attractive format cannot
      establish venue facts, accessibility or permission to publish.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
