meaning_and_fit:
  purpose: Identify a costly recurring problem, make a bounded offer, deliver something usable and revise
    it from actual stakeholder experience.
  why_recommended: Identify a costly recurring problem, make a bounded offer, deliver something usable
    and revise it from actual stakeholder experience.
  claims:
  - statement: Identify a costly recurring problem, make a bounded offer, deliver something usable and
      revise it from actual stakeholder experience.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Entrepreneurship and value creation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Entrepreneurship and value creation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a fictional organizer and a clearly labeled usability rehearsal when access
    to a willing stakeholder is unavailable; actual customer value then remains untested. Use a spoken
    or accessible digital guide. Avoid sensitive information, regulated advice, spam, deceptive sales
    pressure or spending beyond a preselected small limit.
  opportunity_considerations: 'Default to a willing organizer who repeatedly answers the same questions
    about a small community event. Offer a one-page factual attendee guide using only approved public
    information. The organizer may decline. Prepare four fields: recurring problem, current workaround,
    promised small outcome and evidence of usefulness. Do not collect attendee personal data.'
  prerequisites:
  - 'Default to a willing organizer who repeatedly answers the same questions about a small community
    event. Offer a one-page factual attendee guide using only approved public information. The organizer
    may decline. Prepare four fields: recurring problem, current workaround, promised small outcome and
    evidence of usefulness. Do not collect attendee personal data.'
  dependencies: []
  safe_alternatives:
  - Use a fictional organizer and a clearly labeled usability rehearsal when access to a willing stakeholder
    is unavailable; actual customer value then remains untested. Use a spoken or accessible digital guide.
    Avoid sensitive information, regulated advice, spam, deceptive sales pressure or spending beyond a
    preselected small limit.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Entrepreneurship and value creation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Entrepreneurship and value
    creation as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a willing organizer who repeatedly answers the same questions about a small community
    event. Offer a one-page factual attendee guide using only approved public information. The organizer
    may decline. Prepare four fields: recurring problem, current workaround, promised small outcome and
    evidence of usefulness. Do not collect attendee personal data. Goal: Identify a costly recurring problem,
    make a bounded offer, deliver something usable and revise it from actual stakeholder experience. Scope:
    One tiny offer tests a problem-and-delivery loop, not a viable business, paid demand or permission
    to sell regulated services. No company formation, investment or public launch is required. Time and
    effort: Twenty minutes of discovery, up to forty minutes to make a small prototype and a fifteen-minute
    use review. Adaptation: Use a fictional organizer and a clearly labeled usability rehearsal when access
    to a willing stakeholder is unavailable; actual customer value then remains untested. Use a spoken
    or accessible digital guide. Avoid sensitive information, regulated advice, spam, deceptive sales
    pressure or spending beyond a preselected small limit. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional organizer and a clearly labeled usability rehearsal when access
    to a willing stakeholder is unavailable; actual customer value then remains untested. Use a spoken
    or accessible digital guide. Avoid sensitive information, regulated advice, spam, deceptive sales
    pressure or spending beyond a preselected small limit.
  expected_burden: Twenty minutes of discovery, up to forty minutes to make a small prototype and a fifteen-minute
    use review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Entrepreneurship and value creation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Entrepreneurship and value creation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    organizer and a clearly labeled usability rehearsal when access to a willing stakeholder is unavailable;
    actual customer value then remains untested. Use a spoken or accessible digital guide. Avoid sensitive
    information, regulated advice, spam, deceptive sales pressure or spending beyond a preselected small
    limit.
  actions:
  - stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01-A1
    sequence: 1
    title: Confirm the problem before designing the offer
    instructions: 'Ask the organizer about the most recent repeated question, how often it occurs, what
      they currently do and what time or confusion it creates. Record an actual example with permission,
      not an imagined complaint. Ask who uses the information and who can approve it. If the problem is
      not important or already solved, change or stop the offer rather than persuading the person that
      they need your idea.


      Observation checks: A recent actual problem and current workaround are described; Frequency and
      cost are explored without leading the answer; User and approver roles are identified; A weak problem
      signal can lead to stopping. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01
      action_stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01-A1
      competency_stable_id: '24.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2402_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2402_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_recent_actual_problem_and_current_workaround_are_described
        - frequency_and_cost_are_explored_without_leading_the_answer
        - user_and_approver_roles_are_identified
        - a_weak_problem_signal_can_lead_to_stopping
      - measurement_id: c2402_a1_boundary
        kind: boolean
