        expected: true
      - measurement_id: c2402_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01-A3
    sequence: 3
    title: Observe use and revise the offer from the result
    instructions: 'Ask a willing intended reader to find the event time and next action using the guide
      without coaching. Record a success, confusion or missing fact and revise the one most important
      issue. Ask the organizer whether the result actually reduced an avoidable task or merely moved work
      elsewhere. Decide whether to repeat, narrow or abandon the offer. Keep free prototype usefulness
      separate from willingness and ability to pay.


      Observation checks: An intended reader attempts two real information tasks; A concrete failure or
      success informs one revision; The organizer’s burden is checked rather than assumed reduced; Usefulness
      is not equated with paid demand or business viability. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which part of the delivered offer solved a demonstrated problem, and what evidence
      would still be needed before asking someone to pay for it?


      Examples: Supportive: An organizer’s repeated arrival question shaped the guide, a reader found
      the time unaided and a confusing access instruction was corrected.


      Mixed: The reader found the information, but maintaining the guide added work, so the offer was
      narrowed.


      Contradictory: Praise was represented as paying demand or a prototype was publicly distributed with
      unapproved facts.


      Inconclusive: A product idea was described without a real problem conversation, delivered output
      or observed use.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01
      action_stable_id: PRACTICE-COMP-2402-ENTREPRENEURSHIP-AND-VALUE-CREATION-01-A3
