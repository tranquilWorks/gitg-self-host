        expected: true
  - stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01-A2
    sequence: 2
    title: Choose mitigation with the affected people rather than for them
    instructions: 'Ask the appropriate venue contact which avoidable burden actually matters. Compare
      reducing materials, changing the meeting setup, providing an agreed cleanup role or compensating
      a legitimate added service. Check that the remedy does not shift work onto an unwilling volunteer
      or exclude someone who needs a particular format. Select one permitted change and state who does
      it, when and how its effect will be observed.


      Observation checks: An affected person or responsible contact informs the priority; At least two
      mitigations and their shifted burdens are compared; The chosen action has an owner timing and observation;
      Access and voluntary participation are preserved. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01
      action_stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01-A2
      competency_stable_id: '24.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2408_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2408_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_affected_person_or_responsible_contact_informs_the_priority
        - at_least_two_mitigations_and_their_shifted_burdens_are_compared
        - the_chosen_action_has_an_owner_timing_and_observation
        - access_and_voluntary_participation_are_preserved
      - measurement_id: c2408_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2408_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01-A3
    sequence: 3
    title: Check whether the burden was reduced or merely moved
    instructions: 'Carry out the agreed small change and compare the next meeting’s actual cleanup or
      material use with the prior observation. Record new effort or costs and ask the venue contact whether
      the change helped. Keep the conclusion narrow: a smaller visible cleanup burden does not establish
      total environmental benefit. Retain, revise or stop the mitigation and identify a larger policy
      question beyond this small experiment.


      Observation checks: The agreed mitigation actually occurs; A later observation checks the originally
      identified burden; New costs and effects on other people are retained; The conclusion distinguishes
      a local improvement from a full social-impact claim. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Whose cost became visible only after looking beyond the transaction, and did the remedy
      reduce it without making someone else silently absorb it?


      Examples: Supportive: The venue identified cleanup as the main burden and an agreed reusable setup
      reduced it without shifting unpaid work to a reluctant attendee.


      Mixed: Waste fell but washing work increased, so the next plan explicitly allocated that burden.


      Contradictory: The organizer declared the event sustainable from one visible change while ignoring
      worker time and accessibility.


      Inconclusive: Externalities were listed without an affected-person check, permitted mitigation or
      later observation.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01
