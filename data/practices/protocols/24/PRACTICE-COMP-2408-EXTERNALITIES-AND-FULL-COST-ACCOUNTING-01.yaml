  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Less sorting, with a new cost still counted


      At the supplied next meeting, ten sheets are printed, eight are used and two remain. Additional
      venue sorting takes **7 minutes**, compared with 18 before. The included ten-minute closing service
      is unchanged. Organizer preparation takes **4 additional minutes**, as agreed.


      Extra venue burden falls by **11 minutes**. Counting the new organizer work, the recorded additional
      effort is **7 + 4 = 11 minutes**, compared with 18: a **7-minute net reduction** across these two
      measured tasks. This limited aggregate does not price either person''s work or capture every event
      cost. Twenty fewer sheets were printed; disposal and carbon effects remain unmeasured.


      Leni reports that preparation for the next booking was easier. A paper user reports that one spare
      copy needed larger type. Access therefore needs a revision even though copies were available. The
      organizer proposes one larger-type spare after checking the user''s preference and actual print
      cost; the next version has not been tested.


      Keep the mitigation provisionally, with an access check and the same time categories next meeting.
      Neighbor effects, waste-service cost and positive public-summary spillovers remain unknown. These
      are supplied observations, not an actual staff review or a complete social-impact result.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Find a cost that a transaction leaves with someone outside its price, then test a permitted
      way to reduce it. Allow twenty minutes to map the case, one small permitted mitigation and fifteen
      minutes for later review. Your output is a benefit-and-burden account that includes affected people
      rather than a declaration that an event is sustainable.


      ### Follow the effect beyond the invoice


      The organizer receives a room and attendees receive a useful meeting. The price may cover the venue''s
      agreed services while leaving noise, waste or additional demands elsewhere. An external effect matters
      because another person''s opportunity or well-being changes without that effect being fully accounted
      for in the decision. Not every cost outside the organizer''s ledger is an externality: an agreed,
      adequately priced service is part of the transaction. A wage paid to a worker does not prove that
      unexpected extra work has no opportunity cost.


      The IMF''s [externalities explanation, S01](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/externalities)
      distinguishes private and wider costs and benefits. Its examples do not measure this meeting. A
      full-cost account can begin with separate quantities such as minutes, discarded sheets and access
      consequences. Do not add unlike units or assign a money value to another person''s time without
      a justified basis. Unknown costs should remain unknown rather than conveniently zero.


      Positive effects also belong in the map. An open meeting might produce a useful public explanation
      that helps nonattendees. That benefit needs its own evidence; saying it could happen is not the
      same as observing it. Considering spillovers in both directions makes the analysis more accurate
      without excusing an avoidable burden.


      ### Supplied meeting file X4


      Twenty people attend a fictional local-history discussion. The organizer pays **60 units** for a
      room, with ten minutes of ordinary closing work included in the agreed venue service. The organizer
      prints **30 one-page handouts** without checking demand. Eight are taken, leaving **22 unused sheets**.
      Venue coordinator Leni reports **18 additional minutes** sorting the abandoned materials beyond
      the ten-minute included closing task. The extra work delays preparation for another booking; its
      price or staffing adjustment was not agreed.


      Leni is authorized to approve the meeting setup and speaks to the venue burden within this fictional
      case. No actual staff member was interviewed. Participants have different access needs: eight want
      paper, while others can use an existing readable digital copy or listen. No one has agreed to bring
      a device, wash shared items or volunteer for cleanup.


      | Affected party | Benefit or agreed exchange | Additional effect or uncertainty |

      | --- | --- | --- |

      | Organizer and attendees | Room access and discussion for the 60-unit fee | Printing effort and
      access to the material need checking |

      | Venue workers and next group | Ten minutes of closing work is already included | Extra sorting
      delays the next group''s preparation |

      | Nearby residents | No direct role in the transaction | Noise after closing is possible but not
      observed in this file |

      | Public service | Existing waste collection serves the area | Incremental handling and disposal
      cost are unknown |

      | Future people and environment | Resources remain available when used carefully | Paper, energy
      and waste impacts are unmeasured |

      | Nonattendees | A public summary might be useful | No summary use or wider learning benefit has
      been recorded |


      The evidence supports extra sorting as a concrete priority. It does not establish that neighbors
      were disturbed, that all discarded material was recyclable or that the room fee was unfair. Keep
      a report, an inference and an unmeasured possibility in different fields.


      ### Compare remedies before assigning somebody work


      One option is to ask which formats people want and print only ten copies: eight requested and two
      spare. This preserves paper access and may reduce abandoned material. The organizer accepts up to
      four extra preparation minutes to count requests. Leni agrees to the setup and a later sorting-time
      check. The digital copy remains optional and uses an existing permitted channel; no new signup or
      attendee data collection is needed.


      A second option is a reusable display and shared materials. It might reduce paper but would require
      an accessible sight line and an agreed person to arrange and clean the materials. The proposed helper
      has not consented, and actual cleaning time is unknown. A third option is paying for an additional
      agreed venue service; its price and staff capacity need confirmation. Paying can account for a burden,
      but does not necessarily remove the waste itself.


      Choose the first option for the supplied trial because it addresses the reported source of sorting
      without removing the requested paper format. The decision is conditional on availability of the
      same readable material, no access complaint and the organizer''s four-minute capacity. It is not
      authority to impose a fee, assign a volunteer or change public infrastructure.


      ### Work the initial resource account


      Reducing planned printing from 30 to ten would mean **20 fewer sheets produced for the meeting**,
      if that plan is carried out. It would not by itself establish 20 fewer sheets sent to landfill,
      a measured carbon reduction or a net environmental benefit. Printing method, transport, reuse and
      disposal pathways are not supplied.


      The ten-minute included closing task stays in the account on both occasions. It must not be relabeled
      as a newly discovered external burden just to make the intervention look larger. Compare the same
      additional sorting task before and after. Keep organizer preparation as an added cost even if it
      is willingly undertaken; consent changes who agrees to bear work, not whether that work exists.


      ### Produce the full-cost decision record


      1. Record the room fee, included service and private benefit. Map at least the six groups in X4,
      distinguishing observed burden from possible effects and agreed costs.

      2. Name Leni''s reported priority and the limits of that perspective. In an actual attempt, ask
      the appropriate affected contact rather than deciding their needs for them.

      3. Compare the three remedies for access, resources, new labor, consent and cost. Explain why a
      narrower printing change is feasible while the reusable option remains unapproved.

      4. Write the owner, next-meeting timing, ten-copy limit and observation method. Save an initial
      forecast with unknown effects still visible, then open the [later packet](?resource=file-later-packet-md).

      5. Reconcile the later count and time record before choosing retain, revise or stop. Name one larger
      question, such as how venue agreements should price extra services, that this local trial cannot
      settle.


      For support, use just included closing time, additional sorting time and organizer preparation as
      separate counters. For a harder pass, make two more attendees require paper and revise the print
      limit without treating access as waste. A real attempt requires an ordinary permitted event and
      willing participation. An observation-only map is legitimate when there is no authority to change
      a setup.


      Progress would combine an actual decision artifact with a later observation of the originally identified
      burden. One visible cleanup improvement cannot prove complete social accounting, fair labor conditions
      or environmental benefit. The strongest result may be a more explicit agreement about remaining
      work rather than a claim that all costs have disappeared.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A venue price already includes a stated ten-minute cleanup service. Is that entire service automatically
      an unpriced externality?

      2. A change saves staff 12 minutes but adds 17 minutes of unagreed volunteer work. Can you call
      it an uncomplicated improvement?

      3. You reduced printed sheets from 40 to 25. What environmental claim is supported?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Distinguish the agreed transaction from an additional effect or uncompensated burden.
      Inspect the actual scope and consequences instead of treating every cost outside the organizer ledger
      as external.

      2. No. It shifts work and raises recorded effort by five minutes; consent is also absent. Rework
      the plan with affected people and retain access, cost and environmental uncertainties.

      3. Fifteen fewer sheets were printed under the recorded conditions. Landfill, water or carbon reductions
      require additional reliable evidence; printing count alone cannot establish a full footprint.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
