meaning_and_fit:
  purpose: Identify effects on workers, neighbors, public systems, future people or the environment that
    are not fully reflected in a private price, then propose a meaningful mitigation.
  why_recommended: Identify effects on workers, neighbors, public systems, future people or the environment
    that are not fully reflected in a private price, then propose a meaningful mitigation.
  claims:
  - statement: Identify effects on workers, neighbors, public systems, future people or the environment
      that are not fully reflected in a private price, then propose a meaningful mitigation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Externalities and full-cost accounting practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Externalities and full-cost accounting as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a tabletop when no real event or authority exists; label the actual mitigation
    untested. A remote event may have different energy, access and labor effects. Do not impose fees,
    alter public infrastructure or make environmental claims beyond reliable evidence and appropriate
    permission.
  opportunity_considerations: Default to a permitted small meeting that benefits attendees but leaves
    avoidable disposable material and cleanup for venue staff. Prepare a map of organizer, attendee, worker,
    neighbor, public service and future/environmental effects. Use actual non-sensitive observations with
    permission or a labeled fictional case.
  prerequisites:
  - Default to a permitted small meeting that benefits attendees but leaves avoidable disposable material
    and cleanup for venue staff. Prepare a map of organizer, attendee, worker, neighbor, public service
    and future/environmental effects. Use actual non-sensitive observations with permission or a labeled
    fictional case.
  dependencies: []
  safe_alternatives:
  - Use a tabletop when no real event or authority exists; label the actual mitigation untested. A remote
    event may have different energy, access and labor effects. Do not impose fees, alter public infrastructure
    or make environmental claims beyond reliable evidence and appropriate permission.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Externalities and full-cost accounting differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Externalities and full-cost
    accounting as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a permitted small meeting that benefits attendees but leaves avoidable disposable
    material and cleanup for venue staff. Prepare a map of organizer, attendee, worker, neighbor, public
    service and future/environmental effects. Use actual non-sensitive observations with permission or
    a labeled fictional case. Goal: Identify effects on workers, neighbors, public systems, future people
    or the environment that are not fully reflected in a private price, then propose a meaningful mitigation.
    Scope: One small externality analysis does not measure a complete social footprint or prove a policy
    is optimal. The practical action must remain safe, permitted and proportionate. Time and effort: Twenty
    minutes to map the case, one small permitted mitigation and a later fifteen-minute review. Adaptation:
    Use a tabletop when no real event or authority exists; label the actual mitigation untested. A remote
    event may have different energy, access and labor effects. Do not impose fees, alter public infrastructure
    or make environmental claims beyond reliable evidence and appropriate permission. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a tabletop when no real event or authority exists; label the actual mitigation
    untested. A remote event may have different energy, access and labor effects. Do not impose fees,
    alter public infrastructure or make environmental claims beyond reliable evidence and appropriate
    permission.
  expected_burden: Twenty minutes to map the case, one small permitted mitigation and a later fifteen-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Externalities and full-cost accounting protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Externalities and full-cost accounting action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a tabletop
    when no real event or authority exists; label the actual mitigation untested. A remote event may have
    different energy, access and labor effects. Do not impose fees, alter public infrastructure or make
    environmental claims beyond reliable evidence and appropriate permission.
  actions:
  - stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01-A1
    sequence: 1
    title: Locate benefits and costs beyond the payer
    instructions: 'State what the organizer and attendees receive and what the venue is paid. Identify
      labor, waste, noise, energy, access or public-service burdens that may fall elsewhere. Separate
      a transfer already agreed and compensated from an unaccounted external effect. Mark unknown size
      and avoid inventing environmental quantities. Include a possible positive spillover, such as publicly
      useful information, so the analysis does not assume every indirect effect is harmful.


      Observation checks: Private benefits and agreed payments are identified; At least three potentially
      affected groups are considered; Unaccounted effects are distinguished from agreed costs; Unknown
      magnitude and possible positive spillovers remain visible. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01
      action_stable_id: PRACTICE-COMP-2408-EXTERNALITIES-AND-FULL-COST-ACCOUNTING-01-A1
      competency_stable_id: '24.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2408_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2408_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - private_benefits_and_agreed_payments_are_identified
        - at_least_three_potentially_affected_groups_are_considered
        - unaccounted_effects_are_distinguished_from_agreed_costs
        - unknown_magnitude_and_possible_positive_spillovers_remain_visible
      - measurement_id: c2408_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2408_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
