        expected: true
  - stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01-A2
    sequence: 2
    title: Run a synthetic trial with safeguards already in place
    instructions: 'Prepare three fictional events including one missing time and one changed location.
      Require human verification against the approved facts, no invented details, accessible output and
      no automatic release. Record correct facts, unsupported additions, omitted uncertainty and review
      time. Stop the trial on any unsafe data exposure or uncorrected consequential falsehood; a fast
      draft does not count as useful when checking and repair exceed the old workload.


      Observation checks: Three supplied cases include missing and changed facts; Safeguards precede the
      trial rather than follow a failure; Accuracy uncertainty access and total review burden are observed;
      A predefined unsafe result stops the trial. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01
      action_stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01-A2
      competency_stable_id: '24.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2413_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2413_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_supplied_cases_include_missing_and_changed_facts
        - safeguards_precede_the_trial_rather_than_follow_a_failure
        - accuracy_uncertainty_access_and_total_review_burden_are_observed
        - a_predefined_unsafe_result_stops_the_trial
      - measurement_id: c2413_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2413_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01-A3
    sequence: 3
    title: Decide whether to revise stop or cautiously repeat
    instructions: 'Compare benefit with error burden and affected-person feedback. Define a concrete change,
      an owner, a monitoring measure and a condition for ending further use. Explain what additional evidence
      and authority would be required before using real data or expanding scale. Keep a no-tool alternative
      available and do not treat user resistance, job displacement or accessibility problems as mere friction
      to overcome.


      Observation checks: Benefits and burdens are compared rather than reported separately; Revision
      monitoring and stop conditions are assigned; Expansion requires new evidence and appropriate permission;
      A viable no-tool alternative and affected people’s concerns remain respected. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What result would genuinely make you stop rather than explain away the harm, and who
      has enough authority and information to enforce that decision?


      Examples: Supportive: A missing time produced an unsupported draft, so the trial stopped and the
      design added an explicit unknown-field rule before any real use.


      Mixed: Drafting was faster but review burden erased the benefit, leading to a narrower use case.


      Contradictory: Synthetic success was called safety approval or a real user’s privacy and access
      concerns were dismissed to accelerate deployment.


      Inconclusive: A benefit statement was written without a trial, safeguards, affected groups or an
      enforceable stop rule.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01
      action_stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01-A3
      competency_stable_id: '24.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
