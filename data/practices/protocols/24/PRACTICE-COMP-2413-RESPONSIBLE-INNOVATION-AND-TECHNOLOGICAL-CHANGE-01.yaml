meaning_and_fit:
  purpose: Assess a proposed innovation’s benefits and displaced burdens, then define safeguards, monitoring
    and conditions for revision or stopping before wider use.
  why_recommended: Assess a proposed innovation’s benefits and displaced burdens, then define safeguards,
    monitoring and conditions for revision or stopping before wider use.
  claims:
  - statement: Assess a proposed innovation’s benefits and displaced burdens, then define safeguards,
      monitoring and conditions for revision or stopping before wider use.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Responsible innovation and technological change practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Responsible innovation and technological change as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use paper mockups and a manually drafted reminder instead of software. No
    artificial-intelligence service or external upload is required. Do not test on vulnerable users, real
    emergencies, health, hiring, benefits or other high-consequence decisions without the proper specialist
    and institutional process.
  opportunity_considerations: Use a fictional tool that drafts public event reminders from approved facts.
    It may save organizer time but could introduce incorrect information, exclude readers using assistive
    technology or encourage unnecessary personal-data collection. Use only synthetic events and no automatic
    sending, real attendee records or consequential decisions.
  prerequisites:
  - Use a fictional tool that drafts public event reminders from approved facts. It may save organizer
    time but could introduce incorrect information, exclude readers using assistive technology or encourage
    unnecessary personal-data collection. Use only synthetic events and no automatic sending, real attendee
    records or consequential decisions.
  dependencies: []
  safe_alternatives:
  - Use paper mockups and a manually drafted reminder instead of software. No artificial-intelligence
    service or external upload is required. Do not test on vulnerable users, real emergencies, health,
    hiring, benefits or other high-consequence decisions without the proper specialist and institutional
    process.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Responsible innovation and technological change differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Responsible innovation and
    technological change as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional tool that drafts public event reminders from approved facts. It may save organizer
    time but could introduce incorrect information, exclude readers using assistive technology or encourage
    unnecessary personal-data collection. Use only synthetic events and no automatic sending, real attendee
    records or consequential decisions. Goal: Assess a proposed innovation’s benefits and displaced burdens,
    then define safeguards, monitoring and conditions for revision or stopping before wider use. Scope:
    A low-risk prototype review is not safety certification, regulatory approval or proof of social benefit.
    High-stakes systems need appropriate expert, user and institutional review. Time and effort: Thirty
    minutes for impact mapping, a bounded synthetic trial and a twenty-minute stop-rule review. Adaptation:
    Use paper mockups and a manually drafted reminder instead of software. No artificial-intelligence
    service or external upload is required. Do not test on vulnerable users, real emergencies, health,
    hiring, benefits or other high-consequence decisions without the proper specialist and institutional
    process. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use paper mockups and a manually drafted reminder instead of software. No artificial-intelligence
    service or external upload is required. Do not test on vulnerable users, real emergencies, health,
    hiring, benefits or other high-consequence decisions without the proper specialist and institutional
    process.
  expected_burden: Thirty minutes for impact mapping, a bounded synthetic trial and a twenty-minute stop-rule
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Responsible innovation and technological change protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Responsible innovation and technological change action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use paper mockups
    and a manually drafted reminder instead of software. No artificial-intelligence service or external
    upload is required. Do not test on vulnerable users, real emergencies, health, hiring, benefits or
    other high-consequence decisions without the proper specialist and institutional process.
  actions:
  - stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01-A1
    sequence: 1
    title: Map the benefit and who might bear the downside
    instructions: 'State the exact intended benefit and who receives it. Map workers whose tasks change,
      readers with different access needs, data subjects, maintainers, environmental resource use and
      anyone excluded from the tool. Separate a measured benefit from an assumed one. Identify safety,
      privacy, labor, distribution and environmental questions that the small trial cannot settle, and
      consult an appropriate affected perspective before treating the design as ready.


      Observation checks: Benefit and affected groups are specified; Labor access privacy safety and resource
      effects are considered; Measured and assumed benefits remain separate; At least one affected perspective
      or its absence is recorded honestly. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01
      action_stable_id: PRACTICE-COMP-2413-RESPONSIBLE-INNOVATION-AND-TECHNOLOGICAL-CHANGE-01-A1
      competency_stable_id: '24.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2413_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2413_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - benefit_and_affected_groups_are_specified
        - labor_access_privacy_safety_and_resource_effects_are_considered
        - measured_and_assumed_benefits_remain_separate
        - at_least_one_affected_perspective_or_its_absence_is_recorded_honestly
      - measurement_id: c2413_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2413_a1_adverse
        kind: boolean
        role: adverse
