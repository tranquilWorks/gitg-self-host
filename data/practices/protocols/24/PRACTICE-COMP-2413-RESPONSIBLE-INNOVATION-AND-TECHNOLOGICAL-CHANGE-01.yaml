  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Revision removes one error without establishing readiness


      In a separately proposed paper rehearsal, the revised R2 output preserves “time to be confirmed”
      instead of inventing 7 p.m. The current version rule is written down for location changes. These
      are improvements to a specimen and a specification, not evidence that every future card will be
      correct.


      Only two of the three planned new paper cases have been checked when the coordinator''s available
      time ends. The third remains unreviewed. The intended reader has not yet responded about the larger-text
      version. No output has been released, and the previous pause remains in effect.


      Record completed work precisely: one known error repaired, a source-version requirement added, two
      new cases checked, one check outstanding, and audience access evidence pending. The earlier **13
      versus 9 minutes** result remains the only complete supplied effort comparison. Do not replace it
      with the time of the easiest corrected specimen.


      Sal keeps the manual route available and proposes finishing the bounded rehearsal only if time and
      participation are agreed. If that cannot happen, the tool remains unused. No actual deployment,
      worker displacement, privacy test, environmental assessment or qualified acceptance occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Decide whether a small tool should be used at all, then define the evidence needed before expansion.
      Allow thirty minutes for impact mapping and the bounded paper trial, followed by twenty for stop-rule
      review. The supplied case contains useful output and consequential errors. A justified pause is
      a successful exercise outcome.


      ### Anticipate effects beyond the attractive feature


      Innovation can make a task easier while creating new work, exposing information, excluding users
      or shifting power. Assessment needs benefits, displacement, safety, privacy, environmental effects,
      accessibility and distribution. Ask who gains time, who checks mistakes, who loses a useful role,
      who maintains the tool and who can stop its use. A faster draft is only one part of that account.


      UKRI EPSRC''s [responsible-innovation framework, S10](https://www.ukri.org/who-we-are/epsrc/our-policies-and-standards/framework-for-responsible-innovation/)
      organizes reflection around anticipating, reflecting, engaging and acting. Here those ideas support
      a concrete pre-release decision. The source does not validate this tool or certify compliance. The
      toy outputs below are authored fiction; no external service, account, model or real participant
      data is required.


      A reversible paper rehearsal is appropriate because the tool''s claim can be checked against a small
      approved fact set. Do not use a real audience as an involuntary test. In an actual authorized trial,
      affected people need a meaningful way to question the proposal, and the person doing repair work
      must agree to that burden. Stop authority should be assigned before enthusiasm makes the decision
      harder.


      ### Supplied reminder-drafting proposal R8


      The proposed tool creates short event reminders from approved information. Its intended benefit
      is reduced drafting time for a coordinator. The manual alternative produces each reminder from the
      same approved card and takes **three minutes per card**, or **nine minutes for three**. That timing
      is a supplied comparison under fixed conditions, not measured workplace productivity.


      | Card | Approved facts | Supplied tool output |

      | --- | --- | --- |

      | R1 | Reading circle; Tuesday; 6 p.m.; Room A | Reading circle: Tuesday at 6 p.m. in Room A. |

      | R2 | Repair discussion; Wednesday; time not yet confirmed; Room B | Repair discussion: Wednesday
      at 7 p.m. in Room B. |

      | R3 | Drawing hour; Thursday; 5 p.m.; latest approved location Room D, replacing Room C | Drawing
      hour: Thursday at 5 p.m. in Room C. |


      R1 matches its card. R2 invents a time, and R3 uses an obsolete room. These are not merely stylistic
      differences. A recipient might arrive at the wrong time or place. All three outputs already exist
      as fictional paper specimens; none has been released. Discovering R2''s failure pauses release of
      the entire proposed set. Examining the already-supplied R3 specimen afterward is failure analysis,
      not continued deployment.


      The proposed use is limited to approved nonsensitive facts, a readable text version and a human
      comparison against the current card. No personal attendee data, private contact information or automatic
      sending is allowed by the case. A recipient who needs another format must have a usable route; the
      presence of text alone is not proof of accessibility. No particular accessibility standard has been
      tested here.


      ### Set the gate before counting a benefit


      Coordinator Sal owns the paper trial and its record. Sal can stop it immediately. The release condition
      is a correct current time and place, explicit uncertainty where a fact is missing, a confirmed accessible
      format for the intended audience, and authorized human review. Any exposed private data or uncorrected
      consequential falsehood at the release check stops use. In this case the R2 error triggers the gate
      before any delivery.


      The gate does not mean errors may be casually sent and repaired later. Reworking a draft is allowed
      offline, but a repaired sample is not evidence of reliable independent operation. The manual method
      stays available. Expansion would require a new authorized decision supported by a fresh trial and
      affected-user evidence, not merely absence of complaint from people who never saw the output.


      Count the full supplied effort. Draft generation takes one minute per card, **three total**. Checking
      takes one, two and three minutes, **six total**. Repair takes zero, two and two minutes, **four
      total**. Combined effort is **13 minutes**, compared with nine manually: **four more minutes**.
      The three-minute generation step is not a six-minute net saving. There are two initial substantive
      errors among three specimens, with too few cases to estimate a dependable long-run error rate.


      Corrected R2 reads: “Repair discussion: Wednesday in Room B; time to be confirmed.” Corrected R3
      reads: “Drawing hour: Thursday at 5 p.m. in Room D.” These repairs demonstrate what current facts
      support. They do not establish that the tool will use the right source version next time or that
      anyone received the reminder.


      ### Include the people and costs outside the demo


      A fictional coordinator response says the review interruptions are harder to fit into the day than
      ordinary manual drafting. Record that supplied perspective alongside the time total. An intended
      reader asks for larger text and a version that does not depend on an image; the requested format
      has not yet been evaluated by that reader. Do not convert the request into an accessibility pass.


      Displacement is uncertain: the proposal might shift a coordinator''s work from composing to checking,
      while someone else inherits troubleshooting. Maintenance needs an owner, available time and a way
      to retire obsolete templates. Energy, equipment and environmental effects are unmeasured; the paper
      exercise does not establish lower computing impact. Benefits and burdens could be distributed unevenly
      even if an average time improved.


      The provisional decision is **pause**. Revise the tool specification to preserve missing facts visibly
      and require the latest approved location version. Keep a small error log with card identifier, consequence,
      repair owner and unresolved cause. Because the cases contain no actual private data, record privacy
      controls as design requirements rather than a tested privacy result. Avoid collecting new personal
      information simply to make the evaluation look thorough.


      ### Produce the stop-or-proceed record


      1. State the task, intended benefit, manual alternative and affected roles. Map all seven effect
      areas, including unknown environmental and distributional consequences.

      2. Save the approved cards and the three unedited outputs. Check each claim against its current
      source and mark R2 and R3 errors separately.

      3. Apply the prewritten release gate at R2. Calculate all drafting, checking and repair time; explain
      why the trial does not demonstrate a net saving.

      4. Record the supplied coordinator response and reader request as fiction. Write a revised specification,
      stop owner, observation plan and conditions for a new authorized rehearsal.

      5. Open the [later packet](?resource=file-later-packet-md). Update the decision using its incomplete
      result; do not treat one repaired output as a deployment approval.


      For support, compare time and place in a two-column sheet before mapping the wider effects. For
      a harder pass, double review time while keeping draft speed constant and explain how the decision
      changes. A no-tool choice is legitimate. Actual progress would require an artifact plus independent
      observations of a permitted trial, including whose work and access changed. A hypothetical mitigation
      list alone does not show responsible deployment.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A tool drafts four items in four minutes, while review takes six and repair takes three. Manual
      completion takes ten. Did the trial save six minutes?

      2. Your release gate stops use for an invented time, but you already have three offline specimens.
      Can you examine the remaining specimens after pausing release?

      3. A corrected reminder matches its facts, but the intended reader has not evaluated the requested
      format. Can you mark the accessibility condition passed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Total tool-assisted effort is 13 minutes, three more than manual completion. Compare
      the complete task, include transferred work and keep output quality and access in the decision.

      2. Yes, as bounded failure analysis of existing specimens without delivery or continued deployment.
      Keep the pause in force and distinguish offline investigation from permission to expose an audience.

      3. No. A factually correct specimen and an untested format are different evidence. Record the missing
      access check, preserve an agreed alternative and require the relevant evidence before expansion.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
