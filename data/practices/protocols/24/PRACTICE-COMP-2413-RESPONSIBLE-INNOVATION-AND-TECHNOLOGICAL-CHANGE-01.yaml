  - c2413_a3_adverse
  adverse_or_contradictory_indicators:
  - Synthetic success was called safety approval or a real user’s privacy and access concerns were dismissed
    to accelerate deployment.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Responsible innovation and technological change explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Responsible innovation and technological
    change context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Responsible innovation and technological change observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Responsible innovation and technological change rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Map the benefit and who might bear the downside. Observed checks: Benefit
    and affected groups are specified; Labor access privacy safety and resource effects are considered;
    Measured and assumed benefits remain separate; At least one affected perspective or its absence is
    recorded honestly. Action 2: Run a synthetic trial with safeguards already in place. Observed checks:
    Three supplied cases include missing and changed facts; Safeguards precede the trial rather than follow
    a failure; Accuracy uncertainty access and total review burden are observed; A predefined unsafe result
    stops the trial. Action 3: Decide whether to revise stop or cautiously repeat. Observed checks: Benefits
    and burdens are compared rather than reported separately; Revision monitoring and stop conditions
    are assigned; Expansion requires new evidence and appropriate permission; A viable no-tool alternative
    and affected people’s concerns remain respected.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A benefit statement was written without a trial, safeguards,
    affected groups or an enforceable stop rule.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Responsible
    innovation and technological change contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
