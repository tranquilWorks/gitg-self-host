  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Responsible innovation and technological change; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Use paper mockups and a manually drafted reminder instead of software. No artificial-intelligence
      service or external upload is required. Do not test on vulnerable users, real emergencies, health,
      hiring, benefits or other high-consequence decisions without the proper specialist and institutional
      process.
    cultural_context:
    - Adapt the expression of Responsible innovation and technological change to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use paper mockups and a manually drafted reminder instead of software. No artificial-intelligence
      service or external upload is required. Do not test on vulnerable users, real emergencies, health,
      hiring, benefits or other high-consequence decisions without the proper specialist and institutional
      process.
  pause_conditions:
  - Pause Responsible innovation and technological change when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Responsible innovation and technological change practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Responsible innovation and technological change situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Business and economic education only; legal, tax, securities, employment, and regulatory questions
    require qualified advice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Responsible innovation and technological change actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
