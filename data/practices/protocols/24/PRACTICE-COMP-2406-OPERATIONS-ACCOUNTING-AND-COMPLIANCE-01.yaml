        expected: true
  - stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01-A2
    sequence: 2
    title: Run one synthetic order through the whole workflow
    instructions: 'Produce the notice from the approved text, check time, place, access instructions and
      contact accuracy, and mark approval before release. Create an invoice or receipt labeled synthetic
      and a record of whether payment is due or received. Introduce a corrected time as a test change,
      retain the superseded version internally and issue a clear replacement. Do not erase the correction
      or expose unnecessary customer information to make the packet seem thorough.


      Observation checks: The output is checked against approved source information; Approval precedes
      the simulated release; Due and received payments are not conflated; A correction remains traceable
      without unnecessary private data. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01
      action_stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01-A2
      competency_stable_id: '24.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2406_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2406_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_output_is_checked_against_approved_source_information
        - approval_precedes_the_simulated_release
        - due_and_received_payments_are_not_conflated
        - a_correction_remains_traceable_without_unnecessary_private_data
      - measurement_id: c2406_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2406_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01-A3
    sequence: 3
    title: Have another reader reconstruct the order without rescue
    instructions: 'Ask a willing reader, or perform a separated self-review after a break, to identify
      the current version, approval, amount due, delivery status and unresolved obligation. Let them use
      the packet without verbal hints. Fix the first ambiguity and repeat the affected question. State
      which real professional checks would still be needed before operating this service; a readable packet
      is only one part of lawful and reliable delivery.


      Observation checks: Five operational facts are recoverable from the packet; The walkthrough occurs
      without author coaching; A concrete ambiguity is corrected and retested; Unverified compliance remains
      open despite a successful workflow rehearsal. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Could someone continue or audit the order from the records alone, and which missing
      authority or compliance check still prevents real operation?


      Examples: Supportive: The reader found the corrected notice and unpaid invoice without help, while
      a local tax-registration question stayed explicitly open.


      Mixed: The order could be delivered but the approval trail was ambiguous and required a clearer
      version marker.


      Contradictory: A template was treated as proof of compliance or a correction was deleted to hide
      an error.


      Inconclusive: A checklist existed without a completed synthetic order, traceable records or a reconstruction
      test.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01
      action_stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01-A3
      competency_stable_id: '24.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
