      Operations, accounting, and compliance; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use accessible forms, voice records or a paper folder with the same minimal fields. A sole operator
      can use delayed self-review but should label independence limits. Do not process actual payments,
      sign terms, collect sensitive customer data or perform licensed work as a test.
    cultural_context:
    - Adapt the expression of Operations, accounting, and compliance to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use accessible forms, voice records or a paper folder with the same minimal fields. A sole operator
      can use delayed self-review but should label independence limits. Do not process actual payments,
      sign terms, collect sensitive customer data or perform licensed work as a test.
  pause_conditions:
  - Pause Operations, accounting, and compliance when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Operations, accounting, and compliance practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Operations, accounting, and compliance situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Business and economic education only; legal, tax, securities, employment, and regulatory questions
    require qualified advice.
