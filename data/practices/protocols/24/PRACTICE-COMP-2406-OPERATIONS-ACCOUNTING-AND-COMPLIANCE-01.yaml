meaning_and_fit:
  purpose: Create a repeatable delivery and record path with clear approvals, quality checks and compliance
    questions so another authorized person can understand what happened.
  why_recommended: Create a repeatable delivery and record path with clear approvals, quality checks and
    compliance questions so another authorized person can understand what happened.
  claims:
  - statement: Create a repeatable delivery and record path with clear approvals, quality checks and compliance
      questions so another authorized person can understand what happened.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Operations, accounting, and compliance practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Operations, accounting, and compliance as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible forms, voice records or a paper folder with the same minimal
    fields. A sole operator can use delayed self-review but should label independence limits. Do not process
    actual payments, sign terms, collect sensitive customer data or perform licensed work as a test.
  opportunity_considerations: Use a fictional approved event-notice order for 50 due on Friday. Prepare
    an order code, approved source text, scope and price, owner, delivery date, quality checklist, invoice
    or receipt example, correction log and retention decision. Use no actual customer identity, payment
    details or regulated service.
  prerequisites:
  - Use a fictional approved event-notice order for 50 due on Friday. Prepare an order code, approved
    source text, scope and price, owner, delivery date, quality checklist, invoice or receipt example,
    correction log and retention decision. Use no actual customer identity, payment details or regulated
    service.
  dependencies: []
  safe_alternatives:
  - Use accessible forms, voice records or a paper folder with the same minimal fields. A sole operator
    can use delayed self-review but should label independence limits. Do not process actual payments,
    sign terms, collect sensitive customer data or perform licensed work as a test.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Operations, accounting, and compliance differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Operations, accounting, and
    compliance as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional approved event-notice order for 50 due on Friday. Prepare an order code, approved
    source text, scope and price, owner, delivery date, quality checklist, invoice or receipt example,
    correction log and retention decision. Use no actual customer identity, payment details or regulated
    service. Goal: Create a repeatable delivery and record path with clear approvals, quality checks and
    compliance questions so another authorized person can understand what happened. Scope: A fictional
    order packet is an operations rehearsal, not a registered enterprise, tax filing, contract drafted
    for use or certification of legal compliance. Time and effort: Forty minutes to build the packet and
    twenty minutes for an independent walkthrough. Adaptation: Use accessible forms, voice records or
    a paper folder with the same minimal fields. A sole operator can use delayed self-review but should
    label independence limits. Do not process actual payments, sign terms, collect sensitive customer
    data or perform licensed work as a test. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible forms, voice records or a paper folder with the same minimal fields.
    A sole operator can use delayed self-review but should label independence limits. Do not process actual
    payments, sign terms, collect sensitive customer data or perform licensed work as a test.
  expected_burden: Forty minutes to build the packet and twenty minutes for an independent walkthrough.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Operations, accounting, and compliance protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Operations, accounting, and compliance action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    forms, voice records or a paper folder with the same minimal fields. A sole operator can use delayed
    self-review but should label independence limits. Do not process actual payments, sign terms, collect
    sensitive customer data or perform licensed work as a test.
  actions:
  - stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01-A1
    sequence: 1
    title: Define the order and the applicable unanswered obligations
    instructions: 'Write what will be delivered, what is excluded, who approves facts, when payment is
      due and what happens if the requester changes the scope. Make a short register of local questions
      about business registration, tax, employment, consumer terms, accessibility, privacy and any sector-specific
      permission. Assign each to an official source or qualified adviser rather than marking it compliant
      because a template exists. Record how long the fictional packet should be retained and who may see
      it.


      Observation checks: Scope price approval and payment terms are explicit; Change handling and delivery
      ownership are defined; Each compliance topic has a verification route rather than an assumed answer;
      Access and retention are decided before creating more records. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01
      action_stable_id: PRACTICE-COMP-2406-OPERATIONS-ACCOUNTING-AND-COMPLIANCE-01-A1
      competency_stable_id: '24.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2406_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2406_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - scope_price_approval_and_payment_terms_are_explicit
        - change_handling_and_delivery_ownership_are_defined
        - each_compliance_topic_has_a_verification_route_rather_than_an_assumed_answer
        - access_and_retention_are_decided_before_creating_more_records
      - measurement_id: c2406_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2406_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
