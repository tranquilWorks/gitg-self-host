  - stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01-A2
    sequence: 2
    title: Trace who benefits and who loses from a restrictive practice
    instructions: 'Choose C’s export restriction and describe effects on existing customers, potential
      entrants, workers and service quality. Write one possible legitimate justification and what evidence
      would test it, then one less restrictive way to meet that aim. Explain how predatory or exclusionary
      conduct differs from simply competing well, without asserting that the fictional facts satisfy a
      legal test. Do not contact competitors to coordinate prices, customers or market allocation.


      Observation checks: The restriction is traced across several affected groups; A possible justification
      is tested rather than dismissed or accepted automatically; A less restrictive alternative is considered;
      No illegal coordination or unsupported legal determination is proposed. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01
      action_stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01-A2
      competency_stable_id: '24.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
