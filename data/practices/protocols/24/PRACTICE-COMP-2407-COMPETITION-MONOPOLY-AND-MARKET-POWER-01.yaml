  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### A privacy reason that needs a narrower response


      In the supplied follow-up, C explains that its existing export combines the customer''s bookings
      with other groups'' contact names. The sample confirms this design problem. Releasing that file
      would expose unrelated personal data; it should not be treated as acceptable portability merely
      because the customer wants to leave.


      An authorized fictional product owner proposes an export limited to the requesting customer''s permitted
      records. A tabletop sample removes other groups'' names, but its appointment times omit the time
      zone. The export now has a reliability defect: a receiving service could schedule a booking incorrectly.
      No real file, account or system has been accessed.


      Revise the remedy to require both appropriate data scope and usable time information, with an authorized
      verification before use. Privacy protection and effective portability need separate checks. The
      demonstrated privacy flaw supports fixing that flaw; it does not establish that indefinite blanket
      blocking or venue exclusivity is necessary. Those restrictions'' scope and competitive effects remain
      unresolved.


      A retains the supplied quality rationale and B retains a plausible network advantage. Neither becomes
      legally innocent or unlawful through comparison with C. Save the failed export case and the revised
      questions, leaving actual implementation, market definition, legality and consumer benefit unproven.'
