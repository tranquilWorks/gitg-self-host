    kind: concept
    title: Learn and try
    body: 'Compare three fictional booking services to distinguish useful success, network advantage and
      potentially exclusionary conduct. Allow thirty minutes for the comparison and ten for a remedy stress
      test. The product is a mechanism-based account with uncertainties and consumer effects, not a verdict
      about an actual firm''s legality.


      ### Ask why customers choose and whether they can leave


      A service can grow because it is better, because more participants make it useful, because leaving
      is costly or because rivals are unfairly blocked. These mechanisms can coexist. Concentration describes
      how activity is distributed across firms in a defined market. It is not meaningful to assign a market-share
      percentage without specifying the relevant product, geography, time and alternatives. The supplied
      case gives no such market measurement.


      A network effect means that participation can increase value for other users. For a booking platform,
      more venues may attract bookers, while more bookers may attract venues. Switching costs include
      relearning, moving permitted data, rebuilding connections and changes to existing commitments. Some
      arise from genuine coordination or technical needs; others may be imposed to impede exit. An entry
      barrier matters when a new provider cannot readily overcome it, but identifying a barrier does not
      alone establish unlawful conduct.


      The FTC''s [monopolization explanation, S14](https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/single-firm-conduct/monopolization-defined)
      distinguishes market power and exclusionary conduct from success through merit. Its [network-economy
      speech, S15](https://www.ftc.gov/news-events/news/speeches/standard-setting-network-economy) offers
      historical conceptual discussion of network value and interoperability. The 2000 speech explicitly
      presents the speaker''s views, not a current Commission policy statement. Neither source supplies
      findings about the three invented services below, and no legal market-share threshold is imported.


      ### Supplied booking comparison P8


      Three services help community groups reserve meeting spaces. All service names, capabilities and
      reported behavior are invented. No actual competitor investigation, account access or testing occurs.


      | Service | Supplied reason users choose it | Exit, entry and uncertainty |

      | --- | --- | --- |

      | A | Clear availability, accurate confirmations and usable access information; the supplied sample
      has few correction requests | Customer-owned booking records can be exported; entry still requires
      building a reliable service. No market-share data or controlled quality comparison exists. |

      | B | Many venues and bookers already participate, making matches more likely for both sides | Customer-owned
      records have a usable export in the supplied case. A new entrant would need to attract both sides;
      some users keep a manual booking option. Network value does not itself establish abuse. |

      | C | Many venues participate, but the service blocks customer-owned record export and asks venues
      for exclusive listing | Switching may require manual reconstruction; rivals may lose access to venues.
      Scope, duration, actual effects and any justification for the restrictions are not established.
      |


      Manual booking by email or phone is a possible substitute, but its staff time, coverage and reliability
      are unknown. A is not automatically best for every user because B may offer more relevant venues.
      C''s reach may create real value while its restrictions raise separate questions. The comparison
      must keep those propositions together rather than defining every successful service as exploitative
      or every restriction as efficient.


      ### Work from conduct to consequences


      For A, the plausible mechanism is quality. Ask whether the correction sample is comparable, whether
      access information is reliable and whether price reflects the benefit. For B, the mechanism includes
      a two-sided network: losing one side can reduce usefulness to the other. Export helps move records
      but does not instantly reproduce the venue network, reputation or training. For C, record a concern
      about lock-in and restricted entry without asserting intent or legal liability.


      Who bears the consequence? Bookers may lose choice or spend time rebuilding records. Venues may
      gain demand while losing the freedom to use another channel. Workers may handle repeated manual
      requests. A new entrant may be unable to offer enough venues to compete. Consumers also care about
      price, reliability, privacy, accessibility, innovation and continuity; a nominally cheaper service
      that fails important bookings can reduce welfare.


      Low prices alone do not prove predatory conduct. Nor does a large user base establish monopoly power
      without a defensible market and competitive evidence. Capture would require evidence that public
      or institutional rules are bent toward a private interest; none is supplied here. Exploitation is
      a concern to analyze through actual burdens and constrained choices, not a label to infer from revenue.
      Keep those missing facts on the page.


      ### Compare remedies with their own costs


      A narrow possible response to C is a permitted, privacy-preserving export of the customer''s own
      booking records. It could reduce reconstruction work while protecting other people''s information.
      A broader interoperability proposal might preserve continuity across services but require common
      formats, maintenance and safeguards. Transparent cancellation or exclusivity terms could improve
      informed choice without removing the restriction itself. Independent review may be needed to assess
      actual conduct and justified limits.


      None of these suggestions is a legal order, an instruction to bypass access controls or permission
      to coordinate competitors'' prices, customers or bids. A remedy should address the mechanism, identify
      who has authority to implement it and test for new burdens. The goal is more useful, contestable
      choice without discarding legitimate privacy or reliability needs.


      ### Produce the three-case analysis


      1. Map each service to observed facts, likely mechanism and important unknowns. Separate quality,
      network value, switching cost and restriction. Do not invent a concentration measure from the fact
      that three examples are listed.

      2. Identify users, venues, workers and prospective entrants, and explain a plausible benefit and
      burden for each relevant mechanism. Include the manual alternative with its unknown costs.

      3. For C, write the specific export and exclusivity questions an authorized qualified review would
      need to answer: scope, duration, affected data, actual switching burden, alternative channels and
      claimed justification.

      4. Propose a proportionate response, its implementing authority and at least one failure mode. Explain
      why data portability alone may leave B''s network advantage intact and why a blanket export can
      expose others'' information.

      5. Save the initial comparison and open the [later packet](?resource=file-later-packet-md). Revise
      the remedy when the supplied facts reveal a real privacy problem; do not use that problem as automatic
      proof that every restriction is necessary.


      For support, classify one row at a time and use “known,” “inferred” and “unknown” explicitly. For
      a harder pass, imagine exclusivity lasting one event versus five years and identify why duration
      could alter effects without asserting a legal result. Optional actual transfer can use public terms
      you are entitled to inspect, with current sources and qualified advice where needed. No scraping,
      customer contact, internal data access or competitor coordination is required. A reasoned analysis
      plus a later evidence check could support progress; this fictional comparison establishes neither
      an actual monopoly nor the effectiveness of a proposed intervention.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Use fiction or privately redacted records; keep credentials and sensitive
      identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A platform grows because users find many venues there, and venues join because many users search
      there. What mechanism is plausible?

      2. An export would expose other customers’ names. Does that prove a permanent ban on all customer-owned
      data export is necessary?

      3. A small rival claims predatory pricing because a larger service offers a lower price. Is the
      claim established?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A two-sided network effect. It may create value and an entry challenge, but growth alone
      does not establish exclusionary conduct, monopoly power or a legal violation.

      2. No. The privacy defect justifies withholding the unsafe file, while a narrower authorized export
      may address it. Test permitted scope, usability and justified limits without bypassing access controls.

      3. No. A lower price alone is insufficient. A qualified analysis needs the relevant market, conduct,
      costs, effects and applicable law; the exercise supplies no legal finding or invitation to coordinate
      prices.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
