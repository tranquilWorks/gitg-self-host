  - stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01-A3
    sequence: 3
    title: Recommend an evidence-seeking response with limits
    instructions: 'Compare transparency, interoperability or export improvements, user switching, independent
      oversight and qualified competition advice. Select a proportionate response for the fictional case
      and state what additional fact would change it. Explain the tradeoff between preserving genuine
      innovation and preventing avoidable exclusion. A consumer-welfare claim must address price, quality,
      choice and innovation rather than assuming the cheapest option is always best.


      Observation checks: Several proportionate responses are compared; The selected response has an explicit
      revising fact; Innovation and exclusion risks are both considered; Consumer effects include quality
      choice and innovation as well as price. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which advantage comes from making the service better, which depends on preventing
      alternatives, and what evidence still separates a concern from a justified conclusion?


      Examples: Supportive: The learner preserved B’s genuine network benefit while identifying C’s export
      restriction as a concern needing market and justification evidence.


      Mixed: Lock-in was clear, but the absence of substitute and contract facts kept a legal judgment
      open.


      Contradictory: Market success was automatically called illegal or competitors were encouraged to
      coordinate prices to improve fairness.


      Inconclusive: Monopoly was used as a label without examining substitutes, barriers, conduct or effects
      on users.'
    expected_time: 15-25 minutes
