meaning_and_fit:
  purpose: Explain how competition, entry barriers, network effects, lock-in and market power affect users
    without equating success with wrongdoing or treating exclusion as ordinary value creation.
  why_recommended: Explain how competition, entry barriers, network effects, lock-in and market power
    affect users without equating success with wrongdoing or treating exclusion as ordinary value creation.
  claims:
  - statement: Explain how competition, entry barriers, network effects, lock-in and market power affect
      users without equating success with wrongdoing or treating exclusion as ordinary value creation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Competition, monopoly, and market power practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Competition, monopoly, and market power as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a familiar non-sensitive service category and public educational material.
    Avoid accusations about a real business without adequate evidence. Current competition law and remedies
    vary by jurisdiction; use a qualified authority for actual conduct, merger or contract decisions.
  opportunity_considerations: 'Use three fictional booking services: A wins users through reliable accessibility
    and low error rates; B becomes more useful as more venues join but permits usable data export; C has
    many venues and blocks exporting customer-owned schedules while imposing an exclusive-dealing term.
    No market shares or legal conclusions are supplied.'
  prerequisites:
  - 'Use three fictional booking services: A wins users through reliable accessibility and low error rates;
    B becomes more useful as more venues join but permits usable data export; C has many venues and blocks
    exporting customer-owned schedules while imposing an exclusive-dealing term. No market shares or legal
    conclusions are supplied.'
  dependencies: []
  safe_alternatives:
  - Use a familiar non-sensitive service category and public educational material. Avoid accusations about
    a real business without adequate evidence. Current competition law and remedies vary by jurisdiction;
    use a qualified authority for actual conduct, merger or contract decisions.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Competition, monopoly, and market power differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Competition, monopoly, and
    market power as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three fictional booking services: A wins users through reliable accessibility and low error
    rates; B becomes more useful as more venues join but permits usable data export; C has many venues
    and blocks exporting customer-owned schedules while imposing an exclusive-dealing term. No market
    shares or legal conclusions are supplied. Goal: Explain how competition, entry barriers, network effects,
    lock-in and market power affect users without equating success with wrongdoing or treating exclusion
    as ordinary value creation. Scope: The cases teach economic and ethical analysis, not an antitrust
    ruling. Legal market definition, power and unlawful conduct require fact-specific qualified analysis.
    Time and effort: Thirty minutes to map three cases and fifteen minutes to compare possible remedies.
    Adaptation: Use a familiar non-sensitive service category and public educational material. Avoid accusations
    about a real business without adequate evidence. Current competition law and remedies vary by jurisdiction;
    use a qualified authority for actual conduct, merger or contract decisions. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a familiar non-sensitive service category and public educational material.
    Avoid accusations about a real business without adequate evidence. Current competition law and remedies
    vary by jurisdiction; use a qualified authority for actual conduct, merger or contract decisions.
  expected_burden: Thirty minutes to map three cases and fifteen minutes to compare possible remedies.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Competition, monopoly, and market power protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Competition, monopoly, and market power action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a familiar
    non-sensitive service category and public educational material. Avoid accusations about a real business
    without adequate evidence. Current competition law and remedies vary by jurisdiction; use a qualified
    authority for actual conduct, merger or contract decisions.
  actions:
  - stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01-A1
    sequence: 1
    title: Map value and switching options for each service
    instructions: 'For each case, identify the benefit to users, available substitutes, cost of switching,
      barriers facing a new entrant and whether scale itself improves the service. Distinguish A’s quality
      advantage from B’s network effect and C’s potential lock-in. Ask what evidence would establish a
      relevant market and durable power; a large user count or high price alone does not settle the legal
      question.


      Observation checks: Quality network effects and lock-in are distinguished; Substitutes switching
      costs and entry barriers are considered; User benefit is retained even when power raises concern;
      Missing market and power evidence prevents a legal verdict. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01
      action_stable_id: PRACTICE-COMP-2407-COMPETITION-MONOPOLY-AND-MARKET-POWER-01-A1
      competency_stable_id: '24.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
