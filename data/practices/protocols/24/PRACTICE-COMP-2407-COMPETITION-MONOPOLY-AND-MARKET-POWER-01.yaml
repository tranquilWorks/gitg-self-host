        criteria:
        - quality_network_effects_and_lock_in_are_distinguished
        - substitutes_switching_costs_and_entry_barriers_are_considered
        - user_benefit_is_retained_even_when_power_raises_concern
        - missing_market_and_power_evidence_prevents_a_legal_verdict
      - measurement_id: c2407_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
