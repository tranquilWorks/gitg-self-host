meaning_and_fit:
  purpose: Evaluate adequacy, access, incentives, dignity and sustainability when comparing universal,
    contributory and means-tested forms of social protection.
  why_recommended: Evaluate adequacy, access, incentives, dignity and sustainability when comparing universal,
    contributory and means-tested forms of social protection.
  claims:
  - statement: Evaluate adequacy, access, incentives, dignity and sustainability when comparing universal,
      contributory and means-tested forms of social protection.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Social insurance and welfare-state design practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Social insurance and welfare-state design as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use local official examples only with dates and clear jurisdiction labels.
    Personal eligibility, benefit cliffs and appeals require current qualified assistance. Never ask a
    participant to disclose health or income records or submit a false claim for practice.
  opportunity_considerations: A fictional pool collects 10 from each of 200 participants. Twenty claims
    of 80 and administration of 200 occur in the base period. The stress period has 35 claims of 80 with
    the same receipts and administration. Compare this contributory pool with a universal payment and
    a means-tested payment whose detailed financing and rules are deliberately unspecified.
  prerequisites:
  - A fictional pool collects 10 from each of 200 participants. Twenty claims of 80 and administration
    of 200 occur in the base period. The stress period has 35 claims of 80 with the same receipts and
    administration. Compare this contributory pool with a universal payment and a means-tested payment
    whose detailed financing and rules are deliberately unspecified.
  dependencies: []
  safe_alternatives:
  - Use local official examples only with dates and clear jurisdiction labels. Personal eligibility, benefit
    cliffs and appeals require current qualified assistance. Never ask a participant to disclose health
    or income records or submit a false claim for practice.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Social insurance and welfare-state design differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Social insurance and welfare-state
    design as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'A fictional pool collects 10 from each of 200 participants. Twenty claims of 80 and administration
    of 200 occur in the base period. The stress period has 35 claims of 80 with the same receipts and
    administration. Compare this contributory pool with a universal payment and a means-tested payment
    whose detailed financing and rules are deliberately unspecified. Goal: Evaluate adequacy, access,
    incentives, dignity and sustainability when comparing universal, contributory and means-tested forms
    of social protection. Scope: The fictional pool and eligibility cases teach policy tradeoffs, not
    current benefit rules or personal eligibility. No enrollment, claim or contribution is made. Time
    and effort: Thirty minutes for the pool and design comparison, plus twenty minutes for an access stress
    test. Adaptation: Use local official examples only with dates and clear jurisdiction labels. Personal
    eligibility, benefit cliffs and appeals require current qualified assistance. Never ask a participant
    to disclose health or income records or submit a false claim for practice. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use local official examples only with dates and clear jurisdiction labels. Personal
    eligibility, benefit cliffs and appeals require current qualified assistance. Never ask a participant
    to disclose health or income records or submit a false claim for practice.
  expected_burden: Thirty minutes for the pool and design comparison, plus twenty minutes for an access
    stress test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Social insurance and welfare-state design protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Social insurance and welfare-state design action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use local official
    examples only with dates and clear jurisdiction labels. Personal eligibility, benefit cliffs and appeals
    require current qualified assistance. Never ask a participant to disclose health or income records
    or submit a false claim for practice.
  actions:
  - stable_id: PRACTICE-COMP-2411-SOCIAL-INSURANCE-AND-WELFARE-STATE-DESIGN-01-A1
    sequence: 1
    title: Calculate adequacy and sustainability separately
    instructions: 'Calculate receipts of 2,000, base claims of 1,600 and total base spending of 1,800,
      leaving 200. Under 35 claims, spending becomes 3,000 and the shortfall is 1,000. Explain that a
      solvent pool can still provide inadequate support, while adequate individual payments may need additional
      financing. Identify the risk covered and distinguish unemployment, health, disability, retirement
      and family-support needs rather than assuming one benefit solves all of them.


      Observation checks: Receipts base balance and stress shortfall are correct; Adequacy and financing
      are treated as separate questions; Different protected risks are distinguished; The model does not
      assume stable claim rates or unlimited funds. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2411-SOCIAL-INSURANCE-AND-WELFARE-STATE-DESIGN-01
      action_stable_id: PRACTICE-COMP-2411-SOCIAL-INSURANCE-AND-WELFARE-STATE-DESIGN-01-A1
      competency_stable_id: '24.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
