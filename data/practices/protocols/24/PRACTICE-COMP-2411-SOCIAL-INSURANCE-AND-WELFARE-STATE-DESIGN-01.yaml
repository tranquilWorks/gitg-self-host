  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### An accessible step, followed by an incomplete outcome


      The fictional desk receives budget authorization for the extra 40 units and offers N the requested
      appointment format. N consents to reuse of the existing record for this application. The application
      is accepted for assessment without the repeated request. These events improve access; they do not
      establish eligibility.


      A later supplied assessment notice approves an 80-unit benefit after the team''s separate verification.
      The payment has **not yet been received**. Record the stages as application accepted and decision
      issued, with receipt still pending. Do not count 80 as available money or claim the 110-unit need
      has been met.


      If payment arrives in full, the stated need still exceeds it by **30**. The next permitted action
      is an inquiry to the payment team about status, the expected date and an accessible review route
      if needed. No date or remedy is promised here. Keep N''s consent and avoid sending unrelated personal
      records.


      The intervention cost changes the initial balance to **160** and the stress shortfall to **1,040**.
      Neither the accessible appointment nor approval resolves the stress financing gap. A process improvement
      and unresolved adequacy and sustainability can coexist. All events are supplied fiction; no actual
      application, appeal or benefit receipt occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Design support around a risk, the people who can actually reach it, and a credible financing
      account. Allow thirty minutes for the pool and design comparison, plus twenty for an access stress
      test. The output is a design comparison and an access improvement, not a judgment about who deserves
      care.


      ### Name the risk before choosing the program


      Unemployment support addresses an interruption in earnings; health protection addresses access to
      care and its costs; disability support may address extra costs, barriers or reduced earnings; retirement
      provision addresses income across later life; family support may address care and child-related
      costs. These risks overlap without being interchangeable. A program can pay a benefit promptly and
      still leave its recipient unable to meet the particular need it was intended to cover.


      The ILO''s [social-protection overview, S06](https://www.ilo.org/topics-and-sectors/social-protection)
      describes life-course risks and contributory and tax-financed arrangements. This exercise uses a
      fictional pool rather than any country''s benefit rules. It does not establish entitlement, a filing
      deadline or a recommended contribution rate. Coverage, benefit size and funding are separate design
      decisions.


      A contributory arrangement connects eligibility to specified contributions or insurance conditions.
      A universal program includes everyone in a defined population under its stated rules, not necessarily
      everyone everywhere. A means-tested program uses a specified income or resource test. Real systems
      often combine these approaches. Universal coverage does not make funding unnecessary, and a resource
      test does not automatically identify every person in need.


      ### Supplied pool S8


      S8 models temporary earnings loss associated with unemployment. The exact covered-event and eligibility
      tests remain unspecified, so this label does not decide N''s entitlement. There are **200 participants**,
      each contributing **10 units** for one fictional period. Income is **2,000**. In the initial scenario,
      **20 valid claims** each receive **80**, costing **1,600**. Administration costs **200**, leaving
      **200**. No investment return, external subsidy, starting reserve or future liability is supplied.


      The stress scenario has **35 valid claims** at the same benefit and administration cost: **2,800
      + 200 = 3,000**, leaving a **1,000 shortfall**. A positive initial balance does not establish long-term
      sustainability. Nor does the shortfall prove that recipients should receive less; contribution changes,
      broader financing, reserves and revised commitments have different distributional and practical
      consequences.


      One applicant''s stated necessary loss is **110 units** for the covered period. Even if the full
      80 arrives on time, **30 remains uncovered**. Adequacy therefore differs from whether the program
      can pay its promises. The loss is a supplied case assumption, not a needs assessment of a real person.
      Do not generalize one applicant''s costs to all participants.


      ### Compare three designs on the same questions


      | Design | Access and information | Financing and incentives | Dignity and practical limits |

      | --- | --- | --- | --- |

      | Contributory pool | Explain required contribution history and covered event; interrupted work
      may leave gaps | The S8 arithmetic applies only to this pool; pooling does not remove correlated
      losses | Obtain necessary records once where permitted; contribution history is not a measure of
      human worth |

      | Universal support within a defined population | Membership rules still need clear communication
      and an accessible application or enrollment route | Identify the tax or other funding base; do not
      import S8''s 200 contributions as its budget | Fewer resource tests may reduce disclosure, but language,
      identity documentation and payment barriers can remain |

      | Means-tested support | State which resources and periods count, and how variable earnings are
      handled | Benefit withdrawal may change the gain from additional earnings; the actual schedule is
      needed to assess it | Repeated sensitive documentation can burden applicants; verify relevant facts
      without treating poverty as suspicion |


      None wins every column by definition. Compare adequacy, access, incentives, dignity and sustainability
      explicitly. For example, a simpler process may improve take-up but require administrative investment;
      a sharp eligibility cutoff may create different incentives from a gradual withdrawal. Do not assert
      a benefits cliff without the rules that produce one. A larger nominal benefit may be less useful
      if it arrives after the relevant expense or cannot be accessed.


      ### Follow a complete application journey


      Applicant N has variable earnings, a disability-related access need and limited capacity for repeated
      forms. N needs an accessible appointment format and has already supplied one relevant earnings record.
      N''s contribution history and entitlement are not established. The fictional program card assigns
      the service desk responsibility for information and assisted submission, an assessment team responsibility
      for verification and decisions, a payment team responsibility for disbursement, and a separate review
      contact for appeals. The desk cannot promise approval.


      The ordinary journey is information, application, verification, decision, payment and review or
      appeal if needed. At each stage record what N needs to know, which office owns the next action,
      what evidence is required and whether the stage has actually occurred. A completed form is not a
      decision, and an approval letter is not money received. No statutory deadline is supplied; asking
      for an expected date is different from inventing one.


      The current form requests the same earnings record again without explaining whether the first copy
      was retained. N cannot use the offered appointment format. The proposed improvement is a desk-assisted
      appointment in N''s chosen accessible format, with permission to reuse the existing record for this
      application if program rules allow. Record the consent and purpose, avoid retaining unrelated documents,
      and let N choose another route. Necessary verification and an appeal route remain available. Reusing
      an authenticated record with consent can reduce duplication without removing the control against
      false or mismatched evidence; whether the retained record is current still needs checking. Track
      the share of eligible applicants who actually receive payment, the interval from submission to receipt,
      and whether payment meets the covered need. For N, record the actual receipt date and amount if
      established; do not invent either from an approval notice.


      The desk estimates **40 additional administrative units** for the improvement across the modeled
      period. If approved, administration becomes **240**. The initial balance would fall to **160**;
      the stress shortfall would grow to **1,040**. Reduced repeat requests might save time later, but
      no savings are measured yet. Better access should be evaluated alongside its cost, rather than portrayed
      as automatically free.


      ### Produce a defensible improvement record


      1. Name the covered risk and distinguish it from the other four risks above. Explain what the 80-unit
      benefit addresses and what it leaves uncertain.

      2. Recalculate initial and stress budgets, including the proposed 40-unit administration change.
      Keep adequacy and solvency in separate fields.

      3. Complete the three-design comparison with one benefit, one burden and one unanswered question
      per design. Identify who would need to supply missing eligibility, funding and withdrawal rules.

      4. Map N''s journey and choose the repeated-document and appointment barriers as the intervention.
      Write the responsible desk role, consent condition, budget decision and next observable stage.

      5. Save the proposal, then open the [later packet](?resource=file-later-packet-md). Separate the
      stages achieved from receipt and adequacy. Revise the next action without asking for unnecessary
      private history.


      For support, use six cards for the journey and move a marker only when a supplied event establishes
      completion. For a harder pass, add a second applicant with irregular contribution history and explain
      why one accessible appointment cannot resolve a coverage exclusion. If working with a real public
      information page, record the jurisdiction and current official route; do not submit a claim or collect
      another person''s records as part of this practice.


      Progress would pair an actual design artifact with independent evidence of how an authorized process
      works for its intended users. A useful access proposal does not demonstrate a functioning welfare
      state, an individual''s entitlement or a sustainable funding settlement. The supplied case permits
      careful practice while keeping those larger claims open.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A pool has 150 members paying 12 each, pays 25 claims of 70, and spends 150 on administration.
      Is it solvent for this period under those assumptions?

      2. A universal program eliminates an income test. Does that guarantee everyone eligible can receive
      support?

      3. An approval notice promises 90 against a stated 120 need, but no payment has arrived. What can
      you record?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Income is 1,800; claims and administration total 1,900, giving a 100-unit shortfall before
      any unspecified reserve or subsidy. Whether 70 is adequate is a separate question about covered
      need.

      2. No. Defined-population rules, information, documentation, language, application format and payment
      access can still exclude people in practice. Inspect the actual journey and receipt, not the label
      alone.

      3. Approval is established in the scenario; receipt is not. If all 90 arrives, 30 remains uncovered.
      Do not treat an approved amount as received or confuse a process milestone with adequacy.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
