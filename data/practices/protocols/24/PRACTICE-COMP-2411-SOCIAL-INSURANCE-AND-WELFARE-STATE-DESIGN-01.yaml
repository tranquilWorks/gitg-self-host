  - stable_id: PRACTICE-COMP-2411-SOCIAL-INSURANCE-AND-WELFARE-STATE-DESIGN-01-A3
    sequence: 3
    title: Test the design on an overlooked applicant
    instructions: 'Use a fictional applicant with variable earnings, a disability-related access need
      and limited ability to complete repeated forms. Walk through information, application, verification,
      decision, payment and appeal. Propose one concrete improvement, such as an accessible assisted route
      or less duplicative evidence, then examine fraud-control, cost and privacy implications. Choose
      a conditional design improvement and a measure of take-up or timely receipt, not merely the number
      of applications started.


      Observation checks: The applicant’s journey includes decision payment and appeal; An access barrier
      is identified at a specific step; A concrete remedy includes its cost or control tradeoff; Success
      concerns actual receipt and adequacy rather than only application volume. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which person could remain unprotected even when the program’s headline budget balances,
      and how would the proposed change make that failure visible?


      Examples: Supportive: The learner separated the pool’s financing gap from payment adequacy and redesigned
      an inaccessible verification step while retaining audit and privacy questions.


      Mixed: A universal option reduced eligibility burden but left financing unresolved, so no final
      recommendation was claimed.


      Contradictory: Applicants were stereotyped as fraudulent or fictional calculations were used to
      promise a real person benefits.


      Inconclusive: Program labels were compared without arithmetic, access steps, adequacy or sustainability
      tradeoffs.'
    expected_time: 15-25 minutes
    due_within_days: 10
