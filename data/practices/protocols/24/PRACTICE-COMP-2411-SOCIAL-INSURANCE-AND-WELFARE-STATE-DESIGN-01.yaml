  - stable_id: PRACTICE-COMP-2411-SOCIAL-INSURANCE-AND-WELFARE-STATE-DESIGN-01-A2
    sequence: 2
    title: Compare three designs using the same questions
    instructions: 'For contributory, universal and means-tested approaches, ask who is eligible, how people
      learn about and claim support, what contributions or taxes finance it, how benefits change with
      earnings and what dignity or privacy costs arise. Do not fill missing rules with stereotypes. Identify
      a possible exclusion in each design and a possible administrative or incentive tradeoff. State what
      evidence would show whether the intended population actually receives adequate support.


      Observation checks: All three designs are compared on common criteria; Eligibility access financing
      and earnings interactions are considered; Privacy dignity and administrative burden remain visible;
      Missing program details are not replaced with ideological assumptions. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2411-SOCIAL-INSURANCE-AND-WELFARE-STATE-DESIGN-01
