meaning_and_fit:
  purpose: Find out whether a specific problem is real, recurring, costly and poorly served through evidence
    from actual users or buyers rather than agreement with a pitch.
  why_recommended: Find out whether a specific problem is real, recurring, costly and poorly served through
    evidence from actual users or buyers rather than agreement with a pitch.
  claims:
  - statement: Find out whether a specific problem is real, recurring, costly and poorly served through
      evidence from actual users or buyers rather than agreement with a pitch.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Customer discovery and problem validation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Customer discovery and problem validation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible written or asynchronous interviews with the same neutral questions.
    A supplied fictional three-person case can rehearse analysis but does not substitute for actual discovery.
    Avoid minors, vulnerable groups, employer-confidential problems or regulated settings without proper
    permission and safeguards.
  opportunity_considerations: 'Use the hypothesis that volunteer organizers struggle to keep event instructions
    current. Prepare five questions: last occurrence, current workaround, consequence, frequency and who
    decides or pays for a solution. Recruit willing relevant adults through an appropriate existing connection;
    do not pressure subordinates, customers or strangers or imply that participation buys access.'
  prerequisites:
  - 'Use the hypothesis that volunteer organizers struggle to keep event instructions current. Prepare
    five questions: last occurrence, current workaround, consequence, frequency and who decides or pays
    for a solution. Recruit willing relevant adults through an appropriate existing connection; do not
    pressure subordinates, customers or strangers or imply that participation buys access.'
  dependencies: []
  safe_alternatives:
  - Use accessible written or asynchronous interviews with the same neutral questions. A supplied fictional
    three-person case can rehearse analysis but does not substitute for actual discovery. Avoid minors,
    vulnerable groups, employer-confidential problems or regulated settings without proper permission
    and safeguards.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Customer discovery and problem validation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Customer discovery and problem
    validation as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the hypothesis that volunteer organizers struggle to keep event instructions current. Prepare
    five questions: last occurrence, current workaround, consequence, frequency and who decides or pays
    for a solution. Recruit willing relevant adults through an appropriate existing connection; do not
    pressure subordinates, customers or strangers or imply that participation buys access. Goal: Find
    out whether a specific problem is real, recurring, costly and poorly served through evidence from
    actual users or buyers rather than agreement with a pitch. Scope: Three interviews are a small discovery
    sample, not statistical market validation, paid demand or permission to gather sensitive data. No
    sales commitment is sought. Time and effort: Fifteen minutes to prepare, three willing ten-minute
    conversations and a twenty-minute synthesis. Adaptation: Use accessible written or asynchronous interviews
    with the same neutral questions. A supplied fictional three-person case can rehearse analysis but
    does not substitute for actual discovery. Avoid minors, vulnerable groups, employer-confidential problems
    or regulated settings without proper permission and safeguards. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible written or asynchronous interviews with the same neutral questions.
    A supplied fictional three-person case can rehearse analysis but does not substitute for actual discovery.
    Avoid minors, vulnerable groups, employer-confidential problems or regulated settings without proper
    permission and safeguards.
  expected_burden: Fifteen minutes to prepare, three willing ten-minute conversations and a twenty-minute
    synthesis.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Customer discovery and problem validation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Customer discovery and problem validation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    written or asynchronous interviews with the same neutral questions. A supplied fictional three-person
    case can rehearse analysis but does not substitute for actual discovery. Avoid minors, vulnerable
    groups, employer-confidential problems or regulated settings without proper permission and safeguards.
  actions:
  - stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01-A1
    sequence: 1
    title: Predeclare the problem and what would disconfirm it
    instructions: 'Write the user group, the exact recurring difficulty and why you think it matters.
      List two observations that would weaken the idea, such as an existing reliable workaround or the
      problem occurring too rarely to justify change. Prepare neutral questions about past behavior, not
      whether the person likes your imagined product. Decide what minimal notes are permitted and how
      to omit identities, private details and recordings unless separately and freely authorized.


      Observation checks: The hypothesis specifies user problem and consequence; Two disconfirming observations
      are declared in advance; Questions ask about past behavior rather than praise for an idea; Consent
      and minimal note boundaries are explicit. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01
      action_stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01-A1
      competency_stable_id: '24.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2404_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2404_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_hypothesis_specifies_user_problem_and_consequence
        - two_disconfirming_observations_are_declared_in_advance
        - questions_ask_about_past_behavior_rather_than_praise_for_an_idea
        - consent_and_minimal_note_boundaries_are_explicit
      - measurement_id: c2404_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2404_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01-A2
    sequence: 2
    title: Conduct the conversations without selling the answer
    instructions: 'Ask the five prepared questions of three willing relevant people, allowing not applicable
      and decline. Request a concrete recent example and distinguish what was experienced from an opinion
      about the future. Clarify whether the user and buyer are the same person. Do not defend the idea,
      promise a solution or turn a compliment into a commitment. If fewer interviews occur, keep the actual
      sample size visible instead of inventing the missing voices.


      Observation checks: Actual sample size and participation remain honest; Each conversation seeks
      a recent example and workaround; User and buyer roles are checked; The interviewer does not pitch
      pressure or convert praise into demand. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01
      action_stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01-A2
      competency_stable_id: '24.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2404_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2404_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - actual_sample_size_and_participation_remain_honest
        - each_conversation_seeks_a_recent_example_and_workaround
        - user_and_buyer_roles_are_checked
        - the_interviewer_does_not_pitch_pressure_or_convert_praise_into_demand
      - measurement_id: c2404_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2404_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01-A3
    sequence: 3
    title: Change the offer or the decision from the evidence
    instructions: 'Make a three-row evidence comparison with recurrence, cost, workaround quality and
      decision authority. Identify a pattern, a contradiction and a major missing group or bias in the
      sample. Choose to narrow the problem, change the offer, seek a different group or stop. State one
      observable next test, such as a freely accepted prototype-use session, and what result would change
      the decision again. No market-size or revenue claim follows from these interviews alone.


      Observation checks: The synthesis includes contradiction as well as a pattern; Sampling limits and
      a missing perspective are named; The offer or next decision changes explicitly from evidence; The
      next test has an observable result and no invented demand. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What did the interviews make less certain, and what changed in the offer because of
      something a participant actually experienced?


      Examples: Supportive: Two organizers already had a working system while one described a specific
      update failure, leading to a narrower problem and a small prototype test.


      Mixed: All three liked the idea, but none described a costly recent event, so demand remained unvalidated.


      Contradictory: Leading questions manufactured agreement or invented interviews were used to claim
      market proof.


      Inconclusive: Conversation notes were collected without a specific hypothesis, disconfirmation or
      a changed next decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01
      action_stable_id: PRACTICE-COMP-2404-CUSTOMER-DISCOVERY-AND-PROBLEM-VALIDATION-01-A3
      competency_stable_id: '24.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
