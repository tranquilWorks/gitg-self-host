  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### A prototype exposes another version risk


      After the three supplied discovery records, a separate invented prototype task gives A a dated change
      note and the current meeting notice. The note repeats the meeting time. When the current notice
      is corrected again, the note''s copied time becomes stale. One fictional reader follows the copied
      time instead of checking the current notice. The prototype has recreated the original version problem.


      Revise the note to identify that the time changed and point to the current approved notice without
      duplicating the time. Name who updates the pointer if the approved source moves. A is willing to
      consider this smaller form, but no later reader task has yet been run. Do not turn willingness to
      consider into measured improvement or a sale.


      The discovery conclusion remains narrow: A''s recurring version confusion is a candidate problem,
      B has a satisfactory alternative and C''s issue is approval delay. This later task is a fourth supplied
      interaction of a different kind, not an extra initial interview and not actual field research.


      Save the failed prototype and changed design. The new form''s usability, maintenance burden, buyer
      support and repeated benefit remain unverified. The correct decision is another bounded test or
      a stop, not a claim that customer discovery has proved demand for a new app.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Test a problem hypothesis with three contrasting interview records before deciding what to
      build. Allow thirty minutes for the supplied interviews and ten for a narrower follow-up. The intended
      product is a changed offer linked to evidence, including evidence that the original idea is unnecessary
      for some users.


      ### Ask what happened before asking for endorsement


      Discovery investigates a person''s situation and current behavior. Selling asks them to accept an
      offer. Mixing the two can turn polite encouragement into apparent validation. Begin with a recent
      instance, the workaround, its consequences, frequency and who can decide to buy or change the process.
      A problem can be annoying but rare, common but cheap to solve, or experienced by a user who has
      no purchasing authority.


      Predeclare what would weaken the idea. In this case, a satisfactory existing method and an infrequent,
      low-cost problem both count against a broad new tool. A third possibility is that the apparent formatting
      problem is actually an approval problem. If every answer can be interpreted as a reason to build
      the original proposal, the interview has no power to change your mind.


      The SBA [market-research material, S10](https://www.sba.gov/counseling/plan-your-business/) supports
      direct inquiry alongside alternatives and demand. GOV.UK''s [interview guidance, S16](https://www.gov.uk/service-manual/user-research/using-in-depth-interviews)
      supports neutral questions and concrete experiences with consent. These sources inform the method,
      not the results. The three complete records below are invented; they cannot be presented as actual
      customer interviews or real evidence of market demand.


      ### Define the initial hypothesis and questions


      The proposed audience is volunteer coordinators who share event updates. The initial offer is a
      new app to create and distribute every notice. The hypothesis says coordinators repeatedly lose
      time because their existing notice tools are inadequate. Before reading the records, write two disconfirmers:
      a current method already works well, or problems occur too rarely to justify switching. Also identify
      the assumption that coordinators can approve a purchase; it has not been tested.


      Use these five neutral questions, allowing clarification without pitching:


      1. Tell me about the last time an event update had to reach your group. What happened?

      2. What did you use, and how did you decide it was the current version?

      3. What difficulty, if any, occurred, and what did it cost in time or consequences?

      4. How often has a similar situation happened recently?

      5. Who can approve a change to this process or spending on it, and what would they need to know?


      An actual introduction would explain the purpose, voluntary participation, what notes are kept and
      the right to skip or stop. Do not record names, contact details or sensitive organizational records
      when a minimal anonymous note will answer the research question. Consent to an interview is not
      consent to receive marketing.


      ### Three supplied interview records D6


      | Record | Recent event and workaround | Cost and frequency | Decision authority and implication
      |

      | --- | --- | --- | --- |

      | A | Last Tuesday a weekly coordinator emailed a revised meeting time; three readers used an older
      attachment. The coordinator manually replied with the new version. | About 20 minutes on that occasion;
      similar version confusion in three of the last four weeks. | Coordinator can change wording but
      spending requires a treasurer''s approval. A recurring version problem is plausible; purchase authority
      is absent. |

      | B | Last month''s coordinator changed a single shared webpage and linked it from the usual message.
      Readers used the updated page. | No reported correction time; one routine monthly update. | Coordinator
      can maintain the page without buying a tool. The existing method appears sufficient for this case.
      |

      | C | At a quarterly activity, the coordinator waited for an approver to confirm the room; once
      approved, the existing template was easy to update. | Ten minutes of chasing on that occasion; no
      formatting difficulty reported. | Venue lead approves room facts; coordinator cannot bypass that
      role. The problem concerns approval timing rather than a new authoring tool. |


      These summaries supply all five question areas. They are not quotes from real volunteers. The sample
      is tiny and convenience-selected; no representativeness, response rate or market size is established.
      The perspective of an actual spending approver is missing, as are organizers outside this small
      convenience group. Do not report “three of three want the app”: none was asked to purchase it, B
      supplies contrary evidence and C points to a different mechanism.


      ### Change the offer because of the evidence


      A defensible revision narrows the target to coordinators with recurrent attachment-version confusion,
      like A. Instead of an app for all notices, propose a dated change note that directs readers to the
      organizer''s existing approved current source. Preserve the approval process and existing channel.
      The intended benefit is reducing old-version use; the offer must not create a second competing source
      of truth.


      The note''s fields are event identifier, change date, what changed, current-source location and
      facts approver. Do not fill an absent source URL with an invented live link. For this supplied case
      the source is an approved fictional “current meeting notice” card. A prototype can be tested on
      that card without buying software or contacting anyone.


      B should not be pressured into adopting the offer just to improve the success count. C may need
      an earlier approval deadline or an authorized backup approver, but those changes belong to the organization
      and require legitimate agreement. The new offer is therefore a hypothesis for A''s situation, not
      a validated business model. Price, buyer interest, repeated benefit and ongoing upkeep remain unknown.


      ### Produce the discovery record


      1. Save the original problem hypothesis, audience, buyer assumption and disconfirmers before interpreting
      the interviews. Keep “a new app” identifiable as an initial solution assumption.

      2. Map each record to recent behavior, workaround, cost, frequency and authority. Mark estimates
      as reported figures in the fiction, not objective measurements you collected.

      3. Identify which evidence supports, weakens or redirects the hypothesis. Preserve B and C in the
      record; do not recode them as potential buyers merely because they coordinate events.

      4. Write the narrower offer and explain the exact evidence that changed it. Specify the smallest
      task that could reveal whether it helps, plus the permission and maintenance requirements.

      5. Save a limited conclusion and open the [later packet](?resource=file-later-packet-md). Keep later
      prototype observation separate from the three discovery interviews and from any actual purchasing
      evidence.


      For support, annotate one record at a time using the five question headings. For a harder pass,
      ask what would happen if A''s treasurer refused any new ongoing cost. The appropriate response may
      be a free workflow change or no offer, not calling the refusal irrational.


      Optional actual transfer means three willing conversations with current or likely users and an honest
      count of those completed. Two interviews cannot become three through reconstruction. Keep notes
      minimal, avoid pressured participants and do not send outreach from this lesson without authorization.
      Actual user or buyer evidence that changes an offer could support the canonical progress statement;
      this authored practice supplies method and contrast while leaving actual discovery pending.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Use fiction or privately redacted records; keep credentials and sensitive
      identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Three people say “nice idea” after a product pitch, but provide no recent example. Is the problem
      validated?

      2. A user reports a frequent problem but says only a committee can approve spending. What must remain
      separate?

      3. You planned three interviews, completed two and one invitee declined. How should the record read?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Polite endorsement after a pitch is weak evidence of behavior, cost, frequency or demand.
      Use neutral questions about actual recent instances and retain answers that weaken the idea.

      2. User pain and purchasing authority. Record the problem evidence while leaving buyer willingness,
      process and budget unverified. The user cannot be treated as an authorized customer commitment.

      3. Two completed interviews and one declined invitation. Preserve the refusal without pressure;
      use the actual sample’s limits. Do not invent the third response or relabel the supplied fiction
      as fieldwork.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
