  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Not yet, with an observable practice step


      In the supplied rehearsal, the manager says “not yet” and asks Ren to show two correctly maintained
      small task ledgers before a review in four weeks. This is an invented response, not an actual performance
      agreement or a guarantee of higher pay. Ren would need to clarify workload, authority and whether
      the task is appropriately supported in a real workplace.


      For the next fictional ledger event, an existing 20-unit support item is canceled before commitment.
      The approved plan becomes **40 + 30 = 70**, leaving **30** under the 100 ceiling. The proposed extra
      15 remains pending until separately approved. Ren records the cancellation and preserves the original
      plan rather than overwriting it. After the case''s authorized approver explicitly approves the extra,
      planned cost becomes **85**, leaving **15**. No purchase or payment occurs.


      Ren catches the difference between released budget and permission to use it. This supplies one changed
      ledger exercise, not the manager''s requested two completed workplace examples. The compensation
      decision and hypothetical move remain unresolved; the alternative''s missing benefits, taxes and
      travel time are still missing.


      Retain a next practice date and a four-week review question. Do not convert a specific development
      request into a promise of a raise, or describe the fictional manager as an independent actual reviewer.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Connect an earnings request to useful capability and compare mobility with the time and costs
      it would require. Allow thirty minutes for the evidence and rehearsal, then a short later practice
      review. A larger headline salary is one input to a career decision, not proof that a move improves
      someone''s life.


      ### Make the value claim inspectable


      An earnings case is stronger when it identifies work delivered, who benefited, the limits of the
      evidence and a capability worth developing next. “I deserve more” may express a legitimate concern
      but does not explain the role, market or request. Conversely, useful work does not guarantee a particular
      employer''s budget or compensation decision. Negotiation requires a request and response, not a
      promise that confidence will produce a raise.


      Compare roles using duties, scope, location, qualifications, hours, travel, benefits and the costs
      of changing. Titles can hide different work. A national occupational profile can reveal relevant
      duties; it cannot establish a local vacancy, a personal offer or a guaranteed wage. Income growth
      can come from stronger capability, better market positioning or a better fit between work and compensation,
      with real tradeoffs in training and mobility.


      Two inspected public role descriptions provide a bounded comparison: BLS [administrative assistants,
      S08](https://www.bls.gov/ooh/office-and-administrative-support/secretaries-and-administrative-assistants.htm)
      and [project management specialists, S09](https://www.bls.gov/ooh/business-and-financial/project-management-specialists.htm).
      Both include coordination, but the latter profile describes broader budget, staffing and project
      responsibilities. Their typical preparation and work patterns differ. This is a comparison of overlapping
      duties, not evidence that the roles are interchangeable or deserve a particular pay ratio. No national
      median is used as a personal offer.


      ### Supplied work record C5


      Ren works in administrative scheduling. All figures and outcomes below are invented. An authorized,
      redacted work record would be needed for an actual attempt; do not upload employer or client information
      here.


      | Delivered outcome | Supplied evidence | Benefit and limit |

      | --- | --- | --- |

      | Reduced missed handoffs in a weekly booking process | Before: 6 missed handoffs in 40 bookings;
      after: 2 in 40, from the fictional team log | Four fewer recorded misses; periods may differ and
      no causal trial was conducted |

      | Made a handover checklist usable during absence | Substitute completed 8 of 10 stated tasks; two
      needed clarification | Partial continuity benefit, not a flawless handover or proof of independent
      role mastery |


      Ren can discuss coordination and documentation with concrete examples. The capability gap is maintaining
      a small task budget while tracking changes; Ren has not independently managed project finances.
      A request should not claim that the two outcomes establish project-management qualification.


      The supplied present role pays **3000 gross units for 160 work hours per month**. A hypothetical
      alternative pays **3300 gross for 180 hours** and adds **200 monthly transport cost**. Other costs,
      taxes, benefits, commute hours and contract terms are unknown; neither card is an actual vacancy.
      Gross pay per work hour is **18.75** currently and approximately **18.33** in the alternative. Subtracting
      only the additional transport cost leaves 3100 versus 3000, a **100-unit difference before taxes
      and all other differences**. It is not net take-home pay or an all-in hourly comparison.


      ### Prepare a specific, proportionate request


      Ren''s draft is: “Could we review my compensation and role scope at the next scheduled review? The
      supplied examples show fewer recorded handoff misses and a handover that worked for eight tasks.
      I would also like a bounded practice assignment in tracking a small task budget. What criteria and
      evidence would support a decision, and when can we review them?” This makes useful work visible
      while naming a gap. It does not invent an outside offer, threaten resignation or guarantee a raise.


      A yes response still needs amount, effective date, role expectations and written confirmation through
      the real process. A no response can be followed by a request for reasons and realistic alternatives
      without accepting indefinite unpaid extra duties. “Not yet” needs a date and measurable criteria,
      not endless proof of loyalty. Employer constraints may be real; so may reasons to seek another role.
      A learner can decide not to negotiate now if the situation is unsuitable.


      A short rehearsal makes each branch concrete. For yes: “Thank you; what amount, effective date and
      scope will be confirmed through the usual process?” For no: “What constraint or criterion prevents
      a change, and is a supported training option feasible?” For not yet: “What specific evidence should
      I bring, within my agreed workload, and on what date will we revisit it?” These are practice responses;
      none establishes an employer commitment.


      For the supplied practice assignment, Ren tracks a fictional **100-unit task budget**. Approved
      planned costs are 40 materials, 30 delivery and 20 support, leaving **10 uncommitted**. A proposed
      extra 15 has no approval. Ren''s first worksheet records 90 planned, 10 available and the 15 as
      pending; accepting it would exceed the ceiling by 5. Recognizing that limit is a useful skill demonstration.
      It is not authority to spend an employer''s money.


      ### Produce the career decision brief


      1. Write the two delivered outcomes with denominators and limitations. Distinguish an observed change
      from a proven causal contribution, and partial handover success from complete readiness.

      2. Compare the two public profiles across duties, preparation and work pattern. Note the shared
      coordination skills and the broader financial responsibility Ren has not demonstrated. Record the
      retrieval date and keep live-job availability unknown.

      3. Recompute the hypothetical pay and hours. List unresolved taxes, benefits, travel time, caring
      responsibilities, training costs and contract terms. Explain why the 300-unit gross increase cannot
      alone settle the decision.

      4. Write the request and rehearse yes, no and not-yet responses. Each branch should specify what
      information or next step would make it actionable. Do not send the request on anyone else''s behalf.

      5. Complete the bounded 100-unit practice ledger, then save the initial brief before opening the
      [later packet](?resource=file-later-packet-md). Set a review date for capability evidence and for
      the career choice separately.


      ### Keep growth feasible and voluntary


      For support, use one outcome and calculate gross pay per work hour before adding the missing-cost
      list. Record any help interpreting a role profile. For a harder pass, add a known care cost or unpaid
      travel hours and recompute the comparison; do not silently assume every extra hour is feasible.
      A role with lower immediate cash may offer learning, flexibility or security, but those benefits
      need evidence and the person''s own priorities.


      An optional actual attempt might be a private rehearsal, a permitted portfolio summary or a small
      approved practice task. Job applications, employer contact and negotiations are not required to
      use this source companion. Real tax, employment or contract questions need qualified advice. A practice
      record plus later supervisor or artifact evidence could support capability growth; the supplied
      budget and imaginary negotiation do not establish a raise, an offer, employability or actual workplace
      acceptance.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Use fiction or privately redacted records; keep credentials and sensitive
      identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Role A pays 2800 for 140 hours; B pays 3150 for 175 hours. Which has higher gross pay per work
      hour, before other costs?

      2. A national profile lists a high median wage for a role with broader responsibilities. Can you
      present that figure as your current local offer?

      3. A rehearsal ends with “maybe next quarter.” What needs to change before it is a useful development
      agreement?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A is 20 per hour; B is 18. B has higher total gross pay but lower gross pay per stated work
      hour. Benefits, taxes, travel, care and scope still need comparison.

      2. No. A national profile is contextual information, not a vacancy, offer or individual entitlement.
      Compare duties and qualifications, then verify actual local terms if considering a move.

      3. Clarify the criteria, feasible supported work, responsible decision-maker and review date. Record
      that a rehearsal is not an employer agreement and that no pay outcome is guaranteed.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
