meaning_and_fit:
  purpose: Connect capability, contribution, bargaining position and mobility to an informed income decision
    rather than treating confidence or aspiration as evidence of market value.
  why_recommended: Connect capability, contribution, bargaining position and mobility to an informed income
    decision rather than treating confidence or aspiration as evidence of market value.
  claims:
  - statement: Connect capability, contribution, bargaining position and mobility to an informed income
      decision rather than treating confidence or aspiration as evidence of market value.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Income, negotiation, and career economics practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Income, negotiation, and career economics as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible written request, independent career adviser, union representative
    or trusted mentor within applicable rules. The fictional case is adequate when a real discussion could
    trigger retaliation or reveal protected information. Resolve legal, immigration, contract or benefits
    consequences through appropriate qualified support before acting.
  opportunity_considerations: Use a fictional worker who reliably completes an agreed service, has taken
    on scheduling responsibility and is considering a pay discussion or a different role. Prepare columns
    for demonstrated contribution, relevant capability, credible comparison, constraints, alternatives
    and requested outcome. Use public role descriptions or a fictional employer brief; no confidential
    employer or coworker salary information is required.
  prerequisites:
  - Use a fictional worker who reliably completes an agreed service, has taken on scheduling responsibility
    and is considering a pay discussion or a different role. Prepare columns for demonstrated contribution,
    relevant capability, credible comparison, constraints, alternatives and requested outcome. Use public
    role descriptions or a fictional employer brief; no confidential employer or coworker salary information
    is required.
  dependencies: []
  safe_alternatives:
  - Use an accessible written request, independent career adviser, union representative or trusted mentor
    within applicable rules. The fictional case is adequate when a real discussion could trigger retaliation
    or reveal protected information. Resolve legal, immigration, contract or benefits consequences through
    appropriate qualified support before acting.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Income, negotiation, and career economics differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Income, negotiation, and career
    economics as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional worker who reliably completes an agreed service, has taken on scheduling responsibility
    and is considering a pay discussion or a different role. Prepare columns for demonstrated contribution,
    relevant capability, credible comparison, constraints, alternatives and requested outcome. Use public
    role descriptions or a fictional employer brief; no confidential employer or coworker salary information
    is required. Goal: Connect capability, contribution, bargaining position and mobility to an informed
    income decision rather than treating confidence or aspiration as evidence of market value. Scope:
    A low-stakes preparation and rehearsal is not a salary forecast, promise of promotion or instruction
    to leave employment. Employment, pay disclosure and negotiation rights vary by role and jurisdiction.
    Time and effort: Thirty minutes to assemble evidence, a fifteen-minute rehearsal and one bounded next
    action. Adaptation: Use an accessible written request, independent career adviser, union representative
    or trusted mentor within applicable rules. The fictional case is adequate when a real discussion could
    trigger retaliation or reveal protected information. Resolve legal, immigration, contract or benefits
    consequences through appropriate qualified support before acting. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written request, independent career adviser, union representative
    or trusted mentor within applicable rules. The fictional case is adequate when a real discussion could
    trigger retaliation or reveal protected information. Resolve legal, immigration, contract or benefits
    consequences through appropriate qualified support before acting.
  expected_burden: Thirty minutes to assemble evidence, a fifteen-minute rehearsal and one bounded next
    action.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Income, negotiation, and career economics protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Income, negotiation, and career economics action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written request, independent career adviser, union representative or trusted mentor within applicable
    rules. The fictional case is adequate when a real discussion could trigger retaliation or reveal protected
    information. Resolve legal, immigration, contract or benefits consequences through appropriate qualified
    support before acting.
  actions:
  - stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01-A1
    sequence: 1
    title: Build a contribution and position brief
    instructions: 'Separate work actually delivered from effort, title and hoped-for future value. Record
      two examples of benefit to a customer or team and one capability gap that limits the next role.
      Compare at least two appropriately similar public role descriptions, noting location, duties, hours
      and qualification differences rather than treating an advertised range as an offer. List mobility
      constraints such as care, disability, contract obligations or training costs and one realistic alternative
      to immediate departure.


      Observation checks: Two contributions are supported by concrete outcomes; A capability gap and role-comparison
      limitations are named; Mobility and personal constraints remain part of the economics; An advertised
      range is not represented as a promised offer. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01-A1
      competency_stable_id: '24.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2401_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2401_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_contributions_are_supported_by_concrete_outcomes
        - a_capability_gap_and_role_comparison_limitations_are_named
        - mobility_and_personal_constraints_remain_part_of_the_economics
        - an_advertised_range_is_not_represented_as_a_promised_offer
      - measurement_id: c2401_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2401_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01-A2
    sequence: 2
    title: Rehearse a specific request and a non-threatening alternative
    instructions: 'State the requested pay, responsibility, development support or review process with
      a reason tied to the brief. Rehearse a response to yes, no and not yet. For not yet, ask which observable
      requirements and decision date would permit reconsideration. Do not bluff another offer, fabricate
      results, threaten or disclose another person’s private compensation. Explain the best legitimate
      alternative available if agreement is not reached and what it would cost in time, money and uncertainty.


      Observation checks: The request is specific and grounded in contribution; Yes no and not-yet responses
      are rehearsed; A follow-up criterion and decision date are requested; Alternatives are credible
      rather than fabricated leverage. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01-A2
      competency_stable_id: '24.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2401_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2401_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_request_is_specific_and_grounded_in_contribution
        - yes_no_and_not_yet_responses_are_rehearsed
        - a_follow_up_criterion_and_decision_date_are_requested
        - alternatives_are_credible_rather_than_fabricated_leverage
      - measurement_id: c2401_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2401_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01-A3
    sequence: 3
    title: Take one information or capability step before deciding
    instructions: 'Choose one actual safe next action: request the applicable review process, ask a permitted
      role-information question or practice the identified weak capability. Record what new information
      changed the options. Compare stay, improve the present role and pursue another opportunity without
      assuming higher gross pay is better after hours, costs and risk. A rehearsal remains preparation;
      a real negotiation, offer or income change must be recorded only if it occurs.


      Observation checks: One bounded information or capability action occurs; The resulting information
      revises or confirms the options; Total tradeoffs include more than gross pay; Preparation is distinguished
      from an offer or increased earnings. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which evidence strengthens the request, and which constraint or missing capability
      makes the next step more useful than an immediate demand?


      Examples: Supportive: The worker brief linked scheduling responsibility to a concrete benefit and
      led to a specific review request with a development criterion rather than a vague demand.


      Mixed: The comparison suggested a possible opportunity, but location and hours made the earnings
      advantage uncertain.


      Contradictory: Results or another offer were fabricated, confidential pay data was exposed or the
      exercise was treated as a guarantee of a raise.


      Inconclusive: A desired income was stated without contribution evidence, alternatives, constraints
      or a concrete next action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01
      action_stable_id: PRACTICE-COMP-2401-INCOME-NEGOTIATION-AND-CAREER-ECONOMICS-01-A3
      competency_stable_id: '24.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
