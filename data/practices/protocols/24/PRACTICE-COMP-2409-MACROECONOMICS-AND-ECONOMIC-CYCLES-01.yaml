  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Falling activity with continuing price pressure


      The next fictional sector period produces **99 units in ten hours**, down from 110, while the same
      defined labor force has **88 employed and 12 unemployed**. The same basket rises from 108 to **112**.
      Output falls **10%**, productivity becomes **9.9 units per hour**, unemployment is **12%**, and
      the latest basket increase is **4/108 ≈ 3.70%**. Inflation has slowed from 8% in this selected basket
      while its price level continues upward.


      The packet attributes a verified input interruption to this sector, but supplies no complete national
      demand or GDP series. It does not establish an official national recession. A fictional listener
      initially says, “Lower inflation means the basket is cheaper.” Correct that statement with 108 and
      112, then preserve the initial misunderstanding in the record.


      Compare demand support''s protection and price-pressure risk, demand restraint''s inflation aim
      and employment risk, and a supply repair''s uncertain timing and resource cost. The case does not
      identify a uniquely correct policy. Additional national activity, inflation breadth, expectations,
      financing and institutional information is required.


      A final explanation can say that this sector contracts while its basket price rises more slowly;
      it cannot promise that a rate change will promptly fix the supply problem. The listener response
      is invented, not an actual reception test.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Interpret a fictional economy without confusing a price index, an employment count and production
      per hour. Allow thirty minutes for the indicators and twenty for a causal explanation and correction.
      You will compare possible causes and policy channels while keeping institutional limits and uncertain
      effects explicit.


      ### Different indicators answer different questions


      Macroeconomics studies an economy''s overall activity and the interactions among production, employment,
      prices and policy. The Federal Reserve''s [overview, S02](https://www.federalreserve.gov/faqs/what-is-macroeconomics.htm)
      makes that economy-wide scope explicit. An individual household''s income is relevant to its purchasing
      power, but the household cannot be treated as a miniature central bank or national government.


      Inflation is a rate of change in a price level over a stated interval. A lower inflation rate can
      mean prices are still rising more slowly; it does not automatically mean prices fell. Unemployment
      concerns people without work who belong to the defined labor force, not everyone outside employment.
      Productivity measures output relative to an input, such as hours worked; it can rise while total
      employment falls. Economic growth concerns a change in aggregate real output and should be distinguished
      from higher nominal spending caused by prices.


      A recession involves a broad decline in economic activity over time, with definitions and dating
      practices depending on the relevant institutions. One invented indicator or one short interval cannot
      establish an official recession, recovery or forecast. Ask which population, price basket, interval
      and revision policy underlie a real statistic before interpreting a headline.


      ### Supplied economy M8


      All figures are hypothetical. The fixed basket contains unchanged quantities and quality for this
      exercise. The labor-force definition explicitly includes 92 employed and eight people without work
      who are seeking and available for work. No population outside that labor force is supplied.


      | Quantity | First period | Second period | Correct interpretation |

      | --- | ---: | ---: | --- |

      | Price of the same selected basket | 100 | 108 | 8% basket price increase, not an official national
      index |

      | Defined labor force | 100 | 100 | Denominator fixed by the case |

      | Employment in the second period | Not supplied | 92 | Eight unemployed; 8% of the stated labor
      force |

      | Physical output of one modeled sector | 100 units | 110 units | 10% output increase in this sector
      |

      | Labor input for that sector | 10 hours | 10 hours | Productivity rises from ten to eleven units
      per hour |

      | Separate household nominal income | Index 100 | Index 105 | 5% income growth, before comparing
      prices |


      The basket change is (108 − 100)/100 = **8%**. Unemployment is (100 − 92)/100 = **8%**. Productivity
      changes from 100/10 = **10** to 110/10 = **11**, also a **10%** increase. Equal percentages do not
      make the first two indicators interchangeable, and sector productivity is not a complete national
      growth measure.


      The household can buy 105/108 as much of that basket as before, or about **97.22%** of its earlier
      amount: a purchasing-power decline of about **2.78%**. Subtracting eight from five gives a useful
      rough three-percentage-point comparison, but it is not the exact proportional real-income change.
      The household may face another basket, debt or taxes in real life; none is supplied here.


      ### Keep competing causal accounts alive


      A demand-pressure explanation says spending rose faster than available supply, putting pressure
      on prices. Evidence would include demand, capacity and order conditions, not just the observed basket.
      A supply-disruption explanation says an input shortage or delivery problem reduced what could be
      produced at previous costs. Evidence would include the affected input, production and delivery history.
      Both mechanisms can coexist, and expectations may influence wage and price setting.


      The IMF''s [monetary-policy explanation, S03](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/monetary-policy)
      describes an interest-rate transmission channel. In a simplified tightening scenario, financing
      becomes more expensive, some borrowing and spending may fall, and activity and price pressure may
      respond later. Existing fixed-rate borrowers, new borrowers and savers can experience different
      effects. A central bank cannot instantly manufacture a missing component, and lower price pressure
      is not a guarantee that every price falls.


      Its [fiscal-policy explanation, S04](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/fiscal-policy)
      distinguishes government taxes, transfers and spending. A transfer can support household resources,
      while a public purchase directly demands goods or services. Design, approval and implementation
      take time; recipients may save some additional income. Automatic stabilizers under existing rules
      differ from a newly legislated program. Do not assume a particular country''s authority, currency
      arrangement or financing capacity from this model.


      ### Compare policy responses under strain


      A government faces budget and resource constraints, but also institutions, taxing powers and responsibilities
      unlike one household. Some governments issue their own currency; others face monetary-union, exchange-rate
      or foreign-currency constraints. Even a currency issuer cannot create unlimited real resources without
      consequences. National expenditure accounting includes interactions among households, firms, government
      and the rest of the world; one sector''s spending can become another''s income. These facts explain
      why the analogy needs limits, not why fiscal cost can be ignored.


      For a first response comparison, demand restraint may reduce inflation pressure while weakening
      activity and employment. Demand support may protect incomes while worsening a constrained price
      situation. Addressing a verified supply bottleneck may increase capacity but require time, resources
      and legitimate authority. Each proposal needs a causal account, distributional effects and a condition
      that would change the recommendation.


      ### Produce the economic explanation


      1. Recalculate every supplied indicator and name its denominator and unit. State the missing national-output,
      participation and household-budget information.

      2. Explain the household''s exact basket purchasing-power change. Distinguish it from national income
      or government finances.

      3. Write separate demand and supply explanations, each with the evidence needed to distinguish it.
      Label arrows as plausible mechanisms rather than measured causal effects.

      4. Compare monetary tightening, fiscal support and a supply response for timing, affected groups
      and possible harm. Name the institutional information required before an actual policy judgment.

      5. Save a short explanation for a willing listener or private recording, then open the [later packet](?resource=file-later-packet-md).
      Correct any leap from accurate arithmetic to a certain diagnosis or forecast.


      For support, begin with the basket and labor force using counters, then add output per hour. For
      a harder pass, let hours fall as well as output and ask why productivity and total activity can
      move differently. Actual economic commentary requires dated official series and definitions, including
      revisions; no live market data or trading decision is required here. A supplied listener correction
      practices explanation but cannot establish actual public-policy expertise or learner understanding.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A basket rises from 200 to 210, then to 214. Did prices fall in the last period?

      2. Output falls from 120 to 108 while hours fall from 12 to nine. What happens to output and productivity?

      3. A household cuts spending to balance its budget. Does that establish the right response for a
      national downturn?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. They rose another four, about 1.90% from 210, after an earlier 5% rise. The inflation
      rate slowed while the price level increased.

      2. Output falls 10%, while output per hour rises from ten to twelve, or 20%. Greater measured productivity
      does not mean total production or employment increased.

      3. No. Government powers, currency and financing constraints, aggregate demand and effects across
      sectors differ. Compare mechanisms, institutions and distributional consequences; neither automatic
      austerity nor unlimited spending follows from the analogy.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
