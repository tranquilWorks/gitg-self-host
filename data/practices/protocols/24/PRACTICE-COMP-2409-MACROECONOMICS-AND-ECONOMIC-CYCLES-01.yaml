meaning_and_fit:
  purpose: Distinguish inflation, unemployment, productivity and growth, then trace monetary and fiscal
    responses with uncertainty rather than treating a national economy as a household budget.
  why_recommended: Distinguish inflation, unemployment, productivity and growth, then trace monetary and
    fiscal responses with uncertainty rather than treating a national economy as a household budget.
  claims:
  - statement: Distinguish inflation, unemployment, productivity and growth, then trace monetary and fiscal
      responses with uncertainty rather than treating a national economy as a household budget.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Macroeconomics and economic cycles practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Macroeconomics and economic cycles as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a simple arrow diagram and spoken arithmetic. No live market or national
    data are required. For real economic claims, use dated official statistics with definitions and revisions;
    do not use this exercise to make personal trades or claim policy expertise.
  opportunity_considerations: In the fictional economy, a fixed basket rises from 100 to 108, a defined
    labor force of 100 has 92 employed, and output rises from 100 to 110 units using the same ten labor-hours.
    A separate household’s nominal income rises 5%. No migration, quality adjustment, labor-force participation
    change, monetary regime or current policy data are supplied.
  prerequisites:
  - In the fictional economy, a fixed basket rises from 100 to 108, a defined labor force of 100 has 92
    employed, and output rises from 100 to 110 units using the same ten labor-hours. A separate household’s
    nominal income rises 5%. No migration, quality adjustment, labor-force participation change, monetary
    regime or current policy data are supplied.
  dependencies: []
  safe_alternatives:
  - Use a simple arrow diagram and spoken arithmetic. No live market or national data are required. For
    real economic claims, use dated official statistics with definitions and revisions; do not use this
    exercise to make personal trades or claim policy expertise.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Macroeconomics and economic cycles differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Macroeconomics and economic
    cycles as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'In the fictional economy, a fixed basket rises from 100 to 108, a defined labor force of 100
    has 92 employed, and output rises from 100 to 110 units using the same ten labor-hours. A separate
    household’s nominal income rises 5%. No migration, quality adjustment, labor-force participation change,
    monetary regime or current policy data are supplied. Goal: Distinguish inflation, unemployment, productivity
    and growth, then trace monetary and fiscal responses with uncertainty rather than treating a national
    economy as a household budget. Scope: The supplied economy is a teaching model, not current statistics,
    a forecast or investment advice. Simple indicators cannot identify all causes or determine one correct
    policy. Time and effort: Thirty minutes for the indicators and twenty minutes for a causal explanation
    and correction. Adaptation: Use a simple arrow diagram and spoken arithmetic. No live market or national
    data are required. For real economic claims, use dated official statistics with definitions and revisions;
    do not use this exercise to make personal trades or claim policy expertise. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a simple arrow diagram and spoken arithmetic. No live market or national data
    are required. For real economic claims, use dated official statistics with definitions and revisions;
    do not use this exercise to make personal trades or claim policy expertise.
  expected_burden: Thirty minutes for the indicators and twenty minutes for a causal explanation and correction.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Macroeconomics and economic cycles protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Macroeconomics and economic cycles action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a simple
    arrow diagram and spoken arithmetic. No live market or national data are required. For real economic
    claims, use dated official statistics with definitions and revisions; do not use this exercise to
    make personal trades or claim policy expertise.
  actions:
  - stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01-A1
    sequence: 1
    title: Calculate indicators and state what they do not show
    instructions: 'Calculate the basket increase as 8%, unemployment in the supplied labor force as 8%,
      and labor productivity as ten then eleven units per hour, a 10% increase. Explain that these are
      different quantities: output per hour, people seeking work within the defined labor force and a
      selected basket’s price level. Compare the household’s income growth with the basket increase; its
      purchasing power for that basket falls despite higher nominal income. Do not call this basket an
      official national index.


      Observation checks: The three supplied indicator calculations are correct; Price level employment
      and productivity are distinguished; Higher nominal income is not automatically higher purchasing
      power; Indicator definitions and omitted information remain explicit. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01
      action_stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01-A1
      competency_stable_id: '24.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2409_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2409_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_three_supplied_indicator_calculations_are_correct
        - price_level_employment_and_productivity_are_distinguished
        - higher_nominal_income_is_not_automatically_higher_purchasing_power
        - indicator_definitions_and_omitted_information_remain_explicit
      - measurement_id: c2409_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
