  - stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01-A2
    sequence: 2
    title: Trace two possible causes and two policy channels
    instructions: 'Draw one demand-pressure explanation and one supply-disruption explanation for rising
      prices, marking the missing evidence that would distinguish them. Explain a monetary-policy channel
      through financing conditions, spending and later activity, and a fiscal channel through taxes, transfers
      or public spending. Include delays and different effects on borrowers, savers, workers and firms.
      Do not assume an interest-rate change immediately controls every price or that a government has
      the same powers and constraints as one household.


      Observation checks: Demand and supply explanations have different evidence needs; Monetary and fiscal
      mechanisms are separated; Delays and unequal effects are included; Household and national-budget
      reasoning are not treated as interchangeable. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01
      action_stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01-A2
      competency_stable_id: '24.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2409_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2409_a2_primary
        kind: artifact
        role: primary
        weight: '1'
