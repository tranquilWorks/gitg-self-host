        - monetary_and_fiscal_mechanisms_are_separated
        - delays_and_unequal_effects_are_included
        - household_and_national_budget_reasoning_are_not_treated_as_interchangeable
      - measurement_id: c2409_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2409_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2409-MACROECONOMICS-AND-ECONOMIC-CYCLES-01-A3
    sequence: 3
    title: Compare responses under a changed condition
    instructions: 'Consider a second case with falling output and higher unemployment but continuing supply-driven
      price pressure. Compare the risks of stimulating demand, restraining it and addressing a supply
      bottleneck without claiming a certain result. State which data and institutional constraints would
      be needed for a responsible policy judgment. Explain the case to a willing listener or recording
      and correct any leap from one indicator to a confident recession, growth or inflation forecast.


      Observation checks: The second case contains an explicit policy tradeoff; At least two responses
      and adverse possibilities are compared; Needed evidence and institutional constraints are named;
      The final explanation avoids a deterministic economic forecast. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which causal link remains uncertain even after the arithmetic is correct, and what
      would you need to know before recommending a policy response?


      Examples: Supportive: The learner separated productivity from employment and compared monetary and
      fiscal channels while retaining uncertainty about supply versus demand causes.


      Mixed: The indicators were correct, but a delayed policy effect was initially omitted and added
      during explanation.


      Contradictory: A single price change was called proof of national inflation or a household austerity
      rule was treated as an automatic solution for an entire economy.


      Inconclusive: Economic terms were named without calculating the supplied indicators or tracing competing
      causal explanations.'
    expected_time: 15-25 minutes
    due_within_days: 10
