  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### A lower base and an access cost reopen the choice


      In the supplied review, the taxable base is **850**, yielding **85** at 10%. The original program
      and administration still total 90, so the modeled period deficit is **5**. The earlier below-900
      monitoring trigger is met. No borrowing has been authorized and no additional revenue exists in
      the case.


      Alternative P would cost 70 and leave 15. An affected-user perspective in the fictional review identifies
      a barrier: some intended users need the assisted explanation that P postponed. A proposed accessible
      assistance arrangement costs **12**, making the revised phased cost **82** and balance **3** at
      revenue 85. Its staffing capacity and actual effectiveness are not yet demonstrated.


      Compare this revised phase with the original. The three-unit margin is smaller than the earlier
      twenty, and future maintenance remains omitted. It is a conditional option, not proof that the original
      access loss is fully repaired or that public finances are sustainable.


      The separate seller/buyer 6/4 incidence assumption does not change merely because this project base
      changed; it remains a different toy example. Preserve the original recommendation, the triggered
      review and unresolved legal/community/financing questions. No tax collection, policy adoption or
      actual participant consultation occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Evaluate a small public-budget proposal with its tax base, behavioral response and distributional
      burden visible. Allow thirty minutes for the budget and sensitivity calculation, followed by twenty
      minutes for distribution review. You will make a conditional recommendation rather than approve
      a tax, borrowing decision or public expenditure.


      ### A balanced total does not answer every public question


      Public finance asks what is funded, who contributes, who benefits and what commitments continue.
      A tax base is the activity or value to which a tax rate applies. Revenue can change if that base
      changes, even when the rate stays fixed. Administration also consumes resources, while a spending
      program can create maintenance obligations beyond its first period.


      The IMF''s [fiscal discussion, S04](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/fiscal-policy)
      connects taxation, spending and financing. Its [externalities and public-goods discussion, S01](https://www.imf.org/en/publications/fandd/issues/series/back-to-basics/externalities)
      distinguishes benefits that are difficult to exclude people from and can be shared without reducing
      another person''s use. A nonrival benefit can be used by another person without reducing the benefit
      available to someone else; nonexcludability concerns difficulty preventing access. Not every publicly
      funded service is a pure public good. A crowded facility can have capacity limits; a broadcast notice
      may be widely shared at low marginal cost. Identify the actual access and provision problem instead
      of using “public good” as praise.


      A one-period surplus means modeled revenue exceeds modeled spending during that period. A deficit
      is the opposite flow. Accumulated debt is a stock shaped by previous borrowing and repayment, among
      other factors. A surplus in one small project does not establish that the whole government has no
      debt, and a deficit does not by itself show that the spending is wasteful or sustainable. The future
      obligations and financing conditions matter.


      ### Supplied local project T8


      A fictional local authority proposes a public information service. It would provide a freely readable
      noticeboard and an optional assisted explanation period. The noticeboard can benefit people who
      do not pay the levy; the explanation period has limited staff capacity. Existing law, authority
      to levy, exemptions, privacy rules and actual community support are deliberately unspecified.


      The taxable base is **1000 units** and the proposed rate **10%**. Program spending is **80**, administration
      **10**, and no maintenance beyond this period is included. No debt stock, interest payment or other
      public revenue is supplied.


      | Scenario | Tax base | Rate | Revenue | Program plus administration | Period balance |

      | --- | ---: | ---: | ---: | ---: | ---: |

      | Original | 1000 | 10% | 100 | 90 | 10 |

      | Behavioral response | 900 | 10% | 90 | 90 | 0 |


      The second base is an assumed scenario, not a measured prediction of avoidance or reduced activity.
      It could reflect several behaviors or accounting changes in a real case, which would need investigation.
      The fixed rate alone cannot tell us which base is likely. Missing maintenance is a real limit in
      both rows, not evidence that it will cost nothing.


      ### Separate the legal collector from the economic burden


      In a **separate incidence illustration**, a ten-unit charge is legally collected from a seller.
      The supplied hypothetical price response leaves **six units borne by buyers and four by the seller**.
      The split totals ten but does not measure this project''s levy or determine another market''s pass-through.
      The St. Louis Fed''s [incidence discussion, S05](https://www.stlouisfed.org/on-the-economy/2016/may/negative-interest-rates-tax-sheep-clothing)
      explains why the party remitting a tax need not bear all its burden. Only that introductory distinction
      is used; the article''s argument about negative rates is not adopted.


      A buyer unable to switch products may face a different burden from one with an easy substitute.
      A seller might absorb lower returns, change staffing or change output; these are possible channels
      requiring evidence, not instructions to cut wages. Economic incidence should therefore be estimated
      from actual market responses rather than assumed from the tax form. Equity analysis also asks who
      receives the service and who cannot access it despite paying.


      The 6/4 illustration has no supplied household incomes, demand elasticities or long-term effects.
      Do not call it progressive or regressive without the relevant distributional information. A levy
      with equal nominal payments may impose unequal proportional burdens; a benefit may offset those
      burdens for some people and not others. State the principle being used, such as ability to pay or
      access to a basic service, and allow disagreement about its weight.


      ### Compare a concrete phased alternative


      Alternative P would provide the noticeboard first for **60 program units** plus the same **10 administration**,
      postponing the assisted explanation period. At a base of 900 and the unchanged 10% rate, revenue
      90 less cost 70 leaves **20** for the period. The change creates more financial room but sacrifices
      staffed access for people who cannot use the board independently. It also postpones rather than
      resolves the maintenance question.


      Compare the proposals across five dimensions: adequacy of the service, administrative complexity,
      distribution of benefits and burdens, behavioral incentives, and future financing. The original
      offers broader access but has no modeled balance at the smaller base. The phased version spends
      less immediately but may exclude intended users and require later expansion costs. Neither is a
      free improvement.


      A conditional recommendation can favor the original only if its funding and accessible delivery
      can be confirmed, or propose a revised phase with a costed access route. If those conditions are
      unresolved, defer the commitment and ask the appropriate institution for the missing facts. A learner''s
      preference does not create the authority to levy, borrow or spend.


      ### Produce the policy comparison


      1. Reconcile revenue, program cost, administration and balance for both tax bases. List maintenance,
      debt and financing information that the table omits.

      2. Explain who can use each service and where nonexclusion, free-riding or limited capacity affects
      provision. Do not imply that every resident has the same access.

      3. Work the separate ten-unit incidence example and identify what evidence would be required to
      estimate a real split. Keep legal collection and economic burden distinct.

      4. Compare the original and phased proposal using all five dimensions. Name the sacrificed benefit
      and whose perspective is missing before recommending either.

      5. Set a monitoring trigger: reopen the proposal if the base falls below 900 or intended users cannot
      obtain the promised explanation. Save the first decision and open the [later packet](?resource=file-later-packet-md).


      For support, use ten counters for each ten-percent revenue block and separate counters for program
      and administration. For a harder pass, add a targeted offset with its own processing cost and identify
      who could miss it. Actual policy analysis needs current official fiscal information, lawful authority,
      qualified review and affected-community input. This model supplies none of those approvals. A well-reasoned
      comparison should survive a changed base and a legitimate competing equity concern without becoming
      an ideological loyalty test.


      ### Use the result at its proper scale


      Business and economic education only; legal, tax, securities, employment, and regulatory questions
      require qualified advice.  Fiction and no attempt are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A 12% rate applies to a base that falls from 500 to 450. What happens to revenue?

      2. A seller remits an eight-unit charge and the supplied price response shifts five to buyers. Who
      bears the modeled burden?

      3. A project has a six-unit annual surplus but future upkeep and existing debt are unspecified.
      Is long-term sustainability proved?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. It falls from 60 to 54 even though the rate stays unchanged. The reason for the base change
      and its actual likelihood need evidence.

      2. Buyers bear five and the seller three under that assumption. Remitting the charge does not mean
      bearing all eight, and the split is not a universal pass-through rule.

      3. No. The surplus is a period flow under incomplete inputs. Debt stock, maintenance, financing,
      access and future revenue still need examination; a positive row cannot supply those facts.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
