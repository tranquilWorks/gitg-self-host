meaning_and_fit:
  purpose: Compare a tax-and-spending proposal across revenue, public benefit, incentives, distribution,
    debt and administrative burden rather than considering its headline rate alone.
  why_recommended: Compare a tax-and-spending proposal across revenue, public benefit, incentives, distribution,
    debt and administrative burden rather than considering its headline rate alone.
  claims:
  - statement: Compare a tax-and-spending proposal across revenue, public benefit, incentives, distribution,
      debt and administrative burden rather than considering its headline rate alone.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Public finance, taxation, and redistribution practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Public finance, taxation, and redistribution as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use counters and a diagram rather than a spreadsheet. People may reasonably
    weigh equity and efficiency differently; require reasons rather than ideological agreement. Actual
    tax, borrowing or spending decisions belong to the relevant lawful institutions and qualified advisers.
  opportunity_considerations: A fictional local project has a taxable base of 1,000 and a proposed 10%
    levy, with spending of 80 and administration of 10. A behavioral scenario reduces the base to 900.
    Separately, consider a 10-unit charge legally collected from a seller where the supplied hypothetical
    price response shifts six units to buyers and leaves four with the seller. These responses are assumptions,
    not empirical estimates.
  prerequisites:
  - A fictional local project has a taxable base of 1,000 and a proposed 10% levy, with spending of 80
    and administration of 10. A behavioral scenario reduces the base to 900. Separately, consider a 10-unit
    charge legally collected from a seller where the supplied hypothetical price response shifts six units
    to buyers and leaves four with the seller. These responses are assumptions, not empirical estimates.
  dependencies: []
  safe_alternatives:
  - Use counters and a diagram rather than a spreadsheet. People may reasonably weigh equity and efficiency
    differently; require reasons rather than ideological agreement. Actual tax, borrowing or spending
    decisions belong to the relevant lawful institutions and qualified advisers.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Public finance, taxation, and redistribution differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Public finance, taxation,
    and redistribution as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'A fictional local project has a taxable base of 1,000 and a proposed 10% levy, with spending
    of 80 and administration of 10. A behavioral scenario reduces the base to 900. Separately, consider
    a 10-unit charge legally collected from a seller where the supplied hypothetical price response shifts
    six units to buyers and leaves four with the seller. These responses are assumptions, not empirical
    estimates. Goal: Compare a tax-and-spending proposal across revenue, public benefit, incentives, distribution,
    debt and administrative burden rather than considering its headline rate alone. Scope: The fictional
    budget is public-finance literacy, not a tax calculation or endorsement of a current proposal. Actual
    legal liability and economic incidence are distinct and require context. Time and effort: Thirty minutes
    for a budget and sensitivity calculation, followed by a twenty-minute distribution review. Adaptation:
    Use counters and a diagram rather than a spreadsheet. People may reasonably weigh equity and efficiency
    differently; require reasons rather than ideological agreement. Actual tax, borrowing or spending
    decisions belong to the relevant lawful institutions and qualified advisers. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use counters and a diagram rather than a spreadsheet. People may reasonably weigh
    equity and efficiency differently; require reasons rather than ideological agreement. Actual tax,
    borrowing or spending decisions belong to the relevant lawful institutions and qualified advisers.
  expected_burden: Thirty minutes for a budget and sensitivity calculation, followed by a twenty-minute
    distribution review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Public finance, taxation, and redistribution protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Public finance, taxation, and redistribution action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use counters
    and a diagram rather than a spreadsheet. People may reasonably weigh equity and efficiency differently;
    require reasons rather than ideological agreement. Actual tax, borrowing or spending decisions belong
    to the relevant lawful institutions and qualified advisers.
  actions:
  - stable_id: PRACTICE-COMP-2410-PUBLIC-FINANCE-TAXATION-AND-REDISTRIBUTION-01-A1
    sequence: 1
    title: Reconcile revenue expenditure and the public purpose
    instructions: 'Calculate base revenue as 100 and total project plus administration cost as 90, leaving
      10. Describe the public benefit, who can use it and whether exclusion or free-riding affects provision.
      State what maintenance and future obligations are omitted. Explain the difference between a current
      surplus, a one-period deficit and accumulated debt; no single annual balance proves sustainability
      or waste.


      Observation checks: Revenue of one hundred and costs of ninety reconcile; The public purpose and
      access question are explicit; Future maintenance and omitted obligations are identified; Annual
      balance is distinguished from accumulated debt and sustainability. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2410-PUBLIC-FINANCE-TAXATION-AND-REDISTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2410-PUBLIC-FINANCE-TAXATION-AND-REDISTRIBUTION-01-A1
      competency_stable_id: '24.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2410_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2410_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - revenue_of_one_hundred_and_costs_of_ninety_reconcile
        - the_public_purpose_and_access_question_are_explicit
        - future_maintenance_and_omitted_obligations_are_identified
        - annual_balance_is_distinguished_from_accumulated_debt_and_sustainability
      - measurement_id: c2410_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2410_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
