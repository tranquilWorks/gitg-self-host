        expected: true
  - stable_id: PRACTICE-COMP-2410-PUBLIC-FINANCE-TAXATION-AND-REDISTRIBUTION-01-A2
    sequence: 2
    title: Test behavior and who ultimately bears the charge
    instructions: 'Under the smaller base, recalculate revenue as 90 and the balance as zero. Explain
      that a rate alone does not fix revenue when behavior or the tax base changes. In the separate incidence
      case, distinguish the legal collector from the assumed six-unit buyer burden and four-unit seller
      burden. Ask who might be excluded, compensated or unable to adapt, and mark the evidence needed
      to estimate actual pass-through rather than treating the supplied split as universal.


      Observation checks: The smaller-base scenario produces ninety revenue and zero balance; Behavioral
      response is not assumed away; Statutory collection and economic burden are distinguished; The supplied
      incidence split remains an assumption requiring evidence in real use. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2410-PUBLIC-FINANCE-TAXATION-AND-REDISTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2410-PUBLIC-FINANCE-TAXATION-AND-REDISTRIBUTION-01-A2
      competency_stable_id: '24.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2410_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2410_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_smaller_base_scenario_produces_ninety_revenue_and_zero_balance
        - behavioral_response_is_not_assumed_away
        - statutory_collection_and_economic_burden_are_distinguished
        - the_supplied_incidence_split_remains_an_assumption_requiring_evidence_in_real_use
      - measurement_id: c2410_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
