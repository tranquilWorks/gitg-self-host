      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Rae chooses the book return and has handed you the packed book. Before the errand, your available
      start moves from 16:15 to 16:40, while your obligation to be back at 17:00 remains. The fifteen-minute
      outward trip, five-minute book deposit and fifteen-minute trip back still total thirty-five minutes.
      Only twenty minutes are now available: the plan is fifteen minutes short, even though you could
      reach the library before closing.


      Tell Rae promptly that the agreed plan no longer fits. You may offer another time if actually available
      and ask about the book''s return deadline; do not assert an extension or transfer the task to somebody
      else without agreement. Keep the book secure and agree its return or handover.


      No revised agreement or completed library return is supplied. “I warned Rae” is a useful action
      but does not make the original errand complete. Rae''s broader week and their response remain unknown.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Reliable support starts by finding out what would help, stating what you can actually offer
      and doing the agreed part. It also includes saying promptly when your capacity changes. This practice
      uses an ordinary difficult week, not a crisis. Allow ten minutes for a conversation, the bounded
      action you agree and five minutes for a follow-up about usefulness.


      ### A strong feeling does not identify the needed help


      Someone saying “I''m overwhelmed” does not tell you whether to listen, solve, reassure, research,
      speak on their behalf or leave them room. Ask rather than choosing the mode that makes you feel
      most helpful. You can offer a small menu without making the person manage your whole response: “Would
      listening, one practical task or some space help most?”


      Six modes have different jobs. **Listening** lets someone describe their experience without immediate
      advice. **Practical help** completes a specific task they want done. **Encouragement** recognizes
      effort or offers confidence without promising an outcome. **Information** answers an actual question
      with relevant, checked material. **Advocacy** communicates a concern through an agreed route with
      permission about what may be shared. **Space** respects a request for less contact while making
      only a welcome follow-up commitment.


      Feeney and Collins frame support as an interpersonal process rather than just an expectation that
      support exists [S13](https://pubmed.ncbi.nlm.nih.gov/25125368/). This theoretical point motivates
      checking what was useful. The six-mode menu and case are original practice design, not a clinical
      assessment or a guarantee of well-being.


      Reliability requires truthful capacity. “I can listen for twenty minutes today” may be more dependable
      than “anything you need.” State the limit before the person relies on a promise. Competence matters
      too: a friend''s legal, medical or safety crisis is not an opportunity to improvise professional
      advice. Help them access appropriate qualified or emergency support when needed; this exercise does
      not replace it.


      ### Worked example: an errand is not permission to reorganize


      An overwhelmed friend asks Sol to return one library book tomorrow. Sol agrees to that task, confirms
      the branch and return deadline, and checks that the task is feasible. Sol does not also sort the
      friend''s belongings or contact their employer to explain the situation. Those additions may create
      work, embarrassment or loss of control.


      If Sol becomes unavailable, the useful move is a timely message: “I can''t do the return tomorrow
      as promised. I can do it Thursday, but I understand if that is too late.” The friend then has a
      real chance to choose another route. Disappearing until Thursday hides the information the person
      needs to plan; insisting they wait makes Sol''s help a condition imposed on them.


      ### Your case: twenty minutes or one errand


      This fictional case concerns Rae, a friend having an ordinary busy week. Rae says, “Everything is
      piling up.” You can listen for twenty minutes today between 18:00 and 18:20, or return one already
      packed library book tomorrow before 17:00. You cannot do both. You have no authority to contact
      Rae''s workplace or family. There is no emergency, abuse, medical issue or unsafe task in the supplied
      facts.


      Rae has not specified the desired support mode. You know the book-return branch closes at 17:00,
      the trip takes fifteen minutes each way, and the return itself takes five minutes. Tomorrow you
      have a free window from 16:15 to 17:00. The alternative is that Rae returns it another day under
      the library''s own terms; you must not invent that there is no cost or deadline consequence.


      1. **Ask for the mode and share capacity.** Explain the two feasible options and that you can do
      one. Leave Rae free to choose neither or name something else you may not be able to provide. Output:
      a question and an honest offer, without assuming distress requires advice.

      2. **Make the chosen action specific.** If Rae chooses the errand, confirm the branch, book, handover
      and actual return deadline. The journey and return take thirty-five minutes, leaving ten minutes
      in your window. Do not promise it before checking the necessary handover. Output: who will do what
      and by when, with any dependency still visible.

      3. **Carry out only what was agreed.** Listening is not a disguised advice session. Information
      should be relevant and checked. Advocacy needs permission for the exact audience and content. Space
      means no repeated checking disguised as care. Output: action performed or unresolved obstacle, not
      a list of imagined good intentions.

      4. **Read the [later packet](?resource=file-later-packet-md) and renegotiate.** Recalculate capacity
      when the window changes. Let Rae decide whether a revised offer helps. Output: a timely update,
      agreed alternative if any, and a clear distinction between completed help and remaining need.


      ### Check usefulness without asking for praise


      After a real action, ask a concrete question such as, “Did returning that book remove the task you
      wanted help with?” A yes concerns that task; it does not mean you solved the whole difficult week.
      If the person says the help missed the need, listen and revise what is within your role. Do not
      make them reassure you because you worked hard.


      Support can create burden if it requires extensive supervision, exposes private information or obligates
      gratitude. Notice these costs without using them as a reason to avoid all help. The person may need
      something you cannot offer. You can say so clearly and, if welcome, help locate a suitable alternative
      rather than taking over.


      For support with this practice, rehearse the six modes using the case and write the capacity limit
      before offering. A role-play establishes preparation only. For a harder attempt, the person changes
      the desired mode halfway through: ask whether you can meet the new request and agree a revised boundary.
      For real transfer, choose a willing person with an ordinary bounded need, do one agreed action and
      check its usefulness without requiring a positive answer. If they choose space, a respected pause
      can be the action; repeated unsolicited contact is not reliable presence. Finish with the [fresh
      checks](?attempt=practice-checks).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'All cases are fictional; [answers](?check=practice-answers) are separate.


      1. A friend asks for listening. You have relevant advice and start giving it without asking. What
      needs repair?

      2. You have twenty-five minutes; an errand needs ten minutes each way and eight at the destination.
      What can you honestly promise?

      3. Someone welcomes help drafting a message to a landlord. May you send it or disclose their situation
      to the landlord as advocacy?'
    check_id: practice-answers
    attempt_mode: practice
