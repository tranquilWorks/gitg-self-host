  - stable_id: PRACTICE-COMP-1704-RELIABLE-SUPPORT-01-A2
    sequence: 2
    title: Do the agreed support without switching modes uninvited
    instructions: 'Carry out the chosen bounded action. When listening, ask before moving to advice; when
      doing an errand, follow the agreed task rather than reorganizing the person’s life; when offering
      advocacy, obtain permission about what may be shared. If the person asks for space, respect the
      agreed contact boundary. If conditions change, renegotiate promptly instead of disappearing or taking
      control to ensure your preferred outcome.


      Observation checks: The actual action matches the agreed support mode; A change to advice advocacy
      or practical control requires permission; Privacy limits are followed; Changed capacity is communicated
      rather than concealed. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
