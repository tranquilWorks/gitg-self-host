      Reliable support; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Support may be asynchronous, remote, translated or practical rather than verbally expressive. The
      recipient can decline feedback or further help. An unavailable friend is not a practice target;
      use a fictional rehearsal until a welcome opportunity arises.
    cultural_context:
    - Adapt the expression of Reliable support to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Support may be asynchronous, remote, translated or practical rather than verbally expressive. The
      recipient can decline feedback or further help. An unavailable friend is not a practice target;
      use a fictional rehearsal until a welcome opportunity arises.
  pause_conditions:
  - Pause Reliable support when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Reliable support practice for harm, coercion, retaliation risk, emergency conditions, unsafe
    exposure, worsening symptoms, protected information, legal or policy conflict, or pressure to exceed
    the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Reliable support situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
