  - stable_id: PRACTICE-COMP-1704-RELIABLE-SUPPORT-01-A3
    sequence: 3
    title: Check usefulness and close the commitment clearly
    instructions: 'At the agreed point, ask whether the support helped with the stated need and whether
      anything should be different next time. Accept that a well-intended action may have been unhelpful.
      Confirm what is complete, what remains and whether another bounded step is both wanted and feasible.
      Route serious or persistent needs to appropriate support without promising to manage the person’s
      recovery or solve everything yourself.


      Observation checks: Usefulness is checked against the person’s stated need; Unhelpful effects can
      be acknowledged without defensiveness; Completion remaining need and any next commitment are separate;
      Professional or emergency needs are not absorbed into an unlimited friendship role. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Did you provide the kind of help the person actually wanted, and where did respecting
      a limit make the support more reliable rather than less caring?


      Examples: Supportive: The friend chose listening rather than advice, received the agreed attention
      and later said that being heard was useful.


      Mixed: The errand was completed, but the helper added unsolicited advice and revised the support
      boundary after feedback.


      Contradictory: The helper took over decisions, shared private information without permission or
      promised availability they could not sustain.


      Inconclusive: Support was offered vaguely but no mode, capacity, action or follow-up was agreed.'
    expected_time: 15-25 minutes
    due_within_days: 10
