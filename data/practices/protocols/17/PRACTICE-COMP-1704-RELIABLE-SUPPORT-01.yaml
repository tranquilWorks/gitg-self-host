meaning_and_fit:
  purpose: Match support to the person’s stated need and your actual capacity rather than assuming that
    advice, rescue or constant availability is always helpful.
  why_recommended: Match support to the person’s stated need and your actual capacity rather than assuming
    that advice, rescue or constant availability is always helpful.
  claims:
  - statement: Match support to the person’s stated need and your actual capacity rather than assuming
      that advice, rescue or constant availability is always helpful.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Reliable support practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Reliable support as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Support may be asynchronous, remote, translated or practical rather than verbally
    expressive. The recipient can decline feedback or further help. An unavailable friend is not a practice
    target; use a fictional rehearsal until a welcome opportunity arises.
  opportunity_considerations: 'Default case: a friend says an ordinary week has become overwhelming. Prepare
    six possible modes—listening, practical help, encouragement, information, advocacy or space—and a
    truthful limit such as twenty minutes today. Do not assume which mode the person needs from the intensity
    of their message.'
  prerequisites:
  - 'Default case: a friend says an ordinary week has become overwhelming. Prepare six possible modes—listening,
    practical help, encouragement, information, advocacy or space—and a truthful limit such as twenty
    minutes today. Do not assume which mode the person needs from the intensity of their message.'
  dependencies: []
  safe_alternatives:
  - Support may be asynchronous, remote, translated or practical rather than verbally expressive. The
    recipient can decline feedback or further help. An unavailable friend is not a practice target; use
    a fictional rehearsal until a welcome opportunity arises.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Reliable support differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Reliable support as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: a friend says an ordinary week has become overwhelming. Prepare six possible modes—listening,
    practical help, encouragement, information, advocacy or space—and a truthful limit such as twenty
    minutes today. Do not assume which mode the person needs from the intensity of their message. Goal:
    Match support to the person’s stated need and your actual capacity rather than assuming that advice,
    rescue or constant availability is always helpful. Scope: This is ordinary nonprofessional support.
    Crisis, abuse, medical, legal or other high-stakes needs require appropriate qualified help; friendship
    does not replace those services. Time and effort: A ten-minute support conversation, the agreed small
    action and a five-minute follow-up. Adaptation: Support may be asynchronous, remote, translated or
    practical rather than verbally expressive. The recipient can decline feedback or further help. An
    unavailable friend is not a practice target; use a fictional rehearsal until a welcome opportunity
    arises. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Support may be asynchronous, remote, translated or practical rather than verbally
    expressive. The recipient can decline feedback or further help. An unavailable friend is not a practice
    target; use a fictional rehearsal until a welcome opportunity arises.
  expected_burden: A ten-minute support conversation, the agreed small action and a five-minute follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Reliable support protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Reliable support action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Support may
    be asynchronous, remote, translated or practical rather than verbally expressive. The recipient can
    decline feedback or further help. An unavailable friend is not a practice target; use a fictional
    rehearsal until a welcome opportunity arises.
  actions:
  - stable_id: PRACTICE-COMP-1704-RELIABLE-SUPPORT-01-A1
    sequence: 1
    title: Ask for the support mode and check your capacity
    instructions: 'Acknowledge what the person actually said and ask whether they would prefer listening,
      a practical task, ideas, encouragement, help speaking to someone or some space. State what you can
      realistically offer and when. For the default, you might say I can listen for twenty minutes now
      or help with one errand tomorrow. Acknowledge needs you cannot safely meet rather than making an
      open-ended promise.


      Observation checks: The person is asked what form of support they want; All offered help fits your
      actual time and competence; A limit is stated before an open-ended commitment develops; Needs beyond
      the role are acknowledged rather than hidden. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1704-RELIABLE-SUPPORT-01
      action_stable_id: PRACTICE-COMP-1704-RELIABLE-SUPPORT-01-A1
      competency_stable_id: '17.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
