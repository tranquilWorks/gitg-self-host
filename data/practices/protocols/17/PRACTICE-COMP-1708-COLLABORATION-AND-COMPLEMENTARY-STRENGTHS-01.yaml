  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after saving a guide and contribution
      plan.


      Mira confirms Room B. Dev updates the draft but accidentally leaves “Room A” in the title. Jo catches
      the disagreement between title and body; Dev corrects both. The correction takes five extra minutes,
      which Dev freely agrees to spend. Nobody has agreed to any further work.


      A fictional newcomer reads the corrected guide and identifies 14:00 on 3 October and Room B correctly.
      Asked where to enter, the reader says “I cannot find Pine Street on this map.” The group has not
      supplied a map; the reader expected one. The public desk is understood as the question route. No
      actual venue visit or revised-direction test has occurred.


      Record a real contribution within the fiction: Mira verified facts; Dev drafted and revised; Jo
      found inconsistent room labels; you coordinated the sequence. Keep private acknowledgment as agreed.
      The extra five minutes is coordination/rework cost, not proof Dev is inefficient. The entrance remains
      a usability question: ask whether clearer textual directions suffice before promising a map. A proposed
      addition is not a successful retest, and no isolated-work comparator exists.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Make one small shared product whose usefulness can be checked. Allow fifteen minutes to agree
      roles, thirty to work and ten to review. The real route needs willing collaborators with authority
      over their own contributions; use the complete fiction below when that is unavailable. A solo plan
      prepares for collaboration but cannot demonstrate a real handoff or joint benefit.


      ### Learn the distinction


      Complementarity concerns the work: one person can verify venue facts, another can organize a clear
      explanation, and another can notice what a newcomer cannot infer. These capabilities need not reside
      in different people, and a confident speaker is not automatically the leader. Ask about current
      skill, interest in learning, access needs and available time. A permanent label such as “the creative
      one” can conceal expertise and trap someone in unwanted work.


      Coordination connects contributions. A role needs a bounded output, a recipient and a time; “everyone
      helps” leaves the integration work invisible. A handoff also needs a return path for questions.
      If the writer discovers a contradictory address, the fact owner should help resolve it. Silently
      repairing everything can produce a polished product while hiding an unsustainable collaboration.


      Difference becomes useful when it changes the product or catches a problem. Disagreement alone is
      not added value. Agree a definition of done before dividing tasks, and examine both benefit and
      coordination cost afterward. A successful joint guide does not prove the team outperformed isolated
      work without a credible comparison. It can support the narrower claim that identifiable contributions
      improved particular parts.


      Credit describes what people actually did, including checking, coordination and revision. Ask how
      contributors wish to be named; public recognition is not everyone''s preference. Sharing credit
      does not mean inventing equal workloads or treating a factual correction as an attack on dignity.
      Acknowledging a missed handoff can be respectful and accurate at once.


      ### Worked example


      Two people prepare a meeting reminder. Bea knows the new room; Sol writes the invitation. Sol''s
      attractive draft retains the old room from a previous message. Bea checks it before circulation,
      Sol revises it, and they ask a willing reader to locate the meeting from the revised version. The
      reader succeeds. They can identify a prevented wrong-room instruction and a usable revision. They
      cannot claim that two people are always faster: checking and revision also consumed time. If Bea
      had never received the draft, naming Bea as verifier would be false credit.


      ### Supplied fictional task


      The Elm hobby group needs a one-page welcome guide. Its confirmed facts are: free paper-craft session,
      Saturday 3 October, 14:00–15:00, Cedar Hall Room B, entrance on Pine Street, materials provided,
      and questions through the group''s public desk. Do not invent a private phone number or accessibility
      guarantee. A newcomer should be able to name where, when and how to ask a question.


      Mira volunteers to check facts and has ten minutes. Dev volunteers to draft and wants practice making
      instructions clearer, with twenty minutes available. Jo volunteers to review from a newcomer perspective
      for ten minutes. Jo cannot see the tiny entrance label in the initial mock-up. All agree to these
      roles, to private acknowledgment, and to a draft handoff by 13:20. Mira''s verified fact note is
      due at 13:10. At the starting point, Dev has an older note saying Room A; no corrected draft or
      reader test exists yet. You coordinate, but cannot spend other people''s time beyond their offers.


      ### Make and inspect the work


      1. Write the three newcomer questions as the definition of done. Record each willing role, available
      minutes, output and recipient. Include your own coordination work. Ask which task Dev wants to learn
      rather than assigning solely by past speed. Output: a small role agreement, not a personality inventory.

      2. Prepare Mira''s verified fact note from the supplied facts. Hand it to the drafter in the fiction.
      Draft the guide yourself as a simulation of Dev''s part, preserving the date, duration, room, entrance
      and public contact route. Output: fact note and a complete usable draft, with fictional authorship
      explicitly marked.

      3. Review the Room A/Room B conflict with the fact owner and enlarge or rewrite the entrance information
      so meaning does not depend on tiny print. In real work, return questions to the relevant contributor
      rather than quietly taking over. Output: the specific mismatch, its resolution and the revised artifact.

      4. Save that version before opening the [later packet](?resource=file-later-packet-md). Use its
      reader response to judge the three questions separately. Then write a contribution account that
      participants could correct, plus the time or rework that coordination cost. Output: demonstrated
      benefit, unresolved usability, accurate credit and one process change.


      The review is incomplete if it only says “great teamwork.” Identify the exact improvement and its
      source. If the reader still cannot find the entrance, a correct date does not cancel that defect.
      Keep proposed repair separate from a successful retest.


      ### Adjust and transfer


      For support, use two willing people, a three-sentence guide and asynchronous written handoffs. Permit
      dictated text, large print or another workable format. Reduce the task before borrowing unoffered
      labor. A facilitator may clarify the agreement but should not substitute an absent person''s contribution
      and call it teamwork.


      For a harder attempt, change one verified fact after drafting. Require a version check so the obsolete
      fact does not survive in one copy. Do not manufacture a crisis or surprise a collaborator to test
      loyalty. For real transfer, choose a modest shared artifact people actually want, get role agreement,
      complete the handoffs, and ask a willing intended user to try the result. Record any actual feedback
      without private contact details. One successful trial supports this product, not a permanent team
      ranking.


      ### Sources and limits


      [S01](https://dash.harvard.edu/entities/publication/13a7b031-0fdd-45ec-a7e0-2b80e2bc679f) reports
      an association between team psychological safety and learning behavior in a particular workplace
      study. [S02](https://credit.niso.org/implementing-credit/) provides a research contribution model
      in which roles can be clarified and confirmed. This exercise adapts those ideas; neither source
      validates this task or measures a person''s worth. Do not recruit involuntary workers, expose confidential
      work, or claim productivity superiority from the fictional example. Review the scope and limits
      described in this guide, then attempt the [fresh cases](?attempt=practice-checks).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A skilled editor is assigned all revisions despite offering ten minutes; the team needs
      forty. The final document is excellent. What has and has not succeeded?

      2. Two contributors share the same research role and a third organizes their notes. Must one researcher
      lose credit because the role is duplicated?

      3. A joint guide passes a reader test, but no solo attempt or fair comparison was made. What benefit
      claim is supportable?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Product quality may be good, but the unagreed thirty minutes violates the role agreement
      and hides the true cost. Renegotiate scope or timing and recognize actual labor; an excellent result
      does not retroactively establish willing capacity.

      2. Both can receive accurate research credit, with coordination recognized separately and naming
      permission checked. Roles may be shared. Credit is a description of contribution, not a contest
      to allocate one exclusive title.

      3. Describe the usable product and identifiable improvements from particular contributions. Do not
      claim that collaboration was faster or better than isolated work without a credible comparison.
      A passed reader task is useful evidence with a narrower conclusion.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
