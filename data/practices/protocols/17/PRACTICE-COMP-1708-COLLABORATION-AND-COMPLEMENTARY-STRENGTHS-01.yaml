meaning_and_fit:
  purpose: Coordinate complementary capabilities, clear interfaces and shared credit so that a joint effort
    benefits from difference rather than merely dividing labor invisibly.
  why_recommended: Coordinate complementary capabilities, clear interfaces and shared credit so that a
    joint effort benefits from difference rather than merely dividing labor invisibly.
  claims:
  - statement: Coordinate complementary capabilities, clear interfaces and shared credit so that a joint
      effort benefits from difference rather than merely dividing labor invisibly.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Collaboration and complementary strengths practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Collaboration and complementary strengths as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Collaborate asynchronously, use accessible formats or choose a smaller task.
    A solo plan can prepare for collaboration but cannot prove complementary teamwork. Do not use confidential
    work or unpaid coercive labor to make the task consequential.
  opportunity_considerations: 'Default task: prepare a one-page welcome guide for a hobby group. One person
    may know the group’s practical details, another may explain clearly and another may notice confusing
    layout. Use at least two willing people, existing materials and a small definition of done: a guide
    a newcomer can use.'
  prerequisites:
  - 'Default task: prepare a one-page welcome guide for a hobby group. One person may know the group’s
    practical details, another may explain clearly and another may notice confusing layout. Use at least
    two willing people, existing materials and a small definition of done: a guide a newcomer can use.'
  dependencies: []
  safe_alternatives:
  - Collaborate asynchronously, use accessible formats or choose a smaller task. A solo plan can prepare
    for collaboration but cannot prove complementary teamwork. Do not use confidential work or unpaid
    coercive labor to make the task consequential.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Collaboration and complementary strengths differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Collaboration and complementary
    strengths as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default task: prepare a one-page welcome guide for a hobby group. One person may know the group’s
    practical details, another may explain clearly and another may notice confusing layout. Use at least
    two willing people, existing materials and a small definition of done: a guide a newcomer can use.
    Goal: Coordinate complementary capabilities, clear interfaces and shared credit so that a joint effort
    benefits from difference rather than merely dividing labor invisibly. Scope: Choose a safe, low-stakes
    task with willing collaborators. This is not an employment assessment, personality typing exercise
    or authority to assign someone a role against their preference. Time and effort: Fifteen minutes to
    agree roles, a thirty-minute joint task and ten minutes to review the collaboration. Adaptation: Collaborate
    asynchronously, use accessible formats or choose a smaller task. A solo plan can prepare for collaboration
    but cannot prove complementary teamwork. Do not use confidential work or unpaid coercive labor to
    make the task consequential. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Collaborate asynchronously, use accessible formats or choose a smaller task. A
    solo plan can prepare for collaboration but cannot prove complementary teamwork. Do not use confidential
    work or unpaid coercive labor to make the task consequential.
  expected_burden: Fifteen minutes to agree roles, a thirty-minute joint task and ten minutes to review
    the collaboration.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Collaboration and complementary strengths protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Collaboration and complementary strengths action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Collaborate
    asynchronously, use accessible formats or choose a smaller task. A solo plan can prepare for collaboration
    but cannot prove complementary teamwork. Do not use confidential work or unpaid coercive labor to
    make the task consequential.
  actions:
  - stable_id: PRACTICE-COMP-1708-COLLABORATION-AND-COMPLEMENTARY-STRENGTHS-01-A1
    sequence: 1
    title: Ask about strengths, interests and support needs before assigning roles
    instructions: 'State the shared outcome and ask each person what they can contribute, what they would
      like to learn and what constraints affect them. Distinguish a demonstrated capability from a personality
      label or status assumption. Agree roles such as fact checking, drafting and newcomer review, including
      how each person can ask for help or change scope. No role is treated as less dignified because it
      is less visible.


      Observation checks: The shared outcome is agreed before roles are assigned; Capabilities interests
      and constraints are asked rather than inferred; Roles and help routes are explicit; Visibility or
      status does not determine the value of a contribution. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1708-COLLABORATION-AND-COMPLEMENTARY-STRENGTHS-01
      action_stable_id: PRACTICE-COMP-1708-COLLABORATION-AND-COMPLEMENTARY-STRENGTHS-01-A1
      competency_stable_id: '17.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
