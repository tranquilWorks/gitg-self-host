  - stable_id: PRACTICE-COMP-1708-COLLABORATION-AND-COMPLEMENTARY-STRENGTHS-01-A3
    sequence: 3
    title: Test the joint result and distribute credit accurately
    instructions: 'Have a willing newcomer or role-playing reviewer use the guide to answer where to go,
      when to arrive and whom to ask. Correct one issue together. Name each contribution in the final
      acknowledgment with permission, including less visible checking or coordination work. Review whether
      collaboration added value, created avoidable overhead or relied on one person rescuing the task,
      and adjust the next division of work accordingly.


      Observation checks: The joint output is tested against the intended use; A correction is made collaboratively;
      Credit includes visible and less visible contributions; Added value and coordination burden are
      both reviewed. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What could the group produce because the contributions differed, and where did an
      unclear handoff prevent that difference from becoming useful?


      Examples: Supportive: The fact expert, writer and reviewer produced a guide that a newcomer could
      use, and the final acknowledgment included the checking work.


      Mixed: The guide improved, but one person repeatedly rescued unclear handoffs, leading to a simpler
      role agreement next time.


      Contradictory: Roles were assigned from stereotypes or one person claimed the whole result while
      hiding others’ work.


      Inconclusive: A group discussed strengths but never completed or tested a shared task.'
    expected_time: 15-25 minutes
