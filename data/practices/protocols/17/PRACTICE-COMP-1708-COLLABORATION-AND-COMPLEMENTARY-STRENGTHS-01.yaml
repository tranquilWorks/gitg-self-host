  - stable_id: PRACTICE-COMP-1708-COLLABORATION-AND-COMPLEMENTARY-STRENGTHS-01-A2
    sequence: 2
    title: Work through a defined handoff and resolve one mismatch
    instructions: 'Create the guide using the agreed roles and a handoff point: verified facts go to the
      drafter, and the draft goes to the reviewer. Check one actual mismatch, such as a room name that
      the reviewer cannot locate, by returning to the responsible fact owner rather than blaming the person
      who noticed it. Share enough context for the next person to work and do not silently redo their
      contribution without discussion.


      Observation checks: A real task and handoff occur; Each person receives the context needed for their
      role; A mismatch is resolved through the agreed interface; Corrections do not erase another person’s
      agency or contribution. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
