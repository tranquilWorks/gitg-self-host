    kind: concept
    title: Learn and try
    body: 'Explore one sustainable way of belonging. Begin with a twenty-minute map, then make an actual
      participation attempt if suitable, followed by ten minutes of review. A crowded calendar is not
      the goal. You may use the complete fictional route without approaching anyone; distinguish planning
      from actual participation and repeated belonging.


      ### What a social ecology contains


      Close or intimate connection can provide personal understanding, but it need not be romantic. Communal
      connection comes from participation in shared practices or purposes. Professional or learning relationships
      can offer knowledge, recognition and cooperation. Intergenerational ties bring contact across life
      stages; local ties connect you to people and places in ordinary daily life. One relationship can
      serve several functions. You do not need a separate person in every category.


      Ask what connection does as well as who is present. Companionship, practical support, shared purpose
      and recognition are different functions. A workplace may provide three while leaving weekends empty.
      That does not make coworkers inadequate or create an entitlement to their off-duty time. Similarly,
      one close person cannot be required to supply every kind of support indefinitely.


      Loneliness concerns an unwanted gap in connection; solitude can be welcome. Few relationships can
      be satisfying, while many contacts can feel thin or unsafe. Mark a category as present, desired,
      unchosen or currently inaccessible rather than automatically treating an empty box as a defect.
      A map is useful if it reveals a meaningful need or dependence and a realistic next step, not if
      it creates a social quota.


      Participation becomes sustainable through fit: interest, welcome, cost, transport, communication
      access, energy and caregiving all matter. Structural barriers are not evidence of weak motivation.
      A recurring activity offers another opportunity to recognize people, but attendance does not guarantee
      friendship or relief from loneliness. The question after a first visit is often whether a second
      ordinary visit is feasible.


      ### Worked example


      Rae enjoys quiet evenings and has a trusted distant friend, but all nearby contact depends on work.
      Rae wants shared local activity rather than a more intimate confidant. A weekly gardening group
      looks appealing until its travel time conflicts with caregiving. Choosing a monthly accessible repair
      session is a better experiment than promising weekly gardening and repeatedly missing it. The distant
      friendship remains valuable. Rae''s decision addresses one desired function without treating every
      empty category as a problem.


      ### Complete fictional starting material


      Alex has one close friend reached by a welcome weekly call, regular work collaboration, and no current
      local activity. Alex enjoys drawing, wants company while making things, and does not currently want
      another intimate relationship. Contact across generations is desired if it arises naturally, not
      a requirement to find an older or younger friend.


      The library''s public notice confirms an open, free drawing table on Saturdays 10:00–11:00. Materials
      are provided. The level entrance and a quiet table have been confirmed by staff for Alex''s stated
      needs; other access features are unknown. The bus ride takes twenty minutes each way, with buses
      leaving home at 09:30 and the library at 11:10. Alex must be home by 11:40 for an existing responsibility
      and has energy for one hour of activity. There is no reservation requirement. Alex''s first proposed
      visit is 3 October; the following Saturday is 10 October.


      No attendance, welcome, friendship or mood improvement has happened at the starting point. The notice''s
      openness permits attendance, not private access to other participants. You must still follow the
      activity''s ordinary boundaries.


      ### Map, participate and decide


      1. Make a five-form map using the information above. Add the function each present tie provides
      and mark unknowns honestly. Identify Alex''s desired local companionship and dependence on work
      for nearby contact. Output: a functional map with no popularity score, ranking of people or requirement
      to fill all forms.

      2. Check the visit against the stated constraints. Calculate arrival, return home and remaining
      margin. Write a small participation intention: join the table, greet someone if welcome, draw, and
      learn how the group works. Output: a feasible first-visit plan and a specific uncertainty to observe,
      such as whether newcomers can join without existing friends.

      3. In a real attempt, actually attend and take a modest permitted role; do not stop at registration
      or browsing a listing. Note one observed participation fact and any welcome feedback freely offered.
      In the fictional route, save your plan and open the [later packet](?resource=file-later-packet-md).
      Output: what occurred, not a claimed relationship that has not formed.

      4. Review the next opportunity, including changed responsibilities. Choose return, alternative or
      defer with an actual date or review trigger. Output: a sustainable next step and a modest account
      of benefit and remaining uncertainty. Returning once is evidence of another visit, not proof that
      isolation has ended.


      If participation is disappointing, distinguish an ordinary first-visit awkwardness from an inaccessible
      format or hostile treatment. You may try a different setting without labeling yourself incapable
      of belonging. A useful review can conclude that a particular activity does not fit.


      ### Support, challenge and transfer


      With support, ask a trusted person to help check public access information or accompany you if both
      want that. A remote or asynchronous recurring group may fit better; check its participation and
      privacy expectations. The helper should not promise relationships on your behalf. If no option is
      presently accessible, identify the barrier and a realistic resource or future review point; do not
      fabricate an attendance success.


      For a harder case, remove the one setting that currently provides most contact and examine which
      functions would remain. This is a thought experiment, not an instruction to withdraw from work or
      a close relationship. For real transfer, repeat a fitting activity when feasible, notice whether
      participation becomes easier or more meaningful, and seek welcome feedback without asking strangers
      to rate your loneliness. Preserve chosen solitude. Persistent distress or serious isolation may
      warrant appropriate professional or community support beyond this exercise.


      ### Evidence and boundaries


      [S03](https://www.hhs.gov/sites/default/files/surgeon-general-social-connection-advisory.pdf) distinguishes
      the structure, functions and quality of connection and recognizes social conditions. It does not
      validate a five-box score or promise that one activity changes health. Keep private names and sensitive
      relationship histories out of the application. Self-description can guide a choice, but actual participation
      and later observations are separate evidence. The scope and limits described in this guide preserves
      the canonical measurement boundary. Try the [fresh cases](?attempt=practice-checks) before their
      answers.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. Noor has two satisfying friendships and enjoys being alone. A worksheet says five categories
      must be filled. What should change?

      2. A free group lasts until 19:00, but the only verified return trip gets home at 20:10 and a care
      responsibility starts at 20:00. Is “free and welcoming” enough?

      3. After one club visit, Pat knows where materials go and was greeted kindly. What can Pat record
      without claiming established belonging?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Remove the quota. Explore only unwanted gaps or fragile dependence that matter to Noor.
      Chosen solitude and a small satisfying network do not establish a deficiency, and social forms can
      overlap.

      2. No: the verified plan is ten minutes late. Check a genuinely available shorter visit or travel
      alternative, choose another setting, or defer. An unconfirmed care substitute cannot repair the
      plan on paper.

      3. Record participation, learned procedure and the observed greeting. Friendship, durable membership
      and reduced loneliness remain unestablished. A feasible next visit can gather further evidence without
      demanding instant intimacy.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
