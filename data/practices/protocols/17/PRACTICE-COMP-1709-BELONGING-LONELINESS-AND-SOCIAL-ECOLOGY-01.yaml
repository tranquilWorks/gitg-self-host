  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Psychological Safety and Learning Behavior in Work Teams](https://dash.harvard.edu/entities/publication/13a7b031-0fdd-45ec-a7e0-2b80e2bc679f)

      - [How to implement CRediT](https://credit.niso.org/implementing-credit/)

      - [Our Epidemic of Loneliness and Isolation: The U.S. Surgeon General’s Advisory](https://www.hhs.gov/sites/default/files/surgeon-general-social-connection-advisory.pdf)

      - [Pursuing Meaningful Work: A Guide for PhDs and Postdocs](https://careered.stanford.edu/sites/g/files/sbiybj22801/files/media/file/stanfordphd_pmw_18-19.pdf)

      - [The Science of Effective Mentorship in STEMM — interactive guide](https://nap.nationalacademies.org/resource/25568/interactive/)

      - [UNESCO Universal Declaration on Cultural Diversity](https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity)

      - [Receptiveness to Opposing Views: Conceptualization and Integrative Review](https://journals.sagepub.com/doi/abs/10.1177/10888683211061037)

      - [Green flags in relationships](https://www.loveisrespect.org/resources/green-flags-in-relationships/)

      - [What consent does—and doesn’t—look like](https://www.loveisrespect.org/resources/what-consent-does-and-doesnt-look-like/)

      - [Machine learning uncovers the most robust self-report predictors of relationship quality across
      43 longitudinal couples studies](https://pubmed.ncbi.nlm.nih.gov/32719123/)

      - [Are adult attachment styles categorical or dimensional? A taxometric analysis of general and
      relationship-specific attachment orientations](https://pubmed.ncbi.nlm.nih.gov/25559192/)

      - [Intimacy as an Interpersonal Process: The Importance of Self-Disclosure, Partner Disclosure,
      and Perceived Partner Responsiveness in Interpersonal Exchanges](https://www.affective-science.org/pubs/1998/LaurenFBPl1998.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after the map and travel calculation.


      Alex arrives at 09:50 on 3 October, joins the drawing table at 10:00 and stays until 11:00. One
      participant explains where shared pencils go; Alex returns them at the end. Alex reports enjoying
      drawing alongside others but does not learn anyone''s contact details or establish a friendship.
      The bus leaves at 11:10 and arrives home at 11:30, ten minutes before the responsibility.


      For 10 October, that responsibility moves to 11:15. The same full visit and return bus would now
      arrive fifteen minutes late. No earlier bus or substitute caregiver has been confirmed. Alex can
      attend on 17 October under the original schedule, provided the session still runs; its date needs
      confirmation.


      Keep the first visit as actual participation within the fiction. Do not convert enjoyment into a
      loneliness cure or claim a cross-generational tie from seeing mixed ages. The immediate next visit
      is infeasible as planned. A shorter visit needs verified transport, not wishful timing. Deferring
      to a confirmed 17 October session is a reasonable option, with the existing close friendship and
      work ties still valued.'
