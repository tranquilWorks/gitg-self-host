  - stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01-A2
    sequence: 2
    title: Try one recurring setting with a small participation role
    instructions: 'Verify that the group or activity is open, accessible, affordable and aligned with
      an actual interest. Attend one session or use its legitimate remote route. Aim to learn how participation
      works, greet one person and take a small appropriate part rather than force instant closeness. Notice
      cost, travel, energy, welcome and whether returning would be realistic. Do not claim membership
      or belonging from simply reading the group’s page.


      Observation checks: The setting is checked against actual access and resource constraints; A real
      participation opportunity is attempted; The role is small and appropriate rather than an intimacy
      demand; Practical fit and welcome are observed separately. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01
      action_stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01-A2
      competency_stable_id: '17.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1709_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1709_a2_primary
        kind: artifact
        role: primary
