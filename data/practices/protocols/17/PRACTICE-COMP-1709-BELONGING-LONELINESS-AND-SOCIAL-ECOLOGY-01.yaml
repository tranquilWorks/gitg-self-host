meaning_and_fit:
  purpose: Understand the different forms of connection in your life and cultivate one feasible additional
    setting so that all belonging does not depend on one person or place.
  why_recommended: Understand the different forms of connection in your life and cultivate one feasible
    additional setting so that all belonging does not depend on one person or place.
  claims:
  - statement: Understand the different forms of connection in your life and cultivate one feasible additional
      setting so that all belonging does not depend on one person or place.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Belonging, loneliness, and social ecology practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Belonging, loneliness, and social ecology as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a remote group, accessible community service, mutual-interest exchange
    or a smaller familiar setting. Financial, geographic, care and health barriers may be structural rather
    than motivational; choose a feasible route and seek support rather than blaming yourself for unavailable
    opportunities.
  opportunity_considerations: 'Use a private page with five forms of connection: close personal, communal,
    professional or learning, intergenerational and local. Write setting descriptions rather than names
    in any shared record. Default experiment: attend one low-cost recurring interest group that can be
    reached within your actual time and access limits.'
  prerequisites:
  - 'Use a private page with five forms of connection: close personal, communal, professional or learning,
    intergenerational and local. Write setting descriptions rather than names in any shared record. Default
    experiment: attend one low-cost recurring interest group that can be reached within your actual time
    and access limits.'
  dependencies: []
  safe_alternatives:
  - Use a remote group, accessible community service, mutual-interest exchange or a smaller familiar setting.
    Financial, geographic, care and health barriers may be structural rather than motivational; choose
    a feasible route and seek support rather than blaming yourself for unavailable opportunities.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Belonging, loneliness, and social ecology differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Belonging, loneliness, and
    social ecology as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page with five forms of connection: close personal, communal, professional or
    learning, intergenerational and local. Write setting descriptions rather than names in any shared
    record. Default experiment: attend one low-cost recurring interest group that can be reached within
    your actual time and access limits. Goal: Understand the different forms of connection in your life
    and cultivate one feasible additional setting so that all belonging does not depend on one person
    or place. Scope: This is a social-ecology experiment, not a treatment for loneliness or a requirement
    for a large network. Solitude, few close relationships and different social capacities can all be
    legitimate. Time and effort: Twenty minutes to map settings, one ordinary participation opportunity
    and a ten-minute review after returning or deciding not to return. Adaptation: Use a remote group,
    accessible community service, mutual-interest exchange or a smaller familiar setting. Financial, geographic,
    care and health barriers may be structural rather than motivational; choose a feasible route and seek
    support rather than blaming yourself for unavailable opportunities. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a remote group, accessible community service, mutual-interest exchange or a
    smaller familiar setting. Financial, geographic, care and health barriers may be structural rather
    than motivational; choose a feasible route and seek support rather than blaming yourself for unavailable
    opportunities.
  expected_burden: Twenty minutes to map settings, one ordinary participation opportunity and a ten-minute
    review after returning or deciding not to return.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Belonging, loneliness, and social ecology protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Belonging, loneliness, and social ecology action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a remote
    group, accessible community service, mutual-interest exchange or a smaller familiar setting. Financial,
    geographic, care and health barriers may be structural rather than motivational; choose a feasible
    route and seek support rather than blaming yourself for unavailable opportunities.
  actions:
  - stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01-A1
    sequence: 1
    title: Map what each current setting provides and where it is fragile
    instructions: 'For the five forms, record present, desired, unchosen or currently inaccessible. Note
      where you receive companionship, practical support, shared purpose or ordinary recognition, without
      expecting one relationship to provide everything. Identify a dependency such as all contact occurring
      through one workplace or partner. Choose one gap that matters to you, not one that merely makes
      the map look incomplete.


      Observation checks: Five forms of connection receive an honest disposition; Different functions
      are not all assigned to one relationship; One meaningful dependency or desired gap is identified;
      Unchosen solitude or low social capacity is not scored as a deficit. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01
      action_stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01-A1
      competency_stable_id: '17.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1709_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1709_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - five_forms_of_connection_receive_an_honest_disposition
        - different_functions_are_not_all_assigned_to_one_relationship
        - one_meaningful_dependency_or_desired_gap_is_identified
        - unchosen_solitude_or_low_social_capacity_is_not_scored_as_a_deficit
      - measurement_id: c1709_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
