        expected: true
  - stable_id: PRACTICE-COMP-1709-BELONGING-LONELINESS-AND-SOCIAL-ECOLOGY-01-A3
    sequence: 3
    title: Choose a sustainable next contact or a reasoned alternative
    instructions: 'After the attempt, decide whether to return once, try a different setting or defer
      because the burden outweighs the value. If returning, put one realistic next occasion into your
      plan and carry out a small follow-up when appropriate. Compare the new setting’s function with existing
      relationships rather than replacing them or declaring loneliness solved. Persisting distress or
      major isolation may warrant additional support beyond a group experiment.


      Observation checks: A return alternative or deferral has a concrete reason; Any follow-up is proportionate
      to the actual contact; The new setting complements rather than automatically replaces existing ties;
      One visit is not presented as resolved loneliness or established belonging. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What kind of connection did the new setting actually offer, and is returning sustainable
      enough to reduce a real dependency over time?


      Examples: Supportive: The participant found a recurring local activity that offered casual recognition
      beyond work and chose one realistic return date.


      Mixed: The group was welcoming but travel and sensory burden made it unsuitable, so the next experiment
      used a closer quieter setting.


      Contradictory: People were collected to fill network categories or one visit was declared a cure
      for loneliness.


      Inconclusive: A social map was completed without testing any feasible participation route.'
    expected_time: 15-25 minutes
    due_within_days: 10
