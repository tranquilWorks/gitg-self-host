        - practical_fit_and_welcome_are_observed_separately
      - measurement_id: c1709_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1709_a2_adverse
        kind: boolean
        role: adverse
