    kind: prompt
    title: Practice checks
    body: '1. A volunteer''s alternative event is rejected after fair consideration. Does that alone prove
      the group demands conformity?

      2. A club requires safety training to operate machinery. A member wants freedom of conscience to
      waive training for everyone. Who can decide?

      3. A secretary promises to forward a concern and the member records “policy changed.” What is the
      correction?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
