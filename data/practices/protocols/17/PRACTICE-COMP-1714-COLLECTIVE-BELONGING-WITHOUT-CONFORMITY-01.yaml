        expected: true
  - stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01-A3
    sequence: 3
    title: Choose continued participation, a limit or exit from the actual response
    instructions: 'Record whether the group considered, accepted, rejected or deferred the proposal and
      how dissent was treated. Decide whether you can continue with a stated limit, seek another authorized
      review or leave. Preserve the dignity of members who choose differently and do not pretend your
      concern vanished merely to remain accepted. If retaliation or coercion appears, prioritize support
      and safety rather than escalating the exercise.


      Observation checks: The actual response to the concern is recorded; Continued participation and
      conscience limits are considered separately; Acceptance is not purchased by pretending agreement;
      Retaliation or coercion changes the response to support and safety. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What did loyal contribution and honest disagreement each require, and did the group’s
      response leave room for both belonging and conscience?


      Examples: Supportive: The member completed their volunteer task, proposed a lower-cost alternative
      and remained involved with an explicit attendance limit after a respectful disagreement.


      Mixed: The concern was heard but rejected; the member chose a narrower role rather than falsely
      claiming agreement.


      Contradictory: The group or participant demanded sameness as proof of loyalty or punished members
      for a safe principled concern.


      Inconclusive: The person complained privately but neither contributed, used an appropriate channel
      nor chose a clear boundary.'
    expected_time: 15-25 minutes
