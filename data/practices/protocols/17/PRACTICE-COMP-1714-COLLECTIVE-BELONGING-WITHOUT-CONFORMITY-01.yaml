meaning_and_fit:
  purpose: Participate loyally in a chosen community without hiding an important concern or demanding
    that every member think and live the same way.
  why_recommended: Participate loyally in a chosen community without hiding an important concern or demanding
    that every member think and live the same way.
  claims:
  - statement: Participate loyally in a chosen community without hiding an important concern or demanding
      that every member think and live the same way.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Collective belonging without conformity practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Collective belonging without conformity as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use private written feedback, a representative or an anonymous channel only
    when its limits are understood. Some groups have legitimate role requirements; not every disagreement
    requires changing them. A fictional exercise cannot prove that a real community tolerates dissent.
  opportunity_considerations: 'Default case: a hobby group wants every member to attend an expensive annual
    event. You value the group but believe cost and availability should allow an alternative. Use the
    group’s actual decision process or a fictional rehearsal, not a surprise public confrontation.'
  prerequisites:
  - 'Default case: a hobby group wants every member to attend an expensive annual event. You value the
    group but believe cost and availability should allow an alternative. Use the group’s actual decision
    process or a fictional rehearsal, not a surprise public confrontation.'
  dependencies: []
  safe_alternatives:
  - Use private written feedback, a representative or an anonymous channel only when its limits are understood.
    Some groups have legitimate role requirements; not every disagreement requires changing them. A fictional
    exercise cannot prove that a real community tolerates dissent.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Collective belonging without conformity differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Collective belonging without
    conformity as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: a hobby group wants every member to attend an expensive annual event. You value
    the group but believe cost and availability should allow an alternative. Use the group’s actual decision
    process or a fictional rehearsal, not a surprise public confrontation. Goal: Participate loyally in
    a chosen community without hiding an important concern or demanding that every member think and live
    the same way. Scope: Use a safe, low-stakes group issue and an authorized channel. This is not a requirement
    to expose yourself to retaliation, breach confidentiality or remain in a harmful organization. Time
    and effort: Fifteen minutes to prepare, one contribution and one appropriate expression of concern,
    followed by a ten-minute review. Adaptation: Use private written feedback, a representative or an
    anonymous channel only when its limits are understood. Some groups have legitimate role requirements;
    not every disagreement requires changing them. A fictional exercise cannot prove that a real community
    tolerates dissent. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use private written feedback, a representative or an anonymous channel only when
    its limits are understood. Some groups have legitimate role requirements; not every disagreement requires
    changing them. A fictional exercise cannot prove that a real community tolerates dissent.
  expected_burden: Fifteen minutes to prepare, one contribution and one appropriate expression of concern,
    followed by a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Collective belonging without conformity protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Collective belonging without conformity action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use private
    written feedback, a representative or an anonymous channel only when its limits are understood. Some
    groups have legitimate role requirements; not every disagreement requires changing them. A fictional
    exercise cannot prove that a real community tolerates dissent.
  actions:
  - stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01-A1
    sequence: 1
    title: Separate the group’s purpose from a contested expectation
    instructions: 'Write what you genuinely value and contribute to the group, then identify the specific
      expectation you question. State the good the rule may protect, such as shared experience, and the
      cost it may impose, such as excluding members with limited resources. Check whether the expectation
      is a formal rule, an informal norm or your assumption. Identify the proper decision or feedback
      channel before acting.


      Observation checks: The group’s valued purpose is distinguished from one contested norm; Both the
      rule’s intended good and its cost are considered; Formal rule informal norm and assumption are separated;
      An appropriate channel for concern is identified. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01
      action_stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01-A1
      competency_stable_id: '17.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1714_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1714_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_group_s_valued_purpose_is_distinguished_from_one_contested_norm
        - both_the_rule_s_intended_good_and_its_cost_are_considered
        - formal_rule_informal_norm_and_assumption_are_separated
        - an_appropriate_channel_for_concern_is_identified
      - measurement_id: c1714_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1714_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
