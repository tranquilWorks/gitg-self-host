        expected: true
  - stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01-A2
    sequence: 2
    title: Make a contribution and express a bounded alternative
    instructions: 'Complete a real agreed contribution to the group without using it as payment for being
      heard. Through the appropriate channel, state the concern and propose an alternative, such as a
      low-cost local activity or optional attendance, explaining how it could preserve the shared purpose.
      Invite disagreement and acknowledge implementation costs. Do not speak for absent members or demand
      public declarations of loyalty from others.


      Observation checks: A genuine contribution occurs independently of the disagreement; The concern
      includes a workable alternative and its costs; The proposal uses the group’s appropriate channel;
      Other members are not conscripted into a public loyalty test. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01
      action_stable_id: PRACTICE-COMP-1714-COLLECTIVE-BELONGING-WITHOUT-CONFORMITY-01-A2
      competency_stable_id: '17.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1714_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1714_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_genuine_contribution_occurs_independently_of_the_disagreement
        - the_concern_includes_a_workable_alternative_and_its_costs
        - the_proposal_uses_the_group_s_appropriate_channel
        - other_members_are_not_conscripted_into_a_public_loyalty_test
      - measurement_id: c1714_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
