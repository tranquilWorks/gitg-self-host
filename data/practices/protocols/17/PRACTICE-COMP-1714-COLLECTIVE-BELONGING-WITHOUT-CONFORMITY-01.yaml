      - [Green flags in relationships](https://www.loveisrespect.org/resources/green-flags-in-relationships/)

      - [What consent does—and doesn’t—look like](https://www.loveisrespect.org/resources/what-consent-does-and-doesnt-look-like/)

      - [Machine learning uncovers the most robust self-report predictors of relationship quality across
      43 longitudinal couples studies](https://pubmed.ncbi.nlm.nih.gov/32719123/)

      - [Are adult attachment styles categorical or dimensional? A taxometric analysis of general and
      relationship-specific attachment orientations](https://pubmed.ncbi.nlm.nih.gov/25559192/)

      - [Intimacy as an Interpersonal Process: The Importance of Self-Disclosure, Partner Disclosure,
      and Perceived Partner Responsiveness in Interpersonal Exchanges](https://www.affective-science.org/pubs/1998/LaurenFBPl1998.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after the contribution and committee
      note.


      Within the fiction, you finish the fifteen-minute inventory and report two missing consumables.
      The committee replies that retreat attendance is optional and says the “committed members” wording
      will be removed. It has not yet circulated a revised message. It declines to add the local afternoon
      this month because neither room nor host is confirmed. It permits a future proposal with those details.


      You decide to continue attending regular free sessions, decline the retreat and make no new hosting
      commitment. The secretary acknowledges the decision. No subsequent member reactions are supplied,
      so social pressure after the reply remains unknown.


      Record completed inventory, the committee''s statement of optionality, its promised wording change
      and its rejection of this month''s alternative separately. Do not claim the new event was approved
      or that all pressure has ended. Your contribution did not purchase assent. Other members may attend
      the retreat without sharing your budget or priorities; that choice alone is not evidence of their
      disrespect. A future proposal needs real feasibility and willingness, not a fictional booking.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Contribute to a group you value while handling one important disagreement honestly. Allow fifteen
      minutes to clarify the issue, time for one actual contribution and an authorized concern, then ten
      minutes to review. This is not a requirement to dissent publicly. Where refusal risks retaliation,
      use the fiction or appropriate safe support instead.


      ### Complete inventory card


      For the fictional inventory, expected contents are four labeled practice mats, two instruction folders,
      one roll of removable tape and one pack of blank cards. Counted contents: all four mats and both
      folders; tape and cards are absent. Record quantities present and the two missing consumables. Do
      not buy replacements without authority. This paper count is preparation; the later packet narrates
      a fictional completed inventory.


      ### Loyalty and conscience together


      A group can provide meaning, continuity, practical cooperation and a place to belong. Loyalty can
      include maintaining its useful practices, doing agreed work and considering other members'' needs.
      It does not require every preference or judgment to become identical. Conscience concerns a considered
      limit or conviction; it should not be reduced to whichever choice is most convenient today.


      Distinguish the group''s purpose from the contested rule. A conservation club may legitimately require
      safety training for a field role. That does not make every expensive social trip essential to membership.
      Conversely, disliking a genuine role requirement does not give one member authority to waive it.
      Check whether the expectation is formal, informal or merely assumed, and who can decide an exception
      or change.


      Contribution and voice are related but not a purchase. Performing a useful task can express commitment,
      yet no one must earn the right to raise a concern by doing extra unpaid work. Nor does volunteering
      entitle someone to have their proposal accepted. Keep contribution voluntary and the disagreement
      visible on its own merits.


      Dissent can be a specific proposal: preserve the valued purpose, identify the burden, offer a feasible
      alternative and name its costs. Do not claim to represent absent members without permission. A quiet
      or private channel may be appropriate if it reaches someone authorized to consider the issue. An
      anonymous process may have limits; do not promise protection you cannot verify.


      The response can be considered, accepted, rejected or deferred. Being heard does not mean getting
      your way. You may continue within an honest limit, use an available review process or leave when
      the arrangement is incompatible with conscience or dignity. Respect others'' different choices,
      including those who remain. A group cannot require harmful sameness merely by calling it unity.


      ### Worked example


      A reading group treats attending a costly annual retreat as a sign of commitment. A member values
      the readings but cannot afford the trip. They ask whether retreat attendance is actually required
      and suggest an optional local discussion. The organizer confirms that ordinary membership does not
      depend on travel. This resolves one access concern without cancelling a trip others enjoy. If the
      local session has no willing organizer, it remains a proposal, not a benefit the member can promise
      to everyone.


      ### Complete fictional group situation


      The Birch hobby association exists to share skills through monthly free sessions. Its written membership
      description requires respectful conduct and following workshop safety instructions; it does not
      mention a retreat. An informal message says “committed members all come” to a two-night annual trip
      costing 240 units. You value the group, cannot spend more than 20 units on this occasion and object
      to treating spending as a loyalty test.


      You have already freely agreed to a fifteen-minute equipment inventory at the next regular session.
      You can fulfill it independently of the retreat decision. The secretary confirms that concerns about
      event arrangements can be sent privately to the committee, which decides the calendar. The secretary
      can forward a concern but cannot approve a new event. A room for an optional local afternoon might
      be available for 20 units, but availability and a host are unconfirmed. Other members'' preferences
      and budgets are unknown.


      ### Contribute and raise the concern


      1. Write what you value about the group and the exact disagreement. Separate the written membership
      requirements, informal pressure and your own interpretation. Output: purpose, actual rule status,
      personal limit and the authority that can consider a change. Do not call every rule conformity or
      every discomfort a violation.

      2. Complete the already agreed inventory in a real route, or specify its fictional output: a list
      of available items and missing consumables. Do not invent performed work. Output: the contribution
      and its actual completion status, explicitly independent of whether the concern is accepted.

      3. Draft a private committee note stating your own limit, the concern about a spending test and
      the optional local alternative. Include unconfirmed room and host requirements. Save it before opening
      the [later packet](?resource=file-later-packet-md). Output: a truthful proposal with no claim that
      all absent members agree or that the secretary has approved it.

      4. Classify the actual response and decide your next step. Continue with a limit, ask through an
      authorized review route, or consider a safe departure if necessary. Output: decision status, unresolved
      facts and what you will do. A promise to discuss something is not a calendar booking.


      If the group changes the expectation, still check whether the alternative can operate without shifting
      unpaid work onto one person. A formally optional event can remain socially coercive if members are
      shamed for declining; later conduct matters, not only revised wording.


      ### Support, difficulty and transfer


      For support, rehearse the note privately or use a verified representative or feedback channel. Choose
      a concern of modest consequence and avoid exposure of private finances. If the only channels invite
      retaliation, seeking appropriate advice or not attempting live dissent is legitimate. Do not stage
      a confrontation to generate evidence.


      For a harder fictional case, let the proposed alternative conflict with a genuine safety or resource
      requirement. Preserve the underlying concern while revising the method. For real transfer, complete
      a wanted contribution, raise a suitable concern with authority, and observe the response and subsequent
      treatment. A rejected proposal may coexist with respectful belonging; acceptance alone does not
      prove freedom from conformity.


      ### Sources and limits


      [S01](https://dash.harvard.edu/entities/publication/13a7b031-0fdd-45ec-a7e0-2b80e2bc679f) offers
      limited workplace evidence about interpersonal risk and learning, not assurance that speaking up
      is safe in every group. [S06](https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity)
      supplies a normative dignity boundary for cultural participation. Neither grants decision authority
      or replaces local legal and safeguarding support. Use the scope and limits described in this guide
      and [fresh cases](?attempt=practice-checks); record actual conduct separately from your hopes for
      the community.'
