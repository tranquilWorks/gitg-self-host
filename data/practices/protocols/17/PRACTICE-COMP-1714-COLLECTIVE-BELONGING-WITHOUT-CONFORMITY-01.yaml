  - id: practice-answers
    title: Compare your responses
    body: '1. No. Assess how disagreement and continued participation are treated, the reasons given and
      available options. Voice does not guarantee acceptance. Retaliation or humiliation would be a separate
      concern, not something to infer solely from rejection.

      2. The member cannot unilaterally waive a legitimate safety requirement. Use the authorized process
      for alternatives or choose another role. Conscience and individual dignity do not confer authority
      to expose others to risk.

      3. Record only that forwarding was promised, and later whether it occurred. The secretary''s communication
      role is not policy authority; consideration, acceptance and implementation require their own evidence.'
