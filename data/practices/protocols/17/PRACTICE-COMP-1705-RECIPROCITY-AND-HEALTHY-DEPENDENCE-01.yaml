meaning_and_fit:
  purpose: Share a manageable burden through a direct request, receive help without hidden debt and notice
    whether giving and receiving remain freely chosen.
  why_recommended: Share a manageable burden through a direct request, receive help without hidden debt
    and notice whether giving and receiving remain freely chosen.
  claims:
  - statement: Share a manageable burden through a direct request, receive help without hidden debt and
      notice whether giving and receiving remain freely chosen.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Reciprocity and healthy dependence practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Reciprocity and healthy dependence as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Requests can be written, mediated or limited to information. Receiving care
    may be a legitimate long-term condition and does not require equivalent output to preserve dignity.
    Declined help is not a failed relationship; a fictional rehearsal remains rehearsal.
  opportunity_considerations: Choose a task you can safely ask a willing person to help with, such as
    reviewing a short invitation or carrying a lightweight item where both are comfortable. Define a small
    scope and a fallback if they decline. Do not choose money, hazardous lifting, private credentials
    or a task that creates dependency.
  prerequisites:
  - Choose a task you can safely ask a willing person to help with, such as reviewing a short invitation
    or carrying a lightweight item where both are comfortable. Define a small scope and a fallback if
    they decline. Do not choose money, hazardous lifting, private credentials or a task that creates dependency.
  dependencies: []
  safe_alternatives:
  - Requests can be written, mediated or limited to information. Receiving care may be a legitimate long-term
    condition and does not require equivalent output to preserve dignity. Declined help is not a failed
    relationship; a fictional rehearsal remains rehearsal.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Reciprocity and healthy dependence differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Reciprocity and healthy dependence
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a task you can safely ask a willing person to help with, such as reviewing a short invitation
    or carrying a lightweight item where both are comfortable. Define a small scope and a fallback if
    they decline. Do not choose money, hazardous lifting, private credentials or a task that creates dependency.
    Goal: Share a manageable burden through a direct request, receive help without hidden debt and notice
    whether giving and receiving remain freely chosen. Scope: This is ordinary mutual support, not a repayment
    contract or a demand that every relationship balance in identical units. Essential care and formal
    obligations require their own arrangements. Time and effort: Ten minutes to prepare a request, one
    small exchange and a ten-minute review after the task. Adaptation: Requests can be written, mediated
    or limited to information. Receiving care may be a legitimate long-term condition and does not require
    equivalent output to preserve dignity. Declined help is not a failed relationship; a fictional rehearsal
    remains rehearsal. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Requests can be written, mediated or limited to information. Receiving care may
    be a legitimate long-term condition and does not require equivalent output to preserve dignity. Declined
    help is not a failed relationship; a fictional rehearsal remains rehearsal.
  expected_burden: Ten minutes to prepare a request, one small exchange and a ten-minute review after
    the task.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Reciprocity and healthy dependence protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Reciprocity and healthy dependence action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Requests can
    be written, mediated or limited to information. Receiving care may be a legitimate long-term condition
    and does not require equivalent output to preserve dignity. Declined help is not a failed relationship;
    a fictional rehearsal remains rehearsal.
  actions:
  - stable_id: PRACTICE-COMP-1705-RECIPROCITY-AND-HEALTHY-DEPENDENCE-01-A1
    sequence: 1
    title: Make a clear request with a genuine no option
    instructions: 'State the exact help, expected time and when it is needed: Could you read this short
      invitation and tell me whether the date is clear before tomorrow? Explain that declining is acceptable
      and keep the fallback available. Notice whether pride makes you disguise the request or whether
      anxiety makes you overstate the need. Neither indirect hinting nor a guilt-based appeal gives the
      other person a fair choice.


      Observation checks: The request specifies task time and timing; The person can decline without guilt
      or penalty; A fallback prevents the request from becoming coercive; Pride or anxiety is noticed
      without turning it into a character judgment. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1705-RECIPROCITY-AND-HEALTHY-DEPENDENCE-01
      action_stable_id: PRACTICE-COMP-1705-RECIPROCITY-AND-HEALTHY-DEPENDENCE-01-A1
      competency_stable_id: '17.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
