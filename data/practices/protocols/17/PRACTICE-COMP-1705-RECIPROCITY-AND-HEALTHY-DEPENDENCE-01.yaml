  - stable_id: PRACTICE-COMP-1705-RECIPROCITY-AND-HEALTHY-DEPENDENCE-01-A2
    sequence: 2
    title: Receive the agreed help without taking over or creating a debt
    instructions: 'Allow the person to help in the agreed way and clarify only what is needed for the
      task. Thank them specifically rather than immediately promising an equal favor to erase discomfort.
      If their proposed help exceeds the request, decide together whether it is wanted. When you offer
      help in return at another ordinary opportunity, make it a free offer, not an invoice or a test of
      whether they deserve your support.


      Observation checks: The help stays within an agreed scope; Specific thanks do not create an unspoken
      repayment contract; Additional help is accepted or declined explicitly; Any reciprocal offer remains
      voluntary rather than exact scorekeeping. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
