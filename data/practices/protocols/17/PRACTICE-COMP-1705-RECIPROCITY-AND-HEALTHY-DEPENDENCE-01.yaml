      - [How many hours does it take to make a friend?](https://journals.sagepub.com/doi/10.1177/0265407518761225)

      - [A new look at social support: a theoretical perspective on thriving through relationships](https://pubmed.ncbi.nlm.nih.gov/25125368/)

      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Kit accepts the five-minute review and replies before Wednesday 18:00: “The time is clear, but the
      room is missing.” You verify Room F with the venue and add it. Kit then says, “I can also redesign
      the flyer, but that would take about forty minutes.”


      You do not need a redesign. Thank Kit for the location check and decline the extra offer without
      making a compensating promise. The agreed five-minute review is complete in the fictional case.
      The forty-minute redesign was offered, not accepted or performed.


      Kit has not asked for help with a message. You may remain open to contributing later, but do not
      invent a reciprocal task to close the account. One useful favor establishes neither exploitation
      nor durable mutuality. Record the corrected artifact, agreed scope and actual status of any further
      work.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Healthy dependence includes being able to ask for a little help, receive what was freely offered
      and contribute when you can. It also includes noticing when requests repeatedly ignore another person''s
      limits. In this practice, make one small direct request, use the agreed help and review both usefulness
      and burden. Allow ten minutes to prepare, the actual exchange and ten minutes afterward.


      ### Mutual care need not be equal in each transaction


      Clark and Mills distinguish communal relationships, where benefits respond to needs, from exchange
      relationships organized around comparable repayment [S14](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf).
      The inspected opening pages present a theory, not a rule that all friendships must follow one model.
      The distinction helps explain why immediate repayment can sometimes miss the meaning of care. It
      does not erase explicit agreements, permit exploitation or require anyone to offer unlimited support.


      Giving and receiving involve different vulnerabilities. Giving can become controlling if help purchases
      authority. Receiving can feel exposing if you believe needing anything proves inadequacy. A direct
      modest request makes both the need and the choice visible. “Could you check this invitation for
      five minutes?” is clearer than repeated hints followed by resentment that nobody noticed.


      A genuine no requires more than the words “no pressure.” Your fallback must remain workable enough
      that refusal is possible without blame. If the situation is essential care or a serious dependence,
      it may require a broader support arrangement rather than pretending one friend can freely solve
      it. This small practice excludes money transfers, unsafe lifting, passwords, legal decisions and
      other high-stakes favors.


      Contribution can take many forms: attention, remembering, practical work, encouragement or presence.
      Unequal capacity over long periods does not erase dignity or automatically establish exploitation.
      At the same time, repeatedly demanding help, punishing refusal or denying agreed limits deserves
      attention. Look at the pattern and its effects without turning disability, illness or caregiving
      into a debt.


      ### Worked example: thanks does not need to close the account


      Arun asks a friend to review a short invitation for clarity. The friend agrees to five minutes and
      points out a missing location. Arun uses the correction and says specifically what it helped: “You
      caught the missing room; people can now find us.” Arun does not immediately insist on providing
      five minutes of a service the friend did not request.


      Later, when the friend mentions needing a second pair of eyes on a simple message, Arun may offer
      help freely if capacity allows. That offer need not be an invoice settling the first favor. Nor
      should Arun tell the friend, “Now we''re even, so you owe me next time.” Exact accounting belongs
      where explicitly agreed, such as shared expenses; it is not a measure of each person''s moral value.


      ### Your case: a small invitation review


      The supplied fictional invitation says: “Join our free drawing hour on Saturday 28 November, 10:00–11:00.
      Bring nothing; materials supplied. Reply by Thursday at 18:00 if you would like a place.” You want
      a friend, Kit, to spend at most five minutes checking whether a newcomer can tell when and where
      to attend. You have not yet added the room. You need the review by Wednesday 18:00; if Kit cannot
      help, you can use your own checklist and ask the venue to verify the location. That fallback is
      less informative than a fresh reader but feasible.


      You can later offer a short review of Kit''s non-sensitive message if Kit wants one. No reciprocal
      task has been requested or agreed. This is not a request for Kit to design the event, manage replies
      or be responsible for attendance.


      1. **Write a direct bounded request.** Include the artifact, two questions, five-minute limit and
      Wednesday cutoff. State that declining is fine and that you have another route. Output: a request
      that names the help rather than hinting at your stress.

      2. **Notice your response to needing help.** Privately identify any urge to apologize repeatedly,
      pretend the task is trivial or promise immediate repayment. Then ask without making Kit manage that
      discomfort. Output: a short preparation note about your behavior, not a diagnosis of either person.

      3. **Receive the agreed contribution.** If Kit accepts, allow them to perform the bounded review,
      consider the actual comments and thank them for their use. Do not argue away every suggestion to
      prove self-sufficiency or expand the job silently. Output: what help was actually received and what
      changed because of it.

      4. **Read the [later packet](?resource=file-later-packet-md).** Separate the useful correction from
      an offer of extra work. Decide whether you need that work and whether you have agreed to it. Output:
      a revised invitation, explicit task boundary and remaining uncertainties.

      5. **Review the exchange over time.** Ask whether the request was clear, the burden stayed within
      agreement and the help addressed the need. Consider a later freely chosen contribution only if useful
      and wanted. Output: one thing to preserve or change, without declaring the whole relationship balanced
      after one favor.


      ### Receiving well includes leaving choice intact


      A friend may decline, accept less than requested or help differently. If that does not meet the
      need, acknowledge it and use the fallback. Do not punish the person by withdrawing ordinary warmth
      or making future invitations conditional on favors. A courteous request that receives a no can still
      be a meaningful asking attempt; it is not evidence that help was received.


      For support, choose an artifact with no private content and a task small enough that both parties
      can understand the limit. Written requests can give time to consider. If language or communication
      support is needed, preserve the other person''s ability to accept or refuse, not merely your ability
      to send the request. Solo rehearsal remains preparation.


      For a harder attempt, you notice that one person repeatedly asks for more after agreeing to a limit.
      Address that pattern concretely: what was agreed, what extra work occurred and what you can now
      offer. Do not respond by creating secret tests or refusing all future dependence. If threats or
      coercion enter, use an appropriate safety route rather than this ordinary exchange.


      For transfer, try a different low-stakes role: accept help if you usually give, or offer a specific
      useful contribution if you usually receive. Review the actual experience without insisting on symmetry.
      The [fresh checks](?attempt=practice-checks) distinguish gratitude, boundaries and genuine mutual
      care from compulsory repayment.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These fictional cases have a separate [answer key](?check=practice-answers).


      1. You say “no pressure,” then tell a friend you will stop inviting them if they decline a favor.
      Is refusal genuine?

      2. A friend with less capacity receives more practical help over several months and offers welcome
      attention when able. Does numerical inequality establish exploitation?

      3. A helper offers an extra hour of work beyond an agreed ten-minute task. You neither accept nor
      reject. Can you treat the hour as promised work or as a debt you owe?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. The threatened social penalty contradicts the words. Remove the condition, use a real
      fallback and address any broader relationship concern separately from extracting this favor.

      2. No. Consider consent, capacity, respected limits and the actual forms of contribution. Unequal
      output does not determine dignity or prove exploitation. Repeated entitlement or punished refusal
      would be different evidence.

      3. No. An offer is not an agreement or completed work. Clarify whether the extra task is wanted
      and feasible before reliance. Gratitude for the initial help does not create an unagreed obligation.'
