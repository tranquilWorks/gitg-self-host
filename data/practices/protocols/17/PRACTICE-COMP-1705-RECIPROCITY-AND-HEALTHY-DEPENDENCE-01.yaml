  - stable_id: PRACTICE-COMP-1705-RECIPROCITY-AND-HEALTHY-DEPENDENCE-01-A3
    sequence: 3
    title: Review burden, freedom and the relationship pattern
    instructions: 'Ask yourself and, when appropriate, the other person whether the exchange was useful
      and manageable. Distinguish this one request from a longer pattern: unequal capacity can justify
      unequal contributions, while repeated entitlement or refusal to respect limits may need a conversation.
      Choose one adjustment such as asking earlier, narrowing the task or receiving without apologizing
      repeatedly. Do not calculate a friendship balance sheet.


      Observation checks: Usefulness and burden are reviewed together; One exchange is not treated as
      a complete relationship pattern; Unequal capacity is distinguished from exploitation; A concrete
      adjustment replaces numerical scorekeeping. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What made the request and acceptance genuinely free, and what did you learn about
      dependence that neither prideful self-sufficiency nor exact repayment would capture?


      Examples: Supportive: The participant asked clearly, accepted a short review and thanked the helper
      without promising a compensating favor or apologizing for having a need.


      Mixed: The request was accepted but arrived too late, so the next adjustment was earlier notice
      and a smaller scope.


      Contradictory: The helper treated the favor as leverage or the requester used guilt to make declining
      impossible.


      Inconclusive: The person described the value of mutual aid but neither made nor received a concrete
      request.'
    expected_time: 15-25 minutes
    due_within_days: 10
