        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01-A3
    sequence: 3
    title: Apply one appropriate lesson and maintain a small follow-up
    instructions: 'Choose one safe relevant idea to test, such as introducing yourself to a new group
      before taking on a large role. Carry it out or record why it did not fit. Within two weeks, thank
      the person for the specific perspective and share only what you are comfortable sharing about the
      result. Ask whether another ordinary exchange would be welcome; do not assume ongoing mentorship
      or access from one conversation.


      Observation checks: One lesson is applied or rejected for a specific contextual reason; The follow-up
      refers to the actual exchanged perspective; Ongoing contact is invited rather than presumed; One
      exchange is not reported as an established mentoring relationship. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What did you receive and contribute across the life-stage difference, and which part
      of the advice needed adaptation rather than reverence or dismissal?


      Examples: Supportive: Each person shared a transition lesson, the participant tried one adapted
      idea and followed up without presuming a permanent mentor relationship.


      Mixed: The conversation was warm, but the advice depended on opportunities no longer available and
      was retained as perspective rather than copied.


      Contradictory: Age was used to demand deference or dismiss someone’s experience as obsolete or naive.


      Inconclusive: A biography was collected without reciprocal contribution, contextual reflection or
      follow-up.'
    expected_time: 15-25 minutes
    due_within_days: 10
