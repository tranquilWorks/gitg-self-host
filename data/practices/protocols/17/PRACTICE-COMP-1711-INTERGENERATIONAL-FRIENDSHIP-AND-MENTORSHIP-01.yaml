  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after deciding what to adapt.


      Tess attends the 9 October orientation through the authorized portal process and asks for one bounded
      task. The coordinator offers a trial role with a clear duration. On 16 October, twelve days after
      the exchange, Tess sends the agreed brief follow-up: the direct task question helped, while an unannounced
      visit would not have worked. This is a report within the fiction, not a verified participant outcome.


      Nabil says the portal explanation was useful and that the distinction between asking clearly and
      arriving unannounced makes sense. Nabil declines another meeting this month. No future appointment
      or continuing mentorship is established. There is no basis to infer that Nabil has used the portal
      personally.


      Keep both contributions visible: past experience supplied a question, and current process knowledge
      corrected its delivery route. The twelve-day follow-up falls within the two-week plan. Respect the
      declined meeting; it does not erase the value of the exchange. A later relationship could develop
      with new mutual willingness, but it cannot be claimed from this packet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Arrange a reciprocal exchange across adult life stages, not an interview in which one age group
      supplies all the wisdom. Allow ten minutes to agree a topic, twenty minutes together and a modest
      follow-up within two weeks. Use the supplied fiction when no willing, appropriate contact exists.
      Friendship and ongoing mentorship require mutual willingness over time; one conversation cannot
      establish either.


      ### Perspective without age stereotypes


      Age and life stage can change the circumstances someone has encountered, but they do not establish
      expertise, virtue or technological ability. Ask what the person has actually tried. A younger adult
      may have relevant experience of a transition an older adult is facing; an older adult may be new
      to a particular role. Neither should have to represent a generation.


      Guidance becomes useful when its conditions are visible. “Visit in person” might have worked when
      a small organization welcomed drop-ins; an online appointment system may now make that impossible.
      Keep the underlying lesson, such as asking clearly for a role, separate from the old mechanism.
      Examine technology, institutions, opportunity, care responsibilities and resources before transferring
      advice.


      Reciprocity means that both can receive perspective and contribute something welcome. It need not
      mean equal minutes, equal expertise or a repayment of every kindness. One person might share an
      experience and the other notice a changed process or ask a question that helps the speaker reconsider
      it. Ask whether that contribution is useful instead of assuming that younger people should provide
      technology help or older people should provide life counsel.


      Mentorship also has a boundary. Agree the topic, duration, confidentiality limits and whether another
      exchange is desired. A welcoming first conversation is not permission for ongoing demands. Where
      employment, assessment or care creates power differences, use the appropriate organizational process
      and make declining genuinely possible. Default to adults in an appropriate existing relationship.
      Work involving minors or dependent adults requires authorized programs and applicable safeguarding,
      not private unsupervised recruitment.


      ### Worked example


      An experienced volunteer advises a new coordinator to ask everyone personally to join a rota. The
      new coordinator explains that the current group uses a booking portal and that some members cannot
      take calls. Together they retain the principle of a clear invitation while replacing phone rounds
      with an accessible opt-in message. The volunteer gains an updated understanding of participation
      barriers. The coordinator gains a useful question about making responsibilities explicit. Neither
      person needs to declare the other generation superior.


      ### Complete fictional exchange


      Tess, aged 29 and starting a new volunteer role, and Nabil, aged 67 and recently retired from paid
      work, know each other through an open hobby group. They agree to a twenty-minute conversation on
      4 October about joining an unfamiliar organization. Either may decline a question or use an ordinary
      fictional example. They agree not to discuss private family histories or share the conversation
      publicly.


      Nabil offers one past experience: when joining a small association in 2008, arriving at the office
      and asking the coordinator for a specific task worked well. Tess''s current organization states
      that roles are assigned through an online portal; unannounced visits are not accepted. Tess can
      explain the portal''s publicly posted process if Nabil wants, but has no privileged access or authority
      to place anyone. The current first orientation is on 9 October. Neither has committed to a second
      meeting or an ongoing mentoring role.


      ### Exchange and adapt


      1. Confirm the ordinary topic, twenty-minute limit, right to pass and preferred communication format.
      Write one question each person could ask about an actual transition. Output: a mutual agenda with
      no obligation to disclose painful events or defend an age group.

      2. Ask what was tried, which conditions made it work and what the person would now reconsider. Record
      Nabil''s specific experience separately from the general lesson you infer. Invite correction of
      your summary. Output: one experience, one possible lesson and at least one transfer limit. A quote
      remembered imperfectly should be described as a paraphrase.

      3. Offer a relevant contribution back: Tess can explain the portal if welcome and can ask how to
      state a bounded task preference. Decide what to adapt, reject or defer. Output: a context-sensitive
      next action, not a promise to obey all advice. Save the plan before opening the [later packet](?resource=file-later-packet-md).

      4. Follow up within two weeks if agreed. Report what was actually attempted and what happened, including
      a rejected adaptation or changed plan. Ask whether another exchange would be welcome instead of
      announcing a standing mentorship. Output: a dated follow-up, a concrete influence on thinking or
      conduct and the actual status of future contact.


      A useful exchange may change your question rather than solve your transition. Do not exaggerate
      a small insight into a transformed life. Similarly, respectful disagreement with guidance can demonstrate
      careful reception if you explain the relevant changed conditions without dismissing the person''s
      experience.


      ### Adjust the practice


      For support, exchange short letters, use translation or an agreed communication aid, or prepare
      questions in advance. Make processing time part of the arrangement. An authorized community program
      can help find a willing adult contact. A simulated dialogue is suitable preparation but should not
      be recorded as a relationship with a real mentor.


      For a harder version, compare two conflicting pieces of advice. Ask which conditions each assumes
      and choose a safe, reversible adaptation. Avoid a contest about which generation had life harder.
      For real transfer, repeat an exchange only when both wish, notice whether perspective and care move
      in both directions, and check burden as well as benefit. Maintaining one reciprocal relationship
      is a longer observation than completing today''s conversation.


      ### Source and limits


      [S05](https://nap.nationalacademies.org/resource/25568/interactive/) describes mentorship as a developing
      working relationship and emphasizes expectations and assessment in STEMM education. This informal
      adult exercise borrows those process ideas, not a claim that all intergenerational friendships are
      mentoring programs. No therapeutic, financial or professional qualification is inferred from age.
      Use the scope and limits described in this guide and [fresh cases](?attempt=practice-checks) to
      test whether guidance remains both reciprocal and contextual.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A younger mentor recommends an app that the learner''s organization prohibits. How can the
      learner receive the guidance without following it literally?

      2. An older participant shares a useful experience and declines another meeting. Has the learner
      secured an ongoing mentor?

      3. A plan calls for a follow-up within two weeks of 2 November. The first follow-up occurs on 18
      November. How should it be recorded?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Identify the underlying purpose, explain the actual restriction and seek an authorized alternative.
      Age neither invalidates the idea nor overrides the organization''s rules. A respectful adaptation
      or rejection can still show learning.

      2. No. Record the useful exchange and the refusal of another meeting. Gratitude does not authorize
      recurring contact, and a one-time contribution is not a standing mentorship agreement.

      3. It occurred sixteen days later, outside the fourteen-day plan. Record the late follow-up honestly
      and whatever usefulness is actually known. Kindness or a good outcome does not change the elapsed
      time.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
