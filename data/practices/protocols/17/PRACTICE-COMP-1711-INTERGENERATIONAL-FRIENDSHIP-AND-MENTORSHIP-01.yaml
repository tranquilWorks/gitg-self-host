meaning_and_fit:
  purpose: Build reciprocal understanding across ages or life stages through both receiving perspective
    and offering something useful, with appropriate boundaries and consent.
  why_recommended: Build reciprocal understanding across ages or life stages through both receiving perspective
    and offering something useful, with appropriate boundaries and consent.
  claims:
  - statement: Build reciprocal understanding across ages or life stages through both receiving perspective
      and offering something useful, with appropriate boundaries and consent.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Intergenerational friendship and mentorship practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Intergenerational friendship and mentorship as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use letters, audio, translation, remote calls or a community program with
    suitable safeguarding. For minors or dependent adults, use the authorized program and appropriate
    protections rather than arranging private unsupervised contact through this exercise.
  opportunity_considerations: 'Choose a person at a different life stage with whom contact is already
    appropriate. Default topic: how each person learned to manage an ordinary transition such as starting
    a new group or moving into a new role. Both may use fictional examples or decline private history.'
  prerequisites:
  - 'Choose a person at a different life stage with whom contact is already appropriate. Default topic:
    how each person learned to manage an ordinary transition such as starting a new group or moving into
    a new role. Both may use fictional examples or decline private history.'
  dependencies: []
  safe_alternatives:
  - Use letters, audio, translation, remote calls or a community program with suitable safeguarding. For
    minors or dependent adults, use the authorized program and appropriate protections rather than arranging
    private unsupervised contact through this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Intergenerational friendship and mentorship differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Intergenerational friendship
    and mentorship as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a person at a different life stage with whom contact is already appropriate. Default
    topic: how each person learned to manage an ordinary transition such as starting a new group or moving
    into a new role. Both may use fictional examples or decline private history. Goal: Build reciprocal
    understanding across ages or life stages through both receiving perspective and offering something
    useful, with appropriate boundaries and consent. Scope: Use a willing adult peer, relative or community
    contact. This is not an unsupervised relationship with a child, a substitute for professional mentoring
    or a claim that age determines wisdom. Time and effort: Ten minutes to agree a topic, a twenty-minute
    exchange and one modest follow-up within two weeks. Adaptation: Use letters, audio, translation, remote
    calls or a community program with suitable safeguarding. For minors or dependent adults, use the authorized
    program and appropriate protections rather than arranging private unsupervised contact through this
    exercise. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use letters, audio, translation, remote calls or a community program with suitable
    safeguarding. For minors or dependent adults, use the authorized program and appropriate protections
    rather than arranging private unsupervised contact through this exercise.
  expected_burden: Ten minutes to agree a topic, a twenty-minute exchange and one modest follow-up within
    two weeks.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Intergenerational friendship and mentorship protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Intergenerational friendship and mentorship action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use letters,
    audio, translation, remote calls or a community program with suitable safeguarding. For minors or
    dependent adults, use the authorized program and appropriate protections rather than arranging private
    unsupervised contact through this exercise.
  actions:
  - stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01-A1
    sequence: 1
    title: Agree a reciprocal question and the limits of the exchange
    instructions: 'Ask whether the person would enjoy comparing experiences of a chosen transition. State
      that you are interested in their perspective, not treating them as a representative of all older
      or younger people. Agree a short time and a topic that does not require painful disclosure. Offer
      to share something from your own experience or help with a small relevant task, while making clear
      that the exchange need not be equal in identical units.


      Observation checks: The topic and time are agreed voluntarily; Age is not treated as a complete
      explanation of perspective; Private history and painful disclosure remain optional; Both receiving
      and contributing are possible without exact accounting. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01
      action_stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01-A1
      competency_stable_id: '17.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1711_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1711_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_topic_and_time_are_agreed_voluntarily
        - age_is_not_treated_as_a_complete_explanation_of_perspective
        - private_history_and_painful_disclosure_remain_optional
        - both_receiving_and_contributing_are_possible_without_exact_accounting
      - measurement_id: c1711_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1711_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01-A2
    sequence: 2
    title: Listen for context and contribute a different perspective
    instructions: 'Ask what the person tried, what constraints shaped the choice and what they would now
      do differently. Reflect one lesson and one condition that may not transfer to your situation. Share
      a relevant experience or practical idea of your own and invite correction rather than teaching down
      or dismissing the past. Notice differences in technology, institutions, family responsibilities
      and opportunity without turning them into a contest over which generation had it harder.


      Observation checks: The lesson is linked to its original context; A transfer limit is named rather
      than copying advice wholesale; Your contribution is offered as a perspective open to correction;
      Generational comparison does not become a superiority contest. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01
      action_stable_id: PRACTICE-COMP-1711-INTERGENERATIONAL-FRIENDSHIP-AND-MENTORSHIP-01-A2
      competency_stable_id: '17.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1711_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1711_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_lesson_is_linked_to_its_original_context
        - a_transfer_limit_is_named_rather_than_copying_advice_wholesale
        - your_contribution_is_offered_as_a_perspective_open_to_correction
        - generational_comparison_does_not_become_a_superiority_contest
      - measurement_id: c1711_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1711_a2_adverse
        kind: boolean
