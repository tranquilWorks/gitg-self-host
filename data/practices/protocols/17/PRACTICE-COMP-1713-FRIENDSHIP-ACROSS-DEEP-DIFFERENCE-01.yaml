meaning_and_fit:
  purpose: Name a meaningful disagreement while maintaining care, curiosity and boundaries, without turning
    the friendship into a conversion project or pretending the difference does not exist.
  why_recommended: Name a meaningful disagreement while maintaining care, curiosity and boundaries, without
    turning the friendship into a conversion project or pretending the difference does not exist.
  claims:
  - statement: Name a meaningful disagreement while maintaining care, curiosity and boundaries, without
      turning the friendship into a conversion project or pretending the difference does not exist.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Friendship across deep difference practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Friendship across deep difference as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing, a narrower topic or a fictional comparison when live discussion
    is not welcome. Deep differences can limit a relationship’s scope; preserving conscience may sometimes
    require distance. This practice does not obligate friendship across every disagreement.
  opportunity_considerations: Use an existing friend with whom a difference in religion, politics, class
    experience, identity or lifestyle can be discussed safely. A supplied low-stakes default is different
    views on how much a person should prioritize career ambition over leisure. Agree that the aim is understanding,
    not reaching consensus.
  prerequisites:
  - Use an existing friend with whom a difference in religion, politics, class experience, identity or
    lifestyle can be discussed safely. A supplied low-stakes default is different views on how much a
    person should prioritize career ambition over leisure. Agree that the aim is understanding, not reaching
    consensus.
  dependencies: []
  safe_alternatives:
  - Use writing, a narrower topic or a fictional comparison when live discussion is not welcome. Deep
    differences can limit a relationship’s scope; preserving conscience may sometimes require distance.
    This practice does not obligate friendship across every disagreement.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Friendship across deep difference differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Friendship across deep difference
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an existing friend with whom a difference in religion, politics, class experience, identity
    or lifestyle can be discussed safely. A supplied low-stakes default is different views on how much
    a person should prioritize career ambition over leisure. Agree that the aim is understanding, not
    reaching consensus. Goal: Name a meaningful disagreement while maintaining care, curiosity and boundaries,
    without turning the friendship into a conversion project or pretending the difference does not exist.
    Scope: Choose a willing safe disagreement. Respect does not require accepting dehumanization, abuse
    or threats, and no one must debate their own dignity or disclose an identity to complete the practice.
    Time and effort: Ten minutes to agree a boundary, a fifteen-minute conversation and one ordinary follow-up.
    Adaptation: Use writing, a narrower topic or a fictional comparison when live discussion is not welcome.
    Deep differences can limit a relationship’s scope; preserving conscience may sometimes require distance.
    This practice does not obligate friendship across every disagreement. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, a narrower topic or a fictional comparison when live discussion is
    not welcome. Deep differences can limit a relationship’s scope; preserving conscience may sometimes
    require distance. This practice does not obligate friendship across every disagreement.
  expected_burden: Ten minutes to agree a boundary, a fifteen-minute conversation and one ordinary follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Friendship across deep difference protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Friendship across deep difference action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    a narrower topic or a fictional comparison when live discussion is not welcome. Deep differences can
    limit a relationship’s scope; preserving conscience may sometimes require distance. This practice
    does not obligate friendship across every disagreement.
  actions:
  - stable_id: PRACTICE-COMP-1713-FRIENDSHIP-ACROSS-DEEP-DIFFERENCE-01-A1
    sequence: 1
    title: Define the difference and what is not up for debate
    instructions: 'State your own position in two sentences and identify the practical or moral question
      on which you differ. Ask whether the friend is willing to discuss it and what topics or language
      should be avoided. Distinguish disagreement about a claim or choice from denying someone’s dignity
      or safety. Choose a time limit and a way to pause if the conversation becomes hostile or personally
      exposing.


      Observation checks: A specific difference is named rather than a whole identity category; The friend
      freely agrees to the conversation; Dignity privacy and safety boundaries are explicit; A time limit
      and pause route are agreed. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1713-FRIENDSHIP-ACROSS-DEEP-DIFFERENCE-01
      action_stable_id: PRACTICE-COMP-1713-FRIENDSHIP-ACROSS-DEEP-DIFFERENCE-01-A1
      competency_stable_id: '17.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1713_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1713_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_specific_difference_is_named_rather_than_a_whole_identity_category
        - the_friend_freely_agrees_to_the_conversation
        - dignity_privacy_and_safety_boundaries_are_explicit
        - a_time_limit_and_pause_route_are_agreed
      - measurement_id: c1713_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1713_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1713-FRIENDSHIP-ACROSS-DEEP-DIFFERENCE-01-A2
    sequence: 2
    title: Represent each view before offering a challenge
    instructions: 'Invite the friend to explain what their position protects or fears losing. Reflect
      the account and ask whether it is fair. Then explain your own reasons, including a cost or uncertainty
      in your view, and invite one question. Ask about one genuine point of tension without setting a
      trap or assembling a rebuttal while they speak. Shared care does not require disguising a substantive
      disagreement as merely different wording.


      Observation checks: The other view is checked for fair representation; Your own reasons include
      a real cost or uncertainty; Questions seek understanding rather than a concession trap; A substantive
      disagreement may remain after clarification. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1713-FRIENDSHIP-ACROSS-DEEP-DIFFERENCE-01
      action_stable_id: PRACTICE-COMP-1713-FRIENDSHIP-ACROSS-DEEP-DIFFERENCE-01-A2
      competency_stable_id: '17.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
