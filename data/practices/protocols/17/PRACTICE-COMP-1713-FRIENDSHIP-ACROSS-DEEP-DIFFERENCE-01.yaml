  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after your fair summaries and genuine
      question.


      Cal corrects the first impression: “I do not think leisure is worthless. I am choosing a demanding
      year, not a rule for everyone.” Imani says, “I admire making things. I do not want income to become
      the measure of whether my drawing matters.” Each says the revised summary captures that distinction.


      They still disagree about how much weekend work they would personally accept. Neither changes a
      career plan. Cal wants to end the topic for today; Imani agrees. They confirm the existing 11 October
      walk at 10:00 without making it conditional on changing views. No claim about future business success
      or permanent harmony is supported.


      Record corrected caricatures, a remaining substantive difference, the respected stop, and the reaffirmed
      ordinary commitment. Confirmation of a walk is not yet attendance. Avoid writing that both now share
      the same values in the same priority order. If a future scheduling conflict arises, it will need
      its own conversation; this packet does not resolve every practical consequence of Cal''s demanding
      year.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Have one bounded, voluntary conversation with an existing friend about a genuine difference,
      followed by ordinary care that does not depend on agreement. Allow ten minutes to agree the topic,
      fifteen for discussion and a later welcome follow-up. The fictional case is sufficient for rehearsal.
      Nobody must debate their dignity, expose an identity or remain in a harmful relationship for practice.


      ### Understand without erasing disagreement


      Deep differences can concern religion, politics, class, identity or lifestyle. A category does not
      tell you a particular person''s view. Ask what your friend actually believes and how it matters
      in their life. Two people sharing a label can disagree sharply; two people with different labels
      can share a practical commitment.


      Religious difference might concern observance, authority or meaning. Political difference might
      concern priorities, institutions or the likely effects of a policy. Class can shape assumptions
      about risk, money and opportunity. Identity-related disagreement can implicate dignity or safety
      and may make discussion inappropriate. Lifestyle differences can concern ambition, leisure, consumption
      or family rhythms. These are routes for careful inquiry, not five conversations you must conduct.


      Fair representation means the other person recognizes their position in your account. It does not
      mean you endorse it or declare all claims equally sound. State your own disagreement plainly enough
      that friendliness does not become concealment. A sincere question seeks information that could change
      your understanding; a conversion trap leads someone through questions toward a predetermined admission.


      Care can persist without turning the friendship into a permanent debate. Remembering an ordinary
      interest, keeping an existing commitment or sharing an enjoyable activity can express that the person
      is more than the dispute. Such care should not be used as a reward for ideological movement. Conversely,
      preserving affection does not require accepting contempt, threats or repeated degradation. Distance
      can be a legitimate boundary.


      ### Worked example


      One friend values stable working hours; another wants to build a demanding small business. The first
      initially hears “ambition means neglecting people,” while the second hears “security means lacking
      courage.” They ask what each is protecting and learn that one fears unreliable care arrangements
      and the other fears losing a meaningful opportunity. Their priorities still differ. They can reject
      those caricatures without agreeing about the best working life.


      ### Complete fictional conversation


      Friends Imani and Cal have enjoyed a monthly free sketch walk for a year. Both are adults and agree
      to a fifteen-minute discussion about work ambition and leisure; either may pause. They will not
      discuss private income, diagnose motives, or use insults. The next sketch walk is already agreed
      for 11 October at 10:00.


      Cal says, “For the next year I want to spend some weekends building my craft business. Making something
      sustainable matters to me.” Imani says, “I protect free weekends because rest and time with people
      matter to me. I do not want every hobby to become paid work.” Cal has not said everyone should run
      a business. Imani has not said paid creativity is wrong. Neither has proposed cancelling their existing
      walk.


      Your first impression is that Cal devalues leisure and Imani lacks ambition. Those are interpretations,
      not supplied facts. You do not know either person''s full circumstances or the eventual business
      outcome. The conversation should discover more without demanding agreement about how either should
      live.


      ### Discuss one real difference


      1. Agree the topic, language limits, duration and pause option. Write each actual position in two
      sentences without attaching a personality verdict. Output: the difference to discuss and what remains
      outside permission. An existing friendship is not blanket consent for every topic.

      2. Ask what each person hopes to protect and worries about losing. Summarize their answer tentatively
      and invite correction. Output: an account they could recognize, with observations separated from
      your interpretation. If no correction or confirmation is available, keep accuracy uncertain rather
      than approving your own empathy.

      3. State your own view, one uncertainty or cost you accept, and one genuine question. Save these
      before reading the [later packet](?resource=file-later-packet-md). Output: a candid disagreement
      that neither attacks dignity nor pretends conversion. You may agree on a smaller practical matter
      while leaving the larger difference unresolved.

      4. End by naming one thing understood and one thing still disputed. Keep or renegotiate ordinary
      commitments for their actual reasons, independent of ideological agreement. Output: the discussion''s
      limited outcome, whether further discussion is welcome, and the status of the sketch walk. Do not
      reward assent with affection or threaten withdrawal to win.


      A pause can protect the friendship, but repeatedly pretending no meaningful difference exists may
      prevent necessary decisions. Ask whether the unresolved difference actually affects a shared commitment.
      If it does, address that concrete consequence through an appropriate process; friendship cannot
      magically remove incompatible obligations.


      ### Support and challenge


      For support, use the fictional lifestyle topic, exchange short written statements or invite an agreed
      facilitator for ordinary low-risk discussion. You can practice recognizing a caricature without
      recruiting a friend from a marginalized group to educate you. Do not use a facilitator to pressure
      someone to debate their rights or painful experiences.


      For a harder case, make the difference affect a shared event and separate understanding from the
      practical decision. Each person''s consent and applicable rules still matter. For real transfer,
      discuss a welcome topic with a willing friend, ask whether your account was fair, and observe whether
      ordinary care remains possible over time. One calm exchange does not establish resilience across
      all religious, political or identity disputes.


      ### Source and evidence limits


      [S07](https://journals.sagepub.com/doi/abs/10.1177/10888683211061037) conceptualizes receptiveness
      as considering opposing views and as influenced by interaction, not merely a private trait. Its
      inspected abstract does not validate this conversation or guarantee persuasion. The safeguards and
      fictional material are original design. Preserve privacy, uncertainty and the right to stop. Consult
      the scope and limits described in this guide, then attempt the [fresh cases](?attempt=practice-checks)
      before reading the corrective answers.'
