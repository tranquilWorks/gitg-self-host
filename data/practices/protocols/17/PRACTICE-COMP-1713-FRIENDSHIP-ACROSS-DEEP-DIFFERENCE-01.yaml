      ### Changed-case answer


      Suggest an activity both can freely accept, such as a walk or meal, and state any actual participation
      limit without requiring agreement with your beliefs. Their changed practice does not by itself show
      rejection. An invitation is not acceptance, and maintaining your own practice need not make friendship
