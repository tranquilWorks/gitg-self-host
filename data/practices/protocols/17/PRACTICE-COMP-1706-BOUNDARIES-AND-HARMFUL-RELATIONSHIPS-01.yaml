        criteria:
        - behavior_recurrence_and_impact_are_described_concretely
        - mismatch_mistake_and_repeated_harm_are_distinguished
        - repair_is_evaluated_by_changed_conduct_rather_than_apology_alone
        - safety_and_dependency_concerns_can_override_an_ordinary_repair_experiment
      - measurement_id: c1706_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
