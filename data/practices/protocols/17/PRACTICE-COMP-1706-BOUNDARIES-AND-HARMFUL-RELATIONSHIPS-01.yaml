meaning_and_fit:
  purpose: Distinguish ordinary mismatch from repeated harm and choose reduced access, support, repair
    or exit without dehumanizing the other person or requiring endless tolerance.
  why_recommended: Distinguish ordinary mismatch from repeated harm and choose reduced access, support,
    repair or exit without dehumanizing the other person or requiring endless tolerance.
  claims:
  - statement: Distinguish ordinary mismatch from repeated harm and choose reduced access, support, repair
      or exit without dehumanizing the other person or requiring endless tolerance.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Boundaries and harmful relationships practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Boundaries and harmful relationships as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use fictional material or a safe device when privacy is uncertain. Housing,
    caregiving, employment and legal duties can complicate distance or exit; obtain appropriate advice.
    Immediate danger warrants local emergency help, and a person is not responsible for another person’s
    abusive choices.
  opportunity_considerations: 'Use a fictional case when real notes could create danger: an acquaintance
    repeatedly mocks a stated limit, offers an apology and repeats the same conduct at the next gathering.
    Prepare headings for behavior, impact, attempted repair, recurrence, safety and a response you control.
    Do not store allegations or identifying details in the application.'
  prerequisites:
  - 'Use a fictional case when real notes could create danger: an acquaintance repeatedly mocks a stated
    limit, offers an apology and repeats the same conduct at the next gathering. Prepare headings for
    behavior, impact, attempted repair, recurrence, safety and a response you control. Do not store allegations
    or identifying details in the application.'
  dependencies: []
  safe_alternatives:
  - Use fictional material or a safe device when privacy is uncertain. Housing, caregiving, employment
    and legal duties can complicate distance or exit; obtain appropriate advice. Immediate danger warrants
    local emergency help, and a person is not responsible for another person’s abusive choices.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Boundaries and harmful relationships differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Boundaries and harmful relationships
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional case when real notes could create danger: an acquaintance repeatedly mocks a
    stated limit, offers an apology and repeats the same conduct at the next gathering. Prepare headings
    for behavior, impact, attempted repair, recurrence, safety and a response you control. Do not store
    allegations or identifying details in the application. Goal: Distinguish ordinary mismatch from repeated
    harm and choose reduced access, support, repair or exit without dehumanizing the other person or requiring
    endless tolerance. Scope: This is a private boundary and support decision, not a diagnosis or a requirement
    to confront, reconcile with or immediately leave an unsafe person. Individualized safety planning
    may be necessary. Time and effort: Twenty minutes for a private or fictional pattern review, one appropriate
    support contact when needed and a ten-minute next-step check. Adaptation: Use fictional material or
    a safe device when privacy is uncertain. Housing, caregiving, employment and legal duties can complicate
    distance or exit; obtain appropriate advice. Immediate danger warrants local emergency help, and a
    person is not responsible for another person’s abusive choices. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fictional material or a safe device when privacy is uncertain. Housing, caregiving,
    employment and legal duties can complicate distance or exit; obtain appropriate advice. Immediate
    danger warrants local emergency help, and a person is not responsible for another person’s abusive
    choices.
  expected_burden: Twenty minutes for a private or fictional pattern review, one appropriate support contact
    when needed and a ten-minute next-step check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Boundaries and harmful relationships protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Boundaries and harmful relationships action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fictional
    material or a safe device when privacy is uncertain. Housing, caregiving, employment and legal duties
    can complicate distance or exit; obtain appropriate advice. Immediate danger warrants local emergency
    help, and a person is not responsible for another person’s abusive choices.
  actions:
  - stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01-A1
    sequence: 1
    title: Describe the pattern and separate its possible meanings
    instructions: 'Record specific behavior and recurrence rather than a personality label. Distinguish
      incompatibility, a repairable mistake, chronic contempt, manipulation and abuse as different concerns,
      without assuming a checklist can adjudicate the relationship. Note whether the person respects no,
      takes responsibility and changes conduct after a repair attempt. Include safety, retaliation, stalking,
      dependency and access to support; a threat does not need repeated occurrences before it deserves
      attention.


      Observation checks: Behavior recurrence and impact are described concretely; Mismatch mistake and
      repeated harm are distinguished; Repair is evaluated by changed conduct rather than apology alone;
      Safety and dependency concerns can override an ordinary repair experiment. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01
      action_stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01-A1
      competency_stable_id: '17.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1706_a1_primary
      transfer_disposition: context_bound
      measurements:
