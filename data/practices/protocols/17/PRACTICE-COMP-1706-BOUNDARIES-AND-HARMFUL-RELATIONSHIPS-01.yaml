  - stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01-A2
    sequence: 2
    title: Select a controllable limit and the support it requires
    instructions: 'For the low-risk fictional acquaintance, a limit might be leaving the conversation
      when mocking begins or attending only group settings. State what you control, what obligation remains
      and what you will not do, such as retaliate or publicly humiliate. For real abuse or likely retaliation,
      do not announce a new limit as an experiment; verify a safe specialist or trusted support route
      and develop an individualized next step through that help.


      Observation checks: The chosen limit concerns your own access or participation; Remaining obligations
      and nonretaliation boundaries are explicit; Unsafe contexts are not used for direct boundary experiments;
      Needed specialist or trusted support is actually identified and verified. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01
      action_stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01-A2
      competency_stable_id: '17.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1706_a2_primary
      transfer_disposition: context_bound
      measurements:
