  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [The Principles of Etiquette](https://emilypost.com/advice/the-principles-of-etiquette)

      - [What is emotional abuse?](https://www.thehotline.org/resources/what-is-emotional-abuse/)

      - [What is gaslighting?](https://www.thehotline.org/resources/what-is-gaslighting/)

      - [Technology Safety Plan: A Guide for Survivors and Advocates](https://www.techsafety.org/resources-survivors/technology-safety-plan)

      - [How To Avoid a Scam](https://consumer.ftc.gov/articles/how-avoid-scam)

      - [The logic of indirect speech](https://pubmed.ncbi.nlm.nih.gov/18199841/)

      - [Autobiography of Intercultural Encounters](https://rm.coe.int/autobiography-of-intercultural-encounters/16806bf02d)

      - [Communication Access](https://www.asha.org/practice/communication-access/)

      - [Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [National CLAS Standards](https://thinkculturalhealth.hhs.gov/clas/standards)

      - [Mistakenly Seeking Solitude](https://faculty.haas.berkeley.edu/jschroeder/Publications/Epley&Schroeder2014.pdf)

      - [How many hours does it take to make a friend?](https://journals.sagepub.com/doi/10.1177/0265407518761225)

      - [A new look at social support: a theoretical perspective on thriving through relationships](https://pubmed.ncbi.nlm.nih.gov/25125368/)

      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Ordinary branch: you leave the exchange and privately tell the host about the repeated unwanted
      nickname. The host says they will speak with Jules before the next gathering. You have not yet attended
      again. Leaving occurred and the host made a promise; changed behavior by Jules is not established.
      You can decide whether another group or a different contact arrangement better fits.


      Separate safety case: imagine a different person threatens to follow you home if you reduce contact,
      and your housing depends on them. Do not carry over the “leave the game conversation” script as
      a sufficient plan. This branch needs safe access to appropriate local support and individualized
      options, not a confrontation or an instruction to exit immediately regardless of consequences.


      For each branch, mark what action occurred, what is proposed and what remains unknown. No actual
      participant evidence, safety assurance, diagnosis or completed exit is supplied by this packet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'A boundary identifies what you will participate in or permit within your control. It does not
      require another person to agree with your account or become remorseful. This practice distinguishes
      ordinary mismatch from harmful patterns, chooses a proportionate controlled response and checks
      its actual effect. Use the fictional case first. Allow twenty minutes to review, any appropriate
      support contact and ten minutes to check what happened.


      ### Different problems call for different routes


      **Incompatibility** can mean that preferred contact, activities or expectations do not fit, without
      either person being abusive. A **mistake** may be isolated and followed by a concrete correction.
      **Chronic contempt** repeatedly treats someone as beneath regard through ridicule or degradation.
      **Manipulation** pressures choice through tactics such as guilt or false obligations. **Abuse**
      can involve intimidation, control or serious harm; you do not need repeated incidents before taking
      a threat seriously. **Repeated non-repair** means the damaging conduct continues despite apology
      or claimed understanding.


      These descriptions guide attention, not diagnosis. The Hotline''s emotional-abuse guidance identifies
      harmful control and threats [S02](https://www.thehotline.org/resources/what-is-emotional-abuse/).
      It does not turn this exercise into a clinical or legal classification. You may decide that contact
      is unwanted without proving abuse, and you may seek help without proving a complete pattern.


      An apology is a statement. Repair requires something observable: correcting an effect, respecting
      a limit or changing future conduct. Warmth immediately after an incident can be welcome yet leave
      the problem unresolved. Ask what changed, over what period and under which conditions. Avoid making
      forgiveness, reconciliation or continued access an exercise requirement.


      ### Safety comes before a boundary performance


      Before acting, consider retaliation, stalking, monitoring, financial or housing dependence, care
      responsibilities and formal obligations. These can make a seemingly simple instruction to “just
      leave” inappropriate. A specialist can help plan around actual constraints. The Hotline''s safety-planning
      guidance treats planning as individualized [S15](https://www.thehotline.org/plan-for-safety/); its
      resources are US-based, so verify a suitable route where you are.


      NNEDV''s Safety Net guidance highlights safer-device considerations and local advocacy [S04](https://www.techsafety.org/resources-survivors/technology-safety-plan).
      If technology may be monitored, do not assume private browsing hides help-seeking. Abruptly changing
      accounts or devices can have consequences; get individualized advice when possible. Do not collect
      allegations in this application''s practice notes, threaten exposure or confront someone to test
      whether the threat is real. For immediate danger, use locally appropriate emergency help when safe.


      ### Worked example: limited contact without a character trial


      An ordinary acquaintance repeatedly turns a person''s stated preference into a joke at hobby meetings.
      There is no supplied threat or dependence. The person can decide to leave a conversation when that
      happens, attend with a different group or stop one-to-one contact. They do not need to win a debate
      about whether they are “too sensitive” before using a controlled option.


      A response such as “I won''t stay in conversations where my request is mocked” describes participation.
      “You must finally understand how cruel you are” demands an internal change the speaker cannot ensure.
      The second sentence can keep someone stuck waiting for validation before acting. The first still
      needs a feasible way to leave; a boundary is not effective merely because it sounds decisive.


      ### Your case: apology followed by repetition


      All facts are fictional. At a free weekly game group, Jules makes jokes about your request not to
      be called a nickname. You clearly ask for your chosen name. Jules apologizes that evening. At the
      next gathering, Jules uses the nickname again and invites others to laugh. You are an independent
      adult visitor, can leave safely by your usual route and have no shared housing, employment or financial
      dependence with Jules. The host controls group participation and welcomes private concerns. There
      is no supplied threat or monitoring.


      1. **Separate six parts of the account.** Write behavior, impact, attempted repair, recurrence,
      safety and controlled response. Record the repeated nickname and apology as observations; do not
      invent Jules''s motive or everyone''s feelings. Output: a concise account grounded in the facts.

      2. **Choose a proportionate action.** You might end the exchange, tell the host what happened with
      only necessary detail, use group-only contact or stop attending this group. Choose what fits your
      actual goal and access needs. Output: the action, how to carry it out and what authority you do
      or do not have.

      3. **Rehearse only the low-risk branch.** A brief statement or no further explanation can accompany
      leaving. Avoid humiliation, threats, retaliation or an endless argument about intent. You cannot
      ban Jules yourself if that is the host''s role. Output: a self-controlled response and a feasible
      exit or alternative.

      4. **Read the [later packet](?resource=file-later-packet-md).** Distinguish your performed action
      from the host''s promise and Jules''s future behavior. Then consider the separate threat branch,
      which stops the ordinary rehearsal. Output: actual status, remaining exposure and a support route
      if the safety conditions change.


      ### Review consequences, not whether you won


      After a real safe action, ask whether access was reduced as intended, whether an unexpected consequence
      appeared and whether further support is needed. Another person''s remorse is not your completion
      criterion. A support contact may be a useful action without establishing that you have exited or
      that the risk is resolved. A plan remains a plan until something happens.


      For support, keep the entire exercise fictional, or speak with a trusted person about a low-risk
      pattern without unnecessary identifying detail. If a real harmful situation is present, verify the
      support service''s locality, contact method, accessibility and availability through a safe route.
      This source cannot provide a personalized safety plan or promise confidentiality across every service.


      For a harder case, the apology is sincere but the conduct still repeats. You can recognize sincerity
      as possible and still reduce access based on the observed pattern. For transfer, use only a safe
      real option or an appropriate support contact; never provoke retaliation to obtain stronger evidence.
      Staying temporarily because of constrained options is not consent to harm or a moral failure. Answer
      the [fresh checks](?attempt=practice-checks) while keeping ordinary mismatch and the safety branch
      distinct.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these fictional cases before [the answers](?check=practice-answers).


      1. Two friends want different contact frequencies and disagree without contempt or threats. Must
      one prove the other abusive to limit contact?

      2. Someone apologizes after each public humiliation, but the behavior continues. What evidence would
      distinguish a promise from repair?

      3. A person who monitors devices threatens retaliation if you seek help. Should you publish a detailed
      account or announce a new boundary to test their response?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      You agreed to help pack for 30 minutes, ending at 15:30. At 15:25 the host asks you to drive a load
      across town afterward; you have not agreed and have another commitment. State the boundary while
      preserving the help already promised.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Incompatibility can justify a different relationship form or less contact without a
      diagnosis or character attack. Discuss a feasible arrangement if welcome, and respect a decision
      not to continue.

      2. Look for actual changed conduct and correction of effects over relevant opportunities, not just
      repeated wording or warmth afterward. You need not tolerate further humiliation to gather a perfect
      dataset before reducing access.

      3. No. Monitoring and retaliation change the safety conditions. Use a safer available route to verified
      specialist or trusted local support for individualized planning; seek emergency help for immediate
      danger when safe. Do not require public disclosure, confrontation, evidence collection or immediate
      exit as proof of agency.


      ### Changed-case answer


      Say you can continue packing until 15:30 but cannot take the drive. If useful, ask the host to arrange
      another driver; do not promise one exists. The added request does not nullify your original commitment
      or require accepting a larger role. A statement becomes follow-through only when the agreed limit
      is kept.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
