  - stable_id: PRACTICE-COMP-1706-BOUNDARIES-AND-HARMFUL-RELATIONSHIPS-01-A3
    sequence: 3
    title: Carry out the safe next step and review the effect
    instructions: 'Implement a low-risk access change only when it is safe and within your authority,
      or make the agreed support contact instead. Record whether the step reduced exposure, created an
      unexpected consequence or needs further support. Do not make the other person’s remorse the success
      condition. A private plan, a contacted advocate and a completed exit are different outcomes and
      must be recorded separately; safety may require a slower or different path.


      Observation checks: A safe action or support contact occurs rather than only an intention; Exposure
      and unintended consequences are reviewed; Success does not require the other person to admit wrongdoing;
      Planning support contact and actual exit are not conflated. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What evidence justified the limit, and did the next step increase safety and agency
      without turning uncertainty into a global verdict or tolerating repeated harm indefinitely?


      Examples: Supportive: The participant recognized repeated non-repair, reduced low-risk social access
      and used a trusted support conversation to check remaining obligations.


      Mixed: The planned limit could have triggered retaliation, so direct contact was deferred in favor
      of specialist safety support.


      Contradictory: The exercise demanded confrontation with an abusive person or framed continued exposure
      as proof of forgiveness.


      Inconclusive: A person was labeled toxic without identifying behavior, safety conditions or a controllable
      next step.'
    expected_time: 15-25 minutes
    due_within_days: 10
