        - unsafe_contexts_are_not_used_for_direct_boundary_experiments
        - needed_specialist_or_trusted_support_is_actually_identified_and_verified
      - measurement_id: c1706_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
