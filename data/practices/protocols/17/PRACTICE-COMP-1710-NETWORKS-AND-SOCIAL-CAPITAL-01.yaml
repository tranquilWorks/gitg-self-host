      - [Green flags in relationships](https://www.loveisrespect.org/resources/green-flags-in-relationships/)

      - [What consent does—and doesn’t—look like](https://www.loveisrespect.org/resources/what-consent-does-and-doesnt-look-like/)

      - [Machine learning uncovers the most robust self-report predictors of relationship quality across
      43 longitudinal couples studies](https://pubmed.ncbi.nlm.nih.gov/32719123/)

      - [Are adult attachment styles categorical or dimensional? A taxometric analysis of general and
      relationship-specific attachment orientations](https://pubmed.ncbi.nlm.nih.gov/25559192/)

      - [Intimacy as an Interpersonal Process: The Importance of Self-Disclosure, Partner Disclosure,
      and Perceived Partner Responsiveness in Interpersonal Exchanges](https://www.affective-science.org/pubs/1998/LaurenFBPl1998.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after your separate permission record.


      Arun replies to the proposed private question: “I cannot take individual questions this month. The
      beginner sheet at the desk is fine to recommend. Please do not share my phone number or add me to
      a chat.” Mina has not requested anything beyond a beginner resource.


      Within this fiction, you direct Mina to the checked public sheet. Mina later says the first shape
      was understandable and wants to try the others independently. No introduction, ten-minute conversation
      or tutoring took place. Arun''s experience remains relevant, but present availability is explicitly
      absent.


      Record the resource offered and Mina''s limited usefulness report. Do not translate “first shape
      understandable” into mastery of all three. Do not reopen the request through another channel, recruit
      someone to persuade Arun, or record a favor owed by Mina. A brief thank-you for Arun''s reply can
      be appropriate without a new request. The original permission from Mina did not authorize disclosure
      to a whole group. If Mina later wants something different, clarify it anew and consider public alternatives
      before seeking another person''s time.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Offer one useful, permission-based connection or resource. Allow ten minutes to clarify the
      need, separate time for each person''s consent, and a brief later check if welcome. Useful networking
      preserves people''s freedom and trust. It does not turn a contact list into a stockpile of favors.


      ### Contribution before access


      A network consists of relationships through which knowledge, opportunity and help may move. Social
      capital names possibilities associated with those relationships; it does not make the people your
      property. A person who once helped can be unavailable now. A highly placed contact may be less relevant
      than a public guide or someone with the specific practical experience needed.


      Ethical contribution can be small: share a checked public resource, answer a question within competence,
      acknowledge another person''s work, or make an introduction both people want. State what you actually
      know about someone. “Has led two beginner sessions” is more defensible than “can solve anything.”
      Do not imply endorsement, employment opportunity or unlimited free advice that was never offered.


      An introduction joins two people''s attention and information. Ask each separately before bringing
      them into a shared message. Permission needs scope: who will receive what details, why, through
      which channel, and what size request is contemplated. One person''s agreement does not provide the
      other''s. A published professional address is not consent to share a private history or enroll its
      owner in a group chat.


      Trust is maintained after the connection too. Let the people decide whether and how to continue.
      You can ask whether the resource was useful without requesting their private conversation. Thank
      a helper without keeping a debt ledger, and continue ordinary contribution even when no immediate
      favor is available. Selectivity about time is compatible with care; relentless follow-up can erode
      the trust the introduction was supposed to support.


      ### Worked example


      An acquaintance asks for help finding beginner sewing instruction. You know Lee has taught classes,
      but you do not know Lee''s present availability. The library''s public course list may answer the
      need without using a personal introduction. If a specific question remains, first ask the acquaintance
      whether you may describe that question and name them to Lee. Then ask Lee privately whether a brief
      exchange is welcome. Only when the permitted details and channel overlap should you connect them.
      “I know someone” is a possibility, not a completed act of help.


      ### Complete fictional case


      Mina is new to a public hobby group and asks you where to learn basic paper folding. Mina wants
      a beginner resource, not a job, paid coaching or a private lesson. You know Arun casually through
      the group. Arun has publicly led two beginner sessions; no current personal tutoring offer is posted.
      The group''s public beginner sheet is available at the desk and covers three starter shapes. You
      have checked that it exists and is free.


      Mina says you may tell Arun that “Mina from the hobby group is looking for a beginner paper-folding
      resource” and may share Mina''s group username, but not a phone number. Arun has not yet been asked.
      You have no authority to reveal either person''s private contact information or add them to a message
      thread. A ten-minute conversation is one possible request; it has not been promised. No benefit
      or reply is guaranteed.


      ### Make the smallest useful connection


      1. Restate the actual need and the least intrusive response. Compare the public sheet with an introduction:
      what would personal contact add? Output: a one-sentence need, one checked resource and a reason
      to ask for more only if necessary. Do not make an introduction solely to demonstrate how well connected
      you are.

      2. Record Mina''s exact permission and the missing permission from Arun. Draft a private question
      to Arun that includes only the approved description, asks whether any brief exchange is welcome,
      and allows an easy refusal. Output: two distinct permission statuses and a bounded request. A saved
      draft is not a sent request or a consent receipt.

      3. Save your proposed action before reading the [later packet](?resource=file-later-packet-md).
      Use the response to decide whether to introduce, offer the public resource, or take no further action.
      If both eventually agree, specify the permitted channel and scope in a short factual introduction.
      Output: an actual disposition, including “no introduction” when permission is absent.

      4. If welcome, check usefulness once without asking for private details or a return favor. Note
      whether you performed the agreed action and whether the person says it helped. Output: contribution
      made, usefulness known or unknown, and any commitment you still owe. Do not record a dossier of
      people''s influence, vulnerability or indebtedness.


      Keep factual permission notes minimal and outside a public application record. For real workplace
      or community contexts, follow applicable confidentiality and conflict-of-interest processes. This
      exercise cannot authorize disclosure of client information, a protected mailing list or internal
      hiring material.


      ### Support and transfer


      For a supported route, use only a public resource and an explicitly fictional permission sequence.
      Practice distinguishing “may ask” from “may introduce.” Someone can help compose a clear message
      without sending it or deciding for the recipient. A declined introduction can be the correct completed
      decision even though the original need remains.


      For a harder route, handle a changed request: the beginner now wants ongoing private tutoring. That
      expansion needs new willingness and scope; earlier permission for one question cannot carry it.
      Do not create artificial scarcity or name-drop to pressure acceptance.


      For real transfer, contribute something relevant in an existing professional or community relationship,
      honor any accepted limits, and maintain the relationship without making every contact a request.
      Later evidence could include a completed introduction and freely offered usefulness feedback. A
      successful introduction alone cannot establish durable trust or prove that a network is ethically
      maintained over time.


      ### Source use


      [S04](https://careered.stanford.edu/sites/g/files/sbiybj22801/files/media/file/stanfordphd_pmw_18-19.pdf)
      describes professional networks as reciprocal relationships for support and information. The separate-consent
      procedure here is original practice design, not a tested result from that career guide. No job,
      influence or reciprocity outcome is promised. Review the scope and limits described in this guide
      and complete the [fresh cases](?attempt=practice-checks); networking competence never determines
      a person''s dignity.'
