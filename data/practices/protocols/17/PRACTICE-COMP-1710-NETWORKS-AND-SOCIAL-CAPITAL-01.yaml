        expected: true
  - stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01-A2
    sequence: 2
    title: Obtain separate permission before connecting people
    instructions: 'Privately ask each person whether they would welcome the introduction and what information
      may be shared. Give the topic and expected scope without exposing a private problem. Only after
      both agree, make a short introduction that explains the common topic and leaves them free to continue
      or not. Never add someone to a group chat, mailing list or public thread merely because an introduction
      seems beneficial.


      Observation checks: Both people consent separately before the introduction; The shared information
      stays within agreed limits; The introduction states a bounded relevant purpose; No automatic group
      chat list or public exposure is created. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01
      action_stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01-A2
      competency_stable_id: '17.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
