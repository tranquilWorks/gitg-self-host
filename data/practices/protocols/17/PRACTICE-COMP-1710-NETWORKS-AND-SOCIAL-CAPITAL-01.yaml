  - stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01-A3
    sequence: 3
    title: Follow up on usefulness without monitoring the relationship
    instructions: 'After a reasonable interval, ask only whether the introduction was useful or whether
      any correction is needed. Do not demand details of their conversation, take credit for later outcomes
      or expect a favor in return. Thank anyone who contributed and update your own understanding of their
      availability without maintaining an intrusive dossier. If either person declined, respect that and
      offer a public resource or no further action.


      Observation checks: Follow-up asks about usefulness rather than private conversation content; No
      return favor or credit is demanded; Availability is treated as changeable and bounded; A declined
      introduction is not pursued through another channel. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Did the connection reduce a real knowledge or support gap while preserving both people’s
      control over their time and information?


      Examples: Supportive: Both people agreed to a short topic-specific introduction, and the later check
      confirmed usefulness without collecting their private discussion.


      Mixed: The potential helper was unavailable, so the participant shared an appropriate public resource
      instead of pushing the introduction.


      Contradictory: Contact details were shared without permission or the introduction was used to create
      a future debt.


      Inconclusive: A list of influential contacts was assembled without any genuine contribution or consented
      connection.'
    expected_time: 15-25 minutes
    due_within_days: 10
