meaning_and_fit:
  purpose: Maintain community or professional relationships through contribution and trust without treating
    people’s time, contact information or status as assets you can trade.
  why_recommended: Maintain community or professional relationships through contribution and trust without
    treating people’s time, contact information or status as assets you can trade.
  claims:
  - statement: Maintain community or professional relationships through contribution and trust without
      treating people’s time, contact information or status as assets you can trade.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Networks and social capital practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Networks and social capital as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: A useful public resource, a small knowledge contribution or a consented written
    introduction can fit when live meetings are difficult. Work and institutional contexts may have confidentiality
    and conflict-of-interest rules; follow them rather than using personal access to bypass process.
  opportunity_considerations: 'Default case: one hobby-group member wants advice on a beginner project
    and another has publicly offered to discuss that topic. You know both casually. Prepare a one-sentence
    reason the connection might be useful and a clear statement that either person may decline.'
  prerequisites:
  - 'Default case: one hobby-group member wants advice on a beginner project and another has publicly
    offered to discuss that topic. You know both casually. Prepare a one-sentence reason the connection
    might be useful and a clear statement that either person may decline.'
  dependencies: []
  safe_alternatives:
  - A useful public resource, a small knowledge contribution or a consented written introduction can fit
    when live meetings are difficult. Work and institutional contexts may have confidentiality and conflict-of-interest
    rules; follow them rather than using personal access to bypass process.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Networks and social capital differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Networks and social capital
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: one hobby-group member wants advice on a beginner project and another has publicly
    offered to discuss that topic. You know both casually. Prepare a one-sentence reason the connection
    might be useful and a clear statement that either person may decline. Goal: Maintain community or
    professional relationships through contribution and trust without treating people’s time, contact
    information or status as assets you can trade. Scope: Use a low-stakes introduction or knowledge offer
    within your authority. This is not sales prospecting, recruiting without consent, access brokerage
    or disclosure of private contact details. Time and effort: Ten minutes to identify a useful connection,
    two brief consent checks and one follow-up after the introduction. Adaptation: A useful public resource,
    a small knowledge contribution or a consented written introduction can fit when live meetings are
    difficult. Work and institutional contexts may have confidentiality and conflict-of-interest rules;
    follow them rather than using personal access to bypass process. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A useful public resource, a small knowledge contribution or a consented written
    introduction can fit when live meetings are difficult. Work and institutional contexts may have confidentiality
    and conflict-of-interest rules; follow them rather than using personal access to bypass process.
  expected_burden: Ten minutes to identify a useful connection, two brief consent checks and one follow-up
    after the introduction.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Networks and social capital protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Networks and social capital action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A useful public
    resource, a small knowledge contribution or a consented written introduction can fit when live meetings
    are difficult. Work and institutional contexts may have confidentiality and conflict-of-interest rules;
    follow them rather than using personal access to bypass process.
  actions:
  - stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01-A1
    sequence: 1
    title: Identify a real need and a contribution that fits
    instructions: 'Ask the person seeking help what question they actually want answered and what format
      or time commitment would be useful. Check whether the potential helper has relevant knowledge and
      has genuinely offered availability, rather than assuming their expertise creates an obligation.
      Consider whether a public resource would meet the need without consuming another person’s time.
      Do not exaggerate either person’s credentials or promise an outcome.


      Observation checks: The need is stated by the person rather than inferred; Relevance and actual
      willingness are distinguished from status; A lower-burden public resource is considered; No credentials
      access or results are exaggerated. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01
      action_stable_id: PRACTICE-COMP-1710-NETWORKS-AND-SOCIAL-CAPITAL-01-A1
      competency_stable_id: '17.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1710_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1710_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_need_is_stated_by_the_person_rather_than_inferred
        - relevance_and_actual_willingness_are_distinguished_from_status
        - a_lower_burden_public_resource_is_considered
        - no_credentials_access_or_results_are_exaggerated
      - measurement_id: c1710_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
