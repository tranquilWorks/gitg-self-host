        criteria:
        - the_setting_allows_an_easy_refusal_or_ending
        - the_intention_is_connection_rather_than_a_hidden_transaction
        - a_relevant_question_and_modest_self_disclosure_are_prepared
        - sensitive_personal_questions_are_excluded_from_the_opening
      - measurement_id: c1701_a1_boundary
        kind: boolean
