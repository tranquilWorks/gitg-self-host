meaning_and_fit:
  purpose: Approach an acquaintance, peer or neighbor with genuine curiosity and appropriate openness
    while leaving the other person free to keep the interaction brief.
  why_recommended: Approach an acquaintance, peer or neighbor with genuine curiosity and appropriate openness
    while leaving the other person free to keep the interaction brief.
  claims:
  - statement: Approach an acquaintance, peer or neighbor with genuine curiosity and appropriate openness
      while leaving the other person free to keep the interaction brief.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Initiating connection practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Initiating connection as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use an online community with clear norms, text, a mutual introduction or an
    accessible quieter setting. A scripted rehearsal can reduce uncertainty but is not an actual connection.
    There is no obligation to disclose, exchange contact information or continue an unwelcome interaction.
  opportunity_considerations: 'Choose a recurring place you already attend, such as a hobby group, class,
    common area or neighborhood event. Prepare an opening tied to the shared context and one small detail
    you are comfortable sharing. Default opening: I am new to this activity; what have you enjoyed about
    it?'
  prerequisites:
  - 'Choose a recurring place you already attend, such as a hobby group, class, common area or neighborhood
    event. Prepare an opening tied to the shared context and one small detail you are comfortable sharing.
    Default opening: I am new to this activity; what have you enjoyed about it?'
  dependencies: []
  safe_alternatives:
  - Use an online community with clear norms, text, a mutual introduction or an accessible quieter setting.
    A scripted rehearsal can reduce uncertainty but is not an actual connection. There is no obligation
    to disclose, exchange contact information or continue an unwelcome interaction.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Initiating connection differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Initiating connection as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a recurring place you already attend, such as a hobby group, class, common area or neighborhood
    event. Prepare an opening tied to the shared context and one small detail you are comfortable sharing.
    Default opening: I am new to this activity; what have you enjoyed about it? Goal: Approach an acquaintance,
    peer or neighbor with genuine curiosity and appropriate openness while leaving the other person free
    to keep the interaction brief. Scope: This is ordinary social initiation, not networking extraction,
    dating pressure or a requirement to approach strangers in an unsafe or unwelcome setting. Time and
    effort: Ten minutes to prepare, one brief natural interaction and five minutes to review. Adaptation:
    Use an online community with clear norms, text, a mutual introduction or an accessible quieter setting.
    A scripted rehearsal can reduce uncertainty but is not an actual connection. There is no obligation
    to disclose, exchange contact information or continue an unwelcome interaction. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an online community with clear norms, text, a mutual introduction or an accessible
    quieter setting. A scripted rehearsal can reduce uncertainty but is not an actual connection. There
    is no obligation to disclose, exchange contact information or continue an unwelcome interaction.
  expected_burden: Ten minutes to prepare, one brief natural interaction and five minutes to review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Initiating connection protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Initiating connection action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an online
    community with clear norms, text, a mutual introduction or an accessible quieter setting. A scripted
    rehearsal can reduce uncertainty but is not an actual connection. There is no obligation to disclose,
    exchange contact information or continue an unwelcome interaction.
  actions:
  - stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01-A1
    sequence: 1
    title: Choose a context where conversation can be freely accepted
    instructions: 'Identify a normal social moment rather than interrupting work, isolating someone or
      approaching a person who cannot easily leave. State your intention privately: to learn a little
      about someone, not obtain a favor, contact, sale or approval. Prepare one context-linked question
      and one modest related detail about yourself. Avoid opening with sensitive identity, income, relationship
      or personal-history questions.


      Observation checks: The setting allows an easy refusal or ending; The intention is connection rather
      than a hidden transaction; A relevant question and modest self-disclosure are prepared; Sensitive
      personal questions are excluded from the opening. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01
      action_stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01-A1
      competency_stable_id: '17.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1701_a1_primary
      transfer_disposition: context_bound
