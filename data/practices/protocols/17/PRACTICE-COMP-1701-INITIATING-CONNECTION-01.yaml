        expected: true
  - stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01-A2
    sequence: 2
    title: Make the opening and follow the actual response
    instructions: 'Introduce yourself or use the shared context, ask the prepared question and listen
      to the answer. Offer your related detail without turning the exchange into a biography. Ask one
      follow-up only if the response suggests the topic is welcome. If the person is busy, brief or uninterested,
      thank them and return to the activity; the completed action is a respectful attempt, not securing
      a new friend.


      Observation checks: An actual welcome-context opening is attempted; Listening and a small contribution
      are both present; A follow-up depends on the person’s response; A brief or declined interaction
      ends without pressure. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01
      action_stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01-A2
