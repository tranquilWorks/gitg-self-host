  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Sam says, “You''re welcome to work on that corner. I''m trying to finish this section quietly before
      I leave.” Sam then asks where the spare pieces are. You know they are in the tray at the other end
      of the table.


      Answer the practical question and respect the quiet preference. Permission to share the table is
      not an invitation to continue personal questions. You can participate alongside Sam without making
      silence awkward or withdrawing as punishment.


      Later Sam says, “Thanks for finding those pieces,” and leaves. No future meeting or contact exchange
      is proposed. Do not add a friendship, private invitation or inferred rejection to the record. Describe
      a respectful brief approach and an accepted limit.


      If this were a real attempt, the actual words and your adjustment would matter more than how charming
      you felt. Here they are supplied learning material only.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Connection can begin with an ordinary observation, a question about a shared activity and a
      little appropriate openness about yourself. The other person must remain free to answer briefly
      or not engage. This practice is one modest approach in a place you already attend, followed by a
      review of your intention and response. Allow ten minutes to prepare, a natural brief interaction
      and five minutes afterward.


      ### Curiosity has no conversion target


      Before approaching, ask what you are trying to obtain. Wanting companionship is understandable.
      Treating the person as a lead, a confidence test or a source of private contacts changes the interaction.
      A useful intention is to learn something about the shared activity while leaving the other person
      room to choose. You are not trying to hit a conversation-length target or collect a new friend.


      Epley and Schroeder''s experiments compared expected and reported experiences of talking with strangers
      in particular settings [S11](https://faculty.haas.berkeley.edu/jschroeder/Publications/Epley&Schroeder2014.pdf).
      The inspected abstract supports questioning some pessimistic expectations; it does not guarantee
      that any particular stranger welcomes contact or that more approaches are always better. Our consent
      and context boundaries are design choices, not a measured effect size.


      A context gives you a starting point, not permission to interrupt indefinitely. With a **stranger**,
      begin from something plainly shared and avoid assuming familiarity. With an **acquaintance**, refer
      to a previous ordinary encounter without claiming closeness. With a **coworker**, respect work demands
      and power differences; service politeness may be part of a role. With a **neighbor**, leave home
      privacy and freedom of movement intact. With a **peer**, use the shared activity without testing
      whether they belong. You need one suitable route, not a requirement to approach all five groups.


      Appropriate openness means offering a small genuine detail that fits the situation: “I''m still
      learning this game,” rather than demanding that the other person disclose first. It does not require
      sensitive family history, income, identity questions or a dramatic confession. Reciprocity can be
      light. A short answer may be all the person wants to give.


      ### Worked example: let the activity do some of the work


      At a recurring drawing session, Lio sees another participant looking at the available pencils. Lio
      asks, “Have you tried these softer ones? I''m finding the darker lines easier to see.” The question
      and small self-detail both concern the activity. If the other person says, “Not yet,” and returns
      to choosing, Lio can say, “Hope you find one that works,” and continue independently.


      If the person asks what Lio is drawing, a short reply and genuine interest in their work can continue
      the exchange. Neither branch is a verdict on Lio''s worth. The quality lies partly in noticing what
      was actually offered, rather than escalating effort until the interaction resembles a successful
      performance.


      ### Your case: a shared puzzle table


      All facts are fictional. You regularly attend a free library puzzle session. Before it begins, Sam
      is sorting edge pieces at an open table. You have seen Sam twice but have not spoken. Sam is not
      working for the venue. People may join or leave freely. No private contact information is provided.
      You also notice a staff member carrying boxes toward a closing cupboard and a neighbor on the way
      out taking a phone call. Those two moments are poor openings for a discretionary chat.


      1. **Choose a person, moment and intention.** Explain why the open puzzle table is a more suitable
      opportunity than interrupting the staff task or phone call. Your intention is to share interest,
      not request a favor or prove likeability. Output: one context choice and a limit on what you will
      ask.

      2. **Make an optional opening.** Rehearse “Mind if I work on this corner? I keep overlooking the
      edge pieces.” Leave room for a no and do not move Sam''s pieces before agreement. Another natural
      opening is acceptable if it fits the supplied activity. Output: a brief opening plus a truthful,
      non-sensitive self-detail.

      3. **Listen before adding a second question.** Respond to the actual answer rather than running
      a prepared interview. Ask a related follow-up only when engagement makes that appropriate, and share
      enough to avoid making the other person do all the work. Output: the offered response and your next
      contribution, or a courteous end.

      4. **Open the [later packet](?resource=file-later-packet-md).** Follow the response that actually
      appears, not the more flattering one you imagined. Future contact is optional and should be mutually
      wanted and intended. Output: a continuation or exit decision with a reason grounded in the supplied
      words.


      ### Review your approach without grading the person


      After a real attempt, note the opening, what the other person actually said and how you adjusted.
      Avoid diagnosing disinterest from a single glance or calling a reserved person unfriendly. You may
      have attempted the practice respectfully even if the conversation stayed brief. You cannot record
      a conversation as attempted if you only rehearsed it in your head.


      If you enjoyed an actual exchange and a future opportunity fits, you may say you expect to attend
      the next session, provided that is true. Do not use “we should meet sometime” merely to obtain a
      warm ending, or ask for a phone number by default. Shared public participation can remain the whole
      relationship for now. Connection does not need immediate escalation.


      For support, choose a familiar structured activity, rehearse in writing or use your normal AAC or
      language support. A greeting followed by a short shared task can be substantive; speed, eye contact
      and witty delivery are not requirements. An informed willing practice partner can help identify
      intrusive wording, but role-play is not real initiation.


      For a harder attempt, the person is warm yet unavailable. Receive both facts without treating warmth
      as permission to override the limit. For transfer, try another welcome context and explain what
      changed because of the role: a neighbor''s doorway is not the same as an open hobby table. Never
      create repeated approaches to someone who declined or use a subordinate''s obligated politeness
      as evidence of mutual interest. Finish with the [fresh cases](?attempt=practice-checks).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These fictional cases have a separate [corrective key](?check=practice-answers).


      1. A cashier answers politely while a queue grows. Is that a good reason to continue asking personal
      questions?

      2. An acquaintance says, “Good to see you; I only have a minute.” How can you honor both the warmth
      and the limit?

      3. You rehearsed an opening but did not approach anyone. The next session is available. What is
      the honest attempt status and next step?'
