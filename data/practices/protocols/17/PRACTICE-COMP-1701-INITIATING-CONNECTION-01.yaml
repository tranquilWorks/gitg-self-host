  - stable_id: PRACTICE-COMP-1701-INITIATING-CONNECTION-01-A3
    sequence: 3
    title: Close with an honest level of future contact
    instructions: 'End by acknowledging something specific from the exchange. When mutual interest is
      apparent, suggest a modest next contact such as talking at the next session, but do not ask for
      private contact details as a default. Review whether you were curious, whether you performed for
      approval and what boundary the other person communicated. Do not treat nonresponse as a verdict
      on either person’s social worth.


      Observation checks: The close acknowledges the actual exchange; Any future contact is proportionate
      and genuinely intended; Curiosity and performance pressure are reviewed separately; The other person’s
      response is not converted into a worth judgment. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What did you learn about the person that was not useful merely as a transaction, and
      how did you leave them room to choose the interaction?


      Examples: Supportive: The participant asked about the shared activity, learned a preference and
      ended warmly without requesting a favor or contact details.


      Mixed: The opening occurred but became a long self-introduction; the next attempt was shortened
      to leave more space.


      Contradictory: The person kept pursuing a conversation after a clear refusal or concealed a sales
      request behind apparent friendship.


      Inconclusive: An opening was rehearsed privately but no real social opportunity was attempted.'
