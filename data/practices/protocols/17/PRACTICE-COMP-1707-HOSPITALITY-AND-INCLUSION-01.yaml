      - [A Theory of Communal (and Exchange) Relationships](https://clarkrelationshiplab.yale.edu/sites/default/files/files/ClarkMills2012.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Lin agrees to turn off the background music and does so before arrival. Bo says conversation is
      easier. Bo watches a round as requested. When ready to join, Bo says the spoken directions rely
      on names for moves that only regulars know. The written sheet also uses those names without explaining
      them.


      Offer a short explanation or demonstration with Bo''s agreement and revise the sheet to define the
      terms. That repair has not yet been tested. Do not say the whole gathering was accessible because
      the music change helped, or that Bo''s request to watch meant they never wanted to play.


      Another participant asks about a serious food allergy. Provide available ingredient and preparation
      information through the host and state the limit honestly; do not promise an allergen-free environment.
      Respect their decision about food or attendance.


      Record one implemented improvement, its supplied reported effect, one newly found barrier and the
      pending retest. None of this constitutes actual participant evidence.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Hospitality includes the practical work that lets people enter, orient themselves and take
      part without performing gratitude or familiarity. This practice asks an authorized host or helper
      to identify one barrier, make a feasible change and ask whether it helped. It can happen in a public
      room or online; owning a home, buying food or hosting a large event is unnecessary. Allow twenty
      minutes to prepare, the gathering and ten minutes for feedback.


      ### Welcome is a sequence of opportunities


      An invitation can be warm but incomplete. A person may not know the cost, entrance, transport options
      or whether arriving late is allowed. At the door, they may not know where belongings go or which
      activity is open to newcomers. During participation, insider stories, noise, inaccessible instructions
      or an expectation of rapid speech can keep them outside the group even while seated in it.


      Notice outsiders without publicly labeling anyone as lonely, disabled or socially awkward. Look
      at the setting and ask a private practical question when appropriate. Someone watching quietly may
      be participating by choice. Inclusion should expand options rather than require everyone to talk,
      eat, disclose, compete or stay for the whole event.


      W3C''s event-access guidance covers planning, participant requirements and accessible activities
      [S09](https://www.w3.org/WAI/teach-advocate/accessible-presentations/). This companion applies that
      planning idea to one small gathering. It does not certify a venue, guarantee universal access or
      replace a person''s own report about what works. Accessibility involves more than announcing good
      intentions.


      Map three stages: **invitation**, **arrival** and **participation**. Across them, consider entrance
      and seating, sensory conditions, communication, time, cost, food and transport. You are not expected
      to solve every barrier at once, but you should avoid hiding a known barrier behind “everyone welcome.”
      State what is available, what is unknown and how a person can ask privately.


      ### Worked example: share the rules, not a test of belonging


      At a small game evening, new visitors are told, “Everyone knows how we do this.” A helper instead
      offers a short explanation of the first round and a visible summary of the rules. Visitors can play,
      watch or ask a question. The helper checks whether a demonstration would be useful without making
      one new person perform for the room.


      A resource such as a spare rule sheet or a quiet seat becomes hospitable when people can actually
      use it. Moving someone to an isolated corner without asking may reduce noise while separating them
      from the group. Ask which option helps, and check the effect. Inclusion cannot be inferred solely
      from the host''s effort.


      ### Your case: a free Saturday gathering


      All facts are fictional. You are an authorized helper for a small game-and-conversation gathering
      on Saturday 5 December, 14:00–15:30, in Room G. Attendance is free and people may leave early. The
      east entrance is level; the west entrance has steps. The nearest bus stop is a six-minute walk away.
      Chairs and a quieter table are available. Simple written game instructions can be supplied. Snacks
      are optional; ingredient packaging will be available, but you cannot guarantee freedom from allergens
      or cross-contact. The host, Lin, accepts private access questions and can confirm venue details.


      The draft invitation currently says only “Games, Saturday, everyone welcome!” A newcomer, Bo, has
      privately said that loud background music makes conversation difficult and that they prefer to watch
      a round before joining. Bo has not agreed to be introduced with a personal story. You control the
      invitation text and may ask Lin to turn off music; you cannot promise a silent room or alter the
      building.


      1. **Map the joining journey.** Fill invitation, arrival and participation with the actual facts
      above. Note cost, time, transport, entry, food information, communication options and an access
      contact. Identify unknowns without diagnosing needs. Output: a usable invitation with truthful limits
      and a private question route.

      2. **Choose one feasible barrier reduction.** Ask Lin to turn off background music and confirm the
      arrangement before advertising it. Keep the quieter table as an option, not an assigned place for
      Bo. Output: one authorized change, who will implement it and how you will check that it happened.

      3. **Make arrival intelligible.** Offer a greeting, show useful locations and explain join/watch/break
      options. Ask before introducing Bo, and use only an agreed name or non-sensitive common interest.
      No one owes a biography, icebreaker performance or food consumption. Output: a brief orientation
      that leaves choices open.

      4. **Support actual participation.** Offer the basic rules and a demonstration if welcome. Share
      available materials without taking over or assuming the newcomer needs instruction in everything.
      Respect Bo''s preference to watch a round. Output: an actual option used or declined, not a claim
      that Bo felt included.

      5. **Read the [later packet](?resource=file-later-packet-md) and ask about a missed barrier.** Use
      a narrow question such as “Was there anything that made joining harder?” Act on a feasible correction
      and keep unresolved issues visible. Output: changed condition, actual reported effect and a next
      adjustment.


      ### Inclusion does not require constant sociability


      A hospitable group can contain quiet observers, early departures and people who decline an activity.
      The useful question is whether those choices remain meaningful and respected. Avoid declaring the
      event successful just because all chairs were occupied or most people laughed. A group may be comfortable
      for regulars while newcomers still lack the context to join.


      For support, choose a short free gathering in a familiar accessible venue, co-host with permission
      or improve the written welcome for an existing group. A remote option may help some people while
      introducing connection or platform barriers for others; check rather than assuming it solves access.
      If no event or willing feedback is available, preparation remains preparation.


      For a harder attempt, a change helps one participant but introduces a new burden elsewhere, such
      as a quieter location that is harder to reach. Reassess with affected people and the authorized
      host. Do not make competing needs a contest over whose presence matters more. For transfer, repeat
      the journey check at a different gathering and verify one actual improvement, while acknowledging
      remaining limits. The [fresh checks](?attempt=practice-checks) focus on choices and practical access
      rather than the host''s self-image.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Try these fictional cases before [the key](?check=practice-answers).


      1. A host introduces a newcomer by sharing a private reason they have been isolated, hoping to make
      everyone kind. What went wrong?

      2. The venue has a level entrance, but the invitation points everyone to a locked stair entrance.
      Is the building feature enough to establish usable arrival?

      3. A participant says the quieter room helped but the unexplained game rules still prevented joining.
      How should you describe the result and next action?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The host disclosed private information without permission and publicly defined the newcomer
      by a vulnerability. Ask before introductions and use agreed non-sensitive information. Good intentions
      do not remove the disclosure or require the person to accept it.

      2. No. Give accurate directions, verify opening and assistance arrangements where needed, and check
      actual use. A physical feature does not repair a misleading route or locked access.

      3. Report a specific improvement and a remaining participation barrier. Offer usable rules or a
      welcome demonstration, then retest the joining task. Do not turn a partial success into universal
      accessibility or blame the participant for not knowing insider terms.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
