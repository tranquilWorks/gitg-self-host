meaning_and_fit:
  purpose: Welcome people through practical information, access, shared resources and low-pressure inclusion
    rather than assuming that an invitation alone creates belonging.
  why_recommended: Welcome people through practical information, access, shared resources and low-pressure
    inclusion rather than assuming that an invitation alone creates belonging.
  claims:
  - statement: Welcome people through practical information, access, shared resources and low-pressure
      inclusion rather than assuming that an invitation alone creates belonging.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Hospitality and inclusion practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Hospitality and inclusion as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: A remote, no-cost, shorter or quieter gathering may fit better than an elaborate
    event. People can help by improving an existing group’s welcome rather than hosting at home. A planning
    rehearsal without guests does not establish actual inclusion.
  opportunity_considerations: 'Default gathering: a small board-game or conversation afternoon using existing
    space and materials. Prepare clear time, location, cost, transport or entry information, food details
    where relevant and a way to ask privately about access. Attendance and participation in each activity
    remain optional.'
  prerequisites:
  - 'Default gathering: a small board-game or conversation afternoon using existing space and materials.
    Prepare clear time, location, cost, transport or entry information, food details where relevant and
    a way to ask privately about access. Attendance and participation in each activity remain optional.'
  dependencies: []
  safe_alternatives:
  - A remote, no-cost, shorter or quieter gathering may fit better than an elaborate event. People can
    help by improving an existing group’s welcome rather than hosting at home. A planning rehearsal without
    guests does not establish actual inclusion.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Hospitality and inclusion differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Hospitality and inclusion
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default gathering: a small board-game or conversation afternoon using existing space and materials.
    Prepare clear time, location, cost, transport or entry information, food details where relevant and
    a way to ask privately about access. Attendance and participation in each activity remain optional.
    Goal: Welcome people through practical information, access, shared resources and low-pressure inclusion
    rather than assuming that an invitation alone creates belonging. Scope: Use a gathering you are authorized
    to host or help organize. Inclusion does not require disclosing someone’s needs, forcing participation
    or promising access arrangements that do not exist. Time and effort: Twenty minutes to prepare, one
    small gathering or existing-group contribution and a ten-minute feedback check. Adaptation: A remote,
    no-cost, shorter or quieter gathering may fit better than an elaborate event. People can help by improving
    an existing group’s welcome rather than hosting at home. A planning rehearsal without guests does
    not establish actual inclusion. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A remote, no-cost, shorter or quieter gathering may fit better than an elaborate
    event. People can help by improving an existing group’s welcome rather than hosting at home. A planning
    rehearsal without guests does not establish actual inclusion.
  expected_burden: Twenty minutes to prepare, one small gathering or existing-group contribution and a
    ten-minute feedback check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Hospitality and inclusion protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Hospitality and inclusion action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A remote, no-cost,
    shorter or quieter gathering may fit better than an elaborate event. People can help by improving
    an existing group’s welcome rather than hosting at home. A planning rehearsal without guests does
    not establish actual inclusion.
  actions:
  - stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01-A1
    sequence: 1
    title: Remove a practical barrier before the invitation
    instructions: 'Walk through what a first-time guest must know and do from receiving the invitation
      to joining the activity. Check entrance, seating, sensory conditions, communication, timing, cost
      and food information without guessing anyone’s diagnosis or finances. Choose one barrier you can
      actually reduce, such as a confusing entrance or an unexplained game. Ask privately about requested
      accommodations and be honest about limitations.


      Observation checks: The invitation-to-participation route is examined; Practical access and resource
      barriers are considered; One feasible barrier reduction is selected; Needs are asked about privately
      without assumptions or false promises. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01
      action_stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01-A1
      competency_stable_id: '17.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1707_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1707_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_invitation_to_participation_route_is_examined
        - practical_access_and_resource_barriers_are_considered
        - one_feasible_barrier_reduction_is_selected
        - needs_are_asked_about_privately_without_assumptions_or_false_promises
      - measurement_id: c1707_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1707_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
