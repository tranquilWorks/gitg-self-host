  - stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01-A3
    sequence: 3
    title: Ask what helped and correct one exclusion
    instructions: 'Afterward, ask a willing participant what made joining easier and what remained difficult.
      Listen for practical exclusion you did not notice, such as background noise or an assumption that
      everyone knew the group’s history. Make one correction for the next gathering or acknowledge an
      unresolved constraint. Record what was changed, not a claim that every guest felt included or that
      the gathering was universally accessible.


      Observation checks: Participant feedback is invited without requiring praise; An overlooked barrier
      can be named without defensiveness; A concrete correction or unresolved constraint is recorded;
      Host intention is not equated with everyone’s felt belonging. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What did someone become able to do because of your change, and which part of hospitality
      depended on listening rather than anticipating everything yourself?


      Examples: Supportive: Clear entrance directions and a short game explanation let a newcomer join
      or observe comfortably, and later feedback identified a noise issue for the next event.


      Mixed: The invitation was welcoming, but the promised access route was not available and needed
      an honest correction.


      Contradictory: A guest’s disability or personal history was announced publicly to explain why the
      group should include them.


      Inconclusive: An event was planned attractively but practical access and participant feedback were
      never checked.'
    expected_time: 15-25 minutes
    due_within_days: 10
