        expected: true
  - stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01-A2
    sequence: 2
    title: Welcome without making the newcomer perform
    instructions: 'At the gathering, greet the guest, explain where useful things are and offer a simple
      way to join, observe or take a break. Introduce people through a shared interest only with appropriate
      permission, not by exposing a personal story. Explain the activity’s basic rules and invite questions
      without making the newcomer prove competence. Offer choices rather than assigning someone the role
      of outsider who must be rescued.


      Observation checks: The guest receives practical orientation and options; Introductions respect
      privacy and consent; Rules or expectations are explained without an expertise test; Observation
      breaks and declining an activity remain legitimate. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01
      action_stable_id: PRACTICE-COMP-1707-HOSPITALITY-AND-INCLUSION-01-A2
