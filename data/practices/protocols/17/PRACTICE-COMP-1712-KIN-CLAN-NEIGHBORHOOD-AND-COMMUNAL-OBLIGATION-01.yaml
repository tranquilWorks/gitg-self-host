        - a_fair_alternative_or_backup_is_considered
        - harm_coercion_and_conscience_conflicts_can_require_support_or_refusal
      - measurement_id: c1712_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1712_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01-A3
    sequence: 3
    title: Complete the agreed part and review fairness over time
    instructions: 'Carry out the contribution or the safe consultation you selected. Confirm that the
      responsible people know what is complete and what remains unassigned. Review whether your action
      reduced a real burden or merely made you appear dutiful while someone else absorbed the hidden work.
      Choose one future adjustment, such as rotating preparation roles, without claiming authority to
      redesign the whole community unilaterally.


      Observation checks: The agreed contribution or consultation actually occurs; Remaining work is not
      silently shifted to someone else; Fairness is reviewed beyond visible performance; A future adjustment
      respects shared authority. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What legitimate communal good did you help sustain, and where did a clear limit prevent
      duty from becoming exploitation or a violation of conscience?


      Examples: Supportive: The participant completed a defined cleanup role and helped make the remaining
      tasks visible so the same relative did not absorb them unnoticed.


      Mixed: The offer was useful but the time limit was never communicated, leading to a later clarification
      rather than silent resentment.


      Contradictory: The person used tradition to justify harm or withdrew essential care to demonstrate
      independence.


      Inconclusive: The duty was either accepted without limits or dismissed without understanding its
      purpose and burdens.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01
      action_stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01-A3
