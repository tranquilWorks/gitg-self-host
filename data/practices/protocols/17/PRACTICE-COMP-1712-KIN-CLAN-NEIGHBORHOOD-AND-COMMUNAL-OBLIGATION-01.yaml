  - stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01-A2
    sequence: 2
    title: Offer a bounded contribution and clarify the limit
    instructions: 'For the gathering, offer a concrete share such as preparing one item or cleaning for
      thirty minutes, with a realistic time and backup if you cannot attend. State any limit respectfully
      and propose another fair route when possible. Do not frame all inherited duties as oppression or
      all refusal as selfishness. If the expectation involves harm, coercion or a serious conscience conflict,
      seek appropriate support instead of performing it to prove loyalty.


      Observation checks: The contribution is specific and feasible; The limit is stated without denying
      the underlying relationship; A fair alternative or backup is considered; Harm coercion and conscience
      conflicts can require support or refusal. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01
      action_stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01-A2
      competency_stable_id: '17.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1712_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1712_a2_primary
        kind: artifact
        role: primary
        weight: '1'
