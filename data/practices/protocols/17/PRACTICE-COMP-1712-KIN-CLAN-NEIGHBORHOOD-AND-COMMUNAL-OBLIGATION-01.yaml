meaning_and_fit:
  purpose: Understand a responsibility attached to family, kin, neighborhood or community membership and
    carry a fair bounded part while identifying harm, exploitation and conscience limits.
  why_recommended: Understand a responsibility attached to family, kin, neighborhood or community membership
    and carry a fair bounded part while identifying harm, exploitation and conscience limits.
  claims:
  - statement: Understand a responsibility attached to family, kin, neighborhood or community membership
      and carry a fair bounded part while identifying harm, exploitation and conscience limits.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Kin, clan, neighborhood, and communal obligation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Kin, clan, neighborhood, and communal obligation as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: A remote, administrative, financial-within-means or occasional contribution
    may fit better than physical presence, but it must be genuinely agreed. For care, housing, immigration,
    inheritance or legal obligations, obtain qualified advice rather than relying on this general exercise.
  opportunity_considerations: 'Default case: a recurring family or neighborhood gathering relies on the
    same few people to prepare and clean up. You have some inherited expectation to help, but limited
    time. Use a non-sensitive account of the task, who benefits, who bears the work and what you can realistically
    contribute.'
  prerequisites:
  - 'Default case: a recurring family or neighborhood gathering relies on the same few people to prepare
    and clean up. You have some inherited expectation to help, but limited time. Use a non-sensitive account
    of the task, who benefits, who bears the work and what you can realistically contribute.'
  dependencies: []
  safe_alternatives:
  - A remote, administrative, financial-within-means or occasional contribution may fit better than physical
    presence, but it must be genuinely agreed. For care, housing, immigration, inheritance or legal obligations,
    obtain qualified advice rather than relying on this general exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Kin, clan, neighborhood, and communal obligation differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Kin, clan, neighborhood, and
    communal obligation as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: a recurring family or neighborhood gathering relies on the same few people to
    prepare and clean up. You have some inherited expectation to help, but limited time. Use a non-sensitive
    account of the task, who benefits, who bears the work and what you can realistically contribute. Goal:
    Understand a responsibility attached to family, kin, neighborhood or community membership and carry
    a fair bounded part while identifying harm, exploitation and conscience limits. Scope: This is a reflection
    and ordinary contribution exercise, not a determination of legal caregiving duties, religious authority
    or family entitlement. Essential care and safety cannot be withdrawn as a test. Time and effort: Twenty
    minutes to clarify the duty, one bounded contribution or safe consultation and a ten-minute review.
    Adaptation: A remote, administrative, financial-within-means or occasional contribution may fit better
    than physical presence, but it must be genuinely agreed. For care, housing, immigration, inheritance
    or legal obligations, obtain qualified advice rather than relying on this general exercise. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A remote, administrative, financial-within-means or occasional contribution may
    fit better than physical presence, but it must be genuinely agreed. For care, housing, immigration,
    inheritance or legal obligations, obtain qualified advice rather than relying on this general exercise.
  expected_burden: Twenty minutes to clarify the duty, one bounded contribution or safe consultation and
    a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Kin, clan, neighborhood, and communal obligation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Kin, clan, neighborhood, and communal obligation action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A remote, administrative,
    financial-within-means or occasional contribution may fit better than physical presence, but it must
    be genuinely agreed. For care, housing, immigration, inheritance or legal obligations, obtain qualified
    advice rather than relying on this general exercise.
  actions:
  - stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01-A1
    sequence: 1
    title: Name the obligation’s basis and the people it affects
    instructions: 'Describe whether the expectation comes from care, shared history, explicit agreement,
      tradition, role or legal requirement, marking any legal question for qualified advice. Identify
      the good it protects and the actual burden distribution, including invisible planning. Ask an appropriate
      willing person how the duty is understood rather than assuming your interpretation is universal.
      Distinguish legitimate dependence from an unlimited claim on your time or conscience.


      Observation checks: The obligation’s basis and protected good are identified; Visible and invisible
      burdens are considered; The community’s interpretation is checked respectfully; Legal uncertainty
      and unlimited claims are not silently accepted. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01
      action_stable_id: PRACTICE-COMP-1712-KIN-CLAN-NEIGHBORHOOD-AND-COMMUNAL-OBLIGATION-01-A1
      competency_stable_id: '17.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1712_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1712_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_obligation_s_basis_and_protected_good_are_identified
        - visible_and_invisible_burdens_are_considered
        - the_community_s_interpretation_is_checked_respectfully
        - legal_uncertainty_and_unlimited_claims_are_not_silently_accepted
      - measurement_id: c1712_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1712_a1_adverse
        kind: boolean
