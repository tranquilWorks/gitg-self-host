  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Psychological Safety and Learning Behavior in Work Teams](https://dash.harvard.edu/entities/publication/13a7b031-0fdd-45ec-a7e0-2b80e2bc679f)

      - [How to implement CRediT](https://credit.niso.org/implementing-credit/)

      - [Our Epidemic of Loneliness and Isolation: The U.S. Surgeon General’s Advisory](https://www.hhs.gov/sites/default/files/surgeon-general-social-connection-advisory.pdf)

      - [Pursuing Meaningful Work: A Guide for PhDs and Postdocs](https://careered.stanford.edu/sites/g/files/sbiybj22801/files/media/file/stanfordphd_pmw_18-19.pdf)

      - [The Science of Effective Mentorship in STEMM — interactive guide](https://nap.nationalacademies.org/resource/25568/interactive/)

      - [UNESCO Universal Declaration on Cultural Diversity](https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity)

      - [Receptiveness to Opposing Views: Conceptualization and Integrative Review](https://journals.sagepub.com/doi/abs/10.1177/10888683211061037)

      - [Green flags in relationships](https://www.loveisrespect.org/resources/green-flags-in-relationships/)

      - [What consent does—and doesn’t—look like](https://www.loveisrespect.org/resources/what-consent-does-and-doesnt-look-like/)

      - [Machine learning uncovers the most robust self-report predictors of relationship quality across
      43 longitudinal couples studies](https://pubmed.ncbi.nlm.nih.gov/32719123/)

      - [Are adult attachment styles categorical or dimensional? A taxometric analysis of general and
      relationship-specific attachment orientations](https://pubmed.ncbi.nlm.nih.gov/25559192/)

      - [Intimacy as an Interpersonal Process: The Importance of Self-Disclosure, Partner Disclosure,
      and Perceived Partner Responsiveness in Interpersonal Exchanges](https://www.affective-science.org/pubs/1998/LaurenFBPl1998.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after the bounded offer.


      The organizer accepts your thirty-minute cleanup contribution. You work from 17:30 to 18:00 and
      then leave for the fifteen-minute journey, reaching the responsibility at 18:15. The estimate still
      leaves sixty person-minutes. Len volunteers twenty additional minutes; no one else has agreed to
      the remaining forty.


      Priya repeats that shopping and invitations were already substantial work. Priya does not agree
      to the remaining cleanup. The organizer says the group will discuss whether a smaller meal or shared
      setup can reduce next year''s load, but no rotation has been decided and no next-year coordinator
      has accepted.


      Record your completed thirty minutes, Len''s offered twenty minutes and the forty minutes not covered
      even by an offer. Sixty minutes of work remains unperformed in the supplied record; Len''s offer
      still needs acceptance and performance. Do not write that cleanup is complete or that Priya will
      finish by default. The group still needs an actual arrangement for this occasion. Honoring the gathering
      includes noticing that gap, while the later discussion remains a proposal rather than a settled
      redistribution.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Clarify and carry out one bounded legitimate contribution, or seek appropriate help where the
      obligation is uncertain or harmful. Allow twenty minutes to understand the duty, time for the actual
      contribution or consultation, and ten minutes to review. Use the fictional gathering below for preparation.
      Do not test a principle by withdrawing essential care or exposing yourself to coercion.


      ### Duties that were not individually selected


      Belonging can precede choice. Families, kin groups, clans, neighborhoods and traditions may sustain
      people through responsibilities that were not negotiated as individual contracts. Shared care, continuity,
      remembrance, mutual assistance and stewardship can be real goods. Assuming that every inherited
      duty is oppressive misses those goods; assuming that every inherited demand is legitimate can hide
      exploitation.


      Ask what grounds this particular responsibility. It may rest on care for someone dependent, a past
      agreement, an accepted role, shared resources, tradition or an applicable legal duty. These grounds
      are not interchangeable. “We have always done this” explains a history but does not alone settle
      who should do how much now. Legal questions need qualified local advice, not a verdict from this
      exercise.


      Make the burden visible. Shopping, planning, remembering, translating, transportation and cleanup
      can disappear behind the person who performs the public ceremony. A nominally equal contribution
      may be unequal when time, disability, money or care responsibilities differ. Ask an appropriate
      person about this group''s practice rather than treating one family''s arrangement as a fact about
      an entire culture.


      Boundaries can protect the communal good. A reliable thirty-minute contribution may serve better
      than a resentful promise of three hours that cannot be kept. State what you can do, what you cannot,
      and what remains uncovered. Do not silently transfer the excess to the person already carrying most
      of the work. Propose a fairer arrangement through the people authorized to agree it.


      Conscience and safety matter too. Threats, exploitation, humiliation or harmful conduct are not
      made acceptable by calling them loyalty. A safe refusal, reduced involvement or appropriate consultation
      may be needed. Essential care, housing, immigration, inheritance or other consequential dependencies
      require suitable support and professional advice where relevant; neither immediate withdrawal nor
      unlimited compliance is a universal answer.


      ### Worked example


      A neighborhood meal depends on one household doing all preparation. Another member offers to bring
      bread and clean for half an hour but cannot stay all evening. The offer helps only if the organizer
      knows its limit and agrees the plan. If the member says “cleanup is covered,” the remaining work
      may fall invisibly back on the same household. A truthful contribution identifies the protected
      good, performs a real share and leaves the unresolved burden visible for collective discussion.


      ### Complete fictional situation


      The Rowan gathering is a voluntary family-and-neighbor meal honoring an annual tradition of welcoming
      newcomers. Its organizers expect setup, food preparation and cleanup. Priya has coordinated the
      shopping and invitations for three hours. Len has agreed to cook. You have offered no work yet and
      can stay from 17:30 to 18:00 after the meal. Cleanup is estimated at ninety person-minutes and can
      be divided safely among willing adults; no essential care depends on this task.


      The organizer asks you to “take care of cleanup.” You value the gathering but have a fixed responsibility
      at 18:15, fifteen minutes away. There is no spare travel margin after 18:00. No additional helper
      has agreed. Priya says planning work is often overlooked but has not consented to taking the remaining
      cleanup. A proposal to rotate coordination next year would need discussion; you have no authority
      to assign it.


      ### Clarify, contribute and account


      1. Name the protected good and the basis of the request: welcome and tradition, with a proposed
      voluntary task rather than an already accepted unlimited role. Ask about actual expectations and
      invisible labor. Output: a specific duty account with known facts, unknowns and no culture-wide
      stereotype.

      2. Calculate your feasible contribution and the uncovered work. Draft a clear offer of thirty minutes,
      ending at 18:00, with no promise on behalf of anyone else. Output: the offered task, time limit,
      reason at the level you choose to share, and remaining sixty person-minutes needing an agreed arrangement.

      3. Save your offer before reading the [later packet](?resource=file-later-packet-md). In a real
      route, confirm the bounded agreement, then perform it or renegotiate promptly if circumstances change.
      Output: accepted versus merely requested work and what was actually completed. A good intention
      is not a cleaned room.

      4. Review whether the contribution honored the gathering and whether burdens were displaced. Suggest
      a later discussion of rotation, shared planning or a simpler meal if appropriate. Output: acknowledgment
      of existing labor, unresolved work, and a proposal rather than an invented group decision.


      The arithmetic estimates work, not human worth. It does not imply every adult owes the same minutes
      or that care and tradition can be fully priced. It makes one practical gap visible so consent and
      responsibility are not obscured.


      ### Supported and further routes


      With support, rehearse the bounded offer or consult a trusted appropriate person before acting.
      Written communication or a different accessible task may be preferable. If the setting involves
      retaliation or dangerous dependency, stop the ordinary negotiation exercise and use safe qualified
      assistance. No confrontation is required to prove courage.


      For a harder fictional case, let a formerly willing helper cancel. Recalculate remaining work and
      consider simplifying the event, not assigning the absence to the least powerful member. For real
      transfer, complete a fitting contribution and revisit the arrangement over time. Seek perspectives
      from those doing hidden work only when they wish to share; do not require public testimony about
      family conflict. A single task cannot prove that the whole communal arrangement is fair.


      ### Source boundary


      [S06](https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity) treats
      cultural diversity and human dignity as compatible commitments and rejects culture as a justification
      for rights violations. It is a normative declaration, not local legal advice or evidence validating
      this task. The scope and limits described in this guide preserves both legitimate duty and limits.
      Attempt the [fresh cases](?attempt=practice-checks) without turning either individual choice or
      tradition into an automatic answer.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A person can contribute forty minutes to a task estimated at one hundred person-minutes.
      Another offers twenty, but has not worked yet. What remains unassigned, and what is already done?

      2. “Our culture requires it” is offered as the sole reason to accept humiliating treatment. How
      should the learner reason?

      3. A frustrated caregiver plans to stop essential care tomorrow to prove that duties must be chosen.
      Is this the exercise''s harder route?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. If the forty-minute contribution is merely feasible, nothing is yet established as done.
      Forty plus twenty would leave forty person-minutes unassigned if both offers are accepted; keep
      offers, agreements and performed work separate. Do not allocate the remainder silently.

      2. Examine the particular practice, protected good, burden and harm without stereotyping the whole
      culture. Cultural belonging does not remove dignity or justify abuse. Safe support or refusal may
      be appropriate; public confrontation is not required.

      3. No. Do not withdraw essential care as an experiment. Seek an appropriate safe transition, support
      and qualified advice for consequential duties. The learning task cannot authorize abandonment or
      resolve legal obligations.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
