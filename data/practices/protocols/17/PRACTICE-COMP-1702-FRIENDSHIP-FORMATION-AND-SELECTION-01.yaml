meaning_and_fit:
  purpose: Use reciprocity, trust, compatibility, influence and shared experience to choose a proportionate
    next step in an emerging or established friendship.
  why_recommended: Use reciprocity, trust, compatibility, influence and shared experience to choose a
    proportionate next step in an emerging or established friendship.
  claims:
  - statement: Use reciprocity, trust, compatibility, influence and shared experience to choose a proportionate
      next step in an emerging or established friendship.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Friendship formation and selection practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Friendship formation and selection as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Long-distance, low-frequency and disability-adapted friendships can be meaningful;
    frequency alone is not the criterion. Use specialist support rather than this ordinary review for
    abuse, stalking or coercive control. Keep private relationship notes outside the application.
  opportunity_considerations: 'Choose one relationship where contact is welcome and no abuse or coercion
    is present. Use three ordinary interactions you can recall accurately, or wait for enough real experience
    rather than inventing a pattern. Default question: should this acquaintance become a closer friend,
    remain an activity companion or receive a repair conversation?'
  prerequisites:
  - 'Choose one relationship where contact is welcome and no abuse or coercion is present. Use three ordinary
    interactions you can recall accurately, or wait for enough real experience rather than inventing a
    pattern. Default question: should this acquaintance become a closer friend, remain an activity companion
    or receive a repair conversation?'
  dependencies: []
  safe_alternatives:
  - Long-distance, low-frequency and disability-adapted friendships can be meaningful; frequency alone
    is not the criterion. Use specialist support rather than this ordinary review for abuse, stalking
    or coercive control. Keep private relationship notes outside the application.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Friendship formation and selection differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Friendship formation and selection
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose one relationship where contact is welcome and no abuse or coercion is present. Use three
    ordinary interactions you can recall accurately, or wait for enough real experience rather than inventing
    a pattern. Default question: should this acquaintance become a closer friend, remain an activity companion
    or receive a repair conversation? Goal: Use reciprocity, trust, compatibility, influence and shared
    experience to choose a proportionate next step in an emerging or established friendship. Scope: This
    is a private relationship review, not a ranking of people or a secret loyalty test. One pleasant or
    disappointing interaction does not establish a person’s character. Time and effort: Twenty minutes
    to review existing observations, one welcome shared activity and a ten-minute follow-up review. Adaptation:
    Long-distance, low-frequency and disability-adapted friendships can be meaningful; frequency alone
    is not the criterion. Use specialist support rather than this ordinary review for abuse, stalking
    or coercive control. Keep private relationship notes outside the application. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Long-distance, low-frequency and disability-adapted friendships can be meaningful;
    frequency alone is not the criterion. Use specialist support rather than this ordinary review for
    abuse, stalking or coercive control. Keep private relationship notes outside the application.
  expected_burden: Twenty minutes to review existing observations, one welcome shared activity and a ten-minute
    follow-up review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Friendship formation and selection protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Friendship formation and selection action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Long-distance,
    low-frequency and disability-adapted friendships can be meaningful; frequency alone is not the criterion.
    Use specialist support rather than this ordinary review for abuse, stalking or coercive control. Keep
    private relationship notes outside the application.
  actions:
  - stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01-A1
    sequence: 1
    title: Separate observed patterns from hopes and labels
    instructions: 'For the three interactions, note who initiated, whether commitments were kept, whether
      disagreement was handled respectfully and whether both people could be themselves. Consider shared
      interests, values, practical compatibility and how you tend to behave around each other. Record
      unknowns and situational explanations, including illness, caregiving or workload, instead of using
      response speed as a complete measure of care.


      Observation checks: Several actual interactions support the review; Reciprocity trust and respectful
      disagreement have concrete examples; Compatibility and mutual influence are considered without ranking
      worth; Unknowns and capacity-related explanations remain visible. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01
      action_stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01-A1
      competency_stable_id: '17.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1702_a1_primary
      transfer_disposition: context_bound
      measurements:
