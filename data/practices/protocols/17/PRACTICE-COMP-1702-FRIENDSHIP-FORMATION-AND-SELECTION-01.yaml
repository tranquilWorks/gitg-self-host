  - stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01-A3
    sequence: 3
    title: Choose deepen, limit, repair or end with a proportionate reason
    instructions: 'Compare the new experience with the earlier pattern and choose one next step. Deepening
      might mean another shared activity; remaining limited might mean enjoying the existing context without
      expecting intimacy; repair might mean one safe conversation about a specific missed commitment.
      Ending or distance may be appropriate when harm or incompatibility persists. State the reason without
      a global character verdict and keep safety concerns separate from ordinary mismatch.


      Observation checks: The next step follows the combined observations; Deepening limiting repair and
      ending are all legitimate possibilities; The reason is specific rather than a whole-person verdict;
      Safety concerns are not minimized as mere incompatibility. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What pattern justifies the chosen level of closeness, and what important uncertainty
      prevents you from making a stronger judgment?


      Examples: Supportive: The participant recognized reliable shared activity but limited mutual interest
      in deeper disclosure and chose to value the friendship at that level.


      Mixed: A missed plan initially looked like disinterest, but new information about caregiving led
      to a more flexible expectation rather than a final verdict.


      Contradictory: The person staged a loyalty test or treated contacts as ranked assets to keep or
      discard.


      Inconclusive: A decision to deepen or end the relationship was based on one message without considering
      context or a pattern.'
    expected_time: 15-25 minutes
    due_within_days: 10
