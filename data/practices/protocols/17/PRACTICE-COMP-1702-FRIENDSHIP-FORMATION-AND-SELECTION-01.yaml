  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Dara replies: “Sunday morning doesn''t work. Could we do twenty minutes at 15:00?” You cannot meet
      then. The indoor library room is still unconfirmed. There is no mutually feasible session this week;
      an exchange of alternatives is not a scheduled activity.


      At the next ordinary group meeting in the fictional record, Dara says to the interrupted participant,
      “I cut across your answer last time. Please finish.” Dara then waits for that answer. This is one
      observable correction, not evidence that interruptions can never recur. The participant''s feelings
      are not supplied.


      You may keep the friendship occasional, explore another mutually convenient date later or decide
      that current schedules limit deepening. The timing mismatch does not erase considerate conduct,
      and the considerate conduct does not create shared free time. Update each facet separately before
      deciding the relationship''s next form.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Friendship selection is a judgment about the form of relationship you can freely sustain, not
      a ranking of people''s worth. This practice compares several ordinary interactions, identifies a
      question that remains open, and uses a genuine shared activity to learn more without staging a test.
      Allow twenty minutes for review, a welcome activity if available and ten minutes afterward.


      ### Look for patterns while keeping explanations open


      Six facets matter in different ways. **Reciprocity** concerns mutual contribution over time; it
      is not identical message counts. **Trust** concerns what someone does with commitments, privacy
      and vulnerability. **Character** appears in particular conduct, such as treating an absent person
      fairly; it is not a score you can infer from charm. **Compatibility** concerns whether your rhythms,
      interests and limits can coexist. **Influence** concerns what you encourage in each other. **Shared
      activity** provides a setting in which these things can be observed without an interview about being
      a good friend.


      Hall''s friendship research examines associations among time together, activities, talk and closeness
      [S12](https://journals.sagepub.com/doi/10.1177/0265407518761225). The inspected abstract and Study
      1 limitations do not justify an hour quota or a causal promise. Our three-interaction review is
      a practical sampling aid, not a validated instrument. Three observations may expose uncertainty;
      they cannot certify a person''s character.


      Response speed is particularly easy to overinterpret. A delayed reply can coexist with reliability,
      care, disability, work or caregiving demands. Conversely, constant messaging can coexist with broken
      promises. Compare conduct against actual agreements and known capacity. Do not turn “I prefer more
      frequent contact” into “they are incapable of friendship.”


      There are at least four legitimate directions. **Deepen** when mutual interest and reliable conduct
      support a little more investment. **Remain limited** when the current form fits but greater closeness
      does not. **Repair** when a specific, addressable rupture and willingness make repair plausible.
      **End** when continuing is unwanted or repeated harm makes reduced access appropriate. None requires
      dehumanizing the other person or making a public case against them.


      ### Worked example: slow replies, reliable plans


      Tess feels unsure because Rowan replies after several days. Across three actual plans, Rowan has
      either arrived as agreed or warned Tess early and offered a workable alternative. Rowan says evenings
      are difficult because of care responsibilities. Tess can still decide that frequent spontaneous
      contact will not fit, while recognizing evidence of reliability.


      A sensible next step is an occasional planned activity both enjoy, not sending a fake urgent message
      to measure loyalty. If Tess needs to discuss one missed commitment, the topic is that commitment
      and its effect. A concealed test creates misleading evidence because the situation was designed
      to provoke a response.


      ### Your case: three supplied encounters


      This fictional record concerns an ordinary safe acquaintance, Dara. At a first walk, you initiated;
      Dara arrived on time, asked about your interest in drawing and respected your wish not to discuss
      work. Before a second, Dara cancelled a day ahead for a family task and proposed a free shorter
      walk the following week; you accepted, and that walk happened. At a third group activity, Dara disagreed
      with your game choice without mocking you, but twice interrupted another participant. You do not
      know whether Dara noticed. You both enjoy drawing outdoors; your free time is usually mornings,
      Dara''s usually afternoons.


      You are considering a twenty-minute sketch session on Sunday at 11:00 in the public garden, with
      an indoor library alternative only if its room is confirmed. You genuinely want the activity and
      can accept a decline. No threat, manipulation or abuse is supplied.


      1. **Review the pattern under six headings.** Use the three encounters for reciprocity, trust, character,
      compatibility, influence and shared activity. Separate observations from interpretations: interruptions
      are observed; contempt or distraction is unconfirmed. Output: evidence, contrary evidence and unknowns
      for each heading.

      2. **Choose a provisional direction.** Explain why modest deepening, remaining limited or a specific
      repair might fit. Ending is also an available choice if you do not want continued contact, but do
      not invent harm to justify it. Output: a direction and the concrete information it depends on.

      3. **Offer a genuine activity.** Include time, duration, cost and an easy decline or alternative.
      Do not promise the indoor room. Do not plant a secret, provoke jealousy or withhold attention to
      see whether Dara chases you. Output: a usable invitation and a question it could naturally clarify,
      such as practical compatibility.

      4. **Compare the [later packet](?resource=file-later-packet-md).** Update the timing judgment and
      review the interruption without turning one correction into universal proof. Output: a revised relationship
      direction and what further ordinary experience would matter.


      ### An honest limit can be a good outcome


      If the best fit is an occasional group activity, that can be a complete friendship form rather than
      a failed attempt at intimacy. Different friendships need not provide every kind of support. Long-distance
      or low-frequency relationships can contain meaningful reciprocity, while frequent proximity alone
      does not establish trust.


      For a real review, use interactions you can actually recall. If there are fewer than three, say
      so; do not fill gaps with imagined evidence. Keep detailed private notes outside the application
      and minimize identifying information. A record of your chosen behavior and uncertainty is enough
      for this companion. Do not create a spreadsheet that ranks acquaintances as assets.


      For support, work through the supplied record first, then choose one naturally occurring shared
      activity. If no welcome opportunity exists, defer the real attempt. For a harder case, a friend
      acknowledges a problem but the same behavior recurs: distinguish a repair intention from changed
      conduct over time. If abuse, threats or unsafe dependence appear, stop the ordinary selection experiment
      and use the safety route in 17.06.


      For transfer, revisit your decision after another real interaction, naming what changed your view
      and what did not. A declined invitation may clarify availability without resolving trust, compatibility
      or affection. The [fresh checks](?attempt=practice-checks) require reasons for a direction, not
      a verdict that someone is a good or bad person.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Try these fictional cases before reading [the key](?check=practice-answers).


      1. A friend replies slowly during a care-heavy month but keeps agreed plans. What evidence supports
      or limits a judgment about reliability?

      2. You want to know whether an acquaintance respects privacy. Should you plant a false secret and
      watch for gossip?

      3. Both people enjoy meeting, but one wants weekly late evenings and the other can offer monthly
      daytime contact. Name a reasonable direction without a character verdict.


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A friend who usually replies quickly takes two days to answer, then explains a phone failure and
      proposes a specific catch-up. You have no other evidence of withdrawal. Choose a response and a
      reasonable next observation without demanding proof of the phone failure.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Kept plans support reliability within those agreements; slow replies may limit rapid coordination.
      Known care demands are relevant. Neither global indifference nor guaranteed trust follows from these
      facts.

      2. No. A deceptive test changes the relationship and produces suspect evidence. Keep disclosure
      appropriate, respect existing privacy and observe ordinary conduct over time. You can limit closeness
      while uncertainty remains.

      3. A monthly daytime friendship, occasional group contact or a respectful decision not to deepen
      can fit. Discuss what each can freely offer. Schedule incompatibility does not imply selfishness,
      and affection does not make an infeasible cadence possible.


      ### Changed-case answer


      Acknowledge the explanation and respond to the proposed catch-up according to your availability.
      The delay alone does not establish betrayal; the proposal is an intention, not completed connection.
      Observe whether the agreed next contact happens and discuss a repeated pattern if one emerges. Respect
      privacy and avoid surveillance.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
