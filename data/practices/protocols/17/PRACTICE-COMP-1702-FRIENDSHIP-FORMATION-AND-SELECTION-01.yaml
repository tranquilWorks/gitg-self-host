  - stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01-A2
    sequence: 2
    title: Create one ordinary opportunity for more information
    instructions: 'Offer a modest shared activity both people may genuinely enjoy, such as a short walk,
      game or conversation after the usual group meeting. Keep the invitation specific and easy to decline.
      Notice whether participation and small responsibilities are mutually negotiated rather than setting
      a hidden test. Do not manufacture jealousy, disclose a secret as bait or withhold contact to see
      whether the person proves loyalty.


      Observation checks: The activity is a genuine invitation rather than a covert test; Both people
      can shape or decline the plan; New observations concern ordinary participation and follow-through;
      No manipulation is introduced to obtain relationship evidence. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01
      action_stable_id: PRACTICE-COMP-1702-FRIENDSHIP-FORMATION-AND-SELECTION-01-A2
      competency_stable_id: '17.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
