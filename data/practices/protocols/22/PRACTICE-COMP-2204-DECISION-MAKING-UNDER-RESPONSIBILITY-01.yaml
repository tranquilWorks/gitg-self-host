meaning_and_fit:
  purpose: Choose responsibly under incomplete information by using expertise, dissent, risk and affected-person
    needs, then own and update the decision as evidence changes.
  why_recommended: Choose responsibly under incomplete information by using expertise, dissent, risk and
    affected-person needs, then own and update the decision as evidence changes.
  claims:
  - statement: Choose responsibly under incomplete information by using expertise, dissent, risk and affected-person
      needs, then own and update the decision as evidence changes.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Decision-making under responsibility practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Decision-making under responsibility as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a paper tabletop case or accessible asynchronous input. If a required
    safety, legal or professional fact is unresolved, defer that option and use the appropriate qualified
    route. Do not stage a risky real event to test decisiveness.
  opportunity_considerations: Default to choosing between two permitted rooms for a small workshop when
    attendance is uncertain. Both must already meet the responsible owner’s safety and access requirements.
    Prepare a decision card with deadline, options, known facts, unknowns, expert input, dissent, affected
    users, risk, choice and review trigger.
  prerequisites:
  - Default to choosing between two permitted rooms for a small workshop when attendance is uncertain.
    Both must already meet the responsible owner’s safety and access requirements. Prepare a decision
    card with deadline, options, known facts, unknowns, expert input, dissent, affected users, risk, choice
    and review trigger.
  dependencies: []
  safe_alternatives:
  - Use a paper tabletop case or accessible asynchronous input. If a required safety, legal or professional
    fact is unresolved, defer that option and use the appropriate qualified route. Do not stage a risky
    real event to test decisiveness.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Decision-making under responsibility differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Decision-making under responsibility
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to choosing between two permitted rooms for a small workshop when attendance is uncertain.
    Both must already meet the responsible owner’s safety and access requirements. Prepare a decision
    card with deadline, options, known facts, unknowns, expert input, dissent, affected users, risk, choice
    and review trigger. Goal: Choose responsibly under incomplete information by using expertise, dissent,
    risk and affected-person needs, then own and update the decision as evidence changes. Scope: Use a
    reversible low-stakes decision or tabletop case. This is not emergency command, clinical judgment
    or authority to override a qualified safety decision. Time and effort: Twenty minutes to frame the
    choice, one time-bounded decision and a review after a specified new fact. Adaptation: Use a paper
    tabletop case or accessible asynchronous input. If a required safety, legal or professional fact is
    unresolved, defer that option and use the appropriate qualified route. Do not stage a risky real event
    to test decisiveness. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a paper tabletop case or accessible asynchronous input. If a required safety,
    legal or professional fact is unresolved, defer that option and use the appropriate qualified route.
    Do not stage a risky real event to test decisiveness.
  expected_burden: Twenty minutes to frame the choice, one time-bounded decision and a review after a
    specified new fact.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Decision-making under responsibility protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Decision-making under responsibility action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a paper
    tabletop case or accessible asynchronous input. If a required safety, legal or professional fact is
    unresolved, defer that option and use the appropriate qualified route. Do not stage a risky real event
    to test decisiveness.
  actions:
  - stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01-A1
    sequence: 1
    title: Define when a decision is needed and what cannot be guessed
    instructions: 'State the latest useful decision time and the consequence of waiting. List the two
      viable options and the facts required before either is acceptable, including verified safety and
      access rather than assumptions. Identify who has relevant expertise and whose experience of the
      room matters. Separate a missing fact that blocks the decision from uncertainty that can be managed
      through a reversible choice.


      Observation checks: A real decision deadline and cost of delay are stated; Blocking facts are separated
      from manageable uncertainty; Safety and access are verified by the appropriate owner; Expertise
      and affected users are identified. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01-A1
      competency_stable_id: '22.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2204_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2204_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_real_decision_deadline_and_cost_of_delay_are_stated
        - blocking_facts_are_separated_from_manageable_uncertainty
        - safety_and_access_are_verified_by_the_appropriate_owner
        - expertise_and_affected_users_are_identified
      - measurement_id: c2204_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2204_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01-A2
    sequence: 2
    title: Hear the strongest concern and make the bounded choice
    instructions: 'Ask for the strongest reason against your preferred room and record it fairly. Compare
      likely benefits, downside, reversibility and what support each option needs. Decide by the deadline
      within your authority, explaining why the choice is reasonable on current evidence and what risk
      remains. Assign the next action and communication owner. Do not wait for perfect agreement or present
      uncertainty as certainty to look decisive.


      Observation checks: A serious dissenting concern is considered; Risk reversibility and support needs
      inform the choice; The decision is timely and within authority; Remaining uncertainty and the next
      owner are communicated. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01-A2
      competency_stable_id: '22.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2204_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2204_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_serious_dissenting_concern_is_considered
        - risk_reversibility_and_support_needs_inform_the_choice
        - the_decision_is_timely_and_within_authority
        - remaining_uncertainty_and_the_next_owner_are_communicated
      - measurement_id: c2204_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2204_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01-A3
    sequence: 3
    title: Review the outcome without rewriting the original reasoning
    instructions: 'When the attendance estimate or another specified fact changes, compare it with the
      recorded assumptions. Retain or revise the room choice and explain the reason to affected people.
      Own any preventable error, while distinguishing an unlucky outcome from an unsound process. Preserve
      the original decision record and add the update rather than editing it to make foresight look better.
      A revision can be responsible leadership, not evidence that the initial decision should have been
      delayed forever.


      Observation checks: New evidence is compared with the original assumptions; Retention or revision
      has an explicit reason; Process quality and outcome luck are distinguished; The original reasoning
      is preserved with an added update. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What made the choice reasonable at the time, what evidence changed it, and did you
      own the update as clearly as the original decision?


      Examples: Supportive: The leader chose a verified suitable room by the deadline and revised the
      plan when a recorded attendance trigger was reached.


      Mixed: The choice was reasonable but the communication owner was missing; the review corrected that
      handoff gap.


      Contradictory: Dissent was suppressed, safety facts were guessed or the original record was rewritten
      after the outcome.


      Inconclusive: Options were analyzed indefinitely without a decision deadline, accountable choice
      or review trigger.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-2204-DECISION-MAKING-UNDER-RESPONSIBILITY-01-A3
