  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      At **14:10**, Fen reports **12 confirmed attendees**, with the previous two possible now included
      and two additional confirmed participants. Elm is no longer acceptable for the full group: twelve
      exceeds ten by two. Oak remains held until **15:00** and can accommodate twelve within its approved
      sixteen.


      Rem changes to Oak at **14:20**. Fen records the switch, still within the thirty-unit budget and
      forty minutes before the hold expires. Uma''s fictional approved update states Oak and the unchanged
      workshop time, and offers the printed prompt sheet. Eight of twelve recipients acknowledge the update
      by **14:45**; four have not yet confirmed receipt. Uma retains follow-up responsibility. Do not
      turn sending into universal receipt.


      The revised room fits the confirmed number, with four places of capacity margin. The initial choice
      was made for eight confirmed and at most two then-possible attendees; no known capacity breach existed
      at noon. The workshop has not happened. The record supports timely reassessment and a remaining
      communication dependency, not a successful event or a proof of perfect judgment.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Choose a room by a deadline, record the reasons against your preference and update the choice
      when the relevant facts change. Allow twenty minutes for the decision and fifteen for the later
      review. Both fictional rooms already have responsible-owner approval for the stated uses and access
      arrangements. The exercise cannot establish real building safety or grant authority to override
      an actual restriction.


      ### Decide with uncertainty without concealing it


      Frame the decision before comparing attractive features. Who has authority, by when is a choice
      needed, which options are permitted and what happens if you wait? Some missing information blocks
      a responsible choice: required approval cannot be guessed. Other uncertainty can be managed with
      a reversible plan, such as a range of attendance estimates when every plausible number fits an approved
      option.


      Seek the expertise that matches the question. A venue steward can confirm permitted capacity; a
      participant can describe an access need or communication difficulty; a booking coordinator can explain
      a hold deadline. Confidence in one role does not create expertise in the others. Consultation improves
      the information available to the decision maker but does not transfer all responsibility to advisers.


      Invite the strongest reason against the leading option. This is more useful than asking supporters
      to list benefits after you have effectively decided. State dissent fairly, including a condition
      under which it should change the choice. A quieter room may aid conversation while a larger room
      better accommodates uncertain attendance. Do not disguise a tradeoff by claiming that the preferred
      option wins every criterion.


      Separate constraints, estimates and preferences. A maximum approved occupancy is a boundary, not
      a target to exceed if the group is enthusiastic. An estimated headcount is a forecast, not a confirmed
      count. A pleasant atmosphere is a preference that may matter after essentials are satisfied. Arithmetic
      can rule out an option without supplying the full judgment. A responsible choice explains both why
      it fits and what remains uncertain.


      Reversibility has a time window and a cost. Being able to edit a booking note does not guarantee
      that another room remains available or that attendees will receive the change. Record the last useful
      switch time and the communication owner. If the window closes, a previously reversible plan may
      need a different response. Avoid implying that a decision is low risk merely because the document
      is editable.


      A review trigger is evidence that calls for reassessment, not an automatic excuse to ignore everything
      else. Define it before the new fact arrives. Preserve the original rationale and add an update rather
      than rewriting the first record to make yourself look prescient. You can own the consequences of
      a decision while distinguishing a preventable error from a reasonable choice followed by new information.


      Timeliness matters too. Waiting for perfect knowledge may forfeit both acceptable options. Make
      the best supported choice within the deadline, identify residual risk and communicate the next step.
      A later revision need not mean the first choice was reckless, and a lucky outcome cannot rescue
      a process that ignored a known boundary. Evaluate the decision using information actually available
      at the time.


      ### Worked example


      A coordinator chooses a room approved for ten because eight people are expected. A recorded trigger
      requires reassessment above ten while a larger-room hold remains open. A later count of twelve activates
      the review. Moving to the larger room can be responsible follow-through, not proof that the coordinator
      should have predicted twelve. Keeping the small room to appear consistent would misuse the original
      decision''s authority.


      ### Complete fictional options and evidence


      On **5 November 2026 at 12:00 UTC**, Rem must book a room for the next day''s paper-map workshop.
      Rem has delegated booking authority within **30 units** of fictional budget. Elm Room costs **20**,
      has approved capacity **10**, a quiet layout and a venue-confirmed step-free route. Oak Room costs
      **30**, has approved capacity **16**, the same confirmed access suitability and more background
      sound. Neither cost is actual money to spend.


      Venue steward Tal confirms both rooms'' stated use and capacities. Facilitator Uma says the quiet
      setting helps spoken comparisons but can use a printed prompt sheet in Oak. Participant Sol confirms
      that the supplied access arrangement meets the needs disclosed for this fictional session; this
      is not a universal access assessment. Booking officer Fen says the initial choice is due at **12:00**
      and a no-fee switch between these two held rooms is possible until **15:00**, after which an unchosen
      room may be released.


      At **11:30**, there are **8 confirmed attendees** and **2 possible**, with no other expected arrivals.
      Rem prefers Elm. Uma''s strongest caution is that additional confirmations beyond ten would make
      Elm unsuitable, and a late switch could confuse attendees. Fen owns recording a booking change;
      Uma accepts responsibility for sending the single approved attendee update in the fiction. The initial
      decision must state what happens if the approved capacity would be exceeded or an essential approval
      is withdrawn.


      ### Make an accountable choice


      1. Build a compact card separating authority, deadline, constraints, expertise, affected-person
      input and attendance uncertainty. Output: viable options and missing facts that would block either.

      2. Compare cost, capacity margin, communication usefulness and reversibility. Record Uma''s dissent
      fairly. Output: choice by noon, residual risk and a specific attendance/switch-window review trigger.

      3. Save before the [later packet](?resource=file-later-packet-md). Reassess using the new count
      and remaining time. Output: appended decision, difference from the original assumptions and assigned
      communication action.

      4. Review whether any known constraint was ignored initially, whether the update was timely and
      what the record cannot prove. Output: process judgment distinct from the eventual workshop outcome.


      ### Support and harder conditions


      Use two option cards and a calculator; arithmetic assistance does not remove decision ownership.
      For a harder branch, let the attendance update arrive after 15:00 with Oak unavailable. Keep Elm''s
      approved limit intact and seek an authorized alternative, rescheduling or capacity arrangement;
      do not improvise building approval. Real transfer should concern an ordinary reversible choice within
      actual authority. Safety, clinical and emergency decisions retain qualified processes beyond this
      task.


      ### Source use


      [GovS 002, S03](https://projectdelivery.gov.uk/library-products/government-functional-standard-govs-002-project-delivery/),
      supports timely options-based decisions within governance and consultation with relevant expertise
      and stakeholders. Selected sections are used, not a full decision-analysis method or a guarantee
      that the preferred room is optimal.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A preferred option lacks a required approval. Is this ordinary uncertainty that can be accepted
      to meet a deadline?

      2. New attendance exceeds a room limit while a permitted switch remains available. Is changing a
      sign of weak leadership?

      3. A change message was sent to twelve and eight acknowledged. What is the communication status?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. A missing essential approval is a blocking condition. A deadline does not supply it;
      use an authorized alternative or keep the decision appropriately limited.

      2. No. Reassess against the recorded assumptions, constraints and time window, append the new reason
      and communicate the change. Consistency does not justify exceeding a limit.

      3. Eight acknowledgments and four unresolved receipts. Keep follow-up ownership; do not infer that
      all received or understood the message, or that the event succeeded.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
