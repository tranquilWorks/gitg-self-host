  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      In the first walkthrough Neri correctly keeps the thirty-minute agenda but says one approval is
      enough for E1 because Ro once paid a similar amount. Ro intervenes before any commitment, explains
      G4 and labels the past purchase as historical. Record this as an assisted exception response. The
      pack gains a clear sentence: “A previous purchase never substitutes for two current approvals.”
      Neri can still continue the non-spending layout comparison.


      Fresh exception **E2** requests **9 units**, with only Uma''s current approval; Tavi is unavailable.
      With Ro silent and G4 available, Neri marks spending pending, asks Review Desk for the authorized
      route and proceeds with the layout discussion. Neri records that Lee voluntarily accepts a readability
      revision of Layout B by **3 December**. Neri uses a table; all required decision facts and open
      issues are present. No second approval, purchase or public release occurs.


      Ames confirms access to CIRCLE-RECORD and accepts maintaining the rule/access checklist at transitions
      and on rule changes. The council confirms Neri''s role and Review Desk as the challenge route in
      the fictional shared record. The notice channel still depends on Ro; the individual access transfer
      is requested but not completed. Maintenance has not yet been performed. One fresh exception was
      handled without a hint using the pack, but the whole institution''s continuity and all leadership
      dependencies remain unproven.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Prepare a successor to run a limited planning decision using shared knowledge, legitimate authority
      and an exception route. Allow twenty minutes for the transition pack and twenty to review its two
      tabletop attempts. The goal is a group that can act without hidden dependence on one person. A folder
      full of documents is useful only if successors can understand, access and legitimately use what
      it contains.


      ### Identify what the institution would lose


      Start with decisions, relationships, records and exceptions that would stall if the current leader
      were absent. Some dependencies are technical, such as access to an editable agenda. Others are social
      or constitutional: people may still ask the former leader for approval, or the role may require
      a formal appointment. A password copied into a handover document is neither a safe access transfer
      nor a legitimate appointment.


      Prioritize critical knowledge rather than copying everything. Include the purpose of the role, current
      commitments, the governing principles and why a rule exists. A successor who knows only the former
      leader''s habits cannot adapt when the case changes. Explain which practices are preferences and
      which preserve safety, fairness, authority or continuity. Retain relevant rationale without exposing
      private personnel information or unnecessary historical disputes.


      Develop more than a nominal replacement. Use the legitimate selection process, ask whether the person
      wants the role and identify the preparation they need. A willing backup reduces one kind of dependence,
      but the backup also needs access and appropriate authority. Do not assume that attendance at a walkthrough
      establishes readiness. Give a bounded ordinary decision and a harmless exception to reveal what
      the pack leaves implicit.


      Distribute knowledge through usable resources and relationships. A named role contact is often more
      durable than “ask me.” Shared editable records, version status, review triggers and accepted maintenance
      ownership make the transition easier to sustain. Actual account access should follow organizational
      procedures with individual authorization, not shared credentials or copied secrets. Authority to
      read a record does not necessarily include authority to approve the action it describes.


      During the successor attempt, observe without hidden coaching. Let a different valid method stand
      if it respects the governing principles. If you intervene, record it and why; the result is then
      assisted. Stop for a real boundary violation rather than preserving a clean-looking assessment.
      Independence is not demonstrated by letting someone make an unauthorized consequential decision
      for the sake of the exercise.


      Use the exception to check governance. Who may change a commitment, resolve a conflict or approve
      spending? Which decisions must wait when an authority is absent? A successor may show sound stewardship
      by deferring a decision and using the legitimate route. Completing every agenda item is not always
      the right outcome. Keep open issues visible so an orderly meeting does not disguise unresolved authority.


      Close the transition by confirming the role owner, backup, record maintainer and review process.
      Let the group know where decisions now sit and how to challenge an error. Review which dependency
      remains: perhaps the former leader still owns a notice account or a second approver is unavailable.
      One successful low-stakes transition supports a narrow capability claim, not assurance that the
      institution can survive any departure or crisis.


      ### Worked example


      A departing chair hands over last month''s agenda. The successor copies a spending approval from
      it into today''s minutes, assuming it is precedent. The real rule requires two current approvals.
      A better pack explains that the old minute records a past authorization, not a standing permission,
      and supplies the route for a new request. Sound succession preserves principles while allowing a
      new chair to choose a different agenda style.


      ### Complete fictional transition pack


      The Paper Survey Circle''s purpose is to compare public maps and decide small preparation tasks.
      The council formally appoints **Neri** as facilitator for **December 2026**, with willing backup
      **Ames**. Outgoing facilitator **Ro** provides the pack. Neri and Ames have accepted their roles.
      This is a fictional appointment, not one you should make in a real organization.


      Governing card **G4**, current as of **26 November**, states: a facilitator may order agenda items,
      keep the meeting within **30 minutes**, and record voluntarily accepted task owners and dates. The
      facilitator may not change the group''s purpose, spend funds or approve public notices alone. Any
      spending needs two named current council approvals before a commitment. This protects shared resources;
      a prior purchase is not standing permission. Questions or challenges to a decision go to the council''s
      shared review role, **Review Desk**. Review Desk is a role label, not a private address.


      The shared editable paper record **CIRCLE-RECORD** contains G4, the agenda and commitment log. Neri
      and Ames both have access. Agenda minima are: current commitments **5 minutes**, compare two layouts
      **10**, agree one next task **10**, recap/open issues **5**. The total is thirty. The order may
      vary except that comparison must precede choosing its follow-up task, and recap is last.


      Current commitments are: Jo checks the public legend text by **29 November**; Lee prepares two layout
      cards by **30 November**. Both have accepted. The comparison cards say **A: date at top, location
      below** and **B: location at top, date below**. Neither is selected. The normal decision is to choose
      one card for a readability revision and obtain an owner/date, not authorize publication. Neri may
      use a table instead of Ro''s paragraph minutes.


      The supplied exception **E1** asks for **12 fictional units** of printing. Only council member Tavi
      has approved; council member Uma has not. The correct current status is pending second approval.
      If Uma is unavailable, defer the spending commitment and ask Review Desk for the next authorized
      route. Neri may still conduct the comparison. No actual purchase should occur.


      Known access dependency: the group''s real-world analogue would use an individually authorized notice
      account, but in this fiction only Ro currently controls the notice channel. Neri cannot yet send
      an official notice. The proposed maintenance rule is a G4/access/commitments review at each role
      transition and on a rule change; an owner must accept it. No passwords or private contact information
      belong in your output.


      ### Transfer, observe and repair


      1. Map authority, knowledge, relationships and access dependencies. Identify purpose, rules, rationale,
      commitments and limits. Output: a transition pack that distinguishes appointment from documentation.

      2. Plan a walkthrough of the ordinary agenda and E1. Let Neri choose a valid format without taking
      back the role. Output: explicit decision rights and a usable exception route.

      3. Save before the [later packet](?resource=file-later-packet-md). Classify the first attempt and
      the fresh E2 attempt by actual help and authority. Output: repaired guidance, remaining dependency
      and a bounded successor result.

      4. Confirm owner, backup, maintenance acceptance, review and challenge route. Output: a transition
      status the group could use, with unresolved notice access retained rather than declared solved.


      ### Support and further challenge


      Readable cards, a checklist, an interpreter or extra preparation time can remain part of competent
      facilitation. A harder case removes both current and backup facilitators: identify the legitimate
      appointment route and defer decisions that lack authority. For actual use follow access, records,
      governance and professional requirements. Do not treat retaining the former leader as an informal
      shadow approver as completed succession.


      ### Source use


      [NASA knowledge management, S08](https://www.nasa.gov/learning-resources/for-professionals/appel-knowledge-management/),
      emphasizes critical knowledge, context and continuity. Only the overview and identification of continuity
      resources were inspected, not the linked templates or policy. The original G4 pack is not NASA-compliant,
      a governance instrument for a real group or evidence of institutional resilience.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A successor receives documents but no appointment or required access. Has the role been transferred?

      2. The successor changes minute format while preserving every governing requirement. Should the
      former leader take over?

      3. The successor handles one fresh exception without a hint, but the notice account remains with
      the former leader. What is the transition status?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Not fully. Knowledge, legitimate authority and usable authorized access are separate dependencies.
      Identify which is missing and use the appropriate process.

      2. No. Allow a different valid method within the principles. Intervene for a real boundary, and
      record any help honestly rather than preserving personal habits as rules.

      3. A bounded success using the pack, with a remaining access dependency. Do not claim complete independence,
      completed access transfer or institution-wide resilience.'
    criteria:
