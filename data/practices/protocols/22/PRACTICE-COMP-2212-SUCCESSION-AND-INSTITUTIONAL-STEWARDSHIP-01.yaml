meaning_and_fit:
  purpose: Reduce dependence on one leader by distributing knowledge, preparing a replacement and documenting
    the principles and authority needed for a safe transition.
  why_recommended: Reduce dependence on one leader by distributing knowledge, preparing a replacement
    and documenting the principles and authority needed for a safe transition.
  claims:
  - statement: Reduce dependence on one leader by distributing knowledge, preparing a replacement and
      documenting the principles and authority needed for a safe transition.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Succession and institutional stewardship practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Succession and institutional stewardship as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a peer rotation, accessible written handover or fictional successor case.
    Maintain required training, legal appointments, financial approvals and access controls. A successor
    should not be selected merely for personal loyalty or similarity to the current leader.
  opportunity_considerations: Default to a rotating facilitator running the next planning meeting. Prepare
    the purpose, agenda, decision rights, current commitments, escalation route, access permissions, governing
    norms and review date. Do not put passwords, private personnel information or protected records into
    the pack.
  prerequisites:
  - Default to a rotating facilitator running the next planning meeting. Prepare the purpose, agenda,
    decision rights, current commitments, escalation route, access permissions, governing norms and review
    date. Do not put passwords, private personnel information or protected records into the pack.
  dependencies: []
  safe_alternatives:
  - Use a peer rotation, accessible written handover or fictional successor case. Maintain required training,
    legal appointments, financial approvals and access controls. A successor should not be selected merely
    for personal loyalty or similarity to the current leader.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Succession and institutional stewardship differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Succession and institutional
    stewardship as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a rotating facilitator running the next planning meeting. Prepare the purpose, agenda,
    decision rights, current commitments, escalation route, access permissions, governing norms and review
    date. Do not put passwords, private personnel information or protected records into the pack. Goal:
    Reduce dependence on one leader by distributing knowledge, preparing a replacement and documenting
    the principles and authority needed for a safe transition. Scope: Use an authorized low-stakes group
    role or a fictional transition. This is not permission to transfer legal, financial or safety authority
    informally. Time and effort: Thirty minutes to prepare a transition pack, one short successor-led
    task and a 20-minute review. Adaptation: Use a peer rotation, accessible written handover or fictional
    successor case. Maintain required training, legal appointments, financial approvals and access controls.
    A successor should not be selected merely for personal loyalty or similarity to the current leader.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a peer rotation, accessible written handover or fictional successor case. Maintain
    required training, legal appointments, financial approvals and access controls. A successor should
    not be selected merely for personal loyalty or similarity to the current leader.
  expected_burden: Thirty minutes to prepare a transition pack, one short successor-led task and a 20-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Succession and institutional stewardship protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Succession and institutional stewardship action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a peer
    rotation, accessible written handover or fictional successor case. Maintain required training, legal
    appointments, financial approvals and access controls. A successor should not be selected merely for
    personal loyalty or similarity to the current leader.
  actions:
  - stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01-A1
    sequence: 1
    title: Identify what currently depends on your personal memory or approval
    instructions: 'List the decisions, relationships, records and exceptions the group would struggle
      with if you were absent. Separate authority that can be delegated from authority requiring a formal
      appointment or approval. Explain the group’s principles and the reason for one important rule, not
      merely your preferred habits. Choose a willing successor or backup through the legitimate process
      and ask what preparation they need.


      Observation checks: Memory relationships records and exceptions are mapped; Delegable and formally
      retained authority are distinguished; Principles and rule rationale are documented; A successor
      is chosen through an appropriate willing process. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01-A1
      competency_stable_id: '22.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2212_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2212_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - memory_relationships_records_and_exceptions_are_mapped
        - delegable_and_formally_retained_authority_are_distinguished
        - principles_and_rule_rationale_are_documented
        - a_successor_is_chosen_through_an_appropriate_willing_process
      - measurement_id: c2212_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2212_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01-A2
    sequence: 2
    title: Transfer knowledge and let the successor make a real bounded choice
    instructions: 'Walk through one ordinary decision and one harmless exception, then give the successor
      the permitted information and resources. Ask them to run the next low-stakes agenda choice or tabletop
      meeting while you observe without supplying hidden directions. Let them choose a different valid
      method within the principles. Stop only for a real scope or safety boundary, explaining the reason
      rather than reclaiming control because their style differs.


      Observation checks: Ordinary and exception knowledge are transferred; The successor has the required
      permitted resources; A bounded decision is genuinely made by the successor; Valid style differences
      do not trigger unnecessary takeover. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01-A2
      competency_stable_id: '22.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2212_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2212_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - ordinary_and_exception_knowledge_are_transferred
        - the_successor_has_the_required_permitted_resources
        - a_bounded_decision_is_genuinely_made_by_the_successor
        - valid_style_differences_do_not_trigger_unnecessary_takeover
      - measurement_id: c2212_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2212_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01-A3
    sequence: 3
    title: Review resilience and formalize the next handoff
    instructions: 'Ask what information was missing, which authority was unclear and what still required
      your personal access. Revise the pack and confirm the formal owner, backup and review process for
      the role. Make sure the group knows who now decides and how to challenge an error. Record the remaining
      dependency honestly; one successful meeting is evidence of a small transition, not proof that the
      whole institution can survive any leadership loss.


      Observation checks: Missing information and authority gaps are identified; The pack is revised from
      the successor’s experience; Owner backup and challenge routes are communicated; Remaining person-dependence
      is not hidden. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What can the group now do without your permission or memory, and which principle would
      still guide a successor who chooses a different method?


      Examples: Supportive: The successor led a bounded decision using the documented norms, and the group
      clarified one approval gap for the next transition.


      Mixed: The meeting worked but depended on the old leader’s account access; the authorized access
      arrangement was corrected.


      Contradictory: The leader selected only a loyal imitation, withheld key information or transferred
      authority they had no right to delegate.


      Inconclusive: A successor was named without a real decision attempt, governance context or dependency
      review.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2212-SUCCESSION-AND-INSTITUTIONAL-STEWARDSHIP-01
