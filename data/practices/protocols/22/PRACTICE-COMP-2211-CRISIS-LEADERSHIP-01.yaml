  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      At **16:50**, Oli records Venn''s confirmation that Oak remains unavailable for this workshop; the
      cause remains unconfirmed. Pia learns that Birch is already booked and cannot serve as the alternative.
      Sal decides at **17:00** to cancel today''s workshop and consider a new date separately. No replacement
      event or venue is approved.


      Kim''s fictional final update is issued at **17:03**: “Today''s 18:00 Map Workshop is canceled because
      the booked room is unavailable. Please do not travel to Cedar Center for this workshop. We know
      this changes your plans. No replacement date is confirmed; the next scheduling update will be at
      12:00 tomorrow.” Sal accepts responsibility for that next update. The message makes no claim about
      electrical safety and gives no site-operating instructions.


      By **17:10**, ten of twelve attendees have acknowledged the cancellation; two remain unconfirmed.
      Kim retains responsibility for the agreed relay follow-up, which has not yet occurred. Sal''s update
      was two minutes before the 17:05 commitment. The initial statement that no one was onsite was known
      only at 16:40; no later universal location or safety check is supplied.


      The proposed preparedness improvement is to verify backup-room availability and the accessible update
      route before future events, with Sal as proposed owner. It is not yet performed. No live communication,
      cancellation, emergency response or demonstrated crisis competence occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Run an announced tabletop disruption in which a workshop venue becomes unavailable. Allow fifteen
      minutes to prepare, twenty for the scenario and fifteen for the review. Everything is fictional.
      Do not create a real alarm, interrupt services, simulate distress to bystanders, call emergency
      services or enter an unavailable site. This is practice in bounded coordination, not incident-command
      qualification.


      ### Stabilize the situation within your actual role


      The immediate objective in a disruption is often narrower than the original mission. A workshop
      leader may need to prevent travel to an unavailable venue before considering how to continue the
      event. People’s safety and the responsible site''s instructions take priority. Leadership does not
      mean personally diagnosing a building problem or directing responders without authority.


      Build a shared picture that separates confirmed facts, unknowns and rumors. Add source and time
      where they matter. “The venue owner says the room is unavailable today” is different from “there
      is a dangerous fault,” even if someone repeats the latter. Do not invent a cause to make the update
      feel complete. A known operational restriction can be enough to stop the event while the reason
      remains unconfirmed.


      Assign responsibilities that fit both competence and authority. Someone can ask the venue owner
      for status without inspecting equipment. A communications owner can draft the attendee update without
      making independent safety claims. An alternative checker can establish availability without committing
      the group to an unapproved room. Get acceptance from each owner and name the person who decides
      whether to defer or cancel. A status board with unaccepted names conceals gaps.


      Communicate a useful action now and a next update time. State what is known, what people should
      do, what is still being checked and when you will speak again. Acknowledge inconvenience without
      offering reassurance you cannot support. An accessible text or agreed alternative channel should
      carry the same material instructions. Multiple people improvising different versions can create
      confusion even if each wants to help.


      A message being prepared, sent, received and understood are different states. Track what the case
      actually provides. Missing acknowledgments may need follow-up through permitted channels, but do
      not invent contact details or claim everyone is safe from a delivery indicator. The leader remains
      responsible for identifying unresolved reach, not merely announcing that communication is complete.


      Set a decision time that leaves room for action. If the alternative remains unconfirmed at that
      point, use the authorized fallback instead of waiting indefinitely. A review time is still useful
      when there is no new information: explain that uncertainty and the current instruction. When conditions
      change, retain the original sequence and revise explicitly so an old hopeful possibility is not
      mistaken for a current plan.


      Preserve learning after the pressure eases. Ask which task lacked an owner, which information arrived
      late and which assumption was unsupported. Separate individual action from system preparation, such
      as a missing update channel. One smooth tabletop cannot show how the same people will perform under
      real stress or that a venue plan is adequate. Preparedness improvements remain proposed until actually
      approved and performed.


      ### Worked example


      A coordinator says, “We will probably use the spare room,” before its owner responds. Participants
      hear a relocation instruction rather than a possibility. A better update says the current room is
      unavailable, asks people not to travel there for the workshop and names the next update time while
      the alternative is checked. Honest uncertainty can give clearer guidance than an optimistic guess.


      ### Complete fictional tabletop brief


      It is **25 November 2026, 16:40 UTC**. A paper-map workshop is scheduled for **18:00–18:40** in
      Cedar Center, Oak Room. No attendee is onsite in the supplied starting facts. Authorized venue steward
      Venn reports: “Oak Room is unavailable for today''s workshop. Do not bring the group here. I will
      confirm venue status at 16:50.” The cause is unconfirmed. A rumor says an electrical fault occurred;
      no competent authority has confirmed that claim and nobody in this exercise should investigate it.


      Coordinator Sal may defer or cancel this workshop. Sal cannot approve venue safety or command any
      emergency response. Venn controls site status and instructions. The group''s ordinary emergency
      procedure remains with responsible site personnel and authorized services; if the tabletop introduces
      an actual emergency, stop the exercise and use the actual applicable route. The supplied case introduces
      no live emergency.


      There are **12 registered attendees** on a fictional roster held only by the communications role;
      no private names or addresses are supplied or needed. **Kim** accepts responsibility for the approved
      attendee text and acknowledgment tally. **Oli** accepts asking Venn for the status update. **Pia**
      accepts checking whether Birch Room is available and approved for this use. Sal owns the decision
      at **17:00** and the next attendee update by **17:05**. All owners confirm acceptance in the starting
      packet.


      The permitted channel is the group''s existing accessible text notice; a previously agreed phone
      relay can be used by Kim for attendees who need it. This describes fictional authority, not an instruction
      to contact anyone now. The alternative is **unconfirmed**, so no relocation instruction may be issued.
      The limited immediate objective is to prevent workshop travel to Oak and give a definite next update.
      The initial message must be labeled “TABLETOP DRAFT — DO NOT SEND” in your exercise output.


      ### Stabilize, communicate and reassess


      1. Make a status board with safety/site authority, known facts, unknown cause, rumor, objective
      and accepted owners. Output: a factual picture that keeps venue investigation outside the team’s
      role.

      2. Draft the first update with action now, empathy, uncertainty and the 17:05 update commitment.
      Output: one accessible unsent message and acknowledgment plan, with no unconfirmed relocation.

      3. Save before the [later packet](?resource=file-later-packet-md). Use its changed facts to decide
      by 17:00 and update by 17:05. Output: a versioned decision and communication record with unresolved
      reach retained.

      4. Review timing, ownership and what people could understand. Output: one specific preparedness
      improvement, its proposed owner and the distinction between rehearsal observations and live readiness.


      ### Support and harder conditions


      A paper timeline, text-to-speech, quiet pace and visible roles keep the task about coordination
      rather than theatrical stress. A harder case removes Kim''s acknowledgment tally: retain reach as
      unknown and identify a permitted follow-up owner. Do not make the drill realistic by surprising
      anyone. Actual crises require the local plan, responsible authorities and qualified help; this scenario
      supplies no emergency procedure or safety certification.


      ### Source use


      [CDC CERC introduction, S07](https://www.cdc.gov/cerc/media/pdfs/CERC_Introduction.pdf), supports
      timely, accurate, credible, respectful communication that acknowledges people and offers useful
      action. Only the introductory six-principle section is adapted. It does not qualify the learner,
      validate a crisis plan or establish effectiveness of this tabletop.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


