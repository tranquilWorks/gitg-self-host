meaning_and_fit:
  purpose: Practice stabilizing a limited disruption, communicating known and unknown facts, assigning
    appropriate owners and revising the plan without pretending certainty under pressure.
  why_recommended: Practice stabilizing a limited disruption, communicating known and unknown facts, assigning
    appropriate owners and revising the plan without pretending certainty under pressure.
  claims:
  - statement: Practice stabilizing a limited disruption, communicating known and unknown facts, assigning
      appropriate owners and revising the plan without pretending certainty under pressure.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Crisis leadership practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Crisis leadership as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use an accessible written scenario, a small peer group or solo role cards.
    Do not disrupt actual services, call emergency lines for practice or simulate frightening events without
    consent. Follow the appropriate real emergency plan whenever a real incident occurs.
  opportunity_considerations: Use a fictional workshop whose venue becomes unavailable shortly before
    arrival. No real alarm, utility failure or emergency call is created. Prepare a status board with
    safety status, known facts, unknowns, immediate objective, owners, communication, decision time and
    next review. Use the site’s real plan only with permission and without private contact details in
    evidence.
  prerequisites:
  - Use a fictional workshop whose venue becomes unavailable shortly before arrival. No real alarm, utility
    failure or emergency call is created. Prepare a status board with safety status, known facts, unknowns,
    immediate objective, owners, communication, decision time and next review. Use the site’s real plan
    only with permission and without private contact details in evidence.
  dependencies: []
  safe_alternatives:
  - Use an accessible written scenario, a small peer group or solo role cards. Do not disrupt actual services,
    call emergency lines for practice or simulate frightening events without consent. Follow the appropriate
    real emergency plan whenever a real incident occurs.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Crisis leadership differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Crisis leadership as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional workshop whose venue becomes unavailable shortly before arrival. No real alarm,
    utility failure or emergency call is created. Prepare a status board with safety status, known facts,
    unknowns, immediate objective, owners, communication, decision time and next review. Use the site’s
    real plan only with permission and without private contact details in evidence. Goal: Practice stabilizing
    a limited disruption, communicating known and unknown facts, assigning appropriate owners and revising
    the plan without pretending certainty under pressure. Scope: This is an announced tabletop exercise,
    not live emergency training, incident-command qualification or permission to direct responders. Real
    emergencies follow the site plan and authorized services. Time and effort: Fifteen minutes to prepare,
    a 20-minute tabletop scenario and a 15-minute review. Adaptation: Use an accessible written scenario,
    a small peer group or solo role cards. Do not disrupt actual services, call emergency lines for practice
    or simulate frightening events without consent. Follow the appropriate real emergency plan whenever
    a real incident occurs. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written scenario, a small peer group or solo role cards. Do not
    disrupt actual services, call emergency lines for practice or simulate frightening events without
    consent. Follow the appropriate real emergency plan whenever a real incident occurs.
  expected_burden: Fifteen minutes to prepare, a 20-minute tabletop scenario and a 15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Crisis leadership protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Crisis leadership action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written scenario, a small peer group or solo role cards. Do not disrupt actual services, call emergency
    lines for practice or simulate frightening events without consent. Follow the appropriate real emergency
    plan whenever a real incident occurs.
  actions:
  - stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01-A1
    sequence: 1
    title: Stabilize the scenario before trying to preserve the event
    instructions: 'State that people’s safety and the responsible site authority’s instructions take precedence
      over continuing the workshop. Identify what is known, what needs confirmation and who has authority
      to assess the venue. Choose a limited immediate objective, such as preventing attendees from arriving
      at an unavailable location. Do not improvise electrical, medical or building-safety actions, and
      do not let an unverified rumor become the operational picture.


      Observation checks: Safety and authorized site instructions take precedence; Known facts unknowns
      and verification owners are separated; A limited immediate objective is stated; No unqualified technical
      or emergency action is improvised. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01
      action_stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01-A1
      competency_stable_id: '22.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2211_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2211_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - safety_and_authorized_site_instructions_take_precedence
        - known_facts_unknowns_and_verification_owners_are_separated
        - a_limited_immediate_objective_is_stated
        - no_unqualified_technical_or_emergency_action_is_improvised
      - measurement_id: c2211_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2211_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01-A2
    sequence: 2
    title: Assign owners and communicate a useful update
    instructions: 'Give one person the venue-confirmation task, one the attendee message and one the permitted
      alternative or cancellation check, with an accepting owner for each. Draft a concise update: what
      happened, what people should do now, what remains uncertain and when the next update will arrive.
      Provide an accessible channel and avoid conflicting instructions. If the scenario introduces a real
      emergency condition, the correct tabletop response is to invoke the actual authorized emergency
      route, not personally take command.


      Observation checks: Each critical task has one accepting owner; The update states action uncertainty
      and next update time; Communication is accessible and internally consistent; Emergency authority
      is not assumed by the exercise leader. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01
      action_stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01-A2
      competency_stable_id: '22.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2211_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2211_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_critical_task_has_one_accepting_owner
        - the_update_states_action_uncertainty_and_next_update_time
        - communication_is_accessible_and_internally_consistent
        - emergency_authority_is_not_assumed_by_the_exercise_leader
      - measurement_id: c2211_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2211_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2211-CRISIS-LEADERSHIP-01-A3
    sequence: 3
    title: Inject a changed fact and conduct a no-blame learning review
    instructions: 'Add a fictional update that the alternative room is also unavailable. Reassess by the
      stated time, decide to defer or cancel within authority and communicate the change without pretending
      the first plan was certain. Review whether people knew what to do, whether any task lacked an owner
      and what information arrived too late. Preserve the original decision sequence and choose one preparedness
      improvement. A smooth tabletop exercise does not demonstrate live crisis competence.


      Observation checks: A changed fact triggers a timely reassessment; The revised decision is communicated
      with its reason; Ownership and information gaps are reviewed; Tabletop performance is not claimed
      as live crisis qualification. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: At each point, could a participant say what was known, what to do, who owned the next
      action and when the plan would be reconsidered?


      Examples: Supportive: The tabletop team prevented conflicting messages, assigned clear owners and
      canceled promptly when the alternative failed.


      Mixed: The first update lacked a next review time; the team corrected it and added that field to
      preparedness notes.


      Contradictory: The leader improvised unsafe technical action, hid uncertainty or treated a practice
      role as authority over real responders.


      Inconclusive: Crisis leadership was discussed without a status update, accountable assignments or
      a changed-fact reassessment.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
