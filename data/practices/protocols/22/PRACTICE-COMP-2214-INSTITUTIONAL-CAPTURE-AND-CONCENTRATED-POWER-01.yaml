  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### What the checks do and do not achieve


      The hall board restores the access item by **3–1** among the four eligible members. The donor then
      withdraws the prospective **60 units**. The later 10-unit grant leaves **50 units unreplaced** relative
      to the old budget. No replacement service plan is approved. Deliberation has reopened, but sustainable
      access is unresolved.


      The office commissions the 8-unit external review after the reviewer''s disclosed industry work
      is assessed by an authorized uninvolved officer. One firm''s claim is unsupported by the submitted
      method; that firm challenges the finding. The office logs the challenge for technical response rather
      than suppressing it. Final method approval remains pending. No water-safety conclusion follows.


      The profession council approves two rotating seats but leaves the leader''s exclusive shortlist
      and appeal control intact. This is a **partial reform** with the central dependency still present.
      It does not warrant a “capture solved” label.


      Revise each map using these different outcomes. Preserve budget loss, contested evidence and unrepaired
      appointment power. Name the next decision and its authority. A useful revised proposal makes failure
      visible rather than renaming every action as success.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare three ways an institution can become dependent on the people it should assess. Allow
      thirty minutes to map the cases and ten to pressure-test your safeguards. The result is a mechanism-and-checks
      analysis, not a list of unpopular people or a claim that every concentrated interest is corrupt.


      ### Follow the dependency to the decision


      An institution can retain its formal title while its practical choices narrow. Ask who supplies
      the money, information, appointments, access or career opportunities on which decision-makers depend.
      Then ask how that dependence could divert the institution from its duty. Influence becomes a capture
      concern when a particular interest persistently controls the process or its outputs at the expense
      of that duty. A donor, specialist or experienced leader may also provide legitimate resources. Their
      involvement alone does not establish capture.


      The [OECD report abstract, S02](https://www.oecd.org/en/publications/preventing-policy-capture_9789264065239-en.html)
      frames policy capture as repeated diversion from public purposes and identifies participation, transparency,
      accountability and integrity safeguards. Only the landing abstract was inspected, not the full report
      or its case studies. The three cases below are original teaching materials. Their mechanisms and
      counterfactual tests are analytical proposals, not OECD findings about actual institutions.


      Boards may depend on a major donor; regulators may rely on industry expertise; professional bodies
      may allow insiders to select their own reviewers. Parties can face a similar problem if funders
      or gatekeepers narrow who can stand or which interests are heard. A leader can concentrate appointment
      and appeal powers even without taking money. Keep these routes distinct: disclosure about funding
      cannot by itself repair an exclusive information channel, and rotation without a fair appointment
      process can replace one loyal group with another.


      ### Three complete fictional case cards


      | Case | Assigned duty and observed arrangement | Uncertainty |

      | --- | --- | --- |

      | Hall board | Allocate community rooms using published access criteria. One donor pays 60 of the
      board''s 100 budget units and asks the chair to remove evening access from next month''s agenda.
      The chair removes it without a recorded board decision. Four other board members may restore agenda
      items by majority. | The donor''s reasons, other members'' views and the final access outcome are
      unknown. |

      | Water review office | Assess a fictional monitoring method impartially. The regulated firms fund
      and supply every technical briefing. The office has no independent testing budget. Its director
      can commission an external review using 8 discretionary units, but has not done so. | The supplied
      technical claims have not been verified; no unsafe water or false report is established. |

      | Design profession panel | Select training reviewers for competence and independence. The panel
      leader appoints all five selectors, including three former campaign supporters. Applicants receive
      no selection reasons and appeals return to the leader. The elected council can revise appointments
      and appeals next month. | Loyalty does not establish incompetence; the effect on past selections
      is unknown. |


      For the hall, an alternative 10-unit unrestricted grant is available only next quarter. It cannot
      replace 60 units immediately. For the office, the external reviewer has relevant expertise but must
      disclose other industry engagements; independence cannot be assumed from the word external. For
      the panel, two rotating seats could be filled through published criteria, but the current leader
      would still choose the shortlist unless that power changes. These constraints are part of the supplied
      work.


      ### Worked mechanism, including a plausible innocent explanation


      Start with the hall. A donation can legitimately support room provision, and a donor may flag genuine
      scheduling problems. The observed issue is narrower: a funding request has removed an access question
      without the board''s prescribed decision. Map the chain as funding dependence, chair agenda control,
      excluded deliberation and possible departure from access duty. Evidence establishes the request
      and removal, not a recurring bargain or donor intent. A stronger inquiry would ask for the authorized
      agenda record and funding conditions; it would not secretly investigate the donor.


      A proportionate immediate safeguard is a recorded board decision on restoring the item, with the
      donor interest disclosed and affected users able to contribute. Longer-term diversification reduces
      dependence, but the 10-unit grant still leaves a large gap. Record the service costs of refusing
      funding rather than pretending that integrity has no tradeoffs. A transparent donor agreement can
      clarify limits on influence; it cannot guarantee that informal pressure disappears.


      ### Build and challenge three maps


      1. For every case, state the institution''s duty, dependent resource, influence route, missing check
      and precisely observed evidence. Separate suspected effects from established actions. Include a
      legitimate reason for stakeholder involvement.

      2. Propose one immediate check and one structural safeguard per case. For each, name the supplied
      authority that could act, the resources needed and what remains outside its control. Keep unapproved
      reforms labeled proposals.

      3. Test the office''s information dependence. An independent technical review, publication of methods
      where lawful, competing expertise and documented responses could improve challenge. Disclosing the
      firms'' funding is helpful but insufficient if nobody can test their claims.

      4. Test the panel''s appointment dependence. Require criteria, conflict handling, reasoned decisions
      and an appeal reviewer outside the original chain. Ask who appoints that reviewer and can remove
      them. Rotating seats without changing the shortlist may preserve the same gatekeeper.

      5. Write a pressure response for donor withdrawal, a firm disputing an external report and the panel
      leader objecting to independent appeal. Specify which decision pauses, what evidence is needed and
      who retains lawful authority. Save your maps before the [later packet](?resource=file-later-packet-md).


      Checks create their own risks. Public minutes may need redaction to protect applicants. Multiple
      reviews can delay a decision or exhaust a small organization. A new funder can create a new dependence.
      Countervailing power needs defined responsibility so that no faction gains an unchecked veto. The
      goal is an institution able to hear, test and correct important claims while continuing its legitimate
      work.


      ### Evidence and transfer


      For a supported attempt, use the hall model to label the five columns, then generate the office
      and panel maps yourself. For a harder pass, combine funding and appointment dependence: the donor
      offers replacement money only if allowed to appoint the appeals reviewer. Identify why this exchanges
      one problem for another rather than solving both.


      Optional actual transfer is a review of public governing documents for a low-stakes group. Report
      only document features and unanswered questions. Do not infer personal corruption, collect private
      political affiliations or pressure members to disclose relationships. A record of a real challenge
      reaching an independent authorized review would be stronger than a tidy diagram, but even that would
      not establish whole-institution freedom from capture. Actual legal, regulatory or governance reform
      needs responsible authority and qualified advice.


      ### Use the result at its proper scale


      Practical safeguards do not add canonical metadata.  A leadership role is not compulsory. Use actual
      authority and willing participation; keep protected records private. Fiction and no attempt are
      legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A regulator publishes the names of industry funders but has no way to obtain independent technical
      evidence. Which weakness remains?

      2. A committee rotates members each year, but one leader chooses every replacement and decides every
      appeal. What should the map show?

      3. A board rejects a donor condition and loses 40 funding units. Does that prove institutional success
      or donor corruption?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Information dependence remains. Transparency exposes a relationship but does not create
      the capacity to challenge its claims. Propose an authorized, competent and conflict-checked source
      of independent scrutiny, with its cost and limits.

      2. Rotation changes people while appointment and appeal power remain concentrated. Examine shortlist
      authority, selection criteria, conflicts and independent review; do not treat turnover as proof
      of independence.

      3. Neither conclusion follows. The board may have preserved a decision boundary while creating an
      unresolved service gap. Record the actual condition, decision, resource loss and next authorized
      plan without inventing intent or sustainable outcomes.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
