meaning_and_fit:
  purpose: Identify a plausible capture mechanism from concrete governance arrangements and design checks
    without turning influence or disagreement into an unsupported conspiracy claim.
  why_recommended: Identify a plausible capture mechanism from concrete governance arrangements and design
    checks without turning influence or disagreement into an unsupported conspiracy claim.
  claims:
  - statement: Identify a plausible capture mechanism from concrete governance arrangements and design
      checks without turning influence or disagreement into an unsupported conspiracy claim.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Institutional capture and concentrated power practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Institutional capture and concentrated power as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use fictional cases when real politics or organizational records are sensitive.
    Public-record analysis must respect privacy and avoid unsupported allegations. Actual legal, regulatory
    or corruption concerns belong with qualified independent channels.
  opportunity_considerations: 'Use three fictional cases: a venue board relies on one donor who can remove
    its funding; a regulator receives nearly all technical information from the industry it oversees;
    a professional committee selects successors only from the current leader’s allies. Prepare fields
    for duty, dependency, influence channel, missing counterweight, evidence and safeguard.'
  prerequisites:
  - 'Use three fictional cases: a venue board relies on one donor who can remove its funding; a regulator
    receives nearly all technical information from the industry it oversees; a professional committee
    selects successors only from the current leader’s allies. Prepare fields for duty, dependency, influence
    channel, missing counterweight, evidence and safeguard.'
  dependencies: []
  safe_alternatives:
  - Use fictional cases when real politics or organizational records are sensitive. Public-record analysis
    must respect privacy and avoid unsupported allegations. Actual legal, regulatory or corruption concerns
    belong with qualified independent channels.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Institutional capture and concentrated power differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Institutional capture and
    concentrated power as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three fictional cases: a venue board relies on one donor who can remove its funding; a regulator
    receives nearly all technical information from the industry it oversees; a professional committee
    selects successors only from the current leader’s allies. Prepare fields for duty, dependency, influence
    channel, missing counterweight, evidence and safeguard. Goal: Identify a plausible capture mechanism
    from concrete governance arrangements and design checks without turning influence or disagreement
    into an unsupported conspiracy claim. Scope: Use fictional institutions or verified public records.
    This is not a finding of corruption, political targeting or permission to investigate private people.
    Time and effort: Two 25-minute mechanism comparisons and a 15-minute safeguard review. Adaptation:
    Use fictional cases when real politics or organizational records are sensitive. Public-record analysis
    must respect privacy and avoid unsupported allegations. Actual legal, regulatory or corruption concerns
    belong with qualified independent channels. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fictional cases when real politics or organizational records are sensitive.
    Public-record analysis must respect privacy and avoid unsupported allegations. Actual legal, regulatory
    or corruption concerns belong with qualified independent channels.
  expected_burden: Two 25-minute mechanism comparisons and a 15-minute safeguard review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Institutional capture and concentrated power protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Institutional capture and concentrated power action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fictional
    cases when real politics or organizational records are sensitive. Public-record analysis must respect
    privacy and avoid unsupported allegations. Actual legal, regulatory or corruption concerns belong
    with qualified independent channels.
  actions:
  - stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01-A1
    sequence: 1
    title: Trace the mechanism rather than assume bad motives
    instructions: 'For each case, state what the institution is supposed to govern and how money, information,
      appointments or status could narrow its choices. Distinguish legitimate expertise or support from
      a dependency that undermines independent judgment. Give regulators, boards, professions, parties,
      donors and leaders a relevant or absent role in the analysis. Identify what additional evidence
      would show actual influence over a decision rather than merely a relationship.


      Observation checks: Institutional duty and dependency are explicit in each case; Money information
      appointments and status mechanisms are distinguished; All named institution types receive a relevant
      or absent disposition; A relationship is not treated as proof of capture. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01
      action_stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01-A1
      competency_stable_id: '22.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2214_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2214_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - institutional_duty_and_dependency_are_explicit_in_each_case
        - money_information_appointments_and_status_mechanisms_are_distinguished
        - all_named_institution_types_receive_a_relevant_or_absent_disposition
        - a_relationship_is_not_treated_as_proof_of_capture
      - measurement_id: c2214_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2214_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01-A2
    sequence: 2
    title: Design a counterweight that addresses the actual dependency
    instructions: 'For the donor case, compare diversified support and transparent conditions; for the
      information case, compare independent evidence and documented dissent; for the succession case,
      compare transparent selection, rotation and independent review. Identify who would authorize the
      safeguard and what new cost or failure mode it could create. Do not assume rotation alone creates
      expertise or that transparency removes all pressure. Choose a proportionate combination tied to
      the mechanism.


      Observation checks: Safeguards match the specific dependency; Transparency rotation independent
      information and countervailing power are compared; Authority cost and new failure modes are considered;
      No single safeguard is treated as sufficient by itself. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01
      action_stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01-A2
      competency_stable_id: '22.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2214_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2214_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - safeguards_match_the_specific_dependency
        - transparency_rotation_independent_information_and_countervailing_power_are_compared
        - authority_cost_and_new_failure_modes_are_considered
        - no_single_safeguard_is_treated_as_sufficient_by_itself
      - measurement_id: c2214_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2214_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01-A3
    sequence: 3
    title: Stress-test the check against a determined but lawful influence attempt
    instructions: 'Use a paper scenario in which the donor threatens to withdraw support, the industry
      disputes the evidence or the leader objects to an independent successor. Ask whether the proposed
      check still permits a reasoned decision and protects legitimate participation. Revise the design
      where it depends on the powerful person’s goodwill alone. Write a limited conclusion about risk
      and governance, not a declaration that every donor, expert or leader is corrupt.


      Observation checks: Each safeguard faces a realistic paper challenge; The institution retains a
      reasoned decision route; Goodwill-dependent controls are identified and revised; The conclusion
      remains a bounded risk analysis. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What resource gave an outside interest disproportionate control, and what check would
      still function when that interest dislikes the decision?


      Examples: Supportive: The participant distinguished information dependence from proven corruption
      and proposed independent evidence plus an accountable review route.


      Mixed: The first solution relied only on transparency; the stress test showed a need for a real
      independent decision power.


      Contradictory: An ordinary funding relationship was declared proof of a conspiracy or all expertise
      was dismissed because it came from an interested party.


      Inconclusive: Capture was named without tracing a mechanism or testing a counterweight.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01
      action_stable_id: PRACTICE-COMP-2214-INSTITUTIONAL-CAPTURE-AND-CONCENTRATED-POWER-01-A3
