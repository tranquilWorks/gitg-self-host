meaning_and_fit:
  purpose: Separate immediate safety, qualified investigation, accountability, remediation and structural
    prevention when an institution receives a serious concern.
  why_recommended: Separate immediate safety, qualified investigation, accountability, remediation and
    structural prevention when an institution receives a serious concern.
  claims:
  - statement: Separate immediate safety, qualified investigation, accountability, remediation and structural
      prevention when an institution receives a serious concern.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Abuse response and institutional repair practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Abuse response and institutional repair as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use non-graphic fictional cases and accessible process maps. Real child-safety,
    violence, discrimination, fraud or retaliation concerns require prompt appropriate professional, legal,
    safeguarding or emergency channels. Do not collect real victim, witness or personnel data in this
    application.
  opportunity_considerations: 'Use two fictional reports: a participant reports harassment by a leader;
    a separate financial control review finds a possible false record. Prepare a response map for safety,
    support, reporting duty, independent intake, evidence preservation, qualified investigation, fair
    process, decision, remedy, communication and recurrence prevention.'
  prerequisites:
  - 'Use two fictional reports: a participant reports harassment by a leader; a separate financial control
    review finds a possible false record. Prepare a response map for safety, support, reporting duty,
    independent intake, evidence preservation, qualified investigation, fair process, decision, remedy,
    communication and recurrence prevention.'
  dependencies: []
  safe_alternatives:
  - Use non-graphic fictional cases and accessible process maps. Real child-safety, violence, discrimination,
    fraud or retaliation concerns require prompt appropriate professional, legal, safeguarding or emergency
    channels. Do not collect real victim, witness or personnel data in this application.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Abuse response and institutional repair differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Abuse response and institutional
    repair as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use two fictional reports: a participant reports harassment by a leader; a separate financial
    control review finds a possible false record. Prepare a response map for safety, support, reporting
    duty, independent intake, evidence preservation, qualified investigation, fair process, decision,
    remedy, communication and recurrence prevention. Goal: Separate immediate safety, qualified investigation,
    accountability, remediation and structural prevention when an institution receives a serious concern.
    Scope: This is a fictional institutional-response exercise, not an investigation, legal determination,
    trauma treatment or permission to interview affected people. A real urgent concern requires the appropriate
    prompt protective and reporting action. Time and effort: Twenty minutes to map the pathway, one 20-minute
    case test and a 15-minute structural-repair review. Adaptation: Use non-graphic fictional cases and
    accessible process maps. Real child-safety, violence, discrimination, fraud or retaliation concerns
    require prompt appropriate professional, legal, safeguarding or emergency channels. Do not collect
    real victim, witness or personnel data in this application. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use non-graphic fictional cases and accessible process maps. Real child-safety,
    violence, discrimination, fraud or retaliation concerns require prompt appropriate professional, legal,
    safeguarding or emergency channels. Do not collect real victim, witness or personnel data in this
    application.
  expected_burden: Twenty minutes to map the pathway, one 20-minute case test and a 15-minute structural-repair
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Abuse response and institutional repair protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Abuse response and institutional repair action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use non-graphic
    fictional cases and accessible process maps. Real child-safety, violence, discrimination, fraud or
    retaliation concerns require prompt appropriate professional, legal, safeguarding or emergency channels.
    Do not collect real victim, witness or personnel data in this application.
  actions:
  - stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01-A1
    sequence: 1
    title: Prioritize protection and independent intake
    instructions: 'For each report, distinguish immediate danger, ongoing exposure, support needs and
      any mandatory or appropriate external reporting requirement to verify locally. Identify an intake
      route that does not require the person to report only to the accused leader or their close ally.
      Explain confidentiality limits and available support without promising a result. Do not demand a
      complete narrative, force mediation or delay protection until the institution decides how the story
      will look publicly.


      Observation checks: Safety exposure and support are addressed first; An appropriately independent
      intake route exists; Reporting duties and confidentiality limits are checked; Reputation management
      does not delay protection or force disclosure. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01
      action_stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01-A1
      competency_stable_id: '22.17'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2217_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2217_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - safety_exposure_and_support_are_addressed_first
        - an_appropriately_independent_intake_route_exists
        - reporting_duties_and_confidentiality_limits_are_checked
        - reputation_management_does_not_delay_protection_or_force_disclosure
      - measurement_id: c2217_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2217_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01-A2
    sequence: 2
    title: Assign qualified fact-finding and fair decision authority
    instructions: 'Identify who is authorized and competent to preserve evidence, investigate and decide
      under the applicable process, with conflicts managed. Distinguish an allegation, a substantiated
      finding and an unresolved question. Plan a fair opportunity for relevant responses without making
      the affected person conduct the investigation or confront the accused. Protect records and prevent
      retaliation through the institution’s legitimate mechanisms; do not make a public finding or gather
      real testimony for this tabletop exercise.


      Observation checks: Investigation and decision roles are qualified and authorized; Conflicts and
      evidence preservation are addressed; Allegation finding and uncertainty are distinguished; No forced
      confrontation amateur investigation or public verdict occurs. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01
      action_stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01-A2
      competency_stable_id: '22.17'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2217_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2217_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - investigation_and_decision_roles_are_qualified_and_authorized
        - conflicts_and_evidence_preservation_are_addressed
        - allegation_finding_and_uncertainty_are_distinguished
        - no_forced_confrontation_amateur_investigation_or_public_verdict_occurs
      - measurement_id: c2217_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2217_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01-A3
    sequence: 3
    title: Connect the outcome to remedy and structural change
    instructions: 'For the fictional cases, specify how a justified outcome could lead to appropriate
      accountability, support, correction of records and repair of the control or reporting failure. Include
      how harassment, discrimination, violence, fraud or cover-up would reach the relevant qualified route
      rather than treating all issues as an interpersonal misunderstanding. Set an independent check for
      recurrence and communicate process changes without exposing private details. A public apology or
      removal of one person alone does not prove institutional repair.


      Observation checks: Remedy and accountability follow the authorized findings process; Different
      serious harms have appropriate response routes; A structural failure and recurrence check are identified;
      Communication protects privacy and does not overclaim repair. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Who is protected while facts are established, who can hold the institution accountable,
      and what changed beyond the wording of its public response?


      Examples: Supportive: The pathway provided independent intake, qualified investigation and a tested
      reporting-control change without forcing the affected person into mediation.


      Mixed: The first response focused on a statement; the review added immediate support, evidence preservation
      and independent recurrence checks.


      Contradictory: The institution hid a report, retaliated, pressured forgiveness or treated reputation
      repair as a substitute for safety and accountability.


      Inconclusive: An apology plan was written without qualified roles, fair process, remedy or structural
      prevention.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01
      action_stable_id: PRACTICE-COMP-2217-ABUSE-RESPONSE-AND-INSTITUTIONAL-REPAIR-01-A3
