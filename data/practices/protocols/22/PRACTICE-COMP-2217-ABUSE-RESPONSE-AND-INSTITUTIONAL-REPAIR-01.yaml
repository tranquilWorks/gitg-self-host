  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Partial findings and unfinished repair


      In H, the authorized director temporarily removes Tess from allocating Ivo''s shifts; Ivo retains
      the agreed shift in this supplied week. Wen offers an independent contact, and Ivo declines a direct
      meeting with Tess. A qualified investigation is commissioned but **no conduct finding is supplied**.
      The interim arrangement is not discipline or exoneration. Longer-term protection and possible retaliation
      remain unobserved.


      In F, competent review determines that R17 was entered twice but only **one 80-unit payment** was
      made. The duplicate entry is corrected with an audit trail; it is not erased. The packet does not
      determine Cal''s intent or establish fraud. Dee separately retains Cal''s deletion instruction for
      authorized review. No money recovery is claimed because a second payment is not established.


      The institution creates an independent intake route and assigns a monthly check of duplicate flags
      and edit history. The first check has not happened. These are approved changes and pending monitoring,
      not evidence of reduced recurrence.


      Revise your maps so protection, findings, remedies and monitoring retain separate statuses. If your
      draft promised confidentiality without limits, required Ivo to mediate or called the duplicate fraud,
      correct it. The next update should acknowledge what remains unknown without disclosing private case
      material. A reputation statement cannot close the unresolved investigation.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Prepare responses to two fictional institutional reports without investigating a person. Allow
      thirty minutes for the response map and ten for the later findings. The goal is to protect affected
      people, preserve fair process and repair conditions that could allow recurrence. Reputation management
      is not a substitute for those responsibilities.


      ### Separate protection, determination and repair


      An initial report can warrant protective action before the institution knows every fact. Interim
      measures should be authorized, proportionate and reviewed; they should not quietly penalize the
      person who raised the concern or announce a final finding against the respondent. Determining what
      occurred requires competent, independent procedures that can assess relevant evidence and hear responses.
      Remediation then addresses identified harm and failures, while structural repair changes the conditions
      that enabled them.


      Harassment, discrimination, violence, fraud and cover-up may require different expertise and reporting
      routes. Harassment or discrimination concerns need appropriate safeguarding or workplace response;
      actual violence or imminent danger requires urgent safety help; possible fraud needs qualified financial
      and legal handling; interference with records or reports needs independent oversight. Do not flatten
      these into interpersonal misunderstandings or assume every dispute requires mediation. Never require
      an affected person to confront an alleged abuser as an exercise.


      The EEOC''s [2017 promising-practices document, S05](https://www.eeoc.gov/laws/guidance/promising-practices-preventing-harassment)
      supports multiple complaint routes, neutral investigation, privacy limits, anti-retaliation follow-through
      and accountable correction. It is historical, nonbinding U.S. technical assistance, not a current
      legal ruling for every jurisdiction. Only the identified response principles are used here. Current
      reporting duties, employment rights, safeguarding rules and specialist procedures must be verified
      for actual cases.


      ### Two original report cards


      **H: conduct report.** A fictional program assistant, **Ivo**, reports repeated demeaning remarks
      by program lead **Tess** during planning sessions and an unwanted personal message after Ivo asked
      for it to stop. No graphic detail is supplied or needed. Ivo requests no direct meeting with Tess
      and wishes to keep an existing paid shift. Tess controls the usual reporting inbox and shift allocation.
      An independently appointed safeguarding officer, **Wen**, can receive reports, arrange support and
      recommend interim measures to an uninvolved authorized director, **Uma**. A qualified external investigator
      can be commissioned by Uma if appropriate. There is no reported immediate physical danger in this
      card.


      **F: financial report.** Bookkeeper **Ren** notices the same fictional receipt reference, R17, attached
      to two expense entries of **80 units each**. Ren is authorized to see the ledger and reports the
      discrepancy. Payment status and whether it is a duplicate entry, erroneous attachment or deliberate
      claim are unknown. Finance lead **Cal** asks Ren to delete one entry “so auditors do not get confused.”
      The independent audit contact, **Dee**, is authorized to receive the concern and arrange competent
      review; Cal cannot determine the outcome of a report about Cal''s instruction. No real receipt,
      account or transaction is included.


      Both cards use fictional policy A7. It offers need-to-know handling subject to investigation and
      legal duties, an alternate independent oversight route if the assigned receiver is implicated, acknowledgment
      within two working days, a named contact for updates, and a prohibition on retaliation with a route
      to report it. The acknowledgment standard is not a legal deadline. Qualified responsible people
      must determine any mandatory reporting or preservation duties; the learner must not invent confidentiality
      promises or decide that reporting can wait.


      ### Worked first response to H


      An unsent rehearsal response could say: “Thank you for telling me. You do not need to meet Tess
      for this intake. Wen can explain support and reporting options, including privacy limits, and Uma
      can consider interim arrangements that preserve your shift where possible. We will identify who
      can update you and when.” This acknowledges the report without promising absolute secrecy, guaranteed
      job protection or a finding before investigation.


      Wen should establish immediate needs through a limited, appropriate intake rather than demand repeated
      retelling. Uma can consider removing Tess from decisions about Ivo''s shifts while the matter is
      assessed, subject to actual authority and review. The institution should preserve relevant records
      through lawful qualified procedures; the learner does not gather messages, interview witnesses,
      demand medical information or decide credibility from demeanor. Tess''s opportunity to respond belongs
      in the fair investigative process, not in a forced encounter with Ivo.


      ### Write two response maps


      1. For H and F separately, record the report as an allegation or discrepancy, who may be exposed
      to continuing harm, the immediate safety question and who has authority to act. Identify the conflicted
      ordinary route and the supplied independent alternative.

      2. Specify a bounded intake, support contact, privacy explanation and update point. For H preserve
      Ivo''s refusal of direct contact. For F preserve the original record history rather than quietly
      deleting the duplicate-looking line.

      3. Assign investigation and lawful evidence preservation to competent authorized people. List unresolved
      reporting-duty questions for qualified review. Do not decide legal guilt, discipline, mandatory
      reporting exemptions or retention periods yourself.

      4. Separate interim measures from final consequences. Define how the respondent can be heard by
      an impartial process and how affected people can report retaliation or a failed protective measure.
      A no-retaliation policy is a commitment requiring follow-through, not proof of safety.

      5. For each possible supported finding, propose a proportionate remedy and a structural change.
      H may expose a reporting inbox controlled by the person reported; F may expose weak duplicate detection
      and edit history. Assign owners, an authorized review date and evidence that could show whether
      a repair works.

      6. Draft a limited communication: what process is underway, what people can do and when the next
      update is expected. Do not publish identities or reassure the public that everything is resolved.
      Save both maps before the [later packet](?resource=file-later-packet-md).


      Repair should be assessed by affected people''s practical protection, correction of supported failures
      and reduced opportunity for recurrence. A lower complaint count alone is ambiguous: it might reflect
      improvement, discouragement or an inaccessible channel. Ask whether reports can reach an independent
      receiver, interim measures remain usable and corrections survive leadership changes. Do not require
      a complainant to validate the institution''s success narrative.


      ### Supported and actual routes


      For support, complete H using the worked response and then generate F independently. A harder pass
      makes Uma implicated; use A7''s alternate oversight route and record any authority or resourcing
      gap. Do not turn the exercise into a simulated interrogation. Optional actual transfer is an authorized
      review of a blank response policy for conflicting roles and missing follow-up, without accessing
      case files. Real abuse concerns require appropriate professional and urgent support. A polished
      plan, one finding or a revised inbox does not prove that harm has ended.


      ### Use the result at its proper scale


      Practical safeguards do not add canonical metadata.  A leadership role is not compulsory. Use actual
      authority and willing participation; keep protected records private. Fiction and no attempt are
      legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A complainant refuses mediation with the person reported. Can an institution require it before
      offering protection?

      2. Two 80-unit ledger entries share a receipt, but review confirms only one payment. What is established?

      3. A new reporting inbox receives fewer complaints. Is institutional repair demonstrated?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Do not make confrontation or mediation a precondition for appropriate protection and intake.
      Use the applicable independent process, explain options and privacy limits, assess immediate needs
      and preserve fair investigation.

      2. A duplicate entry and one 80-unit payment, not a second payment or deliberate fraud. Correct
      with an audit trail and leave intent or interference to qualified authorized review.

      3. No. Fewer reports can have several explanations, including access barriers or fear. Examine independent
      access, response quality, affected people’s protection and later control operation without forcing
      participants to supply favorable feedback.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
