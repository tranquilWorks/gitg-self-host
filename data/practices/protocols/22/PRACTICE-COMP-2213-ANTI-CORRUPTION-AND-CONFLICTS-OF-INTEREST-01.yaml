  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Changed availability and a bounded result


      Noor''s saved recommendation marks Cedar ineligible for late delivery and selects **Alder at 170**
      from the eligible bids. Lee''s corrected disclosure and recusal are recorded; the voucher is declined.
      Rae acknowledges the referral but has made no finding about intent, misconduct or sanction.


      Pat becomes unavailable before approval. Sam offers to “sign quickly”; the council has not appointed
      Sam as replacement under P6, and the earlier proposal to disguise the gift remains referred. The
      order stays **pending**. In this packet there is **no approval, purchase, delivery or payment**.


      Compare your first record with the changed availability. A recommendation that selects the right
      price but invents approval still fails the control. Record the unfilled approval role, ask the council
      through its authorized route to appoint an eligible replacement, and state the deadline risk. Do
      not claim the event received its cards.


      Keep the distinction between observed controls and outcomes: disclosure corrected, recusal applied,
      eligible bids compared and referral acknowledged are supplied events. Prevention of corruption,
      a legal violation and durable compliance are not established. On a fresh attempt, test whether your
      record still pauses when the person who can authorize the next step is missing.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Build a procurement decision that remains reviewable when a personal relationship and a gift
      offer enter the process. Allow twenty minutes for the case and ten for its later record. The intended
      product is a conflict disposition with usable controls, not a declaration that someone is corrupt.


      ### Notice the interest before deciding the outcome


      A conflict exists when another interest can pull a person away from their assigned duty. A relationship
      can create a conflict even when the person expects to act fairly. Disclosure makes the interest
      visible; it does not by itself decide whether participation is permissible. Recusal removes a person
      from a particular decision, while an independent review checks whether the replacement process actually
      applied the agreed criteria.


      Distinguish mechanisms. Favoritism gives a preferred person an advantage unrelated to the task.
      Self-dealing uses entrusted authority for one''s own benefit. A personal reward tied to an award
      raises a bribery concern, but recognizing that concern is not a legal verdict. Procurement abuse
      can include hiding a bid, changing specifications to favor one supplier or splitting a purchase
      to evade a control. An undisclosed interest can compromise review without any completed payment.
      Repeatedly calling small deviations harmless can normalize a process that nobody can later defend.


      The Charity Commission''s [conflict guidance, S01](https://www.gov.uk/government/publications/identifying-and-managing-conflicts-of-interest-in-a-charity-cc29/conflicts-of-interest-a-guide-for-charity-trustees)
      supports identifying, managing and recording conflicts. It governs charity trustees in England and
      Wales. The procurement card below is original fiction; it does not import that jurisdiction''s authorization
      or quorum rules into another organization.


      ### Supplied procurement file P6


      The fictional River Workshop needs **200 identical instruction cards by Friday**. No purchase has
      occurred. Its preapproved P6 rule says: select the lowest total price among bids meeting quantity,
      legibility and Friday delivery; retain all bids; disclose relevant relationships and gifts; exclude
      conflicted people from scoring and approval; keep request, approval and delivery verification with
      different people. A personal gift connected to selection must be declined and recorded for the designated
      review steward. Only the council can authorize an exception before commitment. Urgency creates no
      automatic exception.


      | Bid | Total delivered price | Required quantity and legibility | Delivery |

      | --- | --- | --- | --- |

      | Birch | 180 | Meets both | Thursday |

      | Alder | 170 | Meets both | Friday |

      | Cedar | 160 | Meets both | Monday after the event |


      Requester **Lee** normally also recommends a supplier. Lee''s sibling owns Birch; this relationship
      was omitted from the first request. Birch''s message offers Lee a **20-unit personal voucher if
      Birch receives the order**. The message is supplied fiction, already in the authorized procurement
      file. Do not seek further messages or arrange a test payment. **Sam**, who normally approves other
      purchases, says, “It is a small job; family businesses deserve a chance. Mark the gift as a discount.”
      The voucher is personal, not a price reduction to the workshop.


      Independent reviewer **Noor** has accepted the council''s appointment to score this purchase and
      has declared no relevant interest. Approver **Pat** and delivery verifier **Eli** have separately
      accepted their roles, with no declared conflicts. Council steward **Rae** handles potential rule
      breaches. These appointments are facts of the case, not authority granted by your worksheet. P6
      provides a pending status if an eligible approver is unavailable.


      ### Worked distinction: a cheap bid can still be ineligible


      An unrelated example has a 90-unit quote arriving after a required date and a 95-unit quote arriving
      on time. The late quote fails a stated threshold; the five-unit saving does not change that threshold.
      Record the disqualification reason before ranking eligible prices. Similarly, a relationship does
      not automatically make a supplier''s work poor, but the interested requester cannot cure the conflict
      by promising to be impartial. Supplier eligibility and decision-maker eligibility are separate questions.


      For P6, remove Lee from recommendation and approval, preserve the original omission and corrected
      disclosure, and record the gift refusal. Do not silently edit the history to look clean. Route the
      offer and Sam''s proposed misclassification to Rae without asserting criminal intent. Noor can then
      compare eligible bids using the existing card. Cedar''s date matters even though its price is lowest.
      Pat''s independent approval is a separate step from Noor''s recommendation; Eli later verifies delivered
      quantity and legibility before any authorized payment process.


      ### Produce an inspectable control record


      1. Make a five-column register: observed fact, possible mechanism, affected duty, uncertainty and
      assigned response. Include the omitted family interest, contingent voucher, proposed relabeling
      and late bid. Mark motives and legal conclusions unknown.

      2. Write the disclosure and recusal disposition, naming which tasks Lee may still perform. Lee may
      clarify the requested quantity through the shared record but may not privately influence scoring.
      Name Noor, Pat, Eli and Rae with their distinct authority.

      3. Apply P6 to all three bids. Show each eligibility decision, then the lowest eligible price. Draft
      a recommendation with the gift excluded from organizational cost. Keep approval and purchase as
      pending until their own evidence exists.

      4. Answer Sam in two sentences: identify the rule and explain the next authorized route. Avoid accusing
      Sam publicly or accepting an undocumented exception. If genuine urgency remains, put the options
      and consequences before the council.

      5. Define the audit trace: original bids, disclosure, recusal, criteria, recommendation, approval
      and delivery check. Restrict access appropriately. Save your first record before opening the [later
      packet](?resource=file-later-packet-md).


      The audit is useful because another authorized person can reconstruct the choice, not because the
      file is large. Collect only what the decision and responsible review require. A minor omission may
      warrant correction; suspected serious misconduct requires the applicable qualified process. Enforcement
      must follow actual authority and fair procedure. A learner does not impose penalties or conduct
      an investigation.


      ### Adjust the difficulty without manufacturing misconduct


      For support, use one row per supplied fact and highlight eligibility before price. A helper may
      explain the difference between a personal voucher and a supplier discount; record that help. For
      a harder pass, make Pat unavailable and ask whether the case can proceed under P6. The answer needs
      an authorized replacement or a pending decision, not Lee''s return to approval.


      For optional actual transfer, review a low-stakes policy or blank procurement template you are entitled
      to see. Identify one missing separation of duties and propose a question to its owner. Do not create
      a conflict, solicit a gift, upload vendor records or contact a suspected wrongdoer. Evidence could
      be an authorized, redacted disposition and a later control check. One well-written plan does not
      establish that corruption was prevented.


      ### Use the result at its proper scale


      Practical safeguards do not add canonical metadata.  A leadership role is not compulsory. Use actual
      authority and willing participation; keep protected records private. Fiction and no attempt are
      legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A trustee discloses a spouse’s bid and then casts the deciding vote. Has disclosure resolved
      the conflict?

      2. Two eligible bids cost 220 and 215. The 220 bidder privately offers the selector a 15 voucher.
      Is its organizational cost 205?

      3. An independent reviewer recommends a supplier, but the sole authorized approver is absent. What
      is defensible?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Not by itself. The applicable governing rules and authorized conflict disposition determine
      participation. Preserve disclosure and check recusal, independent decision-making and valid authority;
      do not infer that disclosure licenses the vote.

      2. No. The personal voucher is not a discount to the organization. Record and handle the contingent
      benefit under the applicable process; compare organizational totals separately. Recognition of a
      bribery concern is not a criminal finding.

      3. Keep the commitment pending or obtain an authorized eligible replacement using the governing
      process. A deadline does not silently confer approval powers. Record the unresolved dependency and
      consequences without inventing a purchase.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
