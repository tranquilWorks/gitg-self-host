meaning_and_fit:
  purpose: Recognize bribery, favoritism, self-dealing and undisclosed interests, then apply proportionate
    disclosure, recusal, separated duties and review to a fictional or authorized decision.
  why_recommended: Recognize bribery, favoritism, self-dealing and undisclosed interests, then apply proportionate
    disclosure, recusal, separated duties and review to a fictional or authorized decision.
  claims:
  - statement: Recognize bribery, favoritism, self-dealing and undisclosed interests, then apply proportionate
      disclosure, recusal, separated duties and review to a fictional or authorized decision.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Anti-corruption and conflicts of interest practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Anti-corruption and conflicts of interest as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a fictional purchase with no money exchanged. Actual public procurement,
    employment, nonprofit and commercial rules differ; obtain qualified guidance. Do not upload private
    interests, bids or allegations into application evidence.
  opportunity_considerations: Use a fictional group choosing a printing supplier. One decision-maker’s
    relative owns a bidder, another bidder offers a personal gift and the usual approver says small exceptions
    are how things get done. Prepare a record of criteria, interests, gifts, decision roles, approvals,
    review and escalation.
  prerequisites:
  - Use a fictional group choosing a printing supplier. One decision-maker’s relative owns a bidder, another
    bidder offers a personal gift and the usual approver says small exceptions are how things get done.
    Prepare a record of criteria, interests, gifts, decision roles, approvals, review and escalation.
  dependencies: []
  safe_alternatives:
  - Use a fictional purchase with no money exchanged. Actual public procurement, employment, nonprofit
    and commercial rules differ; obtain qualified guidance. Do not upload private interests, bids or allegations
    into application evidence.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Anti-corruption and conflicts of interest differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Anti-corruption and conflicts
    of interest as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional group choosing a printing supplier. One decision-maker’s relative owns a bidder,
    another bidder offers a personal gift and the usual approver says small exceptions are how things
    get done. Prepare a record of criteria, interests, gifts, decision roles, approvals, review and escalation.
    Goal: Recognize bribery, favoritism, self-dealing and undisclosed interests, then apply proportionate
    disclosure, recusal, separated duties and review to a fictional or authorized decision. Scope: This
    is governance education, not a corruption finding, legal procurement advice or permission to conduct
    an investigation. Real decisions follow applicable law and institutional policy. Time and effort:
    Twenty minutes to analyze the case, one 20-minute control design and a 10-minute exception test. Adaptation:
    Use a fictional purchase with no money exchanged. Actual public procurement, employment, nonprofit
    and commercial rules differ; obtain qualified guidance. Do not upload private interests, bids or allegations
    into application evidence. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional purchase with no money exchanged. Actual public procurement, employment,
    nonprofit and commercial rules differ; obtain qualified guidance. Do not upload private interests,
    bids or allegations into application evidence.
  expected_burden: Twenty minutes to analyze the case, one 20-minute control design and a 10-minute exception
    test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Anti-corruption and conflicts of interest protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Anti-corruption and conflicts of interest action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    purchase with no money exchanged. Actual public procurement, employment, nonprofit and commercial
    rules differ; obtain qualified guidance. Do not upload private interests, bids or allegations into
    application evidence.
  actions:
  - stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01-A1
    sequence: 1
    title: Identify the conflict without treating disclosure as a cure
    instructions: 'Separate the legitimate purchasing need from each private interest or benefit. Identify
      possible favoritism, self-dealing, gift influence and the normalization of bypassed rules, while
      keeping an allegation distinct from an established fact. Read the applicable conflict and procurement
      policy or use the fictional policy requiring disclosure and independent decision review. State why
      merely announcing the relationship does not by itself make participation in the selection appropriate.


      Observation checks: Purchasing need and private interests are separated; Gift influence favoritism
      and normalized exceptions are identified; Concern and established misconduct are distinguished;
      Disclosure is not treated as automatically resolving the conflict. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01
      action_stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01-A1
      competency_stable_id: '22.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2213_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2213_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - purchasing_need_and_private_interests_are_separated
        - gift_influence_favoritism_and_normalized_exceptions_are_identified
        - concern_and_established_misconduct_are_distinguished
        - disclosure_is_not_treated_as_automatically_resolving_the_conflict
      - measurement_id: c2213_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2213_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01-A2
    sequence: 2
    title: Assign proportionate controls and independent responsibility
    instructions: 'For the fictional case, disclose the relevant interest to the designated authority,
      remove the conflicted person from the affected decision under the policy and have a separate authorized
      person compare bids against predeclared criteria. Separate requesting, approving and verifying delivery
      where feasible. Define what record an independent reviewer needs without exposing unnecessary personal
      information. Real recusal, gift handling and enforcement must use the governing process rather than
      a homemade legal rule.


      Observation checks: Conflicts receive an authorized management disposition; Bid criteria are declared
      before selection; Key duties and review are appropriately separated; Records protect privacy while
      enabling independent scrutiny. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01
      action_stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01-A2
      competency_stable_id: '22.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2213_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2213_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - conflicts_receive_an_authorized_management_disposition
        - bid_criteria_are_declared_before_selection
        - key_duties_and_review_are_appropriately_separated
        - records_protect_privacy_while_enabling_independent_scrutiny
      - measurement_id: c2213_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2213_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01-A3
    sequence: 3
    title: Test the small-exception pressure and retain an audit trail
    instructions: 'Rehearse the response to a request to skip the comparison because the amount is small
      or the supplier is a friend. State the legitimate expedited process, if the policy provides one,
      or pause and seek the proper decision rather than inventing an exception. Check that the record
      shows who decided, on what criteria and how concerns can be escalated. Do not conduct a sting, offer
      a real gift or make a public accusation for the exercise.


      Observation checks: Pressure to normalize a small violation is tested; Any expedited route is authorized
      rather than invented; The decision and review trail remain inspectable; No sting gift or public
      accusation is staged. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Which control changed who could influence the decision, and could an independent person
      later distinguish a legitimate choice from an undisclosed favor?


      Examples: Supportive: The conflicted member stepped aside under the policy, independent criteria
      guided selection and the gift concern reached the designated authority.


      Mixed: The relationship was disclosed but influence continued informally; the control design was
      revised to address the actual decision role.


      Contradictory: Disclosure was used as permission for self-dealing or small rule violations were
      excused because everyone knows each other.


      Inconclusive: Corruption was condemned without a conflict disposition, separated role or reviewable
      decision record.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01
      action_stable_id: PRACTICE-COMP-2213-ANTI-CORRUPTION-AND-CONFLICTS-OF-INTEREST-01-A3
