meaning_and_fit:
  purpose: Understand interests, coalitions, status and informal authority well enough to pursue a defensible
    objective through legitimate negotiation rather than manipulation or naïve assumptions.
  why_recommended: Understand interests, coalitions, status and informal authority well enough to pursue
    a defensible objective through legitimate negotiation rather than manipulation or naïve assumptions.
  claims:
  - statement: Understand interests, coalitions, status and informal authority well enough to pursue a
      defensible objective through legitimate negotiation rather than manipulation or naïve assumptions.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Organizational politics and stakeholder navigation
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Organizational politics and stakeholder navigation as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use accessible written consultation, a facilitator or the fictional case.
    Do not treat coworkers as targets to manipulate or disclose their private interests. Formal procurement,
    employment, political and legal decisions require their own governing processes.
  opportunity_considerations: Default to proposing an accessible time for a recurring group meeting. Stakeholders
    include the scheduler, participants, a room owner and an influential long-standing member. Prepare
    headings for legitimate interest, formal role, informal influence, constraint, possible agreement
    and non-negotiable principle.
  prerequisites:
  - Default to proposing an accessible time for a recurring group meeting. Stakeholders include the scheduler,
    participants, a room owner and an influential long-standing member. Prepare headings for legitimate
    interest, formal role, informal influence, constraint, possible agreement and non-negotiable principle.
  dependencies: []
  safe_alternatives:
  - Use accessible written consultation, a facilitator or the fictional case. Do not treat coworkers as
    targets to manipulate or disclose their private interests. Formal procurement, employment, political
    and legal decisions require their own governing processes.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Organizational politics and stakeholder navigation differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Organizational politics and
    stakeholder navigation as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to proposing an accessible time for a recurring group meeting. Stakeholders include
    the scheduler, participants, a room owner and an influential long-standing member. Prepare headings
    for legitimate interest, formal role, informal influence, constraint, possible agreement and non-negotiable
    principle. Goal: Understand interests, coalitions, status and informal authority well enough to pursue
    a defensible objective through legitimate negotiation rather than manipulation or naïve assumptions.
    Scope: Use a low-stakes authorized proposal or fictional organization. This is not permission for
    bribery, secret favors, deception, coercion or collecting private political profiles. Time and effort:
    Twenty minutes to map the decision, two short information conversations or rehearsals and a proposal
    revision. Adaptation: Use accessible written consultation, a facilitator or the fictional case. Do
    not treat coworkers as targets to manipulate or disclose their private interests. Formal procurement,
    employment, political and legal decisions require their own governing processes. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible written consultation, a facilitator or the fictional case. Do not
    treat coworkers as targets to manipulate or disclose their private interests. Formal procurement,
    employment, political and legal decisions require their own governing processes.
  expected_burden: Twenty minutes to map the decision, two short information conversations or rehearsals
    and a proposal revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Organizational politics and stakeholder navigation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Organizational politics and stakeholder navigation action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    written consultation, a facilitator or the fictional case. Do not treat coworkers as targets to manipulate
    or disclose their private interests. Formal procurement, employment, political and legal decisions
    require their own governing processes.
  actions:
  - stable_id: PRACTICE-COMP-2210-ORGANIZATIONAL-POLITICS-AND-STAKEHOLDER-NAVIGATION-01-A1
    sequence: 1
    title: Map interests and influence without mind-reading
    instructions: 'Identify who can approve the time, who can block room access and who others listen
      to even without a title. Ask or use supplied facts about their concerns, such as work schedules,
      continuity or setup burden. Mark an apparent coalition as a hypothesis unless participants confirm
      a shared position. Name the principle you will not trade, such as truthful communication and a fair
      access process, while recognizing that not every preference can be satisfied.


      Observation checks: Formal and informal authority are distinguished; Interests and constraints use
      evidence rather than assumed motives; Coalitions are not treated as secret plots without evidence;
      A defensible objective and non-negotiable principle are stated. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2210-ORGANIZATIONAL-POLITICS-AND-STAKEHOLDER-NAVIGATION-01
      action_stable_id: PRACTICE-COMP-2210-ORGANIZATIONAL-POLITICS-AND-STAKEHOLDER-NAVIGATION-01-A1
      competency_stable_id: '22.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
