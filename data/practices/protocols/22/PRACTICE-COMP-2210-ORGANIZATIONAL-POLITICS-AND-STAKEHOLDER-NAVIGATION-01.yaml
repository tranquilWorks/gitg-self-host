  - stable_id: PRACTICE-COMP-2210-ORGANIZATIONAL-POLITICS-AND-STAKEHOLDER-NAVIGATION-01-A2
    sequence: 2
    title: Seek context and build a transparent possible agreement
    instructions: 'Ask two relevant stakeholders what would make a change workable and what you may be
      missing. Summarize the overlap and the genuine conflict, then propose a limited option such as a
      trial alternate time with a review date. State who benefits, who bears inconvenience and how that
      burden could be reduced. Do not promise a private favor, conceal a material downside or tell different
      people incompatible stories to obtain support.


      Observation checks: Two perspectives inform the proposal or labeled rehearsal; Shared interests
      and real conflict are explicit; Benefits burdens and mitigation are transparent; No secret favor
      deception or incompatible promise is used. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
