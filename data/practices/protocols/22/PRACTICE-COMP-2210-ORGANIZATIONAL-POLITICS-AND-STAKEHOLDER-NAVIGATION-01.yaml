  - stable_id: PRACTICE-COMP-2210-ORGANIZATIONAL-POLITICS-AND-STAKEHOLDER-NAVIGATION-01-A3
    sequence: 3
    title: Present the proposal through the legitimate decision route
    instructions: 'Submit the bounded option to the person or body with authority, including unresolved
      concerns and the trial’s acceptance criteria. Record the decision and communicate it consistently
      to affected people. If declined, identify whether the reason changes your understanding or calls
      for a different authorized route, rather than retaliating against an influential person. Review
      whether trust and principles survived even if the objective was not achieved.


      Observation checks: The proposal uses the legitimate decision route; Unresolved concerns and trial
      criteria are included; The decision is communicated consistently; A refusal does not trigger retaliation
      or abandonment of principles. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Which interest or informal influence did you initially miss, and could you explain
      every promise you made openly to all affected people?


      Examples: Supportive: The proposer learned the setup constraint, offered a transparent trial and
      used the authorized scheduling decision route.


      Mixed: The objective was declined, but the explanation revealed a real constraint and no hidden
      promises damaged trust.


      Contradictory: The proposer traded private favors, misrepresented different stakeholders’ positions
      or retaliated against someone who opposed the change.


      Inconclusive: A stakeholder map was made without checking interests or presenting a defensible transparent
      proposal.'
