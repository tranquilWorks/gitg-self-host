  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Paz offers and accepts clearance from **18:10–18:20** on both trial dates. Nila accepts setup from
      **17:20–17:30**. Ellis confirms the room arrangement on that basis. Morgan says the workload concern
      is addressed but still prefers the earlier time; Morgan has not endorsed the trial and has not claimed
      a veto.


      Farah approves only the two-date trial, with the stated **2 December** review. Nila''s fictional
      final notice gives everyone the same dates, **17:30–18:10** session, accepted setup/clearance roles,
      temporary status and review. It does not claim majority support or permanent change. No personal
      favor is offered.


      There are exactly ten minutes between session finish and required clearance; there is no spare clearance
      margin in the plan. Attendance, actual completion of clearance, wider access and trust have not
      been measured. The proposal gained a bounded approval while one preference disagreement remains.
      Do not convert this into unanimous support, a coalition defeated or a successful completed trial.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Pursue an accessible meeting-time proposal by understanding interests, influence and the legitimate
      decision route. Spend twenty minutes on the stakeholder map and fifteen on the revised proposal.
      Politics here means how people and groups affect decisions in practice. Understanding that process
      does not authorize hidden favors, personal profiling, coercion or incompatible promises.


      ### Understand influence without inventing motives


      Begin with a defensible objective and a principle you will not trade. A proposal can seek broader
      participation while preserving truthful communication and a fair hearing for those burdened by the
      change. “Get my preferred time approved” is narrower and can tempt a proposer to hide costs. State
      what success would mean for affected people and which legitimate interests may still conflict.


      Formal roles identify who can approve, allocate a room or interpret a rule. Informal influence identifies
      whose judgment people seek, who remembers past failures and who can bring a credible concern into
      the discussion. Ignoring informal influence may make a formally correct proposal impractical. Treating
      influential people as obstacles to manipulate can destroy the trust needed to implement it.


      Separate a position from the underlying interest. “Keep the old time” might reflect setup burden,
      transport availability, continuity or simple preference. Ask instead of assigning a motive. Do not
      record private vulnerabilities as persuasion targets. Use relevant, volunteered information and
      distinguish confirmed constraints from your hypotheses. A coalition is a shared position or coordinated
      effort supported by evidence, not a secret plot inferred from two people knowing each other.


      Listen across the decision boundary. The person approving the schedule may not own the room, and
      the person supporting access may not be able to provide setup. A useful agreement combines actual
      accepted contributions. A promise to “find someone” leaves ownership unresolved. Test whether your
      proposal still works when a key supporter cannot supply what you hoped.


      Negotiation can reveal compatible interests without satisfying every preference. A limited trial,
      alternate arrangement or transparent review can make a reversible proposal more workable. State
      who benefits, who bears inconvenience, who mitigates it and what the trial will evaluate. Do not
      call a burden small merely because it falls on someone else. Consent to a trial is also not proof
      that the longer-term change will succeed.


      Preserve one consistent account. You may emphasize different relevant details for different audiences,
      but the material terms must match. Do not promise the scheduler permanence while promising opponents
      an automatic reversion unless both are part of the same agreed rule. Reject secret favors, misleading
      claims of majority support and public attribution without permission. A proposal you could explain
      openly to affected people is easier to defend.


      Use the authorized route and retain refusal as a possible result. If the decision is declined, inspect
      the reason: a real constraint may suggest another option or a later review. Do not retaliate against
      a dissenter or declare corruption merely because influence affected the discussion. Likewise, official
      approval does not erase unfair means used to obtain it. Assess both the objective achieved and whether
      trust and principles were preserved.


      ### Worked example


      A proposer assumes a longstanding member opposes a later meeting to protect status. A conversation
      reveals that the member supplies setup and cannot stay later. The member is not a scheduling authority,
      but their work is a real dependency. Finding an accepted alternate setup owner could change the
      proposal; promising an unconfirmed helper would merely hide the same constraint.


      ### Complete fictional stakeholder packet


      The Cedar Map group currently meets **17:00–17:40 UTC**. Proposer Nila seeks a **17:30–18:10** trial
      for two meetings so members whose stated work schedules end at 17:00 can participate. This is a
      participation objective, not a claim that every member prefers the change. Scheduling chair Farah
      has approval authority. Room steward Ellis controls room availability and confirms the room must
      be clear by **18:20**. Setup and clearance each require **10 minutes** of accepted volunteer work.


      Morgan is a longstanding member whose practical judgment others often seek. Morgan currently sets
      up and clears but says, “I must leave by 18:00; I cannot clear at 18:10.” Morgan has no veto under
      the supplied rules. Members Paz and Rui confirm that 17:30 would help them attend. Their views do
      not establish the views of the whole group. Nila initially writes “Morgan and Ellis are blocking
      us together”; no evidence of a shared position is supplied.


      Two consultation records are provided for your map: Ellis says the proposed finish leaves exactly
      ten minutes to clear, so a named clearance owner is essential; Morgan says the concern is workload
      and departure time, and that another accepted owner would address it. Farah asks for one consistent
      written proposal with dates **24 November and 1 December 2026**, trial limits, burden, unresolved
      concerns and review on **2 December**. Attendance, setup reliability and reported access difficulties
      would be reviewed; the supplied case includes no actual observations of them.


      Nila can offer to own setup at 17:20 but has not yet found a clearance owner. The initial trial
      is therefore a proposal with an unresolved dependency. No private contact data, political preference
      or personal circumstance beyond the relevant supplied constraints is needed.


      ### Navigate toward a defensible decision


      1. Map formal powers, informal influence, evidenced interests and unknowns. Replace the unsupported
      coalition claim. Output: an accurate map and a non-negotiable principle of truthful terms and fair
      access.

      2. Use Ellis and Morgan''s accounts to revise the proposal. Calculate timing and state who benefits
      and who bears work. Output: two-date trial with an explicitly unresolved clearance dependency.

      3. Save before the [later packet](?resource=file-later-packet-md). Incorporate the accepted or declined
      contributions and Farah''s decision. Output: one final account all affected people could see, with
      no incompatible promises.

      4. Review objective and process separately. Output: approval status, work commitments, remaining
      disagreement and a truthful limit on participation or trust claims.


      ### Support and harder routes


      A written consultation, interpreter or neutral facilitator can support participation without making
      public speaking a requirement. A harder case has no willing clearance owner: keep the original proposal
      unready, alter scope through authority or accept refusal. Do not claim nonexistent resources to
      secure approval. Actual procurement, employment, public-policy or political decisions have their
      own rules; this harmless scheduling fiction does not substitute for them.


      ### Source use


      [GovS 002, S03](https://projectdelivery.gov.uk/library-products/government-functional-standard-govs-002-project-delivery/),
      supports understanding stakeholder interests and updating engagement as facts change. The original
      case extends that narrow principle to transparent negotiation. It supplies no technique for covert
      influence and no promise that consultation produces consensus.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


