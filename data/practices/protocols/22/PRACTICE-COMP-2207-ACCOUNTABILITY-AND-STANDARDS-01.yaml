meaning_and_fit:
  purpose: Set a purpose-linked expectation, observe actual performance, recognize what worked and address
    a specific shortfall through a humane accountable next step.
  why_recommended: Set a purpose-linked expectation, observe actual performance, recognize what worked
    and address a specific shortfall through a humane accountable next step.
  claims:
  - statement: Set a purpose-linked expectation, observe actual performance, recognize what worked and
      address a specific shortfall through a humane accountable next step.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Accountability and standards practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Accountability and standards as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible written exchange, a facilitated peer review or a fictional
    rehearsal. Employment, disability, safety and disciplinary matters may require qualified organizational
    guidance. Humane accountability does not mean ignoring harm, and firmness does not justify humiliation.
  opportunity_considerations: Default to an event notice delivered with an incorrect time after the correct
    source had been agreed. Prepare fields for expectation, observed result, impact, the person’s explanation,
    support or system issue, correction, owner and follow-up. Do not use a real sensitive performance
    record in application evidence.
  prerequisites:
  - Default to an event notice delivered with an incorrect time after the correct source had been agreed.
    Prepare fields for expectation, observed result, impact, the person’s explanation, support or system
    issue, correction, owner and follow-up. Do not use a real sensitive performance record in application
    evidence.
  dependencies: []
  safe_alternatives:
  - Use an accessible written exchange, a facilitated peer review or a fictional rehearsal. Employment,
    disability, safety and disciplinary matters may require qualified organizational guidance. Humane
    accountability does not mean ignoring harm, and firmness does not justify humiliation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Accountability and standards differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Accountability and standards
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to an event notice delivered with an incorrect time after the correct source had been
    agreed. Prepare fields for expectation, observed result, impact, the person’s explanation, support
    or system issue, correction, owner and follow-up. Do not use a real sensitive performance record in
    application evidence. Goal: Set a purpose-linked expectation, observe actual performance, recognize
    what worked and address a specific shortfall through a humane accountable next step. Scope: Use a
    low-stakes agreed responsibility within your authority or a fictional case. This is not an employment
    disciplinary decision, legal finding or license to shame someone. Time and effort: Fifteen minutes
    to clarify the standard, one short review conversation and a later check on the agreed correction.
    Adaptation: Use an accessible written exchange, a facilitated peer review or a fictional rehearsal.
    Employment, disability, safety and disciplinary matters may require qualified organizational guidance.
    Humane accountability does not mean ignoring harm, and firmness does not justify humiliation. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written exchange, a facilitated peer review or a fictional rehearsal.
    Employment, disability, safety and disciplinary matters may require qualified organizational guidance.
    Humane accountability does not mean ignoring harm, and firmness does not justify humiliation.
  expected_burden: Fifteen minutes to clarify the standard, one short review conversation and a later
    check on the agreed correction.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Accountability and standards protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Accountability and standards action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written exchange, a facilitated peer review or a fictional rehearsal. Employment, disability, safety
    and disciplinary matters may require qualified organizational guidance. Humane accountability does
    not mean ignoring harm, and firmness does not justify humiliation.
  actions:
  - stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01-A1
    sequence: 1
    title: Check whether the expectation was actually clear and fair
    instructions: 'Compare the agreed source, due time and accuracy requirement with the delivered notice.
      Identify the specific mismatch and practical impact without using always, never or character labels.
      Ask whether the standard and resources were communicated in advance and whether you apply the same
      standard to yourself and others. If your instruction was ambiguous or an input changed, own that
      contribution before attributing the whole shortfall to the person.


      Observation checks: The standard and observed mismatch are specific; Impact is described without
      character judgment; Prior clarity resources and consistent application are checked; The leader’s
      or system’s contribution is acknowledged. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01
      action_stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01-A1
      competency_stable_id: '22.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2207_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2207_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_standard_and_observed_mismatch_are_specific
        - impact_is_described_without_character_judgment
        - prior_clarity_resources_and_consistent_application_are_checked
        - the_leader_s_or_system_s_contribution_is_acknowledged
      - measurement_id: c2207_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2207_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01-A2
    sequence: 2
    title: Discuss the gap and agree a proportionate correction
    instructions: 'State what was done well and the factual shortfall, then ask for the person’s account
      before choosing a response. Distinguish lack of information, skill, capacity, unclear authority
      and an unfulfilled commitment without pretending you can infer motive. Agree a concrete correction,
      such as issuing the right time and adding a source check, with necessary support and an owner. Any
      formal consequence must follow the authorized process, not an improvised threat.


      Observation checks: Success and shortfall are both recognized accurately; The person can explain
      relevant context; A specific correction and support are agreed; Formal consequences are not invented
      outside authority. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01
      action_stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01-A2
      competency_stable_id: '22.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2207_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2207_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - success_and_shortfall_are_both_recognized_accurately
        - the_person_can_explain_relevant_context
        - a_specific_correction_and_support_are_agreed
        - formal_consequences_are_not_invented_outside_authority
      - measurement_id: c2207_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2207_a2_adverse
        kind: boolean
