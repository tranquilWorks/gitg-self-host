        expected: true
  - stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01-A3
    sequence: 3
    title: Follow through and check consistency at the next opportunity
    instructions: 'At the agreed time, verify the correction and communicate its status to affected people.
      On the next comparable notice, check whether the source-verification step occurred and whether the
      same standard was applied consistently. Recognize improvement without declaring the issue permanently
      solved, or use the proper process if a material gap remains. Do not let a pleasant conversation
      replace correction, and do not keep moving the standard after it is met.


      Observation checks: The promised correction is verified; A later comparable opportunity checks the
      change; Improvement or remaining shortfall is reported honestly; The standard is not moved or selectively
      applied. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Was the standard clear, consistent and connected to purpose, and what actual follow-through
      distinguishes this from either avoidance or punishment?


      Examples: Supportive: The leader acknowledged an unclear handoff, the notice was corrected and the
      next source check was completed under the same standard.


      Mixed: The conversation was respectful but the correction was late; the follow-up kept that gap
      visible and assigned a clear next owner.


      Contradictory: The leader used humiliation, invented a disciplinary threat or changed the standard
      after the person met it.


      Inconclusive: A shortfall was discussed without a specific correction, owner or later verification.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01
      action_stable_id: PRACTICE-COMP-2207-ACCOUNTABILITY-AND-STANDARDS-01-A3
