    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A manager changed the source without removing the old current label. Does identifying that contribution
      remove the need to correct the worker''s draft?

      2. The draft was timely and clearly written but had the wrong approved time. How should recognition
      and correction be expressed?

      3. A corrected draft is accepted and one later notice passes. What remains unproven?'
    check_id: practice-answers
    attempt_mode: practice
