  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Ezra says, “I used the card still marked current. I saw a second sheet but had no confirmation it
      replaced N1.” Lian acknowledges the conflicting labels and missing notification. Ezra accepts the
      draft correction; Lian accepts source-status repair. Neither assigns a motive or a formal penalty.


      At **12:15**, Lian marks N1 SUPERSEDED, N2 CURRENT and tells Ezra which applies. Ezra returns the
      corrected **17:30–18:00** draft, with source N2, at **12:40**. Lian checks and accepts at **12:50**,
      ten minutes before the correction checkpoint. It remains an unsent draft; no affected attendee is
      known because distribution never occurred.


      On the N3 task Ezra produces: “Line Sketch, 16 November 2026, 18:00–18:30 UTC, Cedar Center, Elm
      Room. Questions: Line Desk. Source checked: N3, current label verified.” Lian checks all facts and
      the source step. Lian applies the same check to their own cover note and corrects its initial Elm/Oak
      typo before approval. One successful follow-up supports specific recognition, not a claim that recurrence
      is impossible or that the prior error did not matter.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Address an incorrect notice with a clear standard, a fair inquiry and a verified correction.
      Allow fifteen minutes to review the supplied record and fifteen for follow-through. This is a fictional
      performance conversation, not a personnel assessment or disciplinary process. Its purpose is to
      protect a useful outcome while treating people consistently and humanely.


      ### Establish what was expected before judging the shortfall


      A standard explains what successful work requires and why. “Be more careful” offers no shared test.
      “Use the approved time, identify its source and deliver the draft by noon” creates inspectable expectations.
      Check that the person received those expectations, had access to the source and had enough authority
      and capacity to act. A standard invented after the work cannot fairly be described as an earlier
      commitment.


      Observe the result before explaining it. Compare the actual artifact with the applicable source
      and time. Name the practical effect, such as a reader being directed to arrive thirty minutes early,
      without claiming that this already happened. Avoid always/never language and character labels. The
      same mismatch can arise from missing information, a skill gap, an unclear version, excessive workload
      or an unfulfilled commitment. The artifact alone rarely establishes motive.


      Ask for the person''s account and inspect it against records. Listening does not require accepting
      every explanation, and a shortfall does not license dismissing context. If you caused ambiguity
      or changed the source without notice, own that contribution. Shared responsibility does not mean
      that nobody corrects the work. Split the repair so each owner can actually perform their part.


      Recognize what was done well accurately. Timely delivery or clear formatting can be worth retaining
      even when the time is wrong. Do not use praise to obscure the essential defect or as a formula that
      makes the correction hard to understand. Say which criterion was met, which was missed, and why
      the missed one matters. A person''s worth does not rise or fall with the notice.


      Agree a concrete correction, support and checkpoint. “Try harder next time” lacks a present remedy.
      Identify the version to correct, the responsible person, the source to use and who must confirm
      the result. If a deadline becomes impossible, use an authorized revision while preserving the unmet
      commitment. Formal consequences require the actual governing process; a rehearsal does not justify
      improvised threats, withheld pay or public shaming.


      Follow through at the promised time. Check the repaired artifact and whether affected readers need
      an update. A pleasant conversation does not repair a published error. In a draft-only case, do not
      claim an external correction was sent. On the next comparable task, check whether the agreed source-verification
      step was used; a correct result without a record may leave the process question unresolved.


      Consistency is not rigidity. Keep legitimate outcomes stable while adjusting support or inaccessible
      methods. Apply the same relevant accuracy standard to the leader''s work, too. Do not move the target
      after it is met to preserve authority, and do not declare the problem permanently solved after one
      improvement. A repeated material shortfall may need an authorized process or different work arrangement,
      not increasingly personal accusations.


      ### Worked example


      A lead sees a wrong start time and prepares to accuse the writer of ignoring instructions. The record
      shows that the lead uploaded a new source but left the old file marked current. The writer still
      needs to repair the notice, while the lead must repair source status and notification. Assigning
      the whole failure to one person would leave the system cause ready to recur.


      ### Complete fictional notice record


      On **10 November 2026**, Lian asks Ezra to draft the Table Sketch notice by **12:00 UTC**. The agreed
      requirements are: event **Table Sketch**; **15 November 2026**; the current approved start/end time;
      **Cedar Center, Oak Room**; questions to **Sketch Desk**; plain text; record the checked source
      version. No public distribution is authorized until Lian accepts the draft.


      At **09:00**, source **N1** is marked current with **17:00–17:30 UTC**. At **10:30**, Lian approves
      **N2**, changing only the time to **17:30–18:00**. Lian places N2 on the shared paper board but
      leaves N1''s “CURRENT” label and does not tell Ezra. Ezra delivers at **11:50**: “Table Sketch,
      15 November 2026, 17:00–17:30 UTC, Cedar Center, Oak Room. Questions: Sketch Desk. Source checked:
      N1.” Ezra has recorded the source used, met the draft deadline and preserved other facts, but the
      draft contains the superseded time.


      Lian sees the discrepancy at **12:00**. Neither document has been sent to attendees. A useful conversation
      should separate the inaccurate result from Ezra''s motive and Lian''s source-control contribution.
      The correction checkpoint is **13:00**. Lian has authority to mark source status and approve the
      notice; Ezra can change draft wording but cannot approve an event time independently.


      A fresh comparable task **N3**, supplied for the next-day review, concerns Line Sketch on **16 November**,
      **18:00–18:30 UTC**, **Cedar Center, Elm Room**, contact **Line Desk**. N3 is the sole document
      marked current, approved by Lian at **09:00 on 11 November**. The same notice/source-check requirements
      apply.


      ### Inquire, repair and verify


      1. Compare expectation, inputs and actual draft. Identify met criteria, mismatch and possible reader
      impact. Output: a factual opening without a motive verdict.

      2. Ask Ezra which source was used and what was unclear. Plan Lian''s own repair alongside Ezra''s.
      Save before the [later packet](?resource=file-later-packet-md). Output: correction owners, support,
      deadline and no improvised consequence.

      3. Inspect the corrected source labels and notice at the checkpoint. Output: exact repaired version,
      acceptance and distribution status, including any remaining gap.

      4. Check N3''s fresh attempt against the same criteria and source-verification step. Output: specific
      recognition, a continued support decision and the limit on recurrence claims.


      ### Accessible and harder routes


      Use two side-by-side cards, a read-aloud comparison or neutral facilitator to reduce incidental
      burden. A harder branch repeats an error despite unambiguous inputs: ask for the new account, preserve
      evidence and use the authorized process instead of escalating personal blame. Real sensitive performance
      records do not belong in app evidence. Adjust support responsibly without quietly changing essential
      outcomes or claiming legal/HR authority you do not hold.


      ### Source use


      [OPM Developing Performance Standards, S05](https://www.opm.gov/policy-data-oversight/performance-management/reference-materials/articles/developing-performance-standards/),
      supports clear, realistic and verifiable expectations and relevant measures. The federal appraisal
      rules are not imported. The fictional conversation and correction process are original, not employment
      advice or a validated management intervention.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
