  - id: practice-answers
    title: Compare your responses
    body: '1. No. Separate responsibilities: repair source status and notification, and correct the draft.
      Understanding context should make the remedy fair and executable.

      2. Recognize the criteria actually met and name the accuracy shortfall and practical effect plainly.
      Do not hide the error with praise or turn it into a character judgment.

      3. The draft was never sent, so recipient effects were not observed. Durable process reliability
      and absence of future recurrence also remain unproven. Keep the standard stable and continue proportionate
      follow-through.'
    criteria:
