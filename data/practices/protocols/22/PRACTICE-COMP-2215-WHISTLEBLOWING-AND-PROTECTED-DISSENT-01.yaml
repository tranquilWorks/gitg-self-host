  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Whistleblowing and protected dissent explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Whistleblowing and protected dissent context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Whistleblowing and protected dissent observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Whistleblowing and protected dissent rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate evidence, concern and immediate protective duty. Observed checks:
    Direct observation inference and unknowns are separated; Severity and immediate safety needs are identified;
    Disagreement error misconduct and retaliation are distinguished; Evidence handling remains lawful
    authorized and privacy-protecting. Action 2: Verify reporting channels, coverage and confidentiality
    limits. Observed checks: Internal and independent routes are compared for the actual issue; Coverage
    deadlines and practical retaliation risks are checked; Confidentiality and anonymity are not overpromised;
    Restricted material is not sent through an unauthorized portal. Action 3: Write a minimal inquiry
    and an accountable next-step plan. Observed checks: The inquiry is minimal and factual; Next owner
    timing support and conflict alternatives are explicit; Affected people and due process are protected;
    No unauthorized disclosure or amateur investigation is performed.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Whistleblowing was praised as courage without evidence
    distinctions, coverage checks or a lawful escalation path.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
