  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Whistleblowing and protected dissent; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use the fictional case and accessible official guidance. Actual concerns may need an attorney, inspector
      general, regulator, safety authority or other specifically authorized route; availability and protection
      vary. Current danger or a legal deadline should not wait for this practice to finish.
    cultural_context:
    - Adapt the expression of Whistleblowing and protected dissent to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use the fictional case and accessible official guidance. Actual concerns may need an attorney, inspector
      general, regulator, safety authority or other specifically authorized route; availability and protection
      vary. Current danger or a legal deadline should not wait for this practice to finish.
  pause_conditions:
  - Pause Whistleblowing and protected dissent when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Whistleblowing and protected dissent practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Whistleblowing and protected dissent situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
