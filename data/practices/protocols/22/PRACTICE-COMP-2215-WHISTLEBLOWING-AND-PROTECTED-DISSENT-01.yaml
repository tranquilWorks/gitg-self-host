  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### The first route stalls


      The rehearsal plan uses Sol''s independent intake. The supplied record says Sol was unexpectedly
      absent; **no acknowledgment arrived within two working days**. Ari records that absence and uses
      the Q8 alternate oversight desk. No external legal deadline has been identified or suspended by
      these internal steps.


      The alternate acknowledges receipt and assigns an authorized technical reviewer. A later administrative
      note says “complete” meant “entry finished,” while technical sign-off remains unresolved. The status
      label is changed to **administrative entry complete; technical sign-off pending**. The packet supplies
      no reopening approval, completed technical inspection or finding of deliberate falsification.


      Revise the original allegation language if you overstated intent. Keep Bo''s statement secondhand
      and do not manufacture corroboration. The ambiguity is partly repaired; the underlying technical
      dependency remains. The alternate acknowledgment is a process event, not a guarantee against retaliation.
      No retaliation is reported in this packet, which is not proof that protection is effective.


      Record the next responsible technical decision, privacy limits and pending legal-route questions.
      If your first plan waited indefinitely for Sol, explain how an explicit follow-up trigger would
      have changed it. Do not submit anything to OSHA or another real service as part of this exercise.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Prepare a defensible escalation plan from a fictional discrepancy. Allow twenty-five minutes
      for the evidence map and ten for the later response. You will distinguish what is known, who can
      receive it and what must be checked before disclosure. No report is filed and no allegation is sent.


      ### Separate the concern from the conclusion


      A troubling record can justify a question before it justifies an accusation. Direct observation
      is something you saw or read within your authorized access. A secondhand account is someone else''s
      report. An inference is your explanation of those facts. Preserve these distinctions so a reviewer
      can assess both the concern and alternative explanations. Accurate qualification strengthens a report;
      it does not require waiting until you can prove an entire case yourself.


      Severity and urgency affect the route. A discrepancy in a completed checklist may need prompt specialist
      review. An immediate threat to life or safety needs the appropriate urgent-help or responsible safety
      route, not completion of a learning worksheet. An internal channel can offer a remedy, but a conflicted
      recipient or ignored concern may require an independent channel. None of these observations determines
      which law covers a particular worker, allegation or disclosure.


      The [OSHA complaint page, S03](https://www.whistleblowers.gov/complaint_page) describes a U.S. retaliation-complaint
      process under specified laws. It is distinct from reporting the underlying safety hazard. Its deadlines
      vary by applicable statute, and it says retaliation complaints cannot be anonymous. If an investigation
      proceeds, the employer is notified and may respond. These details illustrate why “protected” cannot
      mean universally anonymous, confidential or immune from consequences. They do not establish your
      jurisdiction, coverage, filing deadline or legal protection. Seek qualified, jurisdiction-specific
      advice promptly when those questions matter; an internal process must not be assumed to pause an
      external deadline.


      ### Supplied file Q8: no actual hazard exercise


      In a fictional training organization, **Ari** is authorized to view a routine equipment-check status
      page. The page at **09:10 Tuesday** marks room K''s inspection “complete.” Ari also sees an authorized
      task card created at **08:50 Tuesday** that says “final sign-off awaited.” Neither record specifies
      whether completion means administrative entry or technical approval. Ari does not have access to
      the technical inspection file and must not obtain it for this exercise.


      Colleague **Bo** says, “I think the sign-off was never done.” Bo has not supplied a basis. Ari infers
      that somebody may have closed the record early. That remains an inference. Room K is closed for
      scheduled maintenance and there is **no reported immediate exposure** in this case. Users could
      be affected if a room were reopened on an incorrect status, so the discrepancy deserves clarification
      without a technical safety judgment by Ari.


      The fictional Q8 route card assigns routine clarification to the records supervisor, **Mina**, who
      also entered the status. It separately authorizes independent safety reviewer **Sol** to receive
      concerns about unresolved sign-off, including concerns involving Mina. Restricted technical records
      stay in the authorized safety system. The card promises need-to-know handling subject to investigation
      and reporting duties, not absolute secrecy. Sol acknowledges intake within **two working days**
      under this fictional service standard; it is not a legal filing deadline. If Sol is unavailable
      or implicated, the independent oversight desk is the alternate authorized intake route. No actual
      address or form is supplied.


      ### Worked neutral inquiry


      An unsent rehearsal draft reads: “The status page at 09:10 says complete; the 08:50 task card still
      says final sign-off awaited. I may be missing an update. Could the responsible reviewer reconcile
      the records and confirm who can authorize reopening?” It identifies the discrepancy, leaves room
      for correction and asks for an authorized action. “Mina falsified a safety certificate” adds both
      a document type and an intent that the supplied facts do not establish.


      Because Mina entered the disputed status, Ari can use Q8''s independent reviewer rather than ask
      Mina to assess her own possible error. That is a route choice based on the supplied policy, not
      a universal rule that every routine correction is whistleblowing. Ari records which authorized items
      were observed and when. Ari does not download a restricted file, photograph private screens, pressure
      Bo for witness names or post the concern publicly.


      ### Build the plan in a safe sequence


      1. Make an evidence ledger with separate direct, secondhand and inferred rows. Add the record times,
      access basis, uncertainty and lawful storage location. State what is missing without turning the
      gap into evidence of concealment.

      2. Describe possible affected people, severity and current exposure. In Q8, no immediate exposure
      is reported; reopening authorization remains for the responsible safety role. Write the different
      urgent route you would use if actual immediate danger emerged, without staging it.

      3. Compare the records supervisor, independent reviewer and alternate oversight desk for remit,
      conflicts, privacy limits and response expectations. List legal questions separately: jurisdiction,
      worker status, covered subject, protected route, deadlines and available support. Do not answer
      them from this fictional card.

      4. Save the neutral inquiry as an **unsent draft**. Describe only lawfully accessible facts and
      the action requested. Ask the proper recipient how sensitive material should be transmitted before
      sharing it. Do not put restricted, classified, privileged or personal records into an ordinary portal
      or app evidence field.

      5. Specify what happens if the fictional response standard passes without acknowledgment: record
      the absence, use the authorized alternate and seek timely qualified guidance where rights or duties
      may be affected. Include a way to document possible retaliation through appropriate lawful channels.
      Do not promise that this prevents retaliation.

      6. Save your first plan before the [later packet](?resource=file-later-packet-md). Later, distinguish
      acknowledgment, investigation, correction and safety clearance; none substitutes for the others.


      ### Practice without exposing a person


      For support, label the three supplied evidence rows with a helper before drafting your own inquiry.
      A harder variant makes the alternate desk report to Mina. The plan now needs verification of a genuinely
      independent authorized route and prompt advice about outside options; inventing a recipient or publishing
      the allegation is not the solution.


      Optional actual transfer is to locate a public reporting policy and list questions about its remit
      and confidentiality. Do not use a real suspected violation as practice, collect new evidence or
      contact implicated people. If an actual concern is present, use responsible professional support
      rather than this simulated script. A good plan respects affected people, possible respondents and
      the integrity of records. One acknowledgment does not prove protected dissent is safe or that an
      institution acted correctly.


      ### Use the result at its proper scale


      Practical safeguards do not add canonical metadata.  A leadership role is not compulsory. Use actual
      authority and willing participation; keep protected records private. Fiction and no attempt are
      legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. You saw an authorized status entry, a colleague suspects fraud, and you infer deliberate concealment.
      How should these appear in a report?

      2. A U.S. worker assumes an OSHA retaliation complaint is anonymous and also files the underlying
      safety concern. What needs correction?

      3. An independent internal channel misses its response target while an external legal deadline may
      be running. What is the planning error in simply waiting?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. As three different evidence classes: direct observation, attributed secondhand account and
      explicitly labeled inference. Include uncertainty and lawful access; do not upgrade suspicion into
      a finding.

      2. The inspected OSHA retaliation process is not anonymous and is distinct from its safety-hazard
      route. Coverage, jurisdiction, disclosure handling and the applicable deadline need verification.
      Neither filing nor an internal complaint guarantees protection.

      3. An internal response target is not a legal deadline and does not establish tolling. Record the
      missed response, use an authorized alternative and obtain timely qualified guidance about outside
      routes and deadlines; do not disclose restricted records through an ordinary portal.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
