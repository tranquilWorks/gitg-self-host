meaning_and_fit:
  purpose: Assess the evidence, seriousness, reporting options and retaliation risks of a concern while
    preserving lawful evidence handling, affected people’s safety and fair process.
  why_recommended: Assess the evidence, seriousness, reporting options and retaliation risks of a concern
    while preserving lawful evidence handling, affected people’s safety and fair process.
  claims:
  - statement: Assess the evidence, seriousness, reporting options and retaliation risks of a concern
      while preserving lawful evidence handling, affected people’s safety and fair process.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Whistleblowing and protected dissent practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Whistleblowing and protected dissent as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the fictional case and accessible official guidance. Actual concerns may
    need an attorney, inspector general, regulator, safety authority or other specifically authorized
    route; availability and protection vary. Current danger or a legal deadline should not wait for this
    practice to finish.
  opportunity_considerations: 'Use the fictional case of a safety report marked complete despite an unresolved
    check. Prepare only neutral categories: direct observation, secondhand claim, severity, affected people,
    current danger, internal route, independent route, legal guidance, deadline and information restrictions.
    Do not put actual allegations or protected documents in this application.'
  prerequisites:
  - 'Use the fictional case of a safety report marked complete despite an unresolved check. Prepare only
    neutral categories: direct observation, secondhand claim, severity, affected people, current danger,
    internal route, independent route, legal guidance, deadline and information restrictions. Do not put
    actual allegations or protected documents in this application.'
  dependencies: []
  safe_alternatives:
  - Use the fictional case and accessible official guidance. Actual concerns may need an attorney, inspector
    general, regulator, safety authority or other specifically authorized route; availability and protection
    vary. Current danger or a legal deadline should not wait for this practice to finish.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Whistleblowing and protected dissent differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Whistleblowing and protected
    dissent as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional case of a safety report marked complete despite an unresolved check. Prepare
    only neutral categories: direct observation, secondhand claim, severity, affected people, current
    danger, internal route, independent route, legal guidance, deadline and information restrictions.
    Do not put actual allegations or protected documents in this application. Goal: Assess the evidence,
    seriousness, reporting options and retaliation risks of a concern while preserving lawful evidence
    handling, affected people’s safety and fair process. Scope: This is a fictional escalation plan or
    preparation for qualified advice, not legal protection, a public-disclosure recommendation or permission
    to copy or upload classified, privileged, export-controlled or confidential information. Time and
    effort: Twenty minutes to classify a fictional concern, a 25-minute route check and a short qualified-inquiry
    rehearsal. Adaptation: Use the fictional case and accessible official guidance. Actual concerns may
    need an attorney, inspector general, regulator, safety authority or other specifically authorized
    route; availability and protection vary. Current danger or a legal deadline should not wait for this
    practice to finish. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case and accessible official guidance. Actual concerns may need
    an attorney, inspector general, regulator, safety authority or other specifically authorized route;
    availability and protection vary. Current danger or a legal deadline should not wait for this practice
    to finish.
  expected_burden: Twenty minutes to classify a fictional concern, a 25-minute route check and a short
    qualified-inquiry rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Whistleblowing and protected dissent protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Whistleblowing and protected dissent action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case and accessible official guidance. Actual concerns may need an attorney, inspector general, regulator,
    safety authority or other specifically authorized route; availability and protection vary. Current
    danger or a legal deadline should not wait for this practice to finish.
  actions:
  - stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A1
    sequence: 1
    title: Separate evidence, concern and immediate protective duty
    instructions: 'State what was directly observed in the fictional case, what is inferred and what remains
      unknown. Identify the potential consequence and whether immediate safety action through an authorized
      route is needed before ordinary reporting. Distinguish a technical disagreement, an error, serious
      misconduct and possible retaliation without deciding legal guilt. Preserve real evidence only through
      lawful authorized systems and qualified guidance; do not take restricted documents to make the case
      stronger.


      Observation checks: Direct observation inference and unknowns are separated; Severity and immediate
      safety needs are identified; Disagreement error misconduct and retaliation are distinguished; Evidence
      handling remains lawful authorized and privacy-protecting. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01
      action_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A1
      competency_stable_id: '22.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2215_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2215_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - direct_observation_inference_and_unknowns_are_separated
        - severity_and_immediate_safety_needs_are_identified
        - disagreement_error_misconduct_and_retaliation_are_distinguished
        - evidence_handling_remains_lawful_authorized_and_privacy_protecting
      - measurement_id: c2215_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2215_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A2
    sequence: 2
    title: Verify reporting channels, coverage and confidentiality limits
    instructions: 'Compare the relevant internal safety or ethics route with an appropriate independent
      authority or qualified adviser. Check jurisdiction, worker category, subject-matter coverage, deadlines
      and what confidentiality or anonymity the route actually offers. Do not assume that a whistleblower
      label protects every disclosure or that an online portal can receive classified material. For restricted
      information, use the specifically authorized secure reporting process and obtain guidance without
      transmitting the material through an ordinary channel.


      Observation checks: Internal and independent routes are compared for the actual issue; Coverage
      deadlines and practical retaliation risks are checked; Confidentiality and anonymity are not overpromised;
      Restricted material is not sent through an unauthorized portal. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01
      action_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A2
      competency_stable_id: '22.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2215_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2215_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - internal_and_independent_routes_are_compared_for_the_actual_issue
        - coverage_deadlines_and_practical_retaliation_risks_are_checked
        - confidentiality_and_anonymity_are_not_overpromised
        - restricted_material_is_not_sent_through_an_unauthorized_portal
      - measurement_id: c2215_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2215_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A3
    sequence: 3
    title: Write a minimal inquiry and an accountable next-step plan
    instructions: 'Rehearse a neutral request for guidance using fictional facts: I have a concern about
      an unverified safety check; which authorized process applies and how should evidence be preserved.
      Identify the next owner, timing, safe support and what to do if the first route is conflicted or
      unresponsive. Include protection for affected people and a fair opportunity for authorized fact-finding.
      Do not publish an allegation, contact witnesses covertly or conduct your own investigation to complete
      the exercise.


      Observation checks: The inquiry is minimal and factual; Next owner timing support and conflict alternatives
      are explicit; Affected people and due process are protected; No unauthorized disclosure or amateur
      investigation is performed. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Which facts justify escalation, which channel can lawfully receive them, and what
      prevents the reporting plan from harming people or compromising evidence?


      Examples: Supportive: The participant distinguished an unresolved check from a proven offense and
      identified a qualified secure reporting route before handling any real material.


      Mixed: The first route did not cover the worker category, so the participant sought the correct
      independent guidance instead of assuming protection.


      Contradictory: Protected information was uploaded publicly, anonymity was promised without basis
      or a real deadline was ignored while building a perfect case.


      Inconclusive: Whistleblowing was praised as courage without evidence distinctions, coverage checks
      or a lawful escalation path.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01
      action_stable_id: PRACTICE-COMP-2215-WHISTLEBLOWING-AND-PROTECTED-DISSENT-01-A3
      competency_stable_id: '22.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2215_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2215_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_inquiry_is_minimal_and_factual
        - next_owner_timing_support_and_conflict_alternatives_are_explicit
        - affected_people_and_due_process_are_protected
        - no_unauthorized_disclosure_or_amateur_investigation_is_performed
      - measurement_id: c2215_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
