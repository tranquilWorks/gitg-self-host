  - stable_id: PRACTICE-COMP-2203-AUTHORITY-AND-ETHICAL-USE-OF-POWER-01-A2
    sequence: 2
    title: Make the decision criteria and freedom to decline real
    instructions: 'State the purpose and relevant criteria for the opportunity, such as readiness, interest
      and fair access to development. Invite participation through a channel that does not require public
      refusal or praise of the leader. Provide an alternative route or later opportunity where feasible
      and make clear that declining does not itself lower standing. Where your conflict prevents fair
      judgment, use the authorized recusal or independent-review arrangement rather than privately deciding
      you can be objective.


      Observation checks: Criteria are tied to purpose and fair opportunity; Interest or refusal can be
      communicated without public pressure; Declining is not used as a loyalty test; A conflict receives
      an appropriate independent disposition. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2203-AUTHORITY-AND-ETHICAL-USE-OF-POWER-01
      action_stable_id: PRACTICE-COMP-2203-AUTHORITY-AND-ETHICAL-USE-OF-POWER-01-A2
      competency_stable_id: '22.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
