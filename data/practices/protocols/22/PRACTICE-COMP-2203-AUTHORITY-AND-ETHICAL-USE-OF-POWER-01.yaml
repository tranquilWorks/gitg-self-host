    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A selector discloses a friendship, then chooses alone despite a rule requiring recusal. Is disclosure
      sufficient?

      2. Someone is free at the event time but has not volunteered. May the leader count them as willing?

      3. A person who declined keeps the same shifts. Does this prove the decision was free of coercion
      in every respect?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Disclosure exposes the conflict; the applicable process determines its disposition.
      Use the authorized independent arrangement. A conflict itself is not a corruption verdict.

      2. No. Availability is not consent. Provide a meaningful choice and avoid demanding private reasons
      or public refusal.

      3. It is one bounded observation about scheduling. References, future opportunities, subjective
      pressure and other dependencies remain untested. Preserve that limit.'
    criteria:
