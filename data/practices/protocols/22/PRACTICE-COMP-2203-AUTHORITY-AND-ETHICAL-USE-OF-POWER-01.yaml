  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Dana discloses the friendship to Jules and takes no part in Lea''s selection. Chen privately declines
      without a reason; Lea records only “not participating this time.” Bea and Ivo both accept the offered
      rehearsal. Lea selects **Bea** because both willing candidates can meet the demonstration criterion
      with support and Bea has had fewer prior slots. Ivo remains eligible for future opportunities.


      Bea''s first rehearsal correctly explains one of the two labels. Lea explains the distinction once;
      Bea then explains both correctly. This is a **supported rehearsal**, not independent mastery or
      a delivered presentation. Bea says the preparation helped; that comment does not measure the fairness
      of the whole process.


      The supplied next rota shows Chen''s previously agreed two shifts unchanged. No reference has been
      requested, the public demonstration has not occurred, and future access has not been tested. Jules
      receives an inquiry asking how the tie-break worked and replies with the published rule, without
      sharing Chen''s private response. No finding of corruption, retaliation or universal freedom from
      pressure is supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Design a fair opportunity decision when the chooser also controls resources that make refusal
      difficult. Allow twenty minutes for the power map and fifteen for the later review. Use the supplied
      fictional group. Do not test a real person''s freedom by asking them to refuse someone who controls
      their livelihood, references or essential access.


      ### Locate power before asking for agreement


      Formal authority is the recognized right to decide within a role. Informal power includes reputation,
      access to influential people, control of information and the ability to make participation easier
      or harder. Both shape a choice. A leader may sincerely say “voluntary” while participants reasonably
      worry that declining will affect future opportunities. The word does not remove the dependency.


      Map what the decision maker controls and what participants might lose. Separate supplied facts from
      hypotheses: a leader who schedules shifts has a source of power; this does not prove that they have
      threatened anyone. Conversely, the absence of an explicit threat does not establish a cost-free
      refusal. Consider private response routes, independent selection and relevant review arrangements
      before relying on an apparently enthusiastic public answer.


      A conflict of interest is a situation that can interfere with impartial judgment; it is not automatically
      a finding of corruption. Personal relationships, material benefits, loyalty and the desire for admiration
      can matter. Disclosure makes the issue visible but does not by itself decide whether the person
      may participate. Follow the applicable authority''s process for disclosure, recusal or independent
      review. Privately promising to be objective is not a substitute for the required safeguard.


      Criteria should serve the opportunity''s purpose. Readiness and consent matter, but so can fair
      access to development. If experience is always required and never offered, the same people may receive
      every chance. Define the minimum needed for this task and what support can close a safe learning
      gap. Do not invent a scoring system that rewards friendship or public praise while presenting it
      as merit.


      Dignity requires a meaningful refusal route and a truthful explanation of its limits. A private
      channel can reduce public pressure, but the channel owner still learns something. Do not promise
      anonymity when identifiers or circumstances reveal the person. Collect only what the decision requires;
      declining need not involve personal justification. A reviewer must have actual authority and availability,
      not merely a reassuring title in a form.


      Use authority to expand capability through a supported opportunity, not to obtain obedience. A selected
      person needs preparation, boundaries and a way to ask for help. Those not selected should retain
      a fair future route. A leader can be disappointed that someone declines without changing their standing.
      Monitor what is within your control, such as whether scheduling or invitations changed; do not infer
      that every dependency has vanished.


      Accountability includes a concise reasons record and a usable correction route. Keep private circumstances
      out of a public decision note. If someone raises favoritism or pressure, preserve the concern and
      refer it appropriately. Gratitude, silence and the leader''s own confidence do not establish fairness.
      An independent process can improve the decision without proving that nobody felt pressure.


      ### Worked example


      A volunteer coordinator selects their close friend to represent a group, saying the friend is enthusiastic.
      The friendship does not automatically make the friend unqualified. The defect is an unmanaged conflict
      and criteria that nobody could inspect. An authorized independent selector can consider the same
      person''s readiness under published criteria. Fairness does not require punishing a candidate for
      knowing the coordinator; it requires an appropriate process.


      ### Complete fictional selection packet


      The Paper Atlas group has one **four-minute demonstration slot on 8 November 2026**. Its purpose
      is to let a member explain an existing public map comparison, with preparation support. Dana normally
      assigns the slot, controls next month''s volunteer rota and supplies optional references. Dana is
      close friends with candidate Ivo. These are supplied facts, not findings of misconduct.


      The group''s fictional rule **OP-3** requires a connected selector to disclose the relationship
      to review steward Jules, who appoints an unconnected selector. Jules has authorized Lea to select
      this slot. Dana must not lobby Lea or collect participants'' private reasons. A review request can
      go to Jules before **6 November at 12:00 UTC**; Jules can correct the selection process, not promise
      everyone a slot. This is invented governance, not law.


      Published criteria are: willingness; ability, with the available ten-minute rehearsal, to explain
      the map''s two labels accurately; and fair access, using fewer previous slots as the tie-break between
      equally ready willing candidates. **Ivo** is ready and has had **two** slots. **Bea** is ready after
      rehearsal and has had **zero**. **Chen** is ready, has had **zero**, and has not yet expressed interest.
      No candidate''s interest should be inferred from availability. All have the same offered preparation
      time and may send a private yes/no to Lea without reasons. Declining cannot itself change the rota,
      references or later eligibility under OP-3.


      Dana''s proposed announcement is: “Show your commitment by volunteering publicly; I hope everyone
      supports my choice.” It creates a loyalty cue and reveals refusals. Replace it. The paper selection
      record may contain criteria, decision, conflict disposition, support and review route; it must not
      contain personal explanations for declining.


      ### Restructure and review the decision


      1. Map Dana''s formal decision role, rota/reference influence, friendship and participants'' refusal
      costs. Distinguish a conflict from proven misuse. Output: power map with facts, concerns and unknowns.

      2. Apply OP-3, identify Lea and Jules''s separate roles and rewrite the invitation. Output: private
      choice route, actual conflict disposition, criteria and limits on data collection.

      3. Compare candidates conditionally: do not count Chen as willing. Save before the [later packet](?resource=file-later-packet-md).
      Output: a selection rationale that can change with actual interest.

      4. Read the response and rehearsal results. Record support, the selected person''s demonstrated
      capacity, others'' future access and any review concern. Output: a privacy-minimized decision note
      with an explicit limit on what fairness evidence exists.


      ### Support and transfer


      Use a spoken private response through a willing neutral helper when writing is a barrier. In a harder
      case Jules is also connected and no authorized substitute is available: pause the decision or seek
      the legitimate next authority rather than appoint yourself impartial. Actual hiring, promotion,
      procurement and essential services require their governing procedures and qualified review. A harmless
      fiction does not authorize experiments with another person''s dependence.


      ### Source use


      [OECD leadership, S02](https://www.oecd.org/en/publications/oecd-public-integrity-handbook_ac8ed8e8-en/full-report/leadership_1aa35fa2.html),
      supports attention to integrity in leadership systems. [Charity Commission conflict guidance, S09](https://www.gov.uk/government/publications/identifying-and-managing-conflicts-of-interest-in-a-charity-cc29/conflicts-of-interest-a-guide-for-charity-trustees),
      illustrates identifying, managing and recording conflicts. Only those conceptual principles are
      adapted. Its charity-specific duties are not applied as rules for every group; OP-3 and this opportunity
      are original fiction.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
