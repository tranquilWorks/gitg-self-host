meaning_and_fit:
  purpose: Recognize formal and informal power, dependency and conflicts of interest, then structure one
    decision so people can contribute or decline without coercion.
  why_recommended: Recognize formal and informal power, dependency and conflicts of interest, then structure
    one decision so people can contribute or decline without coercion.
  claims:
  - statement: Recognize formal and informal power, dependency and conflicts of interest, then structure
      one decision so people can contribute or decline without coercion.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Authority and ethical use of power practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Authority and ethical use of power as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a fictional case, peer rotation or accessible private response channel.
    Actual hiring, promotion, procurement and protected opportunities require their governing policies
    and qualified review. Do not test consent by making people refuse someone who controls essential resources.
  opportunity_considerations: Default to a group leader choosing who receives a visible presentation opportunity.
    The leader also controls scheduling and gives references, creating potential dependence. Prepare a
    decision record with authority, informal influence, affected people, criteria, interests, refusal
    route, reviewer and appeal.
  prerequisites:
  - Default to a group leader choosing who receives a visible presentation opportunity. The leader also
    controls scheduling and gives references, creating potential dependence. Prepare a decision record
    with authority, informal influence, affected people, criteria, interests, refusal route, reviewer
    and appeal.
  dependencies: []
  safe_alternatives:
  - Use a fictional case, peer rotation or accessible private response channel. Actual hiring, promotion,
    procurement and protected opportunities require their governing policies and qualified review. Do
    not test consent by making people refuse someone who controls essential resources.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Authority and ethical use of power differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Authority and ethical use
    of power as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a group leader choosing who receives a visible presentation opportunity. The leader
    also controls scheduling and gives references, creating potential dependence. Prepare a decision record
    with authority, informal influence, affected people, criteria, interests, refusal route, reviewer
    and appeal. Goal: Recognize formal and informal power, dependency and conflicts of interest, then
    structure one decision so people can contribute or decline without coercion. Scope: Use an authorized
    low-stakes decision or fictional case. This does not determine legal authority, remove an institutional
    duty or certify that a power imbalance has disappeared. Time and effort: Twenty minutes to map power,
    one bounded decision conversation and a 15-minute accountability review. Adaptation: Use a fictional
    case, peer rotation or accessible private response channel. Actual hiring, promotion, procurement
    and protected opportunities require their governing policies and qualified review. Do not test consent
    by making people refuse someone who controls essential resources. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional case, peer rotation or accessible private response channel. Actual
    hiring, promotion, procurement and protected opportunities require their governing policies and qualified
    review. Do not test consent by making people refuse someone who controls essential resources.
  expected_burden: Twenty minutes to map power, one bounded decision conversation and a 15-minute accountability
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Authority and ethical use of power protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Authority and ethical use of power action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    case, peer rotation or accessible private response channel. Actual hiring, promotion, procurement
    and protected opportunities require their governing policies and qualified review. Do not test consent
    by making people refuse someone who controls essential resources.
  actions:
  - stable_id: PRACTICE-COMP-2203-AUTHORITY-AND-ETHICAL-USE-OF-POWER-01-A1
    sequence: 1
    title: Map the power that exists beyond the title
    instructions: 'Identify who formally decides, who influences access or reputation and who may find
      refusal costly. Name any personal connection, desired admiration or benefit that could affect your
      judgment. Distinguish having a conflict from having already acted corruptly, and check the applicable
      disclosure or recusal process. Ask what information a less powerful participant would need to make
      a genuine choice without exposing private circumstances.


      Observation checks: Formal and informal sources of power are identified; Dependency and the cost
      of refusal are considered; Personal interests and connections are disclosed through the proper process;
      Conflict is distinguished from an established misconduct finding. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2203-AUTHORITY-AND-ETHICAL-USE-OF-POWER-01
      action_stable_id: PRACTICE-COMP-2203-AUTHORITY-AND-ETHICAL-USE-OF-POWER-01-A1
      competency_stable_id: '22.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2203_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2203_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - formal_and_informal_sources_of_power_are_identified
        - dependency_and_the_cost_of_refusal_are_considered
        - personal_interests_and_connections_are_disclosed_through_the_proper_process
        - conflict_is_distinguished_from_an_established_misconduct_finding
      - measurement_id: c2203_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
