meaning_and_fit:
  purpose: Match a task to someone’s readiness, provide purpose and decision room, agree checkpoints and
    let them perform real work without constant interference.
  why_recommended: Match a task to someone’s readiness, provide purpose and decision room, agree checkpoints
    and let them perform real work without constant interference.
  claims:
  - statement: Match a task to someone’s readiness, provide purpose and decision room, agree checkpoints
      and let them perform real work without constant interference.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Delegation and empowerment practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Delegation and empowerment as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible instructions, a smaller task, paired work or a fictional delegation
    rehearsal. Preserve employment, safeguarding, professional and safety requirements. A person may need
    ongoing support while still exercising meaningful responsibility.
  opportunity_considerations: Default to delegating preparation of a five-item meeting agenda. Provide
    the purpose, required topics, deadline, accessible format, source facts and decisions the person may
    make. Separate decisions they own from those requiring approval. Use a willing peer or a fictional
    role when you have no supervisory authority.
  prerequisites:
  - Default to delegating preparation of a five-item meeting agenda. Provide the purpose, required topics,
    deadline, accessible format, source facts and decisions the person may make. Separate decisions they
    own from those requiring approval. Use a willing peer or a fictional role when you have no supervisory
    authority.
  dependencies: []
  safe_alternatives:
  - Use accessible instructions, a smaller task, paired work or a fictional delegation rehearsal. Preserve
    employment, safeguarding, professional and safety requirements. A person may need ongoing support
    while still exercising meaningful responsibility.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Delegation and empowerment differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Delegation and empowerment
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to delegating preparation of a five-item meeting agenda. Provide the purpose, required
    topics, deadline, accessible format, source facts and decisions the person may make. Separate decisions
    they own from those requiring approval. Use a willing peer or a fictional role when you have no supervisory
    authority. Goal: Match a task to someone’s readiness, provide purpose and decision room, agree checkpoints
    and let them perform real work without constant interference. Scope: Use a willing authorized collaboration.
    This is not permission to assign regulated work, transfer duties you legally retain or disguise abandonment
    as empowerment. Time and effort: Twenty minutes to agree delegation, one short work period and a 15-minute
    outcome and learning review. Adaptation: Use accessible instructions, a smaller task, paired work
    or a fictional delegation rehearsal. Preserve employment, safeguarding, professional and safety requirements.
    A person may need ongoing support while still exercising meaningful responsibility. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible instructions, a smaller task, paired work or a fictional delegation
    rehearsal. Preserve employment, safeguarding, professional and safety requirements. A person may need
    ongoing support while still exercising meaningful responsibility.
  expected_burden: Twenty minutes to agree delegation, one short work period and a 15-minute outcome and
    learning review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Delegation and empowerment protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Delegation and empowerment action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    instructions, a smaller task, paired work or a fictional delegation rehearsal. Preserve employment,
    safeguarding, professional and safety requirements. A person may need ongoing support while still
    exercising meaningful responsibility.
  actions:
  - stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01-A1
    sequence: 1
    title: Match the outcome to readiness and ask for acceptance
    instructions: 'Ask what experience and support the person has for the task and what they need to succeed,
      without turning the discussion into a character judgment. Explain the intended outcome and why it
      matters, then agree the scope and acceptance criteria. Identify one stretch that is safe and manageable
      and one part beyond their present authority or competence. The task is not delegated until the person
      accepts or an appropriate role process establishes responsibility.


      Observation checks: Readiness and support needs are discussed concretely; Purpose outcome and acceptance
      are clear; A manageable stretch and an excluded responsibility are identified; Responsibility is
      explicitly accepted through an appropriate process. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01
      action_stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01-A1
      competency_stable_id: '22.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2205_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2205_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - readiness_and_support_needs_are_discussed_concretely
        - purpose_outcome_and_acceptance_are_clear
        - a_manageable_stretch_and_an_excluded_responsibility_are_identified
        - responsibility_is_explicitly_accepted_through_an_appropriate_process
      - measurement_id: c2205_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
