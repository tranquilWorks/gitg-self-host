  - stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01-A2
    sequence: 2
    title: Provide decision rights, resources and a useful checkpoint
    instructions: 'Give access to the permitted inputs and state which choices the person can make, such
      as ordering the topics or choosing wording. Agree one checkpoint for a risk or draft, not continuous
      status demands. Define when to ask for help and what requires approval. During the work, avoid silently
      redoing their decisions or sending conflicting instructions; when a genuine safety or scope issue
      emerges, intervene clearly and explain the reason.


      Observation checks: Resources and permitted inputs are available; Decision rights and approval boundaries
      are explicit; A proportionate checkpoint and help trigger are agreed; The delegator avoids covert
      rework and conflicting instructions. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01
      action_stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01-A2
      competency_stable_id: '22.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
