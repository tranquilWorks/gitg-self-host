  - stable_id: PRACTICE-COMP-2205-DELEGATION-AND-EMPOWERMENT-01-A3
    sequence: 3
    title: Review the result and transfer the next degree of responsibility
    instructions: 'At the agreed handoff, compare the agenda with the acceptance criteria and ask the
      person to explain a decision they made. Recognize useful judgment and address a specific gap without
      reclaiming the entire task reflexively. Ask what support was missing or excessive and agree what
      they can own next time. Record both the work outcome and the learning, including a reason to keep
      support when needed; independence is not the removal of legitimate access aids.


      Observation checks: The actual result is checked against agreed criteria; The person explains their
      own judgment; Feedback concerns specific work and support; The next responsibility level is agreed
      without removing needed supports. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What real decision did the other person own, and did your checkpoint support progress
      or merely relieve your urge to control?


      Examples: Supportive: The delegate chose a clear topic order, met the agreed criteria and identified
      one additional responsibility to own next time.


      Mixed: The work progressed, but unclear approval limits caused delay; the next delegation clarified
      decision rights.


      Contradictory: The leader assigned responsibility without resources, continually rewrote the work
      or called abandonment empowerment.


      Inconclusive: A task was assigned without acceptance, authority, checkpoints or an outcome review.'
    expected_time: 15-25 minutes
    due_within_days: 10
