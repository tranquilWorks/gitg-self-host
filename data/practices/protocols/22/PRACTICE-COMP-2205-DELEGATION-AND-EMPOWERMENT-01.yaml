  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Jo''s 14:00 draft has durations **3, 5, 12, 10, 5**, totaling **35 minutes**. All five topics and
      the required sequence are present; Jo has not invented a layout decision. Kira says, “The agreed
      meeting is thirty minutes. Which five minutes can you remove while keeping the minima and decision
      sequence?” Kira does not supply the allocation and does not extend the meeting without authorization.


      At **14:35**, Jo returns **3, 4, 10, 8, 5**, totaling **30**. Each minimum is met. Jo explains that
      discussion receives two discretionary minutes, the owner/date decision three and recap two. Kira
      accepts that version at **14:45**, fifteen minutes before the deadline. Jo used the provided source
      and a calculator; the revised allocation was Jo''s own.


      Jo asks to retain the minima checklist next time and to own wording, order and timing again. Kira
      agrees while keeping changes to total duration and required topics with Kira. The work progressed
      and one allocation was corrected after a prompt. No broader competence, live meeting outcome or
      readiness for unlimited authority is established.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Delegate a five-topic agenda with usable authority, a deliberate stretch and one checkpoint.
      Spend fifteen minutes on the agreement and fifteen reviewing the handoff. Use the supplied fictional
      roles or a willing peer on harmless work. Delegation should let another person exercise judgment
      while real work advances; it is not a way to transfer blame or obtain unpaid availability.


      ### Match the task, support and authority


      Readiness is task-specific. Someone may write clear summaries but be new to allocating discussion
      time. Ask what they have done, what is unfamiliar and which support helps. Do not infer general
      competence from status, confidence or one error. Choose a stretch that can be checked without exposing
      people to consequential risk. Keep tasks requiring qualifications or authority outside the delegation
      unless the proper process supplies them.


      Explain the intended result, its users and why it matters. An agenda is not merely a list of headings:
      participants need to know which topics require discussion, which choices are already made and when
      the meeting ends. Define acceptance criteria before the person works so they can judge their own
      draft. Provide approved inputs and access, not just a deadline. Lack of access cannot be repaired
      by exhorting someone to take ownership.


      Separate decisions the delegate owns from those that require approval. Wording and topic order may
      be theirs while meeting length, budget and official commitments remain with another person. Responsibility
      without the relevant discretion produces avoidable waiting. Unlimited discretion without context
      can create preventable errors. An agreement should make both boundaries intelligible to the person
      doing the work.


      Confirm responsibility through willing acceptance or the applicable legitimate role process. A task
      appears on your list of assignments before it is actually delegated. If a person cannot accept,
      resolve capacity or scope rather than recording imaginary ownership. In a peer setting you cannot
      manufacture supervisory authority. A person can ask for support or decline a voluntary task without
      proving disloyalty.


      A checkpoint is a purposeful occasion to surface a risk or inspect a draft. It differs from continuous
      status demands and silent surveillance. Agree what should trigger an earlier question: conflicting
      approved facts, an impossible time total or a request outside authority. Then allow valid choices
      within the boundary. Secretly rewriting someone''s work makes the person accountable for an artifact
      they did not control and prevents a useful review of their judgment.


      Intervene transparently when an essential criterion or real boundary is at risk. Say what the issue
      is, why it matters and which decision remains theirs. A correction need not reclaim the entire task.
      For example, if the draft runs five minutes long, ask the delegate to redistribute discussion time
      within agreed minima. Supplying the complete revised schedule would change the amount of independence
      demonstrated.


      Review work outcome and development separately. The agenda can be accepted while the new time-allocation
      skill still needs a checklist. A person can learn from a failed draft while the work remains incomplete.
      Ask them to explain one choice and one help trigger. Continued accessibility aids do not automatically
      negate independence; supplied answers do. Decide next scope using observed readiness and requested
      support, not a desire to declare empowerment complete.


      ### Worked example


      A lead delegates an agenda but dictates every word, then praises the delegate''s initiative. The
      file may be usable, but the process gave little discretion. A better agreement reserves the meeting''s
      purpose and hard limits while allowing the delegate to choose order and timing within them. If the
      lead dislikes a valid order, that preference alone does not justify taking control back.


      ### Complete fictional agenda assignment


      Kira asks Jo to prepare a plain-text agenda for a **30-minute** planning meeting on **9 November
      2026, 17:00–17:30 UTC**. Jo accepts after confirming twenty active preparation minutes. Jo has experience
      writing summaries and wants practice allocating time. Kira approves five required topics and minima:
      purpose/check-in **3 minutes**; review last task **4**; compare poster layouts **8**; choose next
      owner/date **5**; recap/open questions **3**. The remaining **7 minutes** may be distributed among
      topics. The comparison must precede the owner/date decision, and the recap must be last.


      The supplied prior task was to compare two paper layouts: Layout A puts the date first; Layout B
      puts the location first. Neither has been selected. The meeting will decide which layout to revise,
      who owns the revision and its due date; Jo must not insert a decision already made. Jo may choose
      wording, permissible ordering and time distribution. Kira retains authority over the total meeting
      duration, changing required topics and any external commitment. No budget or public release is part
      of this work.


      The deadline is **8 November at 15:00 UTC**. They agree one draft checkpoint at **14:00**, with
      an earlier question for conflicting source facts or a requirement that cannot fit. The paper source
      **AGENDA-INPUTS** is available to Jo. Kira accepts responsibility to answer a boundary question
      by **14:20**. Acceptance requires all five topics, at least the stated minima, a thirty-minute total,
      correct sequence, plain text and no invented decision.


      ### Delegate without taking back the work


      1. Write the result, criteria, Jo''s relevant experience and the time-allocation stretch. Separate
      Jo''s decisions from Kira''s. Output: accepted delegation agreement with available inputs and capacity.

      2. Draft a valid agenda or use it to judge the later fictional attempt. Specify the checkpoint and
      early help triggers. Output: an inspectable thirty-minute plan with the seven discretionary minutes
      visible.

      3. Save before the [later packet](?resource=file-later-packet-md). Respond to its actual defect
      without rewriting the full agenda for Jo. Output: a bounded corrective question and clear approval
      boundary.

      4. Evaluate the returned agenda, Jo''s explanation and support request. Output: acceptance status
      plus a specific next-scope decision, retaining any support still needed.


      ### Adaptation and further challenge


      A calculator, large-print topic cards or a spoken agenda can support the same reasoning. A harder
      variant gives only twenty minutes of meeting time while the five minima total twenty-three: Jo should
      ask Kira to change an authorized constraint; hiding the conflict is not initiative. In real work
      obtain actual access, clear role authority and adequate time. Do not treat this agenda task as readiness
      for regulated, safety-critical or disciplinary responsibility.


      ### Source use


      [S01](https://www.gov.uk/government/publications/civil-service-leadership-statement/civil-service-leadership-statement)
      gives a narrow institutional example of pairing clear objectives with space and authority. [GovS
      002, S03](https://projectdelivery.gov.uk/library-products/government-functional-standard-govs-002-project-delivery/)
      supplies the principle of explicit decision roles and autonomy. The readiness conversation and fictional
      schedule are original adaptations, not a validated delegation instrument.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A person is assigned responsibility but cannot access the approved inputs or make any relevant
      choice. What is missing?

      2. A delegated draft meets requirements but uses a different valid order from the lead''s preference.
      Should the lead silently replace it?

      3. A thirty-minute meeting has required minima totaling twenty-three. A draft totals thirty-five.
      What should the reviewer do?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Usable resources and decision authority. Resolve those alongside scope, support and acceptance;
      an assignment alone does not create an executable delegation.

      2. No. Respect the discretion granted. Discuss a relevant consequence if one exists; a personal
      preference is not itself a boundary breach.

      3. Identify the five-minute excess and ask for redistribution that preserves the minima and sequence.
      Do not automatically reclaim the task or change the total without authority.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
