meaning_and_fit:
  purpose: Describe a meaningful future, explain its value and identify a small immediate priority set
    with explicit tradeoffs and a shared understanding check.
  why_recommended: Describe a meaningful future, explain its value and identify a small immediate priority
    set with explicit tradeoffs and a shared understanding check.
  claims:
  - statement: Describe a meaningful future, explain its value and identify a small immediate priority
      set with explicit tradeoffs and a shared understanding check.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Direction, vision, and priorities practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Direction, vision, and priorities as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a one-page, spoken, signed or visual brief. A fictional group rehearsal
    tests clarity but not actual shared commitment. Do not use the exercise to collect political preferences
    or override organizational authority.
  opportunity_considerations: Default to a community workshop that wants newcomers to participate without
    confusion. The future condition is a newcomer can find, join and contribute to an event. Prepare a
    brief with destination, why it matters, current obstacle, no more than three priorities, non-priorities
    and a review date.
  prerequisites:
  - Default to a community workshop that wants newcomers to participate without confusion. The future
    condition is a newcomer can find, join and contribute to an event. Prepare a brief with destination,
    why it matters, current obstacle, no more than three priorities, non-priorities and a review date.
  dependencies: []
  safe_alternatives:
  - Use a one-page, spoken, signed or visual brief. A fictional group rehearsal tests clarity but not
    actual shared commitment. Do not use the exercise to collect political preferences or override organizational
    authority.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Direction, vision, and priorities differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Direction, vision, and priorities
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a community workshop that wants newcomers to participate without confusion. The future
    condition is a newcomer can find, join and contribute to an event. Prepare a brief with destination,
    why it matters, current obstacle, no more than three priorities, non-priorities and a review date.
    Goal: Describe a meaningful future, explain its value and identify a small immediate priority set
    with explicit tradeoffs and a shared understanding check. Scope: Use a limited group project or fictional
    organization. This is not a mandate to impose a personal vision, predict the future or claim consensus
    from silence. Time and effort: Twenty minutes to draft direction, one 20-minute discussion and a short
    revised priority brief. Adaptation: Use a one-page, spoken, signed or visual brief. A fictional group
    rehearsal tests clarity but not actual shared commitment. Do not use the exercise to collect political
    preferences or override organizational authority. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a one-page, spoken, signed or visual brief. A fictional group rehearsal tests
    clarity but not actual shared commitment. Do not use the exercise to collect political preferences
    or override organizational authority.
  expected_burden: Twenty minutes to draft direction, one 20-minute discussion and a short revised priority
    brief.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Direction, vision, and priorities protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Direction, vision, and priorities action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a one-page,
    spoken, signed or visual brief. A fictional group rehearsal tests clarity but not actual shared commitment.
    Do not use the exercise to collect political preferences or override organizational authority.
  actions:
  - stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01-A1
    sequence: 1
    title: Describe the future in terms of who can do what
    instructions: 'Write the desired future as an observable experience rather than a slogan: a newcomer
      can find accurate information, enter accessibly and know how to contribute. Explain why that matters
      to the group’s legitimate purpose and identify who should help define it. Name one constraint and
      one competing good, such as volunteer time or maintaining the existing community. Do not assume
      your preferred future is worthwhile merely because you can state it confidently.


      Observation checks: The destination describes a concrete future experience; Its value is tied to
      a legitimate group purpose; Affected people can shape the direction; A constraint and competing
      good are explicit. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01
      action_stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01-A1
      competency_stable_id: '22.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2202_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2202_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_destination_describes_a_concrete_future_experience
        - its_value_is_tied_to_a_legitimate_group_purpose
        - affected_people_can_shape_the_direction
        - a_constraint_and_competing_good_are_explicit
      - measurement_id: c2202_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2202_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01-A2
    sequence: 2
    title: Choose a limited focus and say what will wait
    instructions: 'Select at most three immediate priorities that directly advance the destination, such
      as correcting event information, confirming the access route and assigning a welcome contact. For
      each, name the next action, owner and evidence of progress. Identify at least two attractive activities
      that will not be pursued now and explain the opportunity cost. A priority list that retains every
      project is not a choice.


      Observation checks: There are no more than three immediate priorities; Each has an action owner
      and progress signal; At least two non-priorities are explicit; Tradeoffs connect the focus to actual
      capacity. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01
      action_stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01-A2
      competency_stable_id: '22.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2202_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2202_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - there_are_no_more_than_three_immediate_priorities
        - each_has_an_action_owner_and_progress_signal
        - at_least_two_non_priorities_are_explicit
        - tradeoffs_connect_the_focus_to_actual_capacity
      - measurement_id: c2202_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2202_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01-A3
    sequence: 3
    title: Check whether others understand both direction and next step
    instructions: 'Ask willing participants to explain the destination and what they would do first in
      their own words. Listen for confusion or a different understanding of why the work matters, then
      revise the brief rather than blaming them for not absorbing the vision. Confirm ownership and a
      review trigger for changed conditions. Record unresolved disagreement separately from misunderstanding;
      a clear direction does not require pretending everyone endorses every tradeoff.


      Observation checks: Participants explain the destination and immediate focus; Confusion leads to
      a revised brief; Ownership and review conditions are confirmed; Disagreement is distinguished from
      lack of understanding. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Could a participant explain where the group is going and what not to do this week,
      and which tradeoff made that clarity possible?


      Examples: Supportive: Participants could state the newcomer experience and the three immediate actions,
      while optional publicity work was explicitly deferred.


      Mixed: The vision was understandable, but too many priorities competed; the group removed two and
      reassigned ownership.


      Contradictory: A leader’s slogan was treated as unquestionable direction or every attractive project
      remained a top priority.


      Inconclusive: A future statement was written without limited priorities, non-priorities or a shared
      understanding check.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01
      action_stable_id: PRACTICE-COMP-2202-DIRECTION-VISION-AND-PRIORITIES-01-A3
