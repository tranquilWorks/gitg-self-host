  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Pat accepts B for fifteen minutes and Lee accepts A for twenty. Ari declines the original C because
      only **5 minutes** remain available, reducing total capacity to **40**. Ari offers a narrower **C-lite**:
      act as the questions contact for this session and add the already approved sentence “Bring one paper
      map; questions go to Circle Desk.” Ari accepts that five-minute task; Circle Desk is a fictional
      role, not an address. A wider welcome script remains deferred. Noor records the changed scope and
      the group approves A, B and C-lite.


      Lee says the future is “a newcomer can find and join the session,” identifies A first and knows
      the logo/video wait. Pat initially says “we need a new logo first”; Noor removes the misleading
      brand wording and Pat then identifies the entrance confirmation. Pat still thinks publicity should
      resume next month. That view is disagreement about sequencing, not continuing misunderstanding.


      The revised estimate is **20 + 15 + 5 = 40 person-minutes**. Accepted ownership is present; completed
      tasks and actual newcomer participation are not. D and E remain non-priorities for this week, and
      the broader welcome script must be reconsidered at the stated review.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Turn a worthwhile destination into a limited focus that another person can explain. Spend twenty
      minutes on the fictional direction brief and fifteen on its revision. The work is to connect purpose,
      capacity and immediate choices. A memorable slogan can help communication, but it cannot settle
      whose needs matter, authorize a project or make competing commitments disappear.


      ### Describe a future people can recognize


      A destination states who should be able to do what under which conditions. “Become the best community
      group” is difficult to use when deciding between a new logo and clearer arrival information. “A
      newcomer can find the right session and know how to join it without guessing” makes the next obstacle
      visible. It still needs a legitimate purpose and the participation of people affected by the change.
      The ability to articulate a future does not entitle a leader to impose it.


      Ask why that experience matters and what another worthwhile goal might lose. Newcomer access may
      deserve attention while existing members also need continuity and volunteers need bounded work.
      A direction is stronger when it acknowledges those goods and proposes a defensible balance. Do not
      portray every objection as resistance to progress. A person can understand the destination and reasonably
      disagree about its cost or timing.


      A priority is a choice under constraint. For each proposed priority, show its next action, accepting
      owner and progress signal. Count effort as well as the number of headings. A list with three broad
      headings can conceal twenty projects. Distinguish preparatory evidence, such as verified information,
      from an eventual outcome, such as someone successfully participating. Neither a polished brief nor
      a completed task proves the destination has been reached.


      Non-priorities make opportunity cost inspectable. Naming something that was never seriously considered
      proves little. Identify attractive work that would use the same scarce time, explain why it waits
      and state when it might be reconsidered. Deferral is not a permanent judgment of worth. It is a
      boundary that stops today''s attractive extra from silently displacing today''s agreed essential.


      Ownership is also a constraint. A named person has not accepted responsibility merely because a
      leader wrote their name in a table. Check capacity, needed authority and dependencies. When an owner
      declines, reduce, resequence or renegotiate the work; do not make the capacity problem invisible.
      The person who sets priorities remains responsible for resolving the conflict rather than instructing
      the team to be more committed.


      Check understanding by asking for a fresh explanation: what future are we trying to create, what
      happens first and what waits? Repetition of your exact words can conceal confusion. If a person
      explains the destination but opposes a tradeoff, record disagreement rather than reteaching until
      they agree. If the wording creates the wrong task, revise the brief. A comprehension check is not
      a vote, consent receipt or evidence of enthusiasm.


      Review triggers keep direction responsive without making it arbitrary. A date gives a planned checkpoint;
      changed capacity or a blocked essential gives an earlier reason to reconsider. Preserve the destination
      unless the evidence challenges it, and be willing to change the immediate route. Explain what changed
      and why so people can stop obsolete work.


      ### Worked example


      A team says “welcome newcomers” but lists a new brand, video, directory overhaul, social campaign
      and entrance check as this week''s essentials. Only the entrance check addresses an immediate inability
      to join. After comparing capacity and affected people''s needs, the team can choose a smaller set
      and explicitly defer publicity. More visitors to a confusing process would not itself demonstrate
      better access.


      ### Supplied direction materials


      The fictional Atlas Circle exists to let people compare public maps together. Its members authorize
      Noor to propose this week''s preparation priorities; the group must confirm the final scope. A newcomer
      can currently find the date but not the entrance or a questions contact. Existing members want the
      already agreed **40-minute** session preserved. No event expansion or change in venue is authorized.


      Available preparation capacity is **60 person-minutes**. Candidate tasks are: **A**, correct the
      date/time/location notice, **20 minutes**, Lee tentatively available; **B**, confirm the venue''s
      approved entrance wording, **15**, Pat tentatively available; **C**, name a welcome contact and
      add participation instructions, **25**, Ari tentatively available; **D**, draw a new logo, **30**;
      **E**, make a promotional video, **45**. Estimates are supplied planning assumptions, not measured
      durations. A, B and C each serve the proposed newcomer experience. D and E may help later publicity
      but do not answer the missing joining questions.


      Proposed signals are: A has one current checked notice; B has venue-owner-confirmed access wording;
      C has an accepted questions role and a reader can say what to bring and whom to ask. The initial
      brief says “Make Atlas Circle bigger through a welcoming brand.” A reader may interpret that as
      publicity or expansion, neither of which is authorized. The review is **4 November 2026 at 16:00
      UTC**, sooner if an essential owner or fact is unavailable.


      ### Produce and revise a direction brief


      1. Replace the slogan with a concrete future experience and why it serves the Circle''s purpose.
      Name existing-member continuity and volunteer capacity as competing goods. Output: destination,
      value, constraint and who must shape or approve it.

      2. Select at most three priorities from A–E. Calculate effort, list next actions and provisional
      owners, and make D and E explicit candidates for deferral if you choose A–C. Output: an achievable
      proposed focus and at least two non-priorities with reasons.

      3. Write a plain-language request for ownership and a destination/first-step/non-priority understanding
      check. Save before the [later packet](?resource=file-later-packet-md). Output: proposed rather than
      presumed commitments.

      4. Incorporate the changed capacity and two supplied interpretations. Distinguish misunderstanding
      from disagreement. Output: a revised effort total, accepted owners, unresolved tradeoff and review
      trigger.


      ### Support, challenge and actual use


      A spoken brief, simple picture sequence or large-print task cards can replace a dense table. A harder
      case keeps capacity at forty minutes with no adequate substitute for C: state that the destination
      is only partly supported this week and seek a genuine scope/date decision. Do not claim that a missing
      welcome route exists. Real use requires the group''s legitimate decision process and affected people''s
      input; the fiction checks your reasoning, not collective commitment.


      ### Source use


      [Source S01](https://www.gov.uk/government/publications/civil-service-leadership-statement/civil-service-leadership-statement)
      illustrates clear purpose and direction. [GovS 002, S03](https://projectdelivery.gov.uk/library-products/government-functional-standard-govs-002-project-delivery/)
      contributes the bounded principle of decisions and responsibilities within governance. The cases,
      estimates and comprehension responses are original; neither source validates this miniature priority
      exercise.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A brief has three headings but fifteen simultaneous tasks exceeding capacity. Has it established
      a limited focus?

      2. A participant accurately explains the destination but wants a different sequence. Should the
      leader keep explaining until they agree?

      3. A volunteer declines a twenty-five-minute task but accepts a five-minute version. What must change
      in the brief?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Examine actual work and constraints beneath headings. Choose a feasible immediate set
      and state worthwhile work that waits.

      2. No. Separate comprehension from disagreement and use the legitimate decision process. Understanding
      is not consent or commitment.

      3. Record the reduced scope, new total effort, accepted ownership and deferred work. A shorter task
      may support part of the destination; it does not prove the original task was completed.'
    criteria:
