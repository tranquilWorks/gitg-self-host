meaning_and_fit:
  purpose: Use observation, useful questions, demonstration, proportionate challenge and encouragement
    to help a willing learner perform a small task with more capability.
  why_recommended: Use observation, useful questions, demonstration, proportionate challenge and encouragement
    to help a willing learner perform a small task with more capability.
  claims:
  - statement: Use observation, useful questions, demonstration, proportionate challenge and encouragement
      to help a willing learner perform a small task with more capability.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Coaching, mentorship, and development practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Coaching, mentorship, and development as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use oral, signed, visual or accessible text tasks and a smaller step. A fictional
    two-role rehearsal tests coaching preparation but not another person’s development. Feedback must
    be voluntary and must not expose private student, employee or client information.
  opportunity_considerations: Default to a learner writing a clear meeting reminder from five supplied
    facts. Use fictional material, a willing learner and a fixed check for accuracy, order and a usable
    contact route. The learner chooses whether to continue and can use accessibility supports.
  prerequisites:
  - Default to a learner writing a clear meeting reminder from five supplied facts. Use fictional material,
    a willing learner and a fixed check for accuracy, order and a usable contact route. The learner chooses
    whether to continue and can use accessibility supports.
  dependencies: []
  safe_alternatives:
  - Use oral, signed, visual or accessible text tasks and a smaller step. A fictional two-role rehearsal
    tests coaching preparation but not another person’s development. Feedback must be voluntary and must
    not expose private student, employee or client information.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Coaching, mentorship, and development differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Coaching, mentorship, and
    development as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a learner writing a clear meeting reminder from five supplied facts. Use fictional
    material, a willing learner and a fixed check for accuracy, order and a usable contact route. The
    learner chooses whether to continue and can use accessibility supports. Goal: Use observation, useful
    questions, demonstration, proportionate challenge and encouragement to help a willing learner perform
    a small task with more capability. Scope: This is educational coaching of a safe task, not clinical
    diagnosis, therapy, professional certification or a measure of the learner’s worth. Time and effort:
    A 15-minute learning conversation, one short demonstration and two comparable practice attempts. Adaptation:
    Use oral, signed, visual or accessible text tasks and a smaller step. A fictional two-role rehearsal
    tests coaching preparation but not another person’s development. Feedback must be voluntary and must
    not expose private student, employee or client information. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use oral, signed, visual or accessible text tasks and a smaller step. A fictional
    two-role rehearsal tests coaching preparation but not another person’s development. Feedback must
    be voluntary and must not expose private student, employee or client information.
  expected_burden: A 15-minute learning conversation, one short demonstration and two comparable practice
    attempts.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Coaching, mentorship, and development protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Coaching, mentorship, and development action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use oral, signed,
    visual or accessible text tasks and a smaller step. A fictional two-role rehearsal tests coaching
    preparation but not another person’s development. Feedback must be voluntary and must not expose private
    student, employee or client information.
  actions:
  - stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01-A1
    sequence: 1
    title: Locate the learning need through an attempt and questions
    instructions: 'Ask the learner what they want to improve and have them make a short first attempt.
      Compare it with the agreed criteria and ask what they were trying to do, where they felt uncertain
      and what feedback would be useful. Select one observable gap, such as burying the changed time in
      a long paragraph. Do not diagnose motivation, intelligence or a learning style from the error, and
      do not assume your preferred solution is the only competent one.


      Observation checks: The learner’s own goal is elicited; A real attempt reveals a specific gap; Questions
      explore reasoning and uncertainty; No identity or clinical diagnosis is inferred from performance.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01
      action_stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01-A1
      competency_stable_id: '22.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2206_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2206_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_learner_s_own_goal_is_elicited
        - a_real_attempt_reveals_a_specific_gap
        - questions_explore_reasoning_and_uncertainty
        - no_identity_or_clinical_diagnosis_is_inferred_from_performance
      - measurement_id: c2206_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2206_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01-A2
    sequence: 2
    title: Teach one correction and create a safe stretch
    instructions: 'Demonstrate a concise version that puts the changed time first and explain the reason.
      Ask the learner to adapt the principle to a different fictional event rather than copy your sentence.
      Offer a challenge slightly beyond the first attempt while keeping the task safe and supported. Give
      specific encouragement about a useful action and correction about a missed criterion; neither empty
      praise nor humiliation supplies informative feedback.


      Observation checks: One correction is demonstrated with a reason; The learner adapts rather than
      copies the example; The stretch is manageable and supported; Encouragement and correction are specific
      to observable work. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01
      action_stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01-A2
      competency_stable_id: '22.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2206_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2206_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_correction_is_demonstrated_with_a_reason
        - the_learner_adapts_rather_than_copies_the_example
        - the_stretch_is_manageable_and_supported
        - encouragement_and_correction_are_specific_to_observable_work
      - measurement_id: c2206_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2206_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2206-COACHING-MENTORSHIP-AND-DEVELOPMENT-01-A3
    sequence: 3
    title: Step back for a retry and ask what support should remain
    instructions: 'Let the learner complete a new comparable reminder with their preferred aids, then
      check the fixed criteria together. Ask them to explain what they changed and when the principle
      might not apply. Identify a next practice opportunity and what support they still want. Record the
      observed change without claiming independence if you supplied the answer throughout, and do not
      make the learner’s gratitude the measure of your mentoring.


      Observation checks: A new comparable task is completed; The learner explains the correction and
      a limit; Observed capability is separated from coach-provided answers; The next opportunity and
      remaining support are jointly chosen. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What can the learner now explain and do that they could not do in the first attempt,
      and what support remains genuinely useful?


      Examples: Supportive: The learner placed the changed time clearly in a new reminder and explained
      why it mattered, using a retained checklist.


      Mixed: The second result improved but relied on repeated prompts, so the coach kept the independence
      claim limited and planned another attempt.


      Contradictory: The coach labeled the learner’s character, used humiliation or treated praise and
      gratitude as proof of development.


      Inconclusive: Advice was given without observing a gap, demonstrating a correction or checking a
      learner-led retry.'
    expected_time: 15-25 minutes
    due_within_days: 10
