  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Tess explains that both times were included to show the history and that nobody had explained which
      instruction the reader should follow. Oren uses MODEL and asks Tess to foreground the change and
      remove the obsolete instruction. Tess''s revised R1 reads: “New time: 18:30–19:00 UTC. Paper Globe
      review, 12 November 2026, Cedar Center, Birch Room. Questions: Globe Desk.” It meets all seven checks
      after coaching.


      With the checklist available and Oren silent, Tess writes R2: “Paper Compass has moved to Willow
      Room at Cedar Center. Join on 14 November 2026, 16:00–16:40 UTC. Questions: Compass Desk.” It also
      meets seven checks. Oren did not supply these words. This is a fresh fictional attempt with a retained
      aid, not unaided performance or proof of retention.


      Tess says, “Put the fact that changes the reader''s action early; if nothing changed, the event
      purpose might come first.” Tess requests one more independent draft next week, with optional feedback
      afterward. Oren agrees to offer a practice opportunity but none has occurred. No reminder was delivered,
      recipient comprehension checked or long-term development measured.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Help a learner improve a reminder, then check a fresh attempt without supplying the answer.
      Allow twenty minutes for diagnosis and teaching and ten for a transfer review. All learner responses
      below are supplied fiction. You can rehearse the coach''s choices alone; do not recruit someone
      into assessment or treat a subordinate''s gratitude as evidence of development.


      ### Find the learning need in the work


      Coaching begins with the learner''s purpose and a sample, not your favorite advice. Ask what they
      want to improve, what they were trying to do and which feedback would help. Compare the attempt
      with agreed criteria. A missing changed time may reflect an unclear task, a source-reading gap or
      a presentation choice; one error cannot diagnose intelligence, motivation or a learning style. Keep
      the initial explanation open until the learner supplies relevant context.


      Choose a tractable gap. Correcting every stylistic preference at once can obscure the useful principle.
      If the reader must act on a changed time, help the learner make that change prominent while keeping
      all required facts accurate. Accuracy, intelligibility and a usable questions route matter more
      than copying your sentence. Define what remains fixed and where alternative competent methods are
      welcome.


      Questions and demonstration serve different needs. “What would the reader need first?” may expose
      the learner''s reasoning. If they do not yet know how to reorganize the facts, a concise model with
      an explanation is more useful than endless questioning. Demonstrate on a separate example, then
      ask them to adapt the principle. Record how much help you supplied; a coached correction is useful
      progress but differs from a fresh performance without answer hints.


      Challenge should be slightly beyond the current attempt and remain safe. A new event with a changed
      room tests whether the learner understood relevance, rather than memorized “always put the time
      first.” Explain that the most action-relevant fact varies with the situation. Offer encouragement
      tied to an observable action, such as preserving the correct date while moving the changed room
      earlier. Empty praise does not identify a reusable choice, and humiliation adds no useful instructional
      information.


      Mentorship can extend beyond this small skill. Ask about a wanted next opportunity, help the person
      understand relevant pathways and connect them with willing support within your actual role. Do not
      promise access you cannot grant or make continued help depend on loyalty. The learner should gradually
      have more useful choices, including the choice to stop, seek another mentor or retain supports that
      work for them.


      Independence is specific to task and conditions. A checklist, calculator or accessible format may
      remain part of competent independent work. If the coach dictates the content throughout, however,
      the final artifact cannot show that the learner generated it. Keep the aid, prompt, demonstration
      and answer contribution distinguishable. Compare attempts against the same criteria, allowing a
      different valid style without quietly lowering the standard.


      Finish with the learner''s explanation of what changed, a limit on the principle and a realistic
      next opportunity. A correct paper response is not proof of long-term retention, a delivered message
      or general capability. If the fresh attempt still fails, select the next teaching step rather than
      relabeling the result as success. Development is supported by an honest record of the gap and a
      tolerable way to practice again.


      ### Worked example


      A coach models a reminder that puts a changed venue first and explains that readers might otherwise
      travel to the old location. The learner''s next case changes only the date. Copying the model''s
      exact wording would be wrong; applying its principle means putting the date change where the reader
      can find it. The coach can recognize this transfer without claiming the learner can now handle every
      communication problem.


      ### Complete learning materials


      Fictional learner Tess says: “I want people to notice the change without losing the other facts.
      Please tell me one thing to work on at a time.” Tess wants written feedback and may use a five-fact
      checklist. Coach Oren has agreed to help with this harmless drafting task. The five required fact
      categories are event, date, time, place and contact. In a change notice the changed fact must also
      be prominent; no obsolete instruction may remain. These create **seven checks**: five correct categories,
      prominent change, no obsolete instruction.


      First case **R1**: Paper Globe review; **12 November 2026**; time changed from **18:00 to 18:30–19:00
      UTC**; Cedar Center, Birch Room; questions to **Globe Desk**. Tess''s initial attempt is: “We are
      looking forward to seeing everyone and comparing ideas at the Paper Globe review at Cedar Center,
      Birch Room on 12 November. Questions go to Globe Desk. We will start at 18:00 as usual. There has
      been a time adjustment to 18:30–19:00 UTC.” Both contradictory time instructions are present and
      the change is buried.


      Separate demonstration **MODEL**: Map Cards; **13 November**, **17:00–17:30 UTC**; room changed
      from Oak to Elm at Cedar Center; contact Map Desk. Oren''s example is: “Room changed to Elm at Cedar
      Center. Map Cards meets 13 November, 17:00–17:30 UTC. Questions: Map Desk.” The explanation is that
      a reader should not travel to Oak. MODEL does not supply the answer to R1.


      Fresh case **R2**: Paper Compass; **14 November 2026**, **16:00–16:40 UTC**; room changed from Birch
      to Willow at Cedar Center; contact Compass Desk. Tess may keep the checklist, but Oren must not
      dictate R2''s wording. All contacts are fictional role labels. Nothing is sent.


      ### Diagnose, teach and check transfer


      1. Inspect R1 using the seven checks. Ask Tess about the goal of including both times; use the later
      account only after saving your own diagnosis question. Output: one evidence-based gap, with no character
      diagnosis.

      2. Use MODEL to explain prominence and removal of obsolete instructions. Invite Tess to revise R1
      in their own words. Output: a bounded teaching move, informative encouragement and clear help record.

      3. Save your plan before the [later packet](?resource=file-later-packet-md). Judge R1 revision and
      R2 independently against all seven checks. Output: results distinguishing supported correction from
      fresh generation with a checklist.

      4. Ask where the principle might change and what practice Tess wants next. Output: a learner-owned
      next opportunity and a narrow progress claim that preserves remaining uncertainty.


      ### Support and further use


      A screen reader, signed explanation, speech-to-text or reordered fact cards can preserve the criteria.
      A harder version supplies two contradictory purported approvals; the learner should ask for authority
      rather than write a confident notice. In actual coaching obtain willing participation, protect work
      samples and keep career or professional advice within your competence. No learning opportunity,
      mentorship relationship or real capability is inferred from this rehearsal.


      ### Source use


      [OPM Mentoring and Coaching, S04](https://www.opm.gov/policy-data-oversight/performance-management/performance-management-and-accountability-playbook/mentoring-and-coaching/),
      distinguishes immediate skill-focused coaching from broader developmental mentoring. Only that framing
      is used. Its general benefits are not treated as measured outcomes of these original fictional attempts.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


