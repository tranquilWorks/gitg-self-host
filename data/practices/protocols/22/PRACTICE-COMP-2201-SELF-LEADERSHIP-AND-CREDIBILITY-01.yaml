meaning_and_fit:
  purpose: Make influence credible through preparation, regulated conduct and ownership of your own shortfall
    rather than relying on a title or a polished image.
  why_recommended: Make influence credible through preparation, regulated conduct and ownership of your
    own shortfall rather than relying on a title or a polished image.
  claims:
  - statement: Make influence credible through preparation, regulated conduct and ownership of your own
      shortfall rather than relying on a title or a polished image.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Self-leadership and credibility practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Self-leadership and credibility as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a peer-led volunteer task, accessible written meeting or private fictional
    rehearsal when no leadership role exists. Do not pressure a subordinate to evaluate you or disclose
    private organizational material. Emotional regulation means accountable conduct, not suppression or
    accepting abuse.
  opportunity_considerations: Default to leading a short planning meeting where you expect others to arrive
    prepared and state uncertainty honestly. Choose one visible standard, such as bringing the current
    facts and identifying what is unverified. Prepare the same materials and limits you intend to ask
    of participants.
  prerequisites:
  - Default to leading a short planning meeting where you expect others to arrive prepared and state uncertainty
    honestly. Choose one visible standard, such as bringing the current facts and identifying what is
    unverified. Prepare the same materials and limits you intend to ask of participants.
  dependencies: []
  safe_alternatives:
  - Use a peer-led volunteer task, accessible written meeting or private fictional rehearsal when no leadership
    role exists. Do not pressure a subordinate to evaluate you or disclose private organizational material.
    Emotional regulation means accountable conduct, not suppression or accepting abuse.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Self-leadership and credibility differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Self-leadership and credibility
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to leading a short planning meeting where you expect others to arrive prepared and state
    uncertainty honestly. Choose one visible standard, such as bringing the current facts and identifying
    what is unverified. Prepare the same materials and limits you intend to ask of participants. Goal:
    Make influence credible through preparation, regulated conduct and ownership of your own shortfall
    rather than relying on a title or a polished image. Scope: Use a low-stakes group responsibility or
    a fictional leadership rehearsal. This is not a measure of charisma, authority, personality or general
    leadership effectiveness. Time and effort: Fifteen minutes to choose the standard, one ordinary group
    interaction and a 15-minute follow-up. Adaptation: Use a peer-led volunteer task, accessible written
    meeting or private fictional rehearsal when no leadership role exists. Do not pressure a subordinate
    to evaluate you or disclose private organizational material. Emotional regulation means accountable
    conduct, not suppression or accepting abuse. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a peer-led volunteer task, accessible written meeting or private fictional
    rehearsal when no leadership role exists. Do not pressure a subordinate to evaluate you or disclose
    private organizational material. Emotional regulation means accountable conduct, not suppression or
    accepting abuse.
  expected_burden: Fifteen minutes to choose the standard, one ordinary group interaction and a 15-minute
    follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Self-leadership and credibility protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Self-leadership and credibility action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a peer-led
    volunteer task, accessible written meeting or private fictional rehearsal when no leadership role
    exists. Do not pressure a subordinate to evaluate you or disclose private organizational material.
    Emotional regulation means accountable conduct, not suppression or accepting abuse.
  actions:
  - stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A1
    sequence: 1
    title: Translate the expected standard into your own observable behavior
    instructions: 'Write exactly what you expect from others and the purpose it serves. Apply it to yourself:
      check the source facts, prepare a short agenda and mark unresolved questions before the meeting.
      Identify where your role gives you an easy exemption, such as arriving late without explanation
      or changing the task after others prepare. Choose one such exemption to remove, while preserving
      legitimate differences in responsibility rather than pretending every role is identical.


      Observation checks: The standard has a stated practical purpose; Your own preparation meets the
      same relevant expectation; A role-based double standard is identified; Legitimate role differences
      are distinguished from convenience. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01
      action_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A1
      competency_stable_id: '22.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2201_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2201_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_standard_has_a_stated_practical_purpose
        - your_own_preparation_meets_the_same_relevant_expectation
        - a_role_based_double_standard_is_identified
        - legitimate_role_differences_are_distinguished_from_convenience
      - measurement_id: c2201_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2201_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A2
    sequence: 2
    title: Model the response when something does not go to plan
    instructions: 'During the interaction, state a real uncertainty or correct a small factual mistake
      without blaming a participant. When challenged, pause, ask what evidence you missed and respond
      to the issue rather than status. Do not manufacture an error or provoke conflict for the exercise.
      If the standard was not met by you, acknowledge the specific effect and name the repair you control
      instead of giving a speech about accountability.


      Observation checks: A natural uncertainty or error is handled honestly; Challenge is addressed without
      a status defense; No conflict or mistake is staged; Any personal shortfall receives a specific owned
      repair. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01
      action_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A2
      competency_stable_id: '22.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2201_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2201_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_natural_uncertainty_or_error_is_handled_honestly
        - challenge_is_addressed_without_a_status_defense
        - no_conflict_or_mistake_is_staged
        - any_personal_shortfall_receives_a_specific_owned_repair
      - measurement_id: c2201_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2201_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A3
    sequence: 3
    title: Follow through and check what your conduct taught
    instructions: 'Complete the promised correction or preparation change and inform the affected people
      through the ordinary channel. Ask a willing peer a narrow question about clarity or reliability,
      not whether they admire you. Compare your behavior with the standard you requested and record one
      inconsistency still needing work. An agreeable meeting does not prove leadership credibility; the
      evidence is the conduct and repair that others could actually observe.


      Observation checks: The promised repair is completed or its status is explicit; Feedback concerns
      observable conduct rather than admiration; Your behavior is compared with the stated standard; Remaining
      inconsistency is not hidden by a positive impression. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What did your behavior authorize others to do, and did you remove the exemption you
      would have disliked in someone else?


      Examples: Supportive: The leader arrived with checked facts, acknowledged an uncertainty and completed
      a promised correction before asking others for the same discipline.


      Mixed: Preparation was good, but a defensive reply undercut the standard; the leader repaired that
      specific interaction.


      Contradictory: The leader demanded accountability while hiding their own error or used feedback
      to obtain admiration from dependent participants.


      Inconclusive: Leadership values were announced without an observable self-standard or follow-through.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01
      action_stable_id: PRACTICE-COMP-2201-SELF-LEADERSHIP-AND-CREDIBILITY-01-A3
