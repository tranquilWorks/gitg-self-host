      - [Developing Performance Standards](https://www.opm.gov/policy-data-oversight/performance-management/reference-materials/articles/developing-performance-standards/)

      - [OECD Public Integrity Handbook: Openness](https://www.oecd.org/en/publications/oecd-public-integrity-handbook_ac8ed8e8-en/full-report/openness_b1c18876.html)

      - [CERC: Introduction](https://www.cdc.gov/cerc/media/pdfs/CERC_Introduction.pdf)

      - [Knowledge Management](https://www.nasa.gov/learning-resources/for-professionals/appel-knowledge-management/)

      - [Identifying and managing conflicts of interest in a charity](https://www.gov.uk/government/publications/identifying-and-managing-conflicts-of-interest-in-a-charity-cc29/conflicts-of-interest-a-guide-for-charity-trustees)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Mira''s actual fictional response begins, “You could have reminded me earlier,” before she pauses
      and checks v2. She then says, “I used the wrong version and treated an estimate as confirmed. Blaming
      you was unfair. I will fix both copies by 10:30.” Preserve the defensive opening and the specific
      conduct repair.


      PLAN-SHARED is corrected at **10:20**. Mira forgets the paper card until **10:45**, then replaces
      it and tells Dev and Ren that the second correction was late. Both now show **18:30–19:00** and
      **8–12 estimated**, with v2 as source. The full repair was completed **15 minutes after** the promise,
      not at the first copy''s correction time.


      Ren''s supplied answer is: “I can now use 18:30 as the start and treat attendance as an estimate.
      I still need you to check every copy before saying the repair is done.” Ren does not rate trust
      or emotional regulation. No actual meeting, peer response or later pattern was observed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Apply a preparation standard to your own conduct, handle a challenge and complete an owned
      repair. Allow fifteen minutes to prepare the supplied planning meeting and fifteen minutes to review
      its later record. The case asks what other people could reasonably rely on after observing your
      behavior. It does not ask whether you look like a leader, seem calm or receive admiration.


      ### Make the standard visible in your own work


      A useful self-standard has a purpose and an observable expression. “Be professional” leaves people
      guessing. “Bring the current approved facts and label anything still unconfirmed” protects a planning
      decision from an avoidable error. Before requiring this of others, do the same preparation yourself:
      identify the authoritative version, check what changed and make uncertainty easy to see. Preparation
      is part of credibility because it reduces the burden others must carry to correct you.


      Roles may legitimately differ. A chair can own the agenda while a venue steward owns access facts.
      Applying one standard fairly does not mean everyone must produce identical materials or reveal identical
      information. Ask whether an exemption protects a real responsibility or merely your convenience.
      A chair''s authority to make the final agenda does not excuse using an obsolete source while criticizing
      someone else for questioning it.


      Emotional regulation concerns your conduct under pressure. You can feel embarrassed, disappointed
      or annoyed without making another person pay for the feeling. A short pause, a clarifying question
      and a correction to the shared record are observable actions. A quiet voice alone proves little:
      it can accompany dismissal or a threat. Nor must someone endure abuse to demonstrate composure.
      Pause or use the appropriate support route if the interaction exceeds an ordinary disagreement.


      Responsibility means owning the action and its consequence precisely. “Mistakes were made” hides
      the actor. “I copied the old time; that made the plan ambiguous; I will correct both copies by noon”
      identifies a controllable repair. Do not take responsibility for facts you cannot verify, promise
      that nobody was affected, or turn an apology into a demand for reassurance. The affected person
      can accept the correction without certifying your character.


      A repaired mistake remains part of the record. Erasing it loses the evidence needed to learn why
      the failure occurred. Keep the original version, correction and completion status separate. If a
      promise slips, state that explicitly and provide a revised owner or time within your authority.
      Announcing a repair does not complete it. A bounded follow-through check is more informative than
      a speech about your values.


      Credibility is relational and develops across occasions. A peer''s answer about which time is now
      usable can support a narrow clarity claim. It cannot establish that everyone trusts you, that your
      emotional habits changed or that a dependent colleague felt free to criticize you. Ask a willing
      peer about an observable feature, not whether they respect you. When real feedback could affect
      someone''s standing, use fiction instead of turning the practice into a loyalty test.


      ### Worked example


      A coordinator asks everyone to distinguish confirmed facts from estimates, then states an unconfirmed
      headcount as settled. A colleague questions the number. The coordinator pauses and says it is an
      estimate, marks it accordingly and updates the planning note. This corrects the information. If
      the coordinator first mocked the colleague, a numerical correction alone would leave the interpersonal
      shortfall unrepaired. The two responsibilities need separate attention.


      ### Complete fictional meeting packet


      Mira chairs a **10-minute** planning check on **3 November 2026 at 10:00 UTC**. Dev owns approved
      event facts. Ren is a willing peer reviewer with no reporting relationship to Mira. Their standard
      is: use the current source, distinguish confirmed from provisional information and correct a mismatch
      where the team will see it. The meeting aims to allocate two preparation tasks, not approve new
      venue facts.


      Source **FACTS-v2**, approved by Dev at **09:00**, states: the Map Table session is **6 November,
      18:30–19:00 UTC, Cedar Center, Elm Room**; attendance estimate **8–12**, not confirmed; no materials
      purchase is authorized. Superseded **FACTS-v1** says **18:00–18:30**, with the same location. Mira''s
      draft **PLAN-v1** reads: “Map Table, 6 November, 18:00 start; 12 attending. Dev checks room wording;
      Ren drafts the welcome note.” Dev and Ren have accepted those preparation tasks, but not the inaccurate
      facts in PLAN-v1.


      Mira''s agenda allocates **2 minutes** to source/status, **5** to responsibilities and **3** to
      unresolved questions. Dev''s supplied challenge is: “The approved v2 begins at 18:30, and twelve
      is an estimate. Which record are we using?” Mira has not yet answered. There are exactly two fictional
      copies to repair if needed: PLAN-SHARED and the paper meeting card. No message is sent outside this
      rehearsal.


      ### Prepare, respond and follow through


      1. Compare PLAN-v1 with both source cards. Mark each error and uncertainty. Apply the expected standard
      to Mira''s agenda and record one convenience-based exemption to remove. Output: a corrected preparation
      draft and a reason for the standard.

      2. Write Mira''s response to Dev: pause, acknowledge the evidence, own the specific shortfall and
      promise only a controllable repair. Include any needed conduct repair without asking Dev for forgiveness
      or praise. Output: a short response and two-copy correction plan with a deadline.

      3. Save the response before the [later packet](?resource=file-later-packet-md). Inspect what was
      actually corrected and when. Output: a promise-versus-performance record retaining lateness and
      the original misstatement.

      4. Ask the supplied peer question, “Which start time and attendance status can you now use?” Compare
      the answer with the facts. Output: a narrow finding and one remaining inconsistency to address at
      the next preparation check.


      ### Accessible practice and greater difficulty


      A written exchange, signed response, pause card or source comparison read aloud can serve the same
      purpose; speed of speech is not a criterion. A harder variation has Dev unavailable to approve a
      new fact: label it unresolved and defer only the dependent decision. Do not invent approval to appear
      decisive. For real transfer, choose one ordinary responsibility you actually hold, without staging
      an error or provoking a colleague. Look for repeated conduct over time before expanding a credibility
      claim.


      ### Source use


      The [Civil Service Leadership Statement, S01](https://www.gov.uk/government/publications/civil-service-leadership-statement/civil-service-leadership-statement),
      supplies a narrow example of linking leadership expectations to modeled conduct and candid communication.
      Its institutional statement is not a validated credibility scale or proof that this fictional repair
      builds trust.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


