  - stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01-A2
    sequence: 2
    title: Design one reinforcing change with a misuse check
    instructions: 'With permission, add a brief pre-deadline risk check where each task can be marked
      ready, missing input or needing a decision. Assign an owner to resolve a raised issue and recognize
      useful early information rather than merely positive status. Check that the change does not reward
      invented problems, punish honest estimates or add burdensome reporting. Identify which selection
      or promotion-related assumptions would need a separate authorized review rather than changing them
      informally.


      Observation checks: A small change supports the desired behavior; Raised issues have an accountable
      response owner; Gaming burden and punishment risks are considered; Formal selection or promotion
      changes remain properly authorized. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01
      action_stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01-A2
      competency_stable_id: '22.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
