      - [Developing Performance Standards](https://www.opm.gov/policy-data-oversight/performance-management/reference-materials/articles/developing-performance-standards/)

      - [OECD Public Integrity Handbook: Openness](https://www.oecd.org/en/publications/oecd-public-integrity-handbook_ac8ed8e8-en/full-report/openness_b1c18876.html)

      - [CERC: Introduction](https://www.cdc.gov/cerc/media/pdfs/CERC_Introduction.pdf)

      - [Knowledge Management](https://www.nasa.gov/learning-resources/for-professionals/appel-knowledge-management/)

      - [Identifying and managing conflicts of interest in a charity](https://www.gov.uk/government/publications/identifying-and-managing-conflicts-of-interest-in-a-charity-cc29/conflicts-of-interest-a-guide-for-charity-trustees)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      At the **12:00** check, Bea flags the missing venue approval and Iri requests the optional-item
      decision. Sol marks ready. Val accepts the approval check; Emi accepts the agenda decision. Both
      respond at **12:30**: Val confirms the venue wording, and Emi excludes the optional item to preserve
      the agreed duration. The two dependencies surfaced **four hours before** the deadline and received
      a disposition after **thirty minutes**.


      Because the proposed point rule rewards every report, the sheet also gets three duplicates of Bea''s
      same missing-approval issue. There are **five reports but only two distinct issues**. The ritual
      consumes **9 person-minutes** rather than the planned **6**. No one supplies evidence that the duplicates
      improved the decision.


      Emi removes the per-report points with group agreement and retains recognition for useful information
      and responsible closure. The council agrees to review whether role selection should consider candor
      and follow-through; it has not changed selection or progression criteria. All three deliverables
      remain in progress. This cycle shows earlier visible dependencies and a repaired incentive, not
      improved on-time completion, causal culture change or personnel reform.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Trace what a group''s ordinary systems reward, then test one authorized change to early problem
      reporting. Allow twenty minutes to map the fictional system and fifteen to review the next cycle.
      The task concerns mechanisms that make conduct easier or harder. A slogan, new form or lively discussion
      does not show that an institution''s culture has changed.


      ### Look beyond the announced value


      A stated norm describes what the group says should happen. An enacted norm is suggested by repeated
      responses: who gets praised, interrupted, included or excused. One incident can identify a hypothesis,
      but it cannot establish the whole culture. Ask which system could repeatedly produce the observed
      behavior and what contrary evidence would weaken that explanation.


      Incentives include more than pay. Visibility, relief from awkward questions, access to interesting
      work and the leader''s approval can all matter. A team that says “raise risks early” but celebrates
      only green status may make silence attractive. The person who reports a problem carries a visible
      burden while the person who hides it looks successful until the deadline. Do not conclude that every
      late problem was deliberately concealed; inspect information, expectations and capacity.


      Rituals organize attention. A brief pre-deadline check can invite a missing input before it becomes
      a failure, but only if someone can act on it. A form with no decision owner merely records blockage.
      Design an information route from the person who sees the issue to someone with authority to resolve
      it, then back to the reporter. State the response time and what to do if the owner cannot answer.


      Selection and progression teach what the institution values. Who is chosen to lead a visible task?
      What evidence matters for the next role or promotion? If only uninterrupted success stories count,
      people who disclose uncertainty may be disadvantaged. Review these assumptions through the legitimate
      governance or personnel process. Do not use an informal experiment to change hiring, advancement,
      pay or access to protected opportunities.


      Consequences matter after both candor and failure. Useful reporting should receive attention and
      an appropriate response, while avoidable concealment or harmful conduct may need an authorized process.
      Rewarding the number of reports can create another distortion: trivial or invented issues become
      a route to recognition. Prefer relevant information and resolution over raw volume, and preserve
      the distinction between a good-faith estimate and an unfulfilled commitment.


      A small intervention should specify the mechanism, burden and expected observation. For example,
      adding “ready / missing input / decision needed” plus an owner may expose a missing approval earlier.
      Check whether the issue was actually acted on, how much effort the ritual cost and whether participants
      began producing reports merely to look engaged. Do not quietly add surveillance or personal rankings
      under the language of openness.


      Review causality cautiously. A problem surfaced after the new ritual, but this could also reflect
      the task, participants or a source change. One cycle can show feasibility and a specific response;
      it cannot demonstrate a durable cultural shift. Use the observation to revise the mechanism, identify
      which other system would need authorized attention and decide whether further testing is worthwhile.


      ### Worked example


      A group introduces a “risk champion” award for the most reports. The next review contains five copies
      of one missing-room question. Reporting increased, but useful information did not increase fivefold.
      The group can retain an early check while removing the volume contest, recognizing a precise warning
      and its responsible resolution instead. The revision follows the mechanism rather than assuming
      more activity means more integrity.


      ### Complete fictional system map


      The Paper Almanac group is preparing three items due at **16:00 on 20 November 2026**: a session
      notice, a welcome script and a paper agenda. Coordinator Emi may change this cycle''s check-in ritual
      with the group''s approval. A separate three-member council owns role selection and progression
      rules; Emi cannot change them alone.


      The supplied system facts are: the stated **norm** is “tell us early when an input is missing.”
      The **incentive** is public praise for every all-green status. The **ritual** is a deadline-day
      question, “All good?” The **information route** puts venue approvals only on Emi''s paper board;
      writers sometimes see them late. **Selection** for the next visible coordinator task uses a tally
      of on-time deliverables only. **Progression** to regular facilitator is decided by the council,
      but its criteria are undocumented in this case. The **consequence** in one prior cycle was that
      a reporter was called negative, while a late surprise got no inquiry. These facts support a mechanism
      hypothesis, not a verdict about all members.


      This cycle''s original records are: notice owner Bea has event/date/time but lacks the venue approval;
      script owner Sol has all approved inputs; agenda owner Iri needs Emi to decide whether an optional
      five-minute item is included. Bea, Sol and Iri have accepted their tasks. Emi and venue steward
      Val are available at **12:30**. The group permits a **12:00** pre-deadline check using one line
      per task: status, missing fact or decision, accepted resolution owner and response time. No private
      performance ranking is authorized.


      The proposed recognition rule says “one point for every risk report.” Keep it visible as a design
      choice to evaluate, not an endorsed reward. The intended useful result is early identification and
      timely disposition of actual dependencies. Measure report count separately from distinct issues,
      resolution and reporting burden.


      ### Map, test and revise the mechanism


      1. Fill all seven system headings from the supplied facts, marking the unknown progression criteria
      honestly. Link one plausible incentive to one behavior. Output: a mechanism map without a whole-culture
      diagnosis.

      2. Design the permitted pre-deadline check, route and ownership. State what would count as a useful
      warning and why a volume reward might distort it. Output: a bounded change, prediction and burden
      check.

      3. Save before the [later packet](?resource=file-later-packet-md). Inspect distinct issues, time
      surfaced, ownership, response and repeat reporting. Output: a cycle result separate from the raw
      report count.

      4. Revise one unintended incentive and propose a legitimate council review of selection/progression.
      Output: what changes now, what needs separate authority and what remains untested.


      ### Support and broader use


      Use an accessible paper, spoken or shared-text check; a particular software tool is unnecessary.
      A harder variation makes the resolution owner unavailable: identify escalation or keep the dependency
      open rather than praising the report as solved. Real use requires permission, minimal data and a
      proportionate workload. Do not introduce covert monitoring or alter personnel consequences through
      a learning exercise.


      ### Source use


      [OECD leadership, S02](https://www.oecd.org/en/publications/oecd-public-integrity-handbook_ac8ed8e8-en/full-report/leadership_1aa35fa2.html),
      highlights selection, incentives and accountability. [OECD openness, S06](https://www.oecd.org/en/publications/oecd-public-integrity-handbook_ac8ed8e8-en/full-report/openness_b1c18876.html),
      highlights responsive channels. These selected principles inform the system map; no country model,
      underlying study or causal effect is claimed reproduced.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A group says it values candor but selects visible leaders using only all-green reports. Which
      system relationship deserves review?

      2. Five reports contain three duplicates of one issue and one other issue. Has useful information
      increased fivefold?

      3. A coordinator tests a check-in ritual and the council agrees to review promotion criteria. What
      has changed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Compare stated norms with incentives, information and selection. The mismatch supports a
      mechanism to investigate, not a conclusion that every person is dishonest.

      2. No. There are two distinct issues. Check relevance, response and burden separately from volume;
      a reward for count may produce duplication.

      3. Only the authorized ritual and any explicitly approved recognition change. A review commitment
      is not a changed progression policy or proof of institutional culture change.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
