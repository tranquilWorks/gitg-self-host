  - stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01-A3
    sequence: 3
    title: Trial the mechanism and inspect the behavior it produces
    instructions: 'Use the next permitted low-stakes cycle or a tabletop example. Record whether a missing
      input surfaced earlier, whether anyone acted on it and whether the discussion stayed factual. Ask
      participants what the new ritual rewarded in practice and revise one unintended incentive. Keep
      the observation limited to this cycle; a new form or meeting question does not prove that the institution’s
      culture has changed.


      Observation checks: A cycle or labeled tabletop test is completed; Early information and the response
      to it are both observed; Participants can identify unintended incentives; A limited process result
      is not called cultural transformation. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What behavior did the system reward after the change, and which old signal still contradicts
      the value you say the group holds?


      Examples: Supportive: The risk check surfaced a missing approval early and an owner resolved it,
      while the group recognized the useful warning.


      Mixed: The new ritual produced many vague risks but little action; the group added clear ownership
      rather than praising reporting volume.


      Contradictory: The leader used the system to surveil people, reward invented problems or change
      personnel consequences without authority.


      Inconclusive: Culture was discussed through slogans without changing or testing a norm, incentive
      or information route.'
