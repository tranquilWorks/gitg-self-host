meaning_and_fit:
  purpose: Align a group’s norms, incentives, rituals, information flow, selection and consequences with
    one concrete desired behavior.
  why_recommended: Align a group’s norms, incentives, rituals, information flow, selection and consequences
    with one concrete desired behavior.
  claims:
  - statement: Align a group’s norms, incentives, rituals, information flow, selection and consequences
      with one concrete desired behavior.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Culture and institutional design practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Culture and institutional design as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible asynchronous status, a small peer group or fictional organization.
    Avoid employee surveillance, individual rankings or collection of sensitive personnel information.
    Actual incentive, hiring and promotion systems require appropriate governance and legal review.
  opportunity_considerations: Default to a volunteer group that says it values early problem reporting
    but celebrates only on-time completion. Choose the desired behavior of raising a missing input before
    a deadline. Prepare a system map with stated norm, rewarded behavior, meeting ritual, information
    route, role selection, progression and consequence.
  prerequisites:
  - Default to a volunteer group that says it values early problem reporting but celebrates only on-time
    completion. Choose the desired behavior of raising a missing input before a deadline. Prepare a system
    map with stated norm, rewarded behavior, meeting ritual, information route, role selection, progression
    and consequence.
  dependencies: []
  safe_alternatives:
  - Use accessible asynchronous status, a small peer group or fictional organization. Avoid employee surveillance,
    individual rankings or collection of sensitive personnel information. Actual incentive, hiring and
    promotion systems require appropriate governance and legal review.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Culture and institutional design differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Culture and institutional
    design as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a volunteer group that says it values early problem reporting but celebrates only
    on-time completion. Choose the desired behavior of raising a missing input before a deadline. Prepare
    a system map with stated norm, rewarded behavior, meeting ritual, information route, role selection,
    progression and consequence. Goal: Align a group’s norms, incentives, rituals, information flow, selection
    and consequences with one concrete desired behavior. Scope: Use an authorized low-stakes group process
    or fictional design. This is not permission to alter employment selection, promotion, compensation
    or disciplinary rules without the proper authority. Time and effort: Twenty minutes to audit the system,
    one small permitted trial and a 20-minute review. Adaptation: Use accessible asynchronous status,
    a small peer group or fictional organization. Avoid employee surveillance, individual rankings or
    collection of sensitive personnel information. Actual incentive, hiring and promotion systems require
    appropriate governance and legal review. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible asynchronous status, a small peer group or fictional organization.
    Avoid employee surveillance, individual rankings or collection of sensitive personnel information.
    Actual incentive, hiring and promotion systems require appropriate governance and legal review.
  expected_burden: Twenty minutes to audit the system, one small permitted trial and a 20-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Culture and institutional design protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Culture and institutional design action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    asynchronous status, a small peer group or fictional organization. Avoid employee surveillance, individual
    rankings or collection of sensitive personnel information. Actual incentive, hiring and promotion
    systems require appropriate governance and legal review.
  actions:
  - stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01-A1
    sequence: 1
    title: Find where the system teaches the opposite of the slogan
    instructions: 'Compare the stated value with an ordinary observed or fictional event: a person who
      reports a risk is called negative, while a late surprise is excused as bad luck. Give each system
      heading a relevant example or explicit unknown. Ask who receives information early, who is selected
      for visible roles and what happens after a mistake. Do not infer a whole culture from one event,
      but identify a plausible mechanism worth testing.


      Observation checks: Stated norms and actual signals are compared; Incentives rituals information
      selection and consequences are mapped; Evidence and unknowns are distinguished; The cultural inference
      remains a testable limited hypothesis. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01
      action_stable_id: PRACTICE-COMP-2209-CULTURE-AND-INSTITUTIONAL-DESIGN-01-A1
      competency_stable_id: '22.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2209_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2209_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - stated_norms_and_actual_signals_are_compared
        - incentives_rituals_information_selection_and_consequences_are_mapped
        - evidence_and_unknowns_are_distinguished
        - the_cultural_inference_remains_a_testable_limited_hypothesis
      - measurement_id: c2209_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
