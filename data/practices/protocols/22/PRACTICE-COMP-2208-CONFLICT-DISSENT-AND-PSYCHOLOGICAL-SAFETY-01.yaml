  - stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01-A3
    sequence: 3
    title: Close the concern publicly enough to be accountable
    instructions: 'At the promised point, explain what was learned, what changed or why the plan remained,
      and what uncertainty is still open. Credit the useful contribution with the person’s consent and
      check that the concern did not lead to an inappropriate penalty or exclusion within your control.
      Ask whether the route itself was usable without claiming the whole team is now psychologically safe.
      A concern logged but never answered teaches a different lesson from an invitation to speak.


      Observation checks: The concern receives a timely reasoned disposition; Changes and remaining uncertainty
      are communicated; Credit and protection from inappropriate penalty are considered; No broad safety
      claim is inferred from one interaction. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What happened after someone challenged the plan, and would that sequence make the
      next important problem easier or harder to raise?


      Examples: Supportive: A missing owner was identified, the leader changed the plan and reported the
      correction without penalizing the person who raised it.


      Mixed: The invitation was open but the response was defensive; the leader acknowledged that and
      returned with a factual disposition.


      Contradictory: Silence was called consensus, a critic was punished or a disclosure was solicited
      without a safe appropriate process.


      Inconclusive: Dissent was encouraged in words but no concern received a visible answer or follow-through.'
    expected_time: 15-25 minutes
    due_within_days: 10
