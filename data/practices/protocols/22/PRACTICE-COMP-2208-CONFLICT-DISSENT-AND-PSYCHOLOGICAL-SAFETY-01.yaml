meaning_and_fit:
  purpose: Make good-faith dissent usable by inviting specific challenge, responding without retaliation
    and distinguishing disagreement from harmful conduct.
  why_recommended: Make good-faith dissent usable by inviting specific challenge, responding without retaliation
    and distinguishing disagreement from harmful conduct.
  claims:
  - statement: Make good-faith dissent usable by inviting specific challenge, responding without retaliation
      and distinguishing disagreement from harmful conduct.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Conflict, dissent, and psychological safety practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Conflict, dissent, and psychological safety as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use fictional cases, anonymous aggregate process feedback where genuinely
    appropriate or a qualified facilitator. Actual abuse, retaliation or legal concerns require the proper
    independent support route. Do not promise anonymity or protection beyond your authority.
  opportunity_considerations: Default to reviewing a draft event plan before it is finalized. Prepare
    a prompt asking for a missing risk, an unclear responsibility or a reason the plan may fail. Offer
    an accessible private route as well as discussion, and state how concerns will be handled without
    promising confidentiality you cannot provide.
  prerequisites:
  - Default to reviewing a draft event plan before it is finalized. Prepare a prompt asking for a missing
    risk, an unclear responsibility or a reason the plan may fail. Offer an accessible private route as
    well as discussion, and state how concerns will be handled without promising confidentiality you cannot
    provide.
  dependencies: []
  safe_alternatives:
  - Use fictional cases, anonymous aggregate process feedback where genuinely appropriate or a qualified
    facilitator. Actual abuse, retaliation or legal concerns require the proper independent support route.
    Do not promise anonymity or protection beyond your authority.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Conflict, dissent, and psychological safety differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Conflict, dissent, and psychological
    safety as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to reviewing a draft event plan before it is finalized. Prepare a prompt asking for
    a missing risk, an unclear responsibility or a reason the plan may fail. Offer an accessible private
    route as well as discussion, and state how concerns will be handled without promising confidentiality
    you cannot provide. Goal: Make good-faith dissent usable by inviting specific challenge, responding
    without retaliation and distinguishing disagreement from harmful conduct. Scope: Use an ordinary safe
    group decision or fictional rehearsal. One interaction cannot establish psychological safety across
    an institution, and no one must disclose a risky concern for the exercise. Time and effort: Fifteen
    minutes to prepare, one 20-minute discussion and a short follow-up on the concern. Adaptation: Use
    fictional cases, anonymous aggregate process feedback where genuinely appropriate or a qualified facilitator.
    Actual abuse, retaliation or legal concerns require the proper independent support route. Do not promise
    anonymity or protection beyond your authority. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fictional cases, anonymous aggregate process feedback where genuinely appropriate
    or a qualified facilitator. Actual abuse, retaliation or legal concerns require the proper independent
    support route. Do not promise anonymity or protection beyond your authority.
  expected_burden: Fifteen minutes to prepare, one 20-minute discussion and a short follow-up on the concern.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Conflict, dissent, and psychological safety protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Conflict, dissent, and psychological safety action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fictional
    cases, anonymous aggregate process feedback where genuinely appropriate or a qualified facilitator.
    Actual abuse, retaliation or legal concerns require the proper independent support route. Do not promise
    anonymity or protection beyond your authority.
  actions:
  - stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01-A1
    sequence: 1
    title: Create an invitation that does not require personal courage as proof
    instructions: 'Explain which parts of the plan remain changeable and ask a specific question such
      as What would make this hard to carry out. Give participants time and a private or asynchronous
      option where appropriate. State the limits of confidentiality and the route for issues outside the
      meeting’s authority. Do not call on the least powerful person to demonstrate bravery, and do not
      treat silence as agreement or evidence that no risk exists.


      Observation checks: The invitation concerns a specific changeable decision; Time and accessible
      response routes are offered; Confidentiality and authority limits are honest; Silence and vulnerability
      are not used as tests of alignment. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01
      action_stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01-A1
      competency_stable_id: '22.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2208_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2208_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_invitation_concerns_a_specific_changeable_decision
        - time_and_accessible_response_routes_are_offered
        - confidentiality_and_authority_limits_are_honest
        - silence_and_vulnerability_are_not_used_as_tests_of_alignment
      - measurement_id: c2208_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
