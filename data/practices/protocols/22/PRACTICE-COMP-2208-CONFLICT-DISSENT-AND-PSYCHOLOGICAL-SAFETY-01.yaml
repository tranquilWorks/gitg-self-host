  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Mo confirms at **11:15** that authorized access begins at **17:50**, not 17:30. The required harmless
      paper setup takes **10 minutes**, so Hana revises P2 to 17:50 setup and retains the 18:00 start.
      Mo confirms the access wording; Hana owns the plan change. No extra venue permission or earlier
      access is invented.


      At **11:25**, Hana''s fictional update explains the verified time, revised setup and unchanged session
      start, thanks people for raising dependencies without identifying the private author, and says the
      personal label was inappropriate. Hana addresses that conduct separately with B. The update is five
      minutes before the promise and thirty-five before finalization.


      The note author privately says the written route was usable but does not authorize public credit.
      The two silent participants have not explained their silence. Hana leaves the note author''s already
      accepted setup role unchanged; there is no broader observation of later treatment, other leaders
      or private fears. P2 is ready on the stated access dependency; overall psychological safety and
      the actual event remain unmeasured.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Invite a specific challenge before finalizing a plan, respond without status defense and close
      the loop. Set aside fifteen minutes to design the invitation and fifteen to review the fictional
      responses. A single discussion can show how a concern was handled; it cannot certify that a team
      is psychologically safe or require a less powerful person to demonstrate courage.


      ### Make disagreement usable before requesting it


      Begin with what can still change. Asking for input after an irreversible decision while implying
      that the plan remains open misrepresents people''s influence. A specific question about a missing
      dependency or unclear responsibility makes participation easier than “any objections?” Give people
      time and an accessible alternative to public speech. A private or asynchronous route can reduce
      exposure but has limits that should be stated accurately.


      Power affects the interpretation of silence. A participant may have no concern, may need more time,
      may not understand, or may fear consequences. None of these can be diagnosed from silence alone.
      Do not call on the least powerful person to prove openness. Let people pass and retain unknowns
      in the plan. A unanimous-looking meeting can coexist with an unspoken problem.


      Receive the concern as information to examine. Summarize it fairly, ask what supports it and state
      what will be checked. Thank the contributor without making them responsible for solving every related
      problem. You can disagree with a proposed solution while taking its underlying observation seriously.
      Conversely, good faith does not make every factual claim correct; inspect the evidence and explain
      the result.


      Protect challenge while addressing harmful conduct. An insult or discriminatory comment may need
      a separate response, but it does not logically erase a valid concern raised in the same conversation.
      Separate the factual question, behavior and appropriate channel. Avoid treating discomfort with
      criticism as proof of harm, or using “safety” to prohibit any challenge to a leader''s preference.
      Do not stage hostility or solicit traumatic disclosures for practice.


      Follow-through gives the invitation substance. Record an owner, next check and response time. At
      that point say what changed, what stayed and why, and what remains unknown. A logged concern with
      no response can teach people that speaking wastes effort. If the decision stays unchanged, provide
      the relevant evidence rather than requiring agreement with your authority.


      Privacy and protection claims must fit your power. Explain who receives a private note and when
      an issue would need referral. Do not promise absolute confidentiality or that retaliation cannot
      happen. Take responsibility for access and assignments within your control, and preserve an appropriate
      route for concerns beyond it. A person should not have to publicly identify themselves to receive
      a factual plan update.


      Psychological safety concerns expectations about interpersonal risk over time. One person speaking
      once or one leader responding well is incomplete evidence. Ask whether the route was usable without
      demanding disclosure about personal fears. Look for patterns and missing perspectives before drawing
      broader conclusions. The task can produce a bounded record of responsiveness while the group''s
      wider climate remains unknown.


      ### Worked example


      A participant says an entrance plan assumes access before the venue opens. Another calls the participant
      negative. The facilitator can stop the personal label, check opening authority and avoid announcing
      that the whole plan is unsafe before the facts are known. If access is confirmed later, the concern
      still served a useful verification function; it need not be punished for failing to reveal an actual
      fault.


      ### Complete fictional dissent packet


      The Paper Routes team plans a session on **18 November 2026, 18:00–18:40 UTC**, Cedar Center, Willow
      Room. Draft **P1** asks setup volunteers to arrive at **17:30**, assumes an entrance is open then
      and has no named person to confirm access. The date, duration and approved room are fixed; setup
      timing and assignments remain changeable until **17 November at 12:00 UTC**. Facilitator Hana can
      revise the plan but cannot certify venue access.


      Hana''s proposed question is: “What input or responsibility would make this plan hard to carry out?”
      Participants may reply during the paper discussion or send a private paper note to Hana before **11:00
      on 17 November**. Only Hana initially reads private notes; facts needing venue verification go to
      steward Mo without attribution where possible. Serious issues outside Hana''s role require the proper
      channel, so no absolute confidentiality promise is made. Participants may decline to comment.


      The supplied comments are: **A**, a private note, “I have only seen confirmation for 17:50 access;
      who approved 17:30?”; **B**, an in-meeting remark, “People who ask these questions are always negative”;
      **C**, silence from two attendees, with no stated reason. The note author has not consented to public
      credit. Mo is available to check access at **11:15**. Hana promises a factual update by **11:30**,
      before finalization. These are all fictional interactions, not invitations to send messages.


      ### Invite, respond and close the loop


      1. Write an invitation explaining the changeable scope, routes, time and privacy limits. Output:
      an invitation that allows passing and does not claim silence means alignment.

      2. Separate A''s evidence question, B''s conduct and C''s unknown meaning. Name Mo''s authority
      and Hana''s follow-through. Output: a factual acknowledgment, a bounded conduct response and a checking
      plan.

      3. Save before the [later packet](?resource=file-later-packet-md). Revise P1 using the venue evidence,
      keeping the author''s attribution choice. Output: plan version, update content and on-time or late
      response status.

      4. Inspect whether access or assignments within Hana''s control changed as punishment. Record what
      is known and not known. Output: a narrow response-quality finding and an unanswered question about
      the route''s usability.


      ### Support and higher difficulty


      Offer written, signed, spoken or assisted input without requiring a public explanation of the access
      need. A harder branch has the concern implicate Hana: route it to an actually authorized independent
      person and disclose limits instead of privately adjudicating it yourself. Actual harassment, discrimination,
      danger or whistleblowing concerns require appropriate support and current procedures beyond this
      harmless rehearsal. Do not pressure someone to report them for an exercise.


      ### Source use


      [OECD Openness, S06](https://www.oecd.org/en/publications/oecd-public-integrity-handbook_ac8ed8e8-en/full-report/openness_b1c18876.html),
      discusses responsive management and channels for concerns. Selected openness sections inform the
      distinction between inviting and responding. Its underlying studies, country examples and legal
      reporting protections are not adopted as validation or as a confidentiality guarantee.


      ### Use the result at its proper scale


      Taking a leadership role is not compulsory. Fiction and no attempt are legitimate. Use actual authority
      and willing participation; keep protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Nobody objects during a meeting. What may the facilitator infer about alignment and risk?

      2. A concern is raised alongside an insulting remark. Must the concern be dismissed to protect respectful
      conduct?

      3. One private note led to an on-time correction and the person retained their assignment. Is the
      group now proven psychologically safe?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Very little from silence alone. Offer usable routes and time, preserve unknowns and avoid
      treating absent speech as consent or proof that no problem exists.

      2. No. Examine the factual concern and address the harmful conduct separately. Neither permission
      to challenge nor an insult makes the factual claim automatically true or false.

      3. No. This supports a bounded account of handling that concern and one assignment. Wider expectations,
      silent participants and later treatment remain unknown.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
