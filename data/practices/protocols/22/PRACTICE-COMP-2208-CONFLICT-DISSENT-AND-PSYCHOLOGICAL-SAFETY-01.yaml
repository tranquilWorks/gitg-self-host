        expected: true
  - stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01-A2
    sequence: 2
    title: Respond to the concern before defending the plan
    instructions: 'When a genuine low-stakes concern is raised, summarize it, ask what evidence or experience
      supports it and thank the person without making them responsible for solving everything. State what
      you will check and when. If behavior becomes insulting or discriminatory, address that conduct separately
      rather than using it to dismiss all disagreement. Do not stage an attack or ask someone to reveal
      harassment merely to complete the exercise.


      Observation checks: The concern is summarized and checked before rebuttal; A concrete investigation
      or decision next step is assigned; Harmful conduct is separated from legitimate disagreement; No
      risky disclosure or staged conflict is required. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01
      action_stable_id: PRACTICE-COMP-2208-CONFLICT-DISSENT-AND-PSYCHOLOGICAL-SAFETY-01-A2
      competency_stable_id: '22.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
