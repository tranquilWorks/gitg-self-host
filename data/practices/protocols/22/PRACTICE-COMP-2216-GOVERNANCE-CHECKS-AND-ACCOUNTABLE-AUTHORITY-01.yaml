meaning_and_fit:
  purpose: Define decision rights, oversight, appeal, succession and transparent records so a group can
    detect and correct an error without relying only on a leader’s virtue.
  why_recommended: Define decision rights, oversight, appeal, succession and transparent records so a
    group can detect and correct an error without relying only on a leader’s virtue.
  claims:
  - statement: Define decision rights, oversight, appeal, succession and transparent records so a group
      can detect and correct an error without relying only on a leader’s virtue.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Governance, checks, and accountable authority practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Governance, checks, and accountable authority as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible diagram, peer group or fictional tabletop. Real legal entities
    must follow their governing documents and qualified advice for changes. Oversight should not expose
    private personal or case information beyond legitimate need.
  opportunity_considerations: Default to a small association approving use of a shared room. Prepare a
    one-page governance rule with who decides, what criteria apply, what is recorded, who checks, how
    to appeal, conflicts, temporary absence and review. Use fictional names and no actual funds or legal
    appointments.
  prerequisites:
  - Default to a small association approving use of a shared room. Prepare a one-page governance rule
    with who decides, what criteria apply, what is recorded, who checks, how to appeal, conflicts, temporary
    absence and review. Use fictional names and no actual funds or legal appointments.
  dependencies: []
  safe_alternatives:
  - Use an accessible diagram, peer group or fictional tabletop. Real legal entities must follow their
    governing documents and qualified advice for changes. Oversight should not expose private personal
    or case information beyond legitimate need.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Governance, checks, and accountable authority differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Governance, checks, and accountable
    authority as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a small association approving use of a shared room. Prepare a one-page governance
    rule with who decides, what criteria apply, what is recorded, who checks, how to appeal, conflicts,
    temporary absence and review. Use fictional names and no actual funds or legal appointments. Goal:
    Define decision rights, oversight, appeal, succession and transparent records so a group can detect
    and correct an error without relying only on a leader’s virtue. Scope: Use a fictional group or an
    authorized low-stakes governance proposal. This is not a legal charter, fiduciary opinion or permission
    to replace existing bylaws informally. Time and effort: Thirty minutes to draft, a 20-minute error-and-absence
    tabletop test and a short revision. Adaptation: Use an accessible diagram, peer group or fictional
    tabletop. Real legal entities must follow their governing documents and qualified advice for changes.
    Oversight should not expose private personal or case information beyond legitimate need. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible diagram, peer group or fictional tabletop. Real legal entities
    must follow their governing documents and qualified advice for changes. Oversight should not expose
    private personal or case information beyond legitimate need.
  expected_burden: Thirty minutes to draft, a 20-minute error-and-absence tabletop test and a short revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Governance, checks, and accountable authority protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Governance, checks, and accountable authority action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    diagram, peer group or fictional tabletop. Real legal entities must follow their governing documents
    and qualified advice for changes. Oversight should not expose private personal or case information
    beyond legitimate need.
  actions:
  - stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01-A1
    sequence: 1
    title: Allocate authority and oversight before a dispute occurs
    instructions: 'State which routine decisions the coordinator may make and which require a second authorized
      review. Define the purpose-linked criteria, required information and limits of discretion. Identify
      who can inspect the record and how privacy will be protected. Separate the decision-maker from the
      appeal reviewer where feasible, and define what happens when either has a conflict. A title alone
      does not explain the boundaries of legitimate authority.


      Observation checks: Routine and higher-consequence decisions have defined rights; Criteria information
      and discretion limits are explicit; Transparency and privacy are balanced; Independent review and
      conflict handling are specified. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01
      action_stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01-A1
      competency_stable_id: '22.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2216_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2216_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - routine_and_higher_consequence_decisions_have_defined_rights
        - criteria_information_and_discretion_limits_are_explicit
        - transparency_and_privacy_are_balanced
        - independent_review_and_conflict_handling_are_specified
      - measurement_id: c2216_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2216_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01-A2
    sequence: 2
    title: Test a leader error and a challenge from a less powerful member
    instructions: 'Use a fictional case where the coordinator applies the wrong booking rule and a newcomer
      notices. Walk through how the person raises the issue, what evidence is considered, who reviews
      it and how the result is communicated. Ensure the coordinator cannot simply veto review of their
      own decision and that disagreement does not automatically remove the newcomer’s access. Preserve
      fair process for the decision-maker as well as the challenger.


      Observation checks: A concrete error can be detected and challenged; The review does not depend
      on the leader’s permission alone; The challenger is not penalized for a good-faith concern; Both
      affected parties receive a fair reasoned process. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01
      action_stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01-A2
      competency_stable_id: '22.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2216_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2216_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_concrete_error_can_be_detected_and_challenged
        - the_review_does_not_depend_on_the_leader_s_permission_alone
        - the_challenger_is_not_penalized_for_a_good_faith_concern
        - both_affected_parties_receive_a_fair_reasoned_process
      - measurement_id: c2216_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2216_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01-A3
    sequence: 3
    title: Test absence, revise and assign maintenance
    instructions: 'Add a second scenario in which the coordinator is unavailable or the reviewer must
      recuse. Identify the authorized temporary replacement, what information they receive and how the
      group learns who now decides. Revise any gap exposed by the tests and assign an owner and review
      date for the rule. Do not call the institution accountable merely because a document exists; the
      test should show who can actually correct an error.


      Observation checks: Absence and recusal have authorized replacement routes; Knowledge and authority
      transfer are communicated; The rule is revised from concrete test failures; Maintenance and future
      review are assigned. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Who can correct the leader when the leader disagrees, and does the same mechanism
      still work when the usual reviewer is absent or conflicted?


      Examples: Supportive: The newcomer’s challenge reached an independent reviewer, the error was corrected
      and a recusal backup kept the process usable.


      Mixed: The first rule gave the leader control over appeals; the tabletop exposed that flaw and the
      group revised it.


      Contradictory: Appeal depended on personal favor, critics lost access or existing legal governance
      was overridden without authority.


      Inconclusive: Accountability was described as a value without decision rights, a tested appeal or
      succession route.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01
      action_stable_id: PRACTICE-COMP-2216-GOVERNANCE-CHECKS-AND-ACCOUNTABLE-AUTHORITY-01-A3
      competency_stable_id: '22.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
