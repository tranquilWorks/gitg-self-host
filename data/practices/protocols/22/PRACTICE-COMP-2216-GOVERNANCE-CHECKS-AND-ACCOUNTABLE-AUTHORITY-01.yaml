  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Absence and conflict expose the real route


      Jae is absent when A appeals. Nia discloses a close relationship with applicant B and recuses under
      R2. Ruth, the already appointed substitute, declares no relevant interest, obtains Oli''s current
      pack and reviews both requests. Ruth finds the three-month condition absent from R2 and corrects
      the award to **A**, the earlier eligible request.


      Paz, acting coordinator under the existing appointment, updates the allocation record while retaining
      Jae''s original reason and Ruth''s correction. Notices are drafted for both applicants. The packet
      supplies acknowledgment from A only; **B''s receipt remains unconfirmed**. Jae later disagrees but
      has no veto over Ruth''s valid R2 correction. A proposal for a future waiting rule is referred to
      the members, with no approval or retroactive effect.


      Mark the exercised branches: absence substitute, conflict recusal, independent correction and retained
      history. Mark the remaining gaps: B''s notice receipt, the monthly oversight review, both-reviewers-unavailable
      procedure and actual use of the room. No meeting outcome is supplied.


      If your original pack let Jae appoint the appeal reviewer or approve the correction, remove that
      circular dependency. If it treated sending a notice as receipt, preserve the open communication
      task. This case supports a bounded correction, not a claim that all leader errors will be detected.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Design a small decision system that can correct a leader''s error while the leader is absent
      or disagrees. Allow twenty minutes to create the decision and appeal record, then ten to inspect
      the later test. The aim is a usable allocation of authority rather than confidence in one person''s
      character.


      ### Give each decision a legitimate home


      Decision rights state who may decide what, within which limits. Oversight checks whether those limits
      are respected. Appeal lets an affected person challenge a decision through a route that can actually
      change it. Succession keeps these functions available when a role-holder leaves or cannot act. Transparency
      makes the basis of a decision understandable while protecting information that should remain private.
      Independent review requires enough separation, competence and authority to resist the original decision-maker''s
      preference.


      These elements interact. An appeal address is ineffective if the leader can veto every correction.
      An independent reviewer without the current rulebook may be free of the conflict but unable to decide.
      A substitute with access but no appointment does not acquire authority by being helpful. Design
      the record and the appointment process together, so correction does not depend on a leader voluntarily
      admitting error.


      The Charity Commission''s [decision-making guidance, S04](https://www.gov.uk/government/publications/decision-making-for-charity-trustees-cc27/decision-making-for-charity-trustees)
      emphasizes powers, governing documents, reasoned records and accountable delegation. It applies
      to charity trustees in England and Wales. The fictional R2 association rule below is an original
      low-stakes example, not a legal constitution or claim of compliance with charity law.


      ### Complete fictional rule R2


      The Lantern Association allocates one weekly meeting room. Its members have validly adopted R2 for
      this exercise. Eligible requests must be for a member activity, fit the room''s supplied approved
      capacity and arrive by noon Monday. Among eligible requests, the one with the earlier recorded submission
      wins. All supplied requests meet capacity; do not assess real building safety.


      Coordinator **Jae** applies R2 and publishes a redacted reason code. Jae may not invent new eligibility
      restrictions. Clerk **Oli** maintains the request log and rule version. Uninvolved reviewer **Nia**,
      appointed by the members, may uphold, correct or return a decision for a stated missing fact. An
      applicant may appeal through Oli within two working days of notification under this fictional process.
      This is a service rule, not a legal limitation period. Jae cannot veto an appeal correction.


      The members also appointed **Ruth** as Nia''s substitute for absence or conflict and **Paz** as
      acting coordinator during Jae''s absence. Each has accepted and has access to the current redacted
      decision pack. Reviewers must disclose relationships to applicants and recuse where R2 requires
      it. If both review appointees are conflicted or absent, Oli records the block and calls the members''
      authorized appointment meeting; the coordinator cannot appoint their own appeal judge. The room
      award stays unresolved until a valid decision can be made.


      Rule changes need a members'' vote and a stated future effective date. They cannot be silently backdated
      to make an earlier rejection valid. The clerk reports unresolved appeals and rule deviations at
      the monthly oversight meeting. Members review the system after two cycles for timeliness, correction
      and burden. These authorities are supplied facts, not appointments made by the learner.


      ### The contested allocation


      Request A, submitted **Monday 09:00**, is from a new member''s reading group. Request B, submitted
      **Monday 10:00**, is from a long-standing member''s craft group. Both meet all R2 criteria. Jae
      rejects A because “new members must wait three months,” a restriction absent from R2, and awards
      B. A''s applicant asks Oli for review the next working day. There is no misconduct finding or allegation
      about Jae''s motive.


      The necessary file contains R2''s version and effective date, both submission times, eligibility
      checks, Jae''s stated reason, the appeal request and the reviewer''s authority/conflict declaration.
      Member tenure is included only because it explains the disputed reason; unrelated personal information
      is unnecessary. Redacted public notice can state the rule and corrected allocation without exposing
      the full appeal correspondence.


      ### Worked correction that does not require confession


      An unrelated club mistakenly applies a 17:00 deadline when its current rule says 18:00. A reviewer
      can identify the current rule, compare the timestamp and correct the eligibility judgment even if
      the chair believes 17:00 would be better. The chair may propose a future rule change through the
      proper process. Personal agreement with the correction is not a precondition for applying the existing
      rule.


      For Lantern, reason from the same distinction. The first question is whether A was eligible under
      R2, not whether a waiting period sounds sensible. The second is which eligible request came first.
      A defensible review addresses both applicants'' reliance and timely communication without pretending
      the earlier award never happened. The record should show the original decision and correction, not
      erase the error.


      ### Write and test the governance pack


      1. Create a rights table for coordinator, clerk, reviewer, substitutes and members. Include their
      limits, reporting obligation and source of appointment. Give every exceptional branch an authorized
      next step or an explicit unresolved status.

      2. Produce the appeal file from the supplied facts. State the question, applicable rule, relevant
      evidence, missing facts if any and conflict check. Do not add character judgments or assume that
      a newcomer deserves priority for unrelated reasons.

      3. Draft the review outcome and a redacted explanation to both applicants. Name who updates the
      allocation record and who confirms notification. A drafted notice is not a receipt.

      4. Test absence, conflict and leader disagreement. Can an authorized substitute obtain the same
      current pack? Can the leader stop a correction? If all reviewers are unavailable, can the system
      admit the block without inventing authority?

      5. Save your pack before the [later packet](?resource=file-later-packet-md). Compare the actual
      supplied path with your intended one and identify what remains untested.


      For support, draw only the ordinary decision and single appeal first, then add the supplied substitutes.
      For a harder attempt, make both Nia and Ruth conflicted and specify the member appointment route
      with an unresolved allocation. Optional actual transfer is an authorized review of a group''s public
      or blank governance procedure. Do not rewrite its constitution, appoint yourself or expose a complainant.
      A rule can be legible yet inaccessible in practice, so actual review would also need willing users,
      usable channels and evidence across time. One corrected room decision does not establish institutional
      accountability.


      ### Use the result at its proper scale


      Practical safeguards do not add canonical metadata.  A leadership role is not compulsory. Use actual
      authority and willing participation; keep protected records private. Fiction and no attempt are
      legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A leader may appoint and dismiss the reviewer for an appeal against their own decision. What
      makes the check weak?

      2. A published rule permits applications until noon. After rejecting an 11:30 application, the board
      adopts an 11:00 deadline. Does that cure the earlier decision?

      3. The appointed reviewer recuses and no authorized substitute exists. Can the clerk simply decide?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The original decision-maker controls the reviewer’s position, so independence and corrective
      authority are doubtful. Use the actual governing process to establish a sufficiently independent
      appointment and conflict route; a new title alone does not fix the dependency.

      2. Not merely by changing the rule later. Apply the rule valid at the relevant time and use the
      authorized correction process. Record a prospective effective date for any valid change; do not
      erase the original error.

      3. Only if the actual governing rules give that authority. Otherwise record the unresolved review,
      protect affected people through permitted interim arrangements and use the legitimate appointment
      route. Access to the file does not confer decision rights.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
