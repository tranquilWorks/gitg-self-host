  - id: file-later-packet-md
    title: Later packet
    body: 'The case clock is 10:22 at J; the return to V takes the stated 10 minutes. Expected return
      is 10:32 under these assumptions. Continuing to P would disregard the session''s 10:20 continuation
      limit and worsening-weather cue. The rule is a case-specific decision aid, not a promise that the
      route is always safe.


      One learner retrieves the map but discovers the layer is in someone else''s locked vehicle. Navigation
      preparation is supported; warmth access is unresolved. “Owned” did not mean “available.” Repair
      the access problem before a real departure.


      A second learner writes “stream looks clear; refill there.” No safe-water assessment supports that
      claim. Use the case''s carried drinking water and confirm suitability with the instructor; do not
      perform a water-treatment experiment.


      An instructor cancels the real session before departure. Respecting cancellation supports the decision
      boundary, but no outdoor performance occurred. A supplied fictional instructor approval cannot replace
      actual supervision.


      Record supported, mixed, contradicted or unobserved elements separately. Correcting the route on
      paper does not qualify anyone in shelter construction, firecraft, water treatment or rescue.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Plan a short outdoor session that can safely end early


      Begin indoors with the fictional park card below. In about thirty minutes you will allocate seven
      survival priorities, trace a return route and respond to an announced change. Use paper, ordinary
      clothing and closed drinking-water containers if available; no purchase is required. This default
      is planning practice. The real transfer route includes qualified supervision and an actual benign
      outdoor task before any claim of demonstrated outdoor skill.


      ### Priorities follow conditions


      Survival priorities are not a rigid countdown or a competition to tolerate deprivation. Exposure,
      injury, weather, terrain, water access and the group''s needs change what matters first. For this
      short session, warmth and a reliable return route can matter more immediately than finding food
      in the wild. Do not use “rules of three” as permission to wait for a medical problem or continue
      without water.


      Shelter reduces environmental exposure; it is only useful if suitable, accessible and available.
      A distant cabin with unknown opening hours is a question, not a shelter plan. Warmth includes suitable
      layers and staying dry, not simply carrying a fire starter. Water must be safe and adequate for
      the actual trip and personal needs. Clear-looking stream water is not established as drinkable;
      treatment methods require instruction appropriate to the hazard. This exercise uses carried drinking
      water and does not teach purification.


      Navigation joins your position, a route and a destination. Naming a landmark without knowing how
      it relates to the map is incomplete. A phone map needs battery and availability; a paper map also
      needs interpretation. Signaling is a plan for reaching help with location and circumstances. Merely
      carrying a whistle or phone does not establish that a message will be heard. Make no false distress
      calls or signals during rehearsal.


      Fire may support warmth or signaling in some settings, but brings burn and wildfire risks and may
      be prohibited. It is not required here. Food means carrying ordinary suitable supplies, not foraging
      or trapping. The NPS Ten Essentials supports trip-specific equipment preparation; its trip guide
      emphasizes conditions, skills and shared plans. Neither resource makes this page a wilderness qualification.
      See S04–S05 in [SOURCES](?resource=sources).


      ### Worked example


      Sam plans a short supervised walk near a staffed visitor building. Their initial note says “warmth:
      fire.” The site''s rule prohibits fires, and Sam has no fire training. Sam replaces that dependency
      with appropriate carried layers and a return-to-building option, then asks the instructor to confirm
      suitability before departure. Fire stays “not authorized for this session.” This is a resolved disposition,
      not a claim to know firecraft.


      ### Fictional park and equipment card


      The session starts at Visitor Building V at 10:00. A marked level path reaches Junction J in 10
      minutes at this fictional group''s assessed pace. The same path returns from J to V in 10 minutes.
      A farther viewpoint P adds 20 minutes each way from J. No other routes are established. The instructor''s
      session rule is: do not continue beyond J after 10:20; cancel or return earlier for changed conditions,
      unsuitable equipment, discomfort or an instructor decision. Times are case facts, not universal
      outdoor limits.


      V is staffed until noon and has drinking water. The map is available on paper. J has no building
      or confirmed mobile signal. The forecast on the card says mild and dry, but the instructor must
      recheck actual conditions before any real departure. A small stream near J has no established treatment
      assessment. Fires are prohibited. The group has ordinary food, carried drinking water, suitable
      dry layers, a charged phone, a paper route card, and an instructor-approved emergency shelter item.
      A trusted contact knows the route, expected return and agreed response to an overdue group. No actual
      contact is made in this fictional exercise.


      ### Rehearse with all seven priorities


      1. Draw V–J–P with the stated times. Trace the return from J. Explain why reaching J does not commit
      anyone to continuing to P.

      2. Give shelter, water, warmth, navigation, signaling, fire and food a specific disposition. Use
      “carried and checked,” “qualified supervised practice needed,” “not needed for this session,” or
      “not authorized,” with the relevant item or reason. Do not mark an item checked if you only read
      its name.

      3. Rehearse one harmless retrieval indoors: locate your paper route card or an ordinary suitable
      layer you already own. If none is available, record missing rather than imagining successful retrieval.
      Do not construct a shelter around your body, use heat, or test exposure indoors.

      4. At fictional J, read this announced cue: it is 10:22 and the instructor reports worsening weather.
      Decide whether to continue, return with the instructor using the established route, or seek a different
      supported action if the route is no longer safe. Under the supplied facts the return route remains
      suitable. Trace it and update the expected arrival and contact message.

      5. Say a practice-only help description without dialing: location reference, group situation, relevant
      conditions and callback route if available. Distinguish information known from missing. If a real
      emergency occurs, use local emergency instructions; the rehearsal is over.

      6. Identify one weakness: inaccessible layer, unlocated map, unverified contact arrangement, or
      a plan depending on the prohibited fire. Correct only a harmless authorized item and repeat that
      check. Save what was actually retrieved and what still needs instruction.


      Open the [later packet](?resource=file-later-packet-md) after committing your route decision. Your
      output is a seven-priority disposition card, return calculation, help-message rehearsal and one
      honest retrieval result. It can show preparedness reasoning, not survival performance.


      ### Supervised and adapted routes


      For a smaller first step, work V–J only with a large-print or tactile route representation; a support
      person may read the card. Preserve their contribution. A harder paper version removes mobile coverage
      and asks what the trusted contact knows. The response is to resolve the communication arrangement
      before the trip, not to wander toward imagined reception.


      For real transfer, arrange a qualified instructor-led benign session near established support, with
      consent, accessibility, local rules, weather and individual needs checked beforehand. Agree on a
      stop/return rule and what the instructor will observe: map orientation, safe use of the approved
      warmth/shelter equipment, carried safe water/food arrangements, and a practice-only location message.
      The instructor selects and supervises any physical task; no fire, untreated water, fasting, cold
      exposure, remote overnight stay or navigation challenge is required by this guide. Record the actual
      task and correction, supervision and conditions. An indoor alternative remains indoor evidence.
      Complete the [fresh checks](?attempt=practice-checks) before the [key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. You have an emergency shelter item but have never used it. A trip partner says ownership
      proves preparedness. What is missing?

      2. A fictional route takes 12 minutes to return from a checkpoint. At 14:18 the leader activates
      the return rule; the route remains suitable. What arrival time can you estimate, and what can that
      estimate not guarantee?

      3. A fire ban removes your only planned warmth source. Should you practice secretly, omit warmth,
      or revise the trip? Explain a complete response.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Suitability, accessibility and instructed use remain unverified. Arrange qualified, benign
      supervised familiarization before relying on it. Record ownership separately from observed use;
      avoid an improvised exposure test.

      2. 14:30 under the supplied pace and route assumptions. Conditions, delays and individual needs
      can change that estimate. It is not permission to continue despite new danger or a guaranteed rescue
      deadline.

      3. Revise or defer the trip until safe warmth and shelter arrangements fit conditions and are confirmed
      with the qualified leader. Respect the ban; do not test fire privately or claim the priority disappears.
      A carried layer and accessible supported return may fit some benign sessions, but suitability still
      needs checking.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
