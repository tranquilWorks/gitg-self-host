        expected: true
  - stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01-A3
    sequence: 3
    title: Use the turnaround decision and correct one readiness gap
    instructions: 'When the instructor presents the fictional worsening-weather cue, explain and follow
      the agreed return or stop decision in the safe exercise area. Afterward inspect what was difficult
      to retrieve, understand or use. Correct one real gap, such as an unreadable map copy or inaccessible
      warm layer, and demonstrate that part again. Record the environment, support and untested hazards;
      a successful near-home session does not establish remote or winter survival competence.


      Observation checks: The preset condition produces a stop or return decision; An observed equipment
      or decision gap is corrected; The corrected component is demonstrated again; Remote severe-weather
      and unsupervised transfer remain unclaimed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which decision prevented the scenario from becoming a survival problem, and what equipment
      or skill still cannot be relied on without further instruction?


      Examples: Supportive: The participant located the return route, used a carried layer and turned
      back at the agreed weather cue, then repacked the item that had been inaccessible.


      Mixed: Map use was sound near the trailhead, but independent navigation and water-treatment skills
      remained untested.


      Contradictory: The person intentionally went without water, started an unauthorized fire or ate
      a wild plant to make the exercise authentic.


      Inconclusive: A packing list was completed without a supervised demonstration or a practiced turnaround
      decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
