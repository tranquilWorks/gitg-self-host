meaning_and_fit:
  purpose: Prioritize exposure protection, communication, navigation and safe water arrangements before
    a minor outdoor problem becomes a survival emergency.
  why_recommended: Prioritize exposure protection, communication, navigation and safe water arrangements
    before a minor outdoor problem becomes a survival emergency.
  claims:
  - statement: Prioritize exposure protection, communication, navigation and safe water arrangements before
      a minor outdoor problem becomes a survival emergency.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Outdoor survival fundamentals practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Outdoor survival fundamentals as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible outdoor route or indoor instructor-led equipment session
    when terrain, weather, disability or cost makes the default unsuitable. An indoor session can establish
    equipment familiarity but not outdoor performance. Cancel rather than create cold, heat, thirst, exhaustion
    or isolation for realism.
  opportunity_considerations: 'Use a local outdoor program or qualified instructor and a safe daytime
    setting with normal services nearby. Fictional scenario: a short walk takes longer than expected and
    the weather worsens. Bring ordinary clothing, a map, communication method, safe drinking water, food
    and instructor-approved shelter or warmth items; never deliberately deprive yourself of them.'
  prerequisites:
  - 'Use a local outdoor program or qualified instructor and a safe daytime setting with normal services
    nearby. Fictional scenario: a short walk takes longer than expected and the weather worsens. Bring
    ordinary clothing, a map, communication method, safe drinking water, food and instructor-approved
    shelter or warmth items; never deliberately deprive yourself of them.'
  dependencies: []
  safe_alternatives:
  - Use an accessible outdoor route or indoor instructor-led equipment session when terrain, weather,
    disability or cost makes the default unsuitable. An indoor session can establish equipment familiarity
    but not outdoor performance. Cancel rather than create cold, heat, thirst, exhaustion or isolation
    for realism.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Outdoor survival fundamentals differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Outdoor survival fundamentals
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a local outdoor program or qualified instructor and a safe daytime setting with normal services
    nearby. Fictional scenario: a short walk takes longer than expected and the weather worsens. Bring
    ordinary clothing, a map, communication method, safe drinking water, food and instructor-approved
    shelter or warmth items; never deliberately deprive yourself of them. Goal: Prioritize exposure protection,
    communication, navigation and safe water arrangements before a minor outdoor problem becomes a survival
    emergency. Scope: This is a benign supervised preparation exercise near ordinary support, not an unsupervised
    survival test. It does not teach fire-making, wild-food identification or improvised water treatment.
    Time and effort: Thirty minutes to prepare, a qualified instructor-led session of suitable length
    and a fifteen-minute equipment and decision review. Adaptation: Use an accessible outdoor route or
    indoor instructor-led equipment session when terrain, weather, disability or cost makes the default
    unsuitable. An indoor session can establish equipment familiarity but not outdoor performance. Cancel
    rather than create cold, heat, thirst, exhaustion or isolation for realism. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible outdoor route or indoor instructor-led equipment session when
    terrain, weather, disability or cost makes the default unsuitable. An indoor session can establish
    equipment familiarity but not outdoor performance. Cancel rather than create cold, heat, thirst, exhaustion
    or isolation for realism.
  expected_burden: Thirty minutes to prepare, a qualified instructor-led session of suitable length and
    a fifteen-minute equipment and decision review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Outdoor survival fundamentals protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Outdoor survival fundamentals action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    outdoor route or indoor instructor-led equipment session when terrain, weather, disability or cost
    makes the default unsuitable. An indoor session can establish equipment familiarity but not outdoor
    performance. Cancel rather than create cold, heat, thirst, exhaustion or isolation for realism.
  actions:
  - stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01-A1
    sequence: 1
    title: Rank the scenario’s needs and set a no-go threshold
    instructions: 'For the delayed walk, distinguish immediate exposure and location problems from less
      immediate comfort or food concerns. Identify a known route back, a weather-information source, a
      person who knows the plan and a time or condition for turning around. Give shelter, warmth, water,
      navigation, signaling, fire and food a disposition: carried, learned with supervision, unnecessary
      here or not authorized. A phone is one tool, not the only route or communication plan.


      Observation checks: Immediate exposure and location needs are distinguished from optional comfort;
      A turnaround time or changing-condition threshold is explicit; All seven survival topics have an
      honest disposition; The plan does not depend on a phone alone. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01
      action_stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01-A1
      competency_stable_id: '15.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1506_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1506_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - immediate_exposure_and_location_needs_are_distinguished_from_optional_comfort
        - a_turnaround_time_or_changing_condition_threshold_is_explicit
        - all_seven_survival_topics_have_an_honest_disposition
        - the_plan_does_not_depend_on_a_phone_alone
      - measurement_id: c1506_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1506_a1_adverse
        kind: boolean
        role: adverse
