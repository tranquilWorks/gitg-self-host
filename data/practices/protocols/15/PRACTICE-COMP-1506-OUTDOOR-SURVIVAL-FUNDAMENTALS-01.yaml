        - navigation_and_a_carried_exposure_protection_item_are_demonstrated
        - a_help_message_is_rehearsed_without_a_false_emergency_signal
        - no_unsafe_deprivation_ingestion_fire_or_treatment_experiment_is_introduced
      - measurement_id: c1506_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1506_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
