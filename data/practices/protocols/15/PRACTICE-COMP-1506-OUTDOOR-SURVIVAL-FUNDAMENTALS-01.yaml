      Outdoor survival fundamentals; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use an accessible outdoor route or indoor instructor-led equipment session when terrain, weather,
      disability or cost makes the default unsuitable. An indoor session can establish equipment familiarity
      but not outdoor performance. Cancel rather than create cold, heat, thirst, exhaustion or isolation
      for realism.
    cultural_context:
    - Adapt the expression of Outdoor survival fundamentals to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use an accessible outdoor route or indoor instructor-led equipment session when terrain, weather,
      disability or cost makes the default unsuitable. An indoor session can establish equipment familiarity
