        expected: true
  - stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01-A2
    sequence: 2
    title: Demonstrate safe tasks under suitable supervision
    instructions: 'With the instructor’s agreement, orient the map to the actual setting, identify the
      return route and demonstrate how your carried warmth or shelter item is used without creating entrapment
      or exposure. Rehearse a clear location-and-help message without transmitting a false distress call.
      Use supplied safe water and ordinary food; any fire, water-treatment or other specialist demonstration
      belongs to the instructor’s lawful program and is not required by this exercise.


      Observation checks: A qualified supervised session actually occurs; Navigation and a carried exposure-protection
      item are demonstrated; A help message is rehearsed without a false emergency signal; No unsafe deprivation
      ingestion fire or treatment experiment is introduced. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01
      action_stable_id: PRACTICE-COMP-1506-OUTDOOR-SURVIVAL-FUNDAMENTALS-01-A2
      competency_stable_id: '15.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1506_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1506_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
