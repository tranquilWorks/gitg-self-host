      - [NCSC — Managing your passwords](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers)'
  - id: file-later-packet-md
    title: Later packet
    body: 'The fictional steward receives the report and says they will check discreetly. Record delegation
      acknowledged, not “harassment resolved.” No outcome from the steward''s check is supplied.


      The targeted person declines company: “No, thank you; I’m meeting a friend.” Accept the answer and
      allow space. Following to prove concern would contradict the offer''s voluntary nature. Do not infer
      that the person was never affected or that another offer can never be helpful.


      A different rehearsal partner proposes posting footage to “raise awareness.” No permission to record
      or share was given. That creates exposure unrelated to the person''s requested support. Remove the
      posting step; a desire to help does not authorize publication.


      In the staff-unavailable variant, the person leaves before you can safely offer support. Record
      no completed offer and outcome unknown. A thoughtful fallback decision is still planning work, but
      cannot be labeled a successful intervention.


      No role-card response is an actual victim''s consent. Your real evidence is the decision and benign
      rehearsal you performed, with the partner''s voluntary feedback if actually obtained.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Support a targeted person without taking over


      Use the invented event scene below. In about twenty-five minutes you will choose among five intervention
      strategies, rehearse an indirect request for help and respond when the person declines your offer.
      Nobody needs to act out harassment. Do not confront strangers, stage a threat, film people or disclose
      an actual incident for this exercise. A useful response considers safety, the targeted person''s
      choices and your own role.


      ### Five options are a menu, not an escalation ladder


      Right To Be describes direct, distract, delegate, document and delay as ways to support someone
      facing harassment. Direct intervention can increase risk; documentation requires particular attention
      to whether help is already available and how the targeted person wants material used. See S16 in
      [SOURCES](?resource=sources). The original scene and decisions below are practice materials, not
      a validated guarantee of violence prevention.


      Direct means a brief response to the harmful behavior when circumstances support it; it need not
      become a debate. Distract shifts attention to create an opening, without requiring the targeted
      person to perform gratitude or explain themselves. Delegate asks an appropriate willing person to
      help with a specific task. Document can preserve facts when safe and useful, but recording is not
      automatically the most helpful action. Delay offers support after the incident when intervention
      during it was not feasible. More visible action is not inherently better action.


      Observe conduct: repeated unwanted comments, ignoring a request to stop, following, blocking movement
      or threats. Identity, unfamiliarity and a guessed diagnosis are not substitutes for observed behavior.
      Harassment, abuse and conflict are not interchangeable categories. An ongoing abusive relationship
      can require specialist support and safety planning, and direct confrontation may increase danger.
      You do not need to determine someone''s entire history to offer bounded support.


      Ask rather than assume what the person wants when it is safe to do so. An offer can include a concrete
      option—company while leaving, help locating staff, or quiet space—but must allow refusal. Consent
      to one action is not consent to recording, public reporting, police involvement or future contact.
      In immediate danger, obtain appropriate emergency help as circumstances require. Local safeguarding
      duties may apply to particular roles or situations; do not promise secrecy you cannot keep or claim
      a universal reporting rule.


      ### Worked example


      At a public talk, an attendee is repeatedly mocked and moves away. Jules plans to loudly announce,
      “I’ll protect you; everyone look here.” The targeted attendee would become the center of attention
      and has not asked Jules to take over. Jules instead identifies the event steward and gives a factual
      report with a specific request for discreet assistance. When safe, Jules offers the attendee a choice
      about whether they want company reaching reception. The change is attention to the other person''s
      agency, not merely lowering the volume.


      ### Complete fictional scene


      At a community exhibition, one attendee repeatedly makes unwanted comments about another attendee''s
      appearance. The targeted person says “Please stop,” then moves toward the reception area. You are
      an ordinary visitor. No weapon, pursuit beyond the described movement or physical assault is supplied.
      Do not add one to make a dramatic intervention seem necessary.


      The level route to reception is clear. A marked event steward stands near the information table,
      away from the exchange. A quiet staffed waiting area is beside reception. You have no security role.
      No one has asked you to record. Your willing rehearsal partner may read only neutral role cards:
      “Steward available,” “Steward unavailable,” “Yes, company would help,” or “No, thank you.” Do not
      perform insults, aggression, blocking or physical contact.


      ### Choose before you act


      1. Describe the observed behavior and the immediate support opportunity without guessing motives.
      Note the exits, staff, your role and the targeted person''s movement away. Name what would change
      the situation into an emergency requiring a different response.

      2. Give each of the five options a disposition for this scene. Explain why direct confrontation
      may add risk; how a neutral distraction could create an opening; whom you could delegate to; why
      recording is not the default; and what delayed support could offer. You do not need to use all five.

      3. Choose a primary strategy and one fallback. For delegation, draft a factual request such as “Repeated
      comments continued after a request to stop, near the display. Could you discreetly check whether
      the attendee wants help getting to reception?” Avoid demanding punishment based on unverified details.

      4. Rehearse that request in a normal voice or accessible communication mode. Then practice a separate
      offer to the targeted person: “Would you like company to reception, or would you prefer space?”
      Use the supplied “No, thank you” reply once. Show how you would accept it without following, demanding
      reasons or seeking praise.

      5. Introduce “Steward unavailable.” Choose a remaining proportionate option based on the same facts.
      Unavailable staff do not compel direct confrontation. You might offer support later from a safe
      context or locate another legitimate assistance point, leaving uncertainty explicit.

      6. Write the documentation boundary: help and safety first; factual minimal notes only when appropriate
      and lawful; no public sharing or use without the person''s permission, subject to applicable duties.
      No real recording is performed here. Preserve your plan and open the [later packet](?resource=file-later-packet-md).


      Your output is a five-option comparison, one rehearsed request, a refusal-respecting response and
      a fallback. It can show decision quality in a simulation; it cannot establish that you prevented
      real violence or understood an actual targeted person''s wishes.


      ### Interpret the response honestly


      A person accepting company does not prove all harm was resolved. A person declining does not make
      your offer a failure or grant permission to keep trying. The steward''s acknowledgment shows the
      request was received; it is not proof that the attendee received support. If the person has left,
      their wishes and outcome may remain unknown. Do not fill that gap with a comforting success story.


      For a smaller version, rehearse delegation and accepting “no” before comparing the other options.
      Use fictional text cards, pauses and communication aids; anyone may stop. A harder paper case removes
      the quiet area and adds a crowded route. Reevaluate available choices without practicing physical
      intervention.


      For real transfer, learn the event or workplace''s legitimate assistance and safeguarding routes
      during a calm moment. Relevant bystander training can expand your options within its scope. Do not
      seek an incident to test yourself. In a real event, prioritize safety, avoid exceeding competence
      and preserve the targeted person''s choices where circumstances allow. Finish the [fresh checks](?attempt=practice-checks)
      before the [corrective key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A targeted person says they do not want company. There is no supplied immediate danger.
      How should you respond?

      2. Nobody is helping, but you can film from a safe distance. Is filming automatically the best first
      intervention?

      3. Staff acknowledge your report. Which outcome may you record, and what remains unknown?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      During a public discussion, a participant is repeatedly interrupted. You are another attendee, the
      facilitator has the microphone, and there is no immediate physical danger. The interrupted person
      quietly says they do not want you to speak on their behalf. Choose a proportionate bystander response.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Accept the refusal, allow space and avoid following or demanding explanation. A voluntary
      offer includes the option to decline. Different emergency or safeguarding facts could change obligations,
      but do not invent them to override this answer.

      2. No. Assess a safe way to obtain or offer support, including delegation; documentation is not
      a substitute for help. Recording/use also has safety, consent and legal constraints. A safe filming
      position alone does not make publication or recording appropriate.

      3. The report was received. Whether staff acted, whether the person wanted assistance and whether
      harm ended remain unknown unless actually established. Do not convert acknowledged delegation into
      a verified prevention outcome.


      ### Changed-case answer


      Respect the refusal to represent them. You may ask the facilitator to apply the general turn-taking
      rule without naming private wishes, or offer a private practical option the person can decline.
      Avoid a public rescue narrative, forced disclosure or claiming they appreciated an intervention.
      Urgent danger would require a different assessment; it is not supplied here.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
