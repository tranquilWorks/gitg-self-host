  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Bystander intervention and violence prevention; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Remote delegation, written reporting, translation or staying with someone after an event may be
      appropriate alternatives. Do not assume police contact is always the person’s preferred non-emergency
      route; immediate danger and applicable safeguarding duties require context-sensitive appropriate
      help. Avoid promises of secrecy you cannot lawfully or safely keep.
    cultural_context:
    - Adapt the expression of Bystander intervention and violence prevention to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Remote delegation, written reporting, translation or staying with someone after an event may be
      appropriate alternatives. Do not assume police contact is always the person’s preferred non-emergency
      route; immediate danger and applicable safeguarding duties require context-sensitive appropriate
      help. Avoid promises of secrecy you cannot lawfully or safely keep.
  pause_conditions:
  - Pause Bystander intervention and violence prevention when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Bystander intervention and violence prevention practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Bystander intervention and violence prevention situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
