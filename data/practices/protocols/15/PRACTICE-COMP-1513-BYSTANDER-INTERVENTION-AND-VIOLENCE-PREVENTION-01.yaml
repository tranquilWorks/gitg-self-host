meaning_and_fit:
  purpose: Recognize a concerning interaction and choose among distraction, delegation, documentation,
    delayed support and direct words without making yourself or the affected person less safe.
  why_recommended: Recognize a concerning interaction and choose among distraction, delegation, documentation,
    delayed support and direct words without making yourself or the affected person less safe.
  claims:
  - statement: Recognize a concerning interaction and choose among distraction, delegation, documentation,
      delayed support and direct words without making yourself or the affected person less safe.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Bystander intervention and violence prevention practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Bystander intervention and violence prevention as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Remote delegation, written reporting, translation or staying with someone
    after an event may be appropriate alternatives. Do not assume police contact is always the person’s
    preferred non-emergency route; immediate danger and applicable safeguarding duties require context-sensitive
    appropriate help. Avoid promises of secrecy you cannot lawfully or safely keep.
  opportunity_considerations: 'Use a fictional scene at a public event: one attendee repeatedly makes
    unwanted comments while another person tries to move away. No real harassment is staged. A willing
    partner may read a neutral script, or you can rehearse alone. The goal is useful support, not public
    heroism or content for social media.'
  prerequisites:
  - 'Use a fictional scene at a public event: one attendee repeatedly makes unwanted comments while another
    person tries to move away. No real harassment is staged. A willing partner may read a neutral script,
    or you can rehearse alone. The goal is useful support, not public heroism or content for social media.'
  dependencies: []
  safe_alternatives:
  - Remote delegation, written reporting, translation or staying with someone after an event may be appropriate
    alternatives. Do not assume police contact is always the person’s preferred non-emergency route; immediate
    danger and applicable safeguarding duties require context-sensitive appropriate help. Avoid promises
    of secrecy you cannot lawfully or safely keep.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Bystander intervention and violence prevention differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Bystander intervention and
    violence prevention as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional scene at a public event: one attendee repeatedly makes unwanted comments while
    another person tries to move away. No real harassment is staged. A willing partner may read a neutral
    script, or you can rehearse alone. The goal is useful support, not public heroism or content for social
    media. Goal: Recognize a concerning interaction and choose among distraction, delegation, documentation,
    delayed support and direct words without making yourself or the affected person less safe. Scope:
    This is a scripted non-contact rehearsal, not an obligation to confront violence or investigate abuse.
    Immediate danger requires an appropriate emergency response; specialized safeguarding obligations
    vary by role and location. Time and effort: Fifteen minutes to compare options, two five-minute rehearsals
    and ten minutes to review consent and follow-up. Adaptation: Remote delegation, written reporting,
    translation or staying with someone after an event may be appropriate alternatives. Do not assume
    police contact is always the person’s preferred non-emergency route; immediate danger and applicable
    safeguarding duties require context-sensitive appropriate help. Avoid promises of secrecy you cannot
    lawfully or safely keep. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Remote delegation, written reporting, translation or staying with someone after
    an event may be appropriate alternatives. Do not assume police contact is always the person’s preferred
    non-emergency route; immediate danger and applicable safeguarding duties require context-sensitive
    appropriate help. Avoid promises of secrecy you cannot lawfully or safely keep.
  expected_burden: Fifteen minutes to compare options, two five-minute rehearsals and ten minutes to review
    consent and follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Bystander intervention and violence prevention protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Bystander intervention and violence prevention action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Remote delegation,
    written reporting, translation or staying with someone after an event may be appropriate alternatives.
    Do not assume police contact is always the person’s preferred non-emergency route; immediate danger
    and applicable safeguarding duties require context-sensitive appropriate help. Avoid promises of secrecy
    you cannot lawfully or safely keep.
  actions:
  - stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A1
    sequence: 1
    title: Compare five routes against the actual safety conditions
    instructions: 'Write one possible response for each route: distract with an ordinary question, delegate
      to appropriate staff, document only when safe and useful, delay to offer support afterward, or use
      a brief direct statement when safe. For each, consider exits, escalation, the affected person’s
      wishes and your actual role. Recording is not the default; it should not replace help, violate privacy
      or become a public post without the person’s permission.


      Observation checks: All five routes are considered rather than assuming confrontation; Safety exits
      role and the affected person’s agency inform the choice; Documentation is not substituted for assistance;
      Recording and publication have separate privacy and consent limits. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01
      action_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A1
      competency_stable_id: '15.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1513_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1513_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_five_routes_are_considered_rather_than_assuming_confrontation
        - safety_exits_role_and_the_affected_person_s_agency_inform_the_choice
        - documentation_is_not_substituted_for_assistance
        - recording_and_publication_have_separate_privacy_and_consent_limits
      - measurement_id: c1513_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1513_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A2
    sequence: 2
    title: Practice one indirect route and one follow-up offer
    instructions: 'Choose the safest plausible route in the fictional scene, such as asking event staff
      to check on the situation without making unsupported accusations. Speak a concise report of what
      you observed and where help is needed. Then rehearse a private follow-up: I noticed that interaction;
      would you like company or help finding staff? Practice accepting no, and repeat with staff unavailable
      so that you choose another safe option rather than escalating automatically.


      Observation checks: An indirect intervention is actually rehearsed; The report describes observations
      rather than inferred motives; A follow-up offer allows the person to decline; Unavailable staff
      lead to a reconsidered safe route. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01
      action_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A2
      competency_stable_id: '15.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1513_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1513_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_indirect_intervention_is_actually_rehearsed
        - the_report_describes_observations_rather_than_inferred_motives
        - a_follow_up_offer_allows_the_person_to_decline
        - unavailable_staff_lead_to_a_reconsidered_safe_route
      - measurement_id: c1513_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1513_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A3
    sequence: 3
    title: Review whether the intervention added protection or pressure
    instructions: 'Check whether your words exposed the person, demanded a story, escalated the aggressor
      or promised help you could not provide. Revise the weakest part and rehearse again. Identify a local
      emergency route and a relevant specialist or organizational support route for real violence, abuse
      or safeguarding concerns. Record the outcome as rehearsal only; do not seek a real incident or approach
      a vulnerable person to complete the practice.


      Observation checks: Exposure escalation and unwanted pressure are reviewed; A revised response is
      rehearsed after the review; Emergency and specialist routes are distinguished; No real victim or
      incident is sought for practice evidence. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did your chosen action increase safe options for the affected person, or mainly satisfy
      your own wish to do something visible?


      Examples: Supportive: The bystander rehearsed a factual staff report and a private support offer,
      then accepted the scripted person’s refusal without demanding details.


      Mixed: The first script offered help but also pressured the person to report; the revised version
      restored a genuine choice.


      Contradictory: The exercise became a confrontation, public recording or interrogation of someone
      who had not agreed to participate.


      Inconclusive: Five intervention labels were memorized without choosing or rehearsing a response
      in the supplied scene.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01
      action_stable_id: PRACTICE-COMP-1513-BYSTANDER-INTERVENTION-AND-VIOLENCE-PREVENTION-01-A3
      competency_stable_id: '15.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
