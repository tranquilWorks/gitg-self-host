  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Water competence and rescue awareness; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use an accessible pool, adaptive swimming instruction, assistance with transfers and communication
      supports. A dry-land lesson remains worthwhile when water entry is unsuitable, but it does not count
      as swimming or floating evidence. Do not use another learner as a rescue victim or a person’s consent
      as a substitute for rescue qualifications.
    cultural_context:
    - Adapt the expression of Water competence and rescue awareness to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use an accessible pool, adaptive swimming instruction, assistance with transfers and communication
      supports. A dry-land lesson remains worthwhile when water entry is unsuitable, but it does not count
      as swimming or floating evidence. Do not use another learner as a rescue victim or a person’s consent
      as a substitute for rescue qualifications.
  pause_conditions:
  - Pause Water competence and rescue awareness when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Water competence and rescue awareness practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Water competence and rescue awareness situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
