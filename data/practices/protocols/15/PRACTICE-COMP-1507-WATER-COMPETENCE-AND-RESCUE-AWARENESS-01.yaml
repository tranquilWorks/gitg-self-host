meaning_and_fit:
  purpose: Know which swimming and self-support skills you can demonstrate in a controlled setting and
    how to summon or support rescue without entering unsafe water.
  why_recommended: Know which swimming and self-support skills you can demonstrate in a controlled setting
    and how to summon or support rescue without entering unsafe water.
  claims:
  - statement: Know which swimming and self-support skills you can demonstrate in a controlled setting
      and how to summon or support rescue without entering unsafe water.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Water competence and rescue awareness practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Water competence and rescue awareness as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible pool, adaptive swimming instruction, assistance with transfers
    and communication supports. A dry-land lesson remains worthwhile when water entry is unsuitable, but
    it does not count as swimming or floating evidence. Do not use another learner as a rescue victim
    or a person’s consent as a substitute for rescue qualifications.
  opportunity_considerations: Use a qualified swimming instructor or approved accessible water program.
    Tell them your actual experience, access needs and concerns before entering water. Bring no assumption
    that you must reach a particular distance today. The dry-land scenario is seeing someone struggling
    beyond a safe reach from shore.
  prerequisites:
  - Use a qualified swimming instructor or approved accessible water program. Tell them your actual experience,
    access needs and concerns before entering water. Bring no assumption that you must reach a particular
    distance today. The dry-land scenario is seeing someone struggling beyond a safe reach from shore.
  dependencies: []
  safe_alternatives:
  - Use an accessible pool, adaptive swimming instruction, assistance with transfers and communication
    supports. A dry-land lesson remains worthwhile when water entry is unsuitable, but it does not count
    as swimming or floating evidence. Do not use another learner as a rescue victim or a person’s consent
    as a substitute for rescue qualifications.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Water competence and rescue awareness differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Water competence and rescue
    awareness as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a qualified swimming instructor or approved accessible water program. Tell them your actual
    experience, access needs and concerns before entering water. Bring no assumption that you must reach
    a particular distance today. The dry-land scenario is seeing someone struggling beyond a safe reach
    from shore. Goal: Know which swimming and self-support skills you can demonstrate in a controlled
    setting and how to summon or support rescue without entering unsafe water. Scope: No unsupervised
    swim test, breath-holding, cold-water immersion, current exposure or in-water rescue is part of this
    practice. A pool assessment does not establish competence in open, cold or moving water. Time and
    effort: Fifteen minutes for the hazard card, a suitably supervised water-safety lesson or assessment
    and a ten-minute review. Adaptation: Use an accessible pool, adaptive swimming instruction, assistance
    with transfers and communication supports. A dry-land lesson remains worthwhile when water entry is
    unsuitable, but it does not count as swimming or floating evidence. Do not use another learner as
    a rescue victim or a person’s consent as a substitute for rescue qualifications. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible pool, adaptive swimming instruction, assistance with transfers
    and communication supports. A dry-land lesson remains worthwhile when water entry is unsuitable, but
    it does not count as swimming or floating evidence. Do not use another learner as a rescue victim
    or a person’s consent as a substitute for rescue qualifications.
  expected_burden: Fifteen minutes for the hazard card, a suitably supervised water-safety lesson or assessment
    and a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Water competence and rescue awareness protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Water competence and rescue awareness action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    pool, adaptive swimming instruction, assistance with transfers and communication supports. A dry-land
    lesson remains worthwhile when water entry is unsuitable, but it does not count as swimming or floating
    evidence. Do not use another learner as a rescue victim or a person’s consent as a substitute for
    rescue qualifications.
  actions:
  - stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01-A1
    sequence: 1
    title: Compare the proposed water setting with your demonstrated ability
    instructions: 'List the setting’s depth, entry and exit, temperature, current or waves, visibility,
      supervision and suitable flotation arrangements. Mark swimming, floating or treading, turning, returning
      to an exit and safe entry as demonstrated, untested or requiring assistance, based on actual experience
      rather than confidence. For cold or moving water, retain an untested disposition unless relevant
      qualified training establishes otherwise. Decide with the instructor whether entering is appropriate
      at all.


      Observation checks: Environment hazards are considered separately from swimming confidence; Five
      basic skill areas have evidence-based dispositions; Cold current and open-water transfer are not
      assumed; The instructor and participant agree whether water entry is suitable. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01
      action_stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01-A1
      competency_stable_id: '15.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1507_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1507_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - environment_hazards_are_considered_separately_from_swimming_confidence
        - five_basic_skill_areas_have_evidence_based_dispositions
        - cold_current_and_open_water_transfer_are_not_assumed
        - the_instructor_and_participant_agree_whether_water_entry_is_suitable
      - measurement_id: c1507_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1507_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01-A2
    sequence: 2
    title: Complete only the instructor-approved skill progression
    instructions: 'During the supervised session, follow the instructor’s safe progression for entry and
      resurfacing, floating or treading, turning, swimming toward safety and exiting, using the supports
      appropriate to your needs. The instructor may shorten, adapt or omit tasks; do not remove flotation
      or enter deeper water to satisfy this list. Record which skills were actually observed, under what
      support and in what setting. Attendance alone is not a pass, and an omitted skill remains untested.


      Observation checks: A qualified supervised session occurs rather than a self-test; Only approved
      skills and depths are attempted; Support and setting accompany each observed skill; Omitted or incomplete
      tasks remain untested without shame. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01
      action_stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01-A2
      competency_stable_id: '15.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1507_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1507_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_qualified_supervised_session_occurs_rather_than_a_self_test
        - only_approved_skills_and_depths_are_attempted
        - support_and_setting_accompany_each_observed_skill
        - omitted_or_incomplete_tasks_remain_untested_without_shame
      - measurement_id: c1507_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1507_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01-A3
    sequence: 3
    title: Rehearse a shore-based help decision and set your limit
    instructions: 'On dry land, respond to the struggling-person scenario by identifying a lifeguard or
      local emergency route and a safe way to alert others. Explain the reach-or-throw principle without
      entering water, leaning beyond stable footing or practicing a pull with a person. Review available
      rescue equipment only with qualified guidance. Write the water settings you will avoid or use only
      with agreed supervision, and name the next skill to learn if appropriate.


      Observation checks: The rescue response is rehearsed on dry land; Calling trained help comes before
      an improvised in-water rescue; No unstable reach pull or entry is attempted; A personal setting
      and supervision boundary follows the observed assessment. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What can you demonstrate in this exact water setting, and what tempting generalization
      to deeper, colder or moving water must you reject?


      Examples: Supportive: An instructor observed supported floating and a safe exit; the participant
      retained deep-water swimming as untested and rehearsed summoning a lifeguard from shore.


      Mixed: The participant swam in a pool but could not exit independently, so the supervision and access
      boundary stayed in place.


      Contradictory: A person entered cold water alone or jumped after a struggling swimmer to prove readiness.


      Inconclusive: An online water-safety quiz was reported as proof of swimming or rescue competence.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01
      action_stable_id: PRACTICE-COMP-1507-WATER-COMPETENCE-AND-RESCUE-AWARENESS-01-A3
      competency_stable_id: '15.07'
