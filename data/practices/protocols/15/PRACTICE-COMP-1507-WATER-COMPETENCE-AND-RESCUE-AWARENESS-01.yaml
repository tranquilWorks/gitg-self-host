    body: 'The fictional instructor''s later note says the learner turns toward the steps without a verbal
      cue on one subsequent attempt. No other task was reassessed. Update orientation only. Do not remove
      the aid from the swimming record or the assistance from the exit record.


      The pool announces its steps are temporarily closed. The ladder has not been assessed for this learner.
      Pause the planned session and ask the instructor about a suitable alternative; an earlier assisted
      step exit does not validate the ladder.


      A friend interprets the 20-second assisted float as proof the learner can manage the cold river.
      That contradicts both the support condition and the environment boundary. Reject the transfer claim
      without calling the learner incapable of future learning.


      The planned real lesson is canceled. Booking and preparation occurred if actually performed; no
      new aquatic observation occurred. None of these supplied notes is your real swim record.


      A sound revision preserves the one supported gain, leaves the other four categories scoped, and
      keeps river/cold-water/rescue competence unestablished. The help-point rehearsal can improve communication
      without converting the learner into a rescuer.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Establish your actual water boundary


      Begin on dry land with the fictional lesson record below. Allow twenty-five minutes to distinguish
      observed skills from missing evidence and choose a safe next learning step. You need only the supplied
      record and somewhere to write or dictate. This exercise never requires entering water, holding your
      breath, cold immersion, swimming against a current or rescuing a person. Qualified aquatic instruction
      is the route to physical skill.


      ### Competence is a sequence in a setting


      Swimming a distance is one part of water competence. Safe entry and resurfacing, floating or treading,
      changing orientation, reaching a safe exit and getting out also matter. Assistance, equipment, fatigue
      and the environment affect what a demonstration establishes. The Red Cross describes these components
      and layers of protection; its skill benchmarks belong in appropriate instruction, not an unsupervised
      self-test. See S06 in [SOURCES](?resource=sources).


      Floating supports remaining at the surface; treading is another way to maintain position using movement.
      Neither label tells you whether a particular learner can do it without assistance in a particular
      setting. A record should name which was observed, for how long if measured, and with what support.
      “Comfortable in water” leaves all of that unclear. An instructor may adapt or omit a task and record
      why; omission is not failure, and assisted performance should remain accurately described.


      The environment changes the task. Pool depth and a ladder differ from a bank with no stable exit.
      Cold water can abruptly disrupt breathing and movement. Moving water adds forces a pool lesson did
      not assess. RNLI guidance explains cold-water shock and the value of appropriate flotation and learning
      how to float; this guide does not turn that knowledge into permission to try cold water. See S07.
      Check conditions, supervision, entry, exit, visibility and activity-appropriate flotation before
      an outing. A buoyancy toy is not a substitute for a suitable approved lifejacket.


      Rescue awareness includes protecting the would-be helper. Someone struggling may not be able to
      wave or call clearly. Alert a lifeguard or appropriate emergency help promptly. The Red Cross''s
      reach-or-throw principle avoids entering the water, but it still requires a stable safe position,
      appropriate equipment and relevant instruction. Do not lean over an unstable edge, improvise a pull
      on a person, or enter because help seems slow. This exercise practices recognizing the boundary
      and communicating location, not a rescue maneuver.


      ### Worked example


      A record says, “Ari swam eight metres with a flotation aid, then an instructor helped them use the
      steps.” A friend summarizes that as “Ari swims and can get out.” That removes two material conditions.
      A faithful summary is “eight metres with the named aid; assisted exit by steps; unsupported exit
      unassessed.” The next step is an instructor-guided assessment or lesson suited to Ari''s needs,
      not a deeper-water challenge to settle the argument.


      ### Fictional record and environment cards


      No real learner or instructor is represented. There is no hidden expectation that you reproduce
      these tasks physically.


      | Skill | Instructor''s fictional observation |

      | --- | --- |

      | Entry and resurfacing | Controlled entry with support; resurfacing without support not assessed
      |

      | Float or tread | Back float for 20 seconds with an aid; treading not assessed |

      | Turn/orient | Turn toward steps after a verbal cue |

      | Swim toward safety | Eight metres with the same aid; no other distance assessed |

      | Exit | Steps used with instructor assistance; ladder exit not assessed |


      Environment A is a staffed lesson pool with an instructor-selected depth, approved assistance, clear
      steps and an agreed stop signal. Environment B is a cold river with visible current, poor visibility,
      an unstable bank, no confirmed exit and no lifeguard. Environment C is a leisure pool described
      by a friend as “easy”; depth, access and supervision are not yet known. An invitation is not an
      assessment of conditions.


      A separate rescue vignette occurs entirely on paper: at a waterfront you observe someone making
      no forward progress beyond safe reach. You are on stable public ground well away from the edge.
      A marked help point is behind you. A trained staff member is present there. You have no rescue training
      or suitable equipment in hand.


      ### Make the boundary usable


      1. Copy the five skill rows and separate “observed with stated support,” “observed without support,”
      and “not assessed.” Keep partial evidence: a turn after a cue is neither a total absence of skill
      nor an independent demonstration.

      2. For A, B and C, choose an appropriate next action using the information supplied. A supports
      further instructor-led learning if the instructor confirms suitability; B does not support entry
      by this learner; C needs clarification before participation. List the missing information for C.

      3. Draft two questions for the instructor. One should ask how a task can be safely adapted; the
      other should ask what evidence would establish the next skill in that environment. Do not request
      a certificate that silently covers unassessed conditions.

      4. Rehearse the waterfront report aloud, with a communication aid or in writing: the location, observed
      difficulty, where the person was last seen and the need for trained help. In this paper case, delegate
      to the marked staffed help point; in a real emergency contact local emergency services as appropriate.
      Do not dial or send anything for rehearsal.

      5. Explain why entering, reaching from the unstable bank or trying to pull a partner would exceed
      this exercise. Say what the reach-or-throw principle does and does not authorize. There is no throwing
      or pulling drill here.

      6. Save a one-paragraph water boundary that names demonstrated support, unassessed skills and environments,
      and the next qualified learning route. Then open the [later packet](?resource=file-later-packet-md).


      ### Check the claim, not your courage


      Your paper classification and report are actual tasks only if you attempted them. The supplied swim
      observations remain fictional. Confidence, swimming years ago, booking a lesson and understanding
      cold-water risk do not establish present physical competence. A lesson can show meaningful partial
      progress without earning a broad “water safe” label.


      For a supported version, use one skill row at a time and ask a helper to read the cards. Keep aids
      and assistance visible in the record. A harder version changes the pool''s usual steps to a ladder;
      reconsider exit suitability rather than assuming all exits are equivalent.


      For real transfer, locate qualified aquatic instruction appropriate to your age, access needs and
      health circumstances. Discuss the setting, assistance, consent and stop signal before entering.
      The instructor selects safe tasks and documents entry/resurfacing, float or tread, orientation,
      swimming and exit as observed, assisted, omitted or still untested. They determine whether any further
      environment-specific course is suitable. Dryland work remains a useful alternative when water practice
      is unavailable, but cannot establish demonstrated aquatic skill. Use the [fresh checks](?attempt=practice-checks)
      and [key](?check=practice-answers) separately.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. You swim in a warm pool, but an outing offers a cold lake with no confirmed exit. What does
      your pool experience establish about this invitation?

      2. A learner floats with an aid and climbs steps with assistance. Their record is summarized as
      “independent water competence.” Correct it without discarding genuine progress.

      3. A person struggles beyond safe reach from an unstable bank. You are not rescue-trained. What
      is the relevant rescue-awareness decision?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. It provides setting-specific experience, not an assessment of the lake, its cold-water risks
      or exit. Do not accept entry on that evidence. Obtain appropriate local conditions and qualified
      guidance; deferring the outing is valid.

      2. Preserve assisted floating and assisted step exit as observed. Independent performance, other
      skills and other environments remain unassessed. Replacing “independent” with the actual supports
      is more accurate than labeling the entire effort a failure.

      3. Seek trained/emergency help promptly from a safe position and provide location and observed difficulty.
      Do not enter, lean from unstable ground or improvise a human pulling drill. “Reach or throw” is
      bounded by safe position, equipment and competence; it is not an obligation to attempt an unsafe
      maneuver.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
