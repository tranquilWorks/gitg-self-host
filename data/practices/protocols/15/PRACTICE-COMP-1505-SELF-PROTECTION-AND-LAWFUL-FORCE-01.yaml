  - stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01-A3
    sequence: 3
    title: Take the appropriate next step without manufacturing a confrontation
    instructions: 'Choose to attend a suitable introductory session, request a non-contact adaptation,
      seek another provider or defer with an identified reason. If attending, follow only the qualified
      instructor’s agreed beginner activity and record what was actually assessed, not a claim that you
      could now prevail in an assault. Complete an aftermath card: move to safety, seek urgent medical
      or emergency help when needed, follow lawful reporting and obtain qualified legal advice after a
      serious incident.


      Observation checks: The selected next step follows the provider evidence; Physical participation
      occurs only under suitable instruction and consent; Assessed performance is not generalized to an
      uncontrolled assault; Medical emergency reporting and legal aftermath routes are included. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.


      Final review: What made the chosen training or deferral responsible, and which legal, physical and
      situational limits still prevent a broad safety claim?


      Examples: Supportive: The participant rejected a provider promising guaranteed street success, chose
      consent-based introductory training and kept legal-force questions assigned to a qualified local
      source.


      Mixed: A provider had credible instruction but no suitable accessible route yet, so participation
      remained deferred rather than forced.


      Contradictory: The exercise became a plan to punish someone, test a weapon or stage an unexpected
      attack on a friend.


      Inconclusive: A certificate or dramatic video was treated as proof of realistic self-protection
      without checking training conditions or limits.'
    expected_time: 15-25 minutes
    due_within_days: 10
