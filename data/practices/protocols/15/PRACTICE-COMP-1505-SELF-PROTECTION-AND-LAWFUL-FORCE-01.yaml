  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Self-protection and lawful force; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Non-contact awareness, accessible escape planning and calling for assistance can be legitimate goals
      when contact training is unsuitable. There is no obligation to train in violence or acquire a weapon.
      Do not rehearse with an abusive person or expose yourself to danger to obtain evidence.
    cultural_context:
    - Adapt the expression of Self-protection and lawful force to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Non-contact awareness, accessible escape planning and calling for assistance can be legitimate goals
      when contact training is unsuitable. There is no obligation to train in violence or acquire a weapon.
      Do not rehearse with an abusive person or expose yourself to danger to obtain evidence.
  pause_conditions:
  - Pause Self-protection and lawful force when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Self-protection and lawful force practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Self-protection and lawful force situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
