meaning_and_fit:
  purpose: Distinguish avoidance, emergency assistance and qualified physical training from fantasies
    of control, punishment or guaranteed safety.
  why_recommended: Distinguish avoidance, emergency assistance and qualified physical training from fantasies
    of control, punishment or guaranteed safety.
  claims:
  - statement: Distinguish avoidance, emergency assistance and qualified physical training from fantasies
      of control, punishment or guaranteed safety.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Self-protection and lawful force practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Self-protection and lawful force as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Non-contact awareness, accessible escape planning and calling for assistance
    can be legitimate goals when contact training is unsuitable. There is no obligation to train in violence
    or acquire a weapon. Do not rehearse with an abusive person or expose yourself to danger to obtain
    evidence.
  opportunity_considerations: 'Use the supplied fictional scene: an argument ends when you can safely
    leave, but you feel tempted to return and prove a point. Prepare a training-provider checklist covering
    consent, injury prevention, de-escalation, escape, accessible alternatives, instructor qualifications
    and realistic legal limitations.'
  prerequisites:
  - 'Use the supplied fictional scene: an argument ends when you can safely leave, but you feel tempted
    to return and prove a point. Prepare a training-provider checklist covering consent, injury prevention,
    de-escalation, escape, accessible alternatives, instructor qualifications and realistic legal limitations.'
  dependencies: []
  safe_alternatives:
  - Non-contact awareness, accessible escape planning and calling for assistance can be legitimate goals
    when contact training is unsuitable. There is no obligation to train in violence or acquire a weapon.
    Do not rehearse with an abusive person or expose yourself to danger to obtain evidence.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Self-protection and lawful force differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Self-protection and lawful
    force as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied fictional scene: an argument ends when you can safely leave, but you feel tempted
    to return and prove a point. Prepare a training-provider checklist covering consent, injury prevention,
    de-escalation, escape, accessible alternatives, instructor qualifications and realistic legal limitations.
    Goal: Distinguish avoidance, emergency assistance and qualified physical training from fantasies of
    control, punishment or guaranteed safety. Scope: This does not teach fighting, weapons or the legal
    justification for force. Local law, the circumstances and qualified instruction must determine any
    real physical response. Time and effort: Twenty minutes to review boundaries, one provider inquiry
    or observation and a twenty-minute comparison; practical participation follows the instructor’s safe
    program. Adaptation: Non-contact awareness, accessible escape planning and calling for assistance
    can be legitimate goals when contact training is unsuitable. There is no obligation to train in violence
    or acquire a weapon. Do not rehearse with an abusive person or expose yourself to danger to obtain
    evidence. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Non-contact awareness, accessible escape planning and calling for assistance can
    be legitimate goals when contact training is unsuitable. There is no obligation to train in violence
    or acquire a weapon. Do not rehearse with an abusive person or expose yourself to danger to obtain
    evidence.
  expected_burden: Twenty minutes to review boundaries, one provider inquiry or observation and a twenty-minute
    comparison; practical participation follows the instructor’s safe program.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Self-protection and lawful force protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Self-protection and lawful force action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Non-contact
    awareness, accessible escape planning and calling for assistance can be legitimate goals when contact
    training is unsuitable. There is no obligation to train in violence or acquire a weapon. Do not rehearse
    with an abusive person or expose yourself to danger to obtain evidence.
  actions:
  - stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01-A1
    sequence: 1
    title: Separate protection from retaliation in three decision points
    instructions: 'For the scene, write what changes when an exit becomes available, when the other person
      stops pursuing and when help arrives. At each point identify the protective aim and the action that
      would instead become pursuit, punishment or pride. List questions for a qualified local legal source
      about necessity, proportionality, retreat or other jurisdiction-specific duties, reporting and aftermath.
      Do not answer those legal questions from a generic internet slogan.


      Observation checks: Three changing decision points receive distinct dispositions; Protection is
      separated from pursuit and retaliation; Jurisdiction-specific legal questions remain explicitly
      unresolved until checked; No general legal permission to use force is asserted. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01
      action_stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01-A1
      competency_stable_id: '15.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
