  - stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01-A2
    sequence: 2
    title: Evaluate a real training provider against safety and realism
    instructions: 'Contact or observe a qualified provider without participating in a contact drill yet.
      Ask how beginners can decline or stop, how injuries and accessibility needs are handled, whether
      avoidance and escape are taught, what instructor qualifications can be verified, and how legal claims
      are bounded. Treat guaranteed victory, humiliation, surprise attacks and pressure to train through
      injury as reasons not to proceed. Record the actual answers, not the provider’s marketing label
      alone.


      Observation checks: A real provider inquiry or observation occurs; Consent stopping injury prevention
      and accessibility are checked; Qualifications and claims are distinguished from advertising; Unsafe
      or unrealistic answers can lead to rejecting the provider. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01
      action_stable_id: PRACTICE-COMP-1505-SELF-PROTECTION-AND-LAWFUL-FORCE-01-A2
      competency_stable_id: '15.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1505_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1505_a2_primary
        kind: artifact
