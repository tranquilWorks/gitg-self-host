  - id: file-later-packet-md
    title: Later packet
    body: 'A''s issuer confirms the named credential is current for noncontact safety education. The provider
      has not yet assessed the learner, and no physical-defense qualification has been established. The
      correct update is narrower than “approved self-defense expert.” Ask what qualification covers any
      later physical instruction.


      B replies that stopping would “ruin realism.” This confirms the original consent defect; confidence
      and realism claims do not repair it. No live test is warranted.


      C confirms it teaches its sport and does not claim transfer to real assaults. That honest limit
      may support a sport learning goal. It still leaves this competency''s defensive training and local-law
      questions open.


      A local official page cannot be found during the exercise. Record the legal question unresolved
      and identify an appropriate professional route. Missing information is not evidence that no limits
      apply.


      Supportive evidence: specific credential scope and a workable consent process. Mixed: suitable introduction,
      physical curriculum unverified. Contradictory: an “everywhere legal” assertion. Inconclusive: no
      reply. Your actual result is the evaluation you performed; none of these fictional replies is a
      real provider verification.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Evaluate self-protection without borrowing certainty


      Use the three fictional training offers and decision points below. In about twenty-five minutes,
      choose whether to investigate, defer or reject each offer and draft a local-law question that a
      qualified adviser could answer. No physical contact, weapons, restraint, pain, surprise attacks
      or confrontation are part of this exercise. A good outcome is a credible training route and an honest
      limit, including deciding not to train yet.


      ### Protection has a purpose and a stopping point


      Self-protection begins with avoiding danger where possible, leaving, getting help and reducing exposure.
      Physical defense can involve severe consequences; a written guide cannot make it safe or qualify
      you to perform it. Instruction should match your body, needs and setting, with consent, progressive
      practice, an effective stop procedure and appropriate injury response. A class''s confidence claims
      and its practical evidence are different things.


      Distinguish a protective purpose from retaliation. A choice directed at escaping an immediate threat
      differs from returning after reaching safety to restore pride or punish someone. Your emotions after
      danger are real, but anger does not itself establish necessity. Reassess as circumstances change;
      a response justified at one moment is not automatically justified later. Do not translate this ethical
      distinction into a universal legal formula.


      Local law determines such questions as what force is lawful, how necessity and reasonableness are
      assessed, whether retreat duties apply, and how defense of another or property differs. Jurisdiction,
      setting, facts and current law matter. “Reasonable force” is not a fixed quantity you can memorize.
      A trainer''s slogan cannot resolve an individual case. GOV.UK''s page concerns intruders in the
      home and warns about continuing an attack after danger ends; it cannot be generalized to every street
      encounter or country. This is a limited legal-literacy example, not case advice. See S03 in [SOURCES](?resource=sources).


      Aftermath belongs in preparation. First seek safety and appropriate urgent medical help. Follow
      relevant reporting requirements and qualified legal advice; distinguish your observations from uncertain
      recollections. Do not coordinate stories, post accusatory footage, pursue someone, or assume that
      absence of visible injury settles the matter. A support person or specialist service can help with
      the effects of an incident. Preserve privacy without concealing information that a lawful process
      requires.


      ### Worked example: an attractive claim with missing evidence


      A flyer says “certified instructor; never lose again.” Rowan asks who issued the credential, whether
      it is current and relevant, and how a participant stops an exercise. The provider names a sports
      award but refuses to explain consent or injury arrangements. Rowan records “sport credential stated;
      suitability and safety process unresolved,” not “qualified for personal safety.” The promise of
      guaranteed victory is a reason to reject the claim, not a reason to demand a live demonstration.


      ### Supplied materials


      All providers and statements are invented. They are not recommendations or claims about actual organizations.


      | Offer | What is actually supplied |

      | --- | --- |

      | A: North Hall introduction | Noncontact discussion first; participant may stop or observe; named
      qualification and issuer available for checking; accessibility conversation offered; curriculum
      includes avoidance, exit decisions and aftermath; no guarantee; local legal referral provided |

      | B: Invincible Weekend | “Works on everyone”; surprise attack assessment; cannot stop midway; “our
      certificate makes force legal everywhere”; no written injury plan |

      | C: Riverside sport class | Relevant sport instructor credential stated; clear sport rules and
      consent; accessible trial possible; provider explicitly does not teach local self-defense law or
      street safety; no evidence yet about your personal learning needs |


      A qualification listed on a flyer is still unverified. A relevant sport can be valuable without
      being a complete self-protection course. Rejection of B''s unsafe offer says nothing about the dignity
      of its participants.


      Your fictional incident has three checkpoints: P1, an argument ends and a clear exit is available;
      P2, from a safer staffed area you see the other person walking away; P3, help arrives and asks what
      happened. There is no continuing pursuit or attack in these facts. Do not add one to justify a preferred
      action.


      ### Build the training and decision record


      1. For P1–P3, write the current protective objective and one action inconsistent with it. For example,
      at P2 preserve distance and support rather than returning to punish. Do not prescribe a physical
      technique.

      2. For each offer, mark what is stated, what needs verification and what is disqualifying for this
      exercise. Include qualifications, consent/stop, adaptation, injury care, avoidance/escape teaching,
      legal limits and aftermath. A high total on other features cannot compensate for a refused stop
      procedure.

      3. Choose a provisional next step. For A, it might be an information request before any attendance;
      for C, a sport-only trial if that meets a separate goal; for B, decline. Explain what evidence could
      change a deferred decision and what promise you would still reject.

      4. Draft this local inquiry in your own words: “For [actual jurisdiction and setting], where can
      I read current official guidance on necessity, proportionality/reasonableness, retreat where applicable,
      and obligations after an incident? Which questions require individual legal advice?” Leave the placeholders
      clearly unresolved if you are using the fictional route. Do not fill them with internet folklore.

      5. Create an aftermath sequence with safety, urgent health needs, appropriate reporting/legal help,
      factual private notes and personal support. Explain which step cannot wait for completion of a worksheet
      in a real emergency.

      6. Audit your final wording. Replace “I can defend myself now” with what you actually did: “I evaluated
      training offers and identified legal questions.” Save the comparison and open the [later packet](?resource=file-later-packet-md).


      ### Keep the evidence specific


      A provisionally suitable provider is not verified enrollment; enrollment is not observed skill;
      one observed skill is not guaranteed effectiveness under assault. Record setting, support, instruction
      and any assessed task when actual training occurs. You do not owe anyone a demonstration of violence
      to prove progress.


      For a lighter version, compare A and B and explain the stop rule before considering C. Discuss or
      dictate rather than write if helpful. Avoid autobiographical violence accounts; the fictional checkpoints
      are sufficient. A harder version asks whether A''s verified sport credential covers the proposed
      defensive curriculum. The answer may remain unresolved until a relevant accreditor or qualified
      reviewer explains its scope.


      For real transfer, use an independently located local provider or qualified service to verify one
      relevant credential and discuss accommodations before committing. If risk involves coercive control,
      stalking, discriminatory targeting or a specific threat, generic classes may not address it; seek
      appropriate specialist planning. Complete the [fresh checks](?attempt=practice-checks) before the
      [corrective key](?check=practice-answers). Neither the key nor a course advertisement supplies legal
      advice or hands-on qualification.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A trainer has an excellent competition record and allows breaks but promises its certificate
      authorizes force in any country. How do you evaluate this combination?

      2. A person has reached safety and wants to return to teach an aggressor a lesson. Which distinction
      matters, and can this guide give a legal verdict?

      3. Your introductory class covered exit planning only. How should you describe your progress and
      next physical-training decision?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Sporting achievement and breaks do not validate the universal legal claim. Reject that claim
      and do not treat the offer as suitable until material safety and legal misrepresentation is resolved;
      seek a credible alternative. Legal authority does not come from a private training certificate.

      2. Returning to punish differs from a current protective purpose, and changes in danger require
      reassessment. This guide cannot decide liability. Safer planning and current local professional
      advice are appropriate; do not invent an ongoing attack or infer lawful force from anger.

      3. Record attendance and any actually observed exit-planning performance only. Physical defense
      remains unassessed. Verify relevant qualifications, consent, adaptation and injury arrangements
      before deciding on qualified practical instruction; deferral is valid.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
