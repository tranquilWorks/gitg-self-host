      - [NCSC — Managing your passwords](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Fictional R2 arrives Day 2 at 12:00 from the same training authority: outdoor smoke now affects
      the district; consult the current smoke guidance and venue operator before using outdoor-air measures.
      R2 does not say respiratory illness has ended or that every building has the same air quality.


      The venue operator cannot confirm a suitable in-person arrangement before 18:00. The organizer chooses
      the established telephone/online alternatives and removes the attendance penalty. Opening windows
      automatically would conflict with the new uncertainty. Record the format decision and its limits;
      do not claim a measured reduction in illness or pollutant exposure.


      A reader''s teach-back says, “Only people with a diagnosis can phone in.” That contradicts the stated
      access rule. Revise the notice to say the telephone option is available to everyone without health
      disclosure, then check understanding again. Their corrected reply is simulated here; only feedback
      you actually obtained can be recorded as actual.


      A member does not respond. Reach and understanding remain unknown for that member. Do not mark all
      twelve informed from one reply. The original R1 remains part of the chronology, but the relevant
      outdoor-air action needs the R2 review. No fixed isolation duration or vaccine regimen can be inferred
      from either fictional notice.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Turn a health notice into a proportionate, accessible plan


      Use the clearly fictional club notice below. In about thirty minutes you will identify its authority
      and scope, choose practical measures within an organizer''s role, and correct a misunderstanding.
      Do not diagnose participants, collect health histories, announce an actual outbreak or invent an
      isolation schedule. The default exercise is planning and communication; current local public-health
      and individual clinical guidance govern real situations.


      ### Read the recommendation in its setting


      A health message needs an issuing authority, date, affected place or population, recommended action
      and review trigger. A screenshot missing those details can be old, partial or intended for another
      setting. Healthcare, schools and ordinary community gatherings may have different guidance. Check
      the underlying current source rather than applying the strictest remembered rule everywhere or assuming
      that no new headline means no risk.


      Infection-control measures reduce opportunities for spread; they do not guarantee that nobody will
      become ill. CDC''s respiratory-illness guidance describes immunization, hygiene, cleaner air and
      precautions while sick as core strategies, with additional measures for relevant circumstances.
      Immunization recommendations depend on the person and current guidance; discuss individual questions
      with a qualified clinician. This guide does not prescribe a vaccine, medication or schedule. See
      S14 in [SOURCES](?resource=sources).


      Staying away from others when ill can protect people, but a usable plan also addresses the costs
      of absence. Remote participation, a postponed activity, food or supply support through an agreed
      route, and avoiding penalties can make protective choices more feasible. Do not require someone
      to reveal a diagnosis to use the alternative. When a pathogen-specific instruction uses isolation
      or exclusion, read its start, end and exception criteria in the current relevant guidance; do not
      fill gaps from memory. Emergency symptoms or urgent clinical concerns need appropriate medical help,
      not a club organizer''s assessment.


      Cleaner air can involve outdoor air, filtration or a suitable alternate setting. Opening windows
      is not automatically appropriate during smoke, poor outdoor air, extreme temperatures or a building
      safety issue. Use the building operator and current hazard-specific guidance; do not adjust equipment
      beyond your authority. CDC''s cleaner-air page supplies general respiratory prevention options,
      not a universal design specification or a guarantee for this room. See S15 and EPA’s smoke-specific
      context in S20. A mask instruction also needs appropriate current context and access; it should
      not become a reason to shame or exclude someone from all participation.


      Risk communication should say what is known, what action follows, what remains uncertain and when
      the decision will be checked. Avoid labeling individuals as sources of danger. People at higher
      risk may need different protections and private clinical advice; the group can support access without
      making them disclose medical details publicly.


      ### Worked example


      An organizer drafts, “Everyone must prove they are healthy to attend.” There is no reliable simple
      proof, and the wording pressures disclosure. They revise to a dated plan linked to the relevant
      notice, a clear remote option without diagnosis requirements, and a request to follow current stay-away
      guidance when ill. They ask the venue about cleaner-air measures instead of declaring the room safe.
      The revision reduces both unsupported certainty and an access barrier.


      ### Original fictional materials


      **Training notice R1 — fictional municipal public-health desk, Day 1 at 09:00:** Increased respiratory
      illness is being monitored in the district. For ordinary indoor clubs, review cleaner-air arrangements
      with the venue, support staying away when ill under current guidance, make a remote or postponed
      option available, and consult current official advice on additional precautions and immunizations.
      Review before the next gathering or when the desk updates this notice. This is not a diagnosis,
      a real outbreak alert or an isolation timetable.


      Your fictional club has twelve participants and a meeting planned tomorrow at 18:00. The organizer
      may change the meeting format and send a group notice. Only the venue operator may assess or change
      ventilation equipment. A no-cost telephone participation option is available for all twelve; no
      diagnosis is needed to use it. The usual online link supports captions but depends on internet access.
      A member privately asks for an option with less exposure and no explanation of their health. Another
      says they cannot miss the session without losing their role; the organizer has authority to remove
      that penalty. No one has provided an actual illness or exposure history.


      ### Make the plan and test its meaning


      1. Extract R1''s issuer, fictional date/time, setting, actions and update trigger. Mark what it
      does not supply: a diagnosis, individual vaccine recommendation, ventilation measurement or fixed
      isolation duration.

      2. Choose an action for each of six areas: cleaner air, hygiene, staying away/isolation guidance,
      current immunization information, additional precautions and support for people needing an alternative.
      Name the responsible person or source. Do not make the organizer a clinician or an HVAC specialist.

      3. Use the supplied resources to remove at least one access burden. Explain how the telephone route
      and removal of the attendance penalty help without collecting health details. An available remote
      option still needs a working way to join.

      4. Draft a short practice-only notice saying what the club will do, where guidance comes from, how
      to participate another way and when the decision will be reviewed. Label it fictional. Keep personal
      requests out of the group notice. Do not send it.

      5. Ask a willing reader to explain the action and alternative in their own words. Alone, close the
      draft and reconstruct them later; label this self-recall, not recipient feedback. Correct one ambiguous
      line and check again. Record the wording change without storing anyone''s health information.

      6. Open the [later packet](?resource=file-later-packet-md), which introduces a different environmental
      constraint. Recheck the affected action, source and format. Do not keep an earlier recommendation
      merely because you already wrote it neatly.


      Your output is a scoped notice extraction, a feasible club action/owner list, revised communication
      and actual rehearsal result. There is no clinical evaluation or verified reduction in infection
      here. A clear notice supports communication; it does not establish that everyone followed it or
      that the meeting was safe.


      ### Adapt and use a real source


      For a shorter route, focus on setting, action and review trigger, then add the six areas. Use translation,
      captions, plain text, audio or an agreed communication aid; ask what worked rather than testing
      literacy. A harder paper case removes both internet and the telephone option. Leave participation
      unresolved until a feasible alternative or postponement is arranged; “go remote” is not complete
      when people cannot connect.


      For real transfer, retrieve the current dated guidance from the relevant local public-health authority
      for your actual setting and hazard. Check whether more specific instructions apply, including current
      isolation/exclusion and vaccination guidance. With the responsible organizer, make one feasible
      improvement or communication correction within your authority and ask for teach-back. Individual
      health decisions remain with the person and their clinician. Do not infer an outbreak from this
      lesson. Finish the [fresh checks](?attempt=practice-checks) and [key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A healthcare-facility notice is forwarded to an ordinary club without its date. What should
      you verify before applying it?

      2. A smoke alert arrives after you planned to open all windows for a respiratory-illness precaution.
      What changes?

      3. Three of twelve recipients confirm understanding. Can you record all twelve informed, and should
      you require diagnoses to offer a remote option?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Retrieve the current underlying authority, date, setting, affected group and actions; check
      the club''s applicable guidance. Healthcare instructions may have a different scope. Do not invent
      missing dates or isolation criteria from memory.

      2. Reassess outdoor-air measures using current smoke guidance and the responsible venue operator.
      Use a confirmed suitable alternative or postpone/change format if unresolved. Neither the respiratory
      concern nor the smoke concern disappears because the other exists.

      3. Only three confirmations are established; the other nine remain unconfirmed. Offer the agreed
      accessible alternative without requiring private diagnoses. Delivery, understanding and actual adherence
      are distinct, and none alone proves health outcomes.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
