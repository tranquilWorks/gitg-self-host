  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Public-health emergency competence explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Public-health emergency competence context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Public-health emergency competence observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Public-health emergency competence rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Check the notice’s authority date scope and uncertainty. Observed checks:
    The original issuing authority and date are verified; Location and setting limits are recorded; Routine
    and higher-risk actions are distinguished; Uncertain or changing medical details are referred to current
    guidance. Action 2: Design one activity change that protects access as well as health. Observed checks:
    Air hygiene attendance and additional precautions are considered; One feasible organizer-approved
    change is selected; Individual medical and immunization decisions remain with appropriate care; Access
    cost and privacy burdens are explicitly considered. Action 3: Communicate the plan with a source and
    a revision trigger. Observed checks: The message states the action timing alternative and official
    source; A teach-back or delayed comprehension check occurs; Ambiguity is corrected without overstating
    certainty; A revision trigger and hypothetical status remain visible.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A forwarded warning was shared without checking its
    date, location or issuing authority.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Public-health
    emergency competence contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
