meaning_and_fit:
  purpose: Use dated credible guidance to protect yourself and others during a respiratory outbreak or
    environmental-health warning without inventing rules or shaming affected people.
  why_recommended: Use dated credible guidance to protect yourself and others during a respiratory outbreak
    or environmental-health warning without inventing rules or shaming affected people.
  claims:
  - statement: Use dated credible guidance to protect yourself and others during a respiratory outbreak
      or environmental-health warning without inventing rules or shaming affected people.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Public-health emergency competence practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Public-health emergency competence as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use plain language, translation, accessible remote participation and trusted
    community channels. Lack of paid leave, space or resources may limit a person’s options; route those
    constraints to support rather than blame. Immediate medical danger takes priority over finishing a
    communication exercise.
  opportunity_considerations: Choose a current local public-health notice relevant to an ordinary shared
    activity. When none is active, use a clearly labeled hypothetical indoor club meeting during increased
    respiratory illness and consult current official general prevention guidance. Keep personal diagnoses,
    vaccination status and other people’s medical information out of the record.
  prerequisites:
  - Choose a current local public-health notice relevant to an ordinary shared activity. When none is
    active, use a clearly labeled hypothetical indoor club meeting during increased respiratory illness
    and consult current official general prevention guidance. Keep personal diagnoses, vaccination status
    and other people’s medical information out of the record.
  dependencies: []
  safe_alternatives:
  - Use plain language, translation, accessible remote participation and trusted community channels. Lack
    of paid leave, space or resources may limit a person’s options; route those constraints to support
    rather than blame. Immediate medical danger takes priority over finishing a communication exercise.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Public-health emergency competence differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Public-health emergency competence
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a current local public-health notice relevant to an ordinary shared activity. When none
    is active, use a clearly labeled hypothetical indoor club meeting during increased respiratory illness
    and consult current official general prevention guidance. Keep personal diagnoses, vaccination status
    and other people’s medical information out of the record. Goal: Use dated credible guidance to protect
    yourself and others during a respiratory outbreak or environmental-health warning without inventing
    rules or shaming affected people. Scope: This is a guidance-verification and communication exercise,
    not diagnosis or individualized advice about vaccination, treatment, isolation duration or medical
    vulnerability. Time and effort: Twenty minutes to inspect one official notice, fifteen minutes to
    make a small plan and a ten-minute teach-back or revision. Adaptation: Use plain language, translation,
    accessible remote participation and trusted community channels. Lack of paid leave, space or resources
    may limit a person’s options; route those constraints to support rather than blame. Immediate medical
    danger takes priority over finishing a communication exercise. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use plain language, translation, accessible remote participation and trusted community
    channels. Lack of paid leave, space or resources may limit a person’s options; route those constraints
    to support rather than blame. Immediate medical danger takes priority over finishing a communication
    exercise.
  expected_burden: Twenty minutes to inspect one official notice, fifteen minutes to make a small plan
    and a ten-minute teach-back or revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Public-health emergency competence protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Public-health emergency competence action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use plain language,
    translation, accessible remote participation and trusted community channels. Lack of paid leave, space
    or resources may limit a person’s options; route those constraints to support rather than blame. Immediate
    medical danger takes priority over finishing a communication exercise.
  actions:
  - stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01-A1
    sequence: 1
    title: Check the notice’s authority date scope and uncertainty
    instructions: 'Find the original notice from the relevant public-health or environmental authority
      rather than a forwarded image. Record its date, location, affected settings, recommended actions
      and any update trigger. For the hypothetical respiratory case, separate routine prevention, additional
      precautions when risk is higher, staying away when ill and prompt clinical advice for concerning
      symptoms or higher-risk people. Check current local guidance for specifics instead of copying a
      fixed isolation period into the plan.


      Observation checks: The original issuing authority and date are verified; Location and setting limits
      are recorded; Routine and higher-risk actions are distinguished; Uncertain or changing medical details
      are referred to current guidance. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01
      action_stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01-A1
      competency_stable_id: '15.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1512_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1512_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_original_issuing_authority_and_date_are_verified
        - location_and_setting_limits_are_recorded
        - routine_and_higher_risk_actions_are_distinguished
        - uncertain_or_changing_medical_details_are_referred_to_current_guidance
      - measurement_id: c1512_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1512_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01-A2
    sequence: 2
    title: Design one activity change that protects access as well as health
    instructions: 'For the club meeting, consider cleaner air, hygiene, a remote or postponed option,
      appropriate masking guidance and a way for an ill person to stay away without losing participation.
      Note where current immunization or individual medical questions belong with the person’s clinician.
      Choose one feasible change with the organizer’s permission and identify who bears its cost or burden.
      Do not demand health disclosure or treat a person’s need for additional protection as an inconvenience
      to dismiss.


      Observation checks: Air hygiene attendance and additional precautions are considered; One feasible
      organizer-approved change is selected; Individual medical and immunization decisions remain with
      appropriate care; Access cost and privacy burdens are explicitly considered. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01
      action_stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01-A2
      competency_stable_id: '15.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1512_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1512_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - air_hygiene_attendance_and_additional_precautions_are_considered
        - one_feasible_organizer_approved_change_is_selected
        - individual_medical_and_immunization_decisions_remain_with_appropriate_care
        - access_cost_and_privacy_burdens_are_explicitly_considered
      - measurement_id: c1512_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1512_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01-A3
    sequence: 3
    title: Communicate the plan with a source and a revision trigger
    instructions: 'Draft or send, where authorized, a short message saying what will change, when it applies,
      how to participate another way and where the current official guidance can be checked. Ask a willing
      reader to explain the action back, or review it after a delay. Correct ambiguity without adding
      certainty the source does not provide. State when the plan will be reviewed or withdrawn; for a
      hypothetical case, do not imply that an actual outbreak has been announced.


      Observation checks: The message states the action timing alternative and official source; A teach-back
      or delayed comprehension check occurs; Ambiguity is corrected without overstating certainty; A revision
      trigger and hypothetical status remain visible. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Could someone follow the message without disclosing private health information, and
      what change in official guidance or local conditions would require you to revise it?


      Examples: Supportive: The organizer verified the local notice, improved the meeting’s participation
      alternative and sent a dated message that a reader could accurately explain.


      Mixed: The guidance was credible, but the proposed remote option was inaccessible to some participants
      and needed another route.


      Contradictory: A person announced an unverified outbreak, demanded private diagnoses or substituted
      the exercise for urgent medical care.


      Inconclusive: A forwarded warning was shared without checking its date, location or issuing authority.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01
      action_stable_id: PRACTICE-COMP-1512-PUBLIC-HEALTH-EMERGENCY-COMPETENCE-01-A3
      competency_stable_id: '15.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1512_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1512_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_message_states_the_action_timing_alternative_and_official_source
        - a_teach_back_or_delayed_comprehension_check_occurs
        - ambiguity_is_corrected_without_overstating_certainty
        - a_revision_trigger_and_hypothetical_status_remain_visible
      - measurement_id: c1512_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1512_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Public-health emergency competence; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use plain language, translation, accessible remote participation and trusted community channels.
      Lack of paid leave, space or resources may limit a person’s options; route those constraints to
      support rather than blame. Immediate medical danger takes priority over finishing a communication
      exercise.
    cultural_context:
    - Adapt the expression of Public-health emergency competence to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use plain language, translation, accessible remote participation and trusted community channels.
      Lack of paid leave, space or resources may limit a person’s options; route those constraints to
      support rather than blame. Immediate medical danger takes priority over finishing a communication
      exercise.
  pause_conditions:
  - Pause Public-health emergency competence when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Public-health emergency competence practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Public-health emergency competence situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
