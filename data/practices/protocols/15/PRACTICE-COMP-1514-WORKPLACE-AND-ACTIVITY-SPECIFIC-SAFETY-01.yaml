  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Workplace and activity-specific safety; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use seated work, assistance or a smaller task. At work, follow the employer’s safety program, training,
      reporting and applicable legal protections; this guide does not determine a jurisdiction-specific
      right or procedure. Do not improvise PPE selection or hazardous-energy control from a general hierarchy.
    cultural_context:
    - Adapt the expression of Workplace and activity-specific safety to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use seated work, assistance or a smaller task. At work, follow the employer’s safety program, training,
      reporting and applicable legal protections; this guide does not determine a jurisdiction-specific
      right or procedure. Do not improvise PPE selection or hazardous-energy control from a general hierarchy.
  pause_conditions:
  - Pause Workplace and activity-specific safety when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Workplace and activity-specific safety practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Workplace and activity-specific safety situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
