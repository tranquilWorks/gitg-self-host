      - [Weger et al. — Relative Effectiveness of Active Listening](https://stars.library.ucf.edu/scopus2010/9657/)

      - [EPA — Wildfires and Indoor Air Quality](https://www.epa.gov/emergencies-iaq/wildfires-and-indoor-air-quality-iaq)

      - [NCSC — Managing your passwords](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers)'
  - id: file-later-packet-md
    title: Later packet
    body: 'In this supplied fictional example, a learner safely relocates their own sheets within reach
      and completes the harmless task. Record your own attempted result separately; the story is not evidence
      that you performed it. On cleanup, they notice the discarded sleeve would obstruct their route and
      put it in the designated container. Record the specific task, adjustment and recheck. Do not claim
      that every activity in the room is safe.


      In the fictional W3 case, the learner stops retrieval and reports the unstable cabinet. No repair
      or safe access confirmation follows. Stopping/reporting is complete; the underlying hazard remains
      unresolved. Reaching behind it to finish the assignment would contradict the boundary.


      For W4, a coworker repeats, “We''ve always done it with the switch off.” No authorized isolation
      assessment is supplied. Prior uneventful shortcuts do not establish control of stored energy. Keep
      the task stopped under the applicable site process and seek qualified handling; do not test the
      claim yourself.


      A proposed folder relocation clears one aisle but blocks the exit. The substitute introduces another
      hazard. Reject that location and find a safe authorized alternative or leave the task paused.


      If the benign physical task was not attempted, preserve the paper analysis only. None of these supplied
      fictional outcomes establishes actual machine safety or an independent workplace inspection.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Remove a small hazard and stop at the edge of your authority


      Use the fictional work cards, then perform only the harmless paper-handling task described below
      if your setting is suitable. Allow twenty-five minutes. You need a few sheets, a stable reachable
      surface and a clear ordinary route. Do not use tools, chemicals, machinery, electricity, ladders
      or heavy objects. Never create a hazard to make the practice more impressive. The skill is recognizing
      hazards, selecting an effective authorized control and stopping when safe conditions are not established.


      ### Think through the task, not just the equipment


      Hazard analysis asks what could cause harm during setup, the activity and cleanup; who could be
      affected; and which conditions make the harm possible. A clear workspace can become obstructed when
      materials are put away. Repetition without injury does not prove a shortcut safe. Workers should
      have a way to report uncertainty and stop unsafe activity under the applicable site process without
      being treated as the problem.


      NIOSH''s hierarchy orders controls from elimination and substitution through engineering and administrative
      measures to personal protective equipment. Removing a needless obstruction can address its source;
      warning someone to step around it relies on repeated attention. A substitute can introduce a different
      risk, so check the result. PPE remains important when appropriate, but it must fit the hazard and
      user and does not make an unsafe process acceptable. See S17 in [SOURCES](?resource=sources). This
      guide does not select respirators, electrical PPE or other specialist equipment.


      Ergonomics concerns the fit between the task, person and environment. For this small paper task,
      a comfortable reachable position, sufficient light and avoiding awkward repeated reaching matter.
      There is no single posture everyone must imitate. Adjust only what you can do safely and are authorized
      to change; assistance or a different setup may be appropriate. Do not stretch, climb or move heavy
      furniture to fulfill the exercise.


      An off switch is not proof of energy isolation. Powered equipment can retain electrical, mechanical,
      hydraulic, pneumatic or thermal hazards, or restart unexpectedly. HSE''s maintenance guidance addresses
      isolation, stored energy and competent maintenance. See S18. Actual lockout/isolation is an equipment-
      and site-specific process for trained authorized people. This paper exercise never asks you to unplug,
      open, test, lock, remove a lock, clear a jam or service equipment. Asking a qualified person to
      assess the issue is an action; pretending you performed isolation is not.


      ### Worked example


      A folder cart is parked across a walkway. The first proposal is “tell everyone to be careful.” A
      responsible worker with permission relocates the cart to a designated clear bay without handling
      a load beyond their ability. They recheck that the bay does not block another route. If moving it
      would be unsafe or unauthorized, they stop the affected task and report through the site''s process.
      The preferred control depends on what can actually be done safely, not on always making the learner
      fix it personally.


      ### Original fictional work cards


      | Card | Observed situation | Authority supplied |

      | --- | --- | --- |

      | W1 | Three light paper folders on a stable table; a small empty cardboard sleeve lies in the walking
      route | You may move this harmless sleeve to the waste container if you can do so safely |

      | W2 | Folder placement requires an awkward reach across a wide table | You may place the folders
      within comfortable reach on your own clear work area; no furniture moving |

      | W3 | A heavy unstable cabinet leans near the retrieval route | You may stop and report to the
      site lead; you are not authorized or equipped to stabilize it |

      | W4 | A powered cutting machine is jammed; a coworker says the off button makes it safe to reach
      inside | You have no maintenance or isolation authorization; designated qualified staff handle the
      machine |

      | W5 | Cleanup puts discarded packaging in front of the exit | You may safely dispose of your own
      harmless packaging in the designated container; exit suitability remains the site''s responsibility
      |


      For the actual benign step, use your own clear table and a few ordinary sheets. Do not recreate
      W1''s obstruction, W3''s instability or W4''s machine. If no suitable workspace is available, complete
      the paper analysis and record the physical task unattempted.


      ### Analyze, act and recheck


      1. For W1–W5, name the hazard, possible effect, person affected and stage of work. Use concrete
      descriptions rather than “unsafe.” Include people passing through, not only the person holding folders.

      2. Choose a control and who may perform it. Compare removing W1''s harmless obstruction with a warning
      sign alone. For W2, explain how a reachable placement changes the demand. For W3 and W4, stop/report
      is the appropriate learner action; do not invent authority or a safe repair.

      3. In your actual ordinary space, inspect setup, reach, light, route and cleanup destination before
      touching the sheets. Choose one harmless authorized improvement if needed, or record that no change
      was needed. Do not manufacture a defect.

      4. Perform the small task: retrieve the sheets from a comfortable location, place them on the stable
      surface, then put them away without blocking access. Stop if pain, instability, a blocked route
      or uncertainty appears. A seated version or a helper following your directions is acceptable; record
      what assistance occurred.

      5. Recheck the area after cleanup. Did your change create another obstruction or uncomfortable reach?
      Correct only a safe, authorized small issue, or report what prevents completion. Record before/after
      facts, not “all risks eliminated.”

      6. Rehearse a stop-work report for W4 on paper: machine identifier if known, observed jam, no intervention
      performed, area/process needing authorized attention, and request for the site''s qualified isolation/maintenance
      procedure. Do not operate any real controls. Then open the [later packet](?resource=file-later-packet-md).


      Your evidence is a five-card analysis, an actual harmless-task result if attempted, and a scoped
      report. It does not certify workplace safety, legal rights in every jurisdiction, machine isolation
      competence or correct PPE for an unrelated activity.


      ### Make the stopping point credible


      Before resuming a stopped real task, the responsible authorized process must establish that controls
      are adequate and the task is permitted. “Someone said it is fine” without the relevant role or verification
      is not enough. Report near misses and recurring shortcuts through the applicable process so the
      design can improve; do not normalize them because nobody was hurt this time.


      For a smaller version, analyze W1 and W3 first to distinguish a safe small correction from an issue
      requiring escalation. Use accessible text, good lighting and your ordinary aids. A harder paper
      version has a proposed substitute that creates a blocked exit; reject or revise it based on the
      new risk, rather than treating all substitutions as improvements.


      For real transfer, review a low-risk activity''s authorized procedure with the responsible person:
      hazards, control choices, required equipment/training, report route, stop authority and restart
      conditions. Qualified instruction is needed for activity-specific risks, including actual lockout
      and physical techniques. This guide''s paper jam scenario remains paper-only. Complete the [fresh
      checks](?attempt=practice-checks) before the [key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A warning sign is proposed for loose harmless packaging that an authorized person can safely
      remove. How do the control choices differ?

      2. A machine is switched off, but stored pressure has not been assessed. May this guide''s learner
      clear the jam?

      3. You move light folders to reduce reaching, then discover they block an exit. What should the
      review record say?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Safe removal addresses the obstruction itself; a sign relies on people noticing and avoiding
      it. Use the authorized effective control and recheck its result. Do not infer that the learner should
      remove any object, regardless of weight, hazard or authority.

      2. No. Off is not verified isolation, and the learner lacks authorization. Stop/report and use the
      site''s qualified process. Do not unplug, open, release pressure, remove locks or test the machine
      as part of this exercise.

      3. The reach demand was reduced, but the new location introduced an access hazard and is not an
      acceptable completed solution. Safely correct it within authority or pause/report, then recheck.
      One improved condition does not cancel another risk.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
