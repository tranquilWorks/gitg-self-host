meaning_and_fit:
  purpose: Identify hazards before work, prefer controls that remove exposure and use a clear stop-and-report
    decision when equipment, authorization or conditions are uncertain.
  why_recommended: Identify hazards before work, prefer controls that remove exposure and use a clear
    stop-and-report decision when equipment, authorization or conditions are uncertain.
  claims:
  - statement: Identify hazards before work, prefer controls that remove exposure and use a clear stop-and-report
      decision when equipment, authorization or conditions are uncertain.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Workplace and activity-specific safety practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Workplace and activity-specific safety as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use seated work, assistance or a smaller task. At work, follow the employer’s
    safety program, training, reporting and applicable legal protections; this guide does not determine
    a jurisdiction-specific right or procedure. Do not improvise PPE selection or hazardous-energy control
    from a general hierarchy.
  opportunity_considerations: 'Use a table, a few lightweight folders and an ordinary clear work area.
    Fictional complication: someone asks you to clear a jam from powered equipment and says switching
    it off is enough. Do not approach, open, unplug, lock out or service equipment as part of this exercise.'
  prerequisites:
  - 'Use a table, a few lightweight folders and an ordinary clear work area. Fictional complication: someone
    asks you to clear a jam from powered equipment and says switching it off is enough. Do not approach,
    open, unplug, lock out or service equipment as part of this exercise.'
  dependencies: []
  safe_alternatives:
  - Use seated work, assistance or a smaller task. At work, follow the employer’s safety program, training,
    reporting and applicable legal protections; this guide does not determine a jurisdiction-specific
    right or procedure. Do not improvise PPE selection or hazardous-energy control from a general hierarchy.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Workplace and activity-specific safety differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Workplace and activity-specific
    safety as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a table, a few lightweight folders and an ordinary clear work area. Fictional complication:
    someone asks you to clear a jam from powered equipment and says switching it off is enough. Do not
    approach, open, unplug, lock out or service equipment as part of this exercise. Goal: Identify hazards
    before work, prefer controls that remove exposure and use a clear stop-and-report decision when equipment,
    authorization or conditions are uncertain. Scope: The practical task is limited to arranging lightweight
    paper materials at a table. Machinery, electrical work, chemicals, lifting hazards and hazardous-energy
    isolation are discussed only as stop-and-refer cases, never practiced from this guide. Time and effort:
    Fifteen minutes for the task review, ten minutes for a safe setup change and ten minutes for a stop-work
    rehearsal. Adaptation: Use seated work, assistance or a smaller task. At work, follow the employer’s
    safety program, training, reporting and applicable legal protections; this guide does not determine
    a jurisdiction-specific right or procedure. Do not improvise PPE selection or hazardous-energy control
    from a general hierarchy. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use seated work, assistance or a smaller task. At work, follow the employer’s safety
    program, training, reporting and applicable legal protections; this guide does not determine a jurisdiction-specific
    right or procedure. Do not improvise PPE selection or hazardous-energy control from a general hierarchy.
  expected_burden: Fifteen minutes for the task review, ten minutes for a safe setup change and ten minutes
    for a stop-work rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Workplace and activity-specific safety protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Workplace and activity-specific safety action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use seated
    work, assistance or a smaller task. At work, follow the employer’s safety program, training, reporting
    and applicable legal protections; this guide does not determine a jurisdiction-specific right or procedure.
    Do not improvise PPE selection or hazardous-energy control from a general hierarchy.
  actions:
  - stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01-A1
    sequence: 1
    title: Review the harmless task before starting it
    instructions: 'Break arranging the folders into retrieving, placing and returning them. Look for trip
      obstruction, awkward reach, poor lighting and damaged or unstable furniture without creating hazards
      to inspect. Consider removing the obstruction or moving the materials before relying on a warning
      or personal protective equipment. Name what would make the task no longer low-risk, such as heavy
      loads, sharp contents or powered equipment, and stop rather than expanding the exercise.


      Observation checks: The task is divided into observable steps before work; Existing access reach
      lighting and stability conditions are checked; Removing or reducing exposure is considered before
      warnings or PPE; Scope-changing hazards trigger a stop rather than improvisation. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01
      action_stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01-A1
      competency_stable_id: '15.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1514_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1514_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_task_is_divided_into_observable_steps_before_work
        - existing_access_reach_lighting_and_stability_conditions_are_checked
        - removing_or_reducing_exposure_is_considered_before_warnings_or_ppe
        - scope_changing_hazards_trigger_a_stop_rather_than_improvisation
      - measurement_id: c1514_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1514_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01-A2
    sequence: 2
    title: Install one simple control and verify the work area
    instructions: 'Make one authorized nonhazardous change, such as moving the folders within comfortable
      reach or clearing an ordinary loose item from the walkway when safe. Perform the small folder task
      and check that the change did not create another obstruction or burden. Record what was observed,
      not a claim of formal safety certification. If the condition cannot be corrected within your authority,
      leave the task unstarted and report it to the responsible person.


      Observation checks: One authorized simple control is actually installed; The task is attempted only
      within the safe scope; The change is checked for a newly created problem; An unresolved condition
      is reported rather than declared safe. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01
      action_stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01-A2
      competency_stable_id: '15.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1514_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1514_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_authorized_simple_control_is_actually_installed
        - the_task_is_attempted_only_within_the_safe_scope
        - the_change_is_checked_for_a_newly_created_problem
        - an_unresolved_condition_is_reported_rather_than_declared_safe
      - measurement_id: c1514_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1514_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01-A3
    sequence: 3
    title: Rehearse refusing the powered-equipment shortcut
    instructions: 'For the fictional jam request, say: I am not authorized to service this; it needs the
      site’s approved isolation and maintenance process. Identify the supervisor or safety reporting route
      and what factual information to provide. Explain that electrical, mechanical, pneumatic, hydraulic,
      thermal or stored energy may remain despite a normal off switch. Do not touch another person’s lock
      or tag, bypass a guard or treat this explanation as lockout training. Rehearse resuming only after
      the authorized process establishes safe conditions.


      Observation checks: The shortcut receives an explicit stop and referral; The report identifies the
      task and uncertainty without blame; An off switch is not equated with verified hazardous-energy
      isolation; Resumption depends on the authorized process rather than personal reassurance. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What evidence made the ordinary task acceptable, and what missing authorization or
      control made the equipment request a stop rather than a challenge?


      Examples: Supportive: The person moved folders to a comfortable reach, checked the clear walkway
      and rehearsed routing the powered-equipment jam to authorized maintenance.


      Mixed: The table task was safe, but the reporting route was unclear and had to be verified before
      relying on the stop-work card.


      Contradictory: The person bypassed a guard, removed someone else’s tag or attempted isolation after
      reading the general explanation.


      Inconclusive: A PPE checklist was completed without examining the task, existing hazards or the
      authority to perform it.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01
      action_stable_id: PRACTICE-COMP-1514-WORKPLACE-AND-ACTIVITY-SPECIFIC-SAFETY-01-A3
      competency_stable_id: '15.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1514_a3_primary
      transfer_disposition: context_bound
      measurements:
