        criteria:
        - dates_nationality_and_document_context_determine_the_verification
        - law_health_transport_communication_and_assistance_are_covered
        - each_requirement_has_a_dated_disposition_rather_than_an_assumption
        - sensitive_document_contents_remain_outside_the_application
      - measurement_id: c1508_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1508_a1_adverse
        kind: boolean
        role: adverse
