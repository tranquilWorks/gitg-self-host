  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Travel and unfamiliar-environment safety; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use accessible formats, a translated address, verified assistance booking or a trusted travel companion.
      A low-cost local unfamiliar-place exercise can practice navigation and fallback decisions, but it
      does not establish international entry or medical readiness. Never intentionally lose documents
      or strand yourself.
    cultural_context:
    - Adapt the expression of Travel and unfamiliar-environment safety to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use accessible formats, a translated address, verified assistance booking or a trusted travel companion.
      A low-cost local unfamiliar-place exercise can practice navigation and fallback decisions, but it
