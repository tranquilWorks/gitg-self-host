meaning_and_fit:
  purpose: Prepare for an unfamiliar place in a way that survives a transport failure or lost connection
    without relying on assumptions about laws, documents or emergency access.
  why_recommended: Prepare for an unfamiliar place in a way that survives a transport failure or lost
    connection without relying on assumptions about laws, documents or emergency access.
  claims:
  - statement: Prepare for an unfamiliar place in a way that survives a transport failure or lost connection
      without relying on assumptions about laws, documents or emergency access.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Travel and unfamiliar-environment safety practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Travel and unfamiliar-environment safety as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible formats, a translated address, verified assistance booking
    or a trusted travel companion. A low-cost local unfamiliar-place exercise can practice navigation
    and fallback decisions, but it does not establish international entry or medical readiness. Never
    intentionally lose documents or strand yourself.
  opportunity_considerations: Choose a real upcoming trip or the fictional case of arriving at an unfamiliar
    city’s main station after the last local connection is canceled. Use current official transport, government
    entry, destination health and local emergency information. Store sensitive document copies privately,
    not in the practice check-in.
  prerequisites:
  - Choose a real upcoming trip or the fictional case of arriving at an unfamiliar city’s main station
    after the last local connection is canceled. Use current official transport, government entry, destination
    health and local emergency information. Store sensitive document copies privately, not in the practice
    check-in.
  dependencies: []
  safe_alternatives:
  - Use accessible formats, a translated address, verified assistance booking or a trusted travel companion.
    A low-cost local unfamiliar-place exercise can practice navigation and fallback decisions, but it
    does not establish international entry or medical readiness. Never intentionally lose documents or
    strand yourself.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Travel and unfamiliar-environment safety differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Travel and unfamiliar-environment
    safety as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a real upcoming trip or the fictional case of arriving at an unfamiliar city’s main station
    after the last local connection is canceled. Use current official transport, government entry, destination
    health and local emergency information. Store sensitive document copies privately, not in the practice
    check-in. Goal: Prepare for an unfamiliar place in a way that survives a transport failure or lost
    connection without relying on assumptions about laws, documents or emergency access. Scope: This is
    proportional travel preparation, not immigration, legal or medical advice. A hypothetical route tests
    planning only; real travel requirements must be verified for the traveler’s nationality, documents
    and dates. Time and effort: Forty minutes for one trip card and a fifteen-minute tabletop disruption
    test. Adaptation: Use accessible formats, a translated address, verified assistance booking or a trusted
    travel companion. A low-cost local unfamiliar-place exercise can practice navigation and fallback
    decisions, but it does not establish international entry or medical readiness. Never intentionally
    lose documents or strand yourself. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible formats, a translated address, verified assistance booking or a
    trusted travel companion. A low-cost local unfamiliar-place exercise can practice navigation and fallback
    decisions, but it does not establish international entry or medical readiness. Never intentionally
    lose documents or strand yourself.
  expected_burden: Forty minutes for one trip card and a fifteen-minute tabletop disruption test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Travel and unfamiliar-environment safety protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Travel and unfamiliar-environment safety action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    formats, a translated address, verified assistance booking or a trusted travel companion. A low-cost
    local unfamiliar-place exercise can practice navigation and fallback decisions, but it does not establish
    international entry or medical readiness. Never intentionally lose documents or strand yourself.
  actions:
  - stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01-A1
    sequence: 1
    title: Build a dated destination card around the actual traveler
    instructions: 'Record the travel dates, required entry and identity documents, applicable local-law
      questions, health or medication requirements, transport arrival details, communication options and
      a verified assistance route. Include one cultural convention worth learning without treating it
      as universal behavior. Mark each item verified with a date, not applicable or unresolved. Use the
      traveler’s own government and destination authorities; a different country’s consular program or
      visa advice may not apply.


      Observation checks: Dates nationality and document context determine the verification; Law health
      transport communication and assistance are covered; Each requirement has a dated disposition rather
      than an assumption; Sensitive document contents remain outside the application. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01
      action_stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01-A1
      competency_stable_id: '15.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1508_a1_primary
      transfer_disposition: context_bound
      measurements:
