        criteria:
        - both_transport_and_data_loss_are_represented_in_the_test
        - the_fallback_is_checked_for_timing_access_and_payment
        - a_contact_update_can_occur_through_a_verified_alternative
        - an_unsolicited_demand_triggers_verification_rather_than_compliance
      - measurement_id: c1508_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1508_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01-A3
    sequence: 3
    title: Close one gap and carry a minimal usable copy
    instructions: 'Resolve the most important uncertainty by checking an official source or contacting
      the relevant provider. Create a minimal offline card with arrival destination, help route, contact
      plan and fallback, omitting unnecessary identifiers. Have a willing person or your own delayed review
      use it to explain the next step in the cancellation case. If an entry, health or safety requirement
      remains unresolved, mark travel readiness conditional rather than treating the card as permission
      to depart.


      Observation checks: One consequential uncertainty is actually investigated; The offline card contains
      enough information to act; A delayed or second-person use test occurs; Unresolved requirements remain
      conditions rather than silently passing. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which fallback remained usable without the original connection or data service, and
      what unresolved requirement could still invalidate the plan?


      Examples: Supportive: The traveler found that the accessible shuttle stopped early, verified a staffed
      alternative and could retrieve the needed details offline.


      Mixed: Transport was covered, but a medication import question remained unresolved and was assigned
      to the destination authority before departure.


      Contradictory: The person relied on an outdated visa post or handed private documents to an unsolicited
      helper during a staged test.


      Inconclusive: An itinerary was saved without testing an unavailable service or verifying traveler-specific
      requirements.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
