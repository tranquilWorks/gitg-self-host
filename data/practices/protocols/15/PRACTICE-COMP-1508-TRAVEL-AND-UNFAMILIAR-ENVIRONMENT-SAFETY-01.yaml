  - id: file-later-packet-md
    title: Later packet
    body: 'Initial arithmetic: 70 + 18 = 88 tokens. Spendable funds after preserving the 10-token reserve
      are 85; Lodge A plus transport is short by 3. The 07:00 bus does not solve tonight''s waiting-location
      problem. Do not declare either fallback established.


      At 20:20, fictional staff confirms Lodge B: total room price 60, suitable access, accepts the traveler''s
      payment method, and a held room through 21:00. The same verified 18-token transport can serve it.
      Total is 78; 95 − 78 = 17 remains, preserving the 10-token reserve with 7 extra. This is feasible
      under the new facts, subject to the hold and booking being completed; it is not an actual reservation.


      Staff places the agreed fictional contact call. The card''s communication assumption is supported
      in the scenario. Mobile voice service remains untested; do not record that it worked.


      A second card still shows Lodge A as affordable and gives no checking time. Its existence is useful,
      but stale or incorrect content contradicts operational usefulness. Correct both arithmetic and timestamp,
      then repeat retrieval.


      Medicine import permission is still unresolved. A feasible night-of-travel fallback does not close
      that pre-departure requirement. No real traveler has been cleared by this packet.'
  - id: file-materials-station-card-txt
    title: Station card
    body: '```text

      FICTIONAL REHEARSAL ONLY — Larch Station, Day 1, checked 19:50

      Arrival 20:10. Data unavailable; voice untested.

      Help: north staff desk via level route, open until 21:00; assistance call available.

      Waiting area has no established overnight permission.

      Bus: last 20:00; next tomorrow 07:00.

      Lodge A: 70 tokens; room hold requires staff confirmation by 20:40.

      Verified suitable desk-booked transport: 18 tokens; payment method accepted.

      Available: 95 tokens. Preserve 10 for essential morning expense.

      Contact label: Home contact; use staff-assisted call if agreed.

      Medicine import question remains unresolved before any real trip.

      Update if service, price, access, opening or contact availability changes.

      No real identity documents, contacts or booking details belong in this card.

      ```'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Recover a travel plan when the last connection disappears


      Use the invented destination card below before researching a real trip. In twenty-five minutes you
      will choose a feasible fallback, identify unresolved entry and health questions, and retrieve a
      minimal offline version of your plan. Do not book, travel, disclose identity documents or strand
      yourself to perform the exercise. Its point is proportionate preparation that still works when one
      ordinary dependency fails.


      ### A destination card is a set of dated claims


      Entry permission depends on nationality, document type, transit points, purpose and dates. Advice
      for one traveler may not apply to another. Local law also differs from cultural etiquette: a legal
      restriction requires current authoritative verification, while a courteous question about a local
      custom need not become a stereotype about everyone there. Check local authorities and your own relevant
      consular service, not just another tourist''s experience.


      Health preparation includes destination hazards, needed care access, medicines and applicable requirements.
      A medicine permitted at home may have different rules at the destination or in transit. Verify with
      appropriate official sources and a clinician or travel-health service where relevant; do not change
      treatment to fit a worksheet. Travel insurance can have exclusions and may not cover a chosen activity.
      Record what you verified and what is unresolved instead of writing “health covered.” The U.S. State
      Department checklist illustrates these categories for U.S. travelers; it does not establish another
      nationality''s eligibility. See S08 in [SOURCES](?resource=sources).


      A contingency needs an endpoint, a way to reach it, sufficient resources and a communication route.
      “Get a taxi” leaves open whether it is lawful, accessible, available and payable. “Call home” may
      fail with no data, voice service or usable public phone. Independent verification matters when a
      stranger offers urgent transport or asks to hold your passport. A genuine disruption does not authenticate
      a proposed helper.


      Keep documents and help details available without scattering sensitive copies. A minimal practice
      card can hold fictional locations and opening times. For a real trip, choose secure storage for
      sensitive records and an accessible backup suited to your circumstances. Do not send passport images
      to a stranger or put them in a public shared folder. A document copy can help replacement processes;
      it does not itself become valid travel authorization.


      ### Worked example


      Mina''s fallback note says “hotel near station.” At the time of disruption the desk confirms the
      hotel is full. Mina''s original plan was a candidate, not a reservation. They ask official station
      staff to confirm a current alternative, including accessible transport and total cost, before leaving
      the staffed waiting area. The useful learning is checking the conditions of a fallback, not memorizing
      a particular hotel name.


      ### Complete fictional materials


      You arrive at Larch Station at 20:10 with no mobile data. The final connection has been canceled.
      This is an invented place; the following facts apply only to this exercise.


      | Option or resource | Dated station card, checked today at 19:50 |

      | --- | --- |

      | Staff desk | Open until 21:00; level route from waiting area; staff can confirm services and place
      an assistance call |

      | Waiting area | Staffed while desk is open; no permission for overnight stay established |

      | Lodge A | Room available until 20:40 if staff confirms hold; total room price 70 tokens; accessible
      room and entrance confirmed for the fictional traveler |

      | Licensed desk-booked transport | Available now; total fare 18 tokens; suitable access confirmed;
      accepts the traveler''s payment method |

      | Station bus | Last departure 20:00; next departure tomorrow 07:00 |

      | Traveler resources | 95 tokens available; 10 tokens reserved for an essential morning expense;
      actual documents retained privately |

      | Communication | Mobile data unavailable; voice service untested; staff assistance call available;
      fictional trusted-contact label “Home contact” |

      | Stranger''s offer | “I can do it cheaply; give me your passport and follow me”; identity and service
      unverified |


      Your pre-trip record has confirmed entry/document requirements for this fictional traveler but leaves
      medicine import permission unresolved. Local law research has a dated official-source placeholder;
      respectful culture preparation includes asking staff how the queue works and learning how to request
      help. These are different categories. The fictional record cannot authorize a real departure, and
      an unresolved medicine question needs resolution before any real trip.


      ### Resolve the disruption


      1. Extract the live constraints: time, staff closing, data loss, access needs, money and reserved
      expense. Mark the bus unavailable tonight. Do not substitute yesterday''s timetable.

      2. Check Lodge A plus transport against available resources while preserving the reserve. Write
      the total and shortfall or remainder. Then decide whether to confirm that option, request a different
      supported alternative, or remain with staff while resolving the gap. No option becomes affordable
      because it is otherwise suitable.

      3. Draft a factual request to station staff: connection canceled, access and communication needs,
      available spending limit, and request for verified accommodation/transport alternatives. Share only
      what they need; do not surrender documents to the unverified stranger.

      4. Make a compact offline card using these fictional details: desk location/closing, current verified
      options and constraints, contact route, date/time checked and the unresolved question. The [supplied
      initial card](?resource=file-materials-station-card-txt) is a starting reference; make your own
      compact copy on paper or in a local note, close the original guide, and retrieve the card. Answer
      where help is, what fails tonight, and when the card needs updating. If retrieval fails, repair
      it and retry.

      5. Write two pre-departure research tasks: resolve the medicine requirement through destination/transit
      authorities and appropriate clinical help; verify local laws and entry rules for the actual traveler
      and dates. Do not mark them complete from this fictional exercise.

      6. Preserve your first decision and open the [later packet](?resource=file-later-packet-md). Revise
      only when a new fact supports it; keep the time of the new information.


      Your artifact is a feasible-or-unresolved fallback decision, a private offline card, actual retrieval
      result and a short list of essential unanswered questions. A recovered plan may still require postponement;
      preparation does not guarantee transport or accommodation.


      ### Fit the exercise to your circumstances


      For a lighter route, work only the timetable and cost check before adding documents and health.
      Use large print, screen-reader text or a trusted support person''s reading, without removing your
      usual communication aids. Do not publish sensitive access or medical details in a group exercise.
      A harder version closes the staff desk early; identify the unverified replacement help route instead
      of inventing overnight permission.


      For real transfer, select one actual planned trip and verify a small number of consequential details
      through current primary authorities: eligibility, medicine/health needs, local law, legitimate transport
      and emergency/consular contact routes. Check dates, opening times, payment and access. Ask respectful,
      setting-specific culture questions rather than inferring safety from nationality or appearance.
      Retrieve a privacy-conscious offline plan at home. No trip, purchase or public sharing is necessary
      to demonstrate the retrieval step. Finish the [fresh checks](?attempt=practice-checks) and [key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A traveler has 130 units, needs to preserve 25, and finds a room for 90 plus transport for
      20. Is the fallback feasible under those constraints?

      2. A friend''s passport was accepted last year. Yours has a different nationality and your route
      includes transit. What needs checking?

      3. Your offline card opens successfully but the listed help office closed an hour ago. What succeeded
      and what failed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Spendable funds are 105, while total cost is 110: short by 5. Request a verified lower-cost
      alternative or other appropriate assistance. Quietly spending the reserve changes the stated constraint
      and cannot be called success.

      2. Current destination and transit requirements for your nationality, document, purpose and dates,
      plus relevant health/medicine rules. Your friend''s past acceptance does not answer these questions.
      Use the appropriate official authorities and qualified advice for unresolved matters.

      3. Retrieval worked; the help route is no longer usable at this time. Update through a trustworthy
      current source, check the alternative''s availability and access, and retrieve again. File availability
      and plan feasibility are separate observations.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
