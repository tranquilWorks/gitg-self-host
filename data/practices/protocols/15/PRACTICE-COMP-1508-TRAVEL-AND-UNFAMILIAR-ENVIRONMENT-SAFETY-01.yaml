  - stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01-A2
    sequence: 2
    title: Test the canceled-connection case without mobile data
    instructions: 'On paper, remove the planned onward connection and mobile data. Locate an official
      staffed help point, a safe waiting or lodging option, an alternative lawful transport route and
      a way to tell the agreed contact. Check opening hours, accessibility, payment and whether the fallback
      is genuinely available at the arrival time. Identify a scam cue such as an unsolicited demand to
      hand over documents or pay immediately, and choose independent verification rather than confrontation.


      Observation checks: Both transport and data loss are represented in the test; The fallback is checked
      for timing access and payment; A contact update can occur through a verified alternative; An unsolicited
      demand triggers verification rather than compliance. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01
      action_stable_id: PRACTICE-COMP-1508-TRAVEL-AND-UNFAMILIAR-ENVIRONMENT-SAFETY-01-A2
      competency_stable_id: '15.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1508_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1508_a2_primary
        kind: artifact
        role: primary
        weight: '1'
