  - id: file-later-packet-md
    title: Later packet
    body: 'At 17:40, the fictional organizer is unavailable. Noor initially has 40 minutes from 18:00,
      enough for the 30-minute minimum with 10 minutes spare. The 60-minute full session is not covered.
      A reduced-session notice fits the initial facts.


      At 17:48, Noor''s other commitment moves earlier; availability now ends at 18:20. Only 20 minutes
      remain, a 10-minute shortfall against the minimum. No other host is confirmed. Cancel using the
      authorized desk notice rather than claiming a viable 30-minute session or inventing a volunteer.
      The agenda''s successful retrieval still stands.


      At 17:55, Inez returns but says, “I have not seen the notice; what did you decide?” Handback needs
      agreement: Noor explains cancellation and notice status; Inez confirms responsibility for any further
      communication. A unilateral assumption could create conflicting notices. Do not silently restart
      after people may have changed plans.


      If neither person confirms receipt of a proposed handback, ownership is unresolved. This is inconclusive
      handover evidence, not completion. The fictional sequence tests capacity and responsibility; it
      does not document a real canceled event or a person''s reliability.'
  - id: file-materials-fallback-card-txt
    title: Fallback card
    body: '```text

      FICTIONAL TABLETOP ONLY — reading group

      Starts 18:00. Minimum session 30 minutes; full session 60 minutes.

      Inez check-in due 17:40. If absent, Noor verifies through agreed route; decides by 17:50.

      Noor consented to host until 18:40; may use paper agenda and cancel; cannot spend money.

      Room available from 17:50 by authorized staff; no learner key handling.

      Notice route: staffed group desk; no private participant list needed.

      Agenda: welcome/purpose; read sentence; discuss everyday example; close with unresolved assumption.

      Reading sentence: A plan is useful when another person can carry out its next step.

      Return of Inez requires agreed handback of owner, effective time, notices and unresolved changes.

      Any changed availability or missing room/notice route requires rechecking feasibility.

      ```'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Give a fallback an owner, trigger and finite reserve


      Use the fictional reading session below. In about thirty minutes you will make a small contingency
      plan, run an announced tabletop failure and decide whether to continue in reduced form or cancel.
      Paper or an accessible local note is enough. Nobody needs to lose access to a real device or miss
      an actual commitment. The skill is owning a risk through prevention, detection, response and recovery.


      ### A dependency is something the outcome needs


      The outcome here is a hosted reading discussion, not preserving the organizer''s preferred process.
      An agenda, a host, access to the room and a way to notify participants all support that outcome.
      A single point of failure exists when losing one component disables an essential function without
      an available alternative. Two copies on the same unavailable phone may still share the same failure.


      Name the failure mode precisely. “Technology might fail” is too broad to guide action. “The only
      person with the room instructions cannot be contacted before opening” has a recognizable effect
      and detection point. An owner takes responsibility for a decision or action; that does not make
      them morally responsible for causing the failure. A backup owner must agree, have access and have
      the necessary authority. A name in a document is not consent.


      Prevention reduces likelihood or impact beforehand. Detection tells someone when the plan needs
      attention. Response is what the authorized person does while the problem exists. Recovery restores
      an agreed normal state and reconciles changes made during the fallback. These stages can have different
      owners. NIST''s contingency-planning publication addresses requirements and priorities for federal
      information systems; the small event exercise here is an author-created analogy, not NIST certification
      or a mandated standard for clubs. See S12 in [SOURCES](?resource=sources).


      Reserves are usable capacity, not hopeful labels. Money already promised elsewhere is not free reserve.
      A volunteer who must leave before the minimum session ends cannot cover that minimum alone. Redundancy
      can also share a dependency: two messaging apps on the same locked device do not create an independent
      communication route. Define a cancellation threshold so the fallback does not consume essential
      resources or quietly transfer risk to someone else.


      ### Worked example


      An organizer writes “backup: Noor.” Noor has never agreed and cannot access the agenda. The repair
      is not adding Noor''s phone number to more copies. The organizer asks whether Noor can accept a
      bounded role, provides only the material needed, confirms a rehearsal and records the stop condition.
      If Noor declines, the plan retains an uncovered dependency and uses a cancellation route. Naming
      an unmet need is better than assigning imaginary capacity.


      ### Complete fictional session card


      The reading group meets at 18:00. A minimum useful session needs a host for 30 minutes, the one-page
      agenda and authorized room access. A reduced session is permitted; a full session would last 60
      minutes. No unsafe physical task or essential service depends on the event.


      | Dependency | Current fact |

      | --- | --- |

      | Main organizer, Inez | Owns agenda and participant-message route; expected check-in by 17:40 |

      | Agreed backup, Noor | Consented to host from 18:00 until 18:40; may use the supplied paper agenda
      and cancel; cannot spend money |

      | Room | Staff confirms access for the group from 17:50; only authorized staff handle keys |

      | Agenda | Opening question, 10-minute reading, discussion, close; harmless paper copy available
      to Noor |

      | Notice route | Staffed group desk can post the agreed cancellation/reduced-session notice; no
      private participant list needed |

      | Reserve | 40 minutes of Noor''s availability; no extra budget or unconfirmed volunteer |

      | Trigger | No organizer check-in at 17:40: Noor verifies absence through the agreed route, then
      decides by 17:50 |

      | Recovery | Returning organizer and Noor agree who is responsible before handback; retain any notice
      and actual session change |


      The paper agenda is: welcome and purpose; read the supplied sentence “A plan is useful when another
      person can carry out its next step”; discuss one everyday example; close by naming an unresolved
      assumption. The case supplies the agenda so you need not invent a reading program. It contains no
      confidential material.


      ### Run an announced tabletop


      1. Map the four essential dependencies: person, information/device, place and communication. For
      each, state a failure, its effect, how it would be detected and who may act. Keep the room-key authority
      with staff.

      2. Identify what the current card already prevents and what it cannot prevent. The paper agenda
      reduces dependence on Inez''s phone; it does not guarantee a host or room.

      3. Use the [supplied fallback card](?resource=file-materials-fallback-card-txt) to make a separate
      note containing the agenda, notice route, trigger, authority and time limits. Close the main case.
      Retrieve the note and answer the opening question, minimum duration, backup''s end time and cancellation
      authority. Record any missing field and repair it before repeating.

      4. Announce the simulated failure: at 17:40 Inez and Inez''s phone are unavailable. Do not contact
      a real person or disable a phone. Using only the fallback card, choose the reduced session or cancellation
      by the stated decision point. Calculate the spare host time after a 30-minute session.

      5. Write the notice you would authorize in this fictional case: what is happening, the time limit,
      where to find the current decision and no unnecessary explanation of Inez''s absence. Do not publish
      it.

      6. Open the [later packet](?resource=file-later-packet-md), respond to the changed reserve and then
      write a handback with owner, effective time, changes and remaining gaps. “Organizer returned” alone
      is not a completed handover.


      Keep the dependency map, retrieved card, original decision, revised decision and handback. This
      is observable tabletop work, not proof the group has an operational continuity program.


      ### Review and extend


      The first fallback works only if the stated access and availability hold. A useful review can find
      both a strength and a failure: the agenda was retrievable, yet the backup''s shortened availability
      made the minimum session infeasible. Do not hide that defect by lowering the minimum after seeing
      the result unless the group explicitly authorizes a new kind of event. No drama or blame is needed.


      For a smaller start, examine only agenda access and host time, then add the notice and room. A helper
      may read the note or assist with time arithmetic; retain the support used. A harder tabletop removes
      the staffed notice route while leaving the paper agenda available. Identify the communication gap;
      two good dependencies do not fix a missing third.


      For real transfer, choose a low-stakes commitment you own, ask a willing person about a bounded
      backup role, and test retrieval during an announced practice. Share minimal material, agree authority
      and reserves, and record how responsibility returns. If no one can accept the role, prepare a clear
      cancellation route rather than treating yourself as infinitely available. Complete the [fresh checks](?attempt=practice-checks)
      before the [key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A fallback has 50 minutes of willing host availability, but its minimum task requires 55.
      What is the result, even if the agenda and room are ready?

      2. Two backups are stored in different apps on the same lost phone. Which risk remains?

      3. The main owner returns after the backup canceled. Why is “back to normal” insufficient, and what
      belongs in handback?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A 5-minute shortfall remains. Obtain explicitly agreed suitable capacity, change the task
      only with appropriate authorization, or use the cancellation route. Do not round availability up
      or treat willing effort as unlimited reserve.

      2. Both copies share device access as a failure dependency. A genuinely available alternative needs
      a different accessible route and an actual retrieval check; two app names do not prove independence.

      3. The cancellation and its communication remain consequential. Agree who owns the next action,
      when responsibility transfers, what was changed/notified and what remains unresolved. Return of
      a person is not proof that participants received a consistent update.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
