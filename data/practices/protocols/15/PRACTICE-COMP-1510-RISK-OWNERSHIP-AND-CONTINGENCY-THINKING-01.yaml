meaning_and_fit:
  purpose: Own a dependency through prevention, detection, response and recovery rather than treating
    a backup plan as a list of reassuring possibilities.
  why_recommended: Own a dependency through prevention, detection, response and recovery rather than treating
    a backup plan as a list of reassuring possibilities.
  claims:
  - statement: Own a dependency through prevention, detection, response and recovery rather than treating
      a backup plan as a list of reassuring possibilities.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Risk ownership and contingency thinking practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Risk ownership and contingency thinking as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use paper, audio, a trusted deputy or a simpler cancellation rule when resources
    are limited. A person working alone can test a process against an unavailable device rather than appoint
    an unwilling helper. Avoid storing sensitive rosters or credentials in backup copies.
  opportunity_considerations: 'Default process: opening a weekly community reading session when the usual
    organizer holds the only agenda and contact route. Use fictional names and no personal contact details
    in the application. A real group’s roles, access and backup sharing must be agreed by those responsible.'
  prerequisites:
  - 'Default process: opening a weekly community reading session when the usual organizer holds the only
    agenda and contact route. Use fictional names and no personal contact details in the application.
    A real group’s roles, access and backup sharing must be agreed by those responsible.'
  dependencies: []
  safe_alternatives:
  - Use paper, audio, a trusted deputy or a simpler cancellation rule when resources are limited. A person
    working alone can test a process against an unavailable device rather than appoint an unwilling helper.
    Avoid storing sensitive rosters or credentials in backup copies.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Risk ownership and contingency thinking differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Risk ownership and contingency
    thinking as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default process: opening a weekly community reading session when the usual organizer holds the
    only agenda and contact route. Use fictional names and no personal contact details in the application.
    A real group’s roles, access and backup sharing must be agreed by those responsible. Goal: Own a dependency
    through prevention, detection, response and recovery rather than treating a backup plan as a list
    of reassuring possibilities. Scope: Choose a low-consequence personal or volunteer process. Medical,
    industrial, financial, emergency and regulated systems require their own qualified risk-management
    procedures. Time and effort: Twenty minutes to map the dependency, twenty minutes to install a small
    fallback and fifteen minutes for a harmless test. Adaptation: Use paper, audio, a trusted deputy or
    a simpler cancellation rule when resources are limited. A person working alone can test a process
    against an unavailable device rather than appoint an unwilling helper. Avoid storing sensitive rosters
    or credentials in backup copies. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use paper, audio, a trusted deputy or a simpler cancellation rule when resources
    are limited. A person working alone can test a process against an unavailable device rather than appoint
    an unwilling helper. Avoid storing sensitive rosters or credentials in backup copies.
  expected_burden: Twenty minutes to map the dependency, twenty minutes to install a small fallback and
    fifteen minutes for a harmless test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Risk ownership and contingency thinking protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Risk ownership and contingency thinking action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use paper,
    audio, a trusted deputy or a simpler cancellation rule when resources are limited. A person working
    alone can test a process against an unavailable device rather than appoint an unwilling helper. Avoid
    storing sensitive rosters or credentials in backup copies.
  actions:
  - stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01-A1
    sequence: 1
    title: Identify failure modes and who actually owns them
    instructions: 'Draw the steps from preparation to the session starting. Mark dependencies on one person,
      one device, one location and one communication channel. For each plausible failure, record the effect,
      how it would be noticed, who can act and what cannot safely be shared. Select one meaningful single
      point, such as the agenda existing only on the organizer’s phone. Do not label a person as the problem;
      the issue is the unbacked dependency.


      Observation checks: People devices locations and communication dependencies are considered; Failure
      effects and detection cues are explicit; An authorized owner is assigned to the selected dependency;
      Private access and information limits are retained. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01
      action_stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01-A1
      competency_stable_id: '15.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1510_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1510_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - people_devices_locations_and_communication_dependencies_are_considered
        - failure_effects_and_detection_cues_are_explicit
        - an_authorized_owner_is_assigned_to_the_selected_dependency
        - private_access_and_information_limits_are_retained
      - measurement_id: c1510_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1510_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01-A2
    sequence: 2
    title: Install a bounded fallback with a trigger and reserve
    instructions: 'For the agenda dependency, prepare a permitted minimal copy with a willing backup facilitator
      and define the trigger: the organizer has not checked in by the agreed time. Specify what the backup
      may do, the resources or time reserved, and when cancellation is safer than improvisation. Include
      prevention, such as confirming attendance beforehand, without assuming it eliminates the failure.
      Obtain consent before assigning responsibility or distributing group information.


      Observation checks: The fallback has a concrete activation trigger; Backup authority resources and
      time are agreed; Prevention is distinguished from response and reserve; Cancellation remains an
      explicit safe option. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01
      action_stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01-A2
      competency_stable_id: '15.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1510_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1510_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_fallback_has_a_concrete_activation_trigger
        - backup_authority_resources_and_time_are_agreed
        - prevention_is_distinguished_from_response_and_reserve
        - cancellation_remains_an_explicit_safe_option
      - measurement_id: c1510_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1510_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01-A3
    sequence: 3
    title: Test unavailability on paper and restore normal ownership
    instructions: 'Announce a tabletop in which the organizer’s phone is unavailable; do not disable or
      take it. Ask the backup to retrieve the permitted agenda and explain the start or cancellation decision.
      Record the time or access obstacle, correct one gap and repeat that part. Finally state how the
      original owner will be informed and how the normal arrangement resumes. A fallback that cannot be
      retrieved is still a gap, even if a document says it exists.


      Observation checks: The test is announced and nondestructive; The fallback is retrieved and used
      to make a decision; An observed gap is corrected and retested; Recovery and return of ownership
      are specified. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What could actually continue or recover when the chosen dependency disappeared, and
      where did the fallback still rely on the same failed resource?


      Examples: Supportive: A backup facilitator retrieved the agenda independently, applied the check-in
      trigger and knew when to cancel and notify the organizer.


      Mixed: The agenda copy worked but the contact route still lived on the unavailable phone, revealing
      a second dependency.


      Contradictory: The test disabled a production system or assigned an unconsenting person responsibility
      for a critical service.


      Inconclusive: A risk register named failures without an owner, activation trigger or tested recovery
      route.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01
      action_stable_id: PRACTICE-COMP-1510-RISK-OWNERSHIP-AND-CONTINGENCY-THINKING-01-A3
      competency_stable_id: '15.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
