  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Risk ownership and contingency thinking; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use paper, audio, a trusted deputy or a simpler cancellation rule when resources are limited. A
      person working alone can test a process against an unavailable device rather than appoint an unwilling
      helper. Avoid storing sensitive rosters or credentials in backup copies.
    cultural_context:
    - Adapt the expression of Risk ownership and contingency thinking to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use paper, audio, a trusted deputy or a simpler cancellation rule when resources are limited. A
      person working alone can test a process against an unavailable device rather than appoint an unwilling
      helper. Avoid storing sensitive rosters or credentials in backup copies.
  pause_conditions:
  - Pause Risk ownership and contingency thinking when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Risk ownership and contingency thinking practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Risk ownership and contingency thinking situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
