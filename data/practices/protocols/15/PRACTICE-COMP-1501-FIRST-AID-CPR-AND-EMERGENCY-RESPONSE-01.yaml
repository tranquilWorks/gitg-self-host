meaning_and_fit:
  purpose: Recognize the boundary between summoning help, giving accurate emergency information and performing
    first aid that requires current instruction and observed practice.
  why_recommended: Recognize the boundary between summoning help, giving accurate emergency information
    and performing first aid that requires current instruction and observed practice.
  claims:
  - statement: Recognize the boundary between summoning help, giving accurate emergency information and
      performing first aid that requires current instruction and observed practice.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded First aid, CPR, and emergency response practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record First aid, CPR, and emergency response as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible course, interpreter, communication card or emergency text
    service only where that service is verified locally. Physical limitations may change the safe role
    you can perform; accurate calling and delegation remain useful but do not substitute for an unperformed
    skill assessment. In an actual emergency, use local emergency services and dispatcher guidance immediately.
  opportunity_considerations: Use paper, an unconnected phone or a clearly marked practice script, and
    your local emergency-service information. The fictional case is an adult who collapses at a community
    hall. No real person acts unconscious, no emergency number is dialed for practice, and no physical
    treatment is rehearsed on a person.
  prerequisites:
  - Use paper, an unconnected phone or a clearly marked practice script, and your local emergency-service
    information. The fictional case is an adult who collapses at a community hall. No real person acts
    unconscious, no emergency number is dialed for practice, and no physical treatment is rehearsed on
    a person.
  dependencies: []
  safe_alternatives:
  - Use an accessible course, interpreter, communication card or emergency text service only where that
    service is verified locally. Physical limitations may change the safe role you can perform; accurate
    calling and delegation remain useful but do not substitute for an unperformed skill assessment. In
    an actual emergency, use local emergency services and dispatcher guidance immediately.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    First aid, CPR, and emergency response differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about First aid, CPR, and emergency
    response as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper, an unconnected phone or a clearly marked practice script, and your local emergency-service
    information. The fictional case is an adult who collapses at a community hall. No real person acts
    unconscious, no emergency number is dialed for practice, and no physical treatment is rehearsed on
    a person. Goal: Recognize the boundary between summoning help, giving accurate emergency information
    and performing first aid that requires current instruction and observed practice. Scope: This combines
    a harmless communication rehearsal with a qualified training step. Reading, booking a course or rehearsing
    a call does not establish CPR, AED, choking or bleeding-control competence. Time and effort: Twenty
    minutes for the handoff card, ten minutes for two spoken rehearsals, and the time required by an appropriate
    recognized practical course or refresher. Adaptation: Use an accessible course, interpreter, communication
    card or emergency text service only where that service is verified locally. Physical limitations may
    change the safe role you can perform; accurate calling and delegation remain useful but do not substitute
    for an unperformed skill assessment. In an actual emergency, use local emergency services and dispatcher
    guidance immediately. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible course, interpreter, communication card or emergency text service
    only where that service is verified locally. Physical limitations may change the safe role you can
    perform; accurate calling and delegation remain useful but do not substitute for an unperformed skill
    assessment. In an actual emergency, use local emergency services and dispatcher guidance immediately.
  expected_burden: Twenty minutes for the handoff card, ten minutes for two spoken rehearsals, and the
    time required by an appropriate recognized practical course or refresher.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the First aid, CPR, and emergency response protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed First aid, CPR, and emergency response action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    course, interpreter, communication card or emergency text service only where that service is verified
    locally. Physical limitations may change the safe role you can perform; accurate calling and delegation
    remain useful but do not substitute for an unperformed skill assessment. In an actual emergency, use
    local emergency services and dispatcher guidance immediately.
  actions:
  - stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01-A1
    sequence: 1
    title: Build a location-first emergency information card
    instructions: 'Verify the emergency number for your actual location through its official service.
      On a private card put the address or usable location description, entrance instructions, callback
      method and known access barriers. For the hall case, rehearse reporting where you are, what happened,
      whether the scene appears safe and what you actually observe about responsiveness and breathing.
      Do not invent a diagnosis or delay a real emergency call to finish the card.


      Observation checks: The local emergency route comes from an official source; Location entrance and
      callback information are usable; Observable condition is separated from an assumed diagnosis; No
      real emergency service is contacted for rehearsal. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01
      action_stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01-A1
      competency_stable_id: '15.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1501_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1501_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_local_emergency_route_comes_from_an_official_source
        - location_entrance_and_callback_information_are_usable
        - observable_condition_is_separated_from_an_assumed_diagnosis
        - no_real_emergency_service_is_contacted_for_rehearsal
      - measurement_id: c1501_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1501_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01-A2
    sequence: 2
    title: Rehearse communication and delegation without simulated treatment
    instructions: 'Read the collapse case aloud and speak a concise location-first report to an empty
      room or a willing practice partner. Rehearse asking a specific bystander to summon help or locate
      an AED while you follow actual dispatcher instructions in a real event. Repeat with the caller unable
      to use the main entrance. Identify the differences between safe scene assessment, consent where
      possible, staying within training and acting under emergency guidance. Do not improvise compressions,
      choking maneuvers, tourniquet use or rescue breaths.


      Observation checks: Two clearly labeled communication rehearsals occur; A named task is delegated
      rather than shouted at an unspecified crowd; The access complication changes the handoff; Physical
      intervention is reserved for current instruction and genuine emergencies. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01
      action_stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01-A2
      competency_stable_id: '15.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1501_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1501_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_clearly_labeled_communication_rehearsals_occur
        - a_named_task_is_delegated_rather_than_shouted_at_an_unspecified_crowd
        - the_access_complication_changes_the_handoff
        - physical_intervention_is_reserved_for_current_instruction_and_genuine_emergencies
      - measurement_id: c1501_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1501_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01-A3
    sequence: 3
    title: Obtain an observed skills assessment and record its limits
    instructions: 'Select a recognized local course or refresher appropriate to your role. Ask how it
      covers CPR and AED use, choking, severe bleeding, shock, burns, poisoning and emergency communication,
      and whether practical skills are assessed by a qualified instructor. Complete the relevant supervised
      skills work on approved training equipment, or record this action as pending until it happens. Keep
      only course, date, assessed topics, unresolved gaps and renewal guidance; a certificate or online
      module must not be represented as proof of every listed skill.


      Observation checks: Course scope and practical assessment are verified before relying on it; Actual
      supervised performance is distinguished from enrollment or online study; Assessed topics and unresolved
      skill gaps are recorded accurately; The next refresher follows the provider and role requirements.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Which parts of the response have you actually rehearsed or demonstrated, and which
      still require instruction rather than confidence?


      Examples: Supportive: The caller gave a clear location-first report and later completed an instructor-observed
      CPR/AED session while marking poisoning and burn care as separate learning gaps.


      Mixed: The handoff rehearsal improved but the selected online course did not include hands-on assessment,
      so physical competence remained unverified.


      Contradictory: A person practiced forceful treatment on a friend or delayed a real emergency call
      while trying to finish the worksheet.


      Inconclusive: A course was bookmarked and a list of emergencies copied without either a communication
      rehearsal or an observed skills check.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1501-FIRST-AID-CPR-AND-EMERGENCY-RESPONSE-01
