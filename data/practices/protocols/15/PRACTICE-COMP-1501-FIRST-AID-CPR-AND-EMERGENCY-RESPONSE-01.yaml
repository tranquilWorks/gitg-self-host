        - actual_supervised_performance_is_distinguished_from_enrollment_or_online_study
        - assessed_topics_and_unresolved_skill_gaps_are_recorded_accurately
        - the_next_refresher_follows_the_provider_and_role_requirements
      - measurement_id: c1501_a3_boundary
