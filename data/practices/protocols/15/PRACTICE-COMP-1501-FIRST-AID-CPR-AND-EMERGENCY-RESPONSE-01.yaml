  - id: file-later-packet-md
    title: Later packet
    body: '**Second handoff:** The east entrance is unavailable because of scheduled works. The hall''s
      supplied response plan identifies the north entrance on Practice Lane, with level access directly
      to the main room. Jo can meet responders there after the delegated AED task is reassigned to another
      willing bystander, Ren. No AED retrieval is recorded yet. Update entrance and delegation without
      changing the adult''s observed condition.


      **Separate hazard branch:** A damaged electrical cable lies in water between you and the collapsed
      person. You have not approached and cannot safely establish responsiveness or breathing. State the
      hazard and unknown condition to emergency services in a real incident; do not touch the cable, water
      or person through the hazard or improvise isolation. This branch replaces the original safe-approach
      observations rather than combining them.


      **Fictional course receipt:** Course B was attended September 10. An instructor observed adult CPR
      and AED tasks and recorded them satisfactory. A communication role-play was completed with one access-direction
      correction. Choking practice was interrupted before assessment and is marked not assessed. Course
      C is booked for October 2 but has not occurred. No A completion is supplied.


      Only two physical topics have a satisfactory observed assessment in this record: adult CPR and AED.
      Communication has a completed role-play with the stated correction, not an invented blanket pass.
      Choking, severe bleeding, shock, burns and poisoning remain without the planned assessment. The
      October booking is not attendance. None of these fictional records is your certificate or clinical
      performance.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make the handoff usable and the training gap visible


      Emergency response includes recognizing a possible emergency, summoning appropriate help, communicating
      useful observations and giving care within current guidance and your ability. These are related
      skills, but completing one does not demonstrate the others. A polished call script cannot establish
      CPR technique; enrolling in a course does not establish attendance or a successful skills assessment.


      Allow 35 minutes for the supplied communication and course-selection exercises, plus the separate
      time required for appropriate qualified training. Use paper, an unconnected phone or an accessible
      communication aid. Never dial an emergency number for practice, have someone pretend to be unconscious,
      or perform compressions, choking maneuvers or other treatment on a healthy person. In a real emergency,
      seek local emergency help immediately and follow dispatcher/AED guidance; do not delay action while
      completing a worksheet or waiting to earn a certificate.


      ### Know what the training topics actually concern


      The [American Red Cross first-aid resources](https://www.redcross.org/take-a-class/resources/learn-first-aid)
      distinguish topics that should not be collapsed into a generic “first aid complete” label. The concepts
      below orient your training questions; they are not a standalone procedure manual.


      | Topic | Meaning and question for practical instruction |

      | --- | --- |

      | Severe bleeding | Ongoing major blood loss can be urgent. Learn recognition, protective measures
      and appropriate bleeding control on approved equipment; specialized methods need suitable instruction.
      |

      | CPR | Supports circulation in cardiac arrest. An unresponsive adult who is not breathing normally
      or is only gasping needs immediate emergency response; learn the current sequence and technique
      for your role and age group. |

      | AED | A defibrillator analyzes rhythm and gives prompts; learn safe pad placement, prompts and
      coordination with CPR using a trainer. Merely knowing where a cabinet is does not demonstrate use.
      |

      | Choking | Airway obstruction differs from cardiac arrest, and response varies with the person''s
      condition and age. Learn recognition and the appropriate supervised skills, including relevant adaptations.
      |

      | Shock | A dangerous failure of adequate circulation/oxygen delivery, not simply emotional surprise.
      Learn recognition, emergency escalation and appropriate supportive care. |

      | Burns | Heat, chemicals and electricity create different hazards. Learn scene safety, appropriate
      first aid and escalation; do not improvise a single treatment for every burn. |

      | Poisoning | Harm can follow swallowing, breathing, skin or other exposure. Use emergency/poison-service
      guidance appropriate to location and severity; do not induce vomiting unless the poison specialist
      specifically instructs it. |

      | Communication | Give location, access, observed condition and changes; listen and answer the dispatcher.
      Do not replace “not responding, only gasping” with an assumed diagnosis or “breathing fine.” |


      Current professional topic links and limits are in [sources](?resource=sources). For local emergency
      and poison-service numbers, use the actual jurisdiction''s official service information. No universal
      number or text-service availability is assumed here.


      Worked example: “Someone is ill at the club” leaves responders without a usable location or condition.
      “Cedar Hall, 18 Practice Lane, east entrance, main room; one adult collapsed, is not responding
      and is only gasping” supplies concrete facts in the fictional case. The latter is still a rehearsal,
      not a real call or proof that care occurred.


      ### Complete fictional collapse case


      Cedar Hall is at **18 Practice Lane, Cedar Town**. This address is fictional. The ordinary response
      entrance is the east door; the main room is directly inside. You observed one adult collapse. They
      do not respond and are only gasping. There is no visible fire, traffic or electrical hazard in the
      initial scene. A willing bystander, Jo, is beside you. An AED cabinet is marked at reception, but
      nobody has fetched or used it. Your callback information would come from the actual device during
      a real call; write “practice callback placeholder” here, not a made-up working number.


      #### Action 1 — Prepare and speak the handoff


      Write a short card with location, entrance, callback placeholder, number of affected people and
      exact observed condition. Include “follow dispatcher questions; report changes.” Then speak the
      report aloud, or communicate through your chosen accessible practice method. Record whether you
      actually rehearsed and which facts you omitted on the first attempt.


      Delegate a specific task in the rehearsal: “Jo, get the AED from reception and tell me when you
      have it,” while the caller follows emergency guidance. In a real event, task assignment depends
      on the situation and dispatcher; do not leave an unsafe scene or abandon necessary care to obey
      a rigid worksheet sequence. Do not invent that the AED is present merely because someone was asked
      to fetch it.


      #### Action 2 — Repeat with a changed access route


      Open [the later packet](?resource=file-later-packet-md) after saving the first report. Repeat using
      its changed entrance facts. No physical treatment is acted out. If an observer helps, ask them to
      identify omitted location/access/condition facts, not to certify clinical competence. If alone,
      compare your written or spoken recall with the packet. Recording audio is optional and should contain
      only fiction.


      For the packet''s separate electrical-hazard branch, state that an unsafe approach ends the ordinary
      rehearsal and that real responders need the hazard information. Do not enter a hazardous area to
      collect better observations. “Unknown breathing” should remain unknown if it cannot safely be assessed.


      #### Action 3 — Select training and audit actual scope


      These are complete **invented course descriptions**, not purchasable recommendations:


      | Course | Format and stated assessment |

      | --- | --- |

      | A | Two-hour online knowledge module covering all eight listed topics; no instructor-observed
      physical skills |

      | B | Three-hour supervised session on approved equipment: adult CPR, AED, adult choking and emergency
      communication; no burns, poisoning, shock or bleeding-control assessment |

      | C | Four-hour first-aid session: observed bleeding-control practice plus instructor-assessed shock,
      burns, poisoning and communication scenarios; no CPR/AED/choking skills assessment |


      Choose a route for the listed scope and identify any remaining age-group, role or accessibility
      gaps. B plus C covers the described adult course content on paper; it does not prove that either
      was attended or passed. [Red Cross''s online-course explanation](https://www.redcross.org/take-a-class/first-aid/first-aid-training/first-aid-online)
      explicitly distinguishes online learning from demonstrating proficiency to an instructor.


      Use the later attendance record to make eight topic rows: `not yet learned | knowledge studied |
      attended | assessed result | follow-up`. For actual training, verify the recognized provider, local/role
      requirements, equipment, accessible participation, instructor observation and renewal guidance.
      Record only what was actually demonstrated. A certificate''s title is not a substitute for its assessed
      scope.


      Attempt [fresh checks](?attempt=practice-checks), then [the key](?check=practice-answers). The default
      completes communication practice and a training-gap audit; hands-on qualification remains pending
      until real instruction and assessment occur.


      ### Adapt and continue


      Use a communication card, interpreter or locally verified accessible emergency route. Physical capacity
      can change which role you perform; useful communication and delegation still matter. Do not describe
      an unperformed skill as passed because an adaptation was planned. Harder route: choose training
      for a setting with children and show why adult-only assessment is insufficient for that requirement.


      For transfer, verify your local emergency route without making a test call, prepare a private location/access
      card and arrange an appropriate recognized practical course or refresher if needed. Keep enrollment,
      attendance and assessed outcomes separate. In a real emergency, immediate help and current guidance
      take precedence over this learning sequence.


      **Supportive:** Communication is rehearsed and actual assessed topics are recorded accurately. **Mixed:**
      The handoff improves but physical skills remain unverified. **Contradictory:** Forceful practice
      is performed on a healthy person or real help is delayed for the exercise. **Inconclusive:** A course
      is bookmarked without rehearsal or observed skills evidence.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A person is unresponsive and only gasping. Is “breathing normally” an accurate handoff?
      What should the real responder do about summoning help while learning materials remain unfinished?

      2. A certificate says “online first aid completed” and records no observed skills. A CPR/AED session
      is booked next week. Which physical skills can be recorded as demonstrated from those facts?

      3. The main entrance is blocked, an alternative entrance is confirmed, and someone has been asked
      to fetch an AED. What should change in the handoff, and may AED use be recorded as completed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Report unresponsiveness and gasping accurately; these warrant immediate emergency response.
      Contact local emergency services and follow dispatcher/AED guidance without waiting to finish this
      exercise or obtain a certificate. The default practice still uses no real call or treatment on a
      healthy person.

      2. None is established as physically demonstrated. Online completion is knowledge-course evidence;
      booking is a plan. Record the missing observed assessment and obtain suitable instruction. Do not
      infer failure either: performance is unverified.

      3. Give the confirmed usable entrance and meeting/access directions and keep the condition observations
      current. A delegated AED task is not confirmed retrieval, application or use. Record each only when
      actually known; do not fill missing care steps with assumptions.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
