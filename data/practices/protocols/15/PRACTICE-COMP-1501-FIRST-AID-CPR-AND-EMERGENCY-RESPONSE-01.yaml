  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for First aid, CPR, and emergency response explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen First aid, CPR, and emergency response
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each First aid, CPR, and emergency response observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated First aid, CPR, and emergency response rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Build a location-first emergency information card. Observed checks: The
    local emergency route comes from an official source; Location entrance and callback information are
    usable; Observable condition is separated from an assumed diagnosis; No real emergency service is
    contacted for rehearsal. Action 2: Rehearse communication and delegation without simulated treatment.
    Observed checks: Two clearly labeled communication rehearsals occur; A named task is delegated rather
    than shouted at an unspecified crowd; The access complication changes the handoff; Physical intervention
    is reserved for current instruction and genuine emergencies. Action 3: Obtain an observed skills assessment
    and record its limits. Observed checks: Course scope and practical assessment are verified before
    relying on it; Actual supervised performance is distinguished from enrollment or online study; Assessed
    topics and unresolved skill gaps are recorded accurately; The next refresher follows the provider
    and role requirements.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A course was bookmarked and a list of emergencies copied
    without either a communication rehearsal or an observed skills check.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct First
    aid, CPR, and emergency response contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
