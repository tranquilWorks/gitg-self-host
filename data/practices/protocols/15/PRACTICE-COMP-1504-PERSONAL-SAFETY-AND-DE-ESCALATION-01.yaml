  - id: file-later-packet-md
    title: Later packet
    body: 'Read after preserving the first attempt. These outcomes are supplied possibilities, not reports
      of your actions.


      A. The marker follows the level north route, and the learner asks the desk for help leaving. The
      phrase contains no demand to settle the queue dispute. This supports a usable first plan under the
      initial facts.


      B. When the desk becomes unavailable, the learner repeats the same sentence and waits there indefinitely.
      Calm delivery does not repair the missing endpoint. Revise to the east lobby''s occupied reception
      while that route remains usable.


      C. The learner walks toward the west alcove because it is quieter, then realizes it has no onward
      route. The observation contradicts the assumption that quiet automatically means safer. Correct
      the route without reenacting danger.


      D. A partner declines rehearsal. A completed sketch remains a planning artifact; no interpersonal
      rehearsal occurred. Do not write “successfully de-escalated.”


      Record which defect your own attempt exposed, or that none was observed in this limited exercise.
      Successful leaving does not require the fictional visitor to apologize, agree, or stop feeling annoyed.
      No outcome here establishes effectiveness in abuse, pursuit or physical assault.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Leave a tense exchange with a usable route


      Start with the fictional queue below and a sheet of paper. In about twenty minutes you will make
      and rehearse a short exit decision, including what changes when help is unavailable. No one needs
      to act angry. You may speak seated, use a communication device, or move a paper marker instead of
      your body. The goal is a proportionate safety response, not winning an argument or proving composure.


      ### What de-escalation can and cannot do


      A boundary states your own next action: “I’m stepping away now.” A demand tries to control someone
      else: “You will apologize before I leave.” The first can support an exit; the second can keep you
      engaged. Neither sentence guarantees safety. You are not responsible for another person''s aggression,
      and leaving without the perfect phrase is a valid response.


      Space and access matter alongside words. Distance can give more opportunity to disengage, but a
      fixed number of steps is not a universal safe distance. A move into an isolated corner may increase
      separation while removing options. Look for a route that suits your mobility, leads to help or a
      safer place, and does not require pushing past the person. Do not create distance by cornering them
      either. A crowded doorway can cease to be usable even when its sign still says exit.


      A calm, short statement can reduce conversational friction. Explaining every detail, arguing about
      motives, making threats, or trying to extract agreement can prolong the encounter. You can acknowledge
      a practical concern without admitting a false accusation: “The queue is confusing; staff can sort
      it out.” HSE''s workplace guidance supports calm communication, personal space and escalation to
      established help procedures; it does not prove a script will prevent violence. See sources S01–S02
      in [SOURCES](?resource=sources).


      Observe behavior and conditions, not a person''s appearance or presumed diagnosis. A louder complaint
      may warrant ending a low-stakes discussion; a threat, pursuit, blocked route or weapon changes the
      situation more substantially. Do not stay to complete this exercise during danger. Seek a safer
      position and appropriate emergency help as circumstances allow. This practice is unsuitable for
      managing abuse, coercive control or stalking: an announced boundary can increase risk in those settings.
      Use specialist safety planning instead of testing this script on an unsafe person.


      ### Worked example


      At a library counter, Lee is accused of taking someone else''s place. Lee''s first draft is, “Actually,
      I arrived first, and you need to calm down.” It adds a dispute and a command. Lee revises it to,
      “I’ll let the desk handle the order,” and identifies the staffed desk along a clear level route.
      The useful change is not simply fewer words: Lee now has an endpoint and a way to stop discussing
      the accusation. If that desk closes, the sentence alone no longer supplies the plan.


      ### Your complete fictional scene


      You are collecting a reserved book. Another visitor says, “You jumped the queue.” They remain beside
      the queue rope; no one is threatening or blocking you. You do not need to collect the book today.


      | Place | Current observation |

      | --- | --- |

      | North counter | Staff member present; level path around the queue, without passing the other visitor
      |

      | East lobby | Open public entrance; level route, occupied reception visible beyond it |

      | West alcove | Quiet, but a dead end with no staff |

      | Queue opening | Narrow gap beside the complaining visitor; unnecessary to use |


      A willing rehearsal partner may read that single accusation in an ordinary voice, then stop speaking.
      Agree on “pause” before beginning. Do not shout, touch, follow, obstruct, film, surprise, or use
      real grievances. Alone, read the line once or imagine it without performing the other role.


      ### Make and try the decision


      1. Mark your starting point and two possible endpoints on paper. Choose the first route using the
      observations, not the shortest distance alone. Name one route you reject and why.

      2. Draft one optional sentence that states your next action or redirects the practical issue. Remove
      any demand for apology, diagnosis, insult or promise of punishment. You may choose silence if speaking
      is unhelpful.

      3. Rehearse once at normal intensity: read the prompt, state your sentence if using one, then point
      or move the marker along the chosen route. Say what specific help you would request at the endpoint:
      for example, help keeping the encounter from continuing while you leave.

      4. Introduce this announced change: the north staff member is unavailable. Choose again using the
      same map. Do not invent replacement staff or require your partner to become more aggressive. Rehearse
      the changed endpoint.

      5. Write the conditions that end this low-stakes rehearsal''s applicability: pursuit, threats, loss
      of an exit, weapon, distress, or any other immediate danger. For the fictional case, identify how
      you would seek appropriate help without returning to argue. Do not make any actual alarm or emergency
      call.

      6. Compare both attempts. Was the destination reachable under the stated facts? Did your words delay
      leaving? Revise one weak point and repeat that portion once. Save the original alongside the correction.


      Your output is a two-route sketch, the optional sentence, one concrete help request, and the before/after
      correction. Record paper rehearsal or consenting low-intensity rehearsal, whichever actually occurred.
      A marker reaching reception is not evidence that a real confrontation would end safely.


      ### Read the outcome without inflating it


      Open the [later packet](?resource=file-later-packet-md) after your first attempt. A clear endpoint
      supports this bounded planning skill. A calm phrase followed by an unavailable endpoint is mixed
      performance. Staying to force acknowledgment contradicts the exit goal. No rehearsal or no information
      about the route is inconclusive, not failure of courage. Your internal feeling of confidence is
      useful context but cannot certify safety.


      ### Adapt and transfer


      For a lighter version, select between the north counter and west alcove and give one reason; then
      add the staff-unavailable change. Keep mobility aids and communication supports. A partner can move
      the marker under your direction without pretending you can physically use an inaccessible route.
      A harder paper version removes the east route too; a valid answer may be that the supplied plan
      has no established safe exit and needs venue-specific support, rather than inventing one.


      For real transfer, during an ordinary calm visit identify the actual assistance point and a suitable
      way to leave. Do not create a disagreement to test yourself. If work exposes you to aggression,
      review the employer''s procedures and relevant training with the responsible person. Keep incident
      notes factual and private under the applicable process. Then try the [fresh checks](?attempt=practice-checks)
      and compare with the [corrective key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. At a café, the nearest door requires squeezing past a person making threats. A second route
      is unknown. What should your plan say, and what should it avoid claiming?

      2. Your phrase is polite but ends, “I’m staying until you admit you were wrong.” Identify the relevant
      defect and revise it.

      3. You used a paper map successfully. A workplace asks whether you have demonstrated physical de-escalation
      competence. What evidence can you honestly offer, and what remains needed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The nearest door is not established as safely usable; the unknown route is not a verified
      alternative. Prioritize obtaining appropriate help and a safer option as circumstances allow; do
      not squeeze past to satisfy the exercise or invent an accessible exit. The important correction
      is acknowledging the changed danger and uncertainty, not choosing an unverified door confidently.

      2. The condition keeps you engaged until the other person complies. An example revision is “I’m
      ending this conversation and going to the counter.” Use a verified endpoint, and omit speech if
      unsafe. Politeness alone does not make the original boundary executable.

      3. Offer only the route decisions and paper rehearsal, with its limitations. Relevant employer procedures,
      qualified practical instruction and observed performance in the actual role remain separate. Course
      attendance by itself would not establish every practical skill either.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
