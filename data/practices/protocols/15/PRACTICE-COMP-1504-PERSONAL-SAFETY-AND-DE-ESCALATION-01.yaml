meaning_and_fit:
  purpose: Use clear words, distance, an available exit and appropriate assistance to reduce exposure
    to an escalating interaction before considering physical confrontation.
  why_recommended: Use clear words, distance, an available exit and appropriate assistance to reduce exposure
    to an escalating interaction before considering physical confrontation.
  claims:
  - statement: Use clear words, distance, an available exit and appropriate assistance to reduce exposure
      to an escalating interaction before considering physical confrontation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Personal safety and de-escalation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Personal safety and de-escalation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use written communication, a speech device, a seated route or a support person.
    People facing stalking, domestic abuse, retaliation or dependency should use specialist safety planning
    rather than practice direct boundary-setting with the unsafe person. Immediate danger warrants local
    emergency help.
  opportunity_considerations: 'Use an empty room or a willing partner who agrees to a calm script, no
    shouting, touching, blocking or surprise escalation. Fictional case: a stranger argues that you took
    their place in a queue. Your aim is to leave safely or involve staff, not prove entitlement to the
    place.'
  prerequisites:
  - 'Use an empty room or a willing partner who agrees to a calm script, no shouting, touching, blocking
    or surprise escalation. Fictional case: a stranger argues that you took their place in a queue. Your
    aim is to leave safely or involve staff, not prove entitlement to the place.'
  dependencies: []
  safe_alternatives:
  - Use written communication, a speech device, a seated route or a support person. People facing stalking,
    domestic abuse, retaliation or dependency should use specialist safety planning rather than practice
    direct boundary-setting with the unsafe person. Immediate danger warrants local emergency help.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Personal safety and de-escalation differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Personal safety and de-escalation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an empty room or a willing partner who agrees to a calm script, no shouting, touching, blocking
    or surprise escalation. Fictional case: a stranger argues that you took their place in a queue. Your
    aim is to leave safely or involve staff, not prove entitlement to the place. Goal: Use clear words,
    distance, an available exit and appropriate assistance to reduce exposure to an escalating interaction
    before considering physical confrontation. Scope: This is a non-contact rehearsal for an ordinary
    public disagreement, not training for abuse, coercive control, armed threats or physical self-defense.
    Time and effort: Fifteen minutes to prepare and two five-minute voluntary rehearsals followed by a
    ten-minute review. Adaptation: Use written communication, a speech device, a seated route or a support
    person. People facing stalking, domestic abuse, retaliation or dependency should use specialist safety
    planning rather than practice direct boundary-setting with the unsafe person. Immediate danger warrants
    local emergency help. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written communication, a speech device, a seated route or a support person.
    People facing stalking, domestic abuse, retaliation or dependency should use specialist safety planning
    rather than practice direct boundary-setting with the unsafe person. Immediate danger warrants local
    emergency help.
  expected_burden: Fifteen minutes to prepare and two five-minute voluntary rehearsals followed by a ten-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Personal safety and de-escalation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Personal safety and de-escalation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written
    communication, a speech device, a seated route or a support person. People facing stalking, domestic
    abuse, retaliation or dependency should use specialist safety planning rather than practice direct
    boundary-setting with the unsafe person. Immediate danger warrants local emergency help.
  actions:
  - stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01-A1
    sequence: 1
    title: Define an exit-centered response before rehearsing
    instructions: 'Identify the public exit, staff point and a way to keep ordinary space without cornering
      anyone. Prepare one short phrase such as I do not want an argument; I will ask staff or step away.
      State a stop threshold for threats, pursuit, blocked movement or a weapon: the exercise ends and
      real-world safety or emergency support takes priority. Do not promise that calm words will make
      another person calm.


      Observation checks: The response has an available exit and assistance route; A short nonprovocative
      phrase is prepared; Escalation thresholds are explicit before the rehearsal; Success does not depend
      on controlling the other person. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01
      action_stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01-A1
      competency_stable_id: '15.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1504_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1504_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_response_has_an_available_exit_and_assistance_route
        - a_short_nonprovocative_phrase_is_prepared
        - escalation_thresholds_are_explicit_before_the_rehearsal
        - success_does_not_depend_on_controlling_the_other_person
      - measurement_id: c1504_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1504_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01-A2
    sequence: 2
    title: Practice the words and movement at normal intensity
    instructions: 'In the marked practice space, say the prepared phrase at an ordinary volume, leave
      room for movement and walk to the agreed safe endpoint. The partner, if present, reads only the
      approved mild disagreement. Repeat with the staff point unavailable, using the exit instead. Do
      not add grappling, restraint, sudden pursuit, intimidation or sensory stress to make the scene realistic;
      those would change the risk and training requirements.


      Observation checks: Two predictable non-contact rehearsals occur; Voice words and movement support
      disengagement; An unavailable helper leads to a different safe route; No surprise escalation physical
      contact or blocked exit is introduced. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01
      action_stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01-A2
      competency_stable_id: '15.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1504_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1504_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_predictable_non_contact_rehearsals_occur
        - voice_words_and_movement_support_disengagement
        - an_unavailable_helper_leads_to_a_different_safe_route
        - no_surprise_escalation_physical_contact_or_blocked_exit_is_introduced
      - measurement_id: c1504_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1504_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01-A3
    sequence: 3
    title: Review the route and choose a real-life boundary
    instructions: 'Ask whether the phrase was brief, whether you could move without approaching the other
      person and whether your route reached help or separation. Revise one awkward part and rehearse it
      once more. Write the boundary you will use outside practice: do not seek a confrontation, do not
      follow to continue the dispute, and obtain appropriate help if safe withdrawal is not available.
      Record rehearsal only; a calm practice partner is not evidence of success against an aggressor.


      Observation checks: Words distance and exit are reviewed separately; One observed problem is revised
      and rehearsed again; The real-life boundary excludes pursuing or prolonging conflict; Rehearsal
      is not reported as proven crisis performance. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did the sequence actually create an exit or assistance option, or did some part still
      invite an argument you were trying to avoid?


      Examples: Supportive: The person replaced a long defense of their position with one neutral sentence
      and a clear route to staff, then rehearsed the alternative exit.


      Mixed: The words were calm but the first route moved closer to the other person, so the layout was
      changed before repeating.


      Contradictory: The partner blocked the doorway or the participant deliberately provoked a stranger
      to test the technique.


      Inconclusive: A phrase was memorized without checking space, exit, assistance or the limits of rehearsal.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1504-PERSONAL-SAFETY-AND-DE-ESCALATION-01
