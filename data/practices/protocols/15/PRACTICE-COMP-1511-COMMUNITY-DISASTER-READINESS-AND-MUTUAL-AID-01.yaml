        criteria:
        - completed_work_and_unfilled_needs_are_distinguished
        - a_shared_correction_is_agreed_rather_than_imposed
        - the_correction_is_tested_with_permission
        - role_closure_withdrawal_and_preparation_only_limits_are_explicit
      - measurement_id: c1511_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
