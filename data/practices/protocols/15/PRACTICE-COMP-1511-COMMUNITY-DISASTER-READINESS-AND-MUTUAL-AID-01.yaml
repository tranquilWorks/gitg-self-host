  - id: file-later-packet-md
    title: Later packet
    body: 'A''s two containers plus B''s one require three of the four available, leaving one unallocated.
      Stock is sufficient for those requests, but B''s collection remains unresolved without suitable
      transport. Ren''s initial two places never established step-free suitability; withdrawal now removes
      even that candidate capacity.


      In the fictional teach-back, A says, “Hall H is open tonight for sleeping.” That contradicts the
      notice. Correct the overnight distinction and ask again without blaming A. A then repeats the collection
      window and says there is no overnight shelter. This supports the corrected simulated relay, not
      an actual neighbor''s understanding.


      B does not answer the agreed check-in. Record no response and hand it to Mara under the agreed process.
      Do not conclude B is safe, injured or refusing all help; do not enter a home. Immediate danger,
      if actually known, would require the appropriate emergency route.


      Mara acknowledges the transport gap but has no confirmed solution. Your handover is received; the
      need is still unmet. Jo''s distribution task is accepted but has not yet occurred. Distinguish accepted,
      attempted, completed and unknown.


      No actual community participation or household consent is established by this supplied packet. Retain
      that limit alongside any rehearsal you actually performed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Coordinate one bounded mutual-aid task


      Use the fictional neighborhood outage exercise below. In about thirty minutes you will assign only
      accepted tasks, relay a notice accurately and expose a transport gap without inventing capacity.
      This tabletop can prepare you to join a real community plan; it cannot establish that you participated
      with actual neighbors. No real alerts, household visits, welfare calls or requests for personal
      information are part of the default.


      ### Community readiness is a relationship with limits


      A household can store supplies and still depend on neighbors, transport, public information and
      professional services. Mutual aid connects needs and willing resources, but it is not authority
      to enter homes, collect health histories or promise care. Ask what an existing group already does
      and where a bounded contribution would fit. People can decline help, decline volunteering or withdraw
      a previously offered role.


      A resource has a quantity, availability, scope and owner. “We have a driver” is incomplete if the
      driver is unavailable when needed or cannot provide accessible transport. “We will check everyone”
      hides consent and capacity questions. Agree a welfare-check method, expected response and escalation
      route with participants in advance where possible. Lack of response is not proof of injury and does
      not authorize entry. Immediate danger uses appropriate emergency services; nonurgent unanswered
      check-ins follow the locally agreed organizer process.


      Communication is more than forwarding. Preserve the source, time, place, action and uncertainty
      in an official notice. Ask the recipient to repeat the practical meaning, especially if a limitation
      could be lost. Do not turn “supply collection point” into “overnight shelter” or “planned” into
      “available.” Accessible language, interpretation and alternatives to an app help people participate
      without being required to disclose a diagnosis.


      FEMA''s volunteer-management material emphasizes defined roles, training, supervision and matching
      tasks to capability. It does not make an unaffiliated learner an emergency responder. See S13 in
      [SOURCES](?resource=sources). Recovery also needs coordination: close tasks, hand over unresolved
      needs, replenish agreed supplies and end access to temporary contact records according to the group''s
      policy. Volunteering is not a promise of permanent availability.


      ### Worked example


      A neighborhood group asks Pat to relay a verified notice to two consenting households. Pat offers
      twenty minutes and translation of the notice, but no transport or medical advice. The organizer
      accepts that bounded role. One household asks for a ride. Pat records the request through the agreed
      private route and asks the organizer to find a suitable provider. Pat''s useful contribution is
      not erased by the transport gap, but the gap must not be marked solved merely because it was forwarded.


      ### Complete fictional exercise packet


      Everything here is invented and labeled rehearsal. The fictional organizer, Mara, holds the official-source
      contact and coordinates assignments. Volunteers may stop, and Mara must reassign or leave a need
      explicitly unmet.


      **Practice notice, Day 1 at 14:00:** The municipal desk says the power outage is being assessed.
      A staffed supply collection point at Hall H is open from 15:00 to 17:00 for sealed drinking-water
      containers. Hall H is not an overnight shelter. Transport is not included. Check the municipal desk
      for changes; restoration time is unknown.


      | Participant or resource | Agreed scope |

      | --- | --- |

      | You | Twenty-minute notice relay and recipient teach-back; no transport, entry or care role |

      | Jo | Can distribute four containers at Hall H under organizer instructions; no home delivery |

      | Ren | Initially offers two passenger places at 15:30, ordinary vehicle; suitability for any particular
      passenger not assessed |

      | Household A | Consents to a text notice and asks for two containers; can collect independently
      |

      | Household B | Consents to a voice notice; asks for one container and step-free transport; no diagnosis
      requested |

      | Household C | Declines participation; do not contact through this exercise |

      | Supplies | Four containers allocated to this small fictional plan; professional services remain
      separate |


      Mara''s agreed process: report unmet needs privately using household labels, not medical histories;
      confirm whether a task was accepted, attempted and completed; unresolved nonurgent requests return
      to Mara. Nobody has permission to enter a home. The welfare-check component is a pre-agreed check-in
      with A and B by 14:30 on Day 1; at that deadline no response returns to Mara for the agreed next
      step, not to an improvised visit. Immediate danger would use emergency services rather than this
      tabletop queue.


      ### Relay, check and revise


      1. Make a six-part outline covering communication, supplies, transport, welfare checks, skills/roles
      and recovery. For each, name what the packet actually establishes and what remains unconfirmed.
      Leave C outside the contact plan.

      2. Draft a short notice in plain language retaining opening times, no overnight shelter, no included
      transport and unknown restoration time. Label it fictional rehearsal. Do not send it.

      3. Role-play the relay with a willing person, using only invented household labels. Ask them to
      tell you when and where collection occurs and whether a ride or overnight stay is included. Alone,
      close your draft, then reconstruct those four details later and label it self-recall rather than
      recipient understanding.

      4. Allocate the requested containers without exceeding the stock. Separate having a container available
      from B being able to reach it. Record transport suitability unresolved even before any driver withdraws.

      5. Introduce the announced change: Ren is unavailable. Route B''s unmet transport request to Mara,
      naming the limitation. Do not assign yourself, a stranger or an unsuitable vehicle to make the table
      look complete.

      6. Open the [later packet](?resource=file-later-packet-md). Correct any meaning lost in the relay
      and close your own twenty-minute assignment with completed actions, unconfirmed delivery, remaining
      need, responsible organizer and the agreed end of temporary contact use.


      Your output is a bounded task record, accurate notice, actual rehearsal method and unresolved-needs
      handover. A forwarded request is not a fulfilled request. Fictional agreement is not consent from
      real households.


      ### Participate without overclaiming


      For a smaller task, relay just the opening time and overnight limitation, then add transport and
      restoration uncertainty. Use accessible text, interpretation or communication aids; verify meaning
      without testing someone''s literacy or asking why they need an accommodation. A harder tabletop
      adds a competing request for the remaining stock; ask the organizer for the agreed allocation policy
      rather than inventing a moral ranking of households.


      For real transfer, contact an existing willing neighborhood group or recognized local organization
      through its normal route. Offer a specific skill and availability, ask about training, consent,
      privacy and boundaries, and participate in an announced task or exercise if accepted. Record the
      actual role, feedback and correction, not names or vulnerability lists. Outreach without acceptance
      remains outreach; solo practice remains preparation. Complete the [fresh checks](?attempt=practice-checks)
      and [key](?check=practice-answers) separately.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. An organizer has six supply packs; two accepted requests need two each and another needs
      three. What should the task record show?

      2. A household has not answered an agreed check-in. A volunteer proposes entering with a borrowed
      key. What boundary matters?

      3. You emailed an offer to help and received no reply. Can you record participation in a community
      exercise?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Total demand is seven, so one pack is short. Record the gap and ask the responsible organizer
      to apply the agreed allocation or obtain verified supplies. Do not silently reduce someone''s request
      or promise seven deliveries from six packs.

      2. No response is uncertain information, not permission to enter. Follow the agreed organizer/welfare
      process and use appropriate emergency help for actual immediate danger. A borrowed key does not
      create consent or a qualified response role.

      3. No. Record outreach and any preparation actually completed; acceptance and participation remain
      unestablished. Follow the group''s ordinary contact process without turning silence into consent
      or inventing observer feedback.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
