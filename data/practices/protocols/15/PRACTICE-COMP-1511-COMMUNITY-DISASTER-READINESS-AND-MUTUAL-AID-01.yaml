  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Community disaster readiness and mutual aid; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - A remote message-checking, translation or accessibility-review role can be as legitimate as physical
      supply work. Never promise transport or care beyond your competence. Use official emergency services
      for immediate danger and the group’s safeguarding route for concerns requiring more than informal
      support.
    cultural_context:
    - Adapt the expression of Community disaster readiness and mutual aid to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - A remote message-checking, translation or accessibility-review role can be as legitimate as physical
      supply work. Never promise transport or care beyond your competence. Use official emergency services
      for immediate danger and the group’s safeguarding route for concerns requiring more than informal
      support.
  pause_conditions:
  - Pause Community disaster readiness and mutual aid when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Community disaster readiness and mutual aid practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Community disaster readiness and mutual aid situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
