meaning_and_fit:
  purpose: Contribute a bounded useful role to a community plan while respecting privacy, unequal capacity
    and the limits of volunteer help.
  why_recommended: Contribute a bounded useful role to a community plan while respecting privacy, unequal
    capacity and the limits of volunteer help.
  claims:
  - statement: Contribute a bounded useful role to a community plan while respecting privacy, unequal
      capacity and the limits of volunteer help.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Community disaster readiness and mutual aid practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Community disaster readiness and mutual aid as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: A remote message-checking, translation or accessibility-review role can be
    as legitimate as physical supply work. Never promise transport or care beyond your competence. Use
    official emergency services for immediate danger and the group’s safeguarding route for concerns requiring
    more than informal support.
  opportunity_considerations: 'Use an existing neighborhood, building, community-center or mutual-aid
    group. Default scenario: a local outage interrupts ordinary communication and transport for an afternoon.
    Prepare an offer you can genuinely fulfill, such as relaying a public notice or staffing an agreed
    information point, plus limits on time and personal data.'
  prerequisites:
  - 'Use an existing neighborhood, building, community-center or mutual-aid group. Default scenario: a
    local outage interrupts ordinary communication and transport for an afternoon. Prepare an offer you
    can genuinely fulfill, such as relaying a public notice or staffing an agreed information point, plus
    limits on time and personal data.'
  dependencies: []
  safe_alternatives:
  - A remote message-checking, translation or accessibility-review role can be as legitimate as physical
    supply work. Never promise transport or care beyond your competence. Use official emergency services
    for immediate danger and the group’s safeguarding route for concerns requiring more than informal
    support.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Community disaster readiness and mutual aid differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Community disaster readiness
    and mutual aid as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an existing neighborhood, building, community-center or mutual-aid group. Default scenario:
    a local outage interrupts ordinary communication and transport for an afternoon. Prepare an offer
    you can genuinely fulfill, such as relaying a public notice or staffing an agreed information point,
    plus limits on time and personal data. Goal: Contribute a bounded useful role to a community plan
    while respecting privacy, unequal capacity and the limits of volunteer help. Scope: This requires
    willing community participation or remains preparation-only. It does not authorize medical care, forced
    welfare checks, entry into homes, emergency transport or access to private vulnerability lists. Time
    and effort: Twenty minutes to prepare a role offer, one short group conversation or existing community
    exercise and a fifteen-minute follow-up. Adaptation: A remote message-checking, translation or accessibility-review
    role can be as legitimate as physical supply work. Never promise transport or care beyond your competence.
    Use official emergency services for immediate danger and the group’s safeguarding route for concerns
    requiring more than informal support. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A remote message-checking, translation or accessibility-review role can be as legitimate
    as physical supply work. Never promise transport or care beyond your competence. Use official emergency
    services for immediate danger and the group’s safeguarding route for concerns requiring more than
    informal support.
  expected_burden: Twenty minutes to prepare a role offer, one short group conversation or existing community
    exercise and a fifteen-minute follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Community disaster readiness and mutual aid protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Community disaster readiness and mutual aid action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A remote message-checking,
    translation or accessibility-review role can be as legitimate as physical supply work. Never promise
    transport or care beyond your competence. Use official emergency services for immediate danger and
    the group’s safeguarding route for concerns requiring more than informal support.
  actions:
  - stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01-A1
    sequence: 1
    title: Offer one bounded contribution and ask what is actually needed
    instructions: 'Contact an appropriate organizer through an established channel. Ask what outage or
      disaster plan already exists, how volunteers are authorized and how people request or decline help.
      Offer one skill, resource or time window without assuming that visible vulnerability means consent
      to intervention. Ask how communication, supplies, transport, welfare checks and recovery support
      are coordinated, and identify which roles require professional qualifications or formal safeguarding.


      Observation checks: An existing organizer or legitimate group route is contacted; The offer is bounded
      by actual capacity and authority; People can request or decline assistance; Six coordination areas
      and qualified-role limits are discussed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01
      action_stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01-A1
      competency_stable_id: '15.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1511_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1511_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_existing_organizer_or_legitimate_group_route_is_contacted
        - the_offer_is_bounded_by_actual_capacity_and_authority
        - people_can_request_or_decline_assistance
        - six_coordination_areas_and_qualified_role_limits_are_discussed
      - measurement_id: c1511_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1511_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01-A2
    sequence: 2
    title: Join an announced communication or information drill
    instructions: 'With agreement, take part in a small tabletop or established exercise using fictional
      household details. Practice receiving an official public notice, passing it through the agreed channel
      and confirming that the intended recipient received the same message. Introduce one unavailable
      volunteer or transport option on paper and route the gap to the organizer. Do not enter homes, collect
      health details, imitate an official responder or create a real emergency alert.


      Observation checks: A willing group participates in an announced exercise; The public message is
      passed and receipt is checked; An unavailable resource is escalated through the agreed coordinator;
      No private household information or false emergency status is created. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01
      action_stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01-A2
      competency_stable_id: '15.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1511_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1511_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_willing_group_participates_in_an_announced_exercise
        - the_public_message_is_passed_and_receipt_is_checked
        - an_unavailable_resource_is_escalated_through_the_agreed_coordinator
        - no_private_household_information_or_false_emergency_status_is_created
      - measurement_id: c1511_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1511_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01-A3
    sequence: 3
    title: Close the assigned task and improve one shared gap
    instructions: 'Report what you actually completed, what failed and what remains outside your role.
      Agree one correction such as a clearer public meeting point, an accessible message format or a backup
      contact role, and test that correction with the group’s permission. Confirm how volunteering ends
      and how future contact or retained information can be withdrawn. If no group accepts the offer,
      record outreach and preparation only rather than claiming community participation.


      Observation checks: Completed work and unfilled needs are distinguished; A shared correction is
      agreed rather than imposed; The correction is tested with permission; Role closure withdrawal and
      preparation-only limits are explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Did the community gain a usable contribution that it actually wanted, and what coordination
      failure would still matter if the usual volunteer were absent?


      Examples: Supportive: A volunteer joined the group’s practice, found that an audio notice lacked
      the meeting location and helped correct and retest the message.


      Mixed: Outreach produced a useful role offer, but no group exercise occurred, so participation remained
      pending.


      Contradictory: A volunteer compiled neighbors’ medical information or entered a home for an unrequested
      welfare check.


      Inconclusive: A personal stockpile was described as mutual aid without contact, consent or coordination
      with anyone else.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01
      action_stable_id: PRACTICE-COMP-1511-COMMUNITY-DISASTER-READINESS-AND-MUTUAL-AID-01-A3
      competency_stable_id: '15.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1511_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1511_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
