  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Community disaster readiness and mutual aid explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Community disaster readiness and mutual
    aid context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Community disaster readiness and mutual aid observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Community disaster readiness and mutual aid rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Offer one bounded contribution and ask what is actually needed. Observed
    checks: An existing organizer or legitimate group route is contacted; The offer is bounded by actual
    capacity and authority; People can request or decline assistance; Six coordination areas and qualified-role
    limits are discussed. Action 2: Join an announced communication or information drill. Observed checks:
