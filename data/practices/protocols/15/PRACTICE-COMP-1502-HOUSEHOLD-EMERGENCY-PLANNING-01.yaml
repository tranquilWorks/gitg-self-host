meaning_and_fit:
  purpose: Make a household plan usable when people, power, transport or communication are unavailable,
    then test one safe part and correct a discovered gap.
  why_recommended: Make a household plan usable when people, power, transport or communication are unavailable,
    then test one safe part and correct a discovered gap.
  claims:
  - statement: Make a household plan usable when people, power, transport or communication are unavailable,
      then test one safe part and correct a discovered gap.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Household emergency planning practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Household emergency planning as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: A person living alone can use an agreed contact and verified building assistance
    plan; do not assume a neighbor has consented to help. Use accessible print, audio, symbols and duplicate
    paper copies. Required medical-device continuity and evacuation assistance need the relevant professional
    or building plan, not improvised workarounds.
  opportunity_considerations: 'Use a household sketch, paper contacts and the local emergency-management
    guidance. Default scenario: a storm interrupts electricity and phone charging for an evening while
    one household member is away. Include pets, mobility or communication needs, medication or powered-equipment
    dependencies and the possibility that the usual helper is unavailable.'
  prerequisites:
  - 'Use a household sketch, paper contacts and the local emergency-management guidance. Default scenario:
    a storm interrupts electricity and phone charging for an evening while one household member is away.
    Include pets, mobility or communication needs, medication or powered-equipment dependencies and the
    possibility that the usual helper is unavailable.'
  dependencies: []
  safe_alternatives:
  - A person living alone can use an agreed contact and verified building assistance plan; do not assume
    a neighbor has consented to help. Use accessible print, audio, symbols and duplicate paper copies.
    Required medical-device continuity and evacuation assistance need the relevant professional or building
    plan, not improvised workarounds.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Household emergency planning differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Household emergency planning
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a household sketch, paper contacts and the local emergency-management guidance. Default
    scenario: a storm interrupts electricity and phone charging for an evening while one household member
    is away. Include pets, mobility or communication needs, medication or powered-equipment dependencies
    and the possibility that the usual helper is unavailable. Goal: Make a household plan usable when
    people, power, transport or communication are unavailable, then test one safe part and correct a discovered
    gap. Scope: This is a planning and access check, not a fire, smoke, electrical, medical or evacuation
    stunt. Local emergency instructions and building requirements govern real incidents. Time and effort:
    Thirty minutes to prepare, a fifteen-minute announced tabletop walk-through and ten minutes to fix
    and retest one gap. Adaptation: A person living alone can use an agreed contact and verified building
    assistance plan; do not assume a neighbor has consented to help. Use accessible print, audio, symbols
    and duplicate paper copies. Required medical-device continuity and evacuation assistance need the
    relevant professional or building plan, not improvised workarounds. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. A person living alone can use an agreed contact and verified building assistance
    plan; do not assume a neighbor has consented to help. Use accessible print, audio, symbols and duplicate
    paper copies. Required medical-device continuity and evacuation assistance need the relevant professional
    or building plan, not improvised workarounds.
  expected_burden: Thirty minutes to prepare, a fifteen-minute announced tabletop walk-through and ten
    minutes to fix and retest one gap.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Household emergency planning protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Household emergency planning action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. A person living
    alone can use an agreed contact and verified building assistance plan; do not assume a neighbor has
    consented to help. Use accessible print, audio, symbols and duplicate paper copies. Required medical-device
    continuity and evacuation assistance need the relevant professional or building plan, not improvised
    workarounds.
  actions:
  - stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01-A1
    sequence: 1
    title: Assign a safe route for six disruption types
    instructions: 'For fire, power loss, evacuation, severe weather, urgent illness and unavailable services,
      state the official warning source, immediate safe action, who needs assistance and a meeting or
      contact route. Separate leaving the building from sheltering where local guidance calls for it.
      Identify existing water, food, lighting, documents and essential-care arrangements without prescribing
      a universal stock quantity. Give each gap an owner; do not store identifying documents or medical
      details in the application.


      Observation checks: All six disruption types have a distinct response disposition; Assistance and
      essential-care dependencies are included; Leaving and sheltering are not treated as interchangeable;
      Supply and document gaps have named owners outside the app. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01
      action_stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01-A1
      competency_stable_id: '15.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1502_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1502_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_disruption_types_have_a_distinct_response_disposition
        - assistance_and_essential_care_dependencies_are_included
        - leaving_and_sheltering_are_not_treated_as_interchangeable
        - supply_and_document_gaps_have_named_owners_outside_the_app
      - measurement_id: c1502_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1502_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01-A2
    sequence: 2
    title: Run an announced tabletop with one unavailable dependency
    instructions: 'Tell everyone this is practice. Read the storm scenario and ask each willing participant
      to locate the plan and explain their first action. Make the ordinary phone-charging route unavailable
      on paper only. Check whether contacts and lighting can be found without searching a locked online
      account, and whether the absent person has an agreed check-in route. Walk an ordinary clear exit
      only if it is safe and accessible; do not turn off utilities, block exits, discharge equipment or
      trigger alarms.


      Observation checks: Participants know the exercise is not a real emergency; One dependency is removed
      only in the scenario; The plan and contact route are retrieved rather than merely described; No
      utility alarm exit or safety system is disturbed. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01
      action_stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01-A2
      competency_stable_id: '15.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1502_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1502_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - participants_know_the_exercise_is_not_a_real_emergency
        - one_dependency_is_removed_only_in_the_scenario
        - the_plan_and_contact_route_are_retrieved_rather_than_merely_described
        - no_utility_alarm_exit_or_safety_system_is_disturbed
      - measurement_id: c1502_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1502_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01-A3
    sequence: 3
    title: Repair and retest the most consequential failure
    instructions: 'Choose the gap that would most interfere with safe action, such as an unreadable contact
      card, unreachable flashlight or an assistance role with no backup. Make a proportionate correction
      using existing resources where possible, then repeat the failed retrieval or explanation. Record
      what now works and what still requires the landlord, care provider or emergency-management office.
      Agree a review trigger such as a move, new care dependency or changed household membership.


      Observation checks: A consequential observed gap is selected; A real correction is installed or
      an unresolved external dependency is retained; The failed part is tested again after the correction;
      A concrete change trigger prompts the next review. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What failed when a normal convenience was unavailable, and what evidence shows that
      the correction can be used under the same constraint?


      Examples: Supportive: The household could not retrieve its contacts without a phone, installed a
      private paper copy and successfully repeated the tabletop with the phone unavailable.


      Mixed: The exit and contacts were clear, but powered medical equipment still lacked a professionally
      agreed outage plan and remained an urgent unresolved dependency.


      Contradictory: The drill disabled electricity, blocked an exit or assumed an unwilling person would
      carry someone down stairs.


      Inconclusive: A supply checklist was saved online but nobody tried to locate or use the plan.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01
      action_stable_id: PRACTICE-COMP-1502-HOUSEHOLD-EMERGENCY-PLANNING-01-A3
      competency_stable_id: '15.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1502_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1502_a3_primary
