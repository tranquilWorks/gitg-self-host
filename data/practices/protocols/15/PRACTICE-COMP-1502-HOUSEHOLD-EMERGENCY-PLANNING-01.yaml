      - [Making an Emergency Plan](https://www.cdc.gov/disability-emergency-preparedness/people-with-disabilities/make-a-plan.html)

      - [Make a Plan](https://www.redcross.org/get-help/how-to-prepare-for-emergencies/make-a-plan.html)

      - [Causes and prevention: overview](https://www.hse.gov.uk/slips/preventing-overview.htm)

      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'These are supplied fictional results. Preserve your own actual practice-card result separately.


      Initial tabletop: Imani finds the lantern, but it does not light. Dev''s contact cannot be retrieved
      because it exists only in the unavailable phone. Imani can name the interior shelter room. The document
      folder is located but its needed contents are not checked. Jo is away and has never agreed to the
      assigned assistance role. No medical-equipment outage plan or accessible transport is confirmed.


      Repairs in the fictional record: Rae replaces the lantern''s cells using its ordinary instructions
      and Imani successfully switches it on. A readable private paper contact card is placed with the
      plan. Imani retrieves it during a second rehearsal with the phone still unavailable. No actual call
      is attempted, so network/contact success is not established. Jo''s assumed role is removed; a request
      for a suitable backup arrangement is pending.


      The care provider acknowledges receipt of a question about equipment continuity. It supplies no
      instructions, battery duration or confirmed arrangement yet. The plan therefore still has a consequential
      unresolved dependency. Acknowledgment must not become “care continuity secured.” In real circumstances,
      follow up with the provider and appropriate support according to urgency.


      No evacuation, supply-duration test, animal transport or medication continuity check occurred. These
      remain separate from the successful lantern and contact-card retests. Agree to review the plan when
      the provider responds and whenever care needs, residence or household contacts change.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### A plan must be findable when ordinary conveniences disappear


      An emergency plan joins people, information, supplies and assistance into a usable response. A shopping
      list alone cannot decide whether to leave or shelter, contact an absent person or keep essential
      care available. Plan for the household that actually exists, including changing capacity, pets,
      communication needs and helpers who may be unavailable.


      Allow 40 minutes for this fictional household tabletop, including a short retrieval retest. Use
      paper or an accessible local document. A tabletop means talking through decisions under stated assumptions.
      Everyone participating must know it is practice. Do not turn off power, block an exit, trigger an
      alarm, discharge equipment or create smoke. Local emergency instructions and individual care/building
      plans govern actual incidents.


      [CDC''s planning guidance](https://www.cdc.gov/disability-emergency-preparedness/people-with-disabilities/make-a-plan.html)
      emphasizes individual needs, communication, support and practice. [Red Cross planning guidance](https://www.redcross.org/get-help/how-to-prepare-for-emergencies/make-a-plan.html)
      distinguishes shelter and evacuation scenarios and includes household roles and separated members.
      Neither makes an unconfirmed helper or untested device arrangement reliable simply because it appears
      on a worksheet.


      ### Different hazards require different decisions


      Fire, power loss, severe weather, evacuation, urgent illness and service loss may overlap, but they
      are not interchangeable. A severe-weather instruction to shelter does not override a fire requiring
      safe escape. An outage may be inconvenient for one household and threaten essential care for another.
      The plan should identify the warning source, trigger, first response, assistance and contact/meeting
      route for each hazard.


      Worked example: all contact numbers are stored in a phone that cannot be charged. Saying “call the
      contact list” assumes the failed dependency away. A private accessible paper list may solve information
      retrieval, but still does not establish a working phone network. Test both what you can know and
      what you can actually do.


      ### Complete fictional household packet


      Rae and Imani live in a single-level home. Imani uses a mobility aid and prescribed powered equipment;
      its outage continuity must follow a care-provider plan. The equipment''s safe battery duration is
      **not supplied**. Rae is away until evening. Their cat has a carrier in the hall cupboard. Neighbor
      Jo has not agreed to provide assistance. An out-of-area contact, Dev, has agreed to receive check-ins,
      but Dev''s contact details exist only in the usual phone. Do not invent real contact details; use
      a paper “Dev — practice contact record” card.


      The following **invented local/building instructions** are supplied for case reasoning only:


      | Disruption | Case instruction / information |

      | --- | --- |

      | Fire | Use a safe clear exit under the building fire plan; meet at the designated front-tree point
      if safe; summon emergency help and do not re-enter. Both ordinary doors are level, but current availability
      must be checked. |

      | Power loss | Use the battery lantern; preserve communication; follow the equipment provider''s
      outage plan. That care plan is currently missing from the household packet. |

      | Evacuation order | The verified local alert identifies the community center as destination; use
      confirmed accessible transport. No transport booking or helper acceptance is supplied. |

      | Severe-weather shelter alert | For this case, the official alert directs shelter in the interior
      room away from windows; do not substitute the evacuation destination unless instructions change.
      |

      | Medical emergency | Use the local emergency route and provide the household''s actual location/access
      and observed condition; follow dispatcher guidance. The exercise uses only placeholders. |

      | Water/shops unavailable | Consult the relevant official service notice; inspect stored water/food
      and household-specific needs, record gaps and a verified assistance route. No universal quantity
      is stipulated. |


      Existing inventory: lantern on an accessible shelf, battery condition unknown; food for some ordinary
      meals, household suitability/duration not checked; water containers present, volume/current usability
      not checked; documents in a private folder known to Rae, retrieval by Imani not tested; cat carrier
      found but not practiced; medication list private and care continuity not yet agreed. “Present” is
      not “adequate,” and unknown quantities are not zero or sufficient by default.


      #### Action 1 — Build six response rows


      For every disruption record `trigger/source | first response | person/animal needs | contact/meeting
      route | gap owner`. Use the supplied instructions and mark the unresolved care plan, transport and
      helper consent explicitly. Keep sensitive documents and medical detail out of the learning record;
      generic locations and statuses suffice.


      Assign a responsible household decision-maker for each gap without assuming that assigning Jo a
      role creates Jo''s consent. Prioritize the powered-equipment plan as an external dependency requiring
      the care provider, not something solved by guessing battery hours or borrowing an unspecified generator.
      A real person whose essential care is threatened should seek appropriate help promptly rather than
      continue the drill.


      #### Action 2 — Run the announced outage tabletop


      Say “this is practice.” On paper, make the usual charging route unavailable while Rae is away. Retrieve
      your actual practice plan and Dev placeholder card without opening the normal online record. Explain
      Imani''s first response, how Rae and Dev would be contacted, and what happens if communications
      also fail. A card can establish retrievable information; successful contact remains untested.


      If alone, speak both decision roles and label them as self-rehearsal, not participation by Rae or
      Imani. Do not move or test a real person''s care equipment. Do not walk an exit if conditions are
      unsafe; an ordinary safe access check is optional and separate from an emergency evacuation.


      Save what you could actually retrieve and what remained unknown, then open [the later packet](?resource=file-later-packet-md)
      for the fictional household''s outcomes. Those supplied outcomes are not your own drill evidence.


      #### Action 3 — Correct and repeat one failed part


      Choose a safe, proportionate repair you can actually make in the practice materials: put the contact
      card with the plan, use readable print, or add a second accessible location. Put the normal source
      away again and repeat the same retrieval. Record first failure, correction and retest result. Merely
      planning the repair is not installing it.


      Separately list unresolved external actions: obtaining the care-provider continuity plan, confirming
      accessible transport and obtaining consent from a backup helper. Keep the gap open until a relevant
      confirmation or test exists. A lantern repair does not close medical continuity.


      Complete [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). Your
      finished artifact is a six-hazard plan, an actual harmless retrieval result and an honest list of
      external dependencies. Set a review trigger such as a move, changed care need, changed contact or
      new household member.


      ### Adapt and transfer


      Use large print, symbols, audio available offline or a consented helper. A person living alone can
      use agreed contacts and verified building assistance; living alone does not imply someone nearby
      has agreed to carry or transport them. Plan pets and service animals with the appropriate destination
      rules rather than assuming every site accommodates them.


      Harder route: Rae, Jo and mobile service are all unavailable. Identify which routes remain known
      and which require official/building/care-provider arrangements. Do not turn missing capacity into
      a dramatic improvisation.


      For real transfer, obtain your locality''s current hazard guidance and household-specific plans,
      then announce a small safe tabletop. Test one ordinary retrieval or explanation, fix a discovered
      gap and repeat it. Do not interpret a successful card retrieval as a full evacuation, adequate supply
      reserve or demonstrated clinical continuity.


      **Supportive:** A real safe repair passes the same retrieval constraint while care gaps remain visible.
      **Mixed:** Contacts and lighting work but transport or essential-care arrangements remain unresolved.
      **Contradictory:** A drill disables equipment or assumes unwilling physical assistance. **Inconclusive:**
      A plan is saved but never retrieved or used.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A paper contact card is retrieved during an outage rehearsal, but no call is made. What
      succeeded and what remains untested?

      2. A provider acknowledges a request about powered medical equipment; a neighbor has been named
      as backup without consent. May the care and assistance gaps be closed?

      3. A household''s severe-weather plan says shelter indoors. A separate fire alarm occurs. Should
      the shelter instruction automatically govern? What sources and constraints should determine the
      response?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Information retrieval under the stated constraint succeeded. Network availability, reaching
      the person and agreed assistance were not tested by that retrieval. Keep those as separate statuses
      rather than calling the whole communication plan proved.

      2. No. Receipt of a question is not an agreed care plan, and assignment is not helper consent. Obtain
      the relevant provider arrangement and a willing, suitable support route. Do not guess battery duration
      or improvise a physical transfer to make the plan appear complete.

      3. No. Hazard-specific instructions must be reconciled with the actual immediate danger, building
      fire plan and emergency guidance. A shelter instruction for one weather scenario does not authorize
      remaining in fire danger. Follow the actual safe response and seek emergency help as needed; never
      create either hazard for rehearsal.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
