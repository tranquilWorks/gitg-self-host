  - c1502_a3_adverse
  adverse_or_contradictory_indicators:
  - The drill disabled electricity, blocked an exit or assumed an unwilling person would carry someone
    down stairs.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Household emergency planning explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Household emergency planning context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Household emergency planning observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Household emergency planning rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Assign a safe route for six disruption types. Observed checks: All six
    disruption types have a distinct response disposition; Assistance and essential-care dependencies
    are included; Leaving and sheltering are not treated as interchangeable; Supply and document gaps
    have named owners outside the app. Action 2: Run an announced tabletop with one unavailable dependency.
    Observed checks: Participants know the exercise is not a real emergency; One dependency is removed
    only in the scenario; The plan and contact route are retrieved rather than merely described; No utility
    alarm exit or safety system is disturbed. Action 3: Repair and retest the most consequential failure.
    Observed checks: A consequential observed gap is selected; A real correction is installed or an unresolved
    external dependency is retained; The failed part is tested again after the correction; A concrete
    change trigger prompts the next review.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A supply checklist was saved online but nobody tried
    to locate or use the plan.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Household
    emergency planning contribution under typed evaluation; protocol performance remains distinct and
    is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
