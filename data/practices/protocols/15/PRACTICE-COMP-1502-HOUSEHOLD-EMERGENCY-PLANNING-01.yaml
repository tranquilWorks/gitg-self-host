  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Household emergency planning; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - A person living alone can use an agreed contact and verified building assistance plan; do not assume
      a neighbor has consented to help. Use accessible print, audio, symbols and duplicate paper copies.
      Required medical-device continuity and evacuation assistance need the relevant professional or building
      plan, not improvised workarounds.
    cultural_context:
    - Adapt the expression of Household emergency planning to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - A person living alone can use an agreed contact and verified building assistance plan; do not assume
      a neighbor has consented to help. Use accessible print, audio, symbols and duplicate paper copies.
      Required medical-device continuity and evacuation assistance need the relevant professional or building
      plan, not improvised workarounds.
  pause_conditions:
  - Pause Household emergency planning when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Household emergency planning practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Household emergency planning situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
evidence_and_scoring:
  accepted_evidence_types:
