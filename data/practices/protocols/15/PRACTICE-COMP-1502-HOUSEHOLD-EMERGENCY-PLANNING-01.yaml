        - reviewed_artifact
        criteria:
        - a_consequential_observed_gap_is_selected
        - a_real_correction_is_installed_or_an_unresolved_external_dependency_is_retained
        - the_failed_part_is_tested_again_after_the_correction
        - a_concrete_change_trigger_prompts_the_next_review
      - measurement_id: c1502_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1502_a3_adverse
        kind: boolean
