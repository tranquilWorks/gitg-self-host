        expected: true
  - stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01-A2
    sequence: 2
    title: Route three fictional compromise signals to distinct actions
    instructions: 'For an unsolicited login alert, an unfamiliar posted payment and a message asking for
      a one-time code, state what you would verify through the provider or financial institution’s official
      channel. Separate checking account activity from replying to the sender. Include a prompt reporting
      route for actual unauthorized activity and an identity-theft assistance route appropriate to your
      location. Do not assume every alert is genuine or that deleting the message resolves an actual compromise.


      Observation checks: Three different signals receive distinct verification and response routes; No
      code or credential would be sent to the message sender; Actual unauthorized activity prompts timely
      official contact; Local reporting and identity-help routes are verified rather than guessed. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01
      action_stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01-A2
      competency_stable_id: '15.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1509_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1509_a2_primary
        kind: artifact
        role: primary
        weight: '1'
