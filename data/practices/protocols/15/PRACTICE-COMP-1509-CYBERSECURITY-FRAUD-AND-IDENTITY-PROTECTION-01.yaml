  - id: file-later-packet-md
    title: Later packet
    body: 'Independent Cedar Mail access confirms an unfamiliar session and forwarding rule. Following
      its official process in this fictional case, the learner changes the password, removes the unknown
      rule and revokes the listed unfamiliar session. The recovery contact is verified. These are concrete
      account actions, not proof that every device or other account is safe.


      The bank issues a dispute acknowledgment for 46 units but makes no reimbursement decision. Record
      “reported; 46-unit payment still unresolved,” not “46 recovered.” The caller received no code. M4''s
      document exposure remains real within the fictional case, while later identity misuse is unknown;
      use the appropriate identity-recovery route without inventing a new credit account.


      IT acknowledges M5 and asks the worker to follow its instructions. Acknowledgment is not an investigation
      outcome, and personal-account access does not authorize work-account changes.


      Supportive: provider-confirmed account actions. Mixed: personal access restored but financial/identity
      questions open. Contradictory: a global “all resolved” label. Inconclusive: no information about
      other sessions or device compromise beyond the supplied record.


      These are simulated outcomes. Keep any actual practice-only security change separate and never save
      a real password, recovery code, full identity document or financial record as exercise evidence.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Triage a suspected compromise without confusing recovery stages


      Start with the fictional account packet below. In about thirty minutes you will build a short incident
      record that separates warning signals, verified facts, containment actions and unresolved recovery.
      No credentials, real transactions or suspicious links are needed. The optional live step uses only
      an account you own or are authorized to manage; an actual incident requires prompt provider or organizational
      response rather than waiting to finish practice.


      ### An alert is a lead, not the whole incident


      Phishing and social engineering try to make a requested action feel necessary: follow a link, reveal
      a code, approve access or move money. A convincing alert can be forged; a genuine alert can also
      reveal a genuine problem. Open the provider through an independently known app or address and check
      there. Do not use the suspicious message''s phone number to verify the same message.


      Email often supports password recovery for other accounts, so an attacker with email access may
      affect more than the inbox. A changed password may not address every active session, recovery setting
      or forwarding rule. Follow the provider''s own recovery process, verify contact methods and inspect
      security settings; if unauthorized messages were sent, warn affected contacts through an appropriate
      trusted route without spreading the malicious link or private incident details. Organizational accounts
      belong with the authorized IT/security route. The FTC''s recovery guide describes these account
      checks. See S09 in [SOURCES](?resource=sources). Do not improvise destructive resets or investigate
      systems beyond your authority.


      Separate prevention, containment and recovery. A strong unique password or supported passkey, appropriate
      multifactor authentication, protected recovery options and supported software updates can reduce
      exposure. NCSC guidance supports strong separate credentials, appropriate second factors and supported
      passkeys (S21). No single setting makes an account invulnerable. Keep a viable recovery path while
      making changes; record the type of change, never the secret. A recovery code shared with a caller
      is exposed information even if the caller uses your name correctly. A security setting changed successfully
      is a narrower result than proving nobody retained access.


      Financial fraud and identity misuse need additional routes. A posted unauthorized payment needs
      prompt contact with the relevant institution through an independently verified channel, even if
      the email account is now secure. A dispute receipt is not a refund. Suspected misuse of identity
      details may require a local identity-theft recovery process. FTC guidance illustrates U.S. reporting
      and recovery routes, including IdentityTheft.gov; other jurisdictions differ. See S10–S11. Do not
      promise reversal, deadlines or legal remedies from this exercise.


      ### Worked example


      Alex changes an email password, then writes “incident resolved.” Their case still lists an unfamiliar
      recovery address and an unauthorized payment. Alex revises the status: password change complete;
      recovery address requires provider-guided checking; bank dispute requested; reimbursement unknown.
      This does not mean the password change was useless. It prevents a successful action from hiding
      unresolved parts of the incident.


      ### Original fictional account packet


      You own the invented personal account “Cedar Mail.” Your usual device is available and believed
      trustworthy; no malware finding is supplied. There are no real URLs or passwords to use.


      | Signal | Information available before verification |

      | --- | --- |

      | M1 | Email says “new device login; click here to undo”; message authenticity unknown |

      | M2 | Independently opened bank app shows a posted 46-unit payment you do not recognize |

      | M3 | Caller claiming to be support asks for a one-time recovery code; you have not shared it |

      | M4 | A copy of an identity document was previously sent to an unverified rental contact; later
      use is unknown |

      | M5 | A work account sends a separate alert; employer policy requires contacting IT, not changing
      its configuration yourself |


      The fictional Cedar Mail help card, independently obtained for this exercise, says: use its official
      recovery route if unable to sign in; once access is verified, follow its instructions for password,
      sessions, recovery contacts and forwarding rules; check for unauthorized messages and protect recovery
      access. It supplies no guarantee about device cleanliness or other services. Your incident log has
      four columns: observation/source, scoped action/owner, result actually confirmed, unresolved next
      check.


      ### Work the incident in stages


      1. For M1, identify the independent verification route. For M2–M5, assign the appropriate owner
      or institution and a concrete next action. Do not wait for M1 to become certain before reporting
      the posted payment or work alert.

      2. Distinguish code requested from code disclosed. Decline M3''s request and use the independent
      provider route if account help is needed. Do not classify the account as compromised solely because
      a caller asked; do not call the request harmless either.

      3. Build a sequence for the personal email account using the supplied help card. Explain why working
      recovery access matters and which settings need checking after a password change. If the device
      is suspected compromised in a real incident, seek the provider/IT''s appropriate trusted-device
      guidance; the packet does not establish a malware diagnosis.

      4. Write the minimal information each recipient needs. Bank support needs the disputed transaction
      through its secure process; IT needs the work alert through its incident route. A public post does
      not need your identity document, recovery code or account number. Save only fictional labels in
      this exercise.

      5. Choose one prevention improvement. In the fictional route, describe adding a supported second
      factor while preserving working recovery access. In an optional owned-account route, independently
      open official help and make one low-risk supported change only if you understand its recovery implications.
      Do not force a lockout, remove the sole recovery method or upload secrets as proof.

      6. Preserve the first incident log, then open the [later packet](?resource=file-later-packet-md).
      Update each row separately. Write a closeout statement naming what is contained, what remains unresolved
      and who owns the next step.


      ### Evidence and follow-through


      The default output is a five-signal triage log and a recovery sequence. A live setting change counts
      only if actually performed and confirmed; a hypothetical change remains a plan. Reported compromise,
      regained sign-in, removed forwarding, revoked sessions, investigated payment and restored funds
      are separate statuses. An unavailable provider response is unknown, not automatic resolution or
      automatic proof of continuing attack.


      For a smaller task, do M1–M3 first, then add identity and work boundaries. Use text or dictation,
      hiding no recovery limitations. A trusted helper can navigate accessibility barriers without being
      given your password or codes. If coercive monitoring or abuse is relevant, account changes can alert
      another person; use an appropriate specialist safety route rather than applying this generic practice
      blindly.


      For a harder paper case, make the usual device unavailable and remove the only recovery method.
      The sound answer is official recovery assistance with uncertainty, not inventing a bypass. For real
      transfer, maintain an accessible private list of independent provider and institution routes and
      review one owned account''s supported security and recovery settings. Finish the [fresh checks](?attempt=practice-checks)
      before the [key](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. After a password change, an unknown forwarding rule remains. A learner says the successful
      password screen closes the incident. What needs correction?

      2. A bank acknowledges a dispute for 80 units and later refunds 30. What amount remains unresolved,
      and what does the acknowledgment establish?

      3. A work alert arrives during this exercise. You own the laptop but not the organizational account.
      What is the appropriate authority boundary?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The password change is complete, but the forwarding issue needs provider-guided resolution
      and other relevant security checks. Do not claim full recovery from one successful screen. Use a
      trusted independent route and preserve working recovery access.

      2. 50 units remain unresolved under the stated facts. The receipt establishes reporting, while the
      30-unit refund establishes only that amount recovered. Neither guarantees the balance will return.

      3. Follow the organization''s incident reporting and IT instructions promptly. Ownership of the
      device does not authorize changing organizational settings or conducting an investigation. Record
      reporting separately from resolution, without exposing sensitive alert details publicly.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
