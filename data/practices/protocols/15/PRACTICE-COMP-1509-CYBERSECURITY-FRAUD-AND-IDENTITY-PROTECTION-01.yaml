        - actual_unauthorized_activity_prompts_timely_official_contact
        - local_reporting_and_identity_help_routes_are_verified_rather_than_guessed
      - measurement_id: c1509_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1509_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01-A3
    sequence: 3
    title: Make one supported improvement and retest ordinary access
    instructions: 'Choose one low-risk improvement the provider explicitly supports, such as enabling
      a usable additional sign-in factor or updating a stale recovery contact. Follow current official
      instructions, preserve the working session and verify that the intended sign-in and recovery information
      remain usable without exposing secrets. If the change is high-consequence or uncertain, obtain provider
      support instead. Record the completed action or unresolved barrier; the fictional incident itself
      is not reported to authorities as real.


      Observation checks: The improvement follows current official provider instructions; Ordinary access
      is checked after the change; Uncertain high-consequence changes are referred rather than improvised;
      A fictional event is never submitted as a real fraud report. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Could you verify and report a real problem without using the suspicious message, and
      did your protective change preserve recoverable access?


      Examples: Supportive: The participant independently checked the account, rehearsed the financial-institution
      contact route and enabled a usable second factor without losing the existing session.


      Mixed: Protection improved, but the recovery route still depended on an obsolete phone and remained
      an unresolved risk.


      Contradictory: The person shared a one-time code, uploaded credentials to the notes or tested security
      on someone else’s account.


      Inconclusive: A suspicious email was deleted without checking whether actual account activity required
      a response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
