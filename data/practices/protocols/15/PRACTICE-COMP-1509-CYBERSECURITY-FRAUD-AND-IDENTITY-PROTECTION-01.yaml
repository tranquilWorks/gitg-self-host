meaning_and_fit:
  purpose: Combine account protection with a trustworthy response path when a message, login alert or
    transaction may indicate fraud or identity misuse.
  why_recommended: Combine account protection with a trustworthy response path when a message, login alert
    or transaction may indicate fraud or identity misuse.
  claims:
  - statement: Combine account protection with a trustworthy response path when a message, login alert
      or transaction may indicate fraud or identity misuse.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cybersecurity, fraud, and identity protection practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cybersecurity, fraud, and identity protection as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible authenticator or provider-supported recovery method, and
    involve a trusted helper only with limited explicit permission. For work accounts, use the organization’s
    incident channel and do not alter controls outside your authority. A real fraud event should not wait
    for completion of this practice.
  opportunity_considerations: 'Choose a low-stakes personal account with an available official recovery
    route. Fictional alert: an email says a new device signed in and urges you to use its link immediately.
    Keep passwords, one-time codes, recovery codes, account numbers and identifying documents entirely
    out of the exercise notes and application.'
  prerequisites:
  - 'Choose a low-stakes personal account with an available official recovery route. Fictional alert:
    an email says a new device signed in and urges you to use its link immediately. Keep passwords, one-time
    codes, recovery codes, account numbers and identifying documents entirely out of the exercise notes
    and application.'
  dependencies: []
  safe_alternatives:
  - Use an accessible authenticator or provider-supported recovery method, and involve a trusted helper
    only with limited explicit permission. For work accounts, use the organization’s incident channel
    and do not alter controls outside your authority. A real fraud event should not wait for completion
    of this practice.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cybersecurity, fraud, and identity protection differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cybersecurity, fraud, and
    identity protection as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a low-stakes personal account with an available official recovery route. Fictional alert:
    an email says a new device signed in and urges you to use its link immediately. Keep passwords, one-time
    codes, recovery codes, account numbers and identifying documents entirely out of the exercise notes
    and application. Goal: Combine account protection with a trustworthy response path when a message,
    login alert or transaction may indicate fraud or identity misuse. Scope: Use only accounts you own
    or are explicitly authorized to manage. This is not penetration testing, malware analysis, financial
    recovery advice or proof that an account is uncompromised. Time and effort: Twenty minutes to map
    one account, fifteen minutes for a fictional alert rehearsal and one safe provider-guided security
    correction. Adaptation: Use an accessible authenticator or provider-supported recovery method, and
    involve a trusted helper only with limited explicit permission. For work accounts, use the organization’s
    incident channel and do not alter controls outside your authority. A real fraud event should not wait
    for completion of this practice. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible authenticator or provider-supported recovery method, and involve
    a trusted helper only with limited explicit permission. For work accounts, use the organization’s
    incident channel and do not alter controls outside your authority. A real fraud event should not wait
    for completion of this practice.
  expected_burden: Twenty minutes to map one account, fifteen minutes for a fictional alert rehearsal
    and one safe provider-guided security correction.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cybersecurity, fraud, and identity protection protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Cybersecurity, fraud, and identity protection action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    authenticator or provider-supported recovery method, and involve a trusted helper only with limited
    explicit permission. For work accounts, use the organization’s incident channel and do not alter controls
    outside your authority. A real fraud event should not wait for completion of this practice.
  actions:
  - stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01-A1
    sequence: 1
    title: Check protection and recovery before changing access
    instructions: 'Open the provider through its known official app or address, not the alert. Check whether
      the account uses a unique password or appropriate passkey, available multifactor protection, current
      recovery information and supported software. Note statuses only. Confirm that you can still access
      a trusted session and know the official support route before making changes; do not log out every
      device, remove an authenticator or reset recovery material merely to create a test.


      Observation checks: The provider is reached independently of the suspicious message; Authentication
      recovery and software status are reviewed; Only nonsecret status information is recorded; A working
      access route is preserved before changes. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01
      action_stable_id: PRACTICE-COMP-1509-CYBERSECURITY-FRAUD-AND-IDENTITY-PROTECTION-01-A1
      competency_stable_id: '15.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1509_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1509_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_provider_is_reached_independently_of_the_suspicious_message
        - authentication_recovery_and_software_status_are_reviewed
        - only_nonsecret_status_information_is_recorded
        - a_working_access_route_is_preserved_before_changes
      - measurement_id: c1509_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1509_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
