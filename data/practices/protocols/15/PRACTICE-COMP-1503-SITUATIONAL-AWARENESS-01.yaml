meaning_and_fit:
  purpose: Orient to exits, movement, access and changing conditions without treating unfamiliar people
    or every anomaly as a threat.
  why_recommended: Orient to exits, movement, access and changing conditions without treating unfamiliar
    people or every anomaly as a threat.
  claims:
  - statement: Orient to exits, movement, access and changing conditions without treating unfamiliar people
      or every anomaly as a threat.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Situational awareness practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Situational awareness as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a companion, building accessibility information, audio directions or a
    quieter familiar setting. A person affected by hypervigilance may prefer a single planned orientation
    rather than repeated scans; stop when the exercise increases distress or interferes with ordinary
    functioning.
  opportunity_considerations: Choose a familiar library, workplace common area or other place you already
    use safely. Before entering, plan to notice the normal entrance, another signed exit, staff or assistance
    point, accessibility route and one environmental condition such as crowding or a wet floor. Do not
    record identifiable people.
  prerequisites:
  - Choose a familiar library, workplace common area or other place you already use safely. Before entering,
    plan to notice the normal entrance, another signed exit, staff or assistance point, accessibility
    route and one environmental condition such as crowding or a wet floor. Do not record identifiable
    people.
  dependencies: []
  safe_alternatives:
  - Use a companion, building accessibility information, audio directions or a quieter familiar setting.
    A person affected by hypervigilance may prefer a single planned orientation rather than repeated scans;
    stop when the exercise increases distress or interferes with ordinary functioning.
  role_conditions:
  - This competency is context contingent; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Situational awareness differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Situational awareness as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a familiar library, workplace common area or other place you already use safely. Before
    entering, plan to notice the normal entrance, another signed exit, staff or assistance point, accessibility
    route and one environmental condition such as crowding or a wet floor. Do not record identifiable
    people. Goal: Orient to exits, movement, access and changing conditions without treating unfamiliar
    people or every anomaly as a threat. Scope: This practices ordinary awareness in a familiar public
    place. It is not surveillance, profiling, threat prediction or a requirement to remain constantly
    vigilant. Time and effort: Two five-minute observations during normal visits and a ten-minute comparison
    afterward. Adaptation: Use a companion, building accessibility information, audio directions or a
    quieter familiar setting. A person affected by hypervigilance may prefer a single planned orientation
    rather than repeated scans; stop when the exercise increases distress or interferes with ordinary
    functioning. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a companion, building accessibility information, audio directions or a quieter
    familiar setting. A person affected by hypervigilance may prefer a single planned orientation rather
    than repeated scans; stop when the exercise increases distress or interferes with ordinary functioning.
  expected_burden: Two five-minute observations during normal visits and a ten-minute comparison afterward.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Situational awareness protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Situational awareness action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a companion,
    building accessibility information, audio directions or a quieter familiar setting. A person affected
    by hypervigilance may prefer a single planned orientation rather than repeated scans; stop when the
    exercise increases distress or interferes with ordinary functioning.
  actions:
  - stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01-A1
    sequence: 1
    title: Orient using functional landmarks rather than suspicious-person guesses
    instructions: 'During an ordinary visit, identify how you entered, how staff direct people to leave,
      where help can be requested and any accessible route you depend on. Note one ordinary condition
      affecting movement, such as a queue narrowing a passage. Separate observed facts from interpretations:
      a person looking around is not evidence of harmful intent. End the scan and return attention to
      your actual activity instead of repeatedly checking everyone.


      Observation checks: Entry exit help and access landmarks are identified; One movement or environmental
      condition is directly observed; Appearance or identity is not used as a threat category; Attention
      returns to the intended ordinary activity. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01-A1
      competency_stable_id: '15.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1503_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1503_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - entry_exit_help_and_access_landmarks_are_identified
        - one_movement_or_environmental_condition_is_directly_observed
        - appearance_or_identity_is_not_used_as_a_threat_category
        - attention_returns_to_the_intended_ordinary_activity
      - measurement_id: c1503_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1503_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01-A2
    sequence: 2
    title: Compare a second visit for one meaningful change
    instructions: 'At the next normal visit, compare the same landmarks and conditions. The supplied change
      case is a temporary sign directing visitors away from a closed corridor. Confirm the alternative
      route through posted information or staff rather than entering the closed area. If nothing changes,
      record that honestly. Name what would warrant asking staff, leaving or using emergency help, and
      distinguish those thresholds from mere unfamiliarity or discomfort.


      Observation checks: The second observation uses the same functional reference points; A change or
      its absence is recorded without invention; Unclear directions are checked through an appropriate
      source; Response thresholds depend on conditions rather than stereotypes. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01-A2
      competency_stable_id: '15.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1503_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1503_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_second_observation_uses_the_same_functional_reference_points
        - a_change_or_its_absence_is_recorded_without_invention
        - unclear_directions_are_checked_through_an_appropriate_source
        - response_thresholds_depend_on_conditions_rather_than_stereotypes
      - measurement_id: c1503_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1503_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01-A3
    sequence: 3
    title: Take one small action and check whether it solved the actual problem
    instructions: 'When a real minor access issue exists, use the posted alternative, ask staff for assistance
      or choose another ordinary location. For the closed-corridor case, verify that the alternate path
      actually reaches the destination and remains suitable for your access needs. Record the action and
      its result without photographing strangers or investigating motives. If the environment becomes
      genuinely unsafe, leave or obtain appropriate help rather than turning the event into a training
      opportunity.


      Observation checks: The action addresses the observed access or environmental condition; The route
      or assistance is checked for practical usability; No person is monitored or confronted to test a
      hypothesis; A real safety concern ends the exercise rather than escalating it. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which observation changed what you did, and which initial interpretation turned out
      to be unnecessary or unsupported?


      Examples: Supportive: A visitor noticed a corridor closure, confirmed an accessible alternative
      with staff and then resumed the visit without monitoring other visitors.


      Mixed: The route was found, but repeated scanning distracted from the visit and the next attempt
      was reduced to one orientation.


      Contradictory: A person followed or photographed strangers based on appearance and called that situational
      awareness.


      Inconclusive: Threat scenarios were imagined at home without observing a real environment or checking
      a functional route.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-1503-SITUATIONAL-AWARENESS-01-A3
      competency_stable_id: '15.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1503_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1503_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_action_addresses_the_observed_access_or_environmental_condition
        - the_route_or_assistance_is_checked_for_practical_usability
        - no_person_is_monitored_or_confronted_to_test_a_hypothesis
        - a_real_safety_concern_ends_the_exercise_rather_than_escalating_it
      - measurement_id: c1503_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1503_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Situational awareness; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use a companion, building accessibility information, audio directions or a quieter familiar setting.
      A person affected by hypervigilance may prefer a single planned orientation rather than repeated
      scans; stop when the exercise increases distress or interferes with ordinary functioning.
    cultural_context:
    - Adapt the expression of Situational awareness to direct or indirect communication, collective or
      individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a companion, building accessibility information, audio directions or a quieter familiar setting.
      A person affected by hypervigilance may prefer a single planned orientation rather than repeated
      scans; stop when the exercise increases distress or interferes with ordinary functioning.
  pause_conditions:
  - Pause Situational awareness when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Situational awareness practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Situational awareness situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Hands-on safety, medical, aquatic, survival, and defensive skills require qualified instruction and
    compliance with local law.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Situational awareness actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1503_a1_primary
  - c1503_a1_boundary
  - c1503_a1_adverse
  - c1503_a2_primary
  - c1503_a2_boundary
  - c1503_a2_adverse
  - c1503_a3_primary
  - c1503_a3_boundary
  - c1503_a3_adverse
  adverse_or_contradictory_indicators:
  - A person followed or photographed strangers based on appearance and called that situational awareness.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Situational awareness explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Situational awareness context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Situational awareness observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Situational awareness rules withhold observations older than 90 days; no unrecorded
    retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Orient using functional landmarks rather than suspicious-person guesses.
    Observed checks: Entry exit help and access landmarks are identified; One movement or environmental
    condition is directly observed; Appearance or identity is not used as a threat category; Attention
    returns to the intended ordinary activity. Action 2: Compare a second visit for one meaningful change.
    Observed checks: The second observation uses the same functional reference points; A change or its
    absence is recorded without invention; Unclear directions are checked through an appropriate source;
    Response thresholds depend on conditions rather than stereotypes. Action 3: Take one small action
    and check whether it solved the actual problem. Observed checks: The action addresses the observed
    access or environmental condition; The route or assistance is checked for practical usability; No
    person is monitored or confronted to test a hypothesis; A real safety concern ends the exercise rather
    than escalating it.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Threat scenarios were imagined at home without observing
    a real environment or checking a functional route.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Situational
    awareness contribution under typed evaluation; protocol performance remains distinct and is never
    counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L08
  - L20
  - L24
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Situational awareness evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
