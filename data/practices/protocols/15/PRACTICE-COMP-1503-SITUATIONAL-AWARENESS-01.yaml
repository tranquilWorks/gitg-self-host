  - id: file-later-packet-md
    title: Later packet
    body: '**Branch A:** Staff confirm the garden corridor is open today and level from the lobby to the
      reading room. In the supplied fictional outcome, Nia uses it, reaches the room and collects the
      book. Nia then reads for ten minutes without further checking of visitors. The garden route worked
      in this scenario. North-exit emergency suitability still has no confirmation; success on an ordinary
      route does not settle it.


      **Branch B, replacing A:** Staff cannot confirm whether the garden corridor is open. The west route
      still has six steps and the east route is still closed. Staff offer to bring the reserved book to
      the lobby desk, which is reachable by the level south entrance. Nia accepts and receives the book.
      The visit''s collection goal succeeds; an accessible path to the reading room remains unresolved.
      Do not record garden traversal.


      **Branch C, replacing A/B:** No conditions change between two ordinary visits. Nia records “no relevant
      change observed” and resumes reading. That is an honest outcome, not evidence that vigilance failed.
      If no actual second observation occurred, record it as absent instead; absence of an observation
      is not an observation of no change.


      In every branch, unfamiliar visitors supply no threat evidence merely by being unfamiliar. None
      of the supplied outcomes demonstrates that you visited a real site or that its exits are safe. For
      real conditions, use current building guidance and appropriate help.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Notice what changes a useful action


      Situational awareness means noticing relevant conditions, understanding their practical implications
      and updating when they change. It does not require constant scanning, predicting a stranger''s motives
      or turning an ordinary visit into surveillance. A short orientation that helps you move, find assistance
      and return to your purpose is more useful here than an elaborate story about hidden threats.


      Allow 25 minutes for the fictional library route exercise. Use the written layout below and an accessible
      editor or paper. No public visit, photograph, following of people or confrontation is required.
      The optional real route uses a place you already visit safely and ends if it increases distress
      or interferes with ordinary functioning.


      ### Observation, interpretation and response


      “A queue extends into the passage” describes an observable condition. “The people in the queue are
      dangerous” adds an unsupported interpretation. You can ask staff for a clear route without deciding
      why anyone is there. Appearance, language, disability or unfamiliarity is not a threat category.
      Relevant behavior and environmental conditions should carry the decision.


      [HSE''s slips-and-trips overview](https://www.hse.gov.uk/slips/preventing-overview.htm) discusses
      obstructions, walkway suitability, lighting and maintenance. That supports noticing concrete movement
      hazards; it does not validate this exercise as a violence-prediction method. Emergency exits and
      responses in a real building depend on its actual signs, staff instructions and emergency plan.


      Worked example: you notice a wet patch near the usual door and a staff member directing people to
      another entrance. The useful response is to avoid the wet area, confirm an appropriate alternative
      if needed, and report the hazard to staff if they are unaware. Investigating who spilled it adds
      little to getting safely to your destination. An alternate route must also fit your access needs;
      “there is another door” does not settle that.


      ### Complete fictional layout


      Nia visits Alder Reading Center to collect a reserved book. Nia needs a level route without stairs.
      All route information below is invented and complete for the initial case; it is not an actual building
      safety assessment.


      | Landmark / route | Initial visit facts |

      | --- | --- |

      | South entrance | Level entrance from the public pavement to the lobby |

      | Help desk | Staffed point in the lobby, visible from the entrance |

      | East corridor | Level connection from lobby to reading room; usual route |

      | West corridor | Connection from lobby to reading room with six steps; no level bypass on this
      corridor |

      | Garden corridor | Another connection from lobby to reading room; level status and current opening
      are not yet known |

      | Signed south exit | Leads from lobby to the pavement |

      | Signed north exit | Leads from reading room to outside; its suitability for Nia''s emergency access
      needs is not yet verified |

      | Ordinary condition | A short queue near the desk leaves the east corridor clear |

      | People | One visitor looks around at signs; no threatening action or blocked route is observed
      |


      No timer determines whether Nia is “aware enough.” The route goal is to reach the reading room through
      a confirmed suitable path, find a help point and then collect the book. An emergency-route question
      should be checked with staff; it must not be resolved by trying doors or entering restricted areas.


      #### Action 1 — Orient once and separate facts


      Write a compact orientation: entrance, usual path, help point, signed exits and one relevant condition.
      Mark north-exit suitability and garden-route status unknown. Record the visitor''s observed behavior
      separately from any interpretation; there is no evidence here for treating the person as a threat.


      Choose the initial ordinary route using the supplied facts. East is confirmed level and open. West
      has steps and does not meet Nia''s requirement. Garden is unknown. Then explicitly return attention
      to the purpose: collecting the book. You are not required to watch people throughout the visit.


      #### Action 2 — Compare the changed condition


      At the second fictional visit, a posted sign says, “East corridor closed for maintenance. Use west
      corridor.” No other route detail has yet been confirmed. The desk remains staffed. The west route''s
      steps remain unchanged. A second visitor is unfamiliar to Nia but does nothing that blocks access
      or threatens anyone.


      Write what changed and what did not. The sign provides a general diversion, but it does not remove
      the steps or establish suitability. Ask the desk: “I need a level route to the reading room. The
      east corridor is closed; is the garden route open and level today, or is there another way to collect
      my book?” Do not enter the closed corridor to check whether the warning really applies.


      Set proportionate response thresholds: a minor access ambiguity prompts a staff question; no suitable
      route prompts another service option or leaving the visit; an actual immediate hazard ends the exercise
      and calls for the building''s emergency response or local help as appropriate. Discomfort can justify
      choosing another place without requiring an accusation about a stranger.


      #### Action 3 — Check whether the chosen response works


      Save your question and route decision before opening [the later packet](?resource=file-later-packet-md).
      Use each branch separately. A staff suggestion is evidence about a possible route; the packet''s
      supplied traversal outcome establishes whether it worked for Nia in that fictional event. Keep your
      own actual performance separate from the supplied story.


      Record `observed change | question/action | confirmed outcome | unknowns | return to ordinary activity`.
      If the route fails or the person cannot continue comfortably, revise the plan rather than declaring
      success because a direction was given. A safe alternative such as desk pickup may meet the visit''s
      goal without entering the reading room.


      Attempt [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). Your
      output is a two-visit comparison, suitable-route reasoning and a proportionate action. It should
      contain no dossiers, photos or identity judgments about other visitors.


      ### Adapt the observation burden


      Use a companion, spoken directions, a tactile or accessible building map, or a quieter familiar
      setting. Asking staff is a legitimate strategy, not a failure of independence. If repeated scanning
      increases anxiety or distracts from life, reduce the task to one planned orientation or use the
      paper case; this exercise is not treatment for anxiety or hypervigilance.


      Harder route: garden access is unconfirmed and the desk cannot establish a level route today. Do
      not turn “unknown” into “probably fine.” Ask for a reachable pickup alternative or postpone. A successful
      visit may mean choosing not to enter a place whose access requirements cannot currently be met.


      For real transfer, during two ordinary safe visits notice the same functional landmarks and one
      relevant condition. Record a change or honestly record none. Ask a staff question if needed, take
      a small proportionate action and check whether it helped. Do not force a second visit, create a
      hazard or look for suspicious people to make the exercise eventful.


      **Supportive:** A meaningful change is noticed, a suitable response checked and attention returns
      to the visit. **Mixed:** Access is resolved but repeated scanning disrupts the activity. **Contradictory:**
      Strangers are followed, photographed or confronted based on appearance. **Inconclusive:** Imagined
      threats replace observations or a suggested route is called tested without a result.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A diversion sign points to a stairway, but you require level access. A second corridor is
      unverified. Which route is confirmed suitable, and what is a proportionate next step?

      2. A stranger looks around at signs. A trolley blocks the passage. Which observation justifies a
      functional response, and what should the response address?

      3. One visitor records no relevant change on a second visit. Another did not make the second visit.
      Are these the same evidence? What if staff suggested an alternative but nobody tested or confirmed
      its suitability?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      At a fictional reception, the usual entrance has two steps. A sign points to a level side door,
      but today a delivery trolley blocks its approach. The desk is staffed and no permission to move
      equipment is given. Plan an access inquiry without assuming the signed route is usable.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Neither alternative is yet confirmed suitable: the stairs fail the requirement and the other
      route is unknown. Ask staff for a verified suitable path or reachable service alternative. Do not
      enter a closed corridor or assume a generic diversion meets every access need.

      2. The blocked passage supports asking staff for a clear appropriate route or reporting the obstruction.
      Looking at signs does not establish harmful intent. Address movement/access without monitoring or
      confronting the stranger.

      3. No. The first is an actual observation of no relevant change; the second is an absent observation.
      A suggested route without suitability/result evidence remains unverified. Keep observation, advice,
      attempt and successful access as separate statuses.


      ### Changed-case answer


      Describe the actual blockage to the desk and request an authorized clear route or assistance chosen
      by the visitor. Do not move unknown equipment or presume the person can use the steps. A sign establishes
      an intended route, not present usability; record what was confirmed before claiming access.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
