    ordinary activity.'
  - 'Action 2: Compare a second visit for one meaningful change. Observed checks: The second observation
    uses the same functional reference points; A change or its absence is recorded without invention;
    Unclear directions are checked through an appropriate source; Response thresholds depend on conditions
    rather than stereotypes.'
  - 'Action 3: Take one small action and check whether it solved the actual problem. Observed checks:
    The action addresses the observed access or environmental condition; The route or assistance is checked
