  transfer_limit: This practices ordinary awareness in a familiar public place. It is not surveillance,
    profiling, threat prediction or a requirement to remain constantly vigilant.
  reflection:
    before: 'What would count as doing this honestly? Goal: Orient to exits, movement, access and changing
      conditions without treating unfamiliar people or every anomaly as a threat.'
    during: Which checks have actually been observed? The route was found, but repeated scanning distracted
      from the visit and the next attempt was reduced to one orientation.
    after: Which observation changed what you did, and which initial interpretation turned out to be unnecessary
      or unsupported?
  review_guidance:
    repeat: Repeat the same bounded Situational awareness design only when the context and burden remain
      appropriate.
    adapt: Use a companion, building accessibility information, audio directions or a quieter familiar
      setting. A person affected by hypervigilance may prefer a single planned orientation rather than
      repeated scans; stop when the exercise increases distress or interferes with ordinary functioning.
    stop: Stop Situational awareness when the practice becomes coercive, unsafe, privacy-invasive, role-inappropriate,
      professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: A visitor noticed a corridor closure, confirmed an accessible alternative with staff and
      then resumed the visit without monitoring other visitors.
    mixed: The route was found, but repeated scanning distracted from the visit and the next attempt was
      reduced to one orientation.
    contradictory: A person followed or photographed strangers based on appearance and called that situational
      awareness.
    inconclusive: Threat scenarios were imagined at home without observing a real environment or checking
      a functional route.
