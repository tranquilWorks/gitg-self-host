        - information_practical_support_and_responsibility_are_discussed
        - bodily_autonomy_and_voluntary_medical_choice_remain_explicit
        - a_fundamental_difference_is_not_hidden_behind_an_assumed_future_change
      - measurement_id: c1814_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1814_a2_adverse
        kind: boolean
        role: adverse
