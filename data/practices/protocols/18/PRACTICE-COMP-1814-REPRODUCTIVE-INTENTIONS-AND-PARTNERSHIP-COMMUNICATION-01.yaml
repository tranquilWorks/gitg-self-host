        expected: true
  - stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01-A2
    sequence: 2
    title: Compare intentions and allocate discussion responsibilities, not bodily control
    instructions: 'At a calm agreed time, share current intentions and ask the partner to explain theirs.
      Discuss who will obtain reliable contraception or fertility information, how costs and appointments
      might be supported and what conversations would be needed if circumstances changed. Make clear that
      agreement about a relationship does not transfer control over another person’s body. A major difference
      about children is not solved by pressure, contraceptive interference or assuming one person will
      eventually change.


      Observation checks: Both people’s current intentions are heard without pressure; Information practical
      support and responsibility are discussed; Bodily autonomy and voluntary medical choice remain explicit;
      A fundamental difference is not hidden behind an assumed future change. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01
      action_stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01-A2
      competency_stable_id: '18.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1814_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1814_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
