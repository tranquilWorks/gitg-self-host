        expected: true
  - stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01-A3
    sequence: 3
    title: Follow up on one uncertainty and record what remains unresolved
    instructions: 'Choose one appropriate next step, such as a clinician discussion about suitable prevention
      or fertility evaluation, a practical care-capacity conversation or a later date to revisit uncertainty.
      Obtain the information or make the actual inquiry rather than merely bookmarking it. Summarize the
      current shared understanding and the unresolved points; a booked appointment is not a medical answer,
      and no test or method can be treated as a universal guarantee.


      Observation checks: One relevant uncertainty receives an actual inquiry or action; Booking inquiry
      and clinical advice are distinguished; Shared understanding and unresolved differences remain separate;
      No fertility prediction or prevention guarantee is invented. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What had each person been assuming, and which difference or medical uncertainty must
      remain explicit before a responsible next decision can be made?


      Examples: Supportive: The partners discovered different meanings of someday, clarified current prevention
      questions and sought medical information without promising that either person would change their
      wishes.


      Mixed: The conversation improved, but one person remained uncertain and the plan kept that uncertainty
      visible rather than treating it as consent to parenthood.


      Contradictory: A partner pressured pregnancy, interfered with contraception or used a fertility
      assumption to dismiss the other person’s choice.


      Inconclusive: The couple repeated that they wanted to be on the same page without discussing timing,
      prevention, uncertainty or responsibility.'
    expected_time: 15-25 minutes
    due_within_days: 10
