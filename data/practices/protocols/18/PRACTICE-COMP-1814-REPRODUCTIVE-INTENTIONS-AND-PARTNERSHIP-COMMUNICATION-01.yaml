meaning_and_fit:
  purpose: Discuss current wishes about children, timing, pregnancy prevention, fertility uncertainty
    and responsibility while preserving each adult’s bodily autonomy and the right to remain unsure.
  why_recommended: Discuss current wishes about children, timing, pregnancy prevention, fertility uncertainty
    and responsibility while preserving each adult’s bodily autonomy and the right to remain unsure.
  claims:
  - statement: Discuss current wishes about children, timing, pregnancy prevention, fertility uncertainty
      and responsibility while preserving each adult’s bodily autonomy and the right to remain unsure.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Reproductive intentions and partnership communication
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Reproductive intentions and partnership communication as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use separate reflection, accessible communication or qualified counseling
    when appropriate and freely chosen. People may choose single life, no children, adoption or other
    lawful routes; none removes the need for honest expectations and relevant medical or legal guidance.
    Coercion requires safety support, not another negotiation.
  opportunity_considerations: 'Default case: two adult partners have said maybe someday about children
    but have not discussed what that means. Prepare headings for current desire, timing, contraception
    where relevant, pregnancy possibility, fertility uncertainty, responsibilities and unresolved differences.
    A single person may use a private or fictional plan without seeking a partner.'
  prerequisites:
  - 'Default case: two adult partners have said maybe someday about children but have not discussed what
    that means. Prepare headings for current desire, timing, contraception where relevant, pregnancy possibility,
    fertility uncertainty, responsibilities and unresolved differences. A single person may use a private
    or fictional plan without seeking a partner.'
  dependencies: []
  safe_alternatives:
  - Use separate reflection, accessible communication or qualified counseling when appropriate and freely
    chosen. People may choose single life, no children, adoption or other lawful routes; none removes
    the need for honest expectations and relevant medical or legal guidance. Coercion requires safety
    support, not another negotiation.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Reproductive intentions and partnership communication differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Reproductive intentions and
    partnership communication as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: two adult partners have said maybe someday about children but have not discussed
    what that means. Prepare headings for current desire, timing, contraception where relevant, pregnancy
    possibility, fertility uncertainty, responsibilities and unresolved differences. A single person may
    use a private or fictional plan without seeking a partner. Goal: Discuss current wishes about children,
    timing, pregnancy prevention, fertility uncertainty and responsibility while preserving each adult’s
    bodily autonomy and the right to remain unsure. Scope: This is an adult communication and care-question
    exercise, not fertility prediction, contraceptive prescribing or a requirement to want children, attempt
    pregnancy or undergo testing. Time and effort: Twenty minutes of private reflection, a twenty-minute
    willing conversation and one appropriate medical or practical follow-up. Adaptation: Use separate
    reflection, accessible communication or qualified counseling when appropriate and freely chosen. People
    may choose single life, no children, adoption or other lawful routes; none removes the need for honest
    expectations and relevant medical or legal guidance. Coercion requires safety support, not another
    negotiation. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use separate reflection, accessible communication or qualified counseling when
    appropriate and freely chosen. People may choose single life, no children, adoption or other lawful
    routes; none removes the need for honest expectations and relevant medical or legal guidance. Coercion
    requires safety support, not another negotiation.
  expected_burden: Twenty minutes of private reflection, a twenty-minute willing conversation and one
    appropriate medical or practical follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Reproductive intentions and partnership communication protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Reproductive intentions and partnership communication action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use separate
    reflection, accessible communication or qualified counseling when appropriate and freely chosen. People
    may choose single life, no children, adoption or other lawful routes; none removes the need for honest
    expectations and relevant medical or legal guidance. Coercion requires safety support, not another
    negotiation.
  actions:
  - stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01-A1
    sequence: 1
    title: State present intentions and separate them from predictions
    instructions: 'Privately distinguish want children, do not want children, uncertain and conditional
      wishes, with any current timing boundary. Note the difference between a wish and an assumption that
      pregnancy will or will not occur. Identify what health, age, anatomy, treatment, access or life
      circumstances may require qualified information, without inferring fertility from appearance, regular
      cycles or a past outcome. Do not promise future parenthood merely to preserve the relationship.


      Observation checks: Current wishes uncertainty and timing are stated honestly; Desire is distinguished
      from a prediction of fertility or pregnancy; Medical uncertainties are identified without self-diagnosis;
      A future promise is not made to avoid a present incompatibility. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01
      action_stable_id: PRACTICE-COMP-1814-REPRODUCTIVE-INTENTIONS-AND-PARTNERSHIP-COMMUNICATION-01-A1
      competency_stable_id: '18.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1814_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1814_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - current_wishes_uncertainty_and_timing_are_stated_honestly
        - desire_is_distinguished_from_a_prediction_of_fertility_or_pregnancy
        - medical_uncertainties_are_identified_without_self_diagnosis
        - a_future_promise_is_not_made_to_avoid_a_present_incompatibility
      - measurement_id: c1814_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1814_a1_adverse
        kind: boolean
        role: adverse
