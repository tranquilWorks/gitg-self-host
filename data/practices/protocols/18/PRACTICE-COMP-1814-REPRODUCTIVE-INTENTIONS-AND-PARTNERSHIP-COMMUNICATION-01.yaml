      - [Contraception and Birth Control Methods](https://www.cdc.gov/contraception/about/index.html)

      - [Defining sexual health](https://www.who.int/teams/sexual-and-reproductive-health-and-research/key-areas-of-work/sexual-health/defining-sexual-health)

      - [What are my boundaries?](https://www.loveisrespect.org/resources/what-are-my-boundaries/)

      - [Get a divorce](https://www.gov.uk/divorce)

      - [About the Committee on Consensual Non-Monogamy](https://www.div44cnm.org/about)

      - [Planning for Pregnancy](https://www.cdc.gov/pregnancy/about/index.html)

      - [Triangles](https://www.thebowencenter.org/triangles)

      - [Positive Parenting Tips for Healthy Child Development: Middle Childhood (6–8 years of age)](https://stacks.cdc.gov/view/cdc/155268/cdc_155268_DS1.pdf)

      - [Steps for Creating and Maintaining a Care Plan](https://www.cdc.gov/caregiving/guidelines/index.html)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)

      - [Supported Decision Making Program](https://acl.gov/programs/consumer-control/supported-decision-making-program)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Asha sends the clinic inquiry on 7 October. The clinic replies with consultation options and offers
      an appointment on 21 October. Asha books it; no consultation or individual clinical assessment has
      occurred. Asha accepts Luca''s offer to find publicly listed costs, but does not authorize record
      access. Luca completes twenty minutes of research and shares the public fee page, noting that actual
      individual charges remain unconfirmed.


      Both agree to revisit their intentions on 5 November. Asha remains uncertain and does not want a
      decision this year. Luca still hopes to parent and says the timing difference matters. Neither promises
      that the review will produce agreement. There is no change to contraception supplied and no pregnancy
      attempt.


      Record the actual inquiry, reply, booking, accepted bounded research and agreed future conversation.
      Distinguish public listed fees from confirmed costs. Do not mark fertility known, the appointment
      attended, or a shared reproductive intention established. The six-month wish did not become a deadline
      requiring Asha to change position. Identify the questions each person can honestly carry into the
      review.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Clarify present wishes, uncertainty, bodily boundaries and practical responsibilities before
      assumptions become a crisis. Allow twenty minutes of private preparation, a willing adult conversation
      of similar length, and one actual information inquiry or agreed follow-up if appropriate. Parenting
      and partnership are optional. Single life, not wanting children, uncertainty and declining personal
      disclosure are legitimate. Use the complete fiction without revealing reproductive history.


      ### A wish is not a forecast or a promise on another person''s behalf


      Wanting children, not wanting them, being unsure and being open only under certain conditions are
      different current positions. “Maybe someday” can conceal a timing conflict or simply express uncertainty.
      Ask what the phrase means now rather than converting it into a yes. People may change their minds;
      that possibility does not justify ignoring a clear present boundary or promising children merely
      to avoid a difficult conversation.


      A reproductive intention is distinct from a fertility prediction. Appearance, cycle assumptions
      or a previous outcome cannot establish an individual''s future fertility through this exercise.
      Pregnancy risk, contraception, health history, fertility questions and relevant treatment belong
      with current qualified guidance. The conversation can identify what needs asking without selecting
      a method, interpreting a test or guaranteeing an outcome.


      Timing involves practical circumstances as well as desire: work, finances, care capacity, housing
      and each person''s values may matter. Partners can share information gathering, costs, appointments
      or future care planning when freely agreed and authorized. Shared responsibility does not confer
      control over another person''s body, medication, pregnancy decisions or access to care. Interfering
      with contraception, withholding material information or using threats is not negotiation.


      A genuine mismatch can remain after a kind, clear conversation. Do not require one person to surrender
      a core intention, or use an inquiry as evidence they have accepted a future path. Adoption or other
      lawful routes may raise their own legal and practical questions; they are not automatic solutions
      to an unexamined disagreement. Qualification and local context matter.


      ### Worked example


      One partner says “I might want children in a few years,” while the other means “I want to begin
      trying next year.” Repeating “we both want children” hides a consequential difference. A useful
      account records both timing positions and any conditions, then identifies what remains undecided.
      Booking a medical discussion may improve information later, but it does not reconcile timing or
      prove that pregnancy will be possible.


      ### Supplied fictional task


      Adult partners Asha and Luca have used the phrase “maybe someday.” On 5 October Asha explains that
      they are currently uncertain about wanting children and do not want a decision this year. Luca says
      they presently hope to parent and would like a clearer discussion about timing within six months.
      Neither has promised to try for pregnancy. No fertility status, pregnancy, method details or medical
      diagnosis is supplied.


      Both want truthful information and no contraceptive interference. Asha is willing to ask a qualified
      clinic what a discussion of individual reproductive questions would involve, but does not authorize
      Luca to access clinical records or choose care. Luca offers to research public appointment costs,
      within thirty minutes, if Asha wants that help. The offer has not yet been accepted. Both agree
      to a nonsexual conversation; neither has accepted a reproductive outcome or a six-month deadline
      for changing their mind.


      ### Clarify without coercion


      1. Make separate entries for present wish, timing, conditions, boundaries and unknowns for each
      person. Write “uncertain” for Asha rather than “eventual yes”; write Luca''s current hope without
      making it a command. Output: two distinguishable positions and one explicit unresolved mismatch.

      2. Separate personal decisions from questions requiring information. Draft one qualified-service
      inquiry about how to discuss individual reproductive concerns and available consultation options.
      Do not request a fertility prediction from the fictional facts. Output: a question list with clinical
      and legal limits, not advice on a method or treatment.

      3. Draft the conversation opening and an accurate reflection from each person. Asha can acknowledge
      Luca''s hope without promising children; Luca can acknowledge Asha''s uncertainty without treating
      it as manipulation. Output: two fair summaries and any agreed review date, if actually accepted.

      4. Address responsibility and authority. Ask whether the public-cost research is wanted; preserve
      Asha''s control over private care information. Identify support someone can offer without assuming
      access to records, appointments or bodily decisions. Output: accepted tasks with limits, and unaccepted
      offers still marked as offers.

      5. Save the map and open the [later packet](?resource=file-later-packet-md). Check what was asked,
      answered or booked, and whether the core intentions changed. Output: a status review and a next
      question that does not manufacture consensus.


      ### Supported, harder and live routes


      For support, use two fictional statements and underline wish, timing and uncertainty in different
      formats. No one must produce an intimate autobiography. For a harder case, introduce a looming housing
      decision and distinguish its deadline from permission to pressure a reproductive decision. Consider
      whether the shared housing plan should remain unmade while the mismatch is unresolved.


      For optional real transfer, invite a calm discussion only if welcome and safe. Use current individual
      information from qualified professionals where needed. Make one actual authorized inquiry or hold
      the agreed later conversation, recording only its status in learning notes. An unread webpage is
      not an inquiry, a clinic booking is not attendance, and attendance is not a particular medical answer.
      Reproductive coercion or abuse calls for appropriate safety support, not a more persuasive script.


      ### Source use


      [CDC pregnancy planning, S10](https://www.cdc.gov/pregnancy/about/index.html) supports preparing
      individualized questions for a clinician; this guide imports no supplement dose, testing schedule
      or treatment recommendation. [CDC contraception guidance, S05](https://www.cdc.gov/contraception/about/index.html)
      informs voluntary informed choice, not a prescribed method. [Safety guidance, S14](https://www.thehotline.org/plan-for-safety/)
      supports an individualized help route for coercion. The intentions map is original and does not
      predict outcomes.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. One partner says “maybe someday,” but clarifies they are unsure whether they ever want children.
      Is it accurate to record a shared plan to parent later?

      2. A person agrees to research public consultation costs. Does that grant access to their partner''s
      medical records or authority to select treatment?

      3. A consultation is attended, but the packet gives no clinician findings. Can a learner infer fertility
      or a guaranteed future pregnancy from attendance?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Preserve the uncertainty and the other person''s distinct wishes. Discuss implications
      without converting ambiguity into consent or a promise. A genuine mismatch may remain and requires
      honest choices, not persuasion disguised as clarification.

      2. No. The task''s authority is bounded to the accepted public-information work. Records, care decisions
      and disclosure require their own legitimate permissions and applicable guidance. Shared responsibility
      does not transfer bodily control.

      3. No. Attendance establishes only that the consultation occurred. No clinical conclusion is supplied,
      and this exercise cannot predict fertility or guarantee pregnancy. Keep any real individual findings
      private and interpreted through qualified care.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
