meaning_and_fit:
  purpose: Express interest or lack of interest clearly, respect mutuality and pacing, and handle rejection
    without manipulation, entitlement or humiliation.
  why_recommended: Express interest or lack of interest clearly, respect mutuality and pacing, and handle
    rejection without manipulation, entitlement or humiliation.
  claims:
  - statement: Express interest or lack of interest clearly, respect mutuality and pacing, and handle
      rejection without manipulation, entitlement or humiliation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Attraction and respectful courtship practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Attraction and respectful courtship as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible text or an appropriate mutually familiar setting. Singles may
    complete a boundaries-and-decline rehearsal without seeking romance. Stop when contact becomes unwelcome,
    and use appropriate support for stalking, harassment or coercion rather than treating it as courtship.
  opportunity_considerations: 'Use a real welcome adult context or the fictional case of two acquaintances
    who have enjoyed talking at a social group. Default invitation: I have enjoyed talking with you; would
    you like to meet for coffee as a date next week? Prepare a respectful acceptance, decline and uncertain-response
    route. Do not stage interest you do not feel.'
  prerequisites:
  - 'Use a real welcome adult context or the fictional case of two acquaintances who have enjoyed talking
    at a social group. Default invitation: I have enjoyed talking with you; would you like to meet for
    coffee as a date next week? Prepare a respectful acceptance, decline and uncertain-response route.
    Do not stage interest you do not feel.'
  dependencies: []
  safe_alternatives:
  - Use accessible text or an appropriate mutually familiar setting. Singles may complete a boundaries-and-decline
    rehearsal without seeking romance. Stop when contact becomes unwelcome, and use appropriate support
    for stalking, harassment or coercion rather than treating it as courtship.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Attraction and respectful courtship differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Attraction and respectful
    courtship as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a real welcome adult context or the fictional case of two acquaintances who have enjoyed
    talking at a social group. Default invitation: I have enjoyed talking with you; would you like to
    meet for coffee as a date next week? Prepare a respectful acceptance, decline and uncertain-response
    route. Do not stage interest you do not feel. Goal: Express interest or lack of interest clearly,
    respect mutuality and pacing, and handle rejection without manipulation, entitlement or humiliation.
    Scope: This applies only to lawful adult, voluntary and reasonably safe interactions without coercive
    power or dependency. No one must date, flirt or seek a partner to complete a personal-development
    program. Time and effort: Ten minutes to prepare and rehearse, one appropriate invitation or decline
    when a genuine opportunity exists, and a five-minute review. Adaptation: Use accessible text or an
    appropriate mutually familiar setting. Singles may complete a boundaries-and-decline rehearsal without
    seeking romance. Stop when contact becomes unwelcome, and use appropriate support for stalking, harassment
    or coercion rather than treating it as courtship. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible text or an appropriate mutually familiar setting. Singles may complete
    a boundaries-and-decline rehearsal without seeking romance. Stop when contact becomes unwelcome, and
    use appropriate support for stalking, harassment or coercion rather than treating it as courtship.
  expected_burden: Ten minutes to prepare and rehearse, one appropriate invitation or decline when a genuine
    opportunity exists, and a five-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Attraction and respectful courtship protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Attraction and respectful courtship action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    text or an appropriate mutually familiar setting. Singles may complete a boundaries-and-decline rehearsal
    without seeking romance. Stop when contact becomes unwelcome, and use appropriate support for stalking,
    harassment or coercion rather than treating it as courtship.
  actions:
  - stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01-A1
    sequence: 1
    title: Check intention, context and the ability to say no
    instructions: 'State whether you are seeking a date, friendship or simply more conversation, and avoid
      leaving a material intention deliberately ambiguous. Check whether the person is an adult, whether
      contact is welcome and whether work, housing, care or authority would make refusal costly. Choose
      a modest public or otherwise mutually safe meeting option with independent transport and no expectation
      of physical intimacy. If the context is unsuitable, use rehearsal or decline to proceed.


      Observation checks: The intention is honest and appropriate to adults; The person can refuse without
      a power or dependency cost; The proposed meeting has proportionate safety and pacing; An unsuitable
      context leads to rehearsal or no approach. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01
      action_stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01-A1
      competency_stable_id: '18.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
