  - stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01-A3
    sequence: 3
    title: Match the follow-through to the actual answer
    instructions: 'For a mutual yes, confirm the plan and any practical boundaries without assuming more
      than the agreed meeting. For a no, acknowledge it and stop the pursuit; maintain only contact that
      remains genuinely welcome. For a cancellation, accept the stated information and avoid interpreting
      it as a test. Review whether your conduct remained honest when the outcome disappointed you, and
      label rehearsal separately from an actual invitation.


      Observation checks: Follow-through matches the specific agreement and no more; A refusal ends the
      pursuit without retaliation; Cancellation is not automatically interpreted as a hidden game; Actual
      communication and scripted rehearsal are reported separately. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the other person have a real choice, and did your behavior after the answer match
      the respect you intended before asking?


      Examples: Supportive: The participant made a clear modest invitation, accepted a decline and did
      not use the shared group to continue pressuring the person.


      Mixed: The invitation was welcome, but its romantic intent was unclear and needed a respectful clarification
      before planning.


      Contradictory: The person used persistence, public embarrassment or authority to make rejection
      difficult.


      Inconclusive: Interest was imagined or rehearsed but reported as a mutually agreed date.'
    expected_time: 15-25 minutes
