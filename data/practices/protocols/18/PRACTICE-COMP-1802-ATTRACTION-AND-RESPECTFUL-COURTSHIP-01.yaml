  - stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01-A2
    sequence: 2
    title: Make the invitation or decline in plain respectful words
    instructions: 'Ask once in an appropriate moment, or clearly decline an invitation without insulting
      the person. Include a specific modest option and space for an alternative. Do not use jealousy,
      persistence, gifts, public spectacle or pressure to create attraction. If the answer is uncertain,
      ask whether they would prefer to leave it there rather than treating uncertainty as permission to
      keep pursuing. A declined invitation is a legitimate completed communication, not a failed person.


      Observation checks: The invitation or decline is direct without unnecessary humiliation; The request
      is made once with room for an alternative; No pressure tactic is used to manufacture attraction;
      Uncertainty and refusal are respected as limits on pursuit. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01
      action_stable_id: PRACTICE-COMP-1802-ATTRACTION-AND-RESPECTFUL-COURTSHIP-01-A2
      competency_stable_id: '18.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
