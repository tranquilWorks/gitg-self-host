  - stable_id: PRACTICE-COMP-1813-RELATIONSHIP-DIVERSITY-AND-CHOSEN-FORM-01-A2
    sequence: 2
    title: Write a commitment statement with boundaries and common duties
    instructions: 'State the form of relationship or single life you currently choose or remain uncertain
      about, what promises it entails and what you could not freely agree to. Add the duties you recognize
      across forms: truthful material information, voluntary informed consent, respect for boundaries
      and responsibility for affected dependents or commitments. Avoid a statement that requires others
      to adopt your path before you will treat them respectfully.


      Observation checks: Your chosen path or principled uncertainty is explicit; Promises and personal
      boundaries are concrete; Common duties remain applicable across different forms; Respect is not
      conditional on another person adopting your choice. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1813-RELATIONSHIP-DIVERSITY-AND-CHOSEN-FORM-01
