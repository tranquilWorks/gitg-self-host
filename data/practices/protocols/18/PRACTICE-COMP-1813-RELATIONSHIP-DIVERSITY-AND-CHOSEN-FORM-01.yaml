  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      A fictional reader reviews the learner''s initial statement: “I want an exclusive partnership. Rae
      probably has a different kind of arrangement, but can come to the picnic anyway.” The reader points
      out that Rae''s orientation does not establish the relationship structure, and “anyway” makes ordinary
      inclusion sound like reluctant permission. The learner''s preference for exclusivity is not challenged.


      The revised statement reads: “I would choose exclusivity in my own partnership. Rae asked about
      the picnic; I can share its time and access details without assuming anything about Rae''s private
      agreements.” The reader says this now represents the supplied facts accurately. Rae has not received
      the reply and no picnic has occurred.


      Credit the specific correction and fictional reader confirmation. Do not claim actual friendship
      maintenance, changed prejudice, approval of every possible structure or an independent human review.
      The learner can retain a personal commitment while withdrawing an unsupported inference. In C, any
      new invitation still requires attention to the existing notification and privacy commitments; the
      structure''s label does not answer that question.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Practice stating your own commitments while describing other adults'' consensual choices without
      contempt or invented assumptions. Allow twenty minutes for four fictional cases and ten for a statement
      and review. No relationship form is assigned as a learning requirement. Single life, partnership
      and declining personal disclosure remain legitimate. You do not have to change religious or ethical
      convictions to perform the reasoning task.


      ### Picnic information available to share


      The fictional picnic is Sunday 18 October, 12:00–13:30, at Cedar Park’s east picnic tables beside
      the Oak Street entrance. The organizer’s note describes a step-free paved route from that entrance
      and benches with space beside them; toilet access has not been checked. Guests may bring their own
      lunch, join briefly or decline. Organizer Sam accepts access questions through the group’s existing
      private message thread. Share these supplied details without promising universal accessibility or
      requesting Rae’s intimate information.


      ### Distinguish identity, structure and conduct


      Orientation concerns patterns of attraction and identity; it does not by itself specify exclusivity,
      commitment or household organization. Relationship structure concerns how people arrange their relationships,
      such as being single, choosing an exclusive partnership or agreeing to a consensually nonexclusive
      form. Conduct concerns what people actually do: honesty, respect for choice, keeping promises, protecting
      privacy and meeting real responsibilities. One category cannot answer every question in the others.


      A label does not establish trustworthiness or safety. An exclusive relationship can include deception;
      a nonexclusive relationship can include explicit commitments and breaches of those commitments.
      Calling a structure consensual does not make pressure disappear. Single people still have responsibilities
      in friendships, care and community, but need not enter romance to prove maturity. Do not rank human
      dignity by marital status, orientation or relationship form.


      Personal commitments can be stated positively and specifically: “I would only enter an exclusive
      partnership” describes your own boundary. “Anyone who chooses differently is incapable of love”
      asserts a degrading universal judgment that the facts do not support. Disagreement need not be hidden
      under performative approval. You can acknowledge the actual choice, decline participation for yourself
      and continue treating the person with ordinary dignity.


      Law and social recognition vary by location and circumstance. Describing a consensual structure
      does not settle marriage, parentage, immigration, property or care authority. Qualified local guidance
      is needed for relevant legal questions. Dignity and voluntary choice do not excuse unlawful harmful
      conduct, erase responsibilities to dependents or require another person to accept a proposed arrangement.


      ### Worked example


      A friend explains that they are happily single and do not want dating introductions. A respectful
      response takes that preference seriously and stops offering matches. It does not treat the friend
      as incomplete or demand a theory of why they avoid partnership. If your own hope is marriage, you
      can say so when relevant without recasting the friend''s life as a failed version of yours. Different
      choices can coexist without being declared identical.


      ### Four supplied adult cases


      These are original fiction; infer only what is supplied.


      - **A:** Sol is single by choice and enjoys close friendships. Sol asks friends not to arrange dates.
      No loneliness, hidden romantic desire or care deficit is supplied.

      - **B:** Hana and Dev freely choose an exclusive partnership. They agree on exclusivity and have
      not supplied any breach. Nothing is stated about their orientation or desire for children.

      - **C:** Morgan and Kit describe a nonexclusive arrangement freely agreed by the involved adults,
      with explicit notification and privacy commitments. A new invitation still needs to fit those commitments.
      No universal permission for any future conduct is implied.

      - **D:** Rae''s orientation differs from the learner''s. Rae mentions a partner but does not specify
      exclusivity, marriage status or private sexual details. Rae asks only to be included in an ordinary
      group picnic.


      The case does not ask you to approve every possible action or participate in any relationship. It
      asks you to avoid substituting a label for facts while retaining honest boundaries and practical
      respect.


      ### Write an accurate response


      1. For each case separate known identity or structure from known conduct and unknown details. Output:
      four short descriptions without assumptions about health, character, children or legal status.

      2. State your own chosen path or uncertainty in two or three sentences. Include what you can freely
      promise and what you cannot agree to. You may keep personal identity private and use a fictional
      first-person statement. Output: a bounded commitment rather than a hierarchy of people''s worth.

      3. Identify obligations that still matter across the cases: truthful relevant information, voluntary
      participation, respect for boundaries and real dependent responsibilities. Apply them to a concrete
      next action, such as honoring Sol''s no-dates request or checking C''s notification agreement. Output:
      conduct-based reasoning rather than blanket endorsement or condemnation.

      4. Draft a response to Rae''s picnic request that provides the ordinary relevant information without
      probing intimate details. If genuine disagreement arises, describe your view without using access
      to friendship as a conversion reward. Output: a usable respectful reply with no forced outing or
      declaration of sameness.

      5. Save your statements before the [later packet](?resource=file-later-packet-md). Use the reader''s
      corrections to remove unsupported inferences. A delayed self-review can also help, but label it
      self-review; it is not independent feedback. Output: a revised statement and the specific inference
      corrected.


      ### Support, challenge and real transfer


      For support, compare only A and B, listing one known fact and one unknown each. Use an accessible
      written format and omit personal disclosure. For a harder fictional check, have someone invoke diversity
      to excuse a concealed breach or pressure a reluctant partner. Preserve dignity while identifying
      the specific wrong; tolerance is not the suspension of consent or truth.


      For real transfer, respond to a naturally occurring, welcome conversation or correct a general statement
      of your own. Do not solicit someone else''s identity or relationship details to create evidence.
      A willingly offered reader response can show how your statement was understood, not whether every
      listener agrees. No public coming-out exercise, debate about a person''s worth or adoption of another
      form is required.


      ### Source use


      [APA Division 44''s CNM committee, S09](https://www.div44cnm.org/about) supplies an educational
      distinction between consensual nonmonogamy and infidelity. Only that definition-level use is made;
      no prevalence or comparative relationship-quality claim is imported. [Consent guidance, S04](https://rainn.org/share-the-facts/consent-101-respect-boundaries-and-building-trust/)
      informs the requirement that participation remain free. The four-way comparison and responses are
      original design.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Write a reasoned answer, then [compare](?check=practice-answers).


      1. A person''s orientation differs from yours. What can you infer about whether their relationship
      is exclusive?

      2. Someone pressures a reluctant partner to accept a new structure, calling refusal intolerant.
      Does respect for diversity require agreement?

      3. Can a learner honestly choose only an exclusive partnership for themselves while respecting a
      friend who remains single or chooses another consensual arrangement?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Nothing about exclusivity follows from orientation alone. Structure and actual agreements
      need their own facts, and you may have no legitimate reason to ask. Treat ordinary social requests
      on their relevant merits.

      2. No. Respect does not create an obligation to participate. A new arrangement needs freely given
      agreement, and an existing promise remains relevant until legitimately changed. Name the pressure
      without degrading people who freely choose that form.

      3. Yes. State the personal commitment as a boundary on your own participation, avoid claims of lesser
      dignity or invented character defects, and respect the friend''s actual requests and responsibilities.
      Honest disagreement does not require contempt or false agreement.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
