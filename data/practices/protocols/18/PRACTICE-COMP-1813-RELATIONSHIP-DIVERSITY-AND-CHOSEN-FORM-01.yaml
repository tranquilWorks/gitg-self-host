meaning_and_fit:
  purpose: Distinguish personal commitments, orientation and relationship structure from judgments of
    human dignity, while keeping honesty, consent and consequences applicable across forms.
  why_recommended: Distinguish personal commitments, orientation and relationship structure from judgments
    of human dignity, while keeping honesty, consent and consequences applicable across forms.
  claims:
  - statement: Distinguish personal commitments, orientation and relationship structure from judgments
      of human dignity, while keeping honesty, consent and consequences applicable across forms.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Relationship diversity and chosen form practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Relationship diversity and chosen form as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a fictional comparison only, especially where disclosure of orientation
    or relationship status could create danger. No public statement or coming-out action is required.
    Where coercion, exploitation or unlawful conduct is involved, do not hide it behind a diversity label.
  opportunity_considerations: 'Use four fictional adults or groups: a person choosing single life, an
    exclusive couple, adults discussing a consensually nonexclusive structure and a person whose orientation
    differs from yours. The task is to state your own commitments and recognize common duties without
    assuming that every arrangement is suitable for you.'
  prerequisites:
  - 'Use four fictional adults or groups: a person choosing single life, an exclusive couple, adults discussing
    a consensually nonexclusive structure and a person whose orientation differs from yours. The task
    is to state your own commitments and recognize common duties without assuming that every arrangement
    is suitable for you.'
  dependencies: []
  safe_alternatives:
  - Use a fictional comparison only, especially where disclosure of orientation or relationship status
    could create danger. No public statement or coming-out action is required. Where coercion, exploitation
    or unlawful conduct is involved, do not hide it behind a diversity label.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Relationship diversity and chosen form differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Relationship diversity and
    chosen form as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use four fictional adults or groups: a person choosing single life, an exclusive couple, adults
    discussing a consensually nonexclusive structure and a person whose orientation differs from yours.
    The task is to state your own commitments and recognize common duties without assuming that every
    arrangement is suitable for you. Goal: Distinguish personal commitments, orientation and relationship
    structure from judgments of human dignity, while keeping honesty, consent and consequences applicable
    across forms. Scope: This is a values and language exercise for adults, not a requirement to change
    orientation, relationship form, religious belief or single status. Legal recognition and obligations
    vary by location. Time and effort: Twenty minutes to compare fictional cases and ten minutes to write
    and review a personal statement. Adaptation: Use a fictional comparison only, especially where disclosure
    of orientation or relationship status could create danger. No public statement or coming-out action
    is required. Where coercion, exploitation or unlawful conduct is involved, do not hide it behind a
    diversity label. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional comparison only, especially where disclosure of orientation or
    relationship status could create danger. No public statement or coming-out action is required. Where
    coercion, exploitation or unlawful conduct is involved, do not hide it behind a diversity label.
  expected_burden: Twenty minutes to compare fictional cases and ten minutes to write and review a personal
    statement.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Relationship diversity and chosen form protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Relationship diversity and chosen form action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    comparison only, especially where disclosure of orientation or relationship status could create danger.
    No public statement or coming-out action is required. Where coercion, exploitation or unlawful conduct
    is involved, do not hide it behind a diversity label.
  actions:
  - stable_id: PRACTICE-COMP-1813-RELATIONSHIP-DIVERSITY-AND-CHOSEN-FORM-01-A1
    sequence: 1
    title: Separate identity, chosen structure and actual conduct
    instructions: 'For each case, identify what is known about identity or structure and what remains
      unknown about honesty, consent, care and responsibility. Do not infer trustworthiness or health
      from the label alone. Distinguish your personal or religious commitments from a claim that people
      on another lawful consensual path have less dignity. Mark legal questions, such as recognition or
      dependent rights, for current qualified local information rather than a universal assumption.


      Observation checks: Identity structure and conduct are distinguished in all four cases; Honesty
      and care are not inferred from labels alone; Personal commitments do not become a hierarchy of human
      dignity; Legal recognition and obligations remain jurisdiction-specific questions. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1813-RELATIONSHIP-DIVERSITY-AND-CHOSEN-FORM-01
      action_stable_id: PRACTICE-COMP-1813-RELATIONSHIP-DIVERSITY-AND-CHOSEN-FORM-01-A1
      competency_stable_id: '18.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
