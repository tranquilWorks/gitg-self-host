meaning_and_fit:
  purpose: Recognize freely given, informed, specific, ongoing and reversible adult consent, and choose
    stopping or clarification whenever willingness or capacity is uncertain.
  why_recommended: Recognize freely given, informed, specific, ongoing and reversible adult consent, and
    choose stopping or clarification whenever willingness or capacity is uncertain.
  claims:
  - statement: Recognize freely given, informed, specific, ongoing and reversible adult consent, and choose
      stopping or clarification whenever willingness or capacity is uncertain.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Sexual ethics and consent practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Sexual ethics and consent as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use clear accessible communication, interpretation or AAC suitable to the
    situation; do not infer consent from a communication disability. Uncertainty means pause, not pressure.
    Survivors or anyone facing coercion may use specialist support and skip personal scenarios entirely.
  opportunity_considerations: 'Use four fictional adult cases: a person agrees to one form of closeness
    but not another; a previously willing person now says stop; a person says yes after repeated pressure;
    and a person is asleep or too impaired to make a clear choice. No real contact is initiated to test
    the cases.'
  prerequisites:
  - 'Use four fictional adult cases: a person agrees to one form of closeness but not another; a previously
    willing person now says stop; a person says yes after repeated pressure; and a person is asleep or
    too impaired to make a clear choice. No real contact is initiated to test the cases.'
  dependencies: []
  safe_alternatives:
  - Use clear accessible communication, interpretation or AAC suitable to the situation; do not infer
    consent from a communication disability. Uncertainty means pause, not pressure. Survivors or anyone
    facing coercion may use specialist support and skip personal scenarios entirely.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Sexual ethics and consent differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Sexual ethics and consent
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use four fictional adult cases: a person agrees to one form of closeness but not another; a
    previously willing person now says stop; a person says yes after repeated pressure; and a person is
    asleep or too impaired to make a clear choice. No real contact is initiated to test the cases. Goal:
    Recognize freely given, informed, specific, ongoing and reversible adult consent, and choose stopping
    or clarification whenever willingness or capacity is uncertain. Scope: This is a nonsexual scenario
    and communication exercise for adults. It does not provide legal advice, establish someone’s capacity
    or require any sexual contact, disclosure or demonstration. Time and effort: Twenty minutes to classify
    cases and ten minutes to rehearse clear asking, stopping and respectful follow-up. Adaptation: Use
    clear accessible communication, interpretation or AAC suitable to the situation; do not infer consent
    from a communication disability. Uncertainty means pause, not pressure. Survivors or anyone facing
    coercion may use specialist support and skip personal scenarios entirely. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use clear accessible communication, interpretation or AAC suitable to the situation;
    do not infer consent from a communication disability. Uncertainty means pause, not pressure. Survivors
    or anyone facing coercion may use specialist support and skip personal scenarios entirely.
  expected_burden: Twenty minutes to classify cases and ten minutes to rehearse clear asking, stopping
    and respectful follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Sexual ethics and consent protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Sexual ethics and consent action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use clear accessible
    communication, interpretation or AAC suitable to the situation; do not infer consent from a communication
    disability. Uncertainty means pause, not pressure. Survivors or anyone facing coercion may use specialist
    support and skip personal scenarios entirely.
  actions:
  - stable_id: PRACTICE-COMP-1809-SEXUAL-ETHICS-AND-CONSENT-01-A1
    sequence: 1
    title: Identify what is agreed and what makes agreement invalid or uncertain
    instructions: 'For each case, state the specific activity under discussion, what was actually communicated,
      whether the choice is free and whether the person can presently make it. A prior relationship, earlier
      agreement, gift, status, silence or lack of resistance does not supply current permission. In the
      pressure and incapacity cases, choose not to proceed; do not search for wording that would turn
      an unsafe situation into technical consent. Verify local legal requirements through qualified sources
      when needed.


      Observation checks: Each case separates specific communication from assumptions; Pressure and impaired
      capacity prevent proceeding; Past agreement status gifts and silence are not treated as permission;
      Legal capacity questions are not settled by this worksheet. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1809-SEXUAL-ETHICS-AND-CONSENT-01
      action_stable_id: PRACTICE-COMP-1809-SEXUAL-ETHICS-AND-CONSENT-01-A1
