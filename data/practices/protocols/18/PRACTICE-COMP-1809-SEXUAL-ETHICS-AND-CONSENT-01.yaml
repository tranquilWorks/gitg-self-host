  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      In A, Casey says “Okay, no kissing” but tries again five minutes later without any invitation from
      Robin. Robin repeats the refusal and ends the visit. In B, Ari stops immediately, gives Jo space,
      and asks whether Jo wants any practical support without demanding an explanation. Jo declines support;
      Ari accepts that.


      In C, Ren withdraws the explicit threat but asks Pat to say yes again right away so Ren can feel
      reassured. The packet supplies no freely chosen new agreement and no evidence that the pressure
      has ended. In D, Lee does not initiate the activity while Quinn sleeps. They have not had a later
      conversation.


      Credit B''s stopping and respect for declined support, and D''s decision not to proceed. A''s verbal
      acceptance is contradicted by renewed unwanted pursuit. C is unresolved; deleting one threatening
      sentence cannot establish freedom. Do not count a future conversation as completed, or imagine later
      consent to make the cases end positively. Write an immediate response and a remaining uncertainty
      for each case.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Use adult fictional cases and a no-contact rehearsal to recognize freely chosen permission
      and respond properly to refusal or uncertainty. Allow twenty minutes for classification and ten
      for optional spoken or written practice. There is no sexual activity assignment, touch demonstration
      or requirement to disclose experience. Single life, abstinence and declining rehearsal remain legitimate.
      An observer can review fictional words only, without being cast as a sexual partner.


      ### Consent is a decision with conditions


      Consent concerns a specific activity in a particular situation. Agreement to one form of closeness
      does not authorize another. Previous participation, a relationship title, marriage, gifts or a paid
      expense cannot settle a present decision. A person can change their mind after agreeing or after
      an activity begins. Stopping is the correct response to withdrawal; completing a planned sequence
      is not a competing obligation.


      Freedom matters alongside words. A yes obtained through repeated pressure, threats, dependency or
      a penalty for refusal does not become freely chosen because the asker finally hears the desired
      syllable. Silence, stillness and nonresistance do not supply missing permission. Uncertainty calls
      for stopping or not starting, rather than trying to construct a technically defensible yes.


      Capacity and access are different questions. A sleeping person or someone too impaired to understand
      and choose cannot provide the needed current agreement. A person using an established communication
      device may communicate a clear decision. Do not treat disability, quiet speech or an unfamiliar
      expression as automatic incapacity. Equally, do not ignore an actual inability to understand or
      communicate a choice. Relevant legal questions need qualified local guidance; this exercise does
      not determine legal capacity or age rules.


      Informed choice also depends on honesty about material circumstances: what is being proposed, relevant
      health and prevention questions, commitment expectations, privacy and foreseeable consequences.
      Do not hide a consequential fact to preserve a desired answer. Discuss uncertainty plainly and seek
      suitable professional information where needed. Ethical responsibility extends beyond obtaining
      permission: dignity, care and keeping actual promises still matter.


      ### Worked example


      Two adult peers agree to sit close while watching a film. One asks about a different kind of contact.
      The other says, “No, just sitting together.” A sound response is “Okay,” followed by no further
      attempt at the refused contact. Asking why until the answer changes, sulking as punishment, or claiming
      the earlier closeness made refusal unfair would undermine the freedom being respected. Continuing
      the originally welcome activity is also optional; neither person must stay to soothe disappointment.


      ### Four supplied adult cases


      All people below are fictional adults. No physical enactment is required or permitted by the task.


      - **A, specificity:** Robin agrees to hold hands with Casey and explicitly declines kissing. Casey
      says the handholding shows romantic interest and asks whether a kiss is now permitted. No changed
      answer is supplied.

      - **B, withdrawal:** Jo initially agrees to a particular intimate activity with Ari, then says “Stop;
      I don''t want this now.” Ari can hear and understand the request. No reason is offered or required.

      - **C, pressure:** Pat declines. Ren asks repeatedly, says the evening cost a lot, and threatens
      to end the relationship if Pat will not agree. Pat eventually says “Fine.”

      - **D, capacity:** Adult partners Quinn and Lee had earlier discussed intimacy. At the later moment
      Quinn is asleep. Lee remembers the earlier conversation. There is no present communication.


      The cases intentionally supply enough information to decide whether the proposed continuation is
      authorized. Do not add a hidden enthusiastic yes, assume a refusal is playful, or invent a rule
      that partnership replaces present choice.


      ### Classify and rehearse


      1. For each case write the proposed activity, the actual communication, any pressure or capacity
      concern, and the immediate permissible response. Output: four decisions with reasons tied to the
      facts. A authorizes only the stated handholding; B requires stopping; C does not supply freely given
      agreement; D supplies no current consent.

      2. Write one respectful ask, one plain refusal, and one response to withdrawal. Use your own language
      or accessible communication format. The response must not require explanation, bargaining, reassurance
      or a promise for later. Output: three usable lines, rehearsed without contact or intimate detail.

      3. List questions that should be settled before any real relevant decision: boundaries, material
      health/prevention information, actual commitments, privacy expectations and consequences. Mark which
      are personal choices and which need qualified medical or legal information. Output: a question list,
      not a self-issued certificate of safety or a prescribed prevention method.

      4. Save your decisions before opening the [later packet](?resource=file-later-packet-md). Check
      whether the supplied conduct respects the original boundary. A renewed question after pressure is
      not automatically an ethical reset. Output: a correction wherever actions fail to match the decision.


      Do not evaluate success by how comfortable an observer feels with sexual discussion or how visibly
      enthusiastic someone appears. The inspectable skill here is recognizing permission limits and choosing
      respectful conduct. A fiction response shows reasoning in rehearsal, not actual sexual behavior
      or legal compliance.


      ### Supported and harder routes


      For support, use only A and B first, in writing or with communication aids, then return to pressure
      and capacity. A survivor need not disclose why they prefer fiction, omit a case or stop. For a harder
      fictional check, have someone agree to one activity while reserving a relevant health question;
      identify what remains unresolved without treating willingness as blanket permission.


      Real transfer is optional and consists of applying respectful communication only in a genuinely
      wanted adult context. It creates no sexual performance requirement and no intimate app evidence.
      If coercion, assault concerns or immediate danger are present, use suitable specialist, medical
      or safeguarding resources; do not practice with the coercive person as a condition of getting help.


      ### Source use


      [RAINN''s consent guidance, S04](https://rainn.org/share-the-facts/consent-101-respect-boundaries-and-building-trust/)
      informs the specificity, ongoing choice and pressure distinctions. It is specialist education, not
      a local legal ruling. The four cases, corrective task and no-contact format are original; they have
      not been validated as an assessment instrument.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Use the facts only; then [check answers](?check=practice-answers).


      1. An adult uses an established communication device to clearly agree to one specified activity
      and decline another. Does the device itself make the choice invalid or authorize both activities?

      2. A person says “I''m not sure” while their partner insists they already promised. What should
      happen immediately?

      3. Someone withdraws consent after an activity begins. The other person says stopping now would
      be unfair. Which obligation governs the next action?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Neither. Communication access does not itself establish incapacity, and specific agreement
      remains limited to what was actually chosen. Attend to understanding, voluntariness and the stated
      boundary; seek qualified guidance for genuine capacity or legal uncertainty instead of inferring
      it from disability.

      2. Do not proceed. A previous promise does not override present uncertainty, and insistence adds
      pressure. Allow refusal or space without bargaining; a desired outcome is not evidence of agreement.

      3. Stop. Consent is reversible, including after starting. No explanation, compensation or later
      substitute is owed as the price of stopping. Offer only welcome practical support, without making
      the person manage the other''s disappointment.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
