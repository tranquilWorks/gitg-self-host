  - stable_id: PRACTICE-COMP-1809-SEXUAL-ETHICS-AND-CONSENT-01-A2
    sequence: 2
    title: Practice asking and stopping in ordinary words
    instructions: 'Alone or with a willing adult role-play partner, rehearse a neutral question, a freely
      stated no and a changed-mind response. Practice answering no or stop with acknowledgment and stopping,
      not bargaining, sulking or asking for a justification. Use no touching in the rehearsal. Include
      a check-in that makes changing one’s mind easy rather than demanding repeated reassurance that the
      other person will continue.


      Observation checks: Asking refusal and withdrawal are rehearsed without contact; A no or stop receives
      immediate respectful acceptance; No reason persuasion or emotional penalty is demanded; The check-in
      preserves the ability to change one’s mind. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
