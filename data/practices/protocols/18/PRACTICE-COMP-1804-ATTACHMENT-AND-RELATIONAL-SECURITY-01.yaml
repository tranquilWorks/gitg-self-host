  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after the cue/story distinction and
      direct request.


      After the workshop, Morgan explains that 19:30 is unavailable but offers 19:50–20:00. Kai agrees;
      this fits Kai''s stated window. They speak for those ten minutes. Morgan says a short planned check-in
      is workable on this occasion but does not promise the same time for every future workshop. No ongoing
      schedule has been agreed.


      Kai did not send the five extra messages and did not impose retaliatory silence. Kai still feels
      some uncertainty afterward. That feeling does not erase the useful conduct, and the kept agreement
      does not prove a permanent change in attachment or the absence of all future problems.


      Record the counteroffer, Kai''s acceptance and the single completed check-in. The earlier 17:00
      nonresponse occurred within agreed unavailability, so it was not a broken check-in commitment. Future
      workshop arrangements need their own realistic agreement. A demand for location evidence or passwords
      would be a different action, not an improved version of this request. Repeated genuine breaches
      would also need honest attention rather than automatic self-blame.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Replace one reactive pattern with a direct, bounded request and a realistic agreement. Allow
      fifteen minutes to prepare, one naturally occurring nonurgent opportunity and ten minutes to review.
      This role-conditional practice is optional and for suitable voluntary adult relationships. Single
      life is legitimate; use the complete fiction if you have no appropriate partner or prefer not to
      attempt it live. It is not attachment diagnosis, therapy or a promise to change a relationship style.


      ### Notice behavior without assigning a type


      A bond can matter deeply and make uncertainty uncomfortable. Begin with the observable cue, then
      distinguish the story you attach to it, the feeling and the action impulse. A delayed reply is observable.
      “They are leaving me” is an interpretation unless other evidence supports it. Keeping that distinction
      does not mean every concern is imagined: broken agreements, deception or threatening conduct are
      real information.


      Pursuing can become repeated contact intended to force reassurance. Distancing can become withdrawal
      designed to avoid a needed conversation or make the other person chase. Testing creates a hidden
      task whose correct answer the partner does not know. Controlling restricts another''s choices or
      demands access to prove trust. Idealizing treats a partner as flawless or as the only possible source
      of security. Fear of abandonment may intensify these impulses, but fear does not authorize them.


      The alternative is not suppressing every need. A direct request identifies what would help and permits
      negotiation: “Could we agree when to check in after your shift?” differs from “If you cared, you
      would already know.” Consistency means keeping a feasible agreement or communicating a necessary
      change. Reassurance should be freely meant and bounded, not extracted through escalating demands
      for passwords, location access or constant availability.


      Self-regulation creates room to choose conduct. For an ordinary nonurgent cue, pause briefly in
      a way that is safe for you, orient to known facts and decide whether a conversation is needed. This
      is not punishment through silence or an instruction to ignore urgent responsibilities. State a boundary
      over your own behavior and capacity; do not disguise control of the other person as a boundary.


      ### Worked example


      Lena has not heard from a partner during a known work period. Lena notices the story “I no longer
      matter” and an urge to send many messages. After a brief pause, Lena waits for a suitable time and
      asks whether a short evening check-in could work on late-shift days. The partner can agree, propose
      another arrangement or decline. The request addresses a real wish while allowing the partner''s
      actual capacity to matter. If an agreed check-in is repeatedly missed, Lena can discuss reliability
      rather than explaining away all concern as personal insecurity.


      ### Complete fictional nonurgent situation


      Adult partners Kai and Morgan have agreed that Morgan will be unavailable during a workshop from
      15:00 to 18:00 on 6 October. They have not agreed to a reply before the workshop ends or to a check-in
      immediately at 18:00. At 16:00 Kai sends an ordinary nonurgent message. By 17:00 there is no reply.
      No emergency, threat or unexplained disappearance is supplied.


      Kai feels anxious, thinks “Morgan is pulling away,” and considers sending five more messages or
      deliberately ignoring Morgan later. Kai would like a predictable brief connection on workshop days.
      Kai is available from 19:30 to 20:00; Morgan''s evening availability is unknown. A possible request
      is a ten-minute check-in somewhere within that window, with a different arrangement allowed. No
      request or agreement exists yet.


      ### From cue to an explicit agreement


      1. Write four separate lines: cue, interpretation, feeling and impulse. Identify which of the six
      patterns the proposed extra messages or retaliatory silence might express, without diagnosing Kai
      or Morgan. Output: a behavior account that preserves the agreed unavailability and unknown motive.

      2. Choose a brief safe pause and a nonurgent time to communicate. Draft a direct request for a feasible
      check-in, including room for a counteroffer. State what Kai can do if no arrangement fits, such
      as making a separate evening plan and revisiting needs later. Output: a request and self-directed
      boundary, not a hidden test.

      3. Save that plan before opening the [later packet](?resource=file-later-packet-md). Record the
      exact agreement that follows, if any. In real practice, use the actual response rather than the
      answer you hoped to receive. Output: proposed, counteroffered, agreed or declined, with the timing
      made explicit.

      4. Compare later behavior with the agreement that actually existed. Notice both your own conduct
      and any kept, changed or missed commitment. Output: a limited review of request, consistency, reassurance
      and boundaries. One successful conversation does not establish cured anxiety or permanent security;
      one missed moment does not automatically establish abandonment.


      The exercise fails its purpose if an apparently calm request still demands proof through surveillance.
      Likewise, the learner should not be trained to tolerate every broken promise by regulating harder.
      A pattern of unmet needs may call for an honest discussion of fit, different support or a relationship
      decision.


      ### Support, challenge and real transfer


      For support, rehearse the four lines using only the fiction, write instead of speaking, or prepare
      a short request with a trusted appropriate helper. Do not disclose a partner''s private messages
      to obtain a label. If the pause itself increases distress, choose another safe grounding option
      or appropriate professional help rather than forcing a technique.


      For a harder fictional case, let the first proposed time be impossible. Practice accepting a genuine
      counteroffer while checking your own availability. Do not deliberately delay messages to provoke
      a reaction. For real transfer, wait for an ordinary opportunity, make one suitable request and review
      conduct across subsequent agreed occasions. Evidence of security concerns repeated reliability and
      felt experience, not a speed score or a permanent identity category.


      ### Sources and professional boundary


      [S11](https://pubmed.ncbi.nlm.nih.gov/25559192/) reports evidence favoring dimensional over categorical
      descriptions of adult attachment in its samples. It does not validate this exercise or diagnose
      either case person. The six behavior distinctions are canonical teaching, not six clinical types.
      [S13](https://www.thehotline.org/plan-for-safety/) supports individualized safety help. Threats,
      coercion or abuse require suitable support rather than a better reassurance ritual or compelled
      mutual discussion.


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.
      Preserve private content outside the application. See the scope and limits described in this guide,
      then attempt the [fresh cases](?attempt=practice-checks); a person''s dignity is never determined
      by attachment language.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A reply is absent during an agreed no-contact work period. The learner records “partner
      broke our promise.” What needs correction?

      2. Someone asks for continuous location access as reassurance and calls it a personal boundary.
      How should the request be assessed?

      3. A partner repeatedly misses an explicitly agreed check-in without notice. Must the learner treat
      concern as an irrational attachment story?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Compare the observation with the actual agreement: unavailability was expected, and no reply
      promise was broken on these facts. The feeling can still be real. A later direct request may be
      appropriate without inventing a breach.

      2. Calling a demand a boundary does not change its effect. Continuous access can become surveillance
      and coerced proof. Seek a voluntary, proportionate communication arrangement and use appropriate
      support if control or fear is present.

      3. No. Repeated breaches are relevant behavior. Regulate enough to choose a response, then discuss
      reliability, needs and fit or seek suitable support. The exercise must not convert all legitimate
      concerns into a defect in the learner.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
