  - stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01-A3
    sequence: 3
    title: Use the agreement once and review both people’s experience
    instructions: 'At the next ordinary opportunity, use your regulation step and follow the agreed contact
      pattern instead of sending a test or withdrawing to provoke pursuit. Record whether each person
      followed through and what changed in the interaction, without using the partner’s response as a
      worth score. If the agreement fails, discuss the specific failure or reconsider fit; do not silently
      increase monitoring. One cycle does not establish secure attachment.


      Observation checks: A natural opportunity is attempted without a relationship test; Follow-through
      is compared with the actual agreement; A missed agreement leads to clarification rather than monitoring;
      One interaction is not generalized into an attachment diagnosis or cure. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What did the direct request reveal that the test could not, and did the agreement
      support security without taking away either person’s autonomy?


      Examples: Supportive: The participant replaced repeated messages with an agreed check-in time and
      used the interval for an ordinary activity, then reviewed a missed contact directly.


      Mixed: The request was clear, but the proposed frequency exceeded the partner’s capacity and required
      renegotiation.


      Contradictory: The exercise became a demand for passwords, constant location access or proof of
      love.


      Inconclusive: An attachment label was assigned without changing any actual request, test or follow-through
      behavior.'
    expected_time: 15-25 minutes
    due_within_days: 10
