meaning_and_fit:
  purpose: Recognize a pursuing, distancing or testing reaction and use a clear request, self-regulation,
    reassurance and boundaries instead of trying to control a partner’s response.
  why_recommended: Recognize a pursuing, distancing or testing reaction and use a clear request, self-regulation,
    reassurance and boundaries instead of trying to control a partner’s response.
  claims:
  - statement: Recognize a pursuing, distancing or testing reaction and use a clear request, self-regulation,
      reassurance and boundaries instead of trying to control a partner’s response.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Attachment and relational security practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Attachment and relational security as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text, scheduled contact, a smaller request or individual support when
    emotional activation makes discussion difficult. Repeated threats, coercion or abuse require appropriate
    help, not better reassurance rituals. A fictional rehearsal remains a communication exercise only.
  opportunity_considerations: 'Default situation: a partner’s delayed reply triggers an urge to send repeated
    messages or withdraw to see whether they chase you. Use a private four-part note: cue, story, impulse
    and direct request. Choose an ordinary nonurgent context, not a real safety emergency.'
  prerequisites:
  - 'Default situation: a partner’s delayed reply triggers an urge to send repeated messages or withdraw
    to see whether they chase you. Use a private four-part note: cue, story, impulse and direct request.
    Choose an ordinary nonurgent context, not a real safety emergency.'
  dependencies: []
  safe_alternatives:
  - Use text, scheduled contact, a smaller request or individual support when emotional activation makes
    discussion difficult. Repeated threats, coercion or abuse require appropriate help, not better reassurance
    rituals. A fictional rehearsal remains a communication exercise only.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Attachment and relational security differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Attachment and relational
    security as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default situation: a partner’s delayed reply triggers an urge to send repeated messages or withdraw
    to see whether they chase you. Use a private four-part note: cue, story, impulse and direct request.
    Choose an ordinary nonurgent context, not a real safety emergency. Goal: Recognize a pursuing, distancing
    or testing reaction and use a clear request, self-regulation, reassurance and boundaries instead of
    trying to control a partner’s response. Scope: This is an ordinary adult relationship experiment,
    not attachment diagnosis or therapy. It does not require remaining in an unsafe relationship or treating
    legitimate concerns as personal insecurity. Time and effort: Fifteen minutes to map a pattern, one
    safe natural opportunity and a ten-minute follow-up. Adaptation: Use text, scheduled contact, a smaller
    request or individual support when emotional activation makes discussion difficult. Repeated threats,
    coercion or abuse require appropriate help, not better reassurance rituals. A fictional rehearsal
    remains a communication exercise only. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, scheduled contact, a smaller request or individual support when emotional
    activation makes discussion difficult. Repeated threats, coercion or abuse require appropriate help,
    not better reassurance rituals. A fictional rehearsal remains a communication exercise only.
  expected_burden: Fifteen minutes to map a pattern, one safe natural opportunity and a ten-minute follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Attachment and relational security protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Attachment and relational security action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, scheduled
    contact, a smaller request or individual support when emotional activation makes discussion difficult.
    Repeated threats, coercion or abuse require appropriate help, not better reassurance rituals. A fictional
    rehearsal remains a communication exercise only.
  actions:
  - stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01-A1
    sequence: 1
    title: Describe the reaction without assigning an attachment label
    instructions: 'Record the observable cue and distinguish it from the story, such as a delayed reply
      versus they will leave me. Notice possible pursuing, distancing, idealizing, testing or controlling
      behavior and the fear or need it may express. Name what would make the concern a real reliability
      or safety issue rather than assuming it is all in your head. Choose a brief safe regulation action
      that does not become punishment or indefinite avoidance.


      Observation checks: The cue is separated from the abandonment or rejection story; The actual impulse
      is named without a diagnostic label; Legitimate reliability or safety concerns remain possible;
      A regulation step avoids punishment and indefinite withdrawal. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01
      action_stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01-A1
      competency_stable_id: '18.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1804_a1_primary
      transfer_disposition: context_bound
      measurements:
