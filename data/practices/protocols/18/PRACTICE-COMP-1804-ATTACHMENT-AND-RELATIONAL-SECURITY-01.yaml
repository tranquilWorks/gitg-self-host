        criteria:
        - the_cue_is_separated_from_the_abandonment_or_rejection_story
        - the_actual_impulse_is_named_without_a_diagnostic_label
        - legitimate_reliability_or_safety_concerns_remain_possible
        - a_regulation_step_avoids_punishment_and_indefinite_withdrawal
      - measurement_id: c1804_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
