  - stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01-A2
    sequence: 2
    title: Make a direct request that the other person can negotiate
    instructions: 'At an appropriate time, say what would help in concrete terms: When plans are uncertain,
      could we agree when to check in? Ask what communication is realistic for the other person and state
      your own limit. Offer reassurance when freely meant, but do not promise constant access, demand
      passwords or require proof of affection. Agree a small predictable contact practice only if both
      people genuinely want it.


      Observation checks: The request names a concrete need rather than a hidden test; The partner can
      negotiate timing and availability; Reassurance is distinct from constant access or surveillance;
      Any contact agreement is mutually chosen and realistic. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01
      action_stable_id: PRACTICE-COMP-1804-ATTACHMENT-AND-RELATIONAL-SECURITY-01-A2
      competency_stable_id: '18.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
