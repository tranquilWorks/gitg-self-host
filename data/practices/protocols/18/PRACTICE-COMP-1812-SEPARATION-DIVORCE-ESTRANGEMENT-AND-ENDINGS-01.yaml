        expected: true
  - stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01-A2
    sequence: 2
    title: Choose a safe communication and transition route
    instructions: 'For the low-risk fictional case, draft a clear statement that does not leave false
      hope for the sake of avoiding discomfort, and specify the next practical discussion separately.
      Choose timing, medium and support appropriate to safety; direct conversation is not mandatory where
      abuse or retaliation is possible. Agree or seek professional help with handoffs, belongings and
      dependent arrangements, and avoid using children, friends or public posts as messengers or leverage.


      Observation checks: The message is clear without unnecessary humiliation or false hope; Communication
      mode follows safety rather than etiquette alone; Practical handoffs are separated from emotional
      argument; Dependents and third parties are not used as leverage or messengers. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01
      action_stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01-A2
      competency_stable_id: '18.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1812_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1812_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_message_is_clear_without_unnecessary_humiliation_or_false_hope
        - communication_mode_follows_safety_rather_than_etiquette_alone
        - practical_handoffs_are_separated_from_emotional_argument
        - dependents_and_third_parties_are_not_used_as_leverage_or_messengers
      - measurement_id: c1812_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
