        expected: true
  - stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01-A3
    sequence: 3
    title: Take one supported step and make room for grief without retaliation
    instructions: 'Carry out one safe step within your authority, such as obtaining legal advice, confirming
      an agreed property handoff or contacting a specialist advocate. Record what actually occurred and
      what remains pending; drafting an ending is not the same as completing one. Plan ordinary support
      and space for grief without monitoring the other person, publishing private details or creating
      new contact to relieve your distress. Review whether dependents’ immediate needs remain covered.


      Observation checks: A safe authorized step or support contact actually occurs; Planning legal consultation
      and completed separation remain distinct; Grief support does not become surveillance or unwanted
      contact; Dependent needs are checked through the transition. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What became clearer and safer, and which responsibilities remained real even after
      the emotional relationship changed?


      Examples: Supportive: The adults separated the breakup message from lease and care questions, sought
      appropriate advice and completed one agreed practical handoff.


      Mixed: The message was drafted, but safety and housing questions remained unresolved, so direct
      contact was deferred for specialist support.


      Contradictory: The ending involved threats, asset deprivation, public humiliation or using a dependent
      to punish the other person.


      Inconclusive: A clear emotional decision was treated as if it automatically settled legal, housing
      and caregiving responsibilities.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01
      action_stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01-A3
