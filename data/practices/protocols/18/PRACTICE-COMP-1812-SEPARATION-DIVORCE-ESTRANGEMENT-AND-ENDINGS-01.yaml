    kind: concept
    title: Learn and try
    body: 'Map the responsibilities that remain when a relationship ends or changes, then choose one safe,
      authorized next step. Allow thirty minutes for the map, suitable consultation if needed, and the
      actual step. This optional adult exercise does not tell you to leave, stay or make contact. Single
      life requires no ending exercise. The complete fiction is sufficient when real circumstances are
      private, unsafe or legally complex.


      ### An emotional decision and practical obligations have different timelines


      A separation can change contact, residence or the relationship''s meaning. Divorce is a legal process
      whose requirements depend on jurisdiction. Estrangement may involve limited or no contact with a
      partner or family member. Grief can continue after any of these decisions. Calling an ending final
      emotionally does not by itself dissolve a lease, financial duty, caregiving role or court order.


      Honesty means making the relevant decision as clear as the situation permits. If a decision is made,
      vague promises of eventual reunion can prolong confusion. Yet clarity does not require a face-to-face
      conversation with someone unsafe, a public explanation or repeated answers to demands. The medium
      should fit safety, access and actual obligations. Qualified support may help determine what communication
      is appropriate.


      Separate immediate safety, communication, housing and property, money, dependents, privacy, grief
      and support. A responsibility map is a way to identify questions and owners; it is not a legal settlement.
      Do not divide assets, change locks, withhold necessary funds, interrupt care or alter orders based
      on this worksheet. Dependents are people with needs, not leverage or messengers. Friends should
      not be recruited to pressure an ex-partner into contact.


      Protection from unnecessary cruelty includes avoiding retaliatory exposure of private material,
      humiliation and deliberate ambiguity. It does not mean suppressing truthful safeguarding reports
      or staying available for unwanted contact. Grief may call for private support and time; monitoring
      another person''s location or social life is not a required part of processing it.


      ### Worked example


      Two adults decide to stop dating but share a prepaid course registration. They send a clear relationship-ending
      message and separately ask the provider about transfer options. The message can settle their intended
      romantic status while the refund question remains unanswered. A drafted provider email is preparation;
      a sent inquiry is an action; a received policy answer supplies information; an actual refund is
      a different event. Collapsing these states produces false closure.


      ### Supplied fictional task


      Adult partners Rowan and Avery have mutually decided to separate. They share a rental home with
      a lease whose relevant termination provisions have not yet been checked. They own personal belongings
      and a jointly purchased table; no ownership settlement is supplied. They also share an agreed weekly
      support visit for Avery''s adult relative, who expects a visit on 8 October. The relative''s preferences
      and any replacement support have not been discussed.


      Both agree that practical arrangements can be discussed by email, and neither has supplied a threat
      or desire for reconciliation. Rowan can spend twenty minutes making one information inquiry on 5
      October. Avery wants the next household planning conversation on 9 October. No one has authority
      in this case to declare the lease ended, give away the table, withdraw the relative''s support or
      decide the relative''s needs. There are no children in the supplied case, but the same no-leverage
      boundary applies to any dependents in real transfer.


      ### Build a responsibility map and act within it


      1. Create the nine headings above. Put the mutual separation under communication; lease uncertainty
      under housing; table under property; the 8 October visit under continuing care; grief and support
      as private needs rather than arguments against the decision. Output: known facts, unresolved questions
      and deadlines, with unprovided details marked unknown.

      2. Draft a clear, non-retaliatory statement of the relationship decision and a separate practical
      agenda. Preserve the chosen email route. Do not promise reunion to make the message easier or use
      it to settle unexamined legal questions. Output: a concise communication draft and a dated logistics
      agenda.

      3. Choose one authorized inquiry within Rowan''s twenty minutes: ask the appropriate housing adviser
      or provider how to obtain the lease information, without purporting to terminate it. Identify a
      qualified local legal route if needed. Output: the question, recipient type, authority limit and
      status. A booking alone cannot resolve the lease.

      4. Identify the care continuity problem before 8 October. The existing obligation is not canceled
      by the separation or by scheduling a household talk on 9 October. Contact must be through an appropriate
      authorized route, with the relative''s agency respected. Output: a safe handoff question and a named
      responsible party only if actually agreed.

      5. Save your map, then open the [later packet](?resource=file-later-packet-md). Mark each item as
      done, agreed future action, information pending or unresolved. Output: an updated map that does
      not declare complete closure from one successful email.


      ### Adjust and transfer carefully


      For support, use only housing and care rows in fiction and ask a reader to identify the earlier
      deadline. For a harder scenario, make direct contact unsafe and choose an appropriate professional
      or authorized intermediary route; do not force mediation or reveal a location. No exercise should
      require breaching an order or seeking a confrontation.


      For real transfer, a small useful action might be an actual confidential inquiry, gathering your
      own authorized records, or arranging support for grief. Use a safe channel and suitable qualified
      guidance for consequential decisions. Document only the action status in learning notes; keep case
      details private. If the action is only drafted or cannot safely proceed, say so. Ending contact
      can be legitimate while specific obligations still need a protected, authorized route.


      ### Source use


      [GOV.UK''s divorce overview, S08](https://www.gov.uk/divorce) illustrates that legal ending and
      arrangements for money, housing and children are separate matters. It describes England and Wales,
      not the user''s presumed jurisdiction. No eligibility rule, deadline or legal conclusion is transferred.
      [Safety planning guidance, S14](https://www.thehotline.org/plan-for-safety/) supports individualized
      help where contact is unsafe. The map and case are original.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Try before [reading answers](?check=practice-answers).


      1. A person has sent a clear ending message and therefore stops an essential care task without an
      accepted handoff. What remains wrong despite the clear communication?

      2. Direct contact may expose someone to retaliation. Must they meet face to face to end the relationship
      honestly?

      3. A housing adviser acknowledges an inquiry but gives no substantive answer. Can the learner record
      the lease as ended or the issue as legally resolved?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Emotional clarity does not dissolve actual care responsibilities. Arrange an appropriate
      safe, authorized continuity route with the affected person''s needs and agency considered. An offer,
      assumption or message alone is not a completed handoff.

      2. No. Honesty does not require unsafe access. Suitable professional support, an authorized intermediary
      or another safe lawful route may be appropriate. Do not require mediation, reveal a location or
      violate an order to satisfy a conversational ideal.

      3. No. Record an inquiry and acknowledgment only. Lease status and relevant duties remain unresolved
      until appropriate information and authorized action establish otherwise. Do not invent legal advice
      from an administrative response.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
