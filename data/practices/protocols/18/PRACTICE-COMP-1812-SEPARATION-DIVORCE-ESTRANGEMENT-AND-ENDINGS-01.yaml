meaning_and_fit:
  purpose: End or restructure an adult relationship without unnecessary ambiguity, cruelty or retaliation
    while protecting dependents and honoring legal and practical responsibilities.
  why_recommended: End or restructure an adult relationship without unnecessary ambiguity, cruelty or
    retaliation while protecting dependents and honoring legal and practical responsibilities.
  claims:
  - statement: End or restructure an adult relationship without unnecessary ambiguity, cruelty or retaliation
      while protecting dependents and honoring legal and practical responsibilities.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Separation, divorce, estrangement, and endings practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Separation, divorce, estrangement, and endings as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a qualified mediator only where appropriate and safe, legal representation,
    accessible communication or specialist safety planning. Do not contact an unsafe person or change
    a court-ordered arrangement based on this exercise. Immediate danger requires appropriate emergency
    help.
  opportunity_considerations: 'Use a fictional case unless a real ending is already being considered safely:
    two adults decide not to continue a relationship but share a lease, belongings and care responsibilities.
    Prepare headings for safety, communication, housing or property, money, dependents, privacy, grief
    and support. Do not alter assets, access or care arrangements as a practice stunt.'
  prerequisites:
  - 'Use a fictional case unless a real ending is already being considered safely: two adults decide not
    to continue a relationship but share a lease, belongings and care responsibilities. Prepare headings
    for safety, communication, housing or property, money, dependents, privacy, grief and support. Do
    not alter assets, access or care arrangements as a practice stunt.'
  dependencies: []
  safe_alternatives:
  - Use a qualified mediator only where appropriate and safe, legal representation, accessible communication
    or specialist safety planning. Do not contact an unsafe person or change a court-ordered arrangement
    based on this exercise. Immediate danger requires appropriate emergency help.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Separation, divorce, estrangement, and endings differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Separation, divorce, estrangement,
    and endings as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional case unless a real ending is already being considered safely: two adults decide
    not to continue a relationship but share a lease, belongings and care responsibilities. Prepare headings
    for safety, communication, housing or property, money, dependents, privacy, grief and support. Do
    not alter assets, access or care arrangements as a practice stunt. Goal: End or restructure an adult
    relationship without unnecessary ambiguity, cruelty or retaliation while protecting dependents and
    honoring legal and practical responsibilities. Scope: This is a planning and support exercise, not
    advice to end a specific relationship or a substitute for legal, domestic-abuse or clinical guidance.
    A safe ending may not involve direct contact. Time and effort: Thirty minutes to map responsibilities,
    one qualified or trusted support consultation when needed and one safe bounded next step. Adaptation:
    Use a qualified mediator only where appropriate and safe, legal representation, accessible communication
    or specialist safety planning. Do not contact an unsafe person or change a court-ordered arrangement
    based on this exercise. Immediate danger requires appropriate emergency help. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a qualified mediator only where appropriate and safe, legal representation,
    accessible communication or specialist safety planning. Do not contact an unsafe person or change
    a court-ordered arrangement based on this exercise. Immediate danger requires appropriate emergency
    help.
  expected_burden: Thirty minutes to map responsibilities, one qualified or trusted support consultation
    when needed and one safe bounded next step.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Separation, divorce, estrangement, and endings protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Separation, divorce, estrangement, and endings action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a qualified
    mediator only where appropriate and safe, legal representation, accessible communication or specialist
    safety planning. Do not contact an unsafe person or change a court-ordered arrangement based on this
    exercise. Immediate danger requires appropriate emergency help.
  actions:
  - stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01-A1
    sequence: 1
    title: Separate the relationship decision from obligations that continue
    instructions: 'State what is ending or changing and what remains your responsibility. Identify immediate
      safety concerns, dependent care, shared housing or property, financial commitments and legal questions
      that require qualified local advice. Distinguish a personal boundary from a right to remove someone’s
      access, empty shared resources or withhold essential care. Do not assume that ending emotional commitment
      automatically resolves practical or legal obligations.


      Observation checks: The ending is distinguished from continuing responsibilities; Safety dependents
      housing property and financial questions are considered; Legal uncertainties are assigned to qualified
      local advice; No unilateral deprivation of care or resources is treated as a relationship boundary.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01
      action_stable_id: PRACTICE-COMP-1812-SEPARATION-DIVORCE-ESTRANGEMENT-AND-ENDINGS-01-A1
      competency_stable_id: '18.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1812_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1812_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_ending_is_distinguished_from_continuing_responsibilities
        - safety_dependents_housing_property_and_financial_questions_are_considered
        - legal_uncertainties_are_assigned_to_qualified_local_advice
        - no_unilateral_deprivation_of_care_or_resources_is_treated_as_a_relationship_boundary
      - measurement_id: c1812_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1812_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
