  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Rowan sends the housing-information inquiry on 5 October and receives an acknowledgment, but no
      substantive lease advice. Both adults exchange the clear separation statement without adding a promise
      of reunion. Their 9 October planning conversation remains scheduled, not completed. The table has
      not been divided or sold.


      Before 8 October, Avery speaks with the relative through the existing authorized contact route.
      The relative wants the usual visit. Avery confirms they can perform that visit, Rowan acknowledges
      the handoff, and Avery completes it on 8 October. The relative says the visit met that day''s practical
      need. No arrangement has yet been made for subsequent weeks.


      Credit the inquiry, clear communication and one completed care visit. Do not mark lease obligations
      resolved, the planning conversation held, the table allocated or future care covered. The care handoff
      is supported by an accepted owner and performance; the next week still requires attention. Identify
      the next unresolved question and its proper authority. Do not infer that grief has ended merely
      because the communication was civil.'
