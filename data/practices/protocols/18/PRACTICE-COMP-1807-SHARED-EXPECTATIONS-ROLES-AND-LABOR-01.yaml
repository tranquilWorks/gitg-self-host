  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Dani and Jules accept the proposed delivery-check role. Dani places an order costing 48 units. At
      16:40 Friday, Dani checks the confirmation, finds the delivery window is 16:00–17:00 Saturday, and
      tells Jules. That misses the agreed 15:00 latest arrival. They agree to cancel and use ingredients
      already available plus an authorized 9-unit local purchase by Dani before 17:00. The cancellation
      is confirmed without charge; do not count 48 as spent in addition to 9.


      The meal happens and Jules cleans the kitchen. Dani spends 55 minutes rather than the offered 45.
      Jules spends 60. Jules also sends two reminders asking whether the replacement menu is final; the
      packet does not supply their duration. Both say the simpler meal was welcome. Dani wants next time''s
      confirmation deadline earlier, and Jules wants one explicit final-menu message.


      Calculate the ten-minute overrun and 51 units remaining. Keep unknown reminder time unknown. Record
      the successful adaptation and the remaining coordination burden separately. An earlier deadline
      and final-menu message are proposed revisions, not an already successful second cycle.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Make the work behind one ordinary shared responsibility visible, agree who owns each part,
      and examine one full cycle. Allow twenty minutes to map it, twenty for a willing conversation, and
      time for the task itself. This optional adult-partnership route does not make partnership a requirement;
      single life is equally compatible with dignity. Use the fiction if no suitable shared arrangement
      exists.


      ### See the whole responsibility


      Doing the visible task is only part of responsibility. Someone notices it is needed, discovers constraints,
      chooses among options, obtains resources, performs it, checks completion and handles surprises.
      “Tell me what to do” can leave the planning and monitoring with the person already carrying them.
      Ownership must say which of these parts is included and when to ask for help.


      Negotiation spans money, home, time, sex, family, career, caregiving, privacy and decision authority.
      These areas interact without becoming interchangeable currencies. Working more hours does not purchase
      a partner''s sexual consent. Paying a bill does not automatically authorize reading messages. Caregiving
      obligations cannot be dropped merely to demonstrate unfairness. Identify which decisions are shared,
      personal, delegated or constrained by an existing duty or qualified legal arrangement.


      Fairness may involve unequal minutes because people have different availability, capacity or preferences.
      It still requires informed willingness, a visible burden and an opportunity to revise. Gender, income,
      disability or being “better at organizing” does not silently assign permanent service. Notice whose
      rest, career flexibility and social relationships absorb the hidden cost. Someone''s voluntary preference
      today is not their irrevocable role.


      A useful agreement names a result, limits, resources, ownership and change route. “Own the meal”
      is incomplete if the person lacks permission to spend the budget or ask guests about dietary needs.
      “You can spend up to the agreed amount and ask only the necessary food question” provides bounded
      authority. It does not authorize collecting private health histories.


      ### Worked example


      Lee agrees to arrange a grocery order but assumes Ari will supply a list. Ari thinks arranging includes
      checking what is needed. The groceries arrive, yet Ari spent twenty minutes planning and sent three
      reminders. Calling the task fully transferred would hide that labor. They can acknowledge the order
      was placed while renegotiating whether Lee owns stock checking and scheduling. Blame is less useful
      than a precise interface.


      ### Supplied fictional task


      Adult partners Dani and Jules will host two relatives for a simple meal on 10 October. The total
      agreed food budget is 60 units. Dani offers 45 minutes on Friday; Jules offers 60 on Saturday. They
      agree to ask guests only about food requirements relevant to the meal, without storing medical details.
      Both want a modest visit and neither has agreed to elaborate decoration.


      Dani offers to check ingredients, ask the food question, select a menu within budget and order supplies.
      Jules offers to prepare the meal, welcome the guests and clean the kitchen afterward. The guests
      leave at 18:30. A delivery must arrive by Saturday 15:00 to allow preparation. The supplier''s delivery
      confirmation is not yet available. No one has yet agreed who will track it or handle a delay. Dani
      also wants uninterrupted Friday work time after 17:00; Jules cannot leave home to collect groceries
      on Saturday.


      ### Negotiate and run a complete cycle


      1. Make nine headings for the scope areas. Under home, time, money and family put the relevant meal
      facts. Mark sex, career, caregiving and privacy as no new agreement or private where appropriate,
      while noting Dani''s existing work boundary. Output: the applicable decisions and explicitly unassigned
      areas, without forcing disclosure in every category.

      2. Break the meal into noticing, constraints, choices, supplies, execution, checking and cleanup.
      Attach each to a willing owner and feasible window. Count the unassigned delivery check rather than
      assuming Dani will remember. Output: a responsibility map with one visible gap.

      3. Write a proposal that closes that gap with permission: Dani can check delivery before 17:00 Friday
      and tell Jules the result; if it cannot be confirmed, both choose an available simpler menu within
      budget. This is a proposal until agreed. Include a completion signal and a way to renegotiate reduced
      capacity. Output: a bounded whole-task agreement, not a command to rescue the meal at any cost.

      4. Save the agreement and open the [later packet](?resource=file-later-packet-md). Trace what each
      person actually did, including reminders and unexpected coordination. Calculate actual spending
      and remaining budget without interpreting money saved as proof of fairness. Output: one-cycle review
      and a specific revision for the next event.


      A successful meal can coexist with an unfair handoff. Equally, asking one agreed clarification is
      not proof that someone failed at ownership. Check the agreed scope and actual burden. If the task
      exceeded either person''s offered time, record that rather than silently resetting the estimate
      to make the plan look successful.


      ### Adapt and transfer


      For support, choose a simpler shared task with three parts and use a visible list, voice note or
      accessible reminder system. The tool should support the agreed owner, not make the other person
      the permanent notification service. For a harder fictional attempt, remove the delivery option and
      require explicit renegotiation; do not assign collection to Jules against the stated constraint.


      For real transfer, select a low-stakes responsibility both want to revisit. Agree authority and
      resources before acting, observe one actual cycle, and invite each person''s view of hidden effort.
      Keep only a minimal task-level record. Revisit recurring patterns over time before claiming the
      overall division is fair. Formal financial, employment or care responsibilities may require qualified
      advice and cannot be rewritten through a household worksheet.


      ### Source use


      [Daminger, S02](https://journals.sagepub.com/doi/abs/10.1177/0003122419859007) distinguishes cognitive
      household work from visible execution. The inspected empirical abstract informs the attention to
      planning and monitoring, not a universal distribution by gender or a validated fairness score. The
      meal, numbers and ownership map are original exercises.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt first; then read [answers](?check=practice-answers).


      1. One partner cooks while the other plans every menu, checks supplies and sends reminders. Is “we
      split meal work equally because we alternate cooking” established?

      2. A higher earner offers to pay more if their partner shares all private messages. Can this be
      recorded as ordinary fair labor negotiation?

      3. A person owns a task but loses the necessary time to illness. What distinguishes responsible
      renegotiation from assuming the other person will silently take over?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Alternating visible cooking says little about planning and monitoring. Map the entire
      cycle and each person''s experience before judging fairness. Equal minutes are not mandatory, but
      invisible labor cannot be counted as zero.

      2. No. Financial contribution does not create an entitlement to surveillance. Privacy and freedom
      from coercion need their own boundaries; decline the proposed exchange and consider appropriate
      support if pressure or control is present. Agreement language alone cannot make coercion fair.

      3. Identify the changed capacity early where feasible, state what remains, and seek an explicit
      accepted alternative with resources and limits. An unaccepted request is not a handoff. Essential
      care needs a safe authorized continuity route, not withdrawal as a lesson.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
