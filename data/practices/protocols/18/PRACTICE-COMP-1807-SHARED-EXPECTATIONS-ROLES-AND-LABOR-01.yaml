  - stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01-A2
    sequence: 2
    title: Agree an end-to-end owner and fair support conditions
    instructions: 'Choose who owns each complete part, what support is available, the budget or resource
      limit and what done means. For example, one person may own guest coordination and another preparation,
      with cleanup shared by an agreed time. State how either person can renegotiate if work or care demands
      change. No agreement about chores creates entitlement to sex, access to devices or control over
      the other person’s private decisions.


      Observation checks: Ownership includes noticing deciding and completing the agreed part; Resources
      support and done criteria are explicit; Changed capacity has a renegotiation route; Personal consent
      and privacy are not traded for task contribution. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01
      action_stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01-A2
      competency_stable_id: '18.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
