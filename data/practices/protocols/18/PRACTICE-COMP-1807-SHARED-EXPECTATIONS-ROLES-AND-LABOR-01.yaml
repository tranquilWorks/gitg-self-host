  - stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01-A3
    sequence: 3
    title: Run one cycle and review invisible work and fairness
    instructions: 'Carry out the agreed meal or another actual shared task. Afterward compare what each
      person did with the intended division, including reminders, emotional coordination and last-minute
      rescue. Ask whether the arrangement felt workable and fair given capacity rather than requiring
      identical minutes. Revise one unclear interface or unassigned step and record the next review trigger.


      Observation checks: A full task cycle occurs; Reminders coordination and rescue work are included
      in the comparison; Fairness considers capacity rather than identical units alone; One unclear responsibility
      is revised for the next cycle. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Who carried the work of noticing and coordinating, and what did the actual cycle reveal
      that the original division of chores concealed?


      Examples: Supportive: The partners assigned guest coordination, preparation and cleanup explicitly,
      then discovered and reassigned the hidden task of confirming dietary needs.


      Mixed: Visible chores were balanced, but one person still had to remind everyone and the ownership
      agreement was revised.


      Contradictory: A person used greater income or completed chores to claim sexual access or control
      over the partner’s privacy.


      Inconclusive: Responsibilities were discussed in general terms without an owner, resource limit,
      complete cycle or review.'
