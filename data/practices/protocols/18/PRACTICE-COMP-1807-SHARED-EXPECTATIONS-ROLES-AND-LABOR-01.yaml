meaning_and_fit:
  purpose: Negotiate roles, resources, privacy and decision authority so that a shared task is not silently
    assigned through stereotype, resentment or default availability.
  why_recommended: Negotiate roles, resources, privacy and decision authority so that a shared task is
    not silently assigned through stereotype, resentment or default availability.
  claims:
  - statement: Negotiate roles, resources, privacy and decision authority so that a shared task is not
      silently assigned through stereotype, resentment or default availability.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Shared expectations, roles, and labor practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Shared expectations, roles, and labor as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use writing, a smaller task or external support when illness, disability or
    care demands constrain contribution. People with unequal capacity retain equal dignity. Formal financial,
    legal or care obligations should be clarified through appropriate qualified advice.
  opportunity_considerations: 'Default task: arranging a shared meal for visiting relatives. Use nine
    headings to surface connected expectations: money, home, time, sex or intimacy boundaries, family,
    career, caregiving, privacy and decision authority. Mark irrelevant or private areas as not part of
    this task rather than forcing disclosure.'
  prerequisites:
  - 'Default task: arranging a shared meal for visiting relatives. Use nine headings to surface connected
    expectations: money, home, time, sex or intimacy boundaries, family, career, caregiving, privacy and
    decision authority. Mark irrelevant or private areas as not part of this task rather than forcing
    disclosure.'
  dependencies: []
  safe_alternatives:
  - Use writing, a smaller task or external support when illness, disability or care demands constrain
    contribution. People with unequal capacity retain equal dignity. Formal financial, legal or care obligations
    should be clarified through appropriate qualified advice.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Shared expectations, roles, and labor differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Shared expectations, roles,
    and labor as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default task: arranging a shared meal for visiting relatives. Use nine headings to surface connected
    expectations: money, home, time, sex or intimacy boundaries, family, career, caregiving, privacy and
    decision authority. Mark irrelevant or private areas as not part of this task rather than forcing
    disclosure. Goal: Negotiate roles, resources, privacy and decision authority so that a shared task
    is not silently assigned through stereotype, resentment or default availability. Scope: This is a
    voluntary adult partnership agreement on an ordinary task. Sexual consent, personal medical decisions,
    legal rights and essential care are not chores to allocate or barter. Time and effort: Twenty minutes
    to map expectations, a twenty-minute discussion and a review after one complete task cycle. Adaptation:
    Use writing, a smaller task or external support when illness, disability or care demands constrain
    contribution. People with unequal capacity retain equal dignity. Formal financial, legal or care obligations
    should be clarified through appropriate qualified advice. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, a smaller task or external support when illness, disability or care
    demands constrain contribution. People with unequal capacity retain equal dignity. Formal financial,
    legal or care obligations should be clarified through appropriate qualified advice.
  expected_burden: Twenty minutes to map expectations, a twenty-minute discussion and a review after one
    complete task cycle.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Shared expectations, roles, and labor protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Shared expectations, roles, and labor action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    a smaller task or external support when illness, disability or care demands constrain contribution.
    People with unequal capacity retain equal dignity. Formal financial, legal or care obligations should
    be clarified through appropriate qualified advice.
  actions:
  - stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01-A1
    sequence: 1
    title: Map the visible task and its hidden decisions
    instructions: 'List noticing the need, checking availability, deciding the menu, confirming dietary
      information with guests, obtaining supplies, preparing and cleaning up. Identify who currently carries
      each step and who has authority over cost, invitation and private information. Scan the nine expectation
      areas for a relevant conflict, such as work time or family pressure, without assuming gender or
      income determines responsibility.


      Observation checks: The task includes planning and follow-through rather than only execution; Current
      owners and decision authority are visible; Relevant expectation areas and explicit nonapplicability
      are recorded; Roles are not assigned from gender income or default availability. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01
      action_stable_id: PRACTICE-COMP-1807-SHARED-EXPECTATIONS-ROLES-AND-LABOR-01-A1
      competency_stable_id: '18.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
