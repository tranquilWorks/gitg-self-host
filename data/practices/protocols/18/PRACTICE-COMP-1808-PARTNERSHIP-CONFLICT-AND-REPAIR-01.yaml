meaning_and_fit:
  purpose: Separate the immediate rupture from a recurring pattern, acknowledge harm and test a concrete
    change rather than equating an apology or renewed warmth with repair.
  why_recommended: Separate the immediate rupture from a recurring pattern, acknowledge harm and test
    a concrete change rather than equating an apology or renewed warmth with repair.
  claims:
  - statement: Separate the immediate rupture from a recurring pattern, acknowledge harm and test a concrete
      change rather than equating an apology or renewed warmth with repair.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Partnership conflict and repair practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Partnership conflict and repair as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing or an appropriate qualified professional when both people freely
    agree and the setting is safe. Do not pursue a joint repair session with an abusive person as a requirement
    for leaving or seeking help. A fictional case tests repair reasoning only.
  opportunity_considerations: 'Default rupture: one partner repeatedly changes a shared plan without telling
    the other. Prepare a factual event record, the effect, your own contribution if any, the requested
    repair and a realistic notification change. Do not collect a dossier of every past mistake.'
  prerequisites:
  - 'Default rupture: one partner repeatedly changes a shared plan without telling the other. Prepare
    a factual event record, the effect, your own contribution if any, the requested repair and a realistic
    notification change. Do not collect a dossier of every past mistake.'
  dependencies: []
  safe_alternatives:
  - Use writing or an appropriate qualified professional when both people freely agree and the setting
    is safe. Do not pursue a joint repair session with an abusive person as a requirement for leaving
    or seeking help. A fictional case tests repair reasoning only.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Partnership conflict and repair differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Partnership conflict and repair
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default rupture: one partner repeatedly changes a shared plan without telling the other. Prepare
    a factual event record, the effect, your own contribution if any, the requested repair and a realistic
    notification change. Do not collect a dossier of every past mistake. Goal: Separate the immediate
    rupture from a recurring pattern, acknowledge harm and test a concrete change rather than equating
    an apology or renewed warmth with repair. Scope: Use a safe adult relationship and an ordinary disagreement.
    Abuse, intimidation and coercive control require specialist safety support, not a mutual communication
    exercise or pressure to forgive. Time and effort: Fifteen minutes to prepare, a twenty-minute repair
    conversation and a review at the next comparable opportunity. Adaptation: Use writing or an appropriate
    qualified professional when both people freely agree and the setting is safe. Do not pursue a joint
    repair session with an abusive person as a requirement for leaving or seeking help. A fictional case
    tests repair reasoning only. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing or an appropriate qualified professional when both people freely agree
    and the setting is safe. Do not pursue a joint repair session with an abusive person as a requirement
    for leaving or seeking help. A fictional case tests repair reasoning only.
  expected_burden: Fifteen minutes to prepare, a twenty-minute repair conversation and a review at the
    next comparable opportunity.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Partnership conflict and repair protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Partnership conflict and repair action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing
    or an appropriate qualified professional when both people freely agree and the setting is safe. Do
    not pursue a joint repair session with an abusive person as a requirement for leaving or seeking help.
    A fictional case tests repair reasoning only.
  actions:
  - stable_id: PRACTICE-COMP-1808-PARTNERSHIP-CONFLICT-AND-REPAIR-01-A1
    sequence: 1
    title: Describe the rupture and stop the escalation loop
    instructions: 'Name the specific changed plan and its effect without expanding immediately to always
      or never. Identify the repeated sequence if there is evidence for one, including the cue that leads
      to accusation, defense or withdrawal. Use a pause with a return time when needed and check whether
      both people can discuss the issue safely. Distinguish a small bid for connection from a demand to
      ignore the harm.


      Observation checks: The event and effect are specific; A recurring sequence is based on observations
      rather than a global accusation; Escalation is paused with a return or safe ending; Warmth is not
      used to erase the substantive issue. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1808-PARTNERSHIP-CONFLICT-AND-REPAIR-01
      action_stable_id: PRACTICE-COMP-1808-PARTNERSHIP-CONFLICT-AND-REPAIR-01-A1
      competency_stable_id: '18.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
