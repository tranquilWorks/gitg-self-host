  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      On 4 October Alex acknowledges the missed notification and its effect without blaming Imani. Alex
      offers 12 units for the taxi; Imani accepts and the payment occurs. Both agree to the notification-and-confirmation
      plan for shared pickups. Imani says this is a start and does not say trust is restored.


      On 9 October Alex again changes the ride, sends a message at 17:35, then leaves at 17:40 without
      a reply. Imani reads the message at 17:50, before leaving home, so no station wait or taxi cost
      occurs. Alex says the absence of harm proves the new system worked. Imani points out that confirmation
      was part of the agreement. They have not yet chosen a different arrangement.


      Distinguish completed acknowledgment, actual restitution, a notification sent, missing confirmation
      and reduced practical harm. The outcome does not erase the incomplete agreed behavior. Write a review
      that keeps the second relevant failure visible without asserting motives or requiring equal blame.
      A possible decision is to stop relying on shared pickups until a feasible arrangement is agreed;
      it is a proposal, not a completed agreement in this packet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Practice distinguishing an apology, an immediate repair and changed behavior at the next relevant
      opportunity. Allow fifteen minutes to prepare, up to twenty for a welcome adult conversation, and
      a later review. The relationship is optional; single life and declining a conversation are legitimate.
      Use supplied fiction when a live attempt is unwanted, unsafe or unavailable. This is not a requirement
      to reconcile.


      ### Identify the rupture rather than build a prosecution


      A conflict account needs an event, an effect and a question that can be answered. “You changed Saturday''s
      plan without telling me; I waited and missed my other option” is more workable than “you never care.”
      Specificity does not require downplaying repeated harm. A pattern can be named through several actual
      occasions without a dossier of motives or a diagnosis.


      Escalation often changes what people can hear. Accusation may invite defense, defense more accusation,
      and withdrawal further pursuit. Describing that sequence does not mean both people caused equal
      harm. A pause can interrupt it when it includes a safe return arrangement, such as “I can resume
      tomorrow at ten.” A pause is not permission to pursue someone who needs distance, nor a promise
      that every conversation must resume jointly.


      A bid for connection—an offered cup of tea, a gentle greeting, a request to reset tone—may make
      discussion possible. It cannot settle the original issue by itself. Forgiveness, if chosen, concerns
      how someone relates to a wrong; trust concerns what later evidence justifies; reconciliation concerns
      whether a relationship continues. None can be demanded as payment for saying sorry.


      Accountability identifies one''s actual conduct without an excuse disguised as an apology. Acknowledgment
      names its effect. Immediate repair addresses what can still be put right. Prevention specifies what
      will change at the next comparable opportunity. Some consequences cannot be undone, and some proposals
      are infeasible. An honest limit is better than promising perfect future behavior or insisting the
      affected person certify that everything is repaired.


      ### Worked example


      A partner arrives late after forgetting to send an agreed message. “Sorry you worry so much” shifts
      responsibility. “I did not send the message we agreed; you waited without the information you needed”
      names the conduct and effect. Offering to cover a resulting reasonable cost might be a practical
      repair if welcome. A later instance of sending the message when delayed supports prevention once.
      A beautifully phrased apology alone cannot supply that later evidence.


      ### Supplied fictional task


      Adult partners Imani and Alex agreed to meet at the station at 18:00 on 2 October. At 17:20 Alex
      accepted a different ride and did not tell Imani. Imani waited until 18:20, then learned of the
      change and took a 12-unit taxi. This is the second unnotified change in a month. No agreement required
      Imani to monitor Alex''s location.


      On 3 October Alex opens with “You could have checked your phone more.” Imani starts listing unrelated
      grievances. Both agree to pause and return at 11:00 the next day for twenty minutes. Alex offers
      tea; Imani accepts the tea but says the notification issue remains. A comparable shared trip is
      planned for 9 October. No apology, reimbursement or new notification arrangement has yet been completed.
      There is no supplied abuse; if your real situation involves threats or coercion, do not map it onto
      this mutual-conversation case.


      ### Prepare, repair and check conduct


      1. Write a four-line account: agreed plan, changed action, direct effect, recurrence. Include Imani''s
      taxi cost and waiting time. Name your own contribution only if the facts support it; do not assign
      Imani responsibility for failing to track Alex. Output: a concise rupture account without global
      labels.

      2. Map the escalation and the agreed pause. Draft a return opening that keeps the issue specific:
      the tea was welcome and the notification still needs attention. Output: a safe conversational entry,
      with permission to end if discussion becomes harmful.

      3. Draft Alex''s acknowledgment and a practical offer concerning the 12-unit cost. Then propose
      a prevention agreement: before changing a shared pickup, notify the other person and obtain confirmation
      that they received the change; if confirmation is absent, do not assume they know. Clarify a feasible
      fallback instead of demanding constant availability. Output: separate accountability, immediate
      repair and future conduct entries.

      4. Save the entries before the [later packet](?resource=file-later-packet-md). Compare the 9 October
      opportunity with the proposed prevention. Preserve any recurrence; do not reset the history because
      an apology was sincere. Output: what changed, what did not, and a proportionate next decision.


      A review may conclude that repair has begun, that only one component occurred, or that repair is
      not occurring. It should not award a global relationship pass. If a promise repeatedly fails, more
      elegant wording is not the missing evidence.


      ### Adapt the task


      For support, use a written account and one bounded request, with no compulsory face-to-face meeting.
      A facilitator may help organize the facts but cannot supply another person''s remorse. For a harder
      fictional attempt, distinguish an unavoidable delay that was promptly communicated from another
      unexplained change; outcomes that look similar may differ in the agreed conduct.


      For real transfer, choose a modest specific disagreement and ask whether discussion is welcome.
      Follow the actual agreement at the next relevant opportunity. Keep only a non-identifying action
      summary and willingly offered feedback. Do not stage a conflict to test someone, demand forgiveness,
      insist on shared blame, or use joint counseling as the required route for abuse. Suitable safeguarding
      and specialist resources take priority where needed.


      ### Source use


      [Lewicki, Polin and Lount, S03](https://ncmr.lps.library.cmu.edu/article/id/264/) studied perceived
      effectiveness of apology structures. The inspected abstract concerns responses to apologies, not
      proof of durable behavioral repair or a validated couples treatment. [Safety guidance, S14](https://www.thehotline.org/plan-for-safety/)
      supports a separate individualized route for abuse concerns. The trip and three-part evidence review
      are original design.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Try first, then [read answers](?check=practice-answers).


      1. Someone apologizes clearly, but the same agreed notification fails at the next comparable event.
      What can and cannot be credited?

      2. A person accepts a friendly gesture but says they are not ready to forgive. Does accepting the
      gesture commit them to reconciliation?

      3. One partner threatens retaliation if the other will not attend a repair meeting. Should the learner
      improve the meeting script and insist both take responsibility?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Credit the acknowledgment if it actually occurred. Do not credit demonstrated prevention
      or restored trust. Preserve the recurrence and consider whether a different feasible agreement,
      changed reliance or ending is appropriate; a new apology does not reset the history.

      2. No. Accepting one kind gesture is specific to that interaction. Forgiveness and reconciliation
      remain separate choices. Ask what contact is welcome and respect the answer without making kindness
      a debt.

      3. No. Threatened retaliation changes the safety context. Do not frame coercion as an equal communication
      failure or require a joint meeting. Seek suitable individualized safeguarding or specialist support
      and an appropriate urgent route if danger is immediate.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
