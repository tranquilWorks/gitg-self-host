  - stable_id: PRACTICE-COMP-1808-PARTNERSHIP-CONFLICT-AND-REPAIR-01-A2
    sequence: 2
    title: Make accountability and the requested repair concrete
    instructions: 'The person responsible names what they did, acknowledges the effect and states what
      can be repaired now, without adding a demand for immediate forgiveness. The other person may clarify
      the impact and choose whether they are ready to continue. Agree a behavior change such as notifying
      before changing the plan or explicitly confirming a new time. Do not require equal blame when responsibility
      is unequal.


      Observation checks: Responsibility is specific and does not require equal blame; Immediate repair
      and future prevention are separate; Forgiveness is not demanded as proof of cooperation; The behavior
      change is observable and within the responsible person’s control. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
