        - your_own_need_is_expressed_without_controlling_their_choice
        - existing_commitments_and_the_cost_of_sacrifice_are_considered
        - care_is_not_exchanged_for_reassurance_or_a_hidden_obligation
      - measurement_id: c1801_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1801_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
