        criteria:
        - your_feeling_and_the_other_person_s_stated_need_are_separate
        - all_eight_dimensions_receive_an_honest_disposition
        - desire_for_access_is_not_equated_with_the_other_person_s_good
        - a_possessive_impulse_is_named_without_justifying_controlling_conduct
      - measurement_id: c1801_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
