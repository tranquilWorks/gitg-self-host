  - stable_id: PRACTICE-COMP-1801-THE-NATURE-AND-PRACTICE-OF-LOVE-01-A2
    sequence: 2
    title: Ask what care would look like and state your own limit
    instructions: 'Ask whether the person wants quiet, practical help, a brief check-in or another form
      of contact. State your own need without making it a demand: I would value time together; could we
      choose another time that works? Consider the commitments already made and whether a proposed sacrifice
      is freely chosen, proportionate and sustainable. Do not offer help that creates a hidden debt or
      require the person to reassure you before they can rest.


      Observation checks: The person is asked what support or contact they want; Your own need is expressed
      without controlling their choice; Existing commitments and the cost of sacrifice are considered;
      Care is not exchanged for reassurance or a hidden obligation. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1801-THE-NATURE-AND-PRACTICE-OF-LOVE-01
      action_stable_id: PRACTICE-COMP-1801-THE-NATURE-AND-PRACTICE-OF-LOVE-01-A2
      competency_stable_id: '18.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1801_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1801_a2_primary
        kind: artifact
        role: primary
