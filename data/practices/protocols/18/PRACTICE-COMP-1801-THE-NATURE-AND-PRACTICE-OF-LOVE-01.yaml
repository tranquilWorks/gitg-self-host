meaning_and_fit:
  purpose: Distinguish affection, desire, attachment, admiration and commitment from possession, and act
    for another person’s genuine good without erasing your own limits.
  why_recommended: Distinguish affection, desire, attachment, admiration and commitment from possession,
    and act for another person’s genuine good without erasing your own limits.
  claims:
  - statement: Distinguish affection, desire, attachment, admiration and commitment from possession, and
      act for another person’s genuine good without erasing your own limits.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded The nature and practice of love practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record The nature and practice of love as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing, a smaller practical action or a fictional case when the relationship
    is unavailable or unsafe. Love does not require tolerating coercion, abandoning essential care for
    yourself or denying facts about harm. Appropriate support may be the caring next step.
  opportunity_considerations: 'Default case: someone you care about wants a quiet evening, while you strongly
    want their attention. Use a private page with eight headings: affection, desire, attachment, care,
    commitment, sacrifice, admiration and possession. The person may be a partner or another appropriate
    adult loved one; no intimate disclosure is needed.'
  prerequisites:
  - 'Default case: someone you care about wants a quiet evening, while you strongly want their attention.
    Use a private page with eight headings: affection, desire, attachment, care, commitment, sacrifice,
    admiration and possession. The person may be a partner or another appropriate adult loved one; no
    intimate disclosure is needed.'
  dependencies: []
  safe_alternatives:
  - Use writing, a smaller practical action or a fictional case when the relationship is unavailable or
    unsafe. Love does not require tolerating coercion, abandoning essential care for yourself or denying
    facts about harm. Appropriate support may be the caring next step.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    The nature and practice of love differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about The nature and practice of
    love as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: someone you care about wants a quiet evening, while you strongly want their attention.
    Use a private page with eight headings: affection, desire, attachment, care, commitment, sacrifice,
    admiration and possession. The person may be a partner or another appropriate adult loved one; no
    intimate disclosure is needed. Goal: Distinguish affection, desire, attachment, admiration and commitment
    from possession, and act for another person’s genuine good without erasing your own limits. Scope:
    This is a voluntary adult relationship reflection and ordinary care action. It does not define one
    universal form of love or require sacrifice, reconciliation or continued contact in an unsafe relationship.
    Time and effort: Twenty minutes to examine one situation, one small agreed action and a ten-minute
    review. Adaptation: Use writing, a smaller practical action or a fictional case when the relationship
    is unavailable or unsafe. Love does not require tolerating coercion, abandoning essential care for
    yourself or denying facts about harm. Appropriate support may be the caring next step. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, a smaller practical action or a fictional case when the relationship
    is unavailable or unsafe. Love does not require tolerating coercion, abandoning essential care for
    yourself or denying facts about harm. Appropriate support may be the caring next step.
  expected_burden: Twenty minutes to examine one situation, one small agreed action and a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the The nature and practice of love protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed The nature and practice of love action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    a smaller practical action or a fictional case when the relationship is unavailable or unsafe. Love
    does not require tolerating coercion, abandoning essential care for yourself or denying facts about
    harm. Appropriate support may be the caring next step.
  actions:
  - stable_id: PRACTICE-COMP-1801-THE-NATURE-AND-PRACTICE-OF-LOVE-01-A1
    sequence: 1
    title: Separate what you feel from what the other person may need
    instructions: 'For the case, describe the wish for closeness and the other person’s stated wish for
      rest. Under the eight headings, note which motives may be present and which are unknown. Affection
      or desire can coexist with care, but wanting access to someone does not establish that more contact
      serves their good. Identify a possessive impulse, if present, such as treating their separate time
      as disloyalty, without making the feeling itself a whole-person verdict.


      Observation checks: Your feeling and the other person’s stated need are separate; All eight dimensions
      receive an honest disposition; Desire for access is not equated with the other person’s good; A
      possessive impulse is named without justifying controlling conduct. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1801-THE-NATURE-AND-PRACTICE-OF-LOVE-01
      action_stable_id: PRACTICE-COMP-1801-THE-NATURE-AND-PRACTICE-OF-LOVE-01-A1
      competency_stable_id: '18.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1801_a1_primary
      transfer_disposition: context_bound
      measurements:
