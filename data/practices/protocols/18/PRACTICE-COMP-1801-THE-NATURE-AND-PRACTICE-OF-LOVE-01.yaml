    kind: concept
    title: Learn and try
    body: 'Choose one small, freely agreed act of care while preserving truth and both people''s boundaries.
      Allow twenty minutes of reflection, time for the act and ten minutes of review. This competency
      is role-conditional: romantic partnership is optional, and single life is legitimate. Use the complete
      fiction if you are unpartnered, do not wish to involve someone, or lack a suitable safe relationship.
      Fiction prepares judgment; it is not evidence of an actual relationship.


      ### Eight distinctions that change a choice


      Affection is warmth toward someone; it can be sincere without answering what help they want today.
      Desire is wanting closeness or another experience with them; wanting does not confer permission.
      Attachment concerns the significance of the bond and separation; distress at distance does not automatically
      identify the other person''s need.


      Care attends to another person''s good in their actual circumstances. Ask what would help rather
      than using your favorite gesture as proof of devotion. Commitment involves undertakings sustained
      across changing feelings; be clear about what was actually promised. Keeping a promise matters,
      and a conflict may call for honest renegotiation instead of quiet disappearance.


      Sacrifice is accepting a cost for something valued. A freely chosen, proportionate and sustainable
      cost can express care. Giving up essential safety, autonomy or every other relationship under pressure
      is not a required demonstration of love. Admiration recognizes qualities or actions you value without
      turning the person into a flawless ideal. Possession treats a person''s time, body or choices as
      something owed to you; it can disguise itself as intensity or protection.


      These distinctions are lenses, not eight separate scores or a universal philosophy of love. Several
      motives may coexist. You can enjoy helping and also hope for appreciation; the useful question is
      whether an unspoken expectation is becoming a condition the other person never accepted. Naming
      your own need directly is more truthful than offering “unconditional” care and later presenting
      a bill.


      Acting for another''s good includes listening to what they say, considering genuine responsibilities,
      and retaining judgment about harmful requests. It does not mean you always know best or must satisfy
      every wish. Truth, self-respect and concern for the other can require a boundary, a revised commitment
      or appropriate support.


      ### Worked example


      Rowan wants a long conversation after a tiring day; partner Ellis wants quiet. Rowan feels affection
      and a desire for attention, then asks whether quiet, practical help or a short check-in would be
      welcome. Ellis chooses quiet. Rowan respects that choice and separately asks whether they can talk
      tomorrow. The quiet is not conditional on tomorrow''s yes. If tomorrow is unsuitable, Rowan can
      discuss the unmet need honestly rather than recasting today''s rest as a debt.


      ### Complete fictional care decision


      Adult partners Amara and Jules have an ordinary, reasonably safe relationship in this supplied case.
      Jules asks for a quiet evening after a demanding day. Amara had hoped to tell Jules about a personal
      success. They have no promise to spend the evening together, but they have previously agreed to
      return a shared library item tomorrow. Amara can handle that errand without sacrificing an essential
      responsibility and offers to do so; Jules has not yet replied.


      Amara''s first idea is to arrive with a surprise meal and insist they eat together “because I care.”
      Jules has already said quiet would help, and no visit is invited. Another idea is to respect the
      quiet, make the bounded errand offer, and ask separately about a ten-minute conversation tomorrow
      at 19:00. No answer, completed errand or later conversation is supplied at the starting point.


      ### Reflect, ask and act


      1. Sort the situation using all eight distinctions. Name Amara''s warmth, desire for attention,
      concern about the bond, possible care, existing commitment, possible cost, admiration for Jules''
      effort and risk of possession. Output: a motive-and-obligation account that distinguishes known
      facts from guesses about Jules'' mind.

      2. Draft one brief request that honors the already stated quiet and offers only realistic help.
      Keep Amara''s wish to share the success visible as a separate request, not payment demanded for
      the errand. Output: what is offered, what requires permission, and what remains a prior responsibility.
      Declining an offer must remain possible.

      3. Save that plan before opening the [later packet](?resource=file-later-packet-md). In a real route,
      carry out only the agreed care, which may mean giving space. Keep or explicitly renegotiate existing
      obligations. Output: the action actually performed, permission status and any unfulfilled commitment.
      An eloquent offer alone is not performed care.

      4. Review fit and cost without scoring devotion. If welcome, ask whether the specific action helped.
      Notice resentment or hidden expectations and address your own need directly. Output: known usefulness,
      unknown wider effects and one truthful next conversation if needed. Do not treat appreciation as
      owed evidence.


      ### Supported and deeper practice


      With support, use the fiction or rehearse two sentences privately. Choose an ordinary preference
      rather than a crisis, major sacrifice or disputed sexual situation. You may decide not to attempt
      a live act; record preparation honestly. No one needs to prove adulthood or personal worth by entering
      a romantic role.


      For a harder fictional route, let the preferred care conflict with an existing commitment. Explain
      the conflict and seek a workable agreement; neither automatic self-erasure nor “my needs always
      win” resolves it. For real transfer, repeat modest care across different days and examine whether
      conduct remains truthful, responsive and sustainable. One appreciated gesture cannot prove durable
      love, moral superiority or relationship safety.


      ### Sources, privacy and professional boundary


      [S08](https://www.loveisrespect.org/resources/green-flags-in-relationships/) supports attention
      to respect and boundaries in relationships; it does not define love for every tradition. This eight-part
      teaching follows the canonical scope and is original educational design, not a validated diagnostic
      model. [S13](https://www.thehotline.org/plan-for-safety/) supports individualized help for abuse
      concerns. Coercion, threats or isolation require a different response from this ordinary mutual-care
      task; no sacrifice, reconciliation or unsafe stay is required.


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.
      Use suitable local resources and a safe contact route when needed; this guide is not a personal
      safety plan. Keep intimate histories and private dialogue out of the application. See the scope
      and limits described in this guide and try the [fresh cases](?attempt=practice-checks).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A partner buys an expensive surprise after being asked for quiet, then demands immediate
      gratitude. Which distinctions matter?

      2. Someone freely gives up one optional outing to help with a wanted task. Does every sacrifice
      erase the self?

      3. A partner demands location access and isolation from friends as proof of love. Should the learner
      practice greater commitment?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Affection or desire may be present, but the gesture ignored the stated need and imposed
      an unagreed obligation. Care requires attention to fit; possession can appear in a demand for the
      other''s response. Cost does not establish permission or usefulness.

      2. No. Consider willingness, proportionality, sustainability and existing responsibilities. A chosen
      modest cost can express care. Neither automatic self-erasure nor a ban on all sacrifice captures
      the distinction.

      3. No. Control and isolation are not a routine care exercise or a duty to prove love. Use appropriate
      safe support for coercion or abuse concerns; do not negotiate away safety to obtain a practice success.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
