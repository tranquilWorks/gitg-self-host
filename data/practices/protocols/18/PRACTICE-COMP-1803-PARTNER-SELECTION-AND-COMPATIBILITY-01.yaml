meaning_and_fit:
  purpose: Consider values, conduct, conflict, direction, attraction, trust, responsibility and constraints
    before choosing the next level of adult partnership commitment.
  why_recommended: Consider values, conduct, conflict, direction, attraction, trust, responsibility and
    constraints before choosing the next level of adult partnership commitment.
  claims:
  - statement: Consider values, conduct, conflict, direction, attraction, trust, responsibility and constraints
      before choosing the next level of adult partnership commitment.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Partner selection and compatibility practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Partner selection and compatibility as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use writing, separate reflection or a qualified relationship professional
    when appropriate and safe. Abuse, coercion and retaliation require specialist safety support rather
    than a mutual compatibility discussion. Single life is a legitimate outcome, not a failure to find
    a match.
  opportunity_considerations: 'Choose a relationship decision that is not urgent, such as whether to discuss
    a greater commitment. Use a fictional couple if no relevant adult relationship exists. Prepare eight
    headings: values, character in action, conflict style, future direction, attraction, trust, responsibility
    and practical constraints.'
  prerequisites:
  - 'Choose a relationship decision that is not urgent, such as whether to discuss a greater commitment.
    Use a fictional couple if no relevant adult relationship exists. Prepare eight headings: values, character
    in action, conflict style, future direction, attraction, trust, responsibility and practical constraints.'
  dependencies: []
  safe_alternatives:
  - Use writing, separate reflection or a qualified relationship professional when appropriate and safe.
    Abuse, coercion and retaliation require specialist safety support rather than a mutual compatibility
    discussion. Single life is a legitimate outcome, not a failure to find a match.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Partner selection and compatibility differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Partner selection and compatibility
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a relationship decision that is not urgent, such as whether to discuss a greater commitment.
    Use a fictional couple if no relevant adult relationship exists. Prepare eight headings: values, character
    in action, conflict style, future direction, attraction, trust, responsibility and practical constraints.
    Goal: Consider values, conduct, conflict, direction, attraction, trust, responsibility and constraints
    before choosing the next level of adult partnership commitment. Scope: This is a private decision
    aid, not a compatibility score, diagnosis or instruction to stay or leave. It must not become surveillance,
    a secret test or a demand that a partner disclose everything. Time and effort: Thirty minutes to review
    known evidence, one willing conversation and a twenty-minute decision review. Adaptation: Use writing,
    separate reflection or a qualified relationship professional when appropriate and safe. Abuse, coercion
    and retaliation require specialist safety support rather than a mutual compatibility discussion. Single
    life is a legitimate outcome, not a failure to find a match. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, separate reflection or a qualified relationship professional when
    appropriate and safe. Abuse, coercion and retaliation require specialist safety support rather than
    a mutual compatibility discussion. Single life is a legitimate outcome, not a failure to find a match.
  expected_burden: Thirty minutes to review known evidence, one willing conversation and a twenty-minute
    decision review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Partner selection and compatibility protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Partner selection and compatibility action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    separate reflection or a qualified relationship professional when appropriate and safe. Abuse, coercion
    and retaliation require specialist safety support rather than a mutual compatibility discussion. Single
    life is a legitimate outcome, not a failure to find a match.
  actions:
  - stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01-A1
    sequence: 1
    title: Record actual examples and uncertainty under each heading
    instructions: 'For each of the eight headings, write one observed example, one genuine unknown and
      any important mismatch. Distinguish intensity, loneliness, idealization or fear of losing the person
      from evidence of fit. Look at how small promises, disagreements and responsibilities have actually
      been handled over time. Do not infer values from demographic identity or treat different preferences
      as defects that the other person must change.


      Observation checks: All eight compatibility areas include evidence or an honest unknown; Intensity
      and loneliness are separated from observed fit; Patterns of conduct matter more than one impressive
      moment; Difference is not automatically treated as a flaw to repair. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01
      action_stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01-A1
      competency_stable_id: '18.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1803_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1803_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_eight_compatibility_areas_include_evidence_or_an_honest_unknown
        - intensity_and_loneliness_are_separated_from_observed_fit
        - patterns_of_conduct_matter_more_than_one_impressive_moment
        - difference_is_not_automatically_treated_as_a_flaw_to_repair
      - measurement_id: c1803_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1803_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01-A2
    sequence: 2
    title: Discuss one consequential unknown without conducting an interview test
    instructions: 'With permission, choose a meaningful question such as how each person imagines work,
      family responsibilities or living arrangements in the next few years. Share your own current view
      and invite theirs, allowing uncertainty and change. Clarify one practical conflict and whether it
      is negotiable, role-dependent or a fundamental boundary. Do not ask questions merely to score the
      answer or conceal your own incompatible intention.


      Observation checks: The conversation addresses a consequential unknown; Both people can state current
      views and uncertainty; Negotiable preferences and fundamental boundaries are distinguished; The
      exchange is not a hidden compatibility examination. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01
      action_stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01-A2
      competency_stable_id: '18.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1803_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1803_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_conversation_addresses_a_consequential_unknown
        - both_people_can_state_current_views_and_uncertainty
        - negotiable_preferences_and_fundamental_boundaries_are_distinguished
        - the_exchange_is_not_a_hidden_compatibility_examination
      - measurement_id: c1803_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
