      relationship-specific attachment orientations](https://pubmed.ncbi.nlm.nih.gov/25559192/)

      - [Intimacy as an Interpersonal Process: The Importance of Self-Disclosure, Partner Disclosure,
      and Perceived Partner Responsiveness in Interpersonal Exchanges](https://www.affective-science.org/pubs/1998/LaurenFBPl1998.pdf)

      - [Plan for Safety](https://www.thehotline.org/plan-for-safety/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after your initial evidence review.


      Remy receives the placement offer on 12 October and intends to accept it. Dana still wants to stay
      in the current town. In a willing conversation, each says a year of long-distance partnership is
      not an arrangement they want. Neither asks the other to abandon the plan. Their attraction and positive
      small-commitment history remain part of the evidence; they do not remove this newly clarified mismatch.


      Dana decides not to sign a shared lease on 20 October. Remy agrees not to pursue the lease together.
      They have not yet agreed whether or how to remain in contact after a separation. No legal or financial
      commitment has been entered in this fiction.


      Record a mutual lease decision, a significant direction/constraint mismatch and unresolved future
      contact. Do not infer that Remy lacks character because of the placement or that Dana''s wish to
      stay invalidates Remy''s opportunity. The decision uses evidence beyond loneliness without claiming
      a perfect prediction of future happiness. Further practical matters would need their own honest
      agreements and appropriate advice where relevant.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Make a provisional relationship decision from relevant evidence and honest uncertainty. Allow
      thirty minutes to review, one willing conversation if suitable, and twenty minutes to reconsider.
      This role-conditional adult practice is optional, with no requirement to find a partner or remain
      partnered. A single life is legitimate. Use the complete fiction if a live decision would be unwanted,
      unsafe or inappropriate; never create a relationship to complete the task.


      ### Eight areas of fit


      Values concern what each person treats as important when choices have costs. Character is inferred
      cautiously from conduct across situations, such as responsibility after a mistake; charm is not
      a complete assessment. Conflict style concerns what happens during disagreement, including whether
      people listen, repair, threaten or avoid necessary decisions. Do not manufacture a conflict to test
      it.


      Direction concerns the life each person wants to build. Attraction can matter, but intensity alone
      cannot resolve incompatible aims. Trust concerns supported confidence and truthfulness; it is not
      achieved by passwords, monitoring or secret tests. Responsibility includes keeping or renegotiating
      undertakings and attending to shared consequences. Life constraints include location, work, care,
      finances and other realities that affect whether a desired arrangement is feasible.


      For each area, separate an observation, an interpretation and an unknown. “They told me before changing
      the plan” is an observation; “they will always be reliable” is a much broader conclusion. One harmful
      act may be sufficient for a boundary without a large dataset. Conversely, a pleasant month cannot
      certify lifelong compatibility. Avoid demographic shortcuts about religion, class, gender, age or
      family background.


      Intensity, loneliness, idealization and fear can make certainty feel urgent. Notice their influence
      without dismissing genuine affection. A useful decision can be “continue learning without increasing
      commitment,” “deepen by mutual agreement,” “keep the present form,” or “end or seek support.” The
      other person''s choice matters too; your private conclusion cannot create a joint commitment.


      Distinguish negotiable differences from fundamental or role-dependent mismatches. Different hobbies
      can coexist. Opposed wishes about children, safety or where to build a life may have consequences
      that love alone does not remove. Do not promise that someone will eventually change. Honest discussion
      of a consequential unknown is more respectful than a hidden compatibility examination.


      ### Worked example


      Two adults feel strong attraction and enjoy time together. One wants to move permanently abroad;
      the other intends to remain near an existing care responsibility. They can appreciate each other
      and still face an unresolved direction and constraint mismatch. A decision to avoid a shared lease
      while discussing realistic options uses evidence beyond intensity. It is neither a diagnosis of
      the partner nor a verdict that the relationship was worthless.


      ### Complete fictional review


      Adult partners Dana and Remy have been dating voluntarily for four months. They enjoy shared walks
      and each reports attraction. Dana has observed Remy keep three modest plans and notify Dana promptly
      about one necessary cancellation. During a disagreement about weekend scheduling, Remy listened
      and helped find an alternative. No threats or coercive dependency are supplied in this ordinary
      case; absence from a short case is not a real-world safety certification.


      Dana wants to remain in the current town for at least two years. Remy has applied for a year-long
      placement in another city starting in January; the application result is unknown. They have not
      discussed whether either wants a long-distance relationship. A shared lease decision is due on 20
      October, with no commitment yet made. Dana''s fear of being alone is increasing pressure to sign.
      Neither person''s wish about children or longer-term finances is supplied; these remain unknown,
      not assumed matches.


      ### Review and decide without a score


      1. Make eight headings matching the areas above. Place the known observations under them and mark
      unknowns without filling them with guesses. Output: a bounded evidence review, not a numerical partner
      ranking or a dossier. Identify which unknown matters to the current decision rather than demanding
      answers to every intimate question.

      2. Name Dana''s attraction and loneliness pressure separately from the lease question. Draft a transparent
      question about the placement, location and whether a long-distance arrangement is desired. Share
      Dana''s own intentions too. Output: a willing conversation proposal that allows a truthful mismatch,
      not an interrogation designed to secure reassurance.

      3. Save the initial decision before opening the [later packet](?resource=file-later-packet-md).
      Reconsider it using only the new supplied information. Output: continue learning, deepen, maintain,
      end or seek support, with reasons and uncertainties. Do not call a decision mutual until both have
      agreed.

      4. State what commitment is authorized now and a real review trigger before the lease deadline.
      If the answer is still unknown, choose an option that does not pretend it is settled. Output: next
      action, deadline and what could change the decision. Do not create tests, inspect private accounts
      or enlist friends to investigate the partner.


      ### Support and harder transfer


      For support, work entirely from the fictional table and use a trusted appropriate adviser to separate
      observed conduct from fear-driven inference. Preserve the partner''s privacy. Regulated financial
      or legal commitments need qualified advice beyond this educational decision. No one should be compelled
      to disclose private history to satisfy a worksheet.


      For a harder fictional version, let positive evidence coexist with a fundamental incompatibility.
      Practice a respectful decision that does not erase either. For real transfer, discuss one relevant
      unknown willingly, revisit conduct over time, and accept that uncertainty may remain. Abuse, threats
      or unsafe dependency require suitable safety support rather than treating harm as a negotiable mutual-fit
      problem. Ending safely may require individualized help; immediate confrontation is not prescribed.


      ### Sources and professional boundary


      [S10](https://pubmed.ncbi.nlm.nih.gov/32719123/) reports predictors of relationship quality across
      existing-couple datasets and substantial limits in predicting change. It does not provide a partner-selection
      algorithm or validate these eight headings. [S08](https://www.loveisrespect.org/resources/green-flags-in-relationships/)
      offers practical respect and boundary guidance, not a diagnostic green-flag score. [S13](https://www.thehotline.org/plan-for-safety/)
      informs the individualized support boundary.


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.
      Keep private relationship content out of the application. The scope and limits described in this
      guide and [fresh cases](?attempt=practice-checks) distinguish careful judgment from guarantees about
      a shared future.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A couple shares strong attraction but has incompatible, firmly held wishes about having
      children. Does high intensity settle the issue?

      2. A learner secretly creates a fake account to test a partner''s loyalty. Is the resulting information
      an acceptable exercise method?

      3. A partner notifies a necessary cancellation and keeps several other plans. What can this support,
      and what remains unknown?


      [Corrective answers](?check=practice-answers)'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Treat the difference as consequential and discuss it honestly without assuming eventual
      conversion. Attraction remains real but does not resolve the mismatch. A respectful decision may
      include ending or not deepening the relationship.

      2. No. Deception and surveillance are excluded. Use transparent discussion and ordinary observed
      conduct, or appropriate support where safety is in question. A desire for certainty does not authorize
      manufactured tests.

      3. It supports a limited observation of kept or renegotiated commitments in those instances. It
      does not certify lifelong reliability, establish every area of fit or eliminate relevant unknowns.
      Avoid both idealization and treating every cancellation as a character failure.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
