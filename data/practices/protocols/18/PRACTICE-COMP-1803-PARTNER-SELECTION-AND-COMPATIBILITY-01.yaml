  - stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01-A3
    sequence: 3
    title: Choose a proportionate next decision and a review trigger
    instructions: 'Decide whether to continue learning, deepen the commitment, keep the relationship at
      its current level or seek a safe ending or professional support. State which evidence supports the
      choice and what remains unresolved. Do not convert a major unresolved difference about children,
      safety or life direction into a vague promise that love will solve it. Set a review trigger based
      on a real conversation or event rather than endless checking.


      Observation checks: The next step is proportionate to the evidence available; Unresolved differences
      remain visible in the decision; No promise of future change substitutes for present incompatibility
      evidence; A concrete review trigger replaces continuous reassessment. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which observations mattered more than attraction or fear of being alone, and what
      uncertainty would make a larger commitment premature?


      Examples: Supportive: The couple recognized strong affection but an unresolved life-direction difference
      and chose another explicit conversation before increasing commitment.


      Mixed: The review identified useful patterns but relied too heavily on promises, so the decision
      remained provisional pending actual follow-through.


      Contradictory: The person secretly tested, monitored or ranked the partner rather than discussing
      a relevant uncertainty honestly.


      Inconclusive: A major commitment was justified only by intensity while trust, responsibility and
      constraints were left unexamined.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01
      action_stable_id: PRACTICE-COMP-1803-PARTNER-SELECTION-AND-COMPATIBILITY-01-A3
