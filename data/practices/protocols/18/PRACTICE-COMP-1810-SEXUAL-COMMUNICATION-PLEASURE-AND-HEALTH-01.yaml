  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The conversation lasts eighteen minutes. Ellis accurately reflects that Mika wants the frequency
      jokes to stop and agrees. Neither person bargains about the amount of sexual activity. They agree
      that a brief “support or space?” question can be offered, with either answer acceptable. The packet
      supplies no later intimacy or use of that question.


      On 7 October Mika sends an authorized general inquiry to a clinic about discussing pregnancy prevention
      and infection prevention. A reply offers a consultation on 14 October, which Mika books. The reply
      does not answer the clinical question. No appointment has yet been attended and no method change
      has occurred. Ellis reports avoiding the jokes on two occasions when they previously might have
      occurred; Mika has not supplied separate feedback on that later change.


      Identify the actual conversation, inquiry and booking. Keep the health answer, use of the aftercare
      practice and Mika''s later experience open. A reported change in joking is narrower than evidence
      of improved sexual satisfaction, resolved prevention needs or agreement to any future activity.
      Write a follow-up that does not request private clinical details.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Prepare a voluntary conversation about what makes intimacy welcome, comfortable and responsibly
      informed. Allow fifteen minutes to prepare, up to twenty at a calm nonsexual time, and one agreed
      follow-up. This is optional adult learning, including a complete fictional route. It is not a sexual
      performance exercise. Single life, no sexual activity and not discussing personal experience are
      valid choices.


      ### Give different questions different kinds of answers


      Desire describes what someone currently wants; it does not create an obligation in the other person.
      A boundary identifies what is not welcome or what conditions matter. Comfort concerns how an interaction
      is experienced, including pace, setting and access. Pleasure is individual and can be discussed
      without making orgasm, frequency or any particular act a success target. A person need not justify
      a preference through a medical explanation.


      Contraception and infection prevention answer different questions. Do not assume a method chosen
      for pregnancy prevention also addresses sexually transmitted infections. Decisions about appropriate
      methods, testing, symptoms or treatment belong with current qualified health information and the
      people whose bodies are involved. A conversation can identify a question and help arrange a consultation;
      it cannot supply a diagnosis or guarantee zero risk.


      Difficulty may mean pain, uncertainty, mismatch, access barriers or distress. Ask what the person
      means instead of interpreting it as failure, lack of love or a need to try harder. Pain or concerning
      symptoms warrant appropriate medical support, not an exercise to tolerate discomfort. Aftercare
      concerns what support or space is welcome afterward; it is not an automatic requirement for touch,
      disclosure or a particular ritual.


      Discussing these topics is itself subject to consent and privacy. Ask whether now is a good time,
      offer a modest topic, and make postponement easy. Hearing a boundary without argument is a practical
      achievement. A full inventory in one sitting can overwhelm people; marking a topic private or deferred
      is often the most truthful outcome. A discussion does not authorize future sexual activity or require
      disclosure to an app.


      ### Worked example


      One partner says, “I like affection but don''t want it always interpreted as an invitation to sex.”
      The other first assumes all touch should stop. They clarify that some affection is welcome while
      further activity needs its own agreement. The useful result is a better distinction, not a promise
      of more sex. If either person prefers no touch at a particular moment, the earlier conversation
      does not override that choice.


      ### Supplied fictional task


      Adult partners Mika and Ellis willingly set aside twenty minutes on 5 October at 16:00, away from
      any sexual situation. Mika wants to discuss pressure created by jokes about frequency. Ellis wants
      to understand which conversation topics feel welcome. Neither has offered intimate medical history
      for a learning record.


      The supplied facts are: Mika wants the jokes to stop; both want freedom to decline any activity;
      both are unsure how their current assumptions about pregnancy prevention relate to infection prevention;
      neither has asked a clinician about that uncertainty. Ellis would like a short check-in after future
      intimacy, while Mika sometimes prefers quiet space. Neither preference has yet become an agreement.
      Pleasure preferences, specific activities and symptoms are intentionally not supplied; do not invent
      them.


      ### Prepare a small, usable conversation


      1. Make eight topic headings: desire, boundaries, comfort, pleasure, contraception, infection prevention,
      difficulty and aftercare. Mark each as discuss now, defer, private or qualified question. Assign
      only statuses supported by the case; a blank is not a deficit to fill with disclosure. Output: an
      agenda that respects the twenty-minute limit and allows either person to stop.

      2. Draft an opening that confirms willingness and addresses the jokes without implying a duty to
      change desire. Write a response that accurately reflects Mika''s boundary and does not bargain for
      a substitute. Output: a request and a listening response whose adequacy can be checked from the
      words.

      3. Separate the health uncertainty from personal preferences. Draft a question for a qualified service
      about pregnancy and infection prevention, without choosing a method or changing medication. Propose
      who will seek information and when, with permission from the affected person. Output: an information
      action with status—proposed, agreed, booked, attended or answered—kept explicit.

      4. Explore aftercare as a negotiable preference: a brief question about support or space may be
      welcome, and “space” must remain an acceptable answer. Do not assume that pleasure means the same
      thing to both people or that every topic needs resolution today. Output: an agreed communication
      practice if both accept it, otherwise the unresolved question.

      5. Read the [later packet](?resource=file-later-packet-md) after saving your work. Compare what
      happened with the agenda, and separate a better conversation from an established sexual-health outcome.
      Output: one completed action, one unresolved issue and a consensual follow-up if available.


      ### Adjust and apply


      For support, work on only the boundary about jokes using written communication or a fictional dialogue.
      A partner is not required to participate in a lesson. For a harder attempt, include two different
      aftercare preferences and show how each can be respected without promising continuous availability.
      Do not increase difficulty by demanding more explicit disclosure.


      For optional real transfer, choose one small topic and ask whether a conversation is welcome at
      a nonsexual time. Respect postponement. Where relevant, prepare a qualified health question and
      record only whether an authorized inquiry actually occurred. A bookmark is not an inquiry; an appointment
      is not an answer. Clinical details should stay in appropriate private care channels. Coercion or
      fear requires suitable safety support, not improved persuasion.


      ### Source use


      [WHO''s working definition, S06](https://www.who.int/teams/sexual-and-reproductive-health-and-research/key-areas-of-work/sexual-health/defining-sexual-health)
      places sexual wellbeing in a respectful, coercion-free context; it does not mandate activity or
      pleasure outcomes. [CDC''s contraception overview, S05](https://www.cdc.gov/contraception/about/index.html)
      supports separating pregnancy prevention from infection protection and informed choice. No method
      regimen, efficacy percentage or treatment recommendation is imported. The agenda and dialogue are
      original learning tools.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Think through each distinction before [reading answers](?check=practice-answers).


      1. A partner hears “not tonight” and asks for a medical reason before accepting it. What is the
      communication error?

      2. Two people use a pregnancy-prevention method and therefore assume infection prevention requires
      no discussion. What question remains, and who should answer method-specific concerns?

      3. A conversation ends with a consultation booked and a proposed aftercare preference. Can the learner
      record improved health and a successful aftercare trial?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A boundary does not require a diagnosis to be valid. Accept the refusal without bargaining
      or demanding disclosure. Medical support may be appropriate if the person wants help with symptoms,
      but it is not the price of saying no.

      2. Pregnancy prevention and infection prevention are distinct. Ask what protection and testing considerations
      are relevant, using current qualified health guidance. Do not infer coverage, prescribe a method
      or promise absence of risk from the fact that contraception is used.

      3. No. Booking establishes an appointment, not attendance or a clinical result. A proposed preference
      is not an agreed or tried practice. Record each actual status and wait for relevant evidence, preserving
      privacy and optional participation.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
