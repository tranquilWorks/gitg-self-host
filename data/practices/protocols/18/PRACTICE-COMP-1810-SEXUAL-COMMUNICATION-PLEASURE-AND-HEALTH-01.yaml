meaning_and_fit:
  purpose: Discuss desire, boundaries, comfort, pleasure, prevention and support collaboratively, with
    room for uncertainty, difference and choosing not to be sexually active.
  why_recommended: Discuss desire, boundaries, comfort, pleasure, prevention and support collaboratively,
    with room for uncertainty, difference and choosing not to be sexually active.
  claims:
  - statement: Discuss desire, boundaries, comfort, pleasure, prevention and support collaboratively,
      with room for uncertainty, difference and choosing not to be sexually active.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Sexual communication, pleasure, and health practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Sexual communication, pleasure, and health as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use writing, accessible communication, a qualified sexual-health professional
    or a fictional scenario. No partner is owed private history beyond what is needed for informed and
    safe choices, and no one must disclose in an unsafe context. Keep all substantive intimate details
    outside the application.
  opportunity_considerations: For adults in a safe relationship, choose a calm nonsexual time to discuss
    what each person would want to understand before intimacy. A single person may use a fictional adult
    case. Prepare headings for desire, yes/no/maybe boundaries, comfort, pleasure, contraception, infection
    prevention, difficulties and aftercare or later check-in.
  prerequisites:
  - For adults in a safe relationship, choose a calm nonsexual time to discuss what each person would
    want to understand before intimacy. A single person may use a fictional adult case. Prepare headings
    for desire, yes/no/maybe boundaries, comfort, pleasure, contraception, infection prevention, difficulties
    and aftercare or later check-in.
  dependencies: []
  safe_alternatives:
  - Use writing, accessible communication, a qualified sexual-health professional or a fictional scenario.
    No partner is owed private history beyond what is needed for informed and safe choices, and no one
    must disclose in an unsafe context. Keep all substantive intimate details outside the application.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Sexual communication, pleasure, and health differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Sexual communication, pleasure,
    and health as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'For adults in a safe relationship, choose a calm nonsexual time to discuss what each person
    would want to understand before intimacy. A single person may use a fictional adult case. Prepare
    headings for desire, yes/no/maybe boundaries, comfort, pleasure, contraception, infection prevention,
    difficulties and aftercare or later check-in. Goal: Discuss desire, boundaries, comfort, pleasure,
    prevention and support collaboratively, with room for uncertainty, difference and choosing not to
    be sexually active. Scope: The assignment is a voluntary conversation or fictional rehearsal, not
    sexual performance. It provides no medical diagnosis, technique prescription or guarantee of pregnancy
    or infection prevention. Time and effort: Fifteen minutes of private preparation, a twenty-minute
    willing conversation and one follow-up or qualified question where needed. Adaptation: Use writing,
    accessible communication, a qualified sexual-health professional or a fictional scenario. No partner
    is owed private history beyond what is needed for informed and safe choices, and no one must disclose
    in an unsafe context. Keep all substantive intimate details outside the application. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use writing, accessible communication, a qualified sexual-health professional or
    a fictional scenario. No partner is owed private history beyond what is needed for informed and safe
    choices, and no one must disclose in an unsafe context. Keep all substantive intimate details outside
    the application.
  expected_burden: Fifteen minutes of private preparation, a twenty-minute willing conversation and one
    follow-up or qualified question where needed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Sexual communication, pleasure, and health protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Sexual communication, pleasure, and health action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use writing,
    accessible communication, a qualified sexual-health professional or a fictional scenario. No partner
    is owed private history beyond what is needed for informed and safe choices, and no one must disclose
    in an unsafe context. Keep all substantive intimate details outside the application.
  actions:
  - stable_id: PRACTICE-COMP-1810-SEXUAL-COMMUNICATION-PLEASURE-AND-HEALTH-01-A1
    sequence: 1
    title: Prepare preferences and questions without creating a performance standard
    instructions: 'Privately note what you are comfortable discussing and what remains uncertain under
      each heading. Separate a desire from an obligation, a boundary from a criticism and a medical question
      from a personal preference. Include the option of no sexual activity or nonsexual affection. Do
      not infer a partner’s preferences from gender, orientation, past behavior or media, and do not set
      a pleasure or orgasm outcome as proof of successful participation.


      Observation checks: All eight discussion areas have a preference question or explicit private limit;
      Desire obligation boundary and medical uncertainty are distinguished; No sexual activity remains
      a legitimate choice; No stereotype or performance outcome substitutes for the person’s account.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1810-SEXUAL-COMMUNICATION-PLEASURE-AND-HEALTH-01
      action_stable_id: PRACTICE-COMP-1810-SEXUAL-COMMUNICATION-PLEASURE-AND-HEALTH-01-A1
