  - stable_id: PRACTICE-COMP-1806-RELATIONSHIP-STAGES-AND-CHANGING-NEEDS-01-A2
    sequence: 2
    title: Negotiate one practice that fits the current season
    instructions: 'Discuss the changed need with the partner and choose a small adjustment, such as replacing
      a long weekly outing with a protected short conversation and a later review date. State what the
      adjustment preserves, what it gives up and what must not become permanent by default. Include the
      possibility that repair requires a concrete accountability step rather than merely more pleasant
      time together.


      Observation checks: The adjustment responds to a mutually recognized changed need; What is preserved
      and sacrificed is explicit; A temporary arrangement has a review date; Repair is not confused with
      avoiding the unresolved rupture. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
