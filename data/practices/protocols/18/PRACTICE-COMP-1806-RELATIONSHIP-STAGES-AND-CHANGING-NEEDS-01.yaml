  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Open after saving the trial card.


      Neri and Sam hold both twenty-minute Tuesday conversations on 6 and 13 October. Sam says the uninterrupted
      time helped; Neri says the short format was feasible. Sam still misses having a longer outing and
      does not want the trial to become the permanent ceiling. Neri acknowledges changing the dinner plan
      but says no more about its effect or preventing recurrence. The packet supplies no completed repair
      of that incident.


      At the 14 October review both agree to one further Tuesday meeting. They propose a longer Sunday
      outing on 25 October, conditional on Sam confirming that the relative has other agreed support.
      That support has not been arranged, and the outing has not occurred. The work placement end date
      remains 29 November.


      Separate two completed meetings, one agreed future meeting and one conditional proposal. Describe
      the small benefit without claiming full renewal. Identify what remains to be addressed about the
      dinner change and who must confirm the Sunday feasibility. Do not allocate the relative''s care
      to an unnamed person or imply the work placement has already ended.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare what a relationship needed before with what its participants need now, then design
      one small, revisable adjustment. Allow twenty minutes for the comparison, a willing adult conversation,
      and a review after a short trial. Partnership is optional; single life requires no substitute performance.
      Use the complete fiction when no suitable relationship or welcome conversation exists. Do not initiate
      contact with an unsafe or estranged person for this exercise.


      ### Understand change without imposing a timetable


      Formation involves learning whether and how to relate. Commitment makes particular promises. Consolidation
      develops habits and shared arrangements. Strain exposes pressure or mismatch; repair addresses a
      rupture; renewal creates a wanted way forward. Ending or restructuring may become appropriate. These
      are organizing words, not diagnoses or seven compulsory steps. A couple can consolidate a home while
      repairing a breach and reconsidering future plans. Duration alone tells you little about what they
      should do next.


      Changed needs deserve description before judgment. A new work schedule may reduce available time
      without reducing affection. Conversely, explaining a missed agreement by stress does not automatically
      resolve its effect. Separate capacity, conduct and fit: “we have fewer free evenings,” “you changed
      our plan without telling me,” and “we want incompatible futures” pose different questions. A pleasant
      new ritual cannot answer all three.


      Adaptation asks what still matters, what is no longer feasible, and what both can freely accept.
      It includes time together, communication, affection, practical responsibilities and future direction.
      A shorter conversation may preserve contact while giving up spontaneity. Name that loss rather than
      declaring the new arrangement equally satisfying by definition. An experiment needs a review point
      so temporary scarcity does not quietly become a permanent entitlement to one person''s sacrifice.


      Renewal is not an obligation to remain together. Sometimes a trial shows that an arrangement is
      sustainable; sometimes it reveals an unresolved need or unwillingness to repair. Neither result
      establishes anyone''s moral worth. Threats, coercion and abuse require an appropriate safety route,
      not a better couples exercise.


      ### Worked example


      A couple previously enjoyed a weekly long walk. One now has a temporary evening class. They freely
      replace two walks with a twenty-minute tea and review after the class ends. Both report enjoying
      one tea; the second never happens. “A useful meeting occurred once” is supported. “Our new routine
      works” is premature. They should examine the missed meeting and the continuing wish for longer time,
      not add the two planned meetings to a success count.


      ### Supplied fictional task


      Adult partners Neri and Sam have lived together for four years. Neri has an eight-week work placement,
      ending 29 November, with two late evenings each week. Sam has agreed to help a relative on Saturdays
      for the same period. Their previous Saturday outing lasted two hours. Both want contact and neither
      wants a compulsory daily report. They have not decided whether the Saturday responsibility will
      continue afterward.


      On 4 October they willingly discuss a two-week adjustment. Available shared windows are Tuesday
      19:30–19:50 and Sunday 10:00–10:20. Neri prefers Tuesday; Sam can agree to two Tuesdays. Sam also
      wants Neri to acknowledge a separate event: on 1 October Neri changed a shared dinner plan without
      notifying Sam. Neri has not yet addressed that breach. There is no supplied threat or abuse, no
      decision to end, and no evidence that either wants less commitment. Do not invent those conclusions.


      ### Build the comparison and trial


      1. Draw five before/now rows: time, communication, affection, practical roles and future plans.
      Put the lost Saturday outing, new constraints and unknown continuation in the appropriate rows.
      Mark unprovided details unknown. Output: a comparison grounded in facts rather than a stage label.

      2. Sort the issues into temporary capacity, specific conduct and possible longer-term mismatch.
      The unnotified dinner change belongs in conduct even if work was tiring. Output: two separate questions—what
      contact is feasible now, and what acknowledgment or repair the dinner incident needs.

      3. Draft a negotiable proposal for 6 and 13 October, 19:30–19:50, with a review on 14 October. State
      that it replaces only the two outings, not all future needs or the unresolved repair. Each person
      can decline, shorten or suggest another arrangement. Output: a trial card with dates, preserved
      purpose, known loss and review trigger.

      4. Save the card before reading the [later packet](?resource=file-later-packet-md). Classify each
      meeting as happened, moved by agreement, missed or unknown. Compare each person''s feedback with
      the original purpose. Output: keep, revise or stop, with a reason that includes any unresolved conduct
      and capacity.


      Do not score closeness by minutes alone. Twenty welcome minutes can matter while remaining insufficient
      for someone''s longer-term needs. A completed meeting supplies behavioral evidence; the participants''
      separate experiences supply different information. Neither is provided by merely writing the plan.


      ### Support, challenge and transfer


      For support, compare only time and one other relevant area, using a dictated note or visual calendar.
      Supply the dates rather than asking someone under strain to design an elaborate tracker. For a harder
      fictional attempt, extend the placement by four weeks and decide what must be renegotiated instead
      of assuming consent extends automatically.


      For real transfer, ask whether a modest review is welcome, identify one actual change and agree
      a short trial. Review after a comparable opportunity with both perspectives if freely offered. Do
      not turn the review into a demand for reassurance. If no trial is agreed, retain the proposal as
      preparation and record no relationship outcome. Consequential housing, separation or care decisions
      may need suitable professional support.


      ### Source use


      [Karney and Bradbury''s review, S01](https://pmc.ncbi.nlm.nih.gov/articles/PMC8186435/) supports
      attention to varied trajectories and context; the inspected abstract and opening discussion do not
      establish a fixed stage sequence. This comparison, dates and task are original teaching design.
      [Specialist safety guidance, S14](https://www.thehotline.org/plan-for-safety/) informs the separate
      route for unsafe situations, without certifying a particular conversation as safe.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Answer before opening [corrective answers](?check=practice-answers).


      1. A partner says “We''ve reached consolidation, so wanting more affection is immature.” What is
      wrong with that inference, and what question would help?

      2. After an unacknowledged broken promise, a pleasant holiday goes well. Does that establish repair?
      Specify what evidence is missing.

      3. A two-week contact trial is useful, but one person declines to continue it indefinitely. Has
      the trial failed, and what can be concluded?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A stage term cannot set another person''s needs or rank maturity. Ask what affection currently
      means to each person and what is welcome and feasible. The label does not substitute for their accounts
      or create an entitlement to contact.

      2. The holiday shows a pleasant event, not necessarily accountability or changed conduct around
      the promise. Seek acknowledgment of the specific effect, any appropriate practical repair and behavior
      at a relevant later opportunity. Do not demand forgiveness as the evidence.

      3. The limited trial may have served its agreed purpose. Its consent and feasibility do not extend
      automatically. Record the useful short-term outcome, the refusal of indefinite continuation and
      the need to negotiate, stop or reconsider fit without coercion.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
