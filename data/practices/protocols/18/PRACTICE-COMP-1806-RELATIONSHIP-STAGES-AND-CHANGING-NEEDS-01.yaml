  - stable_id: PRACTICE-COMP-1806-RELATIONSHIP-STAGES-AND-CHANGING-NEEDS-01-A3
    sequence: 3
    title: Try the adjustment and decide whether to keep, revise or end it
    instructions: 'Use the agreed practice once or over the short agreed interval, then compare both people’s
      experience with the intended purpose. Ask whether it reduced strain, improved connection, concealed
      a problem or proved impractical. Retain, revise or stop the arrangement with a reason. If the relationship
      itself may need to end, identify appropriate safety, care and legal support rather than treating
      renewal as the only successful answer.


      Observation checks: The agreed adjustment is actually tried; Both people’s experience informs the
      review; Concealed problems and impracticality remain valid outcomes; Renewal is not treated as the
      mandatory resolution. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Which expectation needed to change because conditions changed, and what did the trial
      reveal that a generic relationship-stage label would have missed?


      Examples: Supportive: The couple tried a shorter protected check-in during a care-intensive month
      and kept a review date instead of treating reduced time as permanent neglect or a permanent solution.


      Mixed: The routine became easier, but the underlying broken promise remained unresolved and was
      assigned a separate repair conversation.


      Contradictory: A stage label was used to normalize abuse or pressure someone to remain until the
      relationship supposedly matured.


      Inconclusive: The relationship was labeled as being in a phase without changing or testing any expectation.'
