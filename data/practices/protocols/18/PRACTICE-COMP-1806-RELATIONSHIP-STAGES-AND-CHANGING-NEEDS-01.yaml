  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    communication, separate reflection or suitable professional support. Do not conduct a mutual-stage
    exercise where coercion or abuse makes negotiation unsafe. A fictional trial plan is not evidence
    of a relationship adapting in practice.
  actions:
  - stable_id: PRACTICE-COMP-1806-RELATIONSHIP-STAGES-AND-CHANGING-NEEDS-01-A1
    sequence: 1
    title: Describe the changed conditions rather than declaring a stage verdict
    instructions: 'Identify what has actually changed and which stage-like needs are present: learning
      each other, making promises, maintaining routines, coping with strain, repairing a rupture, renewing
      connection or considering an ending. Compare one former expectation with current capacity. Distinguish
      a temporary pressure from a broken agreement or deeper mismatch, and note what information would
      help tell the difference.


      Observation checks: Actual changed conditions support the review; Multiple stage-like needs can
      coexist; A former expectation is compared with current capacity; Temporary strain broken agreement
      and mismatch are distinguished. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1806-RELATIONSHIP-STAGES-AND-CHANGING-NEEDS-01
      action_stable_id: PRACTICE-COMP-1806-RELATIONSHIP-STAGES-AND-CHANGING-NEEDS-01-A1
      competency_stable_id: '18.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
