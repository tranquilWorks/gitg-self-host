intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default change: an established couple moves from flexible schedules to a season of caregiving
    or demanding work. Use a before-and-now page covering time, communication, affection, practical responsibilities
    and future expectations. No partner is required; a fictional case can be used for design rehearsal.
    Goal: Recognize how formation, commitment, consolidation, strain, repair, renewal or ending changes
    what a partnership needs, without forcing every relationship through a fixed sequence. Scope: Stage
    language is an organizing aid, not a diagnosis or a universal timetable. A relationship may revisit
    several conditions at once, and ending can be a legitimate outcome. Time and effort: Twenty minutes
    to compare past and present needs, one willing conversation and a review after one small trial. Adaptation:
    Use asynchronous communication, separate reflection or suitable professional support. Do not conduct
    a mutual-stage exercise where coercion or abuse makes negotiation unsafe. A fictional trial plan is
    not evidence of a relationship adapting in practice. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous communication, separate reflection or suitable professional support.
    Do not conduct a mutual-stage exercise where coercion or abuse makes negotiation unsafe. A fictional
    trial plan is not evidence of a relationship adapting in practice.
  expected_burden: Twenty minutes to compare past and present needs, one willing conversation and a review
    after one small trial.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Relationship stages and changing needs protocol to rank worth, coerce participation, demand
