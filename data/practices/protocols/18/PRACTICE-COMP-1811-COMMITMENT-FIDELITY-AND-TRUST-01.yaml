  - stable_id: PRACTICE-COMP-1811-COMMITMENT-FIDELITY-AND-TRUST-01-A3
    sequence: 3
    title: Match one real action to the agreement and review repair needs
    instructions: 'At a relevant ordinary opportunity, follow the clarified promise or disclose that you
      cannot freely agree before acting contrary to it. If a breach has occurred, identify truthful acknowledgment,
      appropriate repair and any qualified support needed, without demanding immediate forgiveness. Review
      whether the agreement is understood and sustainable; one compliant action is not proof that all
      trust has been restored.


      Observation checks: Conduct follows the actual agreement or a prior honest renegotiation; A breach
      receives acknowledgment rather than concealment; Repair does not demand immediate forgiveness; One
      action is not generalized into complete restored trust. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which promise became clearer, and did your next action support trust through honesty
      rather than through control over the other person’s privacy?


      Examples: Supportive: The partners distinguished an unspoken assumption from an explicit commitment
      and agreed a contact boundary without requiring device access.


      Mixed: The boundary was clear but one person could not freely accept it, revealing a real compatibility
      issue instead of a monitoring problem.


      Contradictory: Password sharing or constant tracking was demanded as proof of fidelity, or a prior
      breach was rewritten out of the record.


      Inconclusive: Trust was discussed as a feeling without identifying any promise, conduct or change-notification
      rule.'
