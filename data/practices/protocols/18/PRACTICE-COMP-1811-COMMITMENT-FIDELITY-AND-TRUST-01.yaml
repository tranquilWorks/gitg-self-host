  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Noor tells Tavi about the invitation on 7 October before responding to Eden. They discuss the existing
      notification agreement. Tavi confirms it does not require a password or a report of every message.
      Noor decides to decline the coffee and sends a clear decline. No meeting is booked or held.


      Tavi then proposes that they notify each other about every future message from former partners.
      Noor says that scope feels too broad and asks to consider what information is materially relevant.
      Tavi does not withdraw the proposal, and Noor does not accept it. They agree only to revisit the
      question on 12 October. That review has not occurred.


      Identify the conduct consistent with the existing promise, the declined invitation and the unaccepted
      expansion. Do not record the proposed all-message rule as operative. Nor does this one event establish
      complete restored trust: no prior breach was supplied, and durable reliability is a longer claim.
      A constructive review preserves the current agreement, acknowledges Tavi''s concern and keeps both
      people''s freedom to decline new restrictions.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Clarify what has actually been promised, what has merely been assumed, and what needs discussion
      before acting. Allow twenty minutes to prepare, a willing adult conversation, and review at one
      relevant opportunity. Partnership and sexual involvement are optional; single life needs no fidelity
      exercise. Use the fiction instead of contacting an ex-partner or opening someone else''s accounts.


      ### Trust needs an identifiable promise


      Commitment gives a relationship particular expectations about how people will act. Exclusivity may
      concern romantic or sexual involvement, but its details cannot be inferred perfectly from a label.
      Loyalty concerns honoring actual commitments and treating a partner''s legitimate interests seriously;
      it does not require concealing wrongdoing or abandoning other relationships. Different chosen forms
      can involve fidelity when their participants keep the promises they actually made.


      Privacy and transparency are related but distinct. Privacy permits a personal sphere and protects
      third-party confidences. Transparency supplies truthful information relevant to a shared commitment.
      A material fact should not be hidden by renaming it privacy, but transparency does not require unrestricted
      devices, passwords, location feeds or surveillance. A partner''s fear is important information about
      their experience, not automatic authority over another person''s communications.


      Temptation or attraction is not identical to conduct. Notice a wish or risky situation early enough
      to make a responsible choice: follow the existing promise, decline the opportunity, or seek a freely
      agreed change before acting contrary to it. An unaccepted proposal does not suspend the old agreement.
      If a promise was already broken, retroactively choosing a different label cannot erase that breach.


      Repair after a breach includes truthful acknowledgment, relevant practical steps and later reliability;
      it cannot be purchased through unlimited monitoring or compelled forgiveness. Trust may reasonably
      remain limited after one compliant event. Conversely, a single ambiguous message does not justify
      declaring betrayal without knowing the agreement and the relevant facts. Keep evidence, interpretation
      and uncertainty separate.


      ### Worked example


      Two partners explicitly agreed to tell each other before making a one-to-one social plan with a
      former romantic partner. One receives an invitation and tells the other before replying. That follows
      the notification promise. It does not mean the other person now has every password, or that any
      possible meeting is automatically agreed. If the existing agreement also required a particular discussion
      before booking, that condition still matters. Precision prevents both hidden exceptions and invented
      restrictions.


      ### Supplied fictional task


      Adult partners Noor and Tavi chose an exclusive relationship. Their written private agreement says:
      no romantic or sexual involvement with others; tell each other before arranging a one-to-one social
      meeting with a former romantic partner; neither has agreed to share account access. They did not
      agree that every ordinary message from an ex must be reported. Neither has disclosed a previous
      breach in this case.


      On 6 October Noor receives a message from former partner Eden asking to meet for coffee on 11 October.
      Noor feels curious and has not replied or booked. Tavi has recently said that surprise plans feel
      unsettling but has not requested a new agreement. Noor assumes Tavi would prefer never hearing Eden''s
      name. This is an interpretation, not a confirmed instruction. No secret relationship, threat or
      existing meeting is supplied.


      ### Separate promises and decide before acting


      1. Create three columns: explicit agreement, personal assumption and needs discussion. Place exclusivity,
      prior notification and no account-sharing agreement accurately. Put the assumption about never naming
      Eden in its own column. Output: an agreement map that neither invents a prohibition nor hides an
      applicable promise.

      2. Identify the pending decision and its timing. Noor has time to communicate before arranging the
      proposed 11 October meeting. Draft a truthful, modest disclosure and question about the actual boundary.
      Do not copy Eden''s private messages or share unrelated information. Output: an authorized conversation
      proposal, not a surveillance report.

      3. Consider three routes: decline the invitation, follow the existing agreement while clarifying
      its application, or propose a change and wait for a freely accepted answer before contrary action.
      Name any genuine incompatibility if a promise cannot be accepted. Output: a decision with the still-operative
      agreement visible.

      4. Write what would count as follow-through at this opportunity: for example, notification before
      booking, with any further discussion requirement identified rather than assumed and an accurate
      account of the eventual decision. Distinguish temptation recognized from a breach committed. Output:
      a behavioral check tied to the promise, not a test of inner purity.

      5. Read the [later packet](?resource=file-later-packet-md). Determine whether the conduct matches
      the existing promise and whether a proposed change was ever accepted. Output: a narrow conclusion
      about this opportunity, plus any unresolved expectation.


      ### Support, difficulty and transfer


      For support, work with one clear promise in fiction and ask a reader to identify which action it
      governs. Do not demand that a real partner write a contract as a condition of trust. For a harder
      case, introduce an actual prior breach and require acknowledgment separate from future renegotiation.
      Do not conduct covert loyalty tests or create a tempting situation as an assessment.


      For optional real transfer, review one ambiguous expectation at a calm time with a willing adult
      partner. Include boundaries each person cannot freely accept. A clear incompatibility may require
      reconsidering the relationship rather than more monitoring. At the next actual relevant opportunity,
      follow or openly renegotiate the agreement before acting. Record only a minimal action status, not
      private messages. A plan to behave reliably is not longitudinal evidence of reliability.


      ### Source use


      [love is respect''s boundaries guidance, S07](https://www.loveisrespect.org/resources/what-are-my-boundaries/)
      informs the distinction between personal limits and control, including digital privacy. [Specialist
      safety guidance, S14](https://www.thehotline.org/plan-for-safety/) informs the route for coercion
      concerns. Neither defines the correct relationship form for everyone or validates this promise map.
      The fictional agreement and decision cases are original.


      ### Use the result at its proper scale


      Consent, health, abuse, and legal concerns require appropriate medical, legal, or safeguarding resources.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt independently before [answers](?check=practice-answers).


      1. Someone breaks an exclusivity promise, then says the relationship is now nonexclusive so there
      was no betrayal. What distinction is missing?

      2. A person feels attracted to someone else but declines an opportunity that would breach their
      agreement. Is attraction alone evidence of broken fidelity?

      3. A partner demands continuous location access as the only acceptable proof of repair. Is that
      automatically justified by a previous breach?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A future freely negotiated change cannot retroactively erase a prior promise or its breach.
      Acknowledge the actual conduct and effect separately from any new proposal. Nonexclusive structures
      also require honest agreement; changing a label unilaterally supplies none.

      2. No. Inner attraction and conduct are different. The supplied behavior honored the promise at
      that opportunity. It neither proves perfect future reliability nor establishes an unreported breach.

      3. No. A breach matters, but it does not create unlimited control or remove privacy and safety boundaries.
      Discuss proportionate truthful repair and freely acceptable commitments; incompatibility may remain.
      Coercive monitoring warrants suitable support, not a trust score.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
