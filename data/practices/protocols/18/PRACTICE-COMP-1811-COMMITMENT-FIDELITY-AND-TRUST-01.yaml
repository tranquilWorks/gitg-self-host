meaning_and_fit:
  purpose: Make exclusivity, loyalty, privacy and transparency expectations explicit, then act consistently
    with the promises actually made rather than relying on surveillance or unspoken rules.
  why_recommended: Make exclusivity, loyalty, privacy and transparency expectations explicit, then act
    consistently with the promises actually made rather than relying on surveillance or unspoken rules.
  claims:
  - statement: Make exclusivity, loyalty, privacy and transparency expectations explicit, then act consistently
      with the promises actually made rather than relying on surveillance or unspoken rules.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Commitment, fidelity, and trust practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Commitment, fidelity, and trust as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use written agreements in plain language or suitable professional support
    when both people freely choose it. Do not use this exercise to negotiate under threats or coercion.
    Legal, health and safety consequences may require separate qualified guidance.
  opportunity_considerations: 'Default uncertainty: partners have different assumptions about what private
    messaging with former partners means. Prepare three columns: explicitly agreed, assumed and needing
    discussion. Include the possibility that a material agreement already exists and has been broken;
    clarification must not erase that history.'
  prerequisites:
  - 'Default uncertainty: partners have different assumptions about what private messaging with former
    partners means. Prepare three columns: explicitly agreed, assumed and needing discussion. Include
    the possibility that a material agreement already exists and has been broken; clarification must not
    erase that history.'
  dependencies: []
  safe_alternatives:
  - Use written agreements in plain language or suitable professional support when both people freely
    choose it. Do not use this exercise to negotiate under threats or coercion. Legal, health and safety
    consequences may require separate qualified guidance.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Commitment, fidelity, and trust differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Commitment, fidelity, and
    trust as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default uncertainty: partners have different assumptions about what private messaging with former
    partners means. Prepare three columns: explicitly agreed, assumed and needing discussion. Include
    the possibility that a material agreement already exists and has been broken; clarification must not
    erase that history. Goal: Make exclusivity, loyalty, privacy and transparency expectations explicit,
    then act consistently with the promises actually made rather than relying on surveillance or unspoken
    rules. Scope: Use a safe adult relationship or fictional case. This does not prescribe monogamy or
    another relationship form, excuse dishonesty, require password sharing or determine legal rights.
    Time and effort: Twenty minutes to prepare, a twenty-minute willing conversation and a review at one
    relevant ordinary opportunity. Adaptation: Use written agreements in plain language or suitable professional
    support when both people freely choose it. Do not use this exercise to negotiate under threats or
    coercion. Legal, health and safety consequences may require separate qualified guidance. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written agreements in plain language or suitable professional support when
    both people freely choose it. Do not use this exercise to negotiate under threats or coercion. Legal,
    health and safety consequences may require separate qualified guidance.
  expected_burden: Twenty minutes to prepare, a twenty-minute willing conversation and a review at one
    relevant ordinary opportunity.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Commitment, fidelity, and trust protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Commitment, fidelity, and trust action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written
    agreements in plain language or suitable professional support when both people freely choose it. Do
    not use this exercise to negotiate under threats or coercion. Legal, health and safety consequences
    may require separate qualified guidance.
  actions:
  - stable_id: PRACTICE-COMP-1811-COMMITMENT-FIDELITY-AND-TRUST-01-A1
    sequence: 1
    title: Separate actual promises from expectations that were never stated
    instructions: 'List the relevant commitments in neutral language, including exclusivity, contact boundaries,
      privacy and what information each person has agreed to share. Mark the source of each expectation:
      explicit agreement, shared convention or your own assumption. Identify any known breach without
      redefining the promise after the fact. Consider what loyalty means in conduct and what privacy remains
      legitimate even in a committed relationship.


      Observation checks: Explicit promises and assumptions are distinguished; Exclusivity loyalty privacy
      and transparency are considered; An existing breach is not erased by relabeling the agreement; Privacy
      is not automatically equated with secrecy or wrongdoing. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1811-COMMITMENT-FIDELITY-AND-TRUST-01
      action_stable_id: PRACTICE-COMP-1811-COMMITMENT-FIDELITY-AND-TRUST-01-A1
      competency_stable_id: '18.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
