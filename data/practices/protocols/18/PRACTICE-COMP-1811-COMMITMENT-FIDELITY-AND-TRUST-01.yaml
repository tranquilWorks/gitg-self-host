  - stable_id: PRACTICE-COMP-1811-COMMITMENT-FIDELITY-AND-TRUST-01-A2
    sequence: 2
    title: Negotiate a clear boundary without demanding surveillance
    instructions: 'Discuss the uncertain area and ask what each person considers respectful, misleading
      or incompatible with the chosen relationship. State a concrete boundary and a change-notification
      rule rather than demanding access to all messages, devices or location. Acknowledge that some preferences
      may be incompatible and cannot be solved through monitoring. No agreement gives anyone ownership
      of another person or removes ongoing consent.


      Observation checks: The boundary concerns concrete conduct and information needs; Changes to commitments
      require an explicit conversation; Surveillance is not used as the default proof of trust; Incompatibility
      and ongoing autonomy remain possible. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
