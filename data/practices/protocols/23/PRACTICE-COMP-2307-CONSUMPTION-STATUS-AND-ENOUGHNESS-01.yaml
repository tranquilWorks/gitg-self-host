meaning_and_fit:
  purpose: Compare purpose, durability, maintenance, total cost and enjoyment with status pressure before
    deciding whether to keep, repair or replace an ordinary possession.
  why_recommended: Compare purpose, durability, maintenance, total cost and enjoyment with status pressure
    before deciding whether to keep, repair or replace an ordinary possession.
  claims:
  - statement: Compare purpose, durability, maintenance, total cost and enjoyment with status pressure
      before deciding whether to keep, repair or replace an ordinary possession.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Consumption, status, and enoughness practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Consumption, status, and enoughness as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use any safe ordinary possession already available and no actual purchase
    when money or access is limited. A support person can compare disclosures without steering the decision.
    Do not equate scarcity with virtue or shame a person for accessibility, comfort, cultural expression
    or an essential replacement.
  opportunity_considerations: Use a safe, serviceable chair with a cosmetic scratch as the default; do
    not sit on damaged or unstable furniture. The fictional options are keep for zero additional cost,
    a permitted cosmetic repair for 15, a used replacement for 60 plus 20 transport, or a new replacement
    for 150 plus 20 delivery. State that prices are invented, not market quotes.
  prerequisites:
  - Use a safe, serviceable chair with a cosmetic scratch as the default; do not sit on damaged or unstable
    furniture. The fictional options are keep for zero additional cost, a permitted cosmetic repair for
    15, a used replacement for 60 plus 20 transport, or a new replacement for 150 plus 20 delivery. State
    that prices are invented, not market quotes.
  dependencies: []
  safe_alternatives:
  - Use any safe ordinary possession already available and no actual purchase when money or access is
    limited. A support person can compare disclosures without steering the decision. Do not equate scarcity
    with virtue or shame a person for accessibility, comfort, cultural expression or an essential replacement.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Consumption, status, and enoughness differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Consumption, status, and enoughness
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a safe, serviceable chair with a cosmetic scratch as the default; do not sit on damaged
    or unstable furniture. The fictional options are keep for zero additional cost, a permitted cosmetic
    repair for 15, a used replacement for 60 plus 20 transport, or a new replacement for 150 plus 20 delivery.
    State that prices are invented, not market quotes. Goal: Compare purpose, durability, maintenance,
    total cost and enjoyment with status pressure before deciding whether to keep, repair or replace an
    ordinary possession. Scope: One low-cost possession tests consumption judgment, not moral purity,
    deprivation or a recommendation to buy a named product. Comfort and beauty can be legitimate benefits.
    Time and effort: Fifteen minutes to compare options, two ordinary uses of the existing item and a
    ten-minute decision review. Adaptation: Use any safe ordinary possession already available and no
    actual purchase when money or access is limited. A support person can compare disclosures without
    steering the decision. Do not equate scarcity with virtue or shame a person for accessibility, comfort,
    cultural expression or an essential replacement. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use any safe ordinary possession already available and no actual purchase when
    money or access is limited. A support person can compare disclosures without steering the decision.
    Do not equate scarcity with virtue or shame a person for accessibility, comfort, cultural expression
    or an essential replacement.
  expected_burden: Fifteen minutes to compare options, two ordinary uses of the existing item and a ten-minute
    decision review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Consumption, status, and enoughness protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Consumption, status, and enoughness action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use any safe
    ordinary possession already available and no actual purchase when money or access is limited. A support
    person can compare disclosures without steering the decision. Do not equate scarcity with virtue or
    shame a person for accessibility, comfort, cultural expression or an essential replacement.
  actions:
  - stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A1
    sequence: 1
    title: Name the job and the pressure separately
    instructions: 'Write what the chair must do, what comfort or appearance you genuinely enjoy and what
      social impression you hope a replacement would create. Identify one dissatisfaction observable during
      use and one comparison-driven story that may or may not matter. Set a modest spending limit before
      browsing. Reject the default if there is a safety defect; necessary safe replacement is not a failure
      of restraint and cosmetic repair is not structural repair.


      Observation checks: Function safety comfort and appearance are considered separately; An observable
      dissatisfaction is distinguished from a status story; A spending limit is set before comparison;
      The exercise does not require using unsafe furniture. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01
      action_stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A1
      competency_stable_id: '23.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2307_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2307_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - function_safety_comfort_and_appearance_are_considered_separately
        - an_observable_dissatisfaction_is_distinguished_from_a_status_story
        - a_spending_limit_is_set_before_comparison
        - the_exercise_does_not_require_using_unsafe_furniture
      - measurement_id: c2307_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2307_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A2
    sequence: 2
    title: Compare lifetime burdens and try the existing option
    instructions: 'Total the supplied acquisition and transport costs as zero, 15, 80 and 170. Add qualitative
      entries for expected durability, cleaning, space, disposal, repair effort and uncertainty rather
      than inventing a lifespan. Use the existing safe chair on two normal occasions and record the actual
      comfort, function and enjoyment. If a safe permitted cosmetic repair is freely chosen, use only
      an appropriate ordinary method; no hazardous tool or chemical experiment is required.


      Observation checks: All four supplied costs are totaled correctly; Maintenance durability space
      and disposal have explicit entries; Two normal uses provide actual experience rather than imagined
      enjoyment; Any repair stays cosmetic permitted and safe. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01
      action_stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A2
      competency_stable_id: '23.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2307_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2307_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_four_supplied_costs_are_totaled_correctly
        - maintenance_durability_space_and_disposal_have_explicit_entries
        - two_normal_uses_provide_actual_experience_rather_than_imagined_enjoyment
        - any_repair_stays_cosmetic_permitted_and_safe
      - measurement_id: c2307_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2307_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A3
    sequence: 3
    title: Choose enough without condemning a preference
    instructions: 'Choose keep, repair, replace later or replace within a justified limit. Explain what
      the two uses changed, what benefit is worth paying for and what other use of money or space is forgone.
      Wait through one preselected pause before any optional purchase, then check whether the reason still
      holds. Record the decision and, only if it occurs, the later actual use; buying nothing and choosing
      comfort are both potentially reasonable outcomes.


      Observation checks: The decision refers to observed function and enjoyment; A foregone alternative
      is named; An optional purchase has a deliberate pause rather than pressure; The outcome does not
      label ownership or restraint as superior worth. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What did using the item reveal that comparison alone did not, and is the chosen expenditure
      or restraint proportionate to that evidence?


      Examples: Supportive: Two uses showed the chair worked comfortably, so a small cosmetic repair met
      the real aim without pretending appearance was unimportant.


      Mixed: The function was adequate but enjoyment remained low; replacement was deferred until the
      budget and disposal questions were clearer.


      Contradictory: The person kept unsafe furniture to prove discipline or bought under status pressure
      while calling the cost comparison irrelevant.


      Inconclusive: A preferred option was selected without a use test, total-cost comparison or explanation
      of the actual need.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01
      action_stable_id: PRACTICE-COMP-2307-CONSUMPTION-STATUS-AND-ENOUGHNESS-01-A3
