  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Two supplied uses and an unexecuted decision


      **Use 1, fictional Tuesday:** twenty minutes of reading are comfortable; the chair stays stable
      and fits the desk. The owner notices the scratch while entering the room but not while reading.
      Cleaning takes the usual brief wipe; no new difficulty is reported.


      **Use 2, fictional Thursday:** another ordinary twenty-minute reading period is comfortable. The
      scratch still reduces enjoyment of the room''s appearance. No visitor judgment is observed. Function
      is adequate, and the appearance preference remains real; the use test does not require dismissing
      it.


      After the supplied **48-hour pause**, the owner provisionally chooses the **15 cosmetic option**,
      leaving **65** of the optional 80 limit unspent. Compared with the 80 used replacement, it preserves
      65; compared with keeping, it costs an extra 15. The foregone alternative is retaining that 15 for
      a later book purchase. No repair has been performed, so improved appearance or satisfaction is not
      established.


      The next step would be to verify a safe permitted method suitable for the chair''s material; the
      packet provides none and instructs no repair procedure. Keeping while that remains unresolved is
      legitimate. No purchase or disposal occurs.


      Compare these supplied observations with your predicted ones. If you assumed “comfortable” meant
      “appearance no longer matters,” revise that conclusion. If you assumed a new chair would impress
      visitors, keep that as an untested story. For actual transfer, two real uses and the real pause
      need their own private record; this fiction cannot supply them.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Decide whether replacing one ordinary possession serves a real need. Spend fifteen minutes
      comparing options, use a safe existing item on two normal occasions if you choose actual practice,
      then review the decision for ten minutes. The default is a fully fictional chair case with a separate
      supplied two-use packet. Fictional observations are never recorded as your actual experience.


      ### Ask what the object needs to do


      A possession can provide function, comfort, beauty, cultural expression and social meaning. These
      benefits deserve examination without assuming that every preference is wasteful or every purchase
      worthwhile. Status pressure often appears as a prediction about what others will think; that prediction
      is different from a discomfort observed during use. A new chair might improve either, both or neither.


      Enoughness means identifying a proportionate stopping point for this need under current constraints.
      It does not require the cheapest possible life or turn scarcity into virtue. Necessary accessibility,
      safety and comfort can justify spending. Conversely, a discount or attractive image does not answer
      whether an object fits the available space, solves the problem or creates maintenance work that
      outweighs its benefit.


      The FTC''s [comparison-shopping guidance, S14](https://consumer.ftc.gov/articles/online-shopping)
      supports considering total charges, condition and return terms. Only those educational comparison
      points are used here; no seller has been evaluated and no product price is current. The invented
      prices and observations below support a decision exercise, not a recommendation to buy a named chair.


      ### Complete original choice file E3


      The existing chair is **safe, stable and serviceable**, with a cosmetic scratch on one side. It
      is suitable for ordinary seated reading; no structural defect is supplied. Do not use this case
      to justify sitting on damaged or unstable furniture. If an actual item is unsafe, stop the use test
      and choose a safe alternative; an essential replacement is not a failure of restraint.


      The fictional owner wants comfortable twenty-minute reading, a tidy appearance in a small room and
      easier cleaning. They dislike seeing the scratch near the desk. A separate status story is, “A new
      chair might make visitors think the room is more grown-up.” No visitor has said this, and it remains
      a prediction. Before looking at alternatives, the owner sets a **maximum optional outlay of 80**
      for this decision and a **48-hour pause** before any optional purchase. These are supplied preferences,
      not universal spending rules.


      | Option | Acquisition | Delivery or transport | Immediate total | Relevant uncertainty |

      | --- | --- | --- | --- | --- |

      | Keep | 0 | 0 | 0 | Long-term enjoyment after noticing the scratch |

      | Permitted cosmetic repair | 15 | 0 | 15 | Whether the finish improves enough to matter |

      | Used replacement | 60 | 20 | 80 | Condition, fit, return terms and remaining life |

      | New replacement | 150 | 20 | 170 | Actual comfort, fit and whether appearance merits the cost
      |


      The cosmetic option addresses appearance only; it is not structural repair. The prices are invented.
      No purchase, repair, disposal or market inspection has occurred. Expected lifespan is unknown for
      every option; do not invent years of service to produce a precise “cost per use.” The current chair
      fits the room. Replacement dimensions and packaging/disposal arrangements are not supplied.


      ### Compare ongoing burdens before choosing


      Keeping avoids acquisition and disposal costs but leaves the visible scratch. Cosmetic repair uses
      money and some effort while preserving the known fit; a safe permitted method would need to suit
      the material. A used replacement meets the 80 limit exactly before any unprovided costs, so condition
      and transport terms matter. The new chair exceeds the current limit by **90** and cannot be called
      within budget because a photograph looks appealing.


      Make a qualitative line for durability, cleaning, space, disposal and repair effort. “Unknown; need
      dimensions” is better than “probably fits.” “No replacement disposal required” is a genuine difference
      for keeping or repair. Avoid pretending that a used item is automatically poor or a new one automatically
      durable. If actual shopping is later chosen, include all applicable charges and inspect relevant
      condition and return information before relying on the total.


      ### Worked reason versus story


      Suppose an owner reports that a safe lamp illuminates a page well but its switch is awkward to reach.
      The illumination is a functional success; the reach problem is an observed usability issue; imagining
      that guests prefer a newer brand is a status prediction. The decision might favor a different accessible
      lamp even when the old one still lights up. Observing use prevents both automatic replacement and
      automatic refusal to spend.


      For E3, the scratch is a real visible feature, while its supposed effect on visitors is untested.
      It may still be worth paying a small amount for an appearance the owner enjoys. The question is
      whether that benefit survives normal use and the pause, fits the limit and is worth what the money
      or space could otherwise do.


      ### Produce the decision in order


      1. State the chair''s required job, safety condition, desired comfort and appearance, and the separate
      status story. Retain the 80 limit and 48-hour pause before comparison. Do not redefine the limit
      after seeing the expensive option without acknowledging a new budget decision.

      2. Calculate all four totals and add the five ongoing-burden lines. Keep unknown lifespan, dimensions
      and condition explicit. Identify any later information needed before a real purchase.

      3. For this fictional case, save your predicted observations before opening the [later packet](?resource=file-later-packet-md).
      For optional actual practice, use a safe available item twice on ordinary occasions and privately
      record function, comfort, cleaning and enjoyment as actually experienced. Never substitute the supplied
      packet for real observations.

      4. Choose keep, cosmetic repair, defer replacement or replace within a justified limit. Explain
      what the two uses changed and which benefit is worth paying for. Name an opportunity cost, such
      as delaying another chosen purchase or retaining less flexible cash.

      5. Wait through the preselected pause before any optional purchase in actual practice. Recheck the
      reason and total. Record a decision separately from a purchase and a purchase separately from later
      actual enjoyment. Nothing must be bought to complete the learning.


      For support, compare only keep and repair first, then add the replacements. For a harder pass, discover
      an unlisted transport charge and revise the comparison before commitment. A support person can explain
      terms without steering the owner''s preferences. Actual repair, if freely chosen, must be safe,
      ordinary and permitted; no hazardous tool or chemical experiment is required. A decision can value
      comfort and beauty while rejecting a pressure-driven purchase. Neither spending nor restraint establishes
      a person''s worth.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A used item costs 45 plus 18 transport and 7 handling. What should be compared with a 60 delivered
      alternative?

      2. A chair is unstable but keeping it would save money. Should the learner sit in it twice to demonstrate
      restraint?

      3. Two uses show adequate function, but the owner still values appearance. Must the decision be
      to keep without spending?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The used item totals 70, not 45. Compare condition, fit, durability uncertainty and terms
      as well as the complete cost. The lower sticker price does not establish the better choice.

      2. No. Stop the unsafe use test and use a safe alternative. Cosmetic repair is not structural repair;
      necessary safety or accessibility spending is not a failure of enoughness.

      3. No. Appearance and comfort can be legitimate benefits. Consider a proportionate option, the preselected
      limit, total burdens, opportunity cost and pause; do not equate restraint with moral superiority
      or invent satisfaction before later use.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
