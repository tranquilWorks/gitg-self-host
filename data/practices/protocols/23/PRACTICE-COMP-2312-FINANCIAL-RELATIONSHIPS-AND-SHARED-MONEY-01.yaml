        criteria:
        - both_contribution_methods_and_percentages_are_correct
        - care_costs_obligations_and_dependence_receive_explicit_consideration
        - each_person_s_concern_and_privacy_boundary_are_heard
        - no_surveillance_or_compulsory_account_access_is_introduced
      - measurement_id: c2312_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
