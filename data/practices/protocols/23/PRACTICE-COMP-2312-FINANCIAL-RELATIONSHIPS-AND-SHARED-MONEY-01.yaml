  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Income falls; the formula is only a proposal


      In the supplied next month, Bea''s income falls to **1800** while Ari''s remains **1200**. Shared
      costs still total 900. A proportional recalculation gives **360 for Ari and 540 for Bea**, each
      **30%** of income. Ari''s contribution would increase by 60 even though Ari''s income did not rise.
      The previous month''s 300/600 agreement does not automatically authorize this change.


      Ari says the additional 60 is not currently feasible alongside necessary care. Both agree to discuss
      a temporary arrangement before any commitment, but no revised allocation has yet been accepted.
      The correct status is a changed-income review with affordability unresolved, not “agreement implemented.”
      The household must also examine any imminent due dates through an appropriate practical support
      route; pending agreement does not make the bills disappear.


      The relative now says the possible 200 would require repayment within two months. This clarifies
      that it is proposed borrowing, not a gift, but neither adult has accepted it and no funds are available.
      Repayment feasibility and qualified questions remain open.


      Save the new arithmetic and the refusal without treating disagreement as failure. Do not let Bea''s
      lower income justify account surveillance or Ari''s care costs justify making commitments for Bea.
      The supplied record establishes only a fictional first-month agreement and a later unresolved renegotiation.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Write a shared-money agreement whose contributions, privacy limits and decision rights can
      be reviewed without giving one person control over the other. Allow twenty-five minutes for the
      comparison and conversation, then ten for an income change. The supplied case involves consenting
      adults and contains no actual account data.


      ### Fairness needs an explicit basis


      Equal amounts and equal proportions answer different questions. Equal contributions divide a bill
      evenly. Proportional contributions divide it according to an agreed income basis. Neither automatically
      accounts for disability costs, care, debt already owed, unequal unpaid work or access to resources.
      A couple or household must be able to discuss those differences without treating the higher earner
      as the owner of all decisions.


      Secrecy, privacy and coercion also differ. An agreement may need enough information to calculate
      an accepted contribution; that does not entitle a partner to every transaction, password or private
      communication. Hidden borrowing against shared resources creates a different concern from retaining
      reasonable personal privacy. A rule allowing “discussion” is not permission to make a commitment
      first and explain it afterward.


      The CFPB''s [family financial-help questions, S01](https://www.consumerfinance.gov/consumer-tools/educator-tools/adult-financial-education/tips-for-managing-family-lending-and-borrowing/)
      support clarifying expectations, capacity and changes. They do not select a universally fair contribution
      formula or provide a valid household contract. If pressure, retaliation or financial control makes
      joint discussion unsafe, use private, appropriate support rather than a forced meeting. The fictional
      case below assumes willingness to discuss and freedom to decline.


      ### Supplied household card M4


      Ari receives **1200 take-home units per month** and Bea receives **2400 take-home units** on the
      same agreed income basis. Shared monthly costs are **900**, made up of 600 housing contribution,
      200 food and 100 utilities. These are sample household figures, not a complete personal budget.
      Ari also has necessary care costs outside this pot; their amount is private and not supplied. Neither
      has authorized the other to borrow, change ownership or access an individual account.


      Both can consider two initial allocations:


      | Method | Ari pays | Bea pays | Ari share of income | Bea share of income |

      | --- | ---: | ---: | ---: | ---: |

      | Equal amount | 450 | 450 | 37.5% | 18.75% |

      | Proportional to supplied income | 300 | 600 | 25% | 25% |


      The proportional calculation is 900 times 1200/3600 and 900 times 2400/3600. It leaves 900 and 1800
      respectively before individual obligations. Those remainders are not established discretionary cash
      because necessary private costs are missing. The comparison supports a conversation; it does not
      prove affordability.


      In the supplied dialogue, Ari says, “I need the care costs to remain possible, and I don''t want
      account monitoring.” Bea says, “I need shared commitments to be visible before they become my responsibility.”
      Both agree to use 300/600 for one fictional month, subject to each confirming affordability privately.
      Confirmation is supplied for that initial month only. Their concerns must appear in the agreement,
      not disappear behind the formula.


      ### Distinguish a budget rule from authority


      The sample agreement funds only the three named shared categories. Each person may make an ordinary
      purchase **up to 100 units** within those categories and within the remaining category budget, recording
      the amount in the shared ledger. Larger purchases require both people''s prior agreement. A purchase
      outside the shared categories requires both people''s prior agreement at any amount. Discussion
      itself does not authorize borrowing, pledging property, expanding the budget or taking money from
      an individual account.


      With 90 still available in the food category, an ordinary **80-unit food purchase** fits the delegated
      rule and leaves 10. A **110-unit purchase** exceeds both the threshold and the available category
      balance; talking about it does not create funding. Splitting the 110 into smaller receipts would
      not make the same commitment legitimate. A proposed new item must identify whose funds and agreement
      would cover it.


      A relative mentions **200 units of possible help**. Whether this would be a gift or a loan is unknown,
      and nothing is received or promised to the household on clear terms. Do not put it in available
      income. Clarify amount, recipient, repayment expectations, conditions and effects on the household
      before any acceptance. A gift can also introduce control if the giver expects a say in unrelated
      decisions.


      ### Produce the reviewable agreement


      1. Recalculate both contribution methods and income percentages. Describe the fairness principle
      each uses and one important fact it does not capture. Do not infer that private necessary care costs
      can be cut.

      2. Write each person''s concern and privacy boundary in neutral language. State the limited information
      needed for the selected method, who may see it and what account access remains unauthorized.

      3. Record the first-month 300/600 contributions, named shared categories and a contribution date
      before those shared costs fall due. In this fiction both choose day 1; actual households must use
      their real pay and bill dates.

      4. Specify the 100-unit rule, available-budget condition and prior joint agreement for exceptions.
      Work the 80 and 110 examples. Keep possible relative help in an unresolved field outside resources.

      5. Set a month-end review and an earlier review if income, care needs or shared costs change. Preserve
      the first agreement and open the [later packet](?resource=file-later-packet-md). Do not rewrite
      the original as though later agreement already existed.


      A useful ledger records category, amount, date, permission where needed and remaining balance. It
      need not expose unrelated personal purchases. Contributions should be distinguishable from ownership:
      paying a larger share does not by itself settle property title or legal liability. Where rights
      matter, obtain qualified local advice rather than treating the exercise as an enforceable agreement.


      ### Practice disagreement without manufacturing consent


      For support, begin with the two-row comparison and use a separate color for “discussed,” “agreed”
      and “paid.” A helper can check the percentages without seeing real account data. For a harder pass,
      change one income and explore why applying the same formula may still create an unaffordable burden.
      A smaller total, a different temporary share or a support request would each require explicit agreement
      and realistic consequences.


      Optional actual transfer is a willing, low-stakes conversation about one shared expense. Do not
      send an agreement on someone else''s behalf or demand private proof to finish a competency. If no
      shared arrangement applies, use the fictional case and mark real transfer unattempted. An actual
      agreement artifact plus a later record of a decision or revision could support progress; neither
      a hypothetical signature nor a balanced table proves trust, consent or a safe financial relationship.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fiction or privately redacted records; keep credentials
      and sensitive identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Incomes are 1000 and 3000 with shared costs of 800. What are equal and proportional contributions?

      2. Both partners discussed a 150-unit purchase under a rule requiring prior joint approval above
      100. One stayed silent. Is it approved?

      3. One person refuses to share passwords but agrees to disclose the figure needed for an accepted
      contribution method. Is that automatically secrecy or non-cooperation?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Equal amounts are 400 each, or 40% and about 13.33% of income. Proportional amounts are
      200 and 600, or 20% each. Affordability and fairness still depend on obligations and agreed principles.

      2. Discussion and silence are not explicit joint agreement. Keep it pending and check funding and
      scope. Do not split the purchase to evade the threshold or take individual funds.

      3. No. Necessary shared information and complete account access differ. Respect the agreed privacy
      boundary and assess actual undisclosed shared commitments separately; coercive monitoring is not
      a competency requirement.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
