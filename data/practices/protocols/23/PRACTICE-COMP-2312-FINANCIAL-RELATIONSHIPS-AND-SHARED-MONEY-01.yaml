  - stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01-A3
    sequence: 3
    title: Test the agreement against ordinary and difficult cases
    instructions: 'Apply the rules to the 80 purchase, the 110 purchase and the ambiguous 200 offer. Under
      the sample threshold, 110 requires discussion; the 80 still must fall within the agreed shared scope
      and available budget. Do not count the 200 as a gift until the terms are clarified. Add an income-loss
      scenario and decide when to revisit contributions. Record agreement, unresolved disagreement and
      any safety concern separately; no signature or money movement is required.


      Observation checks: All three supplied cases are resolved using the written rules; Below-threshold
      spending still respects scope and available funds; Ambiguous support is not silently treated as
      a gift; Income change and unresolved disagreement trigger review rather than control. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Could both people explain their rights and obligations under the same agreement, and
      what difference or safety concern remains unresolved?


      Examples: Supportive: The pair compared equal and proportional burdens, retained private resources
      and discovered that a below-threshold purchase could still violate the shared scope.


      Mixed: A contribution method was agreed, but the family offer remained ambiguous and was excluded
      from the plan.


      Contradictory: One person demanded passwords or used income to override consent, or an unclear family
      loan was counted as a gift.


      Inconclusive: Fairness was asserted without amounts, authority rules, scenarios or an explicit review
      process.'
    expected_time: 15-25 minutes
