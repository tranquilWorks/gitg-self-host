meaning_and_fit:
  purpose: Make contribution, spending authority, risk, gifts and review expectations explicit while preserving
    consent, privacy and protection from coercive control.
  why_recommended: Make contribution, spending authority, risk, gifts and review expectations explicit
    while preserving consent, privacy and protection from coercive control.
  claims:
  - statement: Make contribution, spending authority, risk, gifts and review expectations explicit while
      preserving consent, privacy and protection from coercive control.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Financial relationships and shared money practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Financial relationships and shared money as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a neutral fictional case, separate preparation, an accessible communication
    method or a qualified mediator only when participation is safe and voluntary. Suspected financial
    abuse, retaliation, stalking or coercion calls for appropriate independent support; do not use joint
    disclosure or mediation to make an unsafe person more powerful.
  opportunity_considerations: Two fictional adults have monthly take-home incomes 1,200 and 2,400 and
    shared costs of 900. Compare equal contributions with proportional contributions. Use a sample joint
    discretionary-spending discussion threshold of 100, a proposed purchase of 80, one of 110 and an offered
    200 from a relative whose gift-or-loan status is unclear. No real purchase or disclosure is required.
  prerequisites:
  - Two fictional adults have monthly take-home incomes 1,200 and 2,400 and shared costs of 900. Compare
    equal contributions with proportional contributions. Use a sample joint discretionary-spending discussion
    threshold of 100, a proposed purchase of 80, one of 110 and an offered 200 from a relative whose gift-or-loan
    status is unclear. No real purchase or disclosure is required.
  dependencies: []
  safe_alternatives:
  - Use a neutral fictional case, separate preparation, an accessible communication method or a qualified
    mediator only when participation is safe and voluntary. Suspected financial abuse, retaliation, stalking
    or coercion calls for appropriate independent support; do not use joint disclosure or mediation to
    make an unsafe person more powerful.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Financial relationships and shared money differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Financial relationships and
    shared money as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Two fictional adults have monthly take-home incomes 1,200 and 2,400 and shared costs of 900.
    Compare equal contributions with proportional contributions. Use a sample joint discretionary-spending
    discussion threshold of 100, a proposed purchase of 80, one of 110 and an offered 200 from a relative
    whose gift-or-loan status is unclear. No real purchase or disclosure is required. Goal: Make contribution,
    spending authority, risk, gifts and review expectations explicit while preserving consent, privacy
    and protection from coercive control. Scope: This fictional negotiation or freely chosen low-stakes
    conversation is not a marriage, tenancy, property, debt or legal agreement. Unequal incomes do not
    determine one universally fair arrangement. Time and effort: Twenty minutes to compare the case, a
    willing twenty-minute discussion or rehearsal and a ten-minute scenario review. Adaptation: Use a
    neutral fictional case, separate preparation, an accessible communication method or a qualified mediator
    only when participation is safe and voluntary. Suspected financial abuse, retaliation, stalking or
    coercion calls for appropriate independent support; do not use joint disclosure or mediation to make
    an unsafe person more powerful. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a neutral fictional case, separate preparation, an accessible communication
    method or a qualified mediator only when participation is safe and voluntary. Suspected financial
    abuse, retaliation, stalking or coercion calls for appropriate independent support; do not use joint
    disclosure or mediation to make an unsafe person more powerful.
  expected_burden: Twenty minutes to compare the case, a willing twenty-minute discussion or rehearsal
    and a ten-minute scenario review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Financial relationships and shared money protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Financial relationships and shared money action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a neutral
    fictional case, separate preparation, an accessible communication method or a qualified mediator only
    when participation is safe and voluntary. Suspected financial abuse, retaliation, stalking or coercion
    calls for appropriate independent support; do not use joint disclosure or mediation to make an unsafe
    person more powerful.
  actions:
  - stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01-A1
    sequence: 1
    title: Compare contribution rules and the pressures behind them
    instructions: 'Calculate equal contributions of 450 each: 37.5% of the lower income and 18.75% of
      the higher. Calculate income-proportional contributions of 300 and 600: 25% each. Discuss how unpaid
      care, disability costs, existing obligations, ownership and financial dependence may affect fairness
      beyond those percentages. Each person states a legitimate concern and a privacy boundary. Do not
      require complete account access, secret monitoring or surrender of independently controlled resources
      to demonstrate trust.


      Observation checks: Both contribution methods and percentages are correct; Care costs obligations
      and dependence receive explicit consideration; Each person’s concern and privacy boundary are heard;
      No surveillance or compulsory account access is introduced. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01
      action_stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01-A1
      competency_stable_id: '23.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2312_a1_primary
      transfer_disposition: context_bound
      measurements:
