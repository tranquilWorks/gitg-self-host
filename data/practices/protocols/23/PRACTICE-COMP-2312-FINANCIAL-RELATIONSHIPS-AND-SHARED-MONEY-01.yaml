  - stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01-A2
    sequence: 2
    title: Draft the actual rules for shared decisions
    instructions: 'Write a provisional agreement covering what counts as shared cost, contribution dates,
      who may commit shared money, the sample 100 discussion threshold, how risk or a shortfall will be
      disclosed, and how gifts or loans are clarified before acceptance. State what stays individually
      controlled and how either person can request review. Use plain language and check each person’s
      understanding; disagreement is a result to retain, not permission for the higher earner to decide
      everything.


      Observation checks: Shared scope contributions and timing are specific; Spending authority and material
      risk disclosure are explicit; Gift versus loan expectations are clarified before reliance; Individual
      control and a mutual review route remain protected. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01
      action_stable_id: PRACTICE-COMP-2312-FINANCIAL-RELATIONSHIPS-AND-SHARED-MONEY-01-A2
      competency_stable_id: '23.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
