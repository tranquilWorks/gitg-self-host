    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Information improves; authority remains unresolved


      In the tabletop, Jo finds INS-SERVICE and LEGAL-DESK but cannot find a public contact route for
      CARE-SERVICE. The revised neutral card adds the fictional locator **CARE-SERVICE public contact
      page**, its Tuesday 15:00 schedule and the question, “Who may coordinate substitute support under
      the provider''s process?” No real URL or provider contact is invented.


      On a second tabletop pass, Jo locates the new card and correctly says: “I can identify the contact
      and ask about the process; I have no supplied authority to move money or make dependent-care decisions.”
      This is an information-handoff improvement. It is not a completed care arrangement, bill payment
      or legal appointment.


      The source-based trusted-contact question is answered narrowly by S12. The proposed provider and
      professional inquiries remain **drafted, unsent**. The life policy''s coverage for the actual event,
      current beneficiaries, financial powers, estate validity and dependent-care authority all remain
      unverified. A renewal or changed dependent need triggers review of the map; no actual protection
      is certified.


      Retain the gap instead of upgrading Jo''s role to make the handoff appear complete. For actual use,
      a legitimate provider response or qualified appointment would be a later, separate event recorded
      without uploading confidential documents or credentials.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Make a continuity map for a fictional adult who is unavailable for one month. Use two twenty-minute
      sessions and one bounded official-source inquiry. Your output is a map of locations, roles and unanswered
      questions, not a will, power of attorney, coverage recommendation or legal determination.


      ### A helpful contact may still lack authority


      Continuity requires more than a folder of documents. The right person must be able to locate relevant
      information, understand the next step and have the authority that step requires. Being trusted,
      related, named as an emergency contact or designated as a beneficiary does not automatically authorize
      every action. A person may be able to notify a provider of a concern without being entitled to withdraw
      funds or make a dependent''s decisions.


      The CFPB''s [financial-help explanation, S12](https://www.consumerfinance.gov/ask-cfpb/i-would-like-to-be-able-to-have-my-friend-or-family-member-help-with-my-bill-paying-and-banking-what-are-my-options-en-1145/)
      distinguishes arrangements such as a trusted contact from authority to act on money. That official
      source answers one narrow role question in this exercise: a trusted contact is not automatically
      a bill-paying agent. Any financial power needs its actual scope, effective conditions and local
      validity checked. This guide does not draft or execute a power or resolve disputed capacity.


      A beneficiary designation concerns a benefit under its governing terms; it does not by itself grant
      spending authority during the policyholder''s life. A will concerns an estate after death and should
      not be treated as a general living financial authority. Insurance is likewise purpose-specific:
      naming a life policy does not establish coverage for a month of absence, incapacity or lost income.
      Ask what event is covered, what exclusions and conditions apply, how claims work and who may obtain
      information.


      The NAIC''s [beneficiary guidance, S13](https://content.naic.org/article/consumer-insight-what-know-about-life-insurance-beneficiaries)
      supports keeping insurer and policy-location information findable and reviewing beneficiary information
      when circumstances change. It does not verify the fictional policy''s coverage or make an estate
      plan legally effective. The task is to identify a legitimate next inquiry, not to infer protection
      from a document title.


      ### Supplied continuity card C7


      Adult **Mara** is unexpectedly unavailable for one month. The cause is unspecified; do not diagnose
      incapacity or assume death. Mara rents a home, maintains a policy labeled “life insurance,” and
      coordinates a dependent''s scheduled support. Friend **Jo** is willing to help and is listed as
      a trusted contact only. No financial agency, dependent-care appointment or legal authority for Jo
      is supplied.


      | Map heading | Supplied information | Gap to keep visible |

      | --- | --- | --- |

      | Ongoing obligations | Rent due day 5; policy premium due day 12; dependent support each Tuesday
      | Payment arrangements and substitute support responsibility are unverified |

      | Coverage and claims contact | Insurer contact label INS-SERVICE appears on the neutral contact
      card | Coverage for absence is not established; claims and exclusions need official clarification
      |

      | Beneficiary questions | A beneficiary form exists in the secure policy folder | Current designation,
      update date and legal effect have not been checked |

      | Document locations | Lease and billing instructions in secure HOME folder; policy in secure POLICY
      folder; estate file locator in secure LEGAL folder | Only locator labels are shared; contents, credentials
      and access permissions are not copied |

      | Authorized decision roles | Jo may be contacted; legal adviser contact LEGAL-DESK is recorded
      | No bill-paying or dependent-care authority for Jo is established |


      The separate dependent-support schedule identifies service label **CARE-SERVICE**, Tuesday time
      **15:00**, and a failure consequence: planned assistance may be missed if nobody coordinates with
      the authorized provider. Its current public contact route is absent from the first map. The rent
      consequence is an unpaid obligation; the policy consequence could involve coverage continuity under
      terms that must be checked. Do not announce eviction, cancellation or legal consequences that the
      supplied facts do not establish.


      Mara knows the secure folder locations. Jo has only the neutral locator card and public contact
      labels, with no login credentials or access to contents. The exercise includes no account numbers,
      beneficiary names, signatures or private dependent details. A real locator should also be protected
      appropriately; knowing where sensitive material lives does not authorize entry or unrestricted sharing.


      ### Worked handoff that stops at the right boundary


      An unsafe instruction would be: “Jo is trusted, so use Mara''s password and pay everything.” That
      confuses willingness, access and authority. A bounded rehearsal instead has Jo identify the rent
      due date, locate the provider''s public contact instructions, explain the concern without unnecessary
      personal detail and ask what authorized process applies. Jo may not impersonate Mara, use credentials
      or move money merely because a bill is urgent.


      The most consequential unresolved question in C7 is how essential payments and dependent support
      can be authorized during the absence. Use S12 to establish the limited trusted-contact role, then
      draft an **unsent question** to the appropriate provider or qualified local professional: “What
      appointment or document would establish this role, when would it take effect, what actions would
      it permit, and how would you verify or change it?” A source-based question is concrete progress;
      it is not an appointment or a determination that a particular document is valid.


      ### Build, rehearse and correct the map


      1. Fill all five headings. For each obligation, record timing, consequence, needed record type,
      secure locator, who knows the locator and who is actually authorized. Use “unknown” when the supplied
      card does not establish a role.

      2. Separate policy coverage, beneficiary designation, estate documents, financial authority and
      dependent-care authority. Name one unresolved question in each area without assuming one document
      answers them all.

      3. Record the inspected official source and its narrow answer about trusted contacts. Draft the
      bounded authority inquiry and a separate insurer question about coverage and exclusions for the
      relevant event. Do not send personal records or sign documents.

      4. Rehearse with a fictional Jo: find the next contact, state the permitted inquiry and identify
      the action that must wait. Try to locate CARE-SERVICE without inventing an address. Save this first
      handoff before opening the [later packet](?resource=file-later-packet-md).

      5. Correct the missing locator or role description shown by the handoff. Assign a review trigger
      such as a move, changed dependent need, relationship change or policy renewal, and a concrete next
      information request. Keep drafted, sent, answered and legally effective as distinct statuses.


      For support, use large-print location cards or an independent interpreter without sharing secrets.
      A harder variant makes the willing helper unavailable; identify both an information backup and a
      legally valid appointment question rather than merely adding another name. Optional actual transfer
      is an appropriate provider inquiry or professional appointment for a real gap, using secure channels
      and genuine authorization. No beneficiary change, signature or property transfer is needed to complete
      learning. Suspected exploitation, coercion or disputed capacity needs qualified independent support.
      A usable map can reveal that protection is still incomplete.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A friend is a trusted contact and knows where the policy is stored. Can they pay bills or change
      beneficiaries?

      2. A person has a will and a life policy. Does that establish protection for one month of living
      absence?

      3. A tabletop helper finds every contact but cannot identify anyone authorized to coordinate dependent
      support. What is the result?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Those facts alone establish neither power. Identify the relevant appointment, document,
      scope and effective conditions through the provider and qualified local support. Knowing a location
      is not access or transaction authority.

      2. No. Estate arrangements, life-policy benefits, living financial authority and dependent care
      are different questions. Check the actual event, policy terms and valid roles; do not infer incapacity
      coverage from document names.

      3. Information is more usable, but continuity remains incomplete. Record the authority gap and a
      legitimate provider or professional inquiry. Do not count the map as executed legal protection or
      give the helper credentials.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
