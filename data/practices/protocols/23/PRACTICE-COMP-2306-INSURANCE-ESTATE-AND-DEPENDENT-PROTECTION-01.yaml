meaning_and_fit:
  purpose: Identify how obligations, insurance and dependent care would continue if a person were unavailable,
    and distinguish trusted contacts from people legally authorized to act.
  why_recommended: Identify how obligations, insurance and dependent care would continue if a person were
    unavailable, and distinguish trusted contacts from people legally authorized to act.
  claims:
  - statement: Identify how obligations, insurance and dependent care would continue if a person were
      unavailable, and distinguish trusted contacts from people legally authorized to act.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Insurance, estate, and dependent protection practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Insurance, estate, and dependent protection as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible document-location cards, an interpreter or independent legal
    assistance. A dependent or caregiver may need separate advocacy. Keep private documents in an appropriate
    secure place and never provide passwords to prove access. Coercion, suspected exploitation or disputed
    capacity requires qualified support rather than a family worksheet.
  opportunity_considerations: 'Use the fictional case of an adult unavailable for a month who has rent,
    an insurance policy and a dependent’s scheduled support. Create five headings: ongoing obligations,
    coverage and claims contact, beneficiary questions, document locations and authorized decision roles.
    Use neutral labels only; do not copy policy numbers, passwords or another person’s private records.'
  prerequisites:
  - 'Use the fictional case of an adult unavailable for a month who has rent, an insurance policy and
    a dependent’s scheduled support. Create five headings: ongoing obligations, coverage and claims contact,
    beneficiary questions, document locations and authorized decision roles. Use neutral labels only;
    do not copy policy numbers, passwords or another person’s private records.'
  dependencies: []
  safe_alternatives:
  - Use accessible document-location cards, an interpreter or independent legal assistance. A dependent
    or caregiver may need separate advocacy. Keep private documents in an appropriate secure place and
    never provide passwords to prove access. Coercion, suspected exploitation or disputed capacity requires
    qualified support rather than a family worksheet.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Insurance, estate, and dependent protection differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Insurance, estate, and dependent
    protection as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional case of an adult unavailable for a month who has rent, an insurance policy
    and a dependent’s scheduled support. Create five headings: ongoing obligations, coverage and claims
    contact, beneficiary questions, document locations and authorized decision roles. Use neutral labels
    only; do not copy policy numbers, passwords or another person’s private records. Goal: Identify how
    obligations, insurance and dependent care would continue if a person were unavailable, and distinguish
    trusted contacts from people legally authorized to act. Scope: This creates a location-and-question
    map, not a will, power of attorney, insurance recommendation or legal determination. Being a relative,
    beneficiary or emergency contact does not by itself establish every form of authority. Time and effort:
    Two twenty-minute mapping periods and one bounded inquiry to an appropriate provider or professional.
    Adaptation: Use accessible document-location cards, an interpreter or independent legal assistance.
    A dependent or caregiver may need separate advocacy. Keep private documents in an appropriate secure
    place and never provide passwords to prove access. Coercion, suspected exploitation or disputed capacity
    requires qualified support rather than a family worksheet. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible document-location cards, an interpreter or independent legal assistance.
    A dependent or caregiver may need separate advocacy. Keep private documents in an appropriate secure
    place and never provide passwords to prove access. Coercion, suspected exploitation or disputed capacity
    requires qualified support rather than a family worksheet.
  expected_burden: Two twenty-minute mapping periods and one bounded inquiry to an appropriate provider
    or professional.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Insurance, estate, and dependent protection protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Insurance, estate, and dependent protection action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    document-location cards, an interpreter or independent legal assistance. A dependent or caregiver
    may need separate advocacy. Keep private documents in an appropriate secure place and never provide
    passwords to prove access. Coercion, suspected exploitation or disputed capacity requires qualified
    support rather than a family worksheet.
  actions:
  - stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01-A1
    sequence: 1
    title: Map what must continue and where information lives
    instructions: 'List the three supplied obligations and one failure consequence for each. Add the types
      of records needed to continue them, where an authorized person could locate them and who currently
      knows that location. Identify unanswered questions about insurance coverage and exclusions, beneficiary
      designations, wills or other estate arrangements, financial powers and dependent-care authority.
      Keep every role separate; a beneficiary may receive an asset without being authorized to pay bills
      now.


      Observation checks: Essential obligations and dependent support are mapped; Record types and secure
      locations are identified without secret contents; Insurance beneficiary estate and authority questions
      have separate entries; No person is assumed authorized solely because they are trusted. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01
      action_stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01-A1
      competency_stable_id: '23.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2306_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2306_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - essential_obligations_and_dependent_support_are_mapped
        - record_types_and_secure_locations_are_identified_without_secret_contents
        - insurance_beneficiary_estate_and_authority_questions_have_separate_entries
        - no_person_is_assumed_authorized_solely_because_they_are_trusted
      - measurement_id: c2306_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2306_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01-A2
    sequence: 2
    title: Verify one authority or coverage gap through the proper route
    instructions: 'Choose the most consequential unanswered question and consult the official provider’s
      instructions or an appropriately qualified local professional. Ask what document or appointment
      establishes the relevant role, when it takes effect, what it permits and how changes are made. Record
      the source and unresolved limits. Rehearse the handoff using a fictional helper who has a contact
      number but no authority; identify what they can report or ask and what they must not do.


      Observation checks: One real official source or qualified inquiry is used; Scope timing and limits
      of the role are checked; The unappointed helper is not given access or decision powers; Unresolved
      legal or coverage questions remain visible. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01
      action_stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01-A2
      competency_stable_id: '23.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2306_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2306_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_real_official_source_or_qualified_inquiry_is_used
        - scope_timing_and_limits_of_the_role_are_checked
        - the_unappointed_helper_is_not_given_access_or_decision_powers
        - unresolved_legal_or_coverage_questions_remain_visible
      - measurement_id: c2306_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2306_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01-A3
    sequence: 3
    title: Test the information handoff and assign the next review
    instructions: 'Ask a willing authorized helper, or use a labeled tabletop, to locate the correct contact
      and describe the next permitted step for the month-long absence. Correct missing information and
      set a review trigger such as a changed relationship, dependent need, move or policy renewal. Make
      one legitimate next appointment or information request if a real gap exists. Do not sign legal documents,
      change beneficiaries or transfer another person’s property merely to complete the practice.


      Observation checks: A helper or tabletop tests the map rather than only reading it; A missing contact
      or unclear role receives a correction; A specific life-change or date triggers review; Planning
      is not represented as executed legal or insurance protection. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Could the right person find the next permitted action without guessing, and which
      unresolved authority gap still prevents continuity?


      Examples: Supportive: The map distinguished a beneficiary from a bill-paying agent and led to a
      verified professional appointment before any authority was assumed.


      Mixed: Contacts were easy to find, but a dependent-care role remained unresolved and was clearly
      marked.


      Contradictory: A trusted relative was given credentials or instructed to move property without authority,
      or the map was called a legally valid estate plan.


      Inconclusive: Documents were named without locations, role limits, a handoff test or a concrete
      next inquiry.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01
      action_stable_id: PRACTICE-COMP-2306-INSURANCE-ESTATE-AND-DEPENDENT-PROTECTION-01-A3
      competency_stable_id: '23.06'
