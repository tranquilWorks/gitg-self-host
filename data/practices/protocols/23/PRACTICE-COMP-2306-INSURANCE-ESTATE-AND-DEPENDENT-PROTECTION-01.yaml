  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Insurance, estate, and dependent protection; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use accessible document-location cards, an interpreter or independent legal assistance. A dependent
      or caregiver may need separate advocacy. Keep private documents in an appropriate secure place and
      never provide passwords to prove access. Coercion, suspected exploitation or disputed capacity requires
      qualified support rather than a family worksheet.
    cultural_context:
    - Adapt the expression of Insurance, estate, and dependent protection to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use accessible document-location cards, an interpreter or independent legal assistance. A dependent
      or caregiver may need separate advocacy. Keep private documents in an appropriate secure place and
      never provide passwords to prove access. Coercion, suspected exploitation or disputed capacity requires
      qualified support rather than a family worksheet.
  pause_conditions:
  - Pause Insurance, estate, and dependent protection when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Insurance, estate, and dependent protection practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Insurance, estate, and dependent protection situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
