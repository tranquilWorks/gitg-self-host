  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### The stress path breaks the proposed exit


      The supplied stress record has ten contributions of 94 because **months 4 and 7 are missed**. Savings
      reach **940**; B''s balloon remains **1,120**, leaving **180 unpaid** if no other resource or agreement
      exists. The first warning was visible at month 4, when one missed contribution projected only 1,034
      and an 86 gap. The second miss increased that gap by another 94.


      This is a simulated repayment path, not a loan the learner took. If the first decision was deferral,
      the stress test supports retaining that condition; it is not a claim of actual default. If the first
      decision was conditional borrowing, state exactly which condition failed and when contact should
      have begun. No refinancing, creditor concession, forgiveness or extra income is supplied.


      The collateral variant remains hypothetical. A necessary work tool would add potential livelihood
      disruption to the cost of default, but the packet determines no enforcement rights or asset seizure.
      Preserve that risk separately from the 180 arithmetic gap.


      The next defensible record is a revised decision and a specified legitimate information or help
      route. Do not turn the exercise into an application, guarantee or transfer. Correct arithmetic identifies
      a problem; it does not pay the debt.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare two fictional debts by purpose, total obligation and a repayment exit that survives
      a missed assumption. Allow thirty minutes for comparison and twenty for stress testing. No credit
      application, guarantee, refinancing or balance transfer is part of this exercise. A decision to
      defer can be the most accurate result.


      ### Borrowing changes both today''s options and tomorrow''s claims


      Credit lets a person use resources before paying for them in full. It also creates an obligation
      with dates, conditions and consequences. Whether the purpose is worthwhile and whether repayment
      is feasible are separate questions. A useful purchase does not automatically make its financing
      affordable. Approval or a high credit score likewise does not show that a proposed payment fits
      the borrower''s actual constraints.


      Interest is one part of cost. Fees and other terms can change the comparison. The CFPB''s [interest-rate
      and APR explanation, S09](https://www.consumerfinance.gov/ask-cfpb/what-is-the-difference-between-a-loan-interest-rate-and-the-apr-en-733/)
      distinguishes a rate of interest from a broader annual percentage measure incorporating relevant
      fees. The inspected page is in a U.S. auto-loan context. The simple rates below are **nominal interest
      assumptions, not disclosed APRs**. Do not calculate or claim regulatory APRs from this abbreviated
      teaching file.


      Leverage magnifies the consequence of an assumption failing because repayment remains due even if
      the financed plan disappoints. A balloon loan concentrates the obligation at one date. Saving toward
      that date can create a path, but the path fails if contributions are missed and no other dependable
      resource closes the gap. Collateral adds a possible loss of a pledged asset; its exact enforcement
      consequences require the actual terms and applicable law.


      ### Complete teaching offer cards


      Both loans provide **1,000 principal now for exactly one year**, with **no interim loan payments**.
      Simple interest and any fee are paid at the end. No compounding or other charge is included in the
      base arithmetic. Neither base loan has collateral. These invented cards are not current offers.


      | Term | A | B |

      | --- | --- | --- |

      | Principal received | 1,000 | 1,000 |

      | Nominal simple interest for the year | 10% | 12% |

      | Fee due at the end | 50 | 0 |

      | Interim loan payments | None | None |

      | Final due date | Exactly one year | Exactly one year |


      The fictional purpose is a 1,000-unit training course that may expand future work options, with
      no promised job or increased earnings. A free introductory course is available now but covers fewer
      topics. Deferring the paid course to its next intake means waiting a year; no deposit or cancellation
      loss is supplied. The household can set aside **94 monthly** only if income and essential costs
      remain unchanged. Those savings are not payments to the lender and do not reduce the balloon before
      its due date.


      ### Worked cost comparison


      A''s interest is **1,000 × 10% = 100**, so its total is **1,000 + 100 + 50 = 1,150**. B''s interest
      is **120**, giving **1,120** total. A has the lower nominal rate but costs **30 more** under these
      terms. A low monthly payment would also be misleading here because neither loan requires one; the
      whole amount is due at the end.


      For B, twelve savings contributions give **94 × 12 = 1,128**, leaving only **8** beyond the 1,120
      obligation. The base path works arithmetically but has little margin. It does not establish that
      the household will make every contribution or that the course will provide a financial return. If
      the household has no dependable way to absorb missed saving, choosing the cheaper loan still leaves
      the central affordability concern unresolved.


      The real-loan questions exceed these cards: exact payment dates, interest method, financed fees,
      optional products, prepayment treatment, late charges, collateral, default consequences and any
      conditions on the advertised offer. Do not fill these gaps from an unrelated product. An actual
      comparison needs the applicable official disclosure, with independent qualified assistance where
      appropriate. A claim that debt can always be refinanced or forgiven is not an exit plan.


      ### Test the path before making a conditional decision


      1. Write the purpose, expected benefit, uncertainty and non-borrowing alternative. State what deferral
      costs in this case without inventing lost wages or a guaranteed career gain.

      2. Calculate both total repayments and identify why the lower interest rate does not win. Label
      each rate correctly and list the missing real-loan information separately from the complete toy
      arithmetic.

      3. Make a twelve-month contribution tracker for B. Stress it by omitting **month 4 and month 7**.
      At month 4, the first missed contribution already reduces the projected twelve-month total to **1,034**
      if the remaining 94 contributions occur, a projected shortfall of **86**. Do not wait for the final
      due date to notice.

      4. After the second missed contribution, compute the revised saved total and final gap. Name an
      early contact route: the actual creditor through its official channel for possible arrangements,
      or reputable independent debt guidance. No agreement, new loan or forgiveness is assumed.

      5. Consider a separate collateral variant: B would require a necessary work tool as security. Describe
      the asset potentially at risk and the added consequence of failure without guessing legal recovery
      rights. Do not pledge anything.

      6. Choose borrow conditionally, defer, seek another option or decline. State a maximum total obligation
      and the conditions for accepting it. One defensible teaching decision is to **defer any new debt**,
      with a maximum currently accepted obligation of **0**, while exploring the free course and dependable
      funding. A conditional comparison ceiling of 1,120 is not acceptance of B. Save your decision before
      the [later packet](?resource=file-later-packet-md).


      ### Track an exit, not just an intention


      If borrowing were genuinely chosen after appropriate review, an exit record would show the obligation,
      due date, funds actually reserved, forecast gap, review dates and response to changed capacity.
      The forecast should update after each contribution or missed contribution. An intention to work
      more is not an earned resource. Promised help needs verification before it supports a repayment
      claim.


      For support, calculate interest with counters or a calculator and keep the cards alongside the totals.
      For a harder pass, add a financed fee and explain why the original arithmetic no longer applies
      until the charging basis is known. Optional actual transfer is a private reading of a disclosure
      already available to you, with no transaction. Real hardship may require reputable debt, legal or
      benefits support; verify credentials and fees. A person who declines an unaffordable obligation
      has not failed this practice.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Loan X is 500 for one year at 8% simple interest plus a 30 end fee. Y is 500 at 10% with no fee.
      What are their toy totals?

      2. You plan twelve savings deposits of 60 toward a 700 balloon and miss one. What changes?

      3. A secured loan has a lower rate and the lender approves it. Does that establish affordability?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. X totals 570 and Y totals 550. Y costs 20 less under the stated terms despite its higher
      nominal rate. These are not APR calculations or current loan offers.

      2. The full path would reach 720, but eleven deposits reach 660, leaving 40 short. Identify the
      gap when the contribution is missed and seek an authorized response early; refinancing is not guaranteed.

      3. No. Compare total terms, payment timing, dependable repayment capacity and the consequences for
      the pledged asset. Approval and a lower rate do not eliminate default risk or establish personal
      suitability.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
