        criteria:
        - the_decision_includes_a_reason_rather_than_only_the_lowest_payment
        - accepted_total_cost_and_tracking_method_are_stated
        - the_exit_plan_contains_an_early_warning_and_legitimate_help_route
        - no_application_guarantee_or_balance_transfer_is_performed
      - measurement_id: c2304_a3_boundary
