meaning_and_fit:
  purpose: Evaluate why borrowing is considered, what it costs, what could be lost and how repayment would
    end rather than comparing advertised rates alone.
  why_recommended: Evaluate why borrowing is considered, what it costs, what could be lost and how repayment
    would end rather than comparing advertised rates alone.
  claims:
  - statement: Evaluate why borrowing is considered, what it costs, what could be lost and how repayment
      would end rather than comparing advertised rates alone.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Debt and credit practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Debt and credit as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use counters or an educator’s calculator and retain all assumptions with the
    numbers. Real hardship may require independent debt, legal or benefits support; verify fees and credentials
    and be cautious about promises to erase debt. Declining an unaffordable obligation is a valid outcome,
    not a failed exercise.
  opportunity_considerations: Both fictional loans provide principal 1,000 for exactly one year, with
    no interim payments and simple interest paid at the end. Loan A has nominal interest 10% plus a fee
    of 50 paid at the end. Loan B has nominal interest 12% and no fee. Neither has collateral in the base
    case. The borrower could set aside 94 monthly only if income remains unchanged.
  prerequisites:
  - Both fictional loans provide principal 1,000 for exactly one year, with no interim payments and simple
    interest paid at the end. Loan A has nominal interest 10% plus a fee of 50 paid at the end. Loan B
    has nominal interest 12% and no fee. Neither has collateral in the base case. The borrower could set
    aside 94 monthly only if income remains unchanged.
  dependencies: []
  safe_alternatives:
  - Use counters or an educator’s calculator and retain all assumptions with the numbers. Real hardship
    may require independent debt, legal or benefits support; verify fees and credentials and be cautious
    about promises to erase debt. Declining an unaffordable obligation is a valid outcome, not a failed
    exercise.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Debt and credit differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Debt and credit as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Both fictional loans provide principal 1,000 for exactly one year, with no interim payments
    and simple interest paid at the end. Loan A has nominal interest 10% plus a fee of 50 paid at the
    end. Loan B has nominal interest 12% and no fee. Neither has collateral in the base case. The borrower
    could set aside 94 monthly only if income remains unchanged. Goal: Evaluate why borrowing is considered,
    what it costs, what could be lost and how repayment would end rather than comparing advertised rates
    alone. Scope: The case uses simple fictional loans, not current offers, APR calculations or advice
    to borrow. Real amortization, fees, collateral, default rights and affordability require the actual
    disclosure and qualified advice when appropriate. Time and effort: Thirty minutes for the comparison
    and twenty minutes for a repayment stress test. Adaptation: Use counters or an educator’s calculator
    and retain all assumptions with the numbers. Real hardship may require independent debt, legal or
    benefits support; verify fees and credentials and be cautious about promises to erase debt. Declining
    an unaffordable obligation is a valid outcome, not a failed exercise. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use counters or an educator’s calculator and retain all assumptions with the numbers.
    Real hardship may require independent debt, legal or benefits support; verify fees and credentials
    and be cautious about promises to erase debt. Declining an unaffordable obligation is a valid outcome,
    not a failed exercise.
  expected_burden: Thirty minutes for the comparison and twenty minutes for a repayment stress test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Debt and credit protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Debt and credit action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use counters
    or an educator’s calculator and retain all assumptions with the numbers. Real hardship may require
    independent debt, legal or benefits support; verify fees and credentials and be cautious about promises
    to erase debt. Declining an unaffordable obligation is a valid outcome, not a failed exercise.
  actions:
  - stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01-A1
    sequence: 1
    title: Describe the purpose and complete repayment obligation
    instructions: 'State a worthwhile purpose, one non-borrowing alternative and the cost of delaying
      the purchase or service. Calculate A as 1,000 plus 100 interest plus 50 fee, totaling 1,150; B totals
      1,120. Label the percentages nominal simple-interest assumptions, not disclosed APRs. List the actual-loan
      information still needed: payment dates, financed fees, interest method, optional products, prepayment
      terms, late charges, collateral and default consequences. The smaller nominal rate does not win
      this case.


      Observation checks: Purpose and a non-borrowing alternative are considered; Total repayments equal
      1,150 and 1,120; Nominal rates are not mislabeled as APR; Missing loan terms and adverse consequences
      are explicitly listed. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01
      action_stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01-A1
      competency_stable_id: '23.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2304_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2304_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - purpose_and_a_non_borrowing_alternative_are_considered
        - total_repayments_equal_1_150_and_1_120
        - nominal_rates_are_not_mislabeled_as_apr
        - missing_loan_terms_and_adverse_consequences_are_explicitly_listed
      - measurement_id: c2304_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2304_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01-A2
    sequence: 2
    title: Test a repayment path against timing and income risk
    instructions: 'Calculate 94 times twelve as 1,128, enough for the fictional 1,120 balloon with eight
      left over if every contribution occurs. Now remove two contributions: only 940 is available, leaving
      180 unpaid. Explain why a monthly amount that looks manageable does not eliminate balloon-payment
      risk. For a collateral variant, name what could be lost without guessing legal recovery rights.
      Identify the earliest month in which the shortfall would become visible and an authorized renegotiation
      or independent counseling route.


      Observation checks: The full contribution plan reaches 1,128; Two missed contributions leave 940
      and a 180 shortfall; Balloon timing and any collateral risk are explained separately; A shortfall
      response does not assume refinancing or forgiveness. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01
      action_stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01-A2
      competency_stable_id: '23.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2304_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2304_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_full_contribution_plan_reaches_1_128
        - two_missed_contributions_leave_940_and_a_180_shortfall
        - balloon_timing_and_any_collateral_risk_are_explained_separately
        - a_shortfall_response_does_not_assume_refinancing_or_forgiveness
      - measurement_id: c2304_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2304_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01-A3
    sequence: 3
    title: Make a conditional decision and preserve the exit rule
    instructions: 'Choose borrow, defer, seek another option or decline for the fictional case and give
      the conditions supporting that choice. State the maximum total obligation accepted, how repayments
      would be tracked and what change would trigger early contact with the creditor or a reputable adviser.
      Explain how leverage magnifies the consequence of a failed assumption. Do not apply for credit,
      guarantee someone else’s debt or move a real balance as part of this exercise.


      Observation checks: The decision includes a reason rather than only the lowest payment; Accepted
      total cost and tracking method are stated; The exit plan contains an early warning and legitimate
      help route; No application guarantee or balance transfer is performed. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which term or income assumption mattered more than the advertised rate, and what would
      make the proposed exit no longer credible?


      Examples: Supportive: The learner preferred the lower total-cost option only conditionally and recognized
      that two missed contributions would make the balloon unaffordable.


      Mixed: The arithmetic was correct, but repayment depended on an uncertain income assumption that
      led to deferral.


      Contradictory: A loan was called affordable because approval was available, collateral loss was
      ignored, or a real guarantee was signed to demonstrate commitment.


      Inconclusive: Rates were compared without total repayment, purpose, payment timing or a stress-tested
      exit.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01
      action_stable_id: PRACTICE-COMP-2304-DEBT-AND-CREDIT-01-A3
      competency_stable_id: '23.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2304_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2304_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
