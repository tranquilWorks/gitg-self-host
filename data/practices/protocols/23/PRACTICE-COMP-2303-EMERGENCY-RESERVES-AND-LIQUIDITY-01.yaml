meaning_and_fit:
  purpose: Identify a plausible cash disruption, define a proportionate reserve purpose and test whether
    the proposed money would actually be accessible when needed.
  why_recommended: Identify a plausible cash disruption, define a proportionate reserve purpose and test
    whether the proposed money would actually be accessible when needed.
  claims:
  - statement: Identify a plausible cash disruption, define a proportionate reserve purpose and test whether
      the proposed money would actually be accessible when needed.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Emergency reserves and liquidity practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Emergency reserves and liquidity as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a smaller first target, accessible banking support or a qualified benefits
    counselor when asset limits matter. Lack of surplus is a material constraint, not failure. Do not
    recommend risky investments for money needed immediately, incur fees to complete the task or share
    banking credentials with a helper.
  opportunity_considerations: Use the fictional choice of a 600 essential repair or a 900 temporary income
    gap. List existing accessible cash as 200 and an affordable possible contribution as 50 per month
    only for this example. Prepare columns for event, timing, amount, available resources, access restrictions
    and remaining gap. No real transfer or account opening is required.
  prerequisites:
  - Use the fictional choice of a 600 essential repair or a 900 temporary income gap. List existing accessible
    cash as 200 and an affordable possible contribution as 50 per month only for this example. Prepare
    columns for event, timing, amount, available resources, access restrictions and remaining gap. No
    real transfer or account opening is required.
  dependencies: []
  safe_alternatives:
  - Use a smaller first target, accessible banking support or a qualified benefits counselor when asset
    limits matter. Lack of surplus is a material constraint, not failure. Do not recommend risky investments
    for money needed immediately, incur fees to complete the task or share banking credentials with a
    helper.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Emergency reserves and liquidity differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Emergency reserves and liquidity
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional choice of a 600 essential repair or a 900 temporary income gap. List existing
    accessible cash as 200 and an affordable possible contribution as 50 per month only for this example.
    Prepare columns for event, timing, amount, available resources, access restrictions and remaining
    gap. No real transfer or account opening is required. Goal: Identify a plausible cash disruption,
    define a proportionate reserve purpose and test whether the proposed money would actually be accessible
    when needed. Scope: This produces a reserve plan and access check, not a claim that a fund exists
    or a universal target measured in months. Investment and banking rules depend on the place and product.
    Time and effort: Two twenty-minute planning and verification periods, followed by a brief scheduled
    funding review. Adaptation: Use a smaller first target, accessible banking support or a qualified
    benefits counselor when asset limits matter. Lack of surplus is a material constraint, not failure.
    Do not recommend risky investments for money needed immediately, incur fees to complete the task or
    share banking credentials with a helper. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a smaller first target, accessible banking support or a qualified benefits
    counselor when asset limits matter. Lack of surplus is a material constraint, not failure. Do not
    recommend risky investments for money needed immediately, incur fees to complete the task or share
    banking credentials with a helper.
  expected_burden: Two twenty-minute planning and verification periods, followed by a brief scheduled
    funding review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Emergency reserves and liquidity protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Emergency reserves and liquidity action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a smaller
    first target, accessible banking support or a qualified benefits counselor when asset limits matter.
    Lack of surplus is a material constraint, not failure. Do not recommend risky investments for money
    needed immediately, incur fees to complete the task or share banking credentials with a helper.
  actions:
  - stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01-A1
    sequence: 1
    title: Size the need from consequences and resources
    instructions: 'For each supplied disruption, explain when money is needed, what happens without it
      and which resources are dependable rather than merely hoped for. Calculate gaps of 400 and 700 after
      the 200 cash. Select a first reserve purpose and justify it from severity, likelihood and timing,
      not a universal three- or six-month slogan. Separate predictable annual bills from genuine unexpected
      disruptions and note debts, benefits limits or care obligations that could alter a real plan.


      Observation checks: Both disruptions have timing and consequence descriptions; Existing cash leaves
      gaps of 400 and 700; The first target has a context-based reason; Predictable expenses and relevant
      constraints are not hidden inside emergencies. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01
      action_stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01-A1
      competency_stable_id: '23.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2303_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2303_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_disruptions_have_timing_and_consequence_descriptions
        - existing_cash_leaves_gaps_of_400_and_700
        - the_first_target_has_a_context_based_reason
        - predictable_expenses_and_relevant_constraints_are_not_hidden_inside_emergencies
      - measurement_id: c2303_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2303_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01-A2
    sequence: 2
    title: Check access rather than relying on an account label
    instructions: 'Read the official terms for one locally available type of safe cash storage or use
      an educator-provided sample disclosure. Record withdrawal timing, access method, fees, minimums
      and applicable protection; mark anything unverified. In the United States, verify an institution
      and deposit type rather than assuming a payment app or investment is FDIC-insured. Rehearse finding
      the money-access instructions without moving funds, exposing credentials or disabling account security.


      Observation checks: Access timing and restrictions are checked in an actual disclosure; Fees minimums
      and protection have explicit dispositions; An account label is not treated as proof of deposit insurance;
      The access rehearsal shares no credentials and performs no transfer. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01
      action_stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01-A2
      competency_stable_id: '23.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2303_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2303_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - access_timing_and_restrictions_are_checked_in_an_actual_disclosure
        - fees_minimums_and_protection_have_explicit_dispositions
        - an_account_label_is_not_treated_as_proof_of_deposit_insurance
        - the_access_rehearsal_shares_no_credentials_and_performs_no_transfer
      - measurement_id: c2303_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2303_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01-A3
    sequence: 3
    title: Write a funding and use rule that can be revised
    instructions: 'At the fictional 50 per month, the gaps would take eight or fourteen monthly contributions
      to close before any other movements. State that emergencies may arrive sooner. Define permitted
      uses, a review trigger, a replenishment rule and a fallback such as contacting an appropriate assistance
      service when the reserve is insufficient. Schedule a capacity review before each contribution; any
      real saving must protect current essentials and applicable benefits rules. Record a plan, funded
      balance and tested withdrawal as different evidence.


      Observation checks: The contribution arithmetic and time uncertainty are explicit; Use and replenishment
      rules are tied to the chosen disruption; A realistic insufficient-funds fallback is named; Planned
      saving is not represented as money already available. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which access or timing assumption could make the reserve fail precisely when needed,
      and what is the next achievable protection?


      Examples: Supportive: The plan identified a 400 repair gap, verified withdrawal restrictions and
      kept an assistance fallback because eight contributions would not protect against a repair tomorrow.


      Mixed: A target was affordable, but the proposed storage required a delay and was changed before
      being called accessible.


      Contradictory: A volatile investment or unverified app balance was described as guaranteed emergency
      cash, or essential bills were skipped to fund the exercise.


      Inconclusive: A reserve target was named without a disruption, access check, contribution capacity
      or fallback.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01
      action_stable_id: PRACTICE-COMP-2303-EMERGENCY-RESERVES-AND-LIQUIDITY-01-A3
      competency_stable_id: '23.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2303_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2303_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_contribution_arithmetic_and_time_uncertainty_are_explicit
        - use_and_replenishment_rules_are_tied_to_the_chosen_disruption
        - a_realistic_insufficient_funds_fallback_is_named
        - planned_saving_is_not_represented_as_money_already_available
      - measurement_id: c2303_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
