  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### One contribution, one unaffordable contribution withheld


      The supplied follow-up records one **50 contribution** to the proposed pot, then a month in which
      essential costs leave no affordable contribution. Total reserved money is **250**, consisting of
      the existing 200 and the contributed 50. Only 200 is immediately accessible under the supplied facts.
      The missed contribution is a resource constraint, not evidence of irresponsibility. The fictional
      contribution does not endorse D4 while its protection and deadline suitability remain unresolved.


      Remaining total-balance gaps are **350 for the repair** and **650 for the income gap**, requiring
      seven or thirteen further 50 contributions if capacity returns and no money is used. Two calendar
      months have not produced two contributions.


      A Friday failure now needs a 600 payment by Sunday. D4''s two-business-day route cannot be counted
      on for Sunday; even a fully funded balance there would not by itself solve that deadline. The immediate
      shortfall against the 200 accessible cash is **400**. No repair, assistance approval, actual withdrawal
      test or insurance verification is supplied.


      Revise the storage and fallback questions before calling the reserve ready. Keep the contribution
      record, total balance, immediate availability and tested-withdrawal status in separate fields. The
      next step is an appropriate access or assistance inquiry, not a transfer to an unverified product
      or a demand to sacrifice essentials.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Design a reserve for a particular disruption and test access before calling it useful. Use
      two twenty-minute sessions, then a brief funding review. A target is a plan, a funded balance is
      money present, and a tested withdrawal is evidence of access through a particular route. Keep those
      three claims separate.


      ### Start with the event and its timing


      Emergency money serves a job: making an important payment possible when an unexpected disruption
      occurs. The needed amount depends on consequences, timing, dependable resources and competing commitments.
      A fixed number of months can hide these differences. Predictable annual bills also deserve planning,
      but they are not made unexpected merely by arriving infrequently.


      The CFPB''s [emergency-fund guide, S07](https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/)
      frames a reserve around unplanned expenses, situation-specific needs, accessibility and replenishment.
      Its general guidance does not establish an amount suitable for you. Debt obligations, care needs,
      unstable income, eligibility rules and access barriers may materially change an actual plan. If
      there is no affordable surplus, record that constraint and consider suitable assistance rather than
      shifting money away from essentials to make the exercise look successful.


      ### Supplied disruption choices


      The fictional household has **200 of immediately accessible cash** beyond already funded current
      essentials. It could contribute **50 monthly** only while the stated capacity remains available.
      The case excludes interest, fees and other movements from the contribution arithmetic. It offers
      two separate scenarios, not two simultaneous events:


      | Event | Need and deadline | Consequence without money | Gap after 200 |

      | --- | --- | --- | --- |

      | Essential repair | 600 due within two days of an unexpected failure | Ordinary necessary travel
      is interrupted | 400 |

      | Temporary income gap | 900 needed across the next month | Several essential payments lack cover
      | 700 |


      For the teaching choice, the household ranks the repair as the first reserve purpose because the
      short deadline and travel dependency leave little adjustment time. That ranking is supplied preference,
      not a claim that repair is more likely or always more serious. The larger income-gap exposure remains
      on the map. A known annual subscription of 120, due next year, belongs in a predictable-expense
      plan and is not included in either emergency target.


      ### Educator-provided sample disclosure D4


      This is complete fictional access material for the exercise, not a real bank offer or insurance
      certification. Read it as a disclosure with missing terms, not as marketing.


      | D4 field | Supplied term |

      | --- | --- |

      | Storage type | Separate cash savings pot linked to a spending account |

      | Standard withdrawal | Request through secure account access; arrives in spending account after
      two business days |

      | Weekend and holiday timing | Processing starts next business day; holidays not specified |

      | Immediate cash access | None from this pot |

      | Fees and minimums | No monthly fee, no withdrawal fee, no minimum balance in this sample |

      | Protection | Label says “protected”; institution, eligible deposit type and scheme conditions
      are not supplied |

      | Access instructions | Locate the provider''s withdrawal page, check destination and displayed
      arrival date, stop before confirmation |


      The existing 200 is held separately and immediately accessible. Future contributions are proposed
      for D4, but no transfer has occurred. The disclosure''s two-business-day timing is not the same
      as two calendar days. If a repair payment is needed on Sunday after a Friday failure, D4 cannot
      be assumed to deliver money in time. The phrase “protected” supplies no verified insurance basis.


      The CFPB''s [payment-app explanation, S08](https://www.consumerfinance.gov/ask-cfpb/is-the-money-i-keep-in-my-payment-app-safe-en-2135/)
      describes why protection can differ across providers and services. In the United States, verify
      the institution, deposit type and applicable conditions rather than inferring insurance from an
      app logo or account label. No current provider has been checked in this exercise. Insurance against
      specified failure is also different from immediate access during an outage.


      ### Worked funding calculation and its limits


      The repair gap is **600 − 200 = 400**. At 50 per contribution it needs **8 monthly contributions**.
      The income-gap target needs **900 − 200 = 700**, or **14 contributions**. These are counts under
      unchanged assumptions, not protection already in place or a promise about when a disruption will
      happen. An event tomorrow arrives before even the first contribution.


      The repair purpose permits use for the supplied unexpected essential repair; it does not automatically
      fund unrelated shopping. After use, review essentials and capacity before replenishing. A funding
      plan should include a fallback while incomplete: contact an appropriate assistance or hardship service,
      ask the responsible provider about a feasible arrangement and assess other dependable support. No
      assistance eligibility, credit approval or payment extension is assumed. Avoid a risky investment
      or an unverified app balance as a shortcut to guaranteed emergency cash.


      ### Build the reserve and access record


      1. Complete both event rows with deadlines, consequences, dependable resources and gaps. Explain
      the first-purpose choice while retaining the other exposure and predictable annual cost separately.

      2. Inspect every D4 field. Record the timing mismatch, explicit zero fees and minimums, and unverified
      protection. Write the specific official information you would need before selecting real storage.
      A fictional disclosure review is not provider verification.

      3. Rehearse only the navigation sequence in the supplied instructions. State where you would read
      the arrival date and where you would stop. Do not log into another person''s account, share credentials,
      disable security or move funds to prove completion.

      4. Write a contribution rule with a capacity check before each proposed 50. Specify use, replenishment,
      review and an insufficient-funds fallback. Separate planned contributions from money already present.

      5. Save the record before the [later packet](?resource=file-later-packet-md). Recompute progress
      from actual supplied contributions rather than elapsed calendar months. Reassess access when the
      due day changes.


      For support, use a six-field access card and a calculator. For a harder variant, make the affordable
      contribution irregular and identify the earliest unmet need without inventing a payday. Optional
      actual transfer is to inspect a real official disclosure privately and locate its access instructions
      without a transaction. Use qualified benefits or banking help where rules or accessibility matter.
      A reserve can be modest and useful without proving financial security, and inability to fund one
      is not a moral failure.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A reserve target is 750, accessible cash is 150 and affordable contributions are 40. How many
      contributions close the gap under unchanged assumptions?

      2. A pot has 900 but withdrawals take three business days. A payment is due tomorrow. Is the full
      900 necessarily usable?

      3. A payment app says “protected” without naming the institution or relevant terms. What is still
      needed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The gap is 600, requiring 15 contributions of 40. This is a conditional funding path; a
      disruption may arrive sooner and no money exists merely because the plan names it.

      2. No. Balance and liquidity differ. Check the actual deadline and access route, identify immediately
      available resources and a legitimate fallback, and do not call an untested route instant.

      3. Verify the institution, deposit type, scheme and applicable conditions through official information.
      A label does not establish deposit insurance or uninterrupted access; keep the status unverified
      until supported.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
