      Emergency reserves and liquidity; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a smaller first target, accessible banking support or a qualified benefits counselor when asset
      limits matter. Lack of surplus is a material constraint, not failure. Do not recommend risky investments
      for money needed immediately, incur fees to complete the task or share banking credentials with
      a helper.
    cultural_context:
    - Adapt the expression of Emergency reserves and liquidity to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a smaller first target, accessible banking support or a qualified benefits counselor when asset
      limits matter. Lack of surplus is a material constraint, not failure. Do not recommend risky investments
