  pause_conditions:
  - Pause Emergency reserves and liquidity when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Emergency reserves and liquidity practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Emergency reserves and liquidity situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
