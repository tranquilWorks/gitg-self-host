  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Material and ecological stewardship explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Material and ecological stewardship context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Material and ecological stewardship observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Material and ecological stewardship rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Map the resources and people behind the item. Observed checks: All six
    lifecycle stages receive an entry; Land energy time money and affected people are considered; Known
    facts and assumptions are separated; Replacement is not automatically labeled better or worse. Action
    2: Carry out one permitted care or sharing action. Observed checks: The action follows the item’s
    real instructions or permission; A safe care or sharing action actually occurs; Materials time and
    cost of that action are recorded; Hazardous or safety-critical repair is excluded. Action 3: Check
    whether the stewardship choice works in use. Observed checks: A later use checks function after the
    action; A new burden or failed assumption remains visible; Maintenance or retirement has a concrete
    trigger; Environmental claims remain no stronger than the evidence.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A product was called sustainable without mapping its
    lifecycle or carrying out and checking a care action.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Material
    and ecological stewardship contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
