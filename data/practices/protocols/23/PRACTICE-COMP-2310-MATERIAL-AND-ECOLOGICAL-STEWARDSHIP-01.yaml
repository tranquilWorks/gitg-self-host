  - stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01-A2
    sequence: 2
    title: Carry out one permitted care or sharing action
    instructions: 'Read the item’s actual care instructions. For the default, clean and dry the bag only
      by an allowed method, then put it where it can be used without creating an obstruction. Alternatively
      mend a non-safety-critical cosmetic defect using a familiar safe method or agree on a simple permitted
      sharing arrangement. Avoid energized equipment, structural repairs, chemicals or tasks beyond competence.
      Record the actual materials, time and cost used rather than claiming the action was free of burden.


      Observation checks: The action follows the item’s real instructions or permission; A safe care or
      sharing action actually occurs; Materials time and cost of that action are recorded; Hazardous or
      safety-critical repair is excluded. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01-A2
      competency_stable_id: '23.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2310_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2310_a2_primary
        kind: artifact
        role: primary
        weight: '1'
