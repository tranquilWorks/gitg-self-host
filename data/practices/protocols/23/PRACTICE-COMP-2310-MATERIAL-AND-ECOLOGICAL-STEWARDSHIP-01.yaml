        expected: true
  - stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01-A3
    sequence: 3
    title: Check whether the stewardship choice works in use
    instructions: 'Use the item at the next ordinary opportunity and inspect whether the action preserved
      function, reduced an avoidable replacement or created a new burden. Choose a maintenance interval
      or a clear condition for responsible retirement. Verify a local disposal or donation route only
      when needed rather than assuming everything is recyclable or wanted. State the narrow observed result;
      do not claim quantified ecological benefit without reliable lifecycle evidence.


      Observation checks: A later use checks function after the action; A new burden or failed assumption
      remains visible; Maintenance or retirement has a concrete trigger; Environmental claims remain no
      stronger than the evidence. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Which lifecycle burden became visible only after the care action, and does the next
      choice serve both the person and the resources entrusted to them?


      Examples: Supportive: The bag was cleaned according to its label and used again; the review described
      one avoided replacement possibility without inventing emissions saved.


      Mixed: Care preserved function but consumed more time than expected, prompting a simpler sustainable
      routine.


      Contradictory: An unsafe repair was attempted or an unverified recycling claim was used to dismiss
      disposal and labor costs.


      Inconclusive: A product was called sustainable without mapping its lifecycle or carrying out and
      checking a care action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01
