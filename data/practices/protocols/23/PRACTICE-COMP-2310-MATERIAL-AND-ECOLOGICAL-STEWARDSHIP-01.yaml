  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Remembered once, inconvenient once


      In the supplied week-later record, the bag was used once for dry books. After that use, an ordinary
      dirt mark prompted another label-consistent wipe. Its active duration was not recorded. On the next
      trip it was still in its unobstructed drying place and forgotten. The learner spent **8 active minutes**
      finding and relocating it later; this is a separate later burden, not a replacement for the original
      4-minute care log. The two timed entries total **12 minutes**; the additional untimed wipe means
      full active effort is greater and unknown. No number of disposable bags avoided was measured.


      The first proposed storage hook obstructed another person''s shelf access. That person declined
      the change. The learner instead selected an existing free shelf space after agreement, without buying
      a hook or shifting the obstruction elsewhere. Whether this improves the next trip is still unknown.


      Retain the six-stage uncertainties and the manufacturer''s wipe-clean instruction. A successful
      first use does not authorize washing, food contact or unverified handle repair. Revise the habit
      hypothesis to test whether the agreed storage place is findable and convenient at the next ordinary
      use. The case supports one fictional use plus an identified burden; it does not supply longitudinal
      ecological measurement or actual household consent.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Follow one possession through its lifecycle, then carry out or simulate the smallest safe care
      action its actual instructions allow. Allow twenty minutes for the map and ten for a later use check.
      Your product is a decision that records waste, time, energy and effects on other people without
      inventing an environmental score.


      ### An owned item has a history and a future


      A low purchase price can hide resource use elsewhere. Materials come from land or other inputs;
      manufacturing uses work and energy; transport adds distance and handling; use requires habits and
      sometimes additional supplies; care and repair consume resources; and eventual reuse or disposal
      has consequences beyond the owner''s bin. The point is to make relevant consequences visible at
      the scale of the decision. A learner does not need to calculate a complete lifecycle assessment
      to stop treating disposal as the disappearance of an object.


      Use six stages: obtaining materials, manufacture, transport, use, care or repair, and reuse or disposal.
      At each stage separate a known fact, an uncertainty and an actionable question. Time and money spent
      on upkeep are real constraints. So are access to tools, safe storage and the labor of a person who
      is expected to do the cleaning. A choice that saves money for the owner by imposing an unagreed
      task on someone else is incomplete stewardship.


      The EPA''s [materials-management overview, S04](https://www.epa.gov/smm/sustainable-materials-management-tools)
      explains why lifecycle measurement matters. Its tools were not run here. The exercise therefore
      makes no claim about kilograms of carbon saved, a universal number of reuses needed or the environmental
      superiority of one bag material. A decision to keep using a suitable owned item is a bounded practical
      choice, not a measured planetary result.


      ### Supplied item and care record B9


      The fictional learner already owns an intact IKEA FRAKTA bag, article **206.111.08**. No purchase
      is proposed. Its actual public [manufacturer page, S05](https://www.ikea.com/us/en/p/frakta-shopping-bag-large-blue-20611108/),
      read on 24 September 2026, instructs the owner to wipe it with a water-dampened cloth and says not
      to wash it. It also excludes food contact. The item in this case is used for dry books, with no
      sharp objects, unknown contamination or visible damage.


      This is deliberately a **wipe-clean** example. A generic instruction to wash every reusable bag
      would conflict with these instructions. If using a different owned item for an actual attempt, inspect
      its own label and current care instructions first. If the instructions cannot be established, choose
      another safe item or retain the mapping exercise without attempting care. Do not repair load-bearing
      handles, treat contaminated material or use chemicals merely to complete the task.


      | Stage | Supplied or inspected fact | Unknown or constraint | Bounded response |

      | --- | --- | --- | --- |

      | Materials | Product page identifies polypropylene | Item-specific upstream land, water and energy
      use were not measured | Record the material without assigning an invented footprint |

      | Manufacture | This is an already manufactured bag | Plant conditions and production impacts are
      unknown | Do not infer fair labor from the brand or price |

      | Transport | The learner already has it at home | Production and purchase journey are not supplied
      | Avoid a new trip solely to buy another bag for the exercise |

      | Use | It carries dry books in the case | Future use frequency is uncertain | Choose a findable
      place near the book shelf |

      | Care or repair | Manufacturer allows wiping, not washing | Damage would require a different decision
      | Wipe only the intact item; keep it away from food contact |

      | Reuse or disposal | Continued own use is currently possible | Local acceptance of this material
      has not been verified | Check the local route if disposal becomes necessary; do not assume curbside
      acceptance |


      The table makes the environmental scope broad while keeping the practical action narrow. The unknown
      entries are useful: they prevent the convenient fiction that an unmeasured impact is zero. Conversely,
      uncertainty about manufacture does not prevent a safe, permitted care action on an already owned
      item.


      ### Worked care and burden calculation


      The supplied first attempt records **4 active minutes** to inspect and wipe the bag. A damp cloth
      already in use is used; water quantity and embodied resource use are not measured. No cleaner, new
      bag or repair material is purchased. After wiping, the bag is left in an unobstructed place until
      dry before storage. Drying elapsed time is not treated as active labor, and no machine drying or
      other unverified method is introduced.


      The learner had predicted 3 active minutes, so the observed fictional burden is **1 minute higher**.
      “No new purchase” is a defensible cost statement within the story; “zero environmental cost” is
      not. The bag is placed near the shelf with the expectation that it will be remembered on the next
      book trip. That is a habit hypothesis which the later packet will test, not evidence that any disposable
      item has already been avoided.


      ### Make a care decision another person could understand


      1. Name the item, ownership, current condition and intended use. Check its actual instructions and
      whether the proposed contact or load is appropriate. Keep a product recommendation separate from
      permission to care for an existing possession.

      2. Create the six-stage map with knowns, unknowns and affected people. Include capital tied up in
      replacement, storage space, energy or materials that care would use, and who supplies the time.

      3. Compare keeping and caring, safe repair if genuinely appropriate, borrowing or sharing with permission,
      and eventual disposal. Explain why one fits this item''s current condition. Do not assume donation
      makes a damaged item somebody else''s useful resource.

      4. Record the care action, active minutes, materials and result. If performing it yourself, use
      your own observed record; if using B9, mark every observation supplied fiction. Stop if the item
      or task is unsuitable.

      5. Specify the next use you will check and what counts as friction: forgotten placement, cleaning
      burden, damage or another person''s inconvenience. Save the first record and open the [later packet](?resource=file-later-packet-md).


      Before each use, check that the bag is intact, dry and suitable for the contents. Wipe it when ordinary
      dirt warrants care under the label. A torn load-bearing handle, unknown contamination or condition
      that cannot be safely restored triggers retirement from this carrying use and a verified local disposal
      or other appropriate route; do not keep using it merely to avoid replacement.


      ### Revisit the habit instead of decorating the claim


      For support, make the map with one sentence per stage and select a safe intact item requiring no
      repair. A helper may read the label, but record that assistance. For a harder pass, compare a proposed
      repair whose cost and labor are known with replacement whose upstream impacts are unknown. State
      what information could change the choice rather than manufacturing comparable carbon figures.


      In an actual transfer, another household member''s task needs their agreement. Do not treat their
      labor as a free resource or change shared storage without checking access needs. Repeated use, a
      care log and a later condition or burden observation could support progress. One clean object cannot
      establish that a household reduced total consumption or that a purchase achieved ecological justice.
      Material stewardship remains a practice of proportionate, revisable decisions with effects beyond
      possession.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fiction or privately redacted records; keep credentials
      and sensitive identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Your bag says wipe clean only, while a generic checklist says wash all bags. Which instruction
      governs this exercise?

      2. A repair costs 6 units and 25 minutes. A replacement costs 8 units, but both carbon footprints
      are unknown. Can you report a measured emissions saving?

      3. You made a lifecycle map but never cared for or reused an item. What is the honest completion
      state?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Use the instructions for the actual item and its permitted use. Do not wash it. Choose another
      suitable item or keep the attempt analytical if safe care cannot be established.

      2. No. Compare the known money, labor, safety and expected use while keeping upstream impacts unknown.
      A two-unit price difference is not a carbon calculation.

      3. The map is an artifact; care, reuse and later burden observations remain unattempted. The supplied
      fictional log cannot be reported as your real-world behavior.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
