  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Material and ecological stewardship; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Choose a small item and a care action within available energy, space and money. An accessible replacement
      can be reasonable when repair or reuse shifts excessive burden onto a person. Use an observation-only
      case when safe care cannot be done; label the practical action untested rather than claiming stewardship
      from intention.
    cultural_context:
    - Adapt the expression of Material and ecological stewardship to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Choose a small item and a care action within available energy, space and money. An accessible replacement
      can be reasonable when repair or reuse shifts excessive burden onto a person. Use an observation-only
      case when safe care cannot be done; label the practical action untested rather than claiming stewardship
      from intention.
  pause_conditions:
  - Pause Material and ecological stewardship when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Material and ecological stewardship practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Material and ecological stewardship situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
