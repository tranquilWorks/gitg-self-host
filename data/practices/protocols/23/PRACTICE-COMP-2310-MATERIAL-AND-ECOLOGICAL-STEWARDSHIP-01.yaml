meaning_and_fit:
  purpose: Consider material, energy, time, money, repair and external effects when deciding how to maintain,
    share or retire an ordinary possession.
  why_recommended: Consider material, energy, time, money, repair and external effects when deciding how
    to maintain, share or retire an ordinary possession.
  claims:
  - statement: Consider material, energy, time, money, repair and external effects when deciding how to
      maintain, share or retire an ordinary possession.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Material and ecological stewardship practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Material and ecological stewardship as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Choose a small item and a care action within available energy, space and money.
    An accessible replacement can be reasonable when repair or reuse shifts excessive burden onto a person.
    Use an observation-only case when safe care cannot be done; label the practical action untested rather
    than claiming stewardship from intention.
  opportunity_considerations: 'Choose a washable reusable bag, a book or another ordinary safe item already
    owned. Default to a reusable bag with an intact structure and a care label. Prepare six stages: obtaining
    materials, manufacture, transport, use, care or repair, and eventual reuse or disposal. Mark unknown
    quantities instead of inventing carbon or water savings.'
  prerequisites:
  - 'Choose a washable reusable bag, a book or another ordinary safe item already owned. Default to a
    reusable bag with an intact structure and a care label. Prepare six stages: obtaining materials, manufacture,
    transport, use, care or repair, and eventual reuse or disposal. Mark unknown quantities instead of
    inventing carbon or water savings.'
  dependencies: []
  safe_alternatives:
  - Choose a small item and a care action within available energy, space and money. An accessible replacement
    can be reasonable when repair or reuse shifts excessive burden onto a person. Use an observation-only
    case when safe care cannot be done; label the practical action untested rather than claiming stewardship
    from intention.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Material and ecological stewardship differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Material and ecological stewardship
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a washable reusable bag, a book or another ordinary safe item already owned. Default
    to a reusable bag with an intact structure and a care label. Prepare six stages: obtaining materials,
    manufacture, transport, use, care or repair, and eventual reuse or disposal. Mark unknown quantities
    instead of inventing carbon or water savings. Goal: Consider material, energy, time, money, repair
    and external effects when deciding how to maintain, share or retire an ordinary possession. Scope:
    One lifecycle comparison informs a practical stewardship choice. It is not a measured environmental
    footprint, a universal consumption rule or permission for hazardous repair. Time and effort: Twenty
    minutes to map the item, up to twenty minutes for a safe care action and a later ten-minute use review.
    Adaptation: Choose a small item and a care action within available energy, space and money. An accessible
    replacement can be reasonable when repair or reuse shifts excessive burden onto a person. Use an observation-only
    case when safe care cannot be done; label the practical action untested rather than claiming stewardship
    from intention. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Choose a small item and a care action within available energy, space and money.
    An accessible replacement can be reasonable when repair or reuse shifts excessive burden onto a person.
    Use an observation-only case when safe care cannot be done; label the practical action untested rather
    than claiming stewardship from intention.
  expected_burden: Twenty minutes to map the item, up to twenty minutes for a safe care action and a later
    ten-minute use review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Material and ecological stewardship protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Material and ecological stewardship action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Choose a small
    item and a care action within available energy, space and money. An accessible replacement can be
    reasonable when repair or reuse shifts excessive burden onto a person. Use an observation-only case
    when safe care cannot be done; label the practical action untested rather than claiming stewardship
    from intention.
  actions:
  - stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01-A1
    sequence: 1
    title: Map the resources and people behind the item
    instructions: 'For each lifecycle stage, identify at least one input or affected party: material,
      land, energy, labor, transport, storage space, maintenance time or capital tied up. Distinguish
      what you know from an assumption. Compare keeping the item with replacing it and note that a replacement
      may shift rather than eliminate burdens. Include practical access and hygiene needs; a low-impact-looking
      option that cannot serve its user is not automatically the right choice.


      Observation checks: All six lifecycle stages receive an entry; Land energy time money and affected
      people are considered; Known facts and assumptions are separated; Replacement is not automatically
      labeled better or worse. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2310-MATERIAL-AND-ECOLOGICAL-STEWARDSHIP-01-A1
      competency_stable_id: '23.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2310_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2310_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_lifecycle_stages_receive_an_entry
        - land_energy_time_money_and_affected_people_are_considered
        - known_facts_and_assumptions_are_separated
        - replacement_is_not_automatically_labeled_better_or_worse
      - measurement_id: c2310_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2310_a1_adverse
        kind: boolean
