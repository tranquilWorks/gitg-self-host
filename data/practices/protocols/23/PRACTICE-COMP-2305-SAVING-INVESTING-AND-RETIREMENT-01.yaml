  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Saving, investing, and retirement; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a simple written or spoken policy and public educational material without sharing holdings or
      account numbers. A person with no current investable surplus can use the fictional case. Favor comprehension
      over adding products; disability, benefits, debt, dependents and local rules can materially change
      an actual plan.
    cultural_context:
    - Adapt the expression of Saving, investing, and retirement to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a simple written or spoken policy and public educational material without sharing holdings or
      account numbers. A person with no current investable surplus can use the fictional case. Favor comprehension
      over adding products; disability, benefits, debt, dependents and local rules can materially change
      an actual plan.
  pause_conditions:
  - Pause Saving, investing, and retirement when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Saving, investing, and retirement practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Saving, investing, and retirement situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Saving, investing, and retirement actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
