      - [Online Shopping](https://consumer.ftc.gov/articles/online-shopping)

      - [Tax withholding](https://www.irs.gov/individuals/employees/tax-withholding)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### The date and the capacity matter


      The supplied market stress makes a hypothetical risky 1,000 holding worth **800**, a **200 shortfall**
      against N''s six-month necessary payment. No rescue return, extra resource or payment extension
      is supplied. An N policy that relied on selling that holding at 1,000 fails its own purpose; revise
      the risk and access constraints before any implementation.


      L initially permitted optional delay, but a separate new fact says the household''s essential-care
      costs have risen. The amount that could absorb investment loss now needs reassessment. A twenty-year
      label cannot settle that question. The record supports a policy review, not an automatic sale, a
      new allocation or a conclusion that all long-term investing is unsuitable.


      The holdings check still gives 60% Alpha and 40% Beta even across two fund names. No diversification
      benefit is established merely by adding Q. The constant-net-growth arithmetic remains 1,102.50 versus
      1,081.60; it was never the supplied market path and should not be substituted for the loss.


      Save the changed constraints, unresolved account/tax questions and a qualified information route.
      There is no actual trade, retirement sufficiency finding, verified product recommendation or learner
      investment outcome.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Write two provisional policies before choosing any product. Allow forty minutes for goals,
      disclosures and arithmetic, then fifteen to test a loss scenario. This is financial education using
      original fictional figures, not personal asset allocation, retirement sufficiency analysis or an
      instruction to trade.


      ### Give each amount a job and a deadline


      Money needed for a necessary payment in six months has a different job from money for optional spending
      twenty years away. A person may feel comfortable with price fluctuations yet be unable to absorb
      a loss before rent, care or another obligation. Risk willingness describes preference; loss capacity
      describes what the financial position can withstand. A long horizon does not remove all risk, guarantee
      recovery or make every investment suitable.


      The SEC''s [asset-allocation guide, S10](https://www.investor.gov/additional-resources/general-resources/publications-research/info-sheets/beginners-guide-asset)
      relates investment choices to horizon and risk and distinguishes diversification within and between
      asset categories. Its educational example contrasts a broadly held stock fund with a narrowly focused
      sector fund. Owning a fund does not automatically remove concentration. No numeric allocation formula,
      historical return prediction or particular fund recommendation is adopted here.


      An account and the assets inside it are also different. A retirement or tax-advantaged account may
      have eligibility, contribution, tax and withdrawal rules; a familiar account name does not answer
      which holdings it contains or when money can be accessed. Actual rules depend on jurisdiction and
      circumstances. Keep those questions open for current official information and appropriately qualified
      advice.


      ### Supplied goals and original disclosure cards


      For comparison, use **1,000 starting units for each separate hypothetical goal**, not a real combined
      portfolio. Goal N is a necessary **1,000 payment in six months**, with no other supplied resource
      to absorb a shortfall. Goal L is **optional spending twenty years away**; its amount and date can
      be revised. Both require a policy page covering deadline, loss consequences, liquidity, diversification,
      fees, tax questions and review triggers.


      The original teaching cards below contain all holdings in two toy sector funds. They are **not actual
      products or regulatory disclosures**. The inspected SEC educational example supplies the general
      concentration principle; these cards make the overlap calculation self-contained.


      | Feature | Fund P | Fund Q |

      | --- | --- | --- |

      | Holdings by value | Alpha 60%; Beta 40% | Alpha 60%; Beta 40% |

      | Exposure | Two firms in one sector | The same two firms in the same sector |

      | Annual fund operating expense | 0.20% of assets | 0.80% of assets |

      | Account maintenance | 0 in this sample | 0 in this sample |

      | Purchase/sale fee | 0 in this sample | 0 in this sample |

      | Taxes, dealing spread and settlement/access terms | Not supplied | Not supplied |


      Splitting 1,000 equally across P and Q still leaves **600 in Alpha and 400 in Beta**. It doubles
      the number of fund labels without broadening the underlying holdings. On a frozen 1,000 balance
      for a one-year fee illustration, the respective operating-expense amounts would be **2 and 8**.
      Actual dollar charges change with asset values and terms. The unprovided costs and access rules
      remain questions, not assumed zeros. Neither fund is recommended.


      The SEC''s [fees bulletin, S11](https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins/updated)
      explains ongoing and transaction charges and the importance of checking disclosures. Its general
      cost mechanism supports this comparison; no actual prospectus, adviser fee agreement or account
      statement was inspected. A cheaper concentrated holding remains concentrated. Cost is one constraint
      alongside suitability, access and risk.


      ### Separate compounding arithmetic from a forecast


      For arithmetic only, compare two years of constant **net** annual growth at 5% and 4%, with no additions,
      withdrawals or taxes. The results are **1,000 × 1.05² = 1,102.50** and **1,000 × 1.04² = 1,081.60**,
      a **20.90 difference**. Each second year''s growth applies to the first year''s closing amount.
      Net means the assumed return already reflects whatever costs are embedded in that rate; do not subtract
      the toy funds'' expense ratios again.


      These paths are independent examples, not projections for P or Q and not a twenty-year retirement
      forecast. The one-percentage-point difference illustrates how less retained growth leaves less to
      compound. Actual returns may be negative or variable, and taxes can change results. A neat curve
      does not establish a dependable future balance.


      ### Produce two bounded policies


      1. For N and L, state the deadline, consequence of loss and access need. Distinguish willingness
      from capacity. N cannot assume it can replace a shortfall; L has flexibility but still needs an
      explicit understanding of possible loss.

      2. Inspect the source''s broad-versus-sector example and the complete toy holdings and fee cards.
      Calculate the combined Alpha/Beta exposure and identify all unverified disclosure fields. Explain
      why two names do not create diversification and why diversification cannot guarantee against market
      loss.

      3. Show both compound calculations and the 20.90 difference. Keep net rates, time horizon and excluded
      taxes beside the results. Do not imply either rate is expected.

      4. Write a constraints-first N policy: preserve ability to meet the required amount by its date,
      require verified access and relevant protection, and reject reliance on uncertain market appreciation.
      Do not name a product or declare an unverified account safe.

      5. Write an L policy: assess capacity before taking investment risk, seek understandable diversified
      exposure, compare complete costs, resolve account and tax questions, and review on an agreed schedule
      or material life change. Leave allocation percentages undecided because suitability inputs are incomplete.

      6. Stress both policies with a **20% loss just before the required date**. A risky 1,000 holding
      would become 800; ask which goal can absorb the 200 loss or delay and what would need revision before
      implementation. Save your policies before the [later packet](?resource=file-later-packet-md).


      Review rules should react to changed goals, capacity, access and costs, not just recent performance
      or a confident prediction. Retirement planning also involves future needs and account rules that
      this small case does not establish. A simple policy can be a useful starting point while those questions
      remain unresolved.


      For support, use a calculator and two separate goal cards. For a harder pass, move L''s date forward
      and ask whether the previous capacity assumption still holds. Optional actual transfer is to read
      official education or a public disclosure privately, recording uncertainties without publishing
      holdings or opening an account. No purchase, sale or account transfer demonstrates completion. Having
      no investable surplus is compatible with learning the distinctions.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Two funds each hold 70% X and 30% Y. You divide your money equally between them. What is the
      combined exposure?

      2. A two-year illustration uses net growth of 3% on 500. Should you subtract a separate imagined
      fee again?

      3. Someone welcomes volatility but needs the full amount in four months for an essential payment.
      Which distinction matters?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Still 70% X and 30% Y. Two labels have not diversified the underlying holdings. Other categories
      or exposures require examination; diversification itself never guarantees no loss.

      2. No. Under the stated net-rate assumptions the balance is 500 × 1.03² = 530.45. Do not double-count
      costs or attach unrelated fees; the illustration is not a forecast and excludes any unprovided tax
      effects.

      3. Willingness to experience price movement is not capacity to absorb loss or delayed access. The
      required amount and date constrain the policy; no age-based allocation or expected rebound resolves
      the mismatch.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
