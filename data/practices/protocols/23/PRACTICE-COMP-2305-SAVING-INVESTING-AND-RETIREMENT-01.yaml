  - c2305_a3_adverse
  adverse_or_contradictory_indicators:
  - A positive return was guaranteed, an allocation was prescribed from age alone or a trade was made
    without resolving suitability and access.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Saving, investing, and retirement explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Saving, investing, and retirement context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Saving, investing, and retirement observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Saving, investing, and retirement rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate the money’s job from an attractive return story. Observed checks:
    Both goals have a deadline and loss consequence; Risk willingness and financial loss capacity are
    distinguished; Liquidity and account-rule questions are explicit; No universal allocation is inferred
    from age or horizon alone. Action 2: Inspect diversification and the compounding cost example. Observed
    checks: The two hypothetical balances and 20.90 difference are correct; Assumed constant returns are
    not presented as a forecast; Holdings overlap and fee disclosures are actually inspected; Diversification
    is not described as a guarantee against loss. Action 3: Stress the policy before any implementation.
    Observed checks: Each policy connects permitted risk to the goal and deadline; A near-deadline loss
    scenario changes or confirms the policy explicitly; Unresolved suitability tax and retirement questions
    remain open; The exercise ends without an investment transaction.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. Investment vocabulary was listed without a goal-linked
    policy, disclosure check, arithmetic or adverse scenario.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Saving,
    investing, and retirement contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
