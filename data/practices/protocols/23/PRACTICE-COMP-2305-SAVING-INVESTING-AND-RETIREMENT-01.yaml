meaning_and_fit:
  purpose: Relate a goal and time horizon to liquidity, risk capacity, diversification, costs, taxes and
    review rules without relying on a return prediction.
  why_recommended: Relate a goal and time horizon to liquidity, risk capacity, diversification, costs,
    taxes and review rules without relying on a return prediction.
  claims:
  - statement: Relate a goal and time horizon to liquidity, risk capacity, diversification, costs, taxes
      and review rules without relying on a return prediction.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Saving, investing, and retirement practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Saving, investing, and retirement as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a simple written or spoken policy and public educational material without
    sharing holdings or account numbers. A person with no current investable surplus can use the fictional
    case. Favor comprehension over adding products; disability, benefits, debt, dependents and local rules
    can materially change an actual plan.
  opportunity_considerations: 'Use two fictional goals: a necessary payment in six months and optional
    spending twenty years away. Assume an illustrative 1,000 starting amount. For arithmetic only, compare
    two years at constant net annual growth of 5% and 4%, with no deposits, withdrawals or taxes. Prepare
    a policy page with goal, deadline, loss tolerance and capacity, liquidity, diversification, fees,
    tax questions and review trigger.'
  prerequisites:
  - 'Use two fictional goals: a necessary payment in six months and optional spending twenty years away.
    Assume an illustrative 1,000 starting amount. For arithmetic only, compare two years at constant net
    annual growth of 5% and 4%, with no deposits, withdrawals or taxes. Prepare a policy page with goal,
    deadline, loss tolerance and capacity, liquidity, diversification, fees, tax questions and review
    trigger.'
  dependencies: []
  safe_alternatives:
  - Use a simple written or spoken policy and public educational material without sharing holdings or
    account numbers. A person with no current investable surplus can use the fictional case. Favor comprehension
    over adding products; disability, benefits, debt, dependents and local rules can materially change
    an actual plan.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Saving, investing, and retirement differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Saving, investing, and retirement
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use two fictional goals: a necessary payment in six months and optional spending twenty years
    away. Assume an illustrative 1,000 starting amount. For arithmetic only, compare two years at constant
    net annual growth of 5% and 4%, with no deposits, withdrawals or taxes. Prepare a policy page with
    goal, deadline, loss tolerance and capacity, liquidity, diversification, fees, tax questions and review
    trigger. Goal: Relate a goal and time horizon to liquidity, risk capacity, diversification, costs,
    taxes and review rules without relying on a return prediction. Scope: This is a fictional policy and
    disclosure-reading exercise, not a personal asset allocation, retirement sufficiency calculation or
    instruction to trade. Illustrative returns are not forecasts or guarantees. Time and effort: Forty
    minutes to compare two goals and costs, then fifteen minutes to review the policy against a loss scenario.
    Adaptation: Use a simple written or spoken policy and public educational material without sharing
    holdings or account numbers. A person with no current investable surplus can use the fictional case.
    Favor comprehension over adding products; disability, benefits, debt, dependents and local rules can
    materially change an actual plan. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a simple written or spoken policy and public educational material without sharing
    holdings or account numbers. A person with no current investable surplus can use the fictional case.
    Favor comprehension over adding products; disability, benefits, debt, dependents and local rules can
    materially change an actual plan.
  expected_burden: Forty minutes to compare two goals and costs, then fifteen minutes to review the policy
    against a loss scenario.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Saving, investing, and retirement protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Saving, investing, and retirement action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a simple
    written or spoken policy and public educational material without sharing holdings or account numbers.
    A person with no current investable surplus can use the fictional case. Favor comprehension over adding
    products; disability, benefits, debt, dependents and local rules can materially change an actual plan.
  actions:
  - stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01-A1
    sequence: 1
    title: Separate the money’s job from an attractive return story
    instructions: 'For each goal, describe when funds are needed and the consequence of a loss or access
      delay. Distinguish willingness to tolerate price changes from actual capacity to absorb a loss while
      meeting obligations. State what must remain accessible and which retirement or tax-advantaged arrangements
      require current eligibility and withdrawal-rule verification. Do not choose percentages until these
      constraints are understood, and do not assume a long horizon makes every investment suitable.


      Observation checks: Both goals have a deadline and loss consequence; Risk willingness and financial
      loss capacity are distinguished; Liquidity and account-rule questions are explicit; No universal
      allocation is inferred from age or horizon alone. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01
      action_stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01-A1
      competency_stable_id: '23.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2305_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2305_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_goals_have_a_deadline_and_loss_consequence
        - risk_willingness_and_financial_loss_capacity_are_distinguished
        - liquidity_and_account_rule_questions_are_explicit
        - no_universal_allocation_is_inferred_from_age_or_horizon_alone
      - measurement_id: c2305_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2305_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01-A2
    sequence: 2
    title: Inspect diversification and the compounding cost example
    instructions: 'Calculate 1,000 times 1.05 squared as 1,102.50 and 1,000 times 1.04 squared as 1,081.60,
      a 20.90 difference under the stated assumptions. Explain why ongoing costs reduce what remains to
      compound without treating either path as an expected result. Inspect an official educational example
      or a real public fund disclosure for holdings concentration, overlapping exposures and fees. Two
      funds holding the same assets are not automatically well diversified, and diversification does not
      eliminate market loss.


      Observation checks: The two hypothetical balances and 20.90 difference are correct; Assumed constant
      returns are not presented as a forecast; Holdings overlap and fee disclosures are actually inspected;
      Diversification is not described as a guarantee against loss. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01
      action_stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01-A2
      competency_stable_id: '23.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2305_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2305_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_two_hypothetical_balances_and_20_90_difference_are_correct
        - assumed_constant_returns_are_not_presented_as_a_forecast
        - holdings_overlap_and_fee_disclosures_are_actually_inspected
        - diversification_is_not_described_as_a_guarantee_against_loss
      - measurement_id: c2305_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2305_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01-A3
    sequence: 3
    title: Stress the policy before any implementation
    instructions: 'Write a provisional policy for each goal using constraints rather than product names:
      acceptable access, kinds of risk excluded, information required, cost comparison and a review schedule.
      Test an adverse scenario in which a risky holding loses value just before money is needed. State
      whether the policy would still serve the goal and what should be changed before implementation.
      Use a qualified, appropriately regulated adviser for unresolved personal suitability, tax or retirement
      questions; no purchase or account transfer is part of completion.


      Observation checks: Each policy connects permitted risk to the goal and deadline; A near-deadline
      loss scenario changes or confirms the policy explicitly; Unresolved suitability tax and retirement
      questions remain open; The exercise ends without an investment transaction. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which constraint would prevent an appealing product from serving the goal, and which
      cost or tax question must be resolved before acting?


      Examples: Supportive: The short-term goal retained an access-first constraint, the learner detected
      overlapping holdings and explained the hypothetical fee effect without predicting wealth.


      Mixed: The policy covered risk tolerance but initially omitted the inability to absorb a loss and
      was revised.


      Contradictory: A positive return was guaranteed, an allocation was prescribed from age alone or
      a trade was made without resolving suitability and access.


      Inconclusive: Investment vocabulary was listed without a goal-linked policy, disclosure check, arithmetic
      or adverse scenario.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01
      action_stable_id: PRACTICE-COMP-2305-SAVING-INVESTING-AND-RETIREMENT-01-A3
      competency_stable_id: '23.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2305_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2305_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_policy_connects_permitted_risk_to_the_goal_and_deadline
        - a_near_deadline_loss_scenario_changes_or_confirms_the_policy_explicitly
        - unresolved_suitability_tax_and_retirement_questions_remain_open
        - the_exercise_ends_without_an_investment_transaction
      - measurement_id: c2305_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
