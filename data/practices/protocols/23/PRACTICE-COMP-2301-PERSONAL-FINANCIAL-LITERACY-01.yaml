    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Lower income, positive cash, negative flow


      The next fictional month has **2,000 take-home pay**, the same **2,100 outflows**, opening cash
      carried from L1 of **700**, and no other cash movements. Its flow is **−100** and closing cash is
      **600**. A positive remaining balance does not turn the month into a surplus; it means earlier cash
      absorbs this supplied deficit.


      A fictional listener initially repeats, “The household earns 2,700 because it had 700 already.”
      The revised explanation distinguishes opening cash from new income. Another question asks how much
      debt remains after the two payments. Allocation is still absent, so the correct answer remains unknown;
      do not import the separate 1% example.


      Save the calculation and a corrected six-sentence account. State that recurring deficits would erode
      cash, without claiming a fixed runway from one stress month or assuming no future changes. The loan
      statement remains the named missing document. No tax return, debt payoff or actual household stability
      has been verified.


      The supplied listener response is fiction, not evidence that a real learner explained the case independently.
      For actual practice, a private explanation and later reconciled record could provide different evidence
      types, with misunderstandings and help retained.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Explain one fictional household''s position without confusing the month''s movements with what
      is owned or owed. Allow thirty minutes with paper or a calculator, then ten for a six-sentence explanation.
      All amounts are invented currency units. You need no account access, tax identifier or personal
      financial disclosure.


      ### Keep a flow and a balance in different columns


      Income and spending happen over a period. Cash and debt balances describe a point in time. The same
      household can have a positive cash balance, owe money and spend more than it earns in a particular
      month. These are compatible facts. A large credit limit is permission to borrow under terms; it
      is not earned income, an asset free of obligations or proof that repayment is affordable.


      Gross pay is the amount before deductions. Take-home pay is what enters the spending plan after
      those deductions. Withholding is not automatically the final tax bill. The IRS''s [withholding explanation,
      S15](https://www.irs.gov/individuals/employees/tax-withholding) describes U.S. pay-as-you-go payments
      and possible under- or over-withholding. It is used only to explain that distinction, not to calculate
      a tax return or recommend a withholding change. Real tax and benefits treatment requires current
      local information.


      A debt payment is a cash outflow, but the amount reducing principal depends on interest, fees and
      allocation. You cannot infer the closing debt balance just by subtracting the entire payment from
      principal unless the terms establish that treatment. Similarly, spending less than income does not
      establish resilience if large bills, unstable pay or inaccessible savings are omitted. The [CFPB
      cash-flow tool, S06](https://files.consumerfinance.gov/f/documents/cfpb_your-money-your-goals_cash_flow_budget_tool_2018-11_ADA.pdf)
      supports separating starting cash, incoming money and outgoing money before carrying a balance forward.
      Its worksheet is an educational aid, not a credit or stability assessment.


      ### Supplied month L1


      | Item | Amount | Type |

      | --- | --- | --- |

      | Gross pay | 3,000 | Income before withholding |

      | Withholding | 600 | Deduction from gross pay |

      | Take-home pay | 2,400 | Cash inflow |

      | Obligations | 1,500 | Cash outflow |

      | Variable spending | 500 | Cash outflow |

      | Debt payment | 100 | Cash outflow; allocation unknown |

      | Opening accessible cash | 400 | Starting cash balance |

      | Opening debt | 1,200 | Starting amount owed |


      No other cash movements occur in L1. Payment dates within the month, final tax liability, the debt''s
      fee and interest allocation, and other assets are not supplied. Do not invent them. Separately,
      use a toy interest calculation of **1% for one month on 1,200 before any payment**, and a basket
      that changes price from **100 to 105**. These independent teaching examples are not the household''s
      actual loan terms or a current national inflation statistic.


      ### Reconcile the position before interpreting it


      Gross pay less withholding is **3,000 − 600 = 2,400**. Outflows are **1,500 + 500 + 100 = 2,100**.
      The period''s surplus is **300**, and closing accessible cash is **400 + 300 = 700**. Starting cash
      is not added to income when describing earnings. The opening 1,200 debt is not subtracted again
      as a monthly expense. The 100 payment has already appeared once in cash outflow.


      Closing debt remains unknown because payment allocation and any charges are not given. The separate
      interest example is **1,200 × 0.01 = 12**. It would be wrong to silently attach that 12 to L1, assume
      88 principal repayment and announce a closing debt of 1,112. That could be correct under additional
      terms, but those terms are absent. A sound explanation leaves an important number unresolved rather
      than making the table look complete.


      The basket rises by 5 currency units, which is **5 / 100 = 5%**. The original 100 now buys less
      of that same basket; purchasing power has fallen relative to those items. This does not show that
      every item rose equally, that wages changed or that next year''s prices will follow the same path.
      A percentage needs its base and period, just as an interest rate needs its charging method and timing.


      ### Compare what the surplus could do


      For the fictional 300 surplus, write three conditional options. Keeping it accessible could help
      with a disruption, while forgoing an immediate debt reduction or goal purchase. Applying it to principal
      could reduce future interest if the real terms permit, while leaving less readily available cash;
      allocation and prepayment terms must be checked. Using it for a chosen goal could deliver a valued
      benefit while delaying reserve growth or debt reduction. The question is what is given up, not which
      option proves better character.


      Risk includes both loss and the inability to meet an obligation at the needed time. A positive month-end
      balance does not answer every timing question. An information-gathering step can therefore be more
      responsible than selecting a product. For this case, the loan statement showing payment allocation
      would resolve a specific debt unknown. A payslip and relevant tax information may clarify withholding,
      but the payslip alone does not determine final tax liability.


      ### Produce and check the explanation


      1. Create a flow column and opening/closing balance columns. Reconcile gross to net, total outflows,
      surplus and accessible cash. Leave closing debt explicitly unknown.

      2. Show the separate 12-unit interest and 5% basket calculations with their assumptions. Mark them
      as examples, not additional household movements.

      3. Compare the three uses of 300 using benefit, foregone alternative and missing information. Name
      why credit availability does not remove repayment risk.

      4. Explain the case in six sentences: net income; outflows; cash change; amount owed and its date;
      unresolved tax or loan detail; most material vulnerability. Use a private voice note or willing
      listener without personal identifiers. Record any correction rather than only reporting that the
      explanation felt clear.

      5. Save your attempt before opening the [later packet](?resource=file-later-packet-md). Recompute
      the next month from its changed income and carry forward actual supplied cash, not a desired target.


      For support, use counters or spoken arithmetic and have a helper label stocks versus flows before
      you calculate. For a harder pass, ask what dated bills you would need before declaring the 700 accessible
      throughout the month. Optional actual transfer is a private, redacted review of your own figures,
      with qualified help for tax, credit or benefits questions. Do not assess another person''s competence
      from their income or savings. Understanding a shortfall can be progress even when resources have
      not improved.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Opening cash is 200, take-home pay is 900 and outflows are 950. What are the period flow and
      closing cash?

      2. A 75 debt payment is made on an opening 800 balance. Can you report debt of 725 without the statement?

      3. A toy basket rises from 80 to 84, and 40 was withheld from pay. What can you conclude?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The flow is −50 and closing cash is 150. Opening cash is a balance, not extra earnings.
      Positive closing cash does not make the period profitable or establish future stability.

      2. No. Interest, fees, new charges and allocation must be known. The 75 is a cash outflow; how much
      reduces principal remains unresolved.

      3. That basket rose 5% for the stated comparison. The withholding is a payment mechanism, not proof
      of final tax liability. Neither figure establishes current national inflation or the person’s completed
      tax position.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
