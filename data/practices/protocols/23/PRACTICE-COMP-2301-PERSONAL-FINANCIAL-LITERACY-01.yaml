meaning_and_fit:
  purpose: Distinguish income, spending, debt and cash balances, then explain how interest, inflation,
    taxes, credit, risk and opportunity cost affect one ordinary financial position.
  why_recommended: Distinguish income, spending, debt and cash balances, then explain how interest, inflation,
    taxes, credit, risk and opportunity cost affect one ordinary financial position.
  claims:
  - statement: Distinguish income, spending, debt and cash balances, then explain how interest, inflation,
      taxes, credit, risk and opportunity cost affect one ordinary financial position.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Personal financial literacy practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Personal financial literacy as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use tokens, large print, spoken arithmetic or a trusted independent educator.
    Keep real account numbers, tax identifiers and login details outside the exercise. Personal tax, debt,
    benefits or investment decisions require current jurisdiction-specific information and suitable qualified
    advice; use the fictional case when privacy or distress makes personal review unsuitable.
  opportunity_considerations: Use paper or a calculator. The fictional month has gross pay 3,000, withholding
    600, take-home pay 2,400, obligations 1,500, variable spending 500 and a debt payment 100. Opening
    accessible cash is 400 and opening debt is 1,200. No other movements occur. Separately, compare a
    basket priced 100 then 105 and a simple one-month interest example of 1% on 1,200 before any payment.
  prerequisites:
  - Use paper or a calculator. The fictional month has gross pay 3,000, withholding 600, take-home pay
    2,400, obligations 1,500, variable spending 500 and a debt payment 100. Opening accessible cash is
    400 and opening debt is 1,200. No other movements occur. Separately, compare a basket priced 100 then
    105 and a simple one-month interest example of 1% on 1,200 before any payment.
  dependencies: []
  safe_alternatives:
  - Use tokens, large print, spoken arithmetic or a trusted independent educator. Keep real account numbers,
    tax identifiers and login details outside the exercise. Personal tax, debt, benefits or investment
    decisions require current jurisdiction-specific information and suitable qualified advice; use the
    fictional case when privacy or distress makes personal review unsuitable.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Personal financial literacy differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Personal financial literacy
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper or a calculator. The fictional month has gross pay 3,000, withholding 600, take-home
    pay 2,400, obligations 1,500, variable spending 500 and a debt payment 100. Opening accessible cash
    is 400 and opening debt is 1,200. No other movements occur. Separately, compare a basket priced 100
    then 105 and a simple one-month interest example of 1% on 1,200 before any payment. Goal: Distinguish
    income, spending, debt and cash balances, then explain how interest, inflation, taxes, credit, risk
    and opportunity cost affect one ordinary financial position. Scope: The supplied arithmetic is a literacy
    exercise, not a tax return, credit assessment or recommendation for any real household. Currency units
    and rates are fictional. Time and effort: Thirty minutes for the account and calculations, followed
    by a ten-minute explanation and correction. Adaptation: Use tokens, large print, spoken arithmetic
    or a trusted independent educator. Keep real account numbers, tax identifiers and login details outside
    the exercise. Personal tax, debt, benefits or investment decisions require current jurisdiction-specific
    information and suitable qualified advice; use the fictional case when privacy or distress makes personal
    review unsuitable. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use tokens, large print, spoken arithmetic or a trusted independent educator. Keep
    real account numbers, tax identifiers and login details outside the exercise. Personal tax, debt,
    benefits or investment decisions require current jurisdiction-specific information and suitable qualified
    advice; use the fictional case when privacy or distress makes personal review unsuitable.
  expected_burden: Thirty minutes for the account and calculations, followed by a ten-minute explanation
    and correction.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Personal financial literacy protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Personal financial literacy action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use tokens,
    large print, spoken arithmetic or a trusted independent educator. Keep real account numbers, tax identifiers
    and login details outside the exercise. Personal tax, debt, benefits or investment decisions require
    current jurisdiction-specific information and suitable qualified advice; use the fictional case when
    privacy or distress makes personal review unsuitable.
  actions:
  - stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01-A1
    sequence: 1
    title: Separate period flows from money owed or held
    instructions: 'Make separate columns for flows during the month and balances at a point in time. Reconcile
      gross pay less withholding to take-home pay, and take-home pay less the three spending amounts to
      a cash surplus of 300. Add that surplus to opening cash to obtain 700. Do not subtract the entire
      opening debt as another monthly expense or call withholding the final tax liability. The debt payment
      alone does not reveal how much principal was retired without its interest and fee allocation.


      Observation checks: Gross and take-home income reconcile to the supplied withholding; Monthly spending
      totals 2,100 and cash increases by 300; Cash and debt balances remain distinct from monthly flows;
      Unknown final tax and debt-payment allocation stay unknown. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01-A1
      competency_stable_id: '23.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2301_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2301_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - gross_and_take_home_income_reconcile_to_the_supplied_withholding
        - monthly_spending_totals_2_100_and_cash_increases_by_300
        - cash_and_debt_balances_remain_distinct_from_monthly_flows
        - unknown_final_tax_and_debt_payment_allocation_stay_unknown
      - measurement_id: c2301_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2301_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01-A2
    sequence: 2
    title: Calculate three effects without inventing a forecast
    instructions: 'Calculate the separate simple-interest example as 12 and the basket price increase
      as 5%. Explain that the same amount of cash buys less of that basket after the increase; this is
      not a statement of current national inflation. Compare using the 300 surplus for accessible reserves,
      debt principal or a chosen goal. Name a benefit, a foregone alternative and an uncertainty for each.
      Explain that borrowing adds an obligation and that credit terms must be read rather than inferred
      from a score or advertised rate.


      Observation checks: The separate interest example equals 12 with its assumptions stated; The basket
      increase equals five percent rather than five currency units being a rate; Three uses of the surplus
      include opportunity costs and uncertainty; Credit access is not treated as income or guaranteed
      affordability. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01-A2
      competency_stable_id: '23.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2301_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2301_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_separate_interest_example_equals_12_with_its_assumptions_stated
        - the_basket_increase_equals_five_percent_rather_than_five_currency_units_being_a_rate
        - three_uses_of_the_surplus_include_opportunity_costs_and_uncertainty
        - credit_access_is_not_treated_as_income_or_guaranteed_affordability
      - measurement_id: c2301_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2301_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01-A3
    sequence: 3
    title: Give a plain-language position and stress explanation
    instructions: 'Explain the household to a willing listener or an audio note in six sentences: net
      income, outflow, cash change, amount owed, unresolved tax or loan detail, and most important vulnerability.
      Test a fictional next-month take-home pay of 2,000 with unchanged spending: the deficit is 100,
      not evidence of poor character. Name the document needed to clarify one unknown and a sensible information-gathering
      next step. Correct any confusion the explanation reveals without entering real account identifiers.


      Observation checks: The explanation reports stocks and flows accurately; The reduced-income case
      produces a deficit of 100; One missing document or disclosure is identified specifically; The correction
      records understanding without claiming financial stability. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which distinction changed your understanding of what the household could afford, and
      which unknown prevents a stronger conclusion?


      Examples: Supportive: The learner reconciled the cash surplus, retained debt-payment uncertainty
      and explained why a smaller income creates a deficit despite positive opening cash.


      Mixed: The cash calculation was right, but withholding was initially described as the final tax
      bill and corrected during explanation.


      Contradictory: An advertised credit limit was counted as earned income or the exercise was used
      to prescribe another person’s debt or tax strategy.


      Inconclusive: Financial terms were repeated without reconciling the supplied numbers or explaining
      the income stress case.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2301-PERSONAL-FINANCIAL-LITERACY-01-A3
      competency_stable_id: '23.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2301_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2301_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_explanation_reports_stocks_and_flows_accurately
        - the_reduced_income_case_produces_a_deficit_of_100
        - one_missing_document_or_disclosure_is_identified_specifically
        - the_correction_records_understanding_without_claiming_financial_stability
      - measurement_id: c2301_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2301_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
