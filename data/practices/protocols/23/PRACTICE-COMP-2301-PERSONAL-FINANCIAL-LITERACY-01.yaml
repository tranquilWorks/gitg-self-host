        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Personal financial literacy; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use tokens, large print, spoken arithmetic or a trusted independent educator. Keep real account
      numbers, tax identifiers and login details outside the exercise. Personal tax, debt, benefits or
      investment decisions require current jurisdiction-specific information and suitable qualified advice;
      use the fictional case when privacy or distress makes personal review unsuitable.
    cultural_context:
    - Adapt the expression of Personal financial literacy to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use tokens, large print, spoken arithmetic or a trusted independent educator. Keep real account
      numbers, tax identifiers and login details outside the exercise. Personal tax, debt, benefits or
      investment decisions require current jurisdiction-specific information and suitable qualified advice;
      use the fictional case when privacy or distress makes personal review unsuitable.
  pause_conditions:
  - Pause Personal financial literacy when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Personal financial literacy practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Personal financial literacy situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
