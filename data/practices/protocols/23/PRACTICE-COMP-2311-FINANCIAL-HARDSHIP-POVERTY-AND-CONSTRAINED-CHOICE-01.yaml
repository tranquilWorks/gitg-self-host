meaning_and_fit:
  purpose: Prioritize harm reduction, assistance and legitimate negotiation when income cannot meet essential
    costs instead of pretending scarcity can always be solved by stricter budgeting.
  why_recommended: Prioritize harm reduction, assistance and legitimate negotiation when income cannot
    meet essential costs instead of pretending scarcity can always be solved by stricter budgeting.
  claims:
  - statement: Prioritize harm reduction, assistance and legitimate negotiation when income cannot meet
      essential costs instead of pretending scarcity can always be solved by stricter budgeting.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Financial hardship, poverty, and constrained choice
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Financial hardship, poverty, and constrained choice as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use an independent trusted helper, language access, disability support or
    a local legal-aid or benefits professional. Keep private case details outside the app. When circumstances
    involve coercive financial control, unsafe housing or immediate loss of essential care, prioritize
    suitable confidential and urgent support rather than a shared worksheet.
  opportunity_considerations: Use fictional monthly income 1,500 and necessary housing, food, care, transport
    and other obligations totaling 1,900. Optional spending is 80. Income may arrive irregularly, disability-related
    support costs cannot simply be removed, and eligibility for assistance is unknown. Prepare columns
    for need, amount, due date, consequence, existing agreement and available help.
  prerequisites:
  - Use fictional monthly income 1,500 and necessary housing, food, care, transport and other obligations
    totaling 1,900. Optional spending is 80. Income may arrive irregularly, disability-related support
    costs cannot simply be removed, and eligibility for assistance is unknown. Prepare columns for need,
    amount, due date, consequence, existing agreement and available help.
  dependencies: []
  safe_alternatives:
  - Use an independent trusted helper, language access, disability support or a local legal-aid or benefits
    professional. Keep private case details outside the app. When circumstances involve coercive financial
    control, unsafe housing or immediate loss of essential care, prioritize suitable confidential and
    urgent support rather than a shared worksheet.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Financial hardship, poverty, and constrained choice differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Financial hardship, poverty,
    and constrained choice as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use fictional monthly income 1,500 and necessary housing, food, care, transport and other obligations
    totaling 1,900. Optional spending is 80. Income may arrive irregularly, disability-related support
    costs cannot simply be removed, and eligibility for assistance is unknown. Prepare columns for need,
    amount, due date, consequence, existing agreement and available help. Goal: Prioritize harm reduction,
    assistance and legitimate negotiation when income cannot meet essential costs instead of pretending
    scarcity can always be solved by stricter budgeting. Scope: The exercise is a fictional stabilization
    case and verified help-route plan, not eligibility advice, debt settlement, a legal instruction to
    stop paying or a guarantee of housing or benefits. Time and effort: Thirty minutes to quantify and
    prioritize the case, plus one verified resource inquiry and a ten-minute revision. Adaptation: Use
    an independent trusted helper, language access, disability support or a local legal-aid or benefits
    professional. Keep private case details outside the app. When circumstances involve coercive financial
    control, unsafe housing or immediate loss of essential care, prioritize suitable confidential and
    urgent support rather than a shared worksheet. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an independent trusted helper, language access, disability support or a local
    legal-aid or benefits professional. Keep private case details outside the app. When circumstances
    involve coercive financial control, unsafe housing or immediate loss of essential care, prioritize
    suitable confidential and urgent support rather than a shared worksheet.
  expected_burden: Thirty minutes to quantify and prioritize the case, plus one verified resource inquiry
    and a ten-minute revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Financial hardship, poverty, and constrained choice protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Financial hardship, poverty, and constrained choice action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an independent
    trusted helper, language access, disability support or a local legal-aid or benefits professional.
    Keep private case details outside the app. When circumstances involve coercive financial control,
    unsafe housing or immediate loss of essential care, prioritize suitable confidential and urgent support
    rather than a shared worksheet.
  actions:
  - stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01-A1
    sequence: 1
    title: State the shortfall and rank consequences without shame
    instructions: 'Calculate the necessary-cost gap as 400 before optional spending. Removing the 80 optional
      units reduces total outflow but does not close that essential gap. List the likely consequences
      of missing each category, distinguishing immediate safety and care needs, housing continuity, income-enabling
      transport and other obligations. Mark legal deadlines and consequences that require confirmation
      rather than guessing a universal payment order. Identify irregular income and caregiving constraints
      as facts, not evidence of irresponsibility.


      Observation checks: The essential gap remains 400 after optional spending is removed; Consequences
      and timing are considered for each obligation; Disability and caregiving costs are not erased on
      paper; A legal or benefits uncertainty is marked for verification. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01
      action_stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01-A1
      competency_stable_id: '23.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2311_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2311_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_essential_gap_remains_400_after_optional_spending_is_removed
        - consequences_and_timing_are_considered_for_each_obligation
        - disability_and_caregiving_costs_are_not_erased_on_paper
        - a_legal_or_benefits_uncertainty_is_marked_for_verification
      - measurement_id: c2311_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2311_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01-A2
    sequence: 2
    title: Verify assistance and negotiation routes before relying on them
    instructions: 'Locate one official or reputable local assistance, benefits, housing, disability or
      independent counseling route appropriate to the case and check service area, eligibility questions,
      documents, cost and response time. Ask how earnings or assets could change benefits before assuming
      a new job or saving balance improves net resources. Prepare a creditor or provider message stating
      the difficulty and asking about legitimate options; a proposed arrangement is not an agreement until
      confirmed. Do not give passwords or pay an upfront fee for a promise to erase debt.


      Observation checks: One real help route is verified for location and service type; Eligibility response
      time cost and required information are checked; Benefit interactions and negotiation outcomes remain
      conditional; Fraud pressure and unverified debt-erasure promises are rejected. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01
      action_stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01-A2
      competency_stable_id: '23.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2311_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2311_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_real_help_route_is_verified_for_location_and_service_type
        - eligibility_response_time_cost_and_required_information_are_checked
        - benefit_interactions_and_negotiation_outcomes_remain_conditional
        - fraud_pressure_and_unverified_debt_erasure_promises_are_rejected
      - measurement_id: c2311_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2311_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01-A3
    sequence: 3
    title: Write a near-term plan with unresolved needs still visible
    instructions: 'For the next seven days, assign one contact, one document-gathering step and one essential
      continuity action with dates. Show which part of the 400 gap remains after only confirmed support;
      do not count hoped-for aid as income. Define when worsening safety, housing or care needs require
      urgent professional or emergency support. In a real situation, make the appropriate contact rather
      than repeating the fictional case; record contact made, aid approved and money received as separate
      events.


      Observation checks: Three near-term actions have owners or self-assigned dates; Only confirmed resources
      reduce the displayed gap; Escalation is tied to actual worsening consequences; Inquiry approval
      and receipt are not conflated. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which action reduces the most immediate harm, and what material shortfall remains
      that cannot honestly be solved by a personal habit change?


      Examples: Supportive: The learner kept the 400 essential gap visible, verified a housing-support
      route and treated a requested payment arrangement as pending rather than approved.


      Mixed: One resource was real but had a waiting period, so the seven-day plan needed another continuity
      route.


      Contradictory: The person was blamed for structural scarcity, essential care was deleted or speculative
      benefits were counted as cash already received.


      Inconclusive: A balanced-looking budget hid unpaid essentials and contained no verified assistance
      route or dated action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01
      action_stable_id: PRACTICE-COMP-2311-FINANCIAL-HARDSHIP-POVERTY-AND-CONSTRAINED-CHOICE-01-A3
