      - [Monopolization Defined](https://www.ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws/single-firm-conduct/monopolization-defined)

      - [Standard Setting in a Network Economy](https://www.ftc.gov/news-events/news/speeches/standard-setting-network-economy)

      - [Using in-depth interviews](https://www.gov.uk/service-manual/user-research/using-in-depth-interviews)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### A smaller deficit with continuing uncertainty


      The supplied later record says a willing friend gave **100 units unconditionally on day 2**, received
      and available in the fiction. This is not an award from Pima County, proof of benefit eligibility
      or recurring income. The official-service inquiry was prepared but no actual contact is represented;
      funding and response time remain unknown.


      With optional spending removed, resources are now **1600** against **1900** essentials: the residual
      monthly gap is **300**. Before housing is due, day-2 cash after food and transport is now **700**,
      leaving 200 of the 900 housing amount uncovered.


      Separately, the provider agrees in the supplied case to defer **100** of housing to day 20 with
      no added charge. Housing still totals 900; 800 is due day 3 and 100 on day 20. The early housing
      shortfall is now **100**, and the monthly gap remains **300**. Do not subtract the deferral again
      as if it were aid. This partial arrangement does not resolve necessary care and later dated needs.


      Revise the seven-day plan with these distinctions and retain unresolved amounts. Future gifts and
      official assistance remain unavailable until confirmed. There is no claim that all essential needs
      were met, that the person followed the plan over time or that structural poverty was solved.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Build a seven-day stabilization plan for a shortfall that optional spending cuts cannot solve.
      Allow twenty-five minutes for the supplied budget and verified help route, then ten for the changed
      circumstances. The aim is feasible harm reduction with honest unknowns, not a promise to eliminate
      poverty through budgeting.


      ### Name the constraint before prescribing effort


      Scarcity can limit time, transport, housing choices, access to support and the ability to absorb
      a fee. Irregular income makes dates matter as well as totals. Disability-related costs and caregiving
      may be necessary to keep someone safe or able to work; removing them from a spreadsheet does not
      remove the need. Unaffordable housing or a debt trap may require assistance, negotiation or a structural
      change unavailable within seven days. A plan should distinguish what the person can change from
      what depends on another party or a public system.


      Optional spending deserves a check, but an essentials-only deficit remains a deficit. Borrowing
      can move the immediate shortage while adding repayments and fees later. Delaying a payment changes
      timing only if the provider agrees, and it does not erase the obligation. Prioritization should
      consider actual consequences and available qualified help; this lesson does not impose a universal
      legal ranking of bills.


      The CFPB [cash-flow tool, S02](https://files.consumerfinance.gov/f/documents/cfpb_your-money-your-goals_cash_flow_budget_tool_2018-11_ADA.pdf)
      supports distinguishing resources available at different dates. The Atlanta Fed''s [benefits-cliff
      explanation, S07](https://www.atlantafed.org/what-we-study/workforce-development/advancing-careers-for-low-income-families/what-are-benefits-cliffs)
      describes how increased earnings can coincide with reduced assistance. It does not establish anyone''s
      eligibility or imply that earning more always reduces resources. A household needs its actual rules,
      costs and transition dates checked before relying on a change.


      ### Supplied constrained month H6


      The fictional resident lives in **Pima County, Arizona** solely to make the help-route check concrete.
      This location is not an assumption about the learner. Opening cash is zero. Income is **750 on day
      2 and 750 on day 18**, totaling **1500**. No reserve, new credit, approved aid or other available
      resource is supplied.


      | Need | Amount | Due or needed |

      | --- | ---: | --- |

      | Housing | 900 | Day 3 |

      | Food | 300 | 75 on days 2, 9, 16 and 23 |

      | Necessary disability and caregiving costs | 350 | Day 5 |

      | Essential transport | 150 | 75 on days 2 and 16 |

      | Utilities and other essential service | 200 | Day 12 |

      | Optional spending | 80 | Day 24 |


      Essentials total **1900**; with optional spending, outflow is **1980** and the gap is **480**. Removing
      all 80 optional units still leaves **400** unmet. After day-2 income, food and transport, only **600**
      remains against 900 housing due the next day. This is a projected **300 housing shortfall** before
      considering later needs. Writing a negative balance identifies unmet need; it is not authorization
      for an overdraft or evidence that a bill was paid.


      The plan must therefore address early timing and the month-level deficit separately. It may prepare
      an assistance inquiry and request an agreed payment arrangement. Neither is available cash until
      the terms and availability are actually established. The person should not be shamed for failing
      to stretch 1500 into 1900.


      For the consequence register, missed housing payment threatens housing continuity, with actual legal
      steps and deadlines unverified. Food supports immediate nourishment; care supports safety and daily
      functioning; transport enables necessary care or income-related trips; utilities support a usable
      home, with disconnection conditions unknown. Optional spending can be removed here without claiming
      that all enjoyment is dispensable in real life. The listed due dates are the only supplied agreements
      until a provider confirms a change.


      If food, safe shelter or essential care will be unavailable before the planned review, seek suitable
      urgent local support promptly rather than waiting for day 7. Immediate danger calls for the appropriate
      emergency route. The case supplies no emergency number, legal deadline or guarantee of a response;
      actual circumstances determine the service needed.


      ### Inspect one real official help route


      The [Pima County Community Assistance Division page, S06](https://www.pima.gov/community-assistance-division),
      inspected on 24 September 2026, describes housing and utility assistance for eligible county households,
      subject to funding and program conditions. Its listed contact is **520-724-2667**, weekdays **8
      a.m.–5 p.m., closed noon–1 p.m.** The page lists categories of supporting documents, including identity,
      income and the relevant housing or utility records. Keep actual records private and use the official
      route to establish what is needed.


      The public page does **not state a service cost or response turnaround** in the inspected passage;
      record both as unverified. Funding availability, the fictional household''s eligibility, appointment
      timing and the amount of any support are also unknown. No call or application occurred in authoring.
      Verifying an official phone number is a completed source check, not a completed request for assistance.


      A draft inquiry can ask whether this address and need fall within the service, what current criteria
      apply, which documents are necessary, whether there is any charge and when a response might be expected.
      Do not upload identifiers to this lesson, pay an unsolicited intermediary or accept a promise of
      guaranteed debt erasure. If someone elsewhere uses the lesson, replace this route with an inspected
      official local service rather than assuming county coverage travels with the worksheet.


      ### Make seven days manageable


      1. Reconcile income, essential costs and optional costs. Show both 480 and the residual 400. Mark
      dated shortfalls as unmet amounts instead of letting a spreadsheet silently spend nonexistent cash.

      2. On day 1, the fictional resident prepares a concise official-service inquiry and a private document
      checklist. Limit the task to information necessary for the route. Record contact as planned, not
      completed.

      3. On day 1, draft a request to the housing provider about the day-3 shortfall and any available
      arrangement. Ask about charges, consequences and written confirmation. Keep the original due date
      in force unless a valid agreement changes it.

      4. On day 2, review food, necessary care and transport continuity with the real consequences visible.
      Identify where an appropriate support worker or qualified adviser is needed. Do not solve the gap
      by deleting disability or caregiving needs.

      5. Set a day-4 check for actual responses and a day-7 revision. List owner, next date, status and
      unresolved amount for each of the three tasks above. Preserve the first plan before opening the
      [later packet](?resource=file-later-packet-md).


      The tasks can be reduced or shared with permission if disability, language, care or access burdens
      make them unrealistic. A helper may assist with finding official information without taking account
      control. Existing dependents and support relationships matter; a lower spreadsheet total achieved
      by shifting uncompensated care onto someone else may simply move the harm.


      ### Judge stabilization with proportionate evidence


      For support, calculate the monthly gap first, then just the day-3 housing problem. For a harder
      pass, introduce delayed income and ask which earlier arrangement would need rechecking; do not invent
      retrospective consent. In an optional actual attempt, use only your own or willingly shared redacted
      circumstances and an appropriate local route. A person need not disclose hardship to practice this
      competency.


      Useful progress could include an accurately limited plan and a later verified response, changed
      burden or continuity observation. A request, an approval, a payment and a recurring improvement
      are different events. One relief payment may reduce this month''s deficit without addressing unstable
      income, housing cost or a benefits cliff. This case treats partial stabilization as partial, and
      human worth as entirely separate from financial circumstances.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fiction or privately redacted records; keep credentials
      and sensitive identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Income is 1100, essentials 1450 and optional spending 40. What remains after removing every optional
      item?

      2. A provider moves 120 from this week to next month without forgiving it. Can you record 120 of
      new assistance?

      3. You found an official assistance page and drafted an inquiry. Can you mark an application accepted?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A 350-unit essentials deficit remains. The original gap was 390. The plan needs feasible
      assistance, income or agreed changes with consequences visible; shaming or deleting essential needs
      cannot balance it.

      2. No. Record the changed due date and continuing liability, including any actual fees or conditions.
      Timing relief is different from a grant, payment or permanent reduction.

      3. No. Source inspection and preparation are completed; contact, eligibility, acceptance, amount
      and receipt remain unverified. Record unknown cost or timing instead of inventing service guarantees.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
