      professional. Keep private case details outside the app. When circumstances involve coercive financial
      control, unsafe housing or immediate loss of essential care, prioritize suitable confidential and
      urgent support rather than a shared worksheet.
    cultural_context:
    - Adapt the expression of Financial hardship, poverty, and constrained choice to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - Use an independent trusted helper, language access, disability support or a local legal-aid or benefits
      professional. Keep private case details outside the app. When circumstances involve coercive financial
      control, unsafe housing or immediate loss of essential care, prioritize suitable confidential and
      urgent support rather than a shared worksheet.
  pause_conditions:
  - Pause Financial hardship, poverty, and constrained choice when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Financial hardship, poverty, and constrained choice practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Financial hardship, poverty, and constrained choice situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
