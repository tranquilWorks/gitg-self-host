meaning_and_fit:
  purpose: Consider children, elders and future stewards when planning education, inheritance, shared
    property or financial teaching without using resources to control another person’s life.
  why_recommended: Consider children, elders and future stewards when planning education, inheritance,
    shared property or financial teaching without using resources to control another person’s life.
  claims:
  - statement: Consider children, elders and future stewards when planning education, inheritance, shared
      property or financial teaching without using resources to control another person’s life.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Family and intergenerational stewardship practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Family and intergenerational stewardship as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use fictional counters, a family history example or an independent educator
    when real money discussion is unsafe. Children need age-appropriate participation and elders retain
    dignity and lawful decision rights. Do not demand financial disclosure, infer incapacity from age
    or disability, or create informal legal documents in place of qualified advice.
  opportunity_considerations: Use a fictional family with 600 discretionary units after essential obligations,
    an elder’s possible support need, a younger person’s learning goal and a shared tool needing upkeep.
    No person is assumed entitled to decide for the others. Prepare columns for current need, future benefit,
    decision rights, reversibility and unanswered legal or benefits questions.
  prerequisites:
  - Use a fictional family with 600 discretionary units after essential obligations, an elder’s possible
    support need, a younger person’s learning goal and a shared tool needing upkeep. No person is assumed
    entitled to decide for the others. Prepare columns for current need, future benefit, decision rights,
    reversibility and unanswered legal or benefits questions.
  dependencies: []
  safe_alternatives:
  - Use fictional counters, a family history example or an independent educator when real money discussion
    is unsafe. Children need age-appropriate participation and elders retain dignity and lawful decision
    rights. Do not demand financial disclosure, infer incapacity from age or disability, or create informal
    legal documents in place of qualified advice.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Family and intergenerational stewardship differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Family and intergenerational
    stewardship as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional family with 600 discretionary units after essential obligations, an elder’s
    possible support need, a younger person’s learning goal and a shared tool needing upkeep. No person
    is assumed entitled to decide for the others. Prepare columns for current need, future benefit, decision
    rights, reversibility and unanswered legal or benefits questions. Goal: Consider children, elders
    and future stewards when planning education, inheritance, shared property or financial teaching without
    using resources to control another person’s life. Scope: This is a fictional stewardship decision
    and an optional teaching interaction, not an estate, tax, benefits or property agreement. Actual transfers
    and authority require current qualified guidance. Time and effort: Thirty minutes for the case, a
    fifteen-minute teaching or rehearsal period and a ten-minute review. Adaptation: Use fictional counters,
    a family history example or an independent educator when real money discussion is unsafe. Children
    need age-appropriate participation and elders retain dignity and lawful decision rights. Do not demand
    financial disclosure, infer incapacity from age or disability, or create informal legal documents
    in place of qualified advice. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fictional counters, a family history example or an independent educator when
    real money discussion is unsafe. Children need age-appropriate participation and elders retain dignity
    and lawful decision rights. Do not demand financial disclosure, infer incapacity from age or disability,
    or create informal legal documents in place of qualified advice.
  expected_burden: Thirty minutes for the case, a fifteen-minute teaching or rehearsal period and a ten-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Family and intergenerational stewardship protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Family and intergenerational stewardship action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fictional
    counters, a family history example or an independent educator when real money discussion is unsafe.
    Children need age-appropriate participation and elders retain dignity and lawful decision rights.
    Do not demand financial disclosure, infer incapacity from age or disability, or create informal legal
    documents in place of qualified advice.
  actions:
  - stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01-A1
    sequence: 1
    title: Map benefits and rights across more than one generation
    instructions: 'Describe three possible uses of the 600: learning support, a reserve for an elder’s
      agreed need, or maintenance of the shared tool. Ask who benefits now, who bears future upkeep and
      who should have a voice. Include a reason for leaving some money uncommitted when needs are uncertain.
      Identify property ownership, gift conditions, inheritance intentions and benefits or tax questions
      without guessing answers. A future inheritance does not give current control over the owner.


      Observation checks: All three supplied needs receive consideration; Present benefit and future responsibility
      are separated; Each affected person’s decision rights remain explicit; Legal tax and benefits questions
      are not resolved by assumption. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01-A1
      competency_stable_id: '23.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2309_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2309_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_three_supplied_needs_receive_consideration
        - present_benefit_and_future_responsibility_are_separated
        - each_affected_person_s_decision_rights_remain_explicit
        - legal_tax_and_benefits_questions_are_not_resolved_by_assumption
      - measurement_id: c2309_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2309_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01-A2
    sequence: 2
    title: Compare a supportive offer with a controlling offer
    instructions: 'Write two versions of one proposed allocation. A supportive version states purpose,
      amount, permitted choices and any legitimate conditions before consent; a controlling version makes
      affection, career choice or private information the price of help. Explain why the second undermines
      agency and rewrite it. Then teach a willing learner, or rehearse, a simple 60-unit choice among
      spend now, maintain something and save for a chosen goal; ask them to explain their own tradeoff
      instead of copying yours.


      Observation checks: The supportive offer states conditions before agreement; A coercive condition
      is identified and removed; The learner or rehearsal includes an explicit small-budget tradeoff;
      Different reasonable preferences are accepted rather than corrected into obedience. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01-A2
      competency_stable_id: '23.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2309_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2309_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_supportive_offer_states_conditions_before_agreement
        - a_coercive_condition_is_identified_and_removed
        - the_learner_or_rehearsal_includes_an_explicit_small_budget_tradeoff
        - different_reasonable_preferences_are_accepted_rather_than_corrected_into_obedience
      - measurement_id: c2309_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2309_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01-A3
    sequence: 3
    title: Record a reviewable intention rather than an executed transfer
    instructions: 'Choose a provisional allocation or defer until the named questions are answered. State
      who must consent, which professional inquiry is needed and how a changed need would reopen the decision.
      Record what the teaching interaction revealed about understanding and independence. Keep intentions
      separate from signed documents or money actually transferred; any real gift, shared-property agreement
      or estate change must follow its own legitimate process.


      Observation checks: The decision includes required consent and unresolved questions; A changing-need
      review trigger is named; Teaching evidence concerns understanding not compliance; No intention is
      misrepresented as a valid transfer or estate arrangement. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Would this decision leave the next person better able to choose and care for what
      is entrusted to them, and where might a hidden condition undermine that aim?


      Examples: Supportive: The family case reserved room for uncertain care needs and revised an education
      gift so the learner could choose among legitimate paths.


      Mixed: Future upkeep was considered, but ownership and benefit implications remained unresolved
      and prevented an actual transfer.


      Contradictory: An anticipated inheritance or gift was used to demand obedience, or an elder’s property
      was allocated without authority.


      Inconclusive: Future generations were praised abstractly without comparing needs, rights, conditions
      or a teaching interaction.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2309-FAMILY-AND-INTERGENERATIONAL-STEWARDSHIP-01-A3
      competency_stable_id: '23.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
