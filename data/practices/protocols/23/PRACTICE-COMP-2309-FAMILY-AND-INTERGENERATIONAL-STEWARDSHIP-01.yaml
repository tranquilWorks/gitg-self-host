  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### Changed transport need and a still-pending asset


      In the supplied later meeting, Eli clarifies a **250-unit** transport need for this month and accepts
      an offer up to that amount. Jo confirms the course schedule is workable and still wants the course.
      The shared tool''s ownership and maintenance permission remain unresolved.


      Mina''s revised proposal is **200 course + 250 transport + 100 reserved for possible upkeep + 50
      uncommitted = 600**. The extra 100 comes from the former uncommitted balance, not a new promise
      of income. Reserving 100 does not authorize maintenance or make it a completed expenditure. No transfer
      or service booking has occurred in this case.


      Jo revisits the separate 60-unit teaching pot after the maintenance option rises from 15 to 30.
      Jo chooses 20 for the activity, 30 for maintenance and 10 saved, and explains that continued use
      matters more this time than faster saving. Mina can ask about the tradeoff without grading Jo''s
      preference as disobedience.


      The revision responds to a real need within the fiction and preserves choice, but future course
      benefit and safe asset upkeep remain unknown. Record the still-pending ownership check rather than
      calling the whole plan implemented. Actual family acceptance, legal suitability and sustained agency
      have not been established.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare uses of a family resource that support present care and future agency. Allow twenty-five
      minutes for the allocation and teaching example, followed by a later revision. You will create a
      provisional plan with costs, rights and review conditions rather than a decision over another person''s
      property or life.


      ### Separate benefit, ownership and control


      Intergenerational stewardship includes children, elders, education, inheritance, shared assets and
      the practical teaching of money decisions. Each involves different rights. Being older does not
      establish incapacity; being younger does not make every preference uninformed. The owner of a resource
      may set a lawful offer''s scope, but a gift can become controlling when affection, disclosure or
      obedience is demanded in return. The intended benefit should leave room for the recipient''s considered
      choices.


      Distinguish an immediate purchase from the capability it might support. A course may build skill
      only if the learner wants it, can attend and can use the learning. Maintaining a shared tool may
      preserve future usefulness but also commit someone to storage and upkeep. Cash may meet an urgent
      need or simply shift consumption across generations. None of these outcomes follows automatically
      from the word “investment.” Ask who benefits, who does the work, who owns the result and what can
      be changed later.


      The CFPB''s [family-help questions, S01](https://www.consumerfinance.gov/consumer-tools/educator-tools/adult-financial-education/tips-for-managing-family-lending-and-borrowing/)
      support making expectations explicit. Its [money conversation material, S03](https://www.consumerfinance.gov/consumer-tools/money-as-you-grow/talking-about-financial-decisions/)
      supports developmentally appropriate discussion. Neither source validates the invented family''s
      allocation or settles inheritance, tax, benefits or ownership questions. The linked teaching activities
      were not inspected or administered.


      ### Supplied family meeting F8


      Mina owns **600 discretionary units**, available after her essential obligations. This is not a
      shared account or an elder''s money. No transfer has occurred. Mina, younger learner Jo and elder
      Eli have voluntarily joined a discussion, may decline an offer and have not given Mina authority
      over their other resources.


      | Proposed use | Cost now | Intended present and future benefit | Burden, rights and uncertainty
      |

      | --- | ---: | --- | --- |

      | Jo''s chosen introductory course | 200 | A wanted learning opportunity with a small practice project
      | Jo would attend six sessions; schedule fit still needs confirmation; any offer is a gift, not
      a career choice |

      | Eli''s requested transport help | 150 | Access to an already chosen activity this month | Eli
      controls the activity and trip details; later transport need is unknown |

      | Upkeep of a shared workshop tool | 100 | Preserve a useful asset for several family members |
      Ownership and permission to arrange maintenance have not yet been confirmed; safe work requires
      an appropriate provider |

      | Uncommitted balance | 150 | Keep flexibility for a changed need | Mina retains ownership; nobody
      has a promised claim on this amount |


      The three proposed uses cost **450**, leaving **150** uncommitted. This is a proposal with two unresolved
      checks, not permission to pay for a course or arrange work on a shared asset. Education, elder support
      and maintenance are all legitimate candidates; the numbers do not prove that this split is uniquely
      fair.


      ### Work through a choice that preserves agency


      A controlling offer says, “I will pay for your course only if you choose the career I prefer and
      tell me all your spending.” Rewrite it: “I can offer up to 200 toward this course if you want it
      and the schedule works. You choose whether to accept. I do not need your account history or a promise
      about your career.” The rewritten offer still has a cost ceiling and purpose. Removing coercion
      does not require an unlimited commitment.


      For financial teaching, Jo uses a separate **60-unit fictional practice pot**, not another 60 taken
      from Mina''s 600. Three available choices are to spend 20 on a wanted activity, maintain an owned
      item for 15 and save any remainder for a self-chosen goal. Jo chooses all three: **20 + 15 + 25
      = 60**. Jo''s explanation is that enjoyment matters now, maintenance avoids losing use of the item
      and 25 starts a later goal. Another reasoned split can be defensible; the exercise tests explanation
      of consequences and tradeoffs, not agreement with Mina.


      A useful teaching response asks what would change if repair cost 30 or the activity no longer mattered.
      It does not reward repeating an adult''s favored allocation. If Jo cannot explain where the remaining
      money went, work the arithmetic together and record that help. A child-friendly discussion can use
      counters without asking a child to carry responsibility for household distress.


      ### Build the provisional stewardship plan


      1. Identify the resource owner and separate permission to discuss from authority to transfer or
      contract. Keep inheritance expectations outside current available funds unless an actual qualified
      determination establishes them.

      2. Compare all three uses and the retained balance using cost, near-term benefit, future agency,
      burden, ownership and reversibility. Do not hide maintenance labor or treat an older relative''s
      preferences as irrelevant.

      3. Write a conditional allocation totaling 600. Name the unresolved schedule and tool-permission
      checks, the person entitled to answer each, and what stays pending if the answer is unavailable.

      4. Rewrite the controlling offer and complete Jo''s separate 60-unit exercise. Record Jo''s supplied
      explanation distinctly from your interpretation. State one different reasonable choice you would
      accept.

      5. Set a review after those checks or a changed need. Preserve the first proposal, then open the
      [later packet](?resource=file-later-packet-md) and revise only what the new information supports.


      For an optional actual attempt, discuss a small resource you genuinely own with willing participants.
      A private, redacted comparison or a conversation about a hypothetical amount is enough to practice.
      Do not seek account access, signatures, wills or estate documents. Real gifts, shared property agreements
      and inheritance plans may affect tax, benefits and legal rights; use an appropriately qualified
      local route before relying on a consequential plan.


      ### Look beyond one agreeable meeting


      A polite response is not evidence that a plan strengthens future agency. Look for whether the recipient
      can use the resource, decline without penalty, explain a choice and revisit a burden. Ownership
      can remain with the giver before a transfer, while the recipient retains authority over unrelated
      life decisions. Those two facts are compatible.


      For support, use the four table rows and mark each as proposed, checked or committed. For greater
      difficulty, introduce a rising need without enlarging the 600-unit pot. The first thing to revise
      may be timing or the uncommitted balance; an urgent request does not silently authorize disposing
      of someone else''s asset. Over time, an actual allocation record plus a later use or teaching observation
      could support progress. The fictional meeting and teaching response here remain authored materials,
      not family agreement or longitudinal evidence.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fiction or privately redacted records; keep credentials
      and sensitive identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A learner chooses to save 10 of a 50-unit practice pot after explaining a wanted 40-unit purchase.
      Must you mark failure because you preferred saving 30?

      2. A promised inheritance is listed as cash available today to repair jointly owned property. Which
      two facts need separate correction?

      3. Your allocation table is complete but participants have not agreed and no later use is recorded.
      What remains open?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Check the arithmetic, consequences and whether the choice is genuinely theirs. A different
      reasonable preference is not incompetence or a failure of family loyalty.

      2. An expected inheritance is not established current cash, and funding does not establish authority
      over the joint asset. Verify availability and relevant ownership/permission through the appropriate
      qualified process before any commitment.

      3. The table is a planning artifact. Acceptance, implementation, use, teaching benefit and longer-term
      agency remain unverified; do not manufacture a family meeting or transfer.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
