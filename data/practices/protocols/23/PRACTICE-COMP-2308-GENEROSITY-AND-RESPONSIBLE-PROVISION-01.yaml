meaning_and_fit:
  purpose: Share money, access, knowledge or opportunity in a way that meets a real need while preserving
    obligations, consent and the recipient’s agency.
  why_recommended: Share money, access, knowledge or opportunity in a way that meets a real need while
    preserving obligations, consent and the recipient’s agency.
  claims:
  - statement: Share money, access, knowledge or opportunity in a way that meets a real need while preserving
      obligations, consent and the recipient’s agency.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Generosity and responsible provision practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Generosity and responsible provision as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Share verified knowledge, a permitted introduction, accessible materials or
    a small task when money is unavailable. Respect professional, fiduciary, workplace and privacy restrictions
    on what can be given. Ongoing dependence or essential care requires appropriate planning and qualified
    support, not abrupt withdrawal to demonstrate boundaries.
  opportunity_considerations: Default to offering a willing peer help finding a public, no-cost learning
    resource they have already requested. The offer is one verified resource and, if welcome, a ten-minute
    explanation. Alternatively use an affordable contribution through an appropriately verified organization.
    Set a limit on time, money and future obligations before offering.
  prerequisites:
  - Default to offering a willing peer help finding a public, no-cost learning resource they have already
    requested. The offer is one verified resource and, if welcome, a ten-minute explanation. Alternatively
    use an affordable contribution through an appropriately verified organization. Set a limit on time,
    money and future obligations before offering.
  dependencies: []
  safe_alternatives:
  - Share verified knowledge, a permitted introduction, accessible materials or a small task when money
    is unavailable. Respect professional, fiduciary, workplace and privacy restrictions on what can be
    given. Ongoing dependence or essential care requires appropriate planning and qualified support, not
    abrupt withdrawal to demonstrate boundaries.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Generosity and responsible provision differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Generosity and responsible
    provision as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to offering a willing peer help finding a public, no-cost learning resource they have
    already requested. The offer is one verified resource and, if welcome, a ten-minute explanation. Alternatively
    use an affordable contribution through an appropriately verified organization. Set a limit on time,
    money and future obligations before offering. Goal: Share money, access, knowledge or opportunity
    in a way that meets a real need while preserving obligations, consent and the recipient’s agency.
    Scope: One bounded contribution tests responsible provision, not the amount of generosity, the recipient’s
    gratitude or a claim of solving dependency. A non-monetary contribution is fully legitimate. Time
    and effort: Fifteen minutes to define capacity, one agreed contribution of up to thirty minutes and
    a short follow-up. Adaptation: Share verified knowledge, a permitted introduction, accessible materials
    or a small task when money is unavailable. Respect professional, fiduciary, workplace and privacy
    restrictions on what can be given. Ongoing dependence or essential care requires appropriate planning
    and qualified support, not abrupt withdrawal to demonstrate boundaries. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Share verified knowledge, a permitted introduction, accessible materials or a small
    task when money is unavailable. Respect professional, fiduciary, workplace and privacy restrictions
    on what can be given. Ongoing dependence or essential care requires appropriate planning and qualified
    support, not abrupt withdrawal to demonstrate boundaries.
  expected_burden: Fifteen minutes to define capacity, one agreed contribution of up to thirty minutes
    and a short follow-up.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Generosity and responsible provision protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Generosity and responsible provision action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Share verified
    knowledge, a permitted introduction, accessible materials or a small task when money is unavailable.
    Respect professional, fiduciary, workplace and privacy restrictions on what can be given. Ongoing
    dependence or essential care requires appropriate planning and qualified support, not abrupt withdrawal
    to demonstrate boundaries.
  actions:
  - stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01-A1
    sequence: 1
    title: Check need and capacity before making a promise
    instructions: 'Ask what outcome would be useful and whether the proposed help is wanted. Privately
      check essential obligations, dependents, current workload and any restriction on money or access
      you might share. State a contribution you can complete without resentment or hidden repayment expectations.
      For the default, offer to verify one learning resource rather than promising indefinite coaching,
      admission, employment or funding you cannot control.


      Observation checks: The recipient’s stated need precedes the offer; Existing responsibilities and
      real capacity are checked; The offer has clear time money and scope limits; No gratitude repayment
      or continuing access is secretly required. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01
      action_stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01-A1
      competency_stable_id: '23.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2308_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2308_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_recipient_s_stated_need_precedes_the_offer
        - existing_responsibilities_and_real_capacity_are_checked
        - the_offer_has_clear_time_money_and_scope_limits
        - no_gratitude_repayment_or_continuing_access_is_secretly_required
      - measurement_id: c2308_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2308_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01-A2
    sequence: 2
    title: Deliver the agreed form of help without taking over
    instructions: 'Verify the resource’s official source, cost, accessibility and entry requirements,
      then share only what the recipient agreed to receive. Explain one useful next step and leave the
      choice to them. If providing funds instead, use a verified appropriate route and disclose whether
      it is a gift or another arrangement before action; do not attach new conditions afterward. Do not
      request passwords, control spending or publicize the recipient’s circumstances as evidence of your
      generosity.


      Observation checks: The agreed contribution is actually delivered; Accuracy cost and access are
      checked for the default resource; The recipient retains the decision about use; No surveillance
      private disclosure or retroactive condition is introduced. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01
      action_stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01-A2
      competency_stable_id: '23.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2308_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2308_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_agreed_contribution_is_actually_delivered
        - accuracy_cost_and_access_are_checked_for_the_default_resource
        - the_recipient_retains_the_decision_about_use
        - no_surveillance_private_disclosure_or_retroactive_condition_is_introduced
      - measurement_id: c2308_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2308_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01-A3
    sequence: 3
    title: Review usefulness and the burden of continuing
    instructions: 'At the agreed follow-up, ask a single optional question about whether the contribution
      was useful or misplaced. Accept no answer and do not chase proof of gratitude. Compare your actual
      burden with the promised limit, then choose finish, revise a future offer or continue only by new
      mutual agreement. Record whether assistance was used, declined or remains unknown; giving more than
      intended is not automatically a better outcome.


      Observation checks: A welcome follow-up or lack of response is recorded honestly; Usefulness and
      donor burden are reviewed separately; Continuation requires a new freely agreed scope; The recipient’s
      response is not used as a worth or generosity score. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Did the contribution meet the recipient’s actual need within a sustainable promise,
      and what should change before making another offer?


      Examples: Supportive: A requested resource was verified and explained, the peer chose whether to
      use it and the helper ended at the agreed limit without expecting praise.


      Mixed: The help was welcome but took longer than promised, so future offers were narrowed.


      Contradictory: A gift was converted into control, the recipient was publicly exposed or essential
      obligations were sacrificed to look generous.


      Inconclusive: A donation intention or broad offer was recorded without a recipient-defined need
      or delivered contribution.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01
      action_stable_id: PRACTICE-COMP-2308-GENEROSITY-AND-RESPONSIBLE-PROVISION-01-A3
      competency_stable_id: '23.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
