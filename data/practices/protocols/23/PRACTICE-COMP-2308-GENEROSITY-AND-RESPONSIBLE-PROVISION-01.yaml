  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Generosity and responsible provision explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Generosity and responsible provision context,
