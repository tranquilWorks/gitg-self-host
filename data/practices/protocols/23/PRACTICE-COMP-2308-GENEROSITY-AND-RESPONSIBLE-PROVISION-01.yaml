  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events are not actual
      participant evidence.


      ### A helpful explanation that still exceeded capacity


      In the supplied follow-up, Dev permits one question and says the Wednesday example clarified timing;
      Dev has not yet used the worksheet. Rowan''s own log shows verification 12 minutes, preparation
      10 and explanation 10: **32 minutes**, exceeding the 30-minute ceiling by 2. No money or private
      records changed hands.


      Revise the record: delivery completed within the promised explanation duration; one fictional self-reported
      benefit; worksheet use unknown; giver''s overall capacity exceeded. Do not erase the overrun because
      the response was appreciative. Next time Rowan would shorten preparation to 8 minutes or offer only
      the link, after checking capacity anew.


      Dev asks whether Rowan can review accounts every Sunday. Rowan replies that the original offer was
      one explanation and ongoing reviews are unavailable. Dev retains the resource and control of any
      decisions. No recurring service had been promised, and no essential care is being withdrawn. Continued
      help would require a new, feasible agreement rather than an implied debt of gratitude.


      Save both versions and name the two-minute miss. These invented responses are an answerable learning
      case; they are not an actual recipient review or proof of sustainable giving over time.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Make one useful offer whose limits are clear before anyone depends on it. Allow twenty minutes
      to inspect the example, then ten for the follow-up. The product is a need, capacity and delivery
      record showing what was provided and what remains the recipient''s choice.


      ### Give in a way another person can actually use


      Generosity can share money, knowledge, access or an opportunity. The face value of a gift says little
      about its usefulness if the recipient cannot use it, must pay unexpected costs or is expected to
      surrender privacy. Ask what help is wanted before selecting a resource. A requested explanation
      may be more useful than another unsolicited plan. A recipient may decline without needing to prove
      that the giver''s idea was bad.


      Provision also has a time dimension. A promise that can be kept once is different from recurring
      support. Account for verification, preparation, delivery and follow-up as well as the visible moment
      of giving. Check legitimate obligations such as essential bills, care and already agreed work before
      allocating what remains. A person with little discretionary capacity can make a modest offer, postpone
      it or decline. Scarcity is not a generosity defect.


      The CFPB''s [family lending discussion, S01](https://www.consumerfinance.gov/consumer-tools/educator-tools/adult-financial-education/tips-for-managing-family-lending-and-borrowing/)
      helps distinguish the terms and limits of financial help. This exercise applies that clarity to
      a knowledge gift. It does not treat a worksheet as a loan contract or turn an explanation into permission
      to manage someone''s finances. Gifts with repayment expectations should not be described as unconditional
      gifts.


      ### Supplied request K3


      All people and responses here are invented. Dev asks Rowan: “Do you know a free page that explains
      why bills can be difficult between paydays? I want to work on it privately. Ten minutes on the timing
      idea would help; please don''t ask for my figures.” Dev can read an English PDF on an existing device
      and does not want an account or subscription. Rowan has **30 discretionary minutes this week, zero
      money to spend and no ongoing support capacity** after existing obligations.


      Rowan identifies the CFPB''s [four-page cash-flow tool, S02](https://files.consumerfinance.gov/f/documents/cfpb_your-money-your-goals_cash_flow_budget_tool_2018-11_ADA.pdf).
      The public PDF opened on 24 September 2026 without a login or charge. Its introductory explanation
      links beginning resources, dated inflows and outflows, and the balance carried forward. That check
      establishes public retrieval; it does not certify accessibility for every reader, provide a device
      or pay for connectivity. Dev''s stated device and format preference fit this fictional request.
      If the format did not work, ask about an alternative before promising one.


      Rowan''s proposed offer is: “I can share this public PDF and explain one made-up timing example
      for up to ten minutes on Thursday. You can keep your own information private. There is no repayment,
      public acknowledgment or future session expected. You can skip the explanation.” Dev accepts those
      terms in the supplied case. Acceptance is specific to this offer; it does not authorize account
      access or further advice.


      ### Work out the burden before delivery


      Rowan budgets **12 minutes to verify the source, 8 to prepare and 10 to explain: 30 total**. The
      resource costs zero to retrieve, but time is still a cost. The private toy example starts with 50
      units, receives 100 on Friday and has an 80-unit bill on Wednesday. Before Friday, 50 minus 80 is
      **minus 30**; after Friday, the arithmetic balance becomes **70**. The monthly-looking total does
      not remove Wednesday''s shortage. This is a timing demonstration, not a suggested borrowing or bill-priority
      decision.


      The supplied delivery record says that Rowan shared the official link, used only these invented
      numbers, stopped the explanation at ten minutes and left Dev to decide whether to use the tool.
      No worksheet was collected. A screenshot of Dev''s completed budget would add privacy cost without
      being necessary to show that the promised resource was delivered. A minimal record can say “official
      resource shared; agreed explanation completed; no private financial data requested.”


      Do not infer benefit from the act of sending. A link could be unread, inaccessible or unhelpful.
      Equally, a recipient may have benefited without wishing to provide feedback. Those possibilities
      require an unknown status rather than a gratitude test. Separating delivery from benefit protects
      both the recipient''s agency and the accuracy of the giver''s account.


      ### Produce the bounded giving record


      1. Restate Dev''s requested help, preferred format and privacy boundary. Record what is known from
      the supplied request and what you would still need to ask in an actual situation.

      2. Make a capacity ledger for money, minutes, existing obligations and future commitments. State
      the maximum before choosing the offer. Include the cost of checking a resource rather than treating
      that work as free.

      3. Record the resource''s publisher, public URL, retrieval date, cost, login requirement and fit
      with the request. Distinguish observed access from assumptions about usability. Do not describe
      the entire CFPB toolkit as inspected.

      4. Write the offer in words a recipient can decline. Specify delivery, duration, ownership of any
      later decisions and whether repayment or continuing support exists. Use the supplied acceptance
      only within this fictional case.

      5. Reproduce the timing example and the delivery record. Save an initial conclusion with separate
      fields for delivery, usefulness and burden before opening the [later packet](?resource=file-later-packet-md).


      For an actual low-stakes attempt, choose a willing person''s small request or a resource you already
      have legitimate permission to share. Do not make a purchase to complete the lesson. Share only what
      you can sustain, and ask permission before any optional feedback question. If no person wishes to
      participate, complete the supplied case and label actual transfer unattempted.


      ### Review without making generosity transactional


      A useful follow-up question is whether the resource met the requested need or created an unexpected
      burden. Ask once only if welcome; silence can remain silence. Record your own effort separately
      from the recipient''s response. If the offer was too large, a future offer can be smaller. That
      does not authorize abruptly withdrawing essential care or breaking an existing obligation: arrange
      an appropriate transition where someone already depends on agreed support.


      For support, work just the three monetary dates and the time ledger, with a helper reading the PDF
      introduction aloud if desired. For a harder pass, imagine a request for weekly account reviews and
      decide which terms exceed the original offer. A responsible refusal can leave the public resource
      available without promising replacement professional support. Evidence of growth would combine an
      actual bounded offer or delivery artifact with a later burden or use observation. This supplied
      story provides neither actual adherence nor proof that Dev''s financial position improved.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fiction or privately redacted records; keep credentials
      and sensitive identifiers private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A peer wants a free checklist without a login; the useful-looking resource requires a paid trial.
      Can you count it as the agreed gift?

      2. A recipient thanks you, but your 20-minute limit became 45 minutes and you want weekly progress
      screenshots. What needs correction?

      3. You inspected a resource but nobody requested or received it. What evidence can you claim?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. It fails the stated cost and access terms. Find and verify a suitable public alternative
      or explain that you have not found one; do not enroll the recipient.

      2. Separate appreciation from sustainability. Record the 25-minute overrun and remove the unagreed
      monitoring demand. Renegotiate any future offer without making privacy or gratitude the price of
      help.

      3. An inspected-resource artifact and preparation only. Delivery, recipient benefit and later adherence
      remain unattempted or unknown. A fictional completion cannot fill those gaps.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
