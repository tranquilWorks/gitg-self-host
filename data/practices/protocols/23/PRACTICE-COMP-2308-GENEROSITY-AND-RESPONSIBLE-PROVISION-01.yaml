  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Generosity and responsible provision; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Share verified knowledge, a permitted introduction, accessible materials or a small task when money
      is unavailable. Respect professional, fiduciary, workplace and privacy restrictions on what can
      be given. Ongoing dependence or essential care requires appropriate planning and qualified support,
      not abrupt withdrawal to demonstrate boundaries.
    cultural_context:
    - Adapt the expression of Generosity and responsible provision to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Share verified knowledge, a permitted introduction, accessible materials or a small task when money
      is unavailable. Respect professional, fiduciary, workplace and privacy restrictions on what can
      be given. Ongoing dependence or essential care requires appropriate planning and qualified support,
      not abrupt withdrawal to demonstrate boundaries.
  pause_conditions:
  - Pause Generosity and responsible provision when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Generosity and responsible provision practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Generosity and responsible provision situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
