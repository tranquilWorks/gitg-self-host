      - [Tax withholding](https://www.irs.gov/individuals/employees/tax-withholding)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      ### Second cycle: a changed payday still fits, narrowly


      Begin with **350**, not the original 100. Day 1 income produces 1,550; day 2 rent leaves 750; day
      8 essentials leave 350. The **200 rent on day 16** leaves **150** before the delayed income. Day
      17 income produces 1,350. Utilities leave 1,200, transport 1,100, debt 1,000, day-28 enjoyment and
      generosity 800, and day-29 transfers **600**. The minimum is **150** and all supplied dated obligations
      are covered.


      The reserve and goal pots each receive another 100; after two cycles each has 200. These transfers
      are already included in spendable outflows. Do not subtract them again from the household total
      or confuse the 600 spendable ending cash with all cash across pots.


      A further disruption of more than 150 before the delayed income would exceed this lowest-point cushion
      under the stated facts. It would require revisiting resources, optional timing or an explicitly
      agreed obligation change. No such further disruption or agreement occurs here.


      Compare your planned review point with the risk window. If you checked only after day 17, move the
      review early enough to act before day 16. The two calendars demonstrate supplied feasibility, not
      actual spending discipline, regular income or absence of omitted real-world costs.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Build a two-cycle spending calendar that works on the dates money is needed. Allow forty minutes
      for the calendars and ten for review. These invented amounts are not recommended percentages. The
      exercise tests obligations and chosen priorities together: resilience, goals, generosity and enjoyment
      all remain visible.


      ### A monthly surplus can arrive too late


      A budget allocates money across purposes; a cash-flow calendar tests whether available money covers
      each dated movement. The month''s total can look comfortable while a bill arrives before the next
      payment. A repair must change an actual resource or a feasible payment arrangement before the shortfall
      occurs. Deleting a later optional purchase does not create earlier cash.


      The [CFPB cash-flow worksheet, S06](https://files.consumerfinance.gov/f/documents/cfpb_your-money-your-goals_cash_flow_budget_tool_2018-11_ADA.pdf)
      uses a carried starting balance and incoming and outgoing money to expose short periods. Here the
      same principle is applied to individual days in an original case. Moving money into a separate savings
      pot reduces the amount available in the spending pot, but it is not consumption or a loss of household
      wealth. Do not count the same transfer twice when reconciling the whole household.


      ### Complete first-cycle calendar


      Start with **100** available cash. Income is **1,200 on day 1** and **1,200 on day 15**. Every movement
      below is from or into the spendable pot; separate reserve and goal pots begin at zero. There are
      no other movements, interest or fees.


      | Day | Movement | Amount out unless labeled income |

      | --- | --- | --- |

      | 1 | Income | +1,200 |

      | 2 | Rent | 1,000 |

      | 8 | Essentials | 400 |

      | 15 | Income | +1,200 |

      | 18 | Utilities | 150 |

      | 22 | Transport | 100 |

      | 25 | Debt payment | 100 |

      | 28 | Enjoyment | 150 |

      | 28 | Generosity | 50 |

      | 29 | Reserve transfer | 100 |

      | 29 | Goal transfer | 100 |


      Outflows total **2,150**, leaving an arithmetic ending balance of **100 + 2,400 − 2,150 = 350**.
      But after day 1 the balance is 1,300; after rent it is 300; after essentials it would be **−100
      on day 8**. This is an infeasible point in the original plan, not permission to overdraw or evidence
      of an actual bank transaction. Mark it before carrying the arithmetic forward.


      ### Use the supplied agreement, not imagined consent


      The case includes one confirmed fictional repair: the rent provider agrees to **800 on day 2 and
      200 on day 16, with no fee or other consequence**. This is a supplied fact for the exercise. An
      actual person would need an appropriate confirmed agreement before relying on a changed due date.
      The worksheet itself cannot renegotiate a contract.


      With the split, available cash is **1,300 after day 1, 500 after day 2 and 100 after day 8**. The
      second income raises it to 1,300 on day 15; the remaining rent leaves 1,100 on day 16. Utilities,
      transport and debt reduce it to 950, 850 and 750. Day-28 allocations leave 550; the two saving transfers
      leave **350**. The lowest revised balance is **100**, including the opening position. Total rent
      and month-end spendable cash are unchanged; timing is what repaired the failure.


      The optional enjoyment and generosity happen on day 28. Canceling them alone would increase the
      end balance but would not remove the original day-8 shortage. Nor may you remove essentials from
      the case because they are inconvenient. If a different earlier optional expense existed, reducing
      it might help, but none is supplied. State that limitation rather than inventing a hidden source
      of money.


      ### Make priorities explicit enough to revisit


      Obligations protect immediate commitments. Reserves can absorb later disruptions; goal saving serves
      a chosen future use. Generosity and enjoyment can be legitimate priorities alongside both. A workable
      plan gives each a reason and an adjustable boundary. It does not demand that a person prove seriousness
      by eliminating every pleasure or gift. The fictional allocation is one choice, not a universal ideal.


      Review matters because even a careful calendar can become stale. A due-date change, reduced pay,
      extra care cost or delayed transfer can remove the buffer. A useful review asks what changed and
      whether the next required movement is covered. It need not track every private detail in a shared
      app. When essentials exceed resources, help with assistance, negotiation or stabilization may be
      needed; a balanced-looking sheet cannot create income.


      ### Produce two calendars and a review rule


      1. Enter every first-cycle movement in order and calculate the running balance. Label obligations
      and each chosen purpose. Flag the original day-8 shortfall even though the total ends positive.

      2. Rebuild the calendar using the confirmed rent split. Show why the lowest balance is 100 and why
      the end is still 350. Explain why canceling day-28 spending does not repair day 8 in the original
      calendar.

      3. Prepare the next cycle using the carried **350**, the same revised outflows and first income
      on day 1. Move the second 1,200 payment to **day 17**. Calculate the balance before and after day-16
      rent rather than assuming the prior solution still works.

      4. Choose a weekly review point, such as day 7 before essentials. Name an early trigger: expected
      available cash below a required upcoming payment, or income not confirmed before a dependent due
      date. Optional allocations may be reconsidered with reasons; a revised obligation requires an authorized
      arrangement.

      5. Save your calendars before opening the [later packet](?resource=file-later-packet-md). Distinguish
      a plan, a simulated movement and a later actual spending record. Two simulated cycles cannot establish
      real adherence.


      For support, use a tactile calendar or one event per card and calculate together, recording the
      help. For a harder case, delay the second-cycle income past utilities as well; identify the first
      point requiring a new plan rather than assuming another agreement. Optional actual transfer is a
      private comparison of a real plan with subsequent movements, with no linked account requirement.
      Retain mismatches and resource constraints. A useful budget is one you can revise honestly, not
      a test of personal worth.


      ### Use the result at its proper scale


      Financial education only; tax, investment, insurance, estate, and benefits decisions may require
      licensed or jurisdiction-specific advice.  Use fictional or privately redacted figures. Do not upload
      account identifiers, credentials or private financial records. Fiction and no attempt are legitimate.
      Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A budget ends 200 ahead, but reaches −30 before payday. Has it passed the timing test?

      2. An optional purchase occurs on day 25; the shortfall is on day 6. Does canceling the purchase
      alone fix day 6?

      3. You move 50 from a spending pot to your own reserve pot. How should the records treat it?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. The monthly total hides a 30-unit timing gap. Find a feasible earlier resource or an
      explicitly agreed payment change; do not count an unauthorized overdraft as a repair.

      2. No. It changes a later balance. You must identify a change that affects cash available by day
      6, without erasing essentials or inventing consent.

      3. Reduce the spendable pot by 50 and increase the reserve by 50. It is a transfer, not consumption
      or a second household expense. A simulation of that transfer is not evidence that real saving occurred.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
