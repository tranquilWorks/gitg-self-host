meaning_and_fit:
  purpose: Allocate money among obligations, resilience, goals, generosity and enjoyment while checking
    the dates on which the plan must actually work.
  why_recommended: Allocate money among obligations, resilience, goals, generosity and enjoyment while
    checking the dates on which the plan must actually work.
  claims:
  - statement: Allocate money among obligations, resilience, goals, generosity and enjoyment while checking
      the dates on which the plan must actually work.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Budgeting and cash-flow control practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Budgeting and cash-flow control as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a tactile calendar, voice notes or an accessible budgeting tool with no
    linked-account requirement. Keep the fictional case for training. When essential costs exceed income,
    move to assistance, negotiation and stabilization rather than forcing a balanced-looking sheet or
    treating access constraints as a discipline failure.
  opportunity_considerations: Start with cash 100 and income 1,200 on days 1 and 15. Bills are rent 1,000
    on day 2, essentials 400 on day 8, utilities 150 on day 18, transport 100 on day 22 and debt 100 on
    day 25. Optional allocations are enjoyment 150 and generosity 50 on day 28, reserve saving 100 and
    goal saving 100 on day 29. These are fictional amounts, not recommended percentages.
  prerequisites:
  - Start with cash 100 and income 1,200 on days 1 and 15. Bills are rent 1,000 on day 2, essentials 400
    on day 8, utilities 150 on day 18, transport 100 on day 22 and debt 100 on day 25. Optional allocations
    are enjoyment 150 and generosity 50 on day 28, reserve saving 100 and goal saving 100 on day 29. These
    are fictional amounts, not recommended percentages.
  dependencies: []
  safe_alternatives:
  - Use a tactile calendar, voice notes or an accessible budgeting tool with no linked-account requirement.
    Keep the fictional case for training. When essential costs exceed income, move to assistance, negotiation
    and stabilization rather than forcing a balanced-looking sheet or treating access constraints as a
    discipline failure.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Budgeting and cash-flow control differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Budgeting and cash-flow control
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Start with cash 100 and income 1,200 on days 1 and 15. Bills are rent 1,000 on day 2, essentials
    400 on day 8, utilities 150 on day 18, transport 100 on day 22 and debt 100 on day 25. Optional allocations
    are enjoyment 150 and generosity 50 on day 28, reserve saving 100 and goal saving 100 on day 29. These
    are fictional amounts, not recommended percentages. Goal: Allocate money among obligations, resilience,
    goals, generosity and enjoyment while checking the dates on which the plan must actually work. Scope:
    Two fictional cycles test budgeting mechanics and priorities. They do not prove real adherence or
    authorize delaying essential bills without agreement. Time and effort: Forty minutes to construct
    and stress-test two calendars, plus a ten-minute review. Adaptation: Use a tactile calendar, voice
    notes or an accessible budgeting tool with no linked-account requirement. Keep the fictional case
    for training. When essential costs exceed income, move to assistance, negotiation and stabilization
    rather than forcing a balanced-looking sheet or treating access constraints as a discipline failure.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a tactile calendar, voice notes or an accessible budgeting tool with no linked-account
    requirement. Keep the fictional case for training. When essential costs exceed income, move to assistance,
    negotiation and stabilization rather than forcing a balanced-looking sheet or treating access constraints
    as a discipline failure.
  expected_burden: Forty minutes to construct and stress-test two calendars, plus a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Budgeting and cash-flow control protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Budgeting and cash-flow control action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a tactile
    calendar, voice notes or an accessible budgeting tool with no linked-account requirement. Keep the
    fictional case for training. When essential costs exceed income, move to assistance, negotiation and
    stabilization rather than forcing a balanced-looking sheet or treating access constraints as a discipline
    failure.
  actions:
  - stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01-A1
    sequence: 1
    title: Lay out a dated plan rather than a monthly average
    instructions: 'Write every income, bill and allocation in date order and update the running available
      cash after each. Total the outflows as 2,150 and the month-end cash as 350, treating transfers to
      the separate reserve and goal pots as reductions in the spendable pot rather than consumption. Identify
      the day-8 balance of minus 100 before the second pay arrives. Label each obligation and chosen good
      so an apparently positive monthly total does not conceal the timing failure.


      Observation checks: Every supplied movement appears on its actual day; Outflows from the spendable
      pot total 2,150; The positive ending balance does not hide the day-eight shortfall; Obligations
      and the four chosen allocation purposes remain visible. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01
      action_stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01-A1
      competency_stable_id: '23.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2302_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2302_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - every_supplied_movement_appears_on_its_actual_day
        - outflows_from_the_spendable_pot_total_2_150
        - the_positive_ending_balance_does_not_hide_the_day_eight_shortfall
        - obligations_and_the_four_chosen_allocation_purposes_remain_visible
      - measurement_id: c2302_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2302_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01-A2
    sequence: 2
    title: Repair the timing with an explicit feasible agreement
    instructions: 'Use this additional fictional fact: the rent provider agrees to 800 on day 2 and 200
      on day 16 without fees or other consequences. Recalculate the calendar; the lowest available balance
      becomes 100 and the ending balance remains 350. Explain why this repair works and why a real person
      would need the agreement confirmed before relying on it. Compare a different repair, such as reducing
      a truly optional earlier expense, and reject any solution that assumes food, care, housing or legal
      obligations can simply disappear.


      Observation checks: The agreed split is entered as two dated payments; The revised lowest available
      balance equals 100; Month-end spendable cash still equals 350; The repair does not invent consent
      or erase essential needs. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01
      action_stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01-A2
      competency_stable_id: '23.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2302_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2302_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_agreed_split_is_entered_as_two_dated_payments
        - the_revised_lowest_available_balance_equals_100
        - month_end_spendable_cash_still_equals_350
        - the_repair_does_not_invent_consent_or_erase_essential_needs
      - measurement_id: c2302_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2302_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01-A3
    sequence: 3
    title: Run the next cycle and retain the reason for each tradeoff
    instructions: 'Carry forward the available 350, repeat the revised bill calendar, and delay the second
      1,200 payment to day 17. Calculate whether all obligations can still be met on time; under the supplied
      facts they can. Mark what would need renegotiation if a further disruption exceeded the buffer.
      Choose a weekly review point and state which allocations would be reconsidered first and why. For
      personal use, compare the plan with actual private movements later; a simulated cycle is never recorded
      as real spending adherence.


      Observation checks: The second cycle uses the actual carried-forward starting cash; The delayed
      pay is tested against dated obligations; A threshold for revisiting the plan and a review day are
      specified; Simulation and any later real spending comparison are labeled separately. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the plan work at its lowest-cash point, and what tradeoff would you revisit before
      the next cycle rather than after a missed bill?


      Examples: Supportive: The learner caught the early shortfall, used the stated rent agreement and
      verified the delayed-pay second cycle without deleting generosity or enjoyment by reflex.


      Mixed: The first month balanced, but a forgotten due date required a new arrangement before the
      plan became workable.


      Contradictory: Essential spending was removed on paper or an unapproved bill delay was represented
      as an agreed budget repair.


      Inconclusive: Only monthly totals were written, with no running balance, timing test or second-cycle
      review.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01
      action_stable_id: PRACTICE-COMP-2302-BUDGETING-AND-CASH-FLOW-CONTROL-01-A3
      competency_stable_id: '23.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2302_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2302_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_second_cycle_uses_the_actual_carried_forward_starting_cash
        - the_delayed_pay_is_tested_against_dated_obligations
        - a_threshold_for_revisiting_the_plan_and_a_review_day_are_specified
        - simulation_and_any_later_real_spending_comparison_are_labeled_separately
      - measurement_id: c2302_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
