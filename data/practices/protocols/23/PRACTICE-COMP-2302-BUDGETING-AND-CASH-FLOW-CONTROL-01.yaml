  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Budgeting and cash-flow control; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a tactile calendar, voice notes or an accessible budgeting tool with no linked-account requirement.
      Keep the fictional case for training. When essential costs exceed income, move to assistance, negotiation
      and stabilization rather than forcing a balanced-looking sheet or treating access constraints as
      a discipline failure.
    cultural_context:
    - Adapt the expression of Budgeting and cash-flow control to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a tactile calendar, voice notes or an accessible budgeting tool with no linked-account requirement.
      Keep the fictional case for training. When essential costs exceed income, move to assistance, negotiation
      and stabilization rather than forcing a balanced-looking sheet or treating access constraints as
      a discipline failure.
  pause_conditions:
  - Pause Budgeting and cash-flow control when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Budgeting and cash-flow control practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Budgeting and cash-flow control situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Financial education only; tax, investment, insurance, estate, and benefits decisions may require licensed
    or jurisdiction-specific advice.
