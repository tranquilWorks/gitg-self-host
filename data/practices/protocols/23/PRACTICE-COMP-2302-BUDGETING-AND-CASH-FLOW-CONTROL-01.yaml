  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Budgeting and cash-flow control explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Budgeting and cash-flow control context,
