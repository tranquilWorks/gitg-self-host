  - stable_id: PRACTICE-COMP-2703-SEASONS-AND-CHANGING-EMPHASIS-01-A2
    sequence: 2
    title: Make one advance and one protection workable
    instructions: 'Place no more than two items in advance, two in protect and three optional items in
      wait. For each give a concrete next action or boundary and an owner. Prepare the care handoff in
      the example and agree a protected rest window with anyone it affects. Communicate a paused shared
      commitment rather than silently abandoning it. Set a review date in two weeks and an earlier trigger
      for changed safety, capacity or obligations.


      Observation checks: Advance protect and wait each have bounded contents; One advance action and
      one protection are installed; Any shared pause or handoff is communicated and agreed; A two-week
      review and earlier change trigger are set. Mark only what you observed. Missing, mixed and negative
