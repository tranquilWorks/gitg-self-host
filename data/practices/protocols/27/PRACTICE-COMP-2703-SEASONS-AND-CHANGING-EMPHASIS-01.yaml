meaning_and_fit:
  purpose: Identify the demands of a current life season and distinguish what must advance, what needs
    protection and what can legitimately wait.
  why_recommended: Identify the demands of a current life season and distinguish what must advance, what
    needs protection and what can legitimately wait.
  claims:
  - statement: Identify the demands of a current life season and distinguish what must advance, what needs
      protection and what can legitimately wait.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Seasons and changing emphasis practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Seasons and changing emphasis as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use symbols, a short conversation or a helper chosen by the participant. When
    capacity is very limited, one protected essential action may be the entire feasible practice. Rehearsal
    supports planning but does not demonstrate caregiving, recovery or a lived transition.
  opportunity_considerations: 'Use three columns labeled advance, protect and wait. The supplied case
    is a temporary increase in caregiving alongside ordinary work: prepare one care handoff, protect needed
    rest and essential work, and pause an elective project. Choose a similarly real current constraint
    or use the case as a labeled planning rehearsal.'
  prerequisites:
  - 'Use three columns labeled advance, protect and wait. The supplied case is a temporary increase in
    caregiving alongside ordinary work: prepare one care handoff, protect needed rest and essential work,
    and pause an elective project. Choose a similarly real current constraint or use the case as a labeled
    planning rehearsal.'
  dependencies: []
  safe_alternatives:
  - Use symbols, a short conversation or a helper chosen by the participant. When capacity is very limited,
    one protected essential action may be the entire feasible practice. Rehearsal supports planning but
    does not demonstrate caregiving, recovery or a lived transition.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Seasons and changing emphasis differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Seasons and changing emphasis
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three columns labeled advance, protect and wait. The supplied case is a temporary increase
    in caregiving alongside ordinary work: prepare one care handoff, protect needed rest and essential
    work, and pause an elective project. Choose a similarly real current constraint or use the case as
    a labeled planning rehearsal. Goal: Identify the demands of a current life season and distinguish
    what must advance, what needs protection and what can legitimately wait. Scope: Season labels are
    planning descriptions, not diagnoses or rules for how long grief, recovery or caregiving should last.
    Existing duties and qualified care remain authoritative. Time and effort: Twenty minutes to prepare,
    two small adjustments during the next fortnight and a 15-minute review. Adaptation: Use symbols, a
    short conversation or a helper chosen by the participant. When capacity is very limited, one protected
    essential action may be the entire feasible practice. Rehearsal supports planning but does not demonstrate
    caregiving, recovery or a lived transition. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use symbols, a short conversation or a helper chosen by the participant. When capacity
    is very limited, one protected essential action may be the entire feasible practice. Rehearsal supports
    planning but does not demonstrate caregiving, recovery or a lived transition.
  expected_burden: Twenty minutes to prepare, two small adjustments during the next fortnight and a 15-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Seasons and changing emphasis protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Seasons and changing emphasis action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use symbols,
    a short conversation or a helper chosen by the participant. When capacity is very limited, one protected
    essential action may be the entire feasible practice. Rehearsal supports planning but does not demonstrate
    caregiving, recovery or a lived transition.
  actions:
  - stable_id: PRACTICE-COMP-2703-SEASONS-AND-CHANGING-EMPHASIS-01-A1
    sequence: 1
    title: Describe the season from observable demands
    instructions: 'Consider building, maintenance, caregiving, recovery, exploration, grief and transition
      as possible descriptions; more than one may fit. Name two present demands, one available support
      and one uncertain duration without disclosing private history. In the supplied case, two additional
      care visits and a changed schedule explain the caregiving emphasis. State what the label does not
      authorize, such as neglecting a dependent, forcing recovery or postponing every valued relationship
      indefinitely.


      Observation checks: The season is grounded in two present demands; Available support and uncertain
      duration are recorded; Multiple or uncertain season descriptions are allowed; The label does not
      excuse neglected duties or forced recovery. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2703-SEASONS-AND-CHANGING-EMPHASIS-01
      action_stable_id: PRACTICE-COMP-2703-SEASONS-AND-CHANGING-EMPHASIS-01-A1
