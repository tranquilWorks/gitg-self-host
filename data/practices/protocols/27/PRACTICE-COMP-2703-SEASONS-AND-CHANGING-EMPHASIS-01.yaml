  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      On October 5 Rowan spends twenty minutes preparing the note; Jules acknowledges receipt that evening.
      Kit confirms the puzzle pause on October 6. Rowan uses the thirty-minute quiet period in week one.
      In week two an unexpected necessary errand uses that planned slot; no replacement quiet period occurs.
      The existing care visits continue, and nobody has agreed to take one over. On October 19 their duration
      remains uncertain. Rowan keeps the puzzle paused with Kit''s agreement and asks about practical
      support; no answer to that new request is supplied.


      One advance and one actual quiet period are established. A second planned protection failed. Receipt
      of the handoff is not replacement care, and the review date is not recovery or a return to the earlier
      workload.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Give this season a boundary and a review


      A season names what is asking more of you now; it does not explain your whole life or prescribe
      when you must recover. Building, maintenance, caregiving, recovery, exploration, grief and transition
      can overlap. A useful description changes a few arrangements while protecting what cannot simply
      wait.


      Use the fictional fortnight below. Allow twenty minutes to prepare, fifteen to examine the later
      record and ten for checks. No personal care details are needed. [OpenLearn on changing priorities,
      S01](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=1) recognizes that work–life
      priorities can change. The seven season descriptions and this particular plan come from the curriculum
      and original exercise, not a diagnosis or a validated timeline.


      Worked example: a person preparing to move pauses an optional reading group, but first tells the
      group and returns its borrowed materials. Calling the period “transition” does not itself release
      the agreement. Nor does a moving date establish when the person will feel settled.


      ### Complete fortnight file: October 5–18


      In the fictional case, Rowan has two additional companion visits for a relative during each of the
      next two weeks. Each visit uses 45 minutes including travel. Necessary care arrangements are already
      established; this task changes no treatment, supervision or clinical duty. Rowan''s regular work
      and essential personal needs remain protected. Available discretionary time was 240 minutes per
      week before these additional visits and is now 150. Their end date is unknown.


      A willing relative, Jules, has agreed to receive a practical handoff note about arrival times and
      the existing contact route. Jules has not agreed to take over a visit. Rowan also co-owns an optional
      puzzle project with Kit, who is willing to pause it if informed by October 6. The project would
      otherwise take sixty minutes weekly. No financial or caregiving dependency relies on it.


      | Disposition | Item and owner | Bounded arrangement |

      | --- | --- | --- |

      | Advance | Rowan: handoff note | 20 minutes once on October 5; Jules checks receipt |

      | Protect | Rowan: existing essential work and care | Retain current arrangements; escalate actual
      gaps appropriately |

      | Protect | Rowan: quiet rest opportunity | 30 minutes weekly already within discretionary time;
      nobody else''s work is assumed |

      | Wait | Rowan and Kit: puzzle project | Ask/confirm pause by October 6; keep unfinished file |


      The week-one new allocation uses ninety minutes for additional visits, twenty for the note and thirty
      for the quiet period. This leaves one hundred of the original 240 minutes unallocated. Unallocated
      time is not proof of spare energy and need not be filled. Week two has no planned note-writing cost,
      so its accounting differs. The review is October 19, with an earlier check if visits, support, safety
      or capacity change.


      ### Make three decisions instead of labeling everything


      1. Write two present demands, the one confirmed support and the uncertain duration. Consider all
      seven season descriptions, then choose caregiving with maintenance as the most useful description
      here. State why “building everything at once” does not fit the supplied capacity, without treating
      other seasons as inferior.

      2. Copy the advance/protect/wait plan with owners and communications. Keep no more than two advance,
      two protect and three optional wait items if adapting it. Distinguish Jules receiving a note from
      Jules covering care. Save the plan before the [later packet](?resource=file-later-packet-md).

      3. Compare both weeks with the plan. Name one carried-out advance, each actual protection and any
      failed protection. At review choose what stays paused, what may resume or what can end with notice.
      The calendar date opens a question; it does not end the season.


      ### Adapt the amount, not the responsibility away


      Use symbols, spoken notes or a chosen helper. With very limited capacity, protecting one essential
      arrangement may be enough; label other areas unreviewed. A harder variation makes the visits sixty
      minutes each in week two. Recalculate discretionary capacity and reassess the optional work before
      adding pressure. Do not borrow another person''s labor without agreement.


      In a later real fortnight, make one advance action and use one feasible protection, keeping actual
      events separate from intentions. A blocked rest period may point to a support problem, not insufficient
      determination. Grief and recovery need no deadline imposed by this exercise, and serious symptoms
      or care disruption call for appropriate timely support. The output is a situated plan and review,
      not proof of successful caregiving or recovery.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
