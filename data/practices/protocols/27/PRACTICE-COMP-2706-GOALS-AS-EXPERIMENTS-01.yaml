  - stable_id: PRACTICE-COMP-2706-GOALS-AS-EXPERIMENTS-01-A3
    sequence: 3
    title: Choose the next commitment from what the trial showed
    instructions: 'At the end date compare the observations with the original assumptions and three decision
      conditions. Choose continue at a stated sustainable level, adapt one feature and retest, or stop
      with any needed notice. Identify which uncertainty the trial could not answer, such as long-term
      interest or performance in public. Preserve the original hypothesis beside the decision instead
      of rewriting it to make every outcome successful.


      Observation checks: The review uses the original assumptions and decision conditions; Continue adapt
      or stop has a specific evidence-based reason; An unresolved long-term or transfer question is retained;
      The original hypothesis is preserved beside the next commitment. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What did the trial teach about fit and feasibility, and what would be the smallest
      justified next commitment?


      Examples: Supportive: Two sessions and a clear explanation fit the week, while the third conflicted
      with care; the person adapted the cadence rather than declaring either total success or failure.


      Mixed: All sessions occurred, but the listener’s main-point check was missing, so learning transfer
      remained uncertain.


      Contradictory: Missed sessions were erased, a stop condition was ignored, or continuing the pursuit
      became necessary to preserve a worthy identity.


