  - stable_id: PRACTICE-COMP-2706-GOALS-AS-EXPERIMENTS-01-A2
    sequence: 2
    title: Run the trial while preserving inconvenient observations
    instructions: 'Complete the three small sessions where feasible, noting actual time, interruptions
      and one thing learned after each. Give the explanation through an accessible channel to a willing
      person, or clearly label a solo rehearsal. Ask the listener only to state the main point, not to
      reassure you that you are talented. Keep missed sessions, confusion, burden and changed circumstances
      visible. Alter a safety condition immediately, but label any other mid-trial design change so the
