meaning_and_fit:
  purpose: Treat a meaningful goal as a time-bounded hypothesis with assumptions, observable learning
    and explicit continue, adapt or stop criteria.
  why_recommended: Treat a meaningful goal as a time-bounded hypothesis with assumptions, observable learning
    and explicit continue, adapt or stop criteria.
  claims:
  - statement: Treat a meaningful goal as a time-bounded hypothesis with assumptions, observable learning
      and explicit continue, adapt or stop criteria.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Goals as experiments practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Goals as experiments as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Shorten sessions, use text or assistive communication, or choose another low-risk
    pursuit with an equally observable small output. A rehearsal cannot establish audience understanding.
    Do not use this trial to self-direct hazardous training, treatment changes or irreversible life decisions.
  opportunity_considerations: Use the supplied pursuit of learning to explain an unfamiliar everyday topic
    clearly. The two-week trial is three short preparation sessions and one explanation to a willing adult
    or a labeled private rehearsal. Materials are a non-sensitive page, a reliable source on the topic
    and the participant’s existing communication tools.
  prerequisites:
  - Use the supplied pursuit of learning to explain an unfamiliar everyday topic clearly. The two-week
    trial is three short preparation sessions and one explanation to a willing adult or a labeled private
    rehearsal. Materials are a non-sensitive page, a reliable source on the topic and the participant’s
    existing communication tools.
  dependencies: []
  safe_alternatives:
  - Shorten sessions, use text or assistive communication, or choose another low-risk pursuit with an
    equally observable small output. A rehearsal cannot establish audience understanding. Do not use this
    trial to self-direct hazardous training, treatment changes or irreversible life decisions.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Goals as experiments differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Goals as experiments as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied pursuit of learning to explain an unfamiliar everyday topic clearly. The two-week
    trial is three short preparation sessions and one explanation to a willing adult or a labeled private
    rehearsal. Materials are a non-sensitive page, a reliable source on the topic and the participant’s
    existing communication tools. Goal: Treat a meaningful goal as a time-bounded hypothesis with assumptions,
    observable learning and explicit continue, adapt or stop criteria. Scope: A short experiment informs
    a pursuit; it does not settle a career, relationship, medical treatment or major financial decision.
    Stopping an unsuitable experiment is not a verdict on personal worth. Time and effort: Twenty minutes
    to design a two-week trial, three 15-minute practice periods and a 15-minute review. Adaptation: Shorten
    sessions, use text or assistive communication, or choose another low-risk pursuit with an equally
    observable small output. A rehearsal cannot establish audience understanding. Do not use this trial
    to self-direct hazardous training, treatment changes or irreversible life decisions. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Shorten sessions, use text or assistive communication, or choose another low-risk
    pursuit with an equally observable small output. A rehearsal cannot establish audience understanding.
    Do not use this trial to self-direct hazardous training, treatment changes or irreversible life decisions.
  expected_burden: Twenty minutes to design a two-week trial, three 15-minute practice periods and a 15-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Goals as experiments protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Goals as experiments action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Shorten sessions,
    use text or assistive communication, or choose another low-risk pursuit with an equally observable
    small output. A rehearsal cannot establish audience understanding. Do not use this trial to self-direct
    hazardous training, treatment changes or irreversible life decisions.
  actions:
  - stable_id: PRACTICE-COMP-2706-GOALS-AS-EXPERIMENTS-01-A1
    sequence: 1
    title: Write the hypothesis and its honest tests
    instructions: 'Before starting, write: I think this pursuit fits my current season because, I expect
      to learn, and this depends on. In the example, test whether three short sessions fit available capacity
      and whether a listener can identify the explanation’s main point. Set a two-week end date, a fixed
      effort limit, one process measure and one learning question. Specify a continue condition, an adaptation
      condition and a stop condition such as repeated conflict with essential duties. Do not make enjoyment
      or flawless performance compulsory.


      Observation checks: The pursuit is expressed as a hypothesis with assumptions; An end date and effort
      limit are fixed beforehand; One process measure and one learning question are observable; Continue
      adapt and stop conditions do not depend on personal worth. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2706-GOALS-AS-EXPERIMENTS-01
      action_stable_id: PRACTICE-COMP-2706-GOALS-AS-EXPERIMENTS-01-A1
