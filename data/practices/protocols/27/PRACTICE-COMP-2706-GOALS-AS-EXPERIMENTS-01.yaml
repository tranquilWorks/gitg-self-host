  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Session 1 lasts fifteen minutes; session 2 lasts twelve. Session 3 is missed because a necessary
      responsibility takes the window. The author does not secretly add a replacement. On day 12 the willing
      reader uses accessible text without classification hints. Fresh card D asks for a headcount reply
      and is placed BLUE. E announces an opening time with no reply and is placed GREEN. F is an exact
      duplicate of D, but the reader puts it BLUE rather than GREY. The author records the duplicate-precedence
      confusion. The check takes five minutes.


      Actual session time is 27 minutes of 45 planned; total named trial work including the check is 32
      minutes. The continue condition is not met. A proposed adaptation is two suitable short sessions
      and clearer precedence wording, to be agreed and retested later. No retest, long-term suitability
      or public performance is supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Test the pursuit without putting your identity on trial


      A goal can become difficult to revise when it stands for who you are supposed to be. An experiment
      asks a smaller question: under these conditions, does a particular way of pursuing it produce something
      useful at a tolerable cost? The original hypothesis needs to survive beside the result so that adaptation
      does not become retrospective self-congratulation.


      Allow twenty minutes to design the supplied trial, fifteen to inspect its later record and ten for
      checks. A live version would include three fifteen-minute sessions over two weeks. [IHI''s Model
      for Improvement, S03](https://www.ihi.org/library/model-for-improvement) describes small tests,
      observation and adaptation. This original educational case applies that limited idea outside clinical
      work; it is not a controlled study or a treatment experiment.


      Worked example: a learner tries early-morning writing and discovers the period regularly collides
      with necessary transport. Moving the session tests a method; it need not mean the learner lacks
      seriousness. Pretending all three planned mornings occurred would prevent useful learning about
      the constraint.


      ### Complete explanation trial E2


      The fictional pursuit is learning to explain an unfamiliar simple filing system. The original hypothesis
      is: “Three fifteen-minute evening sessions will fit my present week and let a willing reader use
      the labels correctly.” The learning question is whether the explanation makes the classification
      rule usable, not whether the reader thinks the author is talented.


      **Complete source card.** A community table uses three temporary trays. BLUE is for a card that
      needs a reply. GREEN is for a card needing no reply but containing information worth keeping for
      this event. GREY is for a duplicate with no new information. Apply the rules in this order: exact
      duplicate first, then reply needed, then keep information. The tray names have no meaning outside
      this invented system. No real records or private messages are used.


      **Practice cards.** A asks “Can you confirm the room?” B says “Doors open at 18:00; no reply needed.”
      C is an exact second copy of B. Correct classifications are A BLUE, B GREEN and C GREY. The lesson
      must explain the precedence rather than simply supply these answers.


      The trial runs November 1–14. Sessions are planned for days 2, 6 and 10, with a maximum of fifteen
      minutes each. A willing adult reader has agreed to one separate five-minute written check on day
      12, with a right to decline. Continue at the same level only if all three sessions fit and the reader
      correctly applies all three rules without instructional prompting. Adapt if access/scheduling or
      a rule remains unclear. Stop or defer if repeated conflict with essential duties makes the trial
      unsuitable. These are local decision conditions, not learning thresholds validated for everyone.


      ### Preserve the comparison


      1. Copy the hypothesis, dates, assumptions, process measure and learning question. Define the effort
      limit separately from the reader check: 45 session minutes plus at most five for the check. Name
      what this tiny trial cannot answer, including long-term interest or public communication skill.

      2. Draft a short explanation from the complete source card. Save it and the decision conditions
      before opening the [later packet](?resource=file-later-packet-md). Record actual sessions and any
      alteration; do not count planned time as exposure to the material.

      3. Apply the prewritten continue/adapt/stop conditions to the observations. Keep confusion and missing
      sessions visible. Choose a bounded next design, not an identity verdict. A solo rehearsal remains
      preparation if the reader declines.


      ### Change one feature without hiding why


      For support, use speech, accessible text or a reader; distinguish an access aid from a hint that
      supplies the classification. A harder case adds a duplicate that itself asks a question. The supplied
      precedence still makes it GREY; explain why. Do not introduce a fourth rule midway and score old
      responses against it silently.


      Later transfer can test one other safe pursuit with its own observable output and effort cap. Major
      career, relationship, financial or medical choices require more evidence and appropriate support
      than a fortnight''s trial. Curiosity, mixed results and stopping all remain legitimate. The result
      is a reasoned next experiment, not a certificate of talent or a duty to continue.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
