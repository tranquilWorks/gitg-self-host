      Observation checks: Actual sessions and interruptions are recorded without invented adherence; A
      willing explanation or labeled solo rehearsal occurs; Feedback concerns the predeclared learning
      question rather than reassurance; Adverse observations and mid-trial changes remain visible. Mark
