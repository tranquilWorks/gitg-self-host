        criteria:
        - each_priority_has_one_scheduled_action_and_fallback
        - a_relevant_environmental_or_resource_arrangement_is_changed
        - shared_arrangements_are_agreed_rather_than_imposed
        - essential_care_and_prior_responsibilities_stay_protected
      - measurement_id: c2701_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
