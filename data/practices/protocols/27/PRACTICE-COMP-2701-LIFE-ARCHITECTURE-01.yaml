  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      On Monday Morgan uses ten minutes to put the existing supplies in the already suitable reachable
      tray. The following ordinary care occasion needs no search; this is one observation, not a clinical
      outcome. On Wednesday Morgan sends the five-minute invitation. No reply arrives during the week,
      so no meeting is reported. On Saturday Morgan clears the accessible half of their own surface in
      twelve minutes and stops at the boundary with shared belongings; moving those remains unagreed.
      The useful half is available for the intended household work.


      Morgan retains the tray, revises the surface plan to ask before any shared rearrangement and removes
      a redundant daily color-coded priority chart. Necessary care is not removed. Actual recorded action
      time is 27 minutes, compared with 35 planned; the unspent eight minutes are not a productivity score.
      There is no evidence of how all other weekly time was used, and no tokens were spent.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make a priority visible in an ordinary week


      A value becomes easier to live when its ordinary arrangements support it. A calendar entry alone
      may fail if the materials are unreachable, a shared role is unagreed or the same money has been
      allocated twice. Life architecture connects those arrangements without treating a person as a project
      to optimize.


      Use the complete fictional week below. Allow twenty-five minutes to design three changes, fifteen
      to compare the later week and ten for checks. No private calendar, financial account or health detail
      is required. [OpenLearn''s wider work–life balance discussion, S09](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=3.5)
      includes personal, relationship, community and future commitments. The six-area map here is original
      synthesis, not a validated scale or a promise that planning removes structural barriers.


      Worked example: a person values reading but stores their borrowed book beneath a heavy stack and
      schedules it during a care duty. Moving the book to a reachable place helps; relabeling the care
      duty as distraction does not. A suitable ten-minute opening after the duty may express the value
      better than a perfect hour that cannot occur.


      ### Morgan''s three priorities and actual last week


      Morgan chooses reliable existing care, welcome friendship and a usable household work surface. Work
      and essential care are already protected. The following windows are additional, genuinely discretionary
      capacity in this fictional week, not reclaimed sleep or someone else''s labor.


      | Window | Minutes available | Proposed action | Minutes planned |

      | --- | ---: | --- | ---: |

      | Monday 18:00–18:15 | 15 | Place existing care supplies where used | 10 |

      | Wednesday 19:00–19:20 | 20 | Send a specific welcome invitation | 5 |

      | Saturday 10:00–10:30 | 30 | Clear Morgan''s own work surface | 20 |


      Last Monday supplies were difficult to reach and Morgan spent twelve minutes finding them; necessary
      care still occurred. On Wednesday Morgan thought about contacting a friend but sent nothing. On
      Saturday the surface remained covered because Morgan had assumed a housemate would remove shared
      items. The housemate had never agreed.


      Morgan has two existing storage trays and 12 fictional resource tokens for discretionary use; essential
      costs are already protected. No purchase is necessary, and the proposed actions cost zero tokens.
      Care supplies may move only to an already suitable location within Morgan''s existing care arrangement.
      Do not change treatment or discard materials. Morgan''s own surface can be cleared without moving
      the housemate''s possessions. The friend previously welcomed occasional invitations, but has not
      agreed to a meeting this week.


      Map each priority across six areas: calendar, environment, resources, relationships, roles and recurring
      practice. For care: the Monday opening; suitable reachable supplies; existing tray with no purchase;
      an agreed help route if needed; Morgan''s existing role; and a brief ordinary readiness check. For
      friendship, the environment may simply be a reachable contact method rather than furniture. Resources
      can mean time and access, not spending. Mark an irrelevant area honestly rather than inventing a
      duty.


      ### Design arrangements that other people have actually agreed to


      1. Make one six-area card for each priority. Compare it with last week''s facts and identify a mismatch.
      Keep the missing housemate agreement visible; do not translate it into Morgan''s laziness or the
      housemate''s failure.

      2. Put one small action in each supplied window with a cue and fallback. Suggested cues are finishing
      the ordinary evening routine, opening the contact list and beginning the Saturday household period.
      Fallbacks may be arranging appropriate help, sending a shorter invitation or clearing only the accessible
      half of Morgan''s surface. A fallback must still be useful and respect ownership.

      3. Save the cards before the [later packet](?resource=file-later-packet-md). Classify each actual
      result as happened, adapted, deferred or blocked. Compare the lived week with the original priorities,
      not merely with how tidy the plan looks. Retain one useful arrangement, revise one mismatch and
      remove one unnecessary planning demand.


      ### Leave room for a life beyond the plan


      Use spoken notes, a reader or three paper cards. No app entry, diagnosis, bank information or shared-role
      assignment is needed. For a harder variation, the Monday window disappears because care takes longer.
      Protect care, then reschedule or seek suitable support; do not mark the setup action completed because
      its purpose was good.


      Later transfer is one ordinary week with three genuinely chosen priorities and a minimal actual
      record. A support person can clarify arrangements without choosing values on your behalf. A sent
      invitation is an action, not proof of friendship quality; an accessible surface is an environmental
      change, not a new identity. Calendar coherence cannot establish mastery or worth. The practical
      question is whether a particular arrangement helped a priority survive real constraints.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt these before opening [answers](?check=practice-answers).


      1. A weekly plan assigns a housemate to move shared belongings without asking. Does a neat calendar
      establish a workable arrangement?


      2. A person spends 10, 5 and 12 minutes on the three actions instead of planned 10, 5 and 20. What
      is the difference, and does it show all three priorities are achieved?


      3. An invitation is sent and receives no reply. May the review report a completed meeting or failed
      friendship?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. The role is unagreed. Limit changes to authorized possessions or ask and preserve the pending
      answer. Correct the arrangement rather than scoring the housemate as unreliable.


      2. 27 actual versus 35 planned, eight fewer minutes. Time alone establishes neither quality nor
      broad priority achievement; the surface was adapted and the meeting remains unconfirmed. Correct
      an efficiency claim by inspecting actual effects and limits.


      3. Neither. Sending is established; reply and meeting are unknown/unperformed. Keep the invitation
      welcome and avoid pressure, then review an appropriate next step separately. No relationship verdict
      follows.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
