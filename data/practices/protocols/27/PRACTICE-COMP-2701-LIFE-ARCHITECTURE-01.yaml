meaning_and_fit:
  purpose: Translate three endorsed priorities into a workable week through time, surroundings, spending
    choices, relationships, roles and recurring action.
  why_recommended: Translate three endorsed priorities into a workable week through time, surroundings,
    spending choices, relationships, roles and recurring action.
  claims:
  - statement: Translate three endorsed priorities into a workable week through time, surroundings, spending
      choices, relationships, roles and recurring action.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Life architecture practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Life architecture as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a paper strip, audio notes, tactile cards or a trusted planning aid. Reduce
    each action to a genuinely useful accessible version without substituting intentions for action. A
    fictional week tests planning only. Do not enter sensitive calendar, financial or health details into
    the application.
  opportunity_considerations: Use a private weekly calendar and three cards. The supplied example is keep
    needed care reliable, give a friend welcome attention, and finish one useful household task. Put one
    priority on each card. Use only resources already available; no purchase, financial-account access
    or major life change is required.
  prerequisites:
  - Use a private weekly calendar and three cards. The supplied example is keep needed care reliable,
    give a friend welcome attention, and finish one useful household task. Put one priority on each card.
    Use only resources already available; no purchase, financial-account access or major life change is
    required.
  dependencies: []
  safe_alternatives:
  - Use a paper strip, audio notes, tactile cards or a trusted planning aid. Reduce each action to a genuinely
    useful accessible version without substituting intentions for action. A fictional week tests planning
    only. Do not enter sensitive calendar, financial or health details into the application.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Life architecture differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Life architecture as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private weekly calendar and three cards. The supplied example is keep needed care reliable,
    give a friend welcome attention, and finish one useful household task. Put one priority on each card.
    Use only resources already available; no purchase, financial-account access or major life change is
    required. Goal: Translate three endorsed priorities into a workable week through time, surroundings,
    spending choices, relationships, roles and recurring action. Scope: This redesigns one ordinary week,
    not an ideal life blueprint. Necessary care, existing obligations, access needs and resource limits
    constrain the plan; a tidy calendar is not evidence that the week was lived. Time and effort: Twenty
    minutes to prepare, three small actions within seven days and a 15-minute comparison after the week.
    Adaptation: Use a paper strip, audio notes, tactile cards or a trusted planning aid. Reduce each action
    to a genuinely useful accessible version without substituting intentions for action. A fictional week
    tests planning only. Do not enter sensitive calendar, financial or health details into the application.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a paper strip, audio notes, tactile cards or a trusted planning aid. Reduce
    each action to a genuinely useful accessible version without substituting intentions for action. A
    fictional week tests planning only. Do not enter sensitive calendar, financial or health details into
    the application.
  expected_burden: Twenty minutes to prepare, three small actions within seven days and a 15-minute comparison
    after the week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Life architecture protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Life architecture action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a paper
    strip, audio notes, tactile cards or a trusted planning aid. Reduce each action to a genuinely useful
    accessible version without substituting intentions for action. A fictional week tests planning only.
    Do not enter sensitive calendar, financial or health details into the application.
  actions:
  - stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01-A1
    sequence: 1
    title: Find the missing everyday expression
    instructions: 'For each priority, name one visible expression in each of six places: calendar, physical
      or digital environment, money or resource use, relationships, current roles and recurring practice.
      Mark genuinely irrelevant places rather than inventing obligations. In the example, care has an
      appointment or routine, reachable materials, protected existing resources and an agreed help route.
      Contrast these expressions with what actually happened last week; identify one mismatch per card,
      including a structural barrier rather than blaming motivation.


      Observation checks: All three priorities have concrete everyday expressions; The six life areas
      receive relevant or not-applicable dispositions; Last week supplies an actual comparison rather
      than an idealized schedule; A resource or access barrier remains visible where present. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01
      action_stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01-A1
      competency_stable_id: '27.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2701_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2701_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_three_priorities_have_concrete_everyday_expressions
        - the_six_life_areas_receive_relevant_or_not_applicable_dispositions
        - last_week_supplies_an_actual_comparison_rather_than_an_idealized_schedule
        - a_resource_or_access_barrier_remains_visible_where_present
      - measurement_id: c2701_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
