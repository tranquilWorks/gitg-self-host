  - stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01-A2
    sequence: 2
    title: Install a small arrangement for each priority
    instructions: 'Choose one feasible action per card and put it in the next seven days with a cue and
      a modest fallback. For the supplied example, prepare existing care materials, send a welcome invitation
      with a specific time, and clear one needed household surface. Adjust the surrounding layout or existing
      resource allocation to make each action possible. Confirm any shared arrangement with the affected
      person; do not spend shared money, cancel care or assign someone a role without agreement.


      Observation checks: Each priority has one scheduled action and fallback; A relevant environmental
      or resource arrangement is changed; Shared arrangements are agreed rather than imposed; Essential
      care and prior responsibilities stay protected. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01
      action_stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01-A2
      competency_stable_id: '27.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2701_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2701_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
