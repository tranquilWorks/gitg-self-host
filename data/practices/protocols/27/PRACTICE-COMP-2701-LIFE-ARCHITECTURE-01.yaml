        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2701-LIFE-ARCHITECTURE-01-A3
    sequence: 3
    title: Compare the lived week with its design
    instructions: 'Carry out the three actions when suitable and record happened, adapted, deferred or
      blocked after each. At the end of the week compare the actual time, arrangement and effect with
      the original cards. Keep one effective arrangement, revise one mismatch and remove one unnecessary
      planning demand. An unanswered invitation remains an invitation, not a relationship outcome; a blocked
      care arrangement calls for appropriate support rather than a favorable completion story.


      Observation checks: Actual actions and blocked opportunities are distinguished; The review compares
      the lived week with the three priorities; One effective arrangement and one needed revision are
      identified; An unnecessary planning burden is removed without deleting a duty. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which priority became easier to live because the week changed, and which mismatch
      needs a different arrangement rather than greater effort?


      Examples: Supportive: The person placed care materials where used, made a welcome invitation and
      completed the selected household task, then retained two arrangements and revised the third.


      Mixed: The plan fit available time, but a shared arrangement was never confirmed and one action
      remained blocked.


      Contradictory: The calendar was made to look coherent by removing essential care, spending another
      person’s money or reporting unperformed actions as completed.


      Inconclusive: Three values were named without changing an arrangement or comparing an actual week.'
    expected_time: 15-25 minutes
    due_within_days: 10
