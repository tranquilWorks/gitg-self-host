  - stable_id: PRACTICE-COMP-2705-PERSONAL-OPERATING-REVIEWS-01-A2
    sequence: 2
    title: Make the three decisions operational
    instructions: 'Complete the small overdue action now or at a specific time within the next week. Put
      the upcoming commitment in the planning method actually used, with a cue and necessary materials.
      Remove or defer the optional demand, notifying anyone who relied on it and preserving any agreed
      handoff. For the default, submit the ordinary form through its established route, answer the willing
      contact and pause the elective project; do not count deleting a task as fulfilling its original
      promise.


      Observation checks: The overdue item becomes a real action with a near date; The upcoming commitment
      has a usable cue and materials; The optional demand is removed with any necessary notice or handoff;
      Removing a task is not reported as completing the promised work. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
