meaning_and_fit:
  purpose: Review major life areas at a sustainable interval and turn the review into one completed action,
    one scheduled commitment and one responsibly removed demand.
  why_recommended: Review major life areas at a sustainable interval and turn the review into one completed
    action, one scheduled commitment and one responsibly removed demand.
  claims:
  - statement: Review major life areas at a sustainable interval and turn the review into one completed
      action, one scheduled commitment and one responsibly removed demand.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Personal operating reviews practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Personal operating reviews as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a voice checklist, accessible reminder or a ten-minute supported conversation.
    During constrained periods scan only urgent safety and binding obligations, labeling the rest unreviewed
    rather than satisfactory. A synthetic page tests review mechanics but not actual follow-through.
  opportunity_considerations: 'Use a private page with eight headings: commitments, health, relationships,
    money, learning, work, service and direction. Under each permit only stable, needs action, not applicable
    or uncertain, followed by at most one note. The supplied default is a missed routine administrative
    task, an unanswered welcome message and an optional learning project that no longer fits.'
  prerequisites:
  - 'Use a private page with eight headings: commitments, health, relationships, money, learning, work,
    service and direction. Under each permit only stable, needs action, not applicable or uncertain, followed
    by at most one note. The supplied default is a missed routine administrative task, an unanswered welcome
    message and an optional learning project that no longer fits.'
  dependencies: []
  safe_alternatives:
  - Use a voice checklist, accessible reminder or a ten-minute supported conversation. During constrained
    periods scan only urgent safety and binding obligations, labeling the rest unreviewed rather than
    satisfactory. A synthetic page tests review mechanics but not actual follow-through.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Personal operating reviews differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Personal operating reviews
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page with eight headings: commitments, health, relationships, money, learning,
    work, service and direction. Under each permit only stable, needs action, not applicable or uncertain,
    followed by at most one note. The supplied default is a missed routine administrative task, an unanswered
    welcome message and an optional learning project that no longer fits. Goal: Review major life areas
    at a sustainable interval and turn the review into one completed action, one scheduled commitment
    and one responsibly removed demand. Scope: This is a practical coordination review, not a comprehensive
    health, financial or relationship assessment. It should reduce forgotten obligations rather than create
    a new administrative burden. Time and effort: Two 15-minute weekly reviews and one small action between
    them. Adaptation: Use a voice checklist, accessible reminder or a ten-minute supported conversation.
    During constrained periods scan only urgent safety and binding obligations, labeling the rest unreviewed
    rather than satisfactory. A synthetic page tests review mechanics but not actual follow-through. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a voice checklist, accessible reminder or a ten-minute supported conversation.
    During constrained periods scan only urgent safety and binding obligations, labeling the rest unreviewed
    rather than satisfactory. A synthetic page tests review mechanics but not actual follow-through.
  expected_burden: Two 15-minute weekly reviews and one small action between them.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Personal operating reviews protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Personal operating reviews action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a voice
    checklist, accessible reminder or a ten-minute supported conversation. During constrained periods
    scan only urgent safety and binding obligations, labeling the rest unreviewed rather than satisfactory.
    A synthetic page tests review mechanics but not actual follow-through.
  actions:
  - stable_id: PRACTICE-COMP-2705-PERSONAL-OPERATING-REVIEWS-01-A1
    sequence: 1
    title: Scan for decisions rather than narrate the week
    instructions: 'Give each heading an honest disposition based on available records or firsthand observation.
      Do not pull private account, medical or other people’s data into the application. Identify one overdue
      action, one upcoming commitment and one optional demand to stop or defer. Distinguish a matter needing
      qualified help from an ordinary task; the review is not permission to reinterpret a treatment plan,
      contract or shared agreement.


      Observation checks: All eight areas receive a bounded disposition; Available evidence is distinguished
      from uncertainty; One action one commitment and one removable demand are identified; Qualified or
      shared decisions remain outside unilateral review authority. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2705-PERSONAL-OPERATING-REVIEWS-01
      action_stable_id: PRACTICE-COMP-2705-PERSONAL-OPERATING-REVIEWS-01-A1
      competency_stable_id: '27.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2705_a1_primary
      transfer_disposition: context_bound
