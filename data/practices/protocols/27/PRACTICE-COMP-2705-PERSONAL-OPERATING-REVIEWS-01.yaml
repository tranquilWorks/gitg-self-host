  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [OpenLearn — Changing priorities: the ABC model](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=1)

      - [NASA — Technical Assessment](https://www.nasa.gov/reference/6-7-technical-assessment/)

      - [IHI — Model for Improvement](https://www.ihi.org/library/model-for-improvement)

      - [CDC — How to Use the Index](https://www.cdc.gov/ccindex/tool/how-to-use.html)

      - [W3C WAI — Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [University of Edinburgh — What? So what? Now what?](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      The first review actually takes fifteen minutes. Ari submits the club form at 18:08 and sees a receipt;
      the missed original deadline remains recorded. Ari accepts the invitation, receives confirmation
      and schedules the call. The solo reading challenge is removed. On October 10 the ten-minute call
      occurs. At the October 13 review, Ari spends twelve minutes checking these outcomes. The transport
      cost is still unconfirmed, so Ari sends one question through the established provider contact route;
      no reply is supplied.


      Two reviews total 27 minutes. The form was late but accepted; the call was performed; the optional
      challenge had no external reliance. The unresolved cost is neither a hidden failure of every heading
      nor a reason to invent a number.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let the review end in fewer loose ends


      A review is useful when it changes what happens next. It is easy to spend the whole period rearranging
      a task list and leave every commitment untouched. The purpose is a modest decision cycle: notice
      a real loose end, choose a proportionate action, schedule something that needs remembering and release
      one genuinely optional demand.


      Use the complete fictional review file. Allow two fifteen-minute reviews one week apart in a live
      route; for the supplied case, allow twenty minutes to inspect both records and ten for checks. [NASA''s
      technical-assessment discussion, S02](https://www.nasa.gov/reference/6-7-technical-assessment/)
      distinguishes reported status from analysis that informs corrective decisions. The application here
      is an analogy to personal coordination, not a NASA-approved life assessment.


      Worked example: a person marks an overdue form “urgent” at three consecutive reviews but never opens
      its normal submission route. A five-minute submission with receipt changes the situation; a brighter
      label does not. Conversely, deleting the form would remove a reminder, not fulfill the obligation.


      ### Review one: October 6, 18:00–18:15


      Ari uses eight headings and only the supplied ordinary records. The file contains no clinical findings,
      account credentials or other people''s private data.


      | Heading | Disposition | Available fact |

      | --- | --- | --- |

      | Commitments | Needs action | An ordinary club form was due October 5; standard late submission
      is still accepted |

      | Health | Stable for coordination only | Existing care appointments remain scheduled; no clinical
      status inferred |

      | Relationships | Needs action | A welcome invitation awaits a reply by October 9 |

      | Money | Uncertain | October transport cost is not yet confirmed; no purchase needed now |

      | Learning | Needs action | An optional solo reading challenge no longer fits |

      | Work | Stable | Next agreed deadline is already in the work calendar |

      | Service | Not applicable now | No current service promise or dependent task is supplied |

      | Direction | Stable | Keep existing care and ordinary work reliable this week |


      The club form takes five minutes and has a standard receipt screen. The invitation requires a two-minute
      response and proposes a welcome ten-minute call October 10 at 19:00. Ari may accept or decline;
      do not infer a meeting from the incoming invitation. The reading challenge is solo, free and carries
      no promise to another person. Removing it does not require inventing a cancellation agreement.


      Within the first fifteen minutes, use three to scan, five to submit the form, two to reply, two
      to schedule any accepted call with a reminder, one to remove the optional challenge and two to close
      the review. If a task takes longer, preserve the limit by scheduling it honestly; do not fill a
      late form with guesses to meet the timer. The uncertain transport cost belongs in an information
      request, not an invented satisfactory result.


      ### Close the loop next week


      1. Give all eight headings a disposition using only available facts. State what “stable” means here:
      no new coordination issue identified, not a comprehensive health or financial clearance. Select
      the overdue form, the invitation and the optional challenge as the concrete decisions.

      2. Save the first review and inspect the [later packet](?resource=file-later-packet-md). Distinguish
      submitted, acknowledged, scheduled, performed and removed. Check whether anyone actually relied
      on the released item.

      3. At the second review, compare those decisions with outcomes and the review''s actual burden.
      Keep an unresolved cost question open and choose no more than one next information action. Simplify
      the format if the administration crowds out the activity it was meant to support.


      ### Sustainable does not mean every heading is always green


      A voice checklist, accessible reminder or supported conversation is suitable. During a constrained
      period, scan urgent safety and binding duties first; label omitted areas unreviewed rather than
      stable. For a harder case, the supposedly solo challenge includes a promised reading-group summary.
      Pause only after an appropriate notice or handoff; deleting its reminder is not release from reliance.


      At a later real weekly review, use minimal private information, one performed action and one subsequent
      check. Qualified questions stay with the relevant professional or process. The useful evidence is
      an actual decision and follow-through with a manageable review burden, not eight optimistic labels
      or a newly elaborate personal dashboard.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt these before opening [answers](?check=practice-answers).


      1. Two reviews take 15 and 12 minutes. A ten-minute call occurs between them. What is review time,
      and is the call included?


      2. A care heading is marked stable because appointments are scheduled. Does that establish good
      health?


      3. Deleting a task that someone else relied on makes a list shorter. What is still needed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. Review time is 27 minutes; the separate call makes 37 minutes for those named activities together.
      Keep categories distinct and do not count review-contained tasks twice.


      2. No. It is a coordination status, not clinical evidence. Preserve any actual concern for appropriate
      care and avoid upgrading calendar information into a health conclusion.


      3. Appropriate notice, renegotiation or accepted handoff is still needed. The original obligation
      is not performed by deletion. Correct the release status rather than crediting a cleaner list.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
