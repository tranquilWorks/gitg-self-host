meaning_and_fit:
  purpose: Distinguish broad responsibilities from optional life roles and make an informed, non-deficit
    decision about one role that is not currently held.
  why_recommended: Distinguish broad responsibilities from optional life roles and make an informed, non-deficit
    decision about one role that is not currently held.
  claims:
  - statement: Distinguish broad responsibilities from optional life roles and make an informed, non-deficit
      decision about one role that is not currently held.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Applicability, role choice, and the right to leave
    domains unchosen practice fit the person's current role, pathway, capacity, authority, resources,
    and safety conditions?
  not_applicable_behavior: Record Applicability, role choice, and the right to leave domains unchosen
    as not applicable, consciously unchosen, or deferred without penalty when the role, pathway, capacity,
    authority, opportunity, or safe context is absent.
  readiness_considerations: Use culturally appropriate role names and a private verbal reflection. A role
    may be revisited without shame, and an inaccessible path need not become a permanent identity declaration.
    Seek appropriate support when coercion, dependence or legal responsibility makes a role decision unsafe
    or consequential.
  opportunity_considerations: Use five cards labeled marriage, parenthood, leadership, entrepreneurship
    and a particular religious pathway. For each allow held, actively exploring, consciously unchosen
    or not relevant now. The supplied example is someone who values contribution but does not want to
    start a business; the exercise requires no major life decision or public disclosure.
  prerequisites:
  - Use five cards labeled marriage, parenthood, leadership, entrepreneurship and a particular religious
    pathway. For each allow held, actively exploring, consciously unchosen or not relevant now. The supplied
    example is someone who values contribution but does not want to start a business; the exercise requires
    no major life decision or public disclosure.
  dependencies: []
  safe_alternatives:
  - Use culturally appropriate role names and a private verbal reflection. A role may be revisited without
    shame, and an inaccessible path need not become a permanent identity declaration. Seek appropriate
    support when coercion, dependence or legal responsibility makes a role decision unsafe or consequential.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Applicability, role choice, and the right to leave domains unchosen differently while preserving consent,
    evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Applicability, role choice,
    and the right to leave domains unchosen as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use five cards labeled marriage, parenthood, leadership, entrepreneurship and a particular religious
    pathway. For each allow held, actively exploring, consciously unchosen or not relevant now. The supplied
    example is someone who values contribution but does not want to start a business; the exercise requires
    no major life decision or public disclosure. Goal: Distinguish broad responsibilities from optional
    life roles and make an informed, non-deficit decision about one role that is not currently held. Scope:
    Not applicable is not a defect. Declining marriage, parenthood, leadership, entrepreneurship or a
    particular religion does not erase obligations already created by a dependent, agreement, law or freely
    held role. Time and effort: Twenty minutes to distinguish responsibilities and roles, one low-stakes
    clarification and a 10-minute review. Adaptation: Use culturally appropriate role names and a private
    verbal reflection. A role may be revisited without shame, and an inaccessible path need not become
    a permanent identity declaration. Seek appropriate support when coercion, dependence or legal responsibility
    makes a role decision unsafe or consequential. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use culturally appropriate role names and a private verbal reflection. A role may
    be revisited without shame, and an inaccessible path need not become a permanent identity declaration.
    Seek appropriate support when coercion, dependence or legal responsibility makes a role decision unsafe
    or consequential.
  expected_burden: Twenty minutes to distinguish responsibilities and roles, one low-stakes clarification
    and a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Applicability, role choice, and the right to leave domains unchosen protocol to rank worth,
    coerce participation, demand disclosure, override rest or care, certify competence, or justify decisions
    beyond the recorded context.
  - Treating a completed Applicability, role choice, and the right to leave domains unchosen action, a
    polished artifact, agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use culturally
    appropriate role names and a private verbal reflection. A role may be revisited without shame, and
    an inaccessible path need not become a permanent identity declaration. Seek appropriate support when
    coercion, dependence or legal responsibility makes a role decision unsafe or consequential.
  actions:
  - stable_id: PRACTICE-COMP-2713-APPLICABILITY-ROLE-CHOICE-AND-THE-RIGHT-TO-LEAVE-DOMAINS-UNCHOSEN-01-A1
    sequence: 1
    title: Separate the human good from one optional vehicle
    instructions: 'Give the five cards current dispositions without treating a blank role as a missing
      achievement. For one unheld role, name the underlying goods it might serve and at least two other
      legitimate ways to serve them. In the example, useful work, generosity and responsibility may be
      expressed through employment, craft or community contribution without business ownership. Separately
      list any existing duty that the role decision cannot cancel, such as an agreed handoff or a dependent’s
      care.


      Observation checks: All five optional roles receive non-deficit dispositions; One role is separated
      from the goods it may serve; Two legitimate alternative expressions are named; Existing responsibilities
      that cannot be canceled remain explicit. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
