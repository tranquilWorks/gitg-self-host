  - stable_id: PRACTICE-COMP-2713-APPLICABILITY-ROLE-CHOICE-AND-THE-RIGHT-TO-LEAVE-DOMAINS-UNCHOSEN-01-A3
    sequence: 3
    title: Check for pressure and hidden abandonment
    instructions: 'Review the changed plan. Ask whether the decision came from an endorsed preference,
      a real constraint, coercion or an assumption that only one kind of life counts. Keep uncertainty
      or exploration where honest. Check that no held-role obligation was silently abandoned and that
      the alternative still serves the intended good. Record the disposition for personal planning only;
      do not fabricate a lower competency score or mark an unperformed role task completed.


      Observation checks: Preference constraint coercion and uncertainty are distinguished; Held-role
      obligations remain intact; The alternative is checked against the intended good; Not applicable
      is neither a deficit score nor a completed task. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Which good matters independently of this role, and how can the chosen path honor it
      without pretending an existing duty disappeared?


      Examples: Supportive: The person declined an optional entrepreneurship path, retained a concrete
      community contribution and kept an existing shared responsibility visible.


      Mixed: The role remained under exploration, so the person deferred the optional course rather than
      declaring a permanent identity.


      Contradictory: Not applicable was used to abandon a dependent or a held responsibility, or an unchosen
      role was treated as evidence of lesser worth.


      Inconclusive: Role cards were labeled without distinguishing underlying goods, existing duties or
      an actual planning choice.'
    expected_time: 15-25 minutes
