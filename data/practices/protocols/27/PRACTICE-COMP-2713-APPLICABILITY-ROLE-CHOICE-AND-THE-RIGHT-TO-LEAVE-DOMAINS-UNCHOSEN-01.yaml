  - stable_id: PRACTICE-COMP-2713-APPLICABILITY-ROLE-CHOICE-AND-THE-RIGHT-TO-LEAVE-DOMAINS-UNCHOSEN-01-A2
    sequence: 2
    title: Clarify the choice without turning it into a defense trial
    instructions: 'Write a short provisional statement: I am not choosing this role now; I intend to serve
      these goods through this alternative; I will reconsider if this condition changes. Test it against
      one real planning decision, such as removing an unwanted business-starting course from an optional
      study plan while keeping a chosen contribution. Discuss only what needs coordination with a willing
      affected person; nobody is owed intimate reasons merely to approve your life path.


      Observation checks: A provisional role choice names an alternative and reconsideration condition;
      One actual optional planning decision follows from the choice; A chosen contribution or responsibility
      remains present; Coordination is separated from compelled personal disclosure. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
