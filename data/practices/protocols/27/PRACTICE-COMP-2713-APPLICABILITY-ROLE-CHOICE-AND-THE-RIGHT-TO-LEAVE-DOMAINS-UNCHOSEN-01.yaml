  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Avery removes the optional workshop from the calendar before registering and does not pay or attend.
      Avery keeps the employee work agreement and gives the promised ten-minute team briefing on its agreed
      date. Formal leadership remains under exploration; giving the briefing is not acceptance of a leadership
      title.


      Avery privately records that declining the workshop expresses an endorsed preference rather than
      a scheduling barrier in this supplied case. An acquaintance still calls the choice unambitious.
      No change in that person''s attitude is supplied, and no confrontation is required. The cards do
      not change runtime applicability, completion or scoring. Avery''s future preferences remain open
      without a required conversion to any role.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Choose roles without ranking lives


      Some responsibilities arise from being human in relationship with others; particular life roles
      are often optional. Marriage, parenthood, leadership, entrepreneurship and a particular religious
      practice are not a universal checklist. A person may be exploring, may consciously decline or may
      find a role irrelevant to the present decision without becoming deficient. At the same time, an
      existing dependent, an agreement or a legal duty cannot be made to disappear by changing a label.


      Allow twenty minutes for the supplied fictional choice and five for a later planning check. The
      normative distinction comes from the canonical competency, not from a legal opinion or a personality
      test. Edinburgh''s reflection sequence [S06](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      supports examining a decision and naming a next action; it does not validate which life path someone
      ought to choose. No disclosure of intimate reasons, health information, family conflict or religious
      belief is required.


      ### Five role cards and one real decision


      Avery''s supplied cards read:


      | Optional role | Current disposition | Existing responsibility relevant here |

      | --- | --- | --- |

      | Marriage | Consciously unchosen at present | No spouse or marriage agreement is supplied. |

      | Parenthood | Not relevant to this planning decision | No child or dependent is supplied. |

      | Formal leadership | Exploring | Avery has promised one ten-minute team briefing, regardless of
      future title. |

      | Entrepreneurship | Consciously declined | Avery still owes ordinary agreed work as an employee.
      |

      | A particular religious practice | Not chosen | Other people''s freedom and dignity remain relevant;
      no belief declaration is required. |


      “Unchosen” can be stable or revisable; “exploring” is not a promise to accept. These are Avery''s
      supplied dispositions, not defaults for the learner. If a learner already holds a role, record “held”
      and identify its actual responsibilities rather than automatically using Avery''s card.


      The immediate planning choice is whether to enroll in a voluntary start-a-business workshop. It
      costs two free Saturday mornings; nobody has paid for Avery, and there is no commitment or dependency
      on attendance. Avery does not want to start a business. The goods Avery does endorse are useful
      work, generosity and responsible contribution. Employment, craft and freely chosen community activity
      can express these goods without entrepreneurship. This equivalence concerns the underlying goods,
      not every practical function or legal consequence of a business.


      A worked private statement is: “I am declining entrepreneurship at present. I will keep my agreed
      work and the ten-minute briefing. I do not need the workshop to prove initiative.” It is deliberately
      brief. A person may choose not to give this statement to anyone. If someone pressures Avery, the
      safe response can be a private planning change; confrontation is not required.


      ### Make the choice visible in a plan


      1. Read each card and separate the optional role from duties already arising from actual circumstances.
      Mark held, exploring, consciously unchosen or not relevant; include unknown when facts are insufficient.
      Do not infer a child''s needs, legal duties or freedom to withdraw from silence in a real case.

      2. For the workshop choice, name the good underneath the role and two possible expressions that
      do not require it. Check whether declining is an endorsed preference, a current constraint, uncertainty
      or pressure. Those distinctions can matter without making any answer a moral score. Choose one feasible
      next planning action.

      3. Save the role statement and proposed calendar change before the [later packet](?resource=file-later-packet-md).
      Compare the actual decision with the statement. Keep the briefing and work obligations visible;
      declining a title does not cancel an existing promise. Leave a review point only if Avery wants
      one, rather than periodically testing whether Avery has adopted the socially expected path.


      ### Applicability is not an escape clause or a deficit label


      For support, work with the supplied cards without personal disclosure, use a trusted interpreter
      or write only “not chosen.” Without enough facts, leave a role undecided. For a harder case, someone
      wants to decline parenthood while already responsible for a dependent: separate future role preference
      from current care duties and seek appropriate local guidance where needed. This guide supplies no
      legal determination.


      Later, apply the same distinction to a different optional role such as committee chair. An honest
      choice may be yes, no, exploration or no decision. A good outcome is a plan consistent with endorsed
      commitments and actual obligations, not convergence on Avery''s life. Calling a role “chosen” does
      not by itself establish freedom from coercion.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. Someone declines future leadership but already promised a team briefing. Does the optional-role
      label cancel the briefing?


      2. A person cannot attend a workshop because of a time constraint. Does that alone show they have
      consciously rejected entrepreneurship?


      3. A learner leaves marriage unchosen. Must they provide intimate reasons or perform an equivalent
      marriage task to avoid a deficit?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Separate the optional future role from the existing agreement. Keep, renegotiate or appropriately
      repair the briefing commitment; changing a role label does not erase it.


      2. No. A constraint and an endorsed preference are different. Record what is known and leave the
      role undecided if necessary; do not interpret nonattendance as rejection or lack of ambition.


      3. No. The role can remain unchosen without intimate justification or a substitute role performance.
      Actual responsibilities still matter, but the optional choice itself is not a moral deficit or a
      reason to alter scores.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
