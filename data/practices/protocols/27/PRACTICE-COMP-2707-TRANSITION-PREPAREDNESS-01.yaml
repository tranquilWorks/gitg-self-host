  - stable_id: PRACTICE-COMP-2707-TRANSITION-PREPAREDNESS-01-A2
    sequence: 2
    title: Verify one dependency and rehearse the first day
    instructions: 'Through an established legitimate channel, confirm one important arrangement rather
      than assuming it exists: for the default, check the revised transport or agreed care coverage. Then
      walk through the first day on paper from waking to the final necessary responsibility. Add one fallback
      for an unavailable service and one support conversation or small closing ritual for what is changing.
      A rehearsal does not count as a confirmed service, and an unconfirmed dependency remains visibly
      open.


      Observation checks: One arrangement is actually verified or remains explicitly unconfirmed; The
      first-day rehearsal includes essential responsibilities; An unavailable service has a realistic
      fallback or escalation need; Emotional support or a closing ritual is prepared without compulsory
      disclosure. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
