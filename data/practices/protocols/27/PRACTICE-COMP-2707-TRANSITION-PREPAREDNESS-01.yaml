  - stable_id: PRACTICE-COMP-2707-TRANSITION-PREPAREDNESS-01-A3
    sequence: 3
    title: Review readiness without giving yourself clearance
    instructions: 'Compare the first-day rehearsal with the verified information. Mark dependencies ready,
      awaiting confirmation or needing qualified help, and carry out one safe preparatory action such
      as placing needed existing materials together or sending the agreed schedule. Set a check before
      the transition and another after it begins. Name what cannot be known until the change is lived;
      do not mark parenting, relocation, recovery or bereavement competence from a preparation page.


      Observation checks: Readiness states distinguish verified information from open dependencies; One
      safe preparatory action actually occurs; Checks before and after the transition are arranged; Preparation
      does not become a claim of completed transition or competence. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which dependency was more uncertain than it first appeared, and what practical or
      emotional support must remain available after the first day?


      Examples: Supportive: The person confirmed the transport change, found an unfilled care interval,
      arranged appropriate help and prepared the first-day materials while keeping the open dependency
      visible.


      Mixed: The rehearsal was complete, but a service was assumed available and still needed confirmation.


      Contradictory: A paper plan was treated as permission to discontinue care, make an unauthorized
      legal change or claim that a loss had been resolved.


      Inconclusive: The transition was named without verified arrangements, a rehearsal or a preparatory
      action.'
