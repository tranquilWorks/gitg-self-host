  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Transition preparedness; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use a visual sequence, interpreter, audio plan or trusted supporter chosen by the affected person.
      A fictional case is useful when no transition is foreseeable but proves planning only. If current
      danger, care disruption or serious symptoms appear, use appropriate timely support instead of continuing
      the exercise.
    cultural_context:
    - Adapt the expression of Transition preparedness to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a visual sequence, interpreter, audio plan or trusted supporter chosen by the affected person.
      A fictional case is useful when no transition is foreseeable but proves planning only. If current
      danger, care disruption or serious symptoms appear, use appropriate timely support instead of continuing
      the exercise.
  pause_conditions:
  - Pause Transition preparedness when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Transition preparedness practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Transition preparedness situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
