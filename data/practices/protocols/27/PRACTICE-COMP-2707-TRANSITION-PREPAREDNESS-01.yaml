      - [University of Edinburgh — What? So what? Now what?](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      On October 26 the transport provider confirms Route A will operate on November 2 with the stated
      accessible pickup. Kai saves the confirmation. The proposed 07:30 fallback is not confirmed and
      is retained as an unresolved alternative, not booked support. Kai gathers the existing study materials
      on October 27 and sends the welcome private goodbye message. No future group meeting is arranged.
      Kai keeps the 16:00 responsibility and sets an October 30 dependency check and a November 3 after-start
      review.


      The first day has not occurred in this packet. Main-route readiness, preparation and a goodbye are
      established; punctual attendance, household follow-through and emotional adjustment are untested.
      A twenty-minute return delay would reach home at 16:10 and conflict with the existing duty.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Check the zero-margin handoff


      The supplied 07:50 pickup plus ten-minute journey reaches 08:00 with zero margin. Arithmetic fit
      is not a dependable real-world plan: verify pickup timing, travel conditions and the receiving person’s
      availability, then agree a buffer or an accepted fallback. Do not treat an unconfirmed fallback
      as coverage or take another person’s time for granted.


      ### Prepare the dependencies, not a prediction of how you will feel


      A foreseeable transition changes more than the headline event. A new work schedule can change transport,
      care coverage, meals, shared routines and the moments when people can talk. Practical readiness
      and emotional readiness can differ: a booked journey does not settle sadness about leaving a familiar
      group.


      Allow thirty minutes for the supplied first-day rehearsal, fifteen for the later verification and
      ten for checks. [OpenLearn on changing work–life priorities, S01](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=1)
      provides context for shifting demands. This case does not prescribe how parenthood, relocation,
      illness, aging, dependency or loss should unfold; it teaches one way to make known and unknown dependencies
      visible.


      Worked example: someone knows the date of a move but assumes their usual prescription and care arrangements
      will transfer automatically. A labeled box cannot confirm that dependency. The appropriate provider
      or responsible person must resolve it before the plan can call it ready. A reflective farewell can
      matter too, but it performs a different task.


      ### First-day file T5


      Fictional Kai begins a changed study schedule on Monday November 2. The first session starts at
      09:00 in Room C and ends at 15:00. Kai has a pre-existing agreed household responsibility at 16:00
      that cannot be removed by this exercise. All times below are case stipulations, not transport advice.


      | Dependency | Known information | Authority / missing confirmation |

      | --- | --- | --- |

      | Morning transport | Route A leaves 08:00, arrives 08:35; final suitable corridor takes 10 minutes
      | Provider must confirm Route A operates on the new date |

      | Return transport | Route B leaves site 15:15, arrives home 15:50 | Existing booking confirmed
      for November 2 |

      | Household coverage | Kai remains responsible at 16:00 | No one else has agreed to cover; preserve
      the duty |

      | Study access | Room C and accessible materials are confirmed suitable | Course office confirms
      the first-day location |


      Kai''s morning routine ends at 07:50 and the suitable route to the pickup takes ten minutes. The
      planned arrival at Room C is 08:45. Returning at 15:50 leaves ten minutes before the household duty;
      that is arithmetic, not a guarantee against delay. Route A''s proposed fallback is an earlier service
      leaving 07:30 and arriving 08:10, with the same ten-minute final corridor. It would require a different
      morning arrangement which is not yet confirmed. A fallback on paper is not readiness.


      Kai will miss a familiar Tuesday study group. The group welcomes a short private goodbye message
      but has not promised future meetings. Kai also looks forward to the new subject while feeling uncertain
      about the change. Neither emotion is evidence that the timetable works. Existing materials can be
      gathered safely without buying anything or disclosing personal records.


      ### Rehearse, verify, then preserve the open item


      1. Write the first date, three essential dependencies, affected people, a possible loss and a possible
      benefit. Trace the whole first day through the final household duty, not only the arrival. Mark
      current, proposed and unknown arrangements separately.

      2. Choose one verification contact through the established provider route. Save the initial plan
      before the [later packet](?resource=file-later-packet-md). Incorporate the actual response; do not
      use a friendly acknowledgement as confirmation of a service.

      3. Mark each dependency ready, awaiting confirmation or needing appropriate help. Record one safe
      preparatory action actually performed. Schedule a check before November 2 and another after the
      first day; the latter cannot be completed before the transition occurs.


      ### Practical and emotional work can both remain open


      Use a visual sequence, interpreter, audio plan or chosen supporter. A fully fictional rehearsal
      is suitable if no transition is foreseeable. A harder scenario delays the return by twenty minutes:
      identify the resulting conflict and contact the relevant people before assuming coverage. Protect
      current responsibilities rather than solving the diagram by assigning an unwilling helper.


      Later transfer requires actual service and care arrangements, suitable access and the affected person''s
      preferences. In transitions involving health, law, finances, safeguarding or serious loss, use the
      appropriate professional or responsible process. A quiet support conversation or closing ritual
      is optional and must fit those involved. This preparation cannot certify competence in parenting,
      bereavement, recovery or independent living; it can reveal what must be checked before a change
      is lived.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
