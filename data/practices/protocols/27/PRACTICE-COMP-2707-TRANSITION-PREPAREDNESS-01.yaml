meaning_and_fit:
  purpose: Anticipate the practical dependencies, emotional losses, available support and first actions
    involved in one foreseeable life transition.
  why_recommended: Anticipate the practical dependencies, emotional losses, available support and first
    actions involved in one foreseeable life transition.
  claims:
  - statement: Anticipate the practical dependencies, emotional losses, available support and first actions
      involved in one foreseeable life transition.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Transition preparedness practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Transition preparedness as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a visual sequence, interpreter, audio plan or trusted supporter chosen
    by the affected person. A fictional case is useful when no transition is foreseeable but proves planning
    only. If current danger, care disruption or serious symptoms appear, use appropriate timely support
    instead of continuing the exercise.
  opportunity_considerations: Use the supplied case of a work or study schedule changing next month. Prepare
    a page with first day, essentials that must continue, people affected, what may be lost and support.
    Other possible transitions include location, partnership, parenthood, health, aging, dependency or
    loss; only choose one relevant transition, not every life pathway.
  prerequisites:
  - Use the supplied case of a work or study schedule changing next month. Prepare a page with first day,
    essentials that must continue, people affected, what may be lost and support. Other possible transitions
    include location, partnership, parenthood, health, aging, dependency or loss; only choose one relevant
    transition, not every life pathway.
  dependencies: []
  safe_alternatives:
  - Use a visual sequence, interpreter, audio plan or trusted supporter chosen by the affected person.
    A fictional case is useful when no transition is foreseeable but proves planning only. If current
    danger, care disruption or serious symptoms appear, use appropriate timely support instead of continuing
    the exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Transition preparedness differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Transition preparedness as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied case of a work or study schedule changing next month. Prepare a page with first
    day, essentials that must continue, people affected, what may be lost and support. Other possible
    transitions include location, partnership, parenthood, health, aging, dependency or loss; only choose
    one relevant transition, not every life pathway. Goal: Anticipate the practical dependencies, emotional
    losses, available support and first actions involved in one foreseeable life transition. Scope: Preparation
    is not completion of the transition. Legal, clinical, financial, safeguarding and care-continuity
    decisions require the appropriate authority or professional rather than this worksheet. Time and effort:
    Thirty minutes to map the transition, one verification contact or rehearsal and a 15-minute readiness
    review. Adaptation: Use a visual sequence, interpreter, audio plan or trusted supporter chosen by
    the affected person. A fictional case is useful when no transition is foreseeable but proves planning
    only. If current danger, care disruption or serious symptoms appear, use appropriate timely support
    instead of continuing the exercise. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a visual sequence, interpreter, audio plan or trusted supporter chosen by the
    affected person. A fictional case is useful when no transition is foreseeable but proves planning
    only. If current danger, care disruption or serious symptoms appear, use appropriate timely support
    instead of continuing the exercise.
  expected_burden: Thirty minutes to map the transition, one verification contact or rehearsal and a 15-minute
    readiness review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Transition preparedness protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Transition preparedness action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a visual
    sequence, interpreter, audio plan or trusted supporter chosen by the affected person. A fictional
    case is useful when no transition is foreseeable but proves planning only. If current danger, care
    disruption or serious symptoms appear, use appropriate timely support instead of continuing the exercise.
  actions:
  - stable_id: PRACTICE-COMP-2707-TRANSITION-PREPAREDNESS-01-A1
    sequence: 1
    title: Map continuity and loss separately
    instructions: 'State what is known about the change, what is only possible and the first date at which
      it matters. Identify three dependencies such as transport, necessary care and communication with
      affected people. For each name who has authority and what information is missing. Separately name
      one familiar routine, relationship pattern or expectation that may be lost and one possible benefit
      without forcing optimism. For anticipated loss or health change, keep qualified care and the person’s
      own preferences central.


      Observation checks: Known changes possibilities and first relevant date are separated; Three essential
      dependencies have authority and information needs; A possible loss and benefit are allowed without
      forced optimism; Existing care and the affected person’s preferences remain central. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2707-TRANSITION-PREPAREDNESS-01
      action_stable_id: PRACTICE-COMP-2707-TRANSITION-PREPAREDNESS-01-A1
      competency_stable_id: '27.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2707_a1_primary
      transfer_disposition: context_bound
      measurements:
