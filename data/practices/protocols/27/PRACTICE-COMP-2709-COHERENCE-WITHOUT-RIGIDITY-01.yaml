  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. The substantive answer was ten minutes late. Preserve the early acknowledgement separately,
      make a proportionate repair and revise how real deadlines are tracked.


      2. No. Timely replies are observed; the size of any interruption change is unknown. Correct the
      unsupported number instead of treating the intended benefit as measured.


      3. No. Examine concrete effects, affected people and evidence that might challenge the principle''s
      interpretation. Distinguish inconvenience from a reasoned belief revision, while allowing genuine
      revision when evidence warrants it.


      ### Changed-case answer


      No usable answer by the required time is established: accurate content sent before 11:00 through
      an unavailable channel misses the access condition. Acknowledge the mismatch and ask about an authorized
      usable route if still useful. The acknowledgement alone was not the substantive answer; do not claim
