    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Thursday''s ordinary question receives an accurate answer at 17:08, inside the agreed window. Friday''s
      direct-route question is acknowledged at 16:10, but Jo overlooks the actual 16:30 deadline and sends
      the answer at 16:40. The sender has already postponed the decision; the record contains no larger
      harm estimate. Jo acknowledges the miss and asks whether any corrective information is needed. No
      response to that repair request is supplied.


      Jo keeps the ordinary window provisionally but adds a visible actual-deadline note for direct questions
      before another trial. The Friday response was ten minutes late; an early acknowledgement was not
      a usable answer. The record does not quantify reduced interruptions, and the next trial has not
      occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Keep the principle visible while the method changes


      A principle tells you what good you are trying to protect; a method is one way of protecting it.
      Confusing the two makes every change feel like betrayal. But merely renaming an inconvenient duty
      as flexibility can excuse harm. Coherent revision needs both supporting and contrary evidence, a
      legitimate alternative and an honest record of the old view.


      Allow twenty minutes to compare the fictional arrangement, ten for two later opportunities and ten
      for checks. [IHI''s improvement overview, S03](https://www.ihi.org/library/model-for-improvement)
      supports testing a change and learning from its actual consequences. The principle/method distinction
      and messaging case are original curriculum-based work, not evidence that an organizational model
      settles ethical beliefs.


      Worked example: someone values hospitality and believes every visit must include a cooked meal.
      A guest explains that a shorter no-food visit is more accessible. Changing the method may better
      serve welcome. Serving nothing without considering an already-promised meal would be a different
      case; the actual agreement matters.


      ### The nonurgent-message agreement


      Fictional Jo manages voluntary planning for a small reading circle. Nobody relies on Jo for emergency,
      clinical or safety support. The principle is reliability: people can use timely, accurate information
      and know when to expect a reply. Jo''s old method is answering every nonurgent message immediately.


      Two prior observations are supplied. On Monday an immediate answer let another organizer finalize
      a room booking before 16:00; that supports promptness when a decision truly depends on it. On Tuesday
      five nonurgent interruptions broke Jo''s preparation period and led to an incorrect room number
      in one answer; that challenges automatic immediacy. Neither observation establishes all future effects.


      The organizers agree to a one-week trial. Ordinary questions received before 17:00 will be answered
      in the 17:00–17:15 window that day. If an actual decision is needed earlier, a sender may use the
      already agreed direct coordination route and Jo will address the real deadline or explain unavailability.
      This is ordinary low-stakes coordination, not an invented emergency service. Questions arriving
      after 17:00 receive a next-day expectation unless another agreement is made. Everyone explicitly
      accepts the trial; no colleague inherits hidden work.


      The two natural opportunities to inspect are a Thursday question received at 14:00 with no earlier
      need, and a Friday question received at 16:00 with a 16:30 decision deadline. The second uses the
      direct route as agreed. Do not deliberately delay it to prove the new window works.


      ### Make a revision with a memory


      1. Write four headings: principle, old method, evidence for/against, alternative. Include both prior
      observations. Name a fact that might require revisiting the principle''s interpretation itself—for
      example, evidence that what Jo calls reliable service excludes members unable to use the agreed
      route. That is more consequential than irritation at notifications.

      2. Save the trial agreement and read the [later packet](?resource=file-later-packet-md). Judge each
      opportunity against its own deadline, not only the generic window. Record information accuracy,
      any unmet need and whether the original interruption cost was actually measured.

      3. Keep, restore or revise the method with a reason. State the stable good, the changed behavior,
      any necessary repair and what remains uncertain. Preserve “I used to answer immediately” rather
      than claiming the new view was always held.


      ### Revision is bounded by real duties


      Use a written reminder, visual cue or a chosen planning helper. If consultation would be unsafe,
      choose an entirely self-controlled low-stakes habit or stay with the supplied case. Do not experiment
      with consent, medication, emergency response, required professional coverage or another person''s
      rights.


      A harder case reveals one member cannot access the direct channel. The agreement is not adequate
      merely because others accepted it; establish a workable route before relying on the trial. In later
      transfer, observe two ordinary opportunities and one genuine cost of the old method. Do not manufacture
      a crisis. A promising pair of replies can support continued testing while broad claims about efficiency
      and moral coherence remain unproven.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt these before opening [answers](?check=practice-answers).


      1. A direct question needs an answer at 16:30. Acknowledgement arrives 16:10 and the answer 16:40.
      Was the need met on time?


      2. Two ordinary replies occur in the window, but nobody records interruption frequency. May the
      review claim a 50 percent reduction?


      3. Changing a habit is uncomfortable. Is discomfort alone evidence that the underlying principle
      is wrong?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A person needs your substantive venue answer by 11:00. You acknowledge at 10:20 and send a correct
      answer at 10:55, but only through a channel they explicitly said they cannot access until 12:00.
      Was the communication need met?'
    check_id: practice-answers
