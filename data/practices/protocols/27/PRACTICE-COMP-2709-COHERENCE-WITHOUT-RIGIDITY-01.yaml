  - stable_id: PRACTICE-COMP-2709-COHERENCE-WITHOUT-RIGIDITY-01-A3
    sequence: 3
    title: Keep a coherent revision rather than a defensive story
    instructions: 'Compare both opportunities with the original supporting and challenging evidence. Keep
      the revised method, restore the old one or change one condition, giving the reason. State what remained
      stable, what changed and what is still uncertain about the underlying belief. Where the test harmed
      a commitment, make a proportionate repair. Do not pretend you always held the new view or treat
      correction as the loss of an entire identity.


      Observation checks: Both opportunities inform the chosen revision; Stable principle changed method
      and remaining uncertainty are distinguished; Any harmed commitment receives a repair disposition;
      The prior view is acknowledged rather than rewritten out of history. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What stayed morally important when the method changed, and what evidence would justify
      a deeper revision rather than another workaround?


      Examples: Supportive: The agreed reply window preserved promised responses on both occasions and
      reduced interruptions, so the person revised the method while retaining reliability.


      Mixed: One response was missed; the person repaired it and adjusted the exception rather than declaring
      the experiment wholly successful.


      Contradictory: Flexibility was used to dismiss a binding obligation, or the original belief was
      denied to avoid admitting a change.


      Inconclusive: A principle was renamed without an alternative method, actual opportunities or a comparison.'
