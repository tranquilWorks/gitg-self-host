  actions:
  - stable_id: PRACTICE-COMP-2709-COHERENCE-WITHOUT-RIGIDITY-01-A1
    sequence: 1
    title: Identify what deserves continuity and what may change
    instructions: 'State the principle in terms of the good it protects, then write the current method
      separately. In the default, reliability means keeping reasonable agreements and communicating delays,
      not necessarily instant replies. Find one observation supporting the method and one showing a cost
      or failure. Name a fact that could change your understanding of the principle itself; do not assume
      every inherited belief is beyond review, but distinguish evidence from mere inconvenience.


      Observation checks: Principle and current method are explicitly separated; Both supporting and challenging
      observations are retained; A cost or failure of the current method is concrete; A possible belief-revising
      fact is named without using inconvenience as proof. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
