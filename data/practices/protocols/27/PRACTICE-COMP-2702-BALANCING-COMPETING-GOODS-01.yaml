  - stable_id: PRACTICE-COMP-2702-BALANCING-COMPETING-GOODS-01-A2
    sequence: 2
    title: Choose with a reason that admits the loss
    instructions: 'Select one alternative using two reasons you endorse and state the strongest good it
      leaves unserved. In the supplied case, rest may take priority after a demanding week while skill
      practice waits; a friend visit may instead fit a rare welcome opportunity. Confirm any effect on
      a shared commitment before acting. Write a reversal condition, such as a new care duty or changed
      safety condition, and one proportionate way to revisit the sacrificed good later without promising
      to maximize everything.


      Observation checks: The chosen option has two endorsed reasons; The strongest sacrificed good is
      named fairly; Affected shared commitments are confirmed before action; A reversal condition and
      bounded later revisit are set. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
