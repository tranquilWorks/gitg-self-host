meaning_and_fit:
  purpose: Choose among legitimate competing goods within a real limit, explain what is protected and
    sacrificed, and revisit the choice after seeing its consequences.
  why_recommended: Choose among legitimate competing goods within a real limit, explain what is protected
    and sacrificed, and revisit the choice after seeing its consequences.
  claims:
  - statement: Choose among legitimate competing goods within a real limit, explain what is protected
      and sacrificed, and revisit the choice after seeing its consequences.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Balancing competing goods practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Balancing competing goods as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use two alternatives and spoken notes if comparing three is burdensome, but
    retain the unchosen good and actual limit. A support person may help clarify options without choosing
    for you. Defer choices involving urgent care, coercion or high consequences to the appropriate people
    and procedures.
  opportunity_considerations: Use the supplied example of a three-hour discretionary weekend window after
    essential responsibilities. Possible uses are visiting a willing friend, learning a skill, volunteering
    at an already approved short task, or resting. No option is compulsory. Use a page headed protected
    obligations, live alternatives, sacrificed goods and review.
  prerequisites:
  - Use the supplied example of a three-hour discretionary weekend window after essential responsibilities.
    Possible uses are visiting a willing friend, learning a skill, volunteering at an already approved
    short task, or resting. No option is compulsory. Use a page headed protected obligations, live alternatives,
    sacrificed goods and review.
  dependencies: []
  safe_alternatives:
  - Use two alternatives and spoken notes if comparing three is burdensome, but retain the unchosen good
    and actual limit. A support person may help clarify options without choosing for you. Defer choices
    involving urgent care, coercion or high consequences to the appropriate people and procedures.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Balancing competing goods differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Balancing competing goods
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied example of a three-hour discretionary weekend window after essential responsibilities.
    Possible uses are visiting a willing friend, learning a skill, volunteering at an already approved
    short task, or resting. No option is compulsory. Use a page headed protected obligations, live alternatives,
    sacrificed goods and review. Goal: Choose among legitimate competing goods within a real limit, explain
    what is protected and sacrificed, and revisit the choice after seeing its consequences. Scope: This
    concerns a low-stakes discretionary choice, not rationing essential care, overriding another person’s
    rights or deciding a major legal, medical or financial matter. Time and effort: Twenty minutes before
    one choice, the chosen activity and a 10-minute review within a week. Adaptation: Use two alternatives
    and spoken notes if comparing three is burdensome, but retain the unchosen good and actual limit.
    A support person may help clarify options without choosing for you. Defer choices involving urgent
    care, coercion or high consequences to the appropriate people and procedures. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use two alternatives and spoken notes if comparing three is burdensome, but retain
    the unchosen good and actual limit. A support person may help clarify options without choosing for
    you. Defer choices involving urgent care, coercion or high consequences to the appropriate people
    and procedures.
  expected_burden: Twenty minutes before one choice, the chosen activity and a 10-minute review within
    a week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Balancing competing goods protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Balancing competing goods action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use two alternatives
    and spoken notes if comparing three is burdensome, but retain the unchosen good and actual limit.
    A support person may help clarify options without choosing for you. Defer choices involving urgent
    care, coercion or high consequences to the appropriate people and procedures.
  actions:
  - stable_id: PRACTICE-COMP-2702-BALANCING-COMPETING-GOODS-01-A1
    sequence: 1
    title: Keep the alternatives genuinely live
    instructions: 'Check what time and energy are actually discretionary before assigning the three-hour
      window. Consider work, family, health, service, rest, growth, pleasure and security, marking each
      as a protected obligation, relevant option or not relevant now. Write three feasible alternatives,
      including rest or doing less. For each name one benefit, one cost, who is affected and whether the
      choice can be reversed. Do not make the preferred option win by describing the others as laziness
      or selfishness.


      Observation checks: Actual discretionary capacity is established first; All eight competing goods
      receive an honest disposition; Three feasible alternatives include doing less when appropriate;
      Benefits costs affected people and reversibility are explicit. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2702-BALANCING-COMPETING-GOODS-01
      action_stable_id: PRACTICE-COMP-2702-BALANCING-COMPETING-GOODS-01-A1
      competency_stable_id: '27.02'
