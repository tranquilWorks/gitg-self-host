  - stable_id: PRACTICE-COMP-2702-BALANCING-COMPETING-GOODS-01-A3
    sequence: 3
    title: Review the consequences rather than defend the choice
    instructions: 'Carry out the chosen activity or record the condition that required revision. Within
      a week compare the actual benefits, costs and effects on others with the original reasons. Ask whether
      the choice was reasonable from the information available, separately from whether its outcome was
      pleasant. Keep, revise or abandon the decision rule for a similar window. An unexpected good outcome
      does not erase a foreseeable neglected obligation, and disappointment does not by itself prove the
      choice was unwise.


      Observation checks: The chosen activity or explicit revision actually occurs; Observed benefits
      costs and effects are compared with predictions; Decision quality and outcome pleasantness are examined
      separately; A future decision rule is retained or revised with a reason. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What made this sacrifice justified in this situation, and what later evidence would
      make the same tradeoff unwise?


      Examples: Supportive: The person protected existing care, chose rest over an optional lesson, informed
      an affected friend where needed and later reviewed both recovery and the missed learning opportunity.


      Mixed: The chosen activity occurred, but one cost to another person had not been checked and required
      repair.


      Contradictory: An essential obligation was relabeled optional, or a favorable result was used to
      conceal a foreseeable harm.


      Inconclusive: A ranking of values was written without a concrete choice, action or later comparison.'
    expected_time: 15-25 minutes
    due_within_days: 10
