  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      At 13:30 the friend cancels the visit. Neri acknowledges the cancellation at 13:35 and does not
      arrive uninvited. Neri uses the stated quiet-at-home fallback for the 14:00–17:00 window. The later
      report is mixed: the afternoon felt less demanding, but Neri missed the conversation and found part
      of the quiet time dull. No lesson or service task occurs. The friend has not agreed to another date.


      On Sunday Neri keeps the principle of checking capacity and welcome before combining activities,
      and revises the fallback to allow a choice among two familiar low-demand options. A future lesson
      is considered but not scheduled. The cancellation activated a prewritten condition; disappointment
      does not erase that sound response. No long-term balance or recovery outcome is established.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Admit the good your choice leaves out


      Tradeoffs are hardest when more than one alternative is genuinely good. Calling the unchosen activity
      selfish, lazy or pointless makes a decision easier by distorting it. A transparent choice names
      what is protected, what is possible now, who is affected and which worthwhile thing will wait.


      Allow twenty minutes for the fictional weekend decision, ten for its later outcome and ten for checks.
      No real care, medical, legal or financial decision is requested. [OpenLearn''s wider work–life balance
      discussion, S09](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=3.5) supports
      considering commitments beyond employment. It supplies no universal ranking of family, work, pleasure
      or rest, and this exercise introduces none.


      Worked example: a person chooses rest instead of an optional class after an unusually demanding
      week. The class remains worthwhile, and the person may later regret missing a useful lesson. That
      regret alone does not make the original decision unsound. Conversely, enjoying a class would not
      justify ignoring a foreseeable essential care obligation.


      ### Neri''s genuinely discretionary three hours


      On Saturday Neri has 14:00–17:00 free after work, essential care and necessary household tasks.
      The window is confirmed, not borrowed from sleep or someone else''s responsibility. Neri wants low
      effort this week and values a rare invitation from a willing friend. There are no additional shared
      commitments within the window. The following four options are feasible individually under the initial
      facts; travel and transitions are included.


      | Option | Time in minutes | Specific good | Cost or unserved good |

      | --- | ---: | --- | --- |

      | F: visit a willing friend | 90 | Rare welcome conversation | Uses some quiet recovery time |

      | G: use an available self-study lesson | 120 | Skill growth and interest | Demands sustained attention
      |

      | S: already approved local service task | 150 | Requested contribution | Higher effort and less
      private rest |

      | R: stay home with quiet leisure/rest | 180 | Low demand and ordinary pleasure | Misses this rare
      visit and today''s service opportunity |


      A mixed option F plus 90 minutes of quiet time also fits. F + G does not. Neri has promised no attendance
      at S and no class place at G; declining creates no cancellation debt in this case. If actual commitments
      existed, they would belong in the protected-obligations check before using this table.


      Give all eight goods a disposition: work, family, health, service, rest, growth, pleasure and security.
      Here work and necessary family/health responsibilities are protected outside the window; service,
      rest, growth and pleasure are live possibilities; security is protected through essential resources
      with no new spending required. “Not an additional option now” does not mean an area is unimportant.
      Do not turn the dispositions into a moral ranking or equal-time requirement.


      ### Choose a rule you can later examine


      1. Write three genuinely live alternatives, including doing less. For each name the benefit, cost,
      affected people and reversibility. You may compare F plus rest, G plus spare time, and R; preserve
      S as a considered but unselected possibility. Check the sum of any combination against 180 minutes.

      2. Choose with two reasons and a fair account of the strongest sacrifice. The supplied starting
      decision is F plus rest: a rare welcome chance and room for low effort. It sacrifices today''s learning
      session and service opportunity. Set a reversal condition before acting: if the friend cancels,
      do not treat the old invitation as continuing. A new care need also takes priority. The fallback
      is quiet time at home, with no claim that all missed goods will be made up.

      3. Save the choice and reasons before the [later packet](?resource=file-later-packet-md). Compare
      the actual consequence with the prediction. Evaluate whether the decision was reasonable on the
      information available separately from whether the outcome felt pleasant. Retain, revise or abandon
      the rule with a reason.


      ### A sacrifice is not a debt to maximize later


      The output is one decision record with an honest loss and an actual review. Saying “I will do everything
      next weekend” merely moves the impossible budget. A bounded revisit might be checking a future lesson
      opening; it is a proposal until time, energy and any affected person agree.


      For support, compare two alternatives with spoken notes while keeping the unchosen good visible.
      A helper may clarify facts but should not decide the person''s priorities. For a harder variation,
      a 45-minute new care obligation reduces the discretionary window to 135 minutes. Recheck which options
      fit and who must be told; do not preserve the old decision by relabeling care optional.


      Later transfer concerns one low-stakes choice and a review within a week. Coercion, urgent care
      or major consequences call for the appropriate people and procedures, not this fictional table.
      A good outcome can follow poor reasoning, and a careful choice can disappoint. Learning depends
      on keeping both facts available rather than defending the original answer at any cost.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt these before opening [answers](?check=practice-answers).


      1. A 180-minute window is reduced by a new 45-minute necessary duty. Which of F=90, G=120, S=150
      and R=180 still fit unchanged?


      2. A chosen class is enjoyable, but the person knowingly missed an essential duty to attend. Does
      the pleasant outcome establish a wise tradeoff?


      3. A friend cancels a visit, and the person follows a prewritten rest fallback but feels disappointed.
      Must the original decision rule be abandoned?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. 135 minutes remain. F and G fit individually; S and the full R do not fit unchanged. Rest can
      be resized deliberately. Correct any total that keeps the duty outside an already reduced budget
      or assumes F + G fits.


      2. No. Foreseeable neglected obligations remain part of decision quality. Record the breach and
      repair appropriately; enjoyment cannot retroactively make an obligation discretionary.


      3. No. Distinguish the justified response to changed welcome from the emotional outcome. Retain
      useful parts, revise a specific fallback if warranted and preserve the unserved social good. Do
      not invent a replacement invitation.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
