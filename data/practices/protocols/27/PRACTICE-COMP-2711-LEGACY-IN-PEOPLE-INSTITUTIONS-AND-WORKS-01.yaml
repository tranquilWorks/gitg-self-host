intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied example of a small shared household or community resource guide that its users
    actually want: where a shared item belongs, how to use it safely within ordinary ability, who handles
    questions and how corrections are made. Use only approved non-sensitive information and a willing
    future maintainer; no public publication is required. Goal: Create or repair a modest contribution
    that another willing person can maintain, while considering its effects on relationships, shared systems,
    knowledge and existing harms. Scope: A maintainable contribution is not proof of a lifetime legacy.
    Ownership, consent, privacy, cultural access and any existing repair obligations take priority over
    recognition or permanence. Time and effort: Twenty minutes to choose the contribution, one 30-minute
    construction or repair and a 15-minute handoff test. Adaptation: Use an audio guide, tactile label,
    demonstration or accessible shared note instead of print. A private family or friend contribution
    is as legitimate as a public institution. Cultural knowledge may require restricted access or no documentation;
    legal or serious-harm repair needs appropriate processes rather than this small project. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an audio guide, tactile label, demonstration or accessible shared note instead
    of print. A private family or friend contribution is as legitimate as a public institution. Cultural
    knowledge may require restricted access or no documentation; legal or serious-harm repair needs appropriate
    processes rather than this small project.
  expected_burden: Twenty minutes to choose the contribution, one 30-minute construction or repair and
    a 15-minute handoff test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Legacy in people, institutions, and works protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Legacy in people, institutions, and works action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an audio
    guide, tactile label, demonstration or accessible shared note instead of print. A private family or
    friend contribution is as legitimate as a public institution. Cultural knowledge may require restricted
    access or no documentation; legal or serious-harm repair needs appropriate processes rather than this
    small project.
  actions:
  - stable_id: PRACTICE-COMP-2711-LEGACY-IN-PEOPLE-INSTITUTIONS-AND-WORKS-01-A1
    sequence: 1
    title: Choose usefulness and repair before recognition
    instructions: 'Identify the people who would use the contribution and ask what problem it should solve.
      Consider five possible forms of legacy—relationships, systems, traditions, knowledge and repaired
      harms—and give each a relevant or not-relevant disposition for this small project. Check whether
      an overdue repair or existing promise should take priority over making something new. Agree ownership,
      permitted audience and a modest definition of useful; do not choose a project mainly because your
      name can remain attached.


      Observation checks: Intended users identify a genuine wanted purpose; Five legacy forms receive
      relevant dispositions; Existing repair obligations or promises are considered first; Ownership audience
      and usefulness are agreed without a recognition requirement. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2711-LEGACY-IN-PEOPLE-INSTITUTIONS-AND-WORKS-01
      action_stable_id: PRACTICE-COMP-2711-LEGACY-IN-PEOPLE-INSTITUTIONS-AND-WORKS-01-A1
      competency_stable_id: '27.11'
