meaning_and_fit:
  purpose: Create or repair a modest contribution that another willing person can maintain, while considering
    its effects on relationships, shared systems, knowledge and existing harms.
  why_recommended: Create or repair a modest contribution that another willing person can maintain, while
    considering its effects on relationships, shared systems, knowledge and existing harms.
  claims:
  - statement: Create or repair a modest contribution that another willing person can maintain, while
      considering its effects on relationships, shared systems, knowledge and existing harms.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Legacy in people, institutions, and works practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Legacy in people, institutions, and works as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an audio guide, tactile label, demonstration or accessible shared note
    instead of print. A private family or friend contribution is as legitimate as a public institution.
    Cultural knowledge may require restricted access or no documentation; legal or serious-harm repair
    needs appropriate processes rather than this small project.
  opportunity_considerations: 'Use the supplied example of a small shared household or community resource
    guide that its users actually want: where a shared item belongs, how to use it safely within ordinary
    ability, who handles questions and how corrections are made. Use only approved non-sensitive information
    and a willing future maintainer; no public publication is required.'
  prerequisites:
  - 'Use the supplied example of a small shared household or community resource guide that its users actually
    want: where a shared item belongs, how to use it safely within ordinary ability, who handles questions
    and how corrections are made. Use only approved non-sensitive information and a willing future maintainer;
    no public publication is required.'
  dependencies: []
  safe_alternatives:
  - Use an audio guide, tactile label, demonstration or accessible shared note instead of print. A private
    family or friend contribution is as legitimate as a public institution. Cultural knowledge may require
    restricted access or no documentation; legal or serious-harm repair needs appropriate processes rather
    than this small project.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Legacy in people, institutions, and works differently while preserving consent, evidence limits, safety,
