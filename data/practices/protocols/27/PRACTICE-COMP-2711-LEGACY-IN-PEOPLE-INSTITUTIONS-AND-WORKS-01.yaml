  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      The incorrect notice said the room opened at 08:30; the authorized correction is 09:00. Noor posts
      the corrected notice through the agreed channel and Lee acknowledges it. No affected visitor''s
      experience or forgiveness is supplied.


      Pat''s first test correctly sends a missing booking card to the coordinator, but Draft B says only
      “return to the desk” and Pat asks which desk. Noor adds “the same staffed desk, before 12:00.” In
      a second check Pat identifies both correctly without an instructional hint. Lee explicitly accepts
      maintaining the guide beside the booking cards and rechecking after booking-rule changes. Lee may
      revise or retire it without Noor''s permission. No later rule change, actual shift, long-term use
      or institutional benefit has yet been observed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Leave something that can live without your supervision


      Legacy can be a cared-for relationship, a useful institution, a carried tradition, shared knowledge
      or repaired harm. Fame and ownership are not the test. Sometimes repairing an overdue obligation
      matters more than starting something with your name on it. A useful handoff includes a willing recipient,
      authority to change it and a way to retire it. A polished artifact nobody wants to maintain is not
      a completed legacy.


      Use the complete fictional case below. Allow twenty minutes to choose the contribution, thirty to
      build it and fifteen for a handoff attempt. These are teaching allowances, not a demand for unpaid
      institutional labor. For real work, first check what users want and what responsibility you actually
      hold. NASA''s distinction between status reporting and assessment that informs corrective action
      [S02](https://www.nasa.gov/reference/6-7-technical-assessment/) supports checking usefulness and
      maintenance. Applying it to a small community guide is original synthesis, not NASA certification.


      ### A guide with a willing user and an unfinished ownership question


      Noor helps at a voluntary neighborhood room. Consider five possible legacies: a reliable relationship
      with a new helper; a booking process others can maintain; an optional closing tradition; a usable
      room-opening guide; and repair of an incorrect booking notice. The room coordinator actually wants
      the guide, but the wrong notice is due for correction first. The coordinator has authorized Noor
      to correct that notice and draft the guide; this does not authorize a new volunteer obligation for
      anyone else.


      **Complete room rules, version 2, checked December 2:** The coordinator confirms each booking. A
      confirmed helper collects the key from the staffed desk at 09:00, reads the current booking card
      and opens the room for that booking only. A missing or inconsistent card goes back to the coordinator;
      do not guess a booking. After use, return the key to the same staffed desk before 12:00. Contact
      the coordinator through the room''s existing message book. This guide does not cover emergencies,
      building access outside those hours or safeguarding responsibilities.


      **Draft A:** “Get the key, check bookings, open up and put everything back. Ask Noor if unsure.”
      It omits the authorized desk, times, missing-card rule and durable question route. A willing new
      adult helper, Pat, has agreed to test a draft using the supplied case, not to work a shift. Coordinator
      Lee can accept maintenance responsibility but has not yet done so.


      A worked improvement replaces “ask Noor” with the existing coordinator route and adds the actual
      key-return deadline. Its footer reads: “Room-opening guide, version 2, checked December 2; stored
      beside the booking cards. Intended for confirmed helpers during staffed hours. Proposed maintainer:
      coordinator; acceptance pending. Recheck after booking-rule changes; withdraw if no one can verify
      the rules.” Noor''s name can appear in history without becoming a permission gate.


      ### Repair, test and transfer responsibility honestly


      1. Record why this guide is wanted and why the notice repair comes first. Write the exact corrected
      notice from the supplied later facts only when they become available; do not pretend the correction
      was already delivered. Build Draft B from the complete rules, including question route, scope, location,
      last-checked date and retirement condition.

      2. Give Pat this test: “Your booking is confirmed, but the booking card is missing at 09:00. What
      would you do? Where does the key go after use, and by when?” Save the draft and expected answers
      before reading the [later packet](?resource=file-later-packet-md). Observe use without explaining
      away unclear wording. Access aids are welcome; record instructional help if given.

      3. Revise the actual confusion and ask Lee explicitly whether maintenance is accepted, with what
      review trigger. Save the acceptance or its absence. Remove unnecessary founder approval. An adopted
      correction, a usable guide and an agreed maintainer are separate results; none establishes future
      institutional survival.


      ### A small contribution is enough


      For support, dictate a short guide or improve one existing paragraph with the user''s agreement.
      Without a willing user, make a private rehearsal and mark handoff untested. Do not publish private
      names, contact details or community knowledge without authority. For a harder case, the proposed
      maintainer declines: agree another owner or keep the draft out of operational use. Never silently
      make Pat responsible because Pat tested it.


      At a later real review, ask whether the guide is still used, corrected or properly retired. A maintained
      work can matter without broad recognition. This exercise cannot prove repaired relationships, durable
      institutions or effects on future generations.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
