  - stable_id: PRACTICE-COMP-2704-ROLES-AND-RESPONSIBILITY-PORTFOLIO-01-A2
    sequence: 2
    title: Renegotiate a collision and carry out a repair
    instructions: 'Choose one low-stakes collision within your authority. State the limit to the relevant
      person using a concrete proposal, such as replying to nonurgent messages in an agreed window while
      honoring the check-in. Confirm the arrangement rather than assuming consent. Carry out the neglected
      responsibility or make a specific repair for the missed promise. Do not reduce required care or
      workplace safety coverage to make the role map look balanced.


      Observation checks: One collision is addressed through a concrete proposal; Any shared limit is
      confirmed rather than presumed; A neglected responsibility receives actual action or repair; Required
      care and safety coverage remain intact. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
