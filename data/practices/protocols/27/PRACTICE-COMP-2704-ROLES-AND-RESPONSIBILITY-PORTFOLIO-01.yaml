meaning_and_fit:
  purpose: Make current role obligations visible, distinguish held roles from unchosen ones, and address
    one neglected responsibility within honest capacity.
  why_recommended: Make current role obligations visible, distinguish held roles from unchosen ones, and
    address one neglected responsibility within honest capacity.
  claims:
  - statement: Make current role obligations visible, distinguish held roles from unchosen ones, and address
      one neglected responsibility within honest capacity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Roles and responsibility portfolio practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Roles and responsibility portfolio as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use only the roles actually held and allow relational or communal names that
    fit the participant’s culture. A trusted adviser can help identify obligations, but cannot erase another
    person’s rights. Sensitive role details stay in private notes; the application needs only the listed
    observations.
  opportunity_considerations: 'Use eight role cards: individual, partner, relative, friend, worker, citizen,
    caregiver and community member. The supplied example is a person whose work messages consume a promised
    friend check-in and necessary personal administration. No partner, child, employment or particular
    family structure is assumed.'
  prerequisites:
  - 'Use eight role cards: individual, partner, relative, friend, worker, citizen, caregiver and community
    member. The supplied example is a person whose work messages consume a promised friend check-in and
    necessary personal administration. No partner, child, employment or particular family structure is
    assumed.'
  dependencies: []
  safe_alternatives:
  - Use only the roles actually held and allow relational or communal names that fit the participant’s
    culture. A trusted adviser can help identify obligations, but cannot erase another person’s rights.
    Sensitive role details stay in private notes; the application needs only the listed observations.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Roles and responsibility portfolio differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Roles and responsibility portfolio
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use eight role cards: individual, partner, relative, friend, worker, citizen, caregiver and
    community member. The supplied example is a person whose work messages consume a promised friend check-in
    and necessary personal administration. No partner, child, employment or particular family structure
    is assumed. Goal: Make current role obligations visible, distinguish held roles from unchosen ones,
    and address one neglected responsibility within honest capacity. Scope: Role balance is not equal
    time for every role. Optional roles need not be adopted, while responsibilities already created by
    care, agreement or authority cannot simply be marked not applicable. Time and effort: Twenty minutes
    to map current roles, one small responsibility repair and a 10-minute follow-up within seven days.
    Adaptation: Use only the roles actually held and allow relational or communal names that fit the participant’s
    culture. A trusted adviser can help identify obligations, but cannot erase another person’s rights.
    Sensitive role details stay in private notes; the application needs only the listed observations.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use only the roles actually held and allow relational or communal names that fit
    the participant’s culture. A trusted adviser can help identify obligations, but cannot erase another
    person’s rights. Sensitive role details stay in private notes; the application needs only the listed
    observations.
  expected_burden: Twenty minutes to map current roles, one small responsibility repair and a 10-minute
    follow-up within seven days.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Roles and responsibility portfolio protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Roles and responsibility portfolio action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use only the
    roles actually held and allow relational or communal names that fit the participant’s culture. A trusted
    adviser can help identify obligations, but cannot erase another person’s rights. Sensitive role details
    stay in private notes; the application needs only the listed observations.
  actions:
  - stable_id: PRACTICE-COMP-2704-ROLES-AND-RESPONSIBILITY-PORTFOLIO-01-A1
    sequence: 1
    title: Separate role identity from concrete responsibility
    instructions: 'Mark each role held, sought, not held or consciously unchosen. For held roles write
      one actual responsibility and its source: agreement, dependence, law or an endorsed commitment.
      Identify which role currently makes the most urgent noise and which real obligation has been neglected.
      In the supplied example, checking every nonurgent work message is not automatically more binding
      than an agreed check-in. Keep legal or caregiving uncertainty for appropriate advice rather than
      resolving it by a private label.


      Observation checks: All eight roles receive a current applicability disposition; Held-role responsibilities
      have an identifiable source; The loudest demand is distinguished from a binding obligation; A specific
      neglected responsibility is identified without inventing roles. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2704-ROLES-AND-RESPONSIBILITY-PORTFOLIO-01
