  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Alex completes the twelve-minute correction Wednesday 09:30–09:42 and the manager receives it before
      10:00. Alex submits the library renewal Wednesday 18:00–18:05; confirmation arrives at 18:06. The
      Thursday call with Sam actually occurs from 19:00 to 19:10. Sam says the replacement time worked
      but gives no broader friendship assessment. Alex returns the room key Friday at 16:45 and keeps
      the Saturday call. No colleague takes over Alex''s work. Alex drops the private rule of answering
      every nonurgent evening message immediately while retaining the manager''s actual response agreement.


      This records specific repaired conduct, not equal role balance or automatic forgiveness for the
      missed Tuesday promise.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Find the obligation beneath the loudest request


      A role is a relationship to responsibilities, not a demand to spend equal time on eight identities.
      Some responsibilities come from a promise, a dependent or legitimate authority; others are self-imposed
      expectations. Work notifications can be loud without being urgent, while a quiet promise to a friend
      can still be binding.


      Allow twenty minutes to map the fictional roles, ten for the follow-up and ten for checks. [OpenLearn''s
      work–life discussion, S01](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=1)
      supplies context for changing priorities across life. The role inventory below is a curriculum-based
      planning aid, not legal advice about employment or family duties.


      Worked example: a volunteer assumes that attending every optional committee discussion proves commitment,
      then misses a promised key return. Declining one optional discussion and returning the key serves
      an actual responsibility. It does not show that community membership is less valuable than other
      roles.


      ### Eight complete role cards for Alex


      The fictional Alex works in a non-safety-critical administrative role. The manager''s current agreement
      is that nonurgent evening messages may be answered by 10:00 the next working morning; there is no
      evening on-call duty. Urgent operational matters use a separate staffed route. Alex must not alter
      that route or use this exercise to test an emergency.


      | Role | Current status | Actual responsibility or limit |

      | --- | --- | --- |

      | Individual | Held | Submit ordinary library renewal by October 8 |

      | Partner | Not held | No partner role assumed or required |

      | Relative | Held | Already agreed Saturday call with aunt |

      | Friend | Held | Promised ten-minute check-in with Sam on Tuesday at 19:00 |

      | Worker | Held | Complete assigned work and follow the agreed response window |

      | Citizen | Held | Existing civic obligations remain; no current task is supplied |

      | Caregiver | Not held | No dependent-care obligation in this case |

      | Community member | Held | Return borrowed room key by Friday 17:00 |


      At 18:58 on Tuesday, a nonurgent message asks Alex to correct a meeting title by 10:00 Wednesday.
      The correction needs twelve minutes. Alex feels it must be done immediately and misses Sam''s check-in
      without notice. On Wednesday Alex has a suitable 09:30–09:50 work window. Sam later says a Thursday
      19:00–19:10 replacement is welcome, but no other relationship outcome is supplied.


      The quieter individual obligation is also at risk: the five-minute library renewal has not been
      submitted. It can be done Wednesday 18:00–18:05 through the existing library route. The room key
      and aunt call have not disappeared merely because the exercise focuses on friendship.


      ### Repair one collision and keep the other cards visible


      1. For every card identify the source of responsibility and mark held, sought, not held or consciously
      unchosen where appropriate. Do not assign a partner or caregiver to make the portfolio look complete.
      Where the case supplies no actionable civic detail, preserve that limit rather than inventing a
      legal task.

      2. Separate the manager''s actual agreement from Alex''s instant-response rule. Plan the twelve-minute
      work correction within its deadline, acknowledge the missed friend promise and use the welcome repair
      slot. Put the renewal in its specific window without silently claiming it is already done.

      3. Save the map, then examine the [later packet](?resource=file-later-packet-md). Revisit all held
      roles: did work remain served, did Sam receive the agreed check-in, and did a new burden land on
      someone else? Remove one unsupported demand, not a real duty.


      ### A boundary needs authority and follow-through


      Use culturally fitting role names, spoken cards or a trusted adviser. An adviser can help clarify
      a duty but cannot erase another person''s rights. If a live workplace or care arrangement is uncertain,
      confirm it through an appropriate route before changing availability. Keep sensitive details in
      private notes; this source exercise requires no application entry.


      A harder case gives Alex an actual on-call duty during the friend slot. The nonurgent assumption
      no longer applies: arrange coverage or renegotiate the personal commitment rather than ignoring
      duty. Later transfer is one low-stakes role repair with an actual response and a check that the
      louder role remains adequately served. Unequal time can be responsible; a tidy role map without
      action cannot demonstrate that.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
