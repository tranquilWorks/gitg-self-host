meaning_and_fit:
  purpose: Recognize help, inheritance, care, grace, contemplation or celebration as real dimensions of
    life and respond without making every received good something to earn or repay.
  why_recommended: Recognize help, inheritance, care, grace, contemplation or celebration as real dimensions
    of life and respond without making every received good something to earn or repay.
  claims:
  - statement: Recognize help, inheritance, care, grace, contemplation or celebration as real dimensions
      of life and respond without making every received good something to earn or repay.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Receiving as well as achieving practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Receiving as well as achieving as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a public resource, accessible contemplation or a remembered inheritance
    when interpersonal help is unavailable, but label remembered reflection separately from current receiving.
    No one must accept touch, care, religious framing, celebration or contact that conflicts with safety
    or conscience.
  opportunity_considerations: Use a private page headed received, freely offered, appropriate response
    and limits. The supplied example is using a public library resource and accepting a willing friend’s
    small practical help. Religious participants may understand a received good through grace; secular,
    communal and other interpretations are equally legitimate here. No gift, purchase or contact with
    an unsafe person is required.
  prerequisites:
  - Use a private page headed received, freely offered, appropriate response and limits. The supplied
    example is using a public library resource and accepting a willing friend’s small practical help.
    Religious participants may understand a received good through grace; secular, communal and other interpretations
    are equally legitimate here. No gift, purchase or contact with an unsafe person is required.
  dependencies: []
  safe_alternatives:
  - Use a public resource, accessible contemplation or a remembered inheritance when interpersonal help
    is unavailable, but label remembered reflection separately from current receiving. No one must accept
    touch, care, religious framing, celebration or contact that conflicts with safety or conscience.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Receiving as well as achieving differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Receiving as well as achieving
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page headed received, freely offered, appropriate response and limits. The supplied
    example is using a public library resource and accepting a willing friend’s small practical help.
    Religious participants may understand a received good through grace; secular, communal and other interpretations
    are equally legitimate here. No gift, purchase or contact with an unsafe person is required. Goal:
    Recognize help, inheritance, care, grace, contemplation or celebration as real dimensions of life
    and respond without making every received good something to earn or repay. Scope: Receiving is not
    passivity, entitlement or permission to ignore exploitation. The exercise does not require religious
    belief, unwanted help, disclosure, gratitude toward harm or a positive emotional response. Time and
    effort: Ten minutes to notice received goods, one ordinary receiving opportunity and a 10-minute reflection
    afterward. Adaptation: Use a public resource, accessible contemplation or a remembered inheritance
    when interpersonal help is unavailable, but label remembered reflection separately from current receiving.
    No one must accept touch, care, religious framing, celebration or contact that conflicts with safety
    or conscience. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a public resource, accessible contemplation or a remembered inheritance when
    interpersonal help is unavailable, but label remembered reflection separately from current receiving.
    No one must accept touch, care, religious framing, celebration or contact that conflicts with safety
    or conscience.
  expected_burden: Ten minutes to notice received goods, one ordinary receiving opportunity and a 10-minute
    reflection afterward.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Receiving as well as achieving protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Receiving as well as achieving action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a public
    resource, accessible contemplation or a remembered inheritance when interpersonal help is unavailable,
    but label remembered reflection separately from current receiving. No one must accept touch, care,
    religious framing, celebration or contact that conflicts with safety or conscience.
  actions:
  - stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01-A1
    sequence: 1
    title: Notice what your effort did not create alone
    instructions: 'Name three specific received goods from different sources: inherited knowledge or infrastructure,
      help or care from someone willing, and an opportunity for contemplation or celebration. For each
      distinguish what you contributed from what you did not produce. Include one good that cannot be
      repaid to its original source in any simple transaction. Do not erase injustice, cost or mixed history;
      a received inheritance can call for stewardship or repair as well as appreciation.


      Observation checks: Three received goods come from distinguishable sources; Personal effort and
      unearned or shared contribution are separated; One good is recognized as not simply repayable to
      its original source; Mixed history cost or injustice is not erased by appreciation. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01
      action_stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01-A1
      competency_stable_id: '27.15'
