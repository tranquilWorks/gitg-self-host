  - stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01-A2
    sequence: 2
    title: Accept one suitable good with a clear boundary
    instructions: 'At a natural opportunity, use the library resource, receive the freely offered help
      or enter a modest period of contemplation or celebration. Confirm consent and limits where another
      person is involved, including the freedom to decline. Practice accepting without immediately proving
      productivity, promising disproportionate repayment or converting the experience into public performance.
      If an offer carries coercion or unsafe strings, decline it and choose another legitimate receiving
      opportunity rather than treating refusal as failure.


      Observation checks: One suitable receiving opportunity actually occurs; Consent limits and the freedom
      to decline are preserved; Receiving is not made conditional on immediate productivity or repayment;
      Coercive or unsafe offers are declined without a deficit claim. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01
      action_stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01-A2
      competency_stable_id: '27.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
