  - stable_id: PRACTICE-COMP-2715-RECEIVING-AS-WELL-AS-ACHIEVING-01-A3
    sequence: 3
    title: Respond proportionately and include receiving in the review
    instructions: 'Afterward record what was received, what response is appropriate and what remains outside
      your control. A response may be a simple thanks, careful use, a returned borrowed item, contribution
      when freely chosen or quiet acknowledgement; it need not equal the gift’s value. Name one way the
      experience changed your account of the day beyond accomplishments. Keep any discomfort or absence
      of gratitude visible and distinguish a genuine obligation from a self-imposed need to deserve care.


      Observation checks: The received good and appropriate response are named separately; A proportionate
      response respects genuine obligations without forced equivalence; The day’s account includes receiving
      rather than only achievement; Discomfort or absent gratitude remains visible without a worth judgment.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: What was present in the day because it was received rather than achieved, and what
      response honors it without turning care into a debt of worth?


      Examples: Supportive: The person used a shared learning resource, accepted a bounded offer of help
      and responded with thanks and careful use without inventing a need to earn the care.


      Mixed: The help was accepted, but immediate repayment pressure overshadowed receiving and remained
      an issue for reflection.


      Contradictory: The exercise excused entitlement, forced gratitude toward harm or acceptance of a
      coercive offer in order to appear receptive.


      Inconclusive: A list of accomplishments was relabeled receiving without identifying a received good
      or an actual opportunity.'
    expected_time: 15-25 minutes
    due_within_days: 10
