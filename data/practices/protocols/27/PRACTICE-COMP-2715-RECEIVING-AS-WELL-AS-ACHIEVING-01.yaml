  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Tali declines Ren''s publication condition. Mo agrees to the private ten-minute arrangement and
      helps from 14:00 to 14:08; Tali makes the filing decisions and says thanks. Mo leaves freely with
      no return favor promised. Tali reads the shared card and sits in the courtyard from 14:20 to 14:25,
      reporting ordinary quiet but no particular gratitude.


      Tali returns the card at 15:55; the staffed desk records receipt before 16:00. The day includes
      eight minutes of help and five of quiet, but these are not a price or a measure of worth. The card''s
      exclusionary history remains acknowledged without a claim of completed repair. No future contribution
      or spiritual response is supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Give receiving a place in the account of a day


      Some goods arrive through help, care, inherited knowledge, shared infrastructure, contemplation
      or celebration. Your effort can matter without creating everything you use. Receiving does not require
      passivity, gratitude toward harm or accepting an unwanted offer. Nor does care become a debt of
      personal worth. Genuine agreements, such as returning borrowed materials, still matter.


      Allow ten minutes to distinguish the supplied goods and ten for the later review. The fictional
      case requires no purchase, gift, personal disclosure or religious belief. Edinburgh''s reflection
      questions [S08](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      support describing an experience before interpreting and responding. The account of receiving comes
      from the canonical curriculum, not a psychological claim from that source. Grace may be a meaningful
      religious interpretation; secular, communal and other understandings remain legitimate.


      ### Complete receiving file


      Fictional Tali has three opportunities on October 6:


      | Good | Contribution and limit | Appropriate response |

      | --- | --- | --- |

      | Shared map-reading card | Past volunteers created it; Tali chooses to read it. The desk permits
      borrowing until 16:00 today. | Careful use and return by 16:00, without claiming sole authorship.
      |

      | Help organizing three papers | Friend Mo freely offers ten minutes at 14:00; no repayment, photograph
      or public acknowledgment is requested. | Confirm the limit; thanks may be simple and private. |

      | Quiet courtyard interval | Access is open to visitors until 15:00; Tali may sit for five minutes
      without producing anything. | Respect shared access and leave when required. No prescribed feeling.
      |


      The entire map card reads: “North is at the top. The desk is south of the courtyard. The reading
      room is east of the courtyard. The west door is staff-only.” No real journey depends on it. Tali''s
      papers are a completed receipt, a current appointment reminder and an obsolete duplicate. Tali controls
      which paper is kept or discarded; Mo''s assistance does not transfer that decision. No sensitive
      details are needed.


      The card''s history includes both useful volunteer work and a period when the building excluded
      some residents. Receiving its present usefulness does not erase that exclusion or establish that
      repair has occurred. Earlier volunteers cannot simply be repaid in an equal transaction. Stewardship
      or a freely chosen future contribution can be a response without becoming a required bargain.


      A comparison offer from Ren says, “I will help only if you let me post your story.” Tali does not
      want publication. This is an offer to decline, not a test that receptivity requires passing. The
      exercise assigns no blame for wanting privacy.


      ### Accept a bounded good and retain the obligation


      1. For each of the three goods, name what Tali did and what came from elsewhere. Include inheritance
      that cannot be repaid directly. Write one sentence acknowledging the mixed history without turning
      appreciation into denial. Keep Ren''s condition separate from Mo''s freely offered help.

      2. Work through one suitable receiving opportunity. In the supplied case, Tali confirms Mo''s ten-minute
      limit, uses the map card and plans the quiet interval. Save what is planned before the [later packet](?resource=file-later-packet-md).
      If using a real opportunity, confirm consent and limits; no immediate output or public performance
      is owed unless genuinely agreed.

      3. Review what was actually received, what response occurred and what remains owed. A worked sentence
      is: “Mo''s time was freely offered; returning the desk''s card is an actual borrowing obligation.”
      Do not substitute an expensive gift for the return. Include receiving alongside achievements in
      the day''s account, retaining discomfort or absent gratitude.


      ### Receive without making a new demand


      For support, use a public resource or accessible quiet activity without involving another person.
      A remembered inheritance can support reflection but is not a new receiving event. For a harder case,
      help takes longer than offered: ask before extending it and accept a refusal. Touch, religious framing
      and celebration are always optional.


      In later transfer, notice one suitable good at a natural opportunity and respond proportionately.
      The point is neither to consume others'' care without regard for them nor to earn permission to
      exist. One fictional day cannot establish generosity, dependence managed over time, spiritual experience
      or a transformed life.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. Help is freely offered for ten minutes, but the recipient wants twenty. Does receiving authorize
      the extra time?


      2. A borrowed resource is due at 16:00. May gratitude replace returning it?


      3. A person declines help tied to public disclosure and feels no gratitude during a quiet interval.
      Has the exercise failed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Ask whether the helper freely agrees to extend the offer; otherwise keep the original limit.
      Availability is not an unlimited claim on another person''s labor.


      2. No. A real borrowing agreement remains binding. Return or appropriately renegotiate it; appreciation
      does not perform that obligation or require a disproportionate gift.


      3. No. Declining an unwanted condition preserves agency, and receiving need not produce a particular
      emotion. Record the actual opportunity and response without turning gratitude into a worth test.'
