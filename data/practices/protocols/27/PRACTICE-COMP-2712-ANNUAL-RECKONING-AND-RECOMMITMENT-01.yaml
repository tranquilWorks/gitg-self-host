  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      On January 5 Morgan asks through the existing welcome channel whether an acknowledgment of the missed
      April reply would be welcome. No response has arrived by January 8. The repair offer is sent; reception,
      forgiveness and repaired relationship remain unknown.


      Morgan stops the optional newsletter on January 6 and removes its future drafting reminders. Nobody
      was relying on it. On January 8 the first shelf check takes twelve minutes and identifies one mislabeled
      box; the authorized label is corrected. The February 8 review is scheduled but has not occurred.
      The yearly account retains the four missing months and the unresolved repair. No new year-long reliability
      claim is supported.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make an honest account of a period you can actually see


      An annual reckoning asks who you were becoming, what you served, where harm or neglect occurred,
      what changed and what you received. It is not a productivity league table or a required confession.
      Memory is selective: date the period, retain missing evidence and distinguish an event from the
      meaning you give it. A limited renewal is more credible than promising to fix every area next year.


      Use two twenty-five-minute sessions with the fictional year below. For your own work, choose a real
      year or label a shorter interval accurately. Private notes are sufficient; do not seek unsafe contact
      or disclose someone else''s story. Edinburgh''s “What? So what? Now what?” reflection questions
      [S06](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      help separate description, interpretation and concrete action. They are a reflection aid, not a
      validated measure of character or a therapeutic intervention.


      ### A complete but deliberately uneven year packet


      The period is January 1–December 31 of the fictional year. Morgan has these eight records; no others
      are supplied.


      | Date | Record |

      | --- | --- |

      | January 12 | A neighbor willingly helped carry groceries during a short period of limited mobility.
      |

      | March 4 | Morgan completed an agreed shared inventory; another volunteer could find the materials.
      |

      | April 18 | A promised reply to a friend was missed; no later repair is recorded. |

      | June 6 | A work schedule changed, leaving one fewer discretionary evening. |

      | July 21 | Morgan declined an optional event and kept an existing family commitment. |

      | September 9 | A draft guide was criticized for unclear return instructions; Morgan corrected the
      text. |

      | October 15 | An optional newsletter continued to take an hour a week; nobody depended on its continuation.
      |

      | December 11 | Morgan accepted an accessible way to participate instead of doing a more tiring
      live presentation. |


      February, May, August and November have no records here. Missing months are unknown, not empty or
      bad. The inventory gives evidence of one useful contribution; it does not establish year-long reliability.
      Missing the reply is a specific neglected commitment, not proof of being a bad friend. Receiving
      help and using access support belong in the account without creating a moral debt.


      A worked sentence reads: “I sometimes protected existing commitments, as on July 21, while the April
      reply remains an unaddressed breach. I cannot tell from these notes how often either pattern occurred.”
      It connects examples without inventing a trend. Another states: “The June schedule reduced available
      evenings; next commitments must fit that capacity.” Neither requires a diagnosis or a story of constant
      growth.


      ### Account, repair, release and renew


      1. In the first session, write five short headings: becoming; served; harm or neglect; changed;
      received. Place the eight records where they help, allowing overlap without counting an event as
      two successes. Add the four missing months and one interpretation you are uncertain about. Finish
      with a balanced paragraph rather than a numerical worth score.

      2. In the second session, select one proportionate repair, one optional release and no more than
      three renewed commitments. The worked selection is: ask the friend through the existing welcome
      channel whether a short acknowledgment would be welcome; stop the optional newsletter; and renew
      one monthly inventory check. The repair is an offer, not a demand for forgiveness. If contact is
      unwelcome or unsafe, choose a private accountable action instead.

      3. For each renewed commitment name its purpose, first action, capacity limit and review date. Here
      the inventory check serves shared usability, starts with checking one shelf on January 8, is capped
      at fifteen minutes monthly and is reviewed February 8. Save the account and plan before the [later
      packet](?resource=file-later-packet-md). Record actual first steps separately from intentions and
      keep the account private.


      ### Leave the next season room to happen


      For support, use audio notes, a few dated artifacts or a shorter honestly named interval. You need
      not reconstruct missing months or obtain testimony. For a harder case, a desired commitment exceeds
      next season''s available time: reduce or release it rather than hiding the conflict in optimism.
      Existing dependent care, agreements and other real obligations cannot be dropped merely by naming
      them optional.


      At the review date compare the next actions with what actually happened and revise the scale. A
      repair message does not prove relationship repair; a completed shelf check does not establish a
      year of recommitment. Honest limits and a modest next step are enough for this account.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. There are no notes for four months. May the annual account label those months unproductive?


      2. An acknowledgment offer is sent and has no reply. Which repair result is known?


      3. A person names five new commitments but has capacity for one. What should the recommitment step
      change?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
