  - stable_id: PRACTICE-COMP-2712-ANNUAL-RECKONING-AND-RECOMMITMENT-01-A2
    sequence: 2
    title: Choose repair release and a small recommitment
    instructions: 'From the account identify one proportionate repair or accountability need, one optional
      pursuit to release and no more than three renewed commitments. For each renewed commitment state
      the purpose, first small action, realistic capacity and a review date. Consult affected people before
      changing a shared obligation. If a harm involves abuse, law, clinical care or serious power imbalance,
      use appropriate support and process rather than forced confession, direct contact or self-granted
      absolution.


      Observation checks: A repair need and an optional release are distinguished; No more than three
      renewed commitments have first actions and review dates; Shared changes are discussed with affected
      people; Serious harm follows appropriate accountability rather than unsafe contact or self-absolution.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
