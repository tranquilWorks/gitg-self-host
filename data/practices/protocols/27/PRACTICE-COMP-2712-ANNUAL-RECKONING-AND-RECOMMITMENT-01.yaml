meaning_and_fit:
  purpose: Review a defined year for becoming, service, harm, change and received support, then choose
    a limited set of accountable commitments for the next season.
  why_recommended: Review a defined year for becoming, service, harm, change and received support, then
    choose a limited set of accountable commitments for the next season.
  claims:
  - statement: Review a defined year for becoming, service, harm, change and received support, then choose
      a limited set of accountable commitments for the next season.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Annual reckoning and recommitment practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Annual reckoning and recommitment as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use audio, drawings or a trusted reflective conversation with consent. Review
    one month or season when a year is unavailable, labeling the shorter scope. Grief, memory difficulty
    or limited records do not require forced reconstruction; appropriate support may matter more than
    completing an account.
  opportunity_considerations: 'Choose exact start and end dates and a few safe records such as a calendar,
    finished work, ordinary commitments or private notes. Use five headings: who I have been becoming,
    what I served, harm or neglect, what changed, and what I received. A fictional year may be used for
    practice but is not personal evidence.'
  prerequisites:
  - 'Choose exact start and end dates and a few safe records such as a calendar, finished work, ordinary
    commitments or private notes. Use five headings: who I have been becoming, what I served, harm or
    neglect, what changed, and what I received. A fictional year may be used for practice but is not personal
    evidence.'
  dependencies: []
  safe_alternatives:
  - Use audio, drawings or a trusted reflective conversation with consent. Review one month or season
    when a year is unavailable, labeling the shorter scope. Grief, memory difficulty or limited records
    do not require forced reconstruction; appropriate support may matter more than completing an account.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Annual reckoning and recommitment differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Annual reckoning and recommitment
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose exact start and end dates and a few safe records such as a calendar, finished work, ordinary
    commitments or private notes. Use five headings: who I have been becoming, what I served, harm or
    neglect, what changed, and what I received. A fictional year may be used for practice but is not personal
    evidence. Goal: Review a defined year for becoming, service, harm, change and received support, then
    choose a limited set of accountable commitments for the next season. Scope: This is a personal reckoning,
    not a score of worth or a requirement to disclose trauma, confess publicly or contact someone unsafely.
    A shorter available period must be labeled honestly rather than called a full year. Time and effort:
    Two 25-minute private review periods, one small follow-through action and a later check date. Adaptation:
    Use audio, drawings or a trusted reflective conversation with consent. Review one month or season
    when a year is unavailable, labeling the shorter scope. Grief, memory difficulty or limited records
    do not require forced reconstruction; appropriate support may matter more than completing an account.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use audio, drawings or a trusted reflective conversation with consent. Review one
    month or season when a year is unavailable, labeling the shorter scope. Grief, memory difficulty or
    limited records do not require forced reconstruction; appropriate support may matter more than completing
    an account.
  expected_burden: Two 25-minute private review periods, one small follow-through action and a later check
    date.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Annual reckoning and recommitment protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Annual reckoning and recommitment action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use audio,
    drawings or a trusted reflective conversation with consent. Review one month or season when a year
    is unavailable, labeling the shorter scope. Grief, memory difficulty or limited records do not require
    forced reconstruction; appropriate support may matter more than completing an account.
  actions:
  - stable_id: PRACTICE-COMP-2712-ANNUAL-RECKONING-AND-RECOMMITMENT-01-A1
    sequence: 1
    title: Ground the account in a few specific episodes
    instructions: 'Select five to eight episodes across the defined period, including something that went
      well, something difficult, an ordinary responsibility and a received good. Place them under the
      five headings, separating observable action from interpretation. Note missing months or unreliable
      memory rather than filling them with a favorable story. Ask how repeated conduct affected people
      and commitments, not whether the year proves you were a good or bad person. Keep other people’s
      private experiences out of the account unless their inclusion is appropriate and necessary.


      Observation checks: The review period and gaps in available evidence are explicit; Specific varied
      episodes support all five headings; Actions and interpretations are distinguished; The account avoids
      worth verdicts and unnecessary third-party disclosure. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2712-ANNUAL-RECKONING-AND-RECOMMITMENT-01
      action_stable_id: PRACTICE-COMP-2712-ANNUAL-RECKONING-AND-RECOMMITMENT-01-A1
