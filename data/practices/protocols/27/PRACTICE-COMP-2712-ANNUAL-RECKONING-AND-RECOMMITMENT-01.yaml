      1. No. Mark missing evidence as unknown. An annual account can cover the stated year while honestly
      limiting conclusions about undocumented months.


      2. The offer was sent through the stated welcome channel. Receipt, willingness to engage, forgiveness
      and relationship repair are not established; do not pursue a reply as proof of your progress.


      3. Reduce to a feasible limited set, at most three in this exercise and possibly just one. Specify
