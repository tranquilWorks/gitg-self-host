meaning_and_fit:
  purpose: Combine receiving guidance with a sustained, consented effort to strengthen another person’s
    capability and preserve a useful piece of knowledge.
  why_recommended: Combine receiving guidance with a sustained, consented effort to strengthen another
    person’s capability and preserve a useful piece of knowledge.
  claims:
  - statement: Combine receiving guidance with a sustained, consented effort to strengthen another person’s
      capability and preserve a useful piece of knowledge.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Mentorship and generativity practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mentorship and generativity as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use text, AAC, interpretation, screen-reader-friendly material or a different
    safe everyday skill. Without a willing learner, prepare and test the reminder alone but label mentorship
    transfer untested. Minors, vulnerable adults and formal training require the setting’s proper consent,
    safeguarding and supervision.
  opportunity_considerations: Use a safe everyday skill you can already perform. The supplied example
    is checking an event notice for date, location and required preparation. Use a fictional notice with
    those three facts, an experienced willing adviser or reliable public guide, and an adult learner who
    freely wants the help. No employment, parenting or mentoring role is presumed.
  prerequisites:
  - Use a safe everyday skill you can already perform. The supplied example is checking an event notice
    for date, location and required preparation. Use a fictional notice with those three facts, an experienced
    willing adviser or reliable public guide, and an adult learner who freely wants the help. No employment,
    parenting or mentoring role is presumed.
  dependencies: []
  safe_alternatives:
  - Use text, AAC, interpretation, screen-reader-friendly material or a different safe everyday skill.
    Without a willing learner, prepare and test the reminder alone but label mentorship transfer untested.
    Minors, vulnerable adults and formal training require the setting’s proper consent, safeguarding and
    supervision.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mentorship and generativity differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mentorship and generativity
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a safe everyday skill you can already perform. The supplied example is checking an event
    notice for date, location and required preparation. Use a fictional notice with those three facts,
    an experienced willing adviser or reliable public guide, and an adult learner who freely wants the
    help. No employment, parenting or mentoring role is presumed. Goal: Combine receiving guidance with
    a sustained, consented effort to strengthen another person’s capability and preserve a useful piece
    of knowledge. Scope: Two learning contacts sample generativity, not a claim of successful long-term
    mentorship. Do not teach beyond competence or substitute this exercise for licensed instruction, safeguarding
    or professional supervision. Time and effort: One short learning conversation or source study, two
    15-minute learner contacts over two weeks and a 10-minute review. Adaptation: Use text, AAC, interpretation,
    screen-reader-friendly material or a different safe everyday skill. Without a willing learner, prepare
    and test the reminder alone but label mentorship transfer untested. Minors, vulnerable adults and
    formal training require the setting’s proper consent, safeguarding and supervision. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, AAC, interpretation, screen-reader-friendly material or a different safe
    everyday skill. Without a willing learner, prepare and test the reminder alone but label mentorship
    transfer untested. Minors, vulnerable adults and formal training require the setting’s proper consent,
    safeguarding and supervision.
  expected_burden: One short learning conversation or source study, two 15-minute learner contacts over
    two weeks and a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mentorship and generativity protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mentorship and generativity action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, AAC,
    interpretation, screen-reader-friendly material or a different safe everyday skill. Without a willing
    learner, prepare and test the reminder alone but label mentorship transfer untested. Minors, vulnerable
    adults and formal training require the setting’s proper consent, safeguarding and supervision.
  actions:
  - stable_id: PRACTICE-COMP-2710-MENTORSHIP-AND-GENERATIVITY-01-A1
    sequence: 1
    title: Receive guidance before deciding what to teach
    instructions: 'Ask the adviser how a novice commonly misreads the notice and what practical check
      catches the mistake, or study an appropriate public guide and label it source learning rather than
      personal mentoring. Compare the lesson with your own method and preserve one correction with attribution.
      Ask the learner what they want to do independently and have them try one fictional notice before
      instruction. Keep the baseline attempt private and use it to choose help, not to rank the person.


      Observation checks: A received lesson or correction is retained with attribution; Source learning
      and interpersonal mentoring are distinguished; The learner chooses an independent capability goal;
      A private baseline attempt informs support without ranking worth. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2710-MENTORSHIP-AND-GENERATIVITY-01
      action_stable_id: PRACTICE-COMP-2710-MENTORSHIP-AND-GENERATIVITY-01-A1
      competency_stable_id: '27.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
