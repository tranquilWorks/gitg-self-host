  - stable_id: PRACTICE-COMP-2710-MENTORSHIP-AND-GENERATIVITY-01-A3
    sequence: 3
    title: Return to check capability rather than loyalty
    instructions: 'At the second contact, offer a fresh notice and let the learner perform the check with
      whatever support they normally need. Compare the result with the original baseline and ask which
      part of the help was useful or intrusive. Correct one issue only with permission and update the
      reminder together. Record independent success, supported success, remaining difficulty or no follow-up
      honestly. Name what you learned from the learner and how the knowledge could remain available without
      requiring your continued presence.


      Observation checks: A fresh follow-up task is compared with the baseline; Independent supported
      and unobserved outcomes remain distinct; The learner can critique or decline the help; Knowledge
      is preserved without making continued dependence the goal. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What can the learner now do with less unnecessary dependence, and what did receiving
      their feedback change in your own understanding?


      Examples: Supportive: After two willing contacts, the learner checked the fresh notice using their
      own accessible reminder and identified a confusing phrase that improved the teacher’s method.


      Mixed: The learner completed the first example with prompts, but the second contact did not occur
      and independent transfer remained unknown.


      Contradictory: Help became a loyalty test, required gratitude, exceeded the teacher’s competence
      or deliberately kept the learner dependent.


      Inconclusive: Advice was delivered once without a learner-chosen goal, baseline or follow-up opportunity.'
    expected_time: 15-25 minutes
