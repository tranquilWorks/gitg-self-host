  - stable_id: PRACTICE-COMP-2710-MENTORSHIP-AND-GENERATIVITY-01-A2
    sequence: 2
    title: Teach a small method and create another opportunity
    instructions: 'Demonstrate checking date, location and preparation while explaining why each matters.
      Let the learner try a different fictional notice through their preferred communication method, using
      prompts only where wanted. Ask them to show or explain the check in their own way rather than repeat
      your wording. Leave a short accessible reminder they control and agree a second opportunity within
      two weeks. Feedback and contact must be freely declinable; do not require gratitude or dependence.


      Observation checks: A small method is demonstrated with its purpose; The learner tries a different
      example with chosen support; Teach-back uses the learner’s own explanation or demonstration; An
      accessible reminder and freely agreed second opportunity are provided. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
