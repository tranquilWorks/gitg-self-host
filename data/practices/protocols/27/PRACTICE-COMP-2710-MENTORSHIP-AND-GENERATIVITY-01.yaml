  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      At the first contact Rae identifies all three facts in C only after the teacher asks, “Is there
      anything to bring or prepare?” Record supported success and that specific instructional hint. Rae
      says a shorter reminder would help; together they keep only “When / where / prepare / missing?”
      in Rae''s preferred accessible text.


      At the second contact eight days later, fresh notice D says: “Story circle: November 19, 18:00,
      Room P. Choose a short story to describe; listening only is also welcome.” Using normal text-to-speech
      but no instructional hint, Rae identifies the date/time, Room P and the choice of preparing a story
      or listening. Rae chooses listening. The teacher learns that the preparation check can identify
      a legitimate no-performance option. Both contacts take fifteen minutes. No actual event attendance
      or sustained mentorship outcome is supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Help the learner need your explanation less


      Mentorship combines receiving correction with making capability available to someone else. The evidence
      is what the learner can do with suitable access, not how generous the teacher feels or how closely
      the learner repeats the teacher''s words. Two contacts can reveal useful learning and limits; they
      cannot establish a lifetime of generativity.


      Allow fifteen minutes for source learning and preparation, two fifteen-minute learner contacts over
      two weeks in a live route, and ten minutes for review. The default supplies fictional contacts.
      [CDC''s communication guidance, S04](https://www.cdc.gov/ccindex/tool/how-to-use.html) emphasizes
      audience, main message and action. Studying that source is not receiving personal mentorship. The
      notice-checking method and responses below are original and are not a CDC assessment.


      Worked example: an experienced organizer suggests checking preparation as well as date and place.
      The novice teacher initially overlooked that part. Keeping the correction with attribution, then
      allowing a learner to try independently, preserves knowledge better than performing all checks on
      the learner''s behalf.


      ### Complete notice set and teaching materials


      The agreed skill is extracting three practical facts from a small event notice: date/time, location
      and required preparation. A suitable next step follows from those facts. There is no hidden answer
      based on typography or cultural knowledge.


      **Baseline notice A:** “Paper folding workshop: November 6, 14:00, Room L. Bring one sheet of scrap
      paper.” Fictional adult learner Rae freely agrees to practice. Rae initially identifies November
      6 at 14:00 and Room L but says nothing is needed. That is a missed preparation fact, not a judgment
      about intelligence.


      **Demonstration notice B:** “Map-reading discussion: November 9, 16:00, Room M. Read the supplied
      one-paragraph route description first.” The entire route description is: “The entrance is south
      of the hall. The reading room is east of the hall. Use the hall corridor; the west storage room
      is private.” There is no actual trip. Demonstrate circling or speaking each of the three facts and
      then naming the preparation action; explain why location alone would not prepare the attendee.


      **First try notice C:** “Drawing exchange: November 11, 15:00, Room N. Bring one existing drawing
      or a verbal description; no new work required.” Rae may use text-to-speech or another normal access
      aid. The teacher may ask whether help is wanted but must record a content hint if one is given.


      **Reminder to leave:** “When is it? Where is it? What must I prepare? If a fact is missing, ask
      the organizer rather than guess.” Rae controls whether to keep or change this reminder. No public
      name, recording or gratitude is requested. Both agree that a second check can occur within two weeks
      and either may decline.


      ### Receive, demonstrate, then observe without taking over


      1. Record the source lesson about clear action and the preparation fact missed at baseline. Label
      source study accurately; the worked adviser example is not an actual adviser event. Choose help
      that addresses the observed gap rather than giving a long generic lecture.

      2. Demonstrate B, then let Rae try C through the chosen mode. Preserve an answer before offering
      correction. Save this sequence before the [later packet](?resource=file-later-packet-md), which
      supplies the actual fictional responses and fresh follow-up notice.

      3. At follow-up distinguish independent use with ordinary access aids, success after an instructional
      hint, unresolved difficulty and no contact. Ask what helped or intruded only if welcome. Update
      the reminder together and name something the teacher learned from Rae.


      ### Capability belongs to the learner


      For support, use AAC, interpretation, accessible text or a harmless familiar skill you can actually
      teach. Without a willing learner, rehearse the reminder alone and label transfer untested. Teaching
      regulated tasks or working with minors/vulnerable adults requires the setting''s proper qualifications,
      consent and safeguarding; this source case supplies none.


      For a harder notice, one required fact is absent. Asking the responsible organizer is competent
      handling of uncertainty, not failure to memorize. At later actual contacts, use new materials and
      a suitable delay; avoid making the learner depend on your approval to apply the method. A preserved
      reminder and corrected teacher assumption can support future opportunity, but only real sustained
      follow-through could substantiate wider generativity.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


