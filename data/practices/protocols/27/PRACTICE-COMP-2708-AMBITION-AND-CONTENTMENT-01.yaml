  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Mel spends twenty minutes Tuesday rewriting Draft 1 into Draft 2. On Thursday Mel spends twelve
      minutes trying a friendlier opening, then three minutes with the willing reader, who identifies
      taking an available game from shelf A and filling the loan card as the next actions without instructional
      hints. Mel uses the last five minutes to restore the shorter Draft 2, save it and record the decision.
      Work stops at 18:00, and the planned quiet period begins. The reader has not actually borrowed or
      returned a game. Mel still feels an urge to polish and does not report a grateful or contented mood.


      The two work periods total forty minutes, including the three-minute check. Necessary textual function
      and one next-action check are supported; complete end-to-end use remains untested. No rest debt
      or claim of effortless detachment is created.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Give excellence a purpose and enoughness a boundary


      Ambition is useful when effort improves something that matters. It becomes harder to govern when
      every finished version immediately creates a new condition for deserving rest. Contentment need
      not mean lowering necessary standards; it can mean recognizing what the work already does while
      choosing which refinement is worth its cost.


      Allow fifteen minutes to set standards, two twenty-minute work periods in a live route, and ten
      minutes to review. The default uses supplied drafts and a fictional reader. [CDC''s communication
      guidance, S04](https://www.cdc.gov/ccindex/tool/how-to-use.html) supports identifying an audience,
      a main message and an intended action. Its public-health index is not applied as a score here, and
      no CDC endorsement or actual reader test is claimed.


      Worked example: a clear cupboard label works, but its maker keeps replacing the lettering after
      seeing an elegant display online. If the label''s location is wrong, correction is necessary. If
      its wording is usable and only the decoration differs, a stopping decision can preserve both useful
      work and an existing rest commitment.


      ### A complete small guide to improve


      The fictional audience is an adult using a shared board-game cupboard. The exact agreed procedure
      is: take one available game from shelf A; write its title and today''s date on the paper loan card;
      return it to shelf A before the room closes at 18:00; if any pieces are missing, tell the room steward
      rather than returning an apparently complete set. No public names, contact details or real records
      are used.


      **Draft 1:** “Games are here. Borrow one properly and bring it back later. Be considerate.” It sounds
      pleasant but omits the loan card, location, deadline and missing-piece route.


      **Draft 2:** “To borrow one available game, take it from shelf A and write its title and today''s
      date on the paper loan card. Return it to shelf A before 18:00. Tell the room steward if pieces
      are missing.” This contains the required procedure; actual reader use still needs checking.


      Fix three sufficiency checks before judging either draft: purpose is clear, necessary steps are
      present and a willing reader can identify the next action. A stretch refinement is a friendlier
      opening sentence, provided it does not bury the steps. A comparison-pressure card says, “A polished
      online guide looks more professional than mine.” That feeling supplies no new requirement. The protected
      present good is an already permitted quiet period after 18:00, not a prize that must be earned by
      perfect wording.


      The fictional author, Mel, has work periods Tuesday 17:00–17:20 and Thursday 17:40–18:00. The willing
      reader agrees to a brief check within the second period and can decline. No care or workplace safety
      standard is negotiable here.


      ### Evaluate the work and the urge to keep going separately


      1. Mark which sufficiency checks Draft 1 cannot meet from the text. Compare Draft 2 without assuming
      the reader check has happened. Write the optional refinement and stopping times beside the unchanged
      purpose.

      2. Save the standards, then read the [later packet](?resource=file-later-packet-md). Judge actual
      reader behavior separately from the author''s preference. Record the stop and protected quiet period
      without manufacturing contentment or gratitude.

      3. Choose release of a usable version, completion of one necessary gap, or leaving the optional
      refinement. Name one improvement due to effort and one extra demand that served comparison rather
      than the reader. A neutral mood is compatible with a sound stopping decision.


      ### Keep essential quality while making room for sufficiency


      Use a spoken guide, accessible text or a smaller task. A helper may make the text available but
      should not silently supply the next action during the reader check. For a harder case, the guide
      omits the missing-piece route: that is a purpose-related gap, not optional polish. Save it and schedule
      a suitable correction instead of either releasing incomplete instructions or ignoring the protected
      boundary.


      At a later real project, define necessary checks and one worthwhile stretch before working. Receive
      available help, rest or an ordinary relationship without treating it as debt to repay with achievement.
      Sustained excellence may require many revisions across time; it does not require making today''s
      dignity conditional on them. The supplied case establishes one bounded effort and review, not a
      general measure of ambition or psychological well-being.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
