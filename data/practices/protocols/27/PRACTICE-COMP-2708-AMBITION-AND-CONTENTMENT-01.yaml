  - stable_id: PRACTICE-COMP-2708-AMBITION-AND-CONTENTMENT-01-A3
    sequence: 3
    title: Review ambition and enoughness together
    instructions: 'Compare the artifact with the sufficiency and stretch standards separately. Name what
      improved through effort and what remains unfinished, then choose finish one necessary gap, release
      the usable version or consciously leave the refinement. Receive the protected rest or present good
      without converting it into a reward you must repay. Record any urge to move the goalposts and whether
      it served the artifact’s purpose rather than status comparison.


      Observation checks: Necessary function and optional refinement receive separate judgments; The next
      disposition reflects the artifact’s actual purpose; Protected rest or appreciation is not made conditional
      on perfection; A moved standard is examined for purpose versus status pressure. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which effort genuinely improved the work, and which extra demand merely postponed
      permission to rest or recognize what was already good?


      Examples: Supportive: The guide met its three use checks, one sentence was refined and the person
      stopped for the protected commitment without denying remaining imperfections.


      Mixed: The project improved, but the stopping time slipped and the protected rest needed a revised
      boundary.


      Contradictory: Essential quality was ignored in the name of contentment, or dignity and rest were
      withheld until an ever-rising performance target was reached.


      Inconclusive: An aspiration and a gratitude statement were written without bounded effort or a sufficiency
      review.'
