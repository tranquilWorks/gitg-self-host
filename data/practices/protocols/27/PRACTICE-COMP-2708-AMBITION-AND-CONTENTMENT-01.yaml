meaning_and_fit:
  purpose: Combine a bounded effort toward excellence with an honest sufficiency standard, protected rest
    and appreciation that does not depend on future achievement.
  why_recommended: Combine a bounded effort toward excellence with an honest sufficiency standard, protected
    rest and appreciation that does not depend on future achievement.
  claims:
  - statement: Combine a bounded effort toward excellence with an honest sufficiency standard, protected
      rest and appreciation that does not depend on future achievement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Ambition and contentment practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Ambition and contentment as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a smaller output, adapted craft method, spoken guide or supported reader
    check. Appreciation can be simple acknowledgement; a positive mood is not required. Required safety
    or professional standards are not negotiable sufficiency experiments.
  opportunity_considerations: 'Use a small original craft, explanation or household organization project
    already within safe ability. The supplied example is a one-page guide that another person can actually
    follow. Draw two headings: good enough for its purpose and worthwhile refinement. Set two short effort
    windows with a stopping time that protects an existing rest or care commitment.'
  prerequisites:
  - 'Use a small original craft, explanation or household organization project already within safe ability.
    The supplied example is a one-page guide that another person can actually follow. Draw two headings:
    good enough for its purpose and worthwhile refinement. Set two short effort windows with a stopping
    time that protects an existing rest or care commitment.'
  dependencies: []
  safe_alternatives:
  - Use a smaller output, adapted craft method, spoken guide or supported reader check. Appreciation can
    be simple acknowledgement; a positive mood is not required. Required safety or professional standards
    are not negotiable sufficiency experiments.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Ambition and contentment differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Ambition and contentment as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a small original craft, explanation or household organization project already within safe
    ability. The supplied example is a one-page guide that another person can actually follow. Draw two
    headings: good enough for its purpose and worthwhile refinement. Set two short effort windows with
    a stopping time that protects an existing rest or care commitment. Goal: Combine a bounded effort
    toward excellence with an honest sufficiency standard, protected rest and appreciation that does not
    depend on future achievement. Scope: This practices one relationship to ambition, not a prescription
    to lower needed standards, abandon commitments or feel content during hardship. Human dignity is not
    conditional on output. Time and effort: Fifteen minutes to set standards, two 20-minute effort periods
    and a 10-minute review. Adaptation: Use a smaller output, adapted craft method, spoken guide or supported
    reader check. Appreciation can be simple acknowledgement; a positive mood is not required. Required
    safety or professional standards are not negotiable sufficiency experiments. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a smaller output, adapted craft method, spoken guide or supported reader check.
    Appreciation can be simple acknowledgement; a positive mood is not required. Required safety or professional
    standards are not negotiable sufficiency experiments.
  expected_burden: Fifteen minutes to set standards, two 20-minute effort periods and a 10-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Ambition and contentment protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Ambition and contentment action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a smaller
    output, adapted craft method, spoken guide or supported reader check. Appreciation can be simple acknowledgement;
    a positive mood is not required. Required safety or professional standards are not negotiable sufficiency
    experiments.
  actions:
  - stable_id: PRACTICE-COMP-2708-AMBITION-AND-CONTENTMENT-01-A1
    sequence: 1
    title: Separate sufficiency from the stretch
    instructions: 'Define three observable sufficiency checks for the example: the purpose is clear, the
      necessary steps are present and a willing reader can find the next action. Name one refinement,
      such as making the wording more elegant, that is desirable but not required for basic use. Identify
      the comparison pressure that could keep raising the standard and write one present good not earned
      by the project, such as available help, a relationship or a permitted period of rest.


      Observation checks: Three purpose-based sufficiency checks are fixed; One stretch improvement is
      distinguished from necessary function; A comparison pressure is named without making it authoritative;
      A present good is recognized without requiring project success. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
