  - stable_id: PRACTICE-COMP-2708-AMBITION-AND-CONTENTMENT-01-A2
    sequence: 2
    title: Work seriously and stop at the agreed limit
    instructions: 'Use the first effort window to meet the sufficiency checks and the second, if needed
      and feasible, for the chosen refinement. Obtain a willing reader’s practical next-action check or
