    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Ellis submits the question in the accepted message book on Tuesday at 15:40. The coordinator acknowledges
      it at 15:50, before the 16:00 deadline, and includes it in the Wednesday agenda. The question accurately
      describes the proposed move, fairly includes craft and quiet-use needs, and asks about the unverified
      lighting while preserving the access route. These supplied facts meet the three bounded checks through
      the written route.


      No meeting attendance, spoken exchange, lighting inspection, decision, implementation or eventual
      noise outcome is supplied. A separate comparison case has an equally clear draft left unsent: that
      case shows preparation but not contribution. In another comparison case the channel refuses a timely
      suitable submission because it requires speech despite the stated written option: that is an access
      barrier, not evidence that the person cannot understand or contribute.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Preserve the purpose while changing the route


      A standard practice may assume mobility, speech, a particular schedule, family form, cultural custom
      or faith. Those assumptions can obscure the capability the practice was intended to develop. An
      equivalent pathway preserves a defensible underlying purpose and an accepted way to demonstrate
      it while changing unnecessary demands. It need not resemble the standard route. Nor does merely
      calling an alternative equivalent make it meet every qualification, safety rule, consent requirement
      or genuine outcome.


      Use this fictional community planning case in twenty minutes, then inspect the supplied later response.
      No diagnosis or private conscience statement is required. W3C''s accessible-events guidance [S05](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)
      supports accessible information and participation modes. The three purpose checks below are original
      teaching criteria; they are not WCAG conformance, legal accommodation approval or a validated capability
      measure.


      ### A complete agenda with more than one participation mode


      The standard suggestion says, “Attend the evening meeting and speak aloud.” The actual bounded purpose
      is to understand one shared issue, account for another affected perspective and contribute a relevant
      question through an accepted route. Live spoken dialogue is a different additional capability and
      is not required for these three checks.


      **Agenda item:** A fictional shared reading room has one quiet corner and one activity table. The
      proposal is to move the activity table beside the quiet corner every Wednesday from 17:00 to 18:00
      for a craft session. No vote or decision has yet occurred.


      **Complete supplied notes:** Existing quiet-corner users need low noise to read or process text.
      Craft participants need a usable table and conversation to explain their work. A coordinator says
      the far wall also has space for the activity table, but its lighting has not been checked. The existing
      clear access route must remain clear. The coordinator accepts relevant written questions received
      in the message book by Tuesday at 16:00, will acknowledge receipt and will include accepted questions
      in the Wednesday agenda. Acknowledgment does not promise a particular answer or decision.


      Fictional participant Ellis cannot use the evening spoken route in this case and chooses accessible
      text. The reason may remain private. An authorized supporter may transcribe Ellis''s chosen words
      without replacing Ellis''s viewpoint. A remote route is not assumed available: it requires confirmation.
      A written route is explicitly accepted here, so it can meet the contribution check when the question
      actually reaches that route.


      A worked draft states: “The proposal would place conversational activity beside the quiet area on
      Wednesdays. Craft users need a table, while quiet-corner users need lower noise. Could the far-wall
      lighting be checked before choosing the table location, while preserving the access route?” This
      identifies the issue, includes another perspective and asks something relevant. The unsent draft
      satisfies preparation only; the contribution check remains open until the authorized channel receives
      it.


      ### Define equivalence before judging performance


      1. Separate the purpose from attendance and speech. Write three checks: accurately identify the
      proposed change; fairly account for an affected perspective beyond one''s own; submit a relevant
      question through the accepted route. Do not add eloquence, stamina, a diagnosis or agreement with
      the proposal as hidden conditions.

      2. Choose the accessible text route, use the complete notes and make an original question or adapt
      the worked draft. Record who selected the substance if a supporter transcribes it. Check the Tuesday
      deadline and accepted channel. Save the draft and expected evidence before reading the [later packet](?resource=file-later-packet-md).

      3. Compare actual receipt and agenda inclusion with the three checks. If the channel rejects a suitable
      contribution, record a barrier and seek a workable authorized alternative if welcome; do not reinterpret
      exclusion as incapability. If the question itself misstates the proposal, correct that substantive
      error. Route access and content quality are related but separate issues.


      ### Alternatives keep both dignity and honest limits


      For support, use AAC, an accessible summary containing all supplied facts, interpretation or transcription
      under the participant''s control. Without a confirmed receiving route, label the work preparation
      and leave contribution untested. For a harder case, a qualification specifically requires a safe
      live demonstration: negotiate a legitimate adapted demonstration with the responsible body; a worksheet
      cannot self-authorize equivalence.


      At a later real opportunity, test another mode that fits the person''s culture, faith, vocation,
      disability, family circumstances and actual setting. Do not assume every person in a group wants
      the same adaptation. This one case shows how the bounded purpose can be met; it does not measure
      all flourishing, establish live dialogue skill or prove the eventual room decision fair.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. An accurate written question is saved privately but never reaches an accepted channel. Which
      check remains open?


      2. A supporter transcribes a participant''s own chosen words. Does the support itself invalidate
      the contribution?


      3. A written planning question meets all three checks. Does it also establish a safety qualification
      requiring a live demonstration?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. Contribution remains open. Accurate issue understanding and perspective-taking may be shown in
      the draft, but preparing a question is different from submitting it through an accepted route.


      2. No. Preserve whose ideas and choices the text represents and record the support. Transcription
      or AAC can enable the same bounded purpose without requiring an unsupported mode of performance.


      3. No. The demonstrated scope is the defined planning purpose. A qualification, safety requirement
      or live dialogue skill needs its own authorized and suitable evidence; this alternative does not
      replace those requirements by assertion.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
