  - stable_id: PRACTICE-COMP-2714-MULTIPLE-PATHWAYS-TO-FLOURISHING-01-A3
    sequence: 3
    title: Compare function and remaining limits fairly
    instructions: 'Review the adapted attempt against the purpose checks rather than resemblance to the
      original format. Ask what was preserved, what changed and what remains untested, such as live dialogue
      when only written exchange occurred. Obtain willing feedback when relevant and revise one barrier
      or next step. Do not claim equal expertise from different evidence, but do not discount a useful
      contribution merely because it used assistance or a culturally different form.


      Observation checks: The comparison uses purpose rather than surface resemblance; Preserved function
      changed form and untested transfer are separated; Feedback or an observed barrier informs one revision;
      Support is not treated as lesser worth or automatic equivalence of evidence. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What part of the original task was essential to its purpose, and what part could change
      without losing the contribution?


      Examples: Supportive: A written contribution through an accepted accessible channel met the issue,
      perspective and relevance checks, while live dialogue remained explicitly untested.


      Mixed: The alternative preserved understanding but the submission route was unavailable, so contribution
      remained blocked rather than counted.


      Contradictory: An inaccessible format was treated as a moral deficit, or a rehearsal was declared
      equivalent to a required qualification or actual participation.


      Inconclusive: An alternative format was named without a purpose test, accepted route or adapted
      attempt.'
