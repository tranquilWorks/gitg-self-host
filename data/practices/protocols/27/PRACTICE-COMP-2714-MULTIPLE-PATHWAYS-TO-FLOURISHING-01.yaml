meaning_and_fit:
  purpose: Adapt a standard developmental task to disability, culture, vocation, faith, family structure
    or circumstance while preserving its meaningful capability or contribution.
  why_recommended: Adapt a standard developmental task to disability, culture, vocation, faith, family
    structure or circumstance while preserving its meaningful capability or contribution.
  claims:
  - statement: Adapt a standard developmental task to disability, culture, vocation, faith, family structure
      or circumstance while preserving its meaningful capability or contribution.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Multiple pathways to flourishing practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Multiple pathways to flourishing as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: The exercise itself may be completed through AAC, interpretation, audio, tactile
    material or a trusted facilitator. Choose an alternative compatible with conscience and legitimate
    community boundaries. For regulated, clinical or safety-critical tasks, obtain the proper accessible
    assessment and qualified guidance rather than declaring an informal substitute equivalent.
  opportunity_considerations: Use the supplied standard task attend an in-person community meeting and
    speak. Its possible purpose is understand a shared issue and make a relevant contribution, not prove
    comfort with a particular room or speaking style. Alternatives include an accessible remote meeting,
    a written contribution through an accepted channel or a supported conversation authorized by the organizer.
  prerequisites:
  - Use the supplied standard task attend an in-person community meeting and speak. Its possible purpose
    is understand a shared issue and make a relevant contribution, not prove comfort with a particular
    room or speaking style. Alternatives include an accessible remote meeting, a written contribution
    through an accepted channel or a supported conversation authorized by the organizer.
  dependencies: []
  safe_alternatives:
  - The exercise itself may be completed through AAC, interpretation, audio, tactile material or a trusted
    facilitator. Choose an alternative compatible with conscience and legitimate community boundaries.
    For regulated, clinical or safety-critical tasks, obtain the proper accessible assessment and qualified
    guidance rather than declaring an informal substitute equivalent.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Multiple pathways to flourishing differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Multiple pathways to flourishing
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied standard task attend an in-person community meeting and speak. Its possible
    purpose is understand a shared issue and make a relevant contribution, not prove comfort with a particular
    room or speaking style. Alternatives include an accessible remote meeting, a written contribution
    through an accepted channel or a supported conversation authorized by the organizer. Goal: Adapt a
    standard developmental task to disability, culture, vocation, faith, family structure or circumstance
    while preserving its meaningful capability or contribution. Scope: Equivalent purpose does not mean
    identical format or an automatic claim of equal evidence. Adaptations cannot replace required professional
    qualification, safety, consent or a real-world outcome with a worksheet. Time and effort: Twenty minutes
    to identify the purpose and barrier, one adapted attempt and a 15-minute comparison. Adaptation: The
    exercise itself may be completed through AAC, interpretation, audio, tactile material or a trusted
    facilitator. Choose an alternative compatible with conscience and legitimate community boundaries.
    For regulated, clinical or safety-critical tasks, obtain the proper accessible assessment and qualified
    guidance rather than declaring an informal substitute equivalent. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. The exercise itself may be completed through AAC, interpretation, audio, tactile
    material or a trusted facilitator. Choose an alternative compatible with conscience and legitimate
    community boundaries. For regulated, clinical or safety-critical tasks, obtain the proper accessible
    assessment and qualified guidance rather than declaring an informal substitute equivalent.
  expected_burden: Twenty minutes to identify the purpose and barrier, one adapted attempt and a 15-minute
    comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Multiple pathways to flourishing protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Multiple pathways to flourishing action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. The exercise
    itself may be completed through AAC, interpretation, audio, tactile material or a trusted facilitator.
    Choose an alternative compatible with conscience and legitimate community boundaries. For regulated,
    clinical or safety-critical tasks, obtain the proper accessible assessment and qualified guidance
    rather than declaring an informal substitute equivalent.
  actions:
  - stable_id: PRACTICE-COMP-2714-MULTIPLE-PATHWAYS-TO-FLOURISHING-01-A1
    sequence: 1
    title: Find the purpose behind the prescribed form
    instructions: 'Write the standard task, its intended capability or contribution and three observable
      signs of that purpose. For the default: identify the issue accurately, account for another relevant
      perspective and submit a pertinent question or contribution through an accepted route. Identify
      the actual barrier and its context without demanding a diagnosis or intimate disclosure. Consider
      whether disability, culture, vocation, faith, family structure or current circumstance affects fit;
      these are possible contexts, not a checklist everyone must personally represent.


      Observation checks: The prescribed form is separated from its intended purpose; Three observable
      purpose checks are specified; The actual barrier is identified without compelled disclosure; Different
      life contexts are treated as possible legitimate pathways. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2714-MULTIPLE-PATHWAYS-TO-FLOURISHING-01
