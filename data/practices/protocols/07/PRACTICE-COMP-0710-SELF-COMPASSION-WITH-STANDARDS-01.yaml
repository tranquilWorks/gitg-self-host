  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Dana keeps the planned rest and sends the truthful update at 08:00. Rem replies at 08:07, accepting
      the reduced three-card summary with a rule and example on each card but no practice questions but
      reducing the joint practice from thirty to fifteen minutes. Dana works from 08:15 to 08:33, correctly
      writes the rule and all three examples, and sends the summary at 08:34. Rem acknowledges it at 08:40,
      before 09:00.


      The renewed attempt took eighteen of twenty available minutes. The lost fifteen minutes of joint
      practice remain a consequence. Dana still feels disappointed about the original miss. Care, notice,
      consent and a feasible task occurred together, so this case does not isolate which factor caused
      follow-through or prove that punishment would have had a particular result.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make care support a standard you can still name


      Self-compassion is not a claim that nothing mattered. It means responding to suffering or failure
      with care while retaining responsibility, effort and consequences. Punishment attacks worth or withholds
      basic care; indulgence denies an impact or removes every standard. Accountable care names the failure
      accurately and makes the next useful action feasible.


      Use two fifteen-minute passes and one twenty-minute renewed attempt in the supplied case. CCI''s
      self-compassion overview [S05](https://www.cci.health.wa.gov.au/Resources/Looking-After-Yourself/Self-Compassion)
      describes responding with care rather than self-criticism. This guide does not implement its workbook,
      claim a biological mechanism or prove that a compassionate sentence changes symptoms. The care–repair–consequence
      distinction comes from the curriculum and this original fictional example.


      ### A missed preparation commitment


      Fictional Dana planned a sixty-minute study session on Tuesday from 20:00 to 21:00 and promised
      partner Rem a three-card summary with a rule, a worked example and two practice questions on each
      card by Wednesday 09:00. Dana had overfilled Tuesday with optional errands and missed the study
      session. Rem had expected the summary for a joint practice at 09:30 and can still use a shorter
      accurate version if warned before 09:00. No safety, exam or employment consequence is involved.


      The complete study material is a fictional sorting rule: cards naming a future date go to NEXT;
      cards naming today go to TODAY; earlier dates go to PAST; a missing date goes to ASK. For this task
      today is May 10. The intended summary has one rule sentence and these three examples: May 11 → NEXT;
      May 10 → TODAY; no date → ASK. No external textbook or private record is needed.


      Dana''s punishing line is, “I do not deserve sleep until I make up all sixty minutes.” The indulgent
      line is, “Missing preparation has no effect and Rem should adapt without notice.” Both distort the
      situation. A worked accountable-care line is: “I overfilled the evening and missed promised preparation.
      I still need rest, and Rem needs a truthful update and usable material.” The real consequence may
      be a shorter joint practice; it is not a reason to remove care.


      Dana''s plan distinguishes three actions. Care: retain the ordinary planned sleep instead of a punitive
      late session. Repair: send a brief accurate update through the already welcome message channel at
      08:00. Revised effort: use an available 08:15–08:35 window for a reduced three-card summary containing
      only the rule and one worked example on each card, omitting all six practice questions. The new
      twenty-minute limit is a feasible task boundary, not a clinical sleep or study prescription. Rem
      remains free to decline the shorter arrangement.


      ### Observe what the renewed action actually supports


      1. Record expectation, event, effect, choice and constraint. Own optional overscheduling without
      turning it into a global trait. Compare the two inaccurate responses and write one accountable-care
      sentence. Preserve the original promised result and deadline so a smaller task does not silently
      erase them.

      2. Separate care, repair, consequence and renewed attempt. Check that the proposed twenty minutes
      can produce the stated shorter summary and that Rem consents to the changed arrangement. Save the
      plan before the [later packet](?resource=file-later-packet-md). A good intention or kind phrase
      is not yet performed repair.

      3. Review the actual update, attempt, material and consequence. If the restart fails, record that
      and adjust task size, support or timing; do not prescribe harsher self-attack. If it succeeds, the
      sequence supports one feasible restart, not a controlled comparison proving what caused it.


      For support, use dictation, a checklist or the supplied sorting task. In a real case, basic care
      is not conditional on completing repair. For a harder case, the affected person cannot accept a
      smaller output: state the unresolved consequence and renegotiate appropriately rather than calling
      the new task equivalent.


      Later transfer can check whether another commitment is realistically sized and actually kept. Severe
      persistent self-criticism, impairment or self-harm risk needs qualified or urgent support as appropriate.
      Fictional follow-through cannot establish psychological recovery, self-esteem or a person''s deservingness.


      ### Use the result at its proper scale


      Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
      care.


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A person owes a repair. Must ordinary sleep or food be withheld until the other person forgives
      them?


      2. A new eighteen-minute attempt succeeds after rest, notice and a smaller task. Does this prove
      the kind sentence alone caused success?


      3. A partner accepts a shorter practice after a missed commitment. May the review erase the lost
      fifteen minutes?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Keep basic care available while pursuing appropriate accountability. Repair does not buy
      permission for care, and another person''s forgiveness cannot be demanded.


      2. No. Several conditions changed. Record the performed sequence and usable result without claiming
      a controlled causal comparison or a therapeutic effect.


      3. No. Acceptance of the new plan does not undo the original consequence. Preserve the lost time,
      actual consent and renewed effort together.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
