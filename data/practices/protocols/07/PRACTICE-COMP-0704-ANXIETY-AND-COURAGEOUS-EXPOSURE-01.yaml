  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A2
    sequence: 2
    title: Approach the same manageable step twice
    instructions: 'Attempt the selected step on two separate safe occasions without escalating merely
      to prove courage. Before each, record the predicted outcome and expected distress; afterward record
      the observed outcome, peak distress and whether you stayed long enough to complete the step. Stop
      if risk changes or distress exceeds the preset limit, and do not count a stopped attempt as failure.


      Observation checks: Two attempts or an explicit safety stop are recorded; Prediction and observed
      outcome are compared each time; Distress stays within the preset boundary or triggers stopping;
      Completion is not equated with fear disappearing. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01
      action_stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A2
      competency_stable_id: '07.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
