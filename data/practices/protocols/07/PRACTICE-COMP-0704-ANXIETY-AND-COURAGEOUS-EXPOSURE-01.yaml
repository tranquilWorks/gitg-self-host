        expected: true
  - stable_id: PRACTICE-COMP-0704-ANXIETY-AND-COURAGEOUS-EXPOSURE-01-A3
    sequence: 3
    title: Revise the prediction and decide the next bounded step
    instructions: 'Compare both attempts. Narrow, retain or revise the prediction based on what actually
      happened, including partial feared outcomes. Choose to repeat, take the next small step, defer or
      seek qualified help; give the reason. A rehearsal never counts as completing the real meeting step,
      and worsening or function-limiting anxiety is a reason for professional support.


      Observation checks: Both attempts inform the revised prediction; Partial or adverse outcomes are
      retained; The next step repeat defer or help route has a reason; No treatment or broad anxiety improvement
      is claimed. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What did the two attempts show about the feared prediction, and what is the safest
      honest next step?


      Examples: Supportive: The routine question was rehearsed and asked twice; one answer was brief but
      no ridicule occurred, so the prediction was narrowed rather than erased.


      Mixed: The person completed both attempts, but distress remained high enough that repeating the
      same step is more appropriate than advancing.


      Contradictory: A trauma trigger or dangerous encounter was deliberately provoked, or essential support
      was removed to make the attempt harder.


      Inconclusive: A ladder was written but no step was attempted and rehearsal was reported as real-world
      exposure.'
    expected_time: 15-25 minutes
    due_within_days: 10
