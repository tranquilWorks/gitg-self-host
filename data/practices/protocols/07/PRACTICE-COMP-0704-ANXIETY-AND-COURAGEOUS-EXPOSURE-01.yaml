  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      At the first appropriate question period Asha asks about shared scissors with the written card available.
      The facilitator answers yes, and no member makes the predicted comment. Expected distress was 3/10;
      reported peak was 4/10. The five-minute participation period is completed without pressure to stay
      until calm.


      A week later Asha asks the cardboard question through the same allowed speaking route with the card
      available. One member says, “That was in the notice,” and the facilitator confirms that extra cardboard
      is optional. Expected distress was 3/10 and peak 4/10; Asha completes the five-minute period. The
      feared response partly occurred, and distress did not decrease between attempts. Asha chooses to
      repeat a suitable small question when useful rather than automatically advancing. No disorder outcome,
      global rejection or loss of access support is supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Test an ordinary prediction without proving toughness


      A worthwhile action can feel uncomfortable even when the situation is suitable and safe. A small
      approach can test a specific prediction, provided the step, actual conditions, access supports and
      stopping choice are clear. It cannot guarantee approval or certify that a larger situation is safe.
      Fear is not a moral failure, and stopping is legitimate.


      Allow twenty minutes to prepare the supplied ladder, two separate five-minute attempts and ten minutes
      to compare. NHS guidance on facing fears [S03](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/facing-your-fears/)
      describes gradual approach. This exercise uses a narrower ordinary participation case. It does not
      adopt the page''s stay-until-fear-halves instruction, remove supports or provide treatment for anxiety
      disorders, trauma, panic, OCD or phobias. Clinical exposure needs an appropriate qualified plan.


      ### A small question in a familiar setting


      Fictional adult Asha attends a voluntary craft-planning group whose facilitator explicitly welcomes
      routine questions. Members can speak, submit text or pass. No grades, employment decisions, hostile
      participant or serious consequence is involved. Asha''s aim is to know what material is already
      provided, not to become a confident public speaker.


      The complete notice says: “At the next session, paper and pencils are provided. Bring scissors only
      if you already have suitable ones; shared pairs will be available.” Asha''s question is: “May I
      use the shared scissors rather than bring my own?” This is low-stakes clarification even though
      the notice partly answers it. The actual feared prediction is: “Someone will say I should already
      know the answer.” Asha assigns it a rough 60-percent expectation, which is a subjective estimate,
      not calibrated probability.


      The supplied ladder is: write the question privately, expected distress 1/10; say it to a willing
      trusted member outside the meeting, 2/10; ask during the familiar group''s question period using
      a written card if wanted, 3/10. The source exercise''s local ceiling is 4/10. That number is not
      a general safety threshold: real threat, coercion, medical risk or a trauma cue excludes a live
      attempt regardless of rating. Asha chooses the third step freely in this fiction and will repeat
      that same step on two appropriate occasions without escalating.


      The second occasion''s complete notice concerns cardboard: “Cardboard is supplied; extra pieces
      are optional.” Its question is, “Is bringing extra cardboard optional?” Before each attempt Asha
      records the prediction and expected distress. During an attempt Asha may stop whenever desired,
      must stop this exercise if risk changes or the chosen ceiling is exceeded, and keeps all ordinary
      access supports. No one is instructed to endure until distress falls.


      ### Compare a prediction with two actual records


      1. Separate the participation aim, observable feared outcome and unsupported global story. “A member
      says this was already covered” could support part of the prediction; “everyone thinks I am incapable”
      cannot be established from silence. Check suitability before considering a rating.

      2. Save the chosen step, support, stop condition and predicted outcome before the [later packet](?resource=file-later-packet-md).
      In a real version use only naturally suitable occasions and repeat the same manageable step. Writing
      alone remains preparation for the meeting step, not equivalent live evidence.

      3. Compare both observations, including partial feared outcomes and unchanged discomfort. Decide
      to repeat, use another accessible route, defer or seek qualified support. There is no automatic
      ladder promotion. One comment does not establish universal rejection; one kind answer does not disprove
      every concern.


      For support, use text, AAC, an interpreter or a trusted companion if appropriate. These are not
      aids to strip away as proof of courage. For a harder case, the group becomes hostile or the topic
      gains serious consequences: reassess and stop the experiment rather than applying the old rating.
      Persistent, worsening or function-limiting anxiety belongs with qualified care. The supplied exercise
      rehearses evidence comparison, not clinical recovery.


      ### Use the result at its proper scale


      Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
      care.


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A person rates a situation 2/10, but it involves a threatening person. Is the rating permission
      to proceed?


      2. The first attempt has no critical remark; the second has one and both peak at 4/10. Must the
      second be hidden as a failed exercise?


      3. A learner uses an ordinary speech device or written card. Must that support be removed before
      the attempt counts?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Actual threat excludes this self-guided exercise regardless of a low rating. Prioritize safety
      and appropriate support; a local distress number cannot certify safety.


      2. No. Retain the partial feared outcome and unchanged ratings. Compare the bounded prediction with
      both observations, then freely repeat, adapt, defer or seek support without a required escalation.


      3. No. Preserve suitable communication and prescribed supports. Judge the defined participation
      task through the chosen accessible mode, not unsupported endurance or a forced performance style.'
    criteria:
