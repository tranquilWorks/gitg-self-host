        criteria:
        - two_attempts_or_an_explicit_safety_stop_are_recorded
        - prediction_and_observed_outcome_are_compared_each_time
        - distress_stays_within_the_preset_boundary_or_triggers_stopping
        - completion_is_not_equated_with_fear_disappearing
      - measurement_id: c0704_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
