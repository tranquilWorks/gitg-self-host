        expected: true
  - stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A3
    sequence: 3
    title: Attempt, compare and preserve an adverse result
    instructions: 'Make the bounded renewed attempt when conditions are appropriate. Compare result, effort
      and constraints with the failed attempt. Keep evidence that the change did not help, created a new
      cost or was not attempted; then repeat, revise, seek support or stop with a reason. Resilience here
      is honest adaptation, not speed, toughness or uninterrupted output.


      Observation checks: A renewed attempt or explicit deferral is recorded; Result effort and conditions
      are compared with the setback; Adverse or null effects remain in the review; The next decision follows
      evidence rather than toughness. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which changed variable earned another test, and which part of the setback should remain
      unresolved rather than converted into a lesson?


      Examples: Supportive: The person separated overscheduling from an unexpected interruption, rested,
      reduced the task and completed the revised entry-area goal.


      Mixed: The restart occurred, but changing both timing and tools made the useful variable unclear.


      Contradictory: The setback was romanticized, outside harm was blamed on character or recovery needs
      were treated as excuses.


      Inconclusive: A motivational statement replaced the factual debrief and no variable was tested.'
    expected_time: 15-25 minutes
    due_within_days: 10
