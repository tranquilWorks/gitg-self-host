  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Alex takes the planned break and confirms the destinations with Bo. On the later day the table-only
      attempt lasts eighteen minutes with no delivery interruption. Five known items reach the authorized
      destinations. The unidentified key remains in the agreed holding dish on the table; its owner is
      still unknown. The shelf is unchanged.


      The table is usable, but moving Bo''s sealed envelope to Bo''s tray reveals that the tray is already
      crowded. Bo agrees the envelope can remain there today and asks that future moves wait until there
      is room. Alex records that new cost and does not continue shifting objects. Scope reduction was
      the planned change, but uninterrupted time also differed: eighteen active minutes now versus ten
      before. The record cannot isolate the cause of the better table result. Alex plans to check destination
      capacity before another attempt; that next check has not occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Change something specific and keep the result honest


      After a manageable setback, facts, responsibility, outside conditions, support and recovery deserve
      separate attention. A lesson is provisional and may not yet be available. Resilience here means
      an honest adjustment and a renewed attempt, not speed, stoicism or uninterrupted output. Trauma,
      injustice and uncontrollable loss do not owe you a useful lesson.


      Allow twenty minutes for the supplied debrief, one ordinary recovery action and a twenty-minute
      restart. NHS problem-solving guidance [S07](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/problem-solving/)
      supports specifying an action and reviewing what happens. This case is an original household experiment,
      not evidence of a general resilience trait or a controlled causal study. Wait until any acute danger
      or shock has passed before optional reflection.


      ### Complete setback record and restart materials


      Fictional Alex planned to clear both an entry table and a shelf from 16:00 to 16:20 before guests
      arrived. At 16:05 an unexpected necessary delivery required ten minutes. Alex returned at 16:15
      and spent five minutes moving items between the two surfaces. Neither surface was ready at 16:20.
      Alex chose an oversized two-surface goal; the delivery was an external condition, not a personal
      failure. The guest arrival was inconvenient but no safety harm is supplied.


      The entry table holds six ordinary items: Alex''s book, Alex''s empty cup, a shared pen, a shared
      notebook, household member Bo''s unopened envelope and an unidentified key. Agreed destinations
      are Alex''s bookcase, the kitchen cup tray, the shared drawer for pen/notebook, and Bo''s own tray
      for the envelope. Bo has explicitly approved moving the sealed envelope to that tray without opening
      it. The key has no identified owner and must stay in an agreed visible holding dish; do not discard
      it or invent permission.


      The six debrief headings are facts, effect, my responsibility, outside conditions, recovery need
      and available support. Alex needs the already planned comfortable break. Bo agrees to clarify destinations,
      not to perform all the work. A worked provisional lesson is: “Reducing the target from two surfaces
      to one may make the next twenty-minute window usable.” It does not claim the delivery caused every
      difficulty or that good people should work through necessary interruptions.


      The chosen planned variable is task scope: table only instead of table plus shelf. The next attempt
      uses the same twenty-minute allowance and existing supplies on a later suitable day. Natural conditions
      may differ, so a comparison must retain them. The visible target is a usable table with known items
      at authorized destinations and unresolved ownership visible. It is not “everything gone at any cost.”
      The shelf remains outside the new target, not secretly completed.


      ### Debrief, restart and inspect the cost


      1. Write the six headings and calculate actual task time: the first five and last five minutes were
      available, totaling ten. Preserve the ten-minute interruption inside the twenty-minute window. Name
      one narrow choice Alex owns and one fact outside that control. A clean universal lesson is unnecessary.

      2. Define the single intended change, target and permissions. Take the ordinary recovery action
      and confirm Bo''s destination clarification. Save the plan before the [later packet](?resource=file-later-packet-md).
      If a real situation needs more recovery or appropriate support, defer rather than testing toughness.

      3. Compare effort, actual conditions, result and any new cost with the first attempt. A clearer
      table can still leave an unidentified key or create clutter elsewhere. Keep an adverse result visible
      and decide to repeat, revise, seek help or stop for a reason. Do not infer causation when natural
      conditions also changed.


      For support, use a six-box visual form, dictation or help with permission questions. A harder case
      gives no authority to move Bo''s envelope: leave it appropriately and ask, rather than opening it
      to speed the task. In later transfer, choose a manageable setback and a visible renewed action.
      Recent trauma, bereavement or medical crisis calls for stabilization and suitable care, not a rushed
      experiment. A supplied household restart cannot establish recovery from those experiences.


      ### Use the result at its proper scale


      Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
      care.


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A twenty-minute attempt includes a ten-minute necessary interruption. How many task minutes were
      available?


      2. The restart improves after reducing scope, but it also has eighteen uninterrupted active minutes
      instead of ten. Is scope reduction isolated as the cause?


      3. The table is clearer, but another person''s tray becomes crowded and a key''s owner is unknown.
      Should these limits be omitted to show resilience?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. Ten task minutes: five before the interruption and five afterward. Do not count the interrupted
      period as task work or add it outside an already fixed window.


      2. No. Scope was the intended change, while natural conditions also changed. Record both and make
      only a bounded comparison, retaining causal uncertainty.


      3. No. Preserve the new cost, permission limit and unresolved ownership. A useful adjustment is
      honest about what remains and does not manufacture a clean lesson or hide displaced work.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
