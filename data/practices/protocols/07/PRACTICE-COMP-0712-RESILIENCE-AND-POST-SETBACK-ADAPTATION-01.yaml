intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of failing to finish a planned household task before guests arrive. Prepare
    six headings—facts, effect, my responsibility, outside conditions, recovery need and support available.
    Wait until acute danger or shock has passed. Goal: Separate facts, responsibility, lessons, support
    and recovery after disruption, change one controllable variable and test a renewed attempt. Scope:
    A single restart practices adaptation; it does not prove resilience, require rapid recovery or turn
    trauma, injustice or uncontrollable loss into a lesson. Time and effort: A 20-minute debrief, one
    recovery or support action and a 10–30 minute renewed attempt followed by comparison. Adaptation:
    Use a visual six-box form, dictation or a support person. A fictional failed-task case practices analysis
    only. Do not rush debriefing after trauma, bereavement or medical crisis; use qualified support and
    stabilization before any optional learning exercise. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a visual six-box form, dictation or a support person. A fictional failed-task
    case practices analysis only. Do not rush debriefing after trauma, bereavement or medical crisis;
    use qualified support and stabilization before any optional learning exercise.
  expected_burden: A 20-minute debrief, one recovery or support action and a 10–30 minute renewed attempt
    followed by comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Resilience and post-setback adaptation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Resilience and post-setback adaptation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a visual
    six-box form, dictation or a support person. A fictional failed-task case practices analysis only.
    Do not rush debriefing after trauma, bereavement or medical crisis; use qualified support and stabilization
    before any optional learning exercise.
  actions:
  - stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A1
    sequence: 1
    title: Debrief the setback without inventing a clean lesson
    instructions: 'Record what happened, what evidence shows, the immediate effect and what remains unknown.
      Assign your responsibility narrowly and name outside conditions without blaming them for every outcome.
      Identify a needed recovery action and available support. Write at most one provisional lesson tied
      to a fact; it is valid to record that no lesson is yet clear.


      Observation checks: Facts effects and unknowns are separated; Personal and external contributions
      are bounded; A recovery need and available support are identified; Any lesson is provisional and
      tied to evidence. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A1
      competency_stable_id: '07.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0712_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0712_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - facts_effects_and_unknowns_are_separated
        - personal_and_external_contributions_are_bounded
        - a_recovery_need_and_available_support_are_identified
        - any_lesson_is_provisional_and_tied_to_evidence
      - measurement_id: c0712_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
