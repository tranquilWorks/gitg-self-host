        expected: true
  - stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A2
    sequence: 2
    title: Change one controllable variable for the restart
    instructions: 'Select one variable that plausibly contributed and can be changed, such as task size,
      sequence, timing, tool or help. Keep other conditions as stable as practical and define the visible
      result. For the default, reduce the task to clearing the entry table, schedule 20 minutes and ask
      another household member to choose where displaced items go.


      Observation checks: One controllable variable is selected from the debrief; The change is specific
      and feasible; A visible restart result is defined; Needed recovery and support are not treated as
      weakness. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-0712-RESILIENCE-AND-POST-SETBACK-ADAPTATION-01-A2
      competency_stable_id: '07.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0712_a2_primary
      transfer_disposition: context_bound
      measurements:
