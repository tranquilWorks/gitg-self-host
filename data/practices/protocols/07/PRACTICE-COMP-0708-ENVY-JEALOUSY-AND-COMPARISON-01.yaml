  - stable_id: PRACTICE-COMP-0708-ENVY-JEALOUSY-AND-COMPARISON-01-A3
    sequence: 3
    title: Choose one clean conversion of the comparison
    instructions: 'Take one response that fits the analysis: ask the peer for a learning resource, define
      a skill goal, appreciate an existing good, make a fair boundary request or disengage from an unhealthy
      comparison cue. Record what the action can change and what disappointment remains. Do not imitate
      another life wholesale or convert gratitude into a ban on ambition.


      Observation checks: The chosen response matches the identified concern; A concrete learning goal
      gratitude act boundary or disengagement occurs; Remaining disappointment is acknowledged; The action
      avoids imitation sabotage and compulsory contentment. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What did the comparison reveal that can be pursued cleanly, and which urge should
      not be obeyed?


      Examples: Supportive: The person identified admiration for preparation, checked the promotion criteria
      and chose a three-week skill goal without diminishing the peer.


      Mixed: A clean goal emerged, but the belief that recognition is entirely scarce remains only partly
      tested.


      Contradictory: Jealousy was used to justify surveillance, isolation, sabotage or entitlement to
      another person''s attention.


      Inconclusive: The person wrote that comparison is bad without identifying a need, assumption or
      chosen response.'
