  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Rowan spends fifteen minutes creating the three dated examples and the missing-date question, using
      Nia''s explanation as an acknowledged learning source. Rowan submits a request for an open-table
      place through the organizer''s stated route. The organizer acknowledges receipt but has not assigned
      a place.


      Rowan does not inspect the collaborator''s messages or ask them to avoid Nia. The fear about the
      relationship remains unverified; no reassurance conversation is supplied. Disappointment about the
      feature remains. One skill exercise and one request occurred; acceptance, improved recognition and
      a changed relationship are unknown.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Find the desired good without taking ownership of another person


      Envy may focus on a good someone else has; jealousy may include fear about a valued relationship.
      Admiration, insecurity, a real shortage and a possessive urge can be mixed together. None proves
      another person''s intention. A useful comparison review asks what you want, what is actually scarce,
      what you can learn and which urge should not become behavior.


      Allow two ten-minute analyses, one fifteen-minute response and a brief later review. NHS guidance
      on examining thoughts [S01](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/reframing-unhelpful-thoughts/)
      supports checking evidence and alternative interpretations. It does not diagnose envy, validate
      personality judgments or authorize monitoring. The default is fictional; no private information
      about a peer is needed.


      ### Recognition, opportunity and a separate relationship fear


      At an ordinary community showcase, fictional peer Nia receives the one featured display slot. Organizer
      rules say this month''s feature is limited to one display, while next month''s open table has four
      places available by request. No selection criteria or guarantee of acceptance are supplied. Rowan
      admires Nia''s clear step-by-step diagram and feels disappointed at not being selected. Rowan''s
      reaction is described as 6/10.


      Rowan''s six headings begin: event—Nia received this month''s feature; admired quality—clear explanation;
      threatened need—recognition for useful work; scarce fact—one feature this month; relationship fear—“my
      collaborator will only value Nia now”; controlling urge—discourage the collaborator from speaking
      to Nia. There is no evidence about the collaborator''s valuation or any promise of exclusive contact.
      Mark that fear unverified. Attention and learning opportunities are not shown to be limited to the
      one feature.


      The complete original diagram Nia allows others to study says: “To file a room card, put future
      dates in NEXT, today''s date in TODAY, and dates already passed in PAST. If the date is missing,
      ask the organizer before filing.” Rowan may learn the explanation method without copying authorship.
      No private drafts or messages may be accessed.


      A worked fact check is the published four-place open-table rule; it establishes another possible
      route, not a reserved place. A clean skill goal is to make the date rule clearer with an example
      and ask for a place through the normal route. A boundary could concern Rowan''s own use of a comparison
      feed. It cannot prohibit another person''s friendships. Appreciation of an existing collaborator,
      if honest, can coexist with wanting recognition.


      ### Turn the comparison into a chosen response


      1. Fill the six headings with a fact, a hypothesis or “not present.” Distinguish admiration of Nia''s
      diagram from wanting Nia''s whole life. Name which desired good is scarce now and which may have
      other routes. Do not interrogate a peer to establish your emotional story.

      2. Use the supplied rule to draft one original practice example: for a fictional current date of
      April 12, April 13 belongs in NEXT, April 12 in TODAY and April 10 in PAST. A missing date needs
      clarification. Choose a learning action, fair request, self-controlled boundary or genuine appreciation
      that matches the concern. Save the plan before the [later packet](?resource=file-later-packet-md).

      3. Review what changed through the actual action and what remains disappointing. A submitted application
      does not establish a place, and learning a filing example does not entitle Rowan to admiration.
      Any relationship request leaves the other person free to decline or modify it.


      For support, use this invented showcase or an anonymized public example. With no willing interaction,
      keep learning private and mark relationship transfer untested. For a harder case, all four places
      are filled: preserve actual scarcity and choose another proportionate route without concluding there
      is no future possibility. Where jealousy involves coercion, stalking, abuse risk or severe distress,
      use safety and qualified support rather than a comparison exercise. No amount of feeling authorizes
      surveillance or possession.


      ### Use the result at its proper scale


      Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
      care.


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. There is one feature slot this month and four possible open-table places next month. Does losing
      the feature prove all recognition routes are closed?


      2. The organizer acknowledges a request. Is that a confirmed place?


      3. Jealousy feels intense. Does that justify reading a collaborator''s private messages or controlling
      their contacts?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A colleague receives a training place you wanted. You admire their skill, want similar access, and
      consider spreading an unsupported rumor that they cheated. Separate the useful information in the
