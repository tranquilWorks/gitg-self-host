  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Erin confirms the Wednesday written exchange and sends the four lines. Jo replies that the time
      change was posted in the group chat and says they had not known it was muted. Jo understands that
      Erin felt left out but declines to promise a separate message for every change. Jo is willing to
      mark future changes clearly in the group chat.


      Erin acknowledges having muted that channel, thanks Jo for clarifying and turns on notifications
      for that group. The exchange lasts eight minutes. Erin accepts the alternative and does not withdraw
      contact as punishment. A future changed plan has not yet occurred, so notification effectiveness
      and relationship repair remain untested. Erin still feels some disappointment.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Say the emotional truth without making it a demand


      Clear emotional expression separates what happened, how you felt, what mattered and what you ask.
      It avoids turning feelings into motive claims, public performance or a requirement that another
      person regulate them for you. A listener can hear a real feeling and still decline a request. Proportion
      concerns timing, detail, relationship and impact; it does not require minimizing every difficult
      feeling.


      Use fifteen minutes to prepare, one five-to-ten-minute willing exchange or rehearsal and ten minutes
      to review. CCI''s assertiveness overview [S06](https://www.cci.health.wa.gov.au/Resources/Looking-After-Yourself/Assertiveness)
      supports clear, direct communication with respect for others. Its linked workbook modules were not
      read for this exercise. The four-line form is original supplied teaching, not a communication guarantee
      or a therapy intervention.


      ### A changed plan and a willing channel


      Fictional Erin and friend Jo usually meet for a Tuesday lunch. On Monday the group moved this week''s
      lunch from 12:30 to 12:00 in a chat Erin had muted. Erin arrived at 12:30 and missed the first thirty
      minutes. Jo did not personally send Erin a separate message. It is unknown whether Jo knew the chat
      was muted. There is no pattern of exclusion supplied.


      Erin feels left out and disappointed, described as 5/10, and values ordinary notice of changed arrangements.
      Erin''s first impulse is to ignore Jo until Jo notices. That would leave both the feeling and the
      request hidden. A dramatic draft, “You deliberately excluded me, so prove I matter,” adds intent
      and makes reassurance a loyalty test.


      The worked four lines are: “I arrived at 12:30 after the plan changed to 12:00. I felt left out
      and disappointed. Knowing when an agreed plan changes matters to me. Would you send me a direct
      note for our next plan change, or suggest another workable way?” The first sentence leaves room
      for correction, the second reports Erin''s experience, the third gives meaning and the fourth permits
      alternatives.


      Jo has said a private written exchange on Wednesday after 18:00 is welcome, for up to ten minutes.
      This consent is limited to the time and channel; it does not commit Jo to the request. Erin can
      also use the group notification setting, but should not change somebody else''s settings or expose
      the conversation. No real account access is required in the fictional route.


      ### Deliver, listen and decide the next action


      1. Rewrite the dramatic draft into observation, feeling, value and request. Keep the thirty-minute
      missed portion accurate. Remove unverified intent, threats and indirect punishment. Decide how much
      detail fits this ordinary event rather than recounting every past grievance.

      2. Confirm the agreed time and channel, deliver the message, then pause for Jo''s account. Invite
      factual correction and ask what Jo understood. Save the prepared message before the [later packet](?resource=file-later-packet-md).
      If a real listener declines, accept that and use private processing, another time or suitable support
      without public hints or retaliation.

      3. Record the actual response and whether the request was accepted, modified or declined. Repair
      an overstatement if welcome without declaring the feeling unreal. Choose a next action that both
      respects Jo''s freedom and addresses Erin''s legitimate need for timely information. Drafting, rehearsing
      and delivering are distinct statuses.


      For support, use AAC, interpretation or a consented supporter under the speaker''s control. Without
      a trustworthy listener, rehearse the supplied exchange and leave live disclosure untested. Do not
      disclose to a coercive, abusive or retaliatory person to complete an exercise; use safety planning
      and appropriate support instead.


      A harder case includes a corrected fact: the direct message was actually sent and unread. Update
      the event description rather than using the strength of the feeling to override the evidence. Later
      transfer can inspect whether the new notification arrangement worked. One candid exchange cannot
      establish permanent intimacy, repair every exclusion or prove that either person must provide reassurance
      on demand.


      ### Use the result at its proper scale


      Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
      care.


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A listener agrees to hear a message. Have they also agreed to the requested change?


      2. The chat was muted and the speaker did not know a change was posted. Must the speaker deny feeling
      left out after learning this?


      3. A four-line message is saved but never sent or rehearsed. Is difficult emotional disclosure complete?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Consent to a conversation and acceptance of a request are separate. Preserve the actual response
      and any freely agreed alternative.


      2. No. Update the factual and intention claims while retaining the reported feeling. New context
      can change the next action without making the experience fictitious or the request binding.


      3. No. It is a draft. Rehearsal and actual communication require their own events, and neither alone
      proves the listener understood or the relationship improved.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
