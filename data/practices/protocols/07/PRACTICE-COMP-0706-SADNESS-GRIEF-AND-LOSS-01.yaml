  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Mika writes the final date and private shading memory on October 10. Inez accepts the ten-minute
      Sunday call; the call actually occurs and ends at the agreed limit. Mika removes future Sketch Circle
      reminders and prepares the shared meal at 18:00. The next class is still unconfirmed and has not
      been attended.


      Mika reports sadness at 5/10 again and also values Inez''s company. The unchanged rating does not
      erase the remembrance, support or practical adjustment. The loss remains a loss; no required gratitude,
      completed grieving, replacement friendship or new community membership is supplied.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Carry a loss without requiring it to become a lesson


      Sorrow can concern a person, place, role, routine or hoped-for future. Naming what remains does
      not cancel what is gone. Remembrance, support, changed expectations and continued living may coexist
      with sadness, relief, numbness or uncertainty. There is no required order, public ritual or date
      by which the feeling must resolve.


      Use twenty minutes with the supplied manageable loss, one short remembrance or support action and
      ten minutes for later review. NHS information on grief [S04](https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/feelings-and-symptoms/grief-bereavement-loss/)
      recognizes varied responses and available support. This exercise does not implement a stage sequence
      or diagnose bereavement. Use fiction when personal loss is too close, recent, traumatic or destabilizing;
      qualified or trusted support may be more appropriate than self-guided reflection.


      ### The end of a familiar group


      The fictional Saturday Sketch Circle announces on October 3 that its last meeting will be October
      10. The venue is no longer available; no replacement group or future gathering is promised. Participant
      Mika has attended for six months. The group has permission to share its own ordinary meeting notice,
      but members'' names, photographs and artwork are private unless separately authorized.


      Mika will lose a reliable Saturday routine, a familiar room and the expectation of casual company.
      Mika retains a sketchbook, a practiced drawing habit and the ordinary household commitment to prepare
      a shared meal at 18:00. One friend, Inez, welcomes a private message about the closing and is willing
      to consider a specific request; this is not an unlimited offer of care. A future class advertised
      elsewhere has no confirmed accessible space or availability in this packet.


      A worked three-column entry reads: lost—weekly company in this room; remaining—drawing skill and
      past memories; now changed—there is no automatic Saturday meeting after October 10. “I should feel
      grateful instead of sad” does not belong in the record. Appreciation, if present, need not erase
      sorrow; the closing notice alone does not make a replacement possible.


      For remembrance Mika can write the final date and one private memory of learning to shade a cup.
      No copyrighted image, song lyric or personal story from another member is needed. For support, the
      bounded request is: “Would you keep me company by phone for ten minutes while I sort my own pencils
      on Sunday?” Inez can accept, decline or modify it. Continued living could include removing obsolete
      reminders and preparing the already agreed meal, without labeling either action closure.


      ### Remember, ask and adjust the expectation


      1. Complete lost, remaining and now-changed headings from the packet. Record Mika''s supplied present
      sadness as 5/10 without treating the number as a standard. Name one expectation that must change
      and one responsibility that remains. If a personal route becomes overwhelming, stop; detailed recall
      is not required.

      2. Choose one private remembrance and one bounded support request. Save the intended actions before
      the [later packet](?resource=file-later-packet-md). An unanswered request means support is unconfirmed,
      not that no one cares. Do not publish group material or contact members who have not welcomed it.

      3. Inspect what actually happened. Distinguish remembering, receiving company, maintaining a duty
      and joining a new group. Name what was carried forward and what still hurts. If an action must wait,
      record the reason rather than forcing a positive account.


      ### Let support fit the person and the loss


      For support, use a chosen object, a short audio note, an accessible quiet ritual or a trusted person;
      silence can also be a fitting response. For a harder case, the hoped-for replacement group declines
      a place. Preserve that second disappointment and seek a different suitable option only if wanted.
      Avoid turning adaptation into a demand to replace relationships quickly.


      Later review may notice changed routines or continuing waves of feeling without a timetable. Function-impairing,
      severe or persistent symptoms, traumatic loss or safety concerns merit appropriate qualified support.
      This fictional closure of a hobby group is not evidence that a learner has processed personal grief
      or can manage every kind of loss.


      ### Use the result at its proper scale


      Not therapy or diagnosis; severe or persistent symptoms require qualified mental-health or medical
      care.


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
