meaning_and_fit:
  purpose: Map the interfaces, incentives, dependencies and constraints around a small workflow and improve
    one failure point with the responsible people’s agreement.
  why_recommended: Map the interfaces, incentives, dependencies and constraints around a small workflow
    and improve one failure point with the responsible people’s agreement.
  claims:
  - statement: Map the interfaces, incentives, dependencies and constraints around a small workflow and
      improve one failure point with the responsible people’s agreement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Systems and organizational awareness practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Systems and organizational awareness as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a paper workflow, accessible diagram or written exchange. Do not expose
    internal organization charts, client information, credentials or protected work details. High-consequence
    systems require formal engineering, safety or change-control processes.
  opportunity_considerations: Default to an event notice moving from writer to approver to publisher.
    Prepare a simple flow with inputs, outputs, owners, acceptance criteria, waiting points, incentives
    and recovery. Use fictional documents if real work is confidential.
  prerequisites:
  - Default to an event notice moving from writer to approver to publisher. Prepare a simple flow with
    inputs, outputs, owners, acceptance criteria, waiting points, incentives and recovery. Use fictional
    documents if real work is confidential.
  dependencies: []
  safe_alternatives:
  - Use a paper workflow, accessible diagram or written exchange. Do not expose internal organization
    charts, client information, credentials or protected work details. High-consequence systems require
    formal engineering, safety or change-control processes.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Systems and organizational awareness differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Systems and organizational
    awareness as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to an event notice moving from writer to approver to publisher. Prepare a simple flow
    with inputs, outputs, owners, acceptance criteria, waiting points, incentives and recovery. Use fictional
    documents if real work is confidential. Goal: Map the interfaces, incentives, dependencies and constraints
    around a small workflow and improve one failure point with the responsible people’s agreement. Scope:
    Use an authorized low-stakes process or a fictional workflow. This is not permission to bypass organizational
    authority, access restricted systems or redesign other people’s jobs unilaterally. Time and effort:
    Twenty minutes of mapping, one short coordination conversation and one tabletop or live low-risk handoff
    test. Adaptation: Use a paper workflow, accessible diagram or written exchange. Do not expose internal
    organization charts, client information, credentials or protected work details. High-consequence systems
    require formal engineering, safety or change-control processes. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a paper workflow, accessible diagram or written exchange. Do not expose internal
    organization charts, client information, credentials or protected work details. High-consequence systems
    require formal engineering, safety or change-control processes.
  expected_burden: Twenty minutes of mapping, one short coordination conversation and one tabletop or
    live low-risk handoff test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Systems and organizational awareness protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Systems and organizational awareness action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a paper
    workflow, accessible diagram or written exchange. Do not expose internal organization charts, client
    information, credentials or protected work details. High-consequence systems require formal engineering,
    safety or change-control processes.
  actions:
  - stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01-A1
    sequence: 1
    title: Trace what the next person needs and what the system rewards
    instructions: 'Map the notice from request to publication, including who supplies facts, who can approve
      and who handles corrections. For each interface, state what must arrive and how the receiver knows
      it is ready. Identify one constraint, such as an approval window, and one incentive that may encourage
      premature completion, such as counting drafts rather than usable notices. Treat incentives as hypotheses
      about behavior, not proof of anyone’s motive.


      Observation checks: Inputs outputs and owners are mapped across the workflow; Each interface has
      a readiness condition; A constraint and a possible incentive mismatch are identified; System incentives
      are not converted into personal motive claims. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01-A1
      competency_stable_id: '21.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2107_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2107_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - inputs_outputs_and_owners_are_mapped_across_the_workflow
        - each_interface_has_a_readiness_condition
        - a_constraint_and_a_possible_incentive_mismatch_are_identified
        - system_incentives_are_not_converted_into_personal_motive_claims
      - measurement_id: c2107_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2107_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01-A2
    sequence: 2
    title: Confirm the likely failure with the affected owner
    instructions: 'Choose a specific failure mode, such as the publisher receiving a file with no approved
      version marker. Ask the receiver how they currently detect it and what a useful handoff would contain.
      Compare a small fix, such as an explicit approved-or-draft field, with alternatives and added burden.
      Obtain permission before changing the process and preserve required review. Do not solve delay by
      bypassing the authority whose approval is necessary.


      Observation checks: One concrete interface failure is selected; The receiver confirms the actual
      need or corrects the hypothesis; A small fix is compared with its burden; Required authority and
      review are preserved. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01-A2
      competency_stable_id: '21.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2107_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2107_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_concrete_interface_failure_is_selected
        - the_receiver_confirms_the_actual_need_or_corrects_the_hypothesis
        - a_small_fix_is_compared_with_its_burden
        - required_authority_and_review_are_preserved
      - measurement_id: c2107_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
