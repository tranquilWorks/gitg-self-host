  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Ren confirms that the delivery lacks a way to bind approval to one file. Lena, Ash and Ren accept
      the proposed handoff-card change. The first paper trial says only “approved” and omits the notice
      ID. Ren holds it rather than choosing N3 merely because it is newest. No publication occurs.


      The corrected card reads: **Q1; N2; APPROVED; Ash at 10:00 UTC; corrections to Lena then Ash before
      Ren publishes**. Ren selects N2, reads 20 October at 18:00 UTC in Birch Room and identifies the
      correction route without hints. N3 remains a draft with an unapproved title change; N1 retains its
      wrong-date history rather than being presented as current.


      The trial records two additional minutes for Lena to complete the card and one minute for Ash to
      confirm the association. No other time, queue delay or net saving is measured. Ash accepts maintaining
      the approval field with Lena supplying the exact ID. This does not grant either person ownership
      of the whole organization. The paper test is complete, but an actual post, faster publication and
      durable error reduction are not established.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Prevent one small handoff failure by looking beyond the task assigned to you. Allow twenty
      minutes to map the workflow, a short coordination exchange and a paper handoff test. Use the supplied
      notice packet. This exercise does not authorize bypassing review, accessing restricted systems or
      redesigning another person''s job without agreement.


      ### A local success can still fail downstream


      A writer may finish a draft while the publisher still cannot tell which version is approved. A department
      may count completed files while users need accurate published information. To understand the system,
      follow the item across boundaries: who supplies facts, who transforms them, who approves, who receives
      them and who handles corrections. Each interface needs an input, owner, readiness condition and
      recovery route.


      Dependencies connect tasks that appear separate. A publication deadline may depend on an approver''s
      availability and a confirmed event date. Constraints limit the available response: an approval window,
      access permission, resource ceiling or required review cannot be solved by pretending it does not
      exist. Institutional context determines which roles have authority and which records must be preserved.


      Incentives affect what a process makes easy or rewarding, but a reward structure does not prove
      a particular person''s motive. Counting drafts could encourage early claims of completion; that
      remains a hypothesis until behavior is examined. Ask where the system creates ambiguity or rework
      before blaming people for a failure that a better handoff could prevent.


      Confirm the actual failure with the receiver. Your diagram may be wrong or omit an existing control.
      Ask what arrives, what the receiver cannot determine and how they currently recover. A simple approved/draft
      field can help, but it must bind to a specific version. A detached “approved” message beside several
      attachments may reproduce the original ambiguity. “Newest” and “approved” answer different questions.


      Compare the fix with alternatives and its burden. A shared handoff card might be adequate for a
      harmless notice; a regulated system may need formal configuration management and engineering controls.
      A small local change still needs the relevant owners'' agreement. Do not eliminate the approver
      to make the writer''s metric look better or silently make the receiver responsible for reconstructing
      missing facts.


      Test both readiness and recovery. Ask the receiver to select the approved item and identify what
      to do if a newer draft appears or the marker is missing. A test can pass by withholding an ambiguous
      item and requesting the correct information, not only by moving it forward. Check whether the fix
      transfers effort, waiting or risk to someone else, and agree who will maintain it. One improved
      interface is not evidence that the entire organization is optimized.


      ### Worked example


      An approval label arrives without a version ID. The publisher chooses the most recent file and risks
      using an unapproved title. The team ties the label to a specific notice and preserves the draft
      status of other versions. The next paper test selects the correct item and routes proposed changes
      back through approval. The improvement is a clearer boundary, not a removed review step.


      ### Complete fictional workflow and packet


      On 18 October the writer, Lena, receives request Q1: **Map Club, 20 October, 18:00 UTC, Birch Room;
      public questions: Event Desk**. Ash owns approval and is available 10:00–10:30 UTC. Ren publishes
      only approved text; the target publication time is 12:00 UTC. The publication is fictional and no
      real post is made.


      Three files arrive together. **N1**, dated 09:40, says “Map Club, 19 October, 18:00 UTC, Birch Room;
      Event Desk” and has the wrong date. **N2**, dated 09:55, exactly matches Q1; Ash approves N2 at
      10:00. **N3**, dated 10:15, says “Mapping Night, 20 October, 18:00 UTC, Birch Room; Event Desk.”
      N3 has a newer timestamp but its title change has not been approved. Initially the delivery contains
      no version-bound approval card. The receiver cannot safely infer approval from recency.


      The permitted proposed card fields are **request ID; exact notice ID; status; approving role and
      time; correction route**. The correction route is back to Lena for a draft and Ash for approval
      before Ren publishes. Ash, Lena and Ren must agree the change; no one has yet accepted extra work.
      Treat a “drafts completed” metric as a possible incentive mismatch, not proof that Lena deliberately
      caused the problem.


      ### Map, confirm and test the interface


      1. Trace Q1 through writing, approval, publication and correction. Put owners, required inputs,
      outputs and readiness at each boundary. Output: a usable flow plus the approval-window constraint
      and an explicitly hypothetical incentive effect.

      2. Ask Ren what is missing and compare the proposed card with simply selecting the newest file.
      Check the source facts and Ash''s authority. Output: a receiver-confirmed need, not a unilateral
      process diagnosis.

      3. Seek agreement from all affected owners and bind the approval status to the exact notice ID.
      Preserve N3 as draft and the required correction review. Output: a permitted small change with known
      added burden and no bypass.

      4. Save the initial card before the [later packet](?resource=file-later-packet-md). Test a card
      missing its version and then the corrected handoff. Output: receiver selection or hold, actual readiness
      and correction route without author rescue.

      5. Check writer, approver and receiver effort and accept maintenance explicitly. Output: a whole-handoff
      result with limitations, rather than a claim that your own step became faster or the notice was
      actually published.


      ### Support and transfer


      Use three role cards and paper files, spoken labels or an accessible diagram. A harder case changes
      Q1 after Ash''s window closes. Hold publication or renegotiate through the proper owner; a deadline
      does not make unapproved text approved. Escalation here means raising a dependency, not seizing
      authority.


      Real transfer requires permission and the actual organization''s controls. Keep private records,
      credentials, internal sensitive structures and client material outside app evidence. High-consequence
      engineering or operational interfaces require their formal processes. The paper example can expose
      a handoff concept but cannot establish live reliability, throughput or organization-wide change.


      ### Source use


      [NASA''s interface-management section, S12](https://www.nasa.gov/reference/6-3-interface-management/),
      explains interface inputs, responsibilities, controlled changes and verification of compatibility.
      Selected sections inform the general boundary principle; this small notice card is an original analogy,
      not a NASA-compliant engineering control. No linked expanded guidance, technical system qualification
      or organizational performance estimate is claimed.


      ### Use the result at its proper scale


      The practical limits in this guide are exercise safeguards, not added canonical metadata.


      Paid employment, a career change or a particular work role is not compulsory. Fiction and no attempt
      are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
