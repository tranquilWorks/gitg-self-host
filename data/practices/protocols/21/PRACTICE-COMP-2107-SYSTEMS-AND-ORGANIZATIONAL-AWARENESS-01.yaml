        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2107-SYSTEMS-AND-ORGANIZATIONAL-AWARENESS-01-A3
    sequence: 3
    title: Test the interface and check the wider effect
    instructions: 'Run a fictional notice through the revised handoff or use the next permitted low-risk
      occurrence. Ask the receiver to identify the approved version and the correction route without your
      explanation. Check whether the fix merely moved waiting or rework to another person. Record the
      result and agree who maintains the change. A problem outside your assigned step can be responsibly
      raised without claiming ownership of the entire organization.


      Observation checks: A real or labeled tabletop handoff test occurs; The receiver can identify readiness
      and correction routes; Shifted burden or rework is checked; Maintenance and authority remain explicit.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Which dependency outside your own task caused the failure, and did your fix improve
      the whole handoff rather than make your step look faster?


      Examples: Supportive: An approval marker let the publisher select the correct file and the team
      confirmed that no extra rework was shifted downstream.


      Mixed: The fix reduced one queue but created another; the participant revised it with the affected
      owner.


      Contradictory: The participant bypassed review, accessed restricted information or blamed individuals
      for an unverified incentive pattern.


      Inconclusive: A process diagram was drawn without confirming a failure mode or testing an interface
      improvement.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
