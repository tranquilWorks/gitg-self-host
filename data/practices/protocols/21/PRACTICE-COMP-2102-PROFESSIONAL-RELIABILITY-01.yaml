meaning_and_fit:
  purpose: Demonstrate preparedness, punctuality, organized handoff and honest status communication on
    a bounded deliverable, including an early response when the plan changes.
  why_recommended: Demonstrate preparedness, punctuality, organized handoff and honest status communication
    on a bounded deliverable, including an early response when the plan changes.
  claims:
  - statement: Demonstrate preparedness, punctuality, organized handoff and honest status communication
      on a bounded deliverable, including an early response when the plan changes.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Professional reliability practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Professional reliability as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a written, spoken or accessible agenda and a volunteer or personal collaboration
    when employment material is sensitive. A fictional recipient rehearsal can test status wording but
    not actual trust or delivery. Preserve rest, safety and contractual boundaries.
  opportunity_considerations: Default to preparing a one-page agenda for a volunteer meeting. Agree who
    receives it, the needed information, an accessible format, the deadline and a checkpoint before that
    deadline. Keep any real workplace or client information in approved systems only.
  prerequisites:
  - Default to preparing a one-page agenda for a volunteer meeting. Agree who receives it, the needed
    information, an accessible format, the deadline and a checkpoint before that deadline. Keep any real
    workplace or client information in approved systems only.
  dependencies: []
  safe_alternatives:
  - Use a written, spoken or accessible agenda and a volunteer or personal collaboration when employment
    material is sensitive. A fictional recipient rehearsal can test status wording but not actual trust
    or delivery. Preserve rest, safety and contractual boundaries.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Professional reliability differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Professional reliability as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to preparing a one-page agenda for a volunteer meeting. Agree who receives it, the needed
    information, an accessible format, the deadline and a checkpoint before that deadline. Keep any real
    workplace or client information in approved systems only. Goal: Demonstrate preparedness, punctuality,
    organized handoff and honest status communication on a bounded deliverable, including an early response
    when the plan changes. Scope: Use low-stakes authorized work or a fictional practice deliverable.
    Reliability does not mean unlimited availability, concealing uncertainty or promising a deadline you
    cannot safely meet. Time and effort: Ten minutes to agree the commitment, one 20–40 minute work period
    and a short handoff review. Adaptation: Use a written, spoken or accessible agenda and a volunteer
    or personal collaboration when employment material is sensitive. A fictional recipient rehearsal can
    test status wording but not actual trust or delivery. Preserve rest, safety and contractual boundaries.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a written, spoken or accessible agenda and a volunteer or personal collaboration
    when employment material is sensitive. A fictional recipient rehearsal can test status wording but
    not actual trust or delivery. Preserve rest, safety and contractual boundaries.
  expected_burden: Ten minutes to agree the commitment, one 20–40 minute work period and a short handoff
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Professional reliability protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Professional reliability action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a written,
    spoken or accessible agenda and a volunteer or personal collaboration when employment material is
    sensitive. A fictional recipient rehearsal can test status wording but not actual trust or delivery.
    Preserve rest, safety and contractual boundaries.
  actions:
  - stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01-A1
    sequence: 1
    title: Make the commitment specific enough to rely on
    instructions: 'Confirm the recipient’s needed outcome, the due time and time zone where relevant,
      the acceptance check and what inputs you require. Inspect your actual capacity before agreeing.
      Gather the permitted materials and put the task and checkpoint in a system you use. State a known
      uncertainty and when you will raise it. Saying yes quickly is not reliability if the recipient cannot
      tell what will arrive or when.


      Observation checks: Outcome recipient deadline and acceptance are explicit; Capacity and required
      inputs are checked before agreement; Materials and a tracking method are prepared; A known uncertainty
      has an early communication point. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01
      action_stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01-A1
      competency_stable_id: '21.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2102_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2102_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - outcome_recipient_deadline_and_acceptance_are_explicit
        - capacity_and_required_inputs_are_checked_before_agreement
        - materials_and_a_tracking_method_are_prepared
        - a_known_uncertainty_has_an_early_communication_point
      - measurement_id: c2102_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2102_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01-A2
    sequence: 2
    title: Report evidence-based status before someone has to chase it
    instructions: 'At the checkpoint, compare completed work with the agreed endpoint. Send a brief status
      that distinguishes done, in progress, blocked and untested, with the next action and any changed
      forecast. If an input is missing, ask a specific question and propose a feasible alternative rather
      than silently waiting. Do not label a draft complete or hide a likely delay to preserve a dependable
      image.


      Observation checks: The checkpoint occurs before the recipient must chase; Done blocked and untested
      work are distinguished; A changed forecast or missing input is communicated early; Status is grounded
      in the actual deliverable. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01
      action_stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01-A2
      competency_stable_id: '21.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2102_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2102_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_checkpoint_occurs_before_the_recipient_must_chase
        - done_blocked_and_untested_work_are_distinguished
        - a_changed_forecast_or_missing_input_is_communicated_early
        - status_is_grounded_in_the_actual_deliverable
      - measurement_id: c2102_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2102_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01-A3
    sequence: 3
    title: Deliver and close the handoff honestly
    instructions: 'Send the agreed artifact through the permitted channel, identifying version, remaining
      limitations and any action required from the recipient. Ask them to confirm that it meets the stated
      need or identify the gap. Correct one bounded issue or agree a revised handoff. Compare your original
      estimate with actual effort and record one change that would make the next commitment more reliable.
      A timely but unusable file is not a successful handoff.


      Observation checks: The artifact is delivered through the agreed channel; Version limitations and
      recipient action are clear; The recipient checks usefulness against the original need; One estimation
      or preparation lesson is retained. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Could the other person make a justified plan from your commitment and updates, and
      where did you make them carry avoidable uncertainty?


      Examples: Supportive: The recipient received a clear checkpoint update and usable agenda on time,
      with one limitation identified rather than hidden.


      Mixed: A missing input caused delay, but early notice and an accepted smaller deliverable preserved
      the recipient’s ability to plan.


      Contradictory: The participant claimed completion while work remained untested or hid a foreseeable
      delay until the deadline.


      Inconclusive: A task was marked done without an agreed recipient, acceptance check or confirmed
      handoff.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01
      action_stable_id: PRACTICE-COMP-2102-PROFESSIONAL-RELIABILITY-01-A3
