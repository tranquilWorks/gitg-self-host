  - stable_id: PRACTICE-COMP-2115-WORKER-RIGHTS-AND-EMPLOYMENT-LAW-LITERACY-01-A3
    sequence: 3
    title: Prepare a concise inquiry and a safe next step
    instructions: 'Write a neutral question with the relevant facts and ask what guidance, coverage test
      or professional help applies. Use the verified channel for a genuine current issue, or rehearse
      with fictional facts only. Keep a permitted accurate record of your own work and communications
      without taking restricted documents or making unlawful recordings. If a real deadline, retaliation
      or safety concern exists, seek timely qualified help; do not wait to complete the educational sequence.


      Observation checks: The inquiry contains relevant facts without an unsupported legal conclusion;
      Real contact and fictional rehearsal are distinguished; Recordkeeping respects authority privacy
      and local law; Current deadlines and safety concerns trigger timely qualified help. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which authority can answer this specific question, what coverage fact remains unresolved,
      and what deadline or safety issue prevents casual delay?


      Examples: Supportive: The participant separated a pay-record question from classification and found
      a current official inquiry route without declaring the employer unlawful.


      Mixed: An old fact sheet conflicted with a current notice, so the participant asked for clarification
      instead of applying the stale rule.


      Contradictory: A generic legal summary was treated as a personal ruling, a deadline was ignored
      or restricted employer records were taken for the exercise.


      Inconclusive: Worker rights were listed without a jurisdiction, coverage check or authoritative
      help route.'
