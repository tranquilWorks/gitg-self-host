  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      A permitted synthetic record shows that **three of the four fifteen-minute preparation periods were
      included**. Forty-five of the initially questioned sixty minutes are therefore accounted for in
      the supplied record; one fifteen-minute period remains unresolved. The record does not establish
      why it is absent, whether compensation is legally due or an amount owed.


      Row revises the inquiry to describe the remaining period and ask about classification, jurisdiction,
      appropriate records and any applicable deadline. The state/locality and necessary coverage facts
      are still missing. The draft is **not sent**, no interview occurs, no charge or complaint is filed,
      and no authority answers.


      The source note keeps Worker.gov''s stale-update notice visible and does not infer current agency
      availability from it. The result is a better prepared question with **deadline and coverage unresolved**,
      not a legal determination or a protected filing date. Actual urgency would require prompt current
      qualified guidance outside this rehearsal.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Prepare a well-scoped workplace question and identify the official route that could help answer
      it. Allow two twenty-five-minute source reviews and a short fictional inquiry draft. This is legal
      literacy, not legal advice or a ruling about coverage, unpaid wages or a remedy. A genuine deadline
      or immediate safety concern needs timely appropriate help; do not delay it to finish this exercise.


      ### Start with jurisdiction, facts and the issue


      Employment questions often cross several bodies of law. Location, sector, duties and arrangement
      can change which rules and authorities apply. A familiar national summary may not settle a state,
      local, public-sector or cross-border issue. Record what is actually known before choosing a route.
      A contract heading such as “independent contractor” is a fact about the document, not by itself
      a complete legal classification.


      Separate eight issue areas. Wages concern compensation; hours concern what time is counted and how
      it is recorded. Discrimination concerns unequal treatment on legally relevant grounds; accommodation
      concerns changes or supports under the applicable rules. Safety concerns hazards and prevention;
      leave concerns time away and its conditions. Classification concerns the work relationship and applicable
      category; contracts concern agreed terms and their legal context. Complaint and inquiry paths cut
      across these areas rather than forming one universal process.


      Make a relevant, potentially relevant or not indicated disposition for each. “Not indicated” means
      the supplied facts do not raise the issue; it does not rule out an unseen problem. Avoid gathering
      medical details, coworkers'' records or unrelated private information merely to complete a worksheet.
      A small, accurate account of your own permitted facts is more useful than a broad allegation based
      on assumptions.


      An official domain is a starting point, not a guarantee that every page is current or complete.
      Inspect dates, scope and notices. A cached or old explanation may be useful for finding an agency
      while requiring a current route and rule check before reliance. Record a failed retrieval honestly.
      If a page says it is not being updated, do not silently label its contents a current legal determination
      or assume its banner proves the agency''s live operating status.


      Agencies have different remits. In a U.S. example, wage/hour questions, employment discrimination,
      workplace safety and labor relations may lead to different federal authorities and relevant state
      or local bodies. A directory helps you choose a question; it does not establish personal coverage.
      The appropriate route may also differ for public employees or other categories. A private employment
      contract may require qualified advice beyond an agency''s general information service.


      Distinguish an information inquiry from a complaint or formal charge. Writing a draft, submitting
      an inquiry, attending an interview and filing a formal instrument are separate events. Do not treat
      an unsent draft as preserving a deadline. Ask the actual authority or qualified adviser which limit
      and procedure apply; this fictional case cannot calculate one. An internal discussion should not
      be assumed to resolve or preserve an external filing requirement.


      Keep records lawfully and proportionately. Use accurate permitted notes of your own times and communications
      without taking restricted files, making unlawful recordings or adding claims you cannot support.
      Ask about confidentiality and notification before relying on them; a government route is not a promise
      of anonymity, practical protection or a particular outcome. If retaliation, immediate danger or
      dependence makes action risky, seek an appropriate safe support route rather than a confrontational
      practice task.


      ### Worked example


      A worker reports four fifteen-minute preparation periods that may be missing from a time record.
      That is sixty minutes of described activity, not a legal finding that sixty minutes of compensation
      is owed. Later records show three periods already included. The unresolved recorded-time discrepancy
      narrows to fifteen minutes. Coverage, compensability, amount, deadlines and remedy remain separate
      questions.


      ### Complete fictional case and source snapshot


      Row works in a fictional **U.S. private records office**. The state and locality are not supplied.
      Row''s document uses the label **independent contractor**, but the facts needed for legal classification
      are incomplete. The office asks Row to prepare materials for **15 minutes before each of four scheduled
      shifts on 8–11 September 2026**. Row initially believes none of the preparation appears in the record.
      Pay rate, full duties, employment terms and applicable coverage are unknown. No discriminatory treatment,
      accommodation request, hazard or leave request is described.


      The permitted materials are only this fictional account and the later synthetic time-record summary.
      The task is to locate authoritative questions and prepare an inquiry, not calculate damages, accuse
      an employer or submit a report. Dispositions should cover all eight areas: wages and hours are directly
      relevant; classification and contract terms need clarification; discrimination, accommodation, safety
      and leave are not indicated by these facts.


      The inspected [Worker.gov directory, S08](https://www.worker.gov/), routes wage, equality, organizing,
      safety and retaliation concerns. Its retrieved page carries a notice saying updates were suspended
      and identifies **2 February 2026** as its last update. Preserve that limitation; live service availability
      was not independently verified. Direct DOL major-laws/complaint and OSHA worker pages returned 403
      in this authoring session and are not claimed read. [EEOC''s filing page, S09](https://www.eeoc.gov/filing-charge-discrimination),
      distinguishes an online inquiry/interview from a charge and identifies a different federal-employee
      process. It supplies no wage ruling for Row. [NLRB''s rights page, S11](https://www.nlrb.gov/about-nlrb/rights-we-protect/your-rights/employee-rights),
      concerns covered labor-relations activity, not a universal wage or contract tribunal.


      ### Prepare the right question


      1. Record location/sector/arrangement facts, missing coverage facts and the eight issue dispositions.
      Output: a bounded issue map that does not decide status from a label.

      2. Use the linked official sources and their limits to identify the likely inquiry category and
      what must be checked through the current jurisdiction-matched channel. Output: source, inspection
      date, scope, freshness warning and an explicit **deadline unknown** field.

      3. Draft: “Which authority and coverage test apply to required preparation time in this arrangement,
      what record is appropriate, and what deadline or procedure should I check?” Add the supplied facts
      and missing location. Save before the [later packet](?resource=file-later-packet-md). Output: an
      unsent neutral inquiry.

      4. Update the discrepancy from the later record without erasing the original account. State whether
      anything was filed or answered. Output: corrected facts and a timely-help question, not an invented
      legal conclusion.


      ### Support and transfer


      Use accessible agency information, an interpreter, an appropriate representative or qualified employment
      adviser. A harder branch changes the employer to a public body: recheck the authority and process
      rather than reuse a private-sector assumption. For a real current concern, verify the actual route
      and deadline promptly; the fictional unsent inquiry protects no right and guarantees no remedy.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A document calls someone an independent contractor. Does that alone determine every workplace
      protection?

      2. Three of four fifteen-minute periods are found in the record. How much remains unexplained, and
      does that establish wages owed?

      3. An official page has an old-update warning and an inquiry draft is ready. Has a current deadline
      been checked or a complaint filed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Classification depends on applicable law and relevant facts. Preserve the label as one
      fact, identify jurisdiction and duties, and seek the correct coverage guidance.

      2. Fifteen minutes remain unexplained. This is a recorded-time discrepancy, not a ruling about compensability,
      pay amount, coverage or a remedy.

      3. No. Retain the source limitation, verify the current applicable route and deadline for a real
      issue, and distinguish inquiry from formal filing. Here the draft was never sent and preserves no
      filing date.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
