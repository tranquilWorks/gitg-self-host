  - stable_id: PRACTICE-COMP-2115-WORKER-RIGHTS-AND-EMPLOYMENT-LAW-LITERACY-01-A2
    sequence: 2
    title: Verify the current official route and its limits
    instructions: 'Locate the relevant labor, equality, safety or other official authority for the jurisdiction
      and inspect its current guidance. Note publication or review date, who it covers and any warning
      that rules or enforcement positions are changing. Check the appropriate deadline and complaint or
      inquiry route directly rather than copying a generic time limit. In the U.S. example, Wage and Hour,
      EEOC, OSHA and labor-relations agencies have different remits; elsewhere use the corresponding local
      authorities.


      Observation checks: The source is official current and jurisdiction-matched; Coverage and changing-rule
      limitations are noted; Deadlines are verified for the actual route; Different agency remits are
      not conflated. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
