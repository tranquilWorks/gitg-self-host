meaning_and_fit:
  purpose: Identify the relevant jurisdiction, coverage, facts and official guidance route for a workplace
    question without turning a general summary into a personal legal conclusion.
  why_recommended: Identify the relevant jurisdiction, coverage, facts and official guidance route for
    a workplace question without turning a general summary into a personal legal conclusion.
  claims:
  - statement: Identify the relevant jurisdiction, coverage, facts and official guidance route for a workplace
      question without turning a general summary into a personal legal conclusion.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Worker rights and employment law literacy practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Worker rights and employment law literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible agency channels, an interpreter, a union representative or
    qualified employment adviser as appropriate. Official sources may differ by location and worker category.
    The exercise does not guarantee confidentiality, coverage, remedy or protection from practical retaliation.
  opportunity_considerations: Use the fictional case of a worker unsure whether a required preparation
    period is recorded as work time. Prepare headings for jurisdiction, work arrangement, dates, issue,
    source, coverage, deadline, safe record and help route. Keep real pay, medical and employer-confidential
    information outside application evidence.
  prerequisites:
  - Use the fictional case of a worker unsure whether a required preparation period is recorded as work
    time. Prepare headings for jurisdiction, work arrangement, dates, issue, source, coverage, deadline,
    safe record and help route. Keep real pay, medical and employer-confidential information outside application
    evidence.
  dependencies: []
  safe_alternatives:
  - Use accessible agency channels, an interpreter, a union representative or qualified employment adviser
    as appropriate. Official sources may differ by location and worker category. The exercise does not
    guarantee confidentiality, coverage, remedy or protection from practical retaliation.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Worker rights and employment law literacy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Worker rights and employment
    law literacy as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional case of a worker unsure whether a required preparation period is recorded
    as work time. Prepare headings for jurisdiction, work arrangement, dates, issue, source, coverage,
    deadline, safe record and help route. Keep real pay, medical and employer-confidential information
    outside application evidence. Goal: Identify the relevant jurisdiction, coverage, facts and official
    guidance route for a workplace question without turning a general summary into a personal legal conclusion.
    Scope: This is employment-law literacy and consultation preparation, not legal advice, a coverage
    determination or an instruction to confront an employer or miss a filing deadline. Time and effort:
    Two 25-minute source checks and one verified information inquiry when a real question is current.
    Adaptation: Use accessible agency channels, an interpreter, a union representative or qualified employment
    adviser as appropriate. Official sources may differ by location and worker category. The exercise
    does not guarantee confidentiality, coverage, remedy or protection from practical retaliation. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible agency channels, an interpreter, a union representative or qualified
    employment adviser as appropriate. Official sources may differ by location and worker category. The
    exercise does not guarantee confidentiality, coverage, remedy or protection from practical retaliation.
  expected_burden: Two 25-minute source checks and one verified information inquiry when a real question
    is current.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Worker rights and employment law literacy protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Worker rights and employment law literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    agency channels, an interpreter, a union representative or qualified employment adviser as appropriate.
    Official sources may differ by location and worker category. The exercise does not guarantee confidentiality,
    coverage, remedy or protection from practical retaliation.
  actions:
  - stable_id: PRACTICE-COMP-2115-WORKER-RIGHTS-AND-EMPLOYMENT-LAW-LITERACY-01-A1
    sequence: 1
    title: Classify the question and the facts needed to answer it
    instructions: 'Separate wages and hours from discrimination, accommodation, safety, leave, classification
      and contract questions. Give each area a relevant-or-not disposition for the case rather than assuming
      one agency answers everything. Identify location, sector and work arrangement as facts that may
      affect coverage, but do not decide employee or contractor status from a label alone. Record what
      is known and what a qualified adviser would need without collecting unrelated private details.


      Observation checks: All eight workplace issue areas are distinguished; Jurisdiction sector and arrangement
      are identified as coverage questions; A contractual label is not treated as a complete classification
      decision; Known facts and missing facts are separated. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2115-WORKER-RIGHTS-AND-EMPLOYMENT-LAW-LITERACY-01
      action_stable_id: PRACTICE-COMP-2115-WORKER-RIGHTS-AND-EMPLOYMENT-LAW-LITERACY-01-A1
      competency_stable_id: '21.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
