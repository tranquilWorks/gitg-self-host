  - id: file-later-packet-md
    title: Later packet
    body: 'Open only after saving both inventory A and B attempts from the learner guide.


      Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      The first revised A report correctly shows **20 + 30 − 18 = 32 packs on hand; 32 − 5 = 27 available**,
      but labels 27 as “total stock” in its heading. The calculation alone does not satisfy the distinction
      criterion. The author changes the heading to “Available packs after reservations” and retains both
      figures.


      For fresh B, the author writes **15 + 25 − 17 = 23 on hand; 23 − 4 = 19 available**, identifies
      PAPER-STOCK-B and its date, and says these totals rely on the supplied movements and reservations,
      not a verified physical count. A fictional remote reader reproduces both totals and distinguishes
      their meaning without hints. The final B report meets the four declared criteria.


      This is a narrow supplied demonstration of transparent reporting. There is no actual practitioner
      contact, hiring outcome, credential, tool mastery or validated market forecast. The next learning
      step is a missing-input case; choosing a Quartz course remains unjustified by these two conflicting
      fictional notices alone.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Turn a changing work demand into a small demonstration of transferable skill. Allow two twenty-five-minute
      reviews and thirty minutes for a sample. Use the fictional notices and inventory below. You do not
      need to buy training, change jobs, predict an industry or use confidential employer work. The question
      is what you can now demonstrate under a new requirement, with your existing strengths and constraints
      kept visible.


      ### Save both attempts before the combined answer packet


      Work inventory A and inventory B from the supplied input cards and save both calculations before
      opening the later packet. That packet contains both answers and a fictional reader outcome. In the
      numbered workflow, prepare the B attempt before following action 3’s later-packet link; action 4
      then compares the already saved B attempt. Reading either answer first makes the corresponding attempt
      supported practice.


      ### Distinguish a signal from a forecast


      A vacancy notice describes one organization''s stated demand at one time. It may contain a firm
      requirement, a preference, an aspirational list or an advertisement. A practitioner''s account describes
      experience from a particular position. Neither is the whole labor market. Record source, date, claim
      type and scope before translating a signal into a learning priority. Contradictory sources are useful
      because they show where a conclusion is fragile.


      Technology can change a tool or workflow while leaving the underlying reasoning valuable. A reporting
      system may automate a total but still require someone to check units, define what the number includes
      and explain it to another person. Industry practices can change what must be documented; social
      changes can make remote participation and accessible communication more important. These influences
      interact, so do not explain every new demand with a single fashionable technology.


      Separate the durable fundamental from the implementation. Numerical checking can transfer from paper
      to a spreadsheet. Clear writing can transfer from a local meeting to an asynchronous report. A reliable
      handoff can transfer across tools while retaining source, assumptions, owner and next action. Transfer
      is not automatic: an expert in one tool may still need practice in a new format. Existing competence
      is a resource, not a reason to skip a meaningful demonstration.


      Choose a gap from an artifact rather than anxiety. “I need to learn everything about automation”
      cannot guide a bounded task. “My report gives a number but not the inputs or calculation a remote
      reader needs” can. Set the acceptance criterion before revising, use a free or already available
      resource, and make the sample small enough to finish within your actual time. Family responsibilities,
      disability, income and access are legitimate constraints, not lack of ambition.


      Marketable capability means useful work someone can inspect, not exaggerated credentials. A checked
      sample supports a specific claim about that task. It does not make you an accountant, data scientist
      or expert in every reporting tool. Describe what you did, under which supplied conditions and with
      what remaining help. Do not publish protected work or make a portfolio artifact look like paid client
      experience when it is a simulation.


      Update the plan from both success and uncertainty. A correct calculation with an unreadable summary
      still misses the accessible-reporting demand. A polished summary with an unreproducible number misses
      verification. One finished sample can justify a next practice step while leaving employment outcomes
      unknown. If the two job notices disagree about a tool, practicing the shared fundamental may be
      a better immediate choice than buying a tool-specific credential.


      ### Worked example


      A report says “27 units available.” Its author knows the calculation but a remote reader cannot
      reproduce it. The missing capability is transparent explanation, not necessarily a new software
      package. Adding starting quantity, movements, reserved stock, formulas and an accurate text summary
      makes the reasoning inspectable. A fresh dataset then checks whether the skill transfers beyond
      copying one answer.


      ### Complete fictional evidence and sample


      These are invented market signals, not real job advertisements or current labor-market evidence.
      **Notice A, 1 September 2026:** a records role requires a readable summary, reproducible quantity
      check and remote handoff; experience with fictional **Quartz** is preferred. **Notice B, 12 September
      2026:** another records role requires the same three outputs, accepts any approved tool and does
      not require Quartz. **Practitioner note, 18 September 2026:** one willing fictional records worker
      says automated exports still need checks of definitions and reserved quantities; this is one account,
      not proof of a sector trend.


      Technology signal: automated exports and a named tool preference. Industry/workflow signal: records
      must support remote checking. Social/access signal: recipients need readable asynchronous information.
      Their relevance in this case is stipulated. No source gives hiring probabilities, wages, training
      returns or a forecast that the old role will disappear.


      The starter inventory is labeled **PAPER-STOCK-A, 20 September**, with units of paper packs. Beginning
      stock **20**, received **30**, issued **18**, and **5 packs reserved** within the remaining stock.
      There are no other movements. The old report states only “27 available.” A reserved pack remains
      physically on hand but cannot be counted as available for the new request. The intended reader must
      reproduce on-hand and available quantities without asking the author.


      Acceptance requires four things: identify the dated input card and units; show both calculations;
      distinguish on-hand from available; and provide a plain-text handoff with the remaining limitation.
      The authorized input card is the source for this toy, not evidence of a real count. For a fresh
      transfer, **PAPER-STOCK-B, 21 September** has beginning **15**, received **25**, issued **17**,
      reserved **4**, no other movements and the same units. All materials are supplied; a new tool is
      optional.


      ### Build a demonstrated adaptation


      1. Compare the three dated signals and classify each statement. Map the shared demands to numerical
      checking, communication and dependable handoff. Output: a short evidence map with the Quartz disagreement
      and sample limits.

      2. Assess the old report against the four criteria and choose the missing reproducibility as a gap.
      Use these instructions and the supplied cards as the free learning resource; set a thirty-minute
      limit. Output: a specific capability target without a purchase or credential claim.

      3. Write the A report with formulas, definitions and a readable summary. Save it before the [later
      packet](?resource=file-later-packet-md). Output: a non-sensitive version a remote reader could check.

      4. Produce the B report from its own inputs, then compare with the supplied reader check. Output:
      a fresh transfer result, not a copied number.

      5. Update the plan: name the narrow demonstrated capability, a remaining practice need and the unresolved
      market conclusion. Output: an honest sample description and next step.


      ### Support and transfer


      Use a calculator, spoken arithmetic or a simple table; the criterion is reproducibility, not mental
      speed. A harder case omits reserved stock: report on-hand and mark availability unknown rather than
      assuming zero reservations. In actual career work, inspect current relevant sources, obtain permission
      for accounts and preserve protected materials. One sample cannot resolve licensing, contractual
      or high-consequence career decisions.


      ### Source use


      [ILO''s lifelong-learning article, S04](https://www.ilo.org/resource/news/lifelong-learning-must-become-strategic-policy-priority),
      discusses changing demands alongside foundational capabilities and unequal access to learning. Only
      the article was read, not the linked full report or datasets. Its statistics and projections are
      not imported into this fictional exercise or used as a personal employability forecast.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


