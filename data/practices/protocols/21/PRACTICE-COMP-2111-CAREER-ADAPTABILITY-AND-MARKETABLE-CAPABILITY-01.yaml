meaning_and_fit:
  purpose: Distinguish durable fundamentals from changing tools or market signals and produce a small
    evidence-based adaptation rather than chasing every trend.
  why_recommended: Distinguish durable fundamentals from changing tools or market signals and produce
    a small evidence-based adaptation rather than chasing every trend.
  claims:
  - statement: Distinguish durable fundamentals from changing tools or market signals and produce a small
      evidence-based adaptation rather than chasing every trend.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Career adaptability and marketable capability practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Career adaptability and marketable capability as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the supplied fictional role, public-domain material and accessible tools
    when real work samples are restricted. Career constraints, care duties and limited time are legitimate
    planning inputs. Obtain qualified advice for contractual, licensing or high-consequence career decisions.
  opportunity_considerations: 'Use a fictional change in a role: reports now require an accessible summary,
    a reproducible data check and remote handoff. For a real role, use two current public job or professional
    sources plus one practitioner account with permission, recording dates and uncertainty. Prepare columns
    for changing demand, durable fundamental, current evidence, gap and sample task.'
  prerequisites:
  - 'Use a fictional change in a role: reports now require an accessible summary, a reproducible data
    check and remote handoff. For a real role, use two current public job or professional sources plus
    one practitioner account with permission, recording dates and uncertainty. Prepare columns for changing
    demand, durable fundamental, current evidence, gap and sample task.'
  dependencies: []
  safe_alternatives:
  - Use the supplied fictional role, public-domain material and accessible tools when real work samples
    are restricted. Career constraints, care duties and limited time are legitimate planning inputs. Obtain
    qualified advice for contractual, licensing or high-consequence career decisions.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Career adaptability and marketable capability differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Career adaptability and marketable
    capability as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional change in a role: reports now require an accessible summary, a reproducible
    data check and remote handoff. For a real role, use two current public job or professional sources
    plus one practitioner account with permission, recording dates and uncertainty. Prepare columns for
    changing demand, durable fundamental, current evidence, gap and sample task. Goal: Distinguish durable
    fundamentals from changing tools or market signals and produce a small evidence-based adaptation rather
    than chasing every trend. Scope: This is career learning and capability mapping, not a guarantee of
    employability, a recommendation to buy training or a forecast of an industry’s future. Time and effort:
    Two 25-minute evidence reviews and one 30-minute safe work sample. Adaptation: Use the supplied fictional
    role, public-domain material and accessible tools when real work samples are restricted. Career constraints,
    care duties and limited time are legitimate planning inputs. Obtain qualified advice for contractual,
    licensing or high-consequence career decisions. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the supplied fictional role, public-domain material and accessible tools when
    real work samples are restricted. Career constraints, care duties and limited time are legitimate
    planning inputs. Obtain qualified advice for contractual, licensing or high-consequence career decisions.
  expected_burden: Two 25-minute evidence reviews and one 30-minute safe work sample.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Career adaptability and marketable capability protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Career adaptability and marketable capability action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the supplied
    fictional role, public-domain material and accessible tools when real work samples are restricted.
    Career constraints, care duties and limited time are legitimate planning inputs. Obtain qualified
    advice for contractual, licensing or high-consequence career decisions.
  actions:
  - stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01-A1
    sequence: 1
    title: Separate a dated signal from a durable requirement
    instructions: 'Identify the technology, industry or social change described by each source and whether
      it is a requirement, preference, advertisement or prediction. For the default, accessibility, reproducibility
      and remote coordination connect to clear communication, numerical checking and reliable handoffs.
      Compare sources rather than treating one job posting as the whole market. Mark contradictory signals
      and avoid assuming that a new tool makes existing knowledge worthless.


      Observation checks: Signals are dated and classified by what they actually claim; Technology industry
      and social changes are considered; Durable fundamentals are linked to changing demands; Contradictory
      evidence and market-sample limits remain visible. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01
      action_stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01-A1
      competency_stable_id: '21.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2111_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2111_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - signals_are_dated_and_classified_by_what_they_actually_claim
        - technology_industry_and_social_changes_are_considered
        - durable_fundamentals_are_linked_to_changing_demands
        - contradictory_evidence_and_market_sample_limits_remain_visible
      - measurement_id: c2111_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2111_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01-A2
    sequence: 2
    title: Choose one capability gap that can be demonstrated safely
    instructions: 'Review a non-sensitive prior sample or the supplied fictional task against the new
      demand. Select one specific gap, such as making a calculation reproducible for a remote reader,
      and state what a competent demonstration would contain. Choose a free or already available learning
      resource and a time limit. Do not purchase a course, exaggerate credentials or copy protected employer
      work to create a portfolio item.


      Observation checks: The gap is based on a sample rather than anxiety alone; A demonstrable acceptance
      criterion is defined; A bounded accessible learning route is selected; Credentials and protected
      work are not misrepresented. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01
      action_stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01-A2
      competency_stable_id: '21.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2111_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2111_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_gap_is_based_on_a_sample_rather_than_anxiety_alone
        - a_demonstrable_acceptance_criterion_is_defined
        - a_bounded_accessible_learning_route_is_selected
        - credentials_and_protected_work_are_not_misrepresented
      - measurement_id: c2111_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2111_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01-A3
    sequence: 3
    title: Create a small transfer sample and update the plan
    instructions: 'Produce a harmless sample that uses the durable fundamental in the new format, such
      as a short report with its input assumptions, check and accessible handoff note. Ask a willing reader
      or compare against the declared criterion to see whether the new capability is visible. Record what
      you can now demonstrate, what still needs practice and which market signal remains uncertain. A
      small sample supports a narrow claim, not a declaration that you are ready for every role using
      the tool.


      Observation checks: A concrete non-sensitive adaptation sample is produced; The sample is checked
      against the declared criterion; Demonstrated capability and remaining learning are separated; Employability
      and broad expertise are not inferred from one sample. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which fundamental stayed valuable through the change, and what can you now show rather
      than merely say you are keeping up with?


      Examples: Supportive: The participant linked a new reporting format to durable communication and
      verification skills and produced a checked sample without claiming a new professional credential.


      Mixed: Sources disagreed about a tool, so the participant practiced the transferable requirement
      and kept the market conclusion provisional.


      Contradictory: Trend anxiety led to unsupported job forecasts, expensive training commitments or
      use of confidential work as a public sample.


      Inconclusive: A list of fashionable skills was made without a dated signal, specific gap or demonstrable
      adaptation.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01
      action_stable_id: PRACTICE-COMP-2111-CAREER-ADAPTABILITY-AND-MARKETABLE-CAPABILITY-01-A3
      competency_stable_id: '21.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
