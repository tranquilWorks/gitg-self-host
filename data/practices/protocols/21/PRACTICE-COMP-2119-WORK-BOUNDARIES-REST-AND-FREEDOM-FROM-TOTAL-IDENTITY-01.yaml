        - necessary_responsibilities_have_an_appropriate_handoff
        - unsafe_power_conditions_change_the_communication_plan
        - the_boundary_is_not_secretly_canceled_by_unreported_extra_work
      - measurement_id: c2119_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2119_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01-A3
    sequence: 3
    title: Use the protected time and review identity as well as logistics
    instructions: 'Spend the agreed nonwork period in the chosen activity without turning it into another
      productivity target. Notice an urge to check work or justify your worth through output, and distinguish
      that urge from an actual duty. At the next work period, check whether the handoff held and repair
      any genuine missed commitment. Record what you valued outside work and whether the boundary needs
      adjustment; one restful period does not prove that work-life conflict is solved.


      Observation checks: The protected period is actually used or its failure is recorded; Worth is not
      measured by occupational output; Actual duty and checking urges are distinguished; Handoff problems
      are repaired without erasing the boundary. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What remained responsibly covered, what nonwork good received real time, and did you
      allow yourself worth that was not earned by another deliverable?


      Examples: Supportive: The participant gave a clear next availability, preserved the urgent route
      and spent a protected period with a valued nonwork activity.


      Mixed: The boundary was stated but repeatedly checked away; the participant adjusted the notification
      and handoff arrangement.


      Contradictory: Essential work was abandoned without a handoff, or the participant secretly worked
      through the boundary to avoid disapproval.


      Inconclusive: Rest and balance were praised without a specific boundary or any protected nonwork
      participation.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
