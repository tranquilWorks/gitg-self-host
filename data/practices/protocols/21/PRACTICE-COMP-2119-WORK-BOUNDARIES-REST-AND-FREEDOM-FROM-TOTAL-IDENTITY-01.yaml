  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      At 16:55 Jo accepts reformatting during Alex''s next ordinary work period, starting at **09:00**,
      for the **10:00** review. The existing Duty Desk coverage remains with Tess; nobody adds an unaccepted
      duty. No urgent incident occurs.


      Alex draws during the planned thirty-minute interval but checks the ordinary work inbox from **17:05–17:09**
      and **17:20–17:23**. No urgent request or new duty is found, and no formatting work is done secretly.
      The checks interrupt the interval for **seven minutes**, leaving **23 minutes of drawing across
      three segments**, not thirty uninterrupted minutes. The longest segment is eleven minutes.


      The next day Alex starts at 09:00, finishes the twenty-minute reformat at **09:20**, and Jo accepts
      it at **09:25**, before the 10:00 review. No missed commitment is supplied. Alex plans to close
      ordinary notifications during the next agreed interval while preserving the actual urgent arrangement.
      That adjustment is a plan, not yet a tested habit; the case proves no durable balance, health outcome
      or personal worth score.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Close one work period responsibly and use time for a freely chosen nonwork role. Allow fifteen
      minutes to prepare, one boundary conversation or rehearsal and one short nonwork period. Use the
      supplied optional request. This practice does not authorize abandoning essential duties, breaking
      an agreement or confronting unsafe power conditions. Rest and human worth do not need to be earned
      through a perfect workday.


      ### Distinguish an actual duty from indefinite availability


      Begin with the request, its consequence and the person who can prioritize it. “Can you do this now?”
      can express urgency, habit or preference. Ask when the result is needed and what happens if it waits.
      A real safety or contractual duty differs from an unspoken expectation that someone will always
      absorb more work. Neither ignoring every late request nor accepting every one is responsible judgment.


      Capacity is finite. A new task can displace another commitment, extend the work period or wait.
      Make that choice visible to the appropriate owner. A prioritization question such as “Which existing
      task should move if this is needed today?” can be more realistic than a unilateral refusal in some
      settings. Do not promise hidden evening work just to make a boundary appear agreeable; that conceals
      the actual resource decision.


      Prepare a clear handoff: current status, what remains, next availability and the genuine urgent
      route where the role requires one. An escalation route must exist and have an accepted owner. Naming
      a colleague who never agreed to cover does not discharge responsibility. Ordinary work and urgent
      matters may use different channels; do not make an optional formatting request sound like an emergency
      to secure attention.


      Different roles have different coverage obligations. Shift work, on-call duties and dependent care
      may require a handover before a person can step away. A real urgent situation can change a plan
      without proving that all boundaries were unreasonable. Conversely, a vague possibility that something
      might happen is not automatically a reason for unlimited personal monitoring. Follow actual arrangements,
      and seek appropriate support where retaliation or precarity makes a direct conversation unsafe.


      Protect something positively valued outside work. Health, family, friendship, civic life, worship,
      leisure or another chosen commitment can matter; none is mandatory for everyone. The activity need
      not become a self-improvement project. Drawing for pleasure, listening to music or spending quiet
      time with someone can be enough. Avoid turning rest into another output standard that produces guilt
      when it is imperfect.


      Identity extends beyond occupational performance. The urge to check messages may reflect habit,
      worry or a real responsibility; inspect which it is instead of assuming every urge is a duty. A
      mistake at work can require repair without becoming a judgment of personal worth. A restful interval
      need not prove increased productivity to count as worthwhile. Equally, a boundary statement does
      not prove the time was actually used as intended.


      Review logistics and experience honestly. How much of the planned period was interrupted? Did you
      secretly complete the work you had deferred? Was urgent coverage actually accepted, and did a real
      missed commitment emerge? Record a mixed outcome without redefining success afterward. Adjust the
      channel or agreement and repair genuine problems. One period cannot establish a durable solution
      to workload conflict or a health outcome.


      ### Worked example


      Someone agrees to defer a nonurgent formatting request and plans thirty minutes of drawing. They
      then spend seven minutes checking the work inbox despite receiving no urgent message. The agreement
      held, but the uninterrupted rest claim did not. Twenty-three minutes of drawing still occurred in
      several segments. The lesson is to distinguish a checking urge from the accepted duty arrangement,
      not to decide the person failed at having boundaries.


      ### Complete fictional boundary case


      Alex''s agreed work period ends at **17:00 UTC on 12 November 2026**. At **16:50**, Jo asks for
      a twenty-minute reformat of an already complete internal note for a review at **10:00 UTC the next
      day**. The wording and facts are already complete; the request is cosmetic and explicitly nonurgent.
      Jo may prioritize this note. Alex''s next ordinary availability is **09:00 UTC on 13 November**,
      with a thirty-minute slot available for this task.


      The team has a separate fictional **Duty Desk** route for genuine urgent issues. Tess has already
      accepted that role from **17:00–19:00 UTC** on 12 November; the formatting request does not qualify
      for that route. These are supplied facts, not permission to redirect an actual workplace''s responsibilities.
      No urgent incident or other unfinished essential duty is described.


      Alex chooses paper drawing from **17:00–17:30** for enjoyment, not as a work-improvement exercise.
      The ordinary work inbox is separate from the accepted urgent arrangement. Alex can write a response
      with status, deferred task, next availability and existing urgent route, while asking Jo to confirm
      the timing. Nothing in the case requires discussing family, health or private beliefs to justify
      the boundary.


      ### State the boundary and inspect what happened


      1. Identify the real deadline, urgency, decision owner, available time and accepted coverage. Compare
      the twenty-minute task with the ten minutes before closing. Output: a realistic timing proposal
      instead of an impossible promise.

      2. Draft a response: completed content, reformatting still open, next start at 09:00 and the existing
      urgent route if relevant. Save before the [later packet](?resource=file-later-packet-md). Output:
      a clear boundary or prioritization question with agreement still distinguished from a proposal.

      3. Use the later packet to separate Jo''s acceptance, actual activity, interruptions and next-day
      completion. Output: an honest record of what the boundary protected and what it did not.

      4. Choose one adjustment that does not transfer unaccepted work to someone else. Output: a better
      ordinary-notification arrangement or clearer agreement, while keeping genuine duties covered.

      5. Name a nonwork good that mattered without rating it by productivity. Output: a brief reflection
      in which worth remains independent of output and the partial interruption remains visible.


      ### Support and transfer


      Use a shorter interval, an accessible leisure activity or a private fictional rehearsal. A harder
      branch removes Tess''s accepted coverage while adding a real urgent duty: clarify and arrange the
      duty before assuming you can leave. In an unsafe or precarious role, use appropriate labor, organizational
      or qualified support. Do not disable required alerts, conceal a missed commitment or impose an unagreed
      burden on colleagues.


      ### Source use


      [HSE''s Management Standards on Demands, S14](https://www.hse.gov.uk/stress/standards/demands.htm),
      relates achievable demands to agreed work hours and systems for responding to concerns. It supplies
      a narrow organizational principle, not a universal legal right to disconnect, a clinical intervention
      or proof that one protected interval resolves work-life conflict.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. A twenty-minute optional task arrives ten minutes before closing and is needed tomorrow. Must
      it be finished before leaving today?

      2. A colleague is named as the urgent contact but has not accepted coverage. Is the handoff complete?

      3. A thirty-minute rest period contains seven minutes of ordinary inbox checking. What should the
      review preserve?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Not from these facts. Clarify priority and agree a realistic next slot while preserving
      genuine duties and accepted coverage. Do not promise hidden work or infer urgency from arrival time
      alone.

      2. No. Confirm the real arrangement and authority. Naming someone does not transfer responsibility,
      and a boundary should not create unagreed work for another person.

      3. Twenty-three minutes of the chosen activity occurred in interrupted segments, not thirty uninterrupted
      minutes. Distinguish checking urges from actual duty, improve the arrangement and keep worth independent
      of the result.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
