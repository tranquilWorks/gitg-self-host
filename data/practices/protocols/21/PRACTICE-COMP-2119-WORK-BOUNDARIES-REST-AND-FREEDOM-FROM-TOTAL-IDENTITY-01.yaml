meaning_and_fit:
  purpose: Set or negotiate a realistic work boundary, preserve necessary handoffs and deliberately participate
    in a valued nonwork role without treating rest as a performance failure.
  why_recommended: Set or negotiate a realistic work boundary, preserve necessary handoffs and deliberately
    participate in a valued nonwork role without treating rest as a performance failure.
  claims:
  - statement: Set or negotiate a realistic work boundary, preserve necessary handoffs and deliberately
      participate in a valued nonwork role without treating rest as a performance failure.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Work boundaries, rest, and freedom from total identity
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Work boundaries, rest, and freedom from total identity as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use a shorter interval, an accessible leisure activity or a supported prioritization
    discussion. People with urgent care, shift or on-call duties should follow their real coverage arrangements.
    Retaliation, labor-rights or health concerns warrant appropriate qualified support.
  opportunity_considerations: Default to a nonurgent request arriving near an agreed end of work. Prepare
    a response with current status, what can wait, the next availability and a genuine urgent route where
    your role requires one. Choose a small nonwork activity connected to health, family, civic life, worship,
    leisure or another freely chosen value.
  prerequisites:
  - Default to a nonurgent request arriving near an agreed end of work. Prepare a response with current
    status, what can wait, the next availability and a genuine urgent route where your role requires one.
    Choose a small nonwork activity connected to health, family, civic life, worship, leisure or another
    freely chosen value.
  dependencies: []
  safe_alternatives:
  - Use a shorter interval, an accessible leisure activity or a supported prioritization discussion. People
    with urgent care, shift or on-call duties should follow their real coverage arrangements. Retaliation,
    labor-rights or health concerns warrant appropriate qualified support.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Work boundaries, rest, and freedom from total identity differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Work boundaries, rest, and
    freedom from total identity as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a nonurgent request arriving near an agreed end of work. Prepare a response with
    current status, what can wait, the next availability and a genuine urgent route where your role requires
    one. Choose a small nonwork activity connected to health, family, civic life, worship, leisure or
    another freely chosen value. Goal: Set or negotiate a realistic work boundary, preserve necessary
    handoffs and deliberately participate in a valued nonwork role without treating rest as a performance
    failure. Scope: Use an optional or negotiable low-stakes work demand. This is not advice to abandon
    essential duties, violate an employment arrangement or confront unsafe power dynamics without support.
    Time and effort: Fifteen minutes to prepare, one boundary conversation or rehearsal and one protected
    nonwork period with review. Adaptation: Use a shorter interval, an accessible leisure activity or
    a supported prioritization discussion. People with urgent care, shift or on-call duties should follow
    their real coverage arrangements. Retaliation, labor-rights or health concerns warrant appropriate
    qualified support. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a shorter interval, an accessible leisure activity or a supported prioritization
    discussion. People with urgent care, shift or on-call duties should follow their real coverage arrangements.
    Retaliation, labor-rights or health concerns warrant appropriate qualified support.
  expected_burden: Fifteen minutes to prepare, one boundary conversation or rehearsal and one protected
    nonwork period with review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Work boundaries, rest, and freedom from total identity protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Work boundaries, rest, and freedom from total identity action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a shorter
    interval, an accessible leisure activity or a supported prioritization discussion. People with urgent
    care, shift or on-call duties should follow their real coverage arrangements. Retaliation, labor-rights
    or health concerns warrant appropriate qualified support.
  actions:
  - stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01-A1
    sequence: 1
    title: Separate a real duty from indefinite expansion
    instructions: 'Identify what the request actually requires, the consequence of waiting and who has
      authority to prioritize it. Distinguish contractual or safety duties from an unspoken expectation
      of constant availability. Review the cost to health, relationships and other valued roles, without
      assuming every role must be active for every person. State a boundary you can control or a prioritization
      question you can safely ask, such as Which existing task should move if this is needed today.


      Observation checks: Duty urgency and authority are distinguished; Indefinite availability is not
      assumed to be essential; Costs to freely chosen nonwork roles are considered; The proposed boundary
      or prioritization question is realistic. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01
      action_stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01-A1
      competency_stable_id: '21.19'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2119_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2119_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - duty_urgency_and_authority_are_distinguished
        - indefinite_availability_is_not_assumed_to_be_essential
        - costs_to_freely_chosen_nonwork_roles_are_considered
        - the_proposed_boundary_or_prioritization_question_is_realistic
      - measurement_id: c2119_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2119_a1_adverse
        kind: boolean
        role: adverse
