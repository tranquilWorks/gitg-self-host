        expected: true
  - stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01-A2
    sequence: 2
    title: Communicate the limit and preserve the necessary handoff
    instructions: 'Use clear wording: The current draft is complete through this section; I can take the
      new request tomorrow at the agreed time. If the matter is genuinely urgent, use the established
      escalation or coverage arrangement rather than ignoring it. For an unsafe or precarious setting,
      rehearse privately and seek appropriate advice instead of direct confrontation. Do not apologize
      for having human limits or promise hidden after-hours work to make the boundary appear accepted.


      Observation checks: Status next availability and any urgent route are clear; Necessary responsibilities
      have an appropriate handoff; Unsafe power conditions change the communication plan; The boundary
      is not secretly canceled by unreported extra work. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01
      action_stable_id: PRACTICE-COMP-2119-WORK-BOUNDARIES-REST-AND-FREEDOM-FROM-TOTAL-IDENTITY-01-A2
      competency_stable_id: '21.19'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2119_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2119_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
