meaning_and_fit:
  purpose: Question a work assumption, combine useful ideas and compare a reversible change with the current
    method using a defined benefit and a cost check.
  why_recommended: Question a work assumption, combine useful ideas and compare a reversible change with
    the current method using a defined benefit and a cost check.
  claims:
  - statement: Question a work assumption, combine useful ideas and compare a reversible change with the
      current method using a defined benefit and a cost check.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Innovation and improvement practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Innovation and improvement as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use paper cards, accessible filenames or another low-risk reversible process.
    Follow change-control and privacy rules for any real work. A simulation demonstrates a design comparison,
    not a production improvement or general causal effect.
  opportunity_considerations: Default to finding the latest version among five fictional documents. Compare
    the current naming method with a simple dated version label and a clearly marked current file. Define
    success as selecting the correct file without opening every document, while preserving readable names
    and avoiding duplicate confusion.
  prerequisites:
  - Default to finding the latest version among five fictional documents. Compare the current naming method
    with a simple dated version label and a clearly marked current file. Define success as selecting the
    correct file without opening every document, while preserving readable names and avoiding duplicate
    confusion.
  dependencies: []
  safe_alternatives:
  - Use paper cards, accessible filenames or another low-risk reversible process. Follow change-control
    and privacy rules for any real work. A simulation demonstrates a design comparison, not a production
    improvement or general causal effect.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Innovation and improvement differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Innovation and improvement
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to finding the latest version among five fictional documents. Compare the current naming
    method with a simple dated version label and a clearly marked current file. Define success as selecting
    the correct file without opening every document, while preserving readable names and avoiding duplicate
    confusion. Goal: Question a work assumption, combine useful ideas and compare a reversible change
    with the current method using a defined benefit and a cost check. Scope: Use a harmless authorized
    process or simulation. This is not permission to experiment on customers, change production systems
    or claim causality from an uncontrolled single comparison. Time and effort: Twenty minutes to define
    the test, two short baseline uses, two changed uses and a 15-minute review. Adaptation: Use paper
    cards, accessible filenames or another low-risk reversible process. Follow change-control and privacy
    rules for any real work. A simulation demonstrates a design comparison, not a production improvement
    or general causal effect. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use paper cards, accessible filenames or another low-risk reversible process. Follow
    change-control and privacy rules for any real work. A simulation demonstrates a design comparison,
    not a production improvement or general causal effect.
  expected_burden: Twenty minutes to define the test, two short baseline uses, two changed uses and a
    15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Innovation and improvement protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Innovation and improvement action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use paper cards,
    accessible filenames or another low-risk reversible process. Follow change-control and privacy rules
    for any real work. A simulation demonstrates a design comparison, not a production improvement or
    general causal effect.
  actions:
  - stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01-A1
    sequence: 1
    title: State the assumption and the useful outcome
    instructions: 'Describe the recurring problem and the assumption sustaining it, such as everyone remembers
      which filename is current. Ask what a better outcome would be for the user, not what tool would
      look innovative. Combine two modest ideas, a consistent label and an explicit current marker, and
      predict how they might reduce confusion. Identify a downside such as maintaining the marker or making
      names harder to read.


      Observation checks: A specific assumption and user problem are stated; The desired benefit is observable;
      The proposed change combines ideas for a reason; A maintenance or usability downside is anticipated.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01
      action_stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01-A1
      competency_stable_id: '21.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2110_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2110_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_specific_assumption_and_user_problem_are_stated
        - the_desired_benefit_is_observable
        - the_proposed_change_combines_ideas_for_a_reason
        - a_maintenance_or_usability_downside_is_anticipated
      - measurement_id: c2110_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2110_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01-A2
    sequence: 2
    title: Compare the old and new methods on equivalent cases
    instructions: 'Use two fictional file sets with known correct answers for the current method and two
      comparable sets for the changed method. Record whether the correct file is selected and any extra
      checking required. Keep difficulty similar and note learning or order effects rather than claiming
      a controlled experiment. Do not delete real documents or alter a shared production workflow merely
      to create a baseline failure.


      Observation checks: Both methods receive comparable harmless trials; Correctness and extra checking
      are recorded; Learning and order effects are acknowledged; No real data or production workflow is
      put at risk. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01
      action_stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01-A2
      competency_stable_id: '21.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2110_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2110_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_methods_receive_comparable_harmless_trials
        - correctness_and_extra_checking_are_recorded
        - learning_and_order_effects_are_acknowledged
        - no_real_data_or_production_workflow_is_put_at_risk
      - measurement_id: c2110_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2110_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01-A3
    sequence: 3
    title: Keep, revise or reject the change from evidence
    instructions: 'Compare benefit with setup and maintenance cost, including any new ambiguity. Ask a
      willing user or owner whether the improvement is worth adopting under their constraints. Retain
      a small useful change, revise a mixed one or reject it without treating rejection as failure of
      creativity. Record one lesson about the original assumption and the limits of the test. Novelty
      alone is not a reason to institutionalize the new method.


      Observation checks: Benefits and new costs are compared; The affected owner or user informs adoption;
      Keep revise or reject is justified by evidence; Useful learning is recorded even without adoption.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: What value did the change create after counting its burden, and what did the test
      teach that enthusiasm for a new idea would have missed?


      Examples: Supportive: The new labels improved correct selection in the test and the owner accepted
      a low-maintenance version of the change.


      Mixed: Selection improved but maintaining a separate marker caused errors, so the participant revised
      rather than adopted the whole idea.


      Contradictory: A new tool was declared an improvement without comparison, or real user data were
      put at risk for an experiment.


      Inconclusive: Ideas were brainstormed without a predicted benefit, comparable trial or adoption
      decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01
      action_stable_id: PRACTICE-COMP-2110-INNOVATION-AND-IMPROVEMENT-01-A3
