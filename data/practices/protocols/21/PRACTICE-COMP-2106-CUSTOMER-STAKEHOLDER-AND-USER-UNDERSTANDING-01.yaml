meaning_and_fit:
  purpose: Identify who is affected by a work product, observe the problem from their side and revise
    one requirement based on actual downstream use.
  why_recommended: Identify who is affected by a work product, observe the problem from their side and
    revise one requirement based on actual downstream use.
  claims:
  - statement: Identify who is affected by a work product, observe the problem from their side and revise
      one requirement based on actual downstream use.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Customer, stakeholder, and user understanding practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Customer, stakeholder, and user understanding as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible formats, an interpreter or a fictional task with a trusted
    peer. People may decline without affecting employment or service. Keep protected workplace, client
    and personal data outside the exercise and follow organizational research permissions.
  opportunity_considerations: Default to a meeting invitation that a new participant must use to find
    the correct location and join. Use fictional details and a willing reader unfamiliar with the draft.
    Prepare headings for primary user, downstream helper, affected nonuser, intended task, friction and
    success.
  prerequisites:
  - Default to a meeting invitation that a new participant must use to find the correct location and join.
    Use fictional details and a willing reader unfamiliar with the draft. Prepare headings for primary
    user, downstream helper, affected nonuser, intended task, friction and success.
  dependencies: []
  safe_alternatives:
  - Use accessible formats, an interpreter or a fictional task with a trusted peer. People may decline
    without affecting employment or service. Keep protected workplace, client and personal data outside
    the exercise and follow organizational research permissions.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Customer, stakeholder, and user understanding differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Customer, stakeholder, and
    user understanding as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a meeting invitation that a new participant must use to find the correct location
    and join. Use fictional details and a willing reader unfamiliar with the draft. Prepare headings for
    primary user, downstream helper, affected nonuser, intended task, friction and success. Goal: Identify
    who is affected by a work product, observe the problem from their side and revise one requirement
    based on actual downstream use. Scope: Use a willing participant and a harmless authorized artifact.
    This is not market validation, covert research or permission to collect client, employee or personal
    data. Time and effort: Fifteen minutes of preparation, one 20-minute observation and a short revision
    test. Adaptation: Use accessible formats, an interpreter or a fictional task with a trusted peer.
    People may decline without affecting employment or service. Keep protected workplace, client and personal
    data outside the exercise and follow organizational research permissions. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible formats, an interpreter or a fictional task with a trusted peer.
    People may decline without affecting employment or service. Keep protected workplace, client and personal
    data outside the exercise and follow organizational research permissions.
  expected_burden: Fifteen minutes of preparation, one 20-minute observation and a short revision test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Customer, stakeholder, and user understanding protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Customer, stakeholder, and user understanding action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    formats, an interpreter or a fictional task with a trusted peer. People may decline without affecting
    employment or service. Keep protected workplace, client and personal data outside the exercise and
    follow organizational research permissions.
  actions:
  - stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01-A1
    sequence: 1
    title: Map the people affected before asking for opinions
    instructions: 'Identify who uses the invitation, who answers questions when it fails and who may be
      excluded by its format or assumptions. Write the practical task from the user’s perspective: know
      where to go, when to arrive and how to request access. State your current assumption about the main
      problem and what observation would contradict it. Do not substitute a senior stakeholder’s preference
      for every user’s experience.


      Observation checks: Primary downstream and excluded stakeholders are considered; The task is written
      in the user’s terms; An assumption and disconfirming observation are explicit; Authority or status
      is not treated as universal user knowledge. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01
      action_stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01-A1
      competency_stable_id: '21.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2106_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2106_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - primary_downstream_and_excluded_stakeholders_are_considered
        - the_task_is_written_in_the_user_s_terms
        - an_assumption_and_disconfirming_observation_are_explicit
        - authority_or_status_is_not_treated_as_universal_user_knowledge
      - measurement_id: c2106_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2106_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01-A2
    sequence: 2
    title: Observe a task without coaching the answer
    instructions: 'Ask the willing reader to use the fictional invitation to state the location, arrival
      time and access route. Let them describe confusion in their own words and avoid explaining what
      you meant while the task is underway. Ask a neutral follow-up about the hardest step. Record the
      observable obstacle and their voluntary feedback privately, not identity or sensitive circumstances.
      A compliment about the design is not equivalent to task success.


      Observation checks: A real harmless task is attempted by a willing user; The author avoids coaching
      during the observation; A neutral follow-up clarifies the actual obstacle; Task performance is distinguished
      from compliments. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01
      action_stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01-A2
      competency_stable_id: '21.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2106_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2106_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_real_harmless_task_is_attempted_by_a_willing_user
        - the_author_avoids_coaching_during_the_observation
        - a_neutral_follow_up_clarifies_the_actual_obstacle
        - task_performance_is_distinguished_from_compliments
      - measurement_id: c2106_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2106_a2_adverse
        kind: boolean
        role: adverse
