  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Reader A likes the invitation but chooses North because the public sign identifies it as the main
      entrance. They correctly report 18:00 UTC and Event Desk. The author does not coach the entrance
      answer or call the whole task successful because two other details were found.


      The requirement becomes “identify the correct entry point and its availability for this event time.”
      Corrected A names East Entrance from 17:45. A different willing fictional reader then uses B and
      identifies East from 18:45, the 19:00 UTC start and Event Desk without hints. Neither person actually
      travels or enters a building.


      The fictional helper confirms that Event Desk is the approved public label and that plain text can
      be handled through the existing process. No new private phone number, bespoke help duty or measured
      support-volume reduction is supplied. The task supports a narrow improved information result. Different
      readers and invitations limit causal comparison; other user needs, real accessibility and all-customer
      understanding remain unverified.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Let a downstream task change one requirement in a small work product. Allow fifteen minutes
      to prepare, a twenty-minute observation or supplied fictional equivalent, and a comparable retry.
      Use a meeting invitation with invented facts. Compliments and senior approval can coexist with a
      user being unable to complete the task.


      ### Find the practical need beyond internal preferences


      Identify who uses the artifact, who supports them when it fails and who may be affected without
      being a direct user. A new attendee may need an entrance, while an event helper handles questions
      caused by an omission. Someone unable to read an image may be excluded before reaching the nominal
      task. “The requester liked it” does not represent every one of those perspectives.


      State the need in the user''s terms before specifying a solution. “Know where to enter at the relevant
      time” is a need. “Add a map” is one possible response that might or might not address it. A requirement
      should follow evidence about the actual obstacle, with attention to constraints, access and downstream
      burden. A role title or majority preference does not automatically establish everyone''s needs.


      Observe a task rather than asking only for an opinion. Give a willing reader the harmless draft
      and ask them to identify the location, arrival time and access-question route. Let them work without
      explaining what you meant while the task is underway. Record the action or interpretation and ask
      a neutral follow-up about difficulty. A warm compliment can be sincere while the location is still
      wrong.


      A failed attempt tests your assumption, not the user''s worth or intelligence. Familiarity, language,
      format, context and missing information may affect the result. Ask what the artifact supplied and
      what it forced the user to invent. Avoid demanding private history to explain the difficulty. A
      single reader can reveal a real flaw, but cannot represent all potential users or establish a market
      segment''s prevalence.


      Revise a requirement, not just a cosmetic detail. If the user chose the main door because the invitation
      omitted the evening entrance, the relevant change is explicit time-appropriate entry information.
      A larger logo would not solve that mismatch. Tie the changed content to the observed need, check
      it against authorized facts and preserve other correct information.


      Test a fresh comparable invitation or ask another willing reader. The same person may remember the
      correction, while a different person introduces another change in conditions. State those limits.
      Check whether the solution creates new work for a helper, excludes another format or publishes a
      contact not authorized for that purpose. A narrowly better task result is valuable without becoming
      proof that every customer is understood.


      ### Worked example


      A first-time attendee praises an invitation''s appearance but selects the main entrance, which is
      closed at the event time. The author had assumed everyone knew the evening door. They add the named
      entry route from the owner''s information, keep a plain-text version and check a different invitation.
      The revised requirement is usable arrival information, not more decoration.


      ### Complete fictional invitations and owner facts


      Draft A says: **Design Review —14 October 2026, 18:00–19:00 UTC —Cedar Center, Birch Room —access
      questions: Event Desk**. It is plain text and has no entrance information. The building''s ordinary
      public sign points to the North main entrance. The owner fact card states that North is closed in
      the evening; use **East Entrance from 17:45**, with the internal sign to Birch Room. Event Desk
      is the approved fictional public questions label, not a real address. No real travel or access guarantee
      is supplied.


      The learner''s initial assumption is that a brighter title is the main improvement needed. The task
      asks a willing fictional first-time reader to identify where to enter, the start time and whom to
      ask about access. A downstream helper can review whether the public contact label is appropriate;
      no personal number or private condition may be added.


      For the comparable retry, Draft B must use the supplied facts **Planning Check —15 October 2026,
      19:00–20:00 UTC —Cedar Center, Birch Room —East Entrance from 18:45 —access questions: Event Desk**.
      This is a new invitation, not permission to reuse A''s start or entry-opening time blindly.


      ### Observe, change the requirement and check its effect


      1. Map primary user, downstream helper and a potentially excluded nonuser. State the task and what
      would contradict the brighter-title assumption. Output: a specific hypothesis and success criterion,
      not a list of stakeholder names.

      2. Present Draft A without hints. Record where the supplied reader would enter, when they would
      arrive and the questions route. Ask what made the choice difficult. Output: observed interpretation
      distinguished from praise and from an actual arrival.

      3. Compare the obstacle with the owner fact card. Revise the requirement to state the correct entrance
      and its opening time, keeping UTC, room and the approved contact. Output: evidence-to-requirement
      reasoning and a corrected A.

      4. Save your revision before the [later packet](?resource=file-later-packet-md). Test B using its
      own date and times with the new supplied reader. Output: a comparable task result without coaching
      or copied time errors.

      5. Ask whether the contact and alternate format shift work or create exposure. Record the helper''s
      limited review and what remains unknown about other users. Output: a bounded downstream result,
      not universal validation.


      ### Support and transfer


      Use spoken invitations, accessible text or a trusted interpreter as appropriate. A harder case has
      two equally plausible entrance names in conflicting records; seek owner clarification instead of
      fabricating certainty. Users may decline without affecting service, employment or a relationship.


      Actual research needs the organization''s permission, willing participants and minimal relevant
      data. Do not collect protected client, employee or disability information to justify a design change.
      Keep private notes in the approved process and broad lessons outside app evidence. Fiction supports
      reasoning, but the prewritten response is not real user research or actual attendance evidence.


      ### Source use


      [GOV.UK''s user-needs guidance, S11](https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs),
      distinguishes evidence-based user problems from assumed solutions and recommends refining needs
      as understanding improves. Only the relevant sections are used; this guide does not implement the
      whole government service standard or validate the invitation as universally accessible. All event
      facts, observations and revisions are original fiction.


      ### Use the result at its proper scale


      The practical limits in this guide are exercise safeguards, not added canonical metadata.


      Paid employment, a career change or a particular work role is not compulsory. Fiction and no attempt
      are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A user praises an invitation but selects an entrance closed at the event time. Which result should
      shape the revision?

      2. Is “add a map” the user need, and should a fresh invitation automatically inherit the first event''s
      times?

      3. A second fictional reader succeeds and the helper approves the public contact label. Does this
      establish universal accessibility or reduced support workload?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The observed task difficulty should challenge the design assumption. Preserve the compliment
      as an opinion, but address missing correct entry information rather than coaching success or blaming
      the user.

      2. The need is to know how and when to enter; a map is only one possible solution. Verify each invitation
      against its own authorized facts. B opens East at 18:45 for a 19:00 UTC start, not A''s earlier
      times.

      3. No. It supports a limited supplied task result and contact suitability. Other users, actual arrival,
      accessibility and support volume remain unmeasured. A new reader also limits attribution of the
      difference to wording alone.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
