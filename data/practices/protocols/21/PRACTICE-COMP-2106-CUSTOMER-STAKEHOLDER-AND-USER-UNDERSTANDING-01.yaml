        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01-A3
    sequence: 3
    title: Revise one requirement and verify the downstream effect
    instructions: 'Change the artifact to address the observed obstacle, such as making the building entrance
      explicit rather than adding more decorative detail. Explain which assumption changed and which requirement
      now matters. Ask the reader to retry a new comparable invitation or use another willing reader,
      and check whether the change creates a problem for a downstream helper or another access mode. Keep
      a limited conclusion: this user’s task improved or did not, not every customer is now understood.


      Observation checks: The revision follows an observed need; A changed assumption and requirement
      are recorded; A comparable retry tests the change; Other downstream effects and limits of generalization
      are checked. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What did the user need that your internal description missed, and which requirement
      changed because you watched the task rather than asked for approval?


      Examples: Supportive: The reader could not find the entrance, so the author revised that requirement
      and the next task succeeded without coaching.


      Mixed: The participant liked the invitation but still missed the time zone; the author treated the
      task failure as more informative than praise.


      Contradictory: The author coached success, collected private user information unnecessarily or ignored
      the user because a senior stakeholder preferred the old version.


      Inconclusive: Stakeholders were named without observing a downstream task or revising a requirement.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2106-CUSTOMER-STAKEHOLDER-AND-USER-UNDERSTANDING-01
