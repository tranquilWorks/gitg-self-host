        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - requirements_scope_and_exclusions_are_explicit
        - milestones_have_owners_and_realistic_dates
        - a_significant_risk_has_a_response_and_decision_owner
        - recipient_acceptance_is_defined_before_execution
      - measurement_id: c2108_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
