        expected: true
  - stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01-A3
    sequence: 3
    title: Verify, obtain acceptance and close the remaining work
    instructions: 'Ask a willing newcomer or equivalent reader to use the guide to answer the five required
      questions, then show the result to the agreed accepting recipient. Distinguish your internal test
      from their acceptance. Correct a bounded defect or record a clear unaccepted item and owner. Hand
      over the editable source, maintenance responsibility and one lesson for the next project. Do not
      call the project complete merely because the file exists.


      Observation checks: The deliverable is tested against all requirements; Verification and recipient
      acceptance are distinct; Unaccepted items have explicit status and owners; Source maintenance and
      lessons are handed over. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What evidence shows the recipient can use the result, and which tradeoff or remaining
      item prevents an unqualified claim of completion?


      Examples: Supportive: The newcomer answered all five questions, the recipient accepted the guide
      and a maintenance owner received the source.


      Mixed: The draft passed internal checks but the recipient needed an access detail; the team kept
      acceptance open until it was corrected.


      Contradictory: A missing requirement was hidden, tests were invented or the project was called complete
      without recipient acceptance.


      Inconclusive: Milestones were planned but no deliverable was verified or handed over.'
    expected_time: 15-25 minutes
