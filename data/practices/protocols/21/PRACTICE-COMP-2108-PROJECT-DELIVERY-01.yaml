  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      At the 21 October checkpoint the entrance remains unconfirmed. Asha agrees to omit the optional
      illustration and retain the full access requirement and original deadline. At 14:00 Neri confirms
      **East Entrance opens at 17:45 UTC** for this event.


      Leo''s first text names Cedar Center and Willow Room but omits the entrance. A fictional newcomer
      answers purpose, time, materials and contact correctly, but cannot answer access. This is **4 of
      5**; Asha does not accept v1. Leo adds the East Entrance and opening time to v2. A fresh read answers
      all five correctly without help. Asha explicitly accepts **v2 at 15:30 UTC on 22 October**, thirty
      minutes before the deadline.


      At 15:40 Em accepts ownership of GUIDE-SHARED, confirms access to its editable text and agrees to
      recheck when the event facts change and before the next event. No future check has happened. Leo
      used **38 active minutes**, eight above the estimate and seven below available capacity. The omitted
      illustration was estimated work, not measured saved time. The project guide is accepted in this
      fiction; the event, actual attendance and durable usefulness remain unobserved.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Deliver a small newcomer guide from an agreed need through a checked handover. Allow thirty
      minutes to plan, one short work session and twenty minutes to review. The supplied project is fictional;
      there is no event to publish, purchase to make or organization to contact. A usable project needs
      more than a finished file: someone must agree what it is for, decide whether it is acceptable and
      know who will maintain it.


      ### Turn an intention into an acceptance agreement


      Scope describes the result and its boundaries. “Help newcomers” is a purpose; “one readable guide
      answering five questions” is an inspectable deliverable. A requirement says what must be true. A
      task says what someone will do to make it true. Writing a location paragraph does not prove that
      the location is confirmed or that a newcomer can enter. Keep the requirement, work and evidence
      connected without treating them as interchangeable.


      Name the intended user and accepting authority before planning dates. A peer can find an error;
      a recipient can judge fitness for the agreed purpose; a venue owner can confirm access facts. None
      automatically has the others'' authority. Internal verification asks whether the draft contains
      the right facts. A use check asks whether a reader can obtain the needed answers. Acceptance is
      the authorized recipient''s explicit decision about the identified version. A favorable comment
      about an earlier draft is not acceptance of a later one.


      Milestones expose dependencies. Fact confirmation precedes a trustworthy draft, which precedes a
      useful test and final handover. Give each milestone an owner, expected date and condition for moving
      forward. An owner is someone who has accepted responsibility within their authority, not a name
      inserted to make a plan look complete. An estimate is a forecast of effort; a due date is a commitment.
      Waiting for a decision may delay delivery without consuming the same amount of writing time.


      A risk is an uncertain event that could affect the result. Once an essential input is missing at
      the checkpoint, it is also a present issue to manage. State the trigger, consequence, response and
      decision owner. “We might be late” does not show who should decide whether to move the date or what
      can safely be omitted. Preserve essential requirements; do not hide a risk by relabeling a draft
      as complete.


      Tradeoffs need visibility. Reducing illustration work can be reasonable if the illustration is optional.
      Removing the only entrance instruction changes whether the guide serves its user. Negotiate a scope
      or date change with the accepting person and record what was agreed, why and what remains. A tight
      schedule cannot create a missing fact. Stop at a truthful draft status when the necessary decision
      has not happened.


      Closeout includes the editable source, remaining issues, upkeep ownership and one lesson tied to
      evidence. Acceptance of today''s guide does not prove it will remain accurate next month. A maintenance
      owner needs access and a review trigger; future upkeep is not completed simply because someone accepts
      the role. Nor does the project''s success establish that the event itself occurred or benefited
      participants.


      ### Worked example


      A one-page guide contains all five headings. Its author marks it complete. A newcomer answers four
      questions but cannot tell which entrance opens in the evening. The heading “location” passed a superficial
      check while the functional access requirement failed. The recipient keeps acceptance open. Adding
      the confirmed route and retesting repairs a specific defect; the version history retains the failed
      attempt rather than presenting an uninterrupted success.


      ### Complete project brief


      Asha is the accepting coordinator for a fictional Map Reading Circle. Leo authors the guide; Neri
      supplies venue facts. Em is a proposed maintenance owner whose acceptance must still be obtained.
      The guide must let a newcomer answer: purpose, meeting date/time, location/access, what to bring
      and questions contact. The agreed format is readable plain text, one page. A website, participant
      list and decorative map are excluded from required scope.


      The confirmed facts are: share and compare public maps; **24 October 2026, 18:00–18:40 UTC**; **Cedar
      Center, Willow Room**; bring **paper and a pencil**; ask **Circle Desk**. Circle Desk is a fictional
      role label, not a real address. The entrance and opening time are initially unconfirmed. Asha requires
      a confirmed usable evening route as part of the location answer. Do not guess from a daytime entrance.


      The agreed deadline is **22 October at 16:00 UTC**. Neri accepts a venue-fact checkpoint on **21
      October at 12:00 UTC**; Leo owns the draft and reader check; Asha owns scope/date decisions. Leo
      estimates thirty active minutes and has forty-five available. An optional illustration would add
      an estimated eight minutes. The editable paper source is labeled **GUIDE-SHARED**, available to
      the fictional team without a personal login. These are all the facts needed to plan; uncertainty
      about access is intentional.


      ### Deliver with an inspectable record


      1. Write five requirements and their tests, identify Asha''s acceptance role, and state exclusions.
      Lay out fact, draft, reader-check and handover milestones with owners and dates. Output: a short
      agreement distinguishing a test from acceptance.

      2. Record the missing-route risk, the checkpoint trigger and Asha''s decision. Choose a proposed
      response that preserves all five essentials. Output: a draft status and explicit tradeoff, not an
      invented entrance.

      3. Draft from confirmed facts. Save the first attempt before the [later packet](?resource=file-later-packet-md).
      Output: a version with each requirement marked verified, blocked or not yet tested.

      4. Use the later evidence to revise, check all five answers and record the accepting person''s version-specific
      decision. Output: two test results and the actual acceptance status.

      5. Hand over the editable source and accepted upkeep role; state one lesson from the defect and
      effort estimate. Output: remaining work, maintenance trigger and bounded completion claim.


      ### Support and transfer


      Use spoken or large-print text and a five-question checklist if that makes the task accessible.
      A harder branch leaves the venue route unconfirmed through the deadline: keep the guide unready
      or agree a genuine scope/date change rather than infer success. For actual transfer, choose a harmless
      authorized project and obtain real facts and acceptance. Formal procurement, safety and professional
      approvals retain their own requirements.


      ### Source use


      [GovS 002, S01](https://projectdelivery.gov.uk/library-products/government-functional-standard-govs-002-project-delivery/),
      distinguishes requirements, verification, validation and transition with ownership. Selected sections
      were inspected; the miniature project is an original teaching adaptation, not a claim of conformity
      with the full government standard.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
