        criteria:
        - execution_tracks_each_requirement_s_actual_state
        - changed_inputs_or_capacity_trigger_an_explicit_tradeoff
        - essential_requirements_are_not_silently_discarded
        - decisions_and_consequences_are_recorded_briefly
      - measurement_id: c2108_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
