meaning_and_fit:
  purpose: Carry a bounded project from explicit requirements and ownership through risk handling, verification
    and recipient acceptance while making tradeoffs visible.
  why_recommended: Carry a bounded project from explicit requirements and ownership through risk handling,
    verification and recipient acceptance while making tradeoffs visible.
  claims:
  - statement: Carry a bounded project from explicit requirements and ownership through risk handling,
      verification and recipient acceptance while making tradeoffs visible.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Project delivery practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Project delivery as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use an accessible paper guide, audio guide or fictional project simulation.
    Actual confidential, licensed or safety-critical projects must follow their governing process. No
    public release or purchase is required to practice the delivery sequence.
  opportunity_considerations: Default to a one-page newcomer guide for a volunteer group. Required content
    is purpose, meeting time, location or access route, what to bring and contact for questions. Prepare
    a small project card with scope, exclusions, milestones, owners, risks, tests and an accepting recipient.
    Use fictional details until authorized facts are available.
  prerequisites:
  - Default to a one-page newcomer guide for a volunteer group. Required content is purpose, meeting time,
    location or access route, what to bring and contact for questions. Prepare a small project card with
    scope, exclusions, milestones, owners, risks, tests and an accepting recipient. Use fictional details
    until authorized facts are available.
  dependencies: []
  safe_alternatives:
  - Use an accessible paper guide, audio guide or fictional project simulation. Actual confidential, licensed
    or safety-critical projects must follow their governing process. No public release or purchase is
    required to practice the delivery sequence.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Project delivery differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Project delivery as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a one-page newcomer guide for a volunteer group. Required content is purpose, meeting
    time, location or access route, what to bring and contact for questions. Prepare a small project card
    with scope, exclusions, milestones, owners, risks, tests and an accepting recipient. Use fictional
    details until authorized facts are available. Goal: Carry a bounded project from explicit requirements
    and ownership through risk handling, verification and recipient acceptance while making tradeoffs
    visible. Scope: Use a safe authorized project that fits a short work period. This is not a substitute
    for formal project, safety, procurement or regulated acceptance requirements. Time and effort: Thirty
    minutes to plan, one or two short work sessions and a 20-minute acceptance review. Adaptation: Use
    an accessible paper guide, audio guide or fictional project simulation. Actual confidential, licensed
    or safety-critical projects must follow their governing process. No public release or purchase is
    required to practice the delivery sequence. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible paper guide, audio guide or fictional project simulation. Actual
    confidential, licensed or safety-critical projects must follow their governing process. No public
    release or purchase is required to practice the delivery sequence.
  expected_burden: Thirty minutes to plan, one or two short work sessions and a 20-minute acceptance review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Project delivery protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Project delivery action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    paper guide, audio guide or fictional project simulation. Actual confidential, licensed or safety-critical
    projects must follow their governing process. No public release or purchase is required to practice
    the delivery sequence.
  actions:
  - stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01-A1
    sequence: 1
    title: Agree a deliverable and a test before scheduling the work
    instructions: 'Confirm the five required information items, the intended reader and the format. Name
      what is out of scope, such as a full website or membership database. Break the work into fact confirmation,
      draft and user check with an owner and realistic date for each. Identify the main risk, such as
      an unconfirmed location, and the decision needed if it remains unresolved. A task list alone is
      not an acceptance agreement.


      Observation checks: Requirements scope and exclusions are explicit; Milestones have owners and realistic
      dates; A significant risk has a response and decision owner; Recipient acceptance is defined before
      execution. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01
      action_stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01-A1
      competency_stable_id: '21.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2108_a1_primary
      transfer_disposition: context_bound
      measurements:
