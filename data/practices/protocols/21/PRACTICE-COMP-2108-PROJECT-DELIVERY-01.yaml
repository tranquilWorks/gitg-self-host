        expected: true
      - measurement_id: c2108_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01-A2
    sequence: 2
    title: Execute while preserving traceable tradeoffs
    instructions: 'Build the guide using confirmed facts and track each requirement as verified, incomplete
      or blocked. When time or an input changes, choose a visible tradeoff with the recipient: defer optional
      polish, reduce scope or move the date. Do not silently remove an essential access detail to claim
      on-time delivery. Keep a short record of the decision and its consequence rather than a narrative
      of effort.


      Observation checks: Execution tracks each requirement’s actual state; Changed inputs or capacity
      trigger an explicit tradeoff; Essential requirements are not silently discarded; Decisions and consequences
      are recorded briefly. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01
      action_stable_id: PRACTICE-COMP-2108-PROJECT-DELIVERY-01-A2
      competency_stable_id: '21.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
