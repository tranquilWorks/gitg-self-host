meaning_and_fit:
  purpose: Produce work whose accuracy, robustness, clarity, documentation and finish fit its purpose,
    then check whether that quality is repeatable rather than performative.
  why_recommended: Produce work whose accuracy, robustness, clarity, documentation and finish fit its
    purpose, then check whether that quality is repeatable rather than performative.
  claims:
  - statement: Produce work whose accuracy, robustness, clarity, documentation and finish fit its purpose,
      then check whether that quality is repeatable rather than performative.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Quality, craftsmanship, and reputation practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Quality, craftsmanship, and reputation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible written, spoken or diagrammed instruction and a fictional
    room. Real safety, building, accessibility or equipment requirements remain with the responsible qualified
    owner. Do not move heavy objects or alter emergency access for a test.
  opportunity_considerations: 'Default to a reusable meeting-room setup instruction. It must identify
    the room, arrangement, access route, restore-to-normal step and responsible contact. Prepare three
    quality levels: necessary correctness, useful robustness and optional polish. Use fictional details
    until an authorized owner supplies real ones.'
  prerequisites:
  - 'Default to a reusable meeting-room setup instruction. It must identify the room, arrangement, access
    route, restore-to-normal step and responsible contact. Prepare three quality levels: necessary correctness,
    useful robustness and optional polish. Use fictional details until an authorized owner supplies real
    ones.'
  dependencies: []
  safe_alternatives:
  - Use an accessible written, spoken or diagrammed instruction and a fictional room. Real safety, building,
    accessibility or equipment requirements remain with the responsible qualified owner. Do not move heavy
    objects or alter emergency access for a test.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Quality, craftsmanship, and reputation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Quality, craftsmanship, and
    reputation as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a reusable meeting-room setup instruction. It must identify the room, arrangement,
    access route, restore-to-normal step and responsible contact. Prepare three quality levels: necessary
    correctness, useful robustness and optional polish. Use fictional details until an authorized owner
    supplies real ones. Goal: Produce work whose accuracy, robustness, clarity, documentation and finish
    fit its purpose, then check whether that quality is repeatable rather than performative. Scope: Use
    a low-stakes authorized artifact. This exercise does not certify safety-critical quality or make reputation
    a score of personal worth. Time and effort: Twenty minutes to set quality criteria, one work session
    and a second-use check. Adaptation: Use an accessible written, spoken or diagrammed instruction and
    a fictional room. Real safety, building, accessibility or equipment requirements remain with the responsible
    qualified owner. Do not move heavy objects or alter emergency access for a test. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written, spoken or diagrammed instruction and a fictional room.
    Real safety, building, accessibility or equipment requirements remain with the responsible qualified
    owner. Do not move heavy objects or alter emergency access for a test.
  expected_burden: Twenty minutes to set quality criteria, one work session and a second-use check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Quality, craftsmanship, and reputation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Quality, craftsmanship, and reputation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written, spoken or diagrammed instruction and a fictional room. Real safety, building, accessibility
    or equipment requirements remain with the responsible qualified owner. Do not move heavy objects or
    alter emergency access for a test.
  actions:
  - stable_id: PRACTICE-COMP-2105-QUALITY-CRAFTSMANSHIP-AND-REPUTATION-01-A1
    sequence: 1
    title: Define the consequence and the appropriate quality bar
    instructions: 'Ask the intended user what failure would cost: confusion, rework, exclusion or a more
      serious consequence outside this exercise’s scope. Set non-negotiable correctness and access criteria,
      then identify robustness features such as an exception contact and a restoration step. Decide what
      visual elegance or finish genuinely helps use and what would only display effort. Record the standard
      before making the artifact so polishing cannot excuse a missing essential.


      Observation checks: Failure consequence and user purpose are identified; Correctness access and
      robustness criteria are explicit; Useful finish is separated from performative polish; The quality
      bar is fixed before production. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2105-QUALITY-CRAFTSMANSHIP-AND-REPUTATION-01
      action_stable_id: PRACTICE-COMP-2105-QUALITY-CRAFTSMANSHIP-AND-REPUTATION-01-A1
      competency_stable_id: '21.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2105_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2105_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - failure_consequence_and_user_purpose_are_identified
        - correctness_access_and_robustness_criteria_are_explicit
        - useful_finish_is_separated_from_performative_polish
        - the_quality_bar_is_fixed_before_production
      - measurement_id: c2105_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2105_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
