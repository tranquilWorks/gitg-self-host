        expected: true
  - stable_id: PRACTICE-COMP-2105-QUALITY-CRAFTSMANSHIP-AND-REPUTATION-01-A2
    sequence: 2
    title: Build and inspect the deliverable against the chosen bar
    instructions: 'Create the instruction, checking facts against the authorized source and writing enough
      context for a person who was not present during preparation. Inspect for ambiguous sequence, missing
      exceptions and unsupported claims of readiness. Use the quality levels to stop unnecessary embellishment
      while correcting essentials. Document one decision where you chose a simpler or more robust form
      because it served the user better, not because it looked more sophisticated.


      Observation checks: Facts are checked against an authorized source; Sequence exceptions and restoration
      are clear; Essential defects are corrected before polish; A quality tradeoff is documented in terms
      of use. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2105-QUALITY-CRAFTSMANSHIP-AND-REPUTATION-01
      action_stable_id: PRACTICE-COMP-2105-QUALITY-CRAFTSMANSHIP-AND-REPUTATION-01-A2
      competency_stable_id: '21.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2105_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2105_a2_primary
        kind: artifact
        role: primary
        weight: '1'
