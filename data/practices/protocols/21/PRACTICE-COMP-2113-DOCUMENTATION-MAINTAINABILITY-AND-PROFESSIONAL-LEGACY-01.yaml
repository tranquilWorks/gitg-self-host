meaning_and_fit:
  purpose: Document decisions, operation, upkeep and recovery well enough that an authorized successor
    can perform a safe task without relying on the original worker’s memory.
  why_recommended: Document decisions, operation, upkeep and recovery well enough that an authorized successor
    can perform a safe task without relying on the original worker’s memory.
  claims:
  - statement: Document decisions, operation, upkeep and recovery well enough that an authorized successor
      can perform a safe task without relying on the original worker’s memory.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Documentation, maintainability, and professional legacy
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Documentation, maintainability, and professional legacy as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use an accessible written, audio or diagrammed guide and a private tabletop
    successor. Do not share employer-confidential material or grant access beyond your authority. Formal
    safety, operational and security documentation remains subject to its governing review.
  opportunity_considerations: Default to updating a fictional group meeting notice from a template. Prepare
    a handover with purpose, location of permitted source, required inputs, steps, decision rationale,
    checks, common failure, recovery, owner and review trigger. Use no passwords or real personal records.
  prerequisites:
  - Default to updating a fictional group meeting notice from a template. Prepare a handover with purpose,
    location of permitted source, required inputs, steps, decision rationale, checks, common failure,
    recovery, owner and review trigger. Use no passwords or real personal records.
  dependencies: []
  safe_alternatives:
  - Use an accessible written, audio or diagrammed guide and a private tabletop successor. Do not share
    employer-confidential material or grant access beyond your authority. Formal safety, operational and
    security documentation remains subject to its governing review.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Documentation, maintainability, and professional legacy differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Documentation, maintainability,
    and professional legacy as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to updating a fictional group meeting notice from a template. Prepare a handover with
    purpose, location of permitted source, required inputs, steps, decision rationale, checks, common
    failure, recovery, owner and review trigger. Use no passwords or real personal records. Goal: Document
    decisions, operation, upkeep and recovery well enough that an authorized successor can perform a safe
    task without relying on the original worker’s memory. Scope: Use a harmless authorized process or
    simulation. This is not permission to share credentials, protected work, client data or bypass required
    training and access controls. Time and effort: Thirty minutes to document, one 15-minute successor
    test and a 15-minute revision. Adaptation: Use an accessible written, audio or diagrammed guide and
    a private tabletop successor. Do not share employer-confidential material or grant access beyond your
    authority. Formal safety, operational and security documentation remains subject to its governing
    review. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written, audio or diagrammed guide and a private tabletop successor.
    Do not share employer-confidential material or grant access beyond your authority. Formal safety,
    operational and security documentation remains subject to its governing review.
  expected_burden: Thirty minutes to document, one 15-minute successor test and a 15-minute revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Documentation, maintainability, and professional legacy protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Documentation, maintainability, and professional legacy action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written, audio or diagrammed guide and a private tabletop successor. Do not share employer-confidential
    material or grant access beyond your authority. Formal safety, operational and security documentation
    remains subject to its governing review.
  actions:
  - stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01-A1
    sequence: 1
    title: Record the decisions a successor cannot infer from the file
    instructions: 'Explain what the process is for, which source is authoritative and why the current
      format or sequence was chosen. Identify a rejected alternative and the condition that would make
      it worth reconsidering. List the permissions and knowledge a successor needs, what must not be changed
      and how to recognize a stale instruction. Keep credentials and sensitive data in their approved
      systems, not embedded in the handover.


      Observation checks: Purpose authoritative source and rationale are explicit; A relevant alternative
      and revisiting condition are recorded; Permissions prerequisites and change limits are stated; Secrets
      and protected information are excluded. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01
      action_stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01-A1
      competency_stable_id: '21.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2113_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2113_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - purpose_authoritative_source_and_rationale_are_explicit
        - a_relevant_alternative_and_revisiting_condition_are_recorded
        - permissions_prerequisites_and_change_limits_are_stated
        - secrets_and_protected_information_are_excluded
      - measurement_id: c2113_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2113_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01-A2
    sequence: 2
    title: Teach through a safe attempt rather than a tour
    instructions: 'Give the handover to a willing authorized peer or use a fictional successor role. Ask
      them to update a new synthetic notice, verify the facts and handle one harmless exception such as
      a missing room number. Do not rescue them immediately with undocumented knowledge; record the point
      where they need clarification and stop any step that exceeds authority. A pleasant walkthrough is
      not evidence that the process can run without you.


      Observation checks: A successor performs a concrete synthetic task; A harmless exception tests recovery
      guidance; Undocumented dependencies are made visible; Authority and safety boundaries stop inappropriate
      steps. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01
      action_stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01-A2
      competency_stable_id: '21.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2113_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2113_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_successor_performs_a_concrete_synthetic_task
        - a_harmless_exception_tests_recovery_guidance
        - undocumented_dependencies_are_made_visible
        - authority_and_safety_boundaries_stop_inappropriate_steps
      - measurement_id: c2113_a2_boundary
        kind: boolean
