  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Under H1, Sam copies **Oak Room** from N0 into N1. The author points out that no N1 room was approved;
      the first attempt therefore required intervention and is not independent success. Sam marks N1 DRAFT
      and asks Room Owner. The fictional owner confirms **Birch Room** for N1; Sam corrects the draft.
      No release approval is supplied.


      H2 now states: if any required input is missing or conflicting, mark DRAFT, keep the field unresolved,
      ask the responsible owner, and record the confirmed answer before the normal check and Notice Owner
      approval. In the worked N2 retry, with the author silent, Sam notices the blank room, holds the
      draft and asks Room Owner. The owner confirms **Willow Room**; Sam produces N2 with the five correct
      fields and sends it to Notice Owner for review. **Approval and publication remain pending.**


      Sam confirms access to NOTICE-KIT''s editable sheets and accepts maintenance of H2 and its revision
      log, with review when the template, approval roles or required fields change. No future maintenance
      has occurred. The source is shared, but room decisions and release approval still depend on their
      authorized owners; documentation has not replaced them.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Leave a small notice-updating process usable when its original author is absent. Allow thirty
      minutes to document, fifteen for a successor attempt and fifteen to revise. Use the paper process
      below. There are no real credentials, accounts or confidential records to share. A useful handover
      transfers understandable work and upkeep responsibility; it does not merely preserve files or give
      someone a pleasant tour.


      ### How to use the supplied outcomes


      The main and later packets narrate worked analysis: some explanations and outcomes are supplied.
      Use them to inspect reasoning, not to claim an unaided performance. Complete the changed-case attempt
      in the separate check-prompts file before opening its answer for a new application.


      ### Document the decisions hidden behind the artifact


      A successor needs purpose, authority and limits before steps. “Copy the new details into the notice”
      does not explain which details are authoritative, what may change or what to do when the source
      is incomplete. Record the permitted source, necessary inputs and who can resolve uncertainty. If
      the process depends on the original worker''s personal account or memory, the dependency remains
      even when the instructions look complete.


      Explain why the process has its current shape. A short decision record names the choice, reason,
      rejected alternative and condition for reconsideration. “Plain text was chosen because the notice
      must be usable without a design tool” helps a successor preserve the purpose while adapting implementation.
      “Always use this format” without a reason can become ritual after its context changes. A decision''s
      rationale is not permission to ignore a governing standard.


      Write steps that expose checks and recovery. Identify required fields, the authority for each and
      the condition that stops release. A missing room is not an invitation to reuse last week''s room.
      A successor should know how to mark a draft, ask the right owner and resume once a confirmed input
      arrives. Recovery guidance can be an escalation or hold; it need not be an improvised solution.


      Test with a new task, not only a walkthrough. Someone following your explanation while you point
      at every step may understand the tour but still be unable to act alone. Let a willing authorized
      successor attempt the synthetic update, and record any hint or undocumented fact supplied. Stop
      a step that exceeds authority. Assistance reveals an instructional gap; it should not be silently
      counted as independence.


      Revise from the actual blockage, then retry. Adding more pages is not inherently helpful. A precise
      missing-field rule can remove a critical dependency while preserving a short guide. Retest the failed
      part with a fresh comparable input so remembered answers do not masquerade as transferable understanding.
      A correct hold is sometimes the best evidence that the successor understands the process.


      Maintenance needs an accepted owner, access, review trigger and correction location. A handover
      that nobody owns will become stale. An accepted role is still a future commitment, not proof of
      continued upkeep. State which specialist judgment remains outside the document: perhaps a room owner
      must still approve locations or an accessibility expert must review a consequential change. Good
      documentation makes that dependency visible rather than claiming it has eliminated expertise.


      Professional legacy can be quiet continuity. Others can recover a decision, avoid repeating a mistake
      or improve a process because the knowledge is understandable. It does not require preserving your
      preferred method forever or making your authorship central. Retain provenance where useful, give
      successors room to question the design, and keep private information in its authorized place.


      ### Worked example


      A successor receives an instruction to update a notice from the change card. The new card lacks
      a room. The successor guesses the old room because the instruction offers no recovery rule. The
      author intervenes. A revised instruction says to mark the notice DRAFT, leave the missing field
      visibly unresolved and ask the room owner. On a fresh missing-room case, the successor holds the
      notice without a hint. That is successful exception handling, not a failure to finish quickly.


      ### Complete paper process and two input cards


      The fictional shared folder is **NOTICE-KIT**, represented by paper sheets available to both author
      and successor without any personal login. It contains a blank template, an approved input card,
      a revision log and an archive. The template fields are **title, date, start/end time with zone,
      room and questions contact**. Only the approved input card supplies facts. **Room Owner** approves
      missing or changed rooms; **Notice Owner** approves completed notices. Those are fictional roles,
      not accounts to contact.


      The process purpose is an accurate readable notice. Plain text was chosen so permitted users need
      no special design software. A decorative image-only alternative was rejected because it hides editable
      text; reconsider another format only if the authorized owner confirms equal access and maintainability.
      Successor Sam may draft and check, but cannot invent facts, grant access or approve a release. Approval
      remains necessary after a successful draft check.


      Existing approved notice N0 is **Sketch Circle, 2 November 2026, 17:00–17:30 UTC, Oak Room, Notice
      Desk**. First new card N1 is **Map Circle, 3 November 2026, 18:00–18:30 UTC, room blank, Notice
      Desk**. Initial instruction H1 says: copy the new card into a fresh template, check the five fields,
      send to Notice Owner. It does not explain what a blank field means. Retain N0 as history, never
      as automatic authority for N1.


      Fresh retry card N2 is **Paper Circle, 4 November 2026, 16:00–16:30 UTC, room blank, Notice Desk**.
      The missing room is intentional. All other inputs are supplied. Required handover sections are purpose/source,
      permissions, steps/checks, decision rationale, missing-input recovery, revision log, maintenance
      owner and trigger. No actual publication is part of the task.


      ### Transfer knowledge through an attempt


      1. Write a concise handover using NOTICE-KIT and distinguish established H1 steps from your proposed
      recovery rule. Include the rejected format and revisiting condition. Output: a runnable instruction
      with explicit authority.

      2. Apply it to N1 or inspect the supplied successor attempt after saving your version. Output: completed
      fields, unresolved input and any assistance required.

      3. Use the [later packet](?resource=file-later-packet-md) to revise the precise gap and test N2.
      Output: a fresh exception result with hints recorded, then a fact-correct draft if authorized information
      arrives.

      4. Confirm source access and accepted maintenance responsibility. State the review trigger and correction
      location. Output: an owned handover with remaining specialist/approval dependencies.

      5. Write a bounded continuity claim. Output: what the successor demonstrated while the author was
      absent, not a promise that every future exception is covered.


      ### Support and transfer


      Use audio instructions, large print or a private two-role rehearsal. A harder case supplies conflicting
      approved cards: hold and ask the owner rather than choose the latest timestamp without a rule. In
      actual work, preserve training, access and change-control requirements. Never place passwords, protected
      records or a bypass procedure in a handover to make it appear self-sufficient.


      ### Source use


      [NASA''s knowledge-management overview, S06](https://www.nasa.gov/learning-resources/for-professionals/appel-knowledge-management/),
      emphasizes critical knowledge, context, reuse and continuity. The overview was inspected, not its
      linked templates, reports or policy. This paper task is an original exercise and makes no claim
      of NASA compliance or operational readiness.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


