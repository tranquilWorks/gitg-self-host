  - stable_id: PRACTICE-COMP-2113-DOCUMENTATION-MAINTAINABILITY-AND-PROFESSIONAL-LEGACY-01-A3
    sequence: 3
    title: Revise and hand over maintenance responsibility
    instructions: 'Add the missing instruction or decision context revealed by the test, then have the
      successor retry that part. Specify who now owns the document, when it should be reviewed and where
      corrections belong. Confirm that the editable source and permitted access are available without
      your personal account. Record what remains dependent on specialist knowledge or training rather
      than claiming complete independence.


      Observation checks: The handover is revised from the observed gap; The failed step is retried; Maintenance
      ownership and review are explicit; Remaining specialist dependence is honestly stated. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What knowledge stopped living only in your head, and could the next person maintain
      and correct the process without contacting you for every exception?


      Examples: Supportive: A peer updated a new notice and handled a missing input after the handover
      was revised, with a clear maintenance owner.


      Mixed: The first test depended on the author’s personal folder, so the team moved the permitted
      source to an authorized shared location.


      Contradictory: The handover exposed credentials or claimed independence while omitting essential
      training and approval requirements.


      Inconclusive: A document was written but no successor attempted the task or accepted maintenance
      responsibility.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
