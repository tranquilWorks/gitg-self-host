  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      In the first supplied A call, the participant conveys four of five fact categories but omits the
      end time. The answer about the optional printed map is correct. This is a limited observed task
      result, not a diagnosis or a claim that the timer caused the omission.


      The asynchronous platform then blocks submission because the participant cannot use its account
      setup. No factual response is submitted through that platform, so factual accuracy there is **unobserved**,
      not zero. The owner authorizes a paper rehearsal through the existing permitted channel and keeps
      all five fact categories plus clarification unchanged.


      On worked B, the participant states Route Table''s purpose, **10 November, 18:00–18:30 UTC**, Ash
      Room at Cedar Center, paper and pencil, and Route Desk; the participant correctly says the printed
      route sheet is optional. That is **5 of 5 categories plus the clarification**, without answer coaching.
      No diagnosis is requested. The same participant has now practiced, so the comparison does not isolate
      the channel''s causal effect. The result supports the paper task''s feasibility, not universal access
      or an approved hiring policy.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Remove an irrelevant barrier from a low-stakes information task while retaining the actual
      standard. Allow twenty minutes to analyze the requirement, twenty to design an alternative and a
      short trial. Use the fictional volunteer selection exercise. This is neither a disability assessment
      nor a legal accommodation or hiring decision. No diagnosis or private medical information is required
      to compare these task designs.


      ### How to use the supplied outcomes


      The main and later packets narrate worked analysis: some explanations and outcomes are supplied.
      Use them to inspect reasoning, not to claim an unaided performance. Complete the changed-case attempt
      in the separate check-prompts file before opening its answer for a new application.


      ### Separate the outcome from the customary method


      An expectation should describe what useful work must be accomplished. “Explain five facts accurately
      and answer a clarification” specifies an outcome. “Speak quickly on an unannounced ninety-second
      video call” specifies a method and condition. Those conditions might be relevant in some jobs, but
      they are not essential merely because they are customary. Ask the responsible owner which constraints
      follow from the actual task and which can change.


      Preserving a legitimate requirement does not mean preserving every obstacle attached to its old
      measurement. Accuracy can remain constant across writing, speech, signing or supported communication.
      If speed truly matters, its relevance needs evidence and an appropriate standard; if it does not,
      a timer may measure an unrelated skill. Do not infer someone''s competence from their accent, processing
      style, disability label or familiarity with one platform.


      Examine several layers of access. Expectations may be unclear or announced too late. Tools may require
      an unavailable device or difficult interface. Communication may depend on a single modality. Hiring
      may select for familiarity with an irrelevant test format. Advancement may reward visibility in
      one type of meeting rather than the work itself. A small trial cannot solve all of these, but its
      principle should not end at initial entry if everyday work and progression recreate the same barrier.


      An alternative must measure the same meaningful outcome. Keep the source facts, accuracy criteria
      and clarification demand explicit. Necessary supports can change how a person engages without substituting
      an answer or deleting an essential function. Distinguish access support from task coaching: providing
      readable text is different from supplying the missing correct response. Record what was offered
      so the result is interpretable.


      Ask whether a barrier moved. An asynchronous form can remove pressure to speak live while adding
      an unfamiliar account or inaccessible interface. If the person cannot submit through that tool,
      you have observed a process blockage, not necessarily incorrect understanding. Do not score an absent
      response as a factual failure without considering why it is absent. Repair the channel and then
      test the actual requirement.


      Evaluate equivalence and remaining limits. A fresh prompt can check that the alternative supports
      understanding beyond memorizing a prior answer. Use the same categories and comparable difficulty,
      while noting that a repeated participant may have learned the process. One successful fictional
      response is not universal accessibility, psychometric validation or proof that every hiring criterion
      is lawful. Actual employment decisions belong to the authorized organizational and legal process.


      Broadly accessible design and individual accommodation are related but different. A process can
      offer plain text to everyone without collecting diagnoses. A real accommodation request may require
      an individualized formal process under applicable law. Do not turn the exercise into a medical questionnaire
      or declare an employer''s legal duties from a generic example. Preserve privacy and the responsible
      professional role.


      ### Worked example


      A participant understands a schedule but cannot submit an answer through a new platform. The designer
      initially treats this as failure to follow instructions. Reviewing the actual task reveals that
      platform fluency was not an agreed requirement. The owner permits the same response through an existing
      paper channel. The learner can now check accuracy and clarification separately from the unnecessary
      tool barrier.


      ### Complete task and equivalent retry


      The fictional owner needs a volunteer to explain five categories accurately: **purpose; date/start/end
      time with zone; location; required materials; questions contact**. The volunteer must also answer
      one clarification from the supplied facts. The owner stipulates that this role does not require
      rapid live speech, a particular accent, a video platform or an unannounced prompt. This is a case-specific
      requirement, not a finding about all work.


      **Prompt A:** Map Table; purpose is comparing public maps; **9 November 2026, 17:00–17:30 UTC**;
      **Cedar Center, Rowan Room**; bring **paper and a pencil**; a printed map is optional; questions
      go to **Map Desk**. Clarification: “May I attend without a printed map?” Correct meaning: yes, the
      map is optional; paper and pencil are the stated required materials. The initial selection method
      is an unannounced ninety-second live call.


      **Worked Prompt B:** Route Table; purpose is discussing public routes; **10 November 2026, 18:00–18:30
      UTC**; **Cedar Center, Ash Room**; bring **paper and a pencil**; a printed route sheet is optional;
      questions go to **Route Desk**. Clarification: “Is a printed route sheet required?” Correct meaning:
      no; the stated requirement is paper and pencil. The same five accuracy categories and one clarification
      criterion apply.


      The first proposed alternative is asynchronous text through a new account-based platform. The owner
      can authorize a **paper rehearsal** through an existing permitted channel, but no actual recruitment
      or advancement policy change is approved. All people and roles are fictional. The test requires
      no diagnostic explanation, medical record, real applicant data or publication.


      ### Preserve the standard and test access


      1. Separate the six required outcomes from the live-call, timer and platform conditions. Explain
      why the stipulated owner can vary those methods here. Output: an essential-outcome statement with
      method assumptions exposed.

      2. Propose an alternative with the same factual and clarification checks, and identify possible
      tool, language, sensory or opportunity barriers without diagnosing anyone. Output: a comparable
      task design and support description.

      3. Save before the [later packet](?resource=file-later-packet-md). Classify the first tool blockage
      accurately, revise the channel and use worked B. Output: distinct process-access and task-accuracy
      results.

      4. Ask which barrier remains and how the principle would affect training, daily communication and
      advancement. Output: a limited design conclusion with actual policy authority left intact.


      ### Support and transfer


      Offer accessible text, signed/spoken response, large print or other appropriate supports while retaining
      the legitimate output. A harder case adds a genuinely time-critical duty: reassess the standard
      through the responsible process instead of assuming all timing is irrelevant. Real selection and
      accommodation work requires authorized review; a successful paper demonstration changes no person''s
      employment status.


      ### Source use


      [EEOC''s employer ADA explanation, S13](https://www.eeoc.gov/publications/ada-your-responsibilities-employer),
      distinguishes essential functions and adjustments to methods. The page carries an explicit notice
      about the 2008 amendments; its old disability definitions, thresholds and procedural details are
      not adopted as current law. Only the narrow task-versus-method concept is used, and the original
      volunteer case establishes no legal accommodation ruling.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
