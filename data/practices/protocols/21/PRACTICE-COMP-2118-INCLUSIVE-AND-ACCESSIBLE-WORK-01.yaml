meaning_and_fit:
  purpose: Distinguish an essential job or task outcome from an unnecessary barrier in tools, communication,
    hiring or advancement, then test an accessible alternative.
  why_recommended: Distinguish an essential job or task outcome from an unnecessary barrier in tools,
    communication, hiring or advancement, then test an accessible alternative.
  claims:
  - statement: Distinguish an essential job or task outcome from an unnecessary barrier in tools, communication,
      hiring or advancement, then test an accessible alternative.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Inclusive and accessible work practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Inclusive and accessible work as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible task material and allow participants to choose supports without
    identifying a diagnosis. In a real workplace, consult the responsible accommodation, accessibility
    or employment professional. U.S. EEOC examples are not universal legal requirements for every jurisdiction.
  opportunity_considerations: Use the fictional requirement that a volunteer applicant explain a simple
    schedule accurately in a timed live call. The actual task is to convey five correct facts and answer
    a clarification, not to speak quickly or use a particular accent. Prepare headings for essential outcome,
    current method, irrelevant barrier, alternative, standard and review.
  prerequisites:
  - Use the fictional requirement that a volunteer applicant explain a simple schedule accurately in a
    timed live call. The actual task is to convey five correct facts and answer a clarification, not to
    speak quickly or use a particular accent. Prepare headings for essential outcome, current method,
    irrelevant barrier, alternative, standard and review.
  dependencies: []
  safe_alternatives:
  - Use accessible task material and allow participants to choose supports without identifying a diagnosis.
    In a real workplace, consult the responsible accommodation, accessibility or employment professional.
    U.S. EEOC examples are not universal legal requirements for every jurisdiction.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Inclusive and accessible work differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Inclusive and accessible work
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional requirement that a volunteer applicant explain a simple schedule accurately
    in a timed live call. The actual task is to convey five correct facts and answer a clarification,
    not to speak quickly or use a particular accent. Prepare headings for essential outcome, current method,
    irrelevant barrier, alternative, standard and review. Goal: Distinguish an essential job or task outcome
    from an unnecessary barrier in tools, communication, hiring or advancement, then test an accessible
    alternative. Scope: Use a low-stakes authorized process or fictional selection task. This is not a
    legal accommodation ruling, disability assessment or permission to alter hiring decisions without
    authority. Time and effort: Twenty minutes to analyze the requirement, one 20-minute alternative design
    and a short task test. Adaptation: Use accessible task material and allow participants to choose supports
    without identifying a diagnosis. In a real workplace, consult the responsible accommodation, accessibility
    or employment professional. U.S. EEOC examples are not universal legal requirements for every jurisdiction.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible task material and allow participants to choose supports without
    identifying a diagnosis. In a real workplace, consult the responsible accommodation, accessibility
    or employment professional. U.S. EEOC examples are not universal legal requirements for every jurisdiction.
  expected_burden: Twenty minutes to analyze the requirement, one 20-minute alternative design and a short
    task test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Inclusive and accessible work protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Inclusive and accessible work action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    task material and allow participants to choose supports without identifying a diagnosis. In a real
    workplace, consult the responsible accommodation, accessibility or employment professional. U.S. EEOC
    examples are not universal legal requirements for every jurisdiction.
  actions:
  - stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01-A1
    sequence: 1
    title: Identify what the work actually requires
    instructions: 'State the five factual outcomes and the clarification skill needed, then ask which
      current conditions are essential and which merely customary: live speech, a short timer, a specific
      tool or an unannounced prompt. Consider barriers in access, language processing, disability, communication
      and opportunity without diagnosing a participant. Check the responsible owner’s authority and any
      governing standard before changing the process. A preferred method should not be called essential
      merely because it is familiar.


      Observation checks: The essential outcome is stated independently of method; Customary conditions
      are examined for relevance; Barriers are considered without diagnosing individuals; Authority and
      governing standards are checked. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01
      action_stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01-A1
      competency_stable_id: '21.18'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2118_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2118_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_essential_outcome_is_stated_independently_of_method
        - customary_conditions_are_examined_for_relevance
        - barriers_are_considered_without_diagnosing_individuals
        - authority_and_governing_standards_are_checked
      - measurement_id: c2118_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2118_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01-A2
    sequence: 2
    title: Design an alternative that measures the same legitimate outcome
    instructions: 'Offer a written, signed, supported or asynchronous explanation with the same five facts
      and a comparable clarification question, allowing necessary access supports. Define how accuracy
      and understanding will be checked consistently while removing an irrelevant speed or modality demand.
      Consider how the same principle affects training materials, everyday communication and advancement
      opportunities. Do not lower an essential safety or competence requirement or demand medical disclosure
      to try a broadly accessible design.


      Observation checks: The alternative preserves the legitimate outcome; Criteria remain consistent
      across communication modes; Tools communication and progression barriers are considered; Access
      does not require unnecessary medical disclosure or removal of essentials. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01
      action_stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01-A2
      competency_stable_id: '21.18'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2118_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2118_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_alternative_preserves_the_legitimate_outcome
        - criteria_remain_consistent_across_communication_modes
        - tools_communication_and_progression_barriers_are_considered
        - access_does_not_require_unnecessary_medical_disclosure_or_removal_of_essentials
      - measurement_id: c2118_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2118_a2_adverse
        kind: boolean
