  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Inclusive and accessible work; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use accessible task material and allow participants to choose supports without identifying a diagnosis.
      In a real workplace, consult the responsible accommodation, accessibility or employment professional.
      U.S. EEOC examples are not universal legal requirements for every jurisdiction.
    cultural_context:
    - Adapt the expression of Inclusive and accessible work to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use accessible task material and allow participants to choose supports without identifying a diagnosis.
      In a real workplace, consult the responsible accommodation, accessibility or employment professional.
      U.S. EEOC examples are not universal legal requirements for every jurisdiction.
  pause_conditions:
  - Pause Inclusive and accessible work when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Inclusive and accessible work practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Inclusive and accessible work situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
