        expected: true
  - stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01-A3
    sequence: 3
    title: Test the process and ask whether the barrier moved
    instructions: 'Use a willing participant or fictional task to test the alternative, recording whether
      the five facts and clarification can be conveyed. Ask what remains inaccessible and whether the
      change created a new burden, such as requiring an unfamiliar tool. Revise one issue and document
      the reason for the method change. For actual employment accommodations or selection, use the qualified
      organizational and legal process rather than treating this small test as approval.


      Observation checks: The alternative is tested against the same task criteria; Remaining or shifted
      barriers are checked; One design revision is documented; Formal employment decisions remain with
      the authorized process. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Which barrier was unrelated to the real work, and what evidence shows the alternative
      preserved the legitimate standard?


      Examples: Supportive: A written explanation conveyed the same facts and clarification accurately,
      showing that rapid live speech was unnecessary for the sample task.


      Mixed: The alternative removed a speech barrier but required an unfamiliar platform; the team changed
      the tool before adoption.


      Contradictory: The process demanded a diagnosis, removed a genuine safety requirement or changed
      hiring rules without authority.


      Inconclusive: Inclusion was endorsed without identifying an irrelevant barrier or testing an equivalent
      task outcome.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01
      action_stable_id: PRACTICE-COMP-2118-INCLUSIVE-AND-ACCESSIBLE-WORK-01-A3
