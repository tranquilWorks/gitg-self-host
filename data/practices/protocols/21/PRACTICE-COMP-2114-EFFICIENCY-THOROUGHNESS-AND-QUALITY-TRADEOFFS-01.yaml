        - essential_criteria_precede_optional_polish
        - an_unresolved_essential_prevents_an_unqualified_ready_claim
        - haste_or_perfectionism_is_examined_against_user_consequence
      - measurement_id: c2114_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2114_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01-A3
    sequence: 3
    title: Inspect the result and revise the quality decision
    instructions: 'Have a willing reader use the result or check it against the declared purpose. Identify
      one place where more care would matter and one where extra refinement would have little value. Compare
      actual effort with the initial budget and note whether the task was misclassified. Choose a next-time
      rule such as stop after verified essentials for disposable notes or add a second-person fact check
      for reusable guidance. Do not interpret a good outcome as proof that skipped assurance was justified.


      Observation checks: The result is checked against its intended use; Valuable care and low-value
      refinement are distinguished; The original classification and time budget are reviewed; A good outcome
      does not retroactively justify skipped essentials. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Where did additional effort buy real reliability, and where did the urge for speed
      or perfection stop serving the purpose?


      Examples: Supportive: The participant stopped polishing a disposable note but retained fact and
      access checks for the reusable guide.


      Mixed: The time budget was too short for required verification, so the guide remained a draft rather
      than being rushed into use.


      Contradictory: A safety-critical instruction was treated as good enough under an arbitrary timer,
      or a lucky outcome excused skipped checks.


      Inconclusive: Efficiency was discussed without classifying consequence, performing a bounded task
      or checking the result.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01
