meaning_and_fit:
  purpose: Match speed, sufficiency, robustness, elegance, reversibility and exceptional effort to the
    consequence of a deliverable rather than to haste or perfectionism.
  why_recommended: Match speed, sufficiency, robustness, elegance, reversibility and exceptional effort
    to the consequence of a deliverable rather than to haste or perfectionism.
  claims:
  - statement: Match speed, sufficiency, robustness, elegance, reversibility and exceptional effort to
      the consequence of a deliverable rather than to haste or perfectionism.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Efficiency, thoroughness, and quality tradeoffs practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Efficiency, thoroughness, and quality tradeoffs as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use paper, audio or accessible digital work and shorter sessions. Organizational
    quality standards and professional duties take precedence over the exercise’s time limit. Stop rather
    than improvise when a task’s consequences exceed the safe scope.
  opportunity_considerations: 'Compare three supplied tasks: a disposable brainstorming note, a reusable
    newcomer guide and a safety-critical operating instruction that requires qualified formal review.
    Prepare a quality decision card with consequence, reversibility, minimum acceptable result, verification,
    time budget and stop condition. Perform only the first or second task.'
  prerequisites:
  - 'Compare three supplied tasks: a disposable brainstorming note, a reusable newcomer guide and a safety-critical
    operating instruction that requires qualified formal review. Prepare a quality decision card with
    consequence, reversibility, minimum acceptable result, verification, time budget and stop condition.
    Perform only the first or second task.'
  dependencies: []
  safe_alternatives:
  - Use paper, audio or accessible digital work and shorter sessions. Organizational quality standards
    and professional duties take precedence over the exercise’s time limit. Stop rather than improvise
    when a task’s consequences exceed the safe scope.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Efficiency, thoroughness, and quality tradeoffs differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Efficiency, thoroughness,
    and quality tradeoffs as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Compare three supplied tasks: a disposable brainstorming note, a reusable newcomer guide and
    a safety-critical operating instruction that requires qualified formal review. Prepare a quality decision
    card with consequence, reversibility, minimum acceptable result, verification, time budget and stop
    condition. Perform only the first or second task. Goal: Match speed, sufficiency, robustness, elegance,
    reversibility and exceptional effort to the consequence of a deliverable rather than to haste or perfectionism.
    Scope: Use fictional or low-stakes authorized tasks. This does not permit reduced assurance for safety-critical,
    legal, clinical or regulated work. Time and effort: Twenty minutes to classify three tasks, one bounded
    work session and a 15-minute review. Adaptation: Use paper, audio or accessible digital work and shorter
    sessions. Organizational quality standards and professional duties take precedence over the exercise’s
    time limit. Stop rather than improvise when a task’s consequences exceed the safe scope. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use paper, audio or accessible digital work and shorter sessions. Organizational
    quality standards and professional duties take precedence over the exercise’s time limit. Stop rather
    than improvise when a task’s consequences exceed the safe scope.
  expected_burden: Twenty minutes to classify three tasks, one bounded work session and a 15-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Efficiency, thoroughness, and quality tradeoffs protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Efficiency, thoroughness, and quality tradeoffs action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use paper,
    audio or accessible digital work and shorter sessions. Organizational quality standards and professional
    duties take precedence over the exercise’s time limit. Stop rather than improvise when a task’s consequences
    exceed the safe scope.
  actions:
  - stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01-A1
    sequence: 1
    title: Set a different quality bar for each consequence
    instructions: 'For the brainstorming note, identify what can be rough because errors are visible and
      reversible. For the newcomer guide, require accurate facts, access and maintainability because others
      depend on it. For the safety-critical instruction, identify the need for qualified standards, review
      and evidence beyond this exercise rather than inventing a quick checklist. Explain where elegance
      helps understanding and where it is optional. Do not use one universal effort level for all three.


      Observation checks: Three tasks receive consequence-specific quality bars; Reversibility changes
      the acceptable roughness; Reusable work includes maintenance and access; Safety-critical assurance
      is referred to its formal qualified process. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01
      action_stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01-A1
      competency_stable_id: '21.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2114_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2114_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_tasks_receive_consequence_specific_quality_bars
        - reversibility_changes_the_acceptable_roughness
        - reusable_work_includes_maintenance_and_access
        - safety_critical_assurance_is_referred_to_its_formal_qualified_process
      - measurement_id: c2114_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2114_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
