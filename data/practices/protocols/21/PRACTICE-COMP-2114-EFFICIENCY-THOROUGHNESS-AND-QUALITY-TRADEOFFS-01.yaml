  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      At twelve active minutes the B guide contains the confirmed facts but the entrance is blank and
      upkeep ownership is unaccepted. It remains **DRAFT — NOT READY**. The author does not spend the
      five optional styling minutes or substitute an entrance from memory.


      Venue Owner later confirms **South Entrance opens at 19:45 UTC** for this event. Photo Desk explicitly
      accepts upkeep of the guide and a review when event details change. The author spends **seven further
      active minutes** adding the source-confirmed route and owner, then checking the five reader answers.
      A fictional reader gives all five correctly without hints. Total active effort is **19 minutes**,
      seven above the initial budget; waiting duration is not supplied.


      The checked paper guide meets the exercise''s information criteria, but no actual public release
      or formal safety certification occurred. The author defers ornamental styling and plans to confirm
      essential dependencies before the next twelve-minute work period. Card C remains unperformed; the
      successful harmless guide cannot justify weaker assurance for the hazardous instruction.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Choose a quality level that fits the consequence of the work, then hold the essential standard
      when time becomes tight. Allow twenty minutes to compare three tasks, one bounded work session and
      fifteen minutes to review. Perform only the harmless paper task. A timer helps expose tradeoffs;
      it does not waive a requirement or qualify anyone to release consequential instructions.


      ### Match care to what failure would mean


      Fast, sufficient, robust, elegant, reversible and exceptional describe different qualities, not
      a single ladder of personal virtue. A brainstorming note can be rough if its purpose is to make
      options visible for immediate discussion. A reusable guide needs accurate facts and enough context
      for an absent reader. A safety-critical instruction needs its own qualified process and evidence.
      Applying the same effort level to all three can waste attention on the first while underchecking
      the last.


      Consequence includes who relies on the result, how an error is discovered and how readily it can
      be corrected. A wrong draft title seen by its author is different from a wrong entrance on a notice
      copied to many readers. A file can be editable while its downstream effects are difficult to reverse.
      Consider distribution and reliance, not only whether an undo button exists. Required organizational
      standards remain requirements even when a particular outcome happened to be harmless.


      Define sufficient in terms of purpose. “Good enough” without criteria often means “I feel done”
      or “the deadline arrived.” A disposable note may need three intelligible options and one open question.
      A reusable guide may need verified time, access and ownership. State what may remain rough and what
      cannot. This makes stopping a reasoned decision rather than an excuse for haste or endless polishing.


      Robustness adds useful resilience to foreseeable variation: clear units, an update owner or a missing-input
      rule. Elegance can reduce cognitive effort through a simple structure. Neither should be dismissed
      as decoration when it makes the result usable. Optional ornament, by contrast, may add no meaningful
      value under the task''s constraints. Exceptional effort is justified by a particular need, not by
      the fear that ordinary competent work is embarrassing.


      Budget effort in stages: establish essentials, verify them, then consider refinement. If an essential
      fact is still unknown at the boundary, classify the work as unready. Ask whether the accepting owner
      can approve a genuine narrower purpose or a new date. Do not move an essential into the optional
      column after discovering it takes time. A smaller internal draft can be useful, but it must be labeled
      for that limited use.


      Inspect your impulse to stop or continue without diagnosing yourself. Are you avoiding an uncomfortable
      verification question by polishing typography? Are you calling the task finished to relieve deadline
      anxiety? The answer is not always “work harder.” It may be ask for the missing input, stop unnecessary
      decoration, renegotiate a commitment or refer a consequential task to the proper owner. Actual outcomes
      and user needs should govern the decision.


      Review both effort and readiness. An overrun can expose an unrealistic estimate or an unresolved
      dependency. A successful result does not prove that skipped assurance was justified. A draft left
      unready at the time limit can be the responsible outcome. Describe what additional care bought and
      where extra work would have little value, while keeping the original estimate visible.


      ### Worked example


      A reusable guide reaches its twelve-minute budget with a missing evening entrance. Its author could
      use the main entrance from memory, but that would convert uncertainty into a false fact. The guide
      stays DRAFT. After the authorized answer arrives, seven more active minutes complete and check it.
      Nineteen minutes is an overrun against the original budget, even though the final guide is useful.
      The lesson is to confirm the dependency earlier, not to pretend the timer made the guess acceptable.


      ### Three complete task cards


      **A — Disposable discussion note.** A private paper discussion starts at 16:30. Produce three possible
      names for a fictional map club and one question about how the group will choose. Names may be rough
      and no name will be adopted from this note alone. Keep it legible and label it BRAINSTORM. Suggested
      budget: eight minutes. There is no need for a logo, exhaustive market research or publication.


      **B — Reusable newcomer guide.** Supply purpose, time, access/location, materials and contact for
      **Photo Review, 6 November 2026, 20:00–20:30 UTC, Cedar Center, Elm Room**. Purpose: compare paper
      photographs; bring **one print**; questions: **Photo Desk**, a fictional role. The evening entrance
      is **unconfirmed** and must be supplied by **Venue Owner**. The readable plain-text guide must include
      an accepted update owner and be rechecked when event details change. The current proposed writer
      has a twelve-minute first work period; decorative styling is estimated at five optional minutes.
      None of this authorizes release without the required facts.


      **C — Consequential operating instruction.** A proposed instruction would govern hazardous equipment.
      The equipment, hazards, standards, reviewer competence and operating authority are not supplied.
      Classify the need for the governing qualified review and evidence; **do not write, test or execute
      an operating procedure**. A toy checklist or arbitrary time budget cannot supply missing assurance.


      For B, the paper source contains exactly the facts above. Drafting can proceed with a visible unresolved
      entrance; no source establishes that the daytime entrance is open. The proposed update owner is
      Photo Desk, but acceptance must still be confirmed. These missing inputs are part of the quality
      decision, not a request for you to invent a real venue.


      ### Make and inspect the quality decision


      1. Give each card a consequence, reversibility judgment, minimum result, verification method and
      stop condition. Output: three different quality decisions, with C referred to its proper process.

      2. Choose A or B; the [later packet](?resource=file-later-packet-md) illustrates B. Produce essentials
      before optional finish and record the time boundary. Output: a draft with honest readiness and unresolved
      facts.

      3. Compare the supplied result with the declared criteria. Preserve any authorized extension and
      actual active effort separately from waiting. Output: readiness and effort judgments that can disagree.

      4. Identify one valuable extra check and one low-value refinement. Output: a next-time rule tied
      to consequence, not a universal command to go faster or polish more.


      ### Support and transfer


      Use spoken text, larger print or a shorter first session. A harder branch offers an attractive template
      that omits the update owner; do not let finish hide maintainability. For real work, follow actual
      quality standards, acceptance rules and professional duties. Stop when a task exceeds your authority
      or the harmless practice scope.


      ### Source use


      [ASQ''s cost-of-quality explanation, S07](https://asq.org/quality-resources/cost-of-quality), distinguishes
      prevention, appraisal and failure costs. Selected definitions support asking where effort is spent;
      no numerical optimum or certification standard is imported. The three task cards and budgets are
      original teaching materials, not permission to reduce required assurance.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A draft reaches its time limit with an essential fact missing. What should change first: the
      fact standard or the readiness claim?

      2. An editable instruction has already been distributed. Does easy editing make every error easily
      reversible?

      3. A harmless guide succeeds after nineteen minutes against a twelve-minute budget. Does that vindicate
      skipped checks on a hazardous task?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The readiness claim. Keep the fact unresolved and the work unready; obtain authorized information
      or agree a genuine scope/date change. The time limit does not waive the essential.

      2. No. Consider reliance, copies and consequences already created. Reversibility concerns the effects
      as well as the file, and governing assurance remains required.

      3. No. Preserve the seven-minute overrun and the value of essential checks. The hazardous task still
      requires its own qualified standards, authority and evidence; no procedure was performed here.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
