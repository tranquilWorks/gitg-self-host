  - stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01-A2
    sequence: 2
    title: Work to the selected standard with a visible time boundary
    instructions: 'Choose the harmless note or guide and set a reasonable work period. Produce the required
      content first, check the essential criteria and defer optional polish when the standard is met.
      If an essential fact remains uncertain at the time boundary, mark the deliverable unready or negotiate
      a narrower scope rather than publishing a guess. Record whether your urge to stop or keep polishing
      served the user or mainly relieved your own discomfort.


      Observation checks: Only a safe task is performed; Essential criteria precede optional polish; An
      unresolved essential prevents an unqualified ready claim; Haste or perfectionism is examined against
      user consequence. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01
      action_stable_id: PRACTICE-COMP-2114-EFFICIENCY-THOROUGHNESS-AND-QUALITY-TRADEOFFS-01-A2
      competency_stable_id: '21.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2114_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2114_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
