  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Kai''s first private wording is “You got the time wrong.” Before sharing it, Kai changes this to
      the factual question about 17:50 versus 18:00. Sora confirms arrival and session start are distinct;
      Kai records that **18:00 was correct** and no start-time correction was needed.


      Kai''s K2 invitation adds “Arrive 17:50; session 18:00–18:30 UTC” and “Questions: Poster Desk,”
      preserving all other facts. At 13:40 on 26 October, Sora checks K2 and says the text is ready for
      Sora''s approved-notice step. Sora accepts the handoff and retains responsibility for approval and
      any sending. **Nothing is actually sent** in this exercise.


      POSTER-HANDOFF credits Kai with readable wording and the clarification question; Sora with facts,
      agenda, schedule clarification, coordination and approval. The receiver can now use the text without
      asking for the omitted contact. There is no measured rework reduction, actual team-performance trend
      or compelled praise. The lesson is to ask about the role of a timestamp before treating a difference
      as an error.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Own a useful part of a shared task, challenge a concern constructively and leave a handoff
      another person can use. Allow fifteen minutes to coordinate, one short task and fifteen minutes
      for a retrospective. Use the fictional team below or an authorized willing collaboration. Team contribution
      is not measured by how often you speak, whether your preferred method wins or whether colleagues
      praise you.


      ### Improve the shared work rather than your visibility


      Start with the next dependency. A polished artifact that arrives after its receiver needed it can
      add work. An unglamorous fact check may prevent several people from repeating the same question.
      Ask what the team needs, agree the input and output, and state how much you can own. “I will help”
      is generous but leaves coordination unresolved. “I will turn the approved facts into a readable
      invitation and flag any gap by the checkpoint” gives others something to plan around.


      Coordinate ownership at the boundaries. The writer may own wording without owning schedule facts,
      approval or sending. Document the current version, decision, unresolved item and next person. A
      copied name is not a confirmed handoff. Ask the receiver to identify what they can now do and what
      is still missing. The goal is shared understanding, not a ceremonial acknowledgment that conceals
      a blocked dependency.


      Constructive challenge separates observation, possible consequence and proposed correction. “The
      brief says 17:50 and the invitation says 18:00; are these arrival and start times?” leaves room
      for context. “You always get times wrong” adds an unsupported personal claim and invites a status
      contest. Respect does not require suppressing a real problem, but confidence in your interpretation
      does not remove the need to check it.


      When your concern is mistaken, correct the record where it could affect the work. Do not quietly
      abandon the accusation while leaving others to believe there was an error. A justified correction
      to your own view is a useful team outcome. When a concern is valid, record the agreed change and
      who may approve it. Constructive challenge does not confer authority to rewrite another person''s
      requirement or bypass an approval.


      Credit should follow actual contributions, including invisible ones. Fact checking, accessibility
      work, scheduling and review may matter without appearing as authored text. State your own contribution
      honestly as well: erasing it is not required for fairness. Do not claim a whole team result from
      your own draft, and do not assign work to someone merely because their name would make the credit
      line balanced.


      Evaluate the collective effect narrowly. Receiver readiness can show that a dependency is clearer.
      One smooth handoff cannot establish that the team is now broadly more reliable. Rework minutes,
      missing questions and confusion require actual records, not optimistic estimates after a pleasant
      meeting. Keep a personal learning point and a system learning point separate: you may need to ask
      better questions while the team needs clearer source labels.


      Power changes which challenge is safe. A practice exercise is not a requirement to confront a supervisor,
      pressure a subordinate into feedback or make a public accusation. Use a private fictional rehearsal
      when the real setting is unsafe. The ordinary low-stakes case below teaches coordination; it does
      not grant permission over colleagues or establish protection from retaliation.


      ### Worked example


      Kai sees 17:50 in Sora''s note and 18:00 in the invitation and prepares to “fix” the invitation.
      Sora explains that the former is arrival and the latter is the session start. The invitation''s
      time was correct. Kai withdraws the accusation and proposes labeling both times explicitly. The
      team can improve clarity without pretending Kai discovered a schedule error or that Sora''s method
      was disloyal.


      ### Complete fictional team materials


      Kai and Sora prepare an invitation and agenda for a paper-poster review. Sora owns the facts, agenda,
      approval and any eventual sending. Kai owns readable invitation wording after asking what is needed.
      The session is **27 October 2026, 18:00–18:30 UTC**, **Cedar Center, Elm Room**; arrival is **17:50**.
      Bring **one paper poster**. Questions go to **Poster Desk**, a fictional public role label. No actual
      message should be sent.


      The agenda is: purpose and orientation, **5 minutes**; compare the two supplied poster layouts,
      **15 minutes**; choose one revision owner and date, **10 minutes**. The agenda total is thirty minutes.
      Sora''s brief reads “arrival 17:50; session starts 18:00.” Draft invitation K1 reads “Poster review,
      27 October, 18:00–18:30 UTC, Elm Room at Cedar Center. Bring one paper poster.” K1 omits arrival
      and the questions contact. Its session start is not wrong.


      Sora has requested plain text because the next step is to place it in an accessible shared notice.
      Kai has twenty active minutes and accepts a check-in at **26 October, 12:00 UTC** if facts or approval
      are missing. Sora will receive the invitation by **14:00 UTC** that day. The permitted shared note
      is a fictional paper sheet headed **POSTER-HANDOFF**. Neither person can use a draft to represent
      another person''s consent to public distribution.


      ### Contribute, check and hand over


      1. Agree Kai''s specific contribution, inputs, capacity, receiver and help trigger. Identify Sora''s
      fact, coordination and approval work. Output: a brief ownership agreement including invisible work.

      2. Write a challenge about the apparent time mismatch using the actual two texts. Include consequence,
      possible correction and a question inviting context. Output: a revisable observation, not a character
      judgment.

      3. Save before the [later packet](?resource=file-later-packet-md). Use the clarification to correct
      the concern and invitation. Output: a new version and a shared decision note preserving what was
      and was not wrong.

      4. Supply version, verified facts, approval status, open question and next owner. Ask for readiness
      confirmation. Output: a completed or explicitly blocked handoff with accurate credit.

      5. Review the effect using only the supplied response. Output: one justified team benefit and one
      missing measurement, plus a next-time improvement.


      ### Support and transfer


      Use asynchronous text, spoken notes or a two-role private rehearsal. A harder branch has Sora unavailable
      for approval: prepare the draft and hold distribution; silence does not delegate authority. In actual
      work, keep confidential content in approved systems, ask for willing feedback and respect formal
      review. A disagreement over method can coexist with a useful shared outcome.


      ### Source use


      [AHRQ TeamSTEPPS Handoff, S02](https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/handoff.html),
      emphasizes clarity, receiver acknowledgment and opportunities for questions. Its clinical setting
      and duties are not imported into this paper collaboration. No claim of team-performance effectiveness
      or medical qualification follows.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
