meaning_and_fit:
  purpose: Coordinate a useful contribution, raise a relevant concern respectfully, document the handoff
    and share credit in a way that improves the team’s collective reliability.
  why_recommended: Coordinate a useful contribution, raise a relevant concern respectfully, document the
    handoff and share credit in a way that improves the team’s collective reliability.
  claims:
  - statement: Coordinate a useful contribution, raise a relevant concern respectfully, document the handoff
      and share credit in a way that improves the team’s collective reliability.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Collaboration and team contribution practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Collaboration and team contribution as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use asynchronous collaboration, accessible shared notes or a fictional two-role
    rehearsal. Do not pressure subordinates to praise you, expose protected information or use the exercise
    to conduct an unofficial performance review. Unsafe power dynamics call for appropriate support.
  opportunity_considerations: Default to two people preparing a small event agenda and invitation. Agree
    who owns facts, wording, approval and sending. Prepare a handoff note with current version, decision,
    open question, next owner and credit. Keep real workplace information in approved systems.
  prerequisites:
  - Default to two people preparing a small event agenda and invitation. Agree who owns facts, wording,
    approval and sending. Prepare a handoff note with current version, decision, open question, next owner
    and credit. Keep real workplace information in approved systems.
  dependencies: []
  safe_alternatives:
  - Use asynchronous collaboration, accessible shared notes or a fictional two-role rehearsal. Do not
    pressure subordinates to praise you, expose protected information or use the exercise to conduct an
    unofficial performance review. Unsafe power dynamics call for appropriate support.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Collaboration and team contribution differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Collaboration and team contribution
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to two people preparing a small event agenda and invitation. Agree who owns facts, wording,
    approval and sending. Prepare a handoff note with current version, decision, open question, next owner
    and credit. Keep real workplace information in approved systems. Goal: Coordinate a useful contribution,
    raise a relevant concern respectfully, document the handoff and share credit in a way that improves
    the team’s collective reliability. Scope: Use a willing low-stakes collaboration. This is not a team-performance
    assessment, authority to direct peers or a requirement to challenge an unsafe supervisor directly.
    Time and effort: A 15-minute coordination check, one shared task and a 15-minute retrospective. Adaptation:
    Use asynchronous collaboration, accessible shared notes or a fictional two-role rehearsal. Do not
    pressure subordinates to praise you, expose protected information or use the exercise to conduct an
    unofficial performance review. Unsafe power dynamics call for appropriate support. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous collaboration, accessible shared notes or a fictional two-role
    rehearsal. Do not pressure subordinates to praise you, expose protected information or use the exercise
    to conduct an unofficial performance review. Unsafe power dynamics call for appropriate support.
  expected_burden: A 15-minute coordination check, one shared task and a 15-minute retrospective.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Collaboration and team contribution protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Collaboration and team contribution action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    collaboration, accessible shared notes or a fictional two-role rehearsal. Do not pressure subordinates
    to praise you, expose protected information or use the exercise to conduct an unofficial performance
    review. Unsafe power dynamics call for appropriate support.
  actions:
  - stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A1
    sequence: 1
    title: Offer a contribution that reduces an actual team gap
    instructions: 'Ask what the team needs next and identify one task you can own completely within your
      authority. Confirm the input, output and next person’s dependency rather than picking only the most
      visible work. State your capacity and an early help trigger. Name a useful contribution another
      person is making, including coordination or review work that may not appear in the final artifact.


      Observation checks: The contribution addresses a confirmed team need; Inputs outputs and dependencies
      are agreed; Capacity and help triggers are explicit; Invisible or supporting contributions are recognized.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A1
      competency_stable_id: '21.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2109_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2109_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_contribution_addresses_a_confirmed_team_need
        - inputs_outputs_and_dependencies_are_agreed
        - capacity_and_help_triggers_are_explicit
        - invisible_or_supporting_contributions_are_recognized
      - measurement_id: c2109_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
