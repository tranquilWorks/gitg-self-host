        expected: true
      - measurement_id: c2109_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A2
    sequence: 2
    title: Raise one concrete concern without turning it into a status contest
    instructions: 'During the work, identify a factual issue such as a missing access route or conflicting
      meeting time. State the observation, likely consequence and a possible correction, then invite the
      owner to supply context you may lack. Accept a justified correction to your own view. Document the
      decision in the shared permitted place so the concern does not survive as rumor or private resentment.


      Observation checks: The challenge concerns a specific observable issue; Consequence and a possible
      correction are stated; The owner can correct missing context; The resulting decision is documented
      transparently. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A2
      competency_stable_id: '21.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2109_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2109_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_challenge_concerns_a_specific_observable_issue
        - consequence_and_a_possible_correction_are_stated
        - the_owner_can_correct_missing_context
        - the_resulting_decision_is_documented_transparently
      - measurement_id: c2109_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2109_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
