    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Two documents show different times. Does noticing the difference establish that your colleague
      made an error?

      2. Your draft is ready but its approving owner is absent. Does a deadline authorize you to send
      it?

      3. A receiver confirms readiness and thanks you. What credit and performance claims are justified?'
    check_id: practice-answers
    attempt_mode: practice
