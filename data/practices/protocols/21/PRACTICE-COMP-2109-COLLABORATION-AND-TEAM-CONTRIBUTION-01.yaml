        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A3
    sequence: 3
    title: Close your handoff and review the team effect
    instructions: 'Deliver the agreed work with its version, limitations and next action, and ask the
      receiver to confirm readiness. Share credit according to actual contributions rather than claiming
      the whole result or erasing your own part. In a short retrospective, identify whether your participation
      reduced rework, confusion or dependency and what you should change next time. Team success does
      not require everyone to agree with your preferred method.


      Observation checks: The handoff is confirmed by the receiver; Credit reflects actual contributions;
      Collective rework or clarity is reviewed; Method disagreement is separated from team loyalty. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.


      Final review: Did your contribution make the team more capable when you were not explaining it,
      and was your challenge useful rather than merely visible?


      Examples: Supportive: A missing access detail was corrected, the receiver confirmed the handoff
      and both drafting and coordination work received credit.


      Mixed: The concern was valid but delivered as a personal criticism; the participant repaired the
      wording and documented the actual issue.


      Contradictory: The participant hoarded information, took all credit or treated disagreement as disloyalty.


      Inconclusive: A team meeting was attended without an owned contribution, constructive concern or
      confirmed handoff.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01
      action_stable_id: PRACTICE-COMP-2109-COLLABORATION-AND-TEAM-CONTRIBUTION-01-A3
