meaning_and_fit:
  purpose: Identify the core knowledge, tools, standards and safety limits of a small craft task and demonstrate
    repeatable acceptable work rather than one impressive attempt.
  why_recommended: Identify the core knowledge, tools, standards and safety limits of a small craft task
    and demonstrate repeatable acceptable work rather than one impressive attempt.
  claims:
  - statement: Identify the core knowledge, tools, standards and safety limits of a small craft task and
      demonstrate repeatable acceptable work rather than one impressive attempt.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Foundational craft competence practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Foundational craft competence as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use speech, large print, accessible digital text or another safe foundational
    task with a real standard. Necessary supports are legitimate work conditions. Tasks involving clinical
    care, driving, weapons, hazardous tools or licensed work require appropriate supervision and are not
    default practice material.
  opportunity_considerations: 'Use the three complete fictional event briefs in the learning guide: Neighborhood
    Seed Swap, Repair Café Taster and Evening Sketch Walk. Use paper or a familiar text editor. Prepare
    one notice from each brief and check against the supplied F1–F5 accuracy and U1–U2 usability criteria.
    No event, contact route or address is real; keep the notices as practice artifacts. The guide supplies
    the facts, layout example, matching checks and a fresh contact-change retest.'
  prerequisites:
  - 'Use the three complete fictional event briefs in the learning guide: Neighborhood Seed Swap, Repair
    Café Taster and Evening Sketch Walk. Use paper or a familiar text editor. Prepare one notice from
    each brief and check against the supplied F1–F5 accuracy and U1–U2 usability criteria. No event, contact
    route or address is real; keep the notices as practice artifacts. The guide supplies the facts, layout
    example, matching checks and a fresh contact-change retest.'
  dependencies: []
  safe_alternatives:
  - Use speech, large print, accessible digital text or another safe foundational task with a real standard.
    Necessary supports are legitimate work conditions. Tasks involving clinical care, driving, weapons,
    hazardous tools or licensed work require appropriate supervision and are not default practice material.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Foundational craft competence differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Foundational craft competence
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the three complete fictional event briefs in the learning guide: Neighborhood Seed Swap,
    Repair Café Taster and Evening Sketch Walk. Use paper or a familiar text editor. Prepare one notice
    from each brief and check against the supplied F1–F5 accuracy and U1–U2 usability criteria. No event,
    contact route or address is real; keep the notices as practice artifacts. The guide supplies the facts,
    layout example, matching checks and a fresh contact-change retest. Goal: Identify the core knowledge,
    tools, standards and safety limits of a small craft task and demonstrate repeatable acceptable work
    rather than one impressive attempt. Scope: Choose a safe non-regulated component. This does not authorize
    professional practice, hazardous equipment use or a claim of competence in an entire occupation. Time
    and effort: Twenty minutes to define the standard, three short attempts and a 15-minute comparison.
    Adaptation: Use speech, large print, accessible digital text or another safe foundational task with
    a real standard. Necessary supports are legitimate work conditions. Tasks involving clinical care,
    driving, weapons, hazardous tools or licensed work require appropriate supervision and are not default
    practice material. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use speech, large print, accessible digital text or another safe foundational task
    with a real standard. Necessary supports are legitimate work conditions. Tasks involving clinical
    care, driving, weapons, hazardous tools or licensed work require appropriate supervision and are not
    default practice material.
  expected_burden: Twenty minutes to define the standard, three short attempts and a 15-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Foundational craft competence protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Foundational craft competence action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use speech,
    large print, accessible digital text or another safe foundational task with a real standard. Necessary
    supports are legitimate work conditions. Tasks involving clinical care, driving, weapons, hazardous
    tools or licensed work require appropriate supervision and are not default practice material.
  actions:
  - stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01-A1
    sequence: 1
    title: Identify the field’s basics and bound the sample task
    instructions: 'Read the guide’s event-notice preparation card, three briefs and F1–F5/U1–U2 standard.
      Identify the knowledge, tool and access method needed to turn supplied facts into a readable notice.
      Use this supplied product specification for the default. Separate mandatory factual accuracy and
      reading access from optional decoration. State that this samples a small communication-design component,
      not an entire profession, a legal notice or regulated work.


      Observation checks: Knowledge tools standard and safety limits are identified; Mandatory accuracy
      and access are separated from polish; The sample task is bounded within a broader craft; Unassessed
      professional capability is explicitly excluded. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01
      action_stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01-A1
      competency_stable_id: '21.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2103_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2103_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - knowledge_tools_standard_and_safety_limits_are_identified
        - mandatory_accuracy_and_access_are_separated_from_polish
        - the_sample_task_is_bounded_within_a_broader_craft
        - unassessed_professional_capability_is_explicitly_excluded
      - measurement_id: c2103_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
