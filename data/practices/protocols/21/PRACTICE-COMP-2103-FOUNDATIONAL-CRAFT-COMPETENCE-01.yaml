        expected: true
  - stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01-A2
    sequence: 2
    title: Complete three independent attempts against the same standard
    instructions: 'Create a separate notice from each of the three supplied briefs. Keep comparable format,
      tools and support conditions, and verify which brief you are using before entering its facts. Preserve
      the original attempt before checking. Mark an incorrect, omitted or uninspected criterion explicitly
      instead of silently fixing the first result. You may use the blank layout pattern, but each notice
      must use its own facts. These fictional notices are not for real publication.


      Observation checks: Three distinct fact sets are attempted; The same standard and comparable conditions
      are used; Errors remain visible in the attempt record; No inaccurate notice is put into real use.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01
      action_stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01-A2
      competency_stable_id: '21.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
