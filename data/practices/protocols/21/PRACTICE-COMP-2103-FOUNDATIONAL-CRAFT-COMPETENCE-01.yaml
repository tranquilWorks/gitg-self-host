        expected: true
  - stable_id: PRACTICE-COMP-2103-FOUNDATIONAL-CRAFT-COMPETENCE-01-A3
    sequence: 3
    title: Have the work checked and target the unstable basic
    instructions: 'After preserving all three attempts, reveal each matching check or ask a freely willing
      intended reader to locate the five facts using the supplied standard. Label self-check, external
      review and untested access conditions separately. Inspect F1–F5 and U1–U2 for every output; attractive
      formatting cannot compensate for an incorrect date or missing contact. Identify an unstable basic,
      apply one specific correction and attempt the supplied contact-change retest. If no error was found,
      use the retest to check that a change is propagated accurately. Report only the component and conditions
      actually tested.


      Observation checks: All three outputs receive a consistent check; Self-review and external review
      are distinguished; A repeated weakness receives a concrete correction and retest; The claim remains
      limited to the sampled component. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which basic was reliable across all three attempts, and what repeated error matters
      more than the most polished single result?


      Examples: Supportive: All three notices preserved the required facts and reading order, while an
      unstable contact label was corrected and retested.


      Mixed: One notice looked excellent, but two contained copied dates; the participant targeted fact
      checking rather than claiming competence.


      Contradictory: A small safe exercise was used to claim professional qualification or to justify
      unsupervised hazardous work.


      Inconclusive: One attractive output was produced without a fixed standard or repeated attempts.'
