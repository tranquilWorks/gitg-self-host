instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '21.03'
  title: Produce and check three dependable event notices
  scored: false
  sections:
  - id: preparation
    kind: concept
    title: Turn a brief into a dependable notice
    body: 'The component is extracting required facts, arranging them for a reader, and checking the result
      against a fixed specification. Know which source controls each fact, use a tool whose reading order
      you can inspect, and distinguish accuracy from decoration. A repeatable process is: identify the
      assigned brief; enter its five facts; preserve the first output; check each fact against that same
      brief; inspect reading order and access; then correct and retry. The supplied standard is a product
      specification for this exercise, not a professional credential or an accessibility certification.'
  - id: layout
    kind: worked_example
    title: A reusable layout, with new facts each time
    body: 'Use a heading for the event name, then labeled lines for date, start–end time, full location
      and contact. Blank pattern:

      EVENT NAME

      Date: [day month year]

      Time: [start–end]

      Location: [venue and address]

      Contact: [route]


      For an unrelated illustration: Pocket Poetry Hour; 8 August 2027; 14:00–15:00; Maple Reading Room,
      3 Orchard Road; poetry@events.example. The facts are fictional. In digital text, keep this order
      in the underlying text as well as visually; an image-only notice needs an equivalent text version
      for a text-reading route.'
  - id: standard
    kind: material
    title: The checking standard
    body: 'F1 — Event name matches the assigned brief.

      F2 — Day, month and year match the assigned brief.

      F3 — Both start and end times match the assigned brief.

      F4 — The full venue and address are preserved.

      F5 — The contact route is present and matches the assigned brief.

      U1 — A reader can follow the event name, date, time, place and contact in a clear reading order.

      U2 — The selected format remains legible and usable with the intended access method; record what
      was actually inspected.


      For each criterion record met, not met, or uninspected, with a short fact or location in the output.
      Any F1–F5 failure prevents an accuracy pass, regardless of polish. U1 or U2 uninspected means usability
      remains unverified, not passed. Inspect text order by reading or listening from start to finish.
      For U2, use the format you actually chose: appropriate zoom or text-reader access for a digital
      notice, or the selected large-print/speech method. Record that specific condition. A text comparison
      alone cannot certify every device, reader or print condition. Do not invent a fee, booking rule
      or access claim that the brief does not supply.'
  - id: work-record
    kind: material
    title: Keep the first attempt and its check
    body: 'Copy this record once for each notice. Keep the notice itself alongside it.


      Brief and first-output filename/page:

      Tool, format and supports used:

      F1 event name: [met / not met / uninspected] — location or discrepancy:

      F2 date: [met / not met / uninspected] — location or discrepancy:

      F3 start and end times: [met / not met / uninspected] — location or discrepancy:

      F4 full venue and address: [met / not met / uninspected] — location or discrepancy:

      F5 contact route: [met / not met / uninspected] — location or discrepancy:

      U1 reading order: [met / not met / uninspected] — how inspected:

      U2 access condition: [met / not met / uninspected] — condition and result:

      Reviewer: [self / freely willing reader] — help used:

      Correction and separate revised-output filename/page:


      Do not turn seven boxes into an average score. One incorrect factual value means

      the first output was inaccurate. An uninspected criterion is unknown. Record the

      corrected result separately so a successful edit does not erase the original error.

      '
  - id: access-check
    kind: material
    title: Inspect the format you actually used
    body: 'For digital text, read or listen from the event heading through the contact line.

      Check that every fact occurs once in a sensible sequence. Enlarge the text to

      200 percent using your usual application controls and inspect every line for clipping

      or overlap. If a text-reading route matters for your use, inspect the reading order

      with that route too; visually positioned boxes may be read in an unexpected order.

      An image-only notice needs a matching text version. Record the application, enlargement

      and reading route actually checked; another device or assistive tool remains untested.


      For paper, use the intended print size, lighting and reading distance. Read all five

      facts without guessing at cramped or faint characters. Enlarge or simplify the notice

      if that fails, preserve the earlier version, and inspect the revision. A screen preview

      does not establish that the printed copy is usable.


      For speech, state the labeled facts in order and allow a replay. Have a freely willing

      listener repeat back the date, both times, full place and contact if one is available.

      Otherwise record a self-check and leave another listener''s usability untested. Necessary

      supports are legitimate conditions; these checks are not an accessibility certification.

      '
  - id: capability-fit
    kind: pathway
    title: Use an appropriately demanding component
    body: The notice route is complete and suitable for practicing a small accuracy-and-presentation task.
      Keep necessary supports present in all attempts. If this is already routine, choose a safe component
      from a craft you actually practice, with three comparable input sets and a real recipient or published
      standard available before beginning. Identify its tools, knowledge, checking method and limits;
      do not substitute a vague goal such as be professional. This alternate route requires those real
      materials and their review, so the supplied notice checks cannot certify it. Work requiring licenses
      or hazardous equipment needs its appropriate established supervision; this route grants no authority.
