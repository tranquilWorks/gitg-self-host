  - stable_id: PRACTICE-COMP-2104-DELIBERATE-MASTERY-AND-EXPERTISE-01-A2
    sequence: 2
    title: Seek specific critique and practice the correction
    instructions: 'Ask an appropriately skilled reviewer or the intended reader where the explanation
      failed and what information was missing. Distinguish a criterion-based correction from personal
      taste or prestige. Revise only the selected component and rehearse it twice on two fictional item
      examples. Accept a supported correction without treating the reviewer as infallible; where advice
