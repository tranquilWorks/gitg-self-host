meaning_and_fit:
  purpose: Target a specific weakness, use informative critique and integrate the corrected component
    into a whole task while preserving the distinction between practice and expertise.
  why_recommended: Target a specific weakness, use informative critique and integrate the corrected component
    into a whole task while preserving the distinction between practice and expertise.
  claims:
  - statement: Target a specific weakness, use informative critique and integrate the corrected component
      into a whole task while preserving the distinction between practice and expertise.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Deliberate mastery and expertise practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Deliberate mastery and expertise as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a public answer key, accessible task simulation or a qualified mentor
    when a live reviewer is unavailable. Mark self-comparison and external critique separately. Do not
    expose protected work, pressure a subordinate to review you or escalate into unsafe difficulty.
  opportunity_considerations: Default to explaining a three-step borrowing process clearly enough that
    a willing reader can perform it without extra questions. Use fictional items and a private draft.
    The external check is the reader’s actual ability to identify the action order, return location and
    exception contact; the reader is not required to praise the explanation.
  prerequisites:
  - Default to explaining a three-step borrowing process clearly enough that a willing reader can perform
    it without extra questions. Use fictional items and a private draft. The external check is the reader’s
    actual ability to identify the action order, return location and exception contact; the reader is
    not required to praise the explanation.
  dependencies: []
  safe_alternatives:
  - Use a public answer key, accessible task simulation or a qualified mentor when a live reviewer is
    unavailable. Mark self-comparison and external critique separately. Do not expose protected work,
    pressure a subordinate to review you or escalate into unsafe difficulty.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Deliberate mastery and expertise differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Deliberate mastery and expertise
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to explaining a three-step borrowing process clearly enough that a willing reader can
    perform it without extra questions. Use fictional items and a private draft. The external check is
    the reader’s actual ability to identify the action order, return location and exception contact; the
    reader is not required to praise the explanation. Goal: Target a specific weakness, use informative
    critique and integrate the corrected component into a whole task while preserving the distinction
    between practice and expertise. Scope: Use a safe skill within your authority and an appropriate external
    criterion or reviewer. One improvement does not establish mastery, talent or transfer to high-stakes
    work. Time and effort: Twenty minutes to select the component, two 10–15 minute attempts, one critique
    pass and a short integration test. Adaptation: Use a public answer key, accessible task simulation
    or a qualified mentor when a live reviewer is unavailable. Mark self-comparison and external critique
    separately. Do not expose protected work, pressure a subordinate to review you or escalate into unsafe
    difficulty. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a public answer key, accessible task simulation or a qualified mentor when
    a live reviewer is unavailable. Mark self-comparison and external critique separately. Do not expose
    protected work, pressure a subordinate to review you or escalate into unsafe difficulty.
  expected_burden: Twenty minutes to select the component, two 10–15 minute attempts, one critique pass
    and a short integration test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Deliberate mastery and expertise protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Deliberate mastery and expertise action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a public
    answer key, accessible task simulation or a qualified mentor when a live reviewer is unavailable.
    Mark self-comparison and external critique separately. Do not expose protected work, pressure a subordinate
    to review you or escalate into unsafe difficulty.
  actions:
  - stable_id: PRACTICE-COMP-2104-DELIBERATE-MASTERY-AND-EXPERTISE-01-A1
    sequence: 1
    title: Find the weak component from observed performance
    instructions: 'Make a short baseline explanation and have the willing reader attempt the harmless
      task or compare it with a published authoritative procedure. Identify one unstable component, such
      as an exception instruction appearing before the main action. Choose a difficulty just beyond current
      reliable performance while preserving safety and access supports. Record the criterion before revising
      so success cannot be redefined after seeing the result.


      Observation checks: A baseline uses an external task or authoritative criterion; One observable
      weak component is selected; Difficulty is challenging but safe and supported; The success criterion
      is fixed before revision. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2104-DELIBERATE-MASTERY-AND-EXPERTISE-01
      action_stable_id: PRACTICE-COMP-2104-DELIBERATE-MASTERY-AND-EXPERTISE-01-A1
