  - stable_id: PRACTICE-COMP-2104-DELIBERATE-MASTERY-AND-EXPERTISE-01-A3
    sequence: 3
    title: Reintegrate and compare the whole task
    instructions: 'Insert the corrected component into a full explanation and ask the reader to perform
      a new comparable fictional task. Compare the original and new outcomes on the predeclared criterion,
      including new confusion introduced elsewhere. Decide whether to repeat the component, seek more
      qualified critique or increase complexity modestly. Report the observed improvement or lack of it;
      time spent and feeling stretched are not substitutes for a better external result.


      Observation checks: The corrected component is tested within the whole task; A new comparable task
      checks the original criterion; Regressions elsewhere remain visible; The next practice choice follows
      observed performance rather than effort alone. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which correction improved the external result, and did it still work when you put
      the component back into the whole task?


      Examples: Supportive: The reader completed the new task with the revised exception instruction and
      no new ambiguity, supporting a narrow improvement claim.


      Mixed: The isolated sentence improved, but the whole explanation became confusing; the participant
      returned to integration rather than advancing difficulty.


      Contradictory: Effort or a prestigious reviewer’s praise was treated as proof of expertise despite
      unchanged task performance.


      Inconclusive: A weakness was named without a fixed external check, targeted correction or integrated
      retry.'
