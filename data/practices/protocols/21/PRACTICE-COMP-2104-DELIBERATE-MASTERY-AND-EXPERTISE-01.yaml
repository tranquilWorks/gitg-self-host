  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The baseline comparison meets order and normal-location criteria but fails the damaged-item route:
      two of three. The revised exception sends P1 to BLUE and P2 to the desk correctly. Those are two
      component checks, not two complete independent demonstrations of expertise.


      Worked integration item F1 is a damaged chart card. In v2 the exception is correct, but the full
      explanation omits writing the item ID before use. The fictional reader follows that omission. Normal
      destination knowledge and exception routing are correct; order/logging fails, so the full task still
      meets only two of three criteria. The author does not declare improvement merely because the original
      defect disappeared.


      After restoring the log step, v3 is checked on fresh damaged item F2, a diagram card. The supplied
      reader response identifies approval then logging/use, BLUE for an undamaged item, and the desk for
      this damaged item. All three criteria are met in that case. No actual reader or expert was involved.
      The result supports a narrow fictional integration improvement, while retention, uncoached real
      performance, broader contexts and expertise remain untested.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Improve one weak component against a fixed external criterion, then check whether it survives
      reintegration into the whole task. Allow twenty minutes to establish a baseline, two short practice
      attempts, a critique pass and a fresh integrated test. Use the complete paper borrowing task. One
      improvement does not establish mastery, talent or readiness for high-consequence work.


      ### How to use the supplied outcomes


      The main and later packets narrate worked analysis: some explanations and outcomes are supplied.
      Use them to inspect reasoning, not to claim an unaided performance. Complete the changed-case attempt
      in the separate check-prompts file before opening its answer for a new application.


      ### Practice a discriminating weakness


      A vague aim such as “get better at explaining” gives little guidance. Observe a specific failure
      and identify a component whose correction could improve the real task. The challenge should be beyond
      current reliable performance while remaining safe and accessible. Repetition of what is already
      easy can build fluency but does not by itself address the unstable part.


      Set the criterion before revising. An external standard may be an authoritative procedure, a meaningful
      performance task or appropriately qualified critique. A reader''s ability to use an instruction
      differs from whether they like its tone. A source check, self-comparison and another person''s performance
      are different evidence types; label each honestly. This fictional task supplies a governing procedure,
      so no missing standard has to be invented.


      Ask for critique that identifies the gap, its consequence and a possible correction. A skilled reviewer
      can notice patterns you miss, but expertise does not make every preference a requirement. Compare
      advice with the actual governing rule. If a prestigious reviewer suggests a shortcut that violates
      it, resolve that conflict before using the advice. Do not pressure a subordinate to praise you or
      expose protected work to obtain feedback.


      Practice the selected component on more than one example. Vary the detail that matters while holding
      the criterion stable, then inspect each attempt. Effort, discomfort and time spent are not substitutes
      for improvement. Retain access supports, take a pause when fatigue defeats useful feedback and choose
      further difficulty from observed performance rather than a desire to prove toughness.


      Component improvement is not enough. Adding a correct exception sentence can disrupt order elsewhere;
      removing ambiguity can accidentally omit a required step. Reintegrate into the whole task and use
      a fresh comparable case. A regression is useful evidence about the next practice need. Keep the
      original standard rather than redefining success around whichever detail improved.


      Expertise develops across more performance, complexity and contexts than one small exercise can
      establish. A narrow result can justify another trial or a modest increase in challenge. It cannot
      certify professional competence, broad transfer or an innate trait. Confidence should follow the
      evidence rather than the reviewer''s status or the elegance of the explanation.


      ### Worked example


      A borrower instruction gives the normal return location but sends damaged items there too. The author
      practices a clear exception and gets that sentence right. In the first integrated revision, however,
      the required log step disappears. The corrected component worked; the whole instruction still fails.
      The next revision restores the log and is checked on a fresh item before difficulty increases.


      ### Complete fictional standard and materials


      The authorized paper procedure has three stages: **1. Ask the desk for approval before borrowing
      a card. 2. Write its item ID on a borrow slip, then use the card. 3. Return an undamaged card to
      the BLUE tray; if damaged, keep it out of the tray, report it to the desk and leave it with the
      desk.** No real borrowing, credentials or personal log is involved.


      The fixed check asks whether a reader can identify **the action order including approval and logging,
      the normal return location, and the damaged-item contact/route**. These are three task criteria,
      not app points or a mastery score. Baseline text reads: “Ask the desk, write the ID and use the
      card. Return it to BLUE when finished; mention damage when convenient.” Its damage route is misleading.


      Baseline item B0 is a damaged map card. Practice items P1 and P2 are, respectively, an undamaged
      route card and a damaged map card. A fictional experienced desk steward''s critique is: “The normal
      tray must never receive the damaged card; explain the exception before the return decision.” This
      is supplied critique, not an actual expert receipt. Worked integration items will appear in the
      later packet.


      ### Target, practice and reintegrate


      1. Compare the baseline text with the standard and check the three criteria before changing them.
      Explain why the damaged-item route is the weak component. Output: a criterion-based baseline, with
      self-comparison labeled rather than invented reader performance.

      2. Evaluate the steward''s critique against the rule. Rewrite the exception without changing approval,
      logging or normal return. Output: one targeted correction and its reason, separated from stylistic
      preference.

      3. Rehearse the route for P1 and P2, explaining which condition changes the destination. Inspect
      both against the fixed procedure. Output: two component attempts, not a claim that the whole instruction
      now works.

      4. Save the revision before the [later packet](?resource=file-later-packet-md). Integrate it into
      a complete explanation, then check the new item and any regression. Output: a full-task comparison
      on the original criteria.

      5. Decide whether to repeat, seek more skilled critique or cautiously add complexity. Output: a
      next practice choice and a bounded performance claim, with no unsupported mastery label.


      ### Support and transfer


      Use physical paper labels, spoken instructions, large print or a chosen helper. A harder case introduces
      a missing item ID; stop and ask the authorized desk rather than guessing or treating uncertainty
      as failure. Appropriate challenge includes noticing when a rule does not supply enough information.


      In real work, choose a safe skill, legitimate standard and willing reviewer. Maintain confidentiality
      and formal review for consequential tasks. A fictional steward and prewritten result cannot count
      as actual observer evidence. Even a successful actual retry needs later work to establish retention,
      wider transfer and consistent expertise.


      ### Source use


      [Carnegie Mellon''s Eberly Center learning principles, S09](https://www.cmu.edu/teaching/principles/learning.html),
      distinguishes component learning, integration and goal-directed practice with criterion-specific
      feedback. These educational principles support the narrow practice structure; the linked research
      and any exact training dose were not evaluated. The borrowing procedure, three criteria and all
      cases are original, not a validated expertise assessment.


      ### Use the result at its proper scale


      The practical limits in this guide are exercise safeguards, not added canonical metadata.


      Paid employment, a career change or a particular work role is not compulsory. Fiction and no attempt
      are legitimate. Keep private or protected records private.


