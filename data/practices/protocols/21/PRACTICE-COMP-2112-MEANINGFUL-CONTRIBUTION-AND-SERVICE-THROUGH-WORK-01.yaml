  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      Ari says, “Both times are readable, but I cannot tell which is current.” Ari''s compliment about
      the lettering does not establish that the schedule supports planning. No departure or missed meeting
      is recorded.


      The coordinator approves S3: “CURRENT, approved 22 October 10:00 UTC; Neighborhood Map Session,
      28 October 2026, 18:30–19:00 UTC, Pine Room at Cedar Center; questions and update requests: Schedule
      Desk.” The remaining purpose and bring information are retained. The coordinator authorizes the
      older S1 copy to be marked **SUPERSEDED — use S3**. Fin explicitly accepts the Schedule Desk update
      role and agrees to revise the two known copies when a coordinator-approved change arrives.


      With the two copies presented again, Ari identifies **28 October, 18:30 UTC, Schedule Desk** without
      a hint. This supports correct interpretation of the revised schedule in the supplied case. It does
      not demonstrate actual travel, attendance, reduced missed meetings, a completed future update or
      the wider ethics of the institution. Unknown copies and wider access needs remain outside the test.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Trace an ordinary task to a person who can use it, then check whether the claimed benefit actually
      follows. Allow twenty minutes to draw the connection, a short recipient check and one bounded improvement.
      Use the fictional meeting schedule. Meaning does not require a grand calling, public recognition
      or unpaid extra work, and naming one benefit does not settle the larger ethics of an institution.


      ### Follow the effect beyond your output


      An activity is something you do; an output is what it produces; a benefit is a useful difference
      for someone. Updating a schedule produces a new entry. That entry may help a reader plan when to
      arrive, provided it is accessible, current and distinguishable from older versions. The same output
      may fail to produce the hoped-for benefit if an obsolete notice remains beside it. Trace the mechanism
      rather than assuming the output carries its own value.


      Start with the next actual user. What decision or action does the information support? What confusion,
      effort or risk might be reduced? Then consider preserved knowledge and institutional function: a
      dated schedule can retain a decision and make coordination more dependable. These wider effects
      depend on people finding and using it. A mission statement cannot replace a check of the immediate
      link.


      Distinguish direct evidence from distant hopes. A reader correctly identifying a revised time supports
      an information-use claim. It does not show they attended, avoided a wasted trip or felt included.
      Those are different outcomes with different evidence. Work can have value without pretending every
      downstream step has already happened. A narrow honest contribution story is more useful than an
      impressive but untested chain.


      Ask a question that permits disappointment. “What does this let you do, and where does it still
      fail?” is more informative than “Wasn''t this helpful?” Gratitude can be socially pressured, especially
      when a worker, client or subordinate feels dependent. Use a willing recipient or an authorized non-sensitive
      record, and do not collect private information to make the exercise feel real. A supplied fictional
      response supports reasoning practice, not actual beneficiary evidence.


      Include burden and exclusion. A schedule in an image may be convenient for its creator and inaccessible
      to a reader. An unowned update process may shift work onto a receptionist. A clearer schedule can
      still serve an activity whose wider effects are ethically troubling. Record those questions separately;
      one successful revision is neither moral absolution nor proof that the task should continue unchanged.


      Choose an improvement tied to the verified gap. If the reader cannot tell which version is current,
      decorative redesign may miss the problem. If the owner is unknown, adding a name without acceptance
      creates a false handoff. Verify the specific change using a task, such as identifying the current
      meeting time and update contact. Keep the output small enough that you can explain both the useful
      effect and the limit of your control.


      Service through work can include domestic, volunteer, study and paid roles. Not all contribution
      is monetary or visible to a final customer. Maintaining accurate records or helping a successor
      can matter. Equally, a person need not find fulfillment in every assignment or accept exploitation
      to make the assignment meaningful. Worth does not depend on proving a sufficient amount of benefit
      every day.


      ### Worked example


      A worker updates a meeting time and describes the result as “preventing missed meetings.” The reader
      instead reports two conflicting notices and no clear authority. The claim outruns the evidence.
      Adding version status and an accepted update owner can support a more modest result: the reader
      now identifies the current time. Whether any missed meeting was prevented remains unknown.


      ### Complete fictional schedule case


      The task is to maintain a public paper schedule for a **Neighborhood Map Session**. The older card
      S1 says **28 October 2026, 18:00–18:30 UTC, Cedar Center, Pine Room**. A coordinator''s approved
      change card S2, dated **22 October at 10:00 UTC**, changes the session to **18:30–19:00 UTC** on
      the same date and in the same room. Purpose remains comparing public maps; bring a paper map if
      available; questions go to **Schedule Desk**. No real event or contact exists.


      The initial task output is a correct copy of S2''s time placed beside S1. Neither displayed copy
      states which is current, and no update owner is shown. The permitted author may revise the schedule
      copies after coordinator approval, but may not change the session or contact participants. Ari is
      the fictional reader, trying to choose a departure time; travel duration and actual departure are
      not supplied.


      The coordinator can approve a readable current notice and mark S1 superseded. Fin is a proposed
      update owner whose acceptance is not initially known. A useful tested output must let Ari identify
      the current date, start time and update contact. There are exactly two known paper copies in this
      exercise. Other possible copies and actual attendance are outside the supplied evidence.


      ### Check the contribution story


      1. Trace your activity, output, next user, decision supported and hoped-for institutional effect.
      Add one possible exclusion or burden. Output: a contribution chain with direct and distant claims
      separated.

      2. Write a neutral question for Ari that allows the schedule to be unhelpful. Save your initial
      benefit claim before the [later packet](?resource=file-later-packet-md). Output: a prediction and
      a question without a demand for gratitude.

      3. Use Ari''s response to identify the actual gap. Propose the smallest authorized change that addresses
      it, including ownership. Output: a revision linked to the failed use, not a generic improvement.

      4. Check the revised notice against the three user questions. Output: the specific supported benefit,
      missing evidence and any remaining burden.

      5. State what the work serves without claiming total ethical approval of the role or institution.
      Output: a brief honest account of mechanism, beneficiary and limits.


      ### Support and transfer


      Use spoken text, accessible print or a fictional reader if actual feedback is difficult or unsafe.
      A harder branch leaves the coordinator unavailable: retain the conflicting-status problem and seek
      clarification rather than appoint yourself the source of truth. For real transfer, use an authorized
      task and voluntary feedback, keep personal records private and preserve unresolved harms alongside
      useful effects.


      ### Source use


      [CDC''s program-description guidance, S05](https://www.cdc.gov/evaluation/php/evaluation-framework-action-guide/step-2-describe-the-program.html),
      distinguishes activities, outputs, intended outcomes and context. Only that section was used; a
      simple contribution chain is an original adaptation, not an evaluation proving causality or a public-health
      intervention.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A schedule was updated. Can its author say it prevented missed meetings?

      2. A recipient praises the lettering but cannot choose between two times. What should shape the
      next change?

      3. One useful change serves a recipient in a troubling institution. Does that settle the work''s
      wider ethics?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Only if that further outcome has evidence. The update is an output; a reader identifying
      the correct time is a narrower benefit, while actual attendance or prevention remains separate.

      2. The unresolved task problem: authoritative current status and ownership. Preserve the compliment
      as an opinion and test whether the revision supports the actual decision.

      3. No. Describe the benefit and its mechanism while retaining burdens, exclusions and unresolved
      harms. Neither gratitude nor a useful output requires moral approval of the entire role or institution.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
