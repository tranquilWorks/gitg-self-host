meaning_and_fit:
  purpose: Trace how a small work output serves people, reduces a problem, preserves knowledge or improves
    an institution, then verify one part of that contribution.
  why_recommended: Trace how a small work output serves people, reduces a problem, preserves knowledge
    or improves an institution, then verify one part of that contribution.
  claims:
  - statement: Trace how a small work output serves people, reduces a problem, preserves knowledge or
      improves an institution, then verify one part of that contribution.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Meaningful contribution and service through work practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Meaningful contribution and service through work as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use volunteer, domestic, study or fictional work when employment content is
    sensitive. Not every contribution must be public-facing or measurable in money. No one must perform
    extra unpaid work or accept exploitation to make a role feel meaningful.
  opportunity_considerations: Default to maintaining an accurate meeting schedule. Draw a short chain
    from your action to the next user, the problem reduced and the wider system served. Include a possible
    burden or harm, such as excluding someone with an inaccessible format. Use neutral role labels and
    public or fictional information.
  prerequisites:
  - Default to maintaining an accurate meeting schedule. Draw a short chain from your action to the next
    user, the problem reduced and the wider system served. Include a possible burden or harm, such as
    excluding someone with an inaccessible format. Use neutral role labels and public or fictional information.
  dependencies: []
  safe_alternatives:
  - Use volunteer, domestic, study or fictional work when employment content is sensitive. Not every contribution
    must be public-facing or measurable in money. No one must perform extra unpaid work or accept exploitation
    to make a role feel meaningful.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Meaningful contribution and service through work differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Meaningful contribution and
    service through work as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to maintaining an accurate meeting schedule. Draw a short chain from your action to
    the next user, the problem reduced and the wider system served. Include a possible burden or harm,
    such as excluding someone with an inaccessible format. Use neutral role labels and public or fictional
    information. Goal: Trace how a small work output serves people, reduces a problem, preserves knowledge
    or improves an institution, then verify one part of that contribution. Scope: Use authorized low-stakes
    work. This is not a requirement to find a grand calling in every job or a justification for harmful
    work because some benefit can be named. Time and effort: Twenty minutes to trace the contribution,
    one short recipient check and one bounded improvement. Adaptation: Use volunteer, domestic, study
    or fictional work when employment content is sensitive. Not every contribution must be public-facing
    or measurable in money. No one must perform extra unpaid work or accept exploitation to make a role
    feel meaningful. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use volunteer, domestic, study or fictional work when employment content is sensitive.
    Not every contribution must be public-facing or measurable in money. No one must perform extra unpaid
    work or accept exploitation to make a role feel meaningful.
  expected_burden: Twenty minutes to trace the contribution, one short recipient check and one bounded
    improvement.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Meaningful contribution and service through work protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Meaningful contribution and service through work action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use volunteer,
    domestic, study or fictional work when employment content is sensitive. Not every contribution must
    be public-facing or measurable in money. No one must perform extra unpaid work or accept exploitation
    to make a role feel meaningful.
  actions:
  - stable_id: PRACTICE-COMP-2112-MEANINGFUL-CONTRIBUTION-AND-SERVICE-THROUGH-WORK-01-A1
    sequence: 1
    title: Trace the benefit without stopping at your own output
    instructions: 'Describe what you actually do and who uses the result next. Ask what problem becomes
      smaller when the schedule is accurate, what knowledge is preserved and what institutional function
      becomes more reliable. Distinguish a direct observed benefit from a hoped-for distant impact. Identify
      who could be burdened or excluded, and do not use an abstract mission statement to hide a harmful
      consequence of the task.


      Observation checks: The chain reaches a real downstream user or explicit fictional role; Problem
      reduction knowledge and institutional benefit are considered; Direct benefit and hoped-for impact
      are separated; Possible burden or harm is included. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2112-MEANINGFUL-CONTRIBUTION-AND-SERVICE-THROUGH-WORK-01
      action_stable_id: PRACTICE-COMP-2112-MEANINGFUL-CONTRIBUTION-AND-SERVICE-THROUGH-WORK-01-A1
      competency_stable_id: '21.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2112_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2112_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_chain_reaches_a_real_downstream_user_or_explicit_fictional_role
        - problem_reduction_knowledge_and_institutional_benefit_are_considered
        - direct_benefit_and_hoped_for_impact_are_separated
        - possible_burden_or_harm_is_included
      - measurement_id: c2112_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2112_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2112-MEANINGFUL-CONTRIBUTION-AND-SERVICE-THROUGH-WORK-01-A2
    sequence: 2
    title: Check the claimed benefit with an affected person or record
    instructions: 'Ask a willing recipient a narrow question such as What does this schedule let you do,
      and where does it still fail you. Alternatively inspect an authorized non-sensitive record of a
      missed or successful handoff. Do not coach the recipient toward gratitude or disclose private client
      information. Compare the response with your original contribution story and retain any evidence
      that the output is less useful than you assumed.


      Observation checks: A recipient or relevant record checks the benefit claim; The question invites
      correction rather than praise; Private information and coerced gratitude are avoided; Disconfirming
      evidence is retained. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2112-MEANINGFUL-CONTRIBUTION-AND-SERVICE-THROUGH-WORK-01
      action_stable_id: PRACTICE-COMP-2112-MEANINGFUL-CONTRIBUTION-AND-SERVICE-THROUGH-WORK-01-A2
      competency_stable_id: '21.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2112_a2_primary
      transfer_disposition: context_bound
      measurements:
