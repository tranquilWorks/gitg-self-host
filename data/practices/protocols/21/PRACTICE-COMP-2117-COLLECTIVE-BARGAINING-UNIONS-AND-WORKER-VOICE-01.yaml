meaning_and_fit:
  purpose: Evaluate mechanisms for improving pay, safety and dignity through their authority, participation
    rules, benefits, costs, legal context and accountability.
  why_recommended: Evaluate mechanisms for improving pay, safety and dignity through their authority,
    participation rules, benefits, costs, legal context and accountability.
  claims:
  - statement: Evaluate mechanisms for improving pay, safety and dignity through their authority, participation
      rules, benefits, costs, legal context and accountability.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Collective bargaining, unions, and worker voice practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Collective bargaining, unions, and worker voice as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible official summaries, a qualified labor adviser or a union’s
    own governance documents while distinguishing each source’s role. Workers may legitimately choose
    different forms of voice. Actual action requires current local advice and attention to safety and
    authority.
  opportunity_considerations: Use a fictional team concerned about unpredictable schedules. Compare an
    individual request, a joint worker request, a representative committee and collective bargaining through
    a union where legally applicable. Prepare fields for who speaks, who chooses them, scope, consent,
    legal coverage, cost, accountability and possible retaliation risk.
  prerequisites:
  - Use a fictional team concerned about unpredictable schedules. Compare an individual request, a joint
    worker request, a representative committee and collective bargaining through a union where legally
    applicable. Prepare fields for who speaks, who chooses them, scope, consent, legal coverage, cost,
    accountability and possible retaliation risk.
  dependencies: []
  safe_alternatives:
  - Use accessible official summaries, a qualified labor adviser or a union’s own governance documents
    while distinguishing each source’s role. Workers may legitimately choose different forms of voice.
    Actual action requires current local advice and attention to safety and authority.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Collective bargaining, unions, and worker voice differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Collective bargaining, unions,
    and worker voice as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional team concerned about unpredictable schedules. Compare an individual request,
    a joint worker request, a representative committee and collective bargaining through a union where
    legally applicable. Prepare fields for who speaks, who chooses them, scope, consent, legal coverage,
    cost, accountability and possible retaliation risk. Goal: Evaluate mechanisms for improving pay, safety
    and dignity through their authority, participation rules, benefits, costs, legal context and accountability.
    Scope: This is education using a fictional workplace. It is not organizing advice for a specific campaign,
    a legal coverage determination or a requirement to join, oppose or disclose support for a union. Time
    and effort: Two 25-minute comparisons and a 15-minute source-and-question review. Adaptation: Use
    accessible official summaries, a qualified labor adviser or a union’s own governance documents while
    distinguishing each source’s role. Workers may legitimately choose different forms of voice. Actual
    action requires current local advice and attention to safety and authority. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible official summaries, a qualified labor adviser or a union’s own governance
    documents while distinguishing each source’s role. Workers may legitimately choose different forms
    of voice. Actual action requires current local advice and attention to safety and authority.
  expected_burden: Two 25-minute comparisons and a 15-minute source-and-question review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Collective bargaining, unions, and worker voice protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Collective bargaining, unions, and worker voice action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    official summaries, a qualified labor adviser or a union’s own governance documents while distinguishing
    each source’s role. Workers may legitimately choose different forms of voice. Actual action requires
    current local advice and attention to safety and authority.
  actions:
  - stable_id: PRACTICE-COMP-2117-COLLECTIVE-BARGAINING-UNIONS-AND-WORKER-VOICE-01-A1
    sequence: 1
    title: Distinguish the mechanisms and whom they represent
    instructions: 'For each route, identify whether it conveys one person’s preference, a shared concern
      or a formal bargaining role. Ask how representatives are chosen, how dissent is heard and what authority
      they actually have. Identify potential benefits such as shared information or bargaining capacity
      and costs such as time, dues where relevant or governance burden. Do not assume a union, committee
      or manager automatically represents every worker’s view.


      Observation checks: Four voice mechanisms are distinguished; Representation selection and authority
      are explicit; Benefits and participation or governance costs are considered; Dissent and nonparticipation
      remain legitimate. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2117-COLLECTIVE-BARGAINING-UNIONS-AND-WORKER-VOICE-01
      action_stable_id: PRACTICE-COMP-2117-COLLECTIVE-BARGAINING-UNIONS-AND-WORKER-VOICE-01-A1
      competency_stable_id: '21.17'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2117_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2117_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - four_voice_mechanisms_are_distinguished
        - representation_selection_and_authority_are_explicit
        - benefits_and_participation_or_governance_costs_are_considered
        - dissent_and_nonparticipation_remain_legitimate
      - measurement_id: c2117_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
