  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving a first attempt. These events are invented learning materials,
      not actual participant evidence.


      The employer is clarified as a **municipal department**, not a private business. The NLRB Employee
      Rights page lists federal, state and local government employees among NLRA exclusions. The analyst
      therefore withdraws the assumed NLRA route and records that jurisdiction-matched public-sector rules
      and any agreement must be checked. No conclusion that the workers have no rights follows.


      The three fictional workers still agreed only to the inquiry text. The remaining five have expressed
      no supplied view; they are not counted as opposed or represented. Joint preparation would total
      **45 person-minutes** if all three perform the planned fifteen minutes. The two proposed committee
      members'' meeting would total **40 person-minutes**, excluding unknown preparation; neither meeting
      nor selection has occurred. No actual dues are incurred.


      The conditional next step becomes an information check about lawful public-sector voice and representation
      before selecting a mechanism. No coworker is contacted, no committee is formed, no bargaining begins
      and no schedule changes. The analysis improves by correcting authority and representation assumptions,
      not by guaranteeing an outcome.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare four ways workers can raise a scheduling concern, including representation, costs,
      accountability and legal context. Allow two twenty-five-minute comparisons and fifteen minutes for
      source questions. Use the fictional team only. You do not need to join or oppose a union, disclose
      views, contact coworkers or organize an action. A balanced analysis can recognize potential benefits
      while retaining coverage and practical risks.


      ### Identify who speaks and with what authority


      An individual request can explain one person''s circumstances clearly and quickly. It may address
      an immediate need while leaving shared problems untouched. A joint request can combine information
      and show that several people raise the same concern, but signing one text does not necessarily authorize
      ongoing representation or acceptance of every later proposal. State the scope of agreement instead
      of treating shared concern as unlimited consent.


      A representative committee can make communication more manageable, but its legitimacy depends on
      selection, mandate, accountability and the applicable legal structure. Who chose the representatives?
      How can affected workers correct them? Can dissenting or absent workers be heard? A title does not
      create bargaining authority. Employer-established committees can raise specific legal questions;
      the paper exercise does not authorize creating one or bypassing governing rules.


      Collective bargaining through a union, where legally applicable, involves a recognized representative
      role and a process for negotiating terms. Actual authority, coverage, membership rules, duties,
      enforcement and costs depend on law and governance documents. Do not assume that a union''s officers,
      an employer or a committee automatically express every worker''s preference. Evaluate how decisions
      and disagreements are handled, including the route for challenging representation where applicable.


      The subject of voice changes what a useful agreement would address. Pay discussions need clear compensation
      terms and the relevant authority; safety concerns require competent hazard controls and cannot be
      resolved simply by popularity. Dignity concerns may require respectful treatment, a fair way to
      raise problems and an accountable response. Schedule predictability can affect income planning,
      care and participation, but a proposed notice period must still be checked against operational constraints
      and applicable rules. A channel is useful when it can address the actual concern, not merely provide
      a meeting.


      Compare benefits and burdens concretely. Shared information, negotiating capacity and continuity
      can be valuable. Meetings, preparation, dues where relevant, conflict, administrative effort and
      accountability all take resources. A low meeting-time estimate may omit the work of collecting concerns
      or checking a proposal. A numeric comparison cannot settle dignity, legal authority or practical
      safety by itself. Keep missing costs and benefits explicit.


      Legal coverage is a prior question, not a detail to attach after choosing a strategy. The U.S. NLRB
      describes rights for covered workers, including some group activity with or without a union, and
      identifies excluded categories. Public employees, supervisors, independent contractors and other
      categories cannot simply inherit a private-sector rule from a familiar summary. Job titles alone
      may not settle status. Exclusion from one law does not establish absence of all rights; another
      legal system may apply.


      Conduct and context also matter. A general statement about protected activity does not promise that
      every method, statement or refusal is protected. Participation and refraining, representation and
      dissent, legal protection and practical retaliation risk are separate questions. Seek current jurisdiction-matched
      qualified guidance for actual action. This exercise provides no organizing plan or immunity from
      consequences.


      Make a conditional preference and name what could reverse it. If three people share a narrow concern,
      a limited joint inquiry might appear proportionate, but a sector change or missing mandate can change
      the analysis. Do not let a preferred political view replace the specific question: whose concern
      is being conveyed, to whom, with whose authorization and through which accountable route?


      ### Worked example


      A team assumes the NLRB''s private-sector guidance governs its workplace and compares representative
      options on that basis. Later the employer turns out to be a municipal department. The analyst withdraws
      the automatic NLRA-coverage assumption and seeks the relevant public-sector rules. That correction
      does not imply workers have no voice, nor does it justify continuing with an unverified legal conclusion
      because the policy goal seems worthwhile.


      ### Complete fictional scheduling comparison


      Eight workers want to understand a scheduling process. The current schedule is posted two days before
      each workweek. A proposed discussion question asks whether a **seven-day notice target**, with an
      explicit exception process, is feasible. No rule in this exercise establishes that seven days is
      legally required or operationally possible. Initially the sector is **unconfirmed**; the analyst
      has tentatively assumed private employment. Locality, governing agreements and worker status remain
      unknown.


      | Route | Supplied representation and mandate | Possible value | Supplied or unknown burden |

      | --- | --- | --- | --- |

      | Individual | One worker speaks about their own schedule | Specific information and direct clarification
      | Five preparation minutes; result for others unknown |

      | Joint request | Three of eight have agreed to the exact inquiry text only | Shared issue becomes
      visible | Fifteen preparation minutes each; no broader mandate |

      | Committee model | Two proposed representatives; selection and authority unconfirmed | Ongoing
      channel and consolidated questions | Twenty meeting minutes each; preparation and governance unknown
      |

      | Union bargaining model | Hypothetical applicable representative with member accountability and
      formal mandate still to verify | Negotiation and continuing representation where authorized | Illustrative
      six units per member per month if such dues applied; actual costs, law and rules unknown |


      The dues figure is an invented comparison input, not a real union rate. The three agreements are
      supplied fictional facts, not views collected from actual people. Nothing is known about the other
      five workers'' preferences. The committee and union entries are models to evaluate, not existing
      bodies you may create or claim to represent. All options require their own consent, authority and
      practical-risk checks.


      ### Compare and revise the route


      1. Identify who each route speaks for, how selection and correction would work, and which mandate
      is missing. Output: a representation map that preserves nonparticipation and dissent.

      2. Compare the actual scheduling question, possible benefits, known burden and missing costs. Output:
      a balanced comparison rather than a general endorsement or rejection of unions.

      3. Inspect the coverage and conduct limits in the linked official sources. Save a conditional preference
      before the [later packet](?resource=file-later-packet-md). Output: a jurisdiction/sector question
      and a fact that could change your choice.

      4. Revise for the sector update. State what remains unresolved about enforcement, confidentiality
      and practical risk. Output: a next information question, without contacting workers or launching
      an action.


      ### Support and transfer


      Use accessible official summaries and distinguish an agency''s remit from a union''s own governance
      rules. A harder branch has representatives claiming all eight workers'' consent based on three signatures:
      limit the mandate to what was actually agreed. Actual collective activity requires current local
      context and appropriate advice; do not solicit private union views as part of this learning case.


      ### Source use


      [NLRB Employee Rights, S11](https://www.nlrb.gov/about-nlrb/rights-we-protect/your-rights/employee-rights),
      and [Concerted Activity, S12](https://www.nlrb.gov/about-nlrb/rights-we-protect/the-law/employees/concerted-activity),
      supply a U.S. coverage example and conduct limits. Their selected public explanations are not a
      ruling on the fictional team or a survey of public-sector law. Check current official procedures
      and deadlines before an actual filing; a site notice does not itself extend a deadline.


      ### Use the result at its proper scale


      Paid employment, a role change or public disclosure is not compulsory. Fiction and no attempt are
      legitimate. Keep private or protected records private. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Three of eight workers agree to one inquiry. Do the other five oppose it, and may the three accept
      any later settlement for everyone?

      2. The employer turns out to be a municipal department. Does exclusion from the cited NLRA coverage
      mean there are no worker-voice rights?

      3. One option uses fewer known person-minutes. Does that make it the best or legally protected route?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Neither follows. Silence supplies no view, and agreement to an inquiry is a limited mandate.
      Selection, representation and settlement authority require their own evidence and rules.

      2. No. It means the assumed federal private-sector route cannot be applied automatically. Check
      the appropriate public-sector jurisdiction, agreements and advice route; other rights may apply.

      3. No. Include missing preparation, governance, authority, representation, benefit and practical
      risk. Planned time is not performed work, and a resource comparison is not a legal determination.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
