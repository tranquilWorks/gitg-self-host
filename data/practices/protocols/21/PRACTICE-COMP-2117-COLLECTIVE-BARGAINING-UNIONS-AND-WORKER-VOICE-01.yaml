  - stable_id: PRACTICE-COMP-2117-COLLECTIVE-BARGAINING-UNIONS-AND-WORKER-VOICE-01-A2
    sequence: 2
    title: Verify the legal context without universalizing a familiar rule
    instructions: 'Inspect current official labor-relations guidance for the relevant jurisdiction and
      sector. Identify coverage limits, protected and unprotected conduct, the right to participate or
      refrain where applicable and the appropriate advice route. In the U.S. example, NLRB guidance distinguishes
      covered private-sector workers from excluded categories; do not apply it automatically to public
      employees, supervisors or contractors. Record unresolved classification or legal questions for qualified
      guidance rather than deciding them from a job title.


      Observation checks: The source matches jurisdiction and sector; Coverage exclusions and conduct
      limits are checked; Participation and refusal are considered without coercion; Unresolved status
      questions remain with qualified guidance. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2117-COLLECTIVE-BARGAINING-UNIONS-AND-WORKER-VOICE-01
      action_stable_id: PRACTICE-COMP-2117-COLLECTIVE-BARGAINING-UNIONS-AND-WORKER-VOICE-01-A2
      competency_stable_id: '21.17'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
