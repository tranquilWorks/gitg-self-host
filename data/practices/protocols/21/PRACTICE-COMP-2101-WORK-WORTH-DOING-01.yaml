meaning_and_fit:
  purpose: Evaluate a realistic work option through aptitude, livelihood, service, meaning, environment,
    growth, dignity and actual need, then test one important uncertainty.
  why_recommended: Evaluate a realistic work option through aptitude, livelihood, service, meaning, environment,
    growth, dignity and actual need, then test one important uncertainty.
  claims:
  - statement: Evaluate a realistic work option through aptitude, livelihood, service, meaning, environment,
      growth, dignity and actual need, then test one important uncertainty.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Work worth doing practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Work worth doing as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use fictional roles, public role descriptions or a smaller task redesign when
    access or income constraints limit exploration. Keep employer-confidential information and personal
    financial details out of application evidence. Qualified employment, financial or professional advice
    may be needed for real commitments.
  opportunity_considerations: 'Use the fictional choice between a prestigious role with unclear daily
    duties and a less visible role with clear useful work, or two real options you may safely investigate.
    Prepare eight headings: aptitude, livelihood, service, meaning, environment, growth, dignity and real
    need. Include staying and redesigning the current role as an option.'
  prerequisites:
  - 'Use the fictional choice between a prestigious role with unclear daily duties and a less visible
    role with clear useful work, or two real options you may safely investigate. Prepare eight headings:
    aptitude, livelihood, service, meaning, environment, growth, dignity and real need. Include staying
    and redesigning the current role as an option.'
  dependencies: []
  safe_alternatives:
  - Use fictional roles, public role descriptions or a smaller task redesign when access or income constraints
    limit exploration. Keep employer-confidential information and personal financial details out of application
    evidence. Qualified employment, financial or professional advice may be needed for real commitments.
  role_conditions:
  - This competency is context sensitive; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Work worth doing differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Work worth doing as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional choice between a prestigious role with unclear daily duties and a less visible
    role with clear useful work, or two real options you may safely investigate. Prepare eight headings:
    aptitude, livelihood, service, meaning, environment, growth, dignity and real need. Include staying
    and redesigning the current role as an option. Goal: Evaluate a realistic work option through aptitude,
    livelihood, service, meaning, environment, growth, dignity and actual need, then test one important
    uncertainty. Scope: This is a bounded role-evaluation exercise, not a prediction of career success
    or an instruction to resign, accept a contract or risk essential income. Time and effort: Two 25-minute
    comparisons and one small information-gathering step. Adaptation: Use fictional roles, public role
    descriptions or a smaller task redesign when access or income constraints limit exploration. Keep
    employer-confidential information and personal financial details out of application evidence. Qualified
    employment, financial or professional advice may be needed for real commitments. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fictional roles, public role descriptions or a smaller task redesign when access
    or income constraints limit exploration. Keep employer-confidential information and personal financial
    details out of application evidence. Qualified employment, financial or professional advice may be
    needed for real commitments.
  expected_burden: Two 25-minute comparisons and one small information-gathering step.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Work worth doing protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Work worth doing action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fictional
    roles, public role descriptions or a smaller task redesign when access or income constraints limit
    exploration. Keep employer-confidential information and personal financial details out of application
    evidence. Qualified employment, financial or professional advice may be needed for real commitments.
  actions:
  - stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01-A1
    sequence: 1
    title: Translate each criterion into observable work conditions
    instructions: 'For each option, describe the actual tasks, necessary income or stability, people served,
      reasons the work matters, daily environment, learning opportunities and conditions affecting dignity.
      Separate what you know from a title’s implied status. Give each of the eight headings evidence,
      a plausible hypothesis or an explicit unknown; do not fill missing compensation or working conditions
      with optimism. Name one constraint you cannot currently trade away without unacceptable cost.


      Observation checks: All eight criteria have evidence or explicit uncertainty; Daily work is separated
      from title and status; Staying or redesigning is included as a genuine option; A non-negotiable
      livelihood or dignity constraint is stated. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01
      action_stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01-A1
      competency_stable_id: '21.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2101_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2101_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_eight_criteria_have_evidence_or_explicit_uncertainty
        - daily_work_is_separated_from_title_and_status
        - staying_or_redesigning_is_included_as_a_genuine_option
        - a_non_negotiable_livelihood_or_dignity_constraint_is_stated
      - measurement_id: c2101_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2101_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01-A2
    sequence: 2
    title: Compare tradeoffs rather than manufacture a perfect winner
    instructions: 'Identify two benefits and two costs of each option, including what would be forgone.
      Ask which option fits current capacity and what kind of service or need it actually addresses. Mark
      any serious ethical, safety or employment concern for appropriate guidance. Choose the uncertainty
      most likely to reverse your preference, such as whether the role includes the advertised craft work
      or mostly coordination. A high overall score must not cancel an unacceptable condition.


      Observation checks: Benefits costs and opportunity costs are explicit; Current capacity and real
      downstream need affect the comparison; Serious concerns are not averaged away; One decision-reversing
      uncertainty is selected. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01
      action_stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01-A2
      competency_stable_id: '21.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2101_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2101_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - benefits_costs_and_opportunity_costs_are_explicit
        - current_capacity_and_real_downstream_need_affect_the_comparison
        - serious_concerns_are_not_averaged_away
        - one_decision_reversing_uncertainty_is_selected
      - measurement_id: c2101_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2101_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01-A3
    sequence: 3
    title: Run a small reversible information test
    instructions: 'Use a safe step such as a role-holder conversation, a public work sample or a short
      authorized task shadow to investigate the selected uncertainty. Prepare three questions about actual
      daily work, constraints and who benefits. Record what changed your view and what remains unverified,
      then decide whether to investigate further, redesign, defer or choose. Do not represent an exploratory
      conversation as a job offer or make an irreversible career move merely to finish the practice.


      Observation checks: A bounded information-gathering step is completed or clearly rehearsed; Questions
      address actual work rather than prestige alone; New evidence updates the comparison; The next decision
      remains proportionate and reversible where possible. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which criterion changed the appeal of the title, and what evidence would make the
      work itself worth choosing or redesigning?


      Examples: Supportive: The participant found that the less visible role offered more relevant craft
      and service, while preserving a necessary income constraint.


      Mixed: The preferred role remained attractive, but its daily work was still unclear, so the participant
      chose another information step rather than a premature commitment.


      Contradictory: Prestige or a numeric total was used to dismiss an unacceptable safety, dignity or
      livelihood condition.


      Inconclusive: Career values were listed without comparing actual work conditions or testing an important
      uncertainty.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01
      action_stable_id: PRACTICE-COMP-2101-WORK-WORTH-DOING-01-A3
      competency_stable_id: '21.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
