  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Identifying conspiracy theories](https://commission.europa.eu/strategy-and-policy/coronavirus-response/fighting-disinformation/identifying-conspiracy-theories_en)

      - [What mediation is and how it can help — Mediation at work](https://www.acas.org.uk/mediation)

      - [Letter from Birmingham Jail](https://kinginstitute.stanford.edu/letter-birmingham-jail)

      - [Community Engagement and Accountability](https://www.ifrc.org/our-work/inclusion-protection-and-engagement/community-engagement-and-accountability)

      - [The ILO Social Protection Floors Recommendation, 2012 (No. 202)](https://www.ilo.org/resource/news/ilo-social-protection-floors-recommendation-2012-no-202)

      - [What Is Transitional Justice?](https://www.ictj.org/what-transitional-justice)

      - [Decent work and the 2030 Agenda for sustainable development](https://www.ilo.org/topics-and-sectors/decent-work-and-2030-agenda-sustainable-development)

      - [What is Career Readiness? — Professionalism](https://www.naceweb.org/career-readiness/competencies/career-readiness-defined)

      - [Learning Principles](https://www.cmu.edu/teaching/principles/learning.html)

      - [Quality Glossary](https://asq.org/quality-resources/quality-glossary)

      - [Learning about users and their needs](https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs)

      - [6.3 Interface Management](https://www.nasa.gov/reference/6-3-interface-management/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence or a job offer.


      A willing fictional role-holder says A''s recent typical week involved roughly 30 planned hours,
      mostly coordination, plus 6 unplanned hours. They cannot confirm a protected 30-hour cap, committed
      mentoring or the ultimate user''s evaluation of the work. This is an account of recent experience,
      not authoritative contract interpretation or a prediction of Rin''s exact week.


      Rin records 36 reported hours against a 30-hour limit and seeks written clarification before treating
      A as feasible. B remains worth investigating, but its stability and working culture are still unknown.
      The manager agrees to discuss C''s redesign proposal; that is not approval, allocated mentoring
      or a started trial. The proposed 16+12+2 distribution still totals 30 only on paper.


      No offer is accepted, contract signed, job left or pay changed. The useful result is a comparison
      that now gives actual tasks, capacity and needed clarification more weight than the title. Further
      inquiry or deferral remains a legitimate next decision.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare work options through eight explicit criteria, then test one uncertainty that could
      change the choice. Use two twenty-five-minute comparisons and one small information step or its
      complete fictional equivalent. Keep staying and redesigning work in the comparison. This is not
      an instruction to resign, accept an offer or expose essential income to risk.


      ### Evaluate the work behind the title


      A role title is a claim about a category, not evidence of its daily tasks or fit. Aptitude asks
      which tasks you can do or realistically learn with support. Livelihood includes necessary income,
      stability, costs and obligations. Service asks who benefits and whether your contribution is useful
      to them. Meaning concerns why this work matters to you, which need not be identical to prestige
      or personal enjoyment.


      Environment includes hours, access, management, resources, location and interpersonal conditions.
      Growth asks what feedback, practice and increasing responsibility are actually available. Dignity
      concerns how people are treated and whether they can raise concerns, retain appropriate boundaries
      and do work without unacceptable harm. Real need asks whether the output solves a problem someone
      actually has; an impressive mission statement does not establish that need.


      Give each criterion evidence, a hypothesis or an explicit unknown. A role-holder''s account of a
      typical week may be informative without defining contractual terms or predicting every future week.
      A compensation headline may omit costs or stability. A promised mentor is different from accepted
      time with that person. Do not fill an empty cell with the most attractive interpretation of a title.


      Some constraints cannot sensibly be averaged away. If a role cannot meet a necessary livelihood
      or access condition, a high overall score does not remove that conflict. Distinguish a hard requirement
      from a preference you can trade, and state how uncertain evidence affects the result. A numeric
      matrix may help organize thinking but should not pretend that unmeasured dignity, meaning and future
      opportunity have precise exchange rates.


      Compare opportunity costs as well as benefits. A visible role may offer influence while reducing
      time spent on the craft you want to develop. A quieter role may provide relevant practice while
      narrowing another opportunity. Staying can preserve stability and still carry a cost; redesign may
      be feasible only with a manager''s agreement and resources. None is automatically the courageous
      or complacent option.


      Test the uncertainty most likely to reverse the decision. Ask about actual daily work, unavoidable
      constraints and whose problem the output solves. A public sample, willing role-holder discussion
      or authorized short shadow can answer something without making a commitment. Keep exploratory information
      separate from an offer, a contract, a guaranteed career path or approval of a redesign. Serious
      employment, ethical or safety concerns need the proper qualified route.


      ### Worked example


      An appealing title suggests substantial design work, but a role-holder describes mostly coordination
      and regular unplanned hours. The learner revises the role''s fit rather than calling the role worthless.
      They preserve a needed hours limit and investigate a less visible option plus an internal redesign.
      The decision remains provisional because an anecdotal week and written terms may differ.


      ### Complete fictional options


      Rin needs at least 500 units of weekly income and can commit at most 30 hours. These invented units
      and constraints are not personal financial advice. Rin enjoys writing usable technical instructions
      and has a completed harmless instruction sample; no qualification for safety-critical work is implied.


      Option A, “Strategy Fellow,” advertises 650 units and 30 hours. It promises influence and growth,
      but daily task mix, actual hours, mentoring, beneficiary need and complaint routes are unknown.
      Option B, “Documentation Specialist,” describes 520 units and 30 hours: 14 creating instructions,
      14 coordinating facts and 2 mentoring, all within the 30. An internal user has requested clearer
      routine documentation. Work location is accessible in the case; long-term stability and team treatment
      remain unverified.


      Option C is staying in Rin''s current role at 560 units and 30 hours, currently 20 coordination
      and 10 documentation. The stated redesign proposal would use 16 coordination, 12 documentation and
      2 mentoring hours, preserving 30 total and existing pay if accepted. The manager has not approved
      it and no mentor has accepted time. Existing working conditions are familiar; longer-term growth
      and the proposal''s feasibility remain open.


      ### Compare, investigate and revise


      1. Translate all eight criteria into observable conditions for A, B and C. Include both existing
      C and its unapproved redesign. Output: facts, hypotheses and unknowns with no title-based substitution.

      2. Keep the 500-unit floor and 30-hour limit visible. Compare at least two benefits and two costs
      per option, including opportunity costs and unverified conditions. Output: a provisional preference
      that cannot compensate for an unacceptable constraint with prestige.

      3. Select A''s actual hours/task mix as a decision-reversing question. Prepare three questions:
      what occupies a normal week, what causes extra hours, and who uses the work? Output: a bounded inquiry
      plan, not a request for confidential employer data.

      4. Save the comparison before the [later packet](?resource=file-later-packet-md). Use the supplied
      role-holder reply to update the relevant cells while distinguishing an account from binding terms.
      Output: changed judgment and unresolved discrepancy.

      5. Choose a proportionate next step: investigate B, seek written clarification, discuss C''s redesign,
      defer or decline. Output: a true decision/status record with no invented offer acceptance or resignation.


      ### Support and transfer


      Use spoken cards, a public role description or a smaller task redesign when access is limited. A
      harder case has a meaningful role that fails the income floor; seek a feasible adjustment or preserve
      the constraint rather than romanticizing sacrifice. Receiving income from work and seeking meaning
      are both legitimate considerations.


      For actual transfer, use public or permitted information and a willing contact. Keep employer-confidential
      facts and private finances outside app evidence. A task experiment is not a guarantee of employability,
      future pay or fulfillment. Paid employment is not required for this competency; suitable voluntary,
      study or household roles can also be evaluated with context-appropriate constraints.


      ### Source use


      [ILO''s decent-work overview, S07](https://www.ilo.org/topics-and-sectors/decent-work-and-2030-agenda-sustainable-development),
      includes productive work, income, security, development, voice and fair treatment. It supports considering
      conditions beyond status; it is not a role-ranking algorithm or career prediction. The eight-criterion
      comparison comes from canonical scope, and all options, numbers and later responses are original
      fiction.


      ### Use the result at its proper scale


      The practical limits in this guide are exercise safeguards, not added canonical metadata.


      Paid employment, a career change or a particular work role is not compulsory. Fiction and no attempt
      are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A prestigious option has a high overall score but may exceed a non-negotiable hours limit. Can
      its other benefits cancel that uncertainty?

      2. A role-holder describes 36 hours while an advertisement says 30. Which facts have you learned
      and which authority question remains?

      3. A manager agrees to discuss redesigning your current role. Does that establish approval, mentoring
      capacity or a completed career decision?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Keep the hard constraint explicit and resolve relevant uncertainty before treating the
      option as feasible. Compare staying and redesign as genuine alternatives; do not let a numeric total
      erase livelihood, dignity or safety needs.

      2. You have an account of recent actual workload that conflicts with the advertised hours. It warrants
      clarification of tasks and binding terms; it is neither a guaranteed future week nor proof of an
      enforceable cap.

      3. No. Discussion is an information step, not approval or resourcing. The proposed hours can add
      correctly while remaining unaccepted. No resignation or offer acceptance is necessary to complete
      this comparison.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
