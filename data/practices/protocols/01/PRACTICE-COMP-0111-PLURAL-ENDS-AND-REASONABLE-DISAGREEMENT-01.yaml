meaning_and_fit:
  purpose: Represent a competing vision of a good life fairly and identify cooperation without false agreement.
  why_recommended: Represent a competing vision of a good life fairly and identify cooperation without
    false agreement.
  claims:
  - statement: Represent a competing vision of a good life fairly and identify cooperation without false
      agreement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Philosophical value inquiry distinguishes goods valued for themselves from instrumental
      goods and considers plural values that may conflict or resist a single scale.
    classification: philosophical_or_normative_position
    source_ids:
    - SRC-OPENSTAX-VALUE-QUESTIONS
    limitations: Educational conceptual support only; does not prescribe the person's priority order or
      test the product's exercises or outcomes.
  applicability_question: Does a voluntary, bounded Plural ends and reasonable disagreement practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Plural ends and reasonable disagreement as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use written exchanges, translated material, or the stability/exploration case.
    No debate partner, travel, disclosure of beliefs, or forced reconciliation is required.
  opportunity_considerations: Use two reasonable preferences, such as quiet stability and ambitious exploration.
    Compare written positions or speak with a willing person; disagreement about anyone's equal dignity
    is outside the exercise. The learning guide contains a complete fictional practice and a separate
    changed-case check. Choose that route when a real situation is unavailable; its results are rehearsal,
    not performed real-world work.
  prerequisites:
  - Use two reasonable preferences, such as quiet stability and ambitious exploration. Compare written
    positions or speak with a willing person; disagreement about anyone's equal dignity is outside the
    exercise. The learning guide contains a complete fictional practice and a separate changed-case check.
    Choose that route when a real situation is unavailable; its results are rehearsal, not performed real-world
    work.
  dependencies: []
  safe_alternatives:
  - Use written exchanges, translated material, or the stability/exploration case. No debate partner,
    travel, disclosure of beliefs, or forced reconciliation is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Plural ends and reasonable disagreement differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Plural ends and reasonable
    disagreement as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use two reasonable preferences, such as quiet stability and ambitious exploration. Compare written
    positions or speak with a willing person; disagreement about anyone''s equal dignity is outside the
    exercise. The learning guide contains a complete fictional practice and a separate changed-case check.
    Choose that route when a real situation is unavailable; its results are rehearsal, not performed real-world
    work. Goal: Represent a competing vision of a good life fairly and identify cooperation without false
    agreement. Scope: The comparison practices fair representation and bounded cooperation. Some differences
    remain incompatible, and agreement in one arrangement does not erase deeper disagreement. Time and
    effort: About 25 minutes to compare positions, plus an optional welcomed exchange and a 10-minute
    plan. Adaptation: Use written exchanges, translated material, or the stability/exploration case. No
    debate partner, travel, disclosure of beliefs, or forced reconciliation is required. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    Introduction to Philosophy, 8.2 Basic Questions about Values: https://openstax.org/books/introduction-philosophy/pages/8-2-basic-questions-about-values'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written exchanges, translated material, or the stability/exploration case.
    No debate partner, travel, disclosure of beliefs, or forced reconciliation is required.
  expected_burden: About 25 minutes to compare positions, plus an optional welcomed exchange and a 10-minute
    plan.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Plural ends and reasonable disagreement protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Plural ends and reasonable disagreement action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written
    exchanges, translated material, or the stability/exploration case. No debate partner, travel, disclosure
    of beliefs, or forced reconciliation is required.
  actions:
  - stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01-A1
    sequence: 1
    title: Explain each position from the inside
    instructions: 'Give each position its strongest reason, the good it protects, and the cost it accepts.
      Avoid labels such as lazy or selfish. Example: stability may protect care commitments, while exploration
      may create discovery and opportunity. Write one question whose answer could improve your understanding.


      Observation checks: Both positions have serious reasons; Costs as well as goods are acknowledged;
      A non-accusatory question is formulated. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01
      action_stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01-A1
      competency_stable_id: '01.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0111_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0111_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - both_positions_have_serious_reasons
        - costs_as_well_as_goods_are_acknowledged
        - a_non_accusatory_question_is_formulated
      - measurement_id: c0111_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0111_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01-A2
    sequence: 2
    title: Check the account without demanding agreement
    instructions: 'Ask a willing person whether your account is recognizable, or compare it with a substantive
      statement of that position. Correct one omission or caricature. State the remaining disagreement
      plainly; do not replace it with a claim that everyone secretly wants the same life.


      Observation checks: The account is checked against another perspective; An omission is corrected
      or explicitly considered; Real disagreement remains visible. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01
      action_stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01-A2
      competency_stable_id: '01.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0111_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0111_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_account_is_checked_against_another_perspective
        - an_omission_is_corrected_or_explicitly_considered
        - real_disagreement_remains_visible
      - measurement_id: c0111_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0111_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01-A3
    sequence: 3
    title: Design a limited shared arrangement
    instructions: 'Choose one shared issue, such as planning a weekend or dividing a common resource.
      Propose an arrangement that protects one important good from each position, along with an opt-out
      or review point. Identify a conflict it does not solve and check that neither person must profess
      the other''s values.


      Observation checks: A specific shared arrangement is proposed; Both positions retain a protected
      good; An unresolved conflict and exit are named. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What can be shared while the disagreement remains, and which compromise would ask
      too much?


      Examples: Supportive: A shared plan allowed one quiet interval and one optional outing without requiring
      identical preferences.


      Mixed: Each position was understood but resource limits prevented a mutually acceptable plan.


      Contradictory: Cooperation depended on one person pretending agreement or abandoning a basic boundary.


      Inconclusive: The positions were summarized only as stereotypes without checking their reasons.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0111-PLURAL-ENDS-AND-REASONABLE-DISAGREEMENT-01
