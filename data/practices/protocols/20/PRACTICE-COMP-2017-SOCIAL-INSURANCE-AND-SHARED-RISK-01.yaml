  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence or a policy forecast.


      In the alternative stress scenario twenty of the same 100 members each need 80 units. Contributions
      remain 1,000 and needs total 1,600: a 600-unit shortfall before administration. The ordinary scenario''s
      200 was a pre-cost arithmetic remainder, not an established reserve that may be spent twice.


      Compare conditional options. An extra verified reserve of 300 would still leave 300 unpaid before
      costs; no such reserve is actually supplied. Increasing everyone''s contribution from 10 to 16 would
      produce 1,600 if all 100 could pay, but leaves no administrative allowance and does not establish
      affordability. Limiting support to 50 for each of 20 recipients would use 1,000 and leave 30 of
      each stated 80-unit need unmet, again before administration. Broader funding would require an identified
      source and would transfer some burden elsewhere.


      No observed processing time, fraud, take-up or administration figure for A or B arrives. The learner
      retains a conditional preference for testing a simpler accessible process with appropriate review,
      while acknowledging unknown cost and error effects. That preference is not a claim that either design
      has been implemented, financed or proven fair.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare two fictional risk-pooling designs and stress-test their arithmetic without hiding
      who is excluded or who pays. Use two twenty-five-minute passes and a ten-minute explanation. All
      amounts are invented units. This is policy literacy, not benefit eligibility, actuarial analysis,
      tax advice or a conclusion about any actual system''s solvency.


      ### What a pool can and cannot do


      Pooling spreads some burdens across people or periods rather than leaving every loss with one household.
      A society may finance protection through contributions, taxes, reserves or a mixture. Social insurance
      and tax-funded assistance can overlap in purpose while using different entitlement and funding rules.
      Do not assume every social-protection mechanism is insurance or that poverty is simply an unpredictable
      insured event.


      Distinguish the needs being addressed. Health costs may be uncertain and uneven. Unemployment can
      interrupt income. Disability may involve lasting access and support needs as well as earnings loss.
      Aging can change income and care needs over a long period. A disaster can affect many contributors
      simultaneously. Poverty can reflect persistent inadequate resources and structural exclusion. One
      small equal-contribution model cannot represent all these mechanisms or contexts.


      A large enough pool for an ordinary period may still be short when needs correlate. A local shock
      may reduce contributions while increasing claims, although this case holds contributions fixed to
      isolate one change. Administrative costs, delayed payments, unequal ability to contribute, people
      outside eligibility and long-term obligations also matter. An arithmetic remainder before costs
      is not verified profit, a funded reserve or proof of adequate protection.


      Evaluate six dimensions separately. Adequacy asks whether support meets the relevant need and arrives
      in time. Access asks whether entitled people can obtain it in practice. Dignity includes respectful
      treatment, privacy and challenge routes. Incentives concern possible effects on behavior and institutional
      effort, which need evidence rather than stereotypes. Cost includes administration and burdens shifted
      to applicants or helpers. Distribution asks who gains, pays, is wrongly excluded or is wrongly included.


      Verification can protect a fund, but paperwork is not free and does not automatically distinguish
      accurate from inaccurate claims. Simpler access can reduce a barrier without meaning that accountability
      disappears. Later review can create uncertainty or recovery burdens; a complex process can delay
      people who qualify. Ask what data would estimate these tradeoffs, whose perspective is missing and
      how errors could be corrected without unnecessary disclosure.


      A conditional judgment is stronger than a perfect score built from unknowns. State which design
      you currently favor for which purpose, what you cannot estimate and what evidence would reverse
      that preference. Missing fraud, cost or take-up data must stay missing. A numerical total cannot
      turn dignity, an unmet essential need or a serious exclusion into an irrelevant detail.


      ### Worked calculation


      If one hundred members contribute ten units, the fund receives 1,000. Ten needs of eighty total
      800, leaving 200 before administration. If twenty members need eighty instead, needs total 1,600
      and exceed the unchanged fund by 600. This second case is an alternative stress scenario, not an
      additional period with an automatically accumulated 200-unit reserve.


      ### Complete fictional policies


      The group has 100 adults, each contributing 10 units. In the ordinary scenario ten people each need
      80 units. Policy A requires several proof documents and a review before any payment. Policy B permits
      a simpler initial declaration and later review under a stated challenge process. Both promise the
      same 80-unit support to eligible applicants; neither has measured processing time, take-up, fraud,
      erroneous denial, administration cost or later-recovery burden in the packet.


      The case does not supply members'' incomes, actual eligibility rules or a reserve. A voluntary fictional
      applicant reports that one document required by A is hard for them to obtain; this identifies a
      possible access barrier, not a population exclusion rate or proof that B is sufficient. Both designs
      can be evaluated, but no real person is advised to apply or contribute.


      ### Compare criteria and a correlated-need shock


      1. Calculate contributions, promised ordinary support and the pre-cost remainder. Distinguish the
      six risk/need areas and name one the toy model represents poorly. Output: an arithmetic account
      with missing costs and distribution visible.

      2. Compare A and B across all six dimensions. Identify both wrongful inclusion and exclusion and
      what evidence could estimate them. Output: a criterion-by-criterion comparison without invented
      behavioral rates or moral labels for applicants.

      3. Examine the supplied document difficulty and the cost it might shift to a helper. Consider a
      usable alternative verification or appeal route, but keep feasibility unverified. Output: a specific
      access question rather than assuming all review is oppressive or all declarations reliable.

      4. Save the ordinary model before the [later packet](?resource=file-later-packet-md). Recalculate
      for twenty needs and examine reserves, broader funding, higher contributions and smaller benefits.
      Output: consequences for each burden-bearer, with administration still unmodeled.

      5. Make a conditional preference and identify a decision-reversing measurement. Explain what the
      calculation cannot show about a real policy. Output: a transparent judgment that remains open to
      evidence and affected people''s experience.


      ### Support and transfer


      Use counters, a calculator or an oral comparison. Start with one criterion at a time rather than
      inventing an elaborate score. A harder fictional case reduces contributions during the same shock;
      state the new assumption before recalculating and do not present it as a forecast.


      Actual policy work requires current jurisdiction-specific evidence, appropriate expertise and participation
      from people affected. Personal benefit, appeal, contribution and tax questions need official local
      guidance and qualified help where appropriate. Keep income, health, disability and account details
      outside this exercise. A toy comparison can build understanding but cannot establish real eligibility,
      fairness or financial sustainability.


      ### Source use


      [ILO''s 2012 explanation of Recommendation 202, S05](https://www.ilo.org/resource/news/ilo-social-protection-floors-recommendation-2012-no-202),
      describes social-protection floors, adequacy, dignity, inclusion and sustainability. It is the successfully
      inspected institutional overview; the full NORMLEX instrument could not be retrieved. These principles
      are not local benefit rules. The equal-contribution pool, two policies and all arithmetic are original
      and are not an ILO forecast or recommended design.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      Civic learning does not require political belief, affiliation, public disclosure or participation.
      Fiction and no attempt are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
