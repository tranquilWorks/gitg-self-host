    title: Compare your responses
    body: '1. No. Contributions are 1,000, stated ordinary needs 800 and the remainder 200 before unknown
      costs. There is no supplied reserve, and the stress case is an alternative scenario rather than
      a later funded period.

      2. Needs are 1,600, so the shortfall is 600 before administration. Twenty benefits of 50 use 1,000
      and leave 30 of each 80-unit need unmet, with no administrative funding left. That is a burden transfer,
      not full adequacy.

      3. Neither follows. Compare actual error, access, timing, privacy, cost and distribution evidence.
      Simpler access can retain review; complex proof can exclude people who qualify. The packet supplies
      no measured rates and cannot establish a real system''s fairness or eligibility.'
