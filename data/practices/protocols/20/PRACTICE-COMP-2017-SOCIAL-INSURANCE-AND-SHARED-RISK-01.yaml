    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. A 1,000-unit fund pays ten 80-unit needs. Is its 200-unit pre-administration remainder proof
      of profit or an available reserve in a different stress scenario?

      2. Twenty members need 80 each. What shortfall exists, and what does cutting benefits to 50 shift
      onto recipients?

      3. Does more paperwork prove lower fraud, or does a simpler process prove equal access and dignity
      for everyone?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
