  - stable_id: PRACTICE-COMP-2017-SOCIAL-INSURANCE-AND-SHARED-RISK-01-A2
    sequence: 2
    title: Compare the policies from the user and fund perspectives
    instructions: 'For each policy, assess whether support is adequate and timely, whether eligible people
      can navigate it, how dignity and privacy are protected, what incentives it creates and what administration
      might cost. Identify who could be wrongly excluded or wrongly included and which evidence would
      estimate those errors. Do not assume that simpler access means no accountability or that more paperwork
      always prevents misuse. State a tradeoff rather than forcing every criterion to improve together.


      Observation checks: Adequacy access dignity incentives cost and distribution are all assessed; Wrongful
      exclusion and inclusion are both considered; Unknown administrative and behavioral effects remain
      unknown; A genuine tradeoff is stated. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2017-SOCIAL-INSURANCE-AND-SHARED-RISK-01
