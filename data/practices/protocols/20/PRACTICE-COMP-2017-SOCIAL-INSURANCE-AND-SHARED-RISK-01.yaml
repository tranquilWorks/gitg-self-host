meaning_and_fit:
  purpose: Evaluate a social-insurance design across adequacy, incentives, access, dignity, cost and distribution
    while distinguishing a simple model from real policy evidence.
  why_recommended: Evaluate a social-insurance design across adequacy, incentives, access, dignity, cost
    and distribution while distinguishing a simple model from real policy evidence.
  claims:
  - statement: Evaluate a social-insurance design across adequacy, incentives, access, dignity, cost and
      distribution while distinguishing a simple model from real policy evidence.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Social insurance and shared risk practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Social insurance and shared risk as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use counters or a calculator and discuss the cases orally. No personal income,
    health, benefit or account data are needed. For actual eligibility, contributions or appeals, consult
    current official local guidance and qualified advice.
  opportunity_considerations: Use a fictional group of 100 adults, each contributing 10 units to a 1,000-unit
    fund. In one period, 10 people each need 80 units, leaving 200 before administration. Compare Policy
    A requiring a complex proof process with Policy B using a simpler process and later review. No fraud
    rate or administrative cost is supplied; leave them unknown.
  prerequisites:
  - Use a fictional group of 100 adults, each contributing 10 units to a 1,000-unit fund. In one period,
    10 people each need 80 units, leaving 200 before administration. Compare Policy A requiring a complex
    proof process with Policy B using a simpler process and later review. No fraud rate or administrative
    cost is supplied; leave them unknown.
  dependencies: []
  safe_alternatives:
  - Use counters or a calculator and discuss the cases orally. No personal income, health, benefit or
    account data are needed. For actual eligibility, contributions or appeals, consult current official
    local guidance and qualified advice.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Social insurance and shared risk differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Social insurance and shared
    risk as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional group of 100 adults, each contributing 10 units to a 1,000-unit fund. In one
    period, 10 people each need 80 units, leaving 200 before administration. Compare Policy A requiring
    a complex proof process with Policy B using a simpler process and later review. No fraud rate or administrative
    cost is supplied; leave them unknown. Goal: Evaluate a social-insurance design across adequacy, incentives,
    access, dignity, cost and distribution while distinguishing a simple model from real policy evidence.
    Scope: The numbers and policies are fictional educational cases, not benefit eligibility, actuarial
    advice, a government budget forecast or a recommendation about an actual personal financial decision.
    Time and effort: Two 25-minute model comparisons and a 10-minute explanation. Adaptation: Use counters
    or a calculator and discuss the cases orally. No personal income, health, benefit or account data
    are needed. For actual eligibility, contributions or appeals, consult current official local guidance
    and qualified advice. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use counters or a calculator and discuss the cases orally. No personal income,
    health, benefit or account data are needed. For actual eligibility, contributions or appeals, consult
    current official local guidance and qualified advice.
  expected_burden: Two 25-minute model comparisons and a 10-minute explanation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Social insurance and shared risk protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Social insurance and shared risk action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use counters
    or a calculator and discuss the cases orally. No personal income, health, benefit or account data
    are needed. For actual eligibility, contributions or appeals, consult current official local guidance
    and qualified advice.
  actions:
  - stable_id: PRACTICE-COMP-2017-SOCIAL-INSURANCE-AND-SHARED-RISK-01-A1
    sequence: 1
    title: Explain what is pooled and what the model leaves out
    instructions: 'Calculate contributions and stated needs, then list unmodeled costs, unequal ability
      to contribute, correlated shocks and people outside the group. Give health, unemployment, disability,
      aging, disaster and poverty separate examples of a risk or need a society might address, without
      assuming the same insurance mechanism fits all of them. Read a social-protection framework for its
      principles, not as a claim that a particular benefit is available in your location.


      Observation checks: The arithmetic and unmodeled quantities are explicit; Unequal contribution capacity
      and correlated shocks are considered; Six risk or need areas are distinguished; Framework principles
      are not treated as local benefit eligibility. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2017-SOCIAL-INSURANCE-AND-SHARED-RISK-01
      action_stable_id: PRACTICE-COMP-2017-SOCIAL-INSURANCE-AND-SHARED-RISK-01-A1
      competency_stable_id: '20.17'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2017_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2017_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
