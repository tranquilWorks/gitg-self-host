  - stable_id: PRACTICE-COMP-2017-SOCIAL-INSURANCE-AND-SHARED-RISK-01-A3
    sequence: 3
    title: Stress-test the pool and make a conditional judgment
    instructions: 'Change the case so 20 people need 80 units: needs become 1,600 and exceed the 1,000
      fund before administration. Compare responses such as reserves, broader funding, changed contributions
      or benefits, identifying who bears each burden. Write a conditional preference between A and B and
      name the missing evidence that could reverse it. Do not turn the toy calculation into a claim about
      the solvency or fairness of an actual national system.


      Observation checks: The correlated-need stress case is calculated correctly; Funding or benefit
      responses identify who bears the burden; The policy judgment is conditional on missing evidence;
      No real-system conclusion is inferred from the toy model. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Who gains access, who bears the risk and cost, and which missing quantity most changes
      your judgment about the policy?


      Examples: Supportive: The participant calculated the shortfall, compared access with verification
      burden and made a conditional policy judgment rather than declaring one design universally best.


      Mixed: The first comparison ignored administration and correlated shocks; the stress test exposed
      both limits.


      Contradictory: The toy model was presented as proof that a real benefit system is solvent, fraudulent
      or available to a particular person.


      Inconclusive: Solidarity or self-reliance was asserted without assessing adequacy, access, incentives,
      cost and distribution.'
    expected_time: 15-25 minutes
