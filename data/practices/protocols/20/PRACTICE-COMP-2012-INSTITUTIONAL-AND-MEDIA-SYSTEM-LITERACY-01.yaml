  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. No institution or actual reader has been contacted.


      The fictional reader asks whether the other 150 invitees were dissatisfied and whether 40 positive
      responses prove that 20% of all invited people benefited. The learner revises the explanation: 40
      is 20% of the invited 200, but it counts known positive survey responses, not established causal
      benefit. The 150 nonrespondents'' views remain unknown, and the ten other respondents cannot be
      split into neutral and negative categories from the supplied information.


      The trace identifies the newspaper headline as the first supplied expansion from respondents to
      residents. The party post adds a causal claim; the nonprofit and platform add no independent data.
      Agency funding is disclosed but does not by itself establish fraud. No court, representative sampling
      finding or causal comparison is supplied.


      The learner drafts a newsroom correction requesting the respondent denominator and a separate clarification
      of the party''s effectiveness claim. Both remain unsent. A methods question for the university is
      also only a draft; the original report has not been shown to contain a numerical error. No acknowledgment,
      published correction, changed policy or program-effect estimate follows. Credit the corrected explanation
      and accurately traced handoffs.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Trace one public claim from its original evidence through the institutions that produce, select
      and distribute it. Allow two twenty-five-minute checks and a ten-minute explanation to a willing
      reader, or use the complete fiction. The goal is to identify where the claim changes and which accountability
      route fits the error, without assuming that prestige proves truth or financial support proves fraud.


      ### Follow both the information and the roles


      Institutions can perform different functions in the same claim''s journey. A university may produce
      research; an agency may commission it and administer the program studied. Journalism selects, checks
      and explains material for an audience. A party may use it to argue for a policy. A nonprofit may
      conduct research, provide services or advocate a position. A corporation may fund work, own a publication
      or operate a platform. A platform can select and amplify distribution through its rules and systems.
      A court may assess a dispute under legal procedures, which is a different role from routine scientific
      review.


      These are roles to investigate, not fixed judgments about virtue. One organization can occupy several
      roles, and an institution type may have no part in the particular chain. Do not invent a court case
      or hidden funder to fill a diagram. Ask what each actor actually did: collected data, paid, summarized,
      edited, distributed, corrected or reviewed. Separate an institution''s stated responsibilities from
      evidence that it performed them well in this instance.


      Start with the original material. Identify author, sponsor, date, question, population, recruitment,
      response, method, limitations and accessible underlying evidence. A headline saying “a study proves”
      leaves all of that open. Count denominators: a percentage among respondents does not automatically
      describe all invited people, all users or every resident. Nonresponse creates uncertainty; it is
      not evidence that everyone who did not answer holds the opposite view.


      Causal claims need more than positive reports. Satisfaction among a selected group can matter without
      showing what would have happened without a program. Ask whether there is a suitable comparison,
      what changed and what else could explain the result. Missing evidence does not establish that the
      program failed. It limits which conclusion the supplied design can support.


      Then inspect the handoffs. Quote or paraphrase each actor''s actual claim accurately, mark its source
      and note any change in population, certainty, timeframe or outcome. Several articles derived from
      one survey are not independent replications. Selection and incentives can explain what to examine,
      but do not determine whether an individual claim is false. A disclosed agency sponsor deserves scrutiny
      of method and independence, not an automatic accusation of corruption.


      Match accountability to the problem. A methods question belongs with the research producer; an inaccurate
      headline can be corrected by its newsroom; an advocacy overclaim calls for clarification from its
      author. A platform may offer a route for a distribution or policy issue without adjudicating survey
      design. Courts are not a generic correction desk. Check an institution''s actual route before real
      contact, and distinguish a draft inquiry, a submitted correction request, an acknowledgment and
      a published correction.


      ### Worked example


      A survey reports that forty of fifty respondents express satisfaction. A headline changes that to
      “80% of residents benefit,” and an advocate calls it proof of effectiveness. The denominator has
      expanded without evidence and satisfaction has become causal benefit. A careful trace retains the
      survey''s limited descriptive finding while identifying two separate overclaims and the people responsible
      for each statement.


      ### Supplied fictional case


      The fictional Cedar agency funds a university survey about one of its programs. The report states
      that 200 program users were invited, 50 responded and 40 respondents selected the positive satisfaction
      option. Ten respondents did not select that option; no finer breakdown is supplied. The response
      rate is 25%, and 80% of respondents selected the positive option. The report describes this sample
      and does not claim a causal effect, a representative city estimate or comparison with a nonparticipant
      group.


      The agency''s summary preserves “40 of 50 respondents.” A fictional newspaper headline instead says,
      “80% of residents benefit.” A party post links that headline and says the program is “proven to
      work.” A nonprofit reposts the party post without adding data. A corporation-operated platform distributes
      those posts. Its ranking mechanism, the newspaper''s ownership, and any funding beyond the disclosed
      agency sponsorship are unknown. No court has reviewed the claim.


      All names, numbers and statements are original fiction. They make no accusation about an actual
      university, party, company, publication or program.


      ### Trace and explain the public claim


      1. Reconstruct the original survey''s population, response, question and design limits. Calculate
      the two stated percentages with the correct denominators. Output: a methods note that leaves nonrespondents''
      views and program impact unknown.

      2. Map the actual producer, funder, summarizer, news selector, advocate, republisher and distributor.
      Identify where roles overlap and where a type, such as a court, is absent. Output: a role chain
      with explicit unknowns, not a hierarchy of trust by brand.

      3. Compare the wording at each handoff. Locate the first denominator expansion and the later causal
      escalation. Output: separate error descriptions that preserve the valid descriptive result.

      4. Draft a proportionate clarification or correction for the responsible role. No real contact is
      required. Output: a relevant route and precisely requested change, without allegations of hidden
      motives or guaranteed correction.

      5. Explain your conclusion to the supplied fictional reader or a willing real reader, then consult
      the [later packet](?resource=file-later-packet-md). Output: a revised explanation after a fresh
      denominator challenge, with all communication statuses accurate.


      ### Support and transfer


      For support, use a two-stage count drawing: 200 invited, then 50 respondents, then 40 positive responses
      within those 50. An oral explanation or accessible list can replace a diagram. For a harder case,
      the source supplies only a percentage without its denominator. Ask for the missing method and withhold
      the broader claim; do not invent sample size or a margin of error.


      For real transfer, use public material and a low-stakes claim. Check current institutional roles
      and procedures without collecting private records or profiling staff. A friendly reader can test
      your explanation but cannot certify the study. The fictional chain supports reasoning about institutional
      filtering; it does not establish actual misconduct, effectiveness or a completed correction.


      ### Source use


      [SPJ''s voluntary ethics code, S15](https://www.spj.org/spj-code-of-ethics/), supports accuracy,
      independence and accountability in journalism. [AAPOR''s Disclosure Standards, S16](https://aapor.org/standards-and-ethics/disclosure-standards/),
      identifies methodological information a survey report should disclose, including sponsorship and
      sample details. The inspected page identifies its April 2021 code version. These sources are not
      laws, guarantees of compliance or validation of the invented study; the institutional chain and
      calculations are original.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
