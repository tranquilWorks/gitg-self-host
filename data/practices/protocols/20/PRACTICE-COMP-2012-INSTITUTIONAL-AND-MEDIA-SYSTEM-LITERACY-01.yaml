  - stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01-A2
    sequence: 2
    title: Track what changed at each public handoff
    instructions: 'Compare the original conclusion with a news account and a public repost, or use the
      fictional chain when originals are absent. Mark changes in certainty, omitted limitations, headline
      framing and the move from association to causation. For parties, agencies, courts, universities,
      corporations, nonprofits, journalism and platforms, give a relevant role or not-in-this-chain disposition.
      Identify one incentive and one accountability mechanism for the actual institutions without assuming
      that an incentive proves dishonesty.


      Observation checks: At least two handoffs are compared; Changes in certainty context and causal
      language are identified; All named institution types have a relevant or absent disposition; Incentives
      and accountability are considered without motive certainty. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01
      action_stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01-A2
      competency_stable_id: '20.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
