meaning_and_fit:
  purpose: Follow a public claim from original evidence through institutions, incentives, editorial choices
    and accountability routes rather than treating every source as interchangeable.
  why_recommended: Follow a public claim from original evidence through institutions, incentives, editorial
    choices and accountability routes rather than treating every source as interchangeable.
  claims:
  - statement: Follow a public claim from original evidence through institutions, incentives, editorial
      choices and accountability routes rather than treating every source as interchangeable.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Institutional and media-system literacy practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Institutional and media-system literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use accessible public documents or a fully fictional chain. Do not bypass
    paywalls, access confidential records or infer private funding relationships. Missing evidence is
    an honest conclusion, not a reason to fill the gap with speculation.
  opportunity_considerations: 'Use a low-stakes public claim about a service survey or the fictional default:
    a platform post says a university study proves a city program works. Prepare a chain with original
    evidence, researcher, funder, agency or program, news report, party or advocacy use, platform distribution
    and correction route.'
  prerequisites:
  - 'Use a low-stakes public claim about a service survey or the fictional default: a platform post says
    a university study proves a city program works. Prepare a chain with original evidence, researcher,
    funder, agency or program, news report, party or advocacy use, platform distribution and correction
    route.'
  dependencies: []
  safe_alternatives:
  - Use accessible public documents or a fully fictional chain. Do not bypass paywalls, access confidential
    records or infer private funding relationships. Missing evidence is an honest conclusion, not a reason
    to fill the gap with speculation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Institutional and media-system literacy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Institutional and media-system
    literacy as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a low-stakes public claim about a service survey or the fictional default: a platform post
    says a university study proves a city program works. Prepare a chain with original evidence, researcher,
    funder, agency or program, news report, party or advocacy use, platform distribution and correction
    route. Goal: Follow a public claim from original evidence through institutions, incentives, editorial
    choices and accountability routes rather than treating every source as interchangeable. Scope: This
    is a bounded source-chain analysis. It does not establish that an institution is trustworthy or corrupt
    in general, or that all public claims have the same evidentiary standard. Time and effort: Two 25-minute
    tracing sessions and a 10-minute explanation to a willing reader or private rehearsal. Adaptation:
    Use accessible public documents or a fully fictional chain. Do not bypass paywalls, access confidential
    records or infer private funding relationships. Missing evidence is an honest conclusion, not a reason
    to fill the gap with speculation. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible public documents or a fully fictional chain. Do not bypass paywalls,
    access confidential records or infer private funding relationships. Missing evidence is an honest
    conclusion, not a reason to fill the gap with speculation.
  expected_burden: Two 25-minute tracing sessions and a 10-minute explanation to a willing reader or private
    rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Institutional and media-system literacy protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Institutional and media-system literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    public documents or a fully fictional chain. Do not bypass paywalls, access confidential records or
    infer private funding relationships. Missing evidence is an honest conclusion, not a reason to fill
    the gap with speculation.
  actions:
  - stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01-A1
    sequence: 1
    title: Find the evidence beneath the institution names
    instructions: 'Locate the original report or mark it unavailable. Identify what was measured, who
      produced it, who funded it and what conclusion the authors actually supported. Distinguish a university
      affiliation, an agency statement, a corporation’s release and a nonprofit’s advocacy from the underlying
      evidence. A court ruling, when relevant, answers legal questions under a particular record rather
      than automatically verifying every scientific or political claim attached to it.


      Observation checks: Original evidence is located or explicitly unavailable; Producer funder method
      and supported conclusion are separated; Institutional labels are not substitutes for evidence; Legal
      scientific and policy claims are distinguished. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01
      action_stable_id: PRACTICE-COMP-2012-INSTITUTIONAL-AND-MEDIA-SYSTEM-LITERACY-01-A1
      competency_stable_id: '20.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2012_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2012_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - original_evidence_is_located_or_explicitly_unavailable
        - producer_funder_method_and_supported_conclusion_are_separated
        - institutional_labels_are_not_substitutes_for_evidence
        - legal_scientific_and_policy_claims_are_distinguished
      - measurement_id: c2012_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
