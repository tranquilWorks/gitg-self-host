        criteria:
        - request_offer_verification_and_refusal_routes_are_understood
        - six_support_areas_have_explicit_scope_dispositions
        - a_contribution_and_a_possible_received_support_are_identified
        - sensitive_needs_and_moral_debt_are_not_publicly_cataloged
      - measurement_id: c2016_a1_boundary
