  - stable_id: PRACTICE-COMP-2016-MUTUAL-AID-AND-COMMUNITY-RESILIENCE-01-A2
    sequence: 2
    title: Complete one exchange with an accepting recipient
    instructions: 'Use the agreed channel to offer or request the bounded task, such as confirming a public
      opening time for someone who cannot easily access the website. Verify the information, communicate
      its source and uncertainty, and confirm the recipient wanted it. If receiving help, state what is
      useful without promising an equal repayment. For tasks involving transport, food or care, follow
