meaning_and_fit:
  purpose: Contribute to and receive from a small local support system in a way that distributes capacity,
    preserves dignity and keeps essential responsibilities safely owned.
  why_recommended: Contribute to and receive from a small local support system in a way that distributes
    capacity, preserves dignity and keeps essential responsibilities safely owned.
  claims:
  - statement: Contribute to and receive from a small local support system in a way that distributes capacity,
      preserves dignity and keeps essential responsibilities safely owned.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Mutual aid and community resilience practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mutual aid and community resilience as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use remote information support, accessible communication or a fictional exchange.
    People with little current capacity can receive help without penalty. Urgent safety, child protection
    or medical concerns must use the appropriate real service rather than wait for an informal group response.
  opportunity_considerations: Default to a neighborhood group sharing verified public-service information
    and an occasional permitted errand. Prepare an exchange card with what is offered, what is requested,
    who can accept, access and cost limits, privacy, handoff and what requires a qualified service. No
    one must contribute equally or disclose hardship to receive help.
  prerequisites:
  - Default to a neighborhood group sharing verified public-service information and an occasional permitted
    errand. Prepare an exchange card with what is offered, what is requested, who can accept, access and
    cost limits, privacy, handoff and what requires a qualified service. No one must contribute equally
    or disclose hardship to receive help.
  dependencies: []
  safe_alternatives:
  - Use remote information support, accessible communication or a fictional exchange. People with little
    current capacity can receive help without penalty. Urgent safety, child protection or medical concerns
    must use the appropriate real service rather than wait for an informal group response.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mutual aid and community resilience differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mutual aid and community resilience
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a neighborhood group sharing verified public-service information and an occasional
    permitted errand. Prepare an exchange card with what is offered, what is requested, who can accept,
    access and cost limits, privacy, handoff and what requires a qualified service. No one must contribute
    equally or disclose hardship to receive help. Goal: Contribute to and receive from a small local support
    system in a way that distributes capacity, preserves dignity and keeps essential responsibilities
    safely owned. Scope: Use an established authorized group or a low-risk exchange among willing adults.
    This does not authorize unsupervised childcare, medical work, emergency response or access to private
    homes and data. Time and effort: Twenty minutes to understand the arrangement, one low-risk exchange
    and a review after a second contact. Adaptation: Use remote information support, accessible communication
    or a fictional exchange. People with little current capacity can receive help without penalty. Urgent
    safety, child protection or medical concerns must use the appropriate real service rather than wait
    for an informal group response. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use remote information support, accessible communication or a fictional exchange.
    People with little current capacity can receive help without penalty. Urgent safety, child protection
    or medical concerns must use the appropriate real service rather than wait for an informal group response.
  expected_burden: Twenty minutes to understand the arrangement, one low-risk exchange and a review after
    a second contact.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mutual aid and community resilience protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Mutual aid and community resilience action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use remote
    information support, accessible communication or a fictional exchange. People with little current
    capacity can receive help without penalty. Urgent safety, child protection or medical concerns must
    use the appropriate real service rather than wait for an informal group response.
  actions:
  - stable_id: PRACTICE-COMP-2016-MUTUAL-AID-AND-COMMUNITY-RESILIENCE-01-A1
    sequence: 1
    title: Map capacity and need without creating a public vulnerability list
    instructions: 'Ask the group coordinator how requests are made, who verifies offers and how people
      can decline. Give food, transport, information, emergency help, childcare and emotional support
      a separate safe-role or outside-scope disposition. Select one low-risk contribution and one form
      of help you may appropriately request. Do not publish names, medical needs, home access details
      or a ranked list of who owes the community most.


      Observation checks: Request offer verification and refusal routes are understood; Six support areas
      have explicit scope dispositions; A contribution and a possible received support are identified;
      Sensitive needs and moral debt are not publicly cataloged. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2016-MUTUAL-AID-AND-COMMUNITY-RESILIENCE-01
      action_stable_id: PRACTICE-COMP-2016-MUTUAL-AID-AND-COMMUNITY-RESILIENCE-01-A1
      competency_stable_id: '20.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2016_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2016_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
