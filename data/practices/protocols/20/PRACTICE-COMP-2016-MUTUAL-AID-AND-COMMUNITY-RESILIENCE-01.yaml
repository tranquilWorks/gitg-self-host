  - stable_id: PRACTICE-COMP-2016-MUTUAL-AID-AND-COMMUNITY-RESILIENCE-01-A3
    sequence: 3
    title: Review the network rather than only your own generosity
    instructions: 'At the next group contact, ask whether the exchange reduced a burden, created a new
      dependency or left an unowned task. Identify one way information or capacity can be shared so the
      system does not depend on one heroic coordinator. Offer a small improvement through the agreed process
      and respect a decision not to use it. Record only the exchange status and lesson, not recipients’
      private circumstances or a score of generosity.


      Observation checks: The exchange’s benefit and burden are checked; Dependency on one person is examined;
      A small network improvement is proposed through the proper process; Private need and generosity
      scores are excluded. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Did help flow through a reliable relationship rather than a one-way performance, and
      what would keep the exchange working when the usual helper is unavailable?


      Examples: Supportive: A verified information exchange was accepted, the participant also requested
      an access aid and the group clarified a backup coordinator.


      Mixed: The task helped, but only one person knew the process; the group documented a privacy-safe
      backup route.


      Contradictory: The exchange became a debt ledger, exposed private hardship or placed an unqualified
      person in charge of essential care.


      Inconclusive: Mutual aid was described as an ideal without an accepted exchange or a network-level
      review.'
    expected_time: 15-25 minutes
