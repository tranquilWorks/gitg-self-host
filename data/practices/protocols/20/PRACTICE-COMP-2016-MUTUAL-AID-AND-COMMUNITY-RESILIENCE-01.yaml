  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Owen accepts Mina''s hours check. Mina sends Tuesday 10:00–16:00 with the current notice''s date
      and the unresolved exceptional-closure qualification. Owen says the answer is usable for planning.
      No visit or actual opening is observed.


      Owen accepts Mina''s separate request and supplies the large-print three-stop card. Mina correctly
      identifies Library stop from that copy and keeps the Public Route Desk label. No travel occurs.
      Neither person records a repayment balance, and Lee continues receiving information without a contribution
      requirement.


      At the next group contact Jin shares a privacy-safe note describing how to check public source dates.
      Tess explicitly accepts a backup public-information check beginning the following week; no recipient
      details or care duties transfer. That check has not happened. Credit the two completed fictional
      information exchanges and accepted bounded backup. Do not infer emergency readiness, transport safety,
      equal contributions or durable resilience from them.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Trace a small reciprocal support system, complete a bounded exchange in fiction or an authorized
      group, and review who keeps it working. Allow twenty minutes to understand the arrangement, one
      low-risk exchange and a second contact. Receiving help is legitimate even when you cannot contribute.
      Mutual aid is not an equal-repayment contract or a public ranking of generosity.


      ### Look at relationships and capacity, not a heroic helper


      One-way assistance can be valuable, but mutual aid also asks how people participate in decisions
      and share useful capacity over time. A person can provide information today, request an accessible
      copy tomorrow and contribute nothing during a difficult period. Reciprocity belongs to the network;
      it need not be an immediate trade between two people or an equal number of hours.


      Understand the arrangement before offering. Who receives requests, confirms that an offer is wanted,
      sets boundaries and handles an unanswered message? A list of willing people is not an accepted service.
      Availability, competence, authority and actual handoff are separate. Ask how refusal works and how
      a recipient can report a problem without risking exclusion from future help.


      Treat different support areas differently. Food help may require safe handling and an established
      arrangement. Transport information is not the same as transporting a person. Public information
      needs a dated source and clear uncertainty. Emergencies belong with appropriate urgent services,
      not an informal queue. Childcare requires actual competent, authorized care and a confirmed handoff;
      a group chat does not supply these. Emotional or practical support should be wanted and bounded,
      with clinical needs outside an ordinary helper''s role. Give each area an explicit disposition rather
      than treating goodwill as universal qualification.


      Privacy matters at the network level. A shared directory should not become a map of medical need,
      home access, vulnerability or who owes whom. Record only what the task requires through an agreed
      channel. Let people request an access aid without explaining a diagnosis or hardship. A public source
      can often supply the information needed without collecting private stories.


      Verify the useful endpoint. Sending a timetable does not prove that it was current, wanted or usable.
      A recipient''s acknowledgment can establish receipt and usefulness for one task; it does not establish
      that they made the trip or became safer. Check whether a contribution creates extra work, leaves
      an essential responsibility unowned or makes the helper the only person who knows the process.


      Resilience means the arrangement can handle some change without relying entirely on one person.
      A clear public-information note and an accepted backup can reduce a particular dependency. They
      do not establish preparedness for every emergency. Do not recruit backup by assumption or transfer
      private requests without consent. A future commitment is different from work already performed,
      and informal support must not silently replace an institution''s obligations.


      ### Worked example


      A group shares an old image of opening hours. One member checks the current public notice and sends
      the requested correction privately. Later that member requests a large-print copy of a different
      public instruction. The two exchanges need not have equal value. The group notices that only one
      coordinator knows how to verify dates and agrees a small backup procedure without publishing recipients''
      needs.


      ### Complete fictional exchange packet


      The Cedar neighbors group shares ordinary public information through an agreed private request channel.
      Coordinator Jin asks before assigning a task; people may decline or receive help without repayment.
      Mina offers one hours check. Owen requests it for a fictional library. A stale image says Tuesday
      09:00–17:00. The current public notice, dated 1 October and valid through 31 October, says **Tuesday
      10:00–16:00; check the public desk notice for exceptional closures**. No exceptional-closure notice
      is supplied, so unusual changes remain unchecked.


      Mina also requests a large-print copy of a fictional public route card. Its complete instruction
      is **Cedar stop → Oak stop → Library stop; questions: Public Route Desk**. This is a paper direction
      exercise, not a verified live transport route or promise of accessible vehicles. Owen offers to
      make the copy. Jin is currently the only person maintaining the date-check note; Tess has been suggested
      as backup but has not yet accepted. Lee receives information and has no available contribution;
      that does not limit Lee''s standing.


      ### Complete the exchange and review the arrangement


      1. Map request, offer, acceptance, refusal, feedback and escalation routes. Give all six support
      areas a safe role or outside-scope disposition. Output: a capacity map without private needs, homes
      or debt scores.

      2. Confirm Owen wants the hours check and verify the supplied current notice against the stale image.
      Keep exceptional closures uncertain. Output: a dated answer with the limited source, not an unqualified
      travel assurance.

      3. Ask for the chosen large-print route copy and confirm whether Owen accepts that task. Do not
      treat Mina''s earlier help as payment. Output: accepted or declined support and the actual copy/handoff
      status.

      4. At the second contact, ask whether each exchange was usable and whether someone carried hidden
      work. Examine the single-coordinator dependency. Output: a modest network improvement requiring
      an actual accepting owner.

      5. Save your account before the [later packet](?resource=file-later-packet-md). Distinguish completed
      exchanges, an accepted backup and a future check. Output: reciprocal flow and one unresolved service
      limit, with no emergency-readiness claim.


      ### Support and transfer


      Use the supplied cards orally, in larger print or with chosen assistance. A harder case leaves the
      usual coordinator unavailable and the proposed backup silent. Preserve the unaccepted status, use
      an existing appropriate route or pause the nonurgent task; do not silently assign the backup or
      improvise essential care.


      For actual transfer, use a willing established group and a safe task within your role. Urgent concerns
      need the proper real service without waiting for a practice review. Keep identifying details in
      the approved channel, outside app evidence. A fictional exchange can explain reciprocal capacity
      but cannot establish real community benefit, resilience or another person''s safety.


      ### Source use


      [IFRC''s community engagement and accountability page, S04](https://www.ifrc.org/our-work/inclusion-protection-and-engagement/community-engagement-and-accountability),
      treats community members as participants whose priorities and feedback shape assistance. The landing-page
      principles are used here; its linked guides and program-effect claims are not evaluated. This original
      neighborhood case does not reproduce an IFRC program or qualify anyone for food, transport, emergency
      or childcare work.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      Civic learning does not require political belief, affiliation, public disclosure or participation.
      Fiction and no attempt are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Someone cannot contribute this month. Does mutual aid require withholding help or recording a
      debt until they repay it?

      2. A helper confirms current published hours. What remains different about an exceptional closure,
      an actual visit and a safe transport service?

      3. A coordinator names a backup in a group message. When does that become accepted responsibility,
      and what proves it was performed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Reciprocal capacity can be distributed across a network and over time. Receiving help
      does not require equal repayment, disclosure of hardship or a generosity score. A task still needs
      consent and workable limits.

      2. A dated public notice supports the stated routine schedule only. Unchecked exceptions, a completed
      visit and transport competence are separate. Do not turn information work into a safety or care
      guarantee.

      3. Naming or suggesting someone is not acceptance. Confirm the role and limits with that person.
      Later performance needs an actual occurrence; Tess''s accepted future public-information check is
      not yet done and includes no private care duty.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
