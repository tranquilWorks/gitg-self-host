meaning_and_fit:
  purpose: Turn a community-defined problem into a limited cooperative project with consenting stakeholders,
    clear ownership, a useful deliverable and an honest outcome review.
  why_recommended: Turn a community-defined problem into a limited cooperative project with consenting
    stakeholders, clear ownership, a useful deliverable and an honest outcome review.
  claims:
  - statement: Turn a community-defined problem into a limited cooperative project with consenting stakeholders,
      clear ownership, a useful deliverable and an honest outcome review.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Collective action and organizing practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Collective action and organizing as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible digital noticeboard with permission, a smaller two-person
    project or a complete fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration
    or community impact. No public posting, fundraising or political mobilization is required.
  opportunity_considerations: 'Default to making a community noticeboard readable and current with the
    owner’s permission. Prepare a one-page charter: problem, affected users, owner permission, intended
    result, roles, resources, risks, deadline and acceptance check. Use two or more willing participants
    only when a live organizing opportunity exists.'
  prerequisites:
  - 'Default to making a community noticeboard readable and current with the owner’s permission. Prepare
    a one-page charter: problem, affected users, owner permission, intended result, roles, resources,
    risks, deadline and acceptance check. Use two or more willing participants only when a live organizing
    opportunity exists.'
  dependencies: []
  safe_alternatives:
  - Use an accessible digital noticeboard with permission, a smaller two-person project or a complete
    fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration or community
    impact. No public posting, fundraising or political mobilization is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Collective action and organizing differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Collective action and organizing
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to making a community noticeboard readable and current with the owner’s permission.
    Prepare a one-page charter: problem, affected users, owner permission, intended result, roles, resources,
    risks, deadline and acceptance check. Use two or more willing participants only when a live organizing
    opportunity exists. Goal: Turn a community-defined problem into a limited cooperative project with
    consenting stakeholders, clear ownership, a useful deliverable and an honest outcome review. Scope:
    Choose a lawful low-stakes shared-space improvement. This is not permission to speak for a community,
    access private data or pressure people into political or volunteer participation. Time and effort:
    One 30-minute planning session, a short coordinated work period and a 20-minute review within two
    weeks. Adaptation: Use an accessible digital noticeboard with permission, a smaller two-person project
    or a complete fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration
    or community impact. No public posting, fundraising or political mobilization is required. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible digital noticeboard with permission, a smaller two-person project
    or a complete fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration
    or community impact. No public posting, fundraising or political mobilization is required.
  expected_burden: One 30-minute planning session, a short coordinated work period and a 20-minute review
    within two weeks.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Collective action and organizing protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Collective action and organizing action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    digital noticeboard with permission, a smaller two-person project or a complete fictional tabletop
    plan. A tabletop plan does not establish recruitment, collaboration or community impact. No public
    posting, fundraising or political mobilization is required.
  actions:
  - stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A1
    sequence: 1
    title: Confirm a shared problem rather than recruit for your preferred answer
    instructions: 'Ask the space owner and at least one affected user what is difficult about the noticeboard.
      Distinguish outdated information, unreadable format and missing access from your personal taste.
      State a bounded outcome such as current notices can be found and read without removing authorized
      content. Invite stakeholders to correct the problem statement and identify who is not yet represented.
      Do not claim to represent absent users merely because you considered them.


      Observation checks: The problem is checked with an owner and affected user; A bounded observable
      outcome is agreed; Absent or unrepresented stakeholders are identified; Recruitment does not assume
      consent to a predetermined solution. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01
      action_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A1
      competency_stable_id: '20.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2008_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2008_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_problem_is_checked_with_an_owner_and_affected_user
        - a_bounded_observable_outcome_is_agreed
        - absent_or_unrepresented_stakeholders_are_identified
        - recruitment_does_not_assume_consent_to_a_predetermined_solution
      - measurement_id: c2008_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2008_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A2
    sequence: 2
    title: Coordinate accepted roles and a reversible work plan
    instructions: 'Ask willing participants to choose roles such as checking dates, preparing accessible
      labels and confirming owner approval. Define each handoff, resource limit and what must not be changed.
      Include a stop point for disputed ownership, private information or safety. Run a brief check-back
      so each person can state what they will deliver and to whom. A task assigned in a document is not
      owned until the person accepts it.


      Observation checks: Each role is explicitly accepted; Handoffs resources and limits are clear; Disputed
      authority privacy and safety trigger a pause; Participants can explain their own delivery responsibility.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01
      action_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A2
      competency_stable_id: '20.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2008_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2008_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_role_is_explicitly_accepted
        - handoffs_resources_and_limits_are_clear
        - disputed_authority_privacy_and_safety_trigger_a_pause
        - participants_can_explain_their_own_delivery_responsibility
      - measurement_id: c2008_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2008_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A3
    sequence: 3
    title: Deliver, test with a user and close the loop
    instructions: 'Complete the permitted work and ask an affected user to find a current notice using
      the result. Record what worked, what failed and any unintended loss of information or access. Correct
      a small problem within the agreed scope, then hand ongoing maintenance to an accepting owner. Compare
      the result with the original outcome and capture one organizing lesson. Attendance at a planning
      meeting alone is not a community result.


      Observation checks: A permitted shared deliverable is produced; An affected user performs the intended
      task; Failure and unintended effects remain visible; Maintenance and lessons have an explicit handoff.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Did the effort solve the problem stakeholders named, and where did role clarity or
      missing representation change the result?


      Examples: Supportive: Participants accepted distinct roles, a user found the correct notice and
      an owner agreed to maintain the result.


      Mixed: The board looked better, but a user could not read a label; the team corrected it before
      claiming acceptance.


      Contradictory: The organizer removed others’ information without authority, pressured participation
      or claimed to represent people never consulted.


      Inconclusive: A charter and role list were created without a deliverable, user check or accountable
      handoff.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01
      action_stable_id: PRACTICE-COMP-2008-COLLECTIVE-ACTION-AND-ORGANIZING-01-A3
