  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not live community evidence.


      Ari inventories all twelve notices and Mel approves exactly three expired removals. Dev makes the
      heading. After the agreed check, the three expired notices are removed. Nine remain: eight current
      and one undated with status still unresolved. The team does not relabel the undated item as current
      or remove it for neatness.


      On the first trial Noor cannot read the small heading comfortably. The team replaces it with a larger
      reversible heading, which Mel approves. On the second trial Noor locates Reading Circle at 18:00
      without a hint. The correction and retry occurred, but Noor has already seen the board; familiarity
      could contribute. No wider user group or accessibility assessment is reported.


      Mel accepts a weekly status check beginning the following week. That future check has not happened.
      The team records a lesson: test the heading before treating installation as completion, and preserve
      uncertain content for the owner''s review. Credit the coordinated permitted work and bounded finding
      result. Do not claim consensus, universal usability or sustained maintenance yet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Coordinate a small shared task from a verified problem through a usable result and accepted
      maintenance. Allow thirty minutes to plan, a short agreed work session and twenty minutes to review
      within two weeks. Use a community noticeboard with permission or the complete fiction. A good meeting
      or attractive plan is preparation; the learning task includes doing the permitted work and checking
      its result.


      ### Build an effort people can actually carry


      A shared problem needs more than one person''s annoyance. Identify who uses the resource, who bears
      the inconvenience, who maintains it and who may authorize changes. People who attend a planning
      conversation do not automatically represent absent users. State what you observed and what you still
      need to ask. Aesthetic preferences should not displace access, accuracy or ownership.


      A compact charter connects the problem to one result. Include the affected users, authorized owner,
      desired change, boundaries, roles, resources, risks, deadline and acceptance test. For a board,
      “make it better” is vague; “remove notices the owner confirms expired, preserve uncertain material,
      and let a willing user locate a current event without coaching” supplies decisions and evidence.
      Permission can limit the task. Do not remove disputed speech, private material or safety instructions
      under the banner of tidying.


      Recruit around a specific contribution, not an assumed obligation. Explain the work, time and decision
      room, then ask. An offered role becomes assigned only when accepted. Give each unit an owner and
      a check-back point. Date checking, preparing a label, approving removals and testing use are different
      responsibilities. Avoid leaving one enthusiastic organizer to chase every loose end while describing
      the effort as shared ownership.


      Coordinate dependencies before work starts. An approval may be needed before removal; the new arrangement
      may need testing before the owner accepts it. State how uncertainty or an absent volunteer changes
      the plan. A smaller completed task can be preferable to unapproved work. No one needs to reveal
      political views, personal circumstances or a reason for declining. Disagreement about the solution
      can be recorded without making someone an enemy of the community.


      Measure the result at the level you can observe. A board with fewer notices can be less useful if
      the removed ones were still relevant or labels are unreadable. Ask a willing user to perform an
      ordinary finding task without hints. A difficulty is design information, not a failure of the user.
      Repair within the permission granted, retry and record the limits of that trial. The same user''s
      second attempt may benefit from familiarity.


      Maintenance needs its own accepted owner and feasible rhythm. Announcing that “someone will check
      weekly” does not establish a commitment. Capture a practical lesson about coordination as well as
      the artifact. One board trial does not show community consensus, universal accessibility or long-term
      impact; it can show that a bounded effort produced a particular usable result and an agreed next
      responsibility.


      ### Worked example


      A team proposes removing every notice without a date. The owner points out that one undated instruction
      is still in use. The team narrows the task to confirmed expired event notices, keeps uncertain material
      and tests a clearer heading. The changed criterion avoids confusing neatness with accuracy. The
      owner accepts a maintenance role separately from approving today''s work.


      ### Supplied fictional case


      Cedar Hall''s board has twelve notices: three owner-confirmed expired event notices, eight current
      notices and one undated notice whose status is unknown. The owner, Mel, authorizes removal of the
      three expired notices and a reversible heading. The undated item must remain pending Mel''s separate
      review; private or disputed material is outside scope.


      For the paper rehearsal, use this complete inventory. The three owner-confirmed expired notices
      are **September Welcome, 20 September; Repair Chat, 21 September; and Seed Talk, 22 September**.
      The eight confirmed current notices are **Reading Circle, 16 October at 18:00; Book Swap, 17 October
      at 10:00; Story Hour, 18 October at 11:00; Craft Table, 19 October at 16:00; Local History, 20 October
      at 18:00; Music Listening, 21 October at 17:00; Map Club, 22 October at 18:00; and Repair Stories,
      23 October at 15:00**. All are fictional Cedar Hall events. The undated item is **Room-use reminder**,
      with no further status supplied. Preserve its text placeholder and refer it to Mel. The proposed
      heading is **Current events — check the notice date**; Noor''s task is to find the time for **Reading
      Circle**. Leave the undated item in place. The inventory marks its status as awaiting owner review;
      do not add a label to that notice or change its content without permission.


      Ari offers to check dates and make an inventory; Dev offers to prepare the heading. Both accept
      those roles and a joint check before any change. Mel accepts approval and final review. A willing
      fictional user, Noor, agrees to try finding the time of one current event. No one has yet done the
      work. Supplies already available suffice; no purchase or budget estimate is required.


      ### Organize through a checked endpoint


      1. Describe the actual problem and whose permission and experience matter. Separate known notice
      status from assumptions about absent users. Output: a short problem statement and stakeholder/authority
      map.

      2. Write the compact charter, with the removal limit, finding task and stop conditions. Ask for
      roles and record acceptances separately from invitations. Output: an accepted coordination plan,
      not a claim of impact.

      3. Complete the inventory and owner check before changing the board. Carry out only authorized removals
      and the reversible heading. Output: an accurate before/after account that preserves the undated
      item.

      4. Ask the willing user to find the event time without coaching. Record success or difficulty, correct
      a permitted design problem and retry if welcome. Output: an observed result with the trial''s small
      scope and any familiarity effect stated.

      5. Ask who can maintain the result and on what terms. Use the [later packet](?resource=file-later-packet-md)
      to revise your success claim and capture a coordination lesson. Output: accepted future ownership
      distinguished from maintenance already performed.


      ### Support and transfer


      For support, use three role cards and a paper copy of the fictional board. An accessible verbal
      plan can replace a chart. For a harder case, the owner is unavailable before the deadline. Complete
      the inventory, preserve disputed items and renegotiate the deadline; do not treat silence as approval.


      A real effort needs willing participants, appropriate authority and a low-risk task. Do not collect
      names or political affiliations for proof, remove public content without permission or use this
      exercise to manage hazardous work. A solo fictional plan develops coordination reasoning but is
      not collective action in the world. Transfer the accepted-role and user-test sequence to another
      modest common task, then judge that task on its own evidence.


      ### Source use


      [Community Tool Box, S10](https://ctb.ku.edu/en/table-of-contents/structure/strategic-planning/develop-action-plans/main),
      provides planning guidance connecting actions, responsibility, timing, resources and communication.
      Selected action-plan sections were inspected, not every linked chapter. The noticeboard case and
      its acceptance test are original. Planning guidance does not establish that a charter causes impact
      or that one participant represents a whole community.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
