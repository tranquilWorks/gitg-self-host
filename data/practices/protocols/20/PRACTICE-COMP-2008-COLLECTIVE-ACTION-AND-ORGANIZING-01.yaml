    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. Four people attend a planning meeting and agree the board needs changes. Does this establish
      all users'' agreement or permission to remove notices?

      2. Twelve notices include three confirmed expired, eight current and one undated. Only the expired
      removals are authorized. What remains, and what must stay uncertain?

      3. A user succeeds after the heading is enlarged, and an owner agrees to next week''s check. What
      result and maintenance claims are justified?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A community noticeboard has ten slots. Two are reserved for emergency notices; six contain current
      ordinary notices; two are empty. The steward authorizes one new ordinary notice, while a volunteer
      proposes removing an existing current notice to fit three new ones. What capacity and authority
      are actually available?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Attendance is not representation of absent users, and agreement does not create ownership
      authority. Verify the task''s permission, affected needs and accepted roles; preserve disagreement
      and the ability to decline.

      2. Nine remain: eight current and one undated. Unknown status is neither expired nor verified current.
      Refer it to the owner without inventing authority or removing it for appearance.

      3. A permitted correction and one successful retry occurred. The same user''s familiarity limits
      attribution to the heading, and one trial does not establish universal access. Weekly maintenance
      is accepted but not yet performed.


      ### Changed-case answer


      Two ordinary slots are empty, so the one authorized addition fits without removal. Three additions
      would need one more ordinary slot, but removal and the extra additions lack authorization. Reserved
      emergency space is not spare general capacity. Agree scope with the steward; arithmetic capacity
      does not create permission.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
