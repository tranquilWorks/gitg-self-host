      Collective action and organizing; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use an accessible digital noticeboard with permission, a smaller two-person project or a complete
      fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration or community
      impact. No public posting, fundraising or political mobilization is required.
    cultural_context:
    - Adapt the expression of Collective action and organizing to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use an accessible digital noticeboard with permission, a smaller two-person project or a complete
      fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration or community
