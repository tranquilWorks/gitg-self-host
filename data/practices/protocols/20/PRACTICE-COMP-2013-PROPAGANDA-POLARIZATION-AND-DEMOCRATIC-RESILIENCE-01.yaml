  actions:
  - stable_id: PRACTICE-COMP-2013-PROPAGANDA-POLARIZATION-AND-DEMOCRATIC-RESILIENCE-01-A1
    sequence: 1
    title: Mark the mechanism rather than merely the side you dislike
    instructions: 'For each message, identify the tactic: a whole group blamed, an unfalsifiable explanation,
      urgency without evidence or loyalty replacing accountability. Note what information would be needed
      to assess the underlying factual concern separately. Identify where language denies equal dignity
      or narrows acceptable knowledge to one in-group source. Do not label every strong criticism as propaganda,
      and do not assume a tactic’s presence proves a coordinated campaign.


      Observation checks: Three messages receive specific tactic analyses; Underlying factual questions
      remain separate from rhetoric; Dehumanization and closed evidence loops are identified; Strong criticism
      and coordinated propaganda are not automatically equated. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2013-PROPAGANDA-POLARIZATION-AND-DEMOCRATIC-RESILIENCE-01
