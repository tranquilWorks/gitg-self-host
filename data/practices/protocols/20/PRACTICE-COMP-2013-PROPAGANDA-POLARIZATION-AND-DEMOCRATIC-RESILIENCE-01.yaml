  - stable_id: PRACTICE-COMP-2013-PROPAGANDA-POLARIZATION-AND-DEMOCRATIC-RESILIENCE-01-A3
    sequence: 3
    title: Choose a non-amplifying response with an evidence route
    instructions: 'Draft a calm response that addresses the checkable issue, states uncertainty and rejects
      group blame without repeating inflammatory wording. Alternatively decide not to amplify the message
      and seek the original record privately. Include a correction if you previously shared an unsupported
      version. Rehearse how you will stop an unproductive exchange without dehumanizing the sender. Success
      is a responsible information choice, not winning an argument or making the other person confess
      manipulation.


      Observation checks: The response addresses facts without reproducing dehumanization; Non-amplification
      remains a legitimate option; A prior unsupported share has a correction plan; Ending the exchange
      does not require humiliation or victory. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which tactic was hardest to notice when it supported your preference, and did your
      response preserve open evidence and equal dignity?


      Examples: Supportive: The participant recognized a closed evidence loop in a favored message and
      chose an original-source check rather than forwarding it.


      Mixed: The first reply mocked the sender; the participant revised it to address the factual claim
      without repeating the tactic.


      Contradictory: A manipulative message was amplified to attack an out-group, or all disagreement
      was dismissed as proof of conspiracy.


      Inconclusive: Propaganda labels were assigned without identifying the mechanism or changing a sharing
      decision.'
