  - stable_id: PRACTICE-COMP-2013-PROPAGANDA-POLARIZATION-AND-DEMOCRATIC-RESILIENCE-01-A2
    sequence: 2
    title: Apply the same test to a message from your preferred side
    instructions: 'Rewrite one fictional message so it favors a cause you personally find attractive,
      without targeting a real audience, then apply the same evidence and dignity checks. Ask what would
      change your belief, which independent source could disagree and whether the demanded action allows
      time for judgment. Identify one feature you were tempted to excuse because the conclusion felt right.
      Do not share the manipulative rewrite; it exists only for a private consistency test.


      Observation checks: A preferred-side version is tested privately; A revising fact and independent
      check are named; Urgency and obedience demands are examined consistently; The manipulative example
      is not disseminated. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
