intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three fictional messages about a shared venue: Everyone from that group is the problem;
    Any evidence against this story proves the cover-up; Only our leader can fix it, so share before they
    silence us. No real protected group or named person is needed. Prepare fields for claim, emotional
    trigger, excluded evidence, implied action and accountable alternative. Goal: Identify dehumanization,
    scapegoating, conspiratorial closure and manufactured outrage while preserving factual uncertainty
    and responding without the same manipulation. Scope: Use benign fictional messages or a non-graphic
    public example. This is not a diagnosis of a person, proof of an organized influence operation or
    permission to investigate private individuals. Time and effort: Twenty minutes of message analysis
    and a 15-minute response rehearsal. Adaptation: Use the fictional set when real material is distressing
    or unsafe. No one must expose themselves to hate content, disclose political beliefs or engage with
    harassment. Threats or safety concerns belong with appropriate support and reporting channels. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional set when real material is distressing or unsafe. No one must
    expose themselves to hate content, disclose political beliefs or engage with harassment. Threats or
    safety concerns belong with appropriate support and reporting channels.
  expected_burden: Twenty minutes of message analysis and a 15-minute response rehearsal.
