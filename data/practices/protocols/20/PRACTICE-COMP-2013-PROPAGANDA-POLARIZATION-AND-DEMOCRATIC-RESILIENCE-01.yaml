      - [What Is Transitional Justice?](https://www.ictj.org/what-transitional-justice)

      - [Decent work and the 2030 Agenda for sustainable development](https://www.ilo.org/topics-and-sectors/decent-work-and-2030-agenda-sustainable-development)

