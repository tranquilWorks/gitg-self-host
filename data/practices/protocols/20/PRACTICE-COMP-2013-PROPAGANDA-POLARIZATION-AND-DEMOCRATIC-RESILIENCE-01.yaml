      - [Learning Principles](https://www.cmu.edu/teaching/principles/learning.html)

      - [Quality Glossary](https://asq.org/quality-resources/quality-glossary)

      - [Learning about users and their needs](https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs)

      - [6.3 Interface Management](https://www.nasa.gov/reference/6-3-interface-management/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The dated hall record states that a plumbing repair made one room unavailable and caused both booking
      changes. It identifies the affected time slots but supplies no group identities, motive finding
      or evaluation of whether the alternative arrangements were adequate. The record supports a practical
      cause for those changes; it does not settle every fairness concern or prove that misconduct never
      occurs.


      The learner initially wrote a reply mocking the sender. They remove that sentence and replace the
      draft with a request to inspect the dated decision and alternative arrangements, while rejecting
      collective blame. They apply the same test to the private favored-label version and do not disseminate
      it.


      No original post, rewrite or response is sent in this exercise. No prior forwarding by the learner
      is supplied, so a completed correction to an audience cannot be claimed. The chosen endpoint is
      a revised non-amplifying response and a bounded source check. The sender''s intent, coordination,
      changed beliefs and any wider democratic effect remain unknown.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Analyze three invented public messages and choose a response that preserves evidence and dignity.
      Allow twenty minutes for analysis and fifteen for a private response rehearsal. Use the supplied
      case; you do not need to seek out hate content, disclose a political position or engage a hostile
      person. The result is a responsible information decision, not a diagnosis of the sender or proof
      of an organized influence operation.


      ### Recognize the mechanism before judging the side


      A claim, a rhetorical tactic and a sharing decision are different objects. A speaker can raise a
      real problem through manipulative language. A calm message can be false, while an angry complaint
      can be supported by evidence. Inspect the proposition and the method separately. Calling a message
      propaganda without showing its mechanism simply replaces one label with another.


      Scapegoating assigns broad responsibility to a group without showing who did what. Dehumanizing
      rhetoric denies people equal dignity or treats them as disposable rather than addressing conduct.
      Conspiratorial closure makes a belief immune to correction: contrary evidence becomes further proof
      of the hidden plot. Actual collusion can exist, but a serious allegation needs checkable evidence
      and possible disconfirmation. Mere suspicion or a claim that “they would hide the evidence” does
      not supply it.


      Manufactured outrage can exploit missing context, urgency and social reward to make forwarding feel
      like a moral obligation. A leader-centered message can replace accountable decision procedures with
      personal loyalty. Epistemic capture occurs when every acceptable source must already belong to the
      same trusted circle and outside correction is disallowed. Agreement among those repeating one assertion
      does not open that circle. These mechanisms can occur together, but their presence alone does not
      establish the sender''s intent, a coordinated campaign or an authoritarian regime.


      Democratic resilience includes habits that leave room for challenge: equal standing, reasons that
      others can inspect, plural sources, correction, disagreement and accountable authority. None requires
      treating every assertion as equally supported. Preserve a person''s dignity while declining a weak
      claim or an unsafe exchange. An ordinary mistake should not become evidence that a whole group is
      incapable of participating.


      Apply the same test when the proposed outcome appeals to you. Privately replace a fictional group''s
      label with another invented label that you favor. Does a demand for unquestioning loyalty suddenly
      seem acceptable? Identify a fact that could revise your view and a relevant source allowed to disagree.
      This is a consistency test, not a strategy for persuading an audience. Do not publish the manipulative
      rewrite.


      A useful response narrows attention to a checkable issue and a relevant source. It can acknowledge
      uncertainty, reject collective blame and offer a calm correction. It can also be a decision not
      to amplify. If you already shared an unsupported claim, address the same audience proportionately.
      The aim is not to humiliate a sender, force a confession or remain in a fruitless exchange indefinitely.


      ### Worked example


      A booking change prompts an assertion that a whole club controls the venue. The analyst separates
      the verifiable question—why the booking changed—from the unsupported attribution. They ask for the
      dated booking and maintenance record, then remove a mocking sentence from their reply. Even if the
      schedule was mishandled, that would not establish group guilt or justify denying members a voice.


      ### Complete fictional message packet


      Cedar Hall has changed two of twelve bookings. No cause is initially supplied. Three invented posts
      circulate privately within the case:


      - A: “Everyone from Group Z is the problem; their concerns should not count.”

      - B: “Any record contradicting this story proves how deep the cover-up goes.”

      - C: “Only our leader can fix the hall. Share now; every outside source is against us.”


      Group Z has no real identity or protected characteristic. No actual person or platform is involved.
      The only initial fact is the two changed bookings; their causes, responsible decisions and fairness
      remain unknown. Use fields for exact concern, tactic, evidence excluded, demanded action and a more
      accountable alternative.


      ### Analyze, swap and choose an information action


      1. Mark each mechanism in its actual words and separate it from the booking question. Identify what
      would count as evidence about the decision. Output: three specific analyses rather than a verdict
      about a group''s character.

      2. Test one post privately with an invented favored label. Keep the standard unchanged. Name one
      revising fact and an independent record you would permit to challenge your belief. Output: a consistency
      check with no targeted audience or dissemination.

      3. Draft an accountable alternative focused on dates, decision authority and reasons. Remove blame
      that exceeds evidence and avoid restating inflammatory language unnecessarily. Output: a short draft
      or reasoned non-amplification decision.

      4. Save the draft before the [later packet](?resource=file-later-packet-md). Revise in response
      to its limited record, keeping any unresolved fairness question open. Output: the supported finding
      and a statement of what it does not show.

      5. State your actual sharing and engagement status. End an unproductive exchange without insult;
      if a real prior error exists, correct it through an appropriate route. Output: a true action record,
      not assumed persuasion or public resilience.


      ### Support and transfer


      Use one message at a time, read it aloud or replace writing with a three-column card. A harder fictional
      case gives a correct booking complaint alongside collective blame; retain the complaint while rejecting
      the tactic. Do not make a learner''s distress or tolerance for hateful material the difficulty setting.


      A real transfer can use a benign public claim without naming private people. You may stop, mute
      or seek appropriate support where there is harassment or a threat. Do not infer ideology from sharing
      behavior, investigate individuals or build a profile of a group. Fiction can exercise scrutiny but
      does not establish a real person''s resistance to manipulation over time.


      ### Source use


      [European Commission/UNESCO educational guidance, S01](https://commission.europa.eu/strategy-and-policy/coronavirus-response/fighting-disinformation/identifying-conspiracy-theories_en),
      discusses scapegoating, immunity to contrary evidence, self-scrutiny and non-ridiculing responses.
      Only these general sections are used. Its pandemic examples, clinical claims and credential-based
      shortcuts are not adopted as current facts or a truth test. The invented messages, consistency exercise
      and later record are original; no efficacy claim is made.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      Civic learning does not require political belief, affiliation, public disclosure or participation.
      Fiction and no attempt are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. An angry post identifies a real scheduling error but blames every member of a group. Must you
      accept or reject its factual concern and tactic together?

      2. Someone says every contradictory record is proof of a cover-up. What is wrong with that evidence
      rule, even when you like their preferred outcome?

      3. A dated maintenance record explains a booking change. Does this prove fair handling, no possible
      misconduct, or a successful correction to an audience?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Check the scheduling concern on its evidence and reject unsupported collective blame
      or dignity denial. Anger alone does not prove propaganda, and a real problem does not validate a
      manipulative tactic.

      2. The claim cannot be revised by evidence under that rule. Ask what could disconfirm it and permit
      an appropriate independent check. A preferred conclusion does not justify epistemic closure; actual
      coordination requires evidence, not a rhetorical diagnosis.

      3. It supports the stated practical cause for this change only. Adequacy, broader misconduct and
      audience response remain separate questions. Here no message is sent and no prior forwarding is
      supplied, so no audience correction or persuasion is established.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
