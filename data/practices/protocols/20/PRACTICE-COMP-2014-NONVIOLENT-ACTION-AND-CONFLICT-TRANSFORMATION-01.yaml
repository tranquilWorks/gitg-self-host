        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A3
    sequence: 3
    title: Tabletop a refusal and a partial concession
    instructions: 'Have a willing reader or private rehearsal test two responses: the venue declines,
      or it offers an option that solves only part of the access problem. Decide what evidence, consultation
      or qualified local advice is needed next. Include an honest way to recognize progress, correct your
      own error and close the effort. Do not treat compromise as betrayal or nonviolence as passive acceptance
      of harm; the plan must preserve both accountability and participant safety.


      Observation checks: Refusal and partial progress are both rehearsed; Next steps depend on evidence
      consultation and appropriate guidance; Progress correction and closure are defined; No coercive
      or automatic escalation is introduced. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which method fits the actual authority and risk, and what would make your next step
      more accountable rather than merely louder?


      Examples: Supportive: The plan chose a factual access request, protected participants’ privacy and
      defined how to evaluate a partial improvement.


      Mixed: The first plan jumped to public pressure; the risk review led to consultation and a lower-risk
      initial route.


      Contradictory: The campaign used threats, harassment, coerced participation or escalating disruption
      without regard for third-party harm.


      Inconclusive: Nonviolence was endorsed without a concrete goal, stakeholders, risk limits or response
      to refusal.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01
