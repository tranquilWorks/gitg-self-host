meaning_and_fit:
  purpose: Compare nonviolent options, stakeholder interests, risks and escalation limits to design a
    lawful low-risk first step toward a concrete shared improvement.
  why_recommended: Compare nonviolent options, stakeholder interests, risks and escalation limits to design
    a lawful low-risk first step toward a concrete shared improvement.
  claims:
  - statement: Compare nonviolent options, stakeholder interests, risks and escalation limits to design
      a lawful low-risk first step toward a concrete shared improvement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Nonviolent action and conflict transformation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Nonviolent action and conflict transformation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a classroom or private fictional case. Actual affected people should shape
    any real effort and can decline participation. Abuse, violence, labor disputes, legal jeopardy or
    high-risk protest require qualified support beyond this exercise.
  opportunity_considerations: Use a fictional community venue whose meeting notices omit an accessible
    participation option. Prepare a campaign card with the requested change, affected stakeholders, evidence,
    decision authority, possible methods, risk, safeguards, stop conditions and review. Do not use personal
    targeting, public shaming or unlawful entry.
  prerequisites:
  - Use a fictional community venue whose meeting notices omit an accessible participation option. Prepare
    a campaign card with the requested change, affected stakeholders, evidence, decision authority, possible
    methods, risk, safeguards, stop conditions and review. Do not use personal targeting, public shaming
    or unlawful entry.
  dependencies: []
  safe_alternatives:
  - Use a classroom or private fictional case. Actual affected people should shape any real effort and
    can decline participation. Abuse, violence, labor disputes, legal jeopardy or high-risk protest require
    qualified support beyond this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Nonviolent action and conflict transformation differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Nonviolent action and conflict
    transformation as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional community venue whose meeting notices omit an accessible participation option.
    Prepare a campaign card with the requested change, affected stakeholders, evidence, decision authority,
    possible methods, risk, safeguards, stop conditions and review. Do not use personal targeting, public
    shaming or unlawful entry. Goal: Compare nonviolent options, stakeholder interests, risks and escalation
    limits to design a lawful low-risk first step toward a concrete shared improvement. Scope: This is
    civic education and a fictional campaign design. Real strikes, boycotts, protest, civil resistance
    and legal rights vary by jurisdiction and require appropriate local guidance; no risky action is required.
    Time and effort: Two 25-minute design passes and one 15-minute tabletop review. Adaptation: Use a
    classroom or private fictional case. Actual affected people should shape any real effort and can decline
    participation. Abuse, violence, labor disputes, legal jeopardy or high-risk protest require qualified
    support beyond this exercise. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a classroom or private fictional case. Actual affected people should shape
    any real effort and can decline participation. Abuse, violence, labor disputes, legal jeopardy or
    high-risk protest require qualified support beyond this exercise.
  expected_burden: Two 25-minute design passes and one 15-minute tabletop review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Nonviolent action and conflict transformation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Nonviolent action and conflict transformation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a classroom
    or private fictional case. Actual affected people should shape any real effort and can decline participation.
    Abuse, violence, labor disputes, legal jeopardy or high-risk protest require qualified support beyond
    this exercise.
  actions:
  - stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A1
    sequence: 1
    title: Define a change and distinguish conflict processes from pressure
    instructions: 'State a specific requested improvement, such as publishing an accessible contact route
      before the next meeting. Identify affected participants, the venue’s constraints and who can authorize
      a change. Compare negotiation, mediation and restorative dialogue as processes with consent and
      authority limits; compare boycott, strike, protest and civil resistance as different forms of collective
      pressure requiring separate legal and safety analysis. Do not assume every method fits this small
      problem or that affected people consent to a campaign.


      Observation checks: The requested change is specific and verifiable; Affected people constraints
      and authority are mapped; Dialogue processes and pressure methods are distinguished; Consent and
      legal suitability are not assumed. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01
      action_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A1
      competency_stable_id: '20.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2014_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2014_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_requested_change_is_specific_and_verifiable
        - affected_people_constraints_and_authority_are_mapped
        - dialogue_processes_and_pressure_methods_are_distinguished
        - consent_and_legal_suitability_are_not_assumed
      - measurement_id: c2014_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2014_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A2
    sequence: 2
    title: Choose the least risky adequate first step and its safeguards
    instructions: 'For this case, draft a factual written request and an invitation to discuss an accessible
      alternative. Explain why this is proportionate before considering more disruptive methods. Identify
      risks to participants, staff, uninvolved users and people with less ability to refuse. Set safeguards
      against threats, harassment, property damage, coerced participation and exposing private information.
      State what lack of progress would justify reconsidering the plan, not automatically escalating it.


      Observation checks: A proportionate low-risk first step is justified; Risks to participants and
      third parties are considered; Nonviolence privacy and voluntary participation are explicit; Review
      criteria replace automatic escalation. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01
      action_stable_id: PRACTICE-COMP-2014-NONVIOLENT-ACTION-AND-CONFLICT-TRANSFORMATION-01-A2
      competency_stable_id: '20.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2014_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2014_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_proportionate_low_risk_first_step_is_justified
        - risks_to_participants_and_third_parties_are_considered
        - nonviolence_privacy_and_voluntary_participation_are_explicit
        - review_criteria_replace_automatic_escalation
      - measurement_id: c2014_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2014_a2_adverse
        kind: boolean
        role: adverse
