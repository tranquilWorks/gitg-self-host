  - id: practice-answers
    title: Compare your responses
    body: '1. No. Consent has scope. Ask before any expansion, protect private circumstances and let people
      decline. Authority over the venue and local legal/safety requirements remain separate from participation
      in a request.

      2. No. Mediation assists a voluntary agreement within its applicable context; it does not create
      decision authority. Pressure methods have different functions and risks, and actual suitability
      requires local guidance. A refusal does not automatically justify escalation.

      3. Recognize the text improvement while retaining the unmet written-channel need. Ask about a feasible
      monitored route and responsibilities without blaming or imposing unagreed work. In the packet the
      follow-up is a draft; no complete access solution or real campaign outcome is established.'
