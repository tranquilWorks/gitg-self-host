  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      In one separate refusal rehearsal the owner says no change can be promised until staffing is checked.
      The learner asks which constraint is unresolved and when the owner can give a definite answer, without
      claiming that a review date has been agreed. This is a hypothetical branch, not an additional event
      in the accepted-offer sequence.


      In the second tabletop branch the owner supplies a matching text notice and offers a telephone line
      from 12:00 to 13:00. The two users acknowledge the text improvement but say the telephone-only route
      does not meet the requested written access channel. The learner credits the text notice, retains
      the written-channel requirement and drafts a follow-up to the owner about monitoring and a feasible
      deadline.


      The follow-up remains unsent, and no written access route is accepted or implemented. No public
      campaign, mediation session, staffing change or actual meeting outcome occurs. The record distinguishes
      a useful partial concession from a complete solution and a reviewed next step from automatic escalation.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Design a proportionate response to a fictional access problem and test it against refusal and
      partial progress. Use two twenty-five-minute passes and a fifteen-minute tabletop review. You are
      designing a bounded process, not organizing an actual protest, labor action or confrontation. Nonviolence
      can demand change and accountability; it does not require passive acceptance of harm.


      ### Choose a method for its purpose and consequences


      Begin with a verifiable change and the people affected. “Make the venue listen” is difficult to
      assess; “publish a usable access-contact route before the next meeting” identifies an outcome. Separate
      participants'' stated needs from an organizer''s assumptions, and determine who can authorize the
      change. Staff may face real resource limits without being personally responsible for every institutional
      barrier.


      Negotiation involves parties discussing terms directly. Mediation adds an impartial facilitator
      who assists agreement without simply imposing a decision. Restorative practice attends to harm,
      responsibility and possible repair; it requires appropriate consent, support and attention to power.
      None automatically grants a participant authority, replaces a required legal process or makes an
      unsafe encounter suitable. An affected person can decline without losing standing.


      Collective pressure methods differ from those processes. A boycott withholds selected participation
      or purchases; a strike withholds work; protest publicly expresses a demand; civil resistance can
      involve organized noncooperation and other nonviolent action. Their legality, obligations, risks
      and consequences vary by place and circumstance. Do not collapse them into one escalation ladder
      or assume that a peaceful intention makes every action harmless or lawful. This guide gives no operational
      plan for a risky method.


      Conflict can escalate through changed stakes, public humiliation, threats, fear or loss of trusted
      communication. A response may also impose costs on uninvolved users, staff with limited power or
      people who cannot easily refuse. Map those burdens before choosing the loudest available method.
      Keep refusal and dissent possible, do not expose participants'' identities, and avoid coercion or
      retaliation.


      For a small correctable information problem, a factual request and invitation to discuss can be
      an adequate first step. “Least risky adequate” is not a universal demand to wait indefinitely; urgency
      and actual harm matter. State when you will review progress, what new facts would change your approach
      and where qualified guidance is needed. Lack of an immediate reply is a reason to reassess, not
      automatic permission to intensify disruption.


      Partial concessions need scrutiny. A contact route that works only for people who can call during
      a narrow window may leave others excluded. Recognize what changed while preserving the unmet requirement.
      Compromise is not automatically betrayal, and agreement is not automatically adequate. A process
      becomes accountable when it can correct its own errors, state remaining limits and close or continue
      for reasons participants can examine.


      ### Worked example


      A venue offers a telephone contact after receiving an access request. The requester acknowledges
      that this adds one route but explains that it does not answer a request for an accessible written
      channel. They ask the responsible owner whether a monitored written route can be provided by the
      notice deadline. No staff member is named publicly, and people affected by the gap decide whether
      further involvement is wanted.


      ### Complete fictional access packet


      Cedar Hall plans a meeting on 18 October at 17:00. The owner controls the notice and contact arrangements;
      the desk assistant cannot approve new staffing. The current notice is an image containing only the
      title, time and room. It has no text alternative or access-contact route. Two willing fictional
      users want a readable text notice and a way to ask access questions without disclosing their private
      circumstances publicly.


      The written request can go to the fictional Hall Owner inbox. The practical request is: **provide
      matching plain text and a monitored written access-question route by 15 October at 12:00, before
      the meeting**. No actual address is supplied or needed. The owner has not agreed; staffing capacity
      and a response timeframe are unknown. Consent extends to this private request, not a public campaign
      or publication of the two users'' stories.


      ### Design and tabletop the response


      1. State the requested change, affected participants, authority and unknown constraints. Distinguish
      a user report from representation of all users. Output: a goal and stakeholder map that does not
      invent consent.

      2. Compare the dialogue processes and pressure methods by purpose, suitability, authority and possible
      burden. Select the factual request for this case and explain why it is adequate to try now. Output:
      a reasoned first step, not a universal rule against collective action.

      3. Draft the request with its actual facts and a voluntary discussion invitation. Set a review point,
      privacy limits and stops for coercion, threats or uncertain authority. Output: a bounded process
      card with a responsible next owner.

      4. Before the [later packet](?resource=file-later-packet-md), rehearse both a refusal and an incomplete
      offer. Name the clarification and consultation each would need. Output: two contingent responses
      without automatic escalation.

      5. Read the later events, credit actual progress and identify the unsatisfied part. Decide whether
      to revise, seek advice or close this rehearsal. Output: an honest status with unresolved need and
      no claim of a successful real campaign.


      ### Support and transfer


      A supported route can use spoken goal and risk cards with a trusted willing reader. For a harder
      case, a proposed improvement shifts an unreasonable burden to a single staff member. Revisit responsibility
      and resources; do not demand unpaid labor as the only proof of concern.


      Actual conflict processes require appropriate local authority, affected people''s agency and competent
      facilitation where needed. Violence, abuse, labor disputes and legal jeopardy are outside this small
      task. Do not provoke a refusal, stage disruption or approach a vulnerable person to obtain learning
      evidence. A tabletop comparison develops judgment but cannot prove reconciliation, lawful action
      or changed institutional practice.


      ### Source use


      [Acas mediation guidance, S02](https://www.acas.org.uk/mediation), describes impartial facilitation,
      voluntary participation and parties'' control of an agreement in a workplace context. Those limited
      process distinctions inform this guide; its confidentiality and legal-effect statements are not
      generalized to every jurisdiction or civic process. The campaign comparison and Cedar case are original.
      UN mediation pages could not be retrieved and are not claimed as inspected.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      Civic learning does not require political belief, affiliation, public disclosure or participation.
      Fiction and no attempt are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Does agreeing to a private access request authorize publication of participants'' stories or
      a protest on their behalf?

      2. Is mediation the same as an imposed decision, and are a strike, boycott and public protest interchangeable
      steps in a universal ladder?

      3. A readable notice is supplied but the only contact route is a narrow telephone window. What should
      the response recognize and preserve?'
    check_id: practice-answers
    attempt_mode: practice
