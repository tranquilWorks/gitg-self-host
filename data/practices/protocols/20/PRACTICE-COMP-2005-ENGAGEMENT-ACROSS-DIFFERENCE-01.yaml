  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Jo corrects Bea''s first summary: Jo wants a usable offline route, not an end to online information.
      Bea revises the summary, and Jo says it now captures the concern. Bea still prefers online-first
      updates; Jo still wants paper access to have equal standing. Neither is asked to adopt the other''s
      broader view.


      Both explicitly accept the limited roles. Jo checks the supplied date, place and public contact
      route; Bea prepares the agreed paper layout and matching digital text. The coordinator accepts both
      files as matching the requested event information. No actual printing, posting, attendance outcome
      or organization-wide format policy is supplied.


      In their brief review, both say the roles allowed an honest contribution. That is fictional feedback
      about this task, not proof of general trust. Record the corrected representation, accepted work
      and retained disagreement. Do not describe the accepted files as a public campaign, a policy settlement
      or evidence that everyone with either outlook would cooperate in the same way.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Represent another person''s concern accurately, then cooperate on one limited shared good while
      keeping a genuine disagreement visible. Allow fifteen minutes to prepare, a willing twenty-minute
      exchange and a small task. Use the fictional notice case when there is no safe willing partner.
      This is not covert persuasion, mediation of abuse or a demand that someone defend their dignity.


      ### Understanding and agreement are different outcomes


      A fair representation identifies the other person''s actual reason, not the weakest version you
      can rebut. Let them correct it. “You dislike technology” may be a caricature of “I do not want people
      without smartphones excluded.” A summary can become more accurate even if you still prefer a different
      policy. Accuracy is not disloyalty to your own conviction.


      Religion, politics, culture, class, age and experience can shape what a person notices and values.
      None makes them a spokesperson for everyone in a category. Ask about the concern relevant to this
      task rather than building a profile of their beliefs or resources. Do not infer a person''s motives
      from age, accent, clothing or presumed affiliation. They may choose not to explain private experiences.


      Cooperation needs an identifiable common good. Preparing a readable event notice is narrower than
      agreeing on a whole philosophy of public services. State what you can do together and what remains
      disputed. A useful shared task must not quietly commit either person to a broader ideology, organization
      or future role.


      Boundaries make honest engagement possible. Each person can decline topics, refuse recording, choose
      a suitable communication format or stop an unsafe exchange. Respect for a person does not require
      accepting every claim or normalizing harassment. Exclude situations involving retaliation, coercion
      or pressure to debate basic dignity. An unwilling partner is not raw material for practice.


      A courteous response is not necessarily consent or confirmation of understanding. Ask whether the
      summary is accurate and whether the proposed task is accepted. Listen for corrections rather than
      treating them as a delay before your argument. When a correction changes the task, make that change
      visible. Credit should reflect actual contributions, and a disagreement must not become an excuse
      to sabotage the shared result.


      ### Worked example


      Jo wants important community notices available on paper because some users cannot reliably use a
      phone. Bea prefers online notices because they can be searched and updated. Bea first summarizes
      Jo as wanting to abandon digital access. Jo corrects that summary: the concern is exclusion, not
      banning technology. They may cooperate on one readable notice while still disagreeing about which
      format should usually lead.


      ### Supplied fictional case


      Jo and Bea have permission from an event coordinator to prepare one public, non-sensitive notice
      in an agreed paper format and a matching digital text. The coordinator supplies the correct date,
      place and public contact route. No one is authorized to change the event, adopt a new organization-wide
      policy or publish personal details.


      Use these exact invented public facts for both versions: **Reading Together; 18 October, 15:00–16:00;
      Cedar Hall, Room B; questions: Event Desk at Cedar Hall**. “Event Desk” is a fictional public contact
      label, not a real address. The agreed paper layout has the title, date/time, place and contact on
      separate lines in large readable type; the digital version preserves the same four facts in plain
      text. Keep both as drafts for the coordinator, with no printing or posting required. These are all
      the facts needed; if asked about cost or booking, mark it unknown.


      Jo prefers paper access to have equal standing; Bea still prefers online-first updates. They are
      willing to discuss that ordinary disagreement and prepare the notice, with no recording or inquiry
      into private political, religious or financial circumstances. Jo can check the supplied event facts.
      Bea can prepare the readable layout and matching text. The roles remain offers until each accepts
      them.


      ### Represent, agree and deliver the bounded part


      1. State the shared deliverable and your own conviction separately. Identify the topics or details
      that are outside the willing exchange. Prepare an open question about the other person''s concern.
      Output: a task invitation that neither assumes agreement nor asks them to represent a group.

      2. Summarize their reason and invite a correction. State what you now understand, where you still
      disagree and what is uncertain. Output: a checked representation without a rebuttal smuggled into
      it. The other person''s right to decline remains intact.

      3. Ask whether the limited notice task is worth doing together. Confirm roles, facts, owner permission
      and what completion means. Output: explicit acceptance rather than a polite nod interpreted as a
      commitment to a larger program.

      4. Complete the accepted parts and hand the paired notice to the coordinator through the agreed
      route. Share credit and identify any unresolved output issue. Output: the actual deliverable status,
      not an assumed public benefit or policy compromise.

      5. Save your account before the [later packet](?resource=file-later-packet-md). Ask whether each
      person could contribute honestly, and record one improved understanding alongside one retained conviction.
      Output: a cooperation review that does not claim the disagreement vanished.


      ### Support and transfer


      For support, use asynchronous text and a one-sentence summary with a chance to correct it. An interpreter
      or accessible format can help when appropriate and wanted. For a harder fictional attempt, the other
      person corrects your account twice or declines the task. Accept that information without diagnosing
      bad faith. A responsible closure can be a valid outcome even when no joint output follows.


      Real transfer can involve an ordinary shared good with a willing neighbor, colleague or community
      participant. Do not use assistance or access to a resource as leverage for a political or religious
      conversation. Preserve substantive disagreement when it remains; the aim is fair understanding and
      bounded cooperation, not conversion. One pleasant exchange says little about long-term trust, conflict
      resolution or whole-group coexistence.


      ### Source use and evidence


      [Living Room Conversations'' published agreements, S07](https://livingroomconversations.org/whatislrc/),
      support listening, respect, acknowledging common ground and differences, and responsibility for
      one''s participation. Its broader program and claimed effects are not evaluated here. The original
      two-person notice task is not presented as an official LRC session or validated intervention. A
      supplied fictional correction is not actual participant feedback; in real work, appropriate freely
      given correction and a completed task provide different evidence from self-report alone.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Someone wants an offline option. Is “you reject technology” a fair summary, and how can you check?

      2. Two people deliver a shared notice while retaining different priorities. Must one have surrendered
      a conviction for the cooperation to count?

      3. A person declines the conversation or task. Can their refusal be recorded as bad faith or evidence
      about their whole group?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Not without their confirmation; it may distort an access concern into a broader position.
      Offer a tentative summary, invite correction and revise it before claiming understanding. A checked
      representation need not become agreement.

      2. No. Bounded cooperation can serve an agreed good while broader disagreement remains. State the
      actual accepted task, roles and output, and preserve both positions rather than manufacture consensus.

      3. No. Participation is voluntary, and refusal alone supplies neither motive nor a group trait.
      Respect the boundary and use fiction or another appropriate opportunity. Do not turn service or
      access into pressure to engage.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
