  - stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01-A3
    sequence: 3
    title: Deliver the shared part and review the boundary
    instructions: 'Complete the accepted task with clear roles and credit, then ask whether the process
      allowed each person to contribute honestly. Record one change in your understanding and one conviction
      that remained, without claiming consensus. If the task revealed an unworkable boundary, close your
      responsibility transparently instead of sabotaging the result or pretending the difference vanished.
      Rehearsal can test the conversation but not actual cross-difference cooperation.


      Observation checks: An accepted shared task is completed or responsibly closed; Roles and credit
      remain fair; Understanding and retained conviction are both recorded; Consensus is not claimed from
      courtesy or task completion. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What could you represent more fairly afterward, and what made cooperation possible
      without pretending the disagreement was gone?


      Examples: Supportive: Both people corrected the summaries and completed an accessible announcement
      while openly retaining different views.


      Mixed: The task succeeded, but one summary still smuggled in a rebuttal; the participant corrected
      it before claiming understanding.


      Contradictory: The task was used as a cover for coercive persuasion, group stereotyping or demanding
      debate over someone’s dignity.


      Inconclusive: Agreement was praised without a checked representation or a completed cooperative
      act.'
    expected_time: 15-25 minutes
