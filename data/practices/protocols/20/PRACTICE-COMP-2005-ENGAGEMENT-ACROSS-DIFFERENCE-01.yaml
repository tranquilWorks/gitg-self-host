        criteria:
        - the_other_person_can_correct_your_summary
        - agreement_disagreement_and_uncertainty_are_distinguished
        - a_limited_cooperative_proposal_is_made_without_covert_persuasion
        - refusal_is_respected_without_a_character_judgment
      - measurement_id: c2005_a2_boundary
        kind: boolean
