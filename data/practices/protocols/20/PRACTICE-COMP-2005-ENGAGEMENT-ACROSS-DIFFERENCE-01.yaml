        expected: true
  - stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01-A2
    sequence: 2
    title: Check your representation before proposing cooperation
    instructions: 'Ask about the other person’s concern and summarize it in a form they can correct. State
      where you agree, where you differ and what you still do not understand. Avoid disguising a rebuttal
      as a summary or treating politeness as consent. Then ask whether the limited noticeboard task is
      still worthwhile together, such as making one announcement readable in an accessible format. Accept
      a refusal without turning it into evidence of bad faith.


      Observation checks: The other person can correct your summary; Agreement disagreement and uncertainty
      are distinguished; A limited cooperative proposal is made without covert persuasion; Refusal is
      respected without a character judgment. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01
      action_stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01-A2
      competency_stable_id: '20.05'
