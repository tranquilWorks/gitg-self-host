meaning_and_fit:
  purpose: Represent another person’s view fairly and coordinate a limited shared task without surrendering
    conviction or requiring ideological agreement.
  why_recommended: Represent another person’s view fairly and coordinate a limited shared task without
    surrendering conviction or requiring ideological agreement.
  claims:
  - statement: Represent another person’s view fairly and coordinate a limited shared task without surrendering
      conviction or requiring ideological agreement.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Engagement across difference practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Engagement across difference as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use asynchronous writing, an interpreter or a facilitated low-stakes conversation.
    A fictional exchange is appropriate when no willing safe partner exists. No one must disclose political
    affiliation, faith, income or identity to provide evidence.
  opportunity_considerations: Choose an ordinary shared good such as an accessible neighborhood noticeboard,
    with someone who differs from you in outlook or experience. Prepare a task question, a genuine disagreement
    you can discuss safely and a boundary on topics or personal details. No sensitive political profile
    should be recorded.
  prerequisites:
  - Choose an ordinary shared good such as an accessible neighborhood noticeboard, with someone who differs
    from you in outlook or experience. Prepare a task question, a genuine disagreement you can discuss
    safely and a boundary on topics or personal details. No sensitive political profile should be recorded.
  dependencies: []
  safe_alternatives:
  - Use asynchronous writing, an interpreter or a facilitated low-stakes conversation. A fictional exchange
    is appropriate when no willing safe partner exists. No one must disclose political affiliation, faith,
    income or identity to provide evidence.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Engagement across difference differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Engagement across difference
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary shared good such as an accessible neighborhood noticeboard, with someone
    who differs from you in outlook or experience. Prepare a task question, a genuine disagreement you
    can discuss safely and a boundary on topics or personal details. No sensitive political profile should
    be recorded. Goal: Represent another person’s view fairly and coordinate a limited shared task without
    surrendering conviction or requiring ideological agreement. Scope: Use a willing, low-stakes relationship.
    This is not mediation of abuse, a requirement to debate human dignity or permission to pressure someone
    about politics or religion. Time and effort: A 15-minute preparation, one 20-minute willing exchange
    and one small shared task. Adaptation: Use asynchronous writing, an interpreter or a facilitated low-stakes
    conversation. A fictional exchange is appropriate when no willing safe partner exists. No one must
    disclose political affiliation, faith, income or identity to provide evidence. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous writing, an interpreter or a facilitated low-stakes conversation.
    A fictional exchange is appropriate when no willing safe partner exists. No one must disclose political
    affiliation, faith, income or identity to provide evidence.
  expected_burden: A 15-minute preparation, one 20-minute willing exchange and one small shared task.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Engagement across difference protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Engagement across difference action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    writing, an interpreter or a facilitated low-stakes conversation. A fictional exchange is appropriate
    when no willing safe partner exists. No one must disclose political affiliation, faith, income or
    identity to provide evidence.
  actions:
  - stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01-A1
    sequence: 1
    title: Name the shared task and your non-negotiable limit
    instructions: 'State what can be improved together and what agreement is not required. Identify how
      religion, politics, culture, class, age or experience may shape different concerns without assuming
      a person represents their whole group. Prepare one open question about their reason and one sentence
      stating your own conviction. Exclude situations where participation would normalize dehumanization,
      invite retaliation or force either person to defend their basic dignity.


      Observation checks: A concrete shared task is separated from ideological agreement; Differences
      are considered without making someone a group representative; An open question and your own conviction
      are prepared; Safety and dignity boundaries are explicit. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01
      action_stable_id: PRACTICE-COMP-2005-ENGAGEMENT-ACROSS-DIFFERENCE-01-A1
      competency_stable_id: '20.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
