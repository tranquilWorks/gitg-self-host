  - stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01-A3
    sequence: 3
    title: Send a factual question or test the route without submitting
    instructions: 'Prepare a brief message stating the service, the neutral question and the clarification
      requested: Which body sets these hours, and where is that decision recorded. Submit only if it is
      a genuine appropriate inquiry and record receipt or the absence of a response. Otherwise rehearse
      it and leave submission unclaimed. Update the authority map if the answer redirects you; do not
      treat a nonresponse as proof of corruption or a preferred policy’s correctness.


      Observation checks: The message asks a bounded factual question; Submission and rehearsal are distinguished;
      Receipt response or nonresponse is recorded honestly; New authority information updates the map.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Who operates, who decides, who funds and who can review this issue, and which distinction
      prevented a misdirected request?


      Examples: Supportive: The participant distinguished the service manager from the budget-setting
      body and routed a factual hours question to the correct office.


      Mixed: The first directory was outdated; an official response corrected the map and the inquiry
      was rerouted.


      Contradictory: An official was accused or pressured about a decision outside their authority based
      on an unverified social-media claim.


      Inconclusive: Government branches were memorized without locating the authority or participation
      route for an actual issue.'
    expected_time: 15-25 minutes
