  - stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01-A2
    sequence: 2
    title: Locate legitimate participation and accountability channels
    instructions: 'Find the current official route for a service question, public meeting, written submission,
      election information and a complaint or review. For the library-hours case, identify which route
      could answer the question and which would concern a broader policy change. Check deadlines, eligibility,
      accessibility and information that would become public. Do not assume that a directory listing,
      social-media account or elected title implies authority over every issue.


      Observation checks: Participation election and complaint routes are separately identified; The selected
      route matches the actual question; Current deadlines access and public-record implications are checked;
      Authority is not inferred from prominence or a social-media account. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01-A2
      competency_stable_id: '20.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
