  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The learner sends the bounded hours-record question to Cedar''s service office. The manager replies
      that ordinary schedules follow the adopted opening policy and staffing budget. The reply points
      to the council record and explains that a proposal requiring additional funded hours should follow
      the clerk''s policy-submission route. The advisory panel may recommend a change but does not approve
      the money.


      The learner updates the map and drafts a question for the clerk about the applicable submission
      process. That second question is not sent. No proposed hours change, budget approval, meeting attendance,
      vote or court review occurs. Complaint scope and current election information remain unchecked in
      the fictional case.


      Record one actual inquiry and response within the fiction, followed by one unsubmitted draft. Replace
      the cropped post''s ambiguous “board” with the distinct council and advisory-panel functions. Do
      not infer that the same allocation applies to a real library merely because its public website also
      names a board. A verified local map is needed for real transfer.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Find who can answer one public-service question and distinguish that role from who decides
      policy or approves funding. Use two twenty-five-minute source checks and a concise genuine inquiry
      or labeled rehearsal. The default asks who sets a library''s opening hours. This is civic navigation,
      not a campaign, legal representation or a promise that contacting an official will produce your
      preferred result.


      ### Authority has more than one dimension


      Government levels divide responsibilities across jurisdictions. Local, regional, national, tribal
      and other arrangements differ; do not project a familiar hierarchy onto every place. Branches are
      another distinction. In the United States federal example, legislatures make laws and exercise budget
      functions, executive agencies administer responsibilities, and courts decide legal questions in
      cases. These broad categories do not identify who controls a particular library schedule.


      Elections select some officeholders and create one route of public accountability. Other roles are
      appointed or employed. A prominent elected official may lack authority over the issue you care about.
      An advisory board may recommend changes without controlling a budget or directing staff. The important
      question is what a specific body is empowered to do, supported by an official source.


      Public finance connects policy to resources. An operator may schedule staff within an approved amount
      while a separate body decides whether to fund longer opening hours. A budget proposal, appropriation,
      operational decision and actual expenditure are different stages. A line in a proposed budget is
      not proof that the money has been approved or the service changed.


      Participation routes also have different purposes. A service desk may explain current practice;
      a clerk may receive a policy submission; an election office provides the applicable voting process;
      a complaint or review route addresses certain errors. Courts are not the default customer-service
      channel. Check the actual jurisdiction, scope, deadlines, access options and what information becomes
      public before using a route.


      A responsible inquiry asks a question the recipient can answer. It need not demand a political position
      or accuse someone. Record whether the message was drafted, sent, acknowledged, answered or redirected.
      A nonresponse does not prove corruption, and acknowledgment does not establish that the proposed
      change is adopted.


      ### Worked example from an official directory


      [Pima County''s Library Advisory Board page, S04](https://www.pima.gov/2384/Library-Advisory-Board),
      describes its mission as advisory on library policies, services, programs and operations. That supports
      identifying an advisory role. It does not by itself establish who can change a branch''s hours,
      approve every expense or resolve a legal dispute. A careful map retains those questions instead
      of converting “board” into unlimited authority. No current officeholder, meeting deadline or contact
      number needs to be memorized here.


      ### Supplied fictional service directory


      Cedar''s municipal library service operates the library. Its manager sets ordinary staffing schedules
      within the council''s adopted opening policy and budget. Cedar Council approves that policy and
      annual budget. The Library Advisory Panel makes recommendations and cannot itself appropriate funds.
      The municipal clerk receives written policy submissions. The service office answers routine operational
      questions. An official election office provides election information; no eligibility rule, deadline
      or ballot is supplied. A complaint/review procedure exists but its scope and timing have not yet
      been obtained.


      A cropped fictional post says “the board decides hours” without identifying which body. Cedar is
      invented; its directory is not a description of Pima County or any other real government. Use it
      to practice a map, then verify real authority afresh if transferring the task.


      ### Build and test the authority map


      1. Create rows for operator, policy authority, budget authority, advisory role, election information
      and complaint/review. Record level of government, source and uncertainty for each. Output: a map
      that keeps Cedar''s manager, council and panel distinct.

      2. Consult [USAGov''s federal-branch explanation, S02](https://www.usa.gov/branches-of-government),
      and [state/local directory, S03](https://www.usa.gov/state-local-governments), as United States
      examples of different functions and routing. For another location use its official sources. Output:
      one distinction the general directory helps with and one local authority question it cannot settle.

      3. Match “Where is the current hours decision recorded?” to an operational information route, and
      “What process considers funding more hours?” to the appropriate policy/budget route. Identify missing
      complaint scope, submission conditions and election details. Output: two narrowly routed questions
      without inventing powers or deadlines.

      4. Draft a concise factual inquiry identifying the service and the clarification sought. In fiction,
      keep it unsubmitted until the later packet supplies an event. In a real suitable inquiry, use the
      verified channel and protect unnecessary personal information. Output: the true contact status,
      not an assumed decision.

      5. Save the map before reading the [later packet](?resource=file-later-packet-md). Use a redirect
      to update the relevant role, not erase an authority distinction. Output: the corrected route and
      remaining unanswered questions.


      ### Support and transfer


      For support, begin with “operates, decides, funds” and add the remaining rows once those are clear.
      A reference librarian or appropriate civic-information service can help locate official records.
      For a harder fictional case, two pages disagree because one is an old proposal. Check date, decision
      status and issuing authority before choosing the convenient version.


      Real transfer should concern a genuine ordinary question. Verify current meeting or submission details
      from the responsible body, including accessibility and public-record implications. This guide does
      not submit messages, register anyone to vote or direct political choices. An accurate map and a
      relevant reply establish navigation, not effective advocacy, legal entitlement or a completed policy
      change.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A website names a library advisory board. Does that establish power to approve funding or change
      every branch''s hours?

      2. An agency acknowledges a request for longer service hours. What stages remain distinct from receipt?

      3. A general government directory is current. Does it settle a particular jurisdiction''s complaint
      deadline or your election eligibility?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Verify the specific delegated powers, operator, policy body and budget authority. “Advisory”
      may mean recommending rather than deciding. An institutional title alone cannot settle the issue.

      2. An acknowledgment records receipt. A substantive answer, policy consideration, budget approval,
      implementation and actual service change remain separate. A redirect can improve the map without
      endorsing or granting the request.

      3. No. A directory locates relevant authorities; the responsible official source must supply current
      applicable rules. Do not infer deadlines, eligibility or legal remedies from a general listing or
      import another jurisdiction''s arrangements.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
