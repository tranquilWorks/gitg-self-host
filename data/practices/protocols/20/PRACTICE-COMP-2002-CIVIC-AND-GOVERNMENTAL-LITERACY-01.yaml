meaning_and_fit:
  purpose: Distinguish levels and branches of government, service agencies, elections, courts and funding
    decisions well enough to route one civic question responsibly.
  why_recommended: Distinguish levels and branches of government, service agencies, elections, courts
    and funding decisions well enough to route one civic question responsibly.
  claims:
  - statement: Distinguish levels and branches of government, service agencies, elections, courts and
      funding decisions well enough to route one civic question responsibly.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Civic and governmental literacy practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Civic and governmental literacy as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible official contact channels, a library reference service or an
    authorized civic-information service. USAGov is a U.S. directory example, not a global authority map.
    Use the appropriate official sources for your location and do not contact officials under a false
    identity.
  opportunity_considerations: Use the question Who decides the opening hours of this public library or
    equivalent local service. Start from the service’s official website and your jurisdiction’s official
    government directory. Make a small authority map with operator, rule-maker, budget approver, election
    route, review or complaint route and date verified.
  prerequisites:
  - Use the question Who decides the opening hours of this public library or equivalent local service.
    Start from the service’s official website and your jurisdiction’s official government directory. Make
    a small authority map with operator, rule-maker, budget approver, election route, review or complaint
    route and date verified.
  dependencies: []
  safe_alternatives:
  - Use accessible official contact channels, a library reference service or an authorized civic-information
    service. USAGov is a U.S. directory example, not a global authority map. Use the appropriate official
    sources for your location and do not contact officials under a false identity.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Civic and governmental literacy differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Civic and governmental literacy
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the question Who decides the opening hours of this public library or equivalent local service.
    Start from the service’s official website and your jurisdiction’s official government directory. Make
    a small authority map with operator, rule-maker, budget approver, election route, review or complaint
    route and date verified. Goal: Distinguish levels and branches of government, service agencies, elections,
    courts and funding decisions well enough to route one civic question responsibly. Scope: This is jurisdiction-specific
    civic navigation, not legal advice, an endorsement of a party or a guarantee that an official has
    the power to grant a request. Time and effort: Two 25-minute source checks and one concise permitted
    inquiry or labeled rehearsal. Adaptation: Use accessible official contact channels, a library reference
    service or an authorized civic-information service. USAGov is a U.S. directory example, not a global
    authority map. Use the appropriate official sources for your location and do not contact officials
    under a false identity. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible official contact channels, a library reference service or an authorized
    civic-information service. USAGov is a U.S. directory example, not a global authority map. Use the
    appropriate official sources for your location and do not contact officials under a false identity.
  expected_burden: Two 25-minute source checks and one concise permitted inquiry or labeled rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Civic and governmental literacy protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Civic and governmental literacy action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    official contact channels, a library reference service or an authorized civic-information service.
    USAGov is a U.S. directory example, not a global authority map. Use the appropriate official sources
    for your location and do not contact officials under a false identity.
  actions:
  - stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01-A1
    sequence: 1
    title: Separate service operation from authority and funding
    instructions: 'Find who operates the service and identify the body that sets policy and approves its
      budget. Check whether each is local, regional, national, tribal or another relevant level rather
      than assuming a familiar structure. Note where an agency implements a decision and where an elected
      or appointed body sets it. Mark any role you cannot verify. A court may review certain disputes
      but should not be invented as the ordinary service desk.


      Observation checks: Operator policy authority and budget authority are distinguished; Government
      levels are verified in the actual jurisdiction; Elected appointed and implementing roles are not
      conflated; Unknown authority and limits of court involvement are explicit. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01
      action_stable_id: PRACTICE-COMP-2002-CIVIC-AND-GOVERNMENTAL-LITERACY-01-A1
      competency_stable_id: '20.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2002_a1_primary
      transfer_disposition: context_bound
