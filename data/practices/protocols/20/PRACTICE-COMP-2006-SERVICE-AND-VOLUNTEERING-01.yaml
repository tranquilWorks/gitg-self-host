      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. Ten files are submitted and two need correction. What can be counted before and after those same
      two files are repaired?

      2. The volunteer finishes the first unit in 42 minutes after offering 40. Should a useful output
      erase that capacity mismatch?

      3. A possible third unit is discussed but nobody accepts it. Is a sustainable recurring commitment
      established?'
    check_id: practice-answers
    attempt_mode: practice
