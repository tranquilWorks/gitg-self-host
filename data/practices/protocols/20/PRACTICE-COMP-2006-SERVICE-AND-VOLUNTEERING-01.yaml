        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Service and volunteering; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use remote, accessible, low-cost tasks or a smaller role. Without an organization and an actual
      request, complete role research and a labeled inquiry rehearsal only; do not claim community benefit.
      Follow safeguarding, training and background-check requirements where applicable.
    cultural_context:
    - Adapt the expression of Service and volunteering to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use remote, accessible, low-cost tasks or a smaller role. Without an organization and an actual
      request, complete role research and a labeled inquiry rehearsal only; do not claim community benefit.
      Follow safeguarding, training and background-check requirements where applicable.
  pause_conditions:
  - Pause Service and volunteering when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Service and volunteering practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Service and volunteering situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
