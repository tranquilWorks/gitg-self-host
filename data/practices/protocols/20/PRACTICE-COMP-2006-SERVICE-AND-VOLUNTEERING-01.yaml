meaning_and_fit:
  purpose: Choose a useful volunteer contribution from expressed community need, match it to capacity
    and deliver it reliably beyond the first enthusiastic offer.
  why_recommended: Choose a useful volunteer contribution from expressed community need, match it to capacity
    and deliver it reliably beyond the first enthusiastic offer.
  claims:
  - statement: Choose a useful volunteer contribution from expressed community need, match it to capacity
      and deliver it reliably beyond the first enthusiastic offer.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Service and volunteering practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Service and volunteering as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use remote, accessible, low-cost tasks or a smaller role. Without an organization
    and an actual request, complete role research and a labeled inquiry rehearsal only; do not claim community
    benefit. Follow safeguarding, training and background-check requirements where applicable.
  opportunity_considerations: Use an established organization’s requested low-risk task, such as preparing
    large-print event notices or organizing permitted non-sensitive supplies. Confirm the coordinator,
    role description, training, access requirements and time limit. No money, travel or vulnerable-person
    contact is required by default.
  prerequisites:
  - Use an established organization’s requested low-risk task, such as preparing large-print event notices
    or organizing permitted non-sensitive supplies. Confirm the coordinator, role description, training,
    access requirements and time limit. No money, travel or vulnerable-person contact is required by default.
  dependencies: []
  safe_alternatives:
  - Use remote, accessible, low-cost tasks or a smaller role. Without an organization and an actual request,
    complete role research and a labeled inquiry rehearsal only; do not claim community benefit. Follow
    safeguarding, training and background-check requirements where applicable.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Service and volunteering differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Service and volunteering as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an established organization’s requested low-risk task, such as preparing large-print event
    notices or organizing permitted non-sensitive supplies. Confirm the coordinator, role description,
    training, access requirements and time limit. No money, travel or vulnerable-person contact is required
    by default. Goal: Choose a useful volunteer contribution from expressed community need, match it to
    capacity and deliver it reliably beyond the first enthusiastic offer. Scope: This is a bounded service
    cycle, not permission to perform regulated care, enter private spaces, handle protected data or decide
    what a community needs without asking. Time and effort: Thirty minutes to verify fit, two agreed short
    service periods and a 15-minute review over two to four weeks. Adaptation: Use remote, accessible,
    low-cost tasks or a smaller role. Without an organization and an actual request, complete role research
    and a labeled inquiry rehearsal only; do not claim community benefit. Follow safeguarding, training
    and background-check requirements where applicable. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use remote, accessible, low-cost tasks or a smaller role. Without an organization
    and an actual request, complete role research and a labeled inquiry rehearsal only; do not claim community
    benefit. Follow safeguarding, training and background-check requirements where applicable.
  expected_burden: Thirty minutes to verify fit, two agreed short service periods and a 15-minute review
    over two to four weeks.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Service and volunteering protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Service and volunteering action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use remote,
    accessible, low-cost tasks or a smaller role. Without an organization and an actual request, complete
    role research and a labeled inquiry rehearsal only; do not claim community benefit. Follow safeguarding,
    training and background-check requirements where applicable.
  actions:
  - stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A1
    sequence: 1
    title: Verify the need before offering the solution
    instructions: 'Read the organization’s current request and ask the coordinator what useful completion
      looks like, what work is already covered and what would create extra burden. Compare the task with
      your available time, skills, access needs and foreseeable interruptions. Decline work beyond competence
      or authority and choose one modest repeatable role. Do not propose a public-facing campaign or collect
      recipients’ stories merely to make the experience feel meaningful.


      Observation checks: The task responds to a verified current request; The coordinator defines useful
      completion and constraints; Capacity competence and access are checked; Publicity and recipient
      stories are not prerequisites. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01
      action_stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A1
      competency_stable_id: '20.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2006_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2006_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_task_responds_to_a_verified_current_request
        - the_coordinator_defines_useful_completion_and_constraints
        - capacity_competence_and_access_are_checked
        - publicity_and_recipient_stories_are_not_prerequisites
      - measurement_id: c2006_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2006_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A2
    sequence: 2
    title: Deliver the first agreed unit and accept task-specific feedback
    instructions: 'Carry out the role under the organization’s instructions, ask before changing the method
      and communicate an obstacle early. At handoff, confirm the actual output and any incomplete part.
      Ask a narrow question such as Are these notices usable in the format you requested. Accept correction
      without making the coordinator manage your feelings. Record broad task status only, not recipient
      identities, photographs or confidential organizational information.


      Observation checks: One requested service unit is actually delivered; Method changes and obstacles
      are communicated appropriately; The coordinator checks usability or completion; Feedback and evidence
      protect recipient and organizational privacy. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01
      action_stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A2
      competency_stable_id: '20.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2006_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2006_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_requested_service_unit_is_actually_delivered
        - method_changes_and_obstacles_are_communicated_appropriately
        - the_coordinator_checks_usability_or_completion
        - feedback_and_evidence_protect_recipient_and_organizational_privacy
      - measurement_id: c2006_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2006_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A3
    sequence: 3
    title: Repeat once and decide whether the commitment is sustainable
    instructions: 'Complete a second agreed unit using the feedback, or give timely notice and arrange
      an accepted handoff if capacity has changed. Compare benefit, burden, reliability and the time the
      organization spent supporting you. Agree to continue, reduce or end the role with a clear final
      owner. Two visits do not prove long-term service, but an uncommunicated disappearance cannot be
      counted as a sustainable contribution.


      Observation checks: A second unit or responsible accepted handoff occurs; Feedback changes the next
      attempt; Benefit and support burden are reviewed together; Continuation reduction or closure is
      explicitly agreed. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.


      Final review: What did the organization actually gain, what did your participation cost it, and
      what commitment can you keep without relying on initial enthusiasm?


      Examples: Supportive: The volunteer produced the requested accessible notices twice, used coordinator
      feedback and accepted a sustainable monthly role.


      Mixed: The first task was useful, but the second exceeded capacity; an early accepted handoff prevented
      disruption.


      Contradictory: The volunteer ignored the requested need, created publicity about recipients or disappeared
      from an essential commitment without notice.


      Inconclusive: A cause was selected and enthusiasm recorded without a requested deliverable or actual
      service.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01
      action_stable_id: PRACTICE-COMP-2006-SERVICE-AND-VOLUNTEERING-01-A3
      competency_stable_id: '20.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2006_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2006_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_second_unit_or_responsible_accepted_handoff_occurs
        - feedback_changes_the_next_attempt
        - benefit_and_support_burden_are_reviewed_together
        - continuation_reduction_or_closure_is_explicitly_agreed
      - measurement_id: c2006_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
