      - [Chapter 8, Section 5: Developing an Action Plan](https://ctb.ku.edu/en/table-of-contents/structure/strategic-planning/develop-action-plans/main)

      - [SIFT (The Four Moves)](https://hapgood.us/2019/06/19/sift-the-four-moves/)

      - [Ostrom Design Principles](https://www.ostrom-workshop.indiana.edu/courses-teaching/teaching-tools/ostrom-design/index.html)

      - [Sustainable Materials Management: Non-Hazardous Materials and Waste Management Hierarchy](https://www.epa.gov/smm/sustainable-materials-management-non-hazardous-materials-and-waste-management-hierarchy)

      - [UNESCO Universal Declaration on Cultural Diversity](https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity)

      - [SPJ Code of Ethics](https://www.spj.org/spj-code-of-ethics/)

      - [Disclosure Standards](https://aapor.org/standards-and-ethics/disclosure-standards/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Priya submits ten notices on 5 October after thirty minutes. Sam spends six minutes checking them
      and identifies two incorrect contact lines; eight are initially usable. Priya corrects the two within
      twelve additional minutes, and Sam accepts all ten. Those two corrections do not create twelve distinct
      notices. Priya''s total forty-two minutes exceed the offered forty by two.


      On 19 October Priya uses a public-facts check before handoff, completes ten notices in thirty-five
      minutes and submits them. Sam''s four-minute review finds all ten usable. Twenty distinct notices
      have now been accepted across the two dates. Sam spent ten minutes on the two stated reviews; the
      packet supplies no duration for any additional initial instruction or later communication.


      Priya and Sam agree to discuss a smaller future unit, but no recurring role or third unit is accepted.
      Record the two completed units, corrected error, first-period overrun and known versus unknown support
      burden. These results show fictional repetition and improvement, not established long-term service
      or a requirement to keep volunteering despite limited capacity.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Complete one requested service unit, use task-specific feedback and repeat once within your
      capacity. Allow thirty minutes to check fit, two agreed short service periods over two to four weeks,
      and fifteen minutes to review. Use the supplied fictional organization if there is no actual request
      and appropriate role. Enthusiasm is a starting condition, not evidence of community benefit.


      ### Begin with a need the community recognizes


      A cause you care about is not yet a useful task. Ask the organization what work is needed, what
      is already covered and what output it can use. Extra publicity, surprise donations or a new project
      may create more work than they remove. The people receiving or coordinating service should not have
      to perform gratitude to make the contribution meaningful.


      A suitable role fits competence, time, access, resources and likely interruptions. Identify the
      coordinator and the actual limits before agreeing. Some work requires training, safeguarding checks
      or legal authorization; a volunteer label supplies none of these. Choose an ordinary task such as
      preparing non-sensitive notices when that is actually requested. No vulnerable-person contact, travel,
      money or regulated care is required by this guide.


      Clear expectations describe the output, method, available materials, support route and handoff.
      They also leave room to raise an obstacle or stop a role responsibly. Volunteering remains voluntary;
      this exercise does not create an employment contract or a legal service obligation. Existing organizational
      and local requirements must be followed through the appropriate process.


      Benefit and burden should be examined together. Ten files may look productive but still require
      the coordinator to correct every date. A helper''s hours are not the same as usable outputs. Record
      errors, revisions, support time and what the organization actually accepts. Avoid hiding learning
      costs, while recognizing that reasonable training can be a legitimate investment rather than a failure.


      Sustainability appears across repeated commitments and responsible changes, not simply the first
      enthusiastic visit. If capacity changes, communicate early and seek an accepted handoff or a smaller
      scope. Do not quietly assign a replacement or disappear from an essential responsibility. Continuing,
      reducing and ending can each be appropriate when the final task and owner are clear.


      ### Worked example


      A volunteer wants to design a campaign, but a coordinator needs ten large-print event notices using
      verified public information. The volunteer accepts the smaller task. Two notices initially have
      a wrong contact line and cannot be counted as usable. Correcting those files and improving the next
      attempt is a more honest contribution than reporting “ten delivered” while leaving the repair with
      staff.


      ### Supplied fictional role


      Cedar Community Hub asks Priya to prepare ten notices on 5 October and ten on 19 October using its
      supplied template and public event facts. Coordinator Sam will check usability. Priya offers at
      most forty minutes per unit and has permission to edit these notices only. No recipient stories,
      private records, publication rights or broader campaign role are included.


      The supplied four-line template is: **title / date and time / place / public questions contact**,
      using 18-point type for this fictional role. Actual users may need a different format; the chosen
      size is not universal access certification. For the 5 October unit, make ten identical copies of:
      **Repair Stories / 12 October, 14:00–15:00 / Cedar Hub, Room A / Hub Event Desk**. For the 19 October
      unit, make ten identical copies of: **Local History Hour / 26 October, 14:00–15:00 / Cedar Hub,
      Room A / Hub Event Desk**. The desk name is a fictional public label, not a real address. Ten copies
      are ten requested notices, not ten different events. Keep them for coordinator handoff; no real
      publication is requested. Other event details are unknown.


      The accepted standard is correct date, place and public contact information in the specified large-print
      format. Sam supplies the template and instructions through the ordinary channel. Priya should raise
      uncertainty before inventing details and should identify unfinished items at handoff. The fictional
      dates and quantities are teaching inputs, not an actual volunteering opportunity.


      ### Deliver twice and account for the support needed


      1. Check the requested need, useful endpoint, role boundaries and support route. Compare both dates
      with actual capacity and foreseeable interruptions. Output: an explicitly accepted bounded role
      or an honest decision to decline, not a heroic promise of unlimited availability.

      2. Prepare the first unit using the supplied materials. Ask before changing the method. At handoff
      identify the number submitted and any known incomplete part. Output: submitted work and actual time,
      with usability awaiting the coordinator''s response where not yet known.

      3. Receive the specific correction without making the coordinator reassure you. Repair only the
      authorized items and distinguish initial usable output from final accepted output. Output: an error-and-correction
      record that does not double-count corrected files as new notices.

      4. Carry the lesson into the second agreed unit, or communicate an inability early and seek a properly
      accepted handoff. Output: what actually happened at the second opportunity, including support burden
      and remaining work.

      5. Save your expectation before the [later packet](?resource=file-later-packet-md). Review benefit,
      reliability, time and coordinator effort. Agree to continue, reduce or close the role with the relevant
      owner. Output: a sustainable next status, not an assumed recurring commitment.


      ### Support and transfer


      For support, start with a smaller requested unit and an accessible written or spoken role description.
      For a harder fictional case, the second date conflicts with another obligation: a timely accepted
      replacement may preserve service, while an unanswered request for help does not. Do not let completion
      pressure turn a voluntary task into an unsafe or unqualified role.


      For real transfer, follow the organization''s current onboarding and task instructions. Keep recipient
      identities, photographs and confidential information out of app evidence. Record broad output and
      handoff status instead. Two units can demonstrate an initial repeat and response to feedback; longer-term
      service requires later evidence. A role inquiry or rehearsal alone cannot establish a tangible community
      benefit.


      ### Source limits


      [NCVO''s role-description guidance, S08](https://www.ncvo.org.uk/help-and-guidance/involving-volunteers/planning-for-volunteers/writing-volunteer-role-descriptions/),
      explains tasks, boundaries, access needs, support and a balanced voluntary experience. Its page
      was reviewed in April 2021 and has an England context; its employment-law discussion is not transferred
      to another jurisdiction. The notice quantities, dates, correction and repetition are original case
      design. No volunteering-effect estimate or universal required commitment is claimed.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
