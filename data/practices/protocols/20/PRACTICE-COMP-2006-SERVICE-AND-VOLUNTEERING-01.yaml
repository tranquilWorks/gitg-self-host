      and acceptance separate.

      2. No. The two-minute overrun is relevant to a sustainable role even though the work became useful.
      Review scope, method and support burden without hiding the mismatch or treating a voluntary role
      as unlimited duty.

      3. No. Two completed units show initial repetition, while discussion is not a future commitment.
