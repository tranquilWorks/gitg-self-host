  - c2006_a3_adverse
  adverse_or_contradictory_indicators:
  - The volunteer ignored the requested need, created publicity about recipients or disappeared from an
    essential commitment without notice.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Service and volunteering explicitly; support can enable access and never reduces dignity or silently
    changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Service and volunteering context, action,
    role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Service and volunteering observation requires a distinct immutable origin; duplicate
    origins are rejected and later repetitions use the typed contract's explicit diminishing multipliers.
  recency_rule: Generated Service and volunteering rules withhold observations older than 90 days; no
    unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Verify the need before offering the solution. Observed checks: The task
    responds to a verified current request; The coordinator defines useful completion and constraints;
    Capacity competence and access are checked; Publicity and recipient stories are not prerequisites.
    Action 2: Deliver the first agreed unit and accept task-specific feedback. Observed checks: One requested
    service unit is actually delivered; Method changes and obstacles are communicated appropriately; The
    coordinator checks usability or completion; Feedback and evidence protect recipient and organizational
    privacy. Action 3: Repeat once and decide whether the commitment is sustainable. Observed checks:
    A second unit or responsible accepted handoff occurs; Feedback changes the next attempt; Benefit and
    support burden are reviewed together; Continuation reduction or closure is explicitly agreed.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A cause was selected and enthusiasm recorded without
    a requested deliverable or actual service.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Service
    and volunteering contribution under typed evaluation; protocol performance remains distinct and is
    never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L10
  - L24
  - L26
  - L30
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Service and volunteering evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
