  - stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01-A3
    sequence: 3
    title: Add dissent, correction and a limited trial
    instructions: 'Revise the norm to explain how a person can question it, seek an accommodation or challenge
      inconsistent enforcement. In an authorized willing group, trial one ordinary booking or discussion
      under the norm and ask what it missed; otherwise rehearse the case only. Record unresolved disagreements
      openly and set a review date. Do not claim peaceful coexistence because nobody objected in a setting
      where objection may be costly.


      Observation checks: Dissent accommodation and review routes are explicit; A live trial or labeled
      rehearsal occurs; Unresolved disagreement remains visible; Silence is not treated as freely given
      consensus. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which rule enabled cooperation without belief conformity, and could the least powerful
      participant challenge its use safely?


      Examples: Supportive: The group used one booking rule across viewpoints, accommodated an access
      need and kept a review route for disputed enforcement.


      Mixed: The rule sounded neutral but favored one schedule; the case test exposed the issue and led
      to a revision.


      Contradictory: A preferred ideology became a condition of ordinary participation, or harassment
      was excused as mere disagreement.


      Inconclusive: Tolerance was endorsed without a tested conduct rule, dissent route or enforcement
      limit.'
    expected_time: 15-25 minutes
    due_within_days: 10
