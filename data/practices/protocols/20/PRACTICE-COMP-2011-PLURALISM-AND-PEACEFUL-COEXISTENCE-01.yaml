  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not an adopted policy or actual community outcome.


      The revised draft removes ideological endorsement and replaces the vague offense condition with
      relevant conduct limits, reasons and review by the hall''s designated owner through an accessible
      written channel. Targeted harassment still goes to the responsible safety route; no learner investigates
      or decides its final disposition.


      Requests can arrive at the desk or through an equivalent written channel before the same decision
      deadline. For the fictional scheduling conflict, the applicants are first offered another available
      time. If neither accepts, the draft proposes a disclosed random draw among equally eligible requests,
      with owner review of procedure. In this case one applicant accepts the alternative, so no draw is
      performed. An access request is accommodated through the written channel without a demand for private
      history.


      The disliked-view applicant completes an ordinary paper booking under the same quiet-use and capacity
      conditions. The exercise contains no actual room use. One participant continues to disagree with
      the organizer''s views and the tie-break proposal; that dissent is recorded without blocking the
      uncontested booking. No consensus, legal compliance, resolved harassment or long-term coexistence
      is established. The draft remains subject to actual owner and affected-user review.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Draft a small shared-use rule, test it against disagreement and access needs, and revise it.
      Allow twenty minutes to draft, twenty minutes for case testing and a short revision. Use a shared
      reading room or the supplied fiction. The objective is cooperation on a common good while preserving
      deep differences, not agreement on a worldview.


      ### Make room for difference without abandoning limits


      Pluralism asks how people can use a shared institution when they disagree about important matters.
      It does not require liking every belief, treating every claim as true or joining every association.
      A rule should identify a legitimate common purpose and explain which conduct matters to that purpose.
      A quiet reading room can limit disruptive noise without requiring users to endorse its organizer''s
      religion or politics.


      Separate belief, expression, conduct and harm carefully. Disliking a viewpoint is not by itself
      evidence of a safety threat. At the same time, targeted intimidation or harassment does not become
      acceptable simply because someone calls it a cultural or political belief. Examine the actual conduct,
      applicable authority and proportionate response. Serious safety and legal questions belong with
      the proper responsible people; this exercise is not an adjudication of a live dispute.


      A useful rule states purpose, access, permitted and prohibited conduct, who decides, how reasons
      are communicated and how a decision can be questioned. Vague requirements such as “good values”
      or “no offense” let preference stand in for a public reason. Specify the observable interference
      that matters and keep the response connected to it. A review route should be accessible and should
      not force someone to confront a threatening person.


      Check apparently neutral procedures for hidden advantages. A first-come booking window available
      only during ordinary work hours may favor people free at that time. An alternative request channel
      can improve access without promising every preference can be satisfied. Decide scheduling conflicts
      through a stated, reviewable procedure rather than agreement with one applicant''s views. Consider
      access needs without asking for unnecessary private details.


      Try an identity swap. Would the same relevant conduct receive the same response if it came from
      a favored or disliked group? Equal treatment does not always mean identical arrangements: a reasonable
      access adjustment can enable the same meaningful opportunity. Explain why the difference is relevant.
      Avoid using the swap to erase actual differences in conduct, safety evidence or need.


      Cooperation does not erase dissent. People can follow a room-use rule while criticizing it, maintain
      their convictions or decline participation. Silence is not consent, and an uncontested trial is
      not evidence that everyone feels safe or represented. Record unresolved objections and a revision
      route. Common goods can support coexistence without requiring total ideological conformity or excusing
      dehumanization.


      ### Worked example


      A draft allows room booking only by people who endorse the organizers'' statement of values. The
      room''s stated purpose is ordinary quiet reading, and no connection between endorsement and safe
      use is supplied. The authors remove that condition, retain conduct and capacity rules, and add a
      review route. They do not require anyone to praise a disliked opinion or ignore targeted harassment.


      ### Supplied fictional case


      Cedar Hall offers a reading room with capacity ten for ordinary quiet reading. The owner asks for
      a draft shared-use norm and a paper trial, not an enforceable legal policy. The initial draft says
      requests must arrive at the desk between 10:00 and 11:00 on weekdays, accepted users must agree
      with the organizer''s views, and the organizer can exclude anyone who causes offense. There is no
      stated review process.


      Test four fictional situations: an ordinary reading request by someone with a disliked opinion and
      no disruptive conduct; two requests for the same time; a person unable to use the one-hour daytime
      request window; and targeted harassment that the designated responsible person must address. No
      threat details or actual protected characteristics are needed. Do not invent local law or treat
      all four cases as equivalent.


      ### Build and challenge a workable norm


      1. State the common purpose and legitimate authority. Identify which initial conditions concern
      conduct and which demand agreement or grant unchecked discretion. Output: a diagnosis tied to room
      use, not personal approval.

      2. Draft a short rule covering access, quiet conduct, capacity, scheduling, reasons and a safe review
      route. Offer an equivalent written request channel outside the narrow desk window, with the same
      published decision window for all requests. Output: a rule people can understand without disclosing
      beliefs.

      3. Apply it separately to all four cases. Resolve the scheduling case using a stated fair method,
      consider the access request, and refer targeted harassment through the responsible route. Output:
      reasons and next steps, without a learner-issued legal verdict.

      4. Swap favored and disliked identities while preserving relevant conduct and need. Remove inconsistent
      standards, but keep justified access adjustments and safety boundaries. Output: a revised rule with
      recorded dissent and review options.

      5. Open the [later packet](?resource=file-later-packet-md) and perform one ordinary paper booking
      trial. Output: a bounded cooperation result and explicit limits on claims about consensus, safety
      and long-term coexistence.


      ### Support and transfer


      For support, work through one case at a time and explain the reason aloud. Use an accessible rule
      card, assistance or extra time. For a harder case, both applicants reject the initial tie-break.
      Offer a review before implementation rather than forcing a false agreement or pretending the organizer
      has unlimited power.


      A real shared-use change needs the owner''s authority, affected people''s input and applicable local
      guidance. Do not test a rule by provoking hostility or staging harassment. Private fiction and declining
      participation are valid. Transfer the purpose-conduct-reason-review structure to another low-risk
      shared space, checking its distinct needs and authority. One fictional booking does not establish
      peaceful coexistence in an actual community.


      ### Source use


      [UNESCO''s declaration, S14](https://www.unesco.org/en/legal-affairs/unesco-universal-declaration-cultural-diversity),
      links plural participation with coexistence and limits cultural justifications that infringe human
      rights. [The UDHR reproduction, S05](https://www.coe.int/en/web/compass/the-universal-declaration-of-human-rights-full-version-),
      supplies general dignity and rights principles. These narrow conceptual sources are not local legal
      tests or proof that the invented room rule will work. The four cases and revision are original.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Can a quiet reading room require ideological endorsement merely because its organizer strongly
      dislikes some applicants'' views?

      2. Is an identical one-hour daytime request window necessarily fair access, and does a different
      accessible channel necessarily show favoritism?

      3. A paper booking succeeds while one participant still disagrees and a harassment issue remains
      with the responsible route. What does the trial establish?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The supplied common purpose does not justify that condition. Use relevant conduct, capacity
      and access criteria, reasons and review. This reasoning is not a universal legal ruling about every
      association or venue. Protect dissent while retaining proportionate boundaries on harmful conduct.

      2. Neither conclusion follows. Examine whether the procedure unnecessarily excludes users and whether
      an equivalent channel enables the same opportunity under a common decision process. Apply identity
      swaps without erasing relevant needs.

      3. It establishes a bounded fictional procedure and uncontested paper booking, with dissent preserved.
      It does not establish real room use, consensus, legal compliance, resolved harassment or lasting
      peaceful coexistence. Silence would not establish acceptance either.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
