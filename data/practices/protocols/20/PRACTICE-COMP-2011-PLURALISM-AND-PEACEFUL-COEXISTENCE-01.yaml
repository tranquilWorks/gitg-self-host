        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01-A2
    sequence: 2
    title: Test three disagreements and one harmful behavior
    instructions: 'Apply the norm to a disliked opinion expressed within the room’s purpose, a scheduling
      conflict, an access request and targeted harassment. For each, identify the relevant conduct, who
      decides and a proportionate response. Swap group identities to check consistency. Preserve a boundary
      against dehumanization without treating ordinary disagreement as harassment, and preserve legitimate
      safety limits without using safety as an unexplained excuse to exclude a disliked group.


      Observation checks: Four distinct cases are tested; Relevant conduct authority and response are
      stated; Identity swapping checks consistency; Disagreement and targeted harm are not conflated.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01
      action_stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01-A2
      competency_stable_id: '20.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
