meaning_and_fit:
  purpose: Create and test a fair participation norm that protects coexistence and common goods without
    requiring ideological conformity or tolerating dehumanization.
  why_recommended: Create and test a fair participation norm that protects coexistence and common goods
    without requiring ideological conformity or tolerating dehumanization.
  claims:
  - statement: Create and test a fair participation norm that protects coexistence and common goods without
      requiring ideological conformity or tolerating dehumanization.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Pluralism and peaceful coexistence practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Pluralism and peaceful coexistence as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible formats and a facilitator when needed. People may decline discussion
    without penalty. Real discrimination, legal rights or safety disputes require appropriate qualified
    processes rather than this small-group norm exercise.
  opportunity_considerations: Use a shared reading room where participants differ in religion and politics
    but need quiet access, clear booking and respectful discussion. Prepare a one-page norm covering purpose,
    permitted conduct, prohibited harm, decision authority, dissent, enforcement and review. Use neutral
    fictional participants for testing.
  prerequisites:
  - Use a shared reading room where participants differ in religion and politics but need quiet access,
    clear booking and respectful discussion. Prepare a one-page norm covering purpose, permitted conduct,
    prohibited harm, decision authority, dissent, enforcement and review. Use neutral fictional participants
    for testing.
  dependencies: []
  safe_alternatives:
  - Use accessible formats and a facilitator when needed. People may decline discussion without penalty.
    Real discrimination, legal rights or safety disputes require appropriate qualified processes rather
    than this small-group norm exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Pluralism and peaceful coexistence differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Pluralism and peaceful coexistence
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a shared reading room where participants differ in religion and politics but need quiet
    access, clear booking and respectful discussion. Prepare a one-page norm covering purpose, permitted
    conduct, prohibited harm, decision authority, dissent, enforcement and review. Use neutral fictional
    participants for testing. Goal: Create and test a fair participation norm that protects coexistence
    and common goods without requiring ideological conformity or tolerating dehumanization. Scope: Use
    a fictional or authorized low-stakes group. This does not decide constitutional rights, compel association
    or require anyone to debate their dignity. Time and effort: Twenty minutes of drafting, one 20-minute
    case test and a short revision. Adaptation: Use accessible formats and a facilitator when needed.
    People may decline discussion without penalty. Real discrimination, legal rights or safety disputes
    require appropriate qualified processes rather than this small-group norm exercise. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible formats and a facilitator when needed. People may decline discussion
    without penalty. Real discrimination, legal rights or safety disputes require appropriate qualified
    processes rather than this small-group norm exercise.
  expected_burden: Twenty minutes of drafting, one 20-minute case test and a short revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Pluralism and peaceful coexistence protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Pluralism and peaceful coexistence action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    formats and a facilitator when needed. People may decline discussion without penalty. Real discrimination,
    legal rights or safety disputes require appropriate qualified processes rather than this small-group
    norm exercise.
  actions:
  - stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01-A1
    sequence: 1
    title: Distinguish a common rule from a shared belief
    instructions: 'State the common good the room exists to serve and list the conduct needed for it:
      fair booking, accessible information and no harassment. Separately identify beliefs people may disagree
      about without losing access under the proposed norm. Ask whether the rule quietly privileges one
      group’s language, schedule or custom and what legitimate accommodation could help. Do not confuse
      pluralism with requiring every participant to endorse every view.


      Observation checks: The common purpose is concrete; Conduct rules and beliefs are separated; Hidden
      advantages and accommodation needs are considered; Agreement with every worldview is not required.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01
      action_stable_id: PRACTICE-COMP-2011-PLURALISM-AND-PEACEFUL-COEXISTENCE-01-A1
      competency_stable_id: '20.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2011_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2011_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_common_purpose_is_concrete
        - conduct_rules_and_beliefs_are_separated
        - hidden_advantages_and_accommodation_needs_are_considered
        - agreement_with_every_worldview_is_not_required
      - measurement_id: c2011_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
