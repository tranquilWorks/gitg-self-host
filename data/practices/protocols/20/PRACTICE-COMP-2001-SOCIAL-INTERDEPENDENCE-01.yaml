  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      On 9 October Alex brings the book to the fictional desk and reports the loose page. The receiving
      staff member accepts the return and logs the damage for the appropriate review. Alex does not repair
      the page or bring the unrequested donation. The return is one day before the supplied due date.


      A public service note clarifies that maintaining the digital catalog is ongoing work. Alex removes
      the assumption that an online record requires no maintenance. The note does not supply a cost, energy
      figure or anyone''s pay. The six-branch map keeps those quantities unknown and recognizes the earlier
      collection as an inherited benefit.


      No repair, replacement purchase, environmental saving or later borrowing outcome is reported. Credit
      the timely accepted return, useful damage report and corrected assumption. Preserve the library''s
      own responsibility for repair decisions and accessible service. This action does not pay off an
      unlimited debt, excuse an unfair policy or establish that the whole service is well governed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Trace one ordinary benefit through the people and systems that make it possible, then complete
      a proportionate reciprocal action. Allow two twenty-minute sessions and one small action within
      a week. Use borrowing a library book or the supplied fiction. The aim is to recognize dependencies
      and responsibilities, not calculate your moral debt or require spending, unpaid work or public gratitude.


      ### See the system behind the encounter


      The visible transaction is rarely the whole service. A book on a shelf depends on acquisition, cataloging,
      storage, a way to find it, rules for access and people maintaining that arrangement. Paying a fee,
      paying taxes or returning the book is a contribution, but it does not mean you personally produced
      every benefit. Earlier work can remain useful long after the people who performed it have left.


      Trace six kinds of dependence. Infrastructure includes buildings, power, transport and digital systems.
      Labor includes visible assistance and less visible selection, repair, cleaning and administration.
      Law and rules establish authority, responsibilities and access conditions; a policy is not necessarily
      a statute. Knowledge includes authorship, cataloging methods and accumulated practical understanding.
      Environment includes materials, energy and the conditions supporting the service, although a precise
      footprint requires evidence. Inherited institutions include practices and assets that earlier generations
      built and maintained.


      A map becomes informative when it distinguishes support from speculation. Seeing a volunteer badge
      does not tell you how every worker is paid. A free digital catalog still needs maintenance, but
      its cost cannot be invented from that observation. Mark the source of each entry and preserve unknowns.
      Public documents and ordinary use are enough; do not observe workers covertly, collect their names
      or ask them to justify their jobs.


      Reciprocity is a reasoned response to shared benefit. Returning an item through the correct route
      can protect another person''s access. Reporting damage can help a steward decide what to repair.
      An unsolicited donation may instead create sorting, storage or disposal work. Ask whether a contribution
      is wanted and whether its burden fits both your capacity and the receiving system.


      Individual and institutional responsibilities differ. A user should handle an item responsibly;
      the institution still needs fair access, adequate staffing and sound maintenance. Gratitude does
      not excuse unsafe work or make an inaccessible service the user''s fault. Criticism can be compatible
      with responsible participation. Neither receiving help nor having limited capacity reduces someone''s
      dignity.


      ### Worked example


      A reader thinks the service consists of a staff member handing over a book. Their trace adds the
      catalog record, purchasing decision, shared building and earlier preservation work. They offer a
      box of unwanted books, then learn that donations are not currently requested. They instead return
      the borrowed item properly and report a loose page. The second action fits an actual need without
      making the staff sort a surprise delivery.


      ### Supplied fictional case


      Cedar Community Library lends Alex one book. The fictional service note says that the book was acquired
      from its materials budget, staff maintain the catalog, the building and digital system support access,
      and the local borrowing policy asks users to report damage at the desk. A preserved collection from
      earlier years is still used. The book''s paper source, energy use and individual workers'' pay are
      not supplied.


      Alex notices a loose page during ordinary use. The due date is 10 October. The note asks that damaged
      items be brought to the desk rather than repaired by a borrower. It also says unrequested donations
      are not currently accepted. Alex can return the book on 9 October but has no repair role. No real
      institution or worker is described by these invented facts.


      ### Make a dependency-to-responsibility trace


      1. Put the borrowed book at the center of a small map. Add the six branches and place a supplied
      fact or explicit unknown on each. Distinguish the paper''s unknown origin from the observed material
      object. Output: a sourced trace, not a list of people you assume are responsible.

      2. Separate Alex''s own effort from the inherited resources and ongoing work received. Identify
      one benefit that would disappear if its support stopped. Output: a short explanation of dependence
      without implying that one worker or user carries the whole system.

      3. Compare returning/reporting, attempting a repair and bringing an unsolicited donation. Consider
      actual permission, likely usefulness and receiving burden. Output: one bounded reciprocal action
      and one institutional obligation that remains with the library.

      4. Rehearse or perform the permitted return and report through the proper route. Check what endpoint
      occurred: handed over, accepted, logged or repaired. These are different states. Output: the actual
      action and acknowledgment, with no employee photograph or private record required.

      5. Save your map before the [later packet](?resource=file-later-packet-md). Revise one unsupported
      assumption and state what the action can reasonably show. Output: a changed understanding and a
      modest contribution claim, without claiming system-wide improvement.


      ### Support and transfer


      For support, begin with the visible book and trace only one connection at a time until all six branches
      have either evidence or an unknown. An oral explanation or accessible diagram can replace writing.
      For a harder fictional case, the easiest personal action transfers extra work to already busy staff.
      Compare whether a smaller requested action is more useful, and identify a policy question that cannot
      be solved by individual helpfulness.


      Real transfer can use transit, a shared utility or a public knowledge resource. Check the service''s
      actual rules and your authority; do not touch infrastructure or edit records to create evidence.
      A fictional trace develops explanation but cannot establish an actual contribution. A completed
      return shows responsible use in that instance, not the fairness, environmental performance or resilience
      of the whole institution.


      ### Source use


      [The IFLA-UNESCO manifesto overview, S01](https://www.ifla.org/public-library-manifesto/), situates
      public libraries as institutions supporting education, culture and information and describes their
      evolving mission. The six-branch trace and Cedar case are original teaching applications. The overview
      supplies no local budget, employment facts, donation rule or environmental measurement; all such
      case details are explicitly fictional or unknown.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A reader paid a membership fee. Does that mean the service''s infrastructure, accumulated knowledge
      and earlier work were all personally produced by that reader?

      2. A donation would make the donor feel useful, but the service says it cannot accept it. What should
      govern the reciprocal action?

      3. Staff accepted a damaged book and logged the issue. What can be claimed about repair and environmental
      benefit?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Payment is a contribution, not proof of self-sufficiency. Trace the distinct supports
      and inherited benefits, while keeping the user''s and institution''s responsibilities proportionate.
      Receiving a benefit does not create unlimited debt.

      2. The receiving system''s actual need, permission and burden matter. Choose a requested feasible
      action or refrain; do not impose sorting or disposal work to obtain a sense of generosity. Legitimate
      criticism remains possible alongside reciprocity.

      3. The return and report were accepted. Repair, future availability and environmental effects remain
      unreported. State the endpoint precisely and leave institutional decisions with the proper steward.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
