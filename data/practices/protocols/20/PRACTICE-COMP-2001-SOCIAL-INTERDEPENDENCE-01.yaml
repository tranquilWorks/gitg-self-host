meaning_and_fit:
  purpose: Recognize the interdependent work behind an everyday benefit and choose a proportionate reciprocal
    contribution rather than treating access as entirely self-created.
  why_recommended: Recognize the interdependent work behind an everyday benefit and choose a proportionate
    reciprocal contribution rather than treating access as entirely self-created.
  claims:
  - statement: Recognize the interdependent work behind an everyday benefit and choose a proportionate
      reciprocal contribution rather than treating access as entirely self-created.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Social interdependence practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Social interdependence as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Trace a shared online knowledge resource, transit service or household utility
    when a library is inaccessible. A fictional trace practices analysis but does not establish a real
    contribution. No spending, unpaid work or disclosure beyond your capacity is required.
  opportunity_considerations: 'Use borrowing a public or community-library book as the default, or a familiar
    shared service. On paper draw the benefit in the center and six branches: physical infrastructure,
    labor, rules, knowledge, environment and inherited institution. Use public information and ordinary
    observation, not staff surveillance.'
  prerequisites:
  - 'Use borrowing a public or community-library book as the default, or a familiar shared service. On
    paper draw the benefit in the center and six branches: physical infrastructure, labor, rules, knowledge,
    environment and inherited institution. Use public information and ordinary observation, not staff
    surveillance.'
  dependencies: []
  safe_alternatives:
  - Trace a shared online knowledge resource, transit service or household utility when a library is inaccessible.
    A fictional trace practices analysis but does not establish a real contribution. No spending, unpaid
    work or disclosure beyond your capacity is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Social interdependence differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Social interdependence as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use borrowing a public or community-library book as the default, or a familiar shared service.
    On paper draw the benefit in the center and six branches: physical infrastructure, labor, rules, knowledge,
    environment and inherited institution. Use public information and ordinary observation, not staff
    surveillance. Goal: Recognize the interdependent work behind an everyday benefit and choose a proportionate
    reciprocal contribution rather than treating access as entirely self-created. Scope: A dependency
    trace is an inquiry into one shared system, not a complete economic account or a claim that receiving
    a benefit creates unlimited personal debt. Time and effort: Two 20-minute tracing sessions and one
    small permitted contribution over a week. Adaptation: Trace a shared online knowledge resource, transit
    service or household utility when a library is inaccessible. A fictional trace practices analysis
    but does not establish a real contribution. No spending, unpaid work or disclosure beyond your capacity
    is required. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Trace a shared online knowledge resource, transit service or household utility
    when a library is inaccessible. A fictional trace practices analysis but does not establish a real
    contribution. No spending, unpaid work or disclosure beyond your capacity is required.
  expected_burden: Two 20-minute tracing sessions and one small permitted contribution over a week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Social interdependence protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Social interdependence action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Trace a shared
    online knowledge resource, transit service or household utility when a library is inaccessible. A
    fictional trace practices analysis but does not establish a real contribution. No spending, unpaid
    work or disclosure beyond your capacity is required.
  actions:
  - stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01-A1
    sequence: 1
    title: Follow the benefit beyond its visible front desk
    instructions: 'Trace how the book reaches the reader: acquisition, cataloging, storage, access rules,
      staff or volunteer work, the building or digital system and the resources used to keep it available.
      Give each of the six branches one supported example or an explicit unknown. Distinguish your direct
      payment or effort from benefits inherited from earlier work. Do not infer that an unseen worker
      is unpaid, mistreated or unnecessary without evidence.


      Observation checks: All six dependency branches have supported entries or unknowns; Visible service
      and behind-the-scenes labor are distinguished; Personal contribution and inherited benefit are separated;
      No unsupported allegation about workers is made. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01
      action_stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01-A1
      competency_stable_id: '20.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2001_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2001_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_six_dependency_branches_have_supported_entries_or_unknowns
        - visible_service_and_behind_the_scenes_labor_are_distinguished
        - personal_contribution_and_inherited_benefit_are_separated
        - no_unsupported_allegation_about_workers_is_made
      - measurement_id: c2001_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2001_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01-A2
    sequence: 2
    title: Identify a reciprocal obligation that fits your actual role
    instructions: 'Ask which action would help keep this shared benefit usable: return on time, report
      a damaged item through the proper route, follow borrowing rules or offer a requested volunteer task.
      Compare its benefit with the burden it places on staff and other users. Choose one action you can
      actually perform, and name a larger institutional responsibility that cannot fairly be shifted to
      an individual user. Gratitude is not a reason to excuse unsafe labor or inaccessible design.


      Observation checks: The contribution responds to a real system need; Burden on workers and other
      users is considered; Individual and institutional responsibilities remain distinct; Gratitude does
      not erase legitimate criticism. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01
      action_stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01-A2
      competency_stable_id: '20.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2001_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2001_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_contribution_responds_to_a_real_system_need
        - burden_on_workers_and_other_users_is_considered
        - individual_and_institutional_responsibilities_remain_distinct
        - gratitude_does_not_erase_legitimate_criticism
      - measurement_id: c2001_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2001_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01-A3
    sequence: 3
    title: Make the contribution and check its effect
    instructions: 'Carry out the permitted action and confirm the relevant endpoint, such as a returned
      item being accepted or a maintenance report reaching the responsible channel. Record what you did
      and what remains uncertain about its benefit. Revise one assumption from the original dependency
      map. Do not collect praise, photographs of workers or recipients’ personal details as proof; the
      exercise concerns responsible participation in a shared system.


      Observation checks: One permitted reciprocal action is performed; Its handoff or endpoint is checked;
      An assumption in the dependency map is revised or retained with a reason; Praise and private personal
      information are not required evidence. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which unseen dependency changed your sense of responsibility, and which obligation
      properly belongs to an institution rather than to you alone?


      Examples: Supportive: The reader traced cataloging and maintenance work, returned a damaged book
      with a clear report and recognized an unresolved accessibility responsibility.


      Mixed: The trace was useful, but the proposed donation would have created sorting work; the participant
      asked what was needed instead.


      Contradictory: The exercise became a claim that beneficiaries owe unlimited labor or must accept
      unfair treatment without complaint.


      Inconclusive: A list of people to thank was made without tracing a system or completing a reciprocal
      action.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01
      action_stable_id: PRACTICE-COMP-2001-SOCIAL-INTERDEPENDENCE-01-A3
      competency_stable_id: '20.01'
