meaning_and_fit:
  purpose: Compare individual choices and structural conditions as testable explanations of an observed
    opportunity gap, then identify a proportionate information or design response.
  why_recommended: Compare individual choices and structural conditions as testable explanations of an
    observed opportunity gap, then identify a proportionate information or design response.
