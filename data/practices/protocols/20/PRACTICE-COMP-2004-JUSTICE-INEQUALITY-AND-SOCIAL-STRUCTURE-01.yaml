        expected: true
  - stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01-A2
    sequence: 2
    title: Ask what evidence could distinguish the mechanisms
    instructions: 'For each of three plausible mechanisms, specify a respectful information source: a
      voluntary anonymous access question, the actual transit timetable or an accessibility audit with
      permission. Identify what the source cannot show and how incentives might bias the response, such
      as people fearing blame for a missed event. Do not request sensitive demographic information merely
      because the curriculum lists a category. Include a competing explanation that could remain true
      even if an access barrier is removed.


      Observation checks: Three mechanisms have distinct evidence routes; Privacy voluntariness and response
      incentives are considered; Unnecessary sensitive data collection is avoided; A competing explanation
      survives the preferred account. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01
      action_stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01-A2
      competency_stable_id: '20.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
