intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional free evening workshop: 40 people expressed interest, 20 attended, and the venue
    required stairs, two bus changes and an online signup. No participant demographic data are supplied.
    Make columns for observed outcome, possible mechanism, missing evidence, affected people and possible
    change. Goal: Compare individual choices and structural conditions as testable explanations of an
    observed opportunity gap, then identify a proportionate information or design response. Scope: The
    supplied data are fictional. This exercise does not establish discrimination, causal effects, a group’s
    character or the prevalence of a real inequality. Time and effort: Three 15-minute analytical passes
    over one case. Adaptation: Use the fictional case only, or work with an authorized organization and
    consented minimal data. Do not label individuals by race, class, disability or other identity from
    appearance. Serious discrimination or rights concerns require appropriate institutional or legal processes.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case only, or work with an authorized organization and consented
    minimal data. Do not label individuals by race, class, disability or other identity from appearance.
    Serious discrimination or rights concerns require appropriate institutional or legal processes.
  expected_burden: Three 15-minute analytical passes over one case.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Justice, inequality, and social structure protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Justice, inequality, and social structure action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case only, or work with an authorized organization and consented minimal data. Do not label individuals
    by race, class, disability or other identity from appearance. Serious discrimination or rights concerns
    require appropriate institutional or legal processes.
  actions:
  - stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01-A1
    sequence: 1
    title: Separate the gap from its possible causes
    instructions: 'Record only what the case shows: interest and attendance differ, and the route and
      signup have stated features. Generate explanations at several levels: individual priorities, schedule,
      cost of transport, disability access, information access and institutional design. Consider how
      historical patterns involving class, race, sex or geography could shape resources, but mark those
      as questions rather than facts about these participants. Do not assign a motive or demographic identity
      to a nonattendee.


      Observation checks: Observed outcomes are separated from causal explanations; Individual and institutional
      mechanisms are both considered; Historical and social categories are questions rather than inferred
      identities; Nonattendance is not treated as a character defect. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01
      action_stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01-A1
      competency_stable_id: '20.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2004_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2004_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - observed_outcomes_are_separated_from_causal_explanations
        - individual_and_institutional_mechanisms_are_both_considered
        - historical_and_social_categories_are_questions_rather_than_inferred_identities
        - nonattendance_is_not_treated_as_a_character_defect
      - measurement_id: c2004_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2004_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
