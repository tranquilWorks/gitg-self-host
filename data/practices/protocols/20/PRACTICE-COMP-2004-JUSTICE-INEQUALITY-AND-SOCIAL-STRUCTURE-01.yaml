  - stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01-A3
    sequence: 3
    title: Design one reversible barrier test with limited claims
    instructions: 'Propose a next workshop with an accessible location or an alternative signup route,
      holding other feasible features similar. State who should be consulted, what permission is needed
      and what attendance or usability observation would count as useful information. Compare possible
      benefit with cost and unintended exclusion. Write a conclusion that preserves agency and structural
      constraints together: the design may remove a barrier, but attendance alone will not prove why every
      person came or stayed away.


      Observation checks: One reversible design change addresses a specified mechanism; Consultation permission
      cost and unintended exclusion are considered; An observable comparison is defined; The conclusion
      preserves both agency and structural uncertainty. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Which explanation became more testable, and did your proposed response remove a barrier
      without pretending to explain everyone’s choices?


      Examples: Supportive: The participant identified transit and signup barriers as hypotheses and proposed
      an accessible alternative with a modest comparison plan.


      Mixed: The first account blamed motivation, but the mechanism comparison exposed missing evidence
      about route and access.


      Contradictory: People were stereotyped from demographic categories or a fictional attendance gap
      was declared proof of a real discriminatory cause.


      Inconclusive: Structural inequality was discussed in general without separating observation, mechanism
      and needed evidence.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01
      action_stable_id: PRACTICE-COMP-2004-JUSTICE-INEQUALITY-AND-SOCIAL-STRUCTURE-01-A3
