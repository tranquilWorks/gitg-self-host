    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Justice, inequality, and social structure practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Justice, inequality, and social structure as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the fictional case only, or work with an authorized organization and consented
    minimal data. Do not label individuals by race, class, disability or other identity from appearance.
    Serious discrimination or rights concerns require appropriate institutional or legal processes.
  opportunity_considerations: 'Use a fictional free evening workshop: 40 people expressed interest, 20
    attended, and the venue required stairs, two bus changes and an online signup. No participant demographic
    data are supplied. Make columns for observed outcome, possible mechanism, missing evidence, affected
    people and possible change.'
  prerequisites:
