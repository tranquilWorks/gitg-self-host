  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The organizer obtains permission for a step-free room and also sends an additional reminder before
      the next workshop. Forty people express interest again and twenty-eight attend. The packet does
      not establish whether these are the same forty people, whether other circumstances changed or why
      anyone attended. No demographic or individual reason data are supplied.


      Attendance is now 70 percent, compared with 50 percent before: eight more attendees and a twenty-percentage-point
      difference. Both venue and reminder changed, and the participant mix is unknown. The result therefore
      does not isolate the room''s effect or prove that the earlier gap resulted from one structural cause.
      It also does not establish that the other twelve lacked motivation.


      A willing fictional user reports that the step-free route was usable for them. That is a specific
      access observation, not certification of all access needs or proof of the attendance mechanism.
      Transit complexity and online-only signup remain. Revise the conclusion to distinguish a reported
      access improvement, an attendance change and unanswered causal and distributional questions.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Explain an observed opportunity gap through competing mechanisms, then propose a reversible
      response with limited claims. Use three fifteen-minute passes over the fictional workshop case.
      No demographic, income, health or identity data are needed. The exercise develops causal judgment
      and responsible design; it cannot establish the prevalence of a real inequality or the character
      of a group.


      ### A gap is a question, not its own explanation


      An outcome describes what happened. A mechanism proposes how it happened. A value judgment explains
      why an outcome or process matters. Keep those different kinds of statement visible. “Twenty of forty
      interested people attended” is an observation. “They lacked motivation” is a proposed explanation
      requiring evidence. “People should have a usable opportunity to participate” is a normative commitment,
      not a statistical finding.


      Individual choices and structural conditions can operate together. Someone may decide that another
      obligation matters more while facing limited transport, an inaccessible venue or a difficult signup
      route. Recognizing a constraint does not erase agency. Recognizing agency does not make every option
      equally available. A useful explanation asks which choices existed, at what cost and under whose
      rules.


      History can shape present resources through inherited institutions, location, wealth and earlier
      access to education or services. Class can affect disposable time and transport options. Race and
      sex can be relevant to histories of exclusion, institutional treatment or expectations. Disability
      can interact with a building or communication design. Geography affects distance and available routes.
      These are questions about mechanisms and context, not permission to assign identity, experience
      or motive to a person from appearance.


      Institutions and incentives deserve the same scrutiny as individual decisions. An online-only signup
      may simplify administration while excluding some interested users. Attendance targets may encourage
      organizers to recruit the easiest-to-reach people. A feedback form framed as “Why did you fail to
      attend?” may discourage honest answers. Neither an incentive nor a barrier proves deliberate discrimination;
      actual rights concerns still require the appropriate institutional or qualified legal process.


      Justice analysis asks who receives an opportunity, who bears the cost, who can influence the design
      and who remains unheard. It also asks whether the proposed response creates new exclusion. Moving
      an event may improve physical access while lengthening someone''s journey. A design can be worth
      improving for a clear access reason even before a study establishes its effect on attendance.


      ### Worked example


      A free course has lower attendance than expressions of interest. Calling it free captures the fee
      but omits travel, time and access costs. A respectful analysis compares several mechanisms and asks
      what evidence could distinguish them. Changing both the venue and reminders might be practically
      sensible, but a later attendance increase would not isolate the effect of the venue. Better conditions
      and stronger causal evidence are different achievements.


      ### Supplied fictional data


      Forty people express interest in Cedar''s evening workshop; twenty attend. The advertised venue
      requires stairs, a typical transit route uses two bus changes, and registration is online only.
      No participant identities, demographic breakdown, reasons for nonattendance or costs are supplied.
      There is no control group and no evidence that all expressions of interest were commitments to attend.


      The organizer can consider a step-free room or a second signup route, with permission and input
      from willing users. The exercise does not ask you to inspect a building without authority, contact
      nonattendees or request sensitive data. Start from the supplied facts and mark the rest as hypotheses.


      ### Compare mechanisms and a possible response


      1. Calculate the attendance fraction and separate the gap from explanations. List plausible individual,
      logistical and institutional mechanisms. Include historical or demographic questions only as unknown
      context, not participant labels. Output: an observation column distinct from a hypothesis column.

      2. Choose three mechanisms and an appropriate evidence route for each. A verified transit timetable
      can test travel feasibility, a permitted accessibility review can examine the venue, and a voluntary
      minimal question can explore signup difficulty. Output: what each route could and could not show,
      without claiming that it has already been used.

      3. Identify incentives that could distort collection or interpretation. Ask whose experience might
      be missing and retain a competing explanation such as a schedule clash. Output: a privacy-conscious
      inquiry plan with no required demographic disclosure or blame-framed question.

      4. Propose one reversible change, its permission and consultation needs, resource burden and a possible
      unintended exclusion. Define a modest usability or attendance comparison. Output: an actionable
      proposal that does not promise all forty people will attend or claim that the change proves a theory
      of inequality.

      5. Save your analysis before the [later packet](?resource=file-later-packet-md). Recalculate the
      supplied later result and identify changed conditions. Output: a conditional conclusion, including
      what would still be needed for a causal or fairness claim.


      ### Support and transfer


      For support, draw forty marks and distinguish the twenty attendance marks from unknown reasons.
      Use three mechanisms rather than an exhaustive social explanation. For a harder version, the preferred
      barrier is removed and attendance stays flat: explain why that need not prove the barrier was unreal
      or the effort worthless. It may matter to access while other constraints remain.


      Real transfer requires an authorized organization, appropriate consultation and minimal consented
      information. Do not infer race, class, disability or other identity from a name or photograph. Serious
      discrimination concerns need the proper process, not an improvised exercise verdict. Repeated, well-designed
      evidence and affected people''s perspectives are needed to understand broader opportunity and harm.


      ### Source limits


      [U.S. Department of Justice Title II guidance, S06](https://www.ada.gov/topics/title-ii/), explains
      access to state/local public programs, reasonable modifications and communication. It is a United
      States legal overview, not proof of a violation in this invented workshop or an explanation of its
      attendance. The mechanism comparison and numbers are original. No universal accessibility certification,
      causal estimate or group trait is derived from the source.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. Twenty of forty interested people do not attend. Can you infer low motivation, a demographic
      identity or discrimination from that number alone?

      2. Attendance rises from 20/40 to 28/40 after a venue change and an extra reminder. What changed
      numerically, and what causal claim remains unsupported?

      3. A step-free route helps one user, but overall attendance does not rise in another case. Does
      that prove the access change was useless?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. The gap is observed; its causes and participant identities are not. Compare plausible
      choices and constraints, use respectful evidence routes, and avoid inventing motives or legal findings.

      2. Attendance rises from 50 to 70 percent, eight people and twenty percentage points. Multiple changes
      and unknown participant composition prevent attributing the difference solely to the venue. A practical
      improvement is not a controlled causal estimate.

      3. No. Specific usability and aggregate attendance answer different questions. Other constraints
      or priorities may remain. Preserve the user''s limited observation while seeking appropriate further
      evidence and avoiding a universal success claim.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
