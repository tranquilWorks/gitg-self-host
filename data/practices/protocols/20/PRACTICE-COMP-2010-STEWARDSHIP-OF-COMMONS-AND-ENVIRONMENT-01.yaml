meaning_and_fit:
  purpose: Improve a commons through a permitted maintenance or knowledge contribution while considering
    environmental effects, shared access and ongoing responsibility.
  why_recommended: Improve a commons through a permitted maintenance or knowledge contribution while considering
    environmental effects, shared access and ongoing responsibility.
  claims:
  - statement: Improve a commons through a permitted maintenance or knowledge contribution while considering
      environmental effects, shared access and ongoing responsibility.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Stewardship of commons and environment practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Stewardship of commons and environment as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a digital commons, accessible shared guide or fictional maintenance case.
    Do not publish private information, bypass permissions or undertake hazardous cleanup. Environmental
    or infrastructure work beyond ordinary competence belongs with the relevant qualified steward.
  opportunity_considerations: Default to a community borrowing shelf with a missing return label, or a
    shared knowledge page with an unclear maintenance note. Prepare headings for users, resource, current
    failure, owner or steward, environmental or waste effect, trust risk and maintenance. Do not remove
    plants, handle hazardous waste or edit protected systems.
  prerequisites:
  - Default to a community borrowing shelf with a missing return label, or a shared knowledge page with
    an unclear maintenance note. Prepare headings for users, resource, current failure, owner or steward,
    environmental or waste effect, trust risk and maintenance. Do not remove plants, handle hazardous
    waste or edit protected systems.
  dependencies: []
  safe_alternatives:
  - Use a digital commons, accessible shared guide or fictional maintenance case. Do not publish private
    information, bypass permissions or undertake hazardous cleanup. Environmental or infrastructure work
    beyond ordinary competence belongs with the relevant qualified steward.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Stewardship of commons and environment differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Stewardship of commons and
    environment as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a community borrowing shelf with a missing return label, or a shared knowledge page
    with an unclear maintenance note. Prepare headings for users, resource, current failure, owner or
    steward, environmental or waste effect, trust risk and maintenance. Do not remove plants, handle hazardous
    waste or edit protected systems. Goal: Improve a commons through a permitted maintenance or knowledge
    contribution while considering environmental effects, shared access and ongoing responsibility. Scope:
    Use a low-risk shared resource within your authority. This is not environmental remediation, ecological
    assessment or permission to alter public property, habitats or institutional records. Time and effort:
    Twenty minutes to inspect and obtain permission, one small improvement and a later usability check.
    Adaptation: Use a digital commons, accessible shared guide or fictional maintenance case. Do not publish
    private information, bypass permissions or undertake hazardous cleanup. Environmental or infrastructure
    work beyond ordinary competence belongs with the relevant qualified steward. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a digital commons, accessible shared guide or fictional maintenance case. Do
    not publish private information, bypass permissions or undertake hazardous cleanup. Environmental
    or infrastructure work beyond ordinary competence belongs with the relevant qualified steward.
  expected_burden: Twenty minutes to inspect and obtain permission, one small improvement and a later
    usability check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Stewardship of commons and environment protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Stewardship of commons and environment action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a digital
    commons, accessible shared guide or fictional maintenance case. Do not publish private information,
    bypass permissions or undertake hazardous cleanup. Environmental or infrastructure work beyond ordinary
    competence belongs with the relevant qualified steward.
  actions:
  - stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01-A1
    sequence: 1
    title: Identify the shared value and the actual steward
    instructions: 'Observe one problem that makes the resource less usable: items are returned to the
      wrong place because the label is missing. Identify who owns or stewards it and ask what changes
      are allowed. Trace how the problem affects access, waste or repeated labor, shared knowledge and
      confidence in the system. Mark any ecological effect you cannot establish rather than calling every
      tidying action environmentally beneficial.


      Observation checks: A specific usability problem is observed; The responsible steward and permission
      are identified; Access waste labor knowledge and trust effects are considered; Unverified ecological
      benefits are not claimed. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01
      action_stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01-A1
      competency_stable_id: '20.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2010_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2010_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_specific_usability_problem_is_observed
        - the_responsible_steward_and_permission_are_identified
        - access_waste_labor_knowledge_and_trust_effects_are_considered
        - unverified_ecological_benefits_are_not_claimed
      - measurement_id: c2010_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2010_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01-A2
    sequence: 2
    title: Make the smallest useful reversible improvement
    instructions: 'With permission, install a clear accessible return label or correct the maintenance
      note using verified information. Preserve existing content and avoid adding a rule you have no authority
      to impose. Use safe available materials and avoid creating more waste than the problem warrants.
      State who can update the label when the arrangement changes; a resource that only you understand
      has not become a resilient commons.


      Observation checks: The change is permitted and addresses the observed problem; Information and
      access remain correct; Material use and unintended waste are considered; The result can be maintained
      by someone other than you. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01
      action_stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01-A2
      competency_stable_id: '20.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2010_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2010_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_change_is_permitted_and_addresses_the_observed_problem
        - information_and_access_remain_correct
        - material_use_and_unintended_waste_are_considered
        - the_result_can_be_maintained_by_someone_other_than_you
      - measurement_id: c2010_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2010_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01-A3
    sequence: 3
    title: Test use and hand back responsibility
    instructions: 'Ask a willing user to return an item or find the relevant information without your
      coaching. Observe confusion and correct one issue within the allowed scope. Confirm the steward
      knows what changed and when it should be reviewed. Record the limited benefit, any remaining problem
      and what you learned about the shared system. Do not treat a clean appearance as proof of ecological
      restoration or universal access.


      Observation checks: A user tests the intended function; Confusion or failure is preserved and addressed;
      The steward receives a clear maintenance handoff; Claims stay limited to observed usability and
      stewardship. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: What became more usable or understandable for the next person, and what responsibility
      did you return to the shared system rather than keep for yourself?


      Examples: Supportive: A permitted label reduced confusion in a real return test and the steward
      accepted the maintenance note.


      Mixed: The label was clearer but blocked another instruction; the participant repositioned it after
      the user test.


      Contradictory: The participant altered public property, removed habitat or claimed environmental
      restoration from unverified tidying.


      Inconclusive: A resource was praised as a commons without a permitted improvement or a next-user
      check.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2010-STEWARDSHIP-OF-COMMONS-AND-ENVIRONMENT-01
