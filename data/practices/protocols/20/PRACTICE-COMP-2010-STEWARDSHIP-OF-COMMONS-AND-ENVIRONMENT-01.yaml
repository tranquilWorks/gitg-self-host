  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not an actual shared-resource trial.


      Rae installs the permitted card, but the first user points out that it covers the damaged-item instruction.
      Rae does not count installation as a complete usable repair. Quinn approves a different open position,
      and Rae moves the card so both instructions can be read.


      After repositioning, three later returns are placed correctly without coaching, including a retry
      by the first user and returns by two other willing fictional users. All three can also locate the
      damage-reporting instruction. The first user''s familiarity may help; three observations do not
      establish universal accessibility. The three earlier misplaced items were not a matched set of returns,
      so there is no defensible before/after error rate or causal effect estimate.


      Quinn accepts a brief weekly label-and-condition check starting the following week and receives
      the maintenance note. No weekly check has yet happened. No fees, restrictions or personal tracking
      are introduced. Available card was reused, but no waste mass, emissions, ecological restoration
      or long-term trust outcome was measured. Credit the permitted correction and observed local use,
      with ongoing stewardship still to be performed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Improve one permitted shared resource and check whether another person can use it. Allow twenty
      minutes to inspect and agree the task, a small reversible repair and a later usability check. Use
      a community borrowing shelf or the supplied fiction. Caring for a commons includes how responsibilities
      are shared; it is not permission to alter anything that appears neglected.


      ### Inspectable shelf layout


      Eight fictional items have marked slots: two blue trays B1/B2, two green boxes G1/G2, two red folders
      R1/R2 and two yellow baskets Y1/Y2. Observed positions: B1 in B1, B2 in G1, G1 in B2, G2 in G2,
      R1 in R1, R2 in Y2, Y1 in Y1, and Y2 temporarily on loan with an authorized record. Thus B2, G1
      and R2 are misplaced; the loan is not a fourth placement error. Quinn permits the return label,
      not changes to borrowing rules. Describe the correct return destination and preserve the damaged-item
      instruction.


      ### Care for the resource and its arrangement


      A shared system joins a resource, users, rules and maintenance. A borrowing shelf may need sound
      items, clear return instructions and someone who checks condition. A public space may involve access,
      habitat, safety and multiple authorities. Shared knowledge needs accuracy, provenance and understandable
      organization. Institutional trust depends partly on people keeping commitments and responding fairly
      to mistakes. These are related forms of stewardship, but they do not all behave like the same resource.


      A physical object can be worn out or unavailable while borrowed. Copying information need not consume
      the original, though maintaining reliable information still takes work. An ecosystem can have fragile
      or poorly understood relationships that make a seemingly simple intervention harmful. Do not transfer
      a successful shelf-label idea into habitat management, hazardous cleanup or public-infrastructure
      repair. Understand the resource, your authority and the relevant limits first.


      Inspect through ordinary permitted use. Identify a concrete friction such as an unclear return location,
      and distinguish its observation from your explanation. A misplaced item does not establish laziness,
      deliberate abuse or the cause of a maintenance problem. Ask the steward whether the friction is
      known and whether a small change is wanted. “Shared” does not mean unowned, rule-free or available
      for unilateral control.


      Choose the smallest useful change within permission. Reuse a suitable available material if it serves
      the task without covering information or creating a new problem. Material reduction and reuse are
      considerations, not automatic proof that a particular project is environmentally beneficial. Avoid
      new penalties, fees, surveillance or collection of user identities. A clearer instruction should
      make legitimate use easier, not quietly rewrite access rules.


      Test the arrangement in use. Installation proves only that something was installed. Ask a willing
      user to return an item without coaching, notice whether other instructions remain visible and correct
      a permitted problem. Record the actual observation, including an unsuccessful first attempt. A few
      successful returns can support local usability, but cannot establish universal access, saved emissions,
      restored biodiversity or lasting trust.


      Keep the maintenance burden visible. An improvement that only its maker understands can be fragile.
      Leave an understandable explanation with the steward and ask who accepts the next check. Distinguish
      an agreement from checks already performed. Also ask whether the change merely moves a burden onto
      someone else: a user-friendly shelf might still require unmanageable unpaid sorting. A responsible
      outcome includes a proportionate task and an honest account of unresolved work.


      ### Worked example


      A new return label seems clear but covers the existing damaged-item instruction. A borrower can
      find the shelf yet cannot see where to report damage. The steward moves the label to an approved
      open area and checks both instructions. The useful repair is to the whole return process, not merely
      the wording of one sign. No waste-savings figure follows from this small correction.


      ### Supplied fictional case


      Cedar Hall''s borrowing shelf holds eight shared items. During an ordinary authorized check, three
      are found outside their marked positions. The cause is unknown. The steward, Quinn, confirms that
      the return-location label is missing and permits a reversible replacement using available card.
      The existing instruction to report damaged items to the desk must remain visible. No new fee, penalty
      or eligibility rule is authorized.


      Rae agrees to make and position the card. A willing fictional user agrees to try one return without
      hints. Later observations will cover three returns, not a representative user sample. Quinn can
      consider maintenance after reviewing the result. No hazardous item, repair to an electrical object,
      environmental measurement or actual public property is involved.


      ### Make and check one stewardship improvement


      1. Describe the shared benefit, observed friction and unknown cause. Identify the users, steward,
      permission and existing rules. Output: a brief resource-and-responsibility account, without blaming
      anonymous users.

      2. Compare a replacement label with doing nothing or introducing a new rule. Choose only the permitted
      reversible change and suitable available material. Output: a bounded action that preserves access
      and damage-reporting information.

      3. Make the change, then inspect the whole instruction area. Ask the willing user to perform the
      ordinary return without coaching. Output: installation status and actual use result, kept separate.

      4. Correct a permitted defect and review the [later packet](?resource=file-later-packet-md). Keep
      earlier misplaced items separate from later return observations; no matched comparison is supplied.
      Output: an accurate small-sample result and the remaining uncertainty.

      5. Leave an understandable maintenance note and seek an accepted next check. Output: steward acknowledgment,
      future ownership status and one limit on any environmental or trust claim.


      ### Support and transfer


      For support, use a drawing with a return arrow and separate damage instruction. Describe placement
      orally or ask for chosen assistance. For a harder case, two users need conflicting formats or the
      steward cannot maintain the change. Ask about an accessible alternative or reduce the task; do not
      declare your preference the universal solution.


      Real transfer requires the actual owner''s permission, appropriate safety and a willing user check.
      Do not alter habitats, handle waste of uncertain safety or repair infrastructure to complete this
      exercise. A knowledge resource may instead need a permitted correction and clear provenance. Assess
      the specific system and document only nonprivate observations. Fiction develops stewardship judgment
      but is not an actual environmental contribution.


      ### Source use


      [The Ostrom Workshop teaching overview, S12](https://www.ostrom-workshop.indiana.edu/courses-teaching/teaching-tools/ostrom-design/index.html),
      introduces institutions developed by resource users for shared-resource governance. It is an overview,
      not the full book or a universal recipe. [EPA''s materials hierarchy, S13](https://www.epa.gov/smm/sustainable-materials-management-non-hazardous-materials-and-waste-management-hierarchy),
      supplies the narrow consideration of source reduction and reuse while noting that one approach does
      not fit all circumstances. Neither source measures this shelf''s ecological effect; the case is
      original.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A shared resource looks neglected. Does that authorize anyone to change its rules, remove material
      or repair it?

      2. Three items were misplaced during a shelf inspection, then three later returns were correct.
      Can you claim a 100% improvement caused by the new label?

      3. A reused-card label helps a few users and the steward accepts weekly checks. What can you say
      about environmental impact and sustained maintenance?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Establish actual authority, user needs, existing rules and safety before a bounded change.
      A commons has governance; shared access does not create unilateral powers. Ecosystem and hazardous-work
      decisions need different competence and permission.

      2. No. The baseline is an inventory observation, not a matched set of return trials with a comparable
      denominator. Report the three correct later returns and the limits of the small sample, familiarity
      and changed conditions.

      3. You can report reuse of available card and the observed local task result. No quantified waste,
      climate or ecosystem benefit was measured. Maintenance is accepted for the future but has not yet
      been carried out.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
