    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. A town apologizes and holds a celebration. Which of truth, accountability, memory, repair, reform
      and safer coexistence does that automatically complete?

      2. A combined proposal names every mechanism but needs 40 units and has 25. What conclusion is justified?

      3. Can ordinary access or recognition of harm be conditioned on public testimony or forgiveness
