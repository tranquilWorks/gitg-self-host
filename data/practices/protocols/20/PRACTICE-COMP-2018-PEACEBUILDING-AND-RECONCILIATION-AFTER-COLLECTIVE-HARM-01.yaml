  - Treating a completed Peacebuilding and reconciliation after collective harm action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use non-graphic
    fictional cases, accessible summaries or a facilitated educational setting. Do not approach survivors
    or perpetrators to complete the exercise. Real post-violence work requires qualified, locally legitimate
    processes and protection for affected people.
  actions:
  - stable_id: PRACTICE-COMP-2018-PEACEBUILDING-AND-RECONCILIATION-AFTER-COLLECTIVE-HARM-01-A1
    sequence: 1
    title: Define the harms and the voices a process must not erase
    instructions: 'List what the fictional case establishes and what remains unknown about responsibility,
      affected people and ongoing risk. Identify whose participation would need to be voluntary and supported,
      who may be absent and who has legal authority over accountability. Read a transitional-justice source
      for the distinction between judicial and nonjudicial measures. Do not assume that a public apology
      or peaceful appearance means harm has ended or that every affected person wants the same remedy.


      Observation checks: Established harm and missing facts are separated; Affected voices support and
      voluntary participation are considered; Legal authority is distinguished from a civic discussion;
      Apology or apparent calm is not equated with resolved harm. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
