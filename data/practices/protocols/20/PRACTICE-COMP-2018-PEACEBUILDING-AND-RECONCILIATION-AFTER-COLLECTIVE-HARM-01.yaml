  - stable_id: PRACTICE-COMP-2018-PEACEBUILDING-AND-RECONCILIATION-AFTER-COLLECTIVE-HARM-01-A2
    sequence: 2
    title: Assess each proposal across six necessary questions
    instructions: 'For each proposal ask: what truth can be established, how responsibility is addressed
      fairly, how memory is preserved, what repair reaches affected people, what institution changes and
      what makes coexistence safer. Identify the cost, risk of retaliation, symbolic-only gestures and
      possible exclusion of less powerful groups. A combined proposal may still fail if it lacks resources
      or consent; do not score it as successful merely because it names more mechanisms.


      Observation checks: All three proposals are assessed across six distinct dimensions; Retaliation
      resource and exclusion risks are considered; Symbolic acknowledgment and material repair are distinguished;
      Naming mechanisms is not treated as implementing them. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
