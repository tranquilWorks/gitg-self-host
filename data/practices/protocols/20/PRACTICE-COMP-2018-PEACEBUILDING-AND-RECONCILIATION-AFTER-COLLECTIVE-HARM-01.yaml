intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional town emerging from serious institutional exclusion. Compare three proposals:
    a celebration asking everyone to move on; a truth-and-record process with no repair; and a combined
    proposal for truth, fair accountability, material repair and institutional safeguards. No real survivor
    testimony or graphic material is required. Goal: Evaluate responses to collective harm through truth,
    accountability, memory, repair, institutional change and future coexistence while protecting affected
    people’s agency. Scope: This is a fictional or source-based civic analysis, not a mediation process
    for actual violence, authority to collect testimony or a requirement that survivors forgive. Time
    and effort: Two 25-minute comparisons and one 15-minute synthesis. Adaptation: Use non-graphic fictional
    cases, accessible summaries or a facilitated educational setting. Do not approach survivors or perpetrators
    to complete the exercise. Real post-violence work requires qualified, locally legitimate processes
    and protection for affected people. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use non-graphic fictional cases, accessible summaries or a facilitated educational
    setting. Do not approach survivors or perpetrators to complete the exercise. Real post-violence work
    requires qualified, locally legitimate processes and protection for affected people.
  expected_burden: Two 25-minute comparisons and one 15-minute synthesis.
  action_count_rationale: null
  foreseeable_misuse:
