  - id: practice-answers
    title: Compare your responses
    body: '1. None automatically. Symbolic acknowledgment can matter, but each function needs its own
      actual evidence, authority and affected-person perspective. Quiet or attendance is not proof of
      agreement or safety.

      2. It has a 15-unit resource gap and may still fail through consent, legitimacy, design or implementation
      problems. Compare its functions and defects conditionally; naming them is not delivery. A simpler
      proposal''s valid contribution also should not be erased.

      3. No. Remove the coercive condition and preserve voluntary, supported participation and privacy.
      Reconciliation is not compulsory forgiveness, and fair accountability is not impunity. Actual eligibility,
      redress and legal processes require appropriate authority; the exercise creates none.'
