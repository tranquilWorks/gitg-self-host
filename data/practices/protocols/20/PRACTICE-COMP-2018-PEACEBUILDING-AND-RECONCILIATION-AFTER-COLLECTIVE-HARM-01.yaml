  applicability_question: Does a voluntary, bounded Peacebuilding and reconciliation after collective
    harm practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Peacebuilding and reconciliation after collective harm as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use non-graphic fictional cases, accessible summaries or a facilitated educational
    setting. Do not approach survivors or perpetrators to complete the exercise. Real post-violence work
    requires qualified, locally legitimate processes and protection for affected people.
  opportunity_considerations: 'Use a fictional town emerging from serious institutional exclusion. Compare
    three proposals: a celebration asking everyone to move on; a truth-and-record process with no repair;
    and a combined proposal for truth, fair accountability, material repair and institutional safeguards.
    No real survivor testimony or graphic material is required.'
