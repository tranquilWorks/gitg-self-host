  - stable_id: PRACTICE-COMP-2018-PEACEBUILDING-AND-RECONCILIATION-AFTER-COLLECTIVE-HARM-01-A3
    sequence: 3
    title: Write a conditional design with accountability and nonrecurrence
    instructions: 'Recommend a bounded combination for the fictional case, explaining sequence, independent
      oversight, privacy, qualified support and how affected people can challenge errors. Name one tension
      that cannot be fully solved, such as speed versus careful fact-finding, and one sign that the process
      is reproducing harm. Distinguish reconciliation from forgiveness and coexistence from impunity.
      The output is a comparative analysis, not permission to gather testimony or promise a real community
      healing.


      Observation checks: The recommendation includes oversight and challenge routes; A genuine tension
      and warning sign are explicit; Reconciliation forgiveness coexistence and impunity are distinguished;
      No live testimony collection or healing claim is made. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which mechanism addresses which harm, and what would prevent a call for peace from
      becoming pressure to forget or excuse responsibility?


      Examples: Supportive: The participant distinguished truth, fair accountability and repair, then
      proposed safeguards without requiring survivors to forgive.


      Mixed: The initial combined proposal sounded complete, but resource and retaliation questions showed
      why implementation could still fail.


      Contradictory: A demand to move on silenced affected people, or peace was defined as forgetting
      wrongdoing and removing accountability.


      Inconclusive: Reconciliation models were named without comparing truth, repair, institutional reform
      and future safety.'
