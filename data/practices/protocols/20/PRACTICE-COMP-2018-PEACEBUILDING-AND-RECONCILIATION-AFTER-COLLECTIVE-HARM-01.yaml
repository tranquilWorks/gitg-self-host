  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      A fictional affected-person review rejects C''s public-testimony condition. The draft is revised
      so ordinary training access does not require disclosure or forgiveness. A separate supported, voluntary
      record process retains privacy choices and a way to challenge factual error. No person has actually
      enrolled, given testimony or received a remedy.


      The resource estimate remains 40 units and identified resources remain 25, leaving 15 unresolved.
      There is no new funder, staffing commitment or lawful accountability finding. The learner does not
      describe the gap as solved by optimism or count all named mechanisms as implemented.


      The final comparison recognizes that A risks suppressing memory, B supplies some truth/record safeguards
      but leaves repair and reform unfunded, and revised C covers more functions while still depending
      on legitimacy, resources, safety and real participation. Withdrawal of the old rule on paper is
      not verified access or prevention of recurrence. The result is a conditional model comparison, not
      reconciled people, legal guilt, forgiveness or lasting peace.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare three responses to a fictional legacy of serious institutional exclusion. Use two twenty-five-minute
      comparisons and a fifteen-minute synthesis. No survivor contact, testimony collection, mediation
      or personal disclosure is required. The task asks what different mechanisms can address, not whether
      a community should forgive or whether a polished plan guarantees healing.


      ### Peace is more than a quiet surface


      Collective harm can affect people, institutions, livelihoods, memory and the credibility of shared
      rules. A public celebration or apology may acknowledge something important while leaving material
      loss or ongoing exclusion untouched. Absence of open conflict does not establish consent, equal
      safety or resolution; people may remain silent because participation is costly or unsafe.


      Distinguish six questions. Truth-telling asks what happened, to whom, through which structures and
      with which evidential limits. Accountability asks how responsibility is established fairly and acted
      on by legitimate institutions. Memory preserves an honest public record without forcing every person
      to relive events publicly. Reparations concern meaningful redress, which may be material or symbolic
      and need to reach affected people. Institutional reform changes rules, incentives and procedures
      that permit recurrence. Coexistence concerns the conditions for living together with rights and
      safety despite remaining disagreement or grief.


      These functions can complement one another but are not interchangeable. A testimony archive does
      not itself compensate a loss. Payment does not settle responsibility or guarantee nonrecurrence.
      A trial has procedures and standards a civic discussion cannot replace. An institutional reform
      announced without resources or enforcement may change a document while leaving the actual barrier
      in place.


      Affected people need meaningful agency, including ways to participate privately, receive appropriate
      support, challenge errors or decline participation. They do not all want the same remedy. Do not
      equate a spokesperson, a public ceremony or a high attendance count with everyone''s consent. Preserve
      absent voices and avoid making access to an ordinary service contingent on a public account of suffering.


      Fair accountability includes reliable fact-finding and opportunities to contest claims. Protecting
      those procedures does not require forgetting harm or granting impunity. Reconciliation, where it
      is sought, is distinct from individual forgiveness. Coexistence can require enforceable protections
      and institutional change even when forgiveness never occurs. The learner has no authority to assign
      guilt, collect sensitive testimony or promise anyone a legal remedy.


      Implementation exposes tensions. Speed may help meet an urgent need but can weaken careful inquiry
      if treated as a reason to bypass it. Open memory can conflict with privacy or safety; a useful public
      record need not expose every identity. Symbolic repair may be easier to fund than material redress,
      yet more components on a plan do not make it more effective. Identify resources, sequence, legitimate
      owners, independent oversight and a route to challenge mistakes.


      ### Worked example


      A town proposes a new archive after discriminatory exclusion. One proposal requires people to tell
      their stories publicly before ordinary access is restored. The analyst removes that condition, separates
      support from testimony and asks how records can be checked through legitimate procedures. This improves
      the design on paper; it does not show that a remedy reached anyone or that the institution changed
      in practice.


      ### Complete fictional proposal packet


      Cedar Town''s official records establish that an institutional rule excluded a category of residents
      from training access for ten years. The category has no real-world identity in this exercise. The
      records do not identify every affected person, individual legal responsibility, ongoing risk or
      each person''s loss. The rule has been withdrawn on paper; actual access and enforcement have not
      been checked.


      Proposal A funds a celebration and asks everyone to move on. It closes the old files and creates
      no repair or challenge route. Proposal B creates a supported voluntary record process with privacy
      choices and a way to dispute factual errors, but has no budget for material repair or institutional
      reform. Proposal C proposes a truth process, fair accountability through proper authority, a protected
      memory record, material redress and reform with independent oversight. It estimates 40 units of
      work and resources, but only 25 units are identified; the estimate is fictional and none of the
      mechanisms has begun.


      C also contains a problematic draft clause requiring a public personal account before ordinary training
      access resumes. Affected people have not accepted that condition. Your comparison must address that
      defect and the resource gap, rather than choosing C merely because it names more desirable mechanisms.


      ### Compare mechanisms and design conditions


      1. List established harm separately from unknown responsibility, loss, actual access and continuing
      risk. Identify whose participation must be voluntary and which decisions require legitimate qualified
      authority. Output: a bounded account without invented testimony.

      2. Evaluate each proposal across the six questions. Name what it offers, omits or risks, including
      privacy, retaliation and exclusion. Output: a comparison that does not award success for an intention
      or ceremony.

      3. Examine C''s resources and testimony condition. Preserve ordinary access and challenge the compulsory-disclosure
      clause; explain how a separate repair process would need appropriate eligibility and evidence without
      coercion. Output: a revised proposal and a real implementation constraint.

      4. State a possible sequence with legitimate owners, support, independent oversight and an accessible
      error-review route. Keep one unresolved tension visible. Output: a conditional design, not a self-authorized
      investigation or legal decision.

      5. Save your comparison before the [later packet](?resource=file-later-packet-md). Revise any claim
      that paper reform or a fuller plan establishes reconciliation. Output: the strongest limited conclusion
      and evidence still required.


      ### Support and transfer


      A supported route can use six question cards and non-graphic summaries. A harder case has competing
      affected-person preferences about public memory; do not force a consensus or select the loudest
      voice as representative. Privacy and continued ordinary services should not depend on performing
      forgiveness.


      Transfer should remain educational unless qualified, locally legitimate processes authorize actual
      work. Do not approach survivors, accused people or communities to complete a worksheet. Case analysis
      can compare models; it cannot establish recovery, justice, peace or reconciliation for real people.


      ### Source use


      [ICTJ''s first-party explanation, S06](https://www.ictj.org/what-transitional-justice), distinguishes
      multiple judicial and nonjudicial responses and emphasizes affected people''s rights, dignity and
      participation rather than a universal formula. This limited conceptual use does not validate Cedar''s
      proposals or establish a particular legal remedy. The fictional budget, clause and later review
      are original.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      Civic learning does not require political belief, affiliation, public disclosure or participation.
      Fiction and no attempt are legitimate. Keep private or protected records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
