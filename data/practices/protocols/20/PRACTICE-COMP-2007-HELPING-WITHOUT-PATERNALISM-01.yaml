        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01-A3
    sequence: 3
    title: Ask about usefulness and remove unnecessary dependence
    instructions: 'Invite a brief correction: Did that help, would a different format be better, or shall
      I stop. Check whether the person can use the chosen next step with their preferred level of support.
      If you created an avoidable dependency, such as holding information only you can retrieve, return
      it through the proper accessible channel. Record your adjustment rather than a score of the recipient’s
      competence. A polite thank-you does not prove that help increased safety or capacity.


      Observation checks: Usefulness is checked in the recipient’s terms; Preferred ongoing support remains
      legitimate; An avoidable information or control dependency is corrected; Gratitude is not treated
      as outcome evidence. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What decision remained theirs, what obstacle actually became easier, and what part
      of your help would you now remove?


      Examples: Supportive: The helper read the requested instruction, left the decision and device with
      the person and changed format after feedback.


      Mixed: The form was completed, but the helper took over too quickly; the next step restored the
      recipient’s choice and control.


      Contradictory: Assistance became a demand for gratitude, a claim of superiority or an unauthorized
      takeover of private decisions.


      Inconclusive: The helper felt useful but never asked what was needed or checked the recipient’s
      actual experience.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01
      action_stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01-A3
