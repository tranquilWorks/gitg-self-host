meaning_and_fit:
  purpose: Offer and deliver a bounded form of assistance that preserves the recipient’s agency, dignity
    and context rather than making them perform gratitude or dependence.
  why_recommended: Offer and deliver a bounded form of assistance that preserves the recipient’s agency,
    dignity and context rather than making them perform gratitude or dependence.
  claims:
  - statement: Offer and deliver a bounded form of assistance that preserves the recipient’s agency, dignity
      and context rather than making them perform gratitude or dependence.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Helping without paternalism practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Helping without paternalism as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible communication, a qualified interpreter or an authorized service.
    A fictional form can be used for rehearsal when no real request exists. Do not collect sensitive data,
    submit applications or assume legal authority merely because assistance was welcomed.
  opportunity_considerations: Default to a person trying to use an unfamiliar community-event registration
    form. Possible help includes reading the instructions, explaining a term, pointing to the official
    contact or stepping back. The person keeps their credentials, choices and private information; no
    account access or submission on their behalf is assumed.
  prerequisites:
  - Default to a person trying to use an unfamiliar community-event registration form. Possible help includes
    reading the instructions, explaining a term, pointing to the official contact or stepping back. The
    person keeps their credentials, choices and private information; no account access or submission on
    their behalf is assumed.
  dependencies: []
  safe_alternatives:
  - Use accessible communication, a qualified interpreter or an authorized service. A fictional form can
    be used for rehearsal when no real request exists. Do not collect sensitive data, submit applications
    or assume legal authority merely because assistance was welcomed.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Helping without paternalism differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Helping without paternalism
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a person trying to use an unfamiliar community-event registration form. Possible
    help includes reading the instructions, explaining a term, pointing to the official contact or stepping
    back. The person keeps their credentials, choices and private information; no account access or submission
    on their behalf is assumed. Goal: Offer and deliver a bounded form of assistance that preserves the
    recipient’s agency, dignity and context rather than making them perform gratitude or dependence. Scope:
    Use an ordinary willing relationship or an authorized service role. This does not authorize clinical
    care, financial control, unsolicited rescue or a judgment that someone cannot decide for themselves.
    Time and effort: Fifteen minutes to prepare, one brief consented exchange and one agreed low-risk
    action. Adaptation: Use accessible communication, a qualified interpreter or an authorized service.
    A fictional form can be used for rehearsal when no real request exists. Do not collect sensitive data,
    submit applications or assume legal authority merely because assistance was welcomed. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible communication, a qualified interpreter or an authorized service.
    A fictional form can be used for rehearsal when no real request exists. Do not collect sensitive data,
    submit applications or assume legal authority merely because assistance was welcomed.
  expected_burden: Fifteen minutes to prepare, one brief consented exchange and one agreed low-risk action.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Helping without paternalism protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Helping without paternalism action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    communication, a qualified interpreter or an authorized service. A fictional form can be used for
    rehearsal when no real request exists. Do not collect sensitive data, submit applications or assume
    legal authority merely because assistance was welcomed.
  actions:
  - stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01-A1
    sequence: 1
    title: Check the need and the limits of your interpretation
    instructions: 'Ask whether assistance is wanted and which part is difficult or inconvenient. Separate
      what you observed from your assumption about literacy, disability, resources or motivation. Offer
      a choice of help modes and make declining easy. Ask what would count as useful from their perspective,
      including the possibility that the form itself is poorly designed. Do not begin by correcting the
      person or presenting yourself as the solution to their life.


      Observation checks: Permission to help is requested before intervention; Observed difficulty is
      separated from identity assumptions; The recipient chooses the mode and desired outcome; A design
      or context problem remains a possible explanation. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01
      action_stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01-A1
      competency_stable_id: '20.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2007_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2007_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - permission_to_help_is_requested_before_intervention
        - observed_difficulty_is_separated_from_identity_assumptions
        - the_recipient_chooses_the_mode_and_desired_outcome
        - a_design_or_context_problem_remains_a_possible_explanation
      - measurement_id: c2007_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2007_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01-A2
    sequence: 2
    title: Do the agreed part without taking over the decision
    instructions: 'Carry out only the selected assistance: read the official instruction aloud, clarify
      a word or find the permitted support channel. Keep the device and final decision with the person
      unless an explicitly authorized arrangement says otherwise. Explain a step so it can be repeated
      when useful, but do not force independence when ongoing support is preferred or necessary. Stop
      when asked and never make help conditional on praise, personal disclosure or accepting your values.


      Observation checks: The action stays within the agreed scope; Credentials and decision authority
      remain protected; Support can be repeated without forcing independence; No gratitude disclosure
      or ideological condition is attached. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01
      action_stable_id: PRACTICE-COMP-2007-HELPING-WITHOUT-PATERNALISM-01-A2
      competency_stable_id: '20.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2007_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2007_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_action_stays_within_the_agreed_scope
        - credentials_and_decision_authority_remain_protected
        - support_can_be_repeated_without_forcing_independence
        - no_gratitude_disclosure_or_ideological_condition_is_attached
      - measurement_id: c2007_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2007_a2_adverse
        kind: boolean
        role: adverse
