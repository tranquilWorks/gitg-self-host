    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Helping without paternalism; no purchase, subscription, travel, credential, or public artifact is
      required.
    accessibility:
    - Use accessible communication, a qualified interpreter or an authorized service. A fictional form
      can be used for rehearsal when no real request exists. Do not collect sensitive data, submit applications
      or assume legal authority merely because assistance was welcomed.
    cultural_context:
    - Adapt the expression of Helping without paternalism to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use accessible communication, a qualified interpreter or an authorized service. A fictional form
      can be used for rehearsal when no real request exists. Do not collect sensitive data, submit applications
      or assume legal authority merely because assistance was welcomed.
  pause_conditions:
  - Pause Helping without paternalism when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Helping without paternalism practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Helping without paternalism situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
    and can involve serious risk.
