  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not an actual person''s feedback.


      Pat prepares the large-print instruction and reads the requested distinction. Lee says the copy
      is useful, then uses its public contact line to locate the fictional Event Questions entry without
      Pat choosing it. This is an observed step within the supplied case, not a test imposed as a condition
      of help.


      Lee chooses to keep a waiting-list request as a draft. Nothing is submitted, no seat is confirmed
      and no organizer has replied. Pat does not touch the device or credentials. Lee keeps the accessible
      copy and asks whether the same reading support would be available in principle. Pat offers one further
      brief session if requested; no particular future session has been requested or scheduled yet.


      The useful endpoint is the selected explanation, retained information and located contact. Gratitude
      alone would not establish any of those states. Do not claim full form completion, broad independence,
      improved safety or a legal capacity judgment. Lee can continue to choose support without owing praise,
      disclosure or control over later choices.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Offer a small piece of help that the receiving person chooses and controls. Allow fifteen minutes
      to prepare, a brief consented exchange and one agreed low-risk action. Use an event-registration
      form or the supplied fiction. Useful help can include continuing assistance; independence is not
      a test someone must pass to deserve support.


      ### Start from the person''s task


      The helper''s first interpretation can be wrong. Difficulty with a form might reflect unclear instructions,
      a poor layout, an unfamiliar term, an inaccessible format or something else. It does not establish
      low literacy, disability, inability to decide or lack of motivation. Ask what the person wants to
      accomplish and what kind of help, if any, would be useful. A refusal is information about permission,
      not a challenge to overcome.


      Separate the outcome from the mode of assistance. Someone may want to understand a waiting list
      and prefer a term read aloud. That does not authorize choosing an event, supplying personal details
      or submitting an application. Options might include reading instructions, clarifying a word from
      the official text, locating a public contact or stepping back. Describe your own limits; a friendly
      helper is not automatically a benefits adviser, interpreter or legal representative.


      Preserve control at the actual decision point. Let the person keep their device, credentials, documents,
      choices and final submission. An offer is not acceptance, and acceptance of one task does not expand
      silently. Ask before changing the mode or scope. Where more assistance is requested, confirm it
      rather than withholding it to manufacture an independence outcome. If a task exceeds your competence,
      offer an appropriate route without taking over or promising eligibility.


      Paternalism can also hide in how a result is described. Gratitude might express politeness or relief;
      it does not prove that a form was understood or a goal met. Ask whether the agreed part was useful
      in the person''s terms. A concrete observation, such as locating the intended public contact with
      a chosen accessible copy, can support a narrow capacity claim. Do not make the person demonstrate
      ability for your satisfaction, reveal a diagnosis, endorse your views or appear in a success story.


      Consider what remains after you leave. Keeping the only usable instructions or contact information
      with the helper can create avoidable dependence. Offer a copy in a useful format, while respecting
      a preference for ongoing help. Dependence on reliable support is not humiliation or failure. The
      problem is unwanted control, blocked options or help made conditional on loyalty. Context matters:
      improving the form itself may require its owner, not more effort from the recipient.


      ### Worked example


      A helper starts to say, “Give me the phone and I''ll finish it.” The person replies that they only
      want the waiting-list term explained in large print. The helper checks the supplied instruction,
      produces the requested copy and leaves the decision and device with the person. The person can now
      find the public questions contact; whether they register is still their choice. The helper''s smaller
      role is the agreed useful contribution.


      ### Supplied fictional case


      Lee is looking at a fictional community-event registration form. Its instruction says: “A waiting-list
      request does not reserve a seat. The organizer sends a separate confirmation if a seat becomes available.”
      A second line identifies the public Event Questions contact, without a real address. No deadline,
      fee, eligibility rule or actual event is supplied.


      Lee asks Pat for a large-print copy of those two lines and a spoken explanation of waiting list
      versus confirmed place. Lee keeps the fictional device and all choices. Pat is permitted to read
      the instruction and prepare the copy, but not to handle credentials, select an event or submit anything.
      Lee wants to retain the contact line for future questions and may ask for the same reading support
      again. Do not invent a personal history to explain the request.


      ### Carry out one chosen assistance unit


      1. Ask what result and mode are wanted. In fiction, restate Lee''s specific request and the ability
      to stop. Output: agreed task and permissions, with no assumed diagnosis or broad takeover.

      2. Read the supplied instruction and distinguish the two statuses in ordinary words. Identify anything
      it does not answer. Output: a usable explanation that does not promise a seat, eligibility or a
      response date.

      3. Make the requested large-print copy or rehearse that action accessibly. Leave the device, choices
      and submission with Lee. Output: the selected support actually offered or completed, accurately
      labeled.

      4. Ask whether the agreed help was useful and whether anything else is wanted. Offer the public
      contact copy without demanding a performance test. Output: the recipient''s chosen next step and
      the actual endpoint, including “no further help wanted.”

      5. Compare your first assumption with the [later packet](?resource=file-later-packet-md). Retain
      the option of recurring chosen help and identify a form-design question only its owner can resolve.
      Output: one correction to the helper''s approach and a bounded benefit claim.


      ### Support and transfer


      A supported attempt can rehearse the request and response aloud with the fictional instruction.
      Large print, oral response, more time and continuing chosen assistance are legitimate, not lowered
      dignity. For a harder case, the helper could finish quickly but the person wants time to decide.
      Preserve the pause; urgency created by the helper is not permission.


      Real transfer should use a willing person''s low-risk task with explicit scope. Stop at private
      credentials, regulated advice, uncertain authority or unrequested intervention. Leave necessary
      information accessible to its owner and agree any follow-up rather than assuming continuing access.
      Fiction can demonstrate the distinction between support and control, but cannot establish that an
      actual person''s capacity or safety increased.


      ### Source use


      [ACL''s Supported Decision Making Program, S09](https://acl.gov/programs/consumer-control/supported-decision-making-program),
      explains person-chosen, decision-specific assistance that retains control. This is the narrow conceptual
      support used here. It supplies no assessment of Lee, legal capacity decision, authority over an
      account or evidence that the invented form exercise works. The task, dialogue and result are original
      fiction.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Someone has trouble with an online form. What can you infer about their ability to decide, and
      what should you ask before acting?

      2. A person accepts an explanation, says thank you and keeps a draft. Which of submission, a confirmed
      place and useful help has actually been established?

      3. The same person requests reading support again. Must you withdraw it to prevent dependence, or
      take over the whole task to save time?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Difficulty does not determine decision-making ability or its cause. Ask the person''s goal,
      preferred help and permission; distinguish an access or design problem from an unsupported personal
      judgment. Keep choices and credentials with the person.

      2. Neither submission nor a confirmed place follows. Gratitude alone also does not prove usefulness.
      Check the selected task and the person''s account or concrete task evidence. This prompt supplies
      no task result or participant account of usefulness beyond thanks. Useful help therefore remains
      unestablished; the request remains a draft.

      3. Neither response is automatic. Continuing chosen assistance can preserve agency. Agree the next
      task and your limits without forcing independence, withholding useful information or expanding authority.
      A future offer is not a scheduled session.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
