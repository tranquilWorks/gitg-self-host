  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The learner''s first draft allowed A twenty-four places but capped B at twelve because its view
      felt uncomfortable. No relevant difference supported that cap. After exchanging labels, the learner
      removes it and applies the same thirty-person capacity and ordinary conduct conditions to both twenty-four-person
      requests. Six places of capacity remain in each separate booking; they are not a joint forty-eight-person
      event.


      For C, the learner records the supplied confirmed threat as a relevant difference and refers the
      fictional decision to the authorized manager and appropriate qualified safety/legal route. The proposed
      process gives reasons and a way to challenge factual error without publishing identifying threat
      details. No final risk assessment, booking approval, permanent exclusion or actual protective outcome
      is supplied.


      Credit the corrected inconsistent rule and the separate handling of relevant safety evidence. The
      case does not show that a disliked group is dangerous, that every restriction is unlawful or that
      neutrality requires ignoring a credible concern. No actual group, venue or legal proceeding has
      been engaged.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Apply one rights-and-process rule to two groups you evaluate differently, then test a relevant
      safety difference. Use two twenty-minute comparisons and ten minutes to revise. This is fictional
      analysis. It does not invite contact with an unsafe group, require debate over anyone''s dignity
      or advise action in an actual legal dispute.


      ### Separate principle, rule and decision


      A right identifies an important protected interest; its legal scope and remedies depend on the relevant
      system. A duty identifies something a person or institution owes under an applicable rule or relationship.
      A preferred outcome is neither automatically a right nor a duty. Stating which interest is at stake
      makes reasoning clearer than using “freedom” or “safety” as a complete answer.


      The [Universal Declaration of Human Rights, S05](https://www.coe.int/en/web/compass/the-universal-declaration-of-human-rights-full-version-),
      provides a general reference for equality, fair process, expression, peaceful association and duties
      to others. Its principles are not a substitute for identifying the law that governs a particular
      forum. A public hall, private club and workplace may have different applicable arrangements. Do
      not claim that one room-use exercise establishes constitutional rights everywhere.


      Liberty, safety and order can pull in different directions. A room needs capacity limits and workable
      booking rules; users retain interests in fair treatment and expression. A limit should have a relevant
      reason, appropriate authority and an explanation of why it fits the actual problem. “I dislike their
      view” and “there is specific evidence of a threat” are different propositions. Neither automatically
      settles every legal question.


      Due process concerns how a decision is made and can be challenged, not simply whether you like its
      result. For this small fictional forum, consider clear notice, relevant reasons, a chance to correct
      factual error and a review route. These are educational design questions, not a legally sufficient
      procedure for every dispute. Real urgent danger can require prompt protective action while preserving
      the appropriate later review.


      Consistency does not require ignoring relevant differences. Swapping group labels is useful because
      it exposes favoritism when conduct and circumstances stay the same. A changed attendance number,
      actual threat or access need may justify a different response. State the fact that matters and test
      whether it would matter just as much for a favored group.


      ### Worked example


      A hall''s capacity is thirty. Two lawful discussion groups each request space for twenty-four people
      under identical conditions. Denying only the disliked group because it is “controversial” leaves
      the relevant difference unexplained. A third request for forty people raises a capacity issue whatever
      the viewpoint. That example still does not authorize a learner to adjudicate a real forum''s law;
      it tests the coherence of a proposed rule.


      ### Supplied fictional cases


      Cedar Hall offers ordinary discussion bookings. Group A is familiar and agreeable to the learner;
      Group B holds a lawful view the learner dislikes. Both request separate available times for twenty-four
      attendees, accept the same ordinary conduct conditions and present no supplied safety concern. The
      hall''s fictional capacity is thirty. No particular political, religious or demographic identity
      is assigned.


      A separate Case C concerns a specific threatening message whose authenticity has been confirmed
      in the fiction by the designated hall safety lead. The message concerns the proposed event. No operational
      details are supplied. The authorized manager must consider an appropriate protective response and
      qualified guidance; the learner is not assigned to confront, investigate or contact anyone. Case
      C''s legal context and final risk assessment remain unknown.


      ### Write the rule before selecting the beneficiary


      1. Name the interests in expression, association, equal treatment and safety, together with users''
      ordinary obligations. Write a capacity-and-conduct rule before applying labels. Output: a rule whose
      terms do not depend on liking a group.

      2. Apply it to A and B, then exchange their labels without changing any supplied fact. Explain whether
      the result changes. Output: two consistent ordinary-case decisions, or an identified inconsistency
      to repair. Do not invent a hidden threat to rationalize preference.

      3. Examine C separately. Identify the specific relevant evidence, proper decision authority, less
      restrictive possibilities that require professional assessment and the limit of your knowledge.
      Output: an analytical response that takes the concern seriously without declaring a permanent ban
      or an event safe.

      4. Draft a short fictional decision with reasons, notice, a route for correcting factual error and
      review by the appropriate authorized role. Name a fact and a legal question that could change it.
      Output: a bounded process proposal, not a legal opinion or operational safety plan.

      5. Save the first decisions before the [later packet](?resource=file-later-packet-md). Review whether
      a preferred group received an unexplained exemption. Output: the correction and the unresolved case,
      with neither hidden by a general slogan.


      ### Support and transfer


      For support, use two invented hobby associations and read the capacities with counters or a simple
      table. No one must rehearse hateful speech or personally threatening material. For a harder fictional
      comparison, change one relevant condition after the identity swap and explain why consistent principles
      can now yield a different outcome.


      Real transfer can begin by reading an organization''s actual published participation and review
      rules without initiating a dispute. Questions about discrimination, legal jeopardy or a credible
      threat require appropriate qualified channels. Do not treat this lesson''s review template as a
      filing, waiver of rights or guarantee of safety. A well-reasoned fictional decision shows consistency
      under supplied facts, not readiness to judge all civil-liberty conflicts.


      ### Source limits


      S05 is the original declaration reproduced by the Council of Europe, with the relevant articles
      inspected. Direct UN and OHCHR routes returned access errors; the successful official reproduction
      is identified in the register. The room cases, capacity numbers and review process are original
      teaching design. General principles neither determine local enforceability nor remove duties to
      respond appropriately to real safety concerns.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. Group labels are swapped while every relevant fact stays the same, and only the disliked group
      now receives a lower capacity. What does that reveal?

      2. A specific credible safety concern arises. Does equal treatment require ignoring it, or automatically
      justify permanent exclusion?

      3. A declaration describes freedom of association. Does that alone establish an enforceable right
      to use any room under this exercise''s proposed procedure?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. It exposes an unexplained preference-based difference. Apply the same relevant rule or identify
      a genuine factual distinction. Do not invent motives or danger to defend the unequal result.

      2. Neither. Take the relevant evidence seriously through appropriate authority and qualified guidance,
      consider proportionate options and review, and preserve unknowns. The example supplies no final
      risk assessment or universal legal permission for a ban.

      3. No. General principles inform reasoning, while the forum, jurisdiction, applicable rules and
