meaning_and_fit:
  purpose: Reason consistently about liberty, safety, obligations and fair process while separating general
    human-rights principles from enforceable local law.
  why_recommended: Reason consistently about liberty, safety, obligations and fair process while separating
    general human-rights principles from enforceable local law.
  claims:
  - statement: Reason consistently about liberty, safety, obligations and fair process while separating
      general human-rights principles from enforceable local law.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Rights, duties, law, and civil liberty practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Rights, duties, law, and civil liberty as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Choose a low-stakes fictional association rather than a traumatic or personally
    threatening example. No one must debate their own dignity or meet an unsafe group. For actual discrimination,
    legal jeopardy or safety concerns, use appropriate qualified support.
  opportunity_considerations: 'Use a fictional community hall with two lawful groups requesting the same
    room: one you agree with and one you dislike. Both propose the same number of attendees and ordinary
    discussion. A separate third case involves a specific credible safety concern. Prepare headings for
    right or interest, duty, evidence, restriction, process and appeal.'
  prerequisites:
  - 'Use a fictional community hall with two lawful groups requesting the same room: one you agree with
    and one you dislike. Both propose the same number of attendees and ordinary discussion. A separate
    third case involves a specific credible safety concern. Prepare headings for right or interest, duty,
    evidence, restriction, process and appeal.'
  dependencies: []
  safe_alternatives:
  - Choose a low-stakes fictional association rather than a traumatic or personally threatening example.
    No one must debate their own dignity or meet an unsafe group. For actual discrimination, legal jeopardy
    or safety concerns, use appropriate qualified support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Rights, duties, law, and civil liberty differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Rights, duties, law, and civil
    liberty as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional community hall with two lawful groups requesting the same room: one you agree
    with and one you dislike. Both propose the same number of attendees and ordinary discussion. A separate
    third case involves a specific credible safety concern. Prepare headings for right or interest, duty,
    evidence, restriction, process and appeal. Goal: Reason consistently about liberty, safety, obligations
    and fair process while separating general human-rights principles from enforceable local law. Scope:
    This is a fictional case analysis, not advice about an actual protest, legal dispute or entitlement.
    Local law and qualified legal guidance determine real rights, duties and procedures. Time and effort:
    Two 20-minute case comparisons and a 10-minute revision. Adaptation: Choose a low-stakes fictional
    association rather than a traumatic or personally threatening example. No one must debate their own
    dignity or meet an unsafe group. For actual discrimination, legal jeopardy or safety concerns, use
    appropriate qualified support. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Choose a low-stakes fictional association rather than a traumatic or personally
    threatening example. No one must debate their own dignity or meet an unsafe group. For actual discrimination,
    legal jeopardy or safety concerns, use appropriate qualified support.
  expected_burden: Two 20-minute case comparisons and a 10-minute revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Rights, duties, law, and civil liberty protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Rights, duties, law, and civil liberty action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Choose a low-stakes
    fictional association rather than a traumatic or personally threatening example. No one must debate
    their own dignity or meet an unsafe group. For actual discrimination, legal jeopardy or safety concerns,
    use appropriate qualified support.
  actions:
  - stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01-A1
    sequence: 1
    title: State a rule before choosing which group benefits
    instructions: 'Write a room-use rule based on relevant conduct, capacity and access rather than agreement
      with a viewpoint. Identify the interests in expression, association, safety and equal treatment,
      and the users’ obligations to follow legitimate conditions. Read a general human-rights source and
      distinguish its normative principles from the actual local rules that would need verification. Do
      not claim that every forum or jurisdiction applies the same legal test.


      Observation checks: The rule is written before favoring a group; Rights interests and corresponding
      obligations are named; General principles and local enforceability are separated; The rule concerns
      relevant conduct rather than personal agreement. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01
      action_stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01-A1
      competency_stable_id: '20.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2003_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2003_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_rule_is_written_before_favoring_a_group
        - rights_interests_and_corresponding_obligations_are_named
        - general_principles_and_local_enforceability_are_separated
        - the_rule_concerns_relevant_conduct_rather_than_personal_agreement
      - measurement_id: c2003_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2003_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01-A2
    sequence: 2
    title: Swap the identities and examine a genuine safety difference
    instructions: 'Apply the same rule to both ordinary requests, then swap the group labels and check
      whether your decision changes without a relevant fact changing. In the third case, ask what specific
      evidence supports a safety restriction, whether a less-restrictive response is possible and who
      has authority to decide. Dislike, rumor or group identity alone does not supply the missing evidence
      in this exercise; do not pretend that credible threats must be ignored in the name of neutrality.


      Observation checks: The identity-swap test is performed; Any different treatment has a relevant
      stated reason; Safety evidence and less-restrictive options are considered; Neither dislike nor
      abstract neutrality replaces factual judgment. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01
      action_stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01-A2
      competency_stable_id: '20.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2003_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2003_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_identity_swap_test_is_performed
        - any_different_treatment_has_a_relevant_stated_reason
        - safety_evidence_and_less_restrictive_options_are_considered
        - neither_dislike_nor_abstract_neutrality_replaces_factual_judgment
      - measurement_id: c2003_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2003_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01-A3
    sequence: 3
    title: Add notice, explanation and a review path
    instructions: 'Write a short decision that explains the rule, the relevant facts, any limit and how
      a person can challenge an error through an appropriate process. Identify one fact or legal question
      that would change the decision and where qualified local guidance would be obtained. Revise any
      sentence that grants your preferred group an unexplained exception. Keep the case fictional; drafting
      a fair process does not establish that you can adjudicate a real legal dispute.


      Observation checks: The decision gives reasons and relevant facts; Notice and a review route are
      included; A revising fact or legal uncertainty is explicit; An unexplained exception for a preferred
      group is removed. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.


      Final review: Which restriction could you defend after the group labels were swapped, and which
      part of your conclusion still depends on local law?


      Examples: Supportive: The participant used the same capacity rule for both groups and required specific
      evidence and review for a safety restriction.


      Mixed: The initial decision favored a familiar group, but the identity swap exposed the inconsistency
      and prompted revision.


      Contradictory: Rights were withheld because a group was disliked, or a credible danger was ignored
      to perform neutrality.


      Inconclusive: A rights slogan was repeated without a rule, identity swap, obligation or fair-process
      step.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2003-RIGHTS-DUTIES-LAW-AND-CIVIL-LIBERTY-01
