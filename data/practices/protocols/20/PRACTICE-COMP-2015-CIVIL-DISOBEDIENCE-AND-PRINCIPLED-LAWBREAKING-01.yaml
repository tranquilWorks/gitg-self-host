  - stable_id: PRACTICE-COMP-2015-CIVIL-DISOBEDIENCE-AND-PRINCIPLED-LAWBREAKING-01-A2
    sequence: 2
    title: Compare necessity, proportionality and harm
    instructions: 'List lawful or less harmful alternatives and what evidence would show that they were
      inadequate, unavailable or too slow for the relevant harm. Examine who bears the risk, especially
      people who did not consent, and whether the method remains nonviolent and proportionate to the aim.
      Do not assume a conscientious label excuses intimidation, property harm or exposing dependents to
      danger. Identify a condition under which the proposed act should not proceed.


      Observation checks: Alternatives are seriously considered; Risks to nonconsenting people are explicit;
      Method and consequence are assessed for proportionality; A reasoned condition for not proceeding
      is named. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
