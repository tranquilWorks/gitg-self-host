  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      A later fictional policy note says that an owner review of evening-room restrictions can be requested
      in writing and that an answer is normally sought within five working days. No guarantee of response,
      fairness, legal status or enforceable remedy is supplied. Case A has not used this specified review
      route; its earlier unanswered general request is not shown to have triggered it.


      The learner revises “all lawful alternatives are unavailable” to “a stated review route exists but
      has not been tested in this case.” The equal-access grievance remains relevant. The new fact weakens
      the supplied necessity argument; it does not prove that indefinite waiting is always acceptable
      or settle the proposal''s morality or legality. Risks to uninvolved users remain unspecified.


      Case B''s stipulated original convenience motive is unchanged. Later moral language does not rewrite
      that history, although a genuinely new argument could still be examined on its merits. No breach,
      appeal submission, legal consultation or sanction occurs in either case. Accountability does not
      require surrendering legal rights or accepting an unjust accusation.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Compare two fictional claims of principle without planning a breach. Use two twenty-five-minute
      analyses and a ten-minute comparison. The task ends with a reasoned judgment and revising questions.
      It does not require public advocacy, violating a rule, risking arrest or giving up legal rights.


      ### Separate definition, justification and legal status


      Civil disobedience commonly refers to a conscientious breach of law used to communicate opposition
      to a law or policy and seek change. The roles of publicity, nonviolence and accepting consequences
      are debated in political philosophy. A sympathetic cause alone does not settle whether conduct fits
      that description or is justified. This exercise examines the canonical dimensions of public reasons,
      proportionality, nonviolence, transparency and accountability without presenting one checklist as
      a universal legal test.


      First ask what is actually being breached. A venue''s custom, a contractual term and an enacted
      law are not interchangeable. If the case does not establish legal status, say so. A breach of an
      internal rule might express protest without being a breach of law. Moral judgment and legality are
      related questions but neither automatically answers the other. A law can be criticized without assuming
      that conviction creates immunity from its consequences.


      A public reason should explain a wrong in terms that others can examine, rather than merely proclaiming
      loyalty to a favored group. Ask whose dignity or interests are affected and whether the principle
      would protect opponents under comparable conditions. A person may benefit from a principled change;
      private benefit does not automatically disqualify the reason. Conversely, adding moral language
      after a convenient act does not establish that principle guided it.


      Consider alternatives seriously. A lawful appeal, public explanation or authorized request may be
      available, unavailable, ineffective or too slow for an urgent harm. “We did not try” and “it cannot
      work” are different claims. Neither endless delay nor skipping every alternative is automatically
      justified. Name evidence that would bear on necessity and acknowledge what the supplied case leaves
      uncertain.


      Proportionality examines the relationship between aim, method and foreseeable burden, including
      effects on people who did not consent. A nonviolent intention does not guarantee a harmless result.
      Do not excuse intimidation, property damage, blocked essential services or exposing dependents to
      danger simply because the cause seems worthy. Your analysis should contain a real condition under
      which the proposal should not proceed, rather than a decorative assurance that all risk is acceptable.


      Transparency concerns reasons and responsibility; it need not require broadcasting vulnerable people''s
      identities. Accountability includes honest description of conduct, attention to harm and willingness
      to answer reasoned challenge. It does not mean waiving counsel, admitting an accusation you contest
      or accepting every punishment as just. Real decisions need current qualified local advice. This
      task does not prescribe how to execute, conceal or evade responsibility for an act.


      ### Worked comparison


      An actor states an equal-access principle before a proposed breach and applies it to opponents.
      Another hides a convenience-based act and later borrows the same language. Their reasons differ,
      but the first proposal still needs facts about the rule, alternatives and third-party risk. The
      second actor could develop a sincere later conviction, yet that would not retroactively establish
      the purpose or proportionality of the earlier conduct.


      ### Complete fictional case packet


      Case A: Cedar Hall has a written restriction reserving evening room requests to long-standing clubs.
      Newer clubs report exclusion. An association publicly proposes a nonviolent breach of the restriction
      to challenge it and says the same access principle should protect clubs it dislikes. One written
      request has received no answer. The association claims appeals are unavailable, but supplies no
      policy text or legal advice supporting that claim. No breach occurs in the case; no operational
      method is provided.


      Case B: a person secretly bypasses a booking rule to obtain a convenient time for a private game,
      then claims equal access after discovery. The stipulated initial purpose was convenience. The person
      has not explained why the rule is unjust or why ordinary booking was inadequate. Their later claim
      deserves examination but is not evidence of their earlier motive.


      For both cases, the rule''s legal status, enforcement powers, immediate harm, available alternatives
      and effects on uninvolved users are incomplete. Do not invent an arrest, physical obstruction, real
      political group or jurisdiction.


      ### Produce a conditional comparative judgment


      1. Identify the challenged rule, stated grievance, affected parties and supplied purpose. Keep law,
      policy and custom distinct. Output: known facts beside missing facts for each case.

      2. Present the strongest public reason without endorsing the proposed act. Apply it to an opponent
      and examine mixed motives without assuming that all benefit implies selfishness. Output: a consistency
      test with a specific reason for each provisional judgment.

      3. Compare lawful or less harmful alternatives and the evidence needed to assess delay or inadequacy.
      Assess nonconsenting people''s burden and name a stop condition. Output: an alternatives-and-proportionality
      analysis, not instructions for carrying out a breach.

      4. Save the judgment before the [later packet](?resource=file-later-packet-md). Update it when the
      assumed unavailability of review is challenged. Output: a changed necessity claim without erasing
      the grievance.

      5. State what remains a moral question, what needs qualified legal interpretation and what cannot
      be inferred. Output: a bounded comparison with no universal approval or demand to surrender rights.


      ### Support and transfer


      For support, compare the cases aloud using “reason, alternatives, burden, accountability.” A harder
      case includes a sincere moral grievance alongside a harmful method; evaluate both rather than granting
      a blanket exemption. No one needs to reveal their own political commitments.


      Transfer remains a source-based or fictional analysis. Real civil-disobedience decisions are outside
      this exercise and require appropriate legal and safety guidance with attention to affected people.
      Historical examples can inform reasoning without making present circumstances equivalent or their
      participants infallible. A thoughtful case analysis is not participation, legal approval or proof
      of civic courage.


      ### Source use


      [Stanford''s King Institute entry, S03](https://kinginstitute.stanford.edu/letter-birmingham-jail),
      places King''s letter within the historical Birmingham campaign and explains his distinction between
      justice and simply obeying imposed restrictions. The institutional entry and its excerpts were read,
      not the full letter or the cited books. It supplies historical context, not a complete theory or
      current legal advice. All Cedar facts and comparison questions are original.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      Civic learning does not require political belief, affiliation, public disclosure or participation.
      Fiction and no attempt are legitimate. Keep private or protected records private.


