  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use less personally
    charged fictional rules and oral comparison when writing is difficult. No participant must engage
    in civil disobedience, risk arrest or publicize a political position. Real decisions require current
    jurisdiction-specific advice and attention to safety and affected people.
  actions:
  - stable_id: PRACTICE-COMP-2015-CIVIL-DISOBEDIENCE-AND-PRINCIPLED-LAWBREAKING-01-A1
    sequence: 1
    title: State the strongest principled claim without endorsing the act
    instructions: 'For each case, identify the law or rule challenged, the claimed injustice and whose
      interests are affected. Distinguish a public moral reason from personal benefit, group loyalty or
      dislike of inconvenience. Ask whether the claimed principle could be applied consistently to opponents.
      Mark the legal status and factual grievance as unverified where the case does not supply them; moral
      conviction alone does not settle either.


      Observation checks: The challenged rule and claimed injustice are explicit; Public reason and private
      convenience are distinguished; Consistency toward opponents is examined; Unknown facts and law remain
      unverified. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2015-CIVIL-DISOBEDIENCE-AND-PRINCIPLED-LAWBREAKING-01
      action_stable_id: PRACTICE-COMP-2015-CIVIL-DISOBEDIENCE-AND-PRINCIPLED-LAWBREAKING-01-A1
      competency_stable_id: '20.15'
