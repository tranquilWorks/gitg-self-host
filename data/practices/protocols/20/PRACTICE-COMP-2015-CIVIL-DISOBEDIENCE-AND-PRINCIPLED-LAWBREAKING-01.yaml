  - stable_id: PRACTICE-COMP-2015-CIVIL-DISOBEDIENCE-AND-PRINCIPLED-LAWBREAKING-01-A3
    sequence: 3
    title: Write a verdict that preserves uncertainty and accountability
    instructions: 'For each case, explain whether the supplied reasons distinguish principled civil disobedience
      from opportunism, what facts could change that judgment and what qualified legal advice would be
      needed for any real decision. Consider transparency about aims and responsibility for consequences
      without requiring a person to waive legal rights or accept an unjust accusation. Finish with a justified
      analytical conclusion, not a plan to carry out the breach.


      Observation checks: Both cases receive a reasoned comparative judgment; Revising facts and qualified
      legal questions are stated; Accountability is separated from surrendering legal rights; The output
      remains analysis rather than operational lawbreaking. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What makes the claimed principle publicly defensible, and what prevents your sympathy
      for a cause from becoming a blanket excuse for its methods?


      Examples: Supportive: The participant distinguished a public grievance from private convenience
      while leaving legality, necessity and third-party risk unresolved where evidence was missing.


      Mixed: The initial verdict excused a favored cause; the opponent-consistency test led to stricter
      proportionality requirements.


      Contradictory: Conviction was treated as permission for harm, evasion or any rule-breaking that
      served a preferred group.


      Inconclusive: The cases were judged solely by whether the participant liked their causes, without
      alternatives or accountability.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2015-CIVIL-DISOBEDIENCE-AND-PRINCIPLED-LAWBREAKING-01
