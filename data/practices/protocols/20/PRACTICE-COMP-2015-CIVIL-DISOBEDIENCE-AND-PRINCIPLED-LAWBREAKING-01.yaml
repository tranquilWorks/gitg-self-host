  - statement: Evaluate a proposed breach of law through public reasons, proportionality, alternatives,
      nonviolence, transparency and accountability without confusing conviction with exemption from consequences.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Civil disobedience and principled lawbreaking practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Civil disobedience and principled lawbreaking as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use less personally charged fictional rules and oral comparison when writing
    is difficult. No participant must engage in civil disobedience, risk arrest or publicize a political
    position. Real decisions require current jurisdiction-specific advice and attention to safety and
    affected people.
  opportunity_considerations: 'Use two fictional cases: a group publicly proposes a nonviolent breach
    of a venue restriction to challenge an exclusionary rule; another person secretly breaks a rule for
    private convenience and later claims principle. Assume the actual legal context is unknown. Prepare
    columns for grievance, public reason, lawful alternatives, affected parties, risk, method, transparency
    and accountability.'
  prerequisites:
  - 'Use two fictional cases: a group publicly proposes a nonviolent breach of a venue restriction to
    challenge an exclusionary rule; another person secretly breaks a rule for private convenience and
    later claims principle. Assume the actual legal context is unknown. Prepare columns for grievance,
    public reason, lawful alternatives, affected parties, risk, method, transparency and accountability.'
  dependencies: []
  safe_alternatives:
  - Use less personally charged fictional rules and oral comparison when writing is difficult. No participant
    must engage in civil disobedience, risk arrest or publicize a political position. Real decisions require
    current jurisdiction-specific advice and attention to safety and affected people.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Civil disobedience and principled lawbreaking differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Civil disobedience and principled
    lawbreaking as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use two fictional cases: a group publicly proposes a nonviolent breach of a venue restriction
    to challenge an exclusionary rule; another person secretly breaks a rule for private convenience and
    later claims principle. Assume the actual legal context is unknown. Prepare columns for grievance,
    public reason, lawful alternatives, affected parties, risk, method, transparency and accountability.
    Goal: Evaluate a proposed breach of law through public reasons, proportionality, alternatives, nonviolence,
    transparency and accountability without confusing conviction with exemption from consequences. Scope:
    This is analysis of fictional cases only. It is not legal advice, encouragement to violate a law or
    operational guidance for protest, evasion or avoiding accountability. Time and effort: Two 25-minute
    case analyses and a 10-minute comparison. Adaptation: Use less personally charged fictional rules
    and oral comparison when writing is difficult. No participant must engage in civil disobedience, risk
    arrest or publicize a political position. Real decisions require current jurisdiction-specific advice
    and attention to safety and affected people. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use less personally charged fictional rules and oral comparison when writing is
    difficult. No participant must engage in civil disobedience, risk arrest or publicize a political
    position. Real decisions require current jurisdiction-specific advice and attention to safety and
    affected people.
  expected_burden: Two 25-minute case analyses and a 10-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Civil disobedience and principled lawbreaking protocol to rank worth, coerce participation,
