meaning_and_fit:
  purpose: Evaluate a proposed breach of law through public reasons, proportionality, alternatives, nonviolence,
    transparency and accountability without confusing conviction with exemption from consequences.
  why_recommended: Evaluate a proposed breach of law through public reasons, proportionality, alternatives,
    nonviolence, transparency and accountability without confusing conviction with exemption from consequences.
