meaning_and_fit:
  purpose: Verify a public claim’s source, context and uncertainty, then choose a proportionate share,
    correction or non-share without feeding an outrage cycle.
  why_recommended: Verify a public claim’s source, context and uncertainty, then choose a proportionate
    share, correction or non-share without feeding an outrage cycle.
  claims:
  - statement: Verify a public claim’s source, context and uncertainty, then choose a proportionate share,
      correction or non-share without feeding an outrage cycle.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Public discourse and information responsibility practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Public discourse and information responsibility as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use text, audio or an accessible original source, and avoid graphic or personally
    distressing material. For urgent safety information, rely on the relevant official emergency channel
    rather than delaying necessary action for this exercise. No political affiliation or browsing history
    needs to be recorded.
  opportunity_considerations: 'Use the fictional message The community center is closing next week, which
    links only to a cropped screenshot. Prepare five fields: exact claim, original source, date and context,
    independent confirmation, and what remains unknown. Do not forward the screenshot to recruit help
    before checking it.'
  prerequisites:
  - 'Use the fictional message The community center is closing next week, which links only to a cropped
    screenshot. Prepare five fields: exact claim, original source, date and context, independent confirmation,
    and what remains unknown. Do not forward the screenshot to recruit help before checking it.'
  dependencies: []
  safe_alternatives:
  - Use text, audio or an accessible original source, and avoid graphic or personally distressing material.
    For urgent safety information, rely on the relevant official emergency channel rather than delaying
    necessary action for this exercise. No political affiliation or browsing history needs to be recorded.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Public discourse and information responsibility differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Public discourse and information
    responsibility as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional message The community center is closing next week, which links only to a cropped
    screenshot. Prepare five fields: exact claim, original source, date and context, independent confirmation,
    and what remains unknown. Do not forward the screenshot to recruit help before checking it. Goal:
    Verify a public claim’s source, context and uncertainty, then choose a proportionate share, correction
    or non-share without feeding an outrage cycle. Scope: Use a low-stakes public-service claim or the
    fictional default. This is not intelligence analysis, a guarantee of truth or a requirement to engage
    with harmful content. Time and effort: A 20-minute verification pass, one bounded sharing decision
    and a 10-minute later check. Adaptation: Use text, audio or an accessible original source, and avoid
    graphic or personally distressing material. For urgent safety information, rely on the relevant official
    emergency channel rather than delaying necessary action for this exercise. No political affiliation
    or browsing history needs to be recorded. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text, audio or an accessible original source, and avoid graphic or personally
    distressing material. For urgent safety information, rely on the relevant official emergency channel
    rather than delaying necessary action for this exercise. No political affiliation or browsing history
    needs to be recorded.
  expected_burden: A 20-minute verification pass, one bounded sharing decision and a 10-minute later check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Public discourse and information responsibility protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Public discourse and information responsibility action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text, audio
    or an accessible original source, and avoid graphic or personally distressing material. For urgent
    safety information, rely on the relevant official emergency channel rather than delaying necessary
    action for this exercise. No political affiliation or browsing history needs to be recorded.
  actions:
  - stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01-A1
    sequence: 1
    title: Recover the claim’s origin and missing context
    instructions: 'Write the claim narrowly enough to verify: which center, what closing means and which
      dates. Trace the screenshot to an original official notice or mark that the origin is unavailable.
      Check whether the notice concerns a one-day repair, a service change or permanent closure. Separate
      a quote, interpretation and prediction. A familiar sender, large share count or strong emotional
      reaction does not establish the missing context.


      Observation checks: The claim is made specific and checkable; Original source and date are sought;
      Quote interpretation and prediction are separated; Popularity and emotional force are not treated
      as verification. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01-A1
      competency_stable_id: '20.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2009_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2009_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_claim_is_made_specific_and_checkable
        - original_source_and_date_are_sought
        - quote_interpretation_and_prediction_are_separated
        - popularity_and_emotional_force_are_not_treated_as_verification
      - measurement_id: c2009_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2009_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01-A2
    sequence: 2
    title: Seek a distinct check and assess the cost of error
    instructions: 'Use a separate authoritative channel, such as the center’s current official schedule
      or contact page, rather than another repost of the same image. Identify what the second source actually
      confirms and whether both depend on the same announcement. Consider who could be harmed by a false
      alarm or a premature dismissal. Set a stopping point for research and keep uncertainty visible;
      do not turn an unresolved rumor into an evening of compulsive refreshing.


      Observation checks: A genuinely distinct verification route is used; Shared source dependence is
      identified; Consequences of both false alarm and dismissal are considered; Research has a bounded
      stop point. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01-A2
      competency_stable_id: '20.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2009_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2009_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_genuinely_distinct_verification_route_is_used
        - shared_source_dependence_is_identified
        - consequences_of_both_false_alarm_and_dismissal_are_considered
        - research_has_a_bounded_stop_point
      - measurement_id: c2009_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2009_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01-A3
    sequence: 3
    title: Share with context, correct or decline to amplify
    instructions: 'Choose one action: share the verified original with a brief qualification, correct
      a previous inaccurate share through the same audience, or do not share because evidence remains
      weak. For the fictional case, draft the message without publishing. If you shared a real claim,
      make one later check for a correction and update the audience when needed. Record the verification
      process and uncertainty, not outrage intensity or engagement metrics.


      Observation checks: The sharing choice follows the evidence strength; Context and uncertainty accompany
      any share; A prior error has an explicit correction route; No fictional claim is published as real
      news. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.


      Final review: What changed between your first reaction and your final share decision, and could
      a reader distinguish what is known from what is inferred?


      Examples: Supportive: The cropped image proved to concern a one-day repair; the participant shared
      the dated original rather than the closure rumor.


      Mixed: The claim remained uncertain, so the participant withheld it and stated what verification
      was missing.


      Contradictory: A dramatic claim was forwarded because it fit a preferred narrative, or a correction
      was hidden from the original audience.


      Inconclusive: News was consumed extensively without tracing a claim, making a share decision or
      preserving uncertainty.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-2009-PUBLIC-DISCOURSE-AND-INFORMATION-RESPONSIBILITY-01-A3
