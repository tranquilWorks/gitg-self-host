  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. No real post, message or contact occurs.


      The learner sends the contextual correction to the same three fictional friends: the 8 October notice
      specifies repairs on 12 October and only a planned reopening on 13 October, subject to inspection.
      The learner identifies the earlier cropped forwarding as misleading. The operations reply does not
      remove the inspection condition.


      A new notice dated 12 October then states that inspection is delayed and the center will also remain
      closed on 13 October. It supplies no confirmed reopening date. The learner sends an update to the
      same three fictional recipients, links the new notice and withdraws any expectation of access on
      the 13th. The initial correction''s conditional wording was appropriate; the operating plan has
      now changed.


      The original forwarding, correction and later update are each marked sent to the three fictional
      recipients. Readership and changed beliefs are unknown. The five copies still count as dependent
      repetitions, not independent verification. The learner ends the planned review, retaining the official
      update route for a future practical need. Credit the correction and update sequence, not a solved
      information ecosystem or proof that every recipient is now informed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Check one consequential public claim, make a proportionate sharing decision and revisit it
      once. Allow twenty minutes for the initial check and ten minutes for a later correction. Use the
      complete fictional closure story or a low-stakes public notice. Staying informed includes knowing
      when enough has been checked for the present decision; repeated outrage is not a measure of civic
      attention.


      ### Match the claim to its evidence and stakes


      Begin with the exact proposition. “The center is closing next week” can mean one repair day, an
      indefinite closure or permanent loss of service. Identify the institution, place, date, duration
      and uncertainty that would change the meaning. Separate quoted text from a poster''s interpretation
      and a prediction about what will happen. A reaction count does not supply missing context.


      Pause before forwarding material that produces urgency or indignation. Ask who created it, what
      their connection is to the claim and what evidence they show. A source can be mistaken without being
      malicious. Cropping, an old date, missing conditions, copied language, misleading presentation and
      pressure to share immediately can all distort understanding. Do not diagnose a stranger''s motives
      or infer a coordinated campaign from one screenshot.


      Trace the material back to its original context and compare with a relevant current source. Five
      posts copying the same notice are five repetitions, not five independent confirmations. An official
      source may be well placed to state its own operational plan while still lacking evidence that the
      future plan will occur. A separate staff reply can confirm what is currently planned; it cannot
      make a conditional reopening certain. Independence, authority, freshness and direct observation
      answer different questions.


      Use a bounded check appropriate to the consequence. A routine service notice may need a dated original
      and a relevant clarification. A high-stakes health, legal or emergency claim requires the proper
      authoritative route and should not be settled by a classroom checklist. Consider both kinds of mistake:
      spreading a false permanent-closure claim can alarm people, while confidently dismissing a real
      temporary closure can waste a trip. State what is known, what is planned and what remains uncertain.


      Sharing is an action with a purpose and an audience. You can decline to amplify, send a concise
      contextual correction where a false claim already went, or point someone to an authoritative current
      update. Do not add inflammatory language to make a correction travel. Preserve the useful source,
      date and scope while minimizing needless repetition of the rumor. A correction should be easy to
      identify and reach the original audience where feasible.


      Set a stopping point and a sensible revisit trigger. An unresolved detail is not always a reason
      to scroll indefinitely. Save the operational uncertainty, stop checking for now and consult the
      next relevant dated update. If facts change, distinguish an honest update to a previously qualified
      statement from correction of an earlier error. Sending a correction does not prove that everyone
      read or believed it.


      ### Worked example


      A cropped image says a center is “closing next week.” The full notice limits closure to one repair
      day and makes reopening conditional on inspection. A careful message states those limits and links
      the dated notice. It does not announce permanent closure or promise next-day access. When the inspection
      is delayed, the message changes because the plan changed, not because every earlier source was necessarily
      deceptive.


      ### Supplied fictional case


      A fictional learner has already forwarded a cropped closure message to three fictional friends.
      No real messages were sent. The crop reads, “Cedar Community Center closing next week,” with no
      visible date or duration. Five reposts repeat the same crop and express anger; none provides a separate
      observation.


      The complete original notice, dated 8 October, states that the center will be closed on 12 October
      for repairs, with reopening planned for 13 October subject to inspection. A separate fictional operations-desk
      reply confirms this current plan and says the inspection result is not yet known. That reply is
      a separate contact about the same plan, not observation of a completed reopening. The later packet
      will supply one subsequent notice; do not invent the outcome now.


      ### Produce a responsible claim and correction


      1. Copy the exact proposition you need to check and identify the crop''s missing context. State
      the harm of an overclaim and of wrongly dismissing the closure. Output: a precise checkable claim
      and decision purpose.

      2. Trace the crop, five copies, original notice and operations reply. Mark dependence, date, competence
      and whether each concerns a plan or an observed event. Output: a short evidence chain without a
      false vote count of sources.

      3. Write a contextual correction to the three original fictional recipients. Include the one-day
      closure, conditional reopening and source date. Output: an explicit correction with no guaranteed
      reopening or unsupported permanent-closure allegation.

      4. Set one bounded revisit point for the inspection update, then stop. Open the [later packet](?resource=file-later-packet-md)
      and revise the operational statement. Output: a dated update that distinguishes changed plans from
      the original cropping error.

      5. Record the actual communication state. In this exercise every transmission is supplied fiction;
      in life, record only what you really sent. Output: audience, correction/update status and any unknown
      readership, without collecting contacts or screenshots as proof.


      ### Support and transfer


      For support, lay out the four supplied source types on separate cards and explain the chain aloud.
      For a harder case, the official page has not been updated but a screenshot claims it has. Preserve
      uncertainty, seek a relevant clarification once and avoid an unsupported categorical share.


      Real transfer can use an ordinary public service notice. Prefer direct links over reposting sensitive
      content. Do not contact people repeatedly, harass a source or infer anyone''s politics from sharing
      behavior. The goal is an accurate bounded decision, not winning a dispute or maximizing attention.
      Fiction practices verification and correction; it cannot demonstrate an actual audience''s understanding.


      ### Source use


      [Mike Caulfield''s original SIFT explanation, S11](https://hapgood.us/2019/06/19/sift-the-four-moves/),
      supports pausing, investigating source context and tracing a claim to better evidence. [SPJ''s voluntary
      ethics code, S15](https://www.spj.org/spj-code-of-ethics/), supports contextual accuracy and transparent
      correction. Neither page validates this exercise or guarantees truth. The closure sequence, timing
      and communication states are original fiction.


      ### Use the result at its proper scale


      Political and civic education only; protest, civil disobedience, and legal rights are jurisdiction-specific
      and can involve serious risk.


      This does not compel a belief, affiliation, public disclosure or live participation. Use fiction
      or no attempt where appropriate. Keep private identities and sensitive records private.


