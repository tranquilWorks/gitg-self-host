  - stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01-A2
    sequence: 2
    title: Model, accompany and then leave room to try
    instructions: 'Demonstrate one return to its place, describe what you are doing and invite the child
      to try a manageable part. Stay available without grabbing control at the first error. Notice frustration,
      offer a pause or simpler step and maintain the safety limit calmly. Model your own regulation by
      correcting a mistake without ridicule. Give specific information about the action rather than demanding
      affection, gratitude or perfect obedience as evidence that the relationship is secure.


      Observation checks: One action is demonstrated before independent expectation; The child has a genuine
      opportunity to act; Distress changes support rather than triggering humiliation; Safety is maintained
      without affection or obedience tests. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01
      action_stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01-A2
      competency_stable_id: '19.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
