        criteria:
        - authority_and_relevant_care_instructions_are_confirmed
        - current_ability_and_access_needs_shape_the_task
        - a_understandable_choice_and_predictable_next_step_are_offered
        - no_diagnosis_or_sibling_comparison_is_used
      - measurement_id: c1902_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
