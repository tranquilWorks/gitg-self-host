meaning_and_fit:
  purpose: Respond to a child’s current abilities and needs while combining warmth, predictable safety
    limits, demonstration and a genuine chance to act independently.
  why_recommended: Respond to a child’s current abilities and needs while combining warmth, predictable
    safety limits, demonstration and a genuine chance to act independently.
  claims:
  - statement: Respond to a child’s current abilities and needs while combining warmth, predictable safety
      limits, demonstration and a genuine chance to act independently.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Parenting and child development practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Parenting and child development as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use gestures, pictures, AAC, sensory-friendly materials or a shorter task.
    A person without a caregiving role may rehearse with the written case only; that is not live parenting
    evidence. Follow professional guidance for disability, distress, safety or developmental concerns.
  opportunity_considerations: Use putting away a few soft toys or books already familiar to the child.
    Confirm your caregiving authority and the existing care plan. Choose a small, accessible space and
    a task the child can reasonably try. No small parts, food, hazardous objects or public recording are
    needed.
  prerequisites:
  - Use putting away a few soft toys or books already familiar to the child. Confirm your caregiving authority
    and the existing care plan. Choose a small, accessible space and a task the child can reasonably try.
    No small parts, food, hazardous objects or public recording are needed.
  dependencies: []
  safe_alternatives:
  - Use gestures, pictures, AAC, sensory-friendly materials or a shorter task. A person without a caregiving
    role may rehearse with the written case only; that is not live parenting evidence. Follow professional
    guidance for disability, distress, safety or developmental concerns.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Parenting and child development differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Parenting and child development
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use putting away a few soft toys or books already familiar to the child. Confirm your caregiving
    authority and the existing care plan. Choose a small, accessible space and a task the child can reasonably
    try. No small parts, food, hazardous objects or public recording are needed. Goal: Respond to a child’s
    current abilities and needs while combining warmth, predictable safety limits, demonstration and a
    genuine chance to act independently. Scope: This is for an authorized parent or caregiver in an ordinary
    safe routine. It is not a developmental assessment, treatment plan, safeguarding investigation or
    permission to take responsibility for someone else’s child. Time and effort: Fifteen minutes to prepare
    and two 10-minute routine opportunities over one week, with breaks as needed. Adaptation: Use gestures,
    pictures, AAC, sensory-friendly materials or a shorter task. A person without a caregiving role may
    rehearse with the written case only; that is not live parenting evidence. Follow professional guidance
    for disability, distress, safety or developmental concerns. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use gestures, pictures, AAC, sensory-friendly materials or a shorter task. A person
    without a caregiving role may rehearse with the written case only; that is not live parenting evidence.
    Follow professional guidance for disability, distress, safety or developmental concerns.
  expected_burden: Fifteen minutes to prepare and two 10-minute routine opportunities over one week, with
    breaks as needed.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Parenting and child development protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Parenting and child development action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use gestures,
    pictures, AAC, sensory-friendly materials or a shorter task. A person without a caregiving role may
    rehearse with the written case only; that is not live parenting evidence. Follow professional guidance
    for disability, distress, safety or developmental concerns.
  actions:
  - stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01-A1
    sequence: 1
    title: Match the expectation to this child rather than an ideal age
    instructions: 'Observe what the child already does with these items, what needs a demonstration and
      what is inaccessible or tiring today. Ask or offer a simple choice: books first or soft toys first.
      Explain the safety limit and what will happen next in a form the child understands. Consult the
      authorized care plan or qualified professional for developmental questions; do not use the exercise
      to declare a delay or compare siblings.


      Observation checks: Authority and relevant care instructions are confirmed; Current ability and
      access needs shape the task; A understandable choice and predictable next step are offered; No diagnosis
      or sibling comparison is used. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01
      action_stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01-A1
      competency_stable_id: '19.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1902_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1902_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
