  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      On Monday Remy chooses books. Jules models putting one on the shelf. Remy places two books with
      one reminder, then says “too much.” Jules pauses the exercise, clears the remaining book and three
      toys, and keeps story time. The walkway is safe. Do not credit all seven items to Remy or treat
      the pause as punishment.


      On Thursday the task begins with only three books and a familiar picture cue. Jules models the first
      book. Remy places the other two without a verbal reminder and says the picture helped. Jules stays
      nearby and story time follows. The packet supplies no observation with all seven original items,
      no independent child-care assessment and no evidence about other routines.


      Compare two child placements on each day: Monday with one reminder, Thursday with a picture cue,
      a smaller load and no verbal reminder. The change may be useful under those conditions; it does
      not isolate which adjustment caused it or prove general independence. Include Remy''s feedback,
      adult safety work and continued warmth. Propose one proportionate next observation without increasing
      demand just to earn a better score.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Practice adjusting support during one familiar child-care routine. A live route requires an
      actual authorized parenting or caregiving role and consistency with the child''s existing care plan.
      Without that role, use the complete fiction only; do not recruit a child to demonstrate this competency.
      Allow fifteen minutes to prepare and two brief opportunities within a week, up to ten minutes each
      with breaks. Parenthood is not a required life path.


      ### Security and growing competence belong together


      Safety sets limits around hazards and necessary care. Attachment-related needs invite reliable,
      warm responsiveness; a clean room or fast response to an instruction cannot measure attachment.
      Development concerns changing capacities over time, including language, movement, planning, emotion
      and social understanding. Individual access needs, fatigue and familiarity matter now. A general
      age description cannot diagnose a particular child or determine what they should accomplish today.


      Discipline in this task means guiding a manageable routine with clear expectations and support.
      It excludes physical punishment, humiliation, threats of abandonment and withholding affection.
      Predictable limits can coexist with choices: “the books stay off the walkway; would you like to
      put books or soft toys away first?” The child has an accessible decision inside a safety boundary,
      rather than a false choice between compliance and punishment.


      Education and modeling include demonstrating a small action, thinking aloud simply and leaving room
      to try. Taking over at the first error can remove the practice opportunity; leaving a distressed
      child without help can turn autonomy into abandonment. Watch what the child can attempt and adjust
      the assistance. More independent action is not always today''s right target: illness, tiredness
      or an access barrier may call for more support.


      Growing competence is specific. A child who sorts three familiar books after one demonstration has
      practiced that task under those conditions. The result does not prove global maturity, parental
      quality or secure attachment. A child who declines or becomes frustrated supplies information about
      the situation; their dignity and entitlement to care do not depend on completing your exercise.


      ### Worked example


      A caregiver says “tidy everything” while a tired child faces a large pile. The child freezes. The
      caregiver reduces the task to two soft toys, shows one placement and stays nearby. The child places
      the second with help. The narrower success is an assisted attempt after adjusting demand. Calling
      the child lazy or claiming independent tidying would both misread the evidence.


      ### Supplied fictional task


      Jules is the authorized caregiver for seven-year-old Remy during an established afternoon routine.
      The existing care plan permits a brief shared tidy of familiar books and soft toys before story
      time. No lifting, sharp objects, medicines or unfamiliar child-care action is involved. Remy usually
      recognizes the book shelf and toy basket and sometimes needs a picture cue when tired. No developmental
      diagnosis is supplied or requested.


      On Monday there are four books and three soft toys on a low table and floor area. Remy says they
      are tired and would prefer the story. Jules can spend ten minutes, can shorten the tidy, and can
      keep story time regardless of how much Remy completes. The walkway must remain clear for safety.
      Remy has not yet been offered a choice or shown the first step. A second comparable opportunity
      is available on Thursday; its outcome is not yet known.


      ### Prepare and observe the routine


      1. Confirm role, care-plan fit and an ordinary safe setting. Note Remy''s current tiredness, familiar
      cues and the specific safety limit. Output: a short preparation card about today''s support, not
      an age-based rating or comparison with another child.

      2. Offer an accessible choice between books and soft toys first, with a small clear next step. If
      speech is not the useful format, use familiar pictures or another established communication method.
      Output: the choice and Remy''s actual response if provided; do not invent assent from silence.

      3. Model one item, then invite a manageable attempt while staying available. Allow time and help.
      If frustration rises, pause or reduce the demand rather than escalate pressure. Maintain the walkway
      safety limit through the adult''s appropriate care responsibility. Output: what was demonstrated,
      what Remy attempted and what help was needed.

      4. Note specific effort or strategy without turning praise into a demand for performance. Preserve
      warmth and story time. Plan one adjustment for Thursday—fewer items, a clearer cue or a different
      prompt—based on the actual first opportunity. Output: a support hypothesis, not a promise of independence.

      5. Save your plan and open the [later packet](?resource=file-later-packet-md). Compare only the
      supplied observations and the changed task conditions. Include Remy''s words or mark feedback unknown.
      Output: what support seems useful and what remains untested.


      ### Adapt, challenge and transfer


      For support, rehearse entirely with the fictional items on paper. A facilitator can model the adult''s
      words without a child present. For a harder fictional review, make the second day more tiring and
      ask whether adding help is appropriate even if it reduces independence. Difficulty should increase
      the adult''s judgment demand, not the child''s distress.


      For an authorized real attempt, choose a familiar, safe routine already within your role. Coordinate
      with relevant caregivers and follow existing disability, medical or educational guidance. Stop the
      exercise aspect when the child''s needs require ordinary care. No public recording or identifiable
      child evidence is needed. Persistent developmental concerns, distress, suspected harm or uncertainty
      about care authority require suitable qualified local guidance. Two observations can guide a modest
      adjustment; they cannot validate parenting ability or diagnose development.


      ### Source use


      [CDC''s ages 6–8 parenting sheet, S12](https://stacks.cdc.gov/view/cdc/155268/cdc_155268_DS1.pdf)
      informs small achievable tasks, clear expectations, modeling and supportive guidance. It is a 2015
      educational resource, not an individualized current assessment. Its dated lifestyle quantities and
      milestone claims are not imported. The two-opportunity routine and evidence distinctions are original.


      ### Use the result at its proper scale


      Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
      guidance.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
