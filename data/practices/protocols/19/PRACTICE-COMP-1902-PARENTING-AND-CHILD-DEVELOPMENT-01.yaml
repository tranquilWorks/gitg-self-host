  - stable_id: PRACTICE-COMP-1902-PARENTING-AND-CHILD-DEVELOPMENT-01-A3
    sequence: 3
    title: Repeat with a support adjustment and review the relationship
    instructions: 'On the next ordinary opportunity, repeat the routine with one appropriate change: fewer
      items, a visual label or less prompting when welcomed. Compare what the child attempted, where help
      was requested and whether your response remained predictable. Ask in an accessible way what helped
      or was difficult. Keep the observation private and ordinary; the outcome is a better-matched caregiving
      interaction, not a score of attachment, intelligence or parenting worth.


      Observation checks: A second ordinary opportunity is observed; One support adjustment is made for
      a stated reason; The child’s response or inability to respond remains visible; Growing participation
      is distinguished from forced compliance. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Where did your support create security and room to learn, and where did your expectation
      exceed the child’s current capacity?


      Examples: Supportive: After a demonstration and picture label, the child returned two books and
      asked for help with another while the caregiver stayed calm.


      Mixed: The routine was safe, but too many instructions led to frustration; the caregiver shortened
      the next attempt.


      Contradictory: The adult used shame, physical punishment or withdrawal of affection to obtain a
      tidy result.


      Inconclusive: A parenting principle was discussed without an observed routine or clearly labeled
      case rehearsal.'
    expected_time: 15-25 minutes
    due_within_days: 10
