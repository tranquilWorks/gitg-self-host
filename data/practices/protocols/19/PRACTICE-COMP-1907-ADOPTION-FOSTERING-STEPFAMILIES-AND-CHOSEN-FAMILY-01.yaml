  - stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01-A2
    sequence: 2
    title: Offer a choice that permits more than one belonging
    instructions: 'Invite each willing participant to choose one low-risk element for the space or activity.
      Explain that retaining an earlier family connection or choosing privacy is not rejection of the
      current household. Use the same freedom for biological and nonbiological relationships without demanding
      equal feelings or labels. Check existing contact, confidentiality and safeguarding requirements
      before displaying a name or image; when unclear, use a neutral symbol or postpone that element.


      Observation checks: Participation and the chosen form are voluntary; More than one legitimate connection
      can coexist; Affection labels and equal feelings are not demanded; Contact image and confidentiality
      limits are checked. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01
      action_stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01-A2
      competency_stable_id: '19.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1907_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1907_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
