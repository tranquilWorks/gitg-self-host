meaning_and_fit:
  purpose: Create a small, authorized belonging practice in an adoptive, foster, stepfamily or chosen-family
    context without erasing history, identity or competing loyalties.
  why_recommended: Create a small, authorized belonging practice in an adoptive, foster, stepfamily or
    chosen-family context without erasing history, identity or competing loyalties.
  claims:
  - statement: Create a small, authorized belonging practice in an adoptive, foster, stepfamily or chosen-family
      context without erasing history, identity or competing loyalties.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Adoption, fostering, stepfamilies, and chosen family
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Adoption, fostering, stepfamilies, and chosen family as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use a story, language choice, meal or private object rather than photographs.
    People without an actual role use the fictional case only. Follow placement, custody, guardianship
    and child-safety requirements; chosen-family belonging does not itself confer legal authority.
  opportunity_considerations: 'Use a fictional family deciding how to display names and photographs in
    a shared space, or a similarly low-stakes situation in your actual authorized role. Prepare optional
    choices: a private keepsake, a chosen name label, a shared image, an empty space or no participation.
    Do not require anyone to call a person parent or reveal an origin story.'
  prerequisites:
  - 'Use a fictional family deciding how to display names and photographs in a shared space, or a similarly
    low-stakes situation in your actual authorized role. Prepare optional choices: a private keepsake,
    a chosen name label, a shared image, an empty space or no participation. Do not require anyone to
    call a person parent or reveal an origin story.'
  dependencies: []
  safe_alternatives:
  - Use a story, language choice, meal or private object rather than photographs. People without an actual
    role use the fictional case only. Follow placement, custody, guardianship and child-safety requirements;
    chosen-family belonging does not itself confer legal authority.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Adoption, fostering, stepfamilies, and chosen family differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Adoption, fostering, stepfamilies,
    and chosen family as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a fictional family deciding how to display names and photographs in a shared space, or a
    similarly low-stakes situation in your actual authorized role. Prepare optional choices: a private
    keepsake, a chosen name label, a shared image, an empty space or no participation. Do not require
    anyone to call a person parent or reveal an origin story. Goal: Create a small, authorized belonging
    practice in an adoptive, foster, stepfamily or chosen-family context without erasing history, identity
    or competing loyalties. Scope: This is an ordinary family inclusion exercise, not placement advice,
    attachment treatment, legal-parentage determination or permission for contact that conflicts with
    a safety or legal plan. Time and effort: Twenty minutes of preparation, one short willing conversation
    and one small shared activity or labeled case rehearsal. Adaptation: Use a story, language choice,
    meal or private object rather than photographs. People without an actual role use the fictional case
    only. Follow placement, custody, guardianship and child-safety requirements; chosen-family belonging
    does not itself confer legal authority. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a story, language choice, meal or private object rather than photographs. People
    without an actual role use the fictional case only. Follow placement, custody, guardianship and child-safety
    requirements; chosen-family belonging does not itself confer legal authority.
  expected_burden: Twenty minutes of preparation, one short willing conversation and one small shared
    activity or labeled case rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Adoption, fostering, stepfamilies, and chosen family protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Adoption, fostering, stepfamilies, and chosen family action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a story,
    language choice, meal or private object rather than photographs. People without an actual role use
    the fictional case only. Follow placement, custody, guardianship and child-safety requirements; chosen-family
    belonging does not itself confer legal authority.
  actions:
  - stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01-A1
    sequence: 1
    title: Identify whose history the proposed tradition could erase
    instructions: 'List who has authority over the space and who is affected by the decision, including
      the child’s or dependent person’s voice where relevant. Distinguish practical household membership
      from legal responsibility and emotional attachment. Ask what existing names, relationships or memories
      should not be overwritten. A prior loss or loyalty conflict may be relevant, but do not infer it
      from behavior or demand disclosure to justify keeping a memory private.


      Observation checks: Affected people and legal or care authority are distinguished; The child or
      dependent person has an accessible voice; Origins names and prior relationships are not overwritten
      by default; No attachment diagnosis or forced history is required. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01
      action_stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01-A1
      competency_stable_id: '19.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1907_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1907_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
