        criteria:
        - participation_and_the_chosen_form_are_voluntary
        - more_than_one_legitimate_connection_can_coexist
        - affection_labels_and_equal_feelings_are_not_demanded
        - contact_image_and_confidentiality_limits_are_checked
      - measurement_id: c1907_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1907_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1907-ADOPTION-FOSTERING-STEPFAMILIES-AND-CHOSEN-FAMILY-01-A3
    sequence: 3
    title: Try the arrangement and let the person revise it
    instructions: 'Install only the agreed element or conduct the fictional choice conversation, then
      ask privately after an ordinary use whether it feels comfortable, exposing or inaccurate. Allow
      removal or revision without a loyalty argument. Record the decision process and adjustment, not
      family history or a child’s words in application evidence. If the activity raises significant loss,
      conflict or legal questions, stop expanding it and use the relevant qualified family or placement
      support.


      Observation checks: Only agreed elements are put into use; A later revision or opt-out is genuinely
      available; Private family and child information stays outside evidence; Significant care or legal
      questions are referred appropriately. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Whose history gained room rather than being replaced, and did the person truly have
      permission to belong in more than one way?


      Examples: Supportive: A child kept a private origin keepsake and chose a neutral shelf label without
      being asked to prove loyalty to the new household.


      Mixed: The first display exposed more history than intended, so the family removed it and adopted
      a private option.


      Contradictory: A person was required to reject an earlier relationship, use a parental title or
      violate a contact restriction to demonstrate belonging.


      Inconclusive: Family inclusion was praised in general without a concrete choice, consent check or
      revised arrangement.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
