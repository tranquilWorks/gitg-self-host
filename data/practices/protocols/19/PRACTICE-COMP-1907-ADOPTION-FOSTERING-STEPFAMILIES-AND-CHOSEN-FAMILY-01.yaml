      - [Cultural Documentation Guidelines](https://wwws.loc.gov/folklife/edresources/ed-trainingdocuments.html)

      - [Healthy Habits: Caring for Yourself When Caring for Another](https://www.cdc.gov/caregiving/caring-for-yourself/index.html)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Kit chooses a private keepsake in their own space and declines a public explanation. Rowan chooses
      their own first name for the shelf and asks that the proposed parent title be omitted. Jo and Sam
      agree and remove “real family” from the label. Ari joins a short shared activity by invitation;
      no care or legal authority changes.


      Permission for the household image remains uncertain under the existing arrangement. The adults
      postpone the image and use an agreed neutral symbol. No new contact with an earlier home occurs.
      After the activity, Kit says the private option is comfortable for now. Rowan asks to remove the
      name card the next day; it is removed without a loyalty discussion.


      Record the display change, the maintained privacy and the later removal separately. Do not describe
      the image as approved, the earlier-home connection as restored or the household as securely attached.
      A changing preference is compatible with an initially useful option. The supplied comments are fictional
      participant perspectives, not actual child feedback or a qualified assessment.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Make one small belonging practice that leaves room for more than one history. Spend twenty\
      \ minutes preparing, hold a short willing conversation, and try the agreed change. Use the supplied\
      \ family-shelf case unless you already have an appropriate family or care role. Do not recruit a\
      \ child, ask for a placement story or seek sensitive family details for evidence.\n\n### Belonging\
      \ has several dimensions\n\nAdoption involves a legal family relationship as well as emotional,\
      \ social and identity questions. Fostering involves care within a particular arrangement whose authority\
      \ and expectations must be checked. A stepfamily brings relationships and histories that do not\
      \ become identical merely because adults form a partnership. Chosen family names meaningful commitments\
      \ and belonging; it does not by itself grant custody, medical decision rights or access to private\
      \ records. These forms can overlap, and each contains considerable variety.\n\nAttachment is built\
      \ through responsive, dependable relationships, not demonstrated by a required title or public declaration.\
      \ Prior loss can coexist with present affection. Remembering a birth parent or former home does\
      \ not necessarily reject a current caregiver. Nor can a quiet response establish trauma, attachment\
      \ difficulty or disloyalty. Ask what support is welcome without requiring an explanation that the\
      \ person cannot or does not want to give.\n\nIdentity includes origins, names, language, culture\
      \ and a person's changing understanding of their story. Preserving those connections does not authorize\
      \ unsafe or prohibited contact. Check the applicable arrangement and seek qualified help where contact\
      \ or disclosure is uncertain. A family display is optional; a child does not owe adults photographs\
      \ or a simplified account of how everyone belongs.\n\nLoyalty conflicts grow when someone feels\
      \ required to prove affection by denying another relationship. An adult can reduce that pressure\
      \ by accepting different names, private memories and uneven readiness. Equal dignity does not require\
      \ identical feelings, matching titles or the same disclosure from every person. Listening to a child's\
      \ perspective is meaningful only if it can change the proposed activity.\n\n### Worked example\n\
      \nAn adult proposes a shelf labeled “our real family,” with a photograph from the new household\
      \ and no room for earlier connections. Another person asks to keep a previous-home memory nearby.\
      \ Replacing “real” with a chosen neutral label and offering a private keepsake option makes the\
      \ practice less excluding. It does not solve legal contact questions or establish attachment security.\
      \ The adult still needs permission before displaying another person's image.\n\n### Supplied fictional\
      \ case\n\nJo and Sam share a household with Kit and Rowan after family changes. The case does not\
      \ disclose each person's legal relationship or private history. Existing care arrangements remain\
      \ authoritative. They are considering a small shelf with names, a household image and one meaningful\
      \ object. Kit wants a reminder of an earlier home but does not want to explain it publicly. Rowan\
      \ dislikes the proposed parent title. A close chosen-family adult, Ari, may be included in a shared\
      \ activity but has no stated legal powers.\n\nAvailable choices are a private keepsake, a self-chosen\
      \ label, an image used with appropriate permission, an empty space, a neutral symbol or no participation.\
      \ No one must choose an option. Unverified image or contact permission means postponing that part,\
      \ not persuading the child to authorize it on behalf of others.\n\n### Build and revise the practice\n\
      \n1. Draw three separate headings: belonging, care responsibility and legal authority. Put each\
      \ supplied fact under the appropriate heading and mark unknown legal details unknown. Output: a\
      \ small map in which living together and loving someone do not create unstated powers.\n2. Ask what\
      \ each willing participant would like represented and what should stay private. Use an accessible\
      \ choice or allow a later answer. Do not ask why an origin memory matters as a condition of including\
      \ it. Output: preferences with refusals and unknowns intact; use fictional summaries in app evidence.\n\
      3. Audit the proposed display for forced titles, “real family” ranking, loyalty tests and unwanted\
      \ disclosure. Check the existing arrangement before using images or facilitating contact. Output:\
      \ one concrete revision and one permission question that remains with an authorized adult or qualified\
      \ service.\n4. Implement only the agreed, permitted part. A neutral symbol or no shared display\
      \ can be a valid outcome. Output: what was actually placed or changed, who chose it and what was\
      \ deferred. A plan to ask permission is not received permission.\n5. Before opening the [later packet](?resource=file-later-packet-md),\
      \ set a low-pressure way to revise or remove an item. After the activity, ask privately whether\
      \ the option still works. Output: one retained or revised choice without interpreting it as a measure\
      \ of love.\n\n### Support and transfer\n\nFor support, start with two neutral options and a no-participation\
      \ choice. A person can point, use an established communication aid or have a chosen supporter help\
      \ convey preferences. For a harder fictional version, an adult insists that honoring an earlier\
      \ home is ungrateful. Explain how to preserve the child's voice while moving the adult's feelings\
      \ out of the child's responsibility. Do not turn the task into a confrontation when safety is uncertain.\n\
      \nIn real transfer, use an ordinary low-stakes practice within your actual role: how people are\
      \ introduced, how a holiday invitation is phrased or where a keepsake is stored. One successful\
      \ revision shows a specific accommodation, not general belonging, secure attachment or an absence\
      \ of grief. Contact disputes, placement decisions and legal changes need the appropriate qualified\
      \ local route. Privacy protection may leave little sharable evidence; that is preferable to making\
      \ someone else's history an assignment.\n\n### Source limits\n\n[Child Welfare Information Gateway,\
      \ S06](https://www.childwelfare.gov/topics/permanency/adoption/) describes legal, emotional and\
      \ social dimensions of adoption, including loss, identity and connections. It does not make the\
      \ shelf exercise a validated intervention or supply the powers of a particular foster, step or chosen-family\
      \ adult. Those distinctions and the case are original teaching applications. No family form is treated\
      \ as inherently superior.\n\n### Use the result at its proper scale\n\nMedical, reproductive, child-safety,\
      \ guardianship, and elder-care decisions require qualified local guidance.\n\n No reproductive,\
      \ parenting or care role is compulsory. Fiction does not establish actual participant evidence.\
      \ Keep identifying, clinical and private family information outside app records.\n\nAttempt the\
      \ [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A child wants to remember an earlier home. What can a caregiver infer about loyalty, and what
      must be checked before arranging contact?

      2. A chosen-family adult is deeply trusted. Does this establish authority to consent to treatment
      or access records?

      3. Everyone agreed to a display yesterday; one child wants their card removed today. What should
      the review test?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The request alone establishes neither rejection nor a loyalty problem. Respect the memory
      and privacy. Contact still depends on the actual care, legal and safety arrangements; seek the proper
      authorized guidance instead of inventing permission.

      2. No. Belonging and trust do not themselves confer legal powers. Identify the specific task, actual
      authorization and relevant local requirements; preserve the person''s voice within those limits.

      3. Test whether the practice remains willingly usable and revisable. Remove or change the agreed
      part appropriately without making the child defend affection. Yesterday''s agreement does not prove
      permanent permission or attachment security.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
