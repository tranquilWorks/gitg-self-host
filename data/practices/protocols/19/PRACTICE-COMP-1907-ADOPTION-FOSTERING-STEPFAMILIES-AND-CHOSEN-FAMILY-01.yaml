        criteria:
        - affected_people_and_legal_or_care_authority_are_distinguished
        - the_child_or_dependent_person_has_an_accessible_voice
        - origins_names_and_prior_relationships_are_not_overwritten_by_default
        - no_attachment_diagnosis_or_forced_history_is_required
      - measurement_id: c1907_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
