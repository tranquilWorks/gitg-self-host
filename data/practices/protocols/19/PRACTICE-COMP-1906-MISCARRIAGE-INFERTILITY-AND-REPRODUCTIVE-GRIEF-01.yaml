  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Emery declines the call and accepts a meal left at the door at 18:00 on 8 October. Leena confirms
      the necessary food information privately and makes no further request for treatment details. At
      18:00 the meal is delivered and the agreed brief delivery message is sent. Leena leaves without
      waiting for conversation.


      Emery replies the next morning that the meal helped and asks for no check-in messages for two weeks.
      Leena acknowledges that request. Leena drafts a possible future message but does not send it or
      schedule it automatically; the request for space does not promise that a later conversation will
      be welcome. Ash''s experience remains unknown, and no independent offer to Ash has been made through
      this exchange.


      Credit the kept promise, respected refusal and useful practical feedback. Do not claim that grief
      lessened, treatment decisions changed or both partners were supported. A draft future message is
      not an agreed follow-up. Review which impulse to reassure, compare or solve Leena restrained and
      how that reduced the burden of receiving help.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Practice one specific offer of support that leaves the meaning and pace of grief with the person\
      \ affected. Allow fifteen minutes to prepare, one brief welcome contact and a follow-up only if\
      \ agreed. Use the complete fiction when contact is unwanted or unavailable. Do not seek out a private\
      \ loss to obtain practice evidence, invent a loss or require anyone to describe reproductive experiences.\n\
      \n### Make room for meanings you do not know\n\nMiscarriage, difficulty conceiving, unsuccessful\
      \ treatment and other reproductive losses can involve grief, uncertainty, physical recovery, administrative\
      \ work and financial strain. They are not interchangeable experiences, and the same event may have\
      \ different meanings for different people. Someone may grieve a pregnancy, an imagined future, repeated\
      \ uncertainty, bodily trust or several things at once. You do not need to assign the correct meaning\
      \ before offering ordinary care.\n\nAmbiguity can be especially difficult: a treatment outcome may\
      \ be known while future possibilities remain open, or a person may not know whether they want another\
      \ attempt. Do not resolve that tension with a prediction or an instruction to be hopeful. A future\
      \ pregnancy or another life path does not erase an earlier loss, and declining further treatment\
      \ is not a failure of commitment.\n\nPartners and relatives may respond differently. Silence, conversation,\
      \ distraction and a wish for practical help do not reveal how much someone cared. Do not compare\
      \ grief, rank losses or demand synchronized feelings. Relationship strain can be acknowledged without\
      \ making the supporter an investigator or mediator. Medical burden may be present, but a friend\
      \ need not know the diagnosis, procedure or cause to honor a meal request.\n\nSupport has its own\
      \ boundaries. Acknowledgment recognizes difficulty without imposing blame, a spiritual explanation\
      \ or a lesson. Listening follows the person's language and stops when they want to stop. Practical\
      \ help should be independent of disclosure and gratitude. A resource may be useful when wanted,\
      \ but sending a stack of treatments or success stories can add work and pressure.\n\n### Worked\
      \ example\n\nA friend says an expected pregnancy did not continue. “At least you can try again”\
      \ shifts attention to an imagined replacement and assumes both ability and desire. A more open response\
      \ is “I'm sorry. You don't have to explain. I can bring dinner or give you space.” If dinner is\
      \ accepted without conversation, fulfilling that request is the task. Feeling useful is not a reason\
      \ to stay at the door until the person talks.\n\n### Supplied fictional task\n\nOn 6 October adult\
      \ friend Emery tells Leena: “The treatment did not work out as we hoped. I don't want to discuss\
      \ the details.” Leena knows nothing further about diagnosis, procedures, pregnancy status or future\
      \ plans. Emery's partner, Ash, has not spoken to Leena about their own experience. Do not treat\
      \ Emery as authorized to reveal Ash's private feelings or assume both want the same support.\n\n\
      Leena can offer a simple agreed meal on 8 October at 18:00 or a short quiet call. Leena cannot provide\
      \ transport that week. Emery's message permits a brief reply in their existing friendship, not repeated\
      \ probing. No immediate medical or safety concern is supplied. If one arises in a real situation,\
      \ appropriate qualified help should not wait for this support sequence.\n\n### Prepare words and\
      \ dependable conduct\n\n1. Write the known facts and three assumptions to remove: the loss's exact\
      \ meaning, the partner's response and the idea that another attempt would resolve it. Notice possible\
      \ medical or practical burden without filling in details. Output: a short preparation note about\
      \ your assumptions, not an account of someone else's private history.\n2. Draft a brief acknowledgment\
      \ with one or two feasible offers: the 8 October meal or a short call. Space remains an option without\
      \ requiring a menu or reply. Do not offer unavailable transport or promise unlimited availability.\
      \ Output: a message that permits no answer and contains no demand for explanation.\n3. Rehearse\
      \ Emery declining the call while accepting a meal without conversation. Write the acceptance response\
      \ and the delivery details that actually need agreement, such as food requirements, time and location.\
      \ Ask only what is necessary; do not use a practical question to reopen the treatment story. Output:\
      \ a bounded promise and a respectful response to the declined part.\n4. State how you will handle\
      \ inability to deliver: one timely appropriate update and an accepted alternative if available.\
      \ Do not leave the person to manage a series of rescuers or invite others into their private situation.\
      \ Output: a contingency that does not turn help into extra coordination work.\n5. Save the draft\
      \ and open the [later packet](?resource=file-later-packet-md). Check delivery and follow-up against\
      \ Emery's choices. Separate the supporter's conduct from assumptions about grief or clinical recovery.\
      \ Output: what was fulfilled, what was declined and what remains unknown.\n\n### Support, challenge\
      \ and transfer\n\nFor support, rehearse a written acknowledgment and one practical offer, without\
      \ imagining emotional disclosure. A trusted reader can check whether your language imposes meaning.\
      \ For a harder fictional attempt, let the person decline everything. The appropriate result may\
      \ be respectful space; do not manufacture a completed care action just to make the attempt appear\
      \ productive.\n\nFor real transfer, use an existing appropriate relationship and a naturally shared\
      \ need. Ask once what support is welcome, carry out accepted promises and follow up only within\
      \ the person's preference. If you initially minimize, briefly acknowledge the misstep without making\
      \ the person comfort you. When medical concerns, severe distress or safety concerns exceed ordinary\
      \ friendship support, help reach suitable qualified care if appropriate. There is no required grief\
      \ duration before help is allowed and no timetable by which grief must be finished.\n\n### Source\
      \ use\n\n[The NHS miscarriage page, S05](https://www.nhs.uk/conditions/miscarriage/), recognizes\
      \ different physical and emotional experiences and available support, including for partners. Only\
      \ those sections are used; treatment instructions, thresholds and predictions are not imported.\
      \ Its miscarriage discussion does not establish a universal account of infertility or every reproductive\
      \ loss. The fictional declined-call/accepted-meal design applies the canonical non-minimizing support\
      \ boundary without claiming a grief intervention effect.\n\n### Use the result at its proper scale\n\
      \nMedical, reproductive, child-safety, guardianship, and elder-care decisions require qualified\
      \ local guidance.\n\n No reproductive, parenting or care role is compulsory. Fiction does not establish\
      \ actual participant evidence. Keep identifying, clinical and private family information outside\
      \ app records.\n\nAttempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [answers](?check=practice-answers).


      1. A person accepts a meal but declines conversation. Is it reasonable to require a short discussion
      so the supporter can know the help worked?

      2. Two partners react differently to an unsuccessful treatment. Can a quiet response be treated
      as evidence of lesser grief or care?

      3. Someone later becomes pregnant. Does that justify telling them the earlier loss no longer needs
      acknowledgment?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Fulfill the accepted practical offer within its terms. Feedback is welcome only if freely
      given; discussion, disclosure and gratitude are not payment for care. The supporter can review their
      own conduct without accessing the private story.

      2. No. Different expressions do not establish the meaning or intensity of grief. Preserve each person''s
      privacy and preferences without comparison or forced synchronization. Appropriate qualified support
      may be useful if wanted or needed.

      3. No. A later event does not determine the meaning of an earlier loss. Follow the person''s language
      and wishes rather than imposing replacement or closure. Do not turn the new pregnancy into a medical
      or emotional guarantee.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
