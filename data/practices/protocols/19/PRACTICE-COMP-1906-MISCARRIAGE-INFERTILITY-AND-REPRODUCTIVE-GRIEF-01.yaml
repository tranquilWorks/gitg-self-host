meaning_and_fit:
  purpose: Provide a specific, consented form of support after miscarriage, infertility or another reproductive
    loss while respecting privacy, ambiguity and differences in grief.
  why_recommended: Provide a specific, consented form of support after miscarriage, infertility or another
    reproductive loss while respecting privacy, ambiguity and differences in grief.
  claims:
  - statement: Provide a specific, consented form of support after miscarriage, infertility or another
      reproductive loss while respecting privacy, ambiguity and differences in grief.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Miscarriage, infertility, and reproductive grief practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Miscarriage, infertility, and reproductive grief as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use a note, practical errand or quiet presence instead of conversation. A
    supporter without a live opportunity can rehearse the supplied case; no fabricated loss or emotional
    disclosure is needed. Use qualified reproductive-health, grief or crisis support when the situation
    exceeds ordinary friendship care.
  opportunity_considerations: 'Use the default of someone mentioning that fertility treatment or a pregnancy
    did not go as hoped. Prepare three possible offers: quiet listening, a meal or transport, and help
    finding a qualified support resource. Do not seek out someone’s private loss to create a practice
    opportunity.'
  prerequisites:
  - 'Use the default of someone mentioning that fertility treatment or a pregnancy did not go as hoped.
    Prepare three possible offers: quiet listening, a meal or transport, and help finding a qualified
    support resource. Do not seek out someone’s private loss to create a practice opportunity.'
  dependencies: []
  safe_alternatives:
  - Use a note, practical errand or quiet presence instead of conversation. A supporter without a live
    opportunity can rehearse the supplied case; no fabricated loss or emotional disclosure is needed.
    Use qualified reproductive-health, grief or crisis support when the situation exceeds ordinary friendship
    care.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Miscarriage, infertility, and reproductive grief differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Miscarriage, infertility,
    and reproductive grief as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of someone mentioning that fertility treatment or a pregnancy did not go as
    hoped. Prepare three possible offers: quiet listening, a meal or transport, and help finding a qualified
    support resource. Do not seek out someone’s private loss to create a practice opportunity. Goal: Provide
    a specific, consented form of support after miscarriage, infertility or another reproductive loss
    while respecting privacy, ambiguity and differences in grief. Scope: The practice concerns the supporter’s
    behavior, not a grief timetable, medical recovery, the cause of a loss or whether another pregnancy
    would resolve it. Time and effort: Fifteen minutes to prepare, one brief welcome contact and one agreed
    follow-up; use a fictional case when contact is not appropriate. Adaptation: Use a note, practical
    errand or quiet presence instead of conversation. A supporter without a live opportunity can rehearse
    the supplied case; no fabricated loss or emotional disclosure is needed. Use qualified reproductive-health,
    grief or crisis support when the situation exceeds ordinary friendship care. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a note, practical errand or quiet presence instead of conversation. A supporter
    without a live opportunity can rehearse the supplied case; no fabricated loss or emotional disclosure
    is needed. Use qualified reproductive-health, grief or crisis support when the situation exceeds ordinary
    friendship care.
  expected_burden: Fifteen minutes to prepare, one brief welcome contact and one agreed follow-up; use
    a fictional case when contact is not appropriate.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Miscarriage, infertility, and reproductive grief protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Miscarriage, infertility, and reproductive grief action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a note,
    practical errand or quiet presence instead of conversation. A supporter without a live opportunity
    can rehearse the supplied case; no fabricated loss or emotional disclosure is needed. Use qualified
    reproductive-health, grief or crisis support when the situation exceeds ordinary friendship care.
  actions:
  - stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01-A1
    sequence: 1
    title: Remove assumptions before choosing your words
    instructions: 'Write a short acknowledgment such as I am sorry this has been difficult; you do not
      have to explain. Identify three assumptions to avoid: that you know the meaning of the loss, that
      partners grieve identically, and that a future child or positive lesson cancels it. Notice possible
      medical burden and relationship strain without asking for details. Choose a message that permits
      silence and does not attach blame, spiritual explanation or a demand for disclosure.


      Observation checks: The acknowledgment does not presume the meaning of the loss; Different grief
      responses remain legitimate; Medical burden and privacy are recognized without interrogation; Blame
      replacement and forced-positive explanations are excluded. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01
      action_stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01-A1
      competency_stable_id: '19.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1906_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1906_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_acknowledgment_does_not_presume_the_meaning_of_the_loss
        - different_grief_responses_remain_legitimate
        - medical_burden_and_privacy_are_recognized_without_interrogation
        - blame_replacement_and_forced_positive_explanations_are_excluded
      - measurement_id: c1906_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1906_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01-A2
    sequence: 2
    title: Ask once what kind of support is welcome
    instructions: 'In an appropriate existing relationship, offer one or two concrete choices: I could
      leave a meal Tuesday, listen, or give you space. Accept a refusal or no answer without repeated
      probing. If they want to talk, follow their language, listen without comparing losses and ask before
      suggesting a resource. Keep practical help independent of whether they share details or express
      gratitude. A fictional rehearsal must include a declined offer and a response that respects it.


      Observation checks: Contact is welcome or clearly labeled as rehearsal; Support choices are concrete
      and limited; A decline silence or different preference is respected; Practical care is not conditional
      on disclosure or gratitude. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01
      action_stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01-A2
      competency_stable_id: '19.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1906_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1906_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - contact_is_welcome_or_clearly_labeled_as_rehearsal
        - support_choices_are_concrete_and_limited
        - a_decline_silence_or_different_preference_is_respected
        - practical_care_is_not_conditional_on_disclosure_or_gratitude
      - measurement_id: c1906_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1906_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1906-MISCARRIAGE-INFERTILITY-AND-REPRODUCTIVE-GRIEF-01-A3
    sequence: 3
    title: Deliver the promised support and review your assumptions
    instructions: 'Carry out the accepted low-risk offer at the agreed time or send one appropriate update
      if you cannot. Follow up only as welcomed, asking whether the support should continue, change or
      stop. Note what you learned about your own tendency to minimize, solve or impose meaning, not the
      person’s private story. Current medical concerns, severe distress or safety concerns call for appropriate
      qualified help; this exercise does not require waiting for a particular duration.


      Observation checks: An accepted promise is fulfilled or explicitly renegotiated; Follow-up follows
      the recipient’s preference; The review concerns the supporter’s conduct not private grief details;
      Current medical or safety concerns are not delayed. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Did your support leave room for the person’s own meaning and pace, and what did you
      refrain from saying that would have made the burden heavier?


      Examples: Supportive: The supporter accepted a request for a meal and no discussion, delivered it
      and did not treat a later pregnancy as erasing the loss.


      Mixed: The initial message offered reassurance too quickly; the supporter acknowledged that and
      asked what would actually help.


      Contradictory: The loss was blamed on the person, minimized, moralized or used to pressure treatment
      or future parenthood.


      Inconclusive: A sympathy script was drafted but not rehearsed or connected to a concrete support
      action.'
    expected_time: 15-25 minutes
    due_within_days: 10
