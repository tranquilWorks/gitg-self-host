meaning_and_fit:
  purpose: Match a child’s responsibility to current age, ability and context while using explanation,
    predictable limits and nonviolent proportionate follow-through.
  why_recommended: Match a child’s responsibility to current age, ability and context while using explanation,
    predictable limits and nonviolent proportionate follow-through.
  claims:
  - statement: Match a child’s responsibility to current age, ability and context while using explanation,
      predictable limits and nonviolent proportionate follow-through.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Developmentally appropriate autonomy and discipline
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Developmentally appropriate autonomy and discipline as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use pictures, AAC, tactile markers, a seated task or a shorter sequence. A
    person without authority can compare the two fictional task versions and rehearse the explanation.
    Respect professional care plans and seek guidance for significant behavioral, developmental or safety
    concerns.
  opportunity_considerations: 'Use the low-risk task of returning borrowed books to a basket. Prepare
    two versions: one book with a picture cue and a larger independently chosen group. Select the version
    from observed ability and existing care guidance, not a rigid age stereotype. Keep necessary food,
    rest, affection, medicine and communication unrelated to task performance.'
  prerequisites:
  - 'Use the low-risk task of returning borrowed books to a basket. Prepare two versions: one book with
    a picture cue and a larger independently chosen group. Select the version from observed ability and
    existing care guidance, not a rigid age stereotype. Keep necessary food, rest, affection, medicine
    and communication unrelated to task performance.'
  dependencies: []
  safe_alternatives:
  - Use pictures, AAC, tactile markers, a seated task or a shorter sequence. A person without authority
    can compare the two fictional task versions and rehearse the explanation. Respect professional care
    plans and seek guidance for significant behavioral, developmental or safety concerns.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Developmentally appropriate autonomy and discipline differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Developmentally appropriate
    autonomy and discipline as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the low-risk task of returning borrowed books to a basket. Prepare two versions: one book
    with a picture cue and a larger independently chosen group. Select the version from observed ability
    and existing care guidance, not a rigid age stereotype. Keep necessary food, rest, affection, medicine
    and communication unrelated to task performance. Goal: Match a child’s responsibility to current age,
    ability and context while using explanation, predictable limits and nonviolent proportionate follow-through.
    Scope: Use only an authorized ordinary caregiving role. This is not behavior therapy, a discipline
    prescription for a clinical condition or permission to impose deprivation or physical punishment.
    Time and effort: Twenty minutes of preparation and two short ordinary opportunities over a week. Adaptation:
    Use pictures, AAC, tactile markers, a seated task or a shorter sequence. A person without authority
    can compare the two fictional task versions and rehearse the explanation. Respect professional care
    plans and seek guidance for significant behavioral, developmental or safety concerns. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use pictures, AAC, tactile markers, a seated task or a shorter sequence. A person
    without authority can compare the two fictional task versions and rehearse the explanation. Respect
    professional care plans and seek guidance for significant behavioral, developmental or safety concerns.
  expected_burden: Twenty minutes of preparation and two short ordinary opportunities over a week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Developmentally appropriate autonomy and discipline protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Developmentally appropriate autonomy and discipline action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use pictures,
    AAC, tactile markers, a seated task or a shorter sequence. A person without authority can compare
    the two fictional task versions and rehearse the explanation. Respect professional care plans and
    seek guidance for significant behavioral, developmental or safety concerns.
  actions:
  - stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01-A1
    sequence: 1
    title: Separate the actual limit from the adult’s preferred control
    instructions: 'State the practical reason: books need a known place so people can find them and walk
      safely. Identify which part is a genuine safety or shared-use limit and which is merely your preferred
      order or speed. Choose a small responsibility the child can understand and attempt with support.
      Explain what help is available and what a reasonable repair looks like if a book is left elsewhere;
      do not announce an unrelated punishment.


      Observation checks: The practical reason and safety limit are explicit; Adult preference is separated
      from a necessary rule; The task matches observed ability and available support; A related repair
      replaces unrelated punishment. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01
      action_stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01-A1
      competency_stable_id: '19.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1909_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1909_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
