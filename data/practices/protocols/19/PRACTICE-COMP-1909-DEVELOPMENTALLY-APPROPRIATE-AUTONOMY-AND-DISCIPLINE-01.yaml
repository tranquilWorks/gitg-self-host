  - stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01-A3
    sequence: 3
    title: Review the expectation and adjust responsibility
    instructions: 'On the next ordinary opportunity, use what you observed to simplify, retain or modestly
      increase responsibility. Ask or notice whether the child understands the reason and can request
      help; independent obedience alone is not the goal. Record your own use of explanations, support
      and proportionate limits, not a character score for the child. Persistent difficulty, distress or
      safety concerns require appropriate qualified guidance rather than escalating the consequence.


      Observation checks: A second opportunity informs the adjustment; Understanding help-seeking and
      capability are considered; The adult’s conduct is reviewed rather than the child’s worth; Difficulty
      does not automatically escalate punishment. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: What responsibility was genuinely learnable, and which part of your original instruction
      served adult control rather than safety or growth?


      Examples: Supportive: A picture cue and shared demonstration let the child return a book and later
      choose to do the next one independently.


      Mixed: The rule was reasonable, but the first task was too large; the caregiver reduced it and preserved
      the explanation.


      Contradictory: The adult used humiliation, pain, deprivation or threats of lost affection to secure
      compliance.


      Inconclusive: A rule and consequence were written without explaining the reason or testing a supported
      responsibility.'
    expected_time: 15-25 minutes
    due_within_days: 10
