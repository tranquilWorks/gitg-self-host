        criteria:
        - the_practical_reason_and_safety_limit_are_explicit
        - adult_preference_is_separated_from_a_necessary_rule
        - the_task_matches_observed_ability_and_available_support
        - a_related_repair_replaces_unrelated_punishment
      - measurement_id: c1909_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
