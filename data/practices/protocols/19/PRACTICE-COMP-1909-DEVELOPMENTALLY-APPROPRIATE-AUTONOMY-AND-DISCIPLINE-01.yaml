  - stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01-A2
    sequence: 2
    title: Give a real choice and help the child complete the repair
    instructions: 'Offer a bounded choice such as Which book will you return first, or Shall we carry
      one together. Model the action when needed, allow processing time and acknowledge a specific effort
      without buying compliance with affection. If the book remains out, calmly help restore the shared
      space and restate the expectation in an understandable form. Do not humiliate, threaten abandonment,
      hit or make the child responsible for managing your emotions.


      Observation checks: A bounded genuine choice is offered; Support and processing time are available;
      Follow-through is calm related and nonviolent; Affection and essential care are not conditional
      on performance. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01
      action_stable_id: PRACTICE-COMP-1909-DEVELOPMENTALLY-APPROPRIATE-AUTONOMY-AND-DISCIPLINE-01-A2
      competency_stable_id: '19.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
