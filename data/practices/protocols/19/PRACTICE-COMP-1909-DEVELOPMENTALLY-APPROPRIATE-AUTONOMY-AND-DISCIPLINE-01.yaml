  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      At the first opportunity, Noor models the carrying motion without moving a book. Jules returns one
      book with the picture cue and asks Noor to carry the other. Noor does so. Jules points to the clear
      shared route when asked what the return helps with. The books are not alphabetized, and Noor does
      not add that preference to the boundary.


      For the second opportunity, Noor retains the cue and again offers a choice of first book. Jules
      is tired and requests shared carrying for both books. Noor accepts, completes the return together
      and leaves the task size unchanged. No food, story time, communication aid or affection is withheld.
      There is no independent two-book return in this packet.


      Record the shared-space purpose, expressed help request, actual adult assistance and the changed
      fatigue condition. The second attempt does not establish regression, manipulation or lack of respect.
      It also does not establish increased independent competence. A reasonable next opportunity keeps
      support available and observes what is manageable, rather than raising the demand merely because
      this worksheet has a second row.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Audit one ordinary limit, then adjust how you teach it over two opportunities in a week. Use\
      \ twenty minutes to prepare. Live practice requires an existing appropriate care role and consistency\
      \ with the person's care arrangements. Otherwise use the supplied books case. The focus is proportional\
      \ expectations and repair, not a developmental assessment or a test of obedience.\n\n### Ask what\
      \ the limit protects\n\nSome limits protect immediate safety or other people's legitimate use of\
      \ a space. Others express an adult's preference for speed, order or a particular appearance. Separate\
      \ them before enforcing a rule. A child may need to keep a shared walking route clear without arranging\
      \ every book in the adult's preferred order. A preference can be negotiated; presenting it as a\
      \ safety emergency makes explanation less trustworthy.\n\nDevelopmentally appropriate responsibility\
      \ depends on the particular task and observed ability as well as age. Comprehension, communication,\
      \ movement, fatigue and familiarity affect what a person can do now. Do not assign a universal age\
      \ cutoff or interpret one difficult attempt as defiance. A useful expectation is small enough to\
      \ understand and attempt, with needed support available.\n\nAn explanation links the request to\
      \ its purpose. Modeling shows what the action looks like. A boundary describes what must happen;\
      \ a choice gives real discretion within it. “Which of these books shall we return first?” can be\
      \ a real choice when both are acceptable. Offering two choices while punishing the less preferred\
      \ answer is disguised control.\n\nConsequences should help address the actual situation. If books\
      \ remain in the shared route, an adult can help return them and reduce the task to a manageable\
      \ amount. Unrelated deprivation does not teach where books belong. Food, rest, medicine, communication\
      \ access, affection and other essentials never become rewards that must be earned. Violence, threats,\
      \ humiliation and abandonment language are excluded.\n\nAutonomy grows when a learner can understand\
      \ a purpose, choose a workable method, ask for help and gradually take an appropriate share. Less\
      \ visible resistance alone is not evidence of greater competence. Observe what support was needed\
      \ and whether the learner could express uncertainty. A successful supported attempt can be more\
      \ useful than a pressured independent one.\n\n### Worked example\n\nAn adult demands that a tired\
      \ child sort an entire shelf immediately. The shared-space need is simply to return two books left\
      \ beside the walkway. The adult changes the task to one book at a time with a picture cue, explains\
      \ the walking-space reason and lets the child choose the first book. The adult helps with the rest.\
      \ The result is a proportionate repair, not proof that every original demand was developmentally\
      \ reasonable.\n\n### Supplied fictional case\n\nCaregiver Noor is already authorized to supervise\
      \ Jules in an ordinary home routine. Two light books need to be returned to an accessible basket.\
      \ The space is otherwise safe; no dangerous obstruction is created for the exercise. Noor prefers\
      \ alphabetic order, but that preference is unnecessary for the immediate shared-space purpose. Jules\
      \ has sometimes returned one book with a picture cue and has not demonstrated sorting a shelf independently.\n\
      \nNoor will offer one-book steps or shared carrying, explain where the books go and observe whether\
      \ Jules can identify the purpose or ask for help. A second ordinary opportunity will occur later\
      \ in the week. Essential care, warmth and normal shared activities continue regardless of performance.\n\
      \n### Try a proportionate limit\n\n1. Write the shared-space purpose, the adult preference and the\
      \ current evidence of ability separately. Output: a justified boundary without turning alphabetic\
      \ order into a necessity or guessing ability from age.\n2. Prepare a brief explanation, a modeled\
      \ carrying motion and a genuine choice of which book goes first. Choose the picture cue or shared\
      \ action already appropriate to Jules. Output: a small task and a help route, not a demand for immediate\
      \ independent sorting.\n3. Rehearse or carry out the first ordinary opportunity within the actual\
      \ role. If it stalls, help restore the space and reduce the demand; do not escalate punishment.\
      \ Output: what was attempted, what help occurred and whether the purpose or a help request was expressed.\
      \ Keep identifying observations private.\n4. Choose the second demand from the first observation.\
      \ Retain a useful cue, simplify after difficulty or modestly extend a task that was manageable.\
      \ Explain the choice. Output: a reasoned adjustment rather than a fixed increase to prove progress.\n\
      5. Save your predicted adjustment, then read the [later packet](?resource=file-later-packet-md).\
      \ Compare conditions and response across opportunities. Output: a narrow conclusion about this task,\
      \ noting changes that prevent a clean comparison.\n\n### Support and transfer\n\nFor support, model\
      \ a single book and accept an established communication aid, gesture or shared action. Do not make\
      \ verbal repetition a prerequisite for being heard. For a harder fictional version, another adult\
      \ wants a much longer task because a same-age peer can do it. Explain why this person's observed\
      \ needs, the legitimate purpose and available supports matter more than that comparison.\n\nFor\
      \ real transfer, apply the audit to a familiar safe routine in your existing role. Repeated difficulty,\
      \ distress or uncertainty about needs may require appropriate developmental or care guidance; it\
      \ is not a reason to intensify control. Caregiver disagreement should be resolved through appropriate\
      \ adult channels without recruiting the child to adjudicate it. The later opportunity may reasonably\
      \ need more help, especially under changed conditions.\n\n### Source limits\n\n[The American Academy\
      \ of Pediatrics policy, S11](https://publications.aap.org/pediatrics/article/142/6/e20183112/37452/Effective-Discipline-to-Raise-Healthy-Children),\
      \ supports effective teaching and age-appropriate expectations while opposing physical punishment\
      \ and shaming. It does not validate this two-book exercise or provide an individual developmental\
      \ diagnosis. The task distinguishes adult preference, explanation, proportional repair and changed\
      \ responsibility; the separate parenting and family-teaching guides address broader care and instruction.\
      \ One tidy space is not a full-domain result.\n\n### Use the result at its proper scale\n\nMedical,\
      \ reproductive, child-safety, guardianship, and elder-care decisions require qualified local guidance.\n\
      \n No reproductive, parenting or care role is compulsory. Fiction does not establish actual participant\
      \ evidence. Keep identifying, clinical and private family information outside app records.\n\nAttempt\
      \ the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. An adult calls alphabetic book order a safety rule, although returning the books to the basket
      resolves the shared-space need. What distinction matters?

      2. A child returns one book with help. May the adult withhold dinner or affection until a whole
      shelf is sorted?

      3. The child asks for more help on a tired day. Does that prove lost competence, and what should
      determine the next demand?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Separate a legitimate shared-space boundary from an adult preference. Explain the actual
      purpose and negotiate optional order where appropriate. Do not inflate a preference into a safety
      requirement to avoid discussion.

      2. No. Essentials and affection are not compliance rewards. Keep the expectation proportionate to
      demonstrated ability, model the task and use related assistance or repair. A supported one-book
      attempt does not establish independent shelf-sorting ability.

      3. No. Fatigue and changed support conditions prevent that conclusion. Attend to the observed task,
      help request and current needs; retain or adapt support and seek appropriate guidance if difficulty
      persists. Do not automatically increase control or task size.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
