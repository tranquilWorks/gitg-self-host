        expected: true
  - stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01-A2
    sequence: 2
    title: Choose a change that belongs to you
    instructions: 'Replace one part of the pattern with a controllable action: send your own attendance
      answer directly to the organizer and decline to interpret another adult’s silence. Prepare wording
      such as I will answer for myself; please ask them about their plans. Keep a family good, such as
      the shared meal, while removing an unnecessary intermediary role. Check whether contact, disclosure
      or changing the pattern could create retaliation; use private planning and appropriate support instead
      when unsafe.


      Observation checks: The change concerns your own participation; A valued continuity is deliberately
      preserved; The proposed boundary avoids speaking for another adult; Safety and contact limits determine
      whether to proceed. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01
      action_stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01-A2
      competency_stable_id: '19.01'
