  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      On 18 October Arun tells Leila directly that Arun will attend the 1 November meal and no longer
      wants to collect or interpret others'' replies. Leila agrees to invite direct responses but says
      she preferred the old arrangement. Her preference is not a supplied threat. Arun confirms willingness
      to attend and offers to bring the previously agreed bread, not to coordinate everyone.


      On 20 October a cousin asks Arun whether Mina is angry. Arun initially says “probably,” then corrects
      it: Mina has not said that, and the cousin should ask Mina directly if appropriate. Arun also apologizes
      for calling the cousin “always dramatic.” The apology concerns the insult; Arun does not retract
      the communication limit. No reply from Mina is supplied.


      The new invitation is sent by Leila, but the November meal has not occurred and the packet does
      not establish that everyone uses the new route. Credit the direct answer, bounded contribution and
      corrected inference. Preserve the recurrence and unknown wider response. Do not diagnose the family
      or claim that a generational pattern is now eliminated.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Describe one observable family pattern across two occasions, preserve a valued part of it,
      and change one action within your own control. Use two twenty-minute passes and, only if suitable,
      a naturally occurring opportunity within two weeks. Family contact is not compulsory. This role-conditional
      task includes complete fiction and does not require contacting estranged relatives, recovering memories
      or disclosing private family history.


      ### An existing contribution


      In this fictional case, Arun has already agreed with Leila to bring one loaf of bread to the 1 November
      meal. This commitment is separate from collecting other relatives’ replies. No dietary or purchasing
      information is supplied; do not infer that the loaf meets every guest’s needs.


      ### Notice a pattern without turning it into a diagnosis


      Family roles can include organizer, helper, peacekeeper, authority, confidant or outsider. A role
      may be useful, burdensome or both, and it can change with circumstances. Do not infer a person''s
      fixed character from the role they occupied once. An alliance may simply mean two people often coordinate;
      observing it does not reveal their motives or prove they are conspiring against someone.


      Inherited beliefs often operate as unspoken rules: “we all attend,” “the oldest decides,” or “one
      person relays everyone''s answers.” Ask how a rule helps and what it costs. Loyalty can preserve
      meaningful care and shared history while also making a limit hard to express. Preserving what is
      good requires naming the good specifically, not accepting every practice as the price of belonging.


      A communication route through a third person can carry tension as well as information. If two adults
      could answer an organizer directly but send interpretations through a sibling, the sibling may become
      responsible for everyone else''s reactions. Mapping the route can reveal a change you can make without
      deciding why the family became that way. A systems lens is an aid to observation, not proof that
      a theory explains the whole family.


      Trauma and estrangement may shape family life, but unknown history remains unknown. Do not reconstruct
      traumatic events, diagnose a relative or treat opposition to your limit as confirmation of pathology.
      Some distance protects safety; reconciliation is not a required outcome. When retaliation, abuse
      or clinical distress is relevant, a private fictional route and suitable qualified support may be
      more appropriate than a live boundary experiment.


      ### Worked example


      Every gathering invitation reaches Kim through a sibling, who adds “everyone will be disappointed
      if you cannot come.” Kim can send their own availability directly to the organizer and ask that
      it not be interpreted as a judgment about affection. That changes Kim''s communication route. It
      does not force others to stop relaying messages or prove the family is repaired. If Kim insults
      the sibling while setting the limit, Kim can repair the insult without surrendering the legitimate
      boundary.


      ### Supplied fictional task


      In an adult family, Leila organizes a monthly meal and asks cousin Arun to collect everyone''s replies.
      On 6 September Arun spent thirty minutes chasing responses, then told Leila that Mina''s silence
      probably meant disapproval. Mina later said she had been working and had not seen the invitation.
      On 4 October Arun again sent repeated reminders and interpreted Mina''s delayed answer as anger.
      Mina again said the inference was inaccurate.


      Arun values the meal and wants to attend the next one on 1 November, 12:00–14:00. Arun does not
      want to interpret other adults'' silence or carry every reply. Leila has not yet agreed to a different
      system. The supplied case includes no threats or essential care duties. It supplies only two events,
      not a childhood history, clinical diagnosis or complete account of anyone''s motives.


      ### Map, choose and review


      1. Draw a factual route for each occasion: organizer to collector, collector to relatives, replies
      or silence back through the collector. Separate “no reply yet” from “disapproval” and “anger.” Output:
      two event records with observation, interpretation and unknown columns.

      2. Name the valued good and the cost. Arun wants a shared meal; the chasing and unsupported interpretations
      consume time and can distort messages. Consider the inherited expectation that a helpful family
      member should coordinate everyone. Output: one good to preserve and one practice to reconsider,
      without declaring the whole family harmful.

      3. Choose an action Arun controls: answer Leila directly about Arun''s own attendance and decline
      to interpret or collect others'' replies. Draft a respectful limit and a possible alternative—Leila
      can invite direct replies if willing. Do not announce a new rule on Leila''s behalf. Output: a boundary
      message with the limited authority explicit.

      4. Before any real transfer, check whether a boundary could trigger retaliation or endanger necessary
      care. If so, do not stage the conversation as a test; use appropriate confidential support. In the
      fiction, save the message and open the [later packet](?resource=file-later-packet-md). Output: actual
      response versus hoped-for response, and the learner''s own follow-through.

      5. If Arun slips into the old route, name that recurrence rather than judging the whole effort worthless.
      If hurtful wording occurs, distinguish repairing the wording from abandoning the limit. Output:
      one proportionate correction and the still-unresolved family behavior.


      ### Support and transfer


      For support, use only the two supplied invitations and draw arrows or dictate the events. No family
      tree, trauma narrative or disclosure from relatives is necessary. For a harder fictional case, have
      a relative disagree politely with the new limit. Explain why disagreement is not automatically retaliation
      or diagnostic confirmation; then consider which responsibilities are actually yours.


      For a real attempt, select an ordinary low-stakes pattern you can observe without monitoring people.
      Make one proportionate change within your control at a natural opportunity. Compare your later conduct
      with the plan and invite feedback only if welcome. Record no names or private histories in the learning
      app. A successful direct reply is a limited action, not proof of intergenerational healing. If no
      suitable opportunity occurs within the period, retain the plan as preparation and avoid fabricating
      an outcome.


      ### Source use


      [The Bowen Center''s account of triangles, S11](https://www.thebowencenter.org/triangles) supplies
      a theoretical lens on three-person communication. It is not imported as a universal causal law or
      a clinical diagnosis; the source''s illness-causation language and family example are not used.
      [Safety guidance, S14](https://www.thehotline.org/plan-for-safety/) informs the separate route for
      unsafe contact. The two-event map and case are original.


      ### Use the result at its proper scale


      Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
      guidance.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Reason from observed events before [checking answers](?check=practice-answers).


      1. A relative objects to a new boundary. Does that prove the family has a pathological pattern or
      the boundary is necessarily wrong?

      2. You observe repeated indirect communication but know little about childhood history. Can you
      explain it as inherited trauma in your record?

      3. A learner sets a legitimate limit but insults the other person. Must repairing the insult mean
      retracting the limit?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Neither follows. Examine the actual objection, safety context, responsibilities and conduct.
      Ordinary disagreement, coercion and a valid practical concern are different possibilities. One response
      cannot establish a diagnosis or settle the boundary''s adequacy.

      2. No. Record the observed route and its effects, with history unknown. Trauma may be relevant when
      genuinely known, but the exercise does not recover memories or diagnose causes. Seek suitable qualified
      support for clinical concerns.

      3. No. Acknowledge and repair the unnecessary insult while restating the limit respectfully. Taking
      responsibility for wording does not obligate someone to resume an unwanted role or contact. Review
      any genuine continuing duties separately.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
