    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Family systems and intergenerational
    patterns as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied case: family plans are always passed through one person, who feels responsible
    for everyone’s response. On paper make columns for occasion, visible roles, who speaks to whom, inherited
    rule, benefit and cost. Use neutral role labels, not identifying histories. Goal: Distinguish a family
    pattern’s protective purpose from its present costs and make one proportionate change in your own
    participation. Scope: One ordinary pattern can be examined without diagnosing relatives, reconstructing
    trauma, requiring reconciliation or deciding the whole family’s character. Time and effort: Two private
    20-minute passes and one naturally occurring low-stakes opportunity within two weeks. Adaptation:
    Use a diagram, oral reflection or a fictional family when personal mapping would expose sensitive
    history. Do not contact an estranged or unsafe relative for this exercise. Qualified family, trauma,
    legal or safeguarding support takes precedence over an attempted repair. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a diagram, oral reflection or a fictional family when personal mapping would
    expose sensitive history. Do not contact an estranged or unsafe relative for this exercise. Qualified
    family, trauma, legal or safeguarding support takes precedence over an attempted repair.
  expected_burden: Two private 20-minute passes and one naturally occurring low-stakes opportunity within
    two weeks.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Family systems and intergenerational patterns protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Family systems and intergenerational patterns action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a diagram,
    oral reflection or a fictional family when personal mapping would expose sensitive history. Do not
    contact an estranged or unsafe relative for this exercise. Qualified family, trauma, legal or safeguarding
    support takes precedence over an attempted repair.
  actions:
  - stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01-A1
    sequence: 1
    title: Map the pattern and the loyalty it serves
    instructions: 'Describe two ordinary occasions when the same coordination pattern occurred. Draw the
      communication routes and distinguish an observed alliance from an assumed motive. For the default,
      retaining a trusted organizer may preserve connection while making that person carry every refusal.
      Name one inherited belief, one loyalty worth preserving and one burden. Mark unknown history as
      unknown; neither estrangement nor a trauma explanation may be inferred from this small map.


      Observation checks: Two specific occasions are distinguished; Observed routes are separated from
      presumed motives; A protective good and a present burden are both named; Unknown history is not
      filled with a diagnosis. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01
      action_stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01-A1
      competency_stable_id: '19.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1901_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1901_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_specific_occasions_are_distinguished
        - observed_routes_are_separated_from_presumed_motives
        - a_protective_good_and_a_present_burden_are_both_named
        - unknown_history_is_not_filled_with_a_diagnosis
      - measurement_id: c1901_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1901_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
