  - stable_id: PRACTICE-COMP-1901-FAMILY-SYSTEMS-AND-INTERGENERATIONAL-PATTERNS-01-A3
    sequence: 3
    title: Observe the response without demanding transformation
    instructions: 'At a safe natural opportunity, carry out the new communication once. Record your action,
      the actual response and whether you resumed the old intermediary role. Make a small repair if your
      wording added unnecessary hurt without retracting a legitimate limit. Decide whether to repeat,
      adjust the channel or seek support. A family member’s disagreement is not proof that your map was
      correct, and one success is not evidence that an intergenerational pattern is healed.


      Observation checks: A real use or explicitly labeled rehearsal is recorded; Your action and others’
      responses remain separate; A proportionate repair or next boundary is specified; No broad family-healing
      claim is made. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which inherited good survived the change, which burden shifted, and what did the response
      show that your original map missed?


      Examples: Supportive: The participant answered directly and stopped carrying a sibling’s response
      while preserving a welcome family gathering.


      Mixed: The direct answer helped, but the participant still explained another adult’s absence and
      revised the boundary.


      Contradictory: The map became a diagnosis of relatives or an excuse to confront an unsafe person
      and demand reconciliation.


      Inconclusive: Family labels were listed without an observed pattern, controllable change or actual
      rehearsal.'
