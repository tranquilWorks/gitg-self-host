    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Family systems and intergenerational patterns practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Family systems and intergenerational patterns as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a diagram, oral reflection or a fictional family when personal mapping
    would expose sensitive history. Do not contact an estranged or unsafe relative for this exercise.
    Qualified family, trauma, legal or safeguarding support takes precedence over an attempted repair.
  opportunity_considerations: 'Use the supplied case: family plans are always passed through one person,
    who feels responsible for everyone’s response. On paper make columns for occasion, visible roles,
    who speaks to whom, inherited rule, benefit and cost. Use neutral role labels, not identifying histories.'
  prerequisites:
