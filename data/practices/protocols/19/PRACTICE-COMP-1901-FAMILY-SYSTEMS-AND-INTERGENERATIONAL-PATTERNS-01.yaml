meaning_and_fit:
  purpose: Distinguish a family pattern’s protective purpose from its present costs and make one proportionate
    change in your own participation.
  why_recommended: Distinguish a family pattern’s protective purpose from its present costs and make one
    proportionate change in your own participation.
  claims:
  - statement: Distinguish a family pattern’s protective purpose from its present costs and make one proportionate
