      - [Lasting power of attorney for people with dementia](https://www.alzheimers.org.uk/get-support/legal-financial/lasting-power-attorney)

      - [The Cognitive Dimension of Household Labor](https://journals.sagepub.com/doi/abs/10.1177/0003122419859007)

      - [Communicating with your child’s other parent during separation](https://www.cafcass.gov.uk/parent-carer-or-family-member/my-family-involved-private-law-proceedings/resources-help-you-make-arrangements-are-your-childs-best-interests/communicating-your-childs-other-parent-during-separation)

      - [Convention for the Safeguarding of the Intangible Cultural Heritage](https://www.unesco.org/en/legal-affairs/convention-safeguarding-intangible-cultural-heritage)

      - [Cultural Documentation Guidelines](https://wwws.loc.gov/folklife/edresources/ed-trainingdocuments.html)

      - [Healthy Habits: Caring for Yourself When Caring for Another](https://www.cdc.gov/caregiving/caring-for-yourself/index.html)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      In the tabletop rehearsal, the learner identifies prompt qualified care as the first response to
      Tessa''s unexpected concern, with emergency help if appropriate. No real call is made and no symptom
      or clinical outcome is established by the rehearsal.


      For the ordinary fictional evening, Ivo cancels at 16:00. Tessa accepts Dev''s specific offer to
      collect an already agreed prepared meal and leave it at the door at 17:45. Dev accepts and completes
      that task. Dev does not enter or provide infant care. Sal confirms the 18:00 handoff and remains
      responsible under the existing care instructions until 19:00, when responsibility is explicitly
      returned. Tessa reports that the quiet hour was useful. No visitors arrive and no images are shared.


      The meal was fifteen minutes later than the original plan but was changed by agreement. Credit the
      actual accepted alternative and protected interval, not Dev''s earlier unspecified offer. No next-day
      coverage is arranged, and the packet provides no medical recovery or mental-health assessment. Keep
      that uncertainty separate from the useful evening support.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Build a support handoff that centers the pregnant or postpartum person's choices and recovery.\
      \ Allow thirty minutes to plan, fifteen for a tabletop interruption, and a brief confirmed handoff.\
      \ A real route requires permission and an appropriate existing support role. Otherwise use this\
      \ fiction. Do not simulate symptoms, make a practice emergency call, manage a birth or seek private\
      \ experiences to complete the task.\n\n### Separate support from authority\n\nPregnancy, birth and\
      \ postpartum recovery involve bodily demands and potential risks that ordinary helpers cannot assess\
      \ through a worksheet. Consent to help with a meal is not consent to touch, attend a consultation,\
      \ post a photograph or make a medical decision. A support person, an infant caregiver and a legally\
      \ authorized decision-maker have different roles. Clarify the particular task and existing authority\
      \ rather than treating family membership as permission for everything.\n\nA birth preference or\
      \ support plan helps people communicate what matters. It is not a guarantee that clinical circumstances\
      \ will unfold as hoped or a reason to override the person's ongoing choices. Qualified care teams\
      \ handle medical questions and changing clinical needs. A helper can make it easier to ask questions,\
      \ obtain accessible communication and reach care without speaking over the person or deciding that\
      \ their concern is exaggerated.\n\nRecovery support may include food, household work, transport,\
      \ visitor management and a real chance to rest. Infant care is a separate responsibility requiring\
      \ an appropriate competent caregiver and established professional instructions. Do not improvise\
      \ feeding, handling, sleep arrangements or treatment here. A meal delivery does not establish infant-care\
      \ competence, and a willing visitor does not become a safe substitute merely because the schedule\
      \ has a gap.\n\nPostpartum mental health belongs in the plan alongside physical health. Ask what\
      \ contact and support are welcome and how concerns reach qualified help. [CDC's warning-sign resource,\
      \ S04](https://www.cdc.gov/hearher/maternal-warning-signs/index.html) identifies urgent concerns\
      \ during pregnancy and afterward, including serious physical symptoms and thoughts of harm. The\
      \ list is not exhaustive. Actual concerning symptoms require prompt appropriate care, not a helper's\
      \ reassurance or completion of this exercise.\n\n### Worked example\n\nA recovering parent requests\
      \ a meal left at the door and no visitors. A helper cooks, enters without asking and invites relatives\
      \ to see the baby. The food arrived, but the agreed support was not fulfilled as specified. A better\
      \ handoff confirms the time, delivery location and completion signal, while respecting the visitor\
      \ limit. Good intentions cannot substitute for the recipient's actual permission.\n\n### Supplied\
      \ fictional task\n\nTessa has recently returned home after birth and has an existing maternity-team\
      \ plan and infant-care instructions. The task does not reproduce those clinical records. Tessa wants\
      \ a meal delivered at 17:30 on 8 October, no visitors that evening, no photographs shared, and a\
      \ rest opportunity from 18:00 to 19:00. Tessa can change these preferences.\n\nFriend Ivo accepts\
      \ meal delivery but has no infant-care role or medical decision authority. Co-parent Sal is an established\
      \ competent infant caregiver under the existing instructions and accepts the 18:00–19:00 interval.\
      \ Neighbor Dev offers to help but has not been accepted for any task. The qualified maternity contact\
      \ and local urgent-care route are available in the private care plan; do not invent phone numbers.\
      \ No actual symptom is supplied at the starting point.\n\nFor the tabletop disruption only, imagine\
      \ Ivo becomes unavailable and Tessa says something feels unexpectedly wrong physically. This hypothetical\
      \ branch does not say what condition exists. It asks who should be contacted and how support continuity\
      \ is handled without delaying care.\n\n### Create and challenge the handoff\n\n1. Make seven headings:\
      \ qualified contacts, Tessa's choices, recovery support, infant care, mental-health support, visitors/privacy\
      \ and backup. Use the supplied roles and preferences. Output: a role map that leaves Dev's offer\
      \ unassigned and retains the private professional instructions as authoritative.\n2. Write the meal\
      \ and rest arrangements with accepting owners, time windows, permission limits and completion signals.\
      \ Identify any necessary task not covered. Do not silently assign it to Tessa. Output: two bounded\
      \ handoffs, not a general “family will help” statement.\n3. Read the warning-sign resource and identify\
      \ the established route for contacting qualified care. Do not turn the resource into a checklist\
      \ that rules out concern when a symptom is not listed. Output: a care-contact route and a separate\
      \ practical backup question, without diagnosing or sharing clinical details.\n4. Rehearse the tabletop\
      \ disruption aloud or on paper. Pause ordinary planning and contact the appropriate qualified route\
      \ in the scenario; use local emergency services for an actual emergency. Seek an accepted meal alternative\
      \ and preserve safe infant coverage as appropriate. Output: an action order that does not wait for\
      \ dinner or a family vote before seeking care. Make no real practice calls.\n5. Save the plan and\
      \ read the [later packet](?resource=file-later-packet-md). Separate the tabletop response from the\
      \ ordinary handoff that actually occurs within the fiction. Output: support delivered, choices respected,\
      \ burden remaining and the status of future coverage.\n\n### Adapt and apply\n\nFor support, work\
      \ only with the meal task and the existing care-contact route, using a translated or accessible\
      \ note. No one must tell a birth story or disclose mental-health history. For a harder case, remove\
      \ the accepted infant caregiver and explain why an available untrained visitor cannot simply fill\
      \ that role. An unresolved safe-coverage gap needs appropriate help, not optimistic relabeling.\n\
      \nFor an authorized real attempt, ask the person what would reduce burden, confirm one practical\
      \ arrangement and follow the current professional plan. Check whether the help was welcome afterward\
      \ without demanding gratitude. A successful meal or rest interval supports that limited claim; it\
      \ does not certify medical recovery, infant safety across all settings or the absence of postpartum\
      \ distress.\n\n### Source use\n\n[S03, NHS antenatal care](https://www.nhs.uk/pregnancy/your-pregnancy-care/your-antenatal-care-and-appointments/),\
      \ supports person-specific discussion with maternity professionals, within its own health system.\
      \ S04 supports prompt attention to urgent concerns; no symptom list or diagnosis is used as a gate\
      \ to help. The role map, times and fictional interruption are original and do not certify birth\
      \ or infant-care skills.\n\n### Use the result at its proper scale\n\nMedical, reproductive, child-safety,\
      \ guardianship, and elder-care decisions require qualified local guidance.\n\n No reproductive,\
      \ parenting or care role is compulsory. Fiction does not establish actual participant evidence.\
      \ Keep identifying, clinical and private family information outside app records.\n\nAttempt the\
      \ [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Try first; then [check answers](?check=practice-answers).


      1. A postpartum person reports a concerning symptom while helpers finish a support worksheet. Should
      the worksheet be completed before contacting care?

      2. A meal volunteer is available during an infant-care gap. Does availability alone make them the
      accepted competent caregiver?

      3. One quiet rest interval occurs and is appreciated. What broader conclusions about recovery or
      postpartum mental health remain unsupported?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Stop the exercise and use the appropriate prompt qualified or emergency route. A helper
      should not diagnose, dismiss the concern or use a checklist to deny care. The worksheet serves support,
      not triage authority.

      2. No. Permission, competence, the existing care instructions and an explicit accepted handoff matter.
      Keep the gap visible and obtain appropriate coverage; a meal role does not transfer infant or medical
      authority.

      3. The interval supports a limited claim of useful support. It does not establish clinical recovery,
      absence of distress or sustainable future coverage. Respect the person''s report without converting
      gratitude into a health assessment.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
