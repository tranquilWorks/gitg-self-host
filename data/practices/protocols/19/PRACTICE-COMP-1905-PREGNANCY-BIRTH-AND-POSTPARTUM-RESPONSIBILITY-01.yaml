  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Pregnancy, birth, and postpartum responsibility explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Pregnancy, birth, and postpartum responsibility
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Pregnancy, birth, and postpartum responsibility observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Pregnancy, birth, and postpartum responsibility rules withhold observations
    older than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Let the pregnant or postpartum person set the support priorities. Observed
    checks: Support preferences come from the person or authorized process; Helper medical and infant-care
    roles are distinguished; Current professional instructions are identified; Physical mental-health
    and urgent-help routes are explicit. Action 2: Assign recovery and infant-support work with consent.
    Observed checks: One concrete support task has an accepting owner; Infant-care responsibilities follow
    qualified existing guidance; Visitor privacy and bodily-consent limits are stated; Uncovered work
    is visible rather than silently reassigned. Action 3: Test one disruption and confirm the real handoff.
    Observed checks: A helper-unavailable disruption is rehearsed without false emergency calls; Current
    symptoms trigger real qualified help rather than practice; One actual support handoff is confirmed;
    Safety agency and burden are reviewed together.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A birth checklist was copied without the person’s preferences,
    confirmed task owners or an interruption test.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Pregnancy,
    birth, and postpartum responsibility contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
