meaning_and_fit:
  purpose: Prepare an agreed support arrangement that protects the pregnant or postpartum person’s safety,
    consent, recovery and access to care without transferring decision authority to helpers.
  why_recommended: Prepare an agreed support arrangement that protects the pregnant or postpartum person’s
    safety, consent, recovery and access to care without transferring decision authority to helpers.
  claims:
  - statement: Prepare an agreed support arrangement that protects the pregnant or postpartum person’s
      safety, consent, recovery and access to care without transferring decision authority to helpers.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Pregnancy, birth, and postpartum responsibility practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Pregnancy, birth, and postpartum responsibility as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use an accessible written plan, interpreter or trusted supporter chosen by
    the person. A fictional plan is useful preparation but not evidence of live perinatal support. Clinical
    instructions and local emergency services remain authoritative; no one must disclose birth experiences
    or mental-health history to complete a rehearsal.
  opportunity_considerations: Use an existing maternity care plan with permission, or the supplied fictional
    case of a person returning home after birth who wants meals and visitor limits. Prepare headings for
    care contacts, the person’s choices, recovery support, infant-care responsibilities, mental-health
    support, visitor rules and backup coverage.
  prerequisites:
  - Use an existing maternity care plan with permission, or the supplied fictional case of a person returning
    home after birth who wants meals and visitor limits. Prepare headings for care contacts, the person’s
    choices, recovery support, infant-care responsibilities, mental-health support, visitor rules and
    backup coverage.
  dependencies: []
  safe_alternatives:
  - Use an accessible written plan, interpreter or trusted supporter chosen by the person. A fictional
    plan is useful preparation but not evidence of live perinatal support. Clinical instructions and local
    emergency services remain authoritative; no one must disclose birth experiences or mental-health history
    to complete a rehearsal.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Pregnancy, birth, and postpartum responsibility differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Pregnancy, birth, and postpartum
    responsibility as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an existing maternity care plan with permission, or the supplied fictional case of a person
    returning home after birth who wants meals and visitor limits. Prepare headings for care contacts,
    the person’s choices, recovery support, infant-care responsibilities, mental-health support, visitor
    rules and backup coverage. Goal: Prepare an agreed support arrangement that protects the pregnant
    or postpartum person’s safety, consent, recovery and access to care without transferring decision
    authority to helpers. Scope: This is support planning around qualified maternity and infant care,
    not birth management, medical triage, infant-care certification or a substitute for urgent evaluation.
    Time and effort: A 30-minute planning conversation, one 15-minute tabletop interruption and a short
    confirmed support handoff. Adaptation: Use an accessible written plan, interpreter or trusted supporter
    chosen by the person. A fictional plan is useful preparation but not evidence of live perinatal support.
    Clinical instructions and local emergency services remain authoritative; no one must disclose birth
    experiences or mental-health history to complete a rehearsal. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible written plan, interpreter or trusted supporter chosen by the
    person. A fictional plan is useful preparation but not evidence of live perinatal support. Clinical
    instructions and local emergency services remain authoritative; no one must disclose birth experiences
    or mental-health history to complete a rehearsal.
  expected_burden: A 30-minute planning conversation, one 15-minute tabletop interruption and a short
    confirmed support handoff.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Pregnancy, birth, and postpartum responsibility protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Pregnancy, birth, and postpartum responsibility action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    written plan, interpreter or trusted supporter chosen by the person. A fictional plan is useful preparation
    but not evidence of live perinatal support. Clinical instructions and local emergency services remain
    authoritative; no one must disclose birth experiences or mental-health history to complete a rehearsal.
  actions:
  - stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01-A1
    sequence: 1
    title: Let the pregnant or postpartum person set the support priorities
    instructions: 'Ask what assistance is welcome and what decisions they want protected from interference.
      Distinguish a support person, an authorized medical decision-maker where applicable and an infant
      caregiver; these are not interchangeable roles. Read the care team’s current instructions and an
      official maternal warning-sign resource together when appropriate. Identify how concerns will reach
      qualified care promptly, including mental-health or safety concerns, without asking a family helper
      to decide whether symptoms are serious enough.


      Observation checks: Support preferences come from the person or authorized process; Helper medical
      and infant-care roles are distinguished; Current professional instructions are identified; Physical
      mental-health and urgent-help routes are explicit. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01-A1
      competency_stable_id: '19.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1905_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1905_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - support_preferences_come_from_the_person_or_authorized_process
        - helper_medical_and_infant_care_roles_are_distinguished
        - current_professional_instructions_are_identified
        - physical_mental_health_and_urgent_help_routes_are_explicit
      - measurement_id: c1905_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1905_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01-A2
    sequence: 2
    title: Assign recovery and infant-support work with consent
    instructions: 'Allocate one meal, household or transport task and the accompanying completion signal.
      Separately identify who is qualified and willing to provide any infant care, following the established
      care instructions rather than improvising handling, feeding or sleep arrangements. Agree visitor
      and privacy limits, a rest opportunity and how a helper asks before touching or sharing information.
      Keep an uncovered task visible; do not solve it by presuming the recovering person will silently
      absorb it.


      Observation checks: One concrete support task has an accepting owner; Infant-care responsibilities
      follow qualified existing guidance; Visitor privacy and bodily-consent limits are stated; Uncovered
      work is visible rather than silently reassigned. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01-A2
      competency_stable_id: '19.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1905_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1905_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_concrete_support_task_has_an_accepting_owner
        - infant_care_responsibilities_follow_qualified_existing_guidance
        - visitor_privacy_and_bodily_consent_limits_are_stated
        - uncovered_work_is_visible_rather_than_silently_reassigned
      - measurement_id: c1905_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1905_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01-A3
    sequence: 3
    title: Test one disruption and confirm the real handoff
    instructions: 'Use a spoken scenario: the planned helper becomes unavailable and the person reports
      feeling unexpectedly unwell. Rehearse contacting the agreed qualified care route and backup; do
      not simulate symptoms, interrupt treatment or call an emergency line for practice. Then confirm
      one actual support arrangement and its review time. Ask whether the plan reduces burden and preserves
      agency. If concerning symptoms are present now, seek appropriate care immediately instead of treating
      the scenario as a rehearsal.


      Observation checks: A helper-unavailable disruption is rehearsed without false emergency calls;
      Current symptoms trigger real qualified help rather than practice; One actual support handoff is
      confirmed; Safety agency and burden are reviewed together. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which decision stayed with the pregnant or postpartum person, which burden gained
      a reliable owner, and what happens before the next helper fails to arrive?


      Examples: Supportive: The person chose visitor limits, a meal owner confirmed the handoff and the
      backup knew how to contact the maternity team promptly.


      Mixed: Tasks were assigned, but the first plan treated infant care and medical authority as the
      same role; they were separated.


      Contradictory: Helpers overrode consent, dismissed concerning symptoms or delayed real urgent care
      to finish the planning exercise.


      Inconclusive: A birth checklist was copied without the person’s preferences, confirmed task owners
      or an interruption test.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-1905-PREGNANCY-BIRTH-AND-POSTPARTUM-RESPONSIBILITY-01-A3
      competency_stable_id: '19.05'
