  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Pregnancy, birth, and postpartum responsibility; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Use an accessible written plan, interpreter or trusted supporter chosen by the person. A fictional
      plan is useful preparation but not evidence of live perinatal support. Clinical instructions and
      local emergency services remain authoritative; no one must disclose birth experiences or mental-health
      history to complete a rehearsal.
    cultural_context:
    - Adapt the expression of Pregnancy, birth, and postpartum responsibility to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use an accessible written plan, interpreter or trusted supporter chosen by the person. A fictional
      plan is useful preparation but not evidence of live perinatal support. Clinical instructions and
      local emergency services remain authoritative; no one must disclose birth experiences or mental-health
      history to complete a rehearsal.
  pause_conditions:
  - Pause Pregnancy, birth, and postpartum responsibility when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Pregnancy, birth, and postpartum responsibility practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Pregnancy, birth, and postpartum responsibility situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
