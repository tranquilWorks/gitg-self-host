meaning_and_fit:
  purpose: Use medically reliable information and explicit personal values to identify reproductive questions,
    uncertainty and the appropriate qualified care route.
  why_recommended: Use medically reliable information and explicit personal values to identify reproductive
    questions, uncertainty and the appropriate qualified care route.
  claims:
  - statement: Use medically reliable information and explicit personal values to identify reproductive
      questions, uncertainty and the appropriate qualified care route.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Fertility and reproductive health literacy practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Fertility and reproductive health literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use publicly available cases, translated clinical material or a supported
    consultation instead of disclosing personal history. Follow local law and professional guidance. A
    current safety concern, coercion, pregnancy complication or urgent symptom requires appropriate immediate
    support rather than completing the study sequence.
  opportunity_considerations: 'Use three supplied cases: an adult wants to avoid pregnancy; another is
    considering pregnancy and prenatal care; another has questions about difficulty conceiving or reproductive
    aging. Use current public information from a health authority or relevant clinical professional body,
    noting country and review date. No private sexual history belongs in application evidence.'
  prerequisites:
  - 'Use three supplied cases: an adult wants to avoid pregnancy; another is considering pregnancy and
    prenatal care; another has questions about difficulty conceiving or reproductive aging. Use current
    public information from a health authority or relevant clinical professional body, noting country
    and review date. No private sexual history belongs in application evidence.'
  dependencies: []
  safe_alternatives:
  - Use publicly available cases, translated clinical material or a supported consultation instead of
    disclosing personal history. Follow local law and professional guidance. A current safety concern,
    coercion, pregnancy complication or urgent symptom requires appropriate immediate support rather than
    completing the study sequence.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Fertility and reproductive health literacy differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Fertility and reproductive
    health literacy as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three supplied cases: an adult wants to avoid pregnancy; another is considering pregnancy
    and prenatal care; another has questions about difficulty conceiving or reproductive aging. Use current
    public information from a health authority or relevant clinical professional body, noting country
    and review date. No private sexual history belongs in application evidence. Goal: Use medically reliable
    information and explicit personal values to identify reproductive questions, uncertainty and the appropriate
    qualified care route. Scope: This is education and consultation preparation, not a fertility prediction,
    contraceptive prescription, pregnancy diagnosis or obligation to pursue parenthood. Time and effort:
    Two 20-minute source-and-question sessions, followed by a routine qualified inquiry when a real question
    is current. Adaptation: Use publicly available cases, translated clinical material or a supported
    consultation instead of disclosing personal history. Follow local law and professional guidance. A
    current safety concern, coercion, pregnancy complication or urgent symptom requires appropriate immediate
    support rather than completing the study sequence. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use publicly available cases, translated clinical material or a supported consultation
    instead of disclosing personal history. Follow local law and professional guidance. A current safety
    concern, coercion, pregnancy complication or urgent symptom requires appropriate immediate support
    rather than completing the study sequence.
  expected_burden: Two 20-minute source-and-question sessions, followed by a routine qualified inquiry
    when a real question is current.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Fertility and reproductive health literacy protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Fertility and reproductive health literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use publicly
    available cases, translated clinical material or a supported consultation instead of disclosing personal
    history. Follow local law and professional guidance. A current safety concern, coercion, pregnancy
    complication or urgent symptom requires appropriate immediate support rather than completing the study
    sequence.
  actions:
  - stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01-A1
    sequence: 1
    title: Separate the decision, values and medical unknowns
    instructions: 'For each case, identify the desired outcome, whose body and decision are involved,
      and one value or practical constraint such as reversibility, privacy, access or timing. Write what
      remains medically unknown rather than estimating fertility from appearance, age alone or a calendar
      guess. Distinguish contraception, infection prevention, pregnancy care, infertility evaluation and
      age-related questions; an answer about one does not settle the others.


      Observation checks: All three cases have an explicit desired outcome; Bodily autonomy and relevant
      values are identified; Medical unknowns are left unresolved rather than guessed; Five different
      reproductive topics are not conflated. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01
      action_stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01-A1
      competency_stable_id: '19.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1904_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1904_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_three_cases_have_an_explicit_desired_outcome
        - bodily_autonomy_and_relevant_values_are_identified
        - medical_unknowns_are_left_unresolved_rather_than_guessed
        - five_different_reproductive_topics_are_not_conflated
      - measurement_id: c1904_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1904_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01-A2
    sequence: 2
    title: Build a small source-to-question record
    instructions: 'Inspect one current official contraception source and one qualified fertility or pregnancy-care
      source. For each, write the exact limited question it answers, its intended population and what
      requires individualized advice. Prepare questions such as Which options fit my health and preferences,
      What preparation or prenatal care should I discuss, and When should my situation receive evaluation.
      Do not turn a population guideline into a personal deadline or change a method based only on this
      worksheet.


      Observation checks: Sources have an identifiable medical authority and date; Each source is tied
      to a limited question; Population guidance is separated from personal suitability; No treatment
      method or timing is prescribed by the exercise. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01
      action_stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01-A2
      competency_stable_id: '19.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1904_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1904_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - sources_have_an_identifiable_medical_authority_and_date
        - each_source_is_tied_to_a_limited_question
        - population_guidance_is_separated_from_personal_suitability
        - no_treatment_method_or_timing_is_prescribed_by_the_exercise
      - measurement_id: c1904_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1904_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1904-FERTILITY-AND-REPRODUCTIVE-HEALTH-LITERACY-01-A3
    sequence: 3
    title: Take the appropriate information-gathering step
    instructions: 'For a real current question, contact an appropriate licensed service through its verified
      channel to ask about appointment type, access, confidentiality and information to bring. Use a qualified
      interpreter or accessible format when needed. For the fictional cases, rehearse a concise question
      and mark the referral uncontacted. Record the next step and remaining uncertainty, including the
      legitimate choice not to pursue a reproductive pathway; urgent symptoms are not held for a routine
      educational review.


      Observation checks: A real inquiry or clearly labeled rehearsal occurs; Access confidentiality and
      appropriate service type are checked; Unanswered questions have a qualified next route; No reproductive
      role or outcome is treated as compulsory. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which question became clearer, which remains individual and medical, and how will
      the next decision preserve informed voluntary choice?


      Examples: Supportive: The participant distinguished contraception from infection protection and
      prepared an individualized consultation without choosing a method from a generic rule.


      Mixed: The sources were reliable, but one age-related statistic was initially treated as a personal
      prediction and corrected.


      Contradictory: The worksheet became a prescription, a fertility guarantee or pressure for a partner
      to accept a reproductive choice.


      Inconclusive: Several websites were collected without evaluating scope or forming a qualified-care
      question.'
    expected_time: 15-25 minutes
    due_within_days: 10
