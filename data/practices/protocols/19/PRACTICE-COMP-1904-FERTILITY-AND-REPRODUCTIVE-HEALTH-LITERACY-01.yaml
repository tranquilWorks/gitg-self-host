  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Contraception and Birth Control Methods](https://www.cdc.gov/contraception/about/index.html)

      - [Infertility: Frequently Asked Questions](https://www.cdc.gov/reproductive-health/infertility-faq/index.html)

      - [Antenatal (pregnancy) care and appointments](https://www.nhs.uk/pregnancy/your-pregnancy-care/your-antenatal-care-and-appointments/)

      - [Urgent Maternal Warning Signs and Symptoms](https://www.cdc.gov/hearher/maternal-warning-signs/index.html)

      - [Miscarriage](https://www.nhs.uk/conditions/miscarriage/)

      - [Adoption](https://www.childwelfare.gov/topics/permanency/adoption/)

      - [Child Abuse Education Resources](https://www.azed.gov/wellness/child-abuse-education-resources)

      - [Arizona Revised Statutes §13-3620](https://www.azleg.gov/ars/13/03620.htm)

      - [What to do if a child reveals abuse](https://www.nspcc.org.uk/keeping-children-safe/reporting-abuse/what-to-do-child-reveals-abuse/)

      - [Calling 911](https://www.911.gov/calling-911/)

      - [Effective Discipline to Raise Healthy Children](https://publications.aap.org/pediatrics/article/142/6/e20183112/37452/Effective-Discipline-to-Raise-Healthy-Children)

      - [Inspected correction](https://publications.aap.org/pediatrics/article/143/2/e20183609/37315/Sege-RD-Siegel-BS-Council-on-Child-Abuse-and)

      - [Supported Decision Making Program](https://acl.gov/programs/consumer-control/supported-decision-making-program)

      - [Lasting power of attorney for people with dementia](https://www.alzheimers.org.uk/get-support/legal-financial/lasting-power-attorney)

      - [The Cognitive Dimension of Household Labor](https://journals.sagepub.com/doi/abs/10.1177/0003122419859007)

      - [Communicating with your child’s other parent during separation](https://www.cafcass.gov.uk/parent-carer-or-family-member/my-family-involved-private-law-proceedings/resources-help-you-make-arrangements-are-your-childs-best-interests/communicating-your-childs-other-parent-during-separation)

      - [Convention for the Safeguarding of the Intangible Cultural Heritage](https://www.unesco.org/en/legal-affairs/convention-safeguarding-intangible-cultural-heritage)

      - [Cultural Documentation Guidelines](https://wwws.loc.gov/folklife/edresources/ed-trainingdocuments.html)

      - [Healthy Habits: Caring for Yourself When Caring for Another](https://www.cdc.gov/caregiving/caring-for-yourself/index.html)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Mara rehearses the inquiry but does not contact a service. The correct status remains uncontacted.
      Elise sends an access inquiry and receives confirmation that a supported appointment format can
      be discussed when booking. No appointment is booked and no pregnancy is established. Transport remains
      only an offer from the partner.


      Omar and Ren contact a licensed clinic. The clinic asks them to arrange an individual consultation
      and explains what information to bring privately. They book 22 October. No clinician has assessed
      them and no evaluation timing or fertility prognosis is supplied. The friend''s birthday rule is
      withdrawn from their decision card, rather than replaced with another universal cutoff.


      Compare the three statuses: rehearsal, administrative reply and booked consultation. None provides
      a method recommendation, pregnancy diagnosis or fertility result. Write one useful next question
      for each and retain the right to decline the offered pathway. Do not infer clinical suitability
      from a service''s willingness to offer an appointment, or count Elise''s offered transport as a
      completed support task.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Turn a reproductive question into a bounded, medically informed consultation question. Use\
      \ two twenty-minute sessions and, only for a real current need, an appropriate qualified inquiry.\
      \ This is literacy and decision preparation, not a fertility test or an instruction to pursue pregnancy.\
      \ Use all three fictional cases without supplying personal sexual or medical history. A person can\
      \ decide not to pursue a reproductive path.\n\n### Learn what kind of question you have\n\nFertility\
      \ concerns the possibility of reproduction; an individual's situation is not readable from appearance\
      \ or a calendar estimate. Contraception concerns preventing pregnancy. Infection prevention is a\
      \ separate question: an answer about pregnancy prevention does not automatically answer it. Pregnancy\
      \ care concerns an existing pregnancy and appropriate professional support; prenatal or antenatal\
      \ care is the care provided before birth. Preparing for a possible pregnancy is different from establishing\
      \ that someone is pregnant.\n\nInfertility and reproductive aging require attention to individual\
      \ circumstances. Population patterns can identify useful questions but cannot supply a personal\
      \ prognosis. Nor should a public-health definition be converted into a rule that someone must wait\
      \ before asking for care. Information about one reproductive partner does not settle the other person's\
      \ contribution or needs. Evaluation, diagnosis and treatment selection remain with qualified care,\
      \ informed by the person's choices.\n\nA decision includes values as well as facts. Privacy, reversibility,\
      \ cost, access, timing, religious commitments and willingness to undergo procedures may matter differently\
      \ to different people. Stating a value does not make a medical claim true; a medical fact does not\
      \ determine which acceptable option someone must choose. Separate desired outcome, relevant value,\
      \ medical unknown and next source of information.\n\nReliable sourcing requires a named authority,\
      \ an identifiable topic and a scope. A national health page can explain categories while leaving\
      \ personal suitability unanswered. Check its review date and intended health system. A commercial\
      \ testimonial may describe one experience without establishing comparative effectiveness or suitability.\
      \ A list of bookmarks is not an evaluated source record.\n\n### Worked example\n\nAn adult wants\
      \ to avoid pregnancy and values a reversible option. A general method overview shows that choices\
      \ have different features. It does not establish which method fits that person's medical history\
      \ or whether infection prevention is addressed. A good question is “Which options fit my health,\
      \ preferences and access, and what separate infection-prevention questions should I discuss?” Choosing\
      \ a method from the first appealing paragraph would skip the individual decision.\n\n### Three supplied\
      \ fictional cases\n\n**A:** Mara wants to avoid pregnancy for now, values privacy and reversibility,\
      \ and has not discussed personal medical suitability with a clinician. No method, health condition\
      \ or sexual history is supplied.\n\n**B:** Elise is considering pregnancy and wants to know how\
      \ pre-pregnancy advice differs from care once pregnant. Elise needs an accessible appointment format\
      \ and has not reported a pregnancy or urgent symptoms. Elise's partner offers to help arrange transport,\
      \ not to choose care.\n\n**C:** Omar and Ren have questions about difficulty conceiving and reproductive\
      \ aging. No ages, duration, test results or diagnosis are supplied. They want to understand when\
      \ their circumstances warrant evaluation and what information a licensed service needs. A friend\
      \ claims a single birthday predicts the outcome; the case provides no support for that claim.\n\n\
      These cases deliberately leave medical variables unknown. The task is to form useful questions and\
      \ preserve choice, not fill the gaps with imagined clinical facts.\n\n### Make a source-to-question\
      \ record\n\n1. For each case write the desired outcome, whose decision and body are involved, one\
      \ stated value or access need, and the unknowns. Mark pregnancy status unknown where appropriate.\
      \ Output: three decision cards that do not turn Mara's avoidance into future parenthood or Elise's\
      \ consideration into a pregnancy.\n2. Read the general-choice portion of [CDC contraception guidance,\
      \ S01](https://www.cdc.gov/contraception/about/index.html), the definition and individual-care caveat\
      \ in [CDC infertility guidance, S02](https://www.cdc.gov/reproductive-health/infertility-faq/index.html),\
      \ and the introductory account of [NHS antenatal care, S03](https://www.nhs.uk/pregnancy/your-pregnancy-care/your-antenatal-care-and-appointments/).\
      \ Record authority, country, date inspected, one question each helps answer and one it cannot answer.\
      \ Do not import an NHS appointment schedule into another system. Output: three narrow source uses,\
      \ in your own words.\n3. Draft one consultation question per case. Ask about suitable options for\
      \ A, preparation versus prenatal-care access for B, and individualized evaluation for C. Include\
      \ confidentiality, appointment type, accessibility and what information to bring. Output: concise\
      \ questions, with no medication change, diagnosis, personal deadline or fertility guarantee.\n4.\
      \ In fiction, rehearse an inquiry and label it uncontacted. In an authorized real situation, use\
      \ the verified channel of an appropriate licensed service and record whether an inquiry actually\
      \ occurred. Keep private details in the proper care channel. Output: actual status rather than a\
      \ claim that reading resolved a clinical decision.\n5. Save your cards before the [later packet](?resource=file-later-packet-md).\
      \ Identify which questions received administrative information and which still require individualized\
      \ advice. Output: a supported next step with uncertainty intact.\n\n### Support and transfer\n\n\
      For support, begin with A, use a translated official page or have a trusted chosen supporter help\
      \ formulate questions. A qualified interpreter may be needed for care; an app translation alone\
      \ should not settle an important clinical misunderstanding. For a harder fictional attempt, add\
      \ a confident statistical claim and explain why its population, outcome and limitations matter before\
      \ applying it to an individual.\n\nFor real transfer, use a current question that belongs to you\
      \ or one you are legitimately supporting with permission. Ask a professional what is appropriate\
      \ rather than treating this guide as a referral-timing algorithm. Current concerning symptoms, coercion\
      \ or urgent pregnancy concerns need the appropriate prompt help; they are not held for the second\
      \ study session. An informed choice can include declining a procedure or pathway, while acknowledging\
      \ what is still medically unknown.\n\n### Source limits\n\nS01 supports general informed choice\
      \ and separate prevention questions; S02 explicitly distinguishes public-health definitions from\
      \ individual care. S03 describes an NHS care system. No treatment, dosage, screening schedule or\
      \ personal prediction is copied into this exercise. The three cases and decision-card method are\
      \ original teaching design, not a validated clinical instrument.\n\n### Use the result at its proper\
      \ scale\n\nMedical, reproductive, child-safety, guardianship, and elder-care decisions require qualified\
      \ local guidance.\n\n No reproductive, parenting or care role is compulsory. Fiction does not establish\
      \ actual participant evidence. Keep identifying, clinical and private family information outside\
      \ app records.\n\nAttempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A public-health definition uses a duration threshold. May a learner treat it as a personal instruction
      to delay asking about symptoms or reproductive concerns?

      2. A pregnancy-prevention overview is medically reliable. Does it alone establish a suitable method
      and infection protection for a particular person?

      3. A clinic offers a fertility consultation. What has that established about prognosis, and what
      decision still belongs to the person?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Definitions and population guidance have purposes and limits; current symptoms and individual
      circumstances may need prompt qualified attention. Ask about the relevant care route instead of
      manufacturing a personal waiting rule.

      2. No. Reliability does not make a general page an individual assessment. Separate pregnancy prevention,
      infection prevention, health suitability, preferences and access. Use the overview to prepare questions,
      not prescribe or change a method.

      3. It establishes an offered consultation, not a diagnosis, prognosis or guaranteed outcome. The
      person retains informed choice about seeking it and any later options. A booking or attendance does
      not supply unreported clinical findings.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
