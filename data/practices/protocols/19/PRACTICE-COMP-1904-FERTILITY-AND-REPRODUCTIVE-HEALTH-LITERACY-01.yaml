  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Fertility and reproductive health literacy; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use publicly available cases, translated clinical material or a supported consultation instead of
      disclosing personal history. Follow local law and professional guidance. A current safety concern,
      coercion, pregnancy complication or urgent symptom requires appropriate immediate support rather
      than completing the study sequence.
    cultural_context:
    - Adapt the expression of Fertility and reproductive health literacy to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use publicly available cases, translated clinical material or a supported consultation instead of
      disclosing personal history. Follow local law and professional guidance. A current safety concern,
      coercion, pregnancy complication or urgent symptom requires appropriate immediate support rather
      than completing the study sequence.
  pause_conditions:
  - Pause Fertility and reproductive health literacy when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Fertility and reproductive health literacy practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Fertility and reproductive health literacy situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
