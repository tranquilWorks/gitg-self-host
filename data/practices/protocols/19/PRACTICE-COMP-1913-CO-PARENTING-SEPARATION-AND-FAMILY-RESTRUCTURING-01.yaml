        - current_authority_and_safety_arrangements_are_checked
        - the_dependent_is_not_made_a_messenger_or_decision_maker_for_adult_conflict
        - unresolved_legal_or_safety_questions_are_escalated_appropriately
      - measurement_id: c1913_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
