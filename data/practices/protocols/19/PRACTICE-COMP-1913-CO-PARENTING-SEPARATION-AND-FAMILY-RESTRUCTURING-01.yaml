meaning_and_fit:
  purpose: Create a clear, authorized transition handoff that protects children or dependents from being
    messengers, leverage or collateral in adult conflict.
  why_recommended: Create a clear, authorized transition handoff that protects children or dependents
    from being messengers, leverage or collateral in adult conflict.
  claims:
  - statement: Create a clear, authorized transition handoff that protects children or dependents from
      being messengers, leverage or collateral in adult conflict.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Co-parenting, separation, and family restructuring
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Co-parenting, separation, and family restructuring as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use an accessible shared schedule, approved co-parenting system, interpreter
    or authorized intermediary. People without such a role use the fictional case. In coercive or abusive
    situations, follow specialist safety and legal guidance rather than ordinary collaborative co-parenting
    advice.
  opportunity_considerations: 'Default to a routine pickup after a change in household arrangements. Prepare
    only the necessary neutral facts: permitted time and place, authorized adults, required belongings,
    access or care instructions, confirmation channel and exception route. Keep allegations, relationship
    arguments and private child statements outside the handoff.'
  prerequisites:
  - 'Default to a routine pickup after a change in household arrangements. Prepare only the necessary
    neutral facts: permitted time and place, authorized adults, required belongings, access or care instructions,
    confirmation channel and exception route. Keep allegations, relationship arguments and private child
    statements outside the handoff.'
  dependencies: []
  safe_alternatives:
  - Use an accessible shared schedule, approved co-parenting system, interpreter or authorized intermediary.
    People without such a role use the fictional case. In coercive or abusive situations, follow specialist
    safety and legal guidance rather than ordinary collaborative co-parenting advice.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Co-parenting, separation, and family restructuring differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Co-parenting, separation,
    and family restructuring as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to a routine pickup after a change in household arrangements. Prepare only the necessary
    neutral facts: permitted time and place, authorized adults, required belongings, access or care instructions,
    confirmation channel and exception route. Keep allegations, relationship arguments and private child
    statements outside the handoff. Goal: Create a clear, authorized transition handoff that protects
    children or dependents from being messengers, leverage or collateral in adult conflict. Scope: Use
    existing custody, guardianship, care and safety arrangements. This does not draft a parenting order,
    mediate abuse, determine contact rights or require direct communication with an unsafe person. Time
    and effort: Twenty minutes to prepare, a 10-minute fictional disruption and one permitted real handoff
    or rehearsal. Adaptation: Use an accessible shared schedule, approved co-parenting system, interpreter
    or authorized intermediary. People without such a role use the fictional case. In coercive or abusive
    situations, follow specialist safety and legal guidance rather than ordinary collaborative co-parenting
    advice. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible shared schedule, approved co-parenting system, interpreter or
    authorized intermediary. People without such a role use the fictional case. In coercive or abusive
    situations, follow specialist safety and legal guidance rather than ordinary collaborative co-parenting
    advice.
  expected_burden: Twenty minutes to prepare, a 10-minute fictional disruption and one permitted real
    handoff or rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Co-parenting, separation, and family restructuring protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Co-parenting, separation, and family restructuring action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    shared schedule, approved co-parenting system, interpreter or authorized intermediary. People without
    such a role use the fictional case. In coercive or abusive situations, follow specialist safety and
    legal guidance rather than ordinary collaborative co-parenting advice.
  actions:
  - stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01-A1
    sequence: 1
    title: Separate the dependent person’s needs from the adult dispute
    instructions: 'Identify what the child or dependent needs for continuity: a predictable explanation,
      required items, authorized care information and a safe arrival. Check the current legal or professional
      arrangement and who may communicate or collect them. State the adult issue separately without asking
      the dependent to choose sides or carry it. When authority or safety is disputed, seek the appropriate
      qualified route rather than inventing a compromise that bypasses an order or protection plan.


      Observation checks: Continuity needs are explicit and age or ability appropriate; Current authority
      and safety arrangements are checked; The dependent is not made a messenger or decision-maker for
      adult conflict; Unresolved legal or safety questions are escalated appropriately. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01
      action_stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01-A1
      competency_stable_id: '19.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1913_a1_primary
      transfer_disposition: context_bound
      measurements:
