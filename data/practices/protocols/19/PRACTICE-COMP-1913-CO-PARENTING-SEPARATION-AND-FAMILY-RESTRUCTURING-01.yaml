  - stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01-A2
    sequence: 2
    title: Write a neutral handoff with one exception process
    instructions: 'Prepare a concise message containing the permitted plan, necessary items and how receipt
      will be confirmed. Add a process for a delay: the authorized adult uses the approved channel and
      follows the existing exception arrangement. Do not insert criticism, demand a relationship discussion
      or condition care on a concession. Rehearse the message through a neutral third party or approved
      system when direct contact is unsafe or prohibited.


      Observation checks: The message contains only necessary handoff facts; Receipt and delay handling
      use an approved channel; Care is not conditional on an adult concession; Unsafe or prohibited direct
      contact is not required. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01
      action_stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01-A2
      competency_stable_id: '19.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
