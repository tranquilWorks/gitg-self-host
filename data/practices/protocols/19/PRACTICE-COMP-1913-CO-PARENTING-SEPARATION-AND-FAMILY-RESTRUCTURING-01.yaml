  - stable_id: PRACTICE-COMP-1913-CO-PARENTING-SEPARATION-AND-FAMILY-RESTRUCTURING-01-A3
    sequence: 3
    title: Test a disruption and complete the accountable transfer
    instructions: 'Use a paper scenario in which the planned collector is delayed or a new partner offers
      to collect instead. Check authorization before changing the plan and identify the safe existing
      fallback; do not experiment with a child’s pickup. For a real permitted handoff, confirm transfer
      through the approved method and review any confusion with the responsible adults, not through the
      dependent. Revise the communication within existing rules and use qualified help for changes those
      rules do not permit.


      Observation checks: A delay or substitute-collector scenario checks authorization; No live child-safety
      test is staged; A real transfer or labeled rehearsal has a clear endpoint; Review avoids triangulation
      retaliation and unauthorized changes. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What made the transition predictable for the dependent person, and which adult issue
      stayed out of their responsibilities?


      Examples: Supportive: The approved channel confirmed the pickup and a delay was handled by adults
      without using the child to carry messages.


      Mixed: The facts were clear, but unnecessary criticism entered the first message and was removed
      before use.


      Contradictory: A child was asked to choose sides, essential care was withheld for leverage or a
      contact restriction was bypassed.


      Inconclusive: A transition plan was described without checking authority or defining a safe transfer
      endpoint.'
    expected_time: 15-25 minutes
