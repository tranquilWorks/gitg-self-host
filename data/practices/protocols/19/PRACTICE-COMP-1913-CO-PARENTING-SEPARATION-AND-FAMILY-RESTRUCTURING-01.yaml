  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The current caregiver acknowledges Morgan''s delay through the permitted scheduling service and
      states that Ellis is not approved under the existing arrangement. Ellis does not collect the child.
      No child is asked to carry a message, choose an adult or explain the disagreement. Necessary belongings
      remain available, and the current authorized caregiver continues care under the supplied fallback.


      Morgan confirms a revised 16:20 arrival through the same channel. Morgan arrives at 16:25, and the
      ordinary authorized transfer and confirmation occur then. The actual handoff is twenty-five minutes
      after the original 16:00 time and five minutes after the revised estimate. A confirmed estimate
      did not make the transfer complete at 16:20.


      The caregiver reports that the delay affected another commitment and requests discussion through
      the permitted process of how future delays should be handled. No revised standing arrangement or
      approval for Ellis is made. Record protected continuity, actual timing and the unresolved adult
      burden. Do not infer that wider conflict, legal questions or the child''s adjustment have been resolved
      from one completed pickup.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Prepare one authorized handoff that keeps adult conflict out of a dependent person's job. Allow\
      \ twenty minutes to plan and ten to rehearse a fictional disruption. Use a real ordinary handoff\
      \ only within existing care, custody and safety arrangements. Never create a late pickup, substitute\
      \ a collector or involve a child in an experiment. If contact is unsafe or prohibited, use the appropriate\
      \ authorized intermediary or professional route.\n\n### Keep continuity separate from the adult\
      \ relationship\n\nBreakup, divorce, relocation, estrangement and a new partnership can change who\
      \ is available, how information travels and what a dependent person expects. The legal, emotional\
      \ and logistical questions are related but different. A clear breakup message does not settle custody\
      \ or housing. A new partner does not automatically become an authorized collector. A move cannot\
      \ simply be inserted into a schedule when it changes an existing arrangement or required permission.\n\
      \nChildren and other dependents should not have to carry the adult dispute. Triangulation occurs\
      \ when they are made a messenger, witness for one side or source of information about the other.\
      \ Asking a child to relay a hostile message or choose whose account is true transfers adult work\
      \ onto them. Listen to their needs without making them negotiate contact or prove loyalty.\n\nRetaliation\
      \ can appear as delayed information, withheld necessary items, financial pressure or disruption\
      \ of a handoff. A task review should ask whether essential continuity is protected, not whether\
      \ one adult won the argument. A dependent person's care, comfort and access are not bargaining chips.\
      \ Their views matter within the proper process; they are not responsible for resolving an adult's\
      \ hurt.\n\nPredictable arrangements require more than a calendar entry. Clarify permitted time,\
      \ place, authorized adults, necessary items, accessibility needs, communication channel and exceptions.\
      \ Use existing professional care instructions where relevant; this exercise does not copy private\
      \ medical details into an app. Define how the actual transfer is confirmed. A message saying someone\
      \ intends to arrive is not the same as an accepted handoff.\n\nOrdinary cooperation guidance has\
      \ limits. Threats, coercion, prohibited contact or safety concerns may require protected communication\
      \ or professional involvement. Do not insist on direct conversation, mediation or a joint meeting\
      \ as proof of mature co-parenting. Existing orders and safety plans govern; changing them requires\
      \ the appropriate qualified process.\n\n### Worked example\n\nA pickup is delayed. One adult considers\
      \ sending the child a message blaming the other household. A better response uses the permitted\
      \ adult channel, states the delay and follows the existing authorized fallback. If a proposed substitute\
      \ is not approved, convenience does not create permission. The child can receive a simple age-appropriate\
      \ explanation of what will happen without being asked to relay accusations or choose a collector.\n\
      \n### Supplied fictional case\n\nFollowing a household change, an existing authorized arrangement\
      \ provides for an ordinary pickup at 16:00 by Morgan. The permitted adult channel is an established\
      \ scheduling service. An existing fallback says the child remains with the currently authorized\
      \ caregiver until an approved handoff is confirmed. The case supplies no right to improvise a new\
      \ collector or location. Necessary belongings are prepared, and a private care instruction remains\
      \ in its proper channel.\n\nAt 15:40, Morgan reports a twenty-minute delay and proposes a new partner,\
      \ Ellis, instead. Ellis is not on the currently approved collector arrangement. The exercise does\
      \ not establish why approval is absent and does not require the child to decide. The safe fictional\
      \ task is to preserve the authorized fallback and communicate facts through the permitted channel.\n\
      \n### Plan the handoff and the exception\n\n1. Extract the existing authority, permitted time and\
      \ place, adults, items, access needs and channel. Mark anything unknown rather than inventing a\
      \ custody rule. Output: a compact handoff card whose sensitive details remain outside app evidence.\n\
      2. Draft a neutral practical update. Keep adult grievances and relationship history out of it. Output:\
      \ time, relevant change, request and confirmation needed, without a child messenger or blame statement.\n\
      3. Apply the supplied delay and collector disruption in fiction. Check Ellis's status against the\
      \ actual arrangement and use the existing fallback. Output: what remains authorized, what is not\
      \ yet approved and which professional route would handle a requested change.\n4. Distinguish proposed\
      \ arrival, acknowledged plan and actual transfer. For a real routine event, use only the existing\
      \ appropriate confirmation process. Output: the actual endpoint or a truthful statement that it\
      \ has not occurred. Never stage a failed handoff for evidence.\n5. Save the plan before opening\
      \ the [later packet](?resource=file-later-packet-md). Review continuity, the dependent person's\
      \ ordinary needs and any adult burden created by delay. Output: one logistical improvement that\
      \ does not rewrite legal or safety arrangements.\n\n### Support and transfer\n\nFor support, use\
      \ only the fictional card and a two-sentence neutral update. For a harder version, direct contact\
      \ becomes prohibited: preserve the authorized intermediary and seek qualified help rather than introducing\
      \ an informal workaround. Real transfer may involve school transport, elder support across households\
      \ or another routine change, but authority and the dependent person's interests must remain explicit.\n\
      \nOne smoothly completed pickup cannot establish that separation is resolved, conflict is absent\
      \ or the arrangement is legally adequate. A review can identify a specific continuity success and\
      \ an unresolved scheduling burden. Grief, estrangement and future partnership decisions may require\
      \ other support and time. The dependent person does not owe reassurance that the adults handled\
      \ everything well.\n\n### Source limits\n\n[Cafcass guidance, S15](https://www.cafcass.gov.uk/parent-carer-or-family-member/my-family-involved-private-law-proceedings/resources-help-you-make-arrangements-are-your-childs-best-interests/communicating-your-childs-other-parent-during-separation),\
      \ supports practical communication and keeping children out of the messenger role within its England\
      \ family-justice context. This original fictional case does not transfer contact rights, legal rules\
      \ or ordinary cooperative advice into unsafe circumstances. Qualified local guidance is required\
      \ for changes to care, custody or safety arrangements.\n\n### Use the result at its proper scale\n\
      \nMedical, reproductive, child-safety, guardianship, and elder-care decisions require qualified\
      \ local guidance.\n\n No reproductive, parenting or care role is compulsory. Fiction does not establish\
      \ actual participant evidence. Keep identifying, clinical and private family information outside\
      \ app records.\n\nAttempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. A delayed collector proposes an unapproved new partner. Does convenience authorize the substitution,
      and should the child decide?

      2. Direct contact between adults is unsafe or prohibited. Must they communicate personally to demonstrate
      good co-parenting?

      3. A revised arrival is confirmed for 16:20, but the transfer happens at 16:25. What is the actual
      completion time, and what remains unproven?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Follow the actual care, custody and safety arrangement and its authorized fallback.
      The child must not be made responsible for approving a collector or resolving the conflict. Use
      the qualified process for any change.

      2. No. Use the authorized protected channel or intermediary and appropriate professional support.
      Ordinary cooperation advice does not override safety or contact restrictions, and improvising a
      workaround can undermine them.

      3. Completion is the actual authorized transfer at 16:25, not the planned time. It is twenty-five
      minutes after the original time and five after the revised estimate. One transfer does not establish
      resolved conflict, legal adequacy or the dependent person''s wider adjustment.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
