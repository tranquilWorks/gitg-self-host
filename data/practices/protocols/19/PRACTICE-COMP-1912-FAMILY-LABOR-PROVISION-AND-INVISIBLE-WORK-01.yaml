      Family labor, provision, and invisible work; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a visual map, short voice notes or a facilitated discussion. Solo caregivers may map a task
      with an external support provider; a fictional case tests negotiation only. Do not withdraw essential
      care, expose private finances or conduct a confrontation where coercion or retaliation is likely.
    cultural_context:
    - Adapt the expression of Family labor, provision, and invisible work to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a visual map, short voice notes or a facilitated discussion. Solo caregivers may map a task
      with an external support provider; a fictional case tests negotiation only. Do not withdraw essential
      care, expose private finances or conduct a confrontation where coercion or retaliation is likely.
  pause_conditions:
  - Pause Family labor, provision, and invisible work when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Family labor, provision, and invisible work practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Family labor, provision, and invisible work situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
