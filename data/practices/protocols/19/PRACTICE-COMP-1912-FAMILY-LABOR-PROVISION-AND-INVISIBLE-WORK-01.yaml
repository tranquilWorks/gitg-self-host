        expected: true
  - stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01-A2
    sequence: 2
    title: Negotiate a complete unit rather than assigning more reminders
    instructions: 'Choose one unit to transfer, such as planning and obtaining the needed supplies within
      an agreed limit, not merely carrying bags when prompted. Define the outcome, authority, resources,
      access needs and when help should be requested. Ask the proposed owner to accept or suggest a feasible
      alternative. Keep essential care covered and do not use income, gratitude or relational pressure
      to force agreement. Fairness may require unequal tasks because capacity and other responsibilities
      differ.


      Observation checks: The transferred unit includes its planning and follow-up; Authority resources
      and a help trigger are agreed; The receiving person explicitly accepts the unit; Essential care
      and unequal capacity remain protected. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01
      action_stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01-A2
      competency_stable_id: '19.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1912_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1912_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_transferred_unit_includes_its_planning_and_follow_up
        - authority_resources_and_a_help_trigger_are_agreed
        - the_receiving_person_explicitly_accepts_the_unit
        - essential_care_and_unequal_capacity_remain_protected
      - measurement_id: c1912_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1912_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01-A3
    sequence: 3
    title: Review the next occurrence for hidden rework
    instructions: 'At the next ordinary occurrence, let the accepted owner manage the unit within the
      agreement. Review whether someone else still had to notice, remind, rescue or redo it, and whether
      the standard was clear or unnecessarily exacting. Adjust one ownership boundary or resource rather
      than silently returning everything to the original person. Record what was delivered and what remains;
      a pleasant conversation alone does not demonstrate redistribution.


      Observation checks: The agreed unit is attempted in a real occurrence; Reminder rescue and rework
      burdens are checked; Standards and resources are reviewed alongside performance; One concrete ownership
      adjustment follows the review. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Who stopped carrying the task in their head, who gained real authority, and what hidden
      work still needs a fair owner?


      Examples: Supportive: The new owner planned supplies and noticed the next shortage without reminders,
      while the family adjusted the spending limit together.


      Mixed: Visible work moved, but the original person still managed every reminder; the unit was redefined
      more completely.


      Contradictory: The map became a gendered blame ledger or a reason to withdraw essential care until
      someone complied.


      Inconclusive: Tasks were listed but no complete unit was accepted, tried or reviewed.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01
      action_stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01-A3
      competency_stable_id: '19.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
