meaning_and_fit:
  purpose: Expose the noticing, planning, emotional, financial and practical work behind one recurring
    family responsibility and negotiate a fairer complete handoff.
  why_recommended: Expose the noticing, planning, emotional, financial and practical work behind one recurring
    family responsibility and negotiate a fairer complete handoff.
  claims:
  - statement: Expose the noticing, planning, emotional, financial and practical work behind one recurring
      family responsibility and negotiate a fairer complete handoff.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Family labor, provision, and invisible work practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Family labor, provision, and invisible work as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a visual map, short voice notes or a facilitated discussion. Solo caregivers
    may map a task with an external support provider; a fictional case tests negotiation only. Do not
    withdraw essential care, expose private finances or conduct a confrontation where coercion or retaliation
    is likely.
  opportunity_considerations: 'Use arranging a routine family meal: noticing the need, checking preferences,
    planning, obtaining supplies, paying, preparation, welcoming, cleanup and remembering what ran out.
    Choose a simpler shared task when meals involve health or safety complexity. Record broad effort and
    ownership, not private budgets or sensitive care details.'
  prerequisites:
  - 'Use arranging a routine family meal: noticing the need, checking preferences, planning, obtaining
    supplies, paying, preparation, welcoming, cleanup and remembering what ran out. Choose a simpler shared
    task when meals involve health or safety complexity. Record broad effort and ownership, not private
    budgets or sensitive care details.'
  dependencies: []
  safe_alternatives:
  - Use a visual map, short voice notes or a facilitated discussion. Solo caregivers may map a task with
    an external support provider; a fictional case tests negotiation only. Do not withdraw essential care,
    expose private finances or conduct a confrontation where coercion or retaliation is likely.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Family labor, provision, and invisible work differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Family labor, provision, and
    invisible work as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use arranging a routine family meal: noticing the need, checking preferences, planning, obtaining
    supplies, paying, preparation, welcoming, cleanup and remembering what ran out. Choose a simpler shared
    task when meals involve health or safety complexity. Record broad effort and ownership, not private
    budgets or sensitive care details. Goal: Expose the noticing, planning, emotional, financial and practical
    work behind one recurring family responsibility and negotiate a fairer complete handoff. Scope: This
    is a small workload agreement among willing participants, not a valuation of human worth or a demand
    that unequal capacity produce equal hours. Time and effort: A 20-minute workflow map, one 20-minute
    willing discussion and a review after the next occurrence. Adaptation: Use a visual map, short voice
    notes or a facilitated discussion. Solo caregivers may map a task with an external support provider;
    a fictional case tests negotiation only. Do not withdraw essential care, expose private finances or
    conduct a confrontation where coercion or retaliation is likely. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a visual map, short voice notes or a facilitated discussion. Solo caregivers
    may map a task with an external support provider; a fictional case tests negotiation only. Do not
    withdraw essential care, expose private finances or conduct a confrontation where coercion or retaliation
    is likely.
  expected_burden: A 20-minute workflow map, one 20-minute willing discussion and a review after the next
    occurrence.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Family labor, provision, and invisible work protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Family labor, provision, and invisible work action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a visual
    map, short voice notes or a facilitated discussion. Solo caregivers may map a task with an external
    support provider; a fictional case tests negotiation only. Do not withdraw essential care, expose
    private finances or conduct a confrontation where coercion or retaliation is likely.
  actions:
  - stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01-A1
    sequence: 1
    title: Map the whole responsibility before counting visible effort
    instructions: 'Write who notices, decides, reminds, coordinates, pays, performs, comforts and follows
      up for the selected task. Mark work nobody currently owns and work completed silently by default.
      Include the cost of interruptions and emotional reassurance without treating someone’s feelings
      as an invoice. Ask each willing participant to correct the map. Distinguish a present capacity constraint
      from an unexamined assumption about gender, age, income or who is naturally better at care.


      Observation checks: Noticing planning doing and follow-up are all visible; Emotional logistical
      and financial work are included; Unowned and default-owned tasks are identified; Participants can
      correct role assumptions and capacity estimates. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01
      action_stable_id: PRACTICE-COMP-1912-FAMILY-LABOR-PROVISION-AND-INVISIBLE-WORK-01-A1
      competency_stable_id: '19.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1912_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1912_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - noticing_planning_doing_and_follow_up_are_all_visible
        - emotional_logistical_and_financial_work_are_included
        - unowned_and_default_owned_tasks_are_identified
        - participants_can_correct_role_assumptions_and_capacity_estimates
      - measurement_id: c1912_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1912_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
