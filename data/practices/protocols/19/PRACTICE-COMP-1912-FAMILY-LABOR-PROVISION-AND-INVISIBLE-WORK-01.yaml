  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Owen explicitly accepts the drinks-and-table unit, checks the supplied headcount and preferences,
      spends 14 of the 18 available units, sets the accessible table and clears the agreed items afterward.
      No reminder or rescue from Nia is reported. Four units remain unspent; the packet states no other
      purchase against that unit''s limit.


      Nia rearranges the table decorations for twelve minutes after Owen finishes. The access arrangement
      and required items were already correct. In the review, Nia recognizes that the decorative symmetry
      was a personal preference, not an agreed completion condition. Owen agrees to keep the whole unit
      next time within the same limit. Nia may choose to decorate but will not make that optional work
      Owen''s unspoken duty or evidence that the unit failed.


      Welcoming the nervous guest, cooking and checking other supplies still fall to Nia in this packet.
      Their redistribution is discussed but not accepted by anyone. Record the completed unit, the twelve-minute
      optional redo and the remaining workload separately. One successful transfer does not establish
      overall fairness or resolve every emotional, financial and caregiving responsibility.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Make the work behind one family event visible, transfer one complete unit by agreement, and\
      \ review the next occurrence. Allow twenty minutes to map, twenty for a willing discussion and a\
      \ short review after the work. Use the fictional multigeneration meal unless real participants want\
      \ to examine an ordinary shared responsibility. Do not use the exercise to invoice affection or\
      \ withdraw essential care.\n\n### Headcount, preferences, access and prices\n\nThe fictional meal\
      \ has six confirmed guests. Four request still water and two request apple juice; these are ordinary\
      \ preferences, with no dietary restriction supplied. A water pack provides four 250 mL servings\
      \ for 4 units; a juice carton provides four 250 mL servings for 4 units. Six washable cups are available\
      \ without cost. A reusable table covering costs 6 units. The agreed table arrangement keeps the\
      \ entry-side place clear for a mobility aid and the route unobstructed; nobody has authorized a\
      \ change. Obtain one water pack, one juice carton and one covering, or justify another option that\
      \ meets the stated needs within 18 units. This card supplies case facts, not a universal serving\
      \ recommendation.\n\n### Look beyond who performs the visible step\n\nDomestic labor includes preparing,\
      \ cleaning and maintaining the setting. Logistical labor includes noticing deadlines, arranging\
      \ access and keeping different people's needs aligned. Financial provision includes paying, budgeting\
      \ and managing the limits of available resources. Caregiving includes tasks that depend on competence\
      \ and authorization, not merely willingness. Emotional labor can include welcoming someone, managing\
      \ tension or remembering whose participation needs gentle accommodation. These forms interact, but\
      \ they are not interchangeable currencies.\n\nInvisible cognitive work often occurs before and after\
      \ visible execution: anticipating a need, identifying options, deciding and monitoring whether it\
      \ was met. A person can appear to have “handed over cooking” while still choosing the meal, checking\
      \ supplies, reminding the cook and repairing missed steps. Count those responsibilities when assessing\
      \ the transfer. Equally, ask whether some monitoring exists because the former owner insists on\
      \ an unnecessary personal standard rather than an agreed need.\n\nFair distribution is negotiated\
      \ in context. Available time, health, money, skill, care obligations and preferences can differ.\
      \ Equal hours are not automatically fair, and unequal income does not entitle someone to assign\
      \ all remaining labor. Gender, generation, marital status or who has always done a task is not a\
      \ sufficient reason to make it permanent. A person can decline a proposed unit, and essential care\
      \ still needs a safe plan.\n\nA complete unit needs a scope, resources, decision room, deadline\
      \ and help trigger. Ownership does not mean never asking a question. It means the new owner is responsible\
      \ for recognizing the question and resolving it through the agreed route, rather than waiting for\
      \ another person to supervise every step. Clarify what satisfactory completion means so that unnecessary\
      \ rework is not silently reinstated as someone else's duty.\n\n### Worked example\n\nA relative\
      \ offers to buy drinks for a meal. If another person must count guests, check preferences, give\
      \ a shopping list, send reminders and put everything away, only the purchase moved. A fuller accepted\
      \ unit could include checking the agreed needs, staying within the budget, obtaining the drinks\
      \ and arranging storage and cleanup. The helper needs access to the information and permission to\
      \ choose an acceptable option. If the former owner then redoes the arrangement solely for appearance,\
      \ review that standard as well as the transfer.\n\n### Supplied fictional case\n\nA household is\
      \ preparing a small meal for three generations. Nia usually notices the need, checks preferences,\
      \ plans, obtains supplies, pays from an agreed household amount, coordinates arrival, welcomes a\
      \ nervous guest, prepares, cleans and checks what is missing afterward. Other adults see the cooking\
      \ and describe it as Nia's only task. No clinical diet or specialized dependent-care instruction\
      \ is part of the case; those would remain with the proper authorized person.\n\nOwen offers to take\
      \ the whole drinks-and-table unit for the next meal. The agreed limit is 18 units of household money.\
      \ The unit includes checking the supplied preferences and headcount, choosing acceptable drinks,\
      \ obtaining them, setting an accessible table and clearing those items. Owen must ask before exceeding\
      \ the amount or changing an essential access arrangement. Decorative symmetry is Nia's preference,\
      \ not an agreed requirement.\n\n### Map, negotiate and review a whole unit\n\n1. Trace the meal\
      \ from noticing through the next shortage. Include who decides, reminds, coordinates, pays, performs,\
      \ comforts and checks afterward. Mark guesses for participant correction. Output: a visible labor\
      \ map rather than a list of job titles or complaints.\n2. Invite willing participants to correct\
      \ missing work and name current capacity. Distinguish essential care from preferences that can be\
      \ changed or dropped. Output: an agreed account of one overloaded area, without claiming every feeling\
      \ has a measurable price.\n3. Specify Owen's unit, resources, decision room, deadline and help trigger.\
      \ Ask whether the whole unit is accepted. Output: an explicit agreement; an offer to help or an\
      \ assigned name alone does not establish ownership.\n4. At the next ordinary occurrence, record\
      \ actual work, reminders, rescue, spending and any redo. Do not engineer a failure or leave essential\
      \ needs unmet to prove a point. Output: what transferred and what stayed hidden, including the former\
      \ owner's choices.\n5. Save your map before the [later packet](?resource=file-later-packet-md).\
      \ Review with the people who bore the work and revise one boundary or standard. Output: a concrete\
      \ change for the next occurrence, not an automatic return of the whole unit to Nia.\n\n### Support\
      \ and transfer\n\nFor support, trace just the drinks-and-table unit with three stages: prepare,\
      \ perform and follow up. For a harder fictional attempt, an illness reduces the new owner's capacity:\
      \ negotiate accepted coverage or simplify the event rather than silently restoring the old assignment.\
      \ Do not conflate an inability this week with refusal to contribute forever.\n\nA person living\
      \ alone can examine a service handoff or use fiction; they need not create a family event. In real\
      \ transfer, involve only willing participants and keep financial and care details private. One cycle\
      \ may reveal a clearer distribution, but repeated review and affected people's perspectives are\
      \ needed to assess durability. An elegant map cannot establish fairness while actual reminders and\
      \ rework remain unexamined.\n\n### Source limits\n\n[Daminger's research abstract, S14](https://journals.sagepub.com/doi/abs/10.1177/0003122419859007),\
      \ identifies cognitive dimensions of household labor beyond execution. Its interview sample does\
      \ not establish a universal family allocation rule or validate this multigeneration exercise. The\
      \ whole-unit design, resource limit and rework review are original applications. The task asks who\
      \ is doing the work, who can choose and what actually changed; it does not turn a study pattern\
      \ into gender destiny.\n\n### Use the result at its proper scale\n\nMedical, reproductive, child-safety,\
      \ guardianship, and elder-care decisions require qualified local guidance.\n\n No reproductive,\
      \ parenting or care role is compulsory. Fiction does not establish actual participant evidence.\
      \ Keep identifying, clinical and private family information outside app records.\n\nAttempt the\
      \ [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A new cook prepares the meal while another person plans, checks supplies and sends reminders.
      What actually transferred?

      2. A complete agreed unit is finished, but the former owner redoes it solely to meet an unagreed
      appearance preference. What should the review examine?

      3. One person earns more money and another has always coordinated care. Does that settle a fair
      permanent allocation?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Visible preparation transferred; planning and monitoring did not. Make the remaining work
      visible, clarify scope and resources, and seek explicit acceptance of a whole unit rather than counting
      a name on a chart as full ownership.

      2. Examine both actual completion and whether the extra standard was necessary and agreed. Optional
      rework should not automatically prove failure or return ownership. Negotiate the standard and decision
      room while preserving essential access and care needs.

      3. No. Money, capacity, time and care obligations matter, but income and past patterns do not confer
      unilateral assignment rights. Negotiate a workable distribution with the people bearing the work
      and review actual cycles; keep essential care covered during changes.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
