      - [Cultural Documentation Guidelines](https://wwws.loc.gov/folklife/edresources/ed-trainingdocuments.html)

      - [Healthy Habits: Caring for Yourself When Caring for Another](https://www.cdc.gov/caregiving/caring-for-yourself/index.html)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Ruth chooses a large-print reminder and accepts Alex''s call before the next appointment. Alex makes
      the agreed call, and Ruth checks the reminder and confirms the appointment time. The packet does
      not state whether the appointment is attended or what a clinician finds. Bea agrees to postpone
      the proposed takeover; no authority over communications, care or finances is granted.


      With Ruth''s permission, Alex makes an administrative inquiry about arranging an appropriate clinical
      discussion of the memory concerns. The service explains how to request an appointment. No assessment,
      diagnosis or capacity determination occurs. The family has not obtained advice about local advance-planning
      documents. The possible respite service remains uncontacted.


      Ruth says the large print was useful and asks to keep the weekly call for now. Alex''s one-call
      weekly limit remains; no additional family member has accepted backup. Another missed reminder,
      a change in Ruth''s wishes or a new safety concern would reopen the plan through the appropriate
      route. A successful call cannot close the unresolved clinical questions or convert a limited helper
      into an authorized decision-maker.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Build a person-centered support map for one ordinary difficulty, then identify what requires\
      \ qualified advice. Use two twenty-minute sessions and, only for an appropriate real role, an authorized\
      \ inquiry. This is not a dementia screen, a capacity determination or a legal document. A person\
      \ may choose a supporter; a family connection alone does not authorize control of their affairs.\n\
      \n### Distinguish the questions before choosing a solution\n\nChanging memory, health, communication\
      \ or mobility can affect daily tasks. An observed missed reminder is a fact about an event, not\
      \ a diagnosis. Dementia concerns clinical conditions that require appropriate assessment; age or\
      \ occasional forgetfulness cannot establish it. Sudden concerning changes, including acute confusion,\
      \ need prompt qualified attention rather than this routine planning exercise. Do not use a calm-looking\
      \ worksheet to dismiss a current urgent concern.\n\nCapacity and authority are separate from diagnosis.\
      \ A diagnosis does not automatically settle what a person can decide, and apparent difficulty with\
      \ one task does not establish global inability. Relevant capacity questions and legal standards\
      \ depend on the decision and jurisdiction. A relative's confidence, family majority vote or possession\
      \ of a phone is not legal authority to take over finances or care.\n\nSupported decision-making\
      \ starts with the person's preferences and chosen assistance. Accessible language, a quiet discussion,\
      \ an appropriate interpreter, communication aids or a trusted supporter can make participation more\
      \ meaningful. Ask what the person wants help with and what they want to keep doing. Support should\
      \ fit the task; its existence does not erase the person's choices.\n\nAdvance planning can make\
      \ future wishes and authorized roles clearer while participation is possible. Existing documents\
      \ need to be understood in the relevant local legal and care system. A financial authorization does\
      \ not necessarily include health decisions; titles and powers vary. This lesson does not draft a\
      \ directive, appoint a guardian or activate someone else's authority. Appropriate legal and clinical\
      \ guidance addresses those matters.\n\nProtection and autonomy are not resolved by choosing the\
      \ most restrictive arrangement imaginable. Compare the actual risk, the person's preference, feasible\
      \ support and the conditions that would require review. Sustainability matters too: an arrangement\
      \ that relies indefinitely on an exhausted relative may leave care unreliable. Include willing backup,\
      \ respite questions and a way to address disagreement without making the person disappear from the\
      \ conversation.\n\n### Worked example\n\nAn older adult misses an appointment reminder. One relative\
      \ proposes taking over every message and bank account. Another suggests an agreed visible reminder\
      \ plus a chosen reminder call. The narrower option may address the observed difficulty while preserving\
      \ participation, but it still requires agreement and review. Neither proposal establishes diagnosis,\
      \ capacity or legal authority. If the problem persists or new concerns arise, seek appropriate assessment\
      \ rather than silently expanding control.\n\n### Supplied fictional case\n\nRuth has missed two\
      \ appointment reminders and wants to remain involved in arrangements. No diagnosis, capacity finding,\
      \ emergency or legal document is supplied. Ruth chooses Alex to help discuss a reminder system.\
      \ Bea worries about safety and proposes handling all communications. Alex can make one agreed call\
      \ each week but cannot provide continuous oversight. A potentially available respite service has\
      \ not been contacted or accepted.\n\nThe immediate proposal is a visible reminder in Ruth's chosen\
      \ format plus Alex's call before the next ordinary appointment. Any information shared with Alex\
      \ must be within Ruth's permission and the actual applicable authority. No medical appointment result\
      \ or financial transaction is part of this exercise.\n\n### Build the support and authority map\n\
      \n1. Separate Ruth's stated preference, the two observed events, unknown clinical questions and\
      \ unknown legal powers. Output: a map that does not turn memory concerns into a diagnosis or family\
      \ worry into authority.\n2. Compare the limited reminder proposal with Bea's broad takeover proposal.\
      \ Ask Ruth what assistance is welcome and make communication accessible. Output: the preferred bounded\
      \ support, rejected assumptions and any unresolved safety concern needing qualified advice.\n3.\
      \ Identify the authorized route for clinical questions and the local professional route for advance-planning\
      \ or legal-authority questions. Use existing documents only in the proper private channel. Output:\
      \ questions and inquiry status, not an invented capacity finding or new directive.\n4. Assign one\
      \ accepted ordinary task, a clear limit, a backup question and a review trigger. Alex's weekly limit\
      \ must remain visible. Output: who will do what, what remains uncovered and when the plan needs\
      \ reconsideration. An uncontacted respite service is not backup coverage.\n5. Save the plan before\
      \ the [later packet](?resource=file-later-packet-md). Review the actual reminder attempt with Ruth's\
      \ perspective. Output: one specific result and unresolved clinical, legal and sustainability questions.\n\
      \n### Support and transfer\n\nFor support, discuss only the next reminder with the person's chosen\
      \ communication method and a trusted appropriate supporter. For a harder fictional version, relatives\
      \ disagree about whether a missed call justifies broad control. Revisit the actual risk, authority\
      \ and person-specific supports; do not resolve it with a family popularity vote. Real transfer requires\
      \ a role the person has accepted or that is validly authorized, plus qualified help where the task\
      \ exceeds it.\n\n[S12, ACL](https://acl.gov/programs/consumer-control/supported-decision-making-program),\
      \ supports chosen, task-specific assistance while retaining control. [S13, Alzheimer's Society](https://www.alzheimers.org.uk/get-support/legal-financial/lasting-power-attorney),\
      \ explains advance planning and different powers in its England and Wales context; it is not the\
      \ law for every location. One useful reminder is not evidence that dementia is absent, that capacity\
      \ is established or that caregiver strain is solved. Keep medical, financial and legal records outside\
      \ app evidence.\n\n### Use the result at its proper scale\n\nMedical, reproductive, child-safety,\
      \ guardianship, and elder-care decisions require qualified local guidance.\n\n No reproductive,\
      \ parenting or care role is compulsory. Fiction does not establish actual participant evidence.\
      \ Keep identifying, clinical and private family information outside app records.\n\nAttempt the\
      \ [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. An older adult misses two reminders. What has been established about dementia, decision-making
      capacity and a relative''s legal powers?

      2. Most relatives vote to take over all messages, although the person requests a limited reminder.
      What should guide the next step?

      3. A reminder works and a service explains appointment booking. Which claims about assessment, attendance
      and sustainable backup remain unsupported?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Only the observed missed reminders are established. Diagnosis requires appropriate clinical
      assessment; capacity is decision- and jurisdiction-specific; authority requires its own valid basis.
      Attend promptly to urgent changes instead of using the exercise to diagnose or delay care.

      2. Consider the person''s accessible participation, actual risks, proportionate supports and valid
      authority. A family vote does not grant powers or erase preferences. Seek qualified help for unresolved
      clinical, legal or safety questions.

      3. There is no stated assessment, diagnosis, capacity finding or attended appointment. An administrative
      reply is not clinical advice. Uncontacted services and unaccepted helpers do not supply coverage;
      review the accepted helper''s limit and unresolved backup.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
