meaning_and_fit:
  purpose: Clarify the person’s preferences, available decision support, appropriate authority and sustainable
    next step when memory or care needs change.
  why_recommended: Clarify the person’s preferences, available decision support, appropriate authority
    and sustainable next step when memory or care needs change.
  claims:
  - statement: Clarify the person’s preferences, available decision support, appropriate authority and
      sustainable next step when memory or care needs change.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Elder care, dementia, and later-life decision-making
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Elder care, dementia, and later-life decision-making as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use accessible communication, supported decision-making, a trusted person
    selected by the individual and more time. Keep clinical, financial and legal records in their proper
    secure systems. Urgent confusion, unsafe care or other current medical concerns require qualified
    assessment rather than a planning exercise.
  opportunity_considerations: Use the fictional case of an older adult who wants to remain involved in
    appointments but is missing some reminders. Prepare separate headings for preference, observed change,
    immediate safety, decision support, legal authority, care task, respite and disputed issue. Do not
    infer incapacity from age, diagnosis or forgetfulness alone.
  prerequisites:
  - Use the fictional case of an older adult who wants to remain involved in appointments but is missing
    some reminders. Prepare separate headings for preference, observed change, immediate safety, decision
    support, legal authority, care task, respite and disputed issue. Do not infer incapacity from age,
    diagnosis or forgetfulness alone.
  dependencies: []
  safe_alternatives:
  - Use accessible communication, supported decision-making, a trusted person selected by the individual
    and more time. Keep clinical, financial and legal records in their proper secure systems. Urgent confusion,
    unsafe care or other current medical concerns require qualified assessment rather than a planning
    exercise.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Elder care, dementia, and later-life decision-making differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Elder care, dementia, and
    later-life decision-making as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the fictional case of an older adult who wants to remain involved in appointments but is
    missing some reminders. Prepare separate headings for preference, observed change, immediate safety,
    decision support, legal authority, care task, respite and disputed issue. Do not infer incapacity
    from age, diagnosis or forgetfulness alone. Goal: Clarify the person’s preferences, available decision
    support, appropriate authority and sustainable next step when memory or care needs change. Scope:
    This is planning and qualified-consultation preparation, not a capacity assessment, dementia diagnosis,
    legal directive or permission to remove someone’s autonomy. Time and effort: Two 20-minute planning
    periods and one actual qualified or authorized coordination inquiry when relevant. Adaptation: Use
    accessible communication, supported decision-making, a trusted person selected by the individual and
    more time. Keep clinical, financial and legal records in their proper secure systems. Urgent confusion,
    unsafe care or other current medical concerns require qualified assessment rather than a planning
    exercise. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible communication, supported decision-making, a trusted person selected
    by the individual and more time. Keep clinical, financial and legal records in their proper secure
    systems. Urgent confusion, unsafe care or other current medical concerns require qualified assessment
    rather than a planning exercise.
  expected_burden: Two 20-minute planning periods and one actual qualified or authorized coordination
    inquiry when relevant.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Elder care, dementia, and later-life decision-making protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Elder care, dementia, and later-life decision-making action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    communication, supported decision-making, a trusted person selected by the individual and more time.
    Keep clinical, financial and legal records in their proper secure systems. Urgent confusion, unsafe
    care or other current medical concerns require qualified assessment rather than a planning exercise.
  actions:
  - stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01-A1
    sequence: 1
    title: Separate observed changes from the decision needing support
    instructions: 'Describe only the missed reminders and what consequence followed, keeping explanations
      open. Ask the person what matters about appointments, familiar routines and privacy, using their
      preferred communication supports. Identify any immediate safety concern for qualified care rather
      than diagnosing it yourself. Distinguish everyday assistance from decisions requiring a legally
      authorized person, and note which existing care or advance-planning documents should be reviewed
      by the appropriate professional.


      Observation checks: Observed change is separated from a diagnosis or capacity verdict; The person’s
      preferences are actively sought; Immediate safety concerns have a qualified route; Everyday help
      and formal decision authority are distinguished. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01
      action_stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01-A1
      competency_stable_id: '19.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1911_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1911_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - observed_change_is_separated_from_a_diagnosis_or_capacity_verdict
        - the_person_s_preferences_are_actively_sought
        - immediate_safety_concerns_have_a_qualified_route
        - everyday_help_and_formal_decision_authority_are_distinguished
      - measurement_id: c1911_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1911_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01-A2
    sequence: 2
    title: Compare a less-restrictive support with its practical burden
    instructions: 'For the default, compare a visible reminder plus a chosen support call with another
      person taking over all appointment communication. Ask which option preserves participation, what
      risk remains and who can reliably provide it. Include memory support, transport, respite and family
      disagreements as separate tasks or questions. Do not hold a family vote that substitutes for the
      person’s rights or required authority; unresolved legal or clinical questions go to qualified local
      guidance.


      Observation checks: Two support options are compared for participation and risk; The less-restrictive
      workable option is considered; Care respite and disagreement have explicit dispositions; A family
      preference is not mistaken for legal or clinical authority. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01
      action_stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01-A2
      competency_stable_id: '19.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1911_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1911_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_support_options_are_compared_for_participation_and_risk
        - the_less_restrictive_workable_option_is_considered
        - care_respite_and_disagreement_have_explicit_dispositions
        - a_family_preference_is_not_mistaken_for_legal_or_clinical_authority
      - measurement_id: c1911_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1911_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01-A3
    sequence: 3
    title: Arrange the next supported decision and review point
    instructions: 'With the appropriate permission, contact the relevant care team, planning professional
      or authorized coordinator about the unresolved question and what information they need. Confirm
      one ordinary support task and a review trigger such as another missed appointment or a stated change
      in preference. A fictional case may rehearse this handoff but cannot claim a professional decision
      was obtained. Revisit the plan when needs change; completing a document does not eliminate the need
      to listen to the person.


      Observation checks: A real qualified inquiry or labeled rehearsal occurs; One ordinary support task
      has an accepting owner; Changing needs or preferences trigger review; Planning documents do not
      replace ongoing participation. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which choice stayed with the person, which uncertainty needs qualified judgment, and
      who will carry the support without becoming exhausted?


      Examples: Supportive: The person chose a reminder call, an authorized coordinator checked the planning
      question and a respite backup was named.


      Mixed: The family agreed on help, but the first version assumed a diagnosis removed all decision
      rights; that assumption was corrected.


      Contradictory: Relatives took over finances or care decisions without authority, ignored the person’s
      wishes or treated age as incapacity.


      Inconclusive: A dementia checklist was completed without a specific decision, preference or accountable
      next step.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01
      action_stable_id: PRACTICE-COMP-1911-ELDER-CARE-DEMENTIA-AND-LATER-LIFE-DECISION-MAKING-01-A3
