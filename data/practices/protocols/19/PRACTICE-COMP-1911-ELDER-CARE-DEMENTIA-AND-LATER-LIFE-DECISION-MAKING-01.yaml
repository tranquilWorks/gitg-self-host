  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Elder care, dementia, and later-life decision-making; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Use accessible communication, supported decision-making, a trusted person selected by the individual
      and more time. Keep clinical, financial and legal records in their proper secure systems. Urgent
      confusion, unsafe care or other current medical concerns require qualified assessment rather than
      a planning exercise.
    cultural_context:
    - Adapt the expression of Elder care, dementia, and later-life decision-making to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - Use accessible communication, supported decision-making, a trusted person selected by the individual
      and more time. Keep clinical, financial and legal records in their proper secure systems. Urgent
      confusion, unsafe care or other current medical concerns require qualified assessment rather than
      a planning exercise.
  pause_conditions:
  - Pause Elder care, dementia, and later-life decision-making when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Elder care, dementia, and later-life decision-making practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Elder care, dementia, and later-life decision-making situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
