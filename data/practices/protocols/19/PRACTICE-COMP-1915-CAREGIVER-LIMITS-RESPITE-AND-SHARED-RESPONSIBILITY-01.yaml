        - the_return_handoff_closes_responsibility_clearly
        - burden_on_both_caregiver_and_backup_is_reviewed
        - long_term_exhaustion_is_not_declared_resolved_from_one_break
      - measurement_id: c1915_a3_boundary
        kind: boolean
