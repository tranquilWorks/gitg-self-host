      - [Convention for the Safeguarding of the Intangible Cultural Heritage](https://www.unesco.org/en/legal-affairs/convention-safeguarding-intangible-cultural-heritage)

      - [Cultural Documentation Guidelines](https://wwws.loc.gov/folklife/edresources/ed-trainingdocuments.html)

      - [Healthy Habits: Caring for Yourself When Caring for Another](https://www.cdc.gov/caregiving/caring-for-yourself/index.html)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Fin explicitly accepts the 14:00–16:00 interval and the established tasks. The private handoff confirms
      access, limits and the existing escalation route. Fin correctly explains those tasks; no new clinical
      competence is claimed. The paid service remains uncontacted, with cost and availability unknown.


      Fin arrives at 14:10. Dara continues care until the actual start acknowledgment at 14:15, then steps
      away. There is no uncovered interval. Fin does not extend beyond the accepted 16:00 end. At 16:00,
      Dara returns and the handback is acknowledged. Actual coverage is 105 minutes, not the scheduled
      120.


      During the first ten minutes away, Dara voluntarily checks routine messages despite no required
      update or incident. Dara then puts them aside while preserving necessary reachability. Dara describes
      95 minutes as protected rest and says it was useful. Fin reports that the bounded interval was manageable
      but has not accepted a recurring commitment. Record coverage, optional monitoring and reported rest
      separately. One useful break does not establish resolved burnout, improved clinical health or permanent
      backup. A later start plan and longer-term support still need review.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Create one bounded interval of relief with competent accepted coverage, then review whether\
      \ relief actually occurred. Allow twenty minutes to identify the gap, appropriate coordination time\
      \ and a short ordinary respite interval. Use an existing authorized care role or the supplied fiction.\
      \ A person without that role can rehearse an administrative reminder task; they must not arrange\
      \ live care or abandon a dependent person to test whether others will help.\n\n### Limits are information\
      \ about the arrangement\n\nMissed sleep, repeated errors, persistent resentment, no protected time\
      \ and a sense of being unable to leave a role can signal that the arrangement needs attention. They\
      \ do not establish a diagnosis or say anything about the recipient's worth. Burnout and role captivity\
      \ should not be dismissed as selfishness, but this exercise cannot diagnose them or resolve them\
      \ with one break.\n\nCare can involve both chosen commitment and obligations that cannot be dropped\
      \ abruptly. Distinguish essential tasks from optional standards, tasks that require particular competence\
      \ or authority, and tasks that can safely move or stop. A caregiver may need professional, social\
      \ or practical support to make a limit workable. Naming a limit without arranging continuity can\
      \ leave the same person responsible in practice or create an unsafe gap.\n\nRespite means someone\
      \ is actually relieved of agreed responsibility for a period through appropriate coverage. A kind\
      \ offer, a booked service or a family member's presence is not enough by itself. Check willingness,\
      \ competence, authorization, access, cost, the task scope and what to do if something changes. Do\
      \ not infer clinical or care skills from kinship, confidence or general helpfulness.\n\nShared responsibility\
      \ includes preparing and sustaining the handoff. The incoming caregiver needs the appropriate existing\
      \ instructions in the proper private channel, a way to ask questions and an escalation route. A\
      \ brief teach-back can reveal misunderstanding: ask them to explain their task and limits in their\
      \ own words. It does not certify competence for specialized care. Start and return acknowledgments\
      \ make responsibility at each moment explicit.\n\nA protected interval may fail to provide relief\
      \ if the outgoing caregiver keeps doing optional monitoring, answering routine requests or taking\
      \ on another obligatory task. At the same time, necessary contact required by the care plan must\
      \ remain available. Review the actual interval and experience rather than assuming that being in\
      \ another room equals rest. The backup person's burden matters as well; respite that simply exhausts\
      \ an unconsulted relative is not a stable shared arrangement.\n\n### Worked example\n\nA caregiver\
      \ asks for two hours off. A sibling says “I'll try to be around,” but has not accepted the care\
      \ tasks or learned the relevant plan. Calling this coverage would hide the gap. A better next step\
      \ is to secure a specific competent, authorized person's acceptance or seek the appropriate service.\
      \ If no coverage is available, identify urgent help or a safe alternative while maintaining essential\
      \ care; do not disappear to demonstrate how much work you do.\n\n### Supplied fictional case\n\n\
      Dara provides care within an established arrangement and has had no protected afternoon for several\
      \ weeks. Dara notices lost sleep and small organizational mistakes, with no current emergency stated.\
      \ The case does not supply clinical details or authorize changes to treatment. The proposed respite\
      \ is 14:00–16:00 on 12 October.\n\nFin is an already competent and authorized caregiver for the\
      \ specific existing tasks. Fin has expressed general willingness but has not yet accepted this interval.\
      \ A paid service is another possibility, but availability and cost are unknown. The existing plan\
      \ specifies necessary instructions, access and escalation through private care channels. Dara wants\
      \ to rest nearby without routine updates, while remaining reachable as that plan requires.\n\n###\
      \ Turn a limit into accepted coverage\n\n1. Name the specific unsustainable pattern and the bounded\
      \ relief needed. Separate essential care, optional standards and movable tasks. Output: a concrete\
      \ interval and task scope, not a judgment about the recipient or a demand that someone feel grateful.\n\
      2. Ask the appropriate potential backup to accept the interval and tasks. Verify competence, authority,\
      \ access, cost and the relevant existing instructions. Output: accepted coverage or an explicit\
      \ gap. If no one accepts, seek suitable help and maintain a safe plan; do not record a hoped-for\
      \ helper as confirmed.\n3. Ask the incoming caregiver to explain the tasks, limits and escalation\
      \ route. Resolve uncertainty through the proper qualified channel. Output: a handoff ready within\
      \ existing authority, with specialized gaps still visible rather than certified by this worksheet.\n\
      4. Confirm the actual start before stepping away and the actual return before ending coverage. Preserve\
      \ necessary contact while removing optional routine checking where agreed. Output: real times and\
      \ responsibility acknowledgments, distinct from the scheduled slot.\n5. Review the protected interval,\
      \ interruptions, Dara's experience and Fin's burden. Save your account before the [later packet](?resource=file-later-packet-md).\
      \ Output: one practical revision and any longer-term support question. A useful break is not proof\
      \ of recovered health or permanently adequate care.\n\n### Support and transfer\n\nFor support,\
      \ rehearse only the acceptance and handoff conversation using the fiction, with no live care. For\
      \ a harder version, the accepted backup cancels: use the existing safe contingency or appropriate\
      \ service instead of treating cancellation as permission to leave. Actual immediate danger or inability\
      \ to maintain essential care needs prompt appropriate help, not the completion of a reflection exercise.\n\
      \nFor real transfer, use an ordinary interval within a properly authorized care plan and protect\
      \ private recipient information. Ask the caregiver and backup what actually happened, if they willingly\
      \ share. Repeated coverage, sustainable resources and the recipient's appropriate perspective are\
      \ needed for broader conclusions. A service inquiry is useful progress while still being only an\
      \ inquiry.\n\n### Source limits\n\n[CDC caregiver guidance, S18](https://www.cdc.gov/caregiving/caring-for-yourself/index.html),\
      \ supports asking for specific help and exploring respite through family or services. It does not\
      \ guarantee a provider, funding, competence or a measured health effect from this two-hour case.\
      \ The handoff and interval review are original teaching design. Care remains safer only to the extent\
      \ that actual competent coverage and sustainable limits are established, not because a form is complete.\n\
      \n### Use the result at its proper scale\n\nMedical, reproductive, child-safety, guardianship, and\
      \ elder-care decisions require qualified local guidance.\n\n No reproductive, parenting or care\
      \ role is compulsory. Fiction does not establish actual participant evidence. Keep identifying,\
      \ clinical and private family information outside app records.\n\nAttempt the [practice checks](?attempt=practice-checks)\
      \ before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt before [reading answers](?check=practice-answers).


      1. A relative says “I can probably help” but has not accepted the tasks and lacks needed competence.
      Is respite covered?

      2. Coverage actually runs from 14:15 to 16:00, with ten minutes of optional monitoring by the outgoing
      caregiver. What durations can be claimed?

      3. The break felt useful, but the backup has not agreed to repeat it. What remains unresolved about
      burnout and sustainability?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Confirm willing acceptance, competence, authorization, access, scope and the appropriate
      handoff. An offer or family relationship is insufficient. Seek suitable help and preserve essential
      care if coverage cannot be established; do not leave to force a response.

      2. Actual coverage is 105 minutes. In the supplied case, ten minutes of optional monitoring leaves
      95 minutes described as protected rest. The booked 120 minutes did not occur. Keep required reachability
      distinct from unnecessary routine work, and do not infer a clinical benefit from either duration.

      3. A useful interval is limited evidence of relief, not a diagnosis or cure. Recurring acceptance,
      backup burden, resources and the underlying workload remain open. Review a sustainable arrangement
      rather than silently assigning future care or claiming permanent recovery.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
