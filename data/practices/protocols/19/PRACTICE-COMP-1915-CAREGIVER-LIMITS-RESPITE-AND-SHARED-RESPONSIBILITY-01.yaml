        expected: true
  - stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01-A2
    sequence: 2
    title: Find an accepting competent backup and test the information
    instructions: 'Ask an appropriate family member, authorized service or coordinator to cover one defined
      period or task. Check willingness, competence, authority, access and cost before counting the gap
      as covered. Give only the necessary information through the permitted secure channel, and ask the
      backup to explain the task, boundaries and when to seek help. If nobody can safely accept it, contact
      an appropriate support service; do not claim the plan works or leave essential care uncovered.


      Observation checks: The backup explicitly accepts the task and interval; Competence authority access
      and cost are checked; A teach-back confirms limits and escalation; An unfilled gap remains visible
      and triggers further support. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01-A2
      competency_stable_id: '19.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1915_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1915_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_backup_explicitly_accepts_the_task_and_interval
        - competence_authority_access_and_cost_are_checked
        - a_teach_back_confirms_limits_and_escalation
        - an_unfilled_gap_remains_visible_and_triggers_further_support
      - measurement_id: c1915_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1915_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01-A3
    sequence: 3
    title: Take the agreed break and close the transfer
    instructions: 'After the safe handoff is confirmed, use the protected period for a freely chosen restorative
      activity rather than monitoring every detail unless the care plan requires it. At the end, confirm
      what occurred, any issue and who now holds responsibility. Ask whether the arrangement relieved
      burden for the caregiver without shifting an unmanageable burden to someone else. Retain, change
      or seek professional support for the next coverage period; one break does not establish that chronic
      exhaustion is resolved.


      Observation checks: A real protected period follows a confirmed safe transfer; The return handoff
      closes responsibility clearly; Burden on both caregiver and backup is reviewed; Long-term exhaustion
      is not declared resolved from one break. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Was the break genuinely protected, was care safely owned throughout, and what recurring
      support is still missing?


      Examples: Supportive: A competent backup accepted a bounded interval, the caregiver took a real
      break and both confirmed the return handoff.


      Mixed: The backup covered the task, but repeated unnecessary check-ins prevented rest; the communication
      arrangement was revised.


      Contradictory: Essential care was withdrawn to make a point or an untrained unwilling person was
      treated as a safe replacement.


      Inconclusive: Respite was scheduled on paper without an accepting backup or an actual safe transfer.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01-A3
      competency_stable_id: '19.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
