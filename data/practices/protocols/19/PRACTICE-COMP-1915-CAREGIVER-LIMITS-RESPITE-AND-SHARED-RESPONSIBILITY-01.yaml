meaning_and_fit:
  purpose: Make caregiver limits explicit and distribute one care responsibility safely enough that rest
    does not depend on abandoning the person receiving care.
  why_recommended: Make caregiver limits explicit and distribute one care responsibility safely enough
    that rest does not depend on abandoning the person receiving care.
  claims:
  - statement: Make caregiver limits explicit and distribute one care responsibility safely enough that
      rest does not depend on abandoning the person receiving care.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Caregiver limits, respite, and shared responsibility
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Caregiver limits, respite, and shared responsibility as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Start with a smaller task, remote administrative support or a qualified service
    when hands-on coverage is not available. A fictional rehearsal is preparation only. Imminent unsafe
    care, medical deterioration, abuse or a caregiver unable to maintain safety requires immediate appropriate
    help rather than waiting for routine respite.
  opportunity_considerations: Use an actual authorized care role or the fictional case of a caregiver
    who handles every appointment reminder and cannot take an uninterrupted afternoon. Prepare a private
    coverage card with the essential task, authorized competent backup, permitted scope, urgent route,
    start and end, and confirmation signal. Exclude clinical details from application evidence.
  prerequisites:
  - Use an actual authorized care role or the fictional case of a caregiver who handles every appointment
    reminder and cannot take an uninterrupted afternoon. Prepare a private coverage card with the essential
    task, authorized competent backup, permitted scope, urgent route, start and end, and confirmation
    signal. Exclude clinical details from application evidence.
  dependencies: []
  safe_alternatives:
  - Start with a smaller task, remote administrative support or a qualified service when hands-on coverage
    is not available. A fictional rehearsal is preparation only. Imminent unsafe care, medical deterioration,
    abuse or a caregiver unable to maintain safety requires immediate appropriate help rather than waiting
    for routine respite.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Caregiver limits, respite, and shared responsibility differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Caregiver limits, respite,
    and shared responsibility as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an actual authorized care role or the fictional case of a caregiver who handles every appointment
    reminder and cannot take an uninterrupted afternoon. Prepare a private coverage card with the essential
    task, authorized competent backup, permitted scope, urgent route, start and end, and confirmation
    signal. Exclude clinical details from application evidence. Goal: Make caregiver limits explicit and
    distribute one care responsibility safely enough that rest does not depend on abandoning the person
    receiving care. Scope: This is a bounded support arrangement, not a burnout diagnosis, substitute
    for professional respite assessment or permission to stop essential care without a safe transfer.
    Time and effort: Twenty minutes to identify the gap, one coordination conversation and one short confirmed
    coverage period with review. Adaptation: Start with a smaller task, remote administrative support
    or a qualified service when hands-on coverage is not available. A fictional rehearsal is preparation
    only. Imminent unsafe care, medical deterioration, abuse or a caregiver unable to maintain safety
    requires immediate appropriate help rather than waiting for routine respite. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Start with a smaller task, remote administrative support or a qualified service
    when hands-on coverage is not available. A fictional rehearsal is preparation only. Imminent unsafe
    care, medical deterioration, abuse or a caregiver unable to maintain safety requires immediate appropriate
    help rather than waiting for routine respite.
  expected_burden: Twenty minutes to identify the gap, one coordination conversation and one short confirmed
    coverage period with review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Caregiver limits, respite, and shared responsibility protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Caregiver limits, respite, and shared responsibility action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Start with
    a smaller task, remote administrative support or a qualified service when hands-on coverage is not
    available. A fictional rehearsal is preparation only. Imminent unsafe care, medical deterioration,
    abuse or a caregiver unable to maintain safety requires immediate appropriate help rather than waiting
    for routine respite.
  actions:
  - stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01-A1
    sequence: 1
    title: Name the limit before resentment becomes the only signal
    instructions: 'Describe one recurring sign that the present arrangement is unsustainable, such as
      missed sleep opportunity, repeated errors or having no protected time, without diagnosing yourself.
      Separate exhaustion, resentment and a sense of being trapped from the recipient’s worth or need
      for care. List essential tasks, optional extras and work that can be shared. State one bounded limit:
      I need a two-hour coverage period, not I will disappear until people notice.


      Observation checks: A concrete sustainability problem is identified; Caregiver feelings are separated
      from blame or recipient worth; Essential optional and shareable tasks are distinguished; The proposed
      limit has a safe specific scope. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01
      action_stable_id: PRACTICE-COMP-1915-CAREGIVER-LIMITS-RESPITE-AND-SHARED-RESPONSIBILITY-01-A1
      competency_stable_id: '19.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1915_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1915_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_concrete_sustainability_problem_is_identified
        - caregiver_feelings_are_separated_from_blame_or_recipient_worth
        - essential_optional_and_shareable_tasks_are_distinguished
        - the_proposed_limit_has_a_safe_specific_scope
      - measurement_id: c1915_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1915_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
