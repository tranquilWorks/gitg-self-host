  pause_conditions:
  - Pause Child protection and safeguarding when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Child protection and safeguarding practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Child protection and safeguarding situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
