  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Lee''s first outline included “I will find out whether this happened before contacting anyone.”
      Lee removes that sentence and preserves only the supplied words, role and care relationship, with
      missing details marked unknown. The revised response makes no secrecy promise and explains that
      appropriate people need to help protect Pat. No further questions are posed to a real or fictional
      child.


      The route retrieval identifies the Arizona hotline for this bounded caregiving case and the United
      States emergency route for immediate danger. Lee rechecks the official education page and relevant
      statute instead of treating an internal school conversation as the external report. A hypothetical
      instruction to wait until next week is rejected as a substitute for an applicable immediate duty.


      No call, portal submission, agency acknowledgment, investigation or protection outcome occurs in
      this exercise. The corrected outline shows fictional preparation only. In a real current concern,
      do not postpone reporting to finish the practice or repeat its retrieval test. Record an actual
      report only in the proper authorized system, with any follow-up directed by the receiving authority.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Prepare to recognize a concern and reach the correct protection route promptly. Allow twenty\
      \ minutes to verify routes, ten for a wholly fictional report outline and five for a retrieval check.\
      \ This exercise makes no real report and uses no real child's identity or allegation. If there is\
      \ an actual current concern, stop the exercise and use the appropriate safeguarding or emergency\
      \ route without waiting for proof or completion of a worksheet.\n\n### Recognize concern without\
      \ investigating\n\nAbuse and neglect can involve harmful acts or failures to provide needed care\
      \ and protection. Unsafe caregiving may require action even when you cannot label the cause. Grooming\
      \ can involve cultivating trust, secrecy, special access or dependence to facilitate abuse; a single\
      \ ambiguous behavior is not a diagnosis. Attend to what was observed or disclosed and the child's\
      \ immediate safety, rather than constructing a theory of an adult's motives.\n\nA child's account\
      \ does not have to be perfectly ordered before you respond. Remain calm, listen, acknowledge that\
      \ telling was important, and avoid blame. Do not promise secrecy. Explain that you may need to share\
      \ information with people whose job is to help protect them. Do not repeatedly ask for details,\
      \ use leading questions, test credibility or confront the alleged person. Authorities and qualified\
      \ safeguarding professionals handle investigation.\n\nWrite what was actually said or observed,\
      \ keeping direct words distinct from your interpretation and unknown facts. A report need not become\
      \ a complete evidence dossier. Do not delay a real concern while trying to fill missing fields.\
      \ Keep real records and identities in the appropriate protected channel, outside the app and outside\
      \ this fictional practice.\n\n### Reporting is a jurisdiction-specific action\n\nAn information\
      \ website, a support helpline, an internal discussion and a receiving agency are different things.\
      \ Determine where you are, your role, the relevant authority, the method and any immediate reporting\
      \ duty. Employer procedures may assist but cannot replace an external report required of you. Verify\
      \ current official instructions; this lesson does not certify legal compliance.\n\nThe worked example\
      \ is deliberately **Arizona, United States**, involving school personnel, a child outside an Indian\
      \ reservation and a concern about an adult with care, custody or control. [Arizona Department of\
      \ Education, S07](https://www.azed.gov/wellness/child-abuse-education-resources) identifies the\
      \ Arizona Child Abuse Hotline, **1-888-767-2445**, for reporting and **911** for immediate danger.\
      \ Its education page is not itself a reporting form. [Arizona statute 13-3620, S08](https://www.azleg.gov/ars/13/03620.htm)\
      \ identifies role and circumstance dependent obligations, including immediate reporting. It also\
      \ distinguishes destinations in circumstances such as an alleged person without care, custody or\
      \ control. Do not generalize the example's destination to every Arizona case, a tribal setting or\
      \ another jurisdiction.\n\n[The National 911 Program, S10](https://www.911.gov/calling-911/) describes\
      \ the United States emergency route. Its website cannot provide emergency assistance. No route is\
      \ called for this rehearsal. Outside the example, find the appropriate official receiving and emergency\
      \ channels and seek qualified clarification without delaying necessary protection.\n\n### Worked\
      \ example and supplied case\n\nFictional school staff member Lee hears fictional child Pat say,\
      \ “The adult looking after me asks me to keep frightening contact secret.” No event details, date,\
      \ injury, location within Arizona or offender identity are supplied. The fictional setting has the\
      \ Arizona conditions above. The case is for practicing a calm response and locating the reporting\
      \ route, not deciding whether abuse is proven.\n\nA useful outline separates Pat's supplied words,\
      \ Lee's role and the stated caregiving relationship from all unknowns. “Pat is lying because the\
      \ story is incomplete” and “I will interview the adult first” both add unsafe reasoning. Lee can\
      \ explain the next protective step without promising a particular investigation result or family\
      \ outcome.\n\n### Prepare the route and response\n\n1. Record the fictional jurisdiction, role and\
      \ care relationship. Read the official route and relevant reporting provisions. Output: a dated\
      \ route card naming the receiving channel and emergency channel, plus circumstances requiring further\
      \ route checking. Never rely on a memorized number without checking its current applicability.\n\
      2. Rehearse one brief calm response: listen, affirm that the child is not to blame, explain necessary\
      \ sharing, and avoid a secrecy promise. Output: words that neither interrogate nor guarantee an\
      \ outcome. Do not practice on a child.\n3. Draft a minimal fictional report outline using only the\
      \ supplied facts. Mark missing details unknown; do not generate a name or address. Output: direct\
      \ words, observations, unknowns and intended reporting channel. This is explicitly unsubmitted fiction,\
      \ not a report receipt.\n4. Explain what you would do if an internal lead asked you to wait until\
      \ next week. Check your own immediate obligations and promptly use the required route rather than\
      \ treating internal approval as a substitute. Output: a protection-focused decision without an amateur\
      \ interview or family-image calculation.\n5. Close the sources and retrieve the channel, then reopen\
      \ the official source to check it. Open the [later packet](?resource=file-later-packet-md) only\
      \ after saving your outline. Output: corrected route and response, with any actual submission still\
      \ absent.\n\n### Support, transfer and limits\n\nFor support, use the exact bounded case and a blank\
      \ four-line outline. For a harder version, change the alleged person's care relationship or jurisdiction:\
      \ the correct response is to verify the changed route, not reuse the first one by habit. Real transfer\
      \ means knowing your role's current official procedure before a concern arises; a real concern invokes\
      \ that procedure immediately. Follow receiving-agency instructions about acknowledgment and next\
      \ steps; an acknowledgment is not proof that danger has ended.\n\n[S09, NSPCC](https://www.nspcc.org.uk/keeping-children-safe/reporting-abuse/what-to-do-child-reveals-abuse/),\
      \ supports calm, non-blaming disclosure responses and avoiding confrontation. Its United Kingdom\
      \ contact routes are not imported into the Arizona case. The source register records inspected provisions\
      \ and retrieval limits. This lesson cannot substitute for local safeguarding training, qualified\
      \ review or the authority's investigation.\n\n### Use the result at its proper scale\n\nMedical,\
      \ reproductive, child-safety, guardianship, and elder-care decisions require qualified local guidance.\n\
      \n No reproductive, parenting or care role is compulsory. Fiction does not establish actual participant\
      \ evidence. Keep identifying, clinical and private family information outside app records.\n\nAttempt\
      \ the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A staff member is told to collect a more consistent account and wait for the safeguarding lead
      next week. What should govern action?

      2. An official educational page explains abuse and links to support. Has visiting it made a report,
      and can its contact route be used in every jurisdiction?

      3. A fictional report outline is complete and a practice response sounds calm. What can be claimed
      about reporting or the child''s safety?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The current concern, immediate safety and applicable local reporting duty govern. Do not
      delay a required report for internal approval or conduct credibility interviews. Use the proper
      receiving or emergency route promptly; seek qualified clarification without making uncertainty an
      excuse for delay.

      2. No. Reading information is not submitting to the receiving authority. Check jurisdiction, role,
      circumstances, channel and required timing. Support and emergency services have distinct functions;
      do not transfer a number or reporting rule indiscriminately.

      3. Only fictional preparation can be claimed. No report, receipt, investigation or safety outcome
      occurred. Even an actual acknowledgment would not establish that all risk had ended. Keep real cases
      out of exercise artifacts and follow the proper protected process.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
