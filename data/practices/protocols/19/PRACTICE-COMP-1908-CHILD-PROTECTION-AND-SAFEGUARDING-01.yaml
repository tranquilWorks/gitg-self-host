meaning_and_fit:
  purpose: Recognize when a child-safety concern needs prompt protective action and use the correct local
    reporting route while avoiding leading questions, confrontation or concealment.
  why_recommended: Recognize when a child-safety concern needs prompt protective action and use the correct
    local reporting route while avoiding leading questions, confrontation or concealment.
  claims:
  - statement: Recognize when a child-safety concern needs prompt protective action and use the correct
      local reporting route while avoiding leading questions, confrontation or concealment.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Child protection and safeguarding practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Child protection and safeguarding as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use translated official guidance, an interpreter or your organization’s safeguarding
    lead without allowing an internal discussion to replace an externally required report. Keep any real
    record only in the authorized secure system. Requirements differ by location; professional or legal
    advice resolves uncertainty, not an invented universal rule.
  opportunity_considerations: 'Use a wholly fictional case: a child says an adult has asked them to keep
    frightening contact secret. Do not use a real child, make a false report or store identifying allegations
    in this application. Prepare headings for immediate safety, local reporting authority, role-specific
    obligations, minimal factual record and safe follow-up.'
  prerequisites:
  - 'Use a wholly fictional case: a child says an adult has asked them to keep frightening contact secret.
    Do not use a real child, make a false report or store identifying allegations in this application.
    Prepare headings for immediate safety, local reporting authority, role-specific obligations, minimal
    factual record and safe follow-up.'
  dependencies: []
  safe_alternatives:
  - Use translated official guidance, an interpreter or your organization’s safeguarding lead without
    allowing an internal discussion to replace an externally required report. Keep any real record only
    in the authorized secure system. Requirements differ by location; professional or legal advice resolves
    uncertainty, not an invented universal rule.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Child protection and safeguarding differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Child protection and safeguarding
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a wholly fictional case: a child says an adult has asked them to keep frightening contact
    secret. Do not use a real child, make a false report or store identifying allegations in this application.
    Prepare headings for immediate safety, local reporting authority, role-specific obligations, minimal
    factual record and safe follow-up. Goal: Recognize when a child-safety concern needs prompt protective
    action and use the correct local reporting route while avoiding leading questions, confrontation or
    concealment. Scope: This is reporting-route preparation, not an investigation, diagnosis of abuse,
    legal certification or substitute for immediate protection. A current concern requires the appropriate
    real response rather than a rehearsal. Time and effort: Twenty minutes to verify routes, a 10-minute
    fictional report rehearsal and a five-minute retrieval check. Adaptation: Use translated official
    guidance, an interpreter or your organization’s safeguarding lead without allowing an internal discussion
    to replace an externally required report. Keep any real record only in the authorized secure system.
    Requirements differ by location; professional or legal advice resolves uncertainty, not an invented
    universal rule. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use translated official guidance, an interpreter or your organization’s safeguarding
    lead without allowing an internal discussion to replace an externally required report. Keep any real
    record only in the authorized secure system. Requirements differ by location; professional or legal
    advice resolves uncertainty, not an invented universal rule.
  expected_burden: Twenty minutes to verify routes, a 10-minute fictional report rehearsal and a five-minute
    retrieval check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Child protection and safeguarding protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Child protection and safeguarding action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use translated
    official guidance, an interpreter or your organization’s safeguarding lead without allowing an internal
    discussion to replace an externally required report. Keep any real record only in the authorized secure
    system. Requirements differ by location; professional or legal advice resolves uncertainty, not an
    invented universal rule.
  actions:
  - stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01-A1
    sequence: 1
    title: Verify who actually receives a report in your location
    instructions: 'Find the current child-protection or equivalent official reporting route and the emergency
      route for immediate danger. Check whether your actual role has mandatory-reporting duties, a deadline
      or a required reporting method; use authoritative local guidance or a qualified professional for
      uncertainty. Distinguish an informational website or support hotline from the agency that accepts
      reports. Record jurisdiction, date checked and channel privately, with a backup if the first route
      is unavailable.


      Observation checks: Jurisdiction and current receiving authority are verified; Immediate danger
      has a separate urgent route; Role-specific reporting obligations are checked rather than assumed;
      Information services are not mistaken for report-receiving agencies. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01
      action_stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01-A1
      competency_stable_id: '19.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1908_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1908_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - jurisdiction_and_current_receiving_authority_are_verified
        - immediate_danger_has_a_separate_urgent_route
        - role_specific_reporting_obligations_are_checked_rather_than_assumed
        - information_services_are_not_mistaken_for_report_receiving_agencies
      - measurement_id: c1908_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1908_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
