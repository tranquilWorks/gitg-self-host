        expected: true
  - stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01-A2
    sequence: 2
    title: Practice a factual protective response to the fictional disclosure
    instructions: 'Rehearse a calm response: Thank you for telling me; this is not your fault; I may need
      to involve people who can help keep you safe. Do not promise secrecy, ask the child to repeat details
      for practice, test credibility or question them about motives. In the fictional report, distinguish
      what was directly said, what you observed and what you do not know. Do not contact the alleged perpetrator,
      gather proof or protect family reputation before reporting.


      Observation checks: The response avoids secrecy promises and blame; Direct statements observations
      and unknowns are separated; No leading interview credibility test or amateur investigation occurs;
      Protection takes priority over reputation and confrontation. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01
      action_stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01-A2
      competency_stable_id: '19.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1908_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1908_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_response_avoids_secrecy_promises_and_blame
        - direct_statements_observations_and_unknowns_are_separated
        - no_leading_interview_credibility_test_or_amateur_investigation_occurs
        - protection_takes_priority_over_reputation_and_confrontation
      - measurement_id: c1908_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1908_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01-A3
    sequence: 3
    title: Test retrieval and identify the next accountable step
    instructions: 'Retrieve the reporting channel without relying on memory and rehearse a concise handoff
      using fictional facts only. Identify how receipt or follow-up is handled under the local process
      and who can advise on safe ongoing support. Do not call an emergency line or submit a false concern
      for the exercise. If a genuine concern is present, stop rehearsing and make the appropriate prompt
      report or emergency contact; do not wait to complete this worksheet or obtain certainty.


      Observation checks: The correct channel can be retrieved promptly; The handoff contains only relevant
      factual information; No practice call or false report is made; A current concern triggers the real
      appropriate protective response. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Could you move from concern to the correct protective route promptly while saying
      only what you know and leaving investigation to the authorized people?


      Examples: Supportive: The participant distinguished the information website from the receiving agency
      and rehearsed a factual report without questioning a child.


      Mixed: The first route was outdated; the participant verified the current authority and added a
      backup before calling the plan ready.


      Contradictory: The participant confronted an alleged perpetrator, conducted an amateur interview
      or delayed a real concern to preserve family reputation.


      Inconclusive: Warning signs were memorized but no local receiving route or usable handoff was identified.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1908-CHILD-PROTECTION-AND-SAFEGUARDING-01
