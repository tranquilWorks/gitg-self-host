meaning_and_fit:
  purpose: Transmit a meaningful story, language, celebration, mourning practice, value or practical skill
    while allowing participants to question or change harmful elements.
  why_recommended: Transmit a meaningful story, language, celebration, mourning practice, value or practical
    skill while allowing participants to question or change harmful elements.
  claims:
  - statement: Transmit a meaningful story, language, celebration, mourning practice, value or practical
      skill while allowing participants to question or change harmful elements.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Family ritual, heritage, and intergenerational continuity
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Family ritual, heritage, and intergenerational continuity as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use oral, tactile, visual or signed forms and no-cost materials. Chosen family
    or a solo reflection on inherited practices can be used, but solo work does not establish communal
    transmission. Mourning rituals remain optional and should not force grief disclosure or replace needed
    support.
  opportunity_considerations: 'Use the supplied low-cost tradition of sharing the story and method of
    a familiar household object or recipe without preparing food. Bring a picture, safe object or spoken
    description. Offer alternatives: listen, tell a different memory, translate a word, demonstrate a
    safe step or opt out.'
  prerequisites:
  - 'Use the supplied low-cost tradition of sharing the story and method of a familiar household object
    or recipe without preparing food. Bring a picture, safe object or spoken description. Offer alternatives:
    listen, tell a different memory, translate a word, demonstrate a safe step or opt out.'
  dependencies: []
  safe_alternatives:
  - Use oral, tactile, visual or signed forms and no-cost materials. Chosen family or a solo reflection
    on inherited practices can be used, but solo work does not establish communal transmission. Mourning
    rituals remain optional and should not force grief disclosure or replace needed support.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Family ritual, heritage, and intergenerational continuity differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Family ritual, heritage, and
    intergenerational continuity as inferiority; competing reasonable interpretations and conscientious
    refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied low-cost tradition of sharing the story and method of a familiar household
    object or recipe without preparing food. Bring a picture, safe object or spoken description. Offer
    alternatives: listen, tell a different memory, translate a word, demonstrate a safe step or opt out.
    Goal: Transmit a meaningful story, language, celebration, mourning practice, value or practical skill
    while allowing participants to question or change harmful elements. Scope: One chosen tradition can
    support continuity without becoming a test of loyalty, cultural authenticity, religious agreement
    or compulsory disclosure. Time and effort: Twenty minutes to prepare, one 20–40 minute accessible
    activity and a short participant-led review. Adaptation: Use oral, tactile, visual or signed forms
    and no-cost materials. Chosen family or a solo reflection on inherited practices can be used, but
    solo work does not establish communal transmission. Mourning rituals remain optional and should not
    force grief disclosure or replace needed support. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use oral, tactile, visual or signed forms and no-cost materials. Chosen family
    or a solo reflection on inherited practices can be used, but solo work does not establish communal
    transmission. Mourning rituals remain optional and should not force grief disclosure or replace needed
    support.
  expected_burden: Twenty minutes to prepare, one 20–40 minute accessible activity and a short participant-led
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Family ritual, heritage, and intergenerational continuity protocol to rank worth, coerce
    participation, demand disclosure, override rest or care, certify competence, or justify decisions
    beyond the recorded context.
  - Treating a completed Family ritual, heritage, and intergenerational continuity action, a polished
    artifact, agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use oral, tactile,
    visual or signed forms and no-cost materials. Chosen family or a solo reflection on inherited practices
    can be used, but solo work does not establish communal transmission. Mourning rituals remain optional
    and should not force grief disclosure or replace needed support.
  actions:
  - stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01-A1
    sequence: 1
    title: Separate the inherited good from the inherited pressure
    instructions: 'Identify what this tradition carries: a story, language phrase, celebration or mourning
      meaning, value and practical knowledge. Mark which elements are genuinely present rather than forcing
      all forms into one event. Name a good worth preserving and an element that could exclude or harm,
      such as compulsory attendance, a derogatory story or pressure to profess a belief. Ask the relevant
      person’s permission before sharing their story, especially where loss or private history is involved.


      Observation checks: The actual forms of heritage are identified without invented coverage; A valuable
      continuity and a possible harm are distinguished; Permission is checked for another person’s story;
      Attendance belief and disclosure are not loyalty tests. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01
      action_stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01-A1
      competency_stable_id: '19.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1914_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1914_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_actual_forms_of_heritage_are_identified_without_invented_coverage
        - a_valuable_continuity_and_a_possible_harm_are_distinguished
        - permission_is_checked_for_another_person_s_story
        - attendance_belief_and_disclosure_are_not_loyalty_tests
      - measurement_id: c1914_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1914_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
