        - participants_can_choose_an_accessible_alternative_or_decline
        - a_harmful_element_can_be_interrupted_or_revised
      - measurement_id: c1914_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1914_a2_adverse
        kind: boolean
        role: adverse
