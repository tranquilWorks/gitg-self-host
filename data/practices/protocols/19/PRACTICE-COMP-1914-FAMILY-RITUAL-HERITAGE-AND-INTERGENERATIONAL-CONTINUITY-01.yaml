  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The willing participants hear the short spoon story without the humiliating joke. One explains the
      older-language word and offers a plain translation. Another demonstrates a safe measuring gesture
      with empty utensils. A third listens quietly, and one invited person declines the activity. No one
      asks the absent person to justify the choice.


      During review, a participant says the phrase “everyone in our family knows this” made unfamiliar
      listeners feel behind. Ren changes it to “this is one story some of us were taught” and gives the
      brief telling again. The participant says the revised introduction leaves room for newcomers. Another
      person offers a different memory without being corrected into a single official family version.


      The photograph remains unused because sharing permission is unknown. No audio or video is recorded.
      Record the actual retelling, translation, gesture and wording revision, plus the opt-out and unresolved
      image permission. These supplied fictional responses support only this small case. They do not establish
      restored family relationships, cultural authenticity, resolved grief or actual participant acceptance
      of the guide.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Share one small piece of heritage, invite a revision and try the revised form. Allow twenty\
      \ minutes to prepare, twenty to forty for a willing activity and a short participant review. Use\
      \ a safe household object, a description or the supplied fiction. No cooking, religious participation,\
      \ bereavement disclosure or recording is required. A person can opt out without explaining their\
      \ identity or loyalty.\n\n### Heritage lives through people who can respond\n\nStories, language,\
      \ celebration, mourning, values and practical knowledge can connect generations. A story may explain\
      \ why an object matters; a word may carry a meaning that translation only partly conveys; a repeated\
      \ celebration can create a familiar occasion to gather. Mourning practices can honor loss without\
      \ requiring everyone to grieve in the same way. Practical knowledge can be transmitted by showing\
      \ a safe small action as well as telling a story.\n\nContinuity does not require exact repetition.\
      \ People reinterpret inherited practices in new circumstances. A younger member may keep the care\
      \ expressed by a tradition while changing its language, timing or who can participate. A chosen\
      \ family can create meaningful practices too. No one must invent ancestral certainty or prove membership\
      \ through an origin story.\n\nSome inherited elements cause harm: humiliating jokes, exclusion,\
      \ compulsory belief, enforced roles or silence about difficult history. Revising them need not erase\
      \ every meaningful part of the practice. Identify what is worth carrying forward and which element\
      \ should stop or change. Nostalgia is not a sufficient answer to someone who describes exclusion.\
      \ Equally, do not demand a public account of harm as the price of a modest revision.\n\nPermission\
      \ to tell a story is not automatically permission to record, publish or identify everyone in it.\
      \ A person can share their own memory while another person's privacy still matters. Being related\
      \ to someone, including a deceased relative, does not settle every permission or dignity question\
      \ about their story. Use a nonidentifying version or leave material out when authority to share\
      \ is unclear. Recording needs a separate, specific agreement; this activity defaults to no recording.\n\
      \nBelonging is not proved by attendance or fluent performance. Quiet listening, an alternative language,\
      \ another memory or no participation can be legitimate responses. Ask what the activity meant to\
      \ the people who chose it, and allow disagreement. A record of a pleasant event is not a score of\
      \ cultural authenticity or proof that a whole family has reconciled.\n\n### Worked example\n\nA\
      \ family passes around an old measuring spoon and tells how a relative taught careful preparation.\
      \ The old version includes a joke that humiliates people who cannot cook. Participants keep the\
      \ story of patience, remove the joke and invite someone to explain a safe measuring gesture without\
      \ preparing food. A person who dislikes public storytelling can listen or offer a different memory.\
      \ The practical value survives while the unnecessary exclusion changes.\n\n### Supplied fictional\
      \ case\n\nRen brings a description of a well-used household spoon to a willing gathering. The inherited\
      \ story concerns taking care with ordinary work. The older relative uses the Spanish word ‘paciencia’—‘patience’\
      \ in this case’s plain English translation. Ren connects it to taking time with the task; the word\
      \ alone does not establish a whole cultural tradition. Not everyone speaks Spanish. The old telling\
      \ included the hurtful cooking joke. No participant has agreed to recording, and a proposed photograph\
      \ contains another person's private context whose sharing permission is unknown.\n\nOptions are\
      \ listening, explaining the word with a translation, offering a different memory, showing a harmless\
      \ measuring gesture with empty utensils, or opting out. There is no food preparation or requirement\
      \ to affirm a belief. Ren proposes preserving patient attention and removing the joke. Participants\
      \ can suggest another revision before a second short telling.\n\n### Transmit, revise and try again\n\
      \n1. Name the small practice, its possible meaning and the people whose material it uses. Separate\
      \ known history from family speculation. Output: a short account with uncertain details marked and\
      \ private material omitted.\n2. Ask willing participants what would make the activity accessible\
      \ and what they would prefer not to do. Offer alternate language, quiet participation and opt-out.\
      \ Output: an activity choice and explicit no-recording default, not blanket consent inferred from\
      \ attendance.\n3. Identify one meaningful element to preserve and one harmful or excluding element\
      \ to revise. In the case, distinguish patient attention from the humiliating joke. Output: a concrete\
      \ change with a reason that does not demand personal disclosure.\n4. Hold the small activity or\
      \ rehearse the supplied version. Credit the contributor and avoid the photograph while permission\
      \ is unknown. Output: what was actually shared, demonstrated or declined, separate from what was\
      \ merely planned.\n5. Ask for willing feedback, revise one part and try the changed version. Save\
      \ your account before the [later packet](?resource=file-later-packet-md). Output: evidence of transmission\
      \ and revision within this small event, with no generalized belonging claim.\n\n### Support and\
      \ transfer\n\nFor support, use an object description and one sentence about why it matters. An established\
      \ communication aid or a chosen translator can support participation; do not make fluent speech\
      \ a membership test. For a harder fictional version, an adult says changing a joke betrays the past.\
      \ Explain what is being preserved and why participants' dignity and present needs justify revision.\
      \ Unsafe confrontation is not required to complete the exercise.\n\nReal transfer can be a welcome,\
      \ a seasonal gathering or a practical demonstration within a willing family or chosen family. A\
      \ solo attempt can preserve a memory and prepare a revision, but cannot claim intergenerational\
      \ transmission or participant feedback that did not occur. Grief-related activities remain optional\
      \ and may need more support than this exercise supplies.\n\n### Source limits\n\n[UNESCO's convention,\
      \ S16](https://www.unesco.org/en/legal-affairs/convention-safeguarding-intangible-cultural-heritage),\
      \ describes living heritage as transmitted and recreated, with respect for human rights. It is not\
      \ a mandate for household participation. [Library of Congress guidance, S17](https://wwws.loc.gov/folklife/edresources/ed-trainingdocuments.html),\
      \ supports respectful listening and permission in cultural documentation. Only its guidance page\
      \ was inspected; no linked release form or archival-rights template is adopted. The spoon case and\
      \ revision process are original, not a validated belonging intervention.\n\n### Use the result at\
      \ its proper scale\n\nMedical, reproductive, child-safety, guardianship, and elder-care decisions\
      \ require qualified local guidance.\n\n No reproductive, parenting or care role is compulsory. Fiction\
      \ does not establish actual participant evidence. Keep identifying, clinical and private family\
      \ information outside app records.\n\nAttempt the [practice checks](?attempt=practice-checks) before\
      \ opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. An inherited joke humiliates some participants, but an adult says removing it destroys the tradition.
      What can be preserved and changed?

      2. A relative agrees to tell a story at a gathering. Does that authorize recording, posting the
      story or sharing an unapproved photograph?

      3. A solo learner writes a revised ritual and imagines warm feedback. What evidence of transmission
      and belonging has actually occurred?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Identify the meaningful practice or value and remove or revise the harmful element. Continuity
      can include recreation; no one must accept humiliation to prove loyalty. Allow alternatives and
      opt-out without requiring a disclosure of harm.

      2. No. Permission is specific to the activity and people involved. Recording and publication need
      separate appropriate agreement, and other people''s privacy remains relevant. Omit uncertain material
      rather than treating family membership as blanket authority.

      3. A private draft or rehearsal exists, not actual participant feedback or intergenerational transmission.
      Label imagined responses as fiction. A later willing activity and participants'' own perspectives
      would provide different, still limited evidence.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
