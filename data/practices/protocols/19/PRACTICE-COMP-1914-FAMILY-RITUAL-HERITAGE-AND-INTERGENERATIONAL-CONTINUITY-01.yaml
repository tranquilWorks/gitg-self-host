        expected: true
  - stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01-A3
    sequence: 3
    title: Let the next generation or participant shape the continuation
    instructions: 'Ask what should be kept, changed, recorded privately or left unrecorded. Agree one
      small revision and test it in the next short retelling or demonstration, such as adding another
      language or omitting an exclusionary line. Credit the contributor and respect permission for storage
      or sharing. Record only the process and agreed change in evidence; a warm event does not prove that
      every participant felt belonging or that a family conflict was repaired.


      Observation checks: Participants influence what continues; One revision is tried rather than merely
      welcomed in principle; Credit and recording permission are respected; Belonging and repair are not
      inferred for everyone. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What meaning survived because you allowed change, and whose voice now has a place
      in the tradition’s next version?


      Examples: Supportive: A family story retained its practical lesson while a younger participant added
      another language and removed an exclusionary joke.


      Mixed: The activity was welcoming, but recording permission was unclear; the organizer kept it unrecorded
      and clarified future consent.


      Contradictory: Nostalgia was used to require belief, excuse derogatory content or pressure someone
      to disclose a painful history.


      Inconclusive: A tradition was named without any transmission, participant choice or concrete revision.'
    expected_time: 15-25 minutes
    due_within_days: 10
