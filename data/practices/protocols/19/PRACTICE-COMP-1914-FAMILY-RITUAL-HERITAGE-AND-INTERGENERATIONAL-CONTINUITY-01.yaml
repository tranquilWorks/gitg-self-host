        expected: true
  - stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01-A2
    sequence: 2
    title: Host a small version with a legitimate alternative
    instructions: 'Introduce the activity and explain why it matters to you without claiming it must mean
      the same to everyone. Demonstrate the safe practical element, explain a chosen word or tell the
      consented story, then invite questions and other memories. Provide a real alternative such as listening
      quietly, using another language or contributing a different tradition. Stop or revise a derogatory
      or coercive element instead of defending it solely because it is old.


      Observation checks: The activity conveys a concrete story word or skill; Personal meaning is not
      imposed as a shared requirement; Participants can choose an accessible alternative or decline; A
      harmful element can be interrupted or revised. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01
      action_stable_id: PRACTICE-COMP-1914-FAMILY-RITUAL-HERITAGE-AND-INTERGENERATIONAL-CONTINUITY-01-A2
      competency_stable_id: '19.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1914_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1914_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
