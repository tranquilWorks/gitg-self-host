meaning_and_fit:
  purpose: Transmit a practical skill and its ethical or cultural meaning through demonstration, guided
    participation and the learner’s own explanation rather than mere compliance.
  why_recommended: Transmit a practical skill and its ethical or cultural meaning through demonstration,
    guided participation and the learner’s own explanation rather than mere compliance.
  claims:
  - statement: Transmit a practical skill and its ethical or cultural meaning through demonstration, guided
      participation and the learner’s own explanation rather than mere compliance.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Education, formation, and modeling in family life
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Education, formation, and modeling in family life as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use drawing, oral storytelling, signed or supported communication, and a different
    safe household skill. Without a willing learner, rehearse both teacher and learner responses on the
    case and label teaching transfer untested. Do not use indoctrination, humiliation, unsafe tools or
    unauthorized online access.
  opportunity_considerations: Default to returning a borrowed book with a clear note about its condition.
    Use your own or fictional book, paper and a willing learner. The practical sequence is inspect, identify
    the owner, prepare a truthful return message and choose a permitted return route. Do not use private
    accounts, online posting or valuable borrowed property for practice.
  prerequisites:
  - Default to returning a borrowed book with a clear note about its condition. Use your own or fictional
    book, paper and a willing learner. The practical sequence is inspect, identify the owner, prepare
    a truthful return message and choose a permitted return route. Do not use private accounts, online
    posting or valuable borrowed property for practice.
  dependencies: []
  safe_alternatives:
  - Use drawing, oral storytelling, signed or supported communication, and a different safe household
    skill. Without a willing learner, rehearse both teacher and learner responses on the case and label
    teaching transfer untested. Do not use indoctrination, humiliation, unsafe tools or unauthorized online
    access.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Education, formation, and modeling in family life differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Education, formation, and
    modeling in family life as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to returning a borrowed book with a clear note about its condition. Use your own or
    fictional book, paper and a willing learner. The practical sequence is inspect, identify the owner,
    prepare a truthful return message and choose a permitted return route. Do not use private accounts,
    online posting or valuable borrowed property for practice. Goal: Transmit a practical skill and its
    ethical or cultural meaning through demonstration, guided participation and the learner’s own explanation
    rather than mere compliance. Scope: Use a willing family member and an age-appropriate safe task within
    your role. Teaching a family value does not require agreement with every belief or surrender of the
    learner’s voice. Time and effort: Fifteen minutes to prepare, one 15-minute learning interaction and
    a short independent retry or labeled rehearsal. Adaptation: Use drawing, oral storytelling, signed
    or supported communication, and a different safe household skill. Without a willing learner, rehearse
    both teacher and learner responses on the case and label teaching transfer untested. Do not use indoctrination,
    humiliation, unsafe tools or unauthorized online access. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use drawing, oral storytelling, signed or supported communication, and a different
    safe household skill. Without a willing learner, rehearse both teacher and learner responses on the
    case and label teaching transfer untested. Do not use indoctrination, humiliation, unsafe tools or
    unauthorized online access.
  expected_burden: Fifteen minutes to prepare, one 15-minute learning interaction and a short independent
    retry or labeled rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Education, formation, and modeling in family life protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Education, formation, and modeling in family life action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use drawing,
    oral storytelling, signed or supported communication, and a different safe household skill. Without
    a willing learner, rehearse both teacher and learner responses on the case and label teaching transfer
    untested. Do not use indoctrination, humiliation, unsafe tools or unauthorized online access.
  actions:
  - stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01-A1
    sequence: 1
    title: Select what your example will actually teach
    instructions: 'Name the practical capability and two meanings: care for another person’s property
      and honest communication about damage. Identify a family or cultural custom that may shape the return,
      such as a greeting or thanks, while distinguishing it from a universal rule. Prepare to model a
      mistake calmly: noticing a bent page is a reason to disclose and repair, not hide or blame. Ask
      what the learner already knows and what they would do differently.


      Observation checks: The practical capability and ethical meaning are distinct; A cultural or worldview
      element is identified without universalizing it; The adult prepares an honest regulated response
      to a mistake; The learner’s prior knowledge and voice are invited. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01
      action_stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01-A1
      competency_stable_id: '19.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1910_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1910_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_practical_capability_and_ethical_meaning_are_distinct
        - a_cultural_or_worldview_element_is_identified_without_universalizing_it
        - the_adult_prepares_an_honest_regulated_response_to_a_mistake
        - the_learner_s_prior_knowledge_and_voice_are_invited
      - measurement_id: c1910_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1910_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
