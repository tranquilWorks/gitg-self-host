      - [Healthy Habits: Caring for Yourself When Caring for Another](https://www.cdc.gov/caregiving/caring-for-yourself/index.html)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      Leo explains that the owner should receive accurate information about the bent page. Leo chooses
      a short thank-you in their own words and rejects the forwarded outside-drop instruction because
      its authority for this book is unknown. Mira does not require the family''s longer customary phrase.


      On the second fictional book, the return location is missing. Leo checks the supplied note, notices
      the omission and asks the owner for clarification in rehearsal. Leo does not leave the book outside
      or invent a destination. The accessible picture sequence remains available. No actual owner is contacted,
      and no real book is returned during the fiction.


      Leo says Mira''s first explanation mixed the required damage report with an optional greeting. Mira
      separates those instructions and tries the clearer explanation; Leo correctly identifies which part
      protects the owner''s information and which can be phrased differently. This is supplied fictional
      feedback and a limited retry, not evidence of a real child''s ethical development. The packet does
      not establish general independence, durable emotional regulation or agreement with a family belief.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "Teach one safe practical action, show how its values work, and give the learner an independent\
      \ retry. Allow fifteen minutes to prepare, fifteen to teach, and a later short retry. Use an existing\
      \ appropriate family or care role with a willing learner, or use the supplied fiction. Do not recruit\
      \ a dependent person to prove your effectiveness. Independence means appropriate agency with accessible\
      \ support, not doing everything alone.\n\n### Second book: save a response before the later packet\n\
      \nThe second fictional book is undamaged. Its owner’s note reads: “Please return my book on Friday\
      \ and tell me about any damage.” No return location appears. The forwarded claim about leaving all\
      \ books outside is still unauthenticated. Using the same accessible supports, decide what Leo should\
      \ notice, what remains unknown, and what question to ask. Preserve this retry before opening the\
      \ later packet, which includes the narrated outcome.\n\n### Instruction carries more than a procedure\n\
      \nFamily teaching transmits practical skill through demonstration, explanation and opportunities\
      \ to try. It also models ethics: whether adults acknowledge mistakes, respect property and tell\
      \ the truth when concealment would be convenient. Saying that honesty matters while hiding damage\
      \ teaches a conflicting lesson. Make the connection visible without turning every ordinary error\
      \ into a moral judgment about the person.\n\nEmotional regulation can be modeled by pausing, naming\
      \ a manageable frustration and choosing a repair. An adult need not appear flawless. A calm correction\
      \ of their own mistake can show how to proceed when something goes wrong. The learner is not responsible\
      \ for soothing the adult or demonstrating gratitude for the lesson.\n\nCulture, faith and worldview\
      \ may inform greetings, thanks, care for objects and why a family values a practice. Name a custom\
      \ as a custom, explain its meaning and leave room for questions or a different interpretation. Teaching\
      \ a family tradition does not require compulsory belief, public profession or punishment for doubt.\
      \ A dependent person's voice includes questioning a reason, declining to disclose a belief and choosing\
      \ their own appropriate words.\n\nMedia judgment enters ordinary decisions when an instruction arrives\
      \ through a forwarded message, a video or a confident claim. Ask who has authority over this particular\
      \ decision and how the instruction can be checked. A widely shared message about a library rule\
      \ is not necessarily the owner's actual rule. Verification is a practical skill, not just skepticism\
      \ toward unfamiliar people.\n\nInstruction should reveal understanding beyond imitation. A learner\
      \ may copy the adult's exact phrase without knowing its purpose. A fresh but comparable retry can\
      \ show whether they can explain, choose a route and seek help when something is unknown. Necessary\
      \ communication or physical supports can remain; removing them to manufacture independence would\
      \ change the task unfairly.\n\n### Worked example\n\nAn adult notices a bent page before returning\
      \ a borrowed book. They say they feel embarrassed, stop themselves from hiding it and check how\
      \ the owner wants damage reported. The learner sees property care, honesty, emotional regulation\
      \ and verification within one ordinary action. The adult explains a household thank-you custom and\
      \ lets the learner use their own words. The result is a teachable process, not a requirement to\
      \ adopt the adult's personality or beliefs.\n\n### Supplied fictional case\n\nAuthorized caregiver\
      \ Mira helps Leo return a light borrowed book. The book and note are owned or fictional props; no\
      \ real damage is created. A supplied note from the fictional owner says to return it to the designated\
      \ shelf and report any noticed damage to the owner. A forwarded message claims all borrowed books\
      \ should be left outside, but its author and applicability are unknown.\n\nMira demonstrates inspecting\
      \ the book, recognizing the bent page, checking the owner's instruction and preparing an honest\
      \ message. A family custom adds thanks, but Leo may choose their wording. A second fictional book\
      \ later provides a retry with a different unknown. There is no need to post a video, create an account\
      \ or record the learner's beliefs.\n\n### Teach, retry and listen\n\n1. Ask what the willing learner\
      \ already knows and what help would make the task accessible. Identify the small practical goal\
      \ and the relevant owner instruction. Output: a starting point that permits correction of your assumption\
      \ about their knowledge.\n2. Demonstrate inspection, source checking and an honest report. Model\
      \ a brief regulated response to embarrassment. Explain which part is a property responsibility and\
      \ which part is a family custom. Output: an observable demonstration with a reason for each essential\
      \ action.\n3. Invite the learner to explain the purpose and choose their own appropriate message.\
      \ Ask what they would do about the unverified forwarded instruction. Output: their reasoning or\
      \ established communication response, not a compulsory recitation. Accept a question as useful information\
      \ about the lesson.\n4. Use the supplied second-book card above for a retry with the same accessible\
      \ supports. Observe whether the learner checks what is known, notices an unknown and seeks the appropriate\
      \ clarification. Output: actual actions and help used, separate from your impression that the lesson\
      \ went well.\n5. Ask what was confusing or overexplained, and change one instruction accordingly.\
      \ Save your account before the [later packet](?resource=file-later-packet-md). Output: a revision\
      \ shaped by the learner's voice and a limited claim about the demonstrated skill.\n\n### Support\
      \ and transfer\n\nFor support, use pictures for inspect, check and return, and work through one\
      \ step together. Accept pointing or an established communication aid. For a harder fictional case,\
      \ supply two plausible messages with different origins: the learner must explain which question\
      \ each can answer and seek clarification when authority is unclear. Do not reward confident guessing.\n\
      \nFor real transfer, choose another harmless return or care-for-property task in your existing role.\
      \ Keep actual owner communication and private learner details out of app records. A retry shows\
      \ something about this small skill under these conditions; broader ethical formation, emotional\
      \ regulation and independent judgment require repeated opportunities and appropriate outside perspectives.\
      \ No compliance score can substitute for those observations.\n\n### Source limits\n\n[The AAP policy,\
      \ S11](https://publications.aap.org/pediatrics/article/142/6/e20183112/37452/Effective-Discipline-to-Raise-Healthy-Children),\
      \ supports constructive teaching with appropriate expectations and without physical punishment or\
      \ shaming. It does not validate this borrowed-book lesson, establish a media-literacy curriculum\
      \ or determine a family's worldview. Those elements are original applications of the canonical scope.\
      \ The task makes learner capability and voice inspectable while leaving comprehensive formation\
      \ unclaimed.\n\n### Use the result at its proper scale\n\nMedical, reproductive, child-safety, guardianship,\
      \ and elder-care decisions require qualified local guidance.\n\n No reproductive, parenting or care\
      \ role is compulsory. Fiction does not establish actual participant evidence. Keep identifying,\
      \ clinical and private family information outside app records.\n\nAttempt the [practice checks](?attempt=practice-checks)\
      \ before opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt before [reading answers](?check=practice-answers).


      1. A learner copies the adult''s exact thank-you but cannot explain what to do about damage. What
      is still missing?

      2. A widely forwarded message conflicts with the owner''s instruction. What should the learner check
      before acting?

      3. A learner questions a family custom and needs a picture cue on the retry. Do those facts establish
      disrespect or failure of independence?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Copying a phrase does not show the practical and ethical reasoning. Model honest reporting,
      separate required responsibility from optional wording, and invite a fresh explanation or supported
      attempt. Do not treat polished repetition as complete learning.

      2. Check source, authority, context and applicability to the particular object. Seek the actual
      owner''s clarification if necessary. Popularity or confidence alone does not override the relevant
      instruction, and uncertainty is a reason to ask rather than guess.

      3. No. Questions can reveal understanding and improve instruction; accessible supports can remain
      part of capable action. Assess the actual reasoning and task under those conditions, without forcing
      belief or removing support to create an independence test.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
