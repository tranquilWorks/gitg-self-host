        - an_information_or_media_judgment_is_checked_against_an_actual_source
        - questions_about_the_value_or_custom_are_permitted
      - measurement_id: c1910_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1910_a2_adverse
        kind: boolean
        role: adverse
