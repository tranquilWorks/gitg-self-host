        expected: true
  - stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01-A3
    sequence: 3
    title: Step back for a safe retry and revise your teaching
    instructions: 'Ask the learner to repeat the safe sequence with another ordinary or fictional book,
      using the support they need. Notice whether they can explain the purpose, identify uncertainty and
      request help, not just copy your words. Ask what instruction was unclear or unnecessary and change
      one part. For an actual return, preserve the owner’s rules and your authority. Record only the learning
      process, not a child’s private response or family belief profile.


      Observation checks: A safe retry gives room for independent action; Purpose uncertainty and help-seeking
      are observed; Learner feedback changes one teaching choice; Private beliefs and child information
      stay outside evidence. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What did your behavior teach beyond the words, and could the learner question, explain
      and adapt the skill rather than merely obey?


      Examples: Supportive: The learner wrote an honest return note in their own words and explained why
      a forwarded instruction needed checking.


      Mixed: The practical steps were learned, but the teacher treated a family greeting as compulsory;
      the next attempt allowed a respectful alternative.


      Contradictory: The adult concealed their own error, punished a question about a belief or treated
      compliance as the only evidence of learning.


      Inconclusive: Family values were recited without a demonstration, learner decision or retry.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
