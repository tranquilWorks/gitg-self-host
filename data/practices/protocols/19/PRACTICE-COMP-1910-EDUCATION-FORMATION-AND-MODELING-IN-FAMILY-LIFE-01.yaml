        expected: true
  - stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01-A2
    sequence: 2
    title: Demonstrate and let the learner explain a decision
    instructions: 'Show the inspection and a short return message, thinking aloud about why truth matters
      more than looking flawless. Let the learner choose words and explain how they know the return route
      is legitimate. When a message or online claim is involved, compare the actual owner’s instruction
      with an unverified forwarded instruction rather than teaching automatic trust. Correct the task,
      not the learner’s identity, and welcome a question about the custom or value.


      Observation checks: The skill is demonstrated with reasons; The learner makes and explains a real
      choice; An information or media judgment is checked against an actual source; Questions about the
      value or custom are permitted. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01
      action_stable_id: PRACTICE-COMP-1910-EDUCATION-FORMATION-AND-MODELING-IN-FAMILY-LIFE-01-A2
      competency_stable_id: '19.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1910_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1910_a2_primary
        kind: artifact
