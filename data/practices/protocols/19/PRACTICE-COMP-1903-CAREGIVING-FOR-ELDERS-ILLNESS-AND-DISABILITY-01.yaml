  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Caregiving for elders, illness, and disability; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Use a phone call, written preferences, an interpreter or trusted decision supporter with permission.
      Without an appropriate care role, use the supplied transport scenario and label the handoff untested.
      Urgent deterioration or unsafe care requires appropriate medical, safeguarding or emergency help,
      not this exercise.
    cultural_context:
    - Adapt the expression of Caregiving for elders, illness, and disability to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a phone call, written preferences, an interpreter or trusted decision supporter with permission.
      Without an appropriate care role, use the supplied transport scenario and label the handoff untested.
      Urgent deterioration or unsafe care requires appropriate medical, safeguarding or emergency help,
      not this exercise.
  pause_conditions:
  - Pause Caregiving for elders, illness, and disability when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Caregiving for elders, illness, and disability practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Caregiving for elders, illness, and disability situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
    guidance.
