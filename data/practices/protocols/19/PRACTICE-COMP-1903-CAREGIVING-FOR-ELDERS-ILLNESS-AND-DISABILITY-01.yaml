meaning_and_fit:
  purpose: Coordinate a bounded practical, emotional, administrative or advocacy contribution that respects
    the care recipient’s choices and the caregiver’s capacity.
  why_recommended: Coordinate a bounded practical, emotional, administrative or advocacy contribution
    that respects the care recipient’s choices and the caregiver’s capacity.
  claims:
  - statement: Coordinate a bounded practical, emotional, administrative or advocacy contribution that
      respects the care recipient’s choices and the caregiver’s capacity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Caregiving for elders, illness, and disability practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Caregiving for elders, illness, and disability as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a phone call, written preferences, an interpreter or trusted decision
    supporter with permission. Without an appropriate care role, use the supplied transport scenario and
    label the handoff untested. Urgent deterioration or unsafe care requires appropriate medical, safeguarding
    or emergency help, not this exercise.
  opportunity_considerations: Default to arranging transport and a question list for an already planned
    appointment, not providing medical care. With permission, use a private card for the recipient’s preference,
    task owner, access need, expense limit, backup and completion signal. Keep health details and account
    information outside application evidence.
  prerequisites:
  - Default to arranging transport and a question list for an already planned appointment, not providing
    medical care. With permission, use a private card for the recipient’s preference, task owner, access
    need, expense limit, backup and completion signal. Keep health details and account information outside
    application evidence.
  dependencies: []
  safe_alternatives:
  - Use a phone call, written preferences, an interpreter or trusted decision supporter with permission.
    Without an appropriate care role, use the supplied transport scenario and label the handoff untested.
    Urgent deterioration or unsafe care requires appropriate medical, safeguarding or emergency help,
    not this exercise.
  role_conditions:
  - This competency is role conditional; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Caregiving for elders, illness, and disability differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Caregiving for elders, illness,
    and disability as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to arranging transport and a question list for an already planned appointment, not providing
    medical care. With permission, use a private card for the recipient’s preference, task owner, access
    need, expense limit, backup and completion signal. Keep health details and account information outside
    application evidence. Goal: Coordinate a bounded practical, emotional, administrative or advocacy
    contribution that respects the care recipient’s choices and the caregiver’s capacity. Scope: Use an
    existing authorized care arrangement. Medication, lifting, feeding, clinical assessment, financial
    authority and other specialist tasks must remain with appropriately authorized and trained people.
    Time and effort: Twenty minutes to agree the handoff, one ordinary care-support task and a 15-minute
    review. Adaptation: Use a phone call, written preferences, an interpreter or trusted decision supporter
    with permission. Without an appropriate care role, use the supplied transport scenario and label the
    handoff untested. Urgent deterioration or unsafe care requires appropriate medical, safeguarding or
    emergency help, not this exercise. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a phone call, written preferences, an interpreter or trusted decision supporter
    with permission. Without an appropriate care role, use the supplied transport scenario and label the
    handoff untested. Urgent deterioration or unsafe care requires appropriate medical, safeguarding or
    emergency help, not this exercise.
  expected_burden: Twenty minutes to agree the handoff, one ordinary care-support task and a 15-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Caregiving for elders, illness, and disability protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Caregiving for elders, illness, and disability action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a phone
    call, written preferences, an interpreter or trusted decision supporter with permission. Without an
    appropriate care role, use the supplied transport scenario and label the handoff untested. Urgent
    deterioration or unsafe care requires appropriate medical, safeguarding or emergency help, not this
    exercise.
  actions:
  - stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01-A1
    sequence: 1
    title: Ask what support is wanted and who may decide
    instructions: 'Ask the person how they want to participate and which part of the appointment logistics
      they want help with. Distinguish choosing the transport, paying for it, communicating an access
      need and speaking during the visit; authority for one is not authority for all. Identify an emotional
      concern they want acknowledged, any practical barrier and a financial question requiring the authorized
      person. Where decision support is needed, use the established supported-decision or legal arrangement
      rather than assuming incapacity.


      Observation checks: The recipient’s preference or authorized decision process is recorded; Practical
      emotional financial and advocacy needs are separated; Authority is checked for each offered task;
      Private clinical and account details are excluded from check-ins. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01
      action_stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01-A1
      competency_stable_id: '19.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1903_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1903_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_recipient_s_preference_or_authorized_decision_process_is_recorded
        - practical_emotional_financial_and_advocacy_needs_are_separated
        - authority_is_checked_for_each_offered_task
        - private_clinical_and_account_details_are_excluded_from_check_ins
      - measurement_id: c1903_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1903_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01-A2
    sequence: 2
    title: Carry out the agreed part with a backup
    instructions: 'Confirm the chosen transport or equivalent low-risk support, accessibility arrangements,
      expected cost and who will receive the arrival update. Rehearse what happens if the vehicle does
      not arrive: contact the agreed backup and the appointment provider instead of improvising unsafe
      transport. During the actual task, offer the recipient the agreed opportunity to speak and decline
      assistance. Do not change treatment, impersonate them or promise availability beyond the stated
      window.


      Observation checks: One agreed practical contribution is actually performed; Access cost and completion
      communication are confirmed; A workable backup is named without unsafe improvisation; The recipient
      can speak choose or decline within the arrangement. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01
      action_stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01-A2
      competency_stable_id: '19.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1903_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1903_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_agreed_practical_contribution_is_actually_performed
        - access_cost_and_completion_communication_are_confirmed
        - a_workable_backup_is_named_without_unsafe_improvisation
        - the_recipient_can_speak_choose_or_decline_within_the_arrangement
      - measurement_id: c1903_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1903_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01-A3
    sequence: 3
    title: Close the handoff and rebalance the burden
    instructions: 'Confirm with the recipient or authorized recipient of the handoff what was completed
      and what remains. Ask whether the help felt useful or controlling. Record time and burden broadly
      enough to decide whether the same arrangement is sustainable, then renegotiate one overloaded or
      unowned part. An appointment attended is not evidence that the clinical issue was resolved; an unsuccessful
      transport attempt still needs an explicit safe next owner.


      Observation checks: Completion and remaining tasks have named owners; Usefulness and agency are
      reviewed separately; Caregiver burden informs one adjustment; No clinical outcome is inferred from
      logistics. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Did the support remove a burden while preserving the person’s say, and who now owns
      the part that remains?


      Examples: Supportive: Transport and access were confirmed, the recipient kept control of visit questions
      and a backup owner accepted the return trip.


      Mixed: The journey worked, but the helper answered too quickly for the recipient and changed that
      arrangement next time.


      Contradictory: The helper took over treatment or finances without authority, or left a dependent
      person without a safe handoff.


      Inconclusive: A care checklist was written but neither an agreed task nor an actual or labeled simulated
      handoff occurred.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1903-CAREGIVING-FOR-ELDERS-ILLNESS-AND-DISABILITY-01
