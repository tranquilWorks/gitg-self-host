  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Caregiving for elders, illness, and disability explicitly; support can enable access and never
    reduces dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Caregiving for elders, illness, and disability
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Caregiving for elders, illness, and disability observation requires a distinct
    immutable origin; duplicate origins are rejected and later repetitions use the typed contract's explicit
    diminishing multipliers.
  recency_rule: Generated Caregiving for elders, illness, and disability rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
