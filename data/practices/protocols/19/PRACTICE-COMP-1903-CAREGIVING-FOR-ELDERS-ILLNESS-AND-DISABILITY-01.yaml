    kind: concept
    title: Learn and try
    body: 'Prepare one bounded handoff in an existing authorized care arrangement, complete an ordinary
      task if suitable, and review usefulness and burden. Allow twenty minutes to plan and fifteen to
      review around the actual task. Caregiving is role-conditional, not a required identity. Without
      an appropriate role, use the fiction; do not arrange care for an uninvolved person to obtain evidence.


      ### Support the person, not only the schedule


      Practical support may involve transport, an accessible reminder or an agreed errand. Emotional support
      asks what concern or reassurance is welcome. Financial support needs authority and limits around
      expenses; being a caregiver does not grant control over money. Advocacy helps the person raise their
      own questions and preferences, rather than substituting your voice whenever you think you know best.


      Age, illness or disability does not itself establish incapacity. Ask how the person wants to make
      and communicate decisions, using established supports and relevant legal arrangements. Someone may
      want help with transport while retaining control over appointment questions and private information.
      Different tasks require different permissions: booking a ride, spending an agreed amount, receiving
      an arrival update and speaking during a clinical visit are not a single bundle.


      A care plan should identify who does what, the recipient''s preferences, access requirements, resources,
      backup and a completion signal. A handoff is not complete because an offer was sent. The receiver
      must accept the relevant responsibility, have what is needed and know how to report completion or
      a problem. Unclaimed work remains unclaimed. Do not make essential care disappear from the plan
      when a caregiver reaches a limit.


      Sustainability includes time, rest, cost and emotional burden. An honest capacity limit is useful
      information for planning. It does not justify an unsafe abandonment, and devotion does not make
      unlimited labor feasible. Use appropriate services or authorized backup when needs exceed the arrangement.
      Clinical deterioration, urgent risk and unclear authority belong with appropriate professional or
      emergency support, not with an improvised learning task.


      ### Worked example


      A relative agrees to arrange an accessible ride to an existing appointment. The appointment is attended,
      but no clinical findings are shared. The transport task can be completed while the health question
      remains private or unresolved. If the relative also starts answering every question against the
      person''s preference, the timely ride does not cancel that loss of agency. Usefulness and respect
      must be reviewed separately.


      ### Supplied fictional task


      Maren, an adult receiving established support, has a booked appointment at 10:30 on 12 October.
      Maren wants to ask two private questions personally and wants helper Eli to arrange transport only.
      Maren permits Eli to receive arrival updates and use an agreed transport budget of 40 units. Eli
      has no authority to read clinical records, change medication, manage finances generally or speak
      for Maren at the visit. Maren uses an established communication aid and wants it available.


      The regular authorized provider offers accessible pickup at 09:40, a 25-minute journey and a 10-unit
      fare each way. The check-in target is 10:15. Maren wants the return arranged through the same provider
      after the visit, not a presumed fixed clinical duration. Eli has forty minutes available for planning
      and handoff, not an entire day. If pickup has not arrived by 09:45, the agreed route is to call
      the provider and designated care coordinator for a safe authorized alternative; no alternative has
      yet been confirmed. Do not invent a safe vehicle or manual transfer technique.


      ### Make the plan operational


      1. Confirm the task, actual authority and Maren''s preferences. Separate permission to arrange transport,
      spend up to 40, receive logistics updates and accompany or speak at the visit. Only the first three
      are supplied. Output: a private logistics card with no clinical details copied into the learning
      record.

      2. Calculate arrival from 09:40 plus 25 minutes and compare it with the 10:15 target. Calculate
      the expected round-trip fare and remaining budget. Include communication-aid availability without
      assuming Eli should operate it for Maren. Output: a feasible ordinary plan with time and cost margins,
      not a clinical promise.

      3. Write the missed-pickup trigger and contact route. A call requests an alternative; it does not
      prove one exists. Identify who must accept any replacement handoff and how Maren''s preference will
      be heard. Output: backup status, including anything unconfirmed, with no unsafe substitute invented.

      4. Explain the emotional and advocacy part modestly: ask whether Maren wants help preparing a question
      list or reassurance about logistics, accept a no, and preserve Maren''s voice. Set Eli''s capacity
      limit so other needed tasks receive a named accepted owner. Output: welcome support and bounded
      responsibilities, not a takeover.

      5. Save the card before opening the [later packet](?resource=file-later-packet-md). Trace actual
      pickup, arrival, return and expense. Check whether Maren''s choices were respected and whether any
      work remains unowned. Output: completed logistics, remaining questions and a sustainability revision.


      ### Adapt and transfer


      For support, use a one-page card with three headings: person’s preference, accepted task and problem
      contact. A familiar accessible format is preferable to a complex dashboard. For a harder fictional
      case, let the provider miss the trigger and require an actual safe handoff or an honest statement
      that transport remains unresolved; do not make a late promise into a completed ride.


      For an authorized real attempt, choose an ordinary task already allowed by the care arrangement.
      Confirm preferences, permissions and backup before acting. Ask afterward whether the help was useful
      or controlling, and record only minimal task-level evidence. Do not change medication, feeding,
      transfers, clinical decisions or financial control through this exercise. If the person''s needs
      exceed the arrangement, obtain suitable qualified assistance and preserve continuity rather than
      hiding the gap.


      ### Source use


      [CDC care planning, S13](https://www.cdc.gov/caregiving/guidelines/index.html) informs organized
      responsibilities and updates; its clinical form is not copied into app evidence. [ACL supported
      decision making, S15](https://acl.gov/programs/consumer-control/supported-decision-making-program)
      informs person-chosen, task-specific support. Neither grants legal authority, determines capacity
      or validates the transport plan. The schedule, budget and handoff case are original.


      ### Use the result at its proper scale


      Medical, reproductive, child-safety, guardianship, and elder-care decisions require qualified local
      guidance.


      This is role-conditional learning. Fiction is preparation, not actual participant evidence. Keep
      private identifying, intimate, medical and family details out of app records.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Try each case, then [read answers](?check=practice-answers).


      1. A caregiver is authorized to book transport. Does that also permit accessing records or answering
      clinical questions for the recipient?

      2. The backup provider has not confirmed a suitable vehicle after a missed pickup. Can the learner
      mark a safe handoff complete because a request was sent?

      3. A recipient attends an appointment and gives positive feedback about the ride, but no clinical
      findings are provided. What can the review claim, and what remains unknown?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Authority is task-specific. Respect the person''s chosen communication and existing
      legal or supported-decision arrangements; obtain the relevant legitimate permission for other tasks.
      Age or disability alone does not transfer control.

      2. No. A request is not acceptance, suitability or performance. Follow the established authorized
      escalation route, preserve the person''s agency and state the unresolved transport need honestly.
      Do not improvise unsafe vehicles, transfers or care.

      3. It can claim attended transport and the supplied feedback about usefulness, subject to actual
      facts. Clinical outcome remains unknown or private. Review burden and remaining logistics separately;
      a timely ride or grateful response cannot establish medical improvement.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
