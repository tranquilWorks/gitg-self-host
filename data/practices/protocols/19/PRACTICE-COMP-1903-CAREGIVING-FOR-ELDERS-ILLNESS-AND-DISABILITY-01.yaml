  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence.


      The regular pickup has not arrived at 09:45. Eli calls the provider and care coordinator as agreed.
      At 09:50 the coordinator confirms and accepts responsibility for a suitable accessible replacement
      arriving at 09:55, with the same 25-minute travel time and 10-unit outward fare. Maren agrees to
      that option. Arrival is 10:20, five minutes after the 10:15 check-in target. The coordinator contacts
      the clinic, which confirms the 10:30 appointment can still proceed. Without that confirmation, attendance
      could not simply be assumed.


      Maren attends and asks the private questions using the communication aid. No clinical answer is
      disclosed. The authorized provider arranges the return after the visit; Maren arrives home and confirms
      transport was useful and personal speaking preferences were respected. Total fare is 20 units. Eli
      spends fifty minutes on coordination, ten beyond the available forty.


      Credit the accepted backup, actual transport and respected voice, while preserving the late check-in
      and overrun. The coordinator agrees to discuss more backup capacity next time; no expanded arrangement
      has been implemented. Attendance does not establish a medical outcome or eliminate future transport
      risk.'
