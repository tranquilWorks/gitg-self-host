meaning_and_fit:
  purpose: Use a bounded period of rest or recreation deliberately and learn whether it restores attention,
    relationship or vitality without making rest another achievement test.
  why_recommended: Use a bounded period of rest or recreation deliberately and learn whether it restores
    attention, relationship or vitality without making rest another achievement test.
  claims:
  - statement: Use a bounded period of rest or recreation deliberately and learn whether it restores attention,
      relationship or vitality without making rest another achievement test.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Rest and leisure practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Rest and leisure as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use shorter periods, low-sensory recreation, supported rest or accessible
    media. Caregiving, shift work, disability and scarcity can limit options; do not shame a person for
    those constraints. Screen-based leisure can be legitimate when freely chosen and fitting, and offline
    leisure is not automatically superior.
  opportunity_considerations: 'Choose two safe accessible options already available: a quiet unstructured
    period with no task and a gentle chosen recreation such as reading for pleasure, listening to familiar
    music or sitting with a willing person. Keep essential care and necessary access supports in place.
    Prepare only a short after-period note about activity, fit and what felt different; no live monitoring
    is required.'
  prerequisites:
  - 'Choose two safe accessible options already available: a quiet unstructured period with no task and
    a gentle chosen recreation such as reading for pleasure, listening to familiar music or sitting with
    a willing person. Keep essential care and necessary access supports in place. Prepare only a short
    after-period note about activity, fit and what felt different; no live monitoring is required.'
  dependencies: []
  safe_alternatives:
  - Use shorter periods, low-sensory recreation, supported rest or accessible media. Caregiving, shift
    work, disability and scarcity can limit options; do not shame a person for those constraints. Screen-based
    leisure can be legitimate when freely chosen and fitting, and offline leisure is not automatically
    superior.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Rest and leisure differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Rest and leisure as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose two safe accessible options already available: a quiet unstructured period with no task
    and a gentle chosen recreation such as reading for pleasure, listening to familiar music or sitting
    with a willing person. Keep essential care and necessary access supports in place. Prepare only a
    short after-period note about activity, fit and what felt different; no live monitoring is required.
    Goal: Use a bounded period of rest or recreation deliberately and learn whether it restores attention,
    relationship or vitality without making rest another achievement test. Scope: Three ordinary leisure
    periods provide context-bound observations, not a sleep, fatigue, mental-health or addiction treatment
    and not proof that one activity restores everyone. Time and effort: Three twenty-minute periods over
    a week and one ten-minute review; reduce duration to actual capacity. Adaptation: Use shorter periods,
    low-sensory recreation, supported rest or accessible media. Caregiving, shift work, disability and
    scarcity can limit options; do not shame a person for those constraints. Screen-based leisure can
    be legitimate when freely chosen and fitting, and offline leisure is not automatically superior. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use shorter periods, low-sensory recreation, supported rest or accessible media.
    Caregiving, shift work, disability and scarcity can limit options; do not shame a person for those
    constraints. Screen-based leisure can be legitimate when freely chosen and fitting, and offline leisure
    is not automatically superior.
  expected_burden: Three twenty-minute periods over a week and one ten-minute review; reduce duration
    to actual capacity.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Rest and leisure protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Rest and leisure action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use shorter
    periods, low-sensory recreation, supported rest or accessible media. Caregiving, shift work, disability
    and scarcity can limit options; do not shame a person for those constraints. Screen-based leisure
    can be legitimate when freely chosen and fitting, and offline leisure is not automatically superior.
  actions:
  - stable_id: PRACTICE-COMP-2602-REST-AND-LEISURE-01-A1
    sequence: 1
    title: Protect a rest window and name what it is for
    instructions: 'Identify a realistic opening and what currently needs restoration: attention, social
      ease, physical rest or simple freedom from demands. Reserve a short period without requiring a useful
      output, improved mood or completed entertainment. Choose the quiet option for the first occasion
      and state a boundary around optional interruptions while preserving urgent care or safety contact.
      Notice whether guilt or comparison tries to turn the period into another obligation.


      Observation checks: The intended kind of restoration is named without a required result; A realistic
      window protects essential responsibilities; The first period has no output or improvement quota;
      Necessary safety contact and access supports remain available. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2602-REST-AND-LEISURE-01
      action_stable_id: PRACTICE-COMP-2602-REST-AND-LEISURE-01-A1
      competency_stable_id: '26.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
