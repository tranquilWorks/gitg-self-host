  - stable_id: PRACTICE-COMP-2602-REST-AND-LEISURE-01-A3
    sequence: 3
    title: Make room for rest without demanding proof every time
    instructions: 'Compare the three periods and identify one practical condition that helped, such as
      fewer optional notifications, a comfortable setting or a willing companion. Choose a sustainable
      next opportunity and a condition for changing the plan. A Sabbath, vacation or longer recovery period
      may express the same aim but is not required. If persistent exhaustion or severe distress remains,
      seek appropriate care rather than concluding that you failed at leisure.


      Observation checks: All actual periods inform the comparison; One practical enabling condition is
      identified; A sustainable next opportunity does not require continual scoring; Persistent concerning
      symptoms are not reduced to a leisure failure. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which conditions made leisure restorative or not, and how can you protect that possibility
      without demanding that every rest period earn its place?


      Examples: Supportive: The person found that quiet music restored attention more reliably than an
      open-ended feed and protected a modest repeat window without a productivity target.


      Mixed: The periods were mostly neutral during a difficult week, so the plan retained rest while
      leaving broader causes of fatigue unresolved.


      Contradictory: Rest was withheld until enough work was done or a compulsive activity was defended
      despite clear harm.


      Inconclusive: A leisure ideal was described without trying an actual period or reviewing its fit.'
    expected_time: 15-25 minutes
    due_within_days: 10
