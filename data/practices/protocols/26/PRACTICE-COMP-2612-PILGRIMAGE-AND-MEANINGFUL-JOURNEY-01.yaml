  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Iman arrives at 10:30. A group already uses the alcove, so Iman waits in a permitted seat until
      10:34 without asking them to leave. Reflection lasts until 10:42; Iman notices the place still serves
      others and abandons the idea of photographing an empty room. The trip home ends at 10:52. At 16:00
      Iman returns the map booklet through the library''s staffed desk during separately confirmed open
      hours; the desk confirms receipt at 16:02. The short second trip uses an already planned passing
      route, but its added travel time is not supplied and must not be called zero.


      The first journey takes 32 minutes, four more than the 28-minute plan. The first response occurs
      later and is distinct from the journey. No donation, volunteer agreement, spiritual feeling or broader
      community benefit is established.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Carry a question, and leave room for the place


      A meaningful journey connects preparation, encounter and a response after returning. Distance and
      hardship are not what make it meaningful. A familiar library, public memorial or authorized virtual
      account can hold a question about memory, devotion, a transition or what one has received. The place
      also has present users whose needs need not match the visitor''s private story.


      Allow twenty minutes of preparation, ten with the fictional journey record and fifteen for reflection
      and checks. No actual travel, religious belief, disclosure or ritual is required. [Pearl Harbor''s
      visitor-ethics page, S06](https://www.nps.gov/perl/getinvolved/supportyourpark/leavenotrace.htm)
      illustrates site-specific respect for other users and cultural objects. Its rules and history are
      not transferred as facts about our invented library or every sacred place.


      Worked example: after leaving a course, a student returns to the public reading room where they
      studied. They intend to thank the building as if it existed only for their memory, then notice people
      still relying on it. A fitting response is to return an overdue shared item or support an authorized
      need, rather than leaving a personal object on a working desk.


      ### Fictional journey J8: a library after a transition


      Iman has completed an evening course and asks, “What did this shared place make possible, and what
      responsibility remains?” The destination is the town library''s public history alcove. An archive
      card states that the building opened in 1974 and added a step-free reading room in 2008. These are
      invented case facts from a fictional municipal account. The card names no individual donor and does
      not represent every user''s experience.


      Today''s fictional visitor information confirms the alcove and level entrance route are suitable
      for Iman''s supports, open 10:00–12:00, with quiet reflection welcome if the aisle stays clear.
      There is no permission to leave objects, photograph users, hold a ceremony or borrow staff time
      without invitation. Iman chooses to make no public post during the visit while retaining communication
      and access aids. The restraint does not include withholding water, food, medication, rest or help.


      The permitted trip starts at home at 10:20, takes ten minutes to the library, allows eight minutes
      in the alcove and takes ten minutes home. Iman has no duty before 11:15. The fallback is the supplied
      archive text at home if access or conditions change. A virtual study has different evidence from
      physical presence; neither is spiritually ranked.


      A library notice asks users to return shared material through the staffed returns desk. Iman has
      an already-borrowed map booklet due next week and may return it early. This is a complete possible
      response within Iman''s authority. The library has not asked for gifts, fundraising, volunteering
      or another person''s story.


      ### Before, during and after have different work


      1. Write the question, one source-attributed historical fact, the planned route/return and the modest
      restraint. Name what the archive does not tell you. Preparation should sharpen attention without
      prescribing what the encounter must mean.

      2. Save the plan before the [later packet](?resource=file-later-packet-md). Trace the actual journey
      and identify what complicates the expected private moment. Respond to present users rather than
      making their activity an obstacle to your revelation.

      3. After the supplied return, separate what the place showed, what Iman projected and what remains
      unknown. Record the first reciprocal action and its actual completion or failure. Compare actual
      burden with the original plan; meaning does not erase other obligations.


      ### A journey can remain unfinished


      For support, use the archive text and mark the result as study, ask for an appropriate companion,
      or use an accessible familiar place. Sacred participation requires an actual invitation and understanding
      of local conduct; a visitor may reflect without copying a ritual. Never intensify a journey through
      deprivation or entering a restricted place.


      For a harder scenario, the alcove closes at arrival. Keep the route and ordinary duties in view;
      choose a permitted suitable alternative or return. The disappointment itself may change the reflection,
      but cannot create an encounter that did not occur.


      At a later actual local journey, bring one question, follow the place''s current rules and complete
      one modest response after returning. Over time, a recurring practice may express the transition
      better than a dramatic vow. This exercise cannot establish spiritual attainment, grief resolution
      or a duty to travel. Its evidence is a particular preparation, encounter and response, with projections
      honestly named.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'These questions revisit supplied examples to consolidate the reasoning. They do not independently
      test transfer to unseen material. Any separately labeled changed-case attempt below uses different
      facts.


      Attempt these before opening [answers](?check=practice-answers).


      1. A planned journey totals 10 minutes out, 8 reflection and 10 back. A four-minute wait occurs
      before reflection. What is the actual duration if everything else stays the same?


      2. A visitor chooses a restraint of leaving essential medication and a communication aid at home
      to make the journey count. What should change?


      3. A meaningful visit inspires a promise to volunteer, but no organization has agreed. May the review
      report service delivered?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. 32 minutes. Correct any 28-minute report by retaining the wait; if that breaks another commitment,
      adjust or defer the optional reflection rather than hiding time.


      2. Keep needed medication and aids. Choose a harmless optional restraint, such as no public posting,
      that fits actual needs and site rules. Hardship is not evidence of meaning or attainment.


      3. No. A wish or proposal is not an accepted role or delivered service. Use an authorized small
      response, confirm a suitable future role separately, and retain what remains unperformed.'
    criteria:
