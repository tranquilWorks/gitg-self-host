  - stable_id: PRACTICE-COMP-2612-PILGRIMAGE-AND-MEANINGFUL-JOURNEY-01-A2
    sequence: 2
    title: Complete the journey as an encounter rather than a display
    instructions: 'Follow the safe plan and attend to the place, its present users and the question you
      brought. Spend a short quiet or reflective period in a manner welcome there; do not copy rituals,
      photograph people or leave objects without permission. Notice something that complicates your expected
      meaning. Turn back or use the alternative if conditions change, and distinguish virtual study from
      being physically present.


      Observation checks: An actual journey or honest alternative occurs; Conduct respects present users
      and local rules; A detail can complicate the intended meaning; Safety and truthful mode labeling
      override completing the plan. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2612-PILGRIMAGE-AND-MEANINGFUL-JOURNEY-01
      action_stable_id: PRACTICE-COMP-2612-PILGRIMAGE-AND-MEANINGFUL-JOURNEY-01-A2
