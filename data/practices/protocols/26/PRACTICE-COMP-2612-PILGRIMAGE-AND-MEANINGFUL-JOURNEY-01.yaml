meaning_and_fit:
  purpose: Use a modest journey to encounter place, history, devotion, memory or transition through preparation
    and reflection rather than collecting an experience.
  why_recommended: Use a modest journey to encounter place, history, devotion, memory or transition through
    preparation and reflection rather than collecting an experience.
  claims:
  - statement: Use a modest journey to encounter place, history, devotion, memory or transition through
      preparation and reflection rather than collecting an experience.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Pilgrimage and meaningful journey practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Pilgrimage and meaningful journey as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a short accessible route, supported visit, window view of a meaningful
    place or authorized virtual account. A religious, secular or uncertain pathway is legitimate. Do not
    seek exhaustion, trespass, unsafe travel or ritual access against local boundaries to make the journey
    count.
  opportunity_considerations: Choose a permitted public memorial, place of learning, community site or
    familiar location connected to a transition. Default to visiting a local public place that represents
    something you have received, such as a library. Use official access information and an appropriate
    historical or community source. Select a safe accessible route, return plan and one modest restraint,
    such as no public posting during the visit.
  prerequisites:
  - Choose a permitted public memorial, place of learning, community site or familiar location connected
    to a transition. Default to visiting a local public place that represents something you have received,
    such as a library. Use official access information and an appropriate historical or community source.
    Select a safe accessible route, return plan and one modest restraint, such as no public posting during
    the visit.
  dependencies: []
  safe_alternatives:
  - Use a short accessible route, supported visit, window view of a meaningful place or authorized virtual
    account. A religious, secular or uncertain pathway is legitimate. Do not seek exhaustion, trespass,
    unsafe travel or ritual access against local boundaries to make the journey count.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Pilgrimage and meaningful journey differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Pilgrimage and meaningful
    journey as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a permitted public memorial, place of learning, community site or familiar location connected
    to a transition. Default to visiting a local public place that represents something you have received,
    such as a library. Use official access information and an appropriate historical or community source.
    Select a safe accessible route, return plan and one modest restraint, such as no public posting during
    the visit. Goal: Use a modest journey to encounter place, history, devotion, memory or transition
    through preparation and reflection rather than collecting an experience. Scope: A local physical or
    clearly labeled virtual journey can be meaningful without religious belief, long distance or hardship.
    It is not therapy, a spiritual achievement or permission to enter restricted places. Time and effort:
    Twenty minutes of preparation, a short suitable journey and a twenty-minute return reflection. Adaptation:
    Use a short accessible route, supported visit, window view of a meaningful place or authorized virtual
    account. A religious, secular or uncertain pathway is legitimate. Do not seek exhaustion, trespass,
    unsafe travel or ritual access against local boundaries to make the journey count. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a short accessible route, supported visit, window view of a meaningful place
    or authorized virtual account. A religious, secular or uncertain pathway is legitimate. Do not seek
    exhaustion, trespass, unsafe travel or ritual access against local boundaries to make the journey
    count.
  expected_burden: Twenty minutes of preparation, a short suitable journey and a twenty-minute return
    reflection.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Pilgrimage and meaningful journey protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Pilgrimage and meaningful journey action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a short
    accessible route, supported visit, window view of a meaningful place or authorized virtual account.
    A religious, secular or uncertain pathway is legitimate. Do not seek exhaustion, trespass, unsafe
    travel or ritual access against local boundaries to make the journey count.
  actions:
  - stable_id: PRACTICE-COMP-2612-PILGRIMAGE-AND-MEANINGFUL-JOURNEY-01-A1
    sequence: 1
    title: Prepare the purpose place and boundaries
    instructions: 'Write why this place matters and one question you will carry, such as what you have
      received and what responsibility follows. Learn one verified part of its history and what is not
      yet understood. Check current access, local conduct, safety, transport and physical or sensory needs.
      Choose a restraint that supports attention without restricting food, water, medication, communication
      aids or essential support. No vow or forced spiritual interpretation is required.


      Observation checks: A meaningful question and verified place context are prepared; Access safety
      and return needs are checked; The restraint supports attention without unsafe deprivation; Belief
      and participation remain freely chosen. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2612-PILGRIMAGE-AND-MEANINGFUL-JOURNEY-01
      action_stable_id: PRACTICE-COMP-2612-PILGRIMAGE-AND-MEANINGFUL-JOURNEY-01-A1
      competency_stable_id: '26.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
