        expected: true
  - stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01-A2
    sequence: 2
    title: Contribute twice using the approved method
    instructions: 'Complete two short approved periods and follow the project’s instructions exactly.
      For observations, record uncertainty and no-find results without guessing or altering the place;
      for ordinary litter, handle only the safe permitted category and stop at any hazard. Keep dates
      and minimal non-sensitive evidence of the work. Do not publish sensitive species locations, feed
      wildlife, introduce plants or improve the method without approval.


      Observation checks: Two actual contribution periods occur or missing opportunities remain explicit;
      The approved method and safety limits are followed; Uncertainty and null observations are recorded
      honestly; No unauthorized ecological intervention or sensitive-location disclosure occurs. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01-A2
      competency_stable_id: '26.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2614_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2614_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
