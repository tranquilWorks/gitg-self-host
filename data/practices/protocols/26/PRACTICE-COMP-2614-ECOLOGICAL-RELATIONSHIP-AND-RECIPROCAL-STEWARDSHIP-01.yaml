      - [NPS — Citizen Science: Get Involved](https://www.nps.gov/subjects/citizenscience/get-involved.htm)

      - [OpenLearn — Returning to STEM, Week 5, section 3.5](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=3.5)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      **Second record, April 10:** observation starts at 09:00. The surface is wet. At 09:04 a maintenance
      screen blocks the view of the drain mouth; it remains blocked until the intended end at 09:10. The
      observer records obstruction unknown and session incomplete, without moving the screen or entering
      the site.


      Both records reach the coordinator April 11. On April 12 the coordinator accepts April 3 as a complete
      null record and marks April 10 unusable for the full-window comparison while thanking the observer
      for reporting the obstruction. No drainage improvement is asserted. A third window on April 17 is
      proposed after checking with the coordinator, but no confirmation or observation is supplied. If
      that opportunity cannot be agreed, the observer plans to close the offer explicitly rather than
      silently promising ongoing work.


      Distinguish two attempted sessions, one comparison-usable record and an unconfirmed future opportunity.
      Four visible minutes plus six blocked minutes do not equal ten visible minutes.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let a place''s actual need shape your contribution


      Stewardship begins when attention becomes an accountable relationship with a particular place and
      the people responsible for it. An action that feels caring may be unwanted or harmful: removing
      a plant without identification, publishing a sensitive location or submitting guesses can create
      more work than help. Reciprocity includes learning the limits and checking whether the contribution
      was usable.


      Use the fictional Reed Court observation project below. Allow twenty minutes to prepare, ten per
      supplied session record and fifteen for review and checks. No field visit, cleanup, identification
      or submission to an actual project is required. [NPS citizen-science guidance, S08](https://www.nps.gov/subjects/citizenscience/get-involved.htm)
      describes both field and virtual opportunities and checking expectations with organizers. It does
      not validate the invented protocol or supply a live volunteer opening.


      Worked example: a volunteer sees a bare patch and wants to plant seeds. The site manager explains
      that the patch is a monitored drainage area and requests observations from the path instead. Following
      that request provides a possible contribution; unsolicited planting would alter the very condition
      being studied.


      ### Complete project instructions R3


      The fictional courtyard manager wants to know whether ordinary water flow is obstructed by fallen
      leaves. The ecological relationship of interest is between leaf material, water movement and the
      planted edge; the current pressure is occasional accumulation near a drain. The site is not a wildlife
      census, and no claim about drainage capacity or habitat health is assumed.


      The manager authorizes observation only from the existing accessible window. No entry to the planted
      area, touching drain covers, litter handling, species removal, feeding, collection or planting is
      allowed. The observer has read these instructions and the manager confirms the window route is suitable.
      The requested work is two ten-minute windows at least several days apart. The fictional project
      sets those durations; they are not a scientific standard.


      For each session record: date, actual start/end, whether the drain mouth stayed visible for the
      full interval, surface state (dry, wet or unknown), leaf obstruction (visible, none visible or unknown),
      and a short uncertainty note. If the drain view is blocked for part of the interval, obstruction
      is unknown and the record is incomplete for this project''s comparison. Do not fill the missing
      minutes with an estimate. “None visible” is a completed observation category, not proof that the
      whole drainage system is clear.


      Only the coordinator receives the internal site code R3. No public location, photos of people or
      sensitive wildlife details are requested. The supplied coordinator reply is the only validation
      feedback in this exercise. Submission alone is not acceptance, and a virtual analysis of these cards
      is not a field visit.


      **First record, April 3:** 09:00–09:10; the drain mouth stays visible; the surface is dry; no leaf
      obstruction is visible; no plants or objects are touched. This is a complete null observation under
      the stated method. Dry conditions do not demonstrate that water would flow well during rain.


      ### Contribute honestly, including an incomplete record


      1. Write the requested need, relationship, pressure and action limits. Copy a blank record with
      the allowed categories. Identify which questions require qualified staff rather than a volunteer''s
      intervention. Preserve the difference between learning about restoration and being authorized to
      restore.

      2. Save the first record and read the [later packet](?resource=file-later-packet-md). Apply the
      exact visibility rule to the second session before reading the coordinator''s feedback. Keep observed
      wetness separate from unknown obstruction. Do not replace the first null with a more exciting finding.

      3. Compare what was submitted with what was accepted. Name the burden of an incomplete record on
      the coordinator. Choose a realistic return or responsible end; a proposed date is not another observation.
      The useful output is an honest contribution record and response to feedback, not a claim of ecosystem
      recovery.


      ### Return within permission and capacity


      For support, use the complete supplied text or an actual authorized remote-data task with its own
      instructions. A helper may read or transcribe without inventing missing values. A field route requires
      actual permission, access, conditions and training; hazardous cleanup and ecological intervention
      are outside this exercise.


      For a harder case, the observer notices an injured animal or a sharp object. Stop within a safe
      location and notify the appropriate actual responsible service; do not handle it or extend the project''s
      authority. Record only the permitted minimal information.


      Later transfer is two suitable contributions under an actual project''s current method, followed
      by real usability feedback. Keep missed opportunities explicit and agree to a cadence you can sustain.
      Ending responsibly can be more reciprocal than promising weekly help and disappearing. Longer-term
      ecological conclusions require suitable evidence beyond two windows.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A ten-minute session has seven minutes of clear drain view and three blocked. Can it be counted
      complete under R3 by averaging visibility?


      2. A complete dry-weather observation reports no leaves visible. Does it establish a healthy ecosystem
      or successful drainage during heavy rain?


      3. A project accepts one record and thanks the observer for an incomplete second record. How many
      usable comparison records exist, and may the observer remove plants to improve the next one?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Full-interval visibility is required in this fictional method. Record the obstruction as
      unknown and the session incomplete. Correct the status without inventing observations or changing
      the protocol retrospectively.


      2. No. It supports only the stated null observation under dry conditions. Preserve the untested
      rain and ecological questions. Correct the broader conclusion, not the honest null finding.


      3. One. Thanks acknowledge communication, not data acceptance. Plant removal is unauthorized; ask
      the coordinator about suitable next observation conditions or end the offer responsibly.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
