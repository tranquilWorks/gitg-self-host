meaning_and_fit:
  purpose: Learn a specific place’s ecological relationships and limits, then contribute to its care or
    understanding over time instead of treating it only as scenery.
  why_recommended: Learn a specific place’s ecological relationships and limits, then contribute to its
    care or understanding over time instead of treating it only as scenery.
  claims:
  - statement: Learn a specific place’s ecological relationships and limits, then contribute to its care
      or understanding over time instead of treating it only as scenery.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Ecological relationship and reciprocal stewardship
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Ecological relationship and reciprocal stewardship as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use accessible observation, data transcription or another authorized remote
    task when physical access is limited. A virtual contribution supports the named project but is not
    a field visit. Do not undertake hazardous cleanup, restoration, wildlife handling or invasive-species
    removal without the required training and permission.
  opportunity_considerations: Choose a permitted local place and an authorized need, such as a land-manager-approved
    observation project or an ordinary litter task that excludes sharps, chemicals, biological hazards
    and traffic. A virtual project using its own supplied data is an accessible alternative. Identify
    the site or project contact and rules before selecting the contribution.
  prerequisites:
  - Choose a permitted local place and an authorized need, such as a land-manager-approved observation
    project or an ordinary litter task that excludes sharps, chemicals, biological hazards and traffic.
    A virtual project using its own supplied data is an accessible alternative. Identify the site or project
    contact and rules before selecting the contribution.
  dependencies: []
  safe_alternatives:
  - Use accessible observation, data transcription or another authorized remote task when physical access
    is limited. A virtual contribution supports the named project but is not a field visit. Do not undertake
    hazardous cleanup, restoration, wildlife handling or invasive-species removal without the required
    training and permission.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Ecological relationship and reciprocal stewardship differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Ecological relationship and
    reciprocal stewardship as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a permitted local place and an authorized need, such as a land-manager-approved observation
    project or an ordinary litter task that excludes sharps, chemicals, biological hazards and traffic.
    A virtual project using its own supplied data is an accessible alternative. Identify the site or project
    contact and rules before selecting the contribution. Goal: Learn a specific place’s ecological relationships
    and limits, then contribute to its care or understanding over time instead of treating it only as
    scenery. Scope: A small approved contribution supports place-specific stewardship, not ecological
    restoration expertise or proof of ecosystem improvement. Land-manager and project protocols control
    what may be done. Time and effort: Twenty minutes to learn the place’s needs, two bounded contribution
    periods separated by at least several days and a fifteen-minute review. Adaptation: Use accessible
    observation, data transcription or another authorized remote task when physical access is limited.
    A virtual contribution supports the named project but is not a field visit. Do not undertake hazardous
    cleanup, restoration, wildlife handling or invasive-species removal without the required training
    and permission. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible observation, data transcription or another authorized remote task
    when physical access is limited. A virtual contribution supports the named project but is not a field
    visit. Do not undertake hazardous cleanup, restoration, wildlife handling or invasive-species removal
    without the required training and permission.
  expected_burden: Twenty minutes to learn the place’s needs, two bounded contribution periods separated
    by at least several days and a fifteen-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Ecological relationship and reciprocal stewardship protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Ecological relationship and reciprocal stewardship action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    observation, data transcription or another authorized remote task when physical access is limited.
    A virtual contribution supports the named project but is not a field visit. Do not undertake hazardous
    cleanup, restoration, wildlife handling or invasive-species removal without the required training
    and permission.
  actions:
  - stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01-A1
    sequence: 1
    title: Learn the place’s relationships and its actual requested need
    instructions: 'Read the land manager’s or project’s account of the place, including one ecological
      relationship, a current pressure and a limit on visitor action. Ask what contribution is wanted
      rather than assuming planting, removing species or collecting specimens helps. Confirm permission,
      training, access, data quality and sensitive-location rules. State what you do not know and which
      activities must remain with qualified staff.


      Observation checks: One ecological relationship pressure and visitor limit are identified; The contribution
      responds to an authorized actual need; Permission training and information-sharing rules are checked;
      Unqualified restoration collection or species removal is excluded. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01
      action_stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01-A1
      competency_stable_id: '26.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2614_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2614_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_ecological_relationship_pressure_and_visitor_limit_are_identified
        - the_contribution_responds_to_an_authorized_actual_need
        - permission_training_and_information_sharing_rules_are_checked
        - unqualified_restoration_collection_or_species_removal_is_excluded
      - measurement_id: c2614_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2614_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
