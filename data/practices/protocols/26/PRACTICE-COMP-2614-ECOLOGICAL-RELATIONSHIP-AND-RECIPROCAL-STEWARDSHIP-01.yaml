    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Ecological relationship and reciprocal stewardship; no purchase, subscription, travel, credential,
      or public artifact is required.
    accessibility:
    - Use accessible observation, data transcription or another authorized remote task when physical access
      is limited. A virtual contribution supports the named project but is not a field visit. Do not undertake
      hazardous cleanup, restoration, wildlife handling or invasive-species removal without the required
      training and permission.
    cultural_context:
    - Adapt the expression of Ecological relationship and reciprocal stewardship to direct or indirect
      communication, collective or individual decision structures, local norms, faith or secular commitments,
      and role obligations while preserving consent and dignity.
    resource_variants:
    - Use accessible observation, data transcription or another authorized remote task when physical access
      is limited. A virtual contribution supports the named project but is not a field visit. Do not undertake
      hazardous cleanup, restoration, wildlife handling or invasive-species removal without the required
      training and permission.
  pause_conditions:
  - Pause Ecological relationship and reciprocal stewardship when capacity, consent, authority, privacy,
    access, care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances
    make the next action unwise.
  stop_conditions:
  - Stop the Ecological relationship and reciprocal stewardship practice for harm, coercion, retaliation
    risk, emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Ecological relationship and reciprocal stewardship situation exceeds
    a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
