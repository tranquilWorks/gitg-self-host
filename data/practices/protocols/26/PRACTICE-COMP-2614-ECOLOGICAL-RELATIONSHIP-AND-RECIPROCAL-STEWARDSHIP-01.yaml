        criteria:
        - two_actual_contribution_periods_occur_or_missing_opportunities_remain_explicit
        - the_approved_method_and_safety_limits_are_followed
        - uncertainty_and_null_observations_are_recorded_honestly
        - no_unauthorized_ecological_intervention_or_sensitive_location_disclosure_occurs
      - measurement_id: c2614_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2614_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2614-ECOLOGICAL-RELATIONSHIP-AND-RECIPROCAL-STEWARDSHIP-01-A3
    sequence: 3
    title: Review usefulness with the place’s keepers and plan a return
    instructions: 'Ask the authorized contact or use the project’s validation feedback to learn whether
      the contribution was usable and what should change. Distinguish completing a task from improving
      the ecosystem; the latter needs appropriate longer-term evidence. Choose a sustainable return cadence
      or a responsible end with any promised work handed back. Explain how your understanding of dependence
      and reciprocity changed, including any burden your participation created.


      Observation checks: Usability is checked through the project or responsible contact; Task completion
      is not called ecosystem recovery; A sustainable return or responsible end is specified; Reciprocity
      includes the burden created by participation itself. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What did the place or project actually need from you, and how will you know that returning
      helps rather than merely feels meaningful?


      Examples: Supportive: Two approved observations were submitted with uncertainty intact, project
      feedback confirmed their usability and the participant chose a sustainable return.


      Mixed: One contribution was usable but the second lacked required conditions, so it was marked incomplete
      rather than invented.


      Contradictory: Untrained planting or species removal was performed as stewardship, or sensitive
      wildlife locations were published.


      Inconclusive: A place was admired without learning its limits, contributing through an authorized
      method or checking usefulness over time.'
    expected_time: 15-25 minutes
    due_within_days: 10
