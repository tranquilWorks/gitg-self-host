      - [NPS Pearl Harbor — Leave No Trace](https://www.nps.gov/perl/getinvolved/supportyourpark/leavenotrace.htm)

      - [OpenLearn — The Language of Comedy, Track 6](https://www.open.edu/openlearn/languages/the-language-comedy?trackno=6)

      - [NPS — Citizen Science: Get Involved](https://www.nps.gov/subjects/citizenscience/get-involved.htm)

      - [OpenLearn — Returning to STEM, Week 5, section 3.5](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=3.5)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      In round one Asha offers an umbrella theater roof. During Bo''s typing pause, Asha adds two more
      ideas and the host moves on. Bo''s completed text, “a roof for a sleeping cloud,” arrives after
      the round closes. Dani shows a drawing but nobody describes it; Cora passes. Bo says the open-floor
      rush prevented their contribution from being heard; Cora does not say why they passed.


      The group agrees to collect one response or pass before open discussion and to describe visual responses.
      In round two Asha offers “a shoe-shaped ferry for beetles,” then waits. Bo types “a hotel for a
      lost sock,” which the host reads after permission. Dani describes a drawing of a shoe mailbox. Cora
      chooses to pass again. Bo says the new sequence made contributing easier. Dani says the description
      worked but gives no enjoyment rating. No statement establishes Cora''s enjoyment or access experience.


      Retain the actual sequence change and the unknowns. Bo''s two response texts are different; this
      is not a controlled experiment isolating a causal effect for all groups.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Change the opening, not the person


      An invitation to play is incomplete if only the fastest speaker can use it. Inclusion concerns the
      actual opportunity to contribute, watch or pass. It is not equal word counts, compulsory turns or
      a diagnosis-based guess about what someone can do. A useful adaptation removes a particular barrier
      and is then checked with the people using it.


      This guide supplies a complete no-cost game and two fictional rounds. Allow fifteen minutes to prepare,
      ten to compare the rounds and ten for checks. Use only text if preferred; no participants are required
      for the default. [W3C event accessibility guidance, S05](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)
      supports accessible information and participant access planning. Applying those ideas to this original
      game does not establish universal accessibility.


      Worked example: a facilitator gives everyone a turn but closes each after two seconds. A person
      composing a written answer still cannot contribute. Asking what pace would work, leaving an agreed
      response interval and allowing a pass changes the opening. Praising the person for finally “keeping
      up” misidentifies the barrier.


      ### Complete game: impossible object jobs


      Choose an ordinary imaginary object and offer a harmless impossible job for it. An umbrella might
      become a mushroom''s theater roof; a spoon might be a moon''s rowing oar. There are no correct answers,
      elimination, speed points or movement requirements. Each willing person may speak, type, draw, sign
      through an agreed communication route, use a helper they choose, watch or pass. Do not infer humor
      preferences or communication needs from age or disability.


      Four fictional players agree to try: Asha speaks quickly, Bo types, Cora prefers listening and sometimes
      passing, and Dani draws with a short spoken description. All are adults; if adapting for children,
      use responsible adult supervision and age-appropriate content. Everyone already has their chosen
      materials. There is no fee, purchase, public recording or requirement to explain access needs. The
      room and seating are confirmed suitable in this fictional case.


      The first round uses an umbrella. Its starting rule is “one invitation to each person, then an open
      floor.” The host reads the prompt and makes the same text available. No one has yet checked whether
      this rule gives the different modes enough time. The initial hypothesis is that a nominal turn for
      each person will be sufficient. That hypothesis is testable and may be wrong.


      Before the second round, participants may agree to a change: collect one response or explicit pass
      from each willing player before opening discussion; wait without filling every silence; ask whether
      more time or another mode is needed. There is no fixed response deadline. A pass ends that invitation
      and does not require later make-up speech. The second object is a shoe, so new ideas remain possible.


      ### Inspect a barrier without scoring people


      1. Write the rules in five short lines: prompt, response modes, invitation structure, pass/watch
      right and end condition. The round ends when everyone has had the agreed opportunity or chooses
      to stop, not when everyone has produced an answer.

      2. Save the initial hypothesis, then read the [later packet](?resource=file-later-packet-md). Find
      the specific first-round mechanism that blocked a response. Distinguish the host''s interpretation
      from what Bo actually says. Identify which change the group agrees to and which outcome remains
      unknown.

      3. Compare rounds using access facts: was a typed response received, was a drawing described, was
      passing respected, and did the open floor dominate? Record optional enjoyment feedback separately.
      Decide what to retain or change without counting people as inclusion points.


      ### Meaningful participation can be quiet


      For support, analyze the supplied rounds or play alone with imaginary objects, labeled as rehearsal.
      Simplify vocabulary, describe drawings, use an agreed language/communication aid or give advance
      prompts when actual participants prefer them. Watching is a valid choice, not evidence the design
      necessarily failed or succeeded.


      For a harder variation, a new player joins using a different language. Ask about workable translation
      and pacing rather than assigning the fastest player to answer for them. If a suitable route is unavailable,
      change the activity with agreement or defer; do not call unsupported attendance inclusion.


      Later transfer needs another actual agreed game and another check of whether the adaptation helps.
      Two fictional rounds cannot establish what children, other cultures or all disabled people need.
      A richer invitation can coexist with neutral enjoyment; leisure must remain chosen.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A person passes in both rounds. Is making them speak in round three a valid test of inclusion?


      2. A written answer arrives only after a fast open discussion ends. Is the primary repair to tell
      the writer to be quicker?


      3. A new sequence admits written and drawn responses, but nobody answers the enjoyment question.
      What improved and what remains unknown?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. A pass is an agreed choice, not a debt. Offer a welcome way to request changes without compelling
      speech or a reason. Correct any participation count that treats silence as personal failure.


      2. No. Inspect the turn structure and ask about workable pacing; collect responses or passes before
      open discussion if agreed. Correct the access barrier rather than making speed a hidden entry requirement.


      3. Those response modes were received in that round. Enjoyment remains unknown; other access needs
      may remain too. Correct a universal success claim by reporting the particular observed change and
      its limits.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
