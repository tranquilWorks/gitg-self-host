meaning_and_fit:
  purpose: Identify and reduce age, ability, cost, communication and dominance barriers in shared recreation
    while preserving choice and enjoyment.
  why_recommended: Identify and reduce age, ability, cost, communication and dominance barriers in shared
    recreation while preserving choice and enjoyment.
  claims:
  - statement: Identify and reduce age, ability, cost, communication and dominance barriers in shared
      recreation while preserving choice and enjoyment.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Communal recreation and inclusive play practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Communal recreation and inclusive play as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use asynchronous messages, tactile or sound-based prompts, a quiet observer
    role or a different familiar game with the same consent and barrier-removal process. Nobody must compete,
    move, pay or disclose to count as included. Stop if teasing, coercion, unsafe behavior or persistent
    exclusion develops.
  opportunity_considerations: 'Use a no-cost word or imagination game: each willing participant may suggest
    an impossible but harmless use for an ordinary object, such as a spoon being a tiny boat’s flagpole.
    Contributions may be spoken, written, signed, drawn or passed. There is no speed score, elimination
    or required physical action. With children, use appropriate responsible adult supervision and age-fit
    content.'
  prerequisites:
  - 'Use a no-cost word or imagination game: each willing participant may suggest an impossible but harmless
    use for an ordinary object, such as a spoon being a tiny boat’s flagpole. Contributions may be spoken,
    written, signed, drawn or passed. There is no speed score, elimination or required physical action.
    With children, use appropriate responsible adult supervision and age-fit content.'
  dependencies: []
  safe_alternatives:
  - Use asynchronous messages, tactile or sound-based prompts, a quiet observer role or a different familiar
    game with the same consent and barrier-removal process. Nobody must compete, move, pay or disclose
    to count as included. Stop if teasing, coercion, unsafe behavior or persistent exclusion develops.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Communal recreation and inclusive play differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Communal recreation and inclusive
    play as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a no-cost word or imagination game: each willing participant may suggest an impossible but
    harmless use for an ordinary object, such as a spoon being a tiny boat’s flagpole. Contributions may
    be spoken, written, signed, drawn or passed. There is no speed score, elimination or required physical
    action. With children, use appropriate responsible adult supervision and age-fit content. Goal: Identify
    and reduce age, ability, cost, communication and dominance barriers in shared recreation while preserving
    choice and enjoyment. Scope: Two rounds of an original low-stakes game test inclusion in one group.
    They do not prove universal accessibility or require anyone to disclose a diagnosis or participate.
    Time and effort: Fifteen minutes to agree on access, two short rounds and a ten-minute voluntary review.
    Adaptation: Use asynchronous messages, tactile or sound-based prompts, a quiet observer role or a
    different familiar game with the same consent and barrier-removal process. Nobody must compete, move,
    pay or disclose to count as included. Stop if teasing, coercion, unsafe behavior or persistent exclusion
    develops. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous messages, tactile or sound-based prompts, a quiet observer role
    or a different familiar game with the same consent and barrier-removal process. Nobody must compete,
    move, pay or disclose to count as included. Stop if teasing, coercion, unsafe behavior or persistent
    exclusion develops.
  expected_burden: Fifteen minutes to agree on access, two short rounds and a ten-minute voluntary review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Communal recreation and inclusive play protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Communal recreation and inclusive play action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    messages, tactile or sound-based prompts, a quiet observer role or a different familiar game with
    the same consent and barrier-removal process. Nobody must compete, move, pay or disclose to count
    as included. Stop if teasing, coercion, unsafe behavior or persistent exclusion develops.
  actions:
  - stable_id: PRACTICE-COMP-2611-COMMUNAL-RECREATION-AND-INCLUSIVE-PLAY-01-A1
    sequence: 1
    title: Ask about participation needs without demanding personal disclosure
    instructions: 'Describe the game and ask what would make it comfortable and workable: pacing, language,
      sensory level, communication mode, movement, cost or a right to watch. Agree on a pass option and
      a simple turn structure so one confident person does not occupy every opening. Do not ask for diagnoses
      or infer preferences from age or disability. Confirm that the chosen object and examples are appropriate
      to the group.


      Observation checks: The game and voluntary participation are clear; Access needs are asked about
      without diagnostic disclosure; Pass and multiple communication modes are available; A turn structure
      addresses likely dominance without humiliating anyone. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2611-COMMUNAL-RECREATION-AND-INCLUSIVE-PLAY-01
      action_stable_id: PRACTICE-COMP-2611-COMMUNAL-RECREATION-AND-INCLUSIVE-PLAY-01-A1
      competency_stable_id: '26.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
