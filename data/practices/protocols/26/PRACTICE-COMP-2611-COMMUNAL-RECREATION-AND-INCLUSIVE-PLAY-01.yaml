  - stable_id: PRACTICE-COMP-2611-COMMUNAL-RECREATION-AND-INCLUSIVE-PLAY-01-A2
    sequence: 2
    title: Run a first round and change one observed barrier
    instructions: 'Play a brief first round, allowing ordinary pauses and different kinds of contribution.
      Notice a specific barrier, such as a rapid speaker filling silence before written responses arrive,
      and ask whether a proposed change would help. Make one adjustment, such as a visible response pause
      or collecting responses before reading them. Do not score people’s participation or force equal
      amounts of speech as proof of inclusion.


      Observation checks: A first actual round occurs with voluntary contributions; A specific observable
      barrier is identified; The affected participants can accept or decline a proposed adjustment; Participation
      is not turned into a speech quota or personal score. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
