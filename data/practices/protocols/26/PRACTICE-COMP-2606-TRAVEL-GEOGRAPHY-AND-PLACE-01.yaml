meaning_and_fit:
  purpose: Connect geography, history, language, etiquette and the effects of visiting to respectful curiosity
    about a specific place.
  why_recommended: Connect geography, history, language, etiquette and the effects of visiting to respectful
    curiosity about a specific place.
  claims:
  - statement: Connect geography, history, language, etiquette and the effects of visiting to respectful
      curiosity about a specific place.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Travel, geography, and place practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Travel, geography, and place as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a free local site or accessible official virtual exhibit. A person can
    learn respectfully without travel, photography or spending. International journeys need current official
    document, health and safety checks; this exercise does not replace them or require contact with unsafe
    people or settings.
  opportunity_considerations: 'Choose a local public museum, library history display, neighborhood heritage
    site or an official online exhibit. Use the site’s own visitor information and one locally authored
    historical or community source. Prepare a simple map and five headings: geography, historical change,
    everyday use, visitor etiquette and visitor effects. No paid travel is required.'
  prerequisites:
  - 'Choose a local public museum, library history display, neighborhood heritage site or an official
    online exhibit. Use the site’s own visitor information and one locally authored historical or community
    source. Prepare a simple map and five headings: geography, historical change, everyday use, visitor
    etiquette and visitor effects. No paid travel is required.'
  dependencies: []
  safe_alternatives:
  - Use a free local site or accessible official virtual exhibit. A person can learn respectfully without
    travel, photography or spending. International journeys need current official document, health and
    safety checks; this exercise does not replace them or require contact with unsafe people or settings.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Travel, geography, and place differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Travel, geography, and place
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a local public museum, library history display, neighborhood heritage site or an official
    online exhibit. Use the site’s own visitor information and one locally authored historical or community
    source. Prepare a simple map and five headings: geography, historical change, everyday use, visitor
    etiquette and visitor effects. No paid travel is required. Goal: Connect geography, history, language,
    etiquette and the effects of visiting to respectful curiosity about a specific place. Scope: A modest
    local visit or a labeled virtual study is not a complete travel plan, cultural expertise or assurance
    of personal safety. Current access and travel requirements remain separate checks. Time and effort:
    Thirty minutes of preparation, a short permitted visit or virtual study and a fifteen-minute reflection.
    Adaptation: Use a free local site or accessible official virtual exhibit. A person can learn respectfully
    without travel, photography or spending. International journeys need current official document, health
    and safety checks; this exercise does not replace them or require contact with unsafe people or settings.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a free local site or accessible official virtual exhibit. A person can learn
    respectfully without travel, photography or spending. International journeys need current official
    document, health and safety checks; this exercise does not replace them or require contact with unsafe
    people or settings.
  expected_burden: Thirty minutes of preparation, a short permitted visit or virtual study and a fifteen-minute
    reflection.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Travel, geography, and place protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Travel, geography, and place action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a free
    local site or accessible official virtual exhibit. A person can learn respectfully without travel,
    photography or spending. International journeys need current official document, health and safety
    checks; this exercise does not replace them or require contact with unsafe people or settings.
  actions:
  - stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01-A1
    sequence: 1
    title: Learn enough context to arrive considerately
    instructions: 'Locate the place on a map and identify a geographical feature or transport connection
      that shapes its use. Read one sourced historical account and note what changed and whose perspective
      it represents. Verify current opening or online access, physical or sensory access needs and rules
      for photos, dress, quiet or participation. Learn a relevant greeting or courtesy from a reliable
      local source when another language is used; do not invent a phrase or expect local people to teach
      you on demand.


      Observation checks: The place is located geographically rather than only by attraction name; One
      sourced historical change and perspective are identified; Current access and visitor etiquette are
      checked; Any language preparation is accurate and not demanded from unwilling people. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01
      action_stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01-A1
      competency_stable_id: '26.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2606_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2606_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_place_is_located_geographically_rather_than_only_by_attraction_name
        - one_sourced_historical_change_and_perspective_are_identified
        - current_access_and_visitor_etiquette_are_checked
        - any_language_preparation_is_accurate_and_not_demanded_from_unwilling_people
      - measurement_id: c2606_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
