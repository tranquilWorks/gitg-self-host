  - stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01-A2
    sequence: 2
    title: Attend to ordinary use and ask only welcome questions
    instructions: 'During the permitted visit, notice how residents, workers or regular users use the
      place in addition to visitors. Follow posted and communicated rules, ask permission before photographing
      people and avoid blocking access for a picture. Ask one welcome factual question or use the official
      exhibit to investigate it. For a virtual study, record what cannot be learned about embodied access
      or everyday interaction rather than pretending to have visited.


      Observation checks: Actual visit and virtual study are labeled correctly; Ordinary local use receives
      attention; Photography questions and movement respect consent and access; One question is investigated
      without extracting unpaid personal testimony. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01
      action_stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01-A2
      competency_stable_id: '26.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2606_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2606_a2_primary
        kind: artifact
        role: primary
        weight: '1'
