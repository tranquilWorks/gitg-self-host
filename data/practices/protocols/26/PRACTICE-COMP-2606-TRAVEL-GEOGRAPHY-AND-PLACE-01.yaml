  - stable_id: PRACTICE-COMP-2606-TRAVEL-GEOGRAPHY-AND-PLACE-01-A3
    sequence: 3
    title: Review what visiting gives and what it costs
    instructions: 'Identify one learned detail, one assumption corrected and one continuing misunderstanding.
      Consider crowding, worker burden, local spending, housing or environmental effects where relevant,
      distinguishing observations from claims needing evidence. Choose one proportionate response such
      as following a less disruptive route, crediting a local source or sharing an accurate correction.
      Do not reduce the place to a personal transformation story or claim a visit automatically benefits
      residents.


      Observation checks: Learning corrected assumptions and remaining uncertainty are recorded; Visitor
      benefits and burdens are considered separately; A proportionate respectful response is chosen; The
      place is not treated only as a setting for the visitor’s identity. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What became visible when you treated the place as part of other people’s ordinary
      lives, and what did you change about your own way of visiting?


      Examples: Supportive: The visitor learned how the site’s geography shaped local work, respected
      a photo restriction and corrected an inaccurate story in their own notes.


      Mixed: The online exhibit added historical context but left current everyday use uncertain, which
      remained explicit.


      Contradictory: People were photographed without permission or the place was reduced to an exotic
      backdrop for self-presentation.


      Inconclusive: Attractions were listed without geography, history, etiquette, local perspective or
      visitor-impact reflection.'
    expected_time: 15-25 minutes
