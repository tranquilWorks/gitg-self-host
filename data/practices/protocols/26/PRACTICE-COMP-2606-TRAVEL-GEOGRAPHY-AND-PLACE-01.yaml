  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [NPS — Trip Planning Guide](https://www.nps.gov/subjects/healthandsafety/trip-planning-guide.htm)

      - [Living Heritage in the UK — Community consent](https://livingheritage.unesco.org.uk/info/guidance/community-consent)

      - [UNESCO — New methods to boost intercultural competencies](https://www.unesco.org/en/articles/new-methods-boost-intercultural-competencies)

      - [NASA — Cosmic Distances](https://science.nasa.gov/solar-system/cosmic-distances/)

      - [W3C WAI — Making Events Accessible](https://www.w3.org/WAI/teach-advocate/accessible-presentations/)

      - [NPS Pearl Harbor — Leave No Trace](https://www.nps.gov/perl/getinvolved/supportyourpark/leavenotrace.htm)

      - [OpenLearn — The Language of Comedy, Track 6](https://www.open.edu/openlearn/languages/the-language-comedy?trackno=6)

      - [NPS — Citizen Science: Get Involved](https://www.nps.gov/subjects/citizenscience/get-involved.htm)

      - [OpenLearn — Returning to STEM, Week 5, section 3.5](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=3.5)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Ari reaches H at 10:16 and reads until 10:28. Ari initially steps into the doorway to frame a photo,
      notices the clear-entry request and moves to the designated side space without photographing people.
      At 10:30 the desk volunteer welcomes one question: “Did the bridge make the hall unnecessary?” The
      volunteer says the room remains useful for waiting and local work; they cannot speak for former
      ferry workers. The exchange ends at 10:33. Ari returns to S at 10:39 and does not visit M.


      The original hall-only schedule would have returned at 10:34 without the question. The actual five
      additional minutes comprise two minutes waiting and a three-minute exchange beyond the original
      10:28 departure. Count the actual sequence once: 6 travel + 12 reading + 2 waiting + 3 exchange
      + 6 return = 29 minutes. The changed use is established in fiction; local economic or social impacts
      remain unmeasured.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Read a place in more than one direction


      A destination is also a home, workplace, transport link or remembered loss. Geography helps explain
      why it is where it is; history shows that its present use was made rather than inevitable. Respectful
      visiting connects those facts to conduct instead of treating them as trivia for a photograph.


      Allow twenty-five minutes for the supplied fictional town file, ten for its later visit and ten
      for checks. No trip, purchase or conversation is required. Make a five-part place note: geography,
      historical change, everyday use, etiquette and visitor effects. [Living Heritage community consent,
      S02](https://livingheritage.unesco.org.uk/info/guidance/community-consent) illustrates that a public
      heritage process can still require community authorization. Its UK inventory guidance is not a universal
      visitor law or permission to reuse a local practice.


      Worked example: a former ferry building is now a weekday waiting room. Its picturesque doorway is
      also an access route. Learning that fact should change where a visitor stands, not merely enrich
      the caption. A worker declining a question is not evidence of local hostility.


      ### Complete fictional place file: Bellwater


      **Map.** The river runs north–south. Station S is west of the river. Public hall H is six minutes
      east of S, still on the west bank. Bridge B is four minutes north of H; the small east-bank market
      M is five minutes beyond B. All named paths are permitted, level and confirmed suitable for this
      case. A private riverside yard is not a shortcut. No actual town or people are represented.


      **History card, town archive display.** A ferry operated before a bridge opened in 1962. The hall,
      previously a ticket office, became a community waiting room in 1980. The archive card explains transport
      change from the municipal perspective; it contains no workers'' oral histories or account of displacement.
      Do not invent those perspectives or assume there were no costs.


      **Present-use card, hall committee.** H opens 10:00–12:00 today. Its entrance must remain clear.
      A quiet work table is for residents using the room, not a visitor photo set. Text copies of the
      display are available at the desk. Photos of the empty display are permitted; people and private
      notes require separate consent. Staff invite factual questions only during the 10:30–10:40 question
      period. Visitors may otherwise read independently.


      **Courtesy card.** The committee uses English in this supplied case: “Hello; is this a good time
      for one question?” and “Thank you; I will leave the entrance clear.” These are complete ordinary
      phrases, not invented translations or claims about a national language. For another language, use
      a reliable local pronunciation/meaning source and accept that nobody owes coaching.


      **Visit limits.** Ari arrives at S at 10:10 and must return to S by 11:00. An independent hall visit
      uses twelve minutes inside. Market browsing would add ten minutes at M, plus the route from H and
      back. Ari has no duty to spend; buying something cannot purchase access to people or private space.


      ### Turn context into a considerate visit


      1. Sketch the river, station, hall, bridge and market. Compute a hall-only return and a combined
      hall/market return without hiding travel time. Identify the opening and invitation windows separately.
      Reaching the hall does not make a staff question welcome immediately.

      2. For each of the five headings write one supplied fact, one limitation and one conduct implication.
      Include the possibility that visitors create noise, access obstruction or extra staff work. Do not
      invent revenue, displacement or tourism-impact estimates.

      3. Save the plan and then read the [later packet](?resource=file-later-packet-md). Record which
      visit and question actually occurred, who supplied the explanation and what remains unrepresented.
      Revise one initial assumption without converting one person''s account into the town''s unanimous
      view.


      The meaningful output is a small place note that changed a route, question or behavior. Photographs
      and spending are optional; a missed attraction is not failure to understand a place.


      ### Local, virtual and later routes


      Use the text file with a reader or make a clearly labeled virtual study of an official exhibit.
      A virtual page cannot establish a building''s current sensory or physical access. For a live visit,
      verify the site''s current rules, local history, transport and individual requirements; these invented
      timings cannot be reused as travel advice.


      A harder reading asks which historical perspective is missing and where a willing, locally authored
      account might be found. Do not turn a worker into an unpaid interview subject. On a later suitable
      visit, verify one geographical connection, ask only a welcome question, and review one actual visitor
      burden. Retain uncertain effects rather than calling any purchase sustainable tourism.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
