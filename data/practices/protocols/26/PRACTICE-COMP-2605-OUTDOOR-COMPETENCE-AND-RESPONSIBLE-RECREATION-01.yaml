  - stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01-A2
    sequence: 2
    title: Participate within the plan and minimize impact
    instructions: 'If the conditions fit, follow the permitted route, check position at a known junction
      and keep the return limit. Stay within the site’s current rules for surfaces, waste, wildlife, objects
      and other users; do not create a shortcut, collect artifacts or light a fire as part of the exercise.
      Adapt or turn back when conditions change rather than completing the route at any cost. If the outing
      is deferred, record the preparation without claiming outdoor performance.


      Observation checks: An actual outing or honest deferral is recorded; Position and return limit are
      checked during participation; Site-specific impact and other-user rules are followed; Changing conditions
      can lead to adaptation or turning back. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01
      action_stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01-A2
      competency_stable_id: '26.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
