  - stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01-A3
    sequence: 3
    title: Review the return as a capability and responsibility check
    instructions: 'Confirm safe return with the appropriate person, then compare planned and actual time,
      route, effort, access and equipment usefulness. Identify one navigation or preparation gap and one
      effect on the place or other users. Choose a specific improvement before any harder outing. A completed
      easy route does not authorize remote, technical or water-based activity beyond training and support.


      Observation checks: Return communication is completed where applicable; Plan and actual conditions
      are compared; One capability and one stewardship lesson are identified; Future challenge is bounded
      by training rather than successful completion alone. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which preparation mattered in the actual conditions, and what did you change to protect
      both participants and the place?


      Examples: Supportive: The participant checked a closure, used the permitted accessible route, verified
      a junction and returned early when conditions changed.


      Mixed: The plan was complete but weather made the outing unsuitable, so participation remained untested
      rather than falsely completed.


      Contradictory: A shortcut damaged vegetation or the return limit was ignored to finish despite worsening
      conditions.


      Inconclusive: An equipment list was made without a specific route, current conditions, navigation
      check or return review.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
