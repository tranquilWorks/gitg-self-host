meaning_and_fit:
  purpose: Match a chosen outdoor activity to present capability, navigation, conditions and low-impact
    responsibilities rather than relying on enthusiasm or generic equipment lists.
  why_recommended: Match a chosen outdoor activity to present capability, navigation, conditions and low-impact
    responsibilities rather than relying on enthusiasm or generic equipment lists.
  claims:
  - statement: Match a chosen outdoor activity to present capability, navigation, conditions and low-impact
      responsibilities rather than relying on enthusiasm or generic equipment lists.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Outdoor competence and responsible recreation practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Outdoor competence and responsible recreation as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a seated park visit, accessible path, supported route or tabletop when
    conditions are unsuitable. Keep prescribed and assistive supports. Do not enter heat, cold, storms,
    unsafe terrain or water to create a challenge; qualified instruction is required for specialized environments
    and skills.
  opportunity_considerations: Choose a nearby permitted maintained path with a clear return point and
    an accessible alternative. Before choosing a date, use the actual land manager’s information for access,
    current conditions, rules and closures, plus an appropriate current weather source. Set a conservative
    return time and arrange suitable support or companionship where needed.
  prerequisites:
  - Choose a nearby permitted maintained path with a clear return point and an accessible alternative.
    Before choosing a date, use the actual land manager’s information for access, current conditions,
    rules and closures, plus an appropriate current weather source. Set a conservative return time and
    arrange suitable support or companionship where needed.
  dependencies: []
  safe_alternatives:
  - Use a seated park visit, accessible path, supported route or tabletop when conditions are unsuitable.
    Keep prescribed and assistive supports. Do not enter heat, cold, storms, unsafe terrain or water to
    create a challenge; qualified instruction is required for specialized environments and skills.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Outdoor competence and responsible recreation differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Outdoor competence and responsible
    recreation as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a nearby permitted maintained path with a clear return point and an accessible alternative.
    Before choosing a date, use the actual land manager’s information for access, current conditions,
    rules and closures, plus an appropriate current weather source. Set a conservative return time and
    arrange suitable support or companionship where needed. Goal: Match a chosen outdoor activity to present
    capability, navigation, conditions and low-impact responsibilities rather than relying on enthusiasm
    or generic equipment lists. Scope: The default is a short familiar maintained route or accessible
    park area, not remote travel, technical terrain, water entry or a test of survival skills. A planning
    exercise alone is not safe participation evidence. Time and effort: Twenty minutes of preparation,
    a short outing only when suitable and a fifteen-minute return review. Adaptation: Use a seated park
    visit, accessible path, supported route or tabletop when conditions are unsuitable. Keep prescribed
    and assistive supports. Do not enter heat, cold, storms, unsafe terrain or water to create a challenge;
    qualified instruction is required for specialized environments and skills. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a seated park visit, accessible path, supported route or tabletop when conditions
    are unsuitable. Keep prescribed and assistive supports. Do not enter heat, cold, storms, unsafe terrain
    or water to create a challenge; qualified instruction is required for specialized environments and
    skills.
  expected_burden: Twenty minutes of preparation, a short outing only when suitable and a fifteen-minute
    return review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Outdoor competence and responsible recreation protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Outdoor competence and responsible recreation action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a seated
    park visit, accessible path, supported route or tabletop when conditions are unsuitable. Keep prescribed
    and assistive supports. Do not enter heat, cold, storms, unsafe terrain or water to create a challenge;
    qualified instruction is required for specialized environments and skills.
  actions:
  - stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01-A1
    sequence: 1
    title: Match the plan to the least-supported real requirement
    instructions: 'Write route, start and return points, expected duration, access needs, communication
      limits and who knows the plan. Check terrain, weather, water and shade availability, daylight and
      local hazards through current authoritative information. Choose necessary clothing, water and other
      support appropriate to the actual setting without imposing a universal quantity. Set no-go and turn-back
      conditions in advance; uncertainty about an essential condition can mean choosing the accessible
      alternative or deferring.


      Observation checks: Route timing access and communication are explicit; Current land-manager and
      weather information are checked; Support matches the actual setting and participants; No-go and
      turn-back conditions are defined before departure. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01
      action_stable_id: PRACTICE-COMP-2605-OUTDOOR-COMPETENCE-AND-RESPONSIBLE-RECREATION-01-A1
      competency_stable_id: '26.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2605_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2605_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - route_timing_access_and_communication_are_explicit
        - current_land_manager_and_weather_information_are_checked
        - support_matches_the_actual_setting_and_participants
        - no_go_and_turn_back_conditions_are_defined_before_departure
      - measurement_id: c2605_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
