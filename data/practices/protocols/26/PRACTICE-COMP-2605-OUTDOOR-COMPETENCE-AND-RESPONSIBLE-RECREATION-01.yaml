      - [OpenLearn — Returning to STEM, Week 5, section 3.5](https://www.open.edu/openlearn/mod/oucontent/view.php?id=28143&section=3.5)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Sam and Jo reach J at 09:06. A park worker has just placed a closure sign on J–O because the surface
      has become unsafe. They check the map and do not take the closed pond branch. They turn back together
      at 09:08, reach E at 09:14 and send Pat the return message at 09:16; Pat acknowledges at 09:17.
      No overlook visit occurs. At E they identify the update as a reason to check the desk immediately
      before future departures as well as during planning. They report no impact beyond using the permitted
      path; this is not a measured ecological outcome.


      Compare planned and actual minutes, distinguish the two-minute junction pause from movement, and
      retain the untested overlook segment. The report contains no evidence about harder environments.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make the return part of the outing


      An outdoor plan is an agreement between a particular route, current conditions and the people using
      it. Carrying equipment is useful only when it fits those requirements and someone knows how to use
      it. Reaching a destination while ignoring a closure or the return limit is not competent completion.


      Use the complete fictional Alder Park file below. Allow twenty minutes to prepare, ten to review
      the later record and ten for checks. Paper or spoken notes are enough; no outdoor attempt is required.
      The output is a route decision, a return calculation and a review that separates preparation from
      participation. [NPS trip planning, S01](https://www.nps.gov/subjects/healthandsafety/trip-planning-guide.htm)
      supports checking current site information, matching capability and supplies, and maintaining a
      return contact. It does not clear this invented route or provide technical training.


      A worked example: an experienced walker brings familiar equipment but finds the usual bridge closed.
      Equipment does not cancel the closure. Choosing a permitted short alternative, telling the agreed
      contact and returning within the revised plan demonstrates judgment; crossing the barrier to finish
      the old route does not.


      ### Alder Park file A4


      Sam and Jo know the maintained level path and use their usual mobility supports. Both currently
      judge this familiar outing suitable. The fictional park desk confirms today''s path is open, conditions
      are mild and dry, and no relevant alert is active. The appropriate fictional weather report agrees.
      These stipulations are not a live forecast. If any essential confirmation is missing at a real departure,
      the plan needs another check or deferral.


      | Segment | One-way minutes | Current condition |

      | --- | ---: | --- |

      | Entrance E to signed junction J | 6 | Open, familiar level surface |

      | J to overlook O | 8 | Open, same surface |

      | J to pond P | 5 | Closed for repair; no entry |


      The permitted route reverses the same segments to return. No shortcut connects O to E. There is
      a bench at O; the optional pause lasts five minutes. Start is 09:00, latest return to E is 09:40,
      and the pair choose a conservative turnaround from wherever they are by 09:20. This is a case decision,
      not a universal safety margin. A staffed desk remains at E; reception beyond E is unreliable. Pat
      has agreed to expect a return message by 09:45 and to contact the park desk using the shared route
      plan if no message arrives. Emergency assistance takes precedence over that ordinary check-in schedule.


      Their familiar suitable clothing, personal supplies, water and needed supports have been checked
      for this short route; no universal quantity is prescribed. A paper map is available. The pair stay
      together, check J''s sign against the map, leave objects and plants alone, carry out their own waste
      and give other users room. No wildlife approach, collection, fire, water entry or technical terrain
      belongs in this exercise.


      ### Decide, then compare with the actual return


      1. Draw E–J–O with times in both directions and cross out the closed branch. Calculate the planned
      return including the bench pause. Write the contact arrangement, support checks and what would trigger
      earlier return: new closure, unsafe surface, changed weather, pain or unsuitable effort. An unknown
      essential condition is not a quiet yes.

      2. Save that plan before opening the [later packet](?resource=file-later-packet-md). Trace its actual
      timestamps. Identify the moment when continuing would have depended on ignoring new information.
      Check both arrival and the message; arriving privately does not notify Pat.

      3. Write a five-line return review: planned route/time, actual route/time, navigation decision,
      effect on place/other users, and one preparation improvement. Keep any untested segment explicit.
      Do not describe a shortened outing as full overlook completion.


      ### Extend capability without escalating risk


      For support, analyze the map with a reader, use a familiar seated park location, or retain a tabletop-only
      result. A live route needs actual current land-manager/weather information and individual access
      checks. Keep aids and assistance. Technical, remote or water activities need their own training
      and authorization; this small success grants none.


      For a harder paper variation, a delay reaches J at 09:18 and staff cannot confirm the overlook segment.
      Calculate a direct return, then explain why spare clock time cannot resolve an unknown route condition.
      On a later suitable ordinary outing, practice checking one junction and closing the return communication.
      Compare real effort and support needs before considering a modest change.


      A useful record may show an early return and good stewardship. A complete plan without an outing
      shows preparation only. Ignoring the closed pond path contradicts the purpose even if nobody is
      injured. Missing return information stays unresolved; a pleasant report does not fill it in.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A fresh route takes 7 minutes out and 7 back with a 4-minute pause, starting 10:10 and due back
      10:30. What return time is planned, and does two minutes of slack certify safety?


      2. At 09:18 the only onward path has unconfirmed conditions; the known return from J takes 6 minutes.
      What is the supported choice and projected return? No actual return record is supplied.


      3. A participant reaches the entrance at 09:14 but the promised message is unsent. Can the contact
      arrangement be marked complete?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. 10:28: 7 + 4 + 7 = 18 minutes. The two-minute margin is arithmetic, not clearance. Correct a
      safety claim by separately checking suitability, current conditions and return support.


      2. Return on the known suitable permitted route, projected 09:24, or seek staff assistance if that
      route is no longer suitable. The projection is not actual arrival. Correct any onward choice that
      treats spare time as evidence of open conditions.


      3. No. Physical return and communication are separate events. Send the agreed message when possible,
      retain its actual time, and never invent receipt. Correct the record rather than changing the original
      agreement retrospectively.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
