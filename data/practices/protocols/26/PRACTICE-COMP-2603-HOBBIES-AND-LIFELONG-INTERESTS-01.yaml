meaning_and_fit:
  purpose: Develop an enjoyable interest outside primary work through repeated participation, modest learning
    and an optional community connection without requiring prestige or monetization.
  why_recommended: Develop an enjoyable interest outside primary work through repeated participation,
    modest learning and an optional community connection without requiring prestige or monetization.
  claims:
  - statement: Develop an enjoyable interest outside primary work through repeated participation, modest
      learning and an optional community connection without requiring prestige or monetization.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Hobbies and lifelong interests practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Hobbies and lifelong interests as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible puzzles, listening, collecting observations, low-movement craft
    or another safe affordable form. No public group is necessary. Avoid hobbies involving gambling, hazardous
    equipment, unaffordable collecting or pressure to overcome pain or sensory limits.
  opportunity_considerations: Default to making and solving small original word puzzles on paper. Session
    one invents a five-word category puzzle, session two solves or improves it, session three tries a
    different category and session four shares a puzzle with a willing person or continues privately.
    Another safe accessible interest already available may replace this default with the same modest scope.
  prerequisites:
  - Default to making and solving small original word puzzles on paper. Session one invents a five-word
    category puzzle, session two solves or improves it, session three tries a different category and session
    four shares a puzzle with a willing person or continues privately. Another safe accessible interest
    already available may replace this default with the same modest scope.
  dependencies: []
  safe_alternatives:
  - Use accessible puzzles, listening, collecting observations, low-movement craft or another safe affordable
    form. No public group is necessary. Avoid hobbies involving gambling, hazardous equipment, unaffordable
    collecting or pressure to overcome pain or sensory limits.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Hobbies and lifelong interests differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Hobbies and lifelong interests
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to making and solving small original word puzzles on paper. Session one invents a five-word
    category puzzle, session two solves or improves it, session three tries a different category and session
    four shares a puzzle with a willing person or continues privately. Another safe accessible interest
    already available may replace this default with the same modest scope. Goal: Develop an enjoyable
    interest outside primary work through repeated participation, modest learning and an optional community
    connection without requiring prestige or monetization. Scope: Four sessions begin an interest; they
    do not prove lifelong commitment or require turning enjoyment into a profession. Changing or dropping
    an ill-fitting hobby is legitimate. Time and effort: Four fifteen-to-thirty-minute sessions over two
    weeks and a fifteen-minute review. Adaptation: Use accessible puzzles, listening, collecting observations,
    low-movement craft or another safe affordable form. No public group is necessary. Avoid hobbies involving
    gambling, hazardous equipment, unaffordable collecting or pressure to overcome pain or sensory limits.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible puzzles, listening, collecting observations, low-movement craft
    or another safe affordable form. No public group is necessary. Avoid hobbies involving gambling, hazardous
    equipment, unaffordable collecting or pressure to overcome pain or sensory limits.
  expected_burden: Four fifteen-to-thirty-minute sessions over two weeks and a fifteen-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Hobbies and lifelong interests protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Hobbies and lifelong interests action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    puzzles, listening, collecting observations, low-movement craft or another safe affordable form. No
    public group is necessary. Avoid hobbies involving gambling, hazardous equipment, unaffordable collecting
    or pressure to overcome pain or sensory limits.
  actions:
  - stable_id: PRACTICE-COMP-2603-HOBBIES-AND-LIFELONG-INTERESTS-01-A1
    sequence: 1
    title: Choose the interest for its experience rather than its image
    instructions: 'State what attracts you: curiosity, pleasure, identity, craft or company, and what
      you do not need from it, such as income, status or expert performance. Set a small time and cost
      limit and do the first session with existing materials. For the default, choose five words linked
      by a category and write a clue that permits more than a wild guess. Keep the result even if it is
      too easy or unclear.


      Observation checks: The chosen interest has a personal experiential reason; Time and cost limits
      precede equipment or status purchases; A first small session actually occurs; The result is kept
      without a mastery or prestige requirement. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2603-HOBBIES-AND-LIFELONG-INTERESTS-01
      action_stable_id: PRACTICE-COMP-2603-HOBBIES-AND-LIFELONG-INTERESTS-01-A1
      competency_stable_id: '26.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
