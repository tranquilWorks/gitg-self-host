meaning_and_fit:
  purpose: Encounter nature, science, art, sacred space or craftsmanship with sustained attention and
    let the encounter question a narrow self-centered perspective.
  why_recommended: Encounter nature, science, art, sacred space or craftsmanship with sustained attention
    and let the encounter question a narrow self-centered perspective.
  claims:
  - statement: Encounter nature, science, art, sacred space or craftsmanship with sustained attention
      and let the encounter question a narrow self-centered perspective.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Wonder and awe practice fit the person's current role,
    pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Wonder and awe as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use an accessible description, sound, tactile object, window view or familiar
    craft. Do not seek dangerous heights, overwhelming sensory conditions, substances or distress to produce
    awe. A secular, religious or uncertain interpretation can be legitimate without being imposed on others.
  opportunity_considerations: Choose an accessible public artwork, an ordinary natural pattern, an official
    science explanation or a safely observed example of skilled craft. Default to examining a leaf or
    a detailed image or description of one without removing it from a protected place. Set aside an optional
    device or task only when doing so preserves needed access and safety.
  prerequisites:
  - Choose an accessible public artwork, an ordinary natural pattern, an official science explanation
    or a safely observed example of skilled craft. Default to examining a leaf or a detailed image or
    description of one without removing it from a protected place. Set aside an optional device or task
    only when doing so preserves needed access and safety.
  dependencies: []
  safe_alternatives:
  - Use an accessible description, sound, tactile object, window view or familiar craft. Do not seek dangerous
    heights, overwhelming sensory conditions, substances or distress to produce awe. A secular, religious
    or uncertain interpretation can be legitimate without being imposed on others.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Wonder and awe differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Wonder and awe as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an accessible public artwork, an ordinary natural pattern, an official science explanation
    or a safely observed example of skilled craft. Default to examining a leaf or a detailed image or
    description of one without removing it from a protected place. Set aside an optional device or task
    only when doing so preserves needed access and safety. Goal: Encounter nature, science, art, sacred
    space or craftsmanship with sustained attention and let the encounter question a narrow self-centered
    perspective. Scope: The practice invites wonder but does not require a particular emotion, belief
    or psychological benefit. No travel, religious participation or intense experience is necessary. Time
    and effort: Twenty minutes of attentive encounter and a fifteen-minute reflection with one modest
    response. Adaptation: Use an accessible description, sound, tactile object, window view or familiar
    craft. Do not seek dangerous heights, overwhelming sensory conditions, substances or distress to produce
    awe. A secular, religious or uncertain interpretation can be legitimate without being imposed on others.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible description, sound, tactile object, window view or familiar craft.
    Do not seek dangerous heights, overwhelming sensory conditions, substances or distress to produce
    awe. A secular, religious or uncertain interpretation can be legitimate without being imposed on others.
  expected_burden: Twenty minutes of attentive encounter and a fifteen-minute reflection with one modest
    response.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Wonder and awe protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Wonder and awe action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    description, sound, tactile object, window view or familiar craft. Do not seek dangerous heights,
    overwhelming sensory conditions, substances or distress to produce awe. A secular, religious or uncertain
    interpretation can be legitimate without being imposed on others.
  actions:
  - stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01-A1
    sequence: 1
    title: Choose an encounter and suspend the demand to extract a result
    instructions: 'Name what you will attend to and why it lies outside your usual focus. Spend the first
      five minutes noticing scale, detail, pattern, skill or relationship without taking a selfie, making
      a ranking or demanding to feel moved. A quiet or neutral response is allowed. In a sacred or community
      space, verify visitor permission and conduct before entering and do not imitate a ritual merely
      to intensify the experience.


      Observation checks: The encounter has a specific object or setting; Initial attention is not organized
      around performance or display; Neutral response remains legitimate; Sacred community and access
      boundaries are respected. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01
      action_stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01-A1
      competency_stable_id: '26.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2609_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2609_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
