  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      In the supplied fiction, Noor calculates emission years 18 for A and 15 for B, then realizes simultaneous
      arrival does not mean simultaneous emission. Noor''s first note said “a light-year is a very long
      time”; the revised note calls it a distance and credits NASA''s explanation. Noor reports interest
      but no strong emotion. The next day Noor adds the source title and corrected unit to a personal
      study note; no public sharing, sky observation or change in ordinary duties occurs. The current
      states of A and B are still unknown.


      Identify the actual small response and the narrower question it supports. Do not substitute “felt
      awe” for the neutral report.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Give a question room to grow


      Wonder begins with attending to something long enough to notice that your first description was
      incomplete. Awe may follow, but it cannot be required. A quiet encounter that corrects an assumption
      is worthwhile even without chills, gratitude or a dramatic change of life.


      Allow five minutes of attention, ten of source study and ten of reflection, plus the fresh checks.
      The complete default is the scale description below, which can be read aloud. No telescope, travel,
      purchase, religious participation or looking at the Sun is involved. [NASA''s Cosmic Distances,
      S04](https://science.nasa.gov/solar-system/cosmic-distances/) explains astronomical distance units
      and light-travel delay. It supports the factual distinction here, not a promised emotional or therapeutic
      effect.


      Worked example: a person examines a neatly repaired seam and first calls it effortless. Looking
      again reveals aligned edges, a change of stitch near a corner and a concealed join. The person revises
      “effortless” to “skill whose preparation I did not see,” credits the maker and still knows little
      about the process. Wonder need not turn the maker into a superhuman figure.


      ### A complete scale encounter: the signal card


      Read this original description slowly: “A message travels from a lamp to a receiver. Nearby, arrival
      seems immediate. Move the receiver much farther away and the travel time matters. A distant light
      can tell you about an earlier event, not necessarily what its source is doing at the instant you
      receive it.” This is a conceptual description, not a home optics experiment.


      The accompanying source facts are deliberately few: a light-year measures distance, and NASA describes
      sunlight taking about eight minutes to reach Earth. Read the source for context; no direct solar
      observation is requested. In a separate invented signal model, light from source A takes 2 years
      to reach a receiver and light from B takes 5 years. Both signals arrive at the same labeled receiver
      time, year 20. The model uses a fixed shared clock, no expansion or relative motion, and no brightness
      information. It is a teaching simplification, not a claim about named stars.


      Before calculating, notice what is missing: source appearance, current state and any personal meaning.
      Write three details of the model, two questions and one initial association. An association such
      as “I am always seeing the past” is not itself a measured scientific or philosophical conclusion.


      ### Return to the object with one better distinction


      1. Attend for five minutes, or a shorter suitable period, using text, speech or tactile counters
      if useful. Keep communication aids. Record a neutral response if that is what occurs. Different
      entry points—art, a natural pattern, an authorized sacred space or skilled work—remain legitimate
      alternatives, with their own permissions and sources.

      2. Use the model to distinguish arrival time from emission time. Calculate both emission years,
      then separate facts, implications within the model and imaginative responses. Ask what observation
      would be needed to know either source''s current state rather than filling the gap with a feeling.

      3. Save the first note and read the [later packet](?resource=file-later-packet-md). Identify one
      changed question and one proportionate response actually made. An intention to become more grateful
      is different from crediting a source in a note or giving a familiar object another careful look.


      ### Perspective without a compulsory revelation


      Awe can widen attention, but an immense distance does not make ordinary responsibilities meaningless.
      Do not use the encounter to dismiss another person''s grief or demand that they feel small. Keep
      factual learning, personal meaning and action on separate lines. None is a dignity score.


      For support, use only the written model with two labeled counters, or have someone read it. For
      a harder case, both sources emit in year 18: calculate their different arrival years rather than
      assuming simultaneous reception. No observational equipment is needed. On a later real encounter
      with art, craft, nature or science, seek one trustworthy explanation for a noticed feature, credit
      it and return to the object. In a sacred space, follow the keepers'' actual invitation; access does
      not authorize imitation of ritual.


      A useful result may show greater attention and a revised question with no emotional change. An intense
      feeling without checking a mistaken unit leaves the mistake intact. A grand pledge with no follow-through
      does not establish renewed responsibility. The scale model can teach a distinction; it cannot prove
      humility, health benefit or ultimate metaphysical truth.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. Two model signals arrive in year 30 after 3 and 8 years of travel. When were they emitted, and
      do you know their sources are still unchanged?


      2. A participant carefully corrects a misconception but feels neutral. Has the exercise failed because
      awe was absent?


      3. After seeing an intricate carving online, someone calls it effortless and copies a restricted
      ceremonial form to intensify the feeling. What should be revised?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. Years 27 and 22 in this simplified model. Current states are not supplied. Correct the inference
      by separating old received information from an unknown present, and distance units from time intervals.


      2. No. Specific attention and an accurate revision are legitimate outputs. Preserve the neutral
      response. Correct a compulsory-emotion requirement rather than pressuring the participant to report
      wonder.


      3. Replace the effortless claim with acknowledged unknown preparation; seek maker/context information
      through appropriate sources. Online visibility does not authorize restricted reuse. Choose permitted
      attention or accurate credit instead of imitation.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
