        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01-A2
    sequence: 2
    title: Investigate one detail that exceeds the first impression
    instructions: 'Select one noticed feature and learn about it from an appropriate primary or expert
      source: how the pattern forms, what a technique requires or what the space means to its keepers.
      Separate the verified explanation from your imaginative association. Return attention to the object
      with that knowledge and record one new question rather than trying to convert the encounter into
      certainty about ultimate reality or another person’s superiority.


      Observation checks: One specific detail is investigated through an appropriate source; Explanation
      and personal association are distinguished; Attention returns to the encounter after learning; A
      new question is retained without a forced metaphysical or status conclusion. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01
      action_stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01-A2
      competency_stable_id: '26.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
