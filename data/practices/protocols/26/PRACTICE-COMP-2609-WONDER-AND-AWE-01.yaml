  - stable_id: PRACTICE-COMP-2609-WONDER-AND-AWE-01-A3
    sequence: 3
    title: Connect expanded perspective to a modest responsibility
    instructions: 'Describe whether attention, humility, gratitude or perspective changed, including no
      change or uncertainty. Choose one proportionate response, such as crediting a maker, respecting
      a place, thanking a willing teacher or giving a recurring ordinary thing more careful attention.
      Carry it out without turning the response into a grand life pledge. The encounter is not evidence
      that hardship is solved or that ordinary duties no longer matter.


      Observation checks: The actual response including neutrality is recorded honestly; One modest responsibility
      follows from the encounter; The response is actually carried out or marked pending; No healing transformation
      or escape from duties is claimed. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What became less centered on your own performance, and what small responsibility follows
      without exaggerating what the encounter did?


      Examples: Supportive: Learning how a familiar craft detail was made deepened attention and led to
      a specific acknowledgment of the maker rather than a claim of transformation.


      Mixed: The encounter stayed emotionally quiet but raised a useful question and a more careful way
      of attending.


      Contradictory: Risk or distress was deliberately intensified to force awe, or a sacred practice
      was used without permission as an experience product.


      Inconclusive: Awe was claimed from an impressive label without sustained attention, inquiry or an
      honest response.'
    expected_time: 15-25 minutes
