  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Sol offers line A once. Tavi replies, “Not landing today; can we just fix it?” Sol says, “Yes,”
      and stops without explaining. They begin the correction at 15:01, change 18:00 to 18:30, inspect
      the final notice together at 15:06 and send it at 15:07. The channel shows delivery at 15:08. The
      packet contains no recipient read receipt and no laughter. Tavi later says the correction was useful,
      not that the joke improved their mood.


      Record one attempted line, a respected request to stop and the completed correction/delivery. Do
      not invent emotional relief or audience readership. The next use of humor needs its own welcome.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Offer lightness without making someone smaller


      Humor can create a little room around a difficult task. It can also disguise a complaint, make a
      less powerful person the target or postpone a conversation that still needs to happen. The useful
      distinction is not whether a line is objectively funny, but whether this moment is welcome and the
      serious matter remains available.


      Allow fifteen minutes to consider the fictional exchange, ten for its later record and ten for checks.
      No performance or personal disclosure is required. [OpenLearn''s comedy introduction, S07](https://www.open.edu/openlearn/languages/the-language-comedy?trackno=6)
      identifies language and the construction of one-liners as objects of study. Only its written introduction
      was inspected; no unseen performance or research result supports an effect claim here.


      Worked example: two willing people sorting a drawer call a bent paperclip “director of complicated
      attachments.” The target is a harmless object. When one says they would rather finish quietly, stopping
      preserves the connection better than explaining why the line deserved a laugh. Delight in an absurd
      image can remain private.


      ### Three possible lines and one unfinished task


      In the fictional case, Sol and Tavi share equal responsibility for a community notice. At 15:00
      they discover that the printed start time is wrong. A corrected notice must be sent by 15:10. Tavi
      says, “I could use one small silly line, then let''s fix the time.” That invitation is specific,
      brief and revocable. It is not permission to joke about Tavi''s mistakes, identity, body or private
      life, or to post the exchange.


      Choose among these complete original lines:


      - A: “This clock has applied for a transfer to yesterday.”

      - B: “Only someone as useless as you could get a time wrong.”

      - C: “Why bother fixing it? Let''s pretend time is optional.”


      A uses impossible behavior by an object. B humiliates a person; equal role status would not make
      cruelty acceptable. C could become avoidance if it replaces the correction. Even A may not land.
      No one owes amusement simply because the target seemed harmless.


      The agreed work sequence reserves 15:00–15:01 for a brief line and response, 15:01–15:06 to correct
      and check the start time, and 15:06–15:08 to send and confirm the revised notice. The actual correct
      time is 18:30; the wrong draft says 18:00. The sender must inspect the corrected artifact and record
      the send result; saying “we handled it” is insufficient.


      ### Try once, then honor the response


      1. Name the welcome, the proposed target and the serious issue. Select or replace a line with harmless
      situational absurdity. Write the promised return point before reading the outcome. In a crisis,
      active harm or unwanted conflict, prioritize the person''s stated needs rather than introducing
      humor as a technique.

      2. Use the [later packet](?resource=file-later-packet-md) as a fictional response, not an instruction
      to tell a real person the joke. Identify the exact point at which more explanation would turn an
      offer into pressure. Retain the actual reaction without changing a neutral response into laughter.

      3. Verify the return to the notice. Record timing, target and context, then decide whether to repeat
      this approach, ask differently or leave humor aside. A successful correction is not evidence the
      joke caused relief; a laugh would not mean the serious issue was resolved.


      ### More than verbal performance


      Wordplay, signed or visual humor, affectionate surprise and quiet enjoyment of an ordinary absurdity
      can all be routes. Describe a visual element when that supports access; never assume a language
      pun transfers across languages or cultures. No public recording or humor score is needed. A supported
      rehearsal can inspect the line and its power relationship without any live exchange.


      For a harder case, Sol is Tavi''s supervisor. Now a polite smile is especially weak evidence of
      welcome; an employee may not feel free to object. Choose a low-pressure moment or no joke, and make
      the work request clear without disguising criticism as fun.


      Later transfer is one welcome brief exchange with the actual response respected and any promised
      serious follow-up performed. In grief or illness, private delight may coexist with sorrow, but nobody
      needs to cheer up for another person''s comfort. The guide can improve attention to timing and repair;
      it does not claim humor therapy, universal taste or proof that hardship has ended.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A person smiles politely after their supervisor jokes about their error. Does the smile establish
      free enjoyment or permission to repeat it?


      2. A harmless object joke receives a neutral response and “please stop.” Is explaining the punch
      line a necessary repair?


      3. A laugh occurs at 15:00, but a promised deadline correction remains unsent at 15:10. Can the
      pleasant exchange close the serious task?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
