meaning_and_fit:
  purpose: Help a willing group mark something worth remembering through inclusive participation, gratitude
    and a manageable shared form.
  why_recommended: Help a willing group mark something worth remembering through inclusive participation,
    gratitude and a manageable shared form.
  claims:
  - statement: Help a willing group mark something worth remembering through inclusive participation,
      gratitude and a manageable shared form.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Communal festivity and celebration practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Communal festivity and celebration as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible call, messages, a quiet ritual or a small family or neighborhood
    form already welcomed by participants. Respect grief, fatigue, sobriety, disability and different
    beliefs. Celebration can be simple and need not erase serious unfinished responsibilities.
  opportunity_considerations: Default to marking the completion of a shared small project with two or
    more willing people. Offer a fifteen-minute exchange in which each may name one appreciated contribution,
    hear a short shared memory and choose a harmless game or music moment. Food, alcohol, gifts, public
    photos and attendance are not required.
  prerequisites:
  - Default to marking the completion of a shared small project with two or more willing people. Offer
    a fifteen-minute exchange in which each may name one appreciated contribution, hear a short shared
    memory and choose a harmless game or music moment. Food, alcohol, gifts, public photos and attendance
    are not required.
  dependencies: []
  safe_alternatives:
  - Use an accessible call, messages, a quiet ritual or a small family or neighborhood form already welcomed
    by participants. Respect grief, fatigue, sobriety, disability and different beliefs. Celebration can
    be simple and need not erase serious unfinished responsibilities.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Communal festivity and celebration differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Communal festivity and celebration
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default to marking the completion of a shared small project with two or more willing people.
    Offer a fifteen-minute exchange in which each may name one appreciated contribution, hear a short
    shared memory and choose a harmless game or music moment. Food, alcohol, gifts, public photos and
    attendance are not required. Goal: Help a willing group mark something worth remembering through inclusive
    participation, gratitude and a manageable shared form. Scope: One modest celebration can create an
    opportunity for belonging; it does not guarantee joy, require spending or authorize using another
    person’s milestone or story without consent. Time and effort: Twenty minutes of preparation, a short
    agreed gathering or asynchronous exchange and a fifteen-minute review. Adaptation: Use an accessible
    call, messages, a quiet ritual or a small family or neighborhood form already welcomed by participants.
    Respect grief, fatigue, sobriety, disability and different beliefs. Celebration can be simple and
    need not erase serious unfinished responsibilities. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible call, messages, a quiet ritual or a small family or neighborhood
    form already welcomed by participants. Respect grief, fatigue, sobriety, disability and different
    beliefs. Celebration can be simple and need not erase serious unfinished responsibilities.
  expected_burden: Twenty minutes of preparation, a short agreed gathering or asynchronous exchange and
    a fifteen-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Communal festivity and celebration protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Communal festivity and celebration action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    call, messages, a quiet ritual or a small family or neighborhood form already welcomed by participants.
    Respect grief, fatigue, sobriety, disability and different beliefs. Celebration can be simple and
    need not erase serious unfinished responsibilities.
  actions:
  - stable_id: PRACTICE-COMP-2610-COMMUNAL-FESTIVITY-AND-CELEBRATION-01-A1
    sequence: 1
    title: Agree on what is being marked and who can participate
    instructions: 'Ask the people involved whether and how they want the event marked. State the meaning,
      a modest time and cost limit, and access or cultural needs such as quiet, food restrictions, religious
      boundaries or remote participation. Offer a dignified decline and a way to contribute asynchronously.
      Do not surprise someone with public recognition, disclose a private milestone or assume a feast
      or expensive outing is the only genuine celebration.


      Observation checks: The meaning and desire for celebration are confirmed; Time cost and access needs
      are considered; Declining or participating differently remains dignified; No private milestone or
      story is publicized without permission. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2610-COMMUNAL-FESTIVITY-AND-CELEBRATION-01
      action_stable_id: PRACTICE-COMP-2610-COMMUNAL-FESTIVITY-AND-CELEBRATION-01-A1
      competency_stable_id: '26.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
