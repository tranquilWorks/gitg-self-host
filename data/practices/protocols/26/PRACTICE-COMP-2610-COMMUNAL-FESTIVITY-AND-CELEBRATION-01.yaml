  - stable_id: PRACTICE-COMP-2610-COMMUNAL-FESTIVITY-AND-CELEBRATION-01-A2
    sequence: 2
    title: Carry out one shared form with room for different responses
    instructions: 'Host the agreed brief exchange. Invite, rather than require, one appreciation or memory
      from each person and include the small chosen playful or musical element. Keep contributions voluntary
      and credit less visible work as well as the most prominent roles. Notice practical barriers and
      adjust without turning the gathering into a feedback workshop. No one must perform happiness, disclose
      emotion or consume something to belong.


      Observation checks: The agreed celebration actually occurs; Appreciation memory and a shared enjoyable
      form are offered; Less visible contributions receive consideration; No forced emotion disclosure
      consumption or performance is required. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
