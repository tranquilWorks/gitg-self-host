  - stable_id: PRACTICE-COMP-2610-COMMUNAL-FESTIVITY-AND-CELEBRATION-01-A3
    sequence: 3
    title: Preserve a welcome memory and check the burden
    instructions: 'Afterward, ask one optional question about what felt meaningful or excluding and compare
      the actual burden with the plan. Preserve a short consensual memory, such as a shared phrase or
      private note, only with permission. Decide what to repeat or simplify next time. A mixed response
      remains visible; the existence of an event or photo is not proof that everyone felt belonging.


      Observation checks: Meaning and exclusion can both appear in the review; Actual effort and cost
      are compared with the plan; Any preserved memory has appropriate consent; The next celebration is
      revised from experience rather than spectacle pressure. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: What made the occasion feel shared rather than staged, and which barrier or burden
      should be removed next time?


      Examples: Supportive: The group marked the project with brief appreciation and a free game, including
      an asynchronous contribution from someone unable to attend.


      Mixed: The gathering was welcome but too long for one participant, so the next plan shortened it.


      Contradictory: Someone’s private milestone was announced without consent or costly consumption was
      made a condition of belonging.


      Inconclusive: A celebration was planned or photographed without a shared meaning, actual participation
      or consideration of burden.'
