  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Mark a shared good without making a spectacle


      Celebration gives a group a form for saying that something mattered. The form can be a feast, holiday,
      dance, game, music or ceremony; the essential choice is what this willing group wants to mark and
      who would bear the work. A small occasion is not a lesser substitute for an expensive one. Attendance,
      food and public happiness should not be entrance fees for belonging.


      Use the fictional completion gathering below. Allow twenty minutes to plan, ten for the later account
      and ten for checks. No hosting, spending or personal disclosure is required. [W3C event accessibility
      guidance, S05](https://www.w3.org/WAI/teach-advocate/accessible-presentations/) supports advance
      access planning and information available through suitable modes. The supplied event is not a compliance
      audit or a promise that every format fits everyone.


      Worked example: after finishing a shared shelf, a group proposes a restaurant dinner. One member
      cannot afford it and another does not want public recognition. A brief private thank-you with no
      purchase and an optional written contribution can preserve the meaning. Calling the restaurant “optional”
      while giving all recognition there would not remove the barrier.


      ### The completed reading-corner project


      Five fictional adults—Bea, Chen, Deni, Eli and Fran—have finished sorting a shared room''s books.
      Bea and Chen sorted; Deni labeled; Eli arranged access; Fran checked the catalog from home. All
      agree the work may be marked privately. None consents to public names or photographs. Fran wants
      an asynchronous text contribution. Eli needs a clear route and a seat. Chen asks for no background
      music. Deni prefers to listen rather than speak. Bea can host but has only twenty minutes including
      setup and cleanup. All already have the needed room, chairs and a text channel; budget is zero.


      The group agrees to a fifteen-minute occasion at 17:00. Setup takes three minutes and cleanup two.
      There is no food, gift, alcohol or costume requirement. The optional playful element is a one-sentence
      imaginary title for an ordinary object: “The chair that applied for annual leave.” People may offer
      another, read one, listen or pass. A holiday or religious form is not borrowed to make this invented
      occasion feel important.


      Proposed sequence: two minutes to welcome people and name the shared work; four for optional appreciations
      including Fran''s approved text; five for the playful element; two for a short shared memory; two
      to thank everyone and end. Keep the agreed access route clear and offer the text of spoken contributions
      when participants want that mode. Do not turn access requests into a request for diagnoses.


      ### Protect the meaning and the actual burden


      1. Write an invitation giving purpose, time, cost, participation modes, no-photo boundary and a
      dignified decline. Check the fifteen-minute sequence against Bea''s entire twenty-minute burden.
      Draft one appreciation for each contribution without ranking people by visibility.

      2. Save the plan, then read the [later packet](?resource=file-later-packet-md). Identify what actually
      happened and whether the planned private memory was authorized. A photograph would not prove belonging
      even if one existed.

      3. Review the optional feedback and actual preparation/cleanup time. Keep a mixed response. Decide
      one feature to repeat and one to simplify, without promising that every participant will feel joy
      next time.


      ### Reuse a form, not someone else''s obligation


      For support, use the supplied account only, shorten the live occasion with agreement or offer written
      participation. A feast can fit another group when dietary, financial, cultural, labor and access
      needs are genuinely addressed. Dance or music needs willing participation and suitable volume/movement;
      neither is required here. A private ceremony needs permission for the milestone or story being honored.


      For a harder variation, Fran withdraws permission for the text before the occasion. Remove it even
      if the program is already printed; acknowledge remote work only within the remaining agreement.
      Do not ask why as a condition of respecting the withdrawal.


      At a later actual small celebration, confirm the invitation and access first, then record only consented
      minimal facts about what was marked and the burden. Let someone decline praise or leave early without
      turning that into a character judgment. The event can create an opportunity for gratitude and memory;
      it cannot certify that every person felt included.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A host has 18 minutes total; setup takes 4, the proposed occasion 13 and cleanup 3. Does it fit,
      and what can change?


      2. One person attends silently and declines the optional feedback question. Can the host count their
      enjoyment as confirmed?


      3. A remote contributor approved a private reading but not posting. Does unanimous enthusiasm from
      the people in the room authorize public sharing?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No: 20 minutes exceeds the limit by two. Negotiate a shorter occasion or genuinely agreed help/time;
      do not silently assign cleanup to someone else. Protect the access and consent arrangements while
      simplifying.


      2. No. Attendance and a legitimate pass are known; enjoyment is unknown. Correct the report to preserve
      that distinction without pursuing a compulsory explanation.


      3. No. Others cannot enlarge that person''s permission. Keep the contribution within the approved
      private scope, seek separate appropriate consent if needed, or omit it. Enthusiasm is not authorization.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
