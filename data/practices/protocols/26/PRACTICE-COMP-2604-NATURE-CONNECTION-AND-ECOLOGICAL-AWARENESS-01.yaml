      2. Keep the time-of-day difference visible as a plausible reason for changed light. Do not call
      that observation alone a seasonal or ecological change; compare conditions and seek further evidence
      if needed.

      3. One specific responsible action occurred within the supplied permitted setting. Lasting behavior
