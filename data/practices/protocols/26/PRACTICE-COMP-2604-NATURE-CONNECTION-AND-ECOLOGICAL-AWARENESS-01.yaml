meaning_and_fit:
  purpose: Notice seasons, weather, land, living things and human dependence through regular contact with
    one accessible place rather than treating nature as an interchangeable backdrop.
  why_recommended: Notice seasons, weather, land, living things and human dependence through regular contact
    with one accessible place rather than treating nature as an interchangeable backdrop.
  claims:
  - statement: Notice seasons, weather, land, living things and human dependence through regular contact
      with one accessible place rather than treating nature as an interchangeable backdrop.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Nature connection and ecological awareness practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Nature connection and ecological awareness as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a window, accessible garden, soundscape or approved virtual observation
    project when outdoor access is limited. A virtual view can support attention but should not be called
    a physical visit. Follow current weather, access and health constraints and do not disclose sensitive
    wildlife locations publicly.
  opportunity_considerations: Choose a safe permitted view of a tree, planted area, courtyard or patch
    of sky, including a window view. Use the same observation point where practical. Prepare headings
    for weather, light, land or surface, plants, animals or their absence, and human influence. Do not
    touch, feed, collect or approach wildlife to obtain a better observation.
  prerequisites:
  - Choose a safe permitted view of a tree, planted area, courtyard or patch of sky, including a window
    view. Use the same observation point where practical. Prepare headings for weather, light, land or
    surface, plants, animals or their absence, and human influence. Do not touch, feed, collect or approach
    wildlife to obtain a better observation.
  dependencies: []
  safe_alternatives:
  - Use a window, accessible garden, soundscape or approved virtual observation project when outdoor access
    is limited. A virtual view can support attention but should not be called a physical visit. Follow
    current weather, access and health constraints and do not disclose sensitive wildlife locations publicly.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Nature connection and ecological awareness differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Nature connection and ecological
    awareness as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a safe permitted view of a tree, planted area, courtyard or patch of sky, including a
    window view. Use the same observation point where practical. Prepare headings for weather, light,
    land or surface, plants, animals or their absence, and human influence. Do not touch, feed, collect
    or approach wildlife to obtain a better observation. Goal: Notice seasons, weather, land, living things
    and human dependence through regular contact with one accessible place rather than treating nature
    as an interchangeable backdrop. Scope: Three observations support place-specific attention, not ecological
    expertise or a claim that nature contact treats a health condition. Identification uncertainty and
    access limits are expected. Time and effort: Three ten-minute observations over one or two weeks and
    a fifteen-minute comparison. Adaptation: Use a window, accessible garden, soundscape or approved virtual
    observation project when outdoor access is limited. A virtual view can support attention but should
    not be called a physical visit. Follow current weather, access and health constraints and do not disclose
    sensitive wildlife locations publicly. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a window, accessible garden, soundscape or approved virtual observation project
    when outdoor access is limited. A virtual view can support attention but should not be called a physical
    visit. Follow current weather, access and health constraints and do not disclose sensitive wildlife
    locations publicly.
  expected_burden: Three ten-minute observations over one or two weeks and a fifteen-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Nature connection and ecological awareness protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Nature connection and ecological awareness action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a window,
    accessible garden, soundscape or approved virtual observation project when outdoor access is limited.
    A virtual view can support attention but should not be called a physical visit. Follow current weather,
    access and health constraints and do not disclose sensitive wildlife locations publicly.
  actions:
  - stable_id: PRACTICE-COMP-2604-NATURE-CONNECTION-AND-ECOLOGICAL-AWARENESS-01-A1
    sequence: 1
    title: Notice the place before trying to name everything
    instructions: 'At the first visit or window observation, record what is actually visible, audible
      or available through an accessible description. Note the date, approximate conditions and three
      specific details, such as leaf movement, shade position or water on a surface. Write unknown rather
      than guessing a species. Identify one human dependence on the place, such as shade, drainage, food
      production or shared space, without claiming a measured benefit.


      Observation checks: A consistent safe observation point is chosen; Three concrete details and conditions
      are recorded; Unknown identification remains unknown; One human dependence is considered without
      an unsupported measurement. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2604-NATURE-CONNECTION-AND-ECOLOGICAL-AWARENESS-01
      action_stable_id: PRACTICE-COMP-2604-NATURE-CONNECTION-AND-ECOLOGICAL-AWARENESS-01-A1
      competency_stable_id: '26.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
