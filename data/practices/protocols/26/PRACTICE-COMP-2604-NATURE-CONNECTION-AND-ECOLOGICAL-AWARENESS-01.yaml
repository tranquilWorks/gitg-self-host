  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction. Open after saving your first attempt. These invented events and responses
      are not actual participant evidence.


      ### Two returns and one completed route choice


      **Visit N2 — April 13, about 08:00, ten minutes.** From the same window after rain, Lena sees dark
      paving and a small puddle near the planted edge. The cactus has the same visible ribbed outline
      and no flowers are seen. One small bird briefly crosses the view; its species is unknown. The drainage
      opening is visible, but flow through it is not observed.


      **Visit N3 — April 17, about 16:00, ten minutes.** From the same window, the paving appears dry
      and the shadow lies in a different direction. No animal is observed in the ten-minute window. The
      cactus''s visible outline appears unchanged. The different time of day limits any comparison of
      shadow direction with the morning records.


      The three visits span seven days. The record contains weather-related surface differences, changing
      light, one brief animal observation and several unchanged or absent observations. It does not establish
      a plant-health diagnosis, species identity, drainage performance, seasonal trend or ecosystem condition.


      Lena realizes that the paved route clearly separates ordinary passage from the planted edge. On
      the next ordinary trip through the permitted courtyard that day, Lena actually uses the paved route
      instead of the diagonal shortcut. That is the supplied completed response. No plants are moved,
      no wildlife is disturbed and no measured ecological improvement is claimed.


      The flowering question remains bounded: the NPS seasonal account gives reasons not to interpret
      an early lack of visible flowers as proof of illness, but the courtyard cactus remains unidentified.
      A future return may deepen familiarity; it has not yet occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: 'Observe one safe permitted place three times over one or two weeks. Allow ten minutes per observation
      and fifteen minutes to compare the records. A window view is sufficient. The task is to make a particular
      place more familiar without disturbing it, then carry out one modest responsible response within
      your control.


      ### Notice before naming


      A species name can be useful, but it is not a prerequisite for attention. Record what is actually
      visible, audible or available through an accessible description. “An upright cactus with vertical
      ribs; species unknown” is more accurate than a confident guess. An animal not seen during ten minutes
      is absent from the observation, not necessarily absent from the place.


      Repeated visits help distinguish a fleeting impression from a pattern worth investigating. They
      also introduce differences in weather, time and viewpoint. A shadow that falls elsewhere in the
      afternoon does not by itself show a seasonal ecological change. Three short observations cannot
      establish ecosystem health, a climate trend or the cause of a plant''s condition.


      The National Park Service''s [Saguaro Flower Power Project, S12](https://www.nps.gov/sagu/getinvolved/saguaro-flower-power-project.htm)
      describes study of seasonal flowering and differences among years. It provides local natural-history
      context for a question in this fictional Tucson case. It does not identify the observed cactus or
      certify the courtyard''s condition. The page''s old volunteer invitation is not treated as a current
      opportunity, and its field equipment is not part of this exercise.


      ### Supplied place file N9


      A fictional observer, Lena, uses the same permitted indoor window overlooking a Tucson courtyard.
      Visible features include an upright columnar cactus of unknown species, a planted edge, a paved
      route and a drainage opening. The window permits a clear view without approaching plants or wildlife.
      No sensitive wildlife location is disclosed.


      The intended headings are weather and light, surface or land, plants, animals or their absence,
      and human influence. Each record needs at least three particular details, not an inventory of everything.
      Approximate conditions are observations in the fictional case, not retrieved current weather data.
      Keep the same vantage point where practical and name a changed time or route.


      **Visit N1 — April 10, about 08:00, ten minutes.** The paving appears dry. A long shadow lies to
      the left of the cactus. Vertical ribs are visible, but Lena cannot identify the species. No animal
      is observed during the window. The paved route follows the planted edge and leads past the drainage
      opening.


      The three concrete details are dry paving, the shadow''s position and the cactus ribs. They do not
      require touching the plant or moving closer. A possible human dependence is already visible: the
      courtyard layout channels movement and water, while shade may affect comfort. No drainage capacity,
      cooling effect or ecological benefit is measured.


      Lena''s initial question is, “If I see no flowers during these visits, does that mean the cactus
      is unhealthy?” That question contains assumptions about identity, season and what can be seen from
      the window. It is better to investigate those assumptions than to invent a health judgment from
      a missing flower.


      ### Use a local source for a narrow question


      The NPS page describes flowering phenology—seasonal timing of recurring life events—and a saguaro
      project covering 2017–23. It describes bloom timing commonly beginning in late April and peaking
      later, with differences among years. That context makes a simple “no flowers means unhealthy” conclusion
      especially weak during this supplied early-April observation period.


      The plant remains unidentified. Even if it were a saguaro, a short view without flowers would not
      establish its health. A reliable identification, longer relevant observation and appropriate local
      knowledge would be needed for a stronger claim. No plant-care action is justified here on the basis
      of the question alone.


      The source also situates the cactus within an ecological and cultural setting. Reading about a practice
      or seasonal harvest does not authorize a visitor to collect anything. This exercise involves no
      feeding, touching, picking, collecting or wildlife approach. Respecting a place includes respecting
      limits on what a brief visitor knows and may do.


      ### Return twice and retain uneventful observations


      Use the [later packet](?resource=file-later-packet-md) for visits N2 and N3 before writing the comparison.
      The second follows rain; the third is later in the day. Those differences matter. A puddle after
      rain and a moved shadow need not mean that the ecosystem has deteriorated or improved.


      Compare what changed, what did not visibly change and what remains unknown. No animal observed on
      two occasions is a valid record. Do not feed a bird, shake a branch or manipulate a plant to create
      an interesting event. Wonder or gratitude may arise but is not required for the observation to be
      legitimate.


      Notice human relations to the site as well as plants and animals. A route may protect a planted
      edge while allowing access. A drainage opening may be part of water management, even though its
      performance has not been measured. Recognizing dependence is different from assigning an invented
      benefit number to it.


      ### Let one observation change an ordinary action


      In the supplied case, Lena previously took a short diagonal across the planted edge when passing
      through the courtyard. The repeated view makes the separate paved route and planted area more apparent.
      A fitting response is to use the existing paved route, without altering plants, redesigning drainage
      or entering an area without permission.


      The planned response must actually occur to be reported as action. A statement that “I will respect
      nature more” is too broad to inspect, while a chosen route taken on one ordinary trip has a clear
      scope. That one event still cannot establish habitat recovery or a lasting habit. Preserve the difference
      between a responsible action and its unmeasured ecological effect.


      1. Choose a safe permitted observation point and record the first occasion''s date, conditions and
      at least three details. Mark identification uncertainty.

      2. Return twice over one or two weeks. Keep time, weather and viewpoint differences visible; absence
      and no visible change are valid findings.

      3. Investigate one question through an appropriate official local resource. Name what the source
      can establish and what remains unknown about your particular place.

      4. Compare all three records and identify something previously missed about the place or human dependence
      on it.

      5. Carry out one permitted response within your control, or mark it unperformed. Do not inflate
      its emotional or ecological outcome.


      For support, use the supplied records or an accessible description as preparation, clearly distinguished
      from an actual personal visit. A window, accessible garden, soundscape or approved virtual observation
      can support attention; a virtual view is not a physical visit. For a harder comparison, identify
      which apparent differences could follow simply from time of day and what further observation would
      help. Follow actual local access, weather and health constraints when making a real visit.


      The result can show repeated place-specific attention and one bounded response. It does not prove
      ecological expertise, a health treatment effect or a required emotional relationship with nature.


      ### Use the result at its proper scale


      Capacity, access and context still govern whether to attempt this practice. Fiction and no attempt
      are legitimate. Human dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
