  - stable_id: PRACTICE-COMP-2604-NATURE-CONNECTION-AND-ECOLOGICAL-AWARENESS-01-A2
    sequence: 2
    title: Return twice and distinguish change from a different viewpoint
    instructions: 'Repeat the observation on two later occasions. Compare light, weather, living activity
      and human use while noting any changed time or vantage point. Record absence and no visible change
      as valid results; do not provoke an animal or manipulate a plant to make the record interesting.
      Use one official local natural-history or land-manager resource to investigate a question, and retain
      a tentative identification when the evidence is insufficient.


      Observation checks: Two later observations occur without disturbing the place; Context differences
      are separated from possible ecological change; Absence and unchanged conditions are retained; One
      question is investigated through an appropriate source with uncertainty intact. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
