meaning_and_fit:
  purpose: Choose an experience that extends current capability through preparation, uncertainty and adaptation
    while keeping real risk proportionate.
  why_recommended: Choose an experience that extends current capability through preparation, uncertainty
    and adaptation while keeping real risk proportionate.
  claims:
  - statement: Choose an experience that extends current capability through preparation, uncertainty and
      adaptation while keeping real risk proportionate.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Adventure and calculated challenge practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Adventure and calculated challenge as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible indoor route, supported outing or another ordinary novelty
    with a safe retreat. A tabletop rehearses preparation but not the real attempt. Trauma, panic, severe
    anxiety or dangerous settings require appropriate qualified support rather than self-directed escalation.
  opportunity_considerations: Choose a new section of a familiar public library, museum or maintained
    park with staff or a clear support route, verified accessibility and an easy return. The task is to
    locate one permitted destination using the official map and return, asking for help when needed. No
    remote travel, climbing, water entry or hazardous equipment is involved.
  prerequisites:
  - Choose a new section of a familiar public library, museum or maintained park with staff or a clear
    support route, verified accessibility and an easy return. The task is to locate one permitted destination
    using the official map and return, asking for help when needed. No remote travel, climbing, water
    entry or hazardous equipment is involved.
  dependencies: []
  safe_alternatives:
  - Use an accessible indoor route, supported outing or another ordinary novelty with a safe retreat.
    A tabletop rehearses preparation but not the real attempt. Trauma, panic, severe anxiety or dangerous
    settings require appropriate qualified support rather than self-directed escalation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Adventure and calculated challenge differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Adventure and calculated challenge
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a new section of a familiar public library, museum or maintained park with staff or a
    clear support route, verified accessibility and an easy return. The task is to locate one permitted
    destination using the official map and return, asking for help when needed. No remote travel, climbing,
    water entry or hazardous equipment is involved. Goal: Choose an experience that extends current capability
    through preparation, uncertainty and adaptation while keeping real risk proportionate. Scope: The
    default is unfamiliar wayfinding in a safe public setting, not clinical exposure, dangerous adventure
    or a test of toughness. A challenge may be declined when conditions do not fit. Time and effort: Twenty
    minutes to prepare, a thirty-minute or shorter attempt and a fifteen-minute debrief. Adaptation: Use
    an accessible indoor route, supported outing or another ordinary novelty with a safe retreat. A tabletop
    rehearses preparation but not the real attempt. Trauma, panic, severe anxiety or dangerous settings
    require appropriate qualified support rather than self-directed escalation. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible indoor route, supported outing or another ordinary novelty with
    a safe retreat. A tabletop rehearses preparation but not the real attempt. Trauma, panic, severe anxiety
    or dangerous settings require appropriate qualified support rather than self-directed escalation.
  expected_burden: Twenty minutes to prepare, a thirty-minute or shorter attempt and a fifteen-minute
    debrief.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Adventure and calculated challenge protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Adventure and calculated challenge action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    indoor route, supported outing or another ordinary novelty with a safe retreat. A tabletop rehearses
    preparation but not the real attempt. Trauma, panic, severe anxiety or dangerous settings require
    appropriate qualified support rather than self-directed escalation.
  actions:
  - stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01-A1
    sequence: 1
    title: Define the worthwhile challenge and objective limits
    instructions: 'State what is new, why it is worth trying and what preparation is needed. Verify opening,
      access, route, current conditions and support availability. Choose a time limit, a return point
      and explicit stop conditions such as lost access, worsening weather, pain, threat or excessive distress.
      Distinguish discomfort with novelty from a real hazard; neither should be dismissed, and needed
      supports remain part of competent preparation.


      Observation checks: Novelty and worthwhile purpose are explicit; Access conditions and support are
      verified; Time return and stop conditions are set in advance; Real hazards and required supports
      are not reframed as weakness. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01
      action_stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01-A1
      competency_stable_id: '26.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2608_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2608_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - novelty_and_worthwhile_purpose_are_explicit
        - access_conditions_and_support_are_verified
        - time_return_and_stop_conditions_are_set_in_advance
        - real_hazards_and_required_supports_are_not_reframed_as_weakness
      - measurement_id: c2608_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2608_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01-A2
    sequence: 2
    title: Attempt the route and adapt to an ordinary uncertainty
    instructions: 'Use the official information to reach the selected destination within the agreed limits.
      At a confusing junction, pause safely, check the map or ask staff rather than continuing to prove
      independence. Record one point at which the plan needed adjustment, even if the adjustment was simply
      confirming a sign. Turn back when a stop condition occurs; a responsible return can be the correct
      outcome, not failure of courage.


      Observation checks: A real bounded attempt or honest deferral is recorded; Wayfinding uses appropriate
      information and support; An uncertainty produces a deliberate adaptation; Stop conditions can lead
      to turning back without shame. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01
      action_stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01-A2
      competency_stable_id: '26.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c2608_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c2608_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_real_bounded_attempt_or_honest_deferral_is_recorded
        - wayfinding_uses_appropriate_information_and_support
        - an_uncertainty_produces_a_deliberate_adaptation
        - stop_conditions_can_lead_to_turning_back_without_shame
      - measurement_id: c2608_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c2608_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-2608-ADVENTURE-AND-CALCULATED-CHALLENGE-01-A3
    sequence: 3
    title: Debrief preparation capability and the next boundary
    instructions: 'Compare expected and actual difficulty, useful preparation, assistance and any risk
      you had underestimated. Identify one capability gained or still untested and one change for a future
      attempt. Do not escalate immediately to prove the challenge counted. Choose repeat, a small next
      step, rest or stop according to the evidence, and keep this experience distinct from competence
      in dangerous or technical environments.


      Observation checks: Expected and actual difficulty are compared; Support and underestimated risk
      are acknowledged; A specific capability and next preparation change are named; Escalation is not
      automatic or used as proof of courage. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Where did you adapt instead of forcing the plan, and what does that show about the
      right size of the next challenge?


      Examples: Supportive: The person used the map, asked staff at a confusing junction and returned
      within the limit, gaining a specific wayfinding lesson.


      Mixed: Access changed and the attempt was shortened; preparation was useful but the destination
      remained untested.


      Contradictory: A hazard or pain was ignored to prove toughness, or essential support was deliberately
      removed.


      Inconclusive: An adventurous intention was described without preparation, a real bounded attempt
      or an adaptive response.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
