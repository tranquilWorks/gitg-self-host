  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Rin arrives at J at 14:03 and sees a temporary arrow that seems to point toward W. Rin stays in
      the public corridor and checks the map. Another staff member arriving at the junction clarifies
      the M route by 14:05; Rin does not enter W. Rin reaches M at 14:09, chooses one minute of reading
      so as to leave by the preselected 14:10 turnaround, and returns M–J–D in seven minutes, reaching
      D at 14:17. Rin reports the confusing arrow at D. The actual attempt includes staff help and a shorter
      display visit.


      The original route would take 17 minutes with three minutes of reading. The actual attempt also
      takes 17 minutes: two minutes of clarification replace two of the reading minutes. Equal total time
      does not mean the experience was unchanged or unsupported.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Choose uncertainty you can responsibly work with


      A worthwhile challenge adds something unfamiliar while leaving a realistic way to stop, ask for
      help and return. Risk is not the ingredient that makes courage count. New navigation can be challenging
      without isolation, danger or a demand to prove independence.


      Use the fictional library map below. Allow fifteen minutes for preparation, ten to trace the later
      attempt and ten for checks. The default is a paper task, not anxiety treatment or physical training.
      [NPS planning guidance, S01](https://www.nps.gov/subjects/healthandsafety/trip-planning-guide.htm)
      distinguishes a suitable activity and preparation from enthusiasm. Here that general planning principle
      is adapted to an ordinary public building; no park procedure certifies the library.


      Worked example: Lee chooses to find a new reading room while staff are available. When the lift
      is out, Lee asks for another suitable destination on the entrance level. Asking changes the route
      and preserves access; it does not invalidate the challenge. Taking stairs against an access need
      would add an unrelated hazard.


      ### Fictional library route L6


      Rin knows the entrance desk D but has never located the map display M. Today''s visitor information
      confirms the public building is open, the following level corridors are suitable for Rin''s existing
      supports, and a staff member is at D throughout the planned attempt. The map display is open. No
      stairs or unlisted doors belong to the plan.


      | Corridor | One-way minutes | Map instruction |

      | --- | ---: | --- |

      | D to junction J | 3 | Follow the blue line to the large J sign |

      | J to display M | 4 | Turn toward the M sign |

      | J to workroom W | 2 | Staff-only door; no visitor entry |


      Rin starts at 14:00, may spend three minutes reading M, and must be back at D by 14:20. Rin sets
      a 14:10 turnaround, carrying the map in readable form and keeping existing communication support.
      If signs disagree, access changes, distress or effort becomes unsuitable, or staff support disappears,
      Rin pauses safely and returns or asks for help. No diagnosis or numerical distress threshold is
      invented.


      The reason for trying is to use more of an already familiar public resource. The unfamiliar part
      is following the junction sign, not enduring discomfort without assistance. Rin predicts needing
      one map check. The destination is optional if the supported return becomes uncertain.


      ### Plan the bounded extension


      1. Draw only the permitted route, calculate its round trip with reading time, and write the stop/return
      decision before seeing the outcome. Distinguish an unfamiliar sign from a locked door: the first
      invites clarification, the second restricts entry.

      2. Save the plan and use the [later packet](?resource=file-later-packet-md). At each timestamp mark
      location, information available and action. Do not score a help request as failure or assume a projected
      arrival occurred.

      3. Compare prediction, actual support and remaining uncertainty. Name what was practiced—checking
      and correcting a route—and what was not, such as navigating alone or using an unfamiliar building
      without access information. Choose repeat, a small appropriate variation, rest or stop with a reason.


      The output is a route trace and one evidence-based next decision. A destination reached by violating
      a staff-only boundary contradicts the task. A planned route without a visit shows preparation; a
      safe return after changed conditions can show sound adaptation.


      ### Keep the challenge chosen


      A reader can trace the whole case without leaving home. In a real setting, use the actual venue''s
      current map, access information and available support; retain necessary aids. If the activity is
      unsuitable, choose a familiar destination or decline. A partner may accompany the attempt without
      pretending the resulting experience was solo.


      For a harder paper case, the display closes while Rin is still at J. Propose a different permitted
      entrance-level destination only if its access, time and support are confirmed; otherwise return.
      Do not turn disappointment into permission to enter W.


      At a later suitable opportunity, repeat the same route or locate one similarly supported destination.
      Record actual assistance, not an aspiration to need less. Specialized outdoor environments, dangerous
      equipment, clinical exposure and emergency situations require different expertise. A successful
      library visit establishes none of those capabilities.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A route needs 5 minutes out, 5 back and 4 at a destination. A person has 12 minutes. What must
      change before the full plan fits?


      2. A confusing public sign points toward a staff-only door. Does completing a challenge justify
      trying the door?


      3. A person uses a guide and reaches the display, then says they can navigate any new building alone.
      What can the record support instead?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. The plan takes 14 minutes, two too many. Shorten or omit optional dwell only if the route and
      return remain suitable, choose another destination or defer. Correct by changing the plan explicitly
      rather than shaving required travel invisibly.


      2. No. Pause in a suitable public area, use the map or available staff, and return if unresolved.
      A sign ambiguity does not revoke access restrictions. Correct any decision that prizes destination
      completion over permission.


      3. That one supported route was completed with a guide. Record what was learned and what assistance
      remained necessary; a comparable later attempt may test a bounded next step. Correct the unsupported
      universal and solo claims.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
