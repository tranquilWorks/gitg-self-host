meaning_and_fit:
  purpose: Learn from a different way of living while distinguishing observation, interpretation and unresolved
    meaning instead of demanding sameness or treating difference as exotic wisdom.
  why_recommended: Learn from a different way of living while distinguishing observation, interpretation
    and unresolved meaning instead of demanding sameness or treating difference as exotic wisdom.
  claims:
  - statement: Learn from a different way of living while distinguishing observation, interpretation and
      unresolved meaning instead of demanding sameness or treating difference as exotic wisdom.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cross-cultural exploration practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cross-cultural exploration as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a reliable community-authored accessible account when an event is unavailable
    or participation would conflict with conscience. Respectful learning does not require adopting a belief
    or approving every practice. Avoid forced disclosure, intrusive photography and expectations of unpaid
    cultural education.
  opportunity_considerations: Choose an unfamiliar ordinary practice described by its participants, such
    as a community meal custom, a public festival routine or a different way of organizing shared time.
    Use an explicitly welcoming public event or a community-authored account. Prepare columns for what
    happens, participants’ stated meaning, your interpretation and what remains unknown.
  prerequisites:
  - Choose an unfamiliar ordinary practice described by its participants, such as a community meal custom,
    a public festival routine or a different way of organizing shared time. Use an explicitly welcoming
    public event or a community-authored account. Prepare columns for what happens, participants’ stated
    meaning, your interpretation and what remains unknown.
  dependencies: []
  safe_alternatives:
  - Use a reliable community-authored accessible account when an event is unavailable or participation
    would conflict with conscience. Respectful learning does not require adopting a belief or approving
    every practice. Avoid forced disclosure, intrusive photography and expectations of unpaid cultural
    education.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cross-cultural exploration differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cross-cultural exploration
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an unfamiliar ordinary practice described by its participants, such as a community meal
    custom, a public festival routine or a different way of organizing shared time. Use an explicitly
    welcoming public event or a community-authored account. Prepare columns for what happens, participants’
    stated meaning, your interpretation and what remains unknown. Goal: Learn from a different way of
    living while distinguishing observation, interpretation and unresolved meaning instead of demanding
    sameness or treating difference as exotic wisdom. Scope: One invited encounter or community-authored
    account is not expertise in a culture or permission to participate in restricted practices. No person
    must serve as a cultural representative. Time and effort: Twenty minutes of preparation, one bounded
    encounter or source study and a twenty-minute comparison. Adaptation: Use a reliable community-authored
    accessible account when an event is unavailable or participation would conflict with conscience. Respectful
    learning does not require adopting a belief or approving every practice. Avoid forced disclosure,
    intrusive photography and expectations of unpaid cultural education. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a reliable community-authored accessible account when an event is unavailable
    or participation would conflict with conscience. Respectful learning does not require adopting a belief
    or approving every practice. Avoid forced disclosure, intrusive photography and expectations of unpaid
    cultural education.
  expected_burden: Twenty minutes of preparation, one bounded encounter or source study and a twenty-minute
    comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cross-cultural exploration protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Cross-cultural exploration action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a reliable
    community-authored accessible account when an event is unavailable or participation would conflict
    with conscience. Respectful learning does not require adopting a belief or approving every practice.
    Avoid forced disclosure, intrusive photography and expectations of unpaid cultural education.
  actions:
  - stable_id: PRACTICE-COMP-2607-CROSS-CULTURAL-EXPLORATION-01-A1
    sequence: 1
    title: Name your expectation before the encounter
    instructions: 'Write one assumption you bring and what observation might revise it. Verify whether
      the practice is public, whether visitors may participate and what conduct is appropriate. Identify
      whose account you are using and whether other participants might understand it differently. Do not
      frame the group as primitive, advanced, uniformly spiritual or uniformly oppressive before studying
      the actual practice.


      Observation checks: A prior assumption and possible revision are explicit; Public access and participation
      boundaries are checked; The source’s perspective and limits are identified; No whole culture is
      ranked or romanticized in advance. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-2607-CROSS-CULTURAL-EXPLORATION-01
      action_stable_id: PRACTICE-COMP-2607-CROSS-CULTURAL-EXPLORATION-01-A1
