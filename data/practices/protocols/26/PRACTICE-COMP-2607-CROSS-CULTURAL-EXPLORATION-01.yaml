  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      The fictional committee responds to the invited question: the unassigned slot is deliberate, but
      the group is reviewing the end-time problem. Next month it proposes a separate ten-minute overflow
      period only if two volunteers agree; neither has yet agreed. Dev says the explanation helps but
      does not recover the missed repair. Mira permits a paraphrase of her comments with her first name
      in this fictional study, not a recording or representation of the group. Nobody grants access to,
      teaching of, or reuse of the closing verse.


      Update the forgotten-plan interpretation. Keep the proposed overflow unconfirmed, Dev''s unresolved
      repair visible and each permission within its scope. There is no actual community response or consent
      record.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let an unfamiliar practice stay particular


      When something feels strange, a quick explanation is tempting: they are more communal, less efficient,
      more spiritual, or simply doing what we do under another name. Each explanation can erase what participants
      actually say. Cross-cultural learning needs enough patience to separate an observed action, its
      stated meaning, your analogy and the part you still do not understand.


      The fictional Lantern Lane account supplies two voices from a neighborhood with an unfamiliar way
      of sharing workshop time. It represents no ethnicity, nation or religion. Allow twenty minutes to
      read and make an interpretation sheet, ten for later clarification and ten for checks. [UNESCO''s
      dialogue article, S03](https://www.unesco.org/en/articles/new-methods-boost-intercultural-competencies)
      identifies listening as part of intercultural understanding. This original exercise is not a Story
      Circles session or evidence that the article''s workshop outcomes apply here.


      Worked example: seeing a host leave an empty chair might suggest either hospitality or exclusion.
      Until the host explains, both are hypotheses. Even a clear explanation of that one chair does not
      establish what every person in the community believes about guests.


      ### Two complete accounts and one invitation


      **Public invitation from the fictional Lantern Lane workshop committee.** Visitors may read this
      account and attend an open tool-mending hour as observers. Photographing, recording, taking tools
      or reproducing the group''s closing verse is not included. Questions are welcome after the demonstration
      if the speaker wishes. The group has not invited visitors to perform or teach the verse. No actual
      event is available through this exercise.


      **Mira, one long-standing participant.** “We leave the first repair slot unassigned until the hour
      begins. It can go to someone whose bus arrived late or whose work shift changed. I like that someone
      does not have to explain their whole life to ask. We write the order on a board so people know what
      is happening. I cannot explain the closing verse on everyone''s behalf.”


      **Dev, a newer participant.** “The flexible first slot helped me once. On another day I waited longer
      than I expected and had to leave before my turn. I want clearer end times. I enjoy mending with
      people, but I do not always stay for the closing.”


      **Observation card.** At the described session, the first slot remains blank until 14:05. A late
      arrival receives it. Two names shift down the board; nobody''s reason is written. The committee
      posts an end time of 15:00. The card gives no private circumstances and no measure of how often
      the arrangement works.


      Your initial hypothesis is supplied: “The blank slot means the organizers forgot to plan.” Treat
      it as revisable, not shameful. An unfamiliar custom can serve a good and impose a burden at the
      same time; learning that does not require either praise or condemnation of a whole group.


      ### Four columns, then a smaller conclusion


      1. Make columns headed observed, attributed meaning, my interpretation and unknown. Enter at least
      three concrete features: the held slot, the visible board and the optional closing. Put Mira''s
      and Dev''s explanations under their names. The observation card alone does not establish either
      person''s feelings.

      2. Replace the forgotten-plan hypothesis with a narrower account supported by both voices. Name
      the supported good, the waiting cost and a remaining question about who can change the arrangement.
      Do not assume the committee speaks for everyone or that Dev''s concern cancels Mira''s experience.

      3. Save the sheet before the [later packet](?resource=file-later-packet-md). Incorporate the clarification
      while preserving the boundary around the verse. Write one lesson you can use at home without copying
      a restricted form: for example, ask whether a shared plan needs room for unpredictable arrivals
      and a clear finish.


      ### Participation is another permission question


      A community-authored account is a useful starting point; reading it is not attendance. At a real
      invited encounter, confirm visitor conduct, use accurate language support when needed and accept
      a declined question. No participant is obliged to represent a culture or disclose a difficult personal
      history.


      For support, work only from the supplied text, use a reader, or compare two statements at a time.
      For a harder exercise, write two different plausible readings of the same board change and name
      what additional evidence would distinguish them. Do not decide by which reading flatters your worldview.


      Later transfer can involve a second authorized account or encounter, followed by a note of what
      changed and what remains misunderstood. A changed assumption is evidence of that revision; it is
      not intercultural expertise. If your result says all members feel the same, celebrates every difference
      uncritically, or dismisses a burden as backwardness, return to the named voices and narrow it.


      ### Use the result at its proper scale


      Capacity, access and context govern actual attempts. Fiction and no attempt are legitimate. Human
      dignity is never scored.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A guest sees two participants leave before a closing ritual and writes “Their culture rejects
      this ritual.” What is established?


      2. A public account describes a ceremony; a speaker agrees to one factual question. May a visitor
      record it and teach the ceremony?


      3. Two participants give different accounts of a shared custom. Must one be discarded to produce
      a respectful summary?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. Only the departures are observed. Motives, affiliation and wider practice remain unknown. Correct
      the culture-wide verdict by keeping observation separate from interpretation and seeking a welcome
      attributed explanation if needed.


      2. No. Reading, questioning, recording and teaching have separate scopes. Correct the plan by omitting
      recording/reuse unless the appropriate actual authority grants it; do not manufacture authority
      from public access.


      3. No. Preserve each account and its limits, including a good served and a burden. A respectful
      summary can remain unresolved. Correct romanticizing or ranking by returning to particular evidence
      rather than choosing the flattering voice.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
