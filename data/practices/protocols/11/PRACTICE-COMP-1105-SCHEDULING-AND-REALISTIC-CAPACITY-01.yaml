  - stable_id: PRACTICE-COMP-1105-SCHEDULING-AND-REALISTIC-CAPACITY-01-A2
    sequence: 2
    title: Place demanding work and define the interruption rule
    instructions: 'Assign tasks to suitable energy and access windows, leave the buffer uncommitted and
      identify what moves first if time is lost. For the default, the optional errand moves before a genuinely
      time-critical form, unless the errand is itself essential. Set a latest useful start and an early
      communication point for any commitment at risk; do not consume all recovery to rescue the plan.


      Observation checks: Energy and access influence task placement; A real buffer remains unallocated;
      An explicit task moves first when time is lost; Latest starts and early communication points are
      set. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
