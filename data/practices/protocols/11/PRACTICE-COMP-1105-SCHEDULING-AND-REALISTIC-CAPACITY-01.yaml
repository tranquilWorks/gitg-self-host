      action_stable_id: PRACTICE-COMP-1105-SCHEDULING-AND-REALISTIC-CAPACITY-01-A1
      competency_stable_id: '11.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
