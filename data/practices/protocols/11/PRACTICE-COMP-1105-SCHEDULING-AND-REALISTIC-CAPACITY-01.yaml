      - [Western Australia Centre for Clinical Interventions, Assertiveness](https://www.cci.health.wa.gov.au/Resources/Looking-After-Yourself/Assertiveness)'
  - id: file-later-packet-md
    title: Later packet
    body: 'These are alternative fictional branches, not events the learner experienced.


      **A: access defeats a simple subtraction.** Everything through recovery finishes exactly as planned
      at 10:55. An unavoidable 20-minute interruption occupies 10:55–11:15 before the errand transition
      begins. The errand needs its full 30 minutes; the desk still closes at 11:45. No extension has been
      agreed. Produce the revised remaining schedule and identify what stays pending. Do not remove recovery
      retroactively.


      **B: early deadline exposure.** The form needs its full 60 active minutes. An interruption occupies
      09:25–09:45; the 20 minutes of form work already completed are retained. Forty active minutes remain
      at 09:45. The appointment still starts at 10:10, requires five minutes of transition, and cannot
      move by unilateral decision. At 09:25 the interruption''s 20-minute duration is known. It is a call
      from the appointment desk, and reporting the form risk is possible in the first minute of that same
      call; this notification is included in the 20 minutes, not additional simultaneous work. Decide
      when to communicate, what the original plan can no longer accomplish, and which status to preserve
      if no reply arrives. No alternative is accepted in this packet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make the plan fit the day


      A usable schedule assigns work to times when its prerequisites, access and your capacity are present.
      Adding durations is the first check; fitting them into actual intervals is the second. A spare half-hour
      at noon cannot rescue a form due before an appointment at ten.


      This guide practices allocating duration ranges, energy, transitions, recovery, buffers and competing
      responsibilities. It is suitable for an ordinary day you can partly plan. It does not make imposed
      overload, changing disability-related capacity or insecure work your fault. Use the complete fictional
      morning below when there is no suitable live day. No calendar account, purchase, personal disclosure
      or manufactured interruption is needed.


      Allow 15 minutes to make the paper plan, 10 to analyze the update, and 10 for the separate checks.
      Paper, a text editor, dictation or movable labeled cards suffice. You need to add minutes and read
      a clock; the reference below supports both. This simulation produces a baseline, revised schedule
      and communication decision. It cannot establish that you used a schedule in life.


      ### Reference: capacity is located, and uncertainty stays visible


      A **duration range** records uncertainty, not permission to pick the smaller number when the plan
      is crowded. Use an earlier comparable attempt where available and label guesses. Here the upper
      bounds are stipulated case assumptions, not population estimates. Reserve the upper bound for commitments,
      then release unused time only after work actually finishes.


      A **fixed interval** cannot move without the relevant agreement. An **access window** says when
      a place, resource or input is usable. An **energy window** is a person''s stated fit for a kind
      of work, not a universal morning preference. **Transitions** include preparing, changing location
      or switching equipment. **Recovery** meets a real need and remains protected. A **buffer** is uncommitted
      capacity reserved against uncertainty; it is not another task to finish or an extra copy of time
      already assigned.


      Use half-open intervals: 09:00–09:05 occupies five minutes and may be followed immediately by 09:05–09:20.
      A task requiring 30 uninterrupted minutes cannot fit in two separate 20-minute gaps unless splitting
      is explicitly allowed. Two independent tasks still compete for one person''s attention.


      For a task with deadline D, upper duration U and required final transition T, the latest useful
      start is D minus U minus T, then checked against access and energy. If prerequisites cannot be ready
      by that start, communicate as soon as that becomes apparent. Waiting until the deadline removes
      useful alternatives. A promise changes only through the appropriate agreement; changing your own
      optional plan needs no invented acceptance.


      ### A different worked example


      A label must reach a desk by 14:00. Making it takes 15–20 minutes and walking to the desk takes
      five. The latest useful start is 13:35: 20 + 5 = 25 minutes before 14:00. Access to the printer
      starts at 13:45, so the proposed plan is infeasible even though the afternoon has 90 free minutes.
      Ask about an authorized alternative format or a changed deadline before promising delivery. Removing
      a needed break does not open the printer sooner.


      ### Complete practice materials: one fictional morning


      You are planning 09:00–12:00. You are the sole worker. At 12:00 an existing care duty begins; it
      cannot be delayed. The person has stated that the form is suitable between 09:00 and 10:05. Keep
      their existing support and recovery needs. The form''s inputs are all available at 09:00. Completion
      means all pages checked before leaving for the appointment, not merely opening the form.


      | Item | Duration minutes | Constraint |

      | --- | --- | --- |

      | Prepare form materials | 5 | Before form |

      | Complete and check form | 40–60 | May pause; finish by 10:05; suited to 09:00–10:05 |

      | Move to appointment | 5 | After form, arrive by 10:10 |

      | Fixed appointment | 30 | 10:10–10:40; already agreed |

      | Recovery | 15 | Immediately after appointment; protected |

      | Move to errand desk | 5 | After recovery, before errand |

      | Optional errand | 20–30 | One continuous block; desk open 11:00–11:45 |

      | Reserved buffer | 30 | Uncommitted time; use at most once |


      The errand is optional and has no recipient relying on completion today. If it moves, record “pending,
      next suitable window to be chosen,” not “done.” All durations include the stated work; do not add
      unlisted travel. There is no travel back after the errand in this toy case. In life, explicitly
      include such travel if needed.


      #### Action 1 — Preserve a feasible baseline


      Calculate the upper-bound demand, then place every item. Save your attempt before comparing with
      this worked baseline:


      | Baseline interval | Allocation | Minutes |

      | --- | --- | --- |

      | 09:00–09:05 | Prepare form materials | 5 |

      | 09:05–10:05 | Complete and check form | 60 |

      | 10:05–10:10 | Move to appointment | 5 |

      | 10:10–10:40 | Fixed appointment | 30 |

      | 10:40–10:55 | Recovery | 15 |

      | 10:55–11:00 | Move to errand desk | 5 |

      | 11:00–11:30 | Optional errand | 30 |

      | 11:30–12:00 | Reserved buffer | 30 |


      The sum is 180 minutes. Every dependency fits, the errand ends before 11:45, and the form fits the
      stated energy window. The upper-duration latest starts are 09:05 for the form and 11:15 for the
      errand. The baseline has no slack before the form deadline. Record this exposure; the later buffer
      is not protection for every morning risk.


      Use: `version | assumptions | intervals | latest starts | threatened duty | communication trigger
      | first optional work to move`.


      #### Action 2 — Update from an interruption


      Write the rule before opening [later-packet.md](?resource=file-later-packet-md): protect the appointment,
      recovery and noon duty; move the optional errand when it no longer fits; communicate immediately
      if the form deadline becomes infeasible. Apply the two later branches separately, preserving the
      original plan. Do not combine a short form duration from one branch with an interruption from another.


      For each branch, show occupied and unallocated minutes without overlap. Keep a buffer ledger: original
      reserve, minutes actually used, minutes released by moved work, remaining free time. Freed time
      is not proof that a moved task finished. If the interruption is before an access deadline, test
      intervals again rather than subtracting only from the end-of-day total.


      #### Action 3 — Close the planning loop honestly


      Use the update to identify an estimate error, an external event and a scheduling choice; explicitly
      say when a category has no evidence. Write one change to the next plan, such as reserving time before
      the vulnerable deadline or arranging an agreed alternative before making the promise. Record any
      open commitment and the next useful contact. Do not rewrite a missed deadline as the original plan.


      Then attempt [check-prompts.md](?attempt=practice-checks), saving answers before opening [check-answers.md](?check=practice-answers).
      A complete source learning artifact has both schedules, feasibility arithmetic, a single-use buffer
      ledger, the latest-start communication rule and an honest pending-work record. Keep the paper result
      distinct from actual follow-through.


      ### Access, challenge and later transfer


      Use durations relative to an anchor (“after the appointment”) when exact clock times are inaccessible,
      while retaining the actual fixed boundary. A planning aid may add and read the intervals; record
      that support. Variable-capacity routes may use shorter windows and explicit uncertainty rather than
      pretending a stable three-hour block exists. When externally imposed duties exceed capacity, retain
      the infeasible plan and use the appropriate scope/support channel.


      For a harder supplied variation, the five-minute materials preparation is complete by 09:05, but
      one required form input arrives at 09:15. The form still needs 60 minutes plus the five-minute transition.
      Record the 10-minute shortfall before 10:10; propose an alternative without marking it accepted.
      An advanced live route can compare three ordinary days using actual major time ranges, with no continuous
      tracking. Change one estimate from those observations.


      At the next suitable real day, preserve your plan, use it, and record naturally occurring changes
      afterward. If no interruption occurs, that day supplies no interruption-recovery evidence. Do not
      manufacture a disruption. Record supported use separately from unaided use and from an independent
      observer''s actual report.


      **Supportive:** Intervals and access fit; a normal interruption leaves fixed duties protected and
      moved work openly pending.


      **Mixed:** The arithmetic fits but an omitted transition eats into recovery; revise the plan rather
      than calling it fully feasible.


      **Contradictory:** The same buffer minutes are used twice, a deadline is silently moved, or recovery/care
      is removed to declare success.


      **Inconclusive:** Only a task list exists, or actual start/end information is insufficient to assess
      the live plan.


      Planning background: [source notes](?resource=sources). No short exercise establishes general time-management
      skill or therapeutic benefit.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your own calculations before opening check-answers.md. These checks are fictional and
      unscored.


      ### Check 1 — Total time versus usable intervals


      One person has free intervals 13:00–13:20 and 13:35–14:00. A task requires 30 uninterrupted minutes
      with the needed device available throughout both free intervals. A five-minute handoff must follow
      it and finish by 14:00. Can the task and handoff fit? Give the total free minutes, longest free
      interval, latest task start and a useful next decision. No one has agreed to move the 13:20–13:35
      duty.


      ### Check 2 — A buffer can be spent once


      A 120-minute window contains 75 minutes of planned work, 15 minutes of protected recovery and 30
      minutes of reserve. Interruption X uses 20 reserve minutes. Interruption Y then needs 15. Work includes
      an optional 10-minute task that has not started and has no external commitment. Calculate the shortfall,
      move that optional task if necessary, and state the remaining free minutes and task status. Is keeping
      all 30 original reserve minutes on the revised calendar valid?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '### Default update A


      The next possible transition is 11:15–11:20; a 30-minute errand would end at 11:50, five minutes
      after closing. Its latest start was 11:15. Move the errand and its now-unneeded five-minute transition.
      Revised allocations: all 115 minutes through 10:55 unchanged; interruption 10:55–11:15 (20); unallocated
      11:15–12:00 (45). Total 115 + 20 + 45 = 180. Ledger: 30 original reserve − 20 interruption + 30
      moved errand + 5 released transition = 45 free. That ledger reconciles capacity; the actual interval
      check explains why the errand moved. Noon care and recovery remain protected; the errand is pending.


      A plausible partial answer spends 20 reserve minutes and leaves 10, but still schedules the errand
      after its access closes. Correct the interval, then recalculate the released work. A polished calendar
      with 45 free minutes and an errand marked done is false accounting.


      ### Default update B


      At 09:25 communicate that the original form deadline is at risk and cannot fit at the stated upper
      duration: 20 active minutes before the interruption plus 40 afterward would finish at 10:25, with
      arrival at 10:30. Only 20 active minutes are available from 09:45 to the 10:05 transition boundary,
      leaving 20 form minutes unfinished if the appointment is protected. Ask whether an explicitly permitted
      incomplete-form appointment or another arrangement is available. With no reply, retain the original
      promise and unresolved exception; do not assume permission or report the form finished. The later
      30-minute reserve cannot move backward in time. No estimate error is established by a task taking
      its stated upper bound; the interruption is external and the vulnerable placement is a planning
      choice.


      ### Check 1


      There are 45 free minutes, but the longest contiguous interval is 25. The latest task start for
      a 14:00 handoff finish is 13:25, inside the fixed duty. Neither interval contains the required 35
      contiguous minutes. The plan is infeasible. Seek an authorized changed time, different resource/process
      or reduced deliverable; keep it a proposal until agreed. Adding the two gaps or silently splitting
      the task is incorrect.


      ### Check 2


      After X, reserve is 10. Y requires 15, so the shortfall is 5. Defer the optional 10-minute task:
      65 work + 15 recovery + 35 interruptions + 5 free = 120. Record the optional task pending, with
      a later decision to schedule or drop it. The original 30-minute reserve has been consumed; retaining
      another 30 would double-count capacity. Reducing recovery instead fails the stipulated constraints.


      Use a supported correction if arithmetic was the barrier. Save the first answer and correction separately
      so improvement in the worksheet is visible without inventing a successful real day.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
