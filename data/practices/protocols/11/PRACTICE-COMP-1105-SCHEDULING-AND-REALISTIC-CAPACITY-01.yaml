meaning_and_fit:
  purpose: Schedule commitments against duration ranges, usable energy, buffers, recovery and competing
    responsibilities, then revise from a real interruption rather than an ideal day.
  why_recommended: Schedule commitments against duration ranges, usable energy, buffers, recovery and
    competing responsibilities, then revise from a real interruption rather than an ideal day.
  claims:
  - statement: Schedule commitments against duration ranges, usable energy, buffers, recovery and competing
      responsibilities, then revise from a real interruption rather than an ideal day.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Scheduling and realistic capacity practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Scheduling and realistic capacity as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use flexible windows rather than clock times for variable care or disability-related
    capacity. A support person or accessible calendar may carry reminders. In externally imposed overload,
    record the infeasible sum and request scope or staffing changes instead of relying on unpaid extra
    hours.
  opportunity_considerations: 'Default available window: 9 a.m. to noon. It contains a fixed 30-minute
    appointment, a 40–60 minute form, a 20–30 minute errand and a recovery break. Protect a 30-minute
    interruption buffer and include transitions. Use the actual energy-demanding item first only when
    that fits the person’s usable energy, not a universal morning rule.'
  prerequisites:
  - 'Default available window: 9 a.m. to noon. It contains a fixed 30-minute appointment, a 40–60 minute
    form, a 20–30 minute errand and a recovery break. Protect a 30-minute interruption buffer and include
    transitions. Use the actual energy-demanding item first only when that fits the person’s usable energy,
    not a universal morning rule.'
  dependencies: []
  safe_alternatives:
  - Use flexible windows rather than clock times for variable care or disability-related capacity. A support
    person or accessible calendar may carry reminders. In externally imposed overload, record the infeasible
    sum and request scope or staffing changes instead of relying on unpaid extra hours.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Scheduling and realistic capacity differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Scheduling and realistic capacity
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default available window: 9 a.m. to noon. It contains a fixed 30-minute appointment, a 40–60
    minute form, a 20–30 minute errand and a recovery break. Protect a 30-minute interruption buffer and
    include transitions. Use the actual energy-demanding item first only when that fits the person’s usable
    energy, not a universal morning rule. Goal: Schedule commitments against duration ranges, usable energy,
    buffers, recovery and competing responsibilities, then revise from a real interruption rather than
    an ideal day. Scope: The exercise tests planning realism for one day. It does not make unavoidable
    overload, unpredictable illness or insecure work an individual scheduling failure. Time and effort:
    Fifteen minutes before the day and ten minutes afterward; no continuous timer is required. Adaptation:
    Use flexible windows rather than clock times for variable care or disability-related capacity. A support
    person or accessible calendar may carry reminders. In externally imposed overload, record the infeasible
    sum and request scope or staffing changes instead of relying on unpaid extra hours. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use flexible windows rather than clock times for variable care or disability-related
    capacity. A support person or accessible calendar may carry reminders. In externally imposed overload,
    record the infeasible sum and request scope or staffing changes instead of relying on unpaid extra
    hours.
  expected_burden: Fifteen minutes before the day and ten minutes afterward; no continuous timer is required.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Scheduling and realistic capacity protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Scheduling and realistic capacity action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use flexible
    windows rather than clock times for variable care or disability-related capacity. A support person
    or accessible calendar may carry reminders. In externally imposed overload, record the infeasible
    sum and request scope or staffing changes instead of relying on unpaid extra hours.
  actions:
  - stable_id: PRACTICE-COMP-1105-SCHEDULING-AND-REALISTIC-CAPACITY-01-A1
    sequence: 1
    title: Price the whole day before allocating the open blocks
    instructions: 'List fixed commitments, travel, preparation, meals, care and recovery, then identify
      the genuinely flexible window. Estimate uncertain tasks as ranges based on a previous attempt or
      a stated guess. Check the default using upper bounds: appointment 30, form 60, errand 30 and buffer
      30 leave 30 minutes for transitions and rest. If the sum does not fit, reduce scope before scheduling.


      Observation checks: Fixed duties transitions and recovery are included; Uncertain durations use
      ranges with their basis stated; Available capacity is calculated rather than assumed; Overload triggers
      scope reduction before promises are made. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
