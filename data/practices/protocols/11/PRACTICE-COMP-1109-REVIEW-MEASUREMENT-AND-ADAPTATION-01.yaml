      - [Western Australia Centre for Clinical Interventions, Assertiveness](https://www.cci.health.wa.gov.au/Resources/Looking-After-Yourself/Assertiveness)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Each branch is a different fictional Week 2. Unless noted, lunch requirements, access supports,
      shopping and care arrangements are unchanged, and records cover all three planned days. Evening
      minutes belong to the following named day''s lunch; do not count them on two days.


      | Branch | Monday ready; evening+morning minutes | Wednesday ready; evening+morning minutes | Friday
      ready; evening+morning minutes | Other information |

      | --- | --- | --- | --- | --- |

      | A | yes; 4+3 | no; 4+3 | yes; 4+4 | No shifted care or delayed sleep; Wednesday component still
      unavailable; Friday interruption again seven minutes |

      | B | yes; 5+4 | yes; 5+4 | yes; 5+4 | No shifted care or delayed sleep; all components available;
      material availability differs from baseline |

      | C | yes; 4+4 | no; 4+4 | no; 4+4 | No shifted care or delayed sleep; Wednesday component unavailable;
      Friday interruption again seven minutes |

      | D | yes; 4+3 | yes; unknown+3 | yes; 4+3 | Evening cost missing Wednesday; other conditions not
      recorded |

      | E | yes; 4+3 | yes; 4+3 | yes; 4+3 | A care duty was shifted to another person without agreement
      on Wednesday |

      | F | yes; 5+4 | no; 5+4 | yes; 5+4 | No shifted care or delayed sleep; Wednesday component still
      unavailable; Friday interruption again seven minutes |


      Apply the saved comparability rule before interpreting output. A branch may expose better availability
      while still failing to support the planned comparison. No actual lunch was made by reading this
      packet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make a review change the next attempt


      A review compares the plan you actually made with outcomes and costs, then changes a method you
      can control. It keeps explanations provisional. A good-looking reflection is not a closed loop until
      the changed method is tried and its result affects the next decision.


      This guide uses a complete fictional three-day lunch-preparation record. Allow 20 minutes for comparison
      and a trial plan, then 10 for later results and fresh checks. Use paper, dictation or a text editor.
      No food preparation, purchase, private diary, account or participant is required. The default is
      a desk exercise about supplied records, not evidence that your routine changed.


      A live route concerns an ordinary low-stakes routine that fits your existing food, health, access
      and care needs. It is not dietary or clinical advice. Keep those needs and supports in place; do
      not sacrifice meals, sleep or essential duties to improve a metric.


      ### Reference: outcome, cost and explanation


      Preserve the **planned result** and its time boundary. Record the **actual outcome** against that
      same definition, including partial work. Keep **costs** such as active effort, rework and burden
      on others separate from the success count. An item bought is an activity; the required lunch being
      available at departure is the outcome.


      An explanation can be supported without being proven causal. “An ingredient was unavailable” may
      be directly recorded. “I am lazy” is not an observation of a mechanism. Distinguish conditions you
      can change, external events and assumptions. List at least one plausible alternative and say what
      evidence would help distinguish it.


      Choose **one controllable method change**, define a comparable next opportunity, state the predicted
      result and decide in advance what will make you retain, revise or reject it. Compare as consistently
      as practical and record changed conditions. Multiple simultaneous changes make attribution difficult.
      A positive result in a short comparison is provisional evidence for this use, not proof of general
      effectiveness.


      Use an explicit **inconclusive** disposition if the follow-up or cost data are absent or the conditions
      prevent a fair comparison. Unknown is not zero. Do not silently shrink the denominator to remove
      missed days or alter the original target after seeing results.


      ### A different worked example


      A person plans to return three library cards to their folder after use. One is returned, one remains
      on the table and one was not used. A review preserves the planned three and records the actual opportunities.
      Moving the folder closer is one testable method change; “be more organized” is only an intention.
      If the next record has all cards returned but a helper did the returning without that support being
      recorded, the evidence does not establish the person''s changed behavior.


      ### Complete baseline packet: lunch available at departure


      The fictional plan was saved before Week 1: “Have my usual suitable lunch packed and available by
      08:00 on Monday, Wednesday and Friday. At most eight active preparation minutes per day, no transferred
      care work, and no delayed sleep.” The planned total active allowance is 24 minutes. Shopping time
      is outside this bounded preparation measure and must be disclosed if a later method changes it.


      The case uses the person''s already suitable lunch and existing safe storage arrangements. No recipe
      or change of diet is required. The only method variable considered is when the dry, shelf-stable
      portion is placed in its bag. All other lunch components and safe handling follow the existing arrangement.


      | Week 1 day | Lunch by 08:00 | Active minutes | Recorded event | Other burden |

      | --- | --- | --- | --- | --- |

      | Monday | yes | 8 | All required components available | none recorded |

      | Wednesday | no | 6 | One required component unavailable; not checked earlier | none recorded |

      | Friday | no | 7 | Seven-minute unavoidable interruption in the preparation window | none recorded
      |


      The seven interruption minutes are elapsed disruption, not part of the seven active preparation
      minutes on Friday. Do not add them into active cost or remove them from elapsed feasibility. There
      are no actual meal, sleep or medical observations beyond this fictional record.


      #### Action 1 — Compare without rewriting


      Write the original target beside the three outcomes and costs. Calculate outcome success and active
      effort. Preserve Wednesday and Friday as different misses. For each, distinguish supported observation,
      inference and alternative. Example: the missing component is observed; an earlier check might have
      exposed it, but packing an existing dry portion earlier cannot guarantee that component becomes
      available. Friday''s interruption is recorded; assuming next Friday has the same interruption is
      a planning assumption.


      Use `planned outcome | actual outcome | active and other cost | supported event | possible mechanism
      | alternative | controllable part`. Do not convert the record into a personal character verdict.


      #### Action 2 — Prespecify one change and a fair comparison


      The default candidate method is: place the already available dry portion in its bag the preceding
      evening, while retaining the usual remaining morning preparation. Keep shopping, lunch requirements,
      supports and care arrangements unchanged. This may free morning time; it cannot create a missing
      component. Estimate four active minutes in the evening and four in the morning per day, labeling
      those as trial assumptions rather than measurements.


      Compare the same Monday/Wednesday/Friday departure opportunities next week. Save this prediction
      before opening the later packet: “At least two of three lunches available by 08:00; no more than
      24 combined evening-plus-morning active minutes; no care shifted or sleep delayed.” The original
      aspiration of three lunches is retained; two is a provisional improvement threshold for deciding
      whether the method deserves another trial, not retrospective completion of the original goal.


      Also compare each lunch''s combined evening-plus-morning cost with the original eight-minute daily
      cap. Meeting the trial''s 24-minute total does not itself meet or rewrite that daily cap. Report
      any daily overrun separately, even when the provisional trial rule supports another attempt.


      Apply these case decision rules:


      - **Retain provisionally:** at least two of three lunches available, total active cost at most 24
      minutes, no shifted care or delayed sleep, and comparable conditions with complete records.

      - **Revise:** at least two available but active cost exceeds 24, with no harmful burden; change
      one feature for the next trial. Do not call the current method successful on cost.

      - **Reject this version:** at most one available under comparable fully recorded conditions, or
      shifted care/delayed sleep occurs. Return to an appropriate prior arrangement or a different method
      with its own trial.

      - **Inconclusive:** outcome/cost records are missing or a material condition differs so this comparison
      cannot answer the planned question. Retain the observations but repeat or redesign before an effectiveness
      claim. A known adverse burden still stops that version even if other data are missing.


      These are original teaching thresholds for this case, not a validated assessment or universal rule.
      Do not average away an essential-duty violation.


      #### Action 3 — Study results and make the next action concrete


      Open [later-packet.md](?resource=file-later-packet-md). Analyze each branch as an alternative follow-up,
      calculating both evening and morning costs. State whether the trial supports the prediction, apply
      the rule and specify the next action. “Retain” means schedule another bounded comparable trial with
      the same monitoring, not pronounce the method proven. “Revise” must name an actual changed step.
      “Reject” must leave a usable alternative or reasoned stop, not simply judge the week.


      Complete [check-prompts.md](?attempt=practice-checks) before [check-answers.md](?check=practice-answers).
      Your finished desk artifact is a preserved comparison, a pre-result prediction, branch calculations
      and concrete next actions. The supplied follow-up is simulated; no real week has elapsed because
      you read it.


      ### Access, deeper work and transfer


      For a future supported trial, choose one day rather than a week when recall or writing burden is
      too high, stating that prospective denominator and its narrower conclusion. Keep this supplied three-day
      record intact; do not delete its missed days. An aid may total minutes or transcribe; the learner
      can still distinguish mechanism, evidence and decision. Approximate real timings may be ranges;
      if a range crosses the cost threshold, record the decision as uncertain rather than choosing its
      convenient end.


      For greater challenge, use the harder check''s differing-support case and design a second comparison
      that preserves the access support while testing the person''s method. Do not remove necessary assistance
      for experimental purity. Extend to several suitable cycles only if the routine remains useful and
      the measurement burden is proportionate. Keep unchanged or worse outcomes in the record.


      For actual transfer, choose one safe routine, save a small prediction, attempt the method at the
      next comparable opportunity and append what happened. Record external changes. An actual supported
      attempt differs from this simulation; independent observation differs from self-review. A real closed
      loop can end in a justified stop or release of an obsolete target.


      **Supportive:** A changed method is tried, its measured result and cost meet the saved rule, and
      a specific next trial follows.


      **Mixed:** Availability improves but total burden exceeds the plan; revise without hiding the cost.


      **Contradictory:** The original target is rewritten, missed days vanish from the denominator or
      harm to other duties is ignored.


      **Inconclusive:** Reflection produces an intention but no attempted change, or follow-up information
      cannot answer the comparison.


      The broad small-test-and-adapt principle is discussed in [IHI background and source limits](?resource=sources).
      These original cases do not reproduce a validated intervention or demonstrate causal improvement.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '### Check 1 — A cost range crosses the rule


      A three-attempt trial predicts at least two successful outputs, total active cost at most 24 minutes
      and no displaced duty. Outcomes are yes, no, yes. Recorded costs are 7, 8–11 and 7 minutes. Conditions
      are otherwise comparable, with no displaced duty. Calculate the possible total and choose a truthful
      disposition. May the reviewer record 22 minutes and retain the method without acknowledging the
      uncertainty?


      ### Check 2 — Several things changed


      The old method produced one accepted output from three attempts. The new record has three from three,
      but a helper completed two outputs and a missing material also became available. The prior question
      was whether changing the learner''s reminder alone improved their own follow-through. What is supported,
      what causal claim is not, and what concrete next comparison would respect necessary support? Should
      the original target or denominator be rewritten?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '### Baseline and follow-up calculations


      Baseline: 1/3 lunches available; 8 + 6 + 7 = 21 active minutes against 24 planned. This meets the
      active-cost allowance but misses the outcome target. The interruption contributes seven elapsed
      minutes, not seven additional active minutes. Missing supplies and interruption remain distinct
      explanations; evening packing does not solve every cause.


      A: 2/3, (4+3)+(4+3)+(4+4) = 22 minutes, comparable recorded conditions and no added burden. Retain
      provisionally: prepare the same dry portion on the next suitable evening and repeat the same outcome/cost
      check. The original three-lunch goal is still not achieved in this branch.


      B: 3/3 and 27 minutes, with each nine-minute lunch also exceeding the original eight-minute daily
      cap. Availability of the previously missing component changed materially, so this is inconclusive
      for the planned method comparison; it also exceeds the 24-minute cost target. Keep both findings.
      Do not claim that evening packing alone caused the extra lunch. A next comparison should use comparable
      known material availability and record all preparation cost.


      C: 1/3 and 24 minutes under the stated comparable conditions. Reject this version for lack of improvement;
      choose a different controllable candidate, such as a prior availability check, with its own explicit
      trial. Do not silently add that change to the old trial or pretend it ensures supply.


      D: 3/3 but total cost and comparability unknown. Inconclusive; missing is not zero. Recover a reliable
      record if possible, otherwise repeat a suitably recorded comparison.


      E: 3/3 and 21 minutes, but unagreed care displacement. Reject this version despite the attractive
      output count; restore responsible care arrangements before another trial. No conclusion of clinical
      harm is needed to recognize the stipulated duty violation.


      F: 2/3 and 27 minutes, comparable and no displaced duty; each nine-minute lunch also exceeds the
      original eight-minute daily cap. Revise: reduce the evening handling step or choose a smaller preparation
      component, then prespecify a new trial without removing needed preparation or care. Retain the current
      cost failure.


      ### Check 1


      Total is 22–25 minutes. The range crosses 24, so the cost criterion is unresolved. Outcome meets
      the provisional threshold, but overall retention is not established. Record inconclusive cost and
      seek a reliable measurement or repeat with proportionate recording. Selecting 22 alone manufactures
      certainty; selecting 25 as an observed exact value would also be false.


      ### Check 2


      Three accepted outputs were delivered under changed support and material conditions. The learner
      personally completed one; this does not establish the effect of their reminder alone. Preserve the
      original three opportunities and outcome definition. A next small comparison could retain necessary
      help and stable materials, specify who does each step, and change only the reminder within that
      supported route. If stable comparison is impossible, describe the combined supported method and
      limit the claim. Removing needed support or rewriting the past denominator is not a valid repair.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
