meaning_and_fit:
  purpose: Compare outcomes with plans, distinguish causes from excuses and change one method so review
    leads to different action rather than repeated reflection.
  why_recommended: Compare outcomes with plans, distinguish causes from excuses and change one method
    so review leads to different action rather than repeated reflection.
  claims:
  - statement: Compare outcomes with plans, distinguish causes from excuses and change one method so review
      leads to different action rather than repeated reflection.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Review, measurement, and adaptation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Review, measurement, and adaptation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Review one item rather than a whole week, use voice notes or a trusted planning
    aid, and omit private narratives from application evidence. A synthetic review is useful for learning
    the method but does not establish a changed personal routine.
  opportunity_considerations: 'Default plan: prepare a simple lunch on three workdays; actual result:
    one lunch prepared, one ingredient unavailable and one morning interrupted. Use four headings—planned
    result, actual result, supported explanation and next-method change. The aim is not a score or a perfect
    streak.'
  prerequisites:
  - 'Default plan: prepare a simple lunch on three workdays; actual result: one lunch prepared, one ingredient
    unavailable and one morning interrupted. Use four headings—planned result, actual result, supported
    explanation and next-method change. The aim is not a score or a perfect streak.'
  dependencies: []
  safe_alternatives:
  - Review one item rather than a whole week, use voice notes or a trusted planning aid, and omit private
    narratives from application evidence. A synthetic review is useful for learning the method but does
    not establish a changed personal routine.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Review, measurement, and adaptation differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Review, measurement, and adaptation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default plan: prepare a simple lunch on three workdays; actual result: one lunch prepared, one
    ingredient unavailable and one morning interrupted. Use four headings—planned result, actual result,
    supported explanation and next-method change. The aim is not a score or a perfect streak. Goal: Compare
    outcomes with plans, distinguish causes from excuses and change one method so review leads to different
    action rather than repeated reflection. Scope: One review cannot establish a trend or prove a causal
    explanation. Uncontrollable events, resource limits and worthwhile abandoned goals must remain visible.
    Time and effort: Twenty minutes after one week, one comparable attempt the following week and ten
    minutes to close the loop. Adaptation: Review one item rather than a whole week, use voice notes or
    a trusted planning aid, and omit private narratives from application evidence. A synthetic review
    is useful for learning the method but does not establish a changed personal routine. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Review one item rather than a whole week, use voice notes or a trusted planning
    aid, and omit private narratives from application evidence. A synthetic review is useful for learning
    the method but does not establish a changed personal routine.
  expected_burden: Twenty minutes after one week, one comparable attempt the following week and ten minutes
    to close the loop.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Review, measurement, and adaptation protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Review, measurement, and adaptation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Review one
    item rather than a whole week, use voice notes or a trusted planning aid, and omit private narratives
    from application evidence. A synthetic review is useful for learning the method but does not establish
    a changed personal routine.
  actions:
  - stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01-A1
    sequence: 1
    title: Compare the original plan with what actually happened
    instructions: 'Keep the original target visible and record delivered, partial, missed or no-longer-needed
      outcomes. Separate an activity count from its intended benefit: buying ingredients is not the same
      as having lunch available. Note burden and adverse effects as well as wins. For the default, retain
      the two different missed-day reasons rather than summarize them as laziness.


      Observation checks: Original targets remain visible beside actual outcomes; Activities are distinguished
      from intended benefits; Burden and adverse effects are included; Different misses retain their distinct
      circumstances. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01-A1
      competency_stable_id: '11.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1109_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1109_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - original_targets_remain_visible_beside_actual_outcomes
        - activities_are_distinguished_from_intended_benefits
        - burden_and_adverse_effects_are_included
        - different_misses_retain_their_distinct_circumstances
      - measurement_id: c1109_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1109_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01-A2
    sequence: 2
    title: Choose one explanation that suggests a testable method change
    instructions: 'For the most useful gap, distinguish evidence from a plausible story and list one alternative
      cause. Choose a change under your control that would address the supported explanation: prepare
      the shelf-stable portion the evening before, not merely try harder. Define the next comparable opportunity,
      an observable result and a cost you will watch. Keep other major conditions as similar as practical.


      Observation checks: A supported explanation is separated from an untested story; At least one alternative
      cause is considered; One concrete method change addresses the selected gap; The next opportunity
      result and cost to watch are specified. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01
      action_stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01-A2
      competency_stable_id: '11.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
