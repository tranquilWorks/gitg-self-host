  - stable_id: PRACTICE-COMP-1109-REVIEW-MEASUREMENT-AND-ADAPTATION-01-A3
    sequence: 3
    title: Run the changed method and append the result
    instructions: 'Use the changed method at the next suitable opportunity. Record whether the intended
      benefit occurred, what conditions differed and whether a new burden appeared. Retain, revise or
      reject the method based on the attempt, including an unchanged or worse outcome. Put the next actual
      action in the calendar or workspace; a review that only produces a motivational sentence is not
      closed.


      Observation checks: The changed method is actually attempted; Benefit differing conditions and burden
      are recorded; Unchanged or worse outcomes can reject the method; The review ends with a concrete
      next action or reasoned stop. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: What did you do differently because of the review, and what evidence would make you
      stop using that change?


      Examples: Supportive: Evening preparation produced lunch on the next comparable day without delaying
      bedtime, so the method was retained provisionally.


      Mixed: Lunch was ready, but the evening preparation shifted a care task onto someone else and required
      revision.


      Contradictory: The target was rewritten after the fact so every outcome looked successful and no
      method changed.


      Inconclusive: A weekly reflection was completed, but the following week repeated the same plan without
      a new action.'
