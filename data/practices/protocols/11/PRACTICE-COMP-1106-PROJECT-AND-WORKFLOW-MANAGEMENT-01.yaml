meaning_and_fit:
  purpose: Manage scope, ownership, dependencies, risks, decisions, status and a definition of done so
    a multistep commitment can be completed or closed without hidden work.
  why_recommended: Manage scope, ownership, dependencies, risks, decisions, status and a definition of
    done so a multistep commitment can be completed or closed without hidden work.
  claims:
  - statement: Manage scope, ownership, dependencies, risks, decisions, status and a definition of done
      so a multistep commitment can be completed or closed without hidden work.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Project and workflow management practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Project and workflow management as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use index cards, spoken status or a shared accessible document instead of
    an app. In solo work, distinguish ownership from dependence on another person’s consent. Rehearse
    on a fictional cupboard when shared access is unavailable; that does not prove team delivery.
  opportunity_considerations: 'Default deliverable: a one-page instruction sheet for finding materials
    in a shared hobby cupboard. Use four columns—ready, doing, blocked and done—and five cards: agree
    scope, inspect the cupboard, draft, ask a willing reader to try it, and revise. Each card has one
    responsible owner, a due window and an observable output; a solo participant may own all cards.'
  prerequisites:
  - 'Default deliverable: a one-page instruction sheet for finding materials in a shared hobby cupboard.
    Use four columns—ready, doing, blocked and done—and five cards: agree scope, inspect the cupboard,
    draft, ask a willing reader to try it, and revise. Each card has one responsible owner, a due window
    and an observable output; a solo participant may own all cards.'
  dependencies: []
  safe_alternatives:
  - Use index cards, spoken status or a shared accessible document instead of an app. In solo work, distinguish
    ownership from dependence on another person’s consent. Rehearse on a fictional cupboard when shared
    access is unavailable; that does not prove team delivery.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Project and workflow management differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Project and workflow management
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default deliverable: a one-page instruction sheet for finding materials in a shared hobby cupboard.
    Use four columns—ready, doing, blocked and done—and five cards: agree scope, inspect the cupboard,
    draft, ask a willing reader to try it, and revise. Each card has one responsible owner, a due window
    and an observable output; a solo participant may own all cards. Goal: Manage scope, ownership, dependencies,
    risks, decisions, status and a definition of done so a multistep commitment can be completed or closed
    without hidden work. Scope: This is a small workflow exercise, not authority to manage people, regulated
    work or production systems outside an assigned role. Time and effort: Thirty minutes of setup plus
    three brief status checks during a one-week deliverable. Adaptation: Use index cards, spoken status
    or a shared accessible document instead of an app. In solo work, distinguish ownership from dependence
    on another person’s consent. Rehearse on a fictional cupboard when shared access is unavailable; that
    does not prove team delivery. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use index cards, spoken status or a shared accessible document instead of an app.
    In solo work, distinguish ownership from dependence on another person’s consent. Rehearse on a fictional
    cupboard when shared access is unavailable; that does not prove team delivery.
  expected_burden: Thirty minutes of setup plus three brief status checks during a one-week deliverable.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Project and workflow management protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Project and workflow management action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use index cards,
    spoken status or a shared accessible document instead of an app. In solo work, distinguish ownership
    from dependence on another person’s consent. Rehearse on a fictional cupboard when shared access is
    unavailable; that does not prove team delivery.
  actions:
  - stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01-A1
    sequence: 1
    title: Bound the deliverable and assign accountable ownership
    instructions: 'Agree who may change the cupboard and who only writes instructions. Define done as
      a reader finding and returning two agreed items from the sheet, with no private information exposed.
      Put the five cards in ready or blocked, assign one consenting owner per card and name the dependencies.
      Limit doing to one card per available worker so starting everything cannot masquerade as progress.


      Observation checks: Scope permission and the acceptance test are explicit; Every card has a consenting
      owner and observable output; Dependencies determine ready versus blocked status; Work in progress
      is bounded by actual capacity. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01
      action_stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01-A1
      competency_stable_id: '11.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1106_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1106_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - scope_permission_and_the_acceptance_test_are_explicit
        - every_card_has_a_consenting_owner_and_observable_output
        - dependencies_determine_ready_versus_blocked_status
        - work_in_progress_is_bounded_by_actual_capacity
      - measurement_id: c1106_a1_boundary
