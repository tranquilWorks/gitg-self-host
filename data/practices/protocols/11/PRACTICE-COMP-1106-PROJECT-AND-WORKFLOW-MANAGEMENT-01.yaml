  - stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01-A2
    sequence: 2
    title: Advance the cards and record decisions where they occur
    instructions: 'Complete the first ready card, move it only when its output exists and review the board
      at three short checkpoints. For a blocked card, record the missing input, owner of the unblock action
      and next check. Keep a tiny decision log—choice, reason and date—when scope or wording changes.
      Escalate an approaching miss early instead of moving the due date without notice.


      Observation checks: Card movement follows actual outputs; Blocked work has a named missing input
      and next check; Scope-changing decisions retain their reason and date; A threatened commitment is
      communicated before silent slippage. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01
      action_stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01-A2
      competency_stable_id: '11.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
