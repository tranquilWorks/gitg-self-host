  - stable_id: PRACTICE-COMP-1106-PROJECT-AND-WORKFLOW-MANAGEMENT-01-A3
    sequence: 3
    title: Verify the deliverable and close the remaining obligations
    instructions: 'Ask a willing reader to use the sheet or conduct labeled self-review. Compare the result
      with the original definition of done and fix one observed gap within scope. Return borrowed materials,
      communicate delivery or cancellation and archive only necessary non-sensitive decisions. Mark unfinished
      cards deferred or canceled with a reason; do not make them disappear to produce a clean board.


      Observation checks: The original acceptance test is actually run; An observed gap is corrected or
      explicitly remains open; Delivery cancellation and borrowed resources are closed responsibly; Unfinished
      cards retain an honest disposition. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Could another person tell what was done, what was blocked and who owed the next action
      without relying on your memory?


      Examples: Supportive: The sheet passed both retrieval tests, one confusing label was corrected and
      the board recorded the final handoff.


      Mixed: A useful draft existed, but nobody owned reader testing, so the deliverable was not yet done.


      Contradictory: Blocked cards were moved to done and ownership assigned to people who never agreed
      to help.


      Inconclusive: A workflow tool was configured while no card produced an output or acceptance test.'
