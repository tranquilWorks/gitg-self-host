  - stable_id: PRACTICE-COMP-1104-MILESTONES-AND-TASK-DECOMPOSITION-01-A2
    sequence: 2
    title: Mark dependencies and expose one likely blockage
    instructions: 'Connect only genuine prerequisites, identify tasks that can proceed independently and
      name the longest uncertain wait. Add a checkpoint before spending money or promising a date. For
      the default, a no-response condition after three days triggers a smaller group or cancellation rather
      than endless reminders. Turn the first unblocked task into a verb, object and stopping point.


      Observation checks: Genuine prerequisites and parallel work are distinguished; An uncertain wait
      or likely blockage is named; A checkpoint includes a fallback rather than only a date; The first
      unblocked task has a verb object and stopping point. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
