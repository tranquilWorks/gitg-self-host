meaning_and_fit:
  purpose: Decompose a desired result into dependencies, stages, checkpoints and immediately executable
    actions without mistaking a long task list for a workable sequence.
  why_recommended: Decompose a desired result into dependencies, stages, checkpoints and immediately executable
    actions without mistaking a long task list for a workable sequence.
  claims:
  - statement: Decompose a desired result into dependencies, stages, checkpoints and immediately executable
      actions without mistaking a long task list for a workable sequence.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Milestones and task decomposition practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Milestones and task decomposition as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use three cards instead of a detailed diagram, or have a trusted person read
    the next action aloud. A personal non-social project can replace the default when coordination is
    inaccessible. A simulated invitation map is preparation, not evidence of an event held.
  opportunity_considerations: 'Default project: hold a free one-hour book discussion for three willing
    adults. The supplied stages are confirm purpose and interest, agree access and time, prepare two questions,
    hold the discussion, and send an optional follow-up. Use paper cards and mark dependencies with arrows;
    no project-management software is required.'
  prerequisites:
  - 'Default project: hold a free one-hour book discussion for three willing adults. The supplied stages
    are confirm purpose and interest, agree access and time, prepare two questions, hold the discussion,
    and send an optional follow-up. Use paper cards and mark dependencies with arrows; no project-management
    software is required.'
  dependencies: []
  safe_alternatives:
  - Use three cards instead of a detailed diagram, or have a trusted person read the next action aloud.
    A personal non-social project can replace the default when coordination is inaccessible. A simulated
    invitation map is preparation, not evidence of an event held.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Milestones and task decomposition differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Milestones and task decomposition
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
