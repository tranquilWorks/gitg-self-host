  - Using the Milestones and task decomposition protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Milestones and task decomposition action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use three cards
    instead of a detailed diagram, or have a trusted person read the next action aloud. A personal non-social
    project can replace the default when coordination is inaccessible. A simulated invitation map is preparation,
    not evidence of an event held.
  actions:
  - stable_id: PRACTICE-COMP-1104-MILESTONES-AND-TASK-DECOMPOSITION-01-A1
    sequence: 1
    title: Work backward from a visible finished result
    instructions: 'Write what must exist at the endpoint and split it into three to five milestones that
      each produce something inspectable. For the discussion, interest and access agreement precede a
      confirmed time, while drafting questions can begin before all replies arrive. Separate a milestone
      such as time confirmed from an activity such as sending messages.


      Observation checks: The finished result has a visible acceptance condition; Three to five milestones
      each yield an inspectable result; Activities are distinguished from milestone outcomes; Required
      participation and access are not assumed. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
