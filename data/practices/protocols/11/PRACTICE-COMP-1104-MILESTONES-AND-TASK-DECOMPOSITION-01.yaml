  - stable_id: PRACTICE-COMP-1104-MILESTONES-AND-TASK-DECOMPOSITION-01-A3
    sequence: 3
    title: Execute the first unblocked action and update the map
    instructions: 'Perform the defined first action, such as sending one low-pressure interest invitation
      with two proposed time windows. Record the actual output and any new dependency. At the next checkpoint,
      mark milestones complete only when their result exists; re-sequence or stop the project if the prerequisite
      fails. Do not count planning every stage as delivering the event.


      Observation checks: The first action produces an actual output; New information updates the dependency
      map; Milestone completion requires its promised result; A failed prerequisite leads to an explicit
      fallback or stop. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.


      Final review: Which dependency controlled progress, and can the next person identify the next unblocked
      action without asking you to reinterpret the plan?


      Examples: Supportive: An interest invitation was sent, access needs were checked and question drafting
      began while the time remained provisional.


      Mixed: The milestone map was usable, but the first action depended on an unanswered message that
      should have been marked blocked.


      Contradictory: The meeting was announced as confirmed before participants or an accessible location
      had agreed.


      Inconclusive: A list of fifty tasks was created without prerequisites, checkpoints or any task actually
