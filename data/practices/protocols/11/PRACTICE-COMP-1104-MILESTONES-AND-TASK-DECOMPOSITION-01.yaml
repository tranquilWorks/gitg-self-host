  - id: file-later-packet-md
    title: Later packet
    body: 'These are mutually exclusive fictional branches. Do not combine evidence across them. Neither
      contains a completed discussion.


      **Branch READY:** By Day 2, guest R accepts Day 6 18:00–18:20 and an audio format. Guest T accepts
      the same interval and asks to receive the story and questions in text before the session. Both explicitly
      accept a no-cost existing arrangement that provides audio plus those text materials. No diagnosis
      or private explanation is requested. The host has drafted the two questions but has not yet issued
      the final confirmation or held the session.


      **Branch BLOCKED:** By Day 3 at noon, R accepts the proposed time. T has not replied. No alternative
      guest, accepted access arrangement for T, or consent from T exists. A one-guest conversation is
      possible only if its revised scope is explicitly chosen and agreed; the original two-guest goal
      has not been satisfied.


      For each branch, keep the original requirement, mark the next actual evidence needed, and apply
      the fallback without assuming that a planned or simulated event occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Purpose and a useful finish


      Turn a finished outcome into inspectable stages, genuine dependencies, and a next action that can
      actually start. A long task list is not a sequence. A message sent is not an agreement received,
      and a scheduled checkpoint is not a milestone achieved.


      **Canonical scope:** Break outcomes into dependencies, stages, next actions, and checkpoints.


      Your deliverable is a dependency map, milestone evidence, one completed first artifact, and a revision
      for a blocked prerequisite. Allow about 30 minutes for the fictional planning route. Use paper cards,
      an outline, a text editor, or dictation. All reading and participant-response materials are supplied.
      No live invitation, calendar event, account, purchase, or real meeting is required or automatically
      created.


      This is a bounded planning exercise, not evidence that an event occurred or that you can estimate
      a large regulated project. A real social route requires willing participation and appropriate access;
      a no-response or decline is not a person failing your project plan.


      ### Reference: outcomes, work, and waiting are different


      A **deliverable** is an inspectable result, such as a confirmed arrangement or a question sheet.
      An **activity** is work performed to produce it, such as sending an invitation. A **milestone**
      records a meaningful state reached, not merely elapsed effort. “Time and access agreed” needs actual
      agreement; “sent three reminders” does not prove it.


      A **dependency** is a prerequisite that must genuinely be met before the dependent work or commitment
      can proceed. Question drafting can often begin before all replies arrive. Announcing a confirmed
      session cannot honestly precede the necessary agreements. Distinguish a logical dependency from
      a preference to do tasks in a familiar order.


      **Effort** is time spent working. **Elapsed time** also includes waits, fixed dates, resource limits,
      and gaps. Two tasks can be logically independent but still compete for one person''s attention.
      A parallel network calculation is not a promise that a single person can do two things simultaneously.


      A **checkpoint** asks whether a condition has been met and specifies a decision when it has not.
      A date with no decision rule merely reminds you that time passed. Define the evidence to inspect,
      the person responsible, and a fallback that does not quietly change the original outcome.


      A startable **next action** has a verb, object, materials, and stopping point. “Organize event”
      hides many decisions. “Draft the invitation below with two time options and an access question;
      stop when it is ready for review” produces a concrete artifact without falsely claiming it has been
      sent.


      These distinctions draw on product-oriented planning background, not a requirement to use project-management
      software or heavyweight paperwork. See [source notes](?resource=sources).


      ### Different worked example: build a small paper index


      A toy project has five tasks: A define the purpose (5 minutes), B draft sample entries (10, after
      A), C make labels (5, after A), D assemble the index (5, after B and C), and E inspect it (5, after
      D). With enough independent workers and no transition costs, its earliest network completion is
      25 minutes: `5 + max(10,5) + 5 + 5`.


      One worker who cannot overlap work needs 30 minutes for those same task durations. B and C are logically
      parallel, not magically concurrent for that person. The milestone “index inspected” requires E''s
      result, not a calculation saying 25 minutes should have passed. These are stipulated toy durations,
      not measured estimates for real work.


      ### Complete practice packet: a small reading discussion


      The fictional goal is a **20-minute discussion with the host and two willing adult guests**, using
      the original story below. The purpose is to exchange interpretations, not reach agreement or score
      participants. The candidate session is Day 6 from 18:00 to 18:20. No cost or new account is allowed.
      Both guests must agree to timing and a communication arrangement that works for them before the
      session is announced as confirmed.


      The planning allowance is **40 active minutes before the session**, separate from the session itself
      and a five-minute closing review. Replies can take up to the Day 3 noon checkpoint. That wait is
      elapsed time, not active preparation. Use the following work estimates as fixed case assumptions:


      | ID | Work and inspectable output | Active minutes | Prerequisite |

      | --- | --- | --- | --- |

      | S | Write purpose, attendance condition, and constraints | 5 | None |

      | I | Draft/send an appropriate invitation on a live route; draft only in simulation | 5 | S |

      | D | Prepare story and two discussion questions | 10 | S |

      | A | Check replies, access needs, and available arrangements | 10 | I plus required replies |

      | C | Confirm the agreed time and arrangement | 5 | A and D |

      | E | Hold the chosen session and record whether it occurred | 20 | C and the agreed session time
      |

      | R | Record closeout and an optional next step | 5 | E |


      The source exercise does not require sending anything. In simulation, I is a completed draft artifact
      and the later packet supplies fictional replies. That is not equivalent to live invitations or consent.
      The event milestone remains simulated unless an actual willing session occurs.


      #### Original story supplied for the discussion


      > The community cupboard had one blank shelf. Ari suggested filling it with useful things immediately;
      Bea wanted to leave space for needs nobody had named yet. They wrote a temporary sign: “Available
      space—ask before adding.” During the week, someone asked for room to leave a repaired puzzle, and
      another person needed an empty surface to sort borrowed cards. Neither use had appeared on the first
      list. On Friday, Ari proposed keeping half the shelf empty. Bea agreed to try it, but asked them
      to review whether the sign itself made people hesitate to ask. They kept the old list rather than
      pretending they had predicted the new uses.


      Two supplied questions are: **What evidence should change the first plan?** and **When does leaving
      space serve a purpose rather than represent unfinished work?** Other respectful questions can work,
      but use the supplied ones for the default. No literary expertise or external reading is needed.
      The story is an original fictional exercise, not a claim about a real community.


      #### Invitation draft template


      “I am considering a 20-minute discussion of a short story on Day 6 at 18:00. There is no obligation
      to join or to agree with anyone. Would that time and length work? What communication format or access
      support would make participation usable for you? I will confirm only after checking agreement. A
      decline or no response is fine.”


      Do not collect diagnoses or private explanations for an access preference. Availability, consent,
      and an agreed communication arrangement are sufficient for this bounded task.


      #### Action 1 — Work backward from inspectable milestones


      Write five milestones: **M1 scope recorded; M2 interest, time, and access needs known; M3 materials
      ready; M4 arrangement confirmed; M5 session occurred and closeout recorded**. For each, state the
      evidence that would establish it and what would leave it pending.


      Map S/I/D/A/C/E/R to these states. Treat materials D as work that can proceed after S while replies
      are pending. Mark A as blocked until the relevant reply information exists. Do not confuse “access
      question asked” with “access arrangement accepted.”


      Use this form:


      `Milestone | evidence required | producing tasks | prerequisites | owner | current status | checkpoint
      | fallback if evidence is absent`


      A simple three-card version is allowed if it retains scope, readiness, and actual completion with
      their dependencies. Do not use a smaller display to erase consent or the final event requirement.


      #### Action 2 — Expose the wait and define an honest fallback


      Before looking at the later packet, define the Day 3 noon decision. If both guests have agreed and
      an accessible no-cost arrangement is available, proceed toward C. If a guest declines, has not replied,
      or cannot use the proposed arrangement, do not announce the original session as confirmed.


      A smaller discussion with one guest can be a legitimate **revised goal**, but not completion of
      the original two-guest goal. A solo reflection can be useful yet is not a group discussion. A postponed
      or cancelled event may be the appropriate outcome. Do not pressure a missing guest, send endless
      reminders, or infer consent from silence.


      Compute active preparation from S, I, D, A, and C. Compare it with 40 minutes. Keep the 20-minute
      session, five-minute closeout, and up-to-two-day response wait distinct. A guessed response time
      is not guaranteed capacity.


      #### Action 3 — Produce the first artifact and update the map


      Actually write S''s scope card and the invitation draft using the supplied template. This is an
      authentic artifact you can produce now without pretending to contact anyone. Record whether the
      route is draft simulation or an authorized live invitation. Then open **later-packet.md** and analyze
      its two alternative branches separately.


      In the ready branch, identify what evidence supports each readiness milestone and what still has
      not occurred. In the blocked branch, apply the prespecified Day 3 fallback and preserve the original
      goal. Do not mix the successful reply from one branch into the other.


      Choose the next unblocked action and its stopping point. If new information creates a dependency,
      update the map and retain the prior version. At closeout, mark an outcome complete only when its
      promised result exists. Completing all planning documents is not evidence of holding the session.


      ### Fresh checks and completion boundary


      Save responses to **check-prompts.md**, then open **check-answers.md**. The checks expose a dependency
      cycle and distinguish resource-constrained effort from a parallel critical path. Both are planning
      exercises, not scheduling software or authorization to act on other people''s calendars.


      A complete learning artifact contains a goal, inspectable milestones, genuine dependencies, a wait/fallback
      rule, a produced scope/invitation draft, and branch-specific status updates. The canonical ability
      to start a complex goal is practiced by the first artifact. Actual event completion remains a separate
      evidence claim.


      ### Adaptations and progression


      Use large labeled cards, an audio outline, or an assistant who reads the next action without choosing
      its status. A non-social project can substitute when coordination is inaccessible; give it its own
      finished condition and do not report social transfer. Keep required communication supports in place
      rather than treating unsupported participation as independence.


      For a more demanding route, add an uncertain effort range, a shared resource, or a rework path.
      Recalculate the plan and mark what depends on an estimate rather than an agreement. Do not add every
      possible contingency until the next action disappears under planning overhead.


      For later transfer, inspect one actual small project at its next checkpoint. Did the promised evidence
      exist? Did a missed dependency reveal a genuine planning defect or a changed external condition?
      Use that distinction to revise the map without rewriting what was known earlier.


      **Supportive:** Materials are drafted while replies are pending, confirmation waits for actual agreement,
      and a failed prerequisite triggers a versioned fallback.


      **Mixed:** Milestones are clear, but an invitation draft is reported as sent or the event is marked
      done because its scheduled time passed.


      **Contradictory:** Silence becomes consent, a new smaller goal is reported as the original goal
      achieved, or one worker is scheduled as if independent tasks required no shared capacity.


      **Inconclusive:** A long task list has no prerequisites, acceptance evidence, startable action,
      or decision when a reply is absent.


      **Final review:** Which dependency controls the next commitment, and can another reader identify
      the next unblocked action without inventing an agreement or reinterpretation?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your reasoning before opening the corrective guidance.


      ### Check A — A circular plan and a missing agreement


      A fictional event plan says “Choose an arrangement only after sending the final confirmation” and
      “Send final confirmation only after the arrangement is accepted.” Neither has happened. One participant
      has not replied. The host proposes resolving the blockage by marking both tasks complete and assuming
      the participant agrees.


      Identify the dependency cycle and the missing external evidence separately. Repair the plan by distinguishing
      a provisional proposal from an accepted arrangement and final confirmation. Give a startable action
      that does not assume consent. What must remain blocked?


      ### Check B — Parallel logic is not extra workers


      A paper-index project uses A=5 minutes, B=10, C=5, D=5, E=5. A has no prerequisites; B and C require
      A; D requires both B and C; E requires D. Tasks cannot be interrupted, and transitions take zero
      minutes in this toy calculation.


      List all valid task orders for a single worker. Calculate total active work and the earliest possible
      completion with enough independent workers. Now B is revised to 8 minutes while all other facts
      stay fixed; recalculate both figures. Explain why the dependency graph does not, on its own, establish
      the availability of multiple workers or validate the duration estimates.


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A task network has A=6 minutes and B=9 minutes that can run independently. C=4 minutes requires
      both A and B. One person must actively perform every task; no task can run unattended. Contrast
      the logical dependency lower bound with the one-person feasible duration.'
