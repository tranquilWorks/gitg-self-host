  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default project: hold a free one-hour book discussion for three willing adults. The supplied
    stages are confirm purpose and interest, agree access and time, prepare two questions, hold the discussion,
    and send an optional follow-up. Use paper cards and mark dependencies with arrows; no project-management
    software is required. Goal: Decompose a desired result into dependencies, stages, checkpoints and
    immediately executable actions without mistaking a long task list for a workable sequence. Scope:
    One small project demonstrates decomposition. It does not establish estimating competence for large,
    regulated or safety-critical projects. Time and effort: Twenty-five minutes to map a project and one
    15-minute first action. Adaptation: Use three cards instead of a detailed diagram, or have a trusted
    person read the next action aloud. A personal non-social project can replace the default when coordination
    is inaccessible. A simulated invitation map is preparation, not evidence of an event held. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use three cards instead of a detailed diagram, or have a trusted person read the
    next action aloud. A personal non-social project can replace the default when coordination is inaccessible.
    A simulated invitation map is preparation, not evidence of an event held.
  expected_burden: Twenty-five minutes to map a project and one 15-minute first action.
  action_count_rationale: null
