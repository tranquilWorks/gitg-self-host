  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      Active preparation is `S5 + I5 + D10 + A10 + C5 = 35` minutes, within the 40-minute allowance. Adding
      E20 and R5 gives **60 active minutes** across preparation, session, and closeout. The response wait
      and fixed Day 6 session date are elapsed-time constraints, not active work that can be added as
      two minutes or ignored when promising a date.


      After S, both I and D can proceed logically. A needs the relevant replies; C needs A and D; E needs
      C and the agreed time; R needs E. A useful first artifact is the written scope card or invitation
      draft with its consent/access question. A draft can be completed without claiming it was sent.


      In READY, the fictional replies support the participation/time/access basis for readiness, and the
      questions are drafted. Final confirmation remains to be issued and the session has not occurred.
      Do not mark M5 complete. The text materials must actually be prepared/provided in the live arrangement
      before claiming the corresponding support is delivered.


      In BLOCKED, T''s silence leaves the original two-guest readiness condition unmet. Apply the Day
      3 rule: postpone, cancel, or explicitly revise to a smaller agreed activity. The smaller goal is
      not retrospective completion of the original one. Do not borrow T''s READY reply to resolve this
      branch.


      A milestone should name its evidence, not merely a number of tasks checked off. The learner''s real
      scope and draft artifacts support planning practice; fictional reply analysis supports simulation
      only.


      ### Check A — A circular plan and a missing agreement


      The two stated dependencies form a cycle: final confirmation requires accepted arrangement, while
      choosing an arrangement requires final confirmation. Marking tasks complete would conceal the defect
      rather than resolve it.


      Separate a **provisional arrangement proposal** from its **acceptance** and the **final confirmation**.
      Draft a no-pressure proposal containing the relevant time and access choices, then seek the necessary
      reply on an authorized live route. In a simulation, produce the draft and retain the reply as missing.


      Final confirmation remains blocked until the actual required agreement exists. Removing the logical
      cycle does not create the missing participant''s consent. That is a distinct external dependency
      with its own checkpoint and fallback.


      ### Check B — Parallel logic is not extra workers


      The only single-worker orders are **A-B-C-D-E** and **A-C-B-D-E**. All tasks require **30 active
      minutes**. With enough independent workers and zero transitions, the network lower bound is `5 +
      max(10,5) + 5 + 5 = 25` minutes.


      When B becomes eight minutes, total single-worker active work is **28** and the parallel network
      lower bound is `5 + max(8,5) + 5 + 5 = 23`. The graph has not supplied a second worker, confirmed
      their availability, or measured the task durations. Those assumptions must be checked before using
      the figures as real commitments.


      Repair an overclaim by naming the resource assumption and separating calculated lower bound, active
      effort, observed duration, and actual milestone completion.


      ### Changed-case answer


      If separate capable workers truly run A and B together, the dependency bound is max(6,9)+4=13 minutes.
      With one active worker, A and B must be sequential: 6+9+4=19 minutes before any transition time.
      A diagram’s parallel branches do not create available labor.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
