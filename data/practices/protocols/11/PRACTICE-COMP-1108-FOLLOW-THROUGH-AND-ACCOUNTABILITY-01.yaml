meaning_and_fit:
  purpose: Track a promise, surface delivery risk early and either complete it or obtain an explicit renegotiation
    so another person can plan around reliable information.
  why_recommended: Track a promise, surface delivery risk early and either complete it or obtain an explicit
    renegotiation so another person can plan around reliable information.
  claims:
  - statement: Track a promise, surface delivery risk early and either complete it or obtain an explicit
      renegotiation so another person can plan around reliable information.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Follow-through and accountability practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Follow-through and accountability as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible reminders, supported transport or written communication; needing
    assistance does not invalidate reliability. Where contacting a person is unsafe, use an authorized
    intermediary or appropriate support. A fictional promise rehearsal demonstrates planning and wording
    only.
  opportunity_considerations: 'Default: you agree to return a borrowed book by Friday. Record the promised
    object or result, recipient, time, return method and a Thursday risk checkpoint. Keep identifying
    details in private working notes, not in application evidence. Choose only a promise you have authority
    and capacity to make.'
  prerequisites:
  - 'Default: you agree to return a borrowed book by Friday. Record the promised object or result, recipient,
    time, return method and a Thursday risk checkpoint. Keep identifying details in private working notes,
    not in application evidence. Choose only a promise you have authority and capacity to make.'
  dependencies: []
  safe_alternatives:
  - Use accessible reminders, supported transport or written communication; needing assistance does not
    invalidate reliability. Where contacting a person is unsafe, use an authorized intermediary or appropriate
    support. A fictional promise rehearsal demonstrates planning and wording only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Follow-through and accountability differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Follow-through and accountability
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: you agree to return a borrowed book by Friday. Record the promised object or result,
    recipient, time, return method and a Thursday risk checkpoint. Keep identifying details in private
    working notes, not in application evidence. Choose only a promise you have authority and capacity
    to make. Goal: Track a promise, surface delivery risk early and either complete it or obtain an explicit
    renegotiation so another person can plan around reliable information. Scope: Reliability is not unlimited
    availability. This exercise cannot override unsafe dependency, labor rights, professional duties or
    another person’s freedom to decline a changed arrangement. Time and effort: Ten minutes to clarify
    a small commitment, two five-minute checks and a brief delivery or renegotiation. Adaptation: Use
    accessible reminders, supported transport or written communication; needing assistance does not invalidate
    reliability. Where contacting a person is unsafe, use an authorized intermediary or appropriate support.
    A fictional promise rehearsal demonstrates planning and wording only. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible reminders, supported transport or written communication; needing
    assistance does not invalidate reliability. Where contacting a person is unsafe, use an authorized
    intermediary or appropriate support. A fictional promise rehearsal demonstrates planning and wording
    only.
  expected_burden: Ten minutes to clarify a small commitment, two five-minute checks and a brief delivery
    or renegotiation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Follow-through and accountability protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Follow-through and accountability action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    reminders, supported transport or written communication; needing assistance does not invalidate reliability.
    Where contacting a person is unsafe, use an authorized intermediary or appropriate support. A fictional
    promise rehearsal demonstrates planning and wording only.
  actions:
  - stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01-A1
    sequence: 1
    title: Confirm exactly what has been promised
    instructions: 'Write the result and deadline in terms the recipient could recognize. Clarify an ambiguous
      detail before relying on it: Friday means before their trip, not whenever convenient. Check the
      necessary resource and travel or contact method. Place one reminder early enough to correct a problem
      and identify who must be informed if delivery becomes doubtful.


      Observation checks: The recipient-recognizable result and deadline are confirmed; Ambiguity is clarified
      rather than silently resolved in your favor; Resources and delivery method are checked; An early
      risk checkpoint and communication recipient are set. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01
      action_stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01-A1
      competency_stable_id: '11.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1108_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1108_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_recipient_recognizable_result_and_deadline_are_confirmed
        - ambiguity_is_clarified_rather_than_silently_resolved_in_your_favor
        - resources_and_delivery_method_are_checked
        - an_early_risk_checkpoint_and_communication_recipient_are_set
      - measurement_id: c1108_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
