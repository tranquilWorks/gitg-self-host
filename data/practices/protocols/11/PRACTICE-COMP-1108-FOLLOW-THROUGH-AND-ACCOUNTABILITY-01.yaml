  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [NASA, 6.1 Technical Planning](https://www.nasa.gov/reference/6-1-technical-planning/)

      - [NASA, 6.7 Technical Assessment](https://www.nasa.gov/reference/6-7-technical-assessment/)

      - [Institute for Healthcare Improvement, Model for Improvement](https://www.ihi.org/library/model-for-improvement)

      - [CDC/NIOSH, Fatigue and Work](https://www.cdc.gov/niosh/fatigue/about/index.html)

      - [Western Australia Centre for Clinical Interventions, Assertiveness](https://www.cci.health.wa.gov.au/Resources/Looking-After-Yourself/Assertiveness)'
  - id: file-later-packet-md
    title: Later packet
    body: 'The Thursday noon risk message is stipulated sent within each branch. These are not messages
      the learner sent.


      **A — explicit revision and receipt:** Thursday 12:30 Ren: “Yes, I accept Jo collecting Thursday
      at 18:00 and handing Blue Atlas to me Friday at 09:00 at the hobby room.” Thursday 18:00 Jo receives
      the book. Friday 09:00 Jo says it was handed over. Friday 09:05 Ren: “Blue Atlas received in good
      condition at 09:00. Thank you.”


      **B — ambiguous then absent reply:** Thursday 12:30 Ren: “Thanks for letting me know.” A single
      clarification at 13:00 asks whether the exact Jo arrangement is accepted. No reply arrives before
      16:00. The borrower retains the book. Friday 17:00 the book has not been returned. Saturday 10:00
      Ren says: “I left without it and could not use it on the trip. Please return it to me Monday at
      18:00 here.” The borrower has a confirmed feasible no-cost route for that Monday handoff and can
      accept it. No Monday delivery event is supplied.


      **C — accepted revision, failed receipt:** Ren gives the same explicit Thursday 12:30 acceptance
      as A. Jo collects Thursday at 18:00. Friday 09:00 Jo reports the hobby room was shut and retains
      the book safely. No handoff occurred. At 09:10 Ren is told of the miss and asked about a feasible
      later handoff. No reply or delivery is supplied. The accepted Friday 09:00 revision was missed;
      the later proposal is pending. The original Friday 17:00 record still exists as history, not a silently
      restored agreement.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Keep the promise visible until it is resolved


      Accountability lets another person and your future self plan around what you actually committed
      to do. It preserves the original promise, checks risk early, communicates while alternatives remain
      useful, and follows delivery through to receipt or explicit uncertainty. Sending a proposed change
      is not an accepted renegotiation. Attempting delivery is not confirmed receipt.


      Use the fictional borrowed-book case to practice the full chain without contacting anyone. Allow
      10 minutes for the promise and risk decision, two five-minute updates and 10 minutes for checking.
      Paper, dictation or a text editor are sufficient. No real account, travel, book, recipient or private
      disclosure is required. You will create a promise record, messages and a branch-specific closure
      ledger. These are simulated communication artifacts, not live reliability evidence.


      Use a live route only for a small promise within your authority and capacity. Reliability does not
      mean unlimited availability. Unsafe contact, essential care, professional obligations or consequential
      disputes need the appropriate existing support/process; this exercise does not settle them.


      ### Reference: agreement, action and receipt are different states


      Record the promised object/result, recipient, deadline, method and any acceptance condition in words
      the recipient would recognize. Clarify ambiguity before relying on it. “Friday” may mean before
      a trip, not late evening. A risk checkpoint should precede the latest useful opportunity to act;
      a reminder after all alternatives close is too late.


      A **proposal** requests a specific alternative. An **accepted revision** needs the affected person''s
      clear agreement to its material terms. A vague reply, reaction icon or silence leaves the proposal
      pending. You can decline a new optional request without the requester''s approval; that differs
      from revising an existing promise on which someone relies.


      A **delivery attempt** records what you did and when. **Receipt** records evidence that the agreed
      recipient or authorized receiving route actually received the promised item. Where the agreed method
      itself defines receipt (for example a named staffed desk receipt), use that definition; otherwise
      do not invent it afterward. A read indicator proves neither acceptance of changed terms nor physical
      delivery.


      If the deadline passes unmet, preserve the missed promise and acknowledge its impact. A later successful
      return can close the remaining obligation without turning it into on-time delivery. Repair should
      be proportionate, specific, safe and within your control; another person may decline your proposed
      repair.


      ### A different worked example


      You promised a two-page agenda by Tuesday noon. Monday you send, “Could I send one page on Wednesday?”
      The recipient replies, “Thanks for telling me.” That acknowledges the message, not the new scope
      or deadline. Ask a concise clarification while keeping Tuesday noon as the original commitment.
      If noon passes, mark the original missed; do not edit it to Wednesday and call the record accurate.


      ### Complete fictional promise packet


      All times use the same local clock, with no time-zone conversion. The book is *Blue Atlas*, one
      undamaged copy. The original exchange is preserved:


      - Monday 09:00, borrower: “I will return Blue Atlas to you at the hobby room Friday by 17:00, before
      your 17:30 departure.”

      - Monday 09:10, owner Ren: “Agreed. Please hand it to me; don''t leave it outside or send it through
      someone else without checking with me.”

      - Monday 09:15, borrower: “Confirmed. I will check transport Thursday at 12:00.”


      The book is ready and undamaged. Direct return would require leaving home Friday by 16:20 for a
      30-minute trip plus a 10-minute arrival margin. The margin is not a guarantee against all travel
      disruption. On Thursday at 12:00, the scheduled service for that trip is confirmed cancelled and
      no other direct route is available within the borrower''s capacity. No new paid transport is part
      of the default.


      A feasible **proposed** alternative is available: Jo, an adult known to both people, has explicitly
      agreed in this fictional case to pick up the book Thursday at 18:00 and hand it to Ren Friday at
      09:00 at the hobby room. Jo is not yet authorized by Ren. Ren can check messages Thursday until
      16:00. If no clear reply arrives, the alternative is not approved. One clarification before 16:00
      is possible; repeated pressure is not required.


      #### Action 1 — Freeze the actual promise


      Create `original promise | agreed at | recipient | result | due | method | latest useful departure
      | risk checkpoint | status`. Preserve the Monday exchange and Friday 17:00 due time. Explain why
      Thursday noon is useful: it leaves time for a clear response before the 16:00 message window and
      proposed 18:00 pickup. The Friday 16:20 departure boundary is the latest useful start for the original
      route, not the time to start thinking about alternatives.


      Keep real identifying details in private working notes on a live route, not public evidence. The
      fictional names here need no private disclosure.


      #### Action 2 — Communicate the threatened miss and a feasible alternative


      At the stipulated Thursday checkpoint write a message with the original commitment, the concrete
      risk, a brief non-sensitive reason and the alternative needing agreement. For example: “I promised
      Blue Atlas to you Friday by 17:00 in person. The return service is cancelled, so I cannot currently
      make that route. Jo has agreed to collect it Thursday at 18:00 and hand it to you Friday at 09:00.
      Would you accept that? I will keep the original promise recorded until you confirm.”


      Record the message as drafted in this exercise. In the later simulation, supplied messages may be
      analyzed as fictional sent events, never reported as your actual contacts. Preserve the latest decision
      point: if agreement is still unclear before Thursday 16:00, record the unresolved original and report
      the likely miss. Do not pass the book to Jo without Ren''s approval.


      Open [later-packet.md](?resource=file-later-packet-md) after saving the original and draft. Work
      each branch independently. A clear acceptance in A cannot be borrowed to resolve B or C.


      #### Action 3 — Record receipt or repair without changing history


      For each branch produce an ordered ledger: `event time | observed/supplied event | agreement state
      | delivery state | original deadline status | next action`. Preserve proposed and accepted terms
      separately. A transfer to an authorized intermediary is a delivery step; it is not necessarily final
      recipient receipt.


      When receipt is supported, record the exact agreed result and the supporting event. If receipt is
      uncertain, say what is unknown and choose an appropriate low-burden check. If delivery fails, acknowledge
      the miss and stated impact, propose a feasible repair and retain it as proposed until accepted.
      Carry out only the action you can actually perform on a live route; a sentence promising repair
      is not repair completed.


      Attempt [check-prompts.md](?attempt=practice-checks) before [check-answers.md](?check=practice-answers).
      A complete learning artifact preserves the promise and all branches, distinguishes acceptance from
      acknowledgment, and contains a repair decision.


      ### Access, challenge and later transfer


      Use accessible reminders, written/augmentative communication or agreed transport support. Record
      actual support as support; accepting help can make a commitment more reliable. Where direct contact
      is unsafe, use an authorized intermediary or appropriate support rather than the practice script.


      For a harder supplied variation, Ren approves Jo only for Friday 09:00, then Jo reports Thursday
      17:00 that pickup is impossible. The first acceptance does not approve a different courier. Reopen
      the delivery risk, preserve the accepted revision, seek another explicit agreement and report a
      missed revision if it remains unmet. Do not silently fall back to whichever date is easiest.


      Later, follow one real modest promise through its actual checkpoint, delivery route and receipt.
      Preserve a missing reply or failed promise when that is what occurs. Independent observation exists
      only if someone actually observes and consents to the appropriate reporting; self-attestation is
      not that evidence. Use the result to change one reminder or pre-promise capacity check.


      **Supportive:** Risk is communicated early, revised terms are explicitly accepted and receipt is
      confirmed under those terms.


      **Mixed:** The item arrives but warning was too late to avoid disruption, or the item reached an
      intermediary while final receipt remains unconfirmed.


      **Contradictory:** The original deadline is silently rewritten, silence is treated as consent or
      another person is blamed for relying on the promise.


      **Inconclusive:** A reminder and proposal exist, with no acceptance, delivery or receipt evidence.


      The distinction between promise revision and boundaries follows this project''s explicit source
      and evidence limits; planning background and claim limits are in [SOURCES.md](?resource=sources).'
