  - stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01-A2
    sequence: 2
    title: Act on a threatened miss before the deadline passes
    instructions: 'At the checkpoint, inspect actual progress rather than confidence. If the book cannot
      be returned as promised, send a concise message stating what is at risk, why at a non-sensitive
      level, and one feasible alternative such as a different return time or approved drop-off. Ask whether
      the alternative works; do not treat sending the message as consent. If there is no risk, complete
      the preparation for delivery.


      Observation checks: The checkpoint uses actual progress or resource availability; A threatened miss
      is communicated while alternatives remain useful; The proposed alternative is feasible and specific;
      Renegotiation requires agreement rather than a unilateral date change. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01
      action_stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01-A2
      competency_stable_id: '11.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
