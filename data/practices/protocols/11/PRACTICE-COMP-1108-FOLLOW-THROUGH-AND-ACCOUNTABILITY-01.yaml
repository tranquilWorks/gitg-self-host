  - stable_id: PRACTICE-COMP-1108-FOLLOW-THROUGH-AND-ACCOUNTABILITY-01-A3
    sequence: 3
    title: Deliver or close the renegotiated commitment
    instructions: 'Complete the agreed return or alternative and confirm receipt through an appropriate
      low-burden channel. If delivery still fails, acknowledge the actual impact and carry out a proportionate
      repair within your control. Update the commitment as delivered, explicitly renegotiated or still
      open. Review the estimate or reminder that should change for the next promise.


      Observation checks: Delivery or the agreed alternative actually occurs; Receipt or remaining uncertainty
      is recorded honestly; A failed promise receives acknowledgment and proportionate repair; The commitment
      closes only with a truthful status. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Did your communication let the other person plan, and what will you change before
      making the next similar promise?


      Examples: Supportive: The Thursday check exposed a travel problem, an agreed drop-off was arranged
      and receipt confirmed before the trip.


      Mixed: The book was returned, but warning came too late to prevent the recipient changing their
      plan.


      Contradictory: The due date was silently edited and the recipient blamed for expecting the original
      promise.


      Inconclusive: A reminder was created, but the promise was neither delivered nor explicitly renegotiated.'
    expected_time: 15-25 minutes
