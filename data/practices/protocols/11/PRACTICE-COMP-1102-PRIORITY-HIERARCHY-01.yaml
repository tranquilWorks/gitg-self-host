  - stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A2
    sequence: 2
    title: Rank the demands and name the sacrificed version
    instructions: 'Use the supplied criteria to choose a first action, a next action, one reduced version
      and at least one deferral. Explain a close tradeoff rather than hiding it in a weighted total. The
      default might retain the promised review and friend visit, replace the leaking container briefly,
      defer the lesson and shorten game night. Record who must be told and when the deferral will be reconsidered.


      Observation checks: A first next reduced and deferred disposition is assigned; The total plan fits
      the stated capacity; A close tradeoff and its sacrificed benefit are named; Affected people and
      reconsideration dates are identified. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
