  scored: false
  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Model terminology — NASA Glenn](https://www.grc.nasa.gov/www/wind/valid/tutorial/glossary.html)

      - [Technical planning — NASA Systems Engineering Handbook](https://www.nasa.gov/reference/6-1-technical-planning/)

      - [Goal and acceptance clarity — NASA Systems Engineering Handbook](https://www.nasa.gov/reference/appendix-c-how-to-write-a-good-requirement/)

      - [Goal and acceptance clarity — NASA Systems Engineering Handbook](https://www.nasa.gov/reference/4-2-technical-requirements-definition/)

      - [Time-management evidence and limits](https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0245066)

      - [Defensive outside-source checking — Digital Inquiry Group](https://learn.inquirygroup.org/course/1mc-2026/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Purpose and a useful finish


      Choose what receives attention first when several worthwhile demands cannot all fit. A priority
      order is useful only if it changes an actual disposition: do now, do next, reduce by agreement,
      defer, or decline. Calling everything important does not allocate capacity.


      **Canonical scope:** Rank obligations, relationships, projects, maintenance, growth, and leisure
      using explicit criteria.


      Your deliverable is a feasible priority board, one explained close tradeoff, and a revised board
      after a capacity change. Allow 25–30 minutes for the fictional packet. Paper cards, a text editor,
      dictation, or a willing planning aid are enough. No real calendar, message, payment, or commitment
      is changed by this case.


      The six categories are dimensions to consider, not a universal moral ranking. Paid work need not
      outrank care, growth need not outrank leisure, and a forceful request is not necessarily an obligation.
      A lower position in one planning window does not mean that a person or activity has lower worth.


      ### Reference: a priority rule that can survive a conflict


      First establish **the real capacity and protected floor**: necessary care, access needs, safety,
      and commitments that cannot be silently abandoned. Do not invent spare time by exporting work to
      someone else.


      Then inspect **the reason and authority** behind each demand. Who agreed to what? Is the deadline
      real, negotiable, or merely requested? A promise may need renegotiation when circumstances change;
      ignoring it is not the same as obtaining consent to reduce it.


      For feasible options, compare **consequence of delay, timing, affected people, present value, effort,
      and reversibility**. Make the decisive criterion visible. A weighted score can be a discussion aid,
      but it cannot cancel another person''s rights or turn an unverified deadline into a fact.


      Give each demand **one current disposition**, including a specific smaller version where appropriate.
      A reduced activity should have its own attainable result. “Do a bit of everything” is not sufficient
      when none of the promised outcomes can then occur.


      Finally, record **the reconsideration point and communication needed**. Deferral is intentional
      waiting with a reason; disappearance from the list is not a decision. Unexpected obligations can
      legitimately change the order. Preserve the earlier board so the revision is accountable.


      ### Different worked example: two requests, one promise


      A person has 45 available minutes. A previously promised 30-minute proofread is needed today; an
      optional design request asks for 30 minutes “ASAP” but has no confirmed deadline. Both might be
      valuable. A reasonable first move is to protect or explicitly renegotiate the promise, clarify the
      second request''s real timing, and refrain from promising both within 45 minutes.


      If the first task actually takes 40 minutes, the remaining five minutes do not become a completed
      30-minute design. The result should be an updated commitment, not a prettier list. This example
      does not create a rule that every prior promise outranks a new urgent safety need.


      ### Complete practice packet: six demands, 210 minutes


      The fictional person''s protected care, sleep, meals, and recovery are already outside this discretionary
      planning budget and must remain protected. **The total discretionary budget is 210 minutes, including
      a 20-minute unallocated buffer.** All task durations below include their stated travel, preparation,
      and cleanup. No extra helper or money is available. Durations are case assumptions, not measured
      facts about real tasks.


      | ID/category | Demand and reason | Full version | Permitted smaller version | Delay, agreement,
      or boundary |

      | --- | --- | --- | --- | --- |

      | O / obligation | Review an application as promised | 60 minutes; complete agreed review | None
      under the current agreement | Due Day 2; affected person depends on it |

      | M / maintenance | Return borrowed materials as agreed | 30 minutes door-to-door | None | Due Day
      3; not a live financial or legal task |

      | R / relationship | Visit a willing friend | 60 minutes including transitions | 30-minute visit
      | Friend explicitly agrees either version; select and communicate one |

      | P / project | Develop a personal hobby index | 75 minutes; all five sections | 30 minutes; one
      usable section | Optional; no outside promise or deadline |

      | G / growth | Work through an elective lesson | 45 minutes; complete lesson | 15 minutes; first
      supplied practice only | Optional; partial route is not the full lesson |

      | L / leisure | Play a chosen solo game | 60 minutes | 30 minutes | Freely chosen leisure, not a
      disposable moral failure |


      O and M are current promised obligations; changing them requires explicit renegotiation, which has
      not occurred. R is a genuine relationship good, and the friend has already agreed that either listed
      version is welcome. You may defer P, G, or L, but must name the benefit you are forgoing. These
      facts fix feasibility; they do not dictate one universal best preference order.


      #### Action 1 — Make the conflict and criteria explicit


      Add the full durations and the buffer. Compare that total with 210. Do the same with every nonzero
      smaller version. Do not subtract the buffer merely because the first plan is inconvenient. Identify
      the demands whose duration or obligation cannot be changed unilaterally under this packet.


      Choose a present-season criterion among the remaining goods, such as preserving connection and some
      restorative leisure, or advancing a personally important project after obligations. Explain it before
      choosing the winning combination. Record relevant unknowns for a live version; do not fill a missing
      deadline or consent with a favorable guess.


      Use this board:


      `Demand | duty/promise or chosen reason | deadline evidence | full/minimum outcome and total duration
      | affected people | current disposition | criterion that decided it | communication | reconsideration
      point`


      #### Action 2 — Build a feasible first/next/reduced/deferred plan


      Allocate O and M or record that the plan is blocked pending explicit renegotiation. Select a version
      of R, and decide among the remaining optional versions. Give a first action, a next action, at least
      one reduced version, and at least one intentional deferral. Check that chosen task time plus the
      protected buffer does not exceed 210.


      Two legitimate plans may differ because the person''s current priorities differ. Your explanation
      must still account for all six categories, even those deferred. A plan cannot win by inventing a
      five-minute version when only 15 or 30 minutes is sufficient for the defined reduced result.


      Explain one close tradeoff without a total score. For example, keeping a 30-minute leisure block
      can mean deferring the hobby project. Choosing a small project section instead can mean postponing
      the lesson. Neither tradeoff erases the value of what waits. State when the deferred option will
      be reconsidered, without automatically scheduling anything.


      Draft the necessary communication to the friend about the chosen visit length. The fictional packet
      establishes willingness; in a live case, a unilateral reduction is not the same as agreement. Write
      drafts only for this exercise.


      #### Action 3 — Replan when capacity changes


      After saving the first board, apply this update: an unavoidable responsibility reduces the total
      discretionary budget from **210 to 160 minutes**. The **20-minute buffer remains protected**, and
      O/M have not been renegotiated. The friend still welcomes the 30-minute visit. No other task duration
      changes.


      Compute the capacity left after O, M, a 30-minute R, and the buffer. Choose a revised disposition
      for the optional activities. State which original intentions now wait and what communication is
      needed. A new responsibility is not evidence that the earlier person lacked discipline; the feasible
      set changed.


      For a live route, use the order at the next genuine collision, carry out one authorized next action
      or communicate a deferral, and compare the result with the board. A tabletop revision alone is not
      evidence of live follow-through. Do not send a refusal that risks essential support or safety merely
      to complete a priority exercise.


      ### Fresh checks and completion


      Save responses to **check-prompts.md** before opening **check-answers.md**. The checks distinguish
      urgent wording from a verified obligation, and a coherent order from one made feasible by omitting
      transitions or agreement.


      The useful artifact contains a capacity calculation, criteria, a complete disposition for every
      category, a close tradeoff, communication drafts, and a preserved revision. No single preferred
      ordering is automatically marked morally superior. A feasible board is necessary but does not establish
      that the intended outcomes actually occurred.


      ### Adaptations and progression


      Use two cards at a time, spoken comparisons, pictures, or a trusted planning aid. Keep the final
      full list visible so a simplified interface does not silently erase care, maintenance, or leisure.
      Shared responsibilities should be ranked jointly when appropriate. Record help that makes choices
      for you separately from help presenting options.


      For a harder route, add an uncertain duration range and test the plan at its high end, retaining
      the basis of the estimate. Inspect an expiring opportunity and whether delay is reversible. Do not
      replace every uncertainty with a worst-case assumption without considering whether that bound is
      appropriate to the decision.


      For later transfer, review whether deferrals were reconsidered or quietly abandoned. Revise unrealistic
      capacity estimates and criteria rather than pretending the original board was followed. Background
      planning principles support visible constraints and commitments; this authored ranking is not an
      empirically validated life-priority algorithm. See [source notes](?resource=sources).


      **Supportive:** The chosen versions fit, actual agreements are preserved, the sacrificed goods remain
      visible, and reduced capacity produces an honest revision.


      **Mixed:** The order is defensible but a smaller version lacks agreement, or a forgotten transition
      makes the plan infeasible.


      **Contradictory:** Every item is called top priority, care or another person''s unpaid labor becomes
      imaginary capacity, or inconvenient promises disappear without renegotiation.


      **Inconclusive:** Attractive categories or scores are written down, but nothing is assigned a usable
      first, reduced, or deferred disposition.


      **Final review:** Which criterion actually decided the close conflict, which worthwhile thing will
      wait, and what would justify changing the order?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Write the plan and reason before reading the corrective guidance.


      ### Check A — Loudness is not a deadline


      A fictional 100-minute window includes a protected ten-minute buffer. A 60-minute review was explicitly
      promised for today. An optional 30-minute poster request says “URGENT” but provides no needed-by
      date. A 30-minute solo leisure block is also desired. No shorter versions are supplied. The requester
      has not answered a timing question.


      Make a feasible present plan and identify what must remain uncertain. Explain two possible defensible
      choices for the remaining 30 minutes, and what information would change your judgment. Do not assume
      that urgency is fake or that the optional requester has already agreed to delay. Would scheduling
      all three activities while excluding the buffer solve the problem?


      ### Check B — A reduced version needs a real agreement


      A draft plan for 160 minutes lists O=60, M=30, R=30, G=15, buffer=20, and claims five spare minutes.
      Now the friend says a 30-minute visit would not work this time; the only agreed visit is 60 minutes.
      No other agreement has changed, and this visit is not an essential safety or care need.


      Recalculate the plan using the actual agreed duration. State whether the original plan remains feasible.
      Propose a transparent renegotiation or deferral rather than silently retaining 30. Explain why a
      proposed new agreement must not be recorded as an accepted one before the friend responds.'
    check_id: practice-answers
    attempt_mode: practice
