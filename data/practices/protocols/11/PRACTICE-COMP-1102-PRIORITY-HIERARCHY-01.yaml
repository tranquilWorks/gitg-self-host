  - stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A3
    sequence: 3
    title: Use the order in a real collision and revise openly
    instructions: 'When two demands compete, consult the order before accepting more work. Carry out the
      selected next action or communicate the deferral to the affected person. At week end, compare what
      happened with the ranking, including an interruption that legitimately changed it. Revise the criteria
      or available capacity instead of pretending the original plan was followed.


      Observation checks: The ranking guides an actual choice or remains a labeled case exercise; A deferral
      or reduction is communicated where needed; Unexpected obligations and ranking changes remain visible;
      The next priority order uses the observed constraint. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which criterion actually decided the conflict, and what valuable activity must receive
      a protected later opportunity?


      Examples: Supportive: The promised review was delivered and the lesson deliberately deferred with
      a new date; the friend visit remained protected.


      Mixed: The ranking was coherent, but travel time made the four-hour plan infeasible and one item
      needed an early renegotiation.


      Contradictory: Leisure and another person’s unpaid care were silently treated as infinitely available
      capacity.


      Inconclusive: Every demand was labeled top priority, so the first actual conflict had no usable
      decision rule.'
