meaning_and_fit:
  purpose: Build a defensible priority order across obligations, relationships, projects, maintenance,
    growth and leisure, including what must wait and what cannot be traded away.
  why_recommended: Build a defensible priority order across obligations, relationships, projects, maintenance,
    growth and leisure, including what must wait and what cannot be traded away.
  claims:
  - statement: Build a defensible priority order across obligations, relationships, projects, maintenance,
      growth and leisure, including what must wait and what cannot be traded away.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Priority hierarchy practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Priority hierarchy as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use cards, a spoken comparison or a two-choice version when six items are
    overwhelming. Rank jointly where responsibilities are shared. In poverty or unsafe dependency, distinguish
    the constrained choice set from individual preference; do not create a refusal that risks essential
    support.
  opportunity_considerations: 'Default case: this week contains a promised application review, a leaking-container
    replacement, a friend visit, an elective course lesson and a game night. Available discretionary time
    is four hours, not enough for all five at full size. Use the criteria already supplied: real obligation,
    consequence of delay, deadline credibility, affected people, value and available capacity.'
  prerequisites:
  - 'Default case: this week contains a promised application review, a leaking-container replacement,
    a friend visit, an elective course lesson and a game night. Available discretionary time is four hours,
    not enough for all five at full size. Use the criteria already supplied: real obligation, consequence
    of delay, deadline credibility, affected people, value and available capacity.'
  dependencies: []
  safe_alternatives:
  - Use cards, a spoken comparison or a two-choice version when six items are overwhelming. Rank jointly
    where responsibilities are shared. In poverty or unsafe dependency, distinguish the constrained choice
    set from individual preference; do not create a refusal that risks essential support.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Priority hierarchy differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Priority hierarchy as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-LONGITUDINAL-REVIEW
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default case: this week contains a promised application review, a leaking-container replacement,
    a friend visit, an elective course lesson and a game night. Available discretionary time is four hours,
    not enough for all five at full size. Use the criteria already supplied: real obligation, consequence
    of delay, deadline credibility, affected people, value and available capacity. Goal: Build a defensible
    priority order across obligations, relationships, projects, maintenance, growth and leisure, including
    what must wait and what cannot be traded away. Scope: The order serves one limited planning window.
    It is not a universal hierarchy in which paid work outranks care, leisure is expendable, or every
    urgent request creates an obligation. Time and effort: Twenty minutes to rank one week and ten minutes
    after the first real conflict. Adaptation: Use cards, a spoken comparison or a two-choice version
    when six items are overwhelming. Rank jointly where responsibilities are shared. In poverty or unsafe
    dependency, distinguish the constrained choice set from individual preference; do not create a refusal
    that risks essential support. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use cards, a spoken comparison or a two-choice version when six items are overwhelming.
    Rank jointly where responsibilities are shared. In poverty or unsafe dependency, distinguish the constrained
    choice set from individual preference; do not create a refusal that risks essential support.
  expected_burden: Twenty minutes to rank one week and ten minutes after the first real conflict.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Priority hierarchy protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Priority hierarchy action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use cards,
    a spoken comparison or a two-choice version when six items are overwhelming. Rank jointly where responsibilities
    are shared. In poverty or unsafe dependency, distinguish the constrained choice set from individual
    preference; do not create a refusal that risks essential support.
  actions:
  - stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A1
    sequence: 1
    title: Separate genuine obligations from persuasive requests
    instructions: 'List up to six live demands and record the promise, duty or reason behind each. Identify
      any non-negotiable safety or care floor before ranking discretionary work. For the default, ask
      whether the application review was actually promised and when it is needed; a loud message alone
      is not proof of priority. Estimate a realistic minimum duration for each demand.


      Observation checks: The duty or reason behind each demand is explicit; Safety care and essential
      maintenance floors are identified; Deadline credibility is checked rather than assumed; Minimum
      durations make the capacity conflict visible. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01
      action_stable_id: PRACTICE-COMP-1102-PRIORITY-HIERARCHY-01-A1
      competency_stable_id: '11.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1102_a1_primary
      transfer_disposition: context_bound
