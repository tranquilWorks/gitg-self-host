  - stable_id: PRACTICE-COMP-1101-TIME-AND-ENERGY-AUDIT-01-A3
    sequence: 3
    title: Try the revised allocation and inspect its real cost
    instructions: 'On the next comparable day, attempt the changed block and record its actual start,
      approximate duration and energy. Check the displaced activity and any spillover into another responsibility.
      Keep, shrink, move or reverse the change using this comparison; a successful ten-minute block does
      not prove that every evening can now be reclaimed.


      Observation checks: The changed allocation is actually attempted or remains untested; Actual use
      is compared with the original mismatch; Displaced work and spillover costs are inspected; A concrete
      retain revise or reverse decision follows. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did the new slot give the priority usable attention without exporting its cost to
      health, care or another person?


      Examples: Supportive: A ten-minute lunch reading block occurred twice without shortening sleep;
      the evening slot became deliberate rest.


      Mixed: Reading happened, but the displaced errand moved onto a partner, so the allocation needs
      renegotiation.


      Contradictory: Necessary care or disability-related recovery was labeled wasted time and removed
