  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      Each evening covers 180 minutes without overlap; the three-window denominator is 540 minutes. Required
      activity totals **315**, protected recovery **90**, known flexible activity **105**, and unknown
      time **30**. These sum to 540. The known flexible minutes contain 35 of administration, 60 of video,
      and 10 of reading.


      There is one confirmed ten-minute reading evening, D2. Recorded reading totals ten minutes. The
      unknown 30-minute D3 block means total actual reading could be greater; under the packet''s exhaustive
      categories, a bound is ten to forty minutes. That does not establish reading on all three evenings,
      since D1 is fully observed without it. Do not describe the unknown interval as available medium-energy
      time.


      The mismatch is partly the timing of the proposed reading activity, not simply a lack of clock minutes.
      A small substitution in D1/D2''s earlier flexible medium-energy block is within the fictional person''s
      control. Its cost is reduced leisure. Care, recovery, and other protected activities remain represented
      rather than treated as obstacles to erase.


      D4 covers 180 minutes: 115 required, 30 protected recovery, and 35 flexible. Reading lasts **seven**,
      not ten, minutes. Care takes 55 minutes, so the context is not matched to D2. A defensible review
      is to retain a shorter accessible reading attempt or adjust its trigger while preserving obligations
      and acknowledging the missed ten-minute target. The data do not prove the change caused a general
      improvement.


      Repair an overclaim by distinguishing the target, actual attempt, unknowns, comparison conditions,
      and decision about the next attempt. A no-capacity conclusion may require support or renegotiation
      rather than personal optimization.


      ### Check A — Overlap and an unobserved interval


      The elapsed record is 30 minutes travel, 15 breakfast, and 15 unknown: **60 minutes**. The audiobook''s
      20 minutes overlap the travel block and can be recorded as secondary exposure, not extra elapsed
      time. The packet does not establish attention, retention, or suitability for concentrated study.


      The unknown 15 minutes cannot automatically be classified as accessible discretionary time. Nor
      does the audiobook prove the person''s learning goal was achieved. A useful next observation would
      record the actual activity and task accessibility for that interval or inspect an independently
      suitable learning opportunity, without compromising the required travel task.


      ### Check B — No discretionary capacity in this record


      The activities exactly fill the observed 120 minutes. Under the stated constraints, zero documented
      discretionary minutes are available for the proposed language task. The record does not establish
      the person''s whole week, motivation, or worth, and it does not make necessary recovery optional.


      A legitimate next step is to document the constrained choice set, reconsider the goal''s current
      timing, or request appropriate support or renegotiation where genuinely available. A request is
      not an assumption that someone else will take over. Leaving the practice deferred with a stated
      review condition is more accurate than manufacturing capacity.


      A well-supported no-capacity finding is a useful audit result. It is not evidence that a language-practice
      trial occurred or that the original goal was achieved.'
    criteria:
