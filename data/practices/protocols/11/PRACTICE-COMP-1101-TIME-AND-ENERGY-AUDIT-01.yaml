      ### Check A — Overlap and an unobserved interval


      A 60-minute record contains travel from 08:00 to 08:30, with an audiobook playing from 08:10 to
      08:30; breakfast from 08:30 to 08:45; and an unrecorded interval from 08:45 to 09:00. A draft audit
      adds 30 travel + 20 learning + 15 breakfast + 15 unknown and concludes that the hour contains 80
      minutes, including 35 minutes available for concentrated study.


      Repair the elapsed-time accounting. State the observed audiobook exposure and what remains unknown
      about attention or learning. Can the missing interval be called usable study time? Supply a conclusion
      that preserves the priority without inventing capacity.


      ### Check B — No discretionary capacity in this record


      A different fictional 120-minute evening contains 30 minutes of essential meal preparation, 60 minutes
      of required care, and 30 minutes of needed recovery. No task can be delegated under the current
      arrangements and no other interval is documented. The person values language practice but reports
      it inaccessible during care and recovery.


      What does the audit establish, and what does it not establish about the person''s priorities or
      discipline? Write a legitimate next step that does not remove necessary care or recovery, impose
      a duty on someone else, or invent another free hour. Does a justified no-capacity finding count
      as useful analysis even without a language-practice trial?'
