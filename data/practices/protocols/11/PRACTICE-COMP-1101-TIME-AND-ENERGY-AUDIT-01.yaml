meaning_and_fit:
  purpose: Distinguish where time actually goes from when usable energy is available, then change one
    recurring allocation that conflicts with an endorsed priority.
  why_recommended: Distinguish where time actually goes from when usable energy is available, then change
    one recurring allocation that conflicts with an endorsed priority.
  claims:
  - statement: Distinguish where time actually goes from when usable energy is available, then change
      one recurring allocation that conflicts with an endorsed priority.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Time and energy audit practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Time and energy audit as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use broad blocks, symbols, voice notes or a support person instead of minute-level
    logs. For highly variable capacity, compare similar-capacity days. If no discretionary block exists,
    document the constraint and a legitimate request for help rather than manufacture free time.
  opportunity_considerations: 'Use paper or a private note. Default: reading is an endorsed priority,
    but its evening slot repeatedly becomes exhausted scrolling. Make four columns: approximate block,
    actual activity, usable energy low/medium/high, and chosen or constrained. Include sleep, care, travel,
    maintenance and unstructured rest rather than treating them as missing productivity.'
  prerequisites:
  - 'Use paper or a private note. Default: reading is an endorsed priority, but its evening slot repeatedly
    becomes exhausted scrolling. Make four columns: approximate block, actual activity, usable energy
    low/medium/high, and chosen or constrained. Include sleep, care, travel, maintenance and unstructured
    rest rather than treating them as missing productivity.'
  dependencies: []
  safe_alternatives:
  - Use broad blocks, symbols, voice notes or a support person instead of minute-level logs. For highly
    variable capacity, compare similar-capacity days. If no discretionary block exists, document the constraint
    and a legitimate request for help rather than manufacture free time.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Time and energy audit differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Time and energy audit as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper or a private note. Default: reading is an endorsed priority, but its evening slot
    repeatedly becomes exhausted scrolling. Make four columns: approximate block, actual activity, usable
    energy low/medium/high, and chosen or constrained. Include sleep, care, travel, maintenance and unstructured
    rest rather than treating them as missing productivity. Goal: Distinguish where time actually goes
    from when usable energy is available, then change one recurring allocation that conflicts with an
    endorsed priority. Scope: A three-day sample is a local audit, not a measure of personal worth or
    a complete account of seasonal workload, disability, unpaid care or structural constraint. Time and
    effort: Three two-minute daily reconstructions, one 15-minute comparison and a short repeat on the
    next comparable day. Adaptation: Use broad blocks, symbols, voice notes or a support person instead
    of minute-level logs. For highly variable capacity, compare similar-capacity days. If no discretionary
    block exists, document the constraint and a legitimate request for help rather than manufacture free
    time. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use broad blocks, symbols, voice notes or a support person instead of minute-level
    logs. For highly variable capacity, compare similar-capacity days. If no discretionary block exists,
    document the constraint and a legitimate request for help rather than manufacture free time.
  expected_burden: Three two-minute daily reconstructions, one 15-minute comparison and a short repeat
    on the next comparable day.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Time and energy audit protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Time and energy audit action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use broad blocks,
    symbols, voice notes or a support person instead of minute-level logs. For highly variable capacity,
    compare similar-capacity days. If no discretionary block exists, document the constraint and a legitimate
    request for help rather than manufacture free time.
  actions:
  - stable_id: PRACTICE-COMP-1101-TIME-AND-ENERGY-AUDIT-01-A1
    sequence: 1
    title: Reconstruct three ordinary days without continuous tracking
    instructions: 'At the end of each day, reconstruct the major blocks from memory or an existing calendar;
      do not install monitoring. Mark uncertain durations as ranges. Record the energy you actually had
      and whether each block was freely chosen, required or interrupted. For the default, distinguish
      an available evening hour from an hour in which reading was realistically accessible.


      Observation checks: Three ordinary days or clearly stated missing days are represented; Actual activities
      are separate from planned activities; Energy and unavoidable constraints accompany the time estimates;
      Uncertainty and restorative time are retained rather than erased. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1101-TIME-AND-ENERGY-AUDIT-01
      action_stable_id: PRACTICE-COMP-1101-TIME-AND-ENERGY-AUDIT-01-A1
