  - id: file-later-packet-md
    title: Later packet
    body: 'The fictional D4 plan substituted ten minutes of reading for the start of the earlier video
      block. The person then recorded these actual intervals. They described reading as accessible at
      its actual start but stopped after an ordinary interruption. They did not transfer a responsibility
      to another person.


      | Start–end | Activity | Minutes | Disposition |

      | --- | --- | --- | --- |

      | 18:00–18:30 | Meal | 30 | Required |

      | 18:30–19:25 | Care | 55 | Required |

      | 19:25–19:40 | Personal administration | 15 | Flexible |

      | 19:40–19:47 | Reading | 7 | Flexible |

      | 19:47–20:00 | Leisure video | 13 | Flexible |

      | 20:00–20:30 | Recovery | 30 | Protected recovery |

      | 20:30–21:00 | Cleanup | 30 | Required |


      Care differed from every earlier day. No comparable untreated D4 exists. The record supplies an
      attempted change and its actual costs, not a controlled causal comparison or proof that a ten-minute
      goal was met.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Purpose and a useful finish


      Compare an endorsed priority with where time actually goes and when that activity is realistically
      accessible. A blank calendar slot is not necessarily usable capacity. An obligation, a needed recovery
      period, or an inaccessible task is not a character failure.


      **Canonical scope:** Measure how time and usable energy are actually spent rather than relying on
      impression.


      Your deliverable is a bounded observation record, one evidence-based mismatch, and a small allocation
      experiment that preserves its real costs. Allow about 25 minutes for the supplied fictional case.
      A live route uses three brief reconstructions over comparable days and one later attempt; it does
      not require continuous tracking or installing monitoring software. Paper, voice notes, icons, or
      a private text editor are sufficient.


      The default studies only **18:00–21:00 on three days**, not all waking time or a whole life. All
      times in its packet are stipulated fictional records. For a real audit, uncertain memory should
      stay approximate. This is not a medical measure of fatigue, a diagnostic assessment, or a score
      of productivity or worth.


      ### Reference: four distinctions before counting


      **Planned versus actual:** “I reserved 30 minutes for reading” is a plan. “I rested during that
      interval” is the activity record. Keep both rather than rewriting one to match the other.


      **Time versus usable energy:** Record whether the intended activity was accessible at that time,
      using your own words or low/medium/high. Those are ordered personal descriptions, not quantities
      that can be multiplied by minutes to produce scientifically measured “energy units.” Different tasks
      can be accessible under different conditions.


      **Choice versus constraint:** Separate required responsibilities, protected recovery, flexible choices,
      and unknown time. The categories describe the current situation, not a ranking of moral value. A
      freely chosen leisure activity may be worthwhile. A genuinely constrained period cannot be reclaimed
      by renaming it.


      **Coverage versus certainty:** State the window and account for every interval exactly once. Concurrent
      activities belong in the same clock interval, with one primary category and an optional secondary
      note. Missing activity is unknown, not zero. A long record is not automatically accurate or representative
      of another week.


      ### Different worked example: a commute overlaps listening


      A person travels from 08:00 to 08:30 and listens to a lecture from 08:10 to 08:30. The elapsed window
      is 30 minutes, not 50. The 20 minutes of listening describe an activity within the commute, not
      a second free block. If attention to travel must take priority, do not infer that this is usable
      time for every learning task. A bounded audit preserves both the overlap and the constraint.


      ### Complete practice packet: three evenings


      The fictional person values reading and hoped to read for ten minutes on each observed evening.
      They also endorse care, meals, recovery, and leisure. The table reports what actually happened.
      “Flexible” means a choice the person controls in this case; it does not mean worthless. Medium energy
      is self-described as adequate for a brief reading attempt. Low energy does not establish a diagnosis
      or make rest optional.


      | Day | Start–end | Actual activity | Minutes | Current disposition | Usable energy |

      | --- | --- | --- | --- | --- | --- |

      | D1 | 18:00–18:30 | Meal | 30 | Required | Medium |

      | D1 | 18:30–19:00 | Care | 30 | Required | Medium |

      | D1 | 19:00–19:20 | Personal administration | 20 | Flexible | Medium |

      | D1 | 19:20–19:50 | Leisure video | 30 | Flexible | Medium |

      | D1 | 19:50–20:00 | Recovery | 10 | Protected recovery | Low |

      | D1 | 20:00–20:30 | Rest in the planned reading slot | 30 | Protected recovery | Low |

      | D1 | 20:30–21:00 | Cleanup | 30 | Required | Low |

      | D2 | 18:00–18:30 | Meal | 30 | Required | Medium |

      | D2 | 18:30–19:15 | Care | 45 | Required | Medium |

      | D2 | 19:15–19:30 | Personal administration | 15 | Flexible | Medium |

      | D2 | 19:30–20:00 | Leisure video | 30 | Flexible | Medium |

      | D2 | 20:00–20:10 | Reading | 10 | Flexible | Medium |

      | D2 | 20:10–20:30 | Recovery | 20 | Protected recovery | Low |

      | D2 | 20:30–21:00 | Cleanup | 30 | Required | Low |

      | D3 | 18:00–18:30 | Meal | 30 | Required | Medium |

      | D3 | 18:30–19:30 | Care | 60 | Required | Low |

      | D3 | 19:30–20:00 | Not recalled | 30 | Unknown | Unknown |

      | D3 | 20:00–20:30 | Recovery | 30 | Protected recovery | Low |

      | D3 | 20:30–21:00 | Cleanup | 30 | Required | Low |


      No sleep, paid work, travel, or other activity outside this window is represented. No one has agreed
      to take over the care or cleanup. D3''s unknown block is not evidence that medium-energy discretionary
      time existed.


      #### Action 1 — Reconcile the record before interpreting it


      For each day, confirm that the non-overlapping intervals cover 180 minutes. Aggregate required time,
      protected recovery, known flexible activity, and unknown time across the three days. Keep the 30
      unknown minutes visible in the denominator rather than deleting the day.


      Record the observed reading minutes and the number of evenings with a confirmed ten-minute reading
      attempt. Explain what the unknown block prevents you from concluding. Distinguish “only ten minutes
      are recorded as reading” from “exactly ten minutes of reading certainly occurred.” Do not treat
      a missing entry as either proof of success or proof of failure.


      Use this private record form for a live route:


      `Day and sampled window | planned activity, if relevant | actual interval/activity | estimate or
      range | usable energy for the priority | required/protected/flexible/unknown | overlap or interruption
      | confidence in recall`


      For a full-day adaptation, cover the day with major blocks including sleep, care, work, travel,
      meals, maintenance, recovery, and leisure. Avoid fictitious precision. When a block''s endpoints
      or duration are uncertain, record a range and do not add incompatible high endpoints as if they
      were one observed day.


      #### Action 2 — Name one controllable mismatch and its tradeoff


      Compare the reading intention with both time and energy. D1''s late planned slot became rest; that
      does not establish that the person should sacrifice recovery. D1 and D2 contain earlier known flexible
      medium-energy video blocks. Identify a ten-minute substitution within one such block, leaving care,
      meals, cleanup, and protected recovery unchanged.


      Write the displaced benefit honestly: ten fewer minutes of chosen leisure, not ten minutes rescued
      from an activity declared valueless. Specify the planned trigger, duration, access support, and
      stop/revise condition. One suitable default is, “On the next comparable evening, after personal
      administration and while reading is accessible, use the first ten minutes of the video block to
      read; retain recovery and stop or shorten the trial if a required responsibility intervenes.” This
      is a trial, not a command for every day.


      Acknowledge D3''s constraint. It does not contain evidence of a comparable available block. A person
      with no discretionary capacity may complete the analysis by identifying an external constraint and
      a legitimate support or renegotiation need; inventing free time would be the error.


      #### Action 3 — Attempt or inspect the trial and include its cost


      Save the proposed allocation before opening **later-packet.md**. The supplied follow-up is a fictional
      trial result, not a record of your behavior. Compare it using the same activity definitions. Inspect
      actual reading, its displaced activity, required time, protected recovery, and changed context.
      Do not call a seven-minute attempt a completed ten-minute target.


      Choose to keep, shrink, move, or reverse the allocation with a reason. A later day may differ in
      care demands; record that difference rather than claiming the allocation alone caused the outcome.
      If using a live route, retain the actual attempt and any missing observation. Stop unnecessary logging
      when it ceases to help; the aim is one usable decision, not surveillance.


      ### Fresh checks and a completion boundary


      Attempt **check-prompts.md**, then consult **check-answers.md**. One case tests overlap and missing
      time; the other contains no discretionary block. Both require conclusions that respect what was
      actually observed.


      Completion of this bounded exercise means a reconciled record, a priority/time/energy mismatch or
      justified no-capacity finding, a tradeoff, and a trial review or honestly untested plan. A fictional
      success does not establish improved personal allocation. A plan alone does not establish the live
      progress indicator.


      ### Accessibility and progression


      Use broad blocks, a few symbols, voice notes, or a support person who records rather than judges.
      Keep established accommodations. Compare similar-capacity days when conditions vary; do not force
      a “normal day” that does not exist. Energy descriptions may be task-specific or simply accessible/not
      accessible/unknown.


      For a more demanding route, compare a workday and non-workday, or add an interruption category while
      preserving non-overlap. Separate your choice from costs moved onto another person. Any proposed
      reassignment of shared responsibilities requires agreement, not an accounting trick.


      For later transfer, repeat the small audit after a meaningful change in responsibilities. Do not
      promise that a three-day sample identifies a permanent routine or that time management can remove
      structural overload. Background research concerns broad associations, not validation of this original
      case or a guarantee of individual benefit; see [source notes](?resource=sources).


      **Supportive:** The record exposes an earlier usable block, the chosen tradeoff preserves obligations
      and recovery, and the follow-up reports the actual duration and remaining constraint.


      **Mixed:** Reading occurs, but a displaced task silently moves to another person or the shortened
      attempt is reported as meeting the original target.


      **Contradictory:** Required care, access needs, or recovery are labeled wasted time; unknown time
      is relabeled free; or overlapping activities are counted as extra capacity.


      **Inconclusive:** An ideal schedule is drawn without any actual record or a comparison to the endorsed
      priority.


      **Final review:** Did the change provide usable attention without hiding its cost, and which part
      of the mismatch is genuinely within your control?'
