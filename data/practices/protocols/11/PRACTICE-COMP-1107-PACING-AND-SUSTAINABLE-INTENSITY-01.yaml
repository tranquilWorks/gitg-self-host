  - stable_id: PRACTICE-COMP-1107-PACING-AND-SUSTAINABLE-INTENSITY-01-A3
    sequence: 3
    title: Select the next pace using both output and aftermath
    instructions: 'Compare what was completed, rework required, remaining obligations and capacity at
      the next ordinary activity. Retain maintenance, shorten the block, arrange help or choose recovery
      based on the combined result. A sprint is not complete until its recovery and outstanding commitments
      are addressed. Record a concrete condition for returning from recovery to ordinary work without
      setting a punitive deadline.


      Observation checks: Output and rework are compared with the quality requirement; Aftermath for health
      and other duties is included; The next pace follows the observed tradeoff; Return from recovery
      uses a suitable condition rather than punishment. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Which pace preserved both the result and the ability to meet the next legitimate responsibility?


      Examples: Supportive: Two short inventory sections were accurate and left enough capacity for evening
      care, so maintenance remained appropriate.


      Mixed: More was completed in the first block, but errors and next-day burden showed the chosen intensity
      was too high.


      Contradictory: A stop signal was ignored and recovery withheld until a quantity target was reached.


      Inconclusive: Intensity was rated privately without attempting a bounded period or inspecting its
      quality and aftermath.'
