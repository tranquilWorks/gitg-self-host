meaning_and_fit:
  purpose: Match effort to urgency, duration, health, quality and importance, distinguishing a bounded
    sprint from maintenance and recovery rather than treating maximal intensity as the default.
  why_recommended: Match effort to urgency, duration, health, quality and importance, distinguishing a
    bounded sprint from maintenance and recovery rather than treating maximal intensity as the default.
  claims:
  - statement: Match effort to urgency, duration, health, quality and importance, distinguishing a bounded
      sprint from maintenance and recovery rather than treating maximal intensity as the default.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Pacing and sustainable intensity practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Pacing and sustainable intensity as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use supported, seated, remote or shorter work where appropriate and treat
    rest as legitimate work planning. Variable or persistent fatigue may require qualified assessment
    and accommodation rather than a new productivity technique. No physical challenge or deprivation is
    part of this exercise.
  opportunity_considerations: 'Default: a non-urgent room inventory can be done in one exhausting evening
    or in two 20-minute sections. Use three pace cards: maintenance—one small section; sprint—one time-limited
    priority block with a stop and recovery plan; recovery—only essential duties plus support. Keep existing
    clinical and workplace restrictions unchanged.'
  prerequisites:
  - 'Default: a non-urgent room inventory can be done in one exhausting evening or in two 20-minute sections.
    Use three pace cards: maintenance—one small section; sprint—one time-limited priority block with a
    stop and recovery plan; recovery—only essential duties plus support. Keep existing clinical and workplace
    restrictions unchanged.'
  dependencies: []
  safe_alternatives:
  - Use supported, seated, remote or shorter work where appropriate and treat rest as legitimate work
    planning. Variable or persistent fatigue may require qualified assessment and accommodation rather
    than a new productivity technique. No physical challenge or deprivation is part of this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Pacing and sustainable intensity differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Pacing and sustainable intensity
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: a non-urgent room inventory can be done in one exhausting evening or in two 20-minute
    sections. Use three pace cards: maintenance—one small section; sprint—one time-limited priority block
    with a stop and recovery plan; recovery—only essential duties plus support. Keep existing clinical
    and workplace restrictions unchanged. Goal: Match effort to urgency, duration, health, quality and
    importance, distinguishing a bounded sprint from maintenance and recovery rather than treating maximal
    intensity as the default. Scope: The plan concerns ordinary work allocation. It does not diagnose
    fatigue, prescribe rehabilitation or justify working through pain, illness, dangerous sleepiness or
    unsafe conditions. Time and effort: Fifteen minutes to choose a pace, two ordinary work periods and
    ten minutes to compare quality and recovery. Adaptation: Use supported, seated, remote or shorter
    work where appropriate and treat rest as legitimate work planning. Variable or persistent fatigue
    may require qualified assessment and accommodation rather than a new productivity technique. No physical
    challenge or deprivation is part of this exercise. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use supported, seated, remote or shorter work where appropriate and treat rest
    as legitimate work planning. Variable or persistent fatigue may require qualified assessment and accommodation
    rather than a new productivity technique. No physical challenge or deprivation is part of this exercise.
  expected_burden: Fifteen minutes to choose a pace, two ordinary work periods and ten minutes to compare
    quality and recovery.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Pacing and sustainable intensity protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Pacing and sustainable intensity action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use supported,
    seated, remote or shorter work where appropriate and treat rest as legitimate work planning. Variable
    or persistent fatigue may require qualified assessment and accommodation rather than a new productivity
    technique. No physical challenge or deprivation is part of this exercise.
  actions:
  - stable_id: PRACTICE-COMP-1107-PACING-AND-SUSTAINABLE-INTENSITY-01-A1
    sequence: 1
    title: Choose the pace from consequences rather than pressure
    instructions: 'State the real deadline, consequence of delay, expected duration and quality required.
      Check current capacity and existing restrictions. For the inventory, choose maintenance because
      urgency is low; reserve sprint for a genuinely bounded need, not someone’s impatience. Define a
      stop signal and what essential task remains covered if the chosen pace becomes unsuitable.


      Observation checks: Deadline consequence duration and quality are separately stated; Current capacity
      and existing restrictions are respected; The pace has a reason beyond pressure or self-judgment;
      A stop signal and essential-duty fallback are defined. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
