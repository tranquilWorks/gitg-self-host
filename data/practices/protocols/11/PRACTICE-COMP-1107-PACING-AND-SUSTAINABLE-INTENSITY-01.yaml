  - id: file-later-packet-md
    title: Later packet
    body: 'These alternative records are supplied fiction, not measurements of the learner.


      **M — maintenance:** Day 1: section A, four entries attempted in 18 minutes, all four correct; 10-minute
      recovery taken and care duty covered. Day 2: section B, four entries attempted in 19 minutes, all
      four correct; 10-minute recovery taken and care duty covered. No rework recorded. Later burden beyond
      those observations is unknown.


      **S — unsuitable sprint:** Day 1: both sections, eight entries attempted in 40 minutes. Notebook
      was written as 3 rather than 2, pencil as 5 rather than 4, and folder as 2 rather than 3. The other
      five entries were correct. Recovery was skipped; care started 10 minutes late. Day 2: repairing
      those three entries took 12 minutes and a full recheck took 8 minutes. All eight then matched. Recovery
      was taken on Day 2, but the record does not erase Day 1''s missed care timing. No medical consequence
      is supplied.


      **R — recovery:** Before Day 1 work, the worker reports a warning sign that their existing plan
      says to stop optional activity for. They do not begin inventory and use existing support to preserve
      essential duties. Day 2 safe capacity is still unknown. Inventory remains pending; no output or
      recovery success is asserted. Decide the next appropriate capacity/support check and communicate
      if Day 3 becomes doubtful.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Choose effort from the whole consequence


      Pacing means matching effort to urgency, duration, health/capacity, quality and the importance of
      the result. The fastest visible output can leave errors, rework or another duty unpaid. A sprint,
      maintenance pace and recovery serve different situations; none is a rank of personal worth.


      This guide uses a fictional room inventory to practice choosing a pace and reviewing its consequences.
      Allow 15 minutes for the decision and paper work, then 10 for the later outcomes and fresh checks.
      It requires reading short records and counting correct entries. Use paper, audio or a text editor;
      no physical exertion, live inventory, diagnosis or purchase is required. The case''s work periods
      are scenario facts, not a direction to force yourself to work for that length.


      A live route applies only to ordinary safe work within existing restrictions and supports. It is
      not treatment for fatigue or a rehabilitation plan. Illness, pain, dangerous sleepiness, worsening
      symptoms or unsafe conditions override output targets; use appropriate existing support. Do not
      test deprivation, remove aids or work through a warning sign for the exercise.


      ### Reference: pace includes what happens afterward


      **Maintenance** is a repeatable allocation sized to current capacity and ordinary demands. **Sprint**
      is an exceptional bounded effort for an important, time-sensitive result, with a stop, quality check,
      recovery and outstanding-duty plan. **Recovery** reduces optional demand while preserving essential
      duties through suitable support. Recovery is not a debt to repay with extra work.


      Separate four observations: attempted quantity, accepted output, rework and later burden. An entry
      counts as accepted only after its fixed criteria pass. Rework consumes real time; do not count the
      corrected item as a second new item. Later burden includes postponed duties and work shifted to
      others without agreement. A private rating or an invented energy score is not a physiological measurement.


      Choose the pace before seeing the outcome. Record the real deadline and consequence, the task''s
      importance, current capacity, existing restrictions, the stopping boundary and the next responsibility.
      The same task may merit a different choice on another day. Pressure alone does not establish urgency.
      A deadline also cannot authorize unsafe intensity.


      ### A different worked example


      A non-urgent box-labeling task has eight labels. One supplied record shows eight attempted, five
      correct, and three still needing repair; another shows six attempted and six correct. The first
      has a larger attempt count but less accepted output. If repair later takes nine minutes, include
      those minutes in its cost. Neither record tells you whose health improved or that the second method
      caused the difference. Compare conditions before choosing a next pace.


      ### Complete practice packet: inventory a fictional room


      The inventory is useful for a hobby list. It is due at the end of Day 3; delay would postpone an
      optional catalog update, with no essential consequence. No requester has demanded same-day completion.
      There are eight object types across two sections, with 16 individual items in total. The simulated
      worker has two ordinary opportunities on Day 1 and Day 2, each with at most 20 minutes available
      for this optional activity, followed by a protected 10-minute transition/recovery period. A pre-existing
      care responsibility follows each period. No one else has agreed to absorb it. These are the case
      person''s stated constraints, not recommended medical durations.


      | Section | Object | Count |

      | --- | --- | --- |

      | A | notebook | 2 |

      | A | pencil | 4 |

      | A | clip box | 1 |

      | A | ruler | 1 |

      | B | folder | 3 |

      | B | card pack | 2 |

      | B | eraser | 2 |

      | B | tape roll | 1 |


      An accepted inventory has one row per object type, the correct section, exact name and count, and
      no duplicate. A neat but wrong count fails. Keep unverified entries marked unverified. This table
      supplies the complete reference; no room visit is implied.


      #### Three decision cards


      - **Maintenance:** one section in each ordinary opportunity, with the protected transition/recovery
      and care duty retained. Review accuracy before the next section.

      - **Sprint proposal:** do both sections now in a single 40-minute block. This exceeds today''s stated
      20-minute availability and would consume recovery and care time. It is not feasible in this case.
      A valid sprint in another case would need actual capacity, a bounded important deadline, preserved
      supports and a recovery/remaining-duty plan.

      - **Recovery:** no optional inventory period today; preserve essential duties using existing supports.
      Keep inventory pending and review at the next suitable opportunity. If this threatens Day 3, communicate
      the actual limitation rather than promising compensatory overrun.


      #### Action 1 — Make a justified pace decision


      Before opening the later packet, write `deadline and consequence | importance | capacity/restrictions
      | pace | output limit | quality criterion | stop condition | next duty | next decision`.


      For the supplied baseline, maintenance fits the low urgency and two available periods. Recovery
      becomes appropriate if current safe capacity is unavailable. Do not “solve” that branch by dropping
      care or declaring a universal recovery deadline. A sprint cannot be justified from the optional
      catalog''s importance alone.


      Set your review rule now: retain maintenance provisionally only when entries meet the accuracy criterion
      and the protected periods/duties remain intact. Revise the task size or seek agreed help if rework
      or later burden exceeds the planned capacity. Stop optional work if a warning sign appears. Return
      from recovery according to safe actual capacity and existing restrictions/supports, not punishment
      for low output.


      #### Action 2 — Produce and inspect a paper inventory


      Copy section A into your own inventory. Compare each row against the reference and retain any correction.
      Then, at your next chosen reading break or now if appropriate, copy and check B. Record which route
      you actually used; do not invent a two-day attempt or a physical recovery experience. These are
      actual paper outputs about fictional objects.


      Open [later-packet.md](?resource=file-later-packet-md) after saving the pace decision. It contains
      alternative simulated two-period records with quality and aftermath. For each, calculate attempted
      entries, accepted entries, rework and outstanding items. Keep attempted output before correction
      separate from accepted output after correction. Do not mix the successful recovery of one branch
      with the errors of another.


      #### Action 3 — Decide the next pace from output and aftermath


      Append `what met the standard | rework minutes | later duty/burden | differing conditions | next
      pace | concrete next action | what remains unknown`. A useful result may be a slower next period,
      agreed help or a recovery decision. “Try harder” is not a changed pace. A sprint''s accounting remains
      open until its promised recovery and outstanding obligations are addressed.


      Complete [check-prompts.md](?attempt=practice-checks) before [check-answers.md](?check=practice-answers).
      Finish the source exercise with the actual paper inventory, prior decision and branch-specific review.
      This does not establish sustainable capacity or a completed live practice.


      ### Access, greater challenge and transfer


      A reader may dictate rows or use a large-print template; record assistance without treating it as
      a deficit. If counting is the access barrier, have an aid count while you decide what the quality
      and burden evidence permits. The supported route still exercises pace judgment, but not unaided
      counting. No unsupported physical task is required.


      For a more demanding case, use fresh check 1''s feasible sprint and add uncertainty: its four items
      may need 5–8 minutes each. Four upper bounds require 32 minutes before the 10-minute review; the
      40-minute task window is then two minutes short. Reduce scope with agreement or seek another feasible
      arrangement; never turn an upper estimate into safe capacity by assertion.


      For later transfer, choose two naturally available periods of one low-stakes task. Preserve existing
      supports, inspect accuracy and actual aftermath at the next ordinary responsibility, and record
      changed conditions. No observed burden is not proof of physiological benefit; unexpected worsening
      is a reason to stop or adjust, not evidence of inadequate character.


      **Supportive:** Accurate work fits the chosen periods, recovery occurs and the next duty remains
      covered.


      **Mixed:** The target is reached but corrections and later burden exceed the planned allocation.


      **Contradictory:** Warning signs are ignored or recovery is withheld until a quantity target is
      reached.


      **Inconclusive:** Only intended intensity is recorded, with no inspected output or later information.


      The safety background is limited to [NIOSH and the source notes](?resource=sources). The case numbers
      are original teaching assumptions, not a fatigue model or therapeutic dose.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '### Check 1 — A bounded sprint that can fit


      A fictional worker has a safe 40-minute task window, followed by a protected 15-minute recovery/transition,
      then an essential duty. Four verified labels are needed today to prevent an otherwise agreed low-stakes
      handoff being missed. Each label takes at most 6 minutes, and final checking takes 10. Existing
      restrictions permit this work. State whether a bounded sprint can fit, its stopping boundary, quality
      test, unused task-window minutes and remaining duty/recovery obligations. Does calling it urgent
      allow using the recovery if the estimate proves wrong?


      ### Check 2 — Quantity and rework


      Record A: 12 entries attempted in 30 minutes, 4 wrong; correcting those 4 takes 12 additional minutes
      and all 12 are then verified. Record B: 10 entries attempted and verified in 30 minutes, no rework.
      Both records use the same acceptance rule. Calculate each accepted output before and after correction
      and total active minutes. Which has the higher final accepted-entries-per-active-minute rate? Can
      these two records alone establish a health effect or justify choosing A for every task?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '### Default records


      M produces eight accepted entries across 37 active minutes, plus 20 protected recovery minutes across
      two days. S initially produces five accepted of eight attempts; after 20 more active minutes, all
      eight are verified. S costs 60 active minutes, not 40, and retains Day 1''s skipped recovery and
      10-minute care delay. Corrections are not three additional new entries. These observations support
      the case''s maintenance choice; they do not prove a physiological mechanism or that the pace caused
      every difference.


      R has zero attempted inventory entries and unknown next-day capacity. Preserve that absence without
      scoring it as poor inventory performance. Stop optional work, use the existing support plan and
      reassess before promising a new period. A fixed deadline to “finish recovery” is not warranted.


      A complete paper inventory matches the eight rows of the reference. Assess your own copied sheet
      before using the model outcome; the fictional M branch cannot certify your output. A partial review
      records quantity but omits rework; a contradictory one hides the late care duty to claim sprint
      success.


      ### Check 1


      4 × 6 + 10 = 34 active minutes, leaving 6 uncommitted task-window minutes. A bounded sprint fits
      the stated conditions, with no medical inference. Stop by the 40-minute boundary or sooner for the
      existing stop condition, preserve the 15-minute recovery/transition and essential duty, and verify
      all four labels before reporting them delivered. If estimates fail, reduce/renegotiate the handoff
      or obtain suitable help; urgency does not permit consuming protected recovery. The sprint''s obligations
      include its aftermath, not merely label output.


      ### Check 2


      A: 8 accepted initially, 12 after correction, 42 active minutes total. B: 10 accepted initially
      and finally, 30 active minutes total. A''s final rate is 12/42 = 2/7 (about 0.286); B''s is 10/30
      = 1/3 (about 0.333). B has the higher rate under this narrow accounting. A still has more final
      accepted items; the right choice also depends on need, constraints and later burden. There is no
      health outcome or causal comparison supplied. A universal recommendation from these figures is unsupported.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
