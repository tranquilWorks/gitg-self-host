    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [NASA, 6.1 Technical Planning](https://www.nasa.gov/reference/6-1-technical-planning/)

      - [NASA, 6.7 Technical Assessment](https://www.nasa.gov/reference/6-7-technical-assessment/)

