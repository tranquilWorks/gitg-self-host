meaning_and_fit:
  purpose: Specify an outcome, its reason, constraints and observable success criteria so that progress
    can be judged without confusing activity with value.
  why_recommended: Specify an outcome, its reason, constraints and observable success criteria so that
    progress can be judged without confusing activity with value.
  claims:
  - statement: Specify an outcome, its reason, constraints and observable success criteria so that progress
      can be judged without confusing activity with value.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Goal definition and success criteria practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Goal definition and success criteria as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use spoken, tactile or picture-based tests and preserve established accessibility
    layouts. A fictional shelf case can practice goal definition but not demonstrate household usability.
    Where other people are affected, obtain agreement before changing the shared environment.
  opportunity_considerations: 'Use the default of making a shared kitchen shelf easier to use, not the
    vague target become organized. The goal card has five supplied lines: by when, changed condition,
    evidence, protected constraints and why this matters. A default endpoint is that the three most-used
    items can be found and returned by willing household members without moving unrelated objects.'
  prerequisites:
  - 'Use the default of making a shared kitchen shelf easier to use, not the vague target become organized.
    The goal card has five supplied lines: by when, changed condition, evidence, protected constraints
    and why this matters. A default endpoint is that the three most-used items can be found and returned
    by willing household members without moving unrelated objects.'
  dependencies: []
  safe_alternatives:
  - Use spoken, tactile or picture-based tests and preserve established accessibility layouts. A fictional
    shelf case can practice goal definition but not demonstrate household usability. Where other people
    are affected, obtain agreement before changing the shared environment.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Goal definition and success criteria differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Goal definition and success
    criteria as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of making a shared kitchen shelf easier to use, not the vague target become
    organized. The goal card has five supplied lines: by when, changed condition, evidence, protected
    constraints and why this matters. A default endpoint is that the three most-used items can be found
    and returned by willing household members without moving unrelated objects. Goal: Specify an outcome,
    its reason, constraints and observable success criteria so that progress can be judged without confusing
    activity with value. Scope: This defines one bounded goal. A measurable target can still be misguided;
    neither precision nor completion proves that a life direction is worthwhile. Time and effort: Twenty
    minutes for a goal card and one 15-minute test of its first deliverable. Adaptation: Use spoken, tactile
    or picture-based tests and preserve established accessibility layouts. A fictional shelf case can
    practice goal definition but not demonstrate household usability. Where other people are affected,
    obtain agreement before changing the shared environment. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken, tactile or picture-based tests and preserve established accessibility
    layouts. A fictional shelf case can practice goal definition but not demonstrate household usability.
    Where other people are affected, obtain agreement before changing the shared environment.
  expected_burden: Twenty minutes for a goal card and one 15-minute test of its first deliverable.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Goal definition and success criteria protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Goal definition and success criteria action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken,
    tactile or picture-based tests and preserve established accessibility layouts. A fictional shelf case
    can practice goal definition but not demonstrate household usability. Where other people are affected,
    obtain agreement before changing the shared environment.
  actions:
  - stable_id: PRACTICE-COMP-1103-GOAL-DEFINITION-AND-SUCCESS-CRITERIA-01-A1
    sequence: 1
    title: Write the changed condition and the reason it matters
    instructions: 'Describe who benefits and what observable condition should differ when the goal is
      complete. Separate the outcome from the method: buying containers is one possible method, not the
      endpoint. Give a modest review date and name the underlying reason, such as easier shared access
      rather than an impressive photograph. Ask whether that reason still matters under current responsibilities.


      Observation checks: The desired changed condition is distinct from the activity; The beneficiary
      and reason are stated without assuming consent; A review date bounds the goal; The reason is checked
      against the present context. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1103-GOAL-DEFINITION-AND-SUCCESS-CRITERIA-01
      action_stable_id: PRACTICE-COMP-1103-GOAL-DEFINITION-AND-SUCCESS-CRITERIA-01-A1
      competency_stable_id: '11.03'
