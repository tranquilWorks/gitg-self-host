    body: 'Use this fictional route only after saving version 1 and its criteria. It is not an actual
      test with you or another learner.


      Prototype P1 assigned A=PENCIL, B=ERASER, C=BLANK CARD. It was built on the maker''s own paper in
      12 minutes, with no purchases. The reserved D strip stayed clear. No helper selected answers.


      | Request | Item found | Return destination | Relevant home label |

      | --- | --- | --- | --- |

      | ERASER | ERASER | A | B |

      | BLANK CARD | BLANK CARD | C | C |

      | PENCIL | PENCIL | A | A |


      The fictional self-tester reports that the return labels were easy to confuse. No independent user
      test, second prototype, or later household observation is supplied. Do not invent any of them to
      complete the record.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Purpose and a useful finish


      Turn an aspiration into a changed condition whose value and achievement can be inspected. Then challenge
      the goal itself. A measurable target can be the wrong target; completing activities or buying equipment
      does not establish the intended benefit.


      **Canonical scope:** Translate aspirations into specific outcomes, constraints, measures, and reasons.


      Your deliverable is a versioned goal card, predetermined checks, a smallest useful artifact, and
      a decision to continue, revise, or stop. Allow 30–40 minutes for the paper route, using one sheet
      and three movable paper labels. A text-only simulation is fully supplied when moving paper is inaccessible
      or inconvenient. No purchase, household rearrangement, actual partner, or private disclosure is
      required.


      This guide develops one goal-definition skill. It does not decide your life purpose, require optimization,
      or equate a completed task with human worth. The paper prototype and fictional results cannot establish
      usability for a real household without appropriate participation and permission.


      ### Reference: five parts that do different jobs


      **Reason:** Who benefits, and why does the changed condition matter now? A reason such as “reduce
      confusion when returning shared items” is different from “produce an impressive photograph.” Reasons
      should remain open to revision when circumstances or the beneficiary''s wishes change.


      **Outcome:** What will be different? Separate it from the method. Purchasing containers, spending
      an hour, or attending a class can be methods or activities; none guarantees the intended result.


      **Constraints:** What must remain protected while pursuing the outcome? Include authority, consent,
      cost, effort, access, disruption, and effects on others. A target does not authorize violating a
      constraint simply because that makes a metric improve.


      **Measures and acceptance:** What observations distinguish met, partly met, not met, and unknown?
      Choose criteria before the attempt. A missing measurement is not a pass. Observing “found” does
      not necessarily establish “returned,” and a helper choosing the answer is different from a helper
      presenting accessible materials.


      **Review and change control:** When will you inspect both performance and continued value? Keep
      the original card if you revise it. A reasonable scope reduction is a new version, not evidence
      that the earlier larger goal was already achieved. You may stop a goal whose benefit no longer justifies
      its cost.


      NASA''s requirements guidance provides background for distinguishing outcomes, rationale, constraints,
      and verifiable criteria. Its engineering context does not validate this personal-development task
      or turn everyday goals into a bureaucratic process. See [source notes](?resource=sources).


      ### Different worked example: make a useful meeting summary


      “Spend 30 minutes writing notes” measures effort. A more inspectable outcome is, “By the end of
      the next planning session, produce a private summary that distinguishes three agreed decisions from
      unresolved questions, gives each agreed action an owner who accepted it, and contains no private
      remarks that participants did not consent to share.”


      The method could be dictation or typing. A summary with every action assigned but no accepted owners
      fails an important criterion. If the meeting is cancelled, the useful response may be to stop or
      revise the goal rather than invent decisions to hit a count. The numbers are illustrative, not a
      general rule for meetings.


      ### Complete practice packet: find and return three items


      The starting aspiration is **“be more organized.”** In the fictional context, the chosen reason
      is easier finding and returning of three ordinary items, not an attractive display. Use paper cards
      labeled **PENCIL**, **ERASER**, and **BLANK CARD**. They stand for items; no actual shared possessions
      need be moved.


      Draw or write four zones named **A**, **B**, **C**, and **D**. D is a reserved access strip in the
      toy layout and must remain empty. You control your paper only. On a real shared surface, permissions
      and established access arrangements would need agreement before changes; this fictional authority
      is not permission to alter someone else''s setup.


      The trial goal has these supplied boundaries:


      - Produce and inspect one paper layout by the end of this session, with at most **20 minutes of
      construction effort**, no purchases, and no change to real shared space.

      - Give each of the three item cards one distinct labeled home among A, B, and C. Zone D stays clear.

      - Use a find-and-return sequence **ERASER, BLANK CARD, PENCIL**. For each request, identify the
      right item and return it to its labeled home without another person selecting the answer. Reading,
      pointing, dictation, tactile marking, or a helper moving a card at your direction are allowed and
      should be recorded.

      - A local prototype meets its operational target only when all three finds and all three returns
      are correct, the reserved zone stays clear, permission and cost constraints hold, and the effort
      limit is met. This does not establish independent-user usability or long-term household benefit.


      There is no retrieval-speed requirement. The purpose is unambiguous access and return, not speed
      or dexterity. The numerical and procedural criteria are original exercise choices, not a universal
      definition of organization.


      #### Action 1 — Write the goal before choosing a method


      Fill this goal card in your own words while preserving the supplied boundaries:


      `Version/date | beneficiary and chosen reason | changed condition | context and review point | constraints
      | observable checks | partial/unknown result | stop or revision condition`


      Distinguish the outcome from making labels. Explain why both finding and returning matter. Record
      a reason that would justify abandoning or changing the goal—for example, the intended user no longer
      needs that arrangement, or required access would be made worse. Do not fabricate another person''s
      endorsement.


      Create an acceptance record before acting:


      `Request | correct item found? | correct labeled return? | answer-selection help? | access strip
      clear? | observed limitation`


      Add separate fields for permission, purchases, construction effort, route (self-test/live willing
      user/supplied simulation), and user-reported burden where actually obtained. A blank burden field
      does not authorize saying the layout is easy for someone else.


      #### Action 2 — Produce the smallest useful artifact and test it


      Make three item cards and three home labels, or write a text layout with the same distinctions.
      One possible method is A=PENCIL, B=ERASER, C=BLANK CARD, with D reserved; another clear one-to-one
      assignment is acceptable. Save the chosen mapping before testing.


      Carry out the three requests in order. After finding each card, put it outside the layout briefly,
      then return it to the home indicated by the label. Record the actual choice. Do not silently correct
      a misplaced return before recording the miss. A helper may operate the paper at your direction without
      choosing for you.


      A self-test is useful for inspecting a prototype, but you know its design and cannot claim that
      a new user found it intuitive. For a live willing-user route, obtain consent and explain that the
      layout—not the person''s worth—is being tested; do not introduce speed pressure or remove needed
      supports. Stop if permission or access is in doubt.


      For a fully text-based route, use the supplied prototype results in **later-packet.md** after saving
      your goal card and criteria. That route exercises acceptance decisions without pretending you physically
      built or tested the paper layout.


      #### Action 3 — Judge the result and challenge the continued value


      Compare every result with the original criteria. Report met for the tested scope, partial, not met
      because a constraint failed, or inconclusive because necessary evidence is missing. Explain why
      a visually appealing prototype with a return error is not fully complete.


      Keep version 1 and make a version 2 only when you can state the specific defect or changed need.
      A repeated self-test may show that the repair works for you but remains influenced by practice.
      Define a fresh comparable check or a willing-user test before claiming a broader benefit. If reducing
      the item count or changing an acceptance threshold is justified, record that change explicitly;
      do not rewrite version 1''s miss as a pass.


      End with a continue/revise/stop decision and its reason. Completing a target is not a command to
      keep pursuing it after its benefit disappears. Equally, one imperfection need not invalidate the
      useful part of an otherwise bounded result.


      ### Fresh checks and an honest completion boundary


      Attempt **check-prompts.md**, then open **check-answers.md**. One check tests activity-versus-outcome
      reasoning; the other tests constraint and missing-evidence handling. The task is not solved by adding
      precise numbers to a vague aspiration while leaving its reason unexplained.


      A complete source exercise produces a goal card, operational checks, an artifact or explicitly labeled
      simulation, an acceptance record, and a versioned next decision. It does not establish achievement
      of an unrelated real-life aspiration, independent usability, or sustained behavioral change.


      ### Adaptations and progression


      Use large print, distinct shapes, spoken home labels, tactile zones, or text-only mappings. Preserve
      the distinction between selecting an answer and receiving access assistance. An adaptation should
      remove incidental barriers without quietly changing three-item find-and-return into a different
      target. A changed target can be legitimate when versioned and described honestly.


      For a harder route, add another user-stated requirement such as a shared item with two acceptable
      storage conditions. Check whether the criteria remain consistent and whether the added complexity
      is worth its benefit. Avoid inventing more requirements just to make the exercise look sophisticated.


      For later transfer, define a small actual goal in a different domain and inspect it before committing
      money or other people''s time. Choose a review condition that allows abandoning a no-longer-useful
      goal. Private reasons and free-text reflections remain private; they are not automated scoring inputs.


      **Supportive:** The learner fixes the reason and criteria before testing, records a missed return
      without concealment, and revises the layout while preserving the original result.


      **Mixed:** Items are easier to find, but returns or another user''s burden remain unresolved and
      need another check.


      **Contradictory:** Purchases or photographs are counted as the benefit, a protected access constraint
      is violated, or success criteria are rewritten afterward to manufacture completion.


      **Inconclusive:** A precise-looking goal has no inspection method, no preserved result, or no explanation
      of why it remains worth pursuing.


      **Final review:** Did your tests measure the benefit you intended, and what would justify revising
      or stopping the goal even before every target was reached?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your answers before opening the key. More than one well-justified goal formulation can
      be acceptable.


      ### Check A — Activity is not the intended benefit


      A fictional person wants a reading corner that supports a comfortable, chosen 15-minute reading
      period. They set the target “buy three storage boxes this weekend.” No evidence shows boxes are
      needed. They already own a chair and lamp and have authority over their own corner; they do not
      have permission to move another person''s belongings. No new spending is available in this case.


      Rewrite the goal as an inspectable changed condition with a reason, a review point, two observable
      checks, protected constraints, and a stop/revise condition. Distinguish a method from an outcome.
      Would choosing to stop after learning that the person prefers reading elsewhere necessarily mean
      the goal-definition exercise failed?


      ### Check B — Missing evidence is not success


      A paper layout finds and returns all three cards correctly, costs nothing, and takes 12 minutes
      to construct. Its maker filled reserved zone D with decoration despite the fixed clear-strip constraint.
      A second layout keeps D clear and records three correct finds, but records no returns. Both makers
      claim full success; the second says “no errors were recorded.”


      Evaluate the two claims against the supplied goal, keeping failed and missing evidence distinct.
      What is the smallest useful next check or repair for each? May the first maker simply delete the
      D constraint after inspecting the result and report that version 1 passed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      P1 records three correct finds and **two correct returns out of three**. The eraser is returned
      to A instead of its labeled B home. The 12-minute effort, zero purchases, own-paper permission,
      clear D strip, and no answer-selection help satisfy those stated prototype constraints. The missed
      return means the full operational target is not met; the result is partial for the tested self-review
      scope.


      One repair is to make the return labels more distinct or change their placement, keep P1''s failed
      result, and test a versioned P2. The packet does not supply a P2 result. A repeated self-test would
      still be influenced by knowledge of the mapping; it would not establish independent user usability
      or lasting household benefit.


      The goal card should connect finding and returning to the chosen reason, not reward buying containers
      or making a neat picture. It should distinguish prototype acceptance from the larger benefit. The
      learner may choose a different valid mapping if the one-to-one homes and all stated constraints
      remain explicit.


      Repair a weak answer by adding the predeclared criteria, actual result for each one, the route and
      assistance, and a specific next decision. A useful defect is information, not an invitation to alter
      the recorded past.


      ### Check A — Activity is not the intended benefit


      An acceptable version might be: “By the end of this weekend, try one no-purchase arrangement of
      my own reading corner that permits a chosen 15-minute reading attempt with the book accessible and
      no need to move another person''s belongings; record the actual duration and whether the arrangement
      meets my stated comfort needs, then keep, revise, or stop it.” Comfort is user-reported, not a diagnosis,
      and a trial need not force a duration that becomes uncomfortable.


      Two checks could inspect access to the reading material without disturbing protected belongings
      and record an actual chosen reading attempt with its comfort report and stopping reason. Preserve
      no spending, permission, and existing access requirements. A missing or stopped attempt is not automatically
      15 successful minutes.


      Boxes are an unproven method, not the benefit. Learning that the person prefers another location
      can justify stopping this goal and recording why. The goal-definition skill may be exercised well
      even when the proposed reading-corner project is abandoned. Do not relabel an abandoned project
      as achieved.


      ### Check B — Missing evidence is not success


      The first layout fails a protected constraint even though its item tests pass. Remove or relocate
      the decoration within authority, preserve the original failure, and retest the clear-strip condition
      and any affected functions. A changed requirement must be justified and versioned; it cannot retroactively
      make version 1 pass.


      The second layout has incomplete evidence for returning. Three finds and an absence of recorded
      errors do not establish three correct returns. Run the specified return checks or mark that acceptance
      dimension unknown. That is different from a demonstrated incorrect return.


      The exact next check should target the missing or failed requirement rather than repeat an unrelated
      successful metric. Neither purchasing more materials nor improving the photograph resolves these
      evidential gaps.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
