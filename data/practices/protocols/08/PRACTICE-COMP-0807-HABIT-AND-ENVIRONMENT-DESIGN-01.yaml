  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Habit and environment design; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use accessible placement, tactile or visual cues, a one-step voice checklist, or materials already
      available. The equivalent can be setting out a chosen craft or language-practice item rather than
      a book. Retain access supports and shared-space consent. Accountability is optional, specific, revocable,
      and non-punitive. Do not introduce public reporting, financial penalties, blocked essential access,
      or surveillance. A changed need can end the habit without implying failure.
    cultural_context:
    - Adapt the expression of Habit and environment design to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use accessible placement, tactile or visual cues, a one-step voice checklist, or materials already
      available. The equivalent can be setting out a chosen craft or language-practice item rather than
      a book. Retain access supports and shared-space consent. Accountability is optional, specific, revocable,
      and non-punitive. Do not introduce public reporting, financial penalties, blocked essential access,
      or surveillance. A changed need can end the habit without implying failure.
  pause_conditions:
  - Pause Habit and environment design when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Habit and environment design practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Habit and environment design situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
