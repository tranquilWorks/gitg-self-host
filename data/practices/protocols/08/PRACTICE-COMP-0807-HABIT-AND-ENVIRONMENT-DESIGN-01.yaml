        - the_actual_failure_point_was_separated_from_a_claim_about_weak_character
        - a_relevant_design_tool_and_one_concrete_option_were_selected
        - consent_shared_space_access_and_unnecessary_additional_tools_were_considered
      - measurement_id: c0807_a1_boundary
        kind: boolean
