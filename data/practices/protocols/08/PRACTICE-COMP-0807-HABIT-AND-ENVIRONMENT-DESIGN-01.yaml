    claims were not inferred from two trials.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The book was placed but neither selected routine occurred
    during travel. Installation is observable; usability at the intended cue and repeated behavior remain
