meaning_and_fit:
  purpose: Install and test one small environmental arrangement that supports a recurring behavior you
    genuinely choose. Identify how a cue, default, friction, checklist, layout, or voluntary accountability
    contributes, without assuming the arrangement creates a durable habit.
  why_recommended: Install and test one small environmental arrangement that supports a recurring behavior
    you genuinely choose. Identify how a cue, default, friction, checklist, layout, or voluntary accountability
    contributes, without assuming the arrangement creates a durable habit.
  claims:
  - statement: Install and test one small environmental arrangement that supports a recurring behavior
      you genuinely choose. Identify how a cue, default, friction, checklist, layout, or voluntary accountability
      contributes, without assuming the arrangement creates a durable habit.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Habit and environment design practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Habit and environment design as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible placement, tactile or visual cues, a one-step voice checklist,
    or materials already available. The equivalent can be setting out a chosen craft or language-practice
    item rather than a book. Retain access supports and shared-space consent. Accountability is optional,
    specific, revocable, and non-punitive. Do not introduce public reporting, financial penalties, blocked
    essential access, or surveillance. A changed need can end the habit without implying failure.
  opportunity_considerations: 'Use existing materials and a short private note. Default: put the book
    you want to read in a safe visible place with a bookmark at the next page, after an ordinary recurring
    meal or other routine. The target is opening the book and reading one paragraph, not a daily streak.
    Do not block a shared route or remove a necessary item. Choose two naturally occurring opportunities
    in the next seven days; no purchase or app is required.'
  prerequisites:
  - 'Use existing materials and a short private note. Default: put the book you want to read in a safe
    visible place with a bookmark at the next page, after an ordinary recurring meal or other routine.
    The target is opening the book and reading one paragraph, not a daily streak. Do not block a shared
    route or remove a necessary item. Choose two naturally occurring opportunities in the next seven days;
    no purchase or app is required.'
  dependencies: []
  safe_alternatives:
  - Use accessible placement, tactile or visual cues, a one-step voice checklist, or materials already
    available. The equivalent can be setting out a chosen craft or language-practice item rather than
    a book. Retain access supports and shared-space consent. Accountability is optional, specific, revocable,
    and non-punitive. Do not introduce public reporting, financial penalties, blocked essential access,
    or surveillance. A changed need can end the habit without implying failure.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Habit and environment design differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Habit and environment design
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use existing materials and a short private note. Default: put the book you want to read in a
    safe visible place with a bookmark at the next page, after an ordinary recurring meal or other routine.
    The target is opening the book and reading one paragraph, not a daily streak. Do not block a shared
    route or remove a necessary item. Choose two naturally occurring opportunities in the next seven days;
    no purchase or app is required. Goal: Install and test one small environmental arrangement that supports
    a recurring behavior you genuinely choose. Identify how a cue, default, friction, checklist, layout,
    or voluntary accountability contributes, without assuming the arrangement creates a durable habit.
    Scope: The design considers cues, defaults, friction, accountability, checklists, and physical layout
    as distinct tools. It installs one small change, not all six at once. A cue signals the moment; a
    default makes the chosen next step ready; friction makes an action easier or harder; a checklist clarifies
    sequence; layout puts materials where they can be used; accountability is an optional consent-based
    check-in. Two trials can test usability, not establish automaticity or long-term habit strength. Time
    and effort: Five to ten minutes of setup, two ordinary opportunities of one to five minutes, and five
    minutes of review. Keep the arrangement reversible and remove it if it creates clutter, conflict,
    access problems, or pressure. Adaptation: Use accessible placement, tactile or visual cues, a one-step
    voice checklist, or materials already available. The equivalent can be setting out a chosen craft
    or language-practice item rather than a book. Retain access supports and shared-space consent. Accountability
    is optional, specific, revocable, and non-punitive. Do not introduce public reporting, financial penalties,
    blocked essential access, or surveillance. A changed need can end the habit without implying failure.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible placement, tactile or visual cues, a one-step voice checklist, or
    materials already available. The equivalent can be setting out a chosen craft or language-practice
    item rather than a book. Retain access supports and shared-space consent. Accountability is optional,
    specific, revocable, and non-punitive. Do not introduce public reporting, financial penalties, blocked
    essential access, or surveillance. A changed need can end the habit without implying failure.
  expected_burden: Five to ten minutes of setup, two ordinary opportunities of one to five minutes, and
    five minutes of review. Keep the arrangement reversible and remove it if it creates clutter, conflict,
    access problems, or pressure.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Habit and environment design protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Habit and environment design action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    placement, tactile or visual cues, a one-step voice checklist, or materials already available. The
    equivalent can be setting out a chosen craft or language-practice item rather than a book. Retain
    access supports and shared-space consent. Accountability is optional, specific, revocable, and non-punitive.
    Do not introduce public reporting, financial penalties, blocked essential access, or surveillance.
    A changed need can end the habit without implying failure.
  actions:
  - stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A1
    sequence: 1
    title: Locate the point where the recurring action breaks down
    instructions: 'Walk through one recent ordinary opportunity: what should have signaled the action,
      where the materials were, what the next physical step was, and what actually happened. For the default,
      the meal ended, the book was in another room, and an optional feed was already open. Decide whether
      the main obstacle is a missing cue, poor layout, unnecessary friction, unclear sequence, an unhelpful
      default, or a freely wanted reminder. Give one concrete option for that obstacle and explain why
      another tool is not needed now. A checklist is useful only if sequence is the problem; another person
      is not recruited unless both people freely agree.


      Observation checks: A specific recent opportunity and the intended small behavior were described;
      The actual failure point was separated from a claim about weak character; A relevant design tool
      and one concrete option were selected; Consent, shared-space access, and unnecessary additional
      tools were considered. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01
      action_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A1
      competency_stable_id: '08.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
