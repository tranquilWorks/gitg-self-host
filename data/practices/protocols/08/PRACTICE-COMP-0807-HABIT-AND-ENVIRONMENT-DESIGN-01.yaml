    A specific recent opportunity and the intended small behavior were described; The actual failure point
    was separated from a claim about weak character; A relevant design tool and one concrete option were
    selected; Consent, shared-space access, and unnecessary additional tools were considered. Action 2:
    Install one reversible arrangement and use it once. Observed checks: One bounded arrangement was actually
    installed and remained reversible; A naturally occurring cue and a real target-behavior opportunity
    were observed; Occurrence of the behavior was distinguished from readiness or intention alone; Burden,
    shared-space impact, and any reminder consent were checked. Action 3: Test the second opportunity
    and retain only what earns its place. Observed checks: A second naturally occurring opportunity was
    reviewed or remained missing; Cue visibility, behavior occurrence, and arrangement burden were distinguished;
