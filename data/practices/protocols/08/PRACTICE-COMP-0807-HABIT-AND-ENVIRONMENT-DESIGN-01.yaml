    c0807_a3_boundary: Action 3 stayed inside its stated Habit and environment design boundary
    c0807_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Which part of the arrangement actually helped, and what did it cost in effort, access,
    or shared space? Retain one justified feature, remove unnecessary ones, and review at a defined next
    opportunity. Reliable support must be observed over time rather than declared because the design looks
    clever. Completion is not mastery.
  plain_language_evidence: The safely placed bookmarked book was noticed after both chosen routines, and
    a paragraph was read each time. The user kept the arrangement while leaving long-term habit formation
    unclaimed.
