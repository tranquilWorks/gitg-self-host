  - stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A2
    sequence: 2
    title: Install one reversible arrangement and use it once
    instructions: 'Make the smallest chosen change and attempt the target behavior at the next natural
      cue. For the default, place the bookmarked book safely where you normally sit after the chosen routine.
      This changes layout and readiness as one bounded arrangement; do not also add alarms, penalties,
      and a public streak. Record whether the cue was noticed, whether the first physical step was easier,
      whether the behavior occurred, and any burden created for you or someone sharing the space. If you
      selected voluntary accountability instead, agree the exact reminder, privacy limit, and easy way
      to decline before the trial; the other person is not made responsible for your performance.


      Observation checks: One bounded arrangement was actually installed and remained reversible; A naturally
      occurring cue and a real target-behavior opportunity were observed; Occurrence of the behavior was
      distinguished from readiness or intention alone; Burden, shared-space impact, and any reminder consent
      were checked. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01
      action_stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A2
      competency_stable_id: '08.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
