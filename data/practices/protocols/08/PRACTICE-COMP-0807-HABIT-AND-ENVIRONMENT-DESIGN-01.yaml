  - stable_id: PRACTICE-COMP-0807-HABIT-AND-ENVIRONMENT-DESIGN-01-A3
    sequence: 3
    title: Test the second opportunity and retain only what earns its place
    instructions: 'At the next comparable cue, try the arrangement again. Record whether it remained available,
      was noticed, and made the chosen behavior more workable. Compare both observations with the original
      failure point. Keep the arrangement only for a stated benefit at an acceptable burden; adjust or
      remove it when it is ignored, obstructive, coercive, or no longer relevant. Specify when to review
      after two more natural opportunities. A behavior that happened once because a helper did all of
      it is not evidence that the environment now reliably supports your chosen action. Do not extend
      the test into an obligation to maintain a streak.


      Observation checks: A second naturally occurring opportunity was reviewed or remained missing; Cue
      visibility, behavior occurrence, and arrangement burden were distinguished; The retain, change,
      or remove decision addressed the original failure point; Long-term habit or independence claims
      were not inferred from two trials. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which part of the arrangement actually helped, and what did it cost in effort, access,
      or shared space? Retain one justified feature, remove unnecessary ones, and review at a defined
      next opportunity. Reliable support must be observed over time rather than declared because the design
      looks clever.


      Examples: Supportive: The safely placed bookmarked book was noticed after both chosen routines,
      and a paragraph was read each time. The user kept the arrangement while leaving long-term habit
      formation unclaimed.


      Mixed: The arrangement helped once but was moved during a shared-space activity before the second
      opportunity. The user agreed a less intrusive location rather than blaming either person.


      Contradictory: An accountability reminder became unwanted monitoring and the layout blocked another
      person’s access. The user withdrew the reminder and removed the obstruction, even though reading
      occurred.


      Inconclusive: The book was placed but neither selected routine occurred during travel. Installation
      is observable; usability at the intended cue and repeated behavior remain untested.'
