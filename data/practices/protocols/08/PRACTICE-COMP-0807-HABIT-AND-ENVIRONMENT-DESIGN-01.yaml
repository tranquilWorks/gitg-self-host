  adverse_or_contradictory_indicators:
  - An accountability reminder became unwanted monitoring and the layout blocked another person’s access.
    The user withdrew the reminder and removed the obstruction, even though reading occurred.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Habit and environment design explicitly; support can enable access and never reduces dignity or
    silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Habit and environment design context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Habit and environment design observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Habit and environment design rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
