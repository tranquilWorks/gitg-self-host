  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Rowan installs the notebook beside the evening note. On Monday the cue is noticed and the reminder
      is written. On Tuesday the notebook remains in place, but it obstructs the comfortable writing area;
      Rowan moves it aside and no reminder is written. No other person is asked to enforce the task.


      The arrangement supported one of two observed opportunities and created a real access cost. Rowan
      adjusts it to the upper corner within reach and plans to inspect Wednesday and Thursday. Those two
      future opportunities have not occurred, so the revised layout''s reliability remains unknown. The
      borrowed folder has not yet been returned.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let an arrangement support a chosen behavior


      Repeatedly missing a small action may involve an invisible cue, inconvenient layout, excess friction
      or an unsuitable default. Changing the environment can help the action become easier to begin. It
      does not remove the need to choose a worthwhile behavior or authorize arranging other people''s
      space without permission.


      Allow ten minutes to design one reversible change, two natural opportunities to test it and a short
      review. NHS guidance on reminders and suitable places [S06](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/)
      supports the general approach. The case tests one arrangement, not a validated habit-formation timetable
      or a claim that willpower is irrelevant.


      ### A notebook that is never where the task starts


      Fictional Rowan wants to write one next-day reminder after finishing a personal evening note. The
      last two opportunities ended without a reminder because the reminder notebook was inside a closed
      drawer across the room. Rowan uses a private desk; moving items onto a shared dining table is not
      authorized. The supplied reminder content is “Return the borrowed blue folder on Thursday.” The
      folder''s actual borrowing agreement stays unchanged.


      Consider four possible mechanisms before choosing: a cue makes the action noticeable; a default
      makes a suitable option ready; reduced friction removes an unnecessary step; a checklist supports
      an easily missed sequence. Accountability adds another person''s involvement and requires willing,
      specific consent. Combining all of them would make the small comparison harder to interpret and
      might add needless burden.


      The worked choice is a single layout arrangement: place the reminder notebook beside the ordinary
      evening notebook before the next opportunity. Keep the same pen and routine. No alarm, reward, helper
      message or extra checklist is added. The first observed behavior is whether Rowan independently
      writes the reminder at the relevant opportunity, not whether the desk looks organized.


      1. Describe the specific failed cue/action link and select one mechanism. Confirm ownership, shared-space
      limits and any accessibility needs. Install only the reversible notebook placement. A written intention
      to move it is not an installed design.

      2. Observe two natural opportunities. Record whether the arrangement was present, whether the cue
      was noticed, whether the reminder was actually written and any cost. Save the initial design before
      the [two-opportunity outcome](?resource=file-later-packet-md). If no opportunity occurs, the behavior
      is untested rather than reliably repeated.

      3. Keep, adjust or undo the arrangement according to its usefulness and burden. If you revise it,
      name two future opportunities for checking the revision; do not report those as already completed.
      A helper doing the whole reminder task would not establish Rowan''s new habit.


      For support, use a large visible card or a digital location already accessible, choosing only one
      change. For a harder case, another person needs the desk: negotiate a reversible placement or use
      private space; do not make them enforce the routine. Accountability should specify what contact
      is welcome, make declining easy and avoid private task contents. A later review can test reliability
      under ordinary variation. Two observations cannot establish automaticity or a universal environmental
      cause.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A notebook is placed correctly but no relevant opportunity occurs. Has the habit been demonstrated?


      2. The arrangement works once but obstructs comfortable writing next time. Should the cost be ignored?


      3. A helper writes every reminder. Does that demonstrate the learner independently formed the habit?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Installation and a performed behavior are separate. Wait for a suitable natural opportunity
      or report the missing observation.


      2. No. Preserve the access cost and adjust or undo the layout. The revised arrangement needs its
      own later check; it is not already proven.


      3. No. That demonstrates assistance, which may be useful, not independent habit performance. Any
      accountability must be consensual and accurately described.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
