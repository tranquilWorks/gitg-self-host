meaning_and_fit:
  purpose: Distinguish where attention was intended to go from where it actually went, then test one reversible
    change to a recurring environment. The result is a small attention map and a tested adjustment, not
    a productivity score or a diagnosis.
  why_recommended: Distinguish where attention was intended to go from where it actually went, then test
    one reversible change to a recurring environment. The result is a small attention map and a tested
    adjustment, not a productivity score or a diagnosis.
  claims:
  - statement: Distinguish where attention was intended to go from where it actually went, then test one
      reversible change to a recurring environment. The result is a small attention map and a tested adjustment,
      not a productivity score or a diagnosis.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Attention audit practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Attention audit as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use voice notes, tactile category markers, or a consenting helper who records
    only categories; support is not a deficit. An offline equivalent is an unread magazine beside paperwork
    or background television. Shorten both activity windows equally. Keep medically necessary routines
    and all essential alerts. Stop for safety responsibilities or distress. Persistent intrusive thoughts
    are not an invitation to monitor them continuously; use an ordinary external activity instead and
    seek appropriate support when needed.
  opportunity_considerations: 'Use paper or an offline note and a clock already available. The default
    is an ordinary ten-minute reading period interrupted by optional messages. Make six headings: devices,
    entertainment, work or necessary tasks, relationships, rumination, and deliberate practice. A period
    may have more than one label: a meaningful call belongs under relationships even though a device carries
    it. Select three convenient checkpoints in one ordinary day and the same checkpoints on a second day;
    do not install tracking software or record another person.'
  prerequisites:
  - 'Use paper or an offline note and a clock already available. The default is an ordinary ten-minute
    reading period interrupted by optional messages. Make six headings: devices, entertainment, work or
    necessary tasks, relationships, rumination, and deliberate practice. A period may have more than one
    label: a meaningful call belongs under relationships even though a device carries it. Select three
    convenient checkpoints in one ordinary day and the same checkpoints on a second day; do not install
    tracking software or record another person.'
  dependencies: []
  safe_alternatives:
  - Use voice notes, tactile category markers, or a consenting helper who records only categories; support
    is not a deficit. An offline equivalent is an unread magazine beside paperwork or background television.
    Shorten both activity windows equally. Keep medically necessary routines and all essential alerts.
    Stop for safety responsibilities or distress. Persistent intrusive thoughts are not an invitation
    to monitor them continuously; use an ordinary external activity instead and seek appropriate support
    when needed.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Attention audit differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Attention audit as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper or an offline note and a clock already available. The default is an ordinary ten-minute
    reading period interrupted by optional messages. Make six headings: devices, entertainment, work or
    necessary tasks, relationships, rumination, and deliberate practice. A period may have more than one
    label: a meaningful call belongs under relationships even though a device carries it. Select three
    convenient checkpoints in one ordinary day and the same checkpoints on a second day; do not install
    tracking software or record another person. Goal: Distinguish where attention was intended to go from
    where it actually went, then test one reversible change to a recurring environment. The result is
    a small attention map and a tested adjustment, not a productivity score or a diagnosis. Scope: The
    audit samples devices, entertainment, work, relationships, rumination, and deliberate practice; these
    are not good-versus-bad categories. A leak means a recurring mismatch with a freely chosen intention,
    not leisure, caregiving, accessible device use, or an interruption that deserved attention. Three
    brief samples cannot establish a whole-day time budget. One environmental test addresses one recurring
    mismatch and does not establish general attention capacity. Time and effort: About five minutes to
    set up, three one-minute notes on each of two days, two ten-minute activity windows, and a five-minute
    review. Keep only coarse categories; no continuous monitoring. Adaptation: Use voice notes, tactile
    category markers, or a consenting helper who records only categories; support is not a deficit. An
    offline equivalent is an unread magazine beside paperwork or background television. Shorten both activity
    windows equally. Keep medically necessary routines and all essential alerts. Stop for safety responsibilities
    or distress. Persistent intrusive thoughts are not an invitation to monitor them continuously; use
    an ordinary external activity instead and seek appropriate support when needed. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use voice notes, tactile category markers, or a consenting helper who records only
    categories; support is not a deficit. An offline equivalent is an unread magazine beside paperwork
    or background television. Shorten both activity windows equally. Keep medically necessary routines
    and all essential alerts. Stop for safety responsibilities or distress. Persistent intrusive thoughts
    are not an invitation to monitor them continuously; use an ordinary external activity instead and
    seek appropriate support when needed.
  expected_burden: About five minutes to set up, three one-minute notes on each of two days, two ten-minute
    activity windows, and a five-minute review. Keep only coarse categories; no continuous monitoring.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Attention audit protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Attention audit action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use voice notes,
    tactile category markers, or a consenting helper who records only categories; support is not a deficit.
    An offline equivalent is an unread magazine beside paperwork or background television. Shorten both
    activity windows equally. Keep medically necessary routines and all essential alerts. Stop for safety
    responsibilities or distress. Persistent intrusive thoughts are not an invitation to monitor them
    continuously; use an ordinary external activity instead and seek appropriate support when needed.
  actions:
  - stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A1
    sequence: 1
    title: Sample intention, actual attention, and context
    instructions: 'At each chosen checkpoint, look back over the immediately preceding activity and write
      its intended focus, its actual focus, and what redirected it. For example: intended to read a page;
      followed an optional message into a feed; the unlocked phone beside the page was the cue. Assign
      one or more of the six headings. Mark headings not observed as not sampled, not as zero. Distinguish
      a needed response, such as a care request, from an optional diversion. After the third checkpoint,
      select a mismatch that appeared twice or identify a clearly recalled recurring example separately
      from the samples; do not invent recurrence from one observation.


      Observation checks: Three planned checkpoints were recorded or the missing checkpoints were explicitly
      identified; Intended focus and actual focus were distinguished without recording private contents;
      All six categories were considered and unsampled categories remained unknown; A recurring mismatch
      was supported by observations or separately labeled retrospective evidence. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01
      action_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A1
      competency_stable_id: '08.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0801_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0801_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - three_planned_checkpoints_were_recorded_or_the_missing_checkpoints_were_explicitly_identified
        - intended_focus_and_actual_focus_were_distinguished_without_recording_private_contents
        - all_six_categories_were_considered_and_unsampled_categories_remained_unknown
        - a_recurring_mismatch_was_supported_by_observations_or_separately_labeled_retrospective_evidence
      - measurement_id: c0801_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
