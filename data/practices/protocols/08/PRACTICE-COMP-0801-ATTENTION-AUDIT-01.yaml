  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [NIMH — Caring for Your Mental Health](https://www.nimh.nih.gov/health/topics/caring-for-your-mental-health)

      - [988 Suicide & Crisis Lifeline — What to Expect](https://988lifeline.org/get-help/what-to-expect/)

      - [NHS Every Mind Matters — Staying on top of things](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/staying-on-top-of-things/)

      - [NCCIH — Meditation and Mindfulness: Effectiveness and Safety](https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety)

      - [NHS Every Mind Matters — Reframing unhelpful thoughts](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/reframing-unhelpful-thoughts/)

      - [NHS Every Mind Matters — Tackling your to-do list](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/)

      - [University of Edinburgh — What? So what? Now what?](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Casey removes only the optional news tile. Wednesday''s ten-minute window contains eight minutes
      with the card and two minutes finding the saved page. Thursday contains five minutes with the card
      and five answering a necessary call. Essential alerts and the friend''s contact remain accessible.


      The first two morning windows contained seven reading minutes in total; the changed pair contains
      thirteen. This is a descriptive comparison with different circumstances, including a necessary call
      and page-finding friction. It does not isolate the tile''s effect or make the call a failure. Casey
      keeps the arrangement provisionally, with no later review yet supplied. The rest of either day remains
      unobserved.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Look for a mismatch, not a bad category of attention


      An attention audit compares what you intended with what actually occupied a small observed window.
      Devices can support relationships or deliberate study; work can include avoidant busywork; entertainment
      can be chosen rest. Rumination is repetitive thought without a useful next step, but an outside
      observer cannot infer it from silence. Categories overlap and do not measure moral worth.


      Use three brief checkpoints on each of two ordinary days, then two comparable ten-minute redesign
      windows. The NHS discussion of task patterns and environment [S06](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/)
      supports observing a recurring obstacle and making a manageable adjustment. The six-category audit
      and timing below are original teaching choices, not validated measurements of total attention.


      ### Six observations with a recurring cue


      Fictional Casey records the ten minutes immediately before 09:00, 13:00 and 18:00. These are sampled
      windows, not a whole-day history. Use device, entertainment, work, relationships, rumination and
      deliberate practice as overlapping tags. Mark an unobserved activity unknown rather than zero.


      | Day/checkpoint | Intention | Actual window | Cue and interpretation |

      | --- | --- | --- | --- |

      | Monday 09:00 | Read a short learning card | Four minutes reading, six browsing optional headlines
      | A home-screen news tile; mismatch with study intention. |

      | Monday 13:00 | Talk to a friend by phone | Ten minutes talking | Device plus relationship; intended
      use. |

      | Monday 18:00 | Watch a chosen comedy | Ten minutes watching | Entertainment plus device; intended
      rest. |

      | Tuesday 09:00 | Read the same card | Three minutes reading, seven optional headlines | Same news
      tile; recurring mismatch. |

      | Tuesday 13:00 | Finish a routine draft | Ten minutes working on it | Work; no drift reported.
      |

      | Tuesday 18:00 | Rest | Thoughts replaying an old minor exchange; duration uncertain | Possible
      rumination by Casey''s report; no minute estimate. |


      The full learning card says: “For this fictional index, blue means a book, green means a map and
      orange means a game. An uncolored entry needs clarification.” Study its four rules without making
      speed or recall the outcome. The repeated cue is the news tile, not every phone use. Summing overlapping
      tags would double-count some minutes; the uncertain evening cannot be filled with a guessed number.


      1. Label each observed window with intention, actual use and cue. Identify the two recurring mismatches
      and leave the uncertain duration unresolved. State one important intended use that should remain
      possible: the friend''s call.

      2. Change one condition: remove the optional news tile from the first screen, keeping the device,
      card, essential alerts and access supports available. Try two later ten-minute morning windows with
      the same card. Save the redesign before the [later comparison](?resource=file-later-packet-md).
      Do not add blocking software, notification removal and a reward simultaneously.

      3. Compare intended and actual use in those windows, including changed circumstances. Keep, adjust
      or undo the arrangement based on usefulness and costs. No screen surveillance, application telemetry
      or employer productivity ranking is needed.


      For support, use one accurately remembered window and treat the two-day audit as incomplete, or
      work entirely from this table. For a harder case, the news shortcut is needed for a genuine duty:
      choose another optional cue or retain it. Never remove emergency, accessibility or caregiving access.
      A later natural review can test recurrence, but four morning samples cannot establish a stable attention
      trait or prove causation.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A phone call uses a device for ten minutes of intended friendship. Is it automatically an attention
      leak?


      2. Two ten-minute samples contain thirteen study minutes after a change versus seven before. Does
      that prove the change caused six extra minutes?


      3. One checkpoint has an uncertain rumination duration. May it be entered as zero?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Compare actual use with the intended purpose; device and relationship tags may overlap. A
      category is not a verdict.


      2. No. The six-minute descriptive difference is real in the supplied record, but circumstances differ
      and there is no controlled causal test or whole-day estimate.


      3. No. Unknown duration is not zero. Preserve the uncertainty and avoid totals that double-count
      overlapping categories.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
