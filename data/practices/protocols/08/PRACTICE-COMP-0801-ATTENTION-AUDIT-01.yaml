    remains? Name one condition to retain and one situation in which it should not be used. Review it
    after two further naturally occurring opportunities; one successful window does not establish broad
    or durable improvement. Completion is not mastery.
  plain_language_evidence: Optional feed checking interrupted two reading samples. Closing that tab, while
    keeping necessary messages available, made returning to the page workable in both later windows. The
    user retained the change without claiming a whole-day improvement.
  display_order: 99
