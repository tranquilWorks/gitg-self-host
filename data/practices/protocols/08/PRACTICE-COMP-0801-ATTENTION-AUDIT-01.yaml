        expected: true
  - stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A3
    sequence: 3
    title: Compare another ordinary day and decide what to retain
    instructions: 'Repeat the three checkpoints on the second day and run a comparable ten-minute activity
      with the tested condition. Compare the intended-versus-actual focus notes, not guessed totals for
      the day. Name an important difference between days, such as visitors, task difficulty, fatigue,
      or an urgent call. Decide to keep, adjust, remove, or repeat the one change, with a reason tied
      to observed attention and burden. For example: closing the feed helped at both windows, but moving
      the phone blocked a necessary call, so retain only the closed tab. Missing checkpoints or unlike
      activities limit the comparison; they are not evidence that the change worked.


      Observation checks: A second real activity window and the second-day checkpoints were reviewed;
      Context differences and missing observations were retained in the comparison; The conclusion concerned
      attention allocation rather than productivity or character; A keep, adjust, remove, or repeat decision
      was tied to evidence and burden. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which mismatch actually recurred, which change was tested, and what competing explanation
      remains? Name one condition to retain and one situation in which it should not be used. Review it
      after two further naturally occurring opportunities; one successful window does not establish broad
      or durable improvement.


      Examples: Supportive: Optional feed checking interrupted two reading samples. Closing that tab,
      while keeping necessary messages available, made returning to the page workable in both later windows.
      The user retained the change without claiming a whole-day improvement.


      Mixed: The first changed window was easier, but a necessary care call occupied the second. The change
      may fit quiet reading; the samples do not show whether it helps during active care duties.


      Contradictory: Moving the phone out of reach caused a missed essential response and more checking
      anxiety. The user restored access and rejected that change rather than presenting fewer screen touches
      as success.


      Inconclusive: Only one checkpoint was recorded and the activity changed from reading to a social
      visit. There is no defensible before-and-after comparison; the unobserved categories and effects
      remain unknown.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
