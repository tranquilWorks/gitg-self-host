        expected: true
  - stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A2
    sequence: 2
    title: Change the environment rather than blame the person
    instructions: 'Choose one reversible condition that contributed to the mismatch. For the default,
      put the phone face down out of immediate reach for ten minutes while retaining essential alerts
      and access; alternatively close one optional feed tab. Write a prediction before starting: I may
      notice the urge to check without opening the feed automatically. Run the same ordinary reading activity
      once. Do not add a timer app, silence all alerts, move locations, and change the task simultaneously.
      Record whether the change was used, whether attention returned when a diversion was noticed, and
      any necessary interruption. The aim is a more workable choice, not a higher page count.


      Observation checks: One controllable environmental condition was changed and the change was reversible;
      A prediction was written before a real activity window was attempted; Essential alerts and accessibility
      or caregiving supports remained available; The observed redirection and return were recorded without
      using output as the outcome. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01
      action_stable_id: PRACTICE-COMP-0801-ATTENTION-AUDIT-01-A2
      competency_stable_id: '08.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0801_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0801_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_controllable_environmental_condition_was_changed_and_the_change_was_reversible
        - a_prediction_was_written_before_a_real_activity_window_was_attempted
        - essential_alerts_and_accessibility_or_caregiving_supports_remained_available
        - the_observed_redirection_and_return_were_recorded_without_using_output_as_the_outcome
      - measurement_id: c0801_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c0801_a2_adverse
        kind: boolean
        role: adverse
