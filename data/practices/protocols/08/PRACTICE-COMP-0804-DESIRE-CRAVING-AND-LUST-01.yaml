  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Noor saves the video and calls at 19:00. The conversation occurs as agreed. Noor reports still wanting
      the video; the brief optional pause did not remove desire. At 19:25 Noor watches the saved eight-minute
      video and stops at 19:33, then reports wanting another one.


      The call agreement was respected and the first video was enjoyed later. The original promise that
      one more would produce enough was not supported by the reported renewed desire. No compulsion diagnosis,
      permanent restraint or transfer to intimate situations is established.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Want something without making it inevitable


      Desire can highlight a real good while hiding competing goods, another person''s freedom or uncertainty
      about the promised reward. Feeling desire does not itself make someone blameworthy. The useful question
      is what action fits the whole situation, including consent and obligations. People are not instruments
      for satisfying a feeling.


      Use a low-stakes, non-intimate example for a ten-minute mapping exercise and one natural choice.
      NHS evidence-checking guidance [S05](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/reframing-unhelpful-thoughts/)
      supports examining an attractive prediction. The three headings here—what I want, the reward I expect,
      and what else matters—are original teaching material. They are not addiction treatment, sexual disclosure
      or a withdrawal plan.


      ### One more video and a real agreement


      Fictional Noor has agreed to call a friend at 19:00. At 18:58 a service offers another eight-minute
      hobby video. Noor wants it and predicts, “One more will leave me satisfied.” The prediction is unknown,
      not a demonstrated effect. The friend has not agreed to a later call; there is no emergency and
      the video can be saved.


      The worked map is: want—watch the suggested video now; expected reward—enjoyment and a feeling of
      enough; other goods—the friend''s time, the freely made call agreement and freedom to choose later.
      The video is neither evil nor mandatory. Starting it at 18:58 would extend to 19:06 if watched fully,
      overlapping the agreed call by six minutes. Desire does not silently amend the agreement.


      1. Fill the three headings and mark the uncertain promise. For a real example, choose a harmless
      optional attraction, not restriction of food, care or prescribed treatment. If a person is involved,
      add their independent wishes and freedom; your desire supplies no evidence of their consent.

      2. If useful, allow up to ninety seconds to notice the urge without acting on it. This is optional,
      can stop earlier and does not require the feeling to fade. Choose a response: save the video and
      call as agreed, or ask about a later time before changing the plan and accept refusal. Save the
      choice before the [later outcome](?resource=file-later-packet-md).

      3. Compare wanted reward, chosen action and actual consequences. A retained desire can coexist with
      a respected agreement. If you chose to watch, report the timing honestly; do not recast a late call
      as consensual because the video was enjoyable.


      For support, use only the arithmetic and supplied case. For a harder case, the friend says no to
      postponing: keep the agreement or communicate an honest breach and appropriate repair; do not pressure
      them to validate the desire. Ethical reflection about lust can distinguish attraction from consent
      without intimate history, explicit detail or an acted sexual scenario.


      In later transfer, notice one attractive promise that narrows attention and restore one overlooked
      fact before choosing. Addiction, compulsive behavior, eating concerns and unsafe relationship dynamics
      warrant suitable qualified help rather than escalating this exercise. The lesson neither requires
      abstinence from ordinary pleasure nor proves freedom from craving.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. Wanting another video remains after a pause. Does that make a deliberate choice impossible?


      2. An eight-minute video begins at 18:58 before an agreed 19:00 call. What needs acknowledging?


      3. Someone''s attraction is intense. Does that establish the other person''s consent?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      At 14:47 a consenting listener can remain until 14:52. Your proposed listening turn takes eight
      minutes. Work out whether it fits and draft a choice that preserves the listener’s control.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. An urge can remain while a person chooses a response consistent with other goods. The pause
      does not require disappearance of desire.


      2. Watching it fully would end at 19:06 and overlap the call by six minutes. Ask before changing
      the agreement or preserve the agreed time; enjoyment does not erase the obligation.


      3. No. Another person''s wishes and freedom are independent. Intensity supplies neither permission
      nor entitlement, and no intimate disclosure or action is needed for this lesson.


      ### Changed-case answer


      Eight minutes ends at 14:55, three minutes beyond availability. Ask whether a shorter turn of at
      most five minutes works or arrange another time. Do not treat initial consent as consent to overrun.
      A shorter agreed exchange may serve the purpose without a full eight-minute performance.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
