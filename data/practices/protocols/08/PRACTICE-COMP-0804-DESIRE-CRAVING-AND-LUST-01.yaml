        - the_desire_was_allowed_to_remain_rather_than_made_a_required_target_for_elimination
        - at_least_one_alternative_and_one_neglected_consideration_were_identified
        - the_observed_experience_and_any_early_stop_were_recorded_honestly
      - measurement_id: c0804_a2_boundary
        kind: boolean
