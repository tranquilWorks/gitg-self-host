        - the_expected_reward_and_at_least_one_assumption_were_distinguished
        - another_relevant_need_commitment_or_consideration_was_restored_to_view
        - other_people_s_independent_wishes_and_basic_needs_boundaries_were_respected
      - measurement_id: c0804_a1_boundary
        kind: boolean
