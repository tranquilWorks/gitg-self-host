meaning_and_fit:
  purpose: Observe one ordinary desire, restore a consideration it pushed out of view, and make a bounded
    choice that respects other people and your own needs. The aim is desire with agency, not absence of
    desire, purity, or a compulsory refusal.
  why_recommended: Observe one ordinary desire, restore a consideration it pushed out of view, and make
    a bounded choice that respects other people and your own needs. The aim is desire with agency, not
    absence of desire, purity, or a compulsory refusal.
  claims:
  - statement: Observe one ordinary desire, restore a consideration it pushed out of view, and make a
      bounded choice that respects other people and your own needs. The aim is desire with agency, not
      absence of desire, purity, or a compulsory refusal.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Desire, craving, and lust practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Desire, craving, and lust as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a spoken note or a neutral desire such as checking an optional score or
    choosing background entertainment. Do not evoke distressing material, provoke jealousy, involve an
    unwilling person, restrict nourishment, change medication, or attempt substance withdrawal. An ordinary
    pause need not last ninety seconds. Private attraction or intimate behavior need not be disclosed;
    a fictional dignity example is conceptual rehearsal only. Stop and seek appropriate support when the
    situation exceeds a safe low-stakes exercise.
  opportunity_considerations: 'Use paper or an offline note. Default: wanting to watch one more optional
    video after the activity you chose has ended. Start only when that desire occurs naturally. Make three
    headings: what I want, what I expect it to give me, and what else matters. An example is another video,
    a pleasant distraction, and a promised ordinary call. No food, substance, money, intimate detail,
    or other person’s identity needs to be recorded.'
  prerequisites:
  - 'Use paper or an offline note. Default: wanting to watch one more optional video after the activity
    you chose has ended. Start only when that desire occurs naturally. Make three headings: what I want,
    what I expect it to give me, and what else matters. An example is another video, a pleasant distraction,
    and a promised ordinary call. No food, substance, money, intimate detail, or other person’s identity
    needs to be recorded.'
  dependencies: []
  safe_alternatives:
  - Use a spoken note or a neutral desire such as checking an optional score or choosing background entertainment.
    Do not evoke distressing material, provoke jealousy, involve an unwilling person, restrict nourishment,
    change medication, or attempt substance withdrawal. An ordinary pause need not last ninety seconds.
    Private attraction or intimate behavior need not be disclosed; a fictional dignity example is conceptual
    rehearsal only. Stop and seek appropriate support when the situation exceeds a safe low-stakes exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Desire, craving, and lust differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Desire, craving, and lust
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper or an offline note. Default: wanting to watch one more optional video after the activity
    you chose has ended. Start only when that desire occurs naturally. Make three headings: what I want,
    what I expect it to give me, and what else matters. An example is another video, a pleasant distraction,
    and a promised ordinary call. No food, substance, money, intimate detail, or other person’s identity
    needs to be recorded. Goal: Observe one ordinary desire, restore a consideration it pushed out of
    view, and make a bounded choice that respects other people and your own needs. The aim is desire with
    agency, not absence of desire, purity, or a compulsory refusal. Scope: The exercise addresses narrowed
    attention, expected reward, distorted assumptions, and treating persons or goods as mere means. The
    default directly tests a non-intimate desire. A brief consent-and-dignity check explains a transfer
    boundary for attraction or lust: another person has independent wishes, not an obligation to satisfy
    desire. That check is conceptual literacy, not observation of sexual conduct or a requirement to disclose
    it. Addiction treatment and high-consequence impulses are outside scope. Time and effort: About five
    minutes to set up, one naturally occurring desire and a short optional ninety-second interval, then
    five minutes to decide and review. A second occasion within seven days is optional and must not be
    manufactured. Adaptation: Use a spoken note or a neutral desire such as checking an optional score
    or choosing background entertainment. Do not evoke distressing material, provoke jealousy, involve
    an unwilling person, restrict nourishment, change medication, or attempt substance withdrawal. An
    ordinary pause need not last ninety seconds. Private attraction or intimate behavior need not be disclosed;
    a fictional dignity example is conceptual rehearsal only. Stop and seek appropriate support when the
    situation exceeds a safe low-stakes exercise. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a spoken note or a neutral desire such as checking an optional score or choosing
    background entertainment. Do not evoke distressing material, provoke jealousy, involve an unwilling
    person, restrict nourishment, change medication, or attempt substance withdrawal. An ordinary pause
    need not last ninety seconds. Private attraction or intimate behavior need not be disclosed; a fictional
    dignity example is conceptual rehearsal only. Stop and seek appropriate support when the situation
    exceeds a safe low-stakes exercise.
  expected_burden: About five minutes to set up, one naturally occurring desire and a short optional ninety-second
    interval, then five minutes to decide and review. A second occasion within seven days is optional
    and must not be manufactured.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Desire, craving, and lust protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Desire, craving, and lust action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a spoken
    note or a neutral desire such as checking an optional score or choosing background entertainment.
    Do not evoke distressing material, provoke jealousy, involve an unwilling person, restrict nourishment,
    change medication, or attempt substance withdrawal. An ordinary pause need not last ninety seconds.
    Private attraction or intimate behavior need not be disclosed; a fictional dignity example is conceptual
    rehearsal only. Stop and seek appropriate support when the situation exceeds a safe low-stakes exercise.
  actions:
  - stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A1
    sequence: 1
    title: Describe the desire and the promise attached to it
    instructions: 'When the ordinary desire appears, fill the three headings with neutral descriptions.
      For the default: I want another video; I expect a break from effort; I also want to honor my chosen
      call. Add one assumption that may be unverified, such as one more will definitely satisfy me. Do
      not argue that having the desire is bad. If the desire involves a person, use only a category-level
      note and state that the person’s consent, preferences, and freedom remain independent of your wanting.
      If a basic need is present, meet that need rather than using this exercise to question its legitimacy.


      Observation checks: A naturally occurring desire was described without a moral or identity verdict;
      The expected reward and at least one assumption were distinguished; Another relevant need, commitment,
      or consideration was restored to view; Other people’s independent wishes and basic-needs boundaries
      were respected. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01
      action_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A1
      competency_stable_id: '08.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
