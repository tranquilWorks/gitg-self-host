  - stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A2
    sequence: 2
    title: Allow the feeling while recovering a wider view
    instructions: 'For an optional entertainment desire, wait up to ninety seconds before the next click
      while doing an ordinary neutral action, such as setting down the device and looking at the room.
      You do not have to make the desire fade. Ask whether the expected reward is the only relevant fact
      and identify one alternative: watch later, take a different break, make the call, or freely choose
      the video. Notice whether the urge stayed, eased, or intensified, without a numeric intensity requirement.
      End the interval early if it becomes unhelpful. This is not a rule for delaying food, medication,
      necessary communication, or relief of a health need.


      Observation checks: A safe interval was attempted with an optional nonessential desire; The desire
      was allowed to remain rather than made a required target for elimination; At least one alternative
      and one neglected consideration were identified; The observed experience and any early stop were
      recorded honestly. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01
      action_stable_id: PRACTICE-COMP-0804-DESIRE-CRAVING-AND-LUST-01-A2
      competency_stable_id: '08.04'
