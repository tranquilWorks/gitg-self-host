  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Completion and perseverance differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Completion and perseverance
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private note and a small commitment within your control. Default: an unfinished personal
    three-paragraph note that needs a final edit and saving in its intended location. List at most three
    current open loops without sensitive contents. Choose one that can be advanced in two ten-minute windows
    within seven days and whose partial work or cancellation creates no safety, legal, financial, or care
    hazard. Use a personal craft, learning exercise, or household organization task as an equivalent.
    Goal: Reduce competing open loops, define a meaningful finish, and either complete one bounded commitment
    or end it for a reason that addresses its consequences. Perseverance is continued worthwhile action,
    not refusing to quit regardless of new evidence. Scope: The exercise addresses simultaneous commitments,
    a definition of done, plateaus, and actual completion or reasoned termination. A small open-loop list
    supports choosing one focus; it is not a total-life inventory. A completed personal note cannot demonstrate
    perseverance in every domain. Termination requires a concrete reason and appropriate closure, not
    merely declaring a difficult task irrelevant. Obligations to others cannot be erased by a private
    decision. Time and effort: Five to ten minutes to choose and define the commitment, two ten-minute
    work windows, and five minutes to close and review. Reduce scope before starting if the finish is
    not credible at this scale. Adaptation: Use an accessible medium, a smaller personal artifact, a checklist,
    or a consenting helper. A helper’s work and your contribution should remain distinguishable without
    ranking support needs. Do not choose high-consequence obligations for a quit experiment or silently
    abandon promises, shared work, or essential care. A change in capacity can justify renegotiation.
    Stop or defer when a safe bounded finish is unavailable, and do not manufacture a plateau. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an accessible medium, a smaller personal artifact, a checklist, or a consenting
    helper. A helper’s work and your contribution should remain distinguishable without ranking support
    needs. Do not choose high-consequence obligations for a quit experiment or silently abandon promises,
    shared work, or essential care. A change in capacity can justify renegotiation. Stop or defer when
    a safe bounded finish is unavailable, and do not manufacture a plateau.
  expected_burden: Five to ten minutes to choose and define the commitment, two ten-minute work windows,
    and five minutes to close and review. Reduce scope before starting if the finish is not credible at
    this scale.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Completion and perseverance protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Completion and perseverance action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an accessible
    medium, a smaller personal artifact, a checklist, or a consenting helper. A helper’s work and your
    contribution should remain distinguishable without ranking support needs. Do not choose high-consequence
    obligations for a quit experiment or silently abandon promises, shared work, or essential care. A
    change in capacity can justify renegotiation. Stop or defer when a safe bounded finish is unavailable,
    and do not manufacture a plateau.
  actions:
  - stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A1
    sequence: 1
    title: Choose one focus and define done before continuing
    instructions: 'List up to three open loops and their next concrete steps. Select one to finish or
      decide about, and explicitly park the others with a revisit point rather than starting another task
      when bored. For the default note, done means all three paragraphs readable, obvious omissions checked,
      and a copy saved in the intended location; publication or praise is not required. Name one reason
      that would justify changing or ending the commitment, such as the note no longer serving its intended
      purpose. Check whether anyone else relies on the outcome and what communication would be needed
      before scope changes.


      Observation checks: One commitment was selected and competing loops were explicitly parked; A concrete
      definition of done was written before the work trial; A legitimate reason for scope change or termination
      was distinguished from boredom alone; Any dependency or obligation to another person was identified.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01
      action_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A1
