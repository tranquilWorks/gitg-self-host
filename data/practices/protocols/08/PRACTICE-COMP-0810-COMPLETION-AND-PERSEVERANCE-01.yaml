  - stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A2
    sequence: 2
    title: Work through one bounded plateau and reassess the obstacle
    instructions: 'Attempt the first ten-minute window on the selected next step. When progress stalls,
      name the obstacle specifically: an unclear sentence, missing information, too-large scope, distraction,
      or a changed purpose. Try one proportionate response within your authority, such as marking a sentence
      for a simpler rewrite or asking a necessary non-sensitive question. At the second window, continue
      the same commitment or act on new evidence that it should be reduced or ended. Do not switch to
      a new project to avoid recording the plateau. Also do not persist through unsafe conditions or add
      work that the original finish never required.


      Observation checks: At least one real bounded work window targeted the selected commitment; A plateau
      or obstacle was described specifically when present; One proportionate response or evidence-based
      reconsideration was attempted; Scope drift, unsafe persistence, and substitution of a new commitment
      were not hidden. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01
