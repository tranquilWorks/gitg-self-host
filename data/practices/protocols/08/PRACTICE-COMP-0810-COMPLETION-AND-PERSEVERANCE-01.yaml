  completion_copy: What actually closed, what stayed open, and what did the plateau teach you about the
    next step or the commitment’s value? Was stopping a reasoned closure or an avoidance story unsupported
    by evidence? Keep one workable limit on simultaneous commitments without treating every unfinished
    aspiration as a debt. Completion is not mastery.
  plain_language_evidence: The user parked two optional loops, edited the selected note across two short
    windows, checked the stated finish, and saved it. Completion was observed without adding publication
    or perfection as a new requirement.
