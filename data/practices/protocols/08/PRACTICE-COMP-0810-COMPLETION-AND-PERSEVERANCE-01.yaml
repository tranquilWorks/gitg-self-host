meaning_and_fit:
  purpose: Reduce competing open loops, define a meaningful finish, and either complete one bounded commitment
    or end it for a reason that addresses its consequences. Perseverance is continued worthwhile action,
    not refusing to quit regardless of new evidence.
  why_recommended: Reduce competing open loops, define a meaningful finish, and either complete one bounded
    commitment or end it for a reason that addresses its consequences. Perseverance is continued worthwhile
    action, not refusing to quit regardless of new evidence.
  claims:
  - statement: Reduce competing open loops, define a meaningful finish, and either complete one bounded
      commitment or end it for a reason that addresses its consequences. Perseverance is continued worthwhile
      action, not refusing to quit regardless of new evidence.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Completion and perseverance practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Completion and perseverance as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an accessible medium, a smaller personal artifact, a checklist, or a consenting
    helper. A helper’s work and your contribution should remain distinguishable without ranking support
    needs. Do not choose high-consequence obligations for a quit experiment or silently abandon promises,
    shared work, or essential care. A change in capacity can justify renegotiation. Stop or defer when
    a safe bounded finish is unavailable, and do not manufacture a plateau.
  opportunity_considerations: 'Use a private note and a small commitment within your control. Default:
    an unfinished personal three-paragraph note that needs a final edit and saving in its intended location.
    List at most three current open loops without sensitive contents. Choose one that can be advanced
    in two ten-minute windows within seven days and whose partial work or cancellation creates no safety,
    legal, financial, or care hazard. Use a personal craft, learning exercise, or household organization
    task as an equivalent.'
  prerequisites:
  - 'Use a private note and a small commitment within your control. Default: an unfinished personal three-paragraph
    note that needs a final edit and saving in its intended location. List at most three current open
    loops without sensitive contents. Choose one that can be advanced in two ten-minute windows within
    seven days and whose partial work or cancellation creates no safety, legal, financial, or care hazard.
    Use a personal craft, learning exercise, or household organization task as an equivalent.'
  dependencies: []
  safe_alternatives:
  - Use an accessible medium, a smaller personal artifact, a checklist, or a consenting helper. A helper’s
    work and your contribution should remain distinguishable without ranking support needs. Do not choose
    high-consequence obligations for a quit experiment or silently abandon promises, shared work, or essential
