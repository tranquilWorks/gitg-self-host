  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Jules works eight minutes in the first window and six in the second. The saved “Room note” has three
      paragraphs: “Use the east entrance.” “The reading table is beside the window.” “Return shared pencils
      to the marked cup.” Jules reopens the file and verifies all three against the supplied material.


      The room note meets its prior done definition after fourteen minutes. Jules records the decorative
      border as ended because it adds no needed function, and keeps the book list parked until Sunday.
      No dependent person needed notice for these private tasks. Sunday has not arrived, so no book-list
      review or further completion is claimed. The wish for a better introduction remains but does not
      reopen the finished scope.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Define done before the next burst of effort


      Perseverance helps when an important task becomes boring or stalls. Completion also needs a boundary:
      without one, extra polish can continually move the finish line. A reasoned termination is different
      from drift, especially when another person relies on a commitment. Ending responsibly may require
      actual notice, handover or agreement.


      Take ten minutes to review at most three open loops, then use up to two ten-minute work windows
      on one chosen task. Edinburgh''s reflection framework [S07](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      supports moving from observation to an appropriate next action. The closure rules here are original
      practical choices, not a promise to resolve every obligation through a checklist.


      ### Three loops and a small finished note


      Fictional Jules has three optional personal loops: a room-use note, an unfinished decorative border
      for that note and a list of possible hobby books. The room note is useful for Jules''s own reference
      and nobody is waiting for it. Choose it as the only active task. Park the book list until Sunday
      review. The decorative border adds no needed information and can be consciously retired; no dependent
      person requires notice in this fictional case.


      The entire factual material for the room note is: “Use the east entrance. The reading table is beside
      the window. Return shared pencils to the marked cup.” Done means three short paragraphs, one containing
      each instruction, saved in a file named “Room note” and reopened to check all three are present.
      No illustration, elegant wording or public publication is required.


      The first work window copies the first two instructions. A plateau arrives when Jules wants a perfect
      introductory sentence before adding the last instruction. The response is to keep the existing done
      definition, add the missing pencil sentence and perform the reopen check. The missing item is factual
      and supplied; more research is unnecessary. Boredom can remain while finishing something still worthwhile.


      1. List the three loops and choose an active, parked or ended status for each. State why the active
      item still matters. Set done before working and identify any people owed delivery or notice in a
      real task. Do not silently abandon shared duties by changing a private label.

      2. Use the first bounded work window, then the second if needed and feasible. At a plateau, identify
      the exact obstacle and choose a proportionate response: missing information, scope decision, help
      or simply the next known step. Save the scope and closure plan before the [later record](?resource=file-later-packet-md).

      3. Check the artifact against the original done definition. Record actual closure, an honest partial
      state or a reasoned termination with required communication performed. A drafted notice is not sent
      notice, and a plan to reopen a file is not a check. Keep the parked review date visible without
      activating all loops again.


      For support, dictate the three supplied sentences or rehearse only the status decisions. For a harder
      case, someone is relying on a real task: negotiate changes through the agreed channel and preserve
      unresolved obligations until settled. Finishing after the task loses value is not automatically
      admirable. Later review can ask whether parked work should restart or end, but today''s closure
      does not prove lifelong perseverance.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A file contains all three required paragraphs but has not been reopened as agreed. Is every done
      condition verified?


      2. A shared task has lost value for one person. Does privately marking it ended settle what others
      are owed?


      3. The note meets its original definition but could be prettier. Must completion be postponed?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. The content may be present, but the agreed reopen check is still unperformed. Verify it or
      retain the incomplete check honestly.


      2. No. Identify and perform the necessary communication, agreement or handover. A private decision
      does not erase another person''s legitimate reliance.


      3. No. Optional polish need not expand the agreed scope. Close the defined task and treat any later
      improvement as a separate choice.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
