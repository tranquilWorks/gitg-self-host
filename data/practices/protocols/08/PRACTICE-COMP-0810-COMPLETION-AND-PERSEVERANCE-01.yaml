  - stable_id: PRACTICE-COMP-0810-COMPLETION-AND-PERSEVERANCE-01-A3
    sequence: 3
    title: Close the loop by completion or accountable termination
    instructions: 'Inspect the actual work against the original definition of done. If it meets the definition,
      perform the final closure step, such as saving the edited note in its intended place, and mark it
      complete without adding a new perfection requirement. If ending or reducing the commitment is justified,
      record the changed evidence, what will not be delivered, and any dependency or communication needed;
      actually do the relevant closure step. If neither path is complete, leave the loop open with a realistic
      next step rather than awarding completion for a plan. Revisit the parked commitments only after
      this honest disposition.


      Observation checks: Actual work was checked against the original definition of done; Completion
      or termination included a real closure step rather than intention alone; A termination decision
      preserved its reason, undelivered scope, and affected obligations; Unfinished work remained explicitly
      unfinished without a new perfection requirement. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: What actually closed, what stayed open, and what did the plateau teach you about the
      next step or the commitment’s value? Was stopping a reasoned closure or an avoidance story unsupported
      by evidence? Keep one workable limit on simultaneous commitments without treating every unfinished
      aspiration as a debt.


      Examples: Supportive: The user parked two optional loops, edited the selected note across two short
      windows, checked the stated finish, and saved it. Completion was observed without adding publication
      or perfection as a new requirement.


      Mixed: The first work window exposed missing information. The note remains open with one specific
      question and a revisit point; the user made real progress but did not claim it finished.


      Contradictory: The user called the commitment pointless only after encountering boredom, opened
      three new projects, and left a relied-on handoff unaddressed. That is not accountable termination
      or demonstrated perseverance.


      Inconclusive: A polished definition of done and a schedule were written, but no work or closure
      step occurred. Planning is visible; completion, plateau handling, and reasoned termination remain
      unobserved.'
    expected_time: 15-25 minutes
    due_within_days: 10
