  - stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A3
    sequence: 3
    title: Review continuity and restore the appropriate standard
    instructions: 'Compare the observations with the three definitions. Ask whether the minimum preserved
      a useful connection to the activity, was still too burdensome, or became a disguised rule to never
      rest. Also ask whether normal conditions have returned and the ordinary standard remains meaningful.
      Keep, adjust, or discontinue the minimum with a reason. Set the next ordinary opportunity for the
      normal standard when suitable, without retroactively relabeling minimum efforts as full. If capacity
      has changed for longer than expected, revise the broader plan openly rather than treating every
      day as an exception or insisting on an obsolete target.


      Observation checks: Observed work was compared with the original three-state definitions; Continuity
      and burden were both evaluated; A suitable ordinary standard or an openly revised plan was selected;
      Minimum work, full work, and legitimate nonparticipation remained distinguishable. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the minimum preserve something genuinely useful, and what did it not accomplish?
      Does the next opportunity call for normal effort, minimum effort, a new realistic standard, or a
      pause? State the answer without turning continuity into a requirement to ignore needs.


      Examples: Supportive: An ordinary ten-minute language session and a naturally difficult-day two-minute
      phrase trial both occurred. The user labeled them full and minimum, identified the omitted breadth,
      and returned to the ordinary standard at a suitable later opportunity.


      Mixed: The minimum preserved contact with one phrase but was still too much during a care-heavy
      evening. The user kept that attempt as partial and made the pause condition more realistic.


      Contradictory: Every minimum was labeled full and the user refused a needed rest to protect a streak.
      The record concealed reduced work and created pressure, so the scheme was revised rather than celebrated.


      Inconclusive: Only ordinary days occurred. The normal standard was tested, but the difficult-day
      minimum remains a plan rather than demonstrated continuity under difficulty.'
    expected_time: 15-25 minutes
