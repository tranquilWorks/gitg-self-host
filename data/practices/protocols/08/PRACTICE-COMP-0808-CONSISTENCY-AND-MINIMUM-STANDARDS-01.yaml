    State the answer without turning continuity into a requirement to ignore needs. Completion is not
    mastery.
  plain_language_evidence: An ordinary ten-minute language session and a naturally difficult-day two-minute
    phrase trial both occurred. The user labeled them full and minimum, identified the omitted breadth,
    and returned to the ordinary standard at a suitable later opportunity.
