        - the_minimum_retained_a_real_component_of_the_chosen_activity
        - what_the_minimum_omits_relative_to_the_ordinary_standard_was_stated
        - a_legitimate_pause_condition_and_a_return_to_normal_review_point_were_defined
      - measurement_id: c0808_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
