meaning_and_fit:
  purpose: Define and test a small viable minimum that preserves continuity on a genuinely difficult day
    while keeping the ordinary standard explicit. A minimum, a full effort, and a necessary pause must
    remain distinguishable.
  why_recommended: Define and test a small viable minimum that preserves continuity on a genuinely difficult
    day while keeping the ordinary standard explicit. A minimum, a full effort, and a necessary pause
    must remain distinguishable.
  claims:
  - statement: Define and test a small viable minimum that preserves continuity on a genuinely difficult
      day while keeping the ordinary standard explicit. A minimum, a full effort, and a necessary pause
      must remain distinguishable.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Consistency and minimum standards practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Consistency and minimum standards as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use speech, signs, typing, audio, tactile materials, or a different chosen
    learning or creative activity. Adjust both standards to actual access and capacity before the trial.
    A pause is legitimate and carries no worth judgment, but is not a completed practice action. Do not
    use this scheme for prescribed treatment, safety checks, legally required work, or another person’s
    essential care. Avoid streak counters or catch-up punishment.
  opportunity_considerations: 'Use paper or an offline note and one freely chosen recurring activity.
    Default: practice a language from material you already use. Ordinary standard: a ten-minute session
    with three phrases practiced aloud or in an accessible equivalent. Difficult-day minimum: spend two
    minutes retrieving and checking one phrase. Pause condition: a day when even that conflicts with health,
    care, rest, access, or an urgent duty. Use real upcoming opportunities within seven days; do not create
    a difficult day.'
  prerequisites:
  - 'Use paper or an offline note and one freely chosen recurring activity. Default: practice a language
    from material you already use. Ordinary standard: a ten-minute session with three phrases practiced
    aloud or in an accessible equivalent. Difficult-day minimum: spend two minutes retrieving and checking
    one phrase. Pause condition: a day when even that conflicts with health, care, rest, access, or an
    urgent duty. Use real upcoming opportunities within seven days; do not create a difficult day.'
  dependencies: []
  safe_alternatives:
  - Use speech, signs, typing, audio, tactile materials, or a different chosen learning or creative activity.
    Adjust both standards to actual access and capacity before the trial. A pause is legitimate and carries
    no worth judgment, but is not a completed practice action. Do not use this scheme for prescribed treatment,
    safety checks, legally required work, or another person’s essential care. Avoid streak counters or
    catch-up punishment.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Consistency and minimum standards differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Consistency and minimum standards
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use paper or an offline note and one freely chosen recurring activity. Default: practice a language
    from material you already use. Ordinary standard: a ten-minute session with three phrases practiced
    aloud or in an accessible equivalent. Difficult-day minimum: spend two minutes retrieving and checking
    one phrase. Pause condition: a day when even that conflicts with health, care, rest, access, or an
    urgent duty. Use real upcoming opportunities within seven days; do not create a difficult day. Goal:
    Define and test a small viable minimum that preserves continuity on a genuinely difficult day while
    keeping the ordinary standard explicit. A minimum, a full effort, and a necessary pause must remain
    distinguishable. Scope: The task covers a viable difficult-day floor, the retained normal standard,
    and honest continuity without equating the floor to full performance. The minimum must do a real piece
    of the chosen activity rather than only tick a box, but a legitimate pause remains available. One
    or two observed opportunities cannot prove consistency across seasons. Some essential or safety-critical
    duties cannot be reduced this way and are excluded. Time and effort: Five minutes to set up, one ordinary
    opportunity and one naturally difficult-day opportunity when available, and five minutes of review.
    The default trials use ten and two minutes respectively. Absence of a difficult day limits the evidence
    rather than requiring one. Adaptation: Use speech, signs, typing, audio, tactile materials, or a different
    chosen learning or creative activity. Adjust both standards to actual access and capacity before the
    trial. A pause is legitimate and carries no worth judgment, but is not a completed practice action.
    Do not use this scheme for prescribed treatment, safety checks, legally required work, or another
    person’s essential care. Avoid streak counters or catch-up punishment. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use speech, signs, typing, audio, tactile materials, or a different chosen learning
    or creative activity. Adjust both standards to actual access and capacity before the trial. A pause
    is legitimate and carries no worth judgment, but is not a completed practice action. Do not use this
    scheme for prescribed treatment, safety checks, legally required work, or another person’s essential
    care. Avoid streak counters or catch-up punishment.
  expected_burden: Five minutes to set up, one ordinary opportunity and one naturally difficult-day opportunity
    when available, and five minutes of review. The default trials use ten and two minutes respectively.
    Absence of a difficult day limits the evidence rather than requiring one.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Consistency and minimum standards protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Consistency and minimum standards action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use speech,
    signs, typing, audio, tactile materials, or a different chosen learning or creative activity. Adjust
    both standards to actual access and capacity before the trial. A pause is legitimate and carries no
    worth judgment, but is not a completed practice action. Do not use this scheme for prescribed treatment,
    safety checks, legally required work, or another person’s essential care. Avoid streak counters or
    catch-up punishment.
  actions:
  - stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A1
    sequence: 1
    title: Define full, minimum, and pause as different states
    instructions: 'Write three observable descriptions before the next opportunity. For the default: full
      means ten minutes with three phrases practiced; minimum means two minutes retrieving and checking
      one phrase; pause means no practice because a named care, health, rest, or access condition takes
      priority. Check that the minimum retains the purpose of learning rather than merely opening the
      app. Name what the minimum omits, such as breadth and extra repetition. Set a private label for
      each state and state when the ordinary standard should return. Do not use a lower standard to conceal
      a duty to another person or reduce a safety requirement.


      Observation checks: Full, minimum, and pause states each had a concrete observable definition; The
      minimum retained a real component of the chosen activity; What the minimum omits relative to the
      ordinary standard was stated; A legitimate pause condition and a return-to-normal review point were
      defined. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A1
      competency_stable_id: '08.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
