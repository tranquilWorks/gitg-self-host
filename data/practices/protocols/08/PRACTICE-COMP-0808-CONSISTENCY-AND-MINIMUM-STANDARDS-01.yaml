  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Monday, an ordinary day: Blair spends ten minutes retrieving and checking all three mappings. Thursday,
      a naturally busy but safe day: Blair spends two minutes on NERI, initially says “ground,” checks
      the card and corrects it to “water.” Friday, illness requires rest; Blair pauses and does no retrieval.


      The record contains one normal session, one minimum session and one care pause. Twelve minutes of
      learning occurred, with a corrected error in the minimum. The pause is not an attempt and the minimum
      is not a full three-phrase session. No later recall test or ongoing capacity revision has occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Define a minimum that is honest about what it preserves


      A minimum standard can keep a chosen practice connected across difficult days while a fuller standard
      remains meaningful on ordinary days. It needs an explicit content boundary, not just a feeling of
      effort. A care pause is also a legitimate status. Neither the minimum nor a pause should be relabeled
      as the full session.


      Plan an ordinary and a naturally difficult opportunity within seven days. Do not create overload
      to test discipline. The NHS discussion of manageable activity and balance [S06](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/)
      supports a feasible scope. These local session lengths are original teaching choices, not a universal
      rule for recovery or consistency.


      ### Three phrases for a fictional index


      Fictional Blair is learning a small indexing vocabulary. The complete material is: “LUMA means light;
      TERA means ground; NERI means water.” These are invented labels for this exercise, not words attributed
      to a real language. The normal standard is ten minutes studying, retrieving and checking all three
      mappings. The difficult-day minimum is two minutes retrieving and checking one mapping. A care pause
      means no learning attempt because health, urgent care, rest or access needs take priority.


      Retrieval means first trying the meaning from memory, then checking the printed mapping and correcting
      it if necessary. Rereading alone is a different activity. The worked minimum is to cover the answer
      to LUMA, offer a meaning, uncover “light” and correct the response if needed. Do not add speed,
      perfect recall or a required emotional state.


      1. Write the normal, minimum and pause standards before the week. Name an actual capacity condition
      for using each. Normal capacity permits the ordinary session; a busy but safe day may allow the
      minimum; an illness or urgent duty can require pause. Preserve nonnegotiable care, treatment and
      safety obligations rather than making them smaller.

      2. At each natural opportunity choose the fitting standard, perform what is feasible and label the
      actual work. Save the plan before the [week record](?resource=file-later-packet-md). If no difficult
      day occurs, the minimum remains untested. If only one minute occurs, record that partial attempt
      instead of rounding up to two.

      3. Review continuity and the difference in content. One phrase checked is not three. If reduced
      capacity persists, revise the actual ongoing standard openly rather than calling every day an exception
      forever. A new standard is a future agreement, not a rewrite of past sessions.


      For support, use spoken retrieval, large type or a single accessible card. For a harder case, an
      error appears in the minimum: checking and correcting it still performs the intended learning process;
      no extra punishment session is owed. A missed day can be acknowledged and resumed without a streak
      score.


      This exercise concerns optional personal learning. It does not authorize reducing a required safety
      procedure, prescribed treatment or duty owed to another person. A later review can ask whether the
      chosen minimum is still useful and feasible. Two sessions and one pause do not establish long-term
      consistency or mastery of the mappings.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. Two minutes retrieve and correct one phrase. Is that the ten-minute three-phrase session?


      2. Illness requires rest and no retrieval occurs. Is the pause a failed learning attempt?


      3. Every day has reduced capacity for a month. Should the same temporary exception label continue
      indefinitely?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. It meets the defined minimum if retrieval and checking occurred, including correction. Record
      the actual smaller content without upgrading it to normal.


      2. No. A care pause accurately records no attempt. Preserve rest and avoid treating health needs
      as a character deficit.


      3. Review and explicitly revise the ongoing standard to fit real capacity. Keep past records intact
      and do not use minimum labels to conceal that the former normal plan is no longer viable.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
