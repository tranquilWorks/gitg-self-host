        expected: true
  - stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A2
    sequence: 2
    title: Use the applicable standard at real opportunities
    instructions: 'At an ordinary opportunity, attempt the normal standard and record what actually occurred.
      At a naturally difficult-day opportunity, choose the minimum or pause according to the conditions
      you wrote; do not reduce sleep or create overload to test it. Label the result by actual work, not
      the plan: a two-minute phrase trial remains minimum even if it felt hard, and an intended session
      that never began remains unattempted. If only ordinary opportunities occur, test the normal standard
      and mark the difficult-day pathway untested. A tabletop scenario may clarify the plan but is not
      a difficult-day behavioral trial.


      Observation checks: At least one real opportunity was attempted and its applicable standard was
      identified; Actual full, minimum, partial, or unattempted work was labeled without inflation; A
      difficult-day opportunity was natural or explicitly remained untested; The minimum or pause did
      not override rest, care, access, or essential duties. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01
      action_stable_id: PRACTICE-COMP-0808-CONSISTENCY-AND-MINIMUM-STANDARDS-01-A2
      competency_stable_id: '08.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
