        - actual_full_minimum_partial_or_unattempted_work_was_labeled_without_inflation
        - a_difficult_day_opportunity_was_natural_or_explicitly_remained_untested
        - the_minimum_or_pause_did_not_override_rest_care_access_or_essential_duties
