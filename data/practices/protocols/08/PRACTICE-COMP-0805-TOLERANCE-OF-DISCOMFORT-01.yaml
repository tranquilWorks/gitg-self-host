    able to recommend stopping just as honestly as continuing. Completion is not mastery.
  plain_language_evidence: Boredom remained during both two-minute sorting trials, yet a few papers were
    organized without discarding uncertain items. The user retained the small scope and did not infer
    a capacity to push through pain or fatigue.
