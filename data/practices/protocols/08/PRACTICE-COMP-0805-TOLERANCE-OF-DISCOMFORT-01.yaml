meaning_and_fit:
  purpose: Attempt a small worthwhile action while ordinary boredom, uncertainty, frustration, or mild
    embarrassment is present, and distinguish that discomfort from a signal to stop or obtain support.
    Finishing at any cost is not the goal.
  why_recommended: Attempt a small worthwhile action while ordinary boredom, uncertainty, frustration,
    or mild embarrassment is present, and distinguish that discomfort from a signal to stop or obtain
    support. Finishing at any cost is not the goal.
  claims:
  - statement: Attempt a small worthwhile action while ordinary boredom, uncertainty, frustration, or
      mild embarrassment is present, and distinguish that discomfort from a signal to stop or obtain support.
      Finishing at any cost is not the goal.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Tolerance of discomfort practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Tolerance of discomfort as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use large-print or tactile categories, an accessible surface, voice labels,
    or a consenting helper; a digital five-item sort is an alternative. Shorten the task or choose a different
    ordinary activity when needed. Never induce pain, restrict sleep or food, withhold care, expose trauma,
    or persist through symptoms to complete the practice. A safe early stop is information, not failure,
    but an unattempted action is not marked completed.
  opportunity_considerations: 'Choose a safe ordinary task you already intend to do. Default: organize
    five non-sensitive loose papers into keep, discard, and unsure using your existing rules; keep uncertain
    items rather than destroying them. Use a two-minute trial and a place to stop safely. Name the likely
    ordinary discomfort, such as boredom about sorting. Do not choose an activity involving pain, sleep
    loss, strenuous exertion, financial commitment, conflict, or hazardous equipment.'
  prerequisites:
  - 'Choose a safe ordinary task you already intend to do. Default: organize five non-sensitive loose
    papers into keep, discard, and unsure using your existing rules; keep uncertain items rather than
    destroying them. Use a two-minute trial and a place to stop safely. Name the likely ordinary discomfort,
    such as boredom about sorting. Do not choose an activity involving pain, sleep loss, strenuous exertion,
    financial commitment, conflict, or hazardous equipment.'
  dependencies: []
  safe_alternatives:
  - Use large-print or tactile categories, an accessible surface, voice labels, or a consenting helper;
    a digital five-item sort is an alternative. Shorten the task or choose a different ordinary activity
    when needed. Never induce pain, restrict sleep or food, withhold care, expose trauma, or persist through
    symptoms to complete the practice. A safe early stop is information, not failure, but an unattempted
    action is not marked completed.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Tolerance of discomfort differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Tolerance of discomfort as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a safe ordinary task you already intend to do. Default: organize five non-sensitive loose
    papers into keep, discard, and unsure using your existing rules; keep uncertain items rather than
    destroying them. Use a two-minute trial and a place to stop safely. Name the likely ordinary discomfort,
    such as boredom about sorting. Do not choose an activity involving pain, sleep loss, strenuous exertion,
    financial commitment, conflict, or hazardous equipment. Goal: Attempt a small worthwhile action while
    ordinary boredom, uncertainty, frustration, or mild embarrassment is present, and distinguish that
    discomfort from a signal to stop or obtain support. Finishing at any cost is not the goal. Scope:
    The canonical scope includes boredom, uncertainty, frustration, embarrassment, fatigue, craving, and
    temporary pain. This exercise directly uses only naturally occurring low-stakes boredom or frustration,
    with uncertainty handled by an unsure pile. It explicitly teaches that fatigue, pain, and unmet needs
    are not training targets here; those facets require context-appropriate judgment and, where appropriate,
    qualified guidance. It does not establish pain tolerance, clinical exposure outcomes, or resilience
    across untested discomforts. Time and effort: Five minutes of preparation, two two-minute trials on
    separate ordinary opportunities within seven days, and five minutes of review. Shorter equal trials
    are valid. More discomfort, time, or output earns no additional meaning. Adaptation: Use large-print
    or tactile categories, an accessible surface, voice labels, or a consenting helper; a digital five-item
    sort is an alternative. Shorten the task or choose a different ordinary activity when needed. Never
    induce pain, restrict sleep or food, withhold care, expose trauma, or persist through symptoms to
    complete the practice. A safe early stop is information, not failure, but an unattempted action is
    not marked completed. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use large-print or tactile categories, an accessible surface, voice labels, or
    a consenting helper; a digital five-item sort is an alternative. Shorten the task or choose a different
    ordinary activity when needed. Never induce pain, restrict sleep or food, withhold care, expose trauma,
    or persist through symptoms to complete the practice. A safe early stop is information, not failure,
    but an unattempted action is not marked completed.
  expected_burden: Five minutes of preparation, two two-minute trials on separate ordinary opportunities
    within seven days, and five minutes of review. Shorter equal trials are valid. More discomfort, time,
    or output earns no additional meaning.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Tolerance of discomfort protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Tolerance of discomfort action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use large-print
    or tactile categories, an accessible surface, voice labels, or a consenting helper; a digital five-item
    sort is an alternative. Shorten the task or choose a different ordinary activity when needed. Never
    induce pain, restrict sleep or food, withhold care, expose trauma, or persist through symptoms to
    complete the practice. A safe early stop is information, not failure, but an unattempted action is
    not marked completed.
  actions:
  - stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A1
    sequence: 1
    title: Identify the feeling and attempt the bounded action
    instructions: 'Before the first trial, name the task, the worthwhile reason for it, and a concrete
      stopping boundary. For the default: sort at most five papers for two minutes, keep uncertain papers,
      and stop for pain, unsafe fatigue, an urgent duty, or escalating distress. If ordinary boredom or
      frustration is present, begin and notice whether it can coexist with the next small movement. Use
      an unsure pile instead of forcing certainty. When the time or item boundary arrives, stop and record
      what happened, including no start or an early stop. Do not claim discomfort practice if no relevant
      discomfort was actually present.


      Observation checks: A worthwhile action and a concrete time or item boundary were chosen; The actual
      ordinary discomfort or its absence was acknowledged; A real small action was attempted without forcing
      certainty or unsafe continuation; Stop conditions and any early stop were preserved in the record.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01
      action_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A1
      competency_stable_id: '08.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
