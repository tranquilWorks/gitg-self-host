  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [NIMH — Caring for Your Mental Health](https://www.nimh.nih.gov/health/topics/caring-for-your-mental-health)

      - [988 Suicide & Crisis Lifeline — What to Expect](https://988lifeline.org/get-help/what-to-expect/)

      - [NHS Every Mind Matters — Staying on top of things](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/staying-on-top-of-things/)

      - [NCCIH — Meditation and Mindfulness: Effectiveness and Safety](https://www.nccih.nih.gov/health/meditation-and-mindfulness-effectiveness-and-safety)

      - [NHS Every Mind Matters — Reframing unhelpful thoughts](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/reframing-unhelpful-thoughts/)

      - [NHS Every Mind Matters — Tackling your to-do list](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/)

      - [University of Edinburgh — What? So what? Now what?](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Mika completes the first two-minute pass with all five supplied assignments and reports ordinary
      boredom. After a normal break, Mika starts the second pass but notices new wrist pain after forty
      seconds and stops. No cause for the pain is supplied and no further attempt occurs.


      The completed first pass and forty-second second attempt are distinct. Total time was 160 seconds,
      not four completed minutes. The undated note remains UNSURE; no private paper was discarded. Mika
      keeps the stop and seeks appropriate advice if the concern persists or is significant. No improved
      pain tolerance or completed second window is claimed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Distinguish tolerable frustration from a reason to stop


      Some worthwhile actions are briefly boring, uncertain or awkward. Continuing a small chosen task
      in that discomfort can be useful when the task remains safe and meaningful. Pain, illness, dangerous
      fatigue and violated boundaries are different signals. They are not training targets here. Stopping
      for a genuine need is compatible with judgment.


      Try two two-minute passes at an ordinary paper-sorting task, with an ordinary break between them.
      Edinburgh''s reflection sequence [S07](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      supports describing the event, examining its meaning and choosing a next step. The sort is original;
      it is not a pain-tolerance, exposure or endurance protocol.


      ### Five papers and a complete rule


      Fictional Mika has five paper descriptions, no private documents: a current appointment reminder,
      an obsolete duplicate of that reminder, an undated note, a receipt needed for a pending return and
      an old blank advertising insert. Sort into KEEP, DISCARD or UNSURE using these exact rules: keep
      current commitments and records needed for an unresolved matter; discard known obsolete duplicates
      and unwanted blank advertising; put missing-date or unclear-purpose items in UNSURE. Sorting a description
      does not authorize destroying someone else''s property.


      The worked destinations are reminder—KEEP; duplicate—DISCARD; undated note—UNSURE; return receipt—KEEP;
      advertising—DISCARD. Uncertainty is allowed to remain in its own category. You do not need to discover
      the undated note''s history to finish the bounded task.


      Mika anticipates mild boredom and the urge to switch tasks, not pain or severe distress. The purpose
      is a usable three-pile arrangement. Success is not maximum suffering or speed. A two-minute window
      is a ceiling, and completing the simple sort early does not require inventing extra work just to
      tolerate more.


      1. State the purpose, expected ordinary discomfort and stop conditions before beginning. Use the
      five descriptions rather than sensitive real records. Start the first two-minute pass, notice a
      mild urge to switch if one naturally occurs, and choose whether to continue within the safe boundary.
      Do not create discomfort on purpose.

      2. After an ordinary break, try the second pass only if suitable. It can check the same assignments
      and uncertainty rule. Keep essential needs, posture changes and access aids available. Save the
      first plan before the [two-pass record](?resource=file-later-packet-md).

      3. Review actual duration, decisions, discomfort if known and any stop. Two completed windows differ
      from one completed and one stopped. Correct classification does not prove increased tolerance, and
      a shorter attempt with pain does not mean insufficient discipline.


      For support, read the categories aloud or use large labels and a helper who does not make the decisions.
      For a harder case, the undated note''s ownership is unknown: retain it safely without inventing
      certainty. The broader competency includes uncertainty, embarrassment, craving and fatigue, but
      this source deliberately practices only benign boredom/frustration. Temporary pain is not prescribed
      and clinical concerns require appropriate care. A later natural repetition can inspect usefulness,
      not authorize escalating duration or ignoring the body.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. An undated note cannot be classified confidently. Must the person force a KEEP or DISCARD decision?


      2. A two-minute attempt is followed by a forty-second stopped attempt. How much activity occurred?


      3. New pain appears during the second attempt. Is pushing through the intended lesson?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      The agreed attention experiment is 90 seconds. You start at 11:02:20 and stop at 11:03:15 because
      the chosen anchor becomes uncomfortable. Calculate the attempt and report its status without treating
      early stopping as a moral failure.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. UNSURE is a legitimate destination under the supplied rule. Preserve uncertain ownership
      or purpose and avoid unauthorized disposal.


      2. One hundred sixty seconds: one complete two-minute window and one partial forty-second attempt.
      Do not record two completed windows.


      3. No. Stop and attend to the concern appropriately. This task practices ordinary boredom or frustration;
      pain and unsafe fatigue are not prescribed training stimuli.


      ### Changed-case answer


      The attempt lasted 55 seconds, 35 short of the plan. Record early stop and the access problem. Do
      not report 90 seconds completed or claim attention improved from duration alone. Choose an acceptable
      anchor or shorter agreed attempt only if willing.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
