  - stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A3
    sequence: 3
    title: Choose a proportionate lesson from the two trials
    instructions: 'Compare what you did while the feeling was present with what happened when the context
      changed. A useful result might be: boredom did not prevent sorting two papers, but uncertainty required
      an unsure pile. Another might be: the second opportunity required rest, so no comparable trial occurred.
      Decide whether to repeat the same modest task, improve its supports, choose a different ordinary
      activity, or stop. Do not conclude that all discomfort is harmless or that a supported or incomplete
      action reflects less worth. Retain one clear example of an appropriate stopping decision.


      Observation checks: The review compared actual trials rather than endurance claims; A limited lesson
      about action with ordinary discomfort was stated; At least one legitimate stopping or support condition
      remained explicit; No claim of pain, fatigue, clinical exposure, or broad distress tolerance was
      made. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.


      Final review: What ordinary feeling coexisted with a useful action, and what sign correctly changed
      the plan? Keep the task boundary and a valid support for the next opportunity. The review must be
      able to recommend stopping just as honestly as continuing.


      Examples: Supportive: Boredom remained during both two-minute sorting trials, yet a few papers were
      organized without discarding uncertain items. The user retained the small scope and did not infer
      a capacity to push through pain or fatigue.


      Mixed: Frustration accompanied useful action in the first trial. The second opportunity was interrupted
      by a legitimate duty and could not be compared. One bounded observation is retained rather than
      counted as repeated endurance.


      Contradictory: The user ignored a stopping condition and prolonged the task to prove toughness.
      That result contradicts the exercise’s judgment boundary even if more papers were sorted.


      Inconclusive: The task was attempted without any noticed discomfort. This establishes a task attempt,
      not observed action while discomfort was present, and no stronger feeling is manufactured to complete
      the record.'
