  - stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A2
    sequence: 2
    title: Repeat while distinguishing discomfort from a changed need
    instructions: 'At a second naturally suitable opportunity, attempt the same-sized action. Before continuing
      through a feeling, check whether the situation is still the agreed low-stakes one. Ordinary boredom
      may be compatible with another small step; pain, a required rest, an urgent responsibility, or growing
      distress changes the decision. Continue only within the chosen boundary, or stop and name why. Use
      ordinary access supports without treating them as avoidance. Record whether the action occurred
      while the named discomfort remained and whether a needed stop was honored. Do not increase duration
      or difficulty just because the first trial was easy.


      Observation checks: A second comparable opportunity was actually attempted or remained explicitly
      deferred; Ordinary task discomfort was distinguished from pain, unsafe fatigue, or an urgent need;
      Continuing or stopping stayed within the preselected boundary; Support use and the actual relation
      between discomfort and action were recorded. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01
      action_stable_id: PRACTICE-COMP-0805-TOLERANCE-OF-DISCOMFORT-01-A2
