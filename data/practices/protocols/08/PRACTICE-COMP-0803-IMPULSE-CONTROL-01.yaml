        - an_endorsed_reason_or_legitimate_changed_need_was_named
        - whether_the_pause_occurred_before_or_after_action_was_recorded_honestly
        - the_actual_chosen_or_automatic_behavior_was_recorded_without_a_character_verdict
      - measurement_id: c0803_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
