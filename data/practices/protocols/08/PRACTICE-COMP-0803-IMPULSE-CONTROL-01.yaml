meaning_and_fit:
  purpose: Recognize a naturally occurring urge, create a brief safe decision interval, and choose an
    action for a reason you endorse. The exercise distinguishes a deliberate yes, no, delay, or alternative
    from automatic action; resisting every impulse is not the goal.
  why_recommended: Recognize a naturally occurring urge, create a brief safe decision interval, and choose
    an action for a reason you endorse. The exercise distinguishes a deliberate yes, no, delay, or alternative
    from automatic action; resisting every impulse is not the goal.
  claims:
  - statement: Recognize a naturally occurring urge, create a brief safe decision interval, and choose
      an action for a reason you endorse. The exercise distinguishes a deliberate yes, no, delay, or alternative
      from automatic action; resisting every impulse is not the goal.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Impulse control practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Impulse control as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder.
    A pause can be shorter than thirty seconds; the number is a practice default, not a treatment dose.
    Do not delay food, water, medication, sleep, toileting, safety responses, or withdrawal care. Never
    test consent by provoking an intimate situation. Use a neutral context or defer when urges involve
    dangerous behavior or distress beyond an ordinary educational practice.
  opportunity_considerations: 'Use a private three-row note and one ordinary low-stakes context. Default:
    the urge to switch from a chosen task to an optional feed. Write the current intention in a short
    phrase, such as finish this paragraph before deciding on a break, and a permitted alternative, such
    as take a planned break now. No purchase, food restriction, intimate encounter, argument, or withdrawal
    from a substance is required. Keep urgent needs and essential messages outside the delay rule.'
  prerequisites:
  - 'Use a private three-row note and one ordinary low-stakes context. Default: the urge to switch from
    a chosen task to an optional feed. Write the current intention in a short phrase, such as finish this
    paragraph before deciding on a break, and a permitted alternative, such as take a planned break now.
    No purchase, food restriction, intimate encounter, argument, or withdrawal from a substance is required.
    Keep urgent needs and essential messages outside the delay rule.'
  dependencies: []
  safe_alternatives:
  - Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder. A pause can be shorter
    than thirty seconds; the number is a practice default, not a treatment dose. Do not delay food, water,
    medication, sleep, toileting, safety responses, or withdrawal care. Never test consent by provoking
    an intimate situation. Use a neutral context or defer when urges involve dangerous behavior or distress
    beyond an ordinary educational practice.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Impulse control differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Impulse control as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private three-row note and one ordinary low-stakes context. Default: the urge to switch
    from a chosen task to an optional feed. Write the current intention in a short phrase, such as finish
    this paragraph before deciding on a break, and a permitted alternative, such as take a planned break
    now. No purchase, food restriction, intimate encounter, argument, or withdrawal from a substance is
    required. Keep urgent needs and essential messages outside the delay rule. Goal: Recognize a naturally
    occurring urge, create a brief safe decision interval, and choose an action for a reason you endorse.
    The exercise distinguishes a deliberate yes, no, delay, or alternative from automatic action; resisting
    every impulse is not the goal. Scope: Speech, spending, eating, sex, anger, quitting, and novelty
    are transfer contexts for deliberate choice, not mandatory exposures. This small exercise directly
    rehearses the choice interval using optional novelty or harmless speech; it does not establish safe
    financial, sexual, medical, or conflict decisions. Bodily needs, consent, a required safety response,
    and a reasoned decision to stop are not impulses that must be defeated. Time and effort: Five minutes
    of setup, two naturally occurring opportunities during the next seven days, a pause of up to thirty
    seconds only when safe, and five minutes of review. Do not provoke stronger urges to obtain evidence.
    Adaptation: Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder. A pause
    can be shorter than thirty seconds; the number is a practice default, not a treatment dose. Do not
    delay food, water, medication, sleep, toileting, safety responses, or withdrawal care. Never test
    consent by provoking an intimate situation. Use a neutral context or defer when urges involve dangerous
    behavior or distress beyond an ordinary educational practice. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder. A
    pause can be shorter than thirty seconds; the number is a practice default, not a treatment dose.
    Do not delay food, water, medication, sleep, toileting, safety responses, or withdrawal care. Never
    test consent by provoking an intimate situation. Use a neutral context or defer when urges involve
    dangerous behavior or distress beyond an ordinary educational practice.
  expected_burden: Five minutes of setup, two naturally occurring opportunities during the next seven
    days, a pause of up to thirty seconds only when safe, and five minutes of review. Do not provoke stronger
    urges to obtain evidence.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Impulse control protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Impulse control action, a polished artifact, agreement, confidence, speed, independence,
    or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a visual
    cue, a short spoken phrase, or an agreed nonjudgmental reminder. A pause can be shorter than thirty
    seconds; the number is a practice default, not a treatment dose. Do not delay food, water, medication,
    sleep, toileting, safety responses, or withdrawal care. Never test consent by provoking an intimate
    situation. Use a neutral context or defer when urges involve dangerous behavior or distress beyond
    an ordinary educational practice.
  actions:
  - stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A1
    sequence: 1
    title: Separate the urge from the decision it suggests
    instructions: 'At the first natural urge to open the optional feed, record the cue in a few neutral
      words, the action the urge suggested, and your endorsed reason for the current task or for changing
      it. Try saying: I notice an urge to switch; I have not yet decided. Take a short pause only if it
      does not delay a real need. Then make a deliberate choice: return to the paragraph, take a genuine
      break, or choose another appropriate action. Record what you actually did, including an automatic
      switch noticed afterward. Awareness after the fact is useful information, but do not relabel it
      as a pause that occurred before action.


      Observation checks: A naturally occurring urge and its suggested action were distinguished; An endorsed
      reason or legitimate changed need was named; Whether the pause occurred before or after action was
      recorded honestly; The actual chosen or automatic behavior was recorded without a character verdict.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01
      action_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A1
      competency_stable_id: '08.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0803_a1_primary
      transfer_disposition: context_bound
      measurements:
