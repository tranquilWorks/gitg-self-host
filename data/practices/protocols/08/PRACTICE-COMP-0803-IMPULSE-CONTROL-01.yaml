  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Impulse control; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder. A pause can be shorter
      than thirty seconds; the number is a practice default, not a treatment dose. Do not delay food,
      water, medication, sleep, toileting, safety responses, or withdrawal care. Never test consent by
      provoking an intimate situation. Use a neutral context or defer when urges involve dangerous behavior
      or distress beyond an ordinary educational practice.
    cultural_context:
    - Adapt the expression of Impulse control to direct or indirect communication, collective or individual
      decision structures, local norms, faith or secular commitments, and role obligations while preserving
      consent and dignity.
    resource_variants:
    - Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder. A pause can be shorter
      than thirty seconds; the number is a practice default, not a treatment dose. Do not delay food,
      water, medication, sleep, toileting, safety responses, or withdrawal care. Never test consent by
      provoking an intimate situation. Use a neutral context or defer when urges involve dangerous behavior
      or distress beyond an ordinary educational practice.
  pause_conditions:
  - Pause Impulse control when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Impulse control practice for harm, coercion, retaliation risk, emergency conditions, unsafe
    exposure, worsening symptoms, protected information, legal or policy conflict, or pressure to exceed
    the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Impulse control situation exceeds a voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
