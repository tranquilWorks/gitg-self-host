  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Give a choice enough room to become a choice


      An impulse is an urge toward an action; it is not the action itself or a command you must obey.
      A short interval can make an endorsed reason available. Choosing yes, no, later or a needed break
      can all be deliberate. The target is a reason you can stand behind, not suppression of every spontaneous
      response.


      Over seven days, use two naturally occurring, low-stakes opportunities. Allow up to thirty seconds
      only when a delay is safe. The NHS guidance on checking interpretations [S05](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/reframing-unhelpful-thoughts/)
      supports distinguishing a thought from a fact; this choice interval is original and carries no treatment
      claim. Do not manufacture urges or delay food, sleep, medication, care or an urgent response. Sexual,
      financial, addictive or dangerous impulses need appropriate safeguards and support beyond this harmless
      rehearsal.


      ### A novelty urge with a defined stopping point


      Fictional Ellis is reading a three-line event notice when a novelty tab attracts attention. The
      complete notice reads: “The drawing circle meets Saturday at 14:00. Bring ordinary paper if available;
      spare paper is provided. Register by Friday using the usual group channel.” Ellis wants to tell
      a willing friend the time and materials before taking a planned break. No actual registration or
      personal details are needed.


      The first cue is reaching toward a tab titled “Five surprising desk objects.” The urged action is
      opening it immediately. The endorsed reason for a short delay is to finish the two requested facts
      so the friend has a usable answer. Ellis can say privately, “I want to open it; first I will send
      the time and paper information.” A worked answer is “Saturday at 14:00; bring paper if you have
      it, and spare paper is available.” Choosing the tab after the answer would not automatically be
      a failure.


      1. Write a compact cue–urge–reason–choice record. Rehearse the complete notice first. In a natural
      attempt, notice the urge, take a safe interval of up to thirty seconds, identify the reason and
      choose. Record what actually happened rather than how strong your character seemed.

      2. At the second suitable opportunity, use the same distinction. If the automatic action happened
      before you noticed it, record late noticing. You can still redirect next, but cannot claim the earlier
      action was prevented. Save your initial plan before the [two-opportunity record](?resource=file-later-packet-md).

      3. Review both sequences: did a choice interval occur before action, what reason mattered, and what
      response followed? Compare the actual response with the purpose. An absent urge means no opportunity,
      not a successful resistance count.


      For support, use fiction or a silent cue word; no timer or bodily monitoring is required. For a
      harder case, an urgent message arrives during the interval: answer the urgent need without finishing
      the pause. Other domains such as speech, spending, eating, sex, anger and quitting are part of the
      competency''s breadth, but this lesson does not license provoking or self-treating those risks.
      A later natural transfer should preserve consent and essential needs. Two small cases cannot establish
      general impulse control.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A person notices only after opening the tab, then closes it. Was the opening prevented?


      2. The safe interval ends with choosing a planned rest. Is every yes to an urge a failure?


      3. An urgent need appears during the thirty-second interval. Must the interval be completed?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      At 16:00 you see a reminder to practice drawing for ten minutes, but a freely accepted childcare
      pickup leaves at 16:05. The sketch materials are ready. Choose a feasible response and a new cue;
      explain why obeying the reminder immediately is not necessarily agency.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Record the automatic opening and subsequent redirection separately. Useful later action cannot
      rewrite the earlier sequence.


      2. No. Assess whether the choice respects the person''s endorsed reason and genuine needs. Deliberate
      rest can fit the purpose; restraint is not the only legitimate outcome.


      3. No. Address the urgent need. Thirty seconds is an upper bound for this safe rehearsal, not a
      duty to delay care or safety.


      ### Changed-case answer


      The real obligation constrains this opportunity. Close or safely leave the materials and keep the
      pickup; choose a genuinely available later cue, such as after the agreed handoff, without inventing
      its time. Agency includes revising a plan for reasons, not mechanically obeying every cue. A rescheduled
      intention is not completed drawing.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
