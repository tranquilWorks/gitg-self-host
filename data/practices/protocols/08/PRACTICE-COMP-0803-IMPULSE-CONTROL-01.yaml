        criteria:
        - a_second_naturally_occurring_opportunity_was_attempted
        - at_least_two_appropriate_options_were_considered_before_the_recorded_choice_when_possible
        - the_selected_action_was_actually_carried_out_or_the_automatic_action_was_acknowledged
        - urgent_needs_consent_supports_and_safety_were_not_overridden_by_the_delay_rule
      - measurement_id: c0803_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
