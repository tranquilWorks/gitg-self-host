        expected: true
  - stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A2
    sequence: 2
    title: Try the choice interval at another real opportunity
    instructions: 'At a second natural opportunity, use the same brief phrase and pause for up to thirty
      seconds if safe. Compare at least two options against the reason you endorsed: finish the paragraph
      and then rest, or stop now because a real need has changed the plan. Choose one and carry it out;
      merely rehearsing options is not a completed behavioral trial. If you still switch automatically,
      record that result and the cue rather than extending the pause as punishment. Preserve any supports
      already helping you. An optional spoken-message variant uses an unsent ordinary sentence and a deliberate
      decision to say, revise, or omit it, without manufacturing an argument.


      Observation checks: A second naturally occurring opportunity was attempted; At least two appropriate
      options were considered before the recorded choice when possible; The selected action was actually
      carried out or the automatic action was acknowledged; Urgent needs, consent, supports, and safety
      were not overridden by the delay rule. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01
      action_stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A2
      competency_stable_id: '08.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c0803_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c0803_a2_primary
        kind: artifact
        role: primary
