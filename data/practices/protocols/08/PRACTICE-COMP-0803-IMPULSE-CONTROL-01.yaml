        expected: true
  - stable_id: PRACTICE-COMP-0803-IMPULSE-CONTROL-01-A3
    sequence: 3
    title: Review freedom of choice rather than a resistance streak
    instructions: 'Compare the two opportunities by cue, timing of awareness, reason, and actual behavior.
      Identify whether the brief interval helped you choose, made no difference, or became rigid or distracting.
      Name a future cue for one repeat and an exception: for example, optional scrolling can wait, but
      an essential message cannot. Include a deliberate choice to rest or quit an unsuitable task as a
      legitimate decision when its reason is stated. Do not award yourself a success streak for suppressing
      needs or import the result into high-consequence situations. A missing second opportunity leaves
      the repeated-choice claim untested.


      Observation checks: Both opportunities were compared with their actual sequence intact; The review
      distinguished deliberate choice from mere suppression; One next cue and one legitimate exception
      were specified; Unobserved opportunities and untested transfer contexts were not claimed as success.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: At which point did awareness arrive, and did the interval enable a choice you could
      explain? Keep one useful cue without imposing it everywhere. Review after two further natural opportunities
      and preserve examples where the appropriate choice was a break, a response, or stopping rather than
      persistence.


      Examples: Supportive: The user noticed the urge to open a feed before acting on both occasions.
      One time they finished a paragraph; the other they deliberately took a needed break. Both choices
      had an endorsed reason.


      Mixed: The first switch was automatic and noticed afterward. During the second opportunity the pause
      preceded a deliberate choice. That supports one observed use of the interval, not two successful
      pauses or general impulse control.


      Contradictory: The user delayed an essential response to preserve a no-switching rule. The rule
      reduced appropriate choice, so they removed that application rather than calling it discipline.


      Inconclusive: No natural urge appeared during either planned window. Writing possible responses
      rehearsed the method but did not demonstrate an actual impulse-choice interval.'
