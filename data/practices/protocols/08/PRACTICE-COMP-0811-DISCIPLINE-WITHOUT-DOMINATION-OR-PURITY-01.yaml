meaning_and_fit:
  purpose: Evaluate one self-chosen rule by the health, duty, freedom, or meaning it is supposed to serve,
    then test a proportionate revision without shame or superiority. Keeping a useful structure and relaxing
    an unhelpful one are both legitimate outcomes.
  why_recommended: Evaluate one self-chosen rule by the health, duty, freedom, or meaning it is supposed
    to serve, then test a proportionate revision without shame or superiority. Keeping a useful structure
    and relaxing an unhelpful one are both legitimate outcomes.
  claims:
  - statement: Evaluate one self-chosen rule by the health, duty, freedom, or meaning it is supposed to
      serve, then test a proportionate revision without shame or superiority. Keeping a useful structure
      and relaxing an unhelpful one are both legitimate outcomes.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Discipline without domination or purity practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Discipline without domination or purity as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Choose an accessible personal rule, such as a preferred order for harmless
    leisure materials, and use voice notes or practical assistance. Retain helpful structure and sensory
    supports. Do not alter treatment, prescribed routines, safety requirements, care duties, or commitments
    to others under this exercise. No exposure to feared consequences or deliberate distress is required.
    Stop when a low-stakes trial becomes distressing, coercive, or hard to discontinue; this is not treatment
    for compulsive behavior.
  opportunity_considerations: 'Use a private note and one optional self-imposed rule. Default: a rule
    that every personal note must be perfectly formatted before it can be saved. Write its intended purpose,
    such as making the note usable, and choose one harmless personal note for a reversible trial. The
    proposed revision is save a readable rough note now and format only if a later use requires it. Do
    not choose medication, treatment, safety checks, legal duties, essential care, or a rule imposed under
    unsafe power dynamics.'
  prerequisites:
  - 'Use a private note and one optional self-imposed rule. Default: a rule that every personal note must
    be perfectly formatted before it can be saved. Write its intended purpose, such as making the note
    usable, and choose one harmless personal note for a reversible trial. The proposed revision is save
    a readable rough note now and format only if a later use requires it. Do not choose medication, treatment,
    safety checks, legal duties, essential care, or a rule imposed under unsafe power dynamics.'
