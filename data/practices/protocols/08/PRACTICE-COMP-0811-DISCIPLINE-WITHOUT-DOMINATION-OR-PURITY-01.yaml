  - stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A2
    sequence: 2
    title: Try a reversible revision while keeping the purpose intact
    instructions: 'Use the selected ordinary opportunity to try the revised rule. For the default, save
      one readable rough personal note without finishing decorative formatting, then check that you can
      find and understand it. Notice discomfort about relaxing the rule without making comfort a success
      requirement. Keep the trial within the chosen scope and do not use it to pressure someone else into
      changing their standards. Record the actual action, its usefulness, any cost, and whether you could
      freely return to or further revise the rule. If the original rule remains justified, test its bounded
      intended use rather than breaking it merely to prove flexibility.


      Observation checks: A real low-stakes trial of the revised or justified bounded rule occurred; The
      rule’s intended purpose was checked using an observable result; Discomfort, cost, and freedom to
      revise were recorded without a required feeling; The trial did not override obligations or impose
      a standard on another person. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01
