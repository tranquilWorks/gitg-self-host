      - [University of Edinburgh — What? So what? Now what?](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Morgan saves the rough reminder immediately, preserving the question rather than inventing an opening
      time. The next day Morgan cannot locate it among several untitled notes. The information was saved,
      but the planned retrieval did not succeed; no library inquiry has occurred.


      Morgan decides to retain prompt saving and add a minimal descriptive title, “Library question,”
      before saving the next suitable note. That is a proposed revision, not a completed second test.
      Two days later no new note need has arisen, so the revision remains untested. The result supports
      reconsidering the rule''s fit, not abandoning all structure or claiming treatment of compulsive
      behavior.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Keep the purpose of a rule available for inspection


      Structure is useful when it supports health, duties or meaningful activity. A rule can become costly
      when obeying it displaces its purpose, punishes ordinary limits or becomes a basis for superiority.
      Revising such a rule can require judgment rather than more force. This is an audit of an optional
      personal rule, not permission to disregard consent, safety, law or a duty to someone else.


      Allow ten minutes for a purpose-and-cost review, one reversible test and a later check within seven
      days. Edinburgh''s reflection questions [S07](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      support inspecting an experience before deciding what follows. This exercise does not diagnose compulsions
      or provide exposure treatment. If changing a rule brings severe distress or concerns about compulsive
      behavior, stop and seek suitable qualified support.


      ### A note that cannot be saved until it is perfect


      Fictional Morgan has a self-imposed rule: every personal reminder must be perfectly worded before
      saving. The intended purpose is a useful reminder. The observed cost is that two recent drafts were
      abandoned unsaved while Morgan tried to polish them. These are optional private notes; no safety
      procedure, professional record or dependent person''s agreement is involved.


      The complete current reminder is “Ask about the library''s Saturday opening time.” The wording need
      not answer the question or promise the library is open. The reversible alternative is to save a
      rough, adequate note immediately and check whether it can later be found and understood. Morgan
      can restore a useful element of structure if retrieval fails; the choices are not unlimited perfection
      or no structure at all.


      Use four headings: rule and intended good; actual costs; adjustable part and protected duties; test
      and review point. A worked entry is: intended good—remember one question; cost—two lost drafts;
      adjustable part—polish before saving; protected boundary—accurate content without pretending the
      opening time is known; test—save rough now and retrieve tomorrow.


      1. Identify one optional rule you actually control, or use Morgan''s case. Ask whether the rule
      serves health, duty or meaning under current conditions. Distinguish evidence of cost from a global
      claim that all discipline is harmful. Keep important constraints and other people''s freedom visible.

      2. Make one reversible relaxation: save the supplied reminder before polishing. Do not combine it
      with abandoning all names, folders or checks by design. Save the initial purpose map before the
      [retrieval record](?resource=file-later-packet-md). If distress rises substantially, stop; proving
      freedom does not require forcing the test.

      3. At the later check, inspect both benefit and cost. A note saved but not retrievable is a mixed
      result. Retain what helped and restore the smallest useful structure, then mark the revision untested
      until another real opportunity. The goal is fit, not proving that every limit is domination.


      For support, use the complete fictional note without changing a real rule. For a harder case, a
      rule protects someone else''s access or a shared duty: do not relax it unilaterally; seek an appropriate
      agreed revision. No public confession, self-punishment or comparison with less disciplined people
      is required.


      Later transfer should ask whether the revised structure supports meaningful action while leaving
      rest and ordinary imperfection possible. Keeping a useful rule, retiring an unnecessary one or pausing
      the experiment are all possible outcomes. One small note test cannot establish recovery from perfectionism
      or a wholly undominated life.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A rough note is saved but cannot be found the next day. Is the relaxed rule proven successful?


      2. A shared safety rule feels restrictive. Can it be removed unilaterally as an exercise in freedom?


      3. A minimal naming revision is planned but no new note is needed. Has the revision been tested?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Preserve the benefit of saving and the retrieval cost. Consider a small useful structure
      and inspect it later without returning automatically to unlimited polish.


      2. No. This exercise changes only optional personal rules within one''s authority. Preserve safety
      and shared duties and use an appropriate agreed revision process.


      3. No. A plan and an absent opportunity establish no performed test. Keep the revised rule provisional
      without inventing an action or outcome.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
