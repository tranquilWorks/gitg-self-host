  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Discipline without domination
    or purity as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private note and one optional self-imposed rule. Default: a rule that every personal note
    must be perfectly formatted before it can be saved. Write its intended purpose, such as making the
    note usable, and choose one harmless personal note for a reversible trial. The proposed revision is
    save a readable rough note now and format only if a later use requires it. Do not choose medication,
    treatment, safety checks, legal duties, essential care, or a rule imposed under unsafe power dynamics.
    Goal: Evaluate one self-chosen rule by the health, duty, freedom, or meaning it is supposed to serve,
    then test a proportionate revision without shame or superiority. Keeping a useful structure and relaxing
    an unhelpful one are both legitimate outcomes. Scope: The target is discipline as a tool for freedom
    rather than self-hatred, compulsive control, domination, or moral superiority. This trial directly
    examines one optional rule and its effect on a small task; it does not diagnose compulsions or establish
    a person’s general character. Revising a private rule is not permission to ignore obligations to others.
    Clinical, religious, legal, safety-critical, or externally imposed rules may require appropriate guidance
    and are not altered by this exercise. Time and effort: Five minutes of preparation, one ordinary ten-minute-or-shorter
    trial, a five-minute review, and one later ordinary check within seven days when possible. No deliberate
    rule-breaking with meaningful risk is required. Adaptation: Choose an accessible personal rule, such
    as a preferred order for harmless leisure materials, and use voice notes or practical assistance.
    Retain helpful structure and sensory supports. Do not alter treatment, prescribed routines, safety
    requirements, care duties, or commitments to others under this exercise. No exposure to feared consequences
    or deliberate distress is required. Stop when a low-stakes trial becomes distressing, coercive, or
    hard to discontinue; this is not treatment for compulsive behavior. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Choose an accessible personal rule, such as a preferred order for harmless leisure
    materials, and use voice notes or practical assistance. Retain helpful structure and sensory supports.
    Do not alter treatment, prescribed routines, safety requirements, care duties, or commitments to others
    under this exercise. No exposure to feared consequences or deliberate distress is required. Stop when
    a low-stakes trial becomes distressing, coercive, or hard to discontinue; this is not treatment for
    compulsive behavior.
  expected_burden: Five minutes of preparation, one ordinary ten-minute-or-shorter trial, a five-minute
    review, and one later ordinary check within seven days when possible. No deliberate rule-breaking
    with meaningful risk is required.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Discipline without domination or purity protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Discipline without domination or purity action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Choose an accessible
    personal rule, such as a preferred order for harmless leisure materials, and use voice notes or practical
    assistance. Retain helpful structure and sensory supports. Do not alter treatment, prescribed routines,
    safety requirements, care duties, or commitments to others under this exercise. No exposure to feared
    consequences or deliberate distress is required. Stop when a low-stakes trial becomes distressing,
    coercive, or hard to discontinue; this is not treatment for compulsive behavior.
  actions:
  - stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01-A1
    sequence: 1
    title: Connect the rule to a purpose rather than an identity
    instructions: 'Write the exact optional rule, its intended benefit, and what it costs in an ordinary
      recent situation. For the default: formatting every note may help retrieval, but the unfinished
      formatting prevented saving a useful thought. Ask what observation would show that the rule serves
      its purpose and what would show that it has become excessive. Separate those observations from identity
      claims such as a disciplined person never relaxes a rule. Name whose interests are affected and
      which obligations cannot be waived. Choose a modest revision that preserves the purpose, or retain
      the rule if its benefit and proportionate cost are already clear.


      Observation checks: The optional rule and its intended purpose were stated separately; A recent
      concrete benefit or cost was identified; Purpose-relevant evidence was distinguished from shame
      or superiority claims; Affected interests and non-waivable obligations were respected. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0811-DISCIPLINE-WITHOUT-DOMINATION-OR-PURITY-01
