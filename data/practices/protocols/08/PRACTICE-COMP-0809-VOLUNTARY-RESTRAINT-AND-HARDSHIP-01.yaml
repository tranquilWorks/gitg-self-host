  - stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01-A2
    sequence: 2
    title: Try the bounded restraint and notice the choices it creates
    instructions: 'Carry out the familiar activity under the selected restraint for up to the chosen interval.
      Notice any urge to restore the comfort, any appreciation for what it normally provides, and whether
      the activity remains safe and workable. There is no requirement to feel calm, grateful, stronger,
      or spiritually improved. Restore the comfort early if it becomes needed or the trial turns unhelpful.
      Record the actual interval and whether the exit remained genuinely available. Do not compensate
      by making the next trial harder, recruit another person without consent, or use your choice to criticize
      how anyone else rests.


      Observation checks: A real bounded optional-comfort trial was attempted; Urges and any appreciation
      were noted without requiring a preferred feeling; The exit and essential supports remained available
      throughout; Any early restoration or adverse response was recorded rather than hidden. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01
