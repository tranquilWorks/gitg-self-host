meaning_and_fit:
  purpose: Freely forgo one optional comfort for a short bounded interval, observe the resulting choices,
    and reconnect with gratitude rather than superiority. The result must leave you freer to choose, not
    bound to a harsher rule.
  why_recommended: Freely forgo one optional comfort for a short bounded interval, observe the resulting
    choices, and reconnect with gratitude rather than superiority. The result must leave you freer to
    choose, not bound to a harsher rule.
  claims:
  - statement: Freely forgo one optional comfort for a short bounded interval, observe the resulting choices,
      and reconnect with gratitude rather than superiority. The result must leave you freer to choose,
      not bound to a harsher rule.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Voluntary restraint and hardship practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Voluntary restraint and hardship as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Quiet is optional; retain music or sound used for accessibility, regulation,
    or shared comfort and choose a different nonessential simplification. Do not withhold food, water,
    sleep, medication, treatment, hygiene, warmth, necessary communication, or substance-withdrawal care.
    Do not train through pain or use temperature exposure. Respect religious practices without treating
    this activity as a substitute for their guidance. Stop when restraint becomes distressing, coercive,
    or difficult to end.
  opportunity_considerations: 'Use an ordinary ten-minute period that is already safe and free of urgent
    obligations. Default: do a simple familiar household activity without optional background entertainment,
    while keeping any sound or sensory support needed for access or comfort. The restraint is only the
    optional entertainment. Choose an equally benign simplicity variant, such as using a familiar existing
    leisure item instead of browsing new ones, when quiet is not suitable. No purchase, deprivation, strenuous
    training, or public announcement is required.'
  prerequisites:
  - 'Use an ordinary ten-minute period that is already safe and free of urgent obligations. Default: do
    a simple familiar household activity without optional background entertainment, while keeping any
    sound or sensory support needed for access or comfort. The restraint is only the optional entertainment.
    Choose an equally benign simplicity variant, such as using a familiar existing leisure item instead
    of browsing new ones, when quiet is not suitable. No purchase, deprivation, strenuous training, or
    public announcement is required.'
  dependencies: []
  safe_alternatives:
  - Quiet is optional; retain music or sound used for accessibility, regulation, or shared comfort and
    choose a different nonessential simplification. Do not withhold food, water, sleep, medication, treatment,
    hygiene, warmth, necessary communication, or substance-withdrawal care. Do not train through pain
    or use temperature exposure. Respect religious practices without treating this activity as a substitute
    for their guidance. Stop when restraint becomes distressing, coercive, or difficult to end.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Voluntary restraint and hardship differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Voluntary restraint and hardship
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-CONTEMPLATIVE-MEANING
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use an ordinary ten-minute period that is already safe and free of urgent obligations. Default:
    do a simple familiar household activity without optional background entertainment, while keeping any
    sound or sensory support needed for access or comfort. The restraint is only the optional entertainment.
    Choose an equally benign simplicity variant, such as using a familiar existing leisure item instead
    of browsing new ones, when quiet is not suitable. No purchase, deprivation, strenuous training, or
    public announcement is required. Goal: Freely forgo one optional comfort for a short bounded interval,
    observe the resulting choices, and reconnect with gratitude rather than superiority. The result must
    leave you freer to choose, not bound to a harsher rule. Scope: Fasting, simplicity, silence, difficult
    training, abstinence, and reduced comfort are different possible traditions or forms, not required
    exposures. This exercise chooses only a safe optional-comfort or simplicity pathway. It does not prescribe
    fasting, abstinence from essential care, physical hardship, pain, heat, cold, sleep loss, or substance
    withdrawal. The directly tested target is voluntary choice and a modest gratitude response; religious,
    athletic, clinical, and high-risk pathways remain outside this exercise. Time and effort: Five minutes
    to select a safe optional restraint, one ten-minute trial that may end earlier, and five minutes to
    review. One repeat within seven days is optional. Longer or harsher restraint is not progression by
    itself. Adaptation: Quiet is optional; retain music or sound used for accessibility, regulation, or
    shared comfort and choose a different nonessential simplification. Do not withhold food, water, sleep,
    medication, treatment, hygiene, warmth, necessary communication, or substance-withdrawal care. Do
    not train through pain or use temperature exposure. Respect religious practices without treating this
    activity as a substitute for their guidance. Stop when restraint becomes distressing, coercive, or
    difficult to end. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Quiet is optional; retain music or sound used for accessibility, regulation, or
    shared comfort and choose a different nonessential simplification. Do not withhold food, water, sleep,
    medication, treatment, hygiene, warmth, necessary communication, or substance-withdrawal care. Do
    not train through pain or use temperature exposure. Respect religious practices without treating this
    activity as a substitute for their guidance. Stop when restraint becomes distressing, coercive, or
    difficult to end.
  expected_burden: Five minutes to select a safe optional restraint, one ten-minute trial that may end
    earlier, and five minutes to review. One repeat within seven days is optional. Longer or harsher restraint
    is not progression by itself.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Voluntary restraint and hardship protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Voluntary restraint and hardship action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Quiet is optional;
    retain music or sound used for accessibility, regulation, or shared comfort and choose a different
    nonessential simplification. Do not withhold food, water, sleep, medication, treatment, hygiene, warmth,
    necessary communication, or substance-withdrawal care. Do not train through pain or use temperature
    exposure. Respect religious practices without treating this activity as a substitute for their guidance.
    Stop when restraint becomes distressing, coercive, or difficult to end.
  actions:
  - stable_id: PRACTICE-COMP-0809-VOLUNTARY-RESTRAINT-AND-HARDSHIP-01-A1
    sequence: 1
    title: Choose what is genuinely optional and preserve the exit
    instructions: 'Write the optional comfort, the short interval, why trying without it interests you,
      and how you can end the trial freely. For the default, optional entertainment is left off while
      one familiar task is done for up to ten minutes; essential alerts and sensory supports remain on.
      Check that nobody depends on you retaining the comfort or sharing the activity in another way. Name
      one support you will not remove and one circumstance that should end the trial. State explicitly
      that stopping or choosing comfort later does not lower your worth. If no safe optional restraint
      fits, defer rather than invent hardship.


      Observation checks: The chosen restraint concerned a genuinely optional comfort; A bounded interval,
      endorsed reason, and freely usable exit were specified; Essential supports, shared obligations,
      and a stopping condition were preserved; No deprivation, public proving, or moral ranking was made
      part of the task. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
