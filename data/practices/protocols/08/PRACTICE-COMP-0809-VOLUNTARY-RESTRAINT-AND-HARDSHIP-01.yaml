  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      Fin leaves the optional commentary off, keeps neutral background sound and necessary alerts, and
      completes the supply arrangement in six minutes. Fin then restores the video by choice. Fin reports
      a mild urge to turn it on earlier and no particular gratitude or increased freedom.


      The actual voluntary interval was six minutes within a ten-minute ceiling. Nobody else''s entertainment
      was restricted. The supplies are arranged and the modest observation is retained; there is no harder
      next challenge, endurance score or proof of humility. Fin has not decided whether repeating it would
      be useful.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Practice an optional limit without making discomfort a virtue


      Voluntary restraint can reveal that an ordinary comfort is a choice and help you appreciate its
      usefulness. Its value depends on freedom, proportion and consequences. More discomfort is not automatically
      more growth. You may restore the comfort, discover that it supports access or decide the exercise
      is not worthwhile.


      Choose one benign optional comfort to leave aside for at most ten minutes during an ordinary activity.
      Edinburgh''s reflective questions [S07](https://reflection.ed.ac.uk/reflectors-toolkit/reflecting-on-experience/what-so-what-now-what)
      support examining what happened and what it means; they do not validate hardship as treatment. Fasting,
      abstinence, silence, simplicity and difficult training appear in the broader curriculum, but this
      self-guided source prescribes no restriction of food, water, sleep, medication, care or essential
      support. No pain, heat/cold challenge, intense exercise or substance withdrawal belongs here.


      ### One short household task with an easy exit


      Fictional Fin usually plays optional commentary videos while arranging clean desk supplies. Fin
      can comfortably do this familiar, safe task without the video; necessary phone alerts and a helpful
      neutral background sound will stay on. The whole task is to place three pencils in their cup, two
      unused paper sheets in the tray and a closed notebook on the private shelf. No tool, heavy lifting
      or unknown substance is involved.


      The chosen limit is to leave the commentary video off for up to ten minutes. This is a reduction
      in one entertainment layer, not enforced silence. Fin can restore it immediately without having
      to justify the decision. If sound is needed for sensory support, use another optional simplification
      or decline the exercise. Nobody else is asked to share the restriction.


      1. State the purpose in one sentence: “I want to notice whether I can choose the commentary rather
      than start it automatically.” Check that the omitted comfort is genuinely optional today. Name stop
      conditions such as distress, an access need or a change in safety. Choose no escalating goal or
      public proof.

      2. Try the bounded arrangement only while it remains welcome. Notice any ordinary urge to restore
      the video without requiring it to disappear. Complete the small task if feasible and stop early
      if done; extending deprivation to fill time is unnecessary. Save your plan before the [later account](?resource=file-later-packet-md).

      3. Restore normal choice and review actual duration, effects, burdens and any appreciation. “No
      gratitude noticed” is a valid answer. A sense of superiority over people who enjoy the comfort is
      a reason to reconsider the interpretation, not a benefit earned by restraint.


      For support, use fiction or omit a single optional visual decoration while keeping all sensory supports.
      For a harder case, another household member wants entertainment in shared space: the limit governs
      only your voluntary choice and does not grant power over them. Stop or choose another private arrangement.


      Later transfer can repeat the same modest option only if useful, with fresh consent to yourself
      and no automatic escalation. Religious fasting and athletic hardship have specific contexts and
      risks requiring appropriate guidance; this lesson supplies neither. A ten-minute limit cannot establish
      humility, freedom from obsession or a superior way of life. Use the result to choose more wisely,
      including choosing comfort.


      ### Use the result at its proper scale


      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not
      diagnose, establish mastery or score human dignity. Actual situations require appropriate access,
      consent, authority and support.


      Attempt the [practice checks](?attempt=practice-checks) before opening their [answers](?check=practice-answers).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A background sound supports access. Must silence be imposed for the restraint to count?


      2. The safe task finishes in six minutes under a ten-minute ceiling. Must the person remain deprived
      for four more?


      3. No gratitude or greater freedom is reported. Should those outcomes be added because the exercise
      was completed?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      You accepted responsibility for sending a two-sentence venue query, but not for organizing the event.
      A reply asks you to recruit five volunteers. What remains yours, what needs a new agreement, and
      what can you truthfully report now?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Keep necessary sensory and other supports. Choose a genuinely optional comfort or decline;
      silence is not a mandatory form.


      2. No. The ceiling is not an endurance target. Restore choice when the bounded task ends and record
      the six-minute interval accurately.


      3. No. Preserve absent or uncertain outcomes. Completion establishes neither humility nor freedom,
      and it never ranks someone above people who use ordinary comforts.


      ### Changed-case answer


      Sending the query is the accepted task if actually done. Recruitment is an additional request, not
      an automatic extension. State your limit and ask the authorized organizer to decide ownership. A
      sent query does not establish a venue booking or recruited team.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
