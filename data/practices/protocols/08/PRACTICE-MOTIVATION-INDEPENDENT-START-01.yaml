meaning_and_fit:
  purpose: Compare a usual-condition start and a one-cue-supported start of the same genuinely necessary,
    low-stakes task during two naturally occurring low-motivation windows. Evaluate the act of beginning,
    not output, speed, stamina, or personal worth.
  why_recommended: Compare a usual-condition start and a one-cue-supported start of the same genuinely
    necessary, low-stakes task during two naturally occurring low-motivation windows. Evaluate the act
    of beginning, not output, speed, stamina, or personal worth.
  claims:
  - statement: Naming a specific situation and intended response is a reasonable design basis for this
      bounded start experiment.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-MOTIVATION-IMPLEMENTATION-INTENTIONS
    limitations: Implementation-intention research does not establish that this exact protocol works for
      every person, task, disability, health state, or caregiving context.
  - statement: Compare a usual-condition start and a one-cue-supported start of the same genuinely necessary,
      low-stakes task during two naturally occurring low-motivation windows. Evaluate the act of beginning,
      not output, speed, stamina, or personal worth.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Is there one safe, lawful, low-stakes, genuinely necessary task that can be
    reduced to a two-to-five-minute start in two chosen windows without sacrificing sleep, care, health,
    or recovery?
  not_applicable_behavior: Record not applicable or defer without penalty when no safe or necessary task
    fits; do not infer avoidance, laziness, low discipline, or deficit.
  readiness_considerations: Use assistive technology, a planning aid, an accessible document, a consenting
    support person, or an ordinary household equivalent. Keep the physical start smaller when needed without
    describing a plan alone as the target action. Do not sacrifice sleep, recovery, food, treatment, care
    duties, or safety. No task whose delay or partial start creates a significant hazard belongs here.
    If suitable windows do not occur, preserve the missing comparison; do not manufacture low motivation
    or remove helpful supports.
  opportunity_considerations: 'Use a clock and a private two-row note labeled usual and one cue. Default:
    open a non-sensitive document you actually need to work on and type one rough heading, stopping within
    two to five minutes. If no document is needed, put materials for one ordinary necessary household
    task in their working position. Choose two realistic windows within seven days. Keep the first under
    usual safe conditions and choose exactly one cue for the second, such as a calendar prompt or an agreed
    reminder. No invented task or sleep loss is needed.'
  prerequisites:
  - 'Use a clock and a private two-row note labeled usual and one cue. Default: open a non-sensitive document
    you actually need to work on and type one rough heading, stopping within two to five minutes. If no
    document is needed, put materials for one ordinary necessary household task in their working position.
    Choose two realistic windows within seven days. Keep the first under usual safe conditions and choose
    exactly one cue for the second, such as a calendar prompt or an agreed reminder. No invented task
    or sleep loss is needed.'
  dependencies: []
  safe_alternatives:
  - Use assistive technology, a planning aid, an accessible document, a consenting support person, or
    an ordinary household equivalent. Keep the physical start smaller when needed without describing a
    plan alone as the target action. Do not sacrifice sleep, recovery, food, treatment, care duties, or
    safety. No task whose delay or partial start creates a significant hazard belongs here. If suitable
    windows do not occur, preserve the missing comparison; do not manufacture low motivation or remove
    helpful supports.
  role_conditions:
  - Caregiving, employment, study, and household roles do not override sleep, health, access, consent,
    or emergency responsibilities.
  pathway_conditions:
  - Prompts, body doubling, assistive technology, pacing, seated or remote options, and another person's
    practical help are valid supports and must be recorded without moral judgment.
  worldview_conditions:
  - The practice does not require a productivity ethic or belief that effort, output, self-denial, or
    constant action establishes worth.
intervention:
  protocol_class: PF-BEHAVIORAL-EXPERIMENT
  duration_days: 7
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a clock and a private two-row note labeled usual and one cue. Default: open a non-sensitive
    document you actually need to work on and type one rough heading, stopping within two to five minutes.
    If no document is needed, put materials for one ordinary necessary household task in their working
    position. Choose two realistic windows within seven days. Keep the first under usual safe conditions
    and choose exactly one cue for the second, such as a calendar prompt or an agreed reminder. No invented
    task or sleep loss is needed. Goal: Compare a usual-condition start and a one-cue-supported start
    of the same genuinely necessary, low-stakes task during two naturally occurring low-motivation windows.
    Evaluate the act of beginning, not output, speed, stamina, or personal worth. Scope: The canonical
    target is repeated starts without waiting to feel inspired, confident, or energetic. This preserves
    the existing three-action protocol: a usual-condition start, a one-cue-supported start, and a bounded
    comparison. The baseline boolean, duration boundary, cued-start boolean, cue-category criteria, zero-to-two
    start count, capacity-harm indicators, and all other existing typed rules remain unchanged. The expanded
    private checks explain those actions; they do not add measurements or treat a rehearsal as a real
    start. Time and effort: About twenty to thirty minutes including setup, two starts of two to five
    minutes each, and a ten-minute comparison within seven days. Continuing after a start is optional
    and outside the measured outcome. Adaptation: Use assistive technology, a planning aid, an accessible
    document, a consenting support person, or an ordinary household equivalent. Keep the physical start
    smaller when needed without describing a plan alone as the target action. Do not sacrifice sleep,
    recovery, food, treatment, care duties, or safety. No task whose delay or partial start creates a
    significant hazard belongs here. If suitable windows do not occur, preserve the missing comparison;
    do not manufacture low motivation or remove helpful supports. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Use a private task label and structured start indicators only. Do not store
    task contents, health information, diagnoses, employer or client information, another person's identity,
    or reasons for low motivation. Do not force action through fatigue, depression, disability, caregiving
    load, pain, illness, sleep need, fear, coercion, or lack of resources. This is not treatment, diagnosis,
    productivity monitoring, or proof of character.
  expected_burden: About twenty to thirty minutes including setup, two starts of two to five minutes each,
    and a ten-minute comparison within seven days. Continuing after a start is optional and outside the
    measured outcome.
  action_count_rationale: null
  foreseeable_misuse:
  - Treating every low-energy state as resistance to overcome or using the practice to demand unpaid,
    unsafe, coercive, or excessive work.
  - Extending the start into an unplanned work session or ranking people by speed, output, persistence,
    or support needs.
  exclusions:
  - Unsafe, medically inappropriate, sleep-depriving, coercive, illegal, high-consequence, or crisis tasks.
  - Tasks whose delay, attempt, or partial start could create a safety, employment, legal, financial,
    caregiving, or health hazard.
  actions:
  - stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A1
    sequence: 1
    title: Attempt the usual-condition two-to-five-minute start
    instructions: 'In the first feasible low-motivation window, attempt the predefined physical start
      under your usual safe conditions without adding a new cue. For the default, open the actual needed
      document and type one provisional heading; do not turn the trial into finishing the document. Observe
      whether that physical start occurred and whether the scoped attempt remained within five minutes.
      A timer, assistive technology, or help you ordinarily use remains available. Stop at the boundary
      or earlier for changed capacity. In the app, the baseline-start observation concerns whether beginning
      actually happened; the duration field concerns this scoped attempt, not a later freely chosen work
      session. Record no start honestly.


      Observation checks: A naturally occurring feasible low-motivation window was used; The predefined
      physical start actually occurred or its absence was recorded; The scoped attempt duration was distinguished
      from any optional later work; No new comparison cue or capacity-harming pressure was introduced.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 5 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01
      action_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A1
      competency_stable_id: '08.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 30
      competency_measurement_ids:
      - baseline_start_occurred
      transfer_disposition: context_bound
      measurements:
      - measurement_id: baseline_start_occurred
        kind: boolean
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: baseline_scope_respected
        kind: duration
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        direction: at_most
        minimum: '0'
        target: '5'
        maximum: '15'
        unit: minutes
      - measurement_id: baseline_capacity_harm
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A2
    sequence: 2
    title: Attempt the same-sized start with exactly one cue
    instructions: 'In a separate feasible low-motivation window, use the same task and same-sized start
      with one chosen cue or support. For example, an existing calendar reminder says open the draft and
      type one rough heading. Do not simultaneously add a reminder, a reward, and a body double. Record
      whether the start occurred and, in a private category-level note, which single cue was selected.
      The existing cue artifact checks mean cue selected, one cue only, and no private content; these
      are not new success criteria. Preserve changed capacity, access, or an absent opportunity. An ignored
      prompt is not a start, and a deferred window is not converted into laziness or completed action.


      Observation checks: The second window was distinct and naturally feasible; Exactly one cue or support
      category was selected without exposing private contents; Whether the same-sized physical start occurred
      was observed; Changed capacity and any deferral were preserved without pressure to continue. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 5 minutes
    due_within_days: 6
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01
      action_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A2
      competency_stable_id: '08.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 30
      competency_measurement_ids:
      - cued_start_occurred
      transfer_disposition: context_bound
      measurements:
      - measurement_id: cued_start_occurred
        kind: boolean
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: cue_category_recorded
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - cue_selected
        - one_cue_only
        - no_private_content
      - measurement_id: cued_capacity_harm
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A3
    sequence: 3
    title: Compare zero, one, or two actual starts
    instructions: 'Review both rows and count only the chosen starts that actually occurred: zero, one,
      or two. Compare whether the single cue was more workable, less workable, or indistinguishable, keeping
      differences in timing, energy, access, pain, and care duties as context. The existing comparison
      artifact means the two windows are distinguished, deferral is preserved, and capacity is not scored.
      Do not report two starts because two times were scheduled, a reminder appeared, or a worksheet was
      completed. Keep the start count separate from the quality of the comparison. Choose a modest repeat,
      an adaptation, rest, or support on the basis of the observations, not a character verdict.


      Observation checks: The actual start count was zero, one, or two rather than the number of scheduled
      windows; The usual and cued windows were distinguished with relevant context differences; Deferral
      and capacity were retained without a deficit or coercion interpretation; Cue workability and the
      next decision were supported only as far as the observations allow. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: How many starts actually occurred, and what can the two windows tell you about the
      cue without judging capacity? Preserve an indistinguishable or adverse result. Choose whether to
      keep the cue, change one feature, obtain support, or defer. Completing a two-start experiment does
      not prove reliable initiation across tasks or life circumstances.


      Examples: Supportive: The predefined two-minute start happened in both feasible windows. The reminder
      made the second start feel easier without extending its scope. The count is two; the cue’s broader
      effectiveness remains untested.


      Mixed: The usual start occurred, but a care need made the second window unsuitable. The observed
      count is one and the cue comparison remains incomplete; the deferred action is not relabeled failure
      or completion.


      Contradictory: The reminder became pressure to work through a stated need for rest. The capacity-harm
      concern remains adverse even if a document was opened, and the cue is removed or revised.


      Inconclusive: Two prompts were scheduled but neither physical start was observed. There is no evidence
      of two starts; planning and a zero-start count cannot be represented as successful behavioral initiation.'
    expected_time: 10 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01
      action_stable_id: PRACTICE-MOTIVATION-INDEPENDENT-START-01-A3
      competency_stable_id: '08.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 30
      competency_measurement_ids:
      - chosen_start_count
      transfer_disposition: context_bound
      measurements:
      - measurement_id: chosen_start_count
        kind: count
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '2'
        maximum: '2'
      - measurement_id: comparison_boundaries_present
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_windows_distinguished
        - defer_preserved
        - capacity_not_scored
      - measurement_id: comparison_used_for_coercion
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use a free calendar cue, an existing object placed safely, or a self-written non-private task label;
      no app, purchase, reward, or accountability service is required.
    accessibility:
    - Use assistive technology, a planning aid, an accessible document, a consenting support person, or
      an ordinary household equivalent. Keep the physical start smaller when needed without describing
      a plan alone as the target action. Do not sacrifice sleep, recovery, food, treatment, care duties,
      or safety. No task whose delay or partial start creates a significant hazard belongs here. If suitable
      windows do not occur, preserve the missing comparison; do not manufacture low motivation or remove
      helpful supports.
    cultural_context:
    - Choose a necessary task and support arrangement consistent with the person's roles, collective responsibilities,
      rest norms, and authority to decide.
    resource_variants:
    - Use assistive technology, a planning aid, an accessible document, a consenting support person, or
      an ordinary household equivalent. Keep the physical start smaller when needed without describing
      a plan alone as the target action. Do not sacrifice sleep, recovery, food, treatment, care duties,
