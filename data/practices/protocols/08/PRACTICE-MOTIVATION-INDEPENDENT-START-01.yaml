  - id: file-later-packet-md
    title: Later packet
    body: 'Supplied fiction, not actual participant evidence. Save the initial work in the [guide](?)
      before reading.


      On day two Avery feels unenthusiastic but has capacity, opens the note and enters the heading plus
      “water bottle.” Work lasts three minutes and stops as planned. No capacity harm is reported.


      On day five the visual reminder is present, but a necessary caregiving task takes priority. Avery
      defers without opening or editing the note. On day seven Avery compares the windows: one known actual
      start, one known deferral, and no test of whether the cue helps initiation. The packing note is
      unfinished. Avery keeps the option of a later suitable practice without claiming two starts, a failed
      second attempt or completed practice.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "### Start a chosen task without waiting for enthusiasm\n\nLow motivation and lack of capacity\
      \ are different. You may not feel inspired by a necessary task while still being able to take a\
      \ small step. Illness, exhaustion, access barriers or urgent care can instead make deferral appropriate.\
      \ This practice tests a chosen start, not obedience to an employer, helper or internal demand to\
      \ ignore your limits.\n\nThe existing seven-day practice compares two naturally low-motivation windows\
      \ on the same chosen task: an ordinary start by day three, a start with one selected cue by day\
      \ six, and a comparison by day seven. Keep each start between two and five minutes. The NHS discussion\
      \ of manageable starts and reminders [S06](https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/tackling-your-to-do-list/)\
      \ supports those broad ideas; it does not validate these particular evidence rules or imply that\
      \ low mood is cured by working.\n\n### A task with a visible first action\n\nFictional Avery needs\
      \ a usable personal packing note for a familiar daytime visit. There is no emergency or travel safety\
      \ decision. The full required content is “water bottle, ordinary notebook, key.” Avery already knows\
      \ any personal medical or access requirements and keeps those in the existing plan, outside this\
      \ exercise. The bounded first action is opening a note titled “Day visit” and entering a rough heading\
      \ or one of the three supplied items. Imagining the note or deciding to start does not count as\
      \ beginning it.\n\nAvery chooses a three-minute limit for each window. The usual condition has no\
      \ added cue. The single cue for the second is a visible card saying “Open Day visit and enter one\
      \ item.” Do not also add an alarm, reward and accountability partner. The cue category is a visual\
      \ reminder; its wording is ordinary and contains no private content.\n\n1. Before the usual window,\
      \ check that the task is still needed, chosen and feasible. If naturally unmotivated but able, make\
      \ the actual first edit and work within two to five minutes. Stop at the limit. Record whether a\
      \ start occurred, its duration and any capacity cost, without treating more output as better evidence.\n\
      2. In the separate second window, use the one chosen cue under suitable conditions. A visible card\
      \ is not a performed action. If care or capacity requires deferral, preserve that status instead\
      \ of marking it a failed attempt or inventing work. Save the plan before the [comparison record](?resource=file-later-packet-md).\n\
      3. By day seven distinguish both windows, count only known actual starts from zero to two, and choose\
      \ whether to keep the cue, adjust it later or defer the practice. Missing observations remain unknown;\
      \ a known deferral is not proof of an attempted failure. Do not turn a comparison into a demand\
      \ for two starts regardless of health.\n\n Keep fictional notes separate from a record of your actual\
      \ attempt. A summary of one actual start plus a deferred second opportunity is not a claim that\
      \ the two-start target or practice completion was met. No reward for endurance or quantity is added.\n\
      \nFor support, use dictation, an accessible editor or the supplied fiction. The existing accessibility\
      \ adaptations also permit reduced duration and support; record the actual adapted step and its limitation\
      \ rather than silently calling it the standard two-to-five-minute start. For a harder case, the\
      \ cue is noticed while an urgent duty needs attention: honor that duty and record the opportunity\
      \ accurately. Persistent loss of motivation with impaired functioning merits appropriate qualified\
      \ support. Later repeated starts can inform usefulness, but this small comparison cannot establish\
      \ a durable habit, recovery or unlimited capacity.\n\n### Use the result at its proper scale\n\n\
      Fiction and no attempt are legitimate. Subjective ratings, source exercises and completion do not\
      \ diagnose, establish mastery or score human dignity. Actual situations require appropriate access,\
      \ consent, authority and support.\n\nAttempt the [practice checks](?attempt=practice-checks) before\
      \ opening their [answers](?check=practice-answers)."
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Attempt these before opening [answers](?check=practice-answers).


      1. A reminder is seen but no task action occurs because care takes priority. Is that a cued start?


      2. One three-minute start occurs and the second opportunity is deferred. What count is supported?


      3. You planned a two-to-five-minute start but feel pressure to continue for fifteen minutes. Must
      you extend it to count the attempt?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Compare with your attempted [checks](?attempt=practice-checks); these are learning aids, not
      a learner score.


      1. No. Seeing a cue is not starting the task. Preserve deferral and the care need without recording
      a failed attempted action.


      2. One known actual start. The deferred window supplies no second start or evidence about cue effectiveness;
      it does not meet a two-start target.


      3. No. The task''s two-to-five-minute boundary still governs. More elapsed time is not required
      and does not establish a better start. Keep the bounded task and your actual stopping point visible.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
