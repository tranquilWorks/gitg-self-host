  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      L''s times 40 and 33 average **36.5 seconds**; U''s 34 and 42 average **38 seconds**. The mean advantage
      for L is **1.5 seconds**, below the predeclared five-second criterion. L has 20/20 correct and U
      19/20. Accuracy is not worse for L, but the conjunction still fails because the time condition is
      not met.


      First-position times 40 and 42 average **41**; second-position times 34 and 33 average **33.5**.
      This descriptive order contrast is **7.5 seconds**, larger than the pooled layout contrast. Within
      block 1, U is six seconds faster; within block 2, L is nine seconds faster. These patterns make
      order, learning, and deck sequence important candidate explanations; they do not themselves isolate
      any one cause.


      There is one simulated participant, four repeated runs, and forty assigned slips. The forty placements
      are not forty independent participants. The supplied numbers verify arithmetic and interpretation
      only. The pilot neither meets the chosen descriptive threshold nor proves absence of a useful layout
      effect under better comparison. More informative work needs new observations under a saved improved
      design, not simply a smaller threshold after the result.


      ### Check A


      Distinct problems include unequal workload, familiar versus unfamiliar slips, layout confounded
      with order, changed label size, helper answer selection, discarded mistakes, speed-only reporting,
      a false unit count, and mislabeling repeated analysis as replication. A fairer comparison fixes
      workload and support, supplies matched complete decks, varies layout under a preselected order schedule,
      and records all correct, incorrect, and unplaced outcomes. Counterbalancing helps inspect order
      but does not guarantee removal of nonlinear practice or carryover.


      The person or appropriately defined independent experimental unit must be distinguished from repeated
      slips. A second analyst can verify arithmetic on the same data; new experimental replication requires
      new observations and a specified relation to the original protocol. A reviewer can inspect the saved
      plan, raw records, deviations, design, and reasoning. The existence of a review does not establish
      that the claim is correct or generalizable.


      Repair: name the exact contrast the next study would estimate and which factors remain fixed. “Make
      it scientific” or “get more participants” does not repair missing outcome definitions or helper
      answer selection by itself.


      ### Check B


      L averages **19 seconds**, U **23 seconds**: a four-second L advantage, below five. L''s correct
      proportion is **19/20 = 95%**, U''s **20/20 = 100%**. Both the speed threshold and non-worse-accuracy
      condition fail. Do not remove a legitimate error or change the threshold after seeing the result.
      A further protocol could inspect the source of mistakes and compare new materials with fixed accuracy
      handling.


      For the interrupted version of run 2, assigned count stays ten: six correct, zero incorrect, four
      unplaced. Its completed-run duration is missing, not zero. A descriptive mean using complete runs
      must state its smaller denominator and loss of the original balanced comparison. Preserve the interrupted
      row, reason, and any prospectively decided retry policy. A favorable selective retry cannot replace
      the original without a visible deviation and changed inference boundary.


      A complete row with correct + incorrect + unplaced not equal to ten is invalid data. A complete
      status with unplaced slips or a missing duration is inconsistent with this protocol. Correct the
      record from evidence or mark it unresolved; do not silently normalize it to make the totals work.'
