  - stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01-A2
    sequence: 2
    title: Pilot both conditions while preserving inconvenient observations
    instructions: 'Use a coin or another fair preselected method to decide which layout comes first. Complete
      one round in each condition and keep mistakes, interruptions and unfinished rounds in the record.
      Do not quietly repeat only a poor result. Note whether the measurement procedure itself was awkward
      or whether learning the labels made the second round easier; a coin flip does not magically remove
      every source of confounding.


      Observation checks: Both conditions are attempted in a preselected order; Errors and interruptions
      are retained; Outcome definitions are not changed after seeing results; Order and learning effects
      remain acknowledged. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01
      action_stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01-A2
