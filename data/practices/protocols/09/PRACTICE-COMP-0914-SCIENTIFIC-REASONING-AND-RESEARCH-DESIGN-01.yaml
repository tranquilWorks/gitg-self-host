intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Claim: arranging five labeled folders alphabetically makes filing paper slips faster. Use five
    folders or drawn boxes and two matched sets of ten synthetic slips labeled A–E. Compare alphabetical
    layout with your usual layout. Record completion time if useful and count correctly filed slips; accuracy
    matters even when speed improves. Goal: Turn a claim into a hypothesis with an observable measure,
    comparison, confound controls and replication plan, then use a safe pilot to improve the design. Scope:
    A personal pilot tests the feasibility of a design, not a population claim. This exercise excludes
    treatment experiments, deprivation, hazardous tasks and research on other people without appropriate
    consent and oversight. Time and effort: Twenty minutes to design a paper-sorting test, two short pilot
    rounds and fifteen minutes to critique it. Adaptation: Use large print, tactile labels, a screen reader
    or a non-timed accuracy comparison. Keep the access method constant across conditions. A paper design
    critique is acceptable when a live task is unsuitable, but it does not count as an executed experiment.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use large print, tactile labels, a screen reader or a non-timed accuracy comparison.
    Keep the access method constant across conditions. A paper design critique is acceptable when a live
    task is unsuitable, but it does not count as an executed experiment.
  expected_burden: Twenty minutes to design a paper-sorting test, two short pilot rounds and fifteen minutes
    to critique it.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Scientific reasoning and research design protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Scientific reasoning and research design action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use large print,
    tactile labels, a screen reader or a non-timed accuracy comparison. Keep the access method constant
    across conditions. A paper design critique is acceptable when a live task is unsuitable, but it does
    not count as an executed experiment.
  actions:
  - stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01-A1
    sequence: 1
    title: Specify the hypothesis and the measurement before testing
    instructions: 'Predict how the layout will affect time and accuracy and define exactly when a round
      starts and ends. Keep the number of slips, labels and instructions the same. Choose a comfortable
      pace, a maximum round length and a stopping condition for strain. List likely confounds such as
      practice on the first round, unequal label difficulty and interruptions; decide which can be controlled
      and which must be recorded.


      Observation checks: The hypothesis predicts a specific observable difference; Time and accuracy
      definitions are fixed in advance; The comparison holds major task features constant; Likely confounds
      and a safe stopping rule are identified. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01
      action_stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01-A1
