    title: Practice checks
    body: '### Check A — A polished but confounded protocol


      A person files eight familiar slips in layout U first, then twelve unfamiliar slips in layout L.
      The second run uses larger labels and a helper who chooses the boxes. The report discards two mistakes
      as “practice,” reports only completion time, and says forty slip movements are forty independent
      participants. A second analyst reruns the saved calculation and calls that an independent experimental
      replication.


      Identify at least five separate design or reporting defects. Propose a feasible next comparison
      with complete material counts, consistent assistance, predeclared errors/missing-data rules, and
      a condition-order plan. Explain the actual unit and the distinction between reproducing analysis
      and collecting a new replication. State what peer review could inspect without claiming it guarantees
      truth.


      ### Check B — Apply the criterion without changing it


      A four-run fictional pilot planned the same criterion as the guide: L at least five seconds faster
      on mean completed-run time with no lower correct-placement proportion. All runs assign ten slips.


      | Run | Layout | Seconds | Correct | Incorrect | Unplaced | Status |

      | --- | --- | --- | --- | --- | --- | --- |

      | 1 | L | 18 | 10 | 0 | 0 | complete |

      | 2 | U | 24 | 10 | 0 | 0 | complete |

      | 3 | U | 22 | 10 | 0 | 0 | complete |

      | 4 | L | 20 | 9 | 1 | 0 | complete |


      Calculate the two mean times and accuracy fractions, then decide whether the criterion is met. Can
      the last mistake be excluded because L looked faster? Name a useful next design step without claiming
      the method is universally ineffective.


      In a separate reporting exercise, replace run 2 with **interrupted; duration unknown; correct 6,
      incorrect 0, unplaced 4**. Explain how to preserve its assigned denominator and missing duration.
      Is silently retrying only that run until a favorable time appears acceptable?'
