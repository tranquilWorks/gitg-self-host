  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### The skill and its boundary


      Turn a claim into a test whose materials, measurements, comparisons, and limits another person could
      inspect. A small pilot can expose a bad design without establishing a universal effect.


      **Canonical scope:** Understand hypotheses, measurement, controls, confounding, replication, peer
      review, and limits of inference.


      **Deliverable:** A short pre-result protocol, four supplied pilot-run interpretations, a design
      critique, and a better replication plan. Use a paper-only analysis route or an optional harmless
      personal filing task. The default fictional route needs no participant, stopwatch, or real experiment.
      Allow two unrushed sessions. Never experiment on other people, essential services, health, deprivation,
      or hazardous activities under this lesson.


      [R7](?resource=sources) supports the limited design background on blocking and treatment comparison;
      [R3](?resource=sources) supports making plans and deviations visible. The materials below are original,
      not a validated study or a claim that preregistration guarantees truth.


      ### From an interesting claim to an interpretable test


      A **hypothesis** predicts an observable pattern under specified conditions. A **measurement rule**
      states what is counted, with units, start/end conditions, and missing-data handling. A **control
      comparison** keeps the relevant contrast visible. A **confound** offers another explanation for
      a contrast because factors change together.


      **Replication** obtains new observations under a stated procedure; reusing the same saved results
      checks reproducibility of arithmetic, not a new empirical replication. **Peer review** can scrutinize
      methods and reasoning, but neither a reviewer nor a publication label guarantees correctness. State
      what a reviewer actually inspected, rather than filling in imagined approval.


      Random assignment of condition order can help avoid choosing a favorable order. It does not guarantee
      balance in a tiny run, erase practice, or make a single person representative. Blocking can make
      comparisons within similar periods more interpretable, but all remaining differences and carryover
      still need consideration. More measurements on the same person do not automatically become independent
      participants.


      ### A different worked example: a comparison with two things changed


      Suppose someone tries one label layout on six slips, then another on twelve slips, and reports that
      the first is faster. Layout and workload changed together. Even exact timing cannot isolate layout.
      A better next comparison fixes slip count and content, records errors, and varies layout with an
      order plan. If the faster condition made more filing mistakes, speed alone does not establish a
      better method.


      The repair is not to declare experimentation useless. It is to identify which change would make
      the next observation answer the actual question.


      ### Complete filing materials


      Draw five equal boxes in one row. Label them **A, B, C, D, E** for layout **L**, or **C, A, E, B,
      D** for layout **U**. Use the same label size, available reference, response method, and comfortable
      position in both layouts. The outcome is placing a slip in the box bearing its letter, not remembering
      the alphabet unaided.


      Four complete decks are supplied. Each has ten slips, two of each letter. “Matched” here means matched
      count and frequency, not proof that every order has identical human difficulty.


      | Deck | Slip order |

      | --- | --- |

      | X | A, C, E, B, D, B, A, D, E, C |

      | Y | D, B, A, E, C, A, D, C, B, E |

      | Z | C, E, B, A, D, E, C, D, A, B |

      | W | B, D, C, E, A, D, B, A, E, C |


      For optional physical use, write these on ordinary paper or point to the target boxes instead of
      moving slips. Do not cut materials with hazardous tools or work through strain. A helper may operate
      a timer or record your choices without selecting boxes. For the default, inspect the supplied results
      rather than manufacturing observations.


      ### The example protocol — adopt or revise before opening the results


      **Question:** For this person, these materials, and this access method, does L reduce mean time
      compared with U without reducing correct placements?


      **Example pilot criterion:** L''s mean completed-run time at least **5 seconds lower** than U''s,
      with no lower overall correct-placement proportion. This is a chosen workflow threshold, not a validated
      meaningful difference or statistical significance test. State a different justified threshold before
      results if you use one; never choose it afterward to favor the outcome.


      **Units:** A run is ten assigned slips. A person is the experimental participant. In the four-run
      example there is one simulated person, not forty independent participants.


      **Measurement:** Start when the first slip is made available; finish when the last assigned slip
      is placed. Count correct, incorrectly placed, and unplaced slips so their sum equals ten. Do not
      include a warm-up in the measured four runs. Keep the same available instructions and supports across
      layouts. An interrupted or incomplete run has no completed-run duration in the primary comparison;
      retain its assigned count and partial outcomes separately.


      **Limits:** Optional real runs stop at 120 seconds or earlier for strain, access difficulty, or
      an interruption that breaks comparability. Do not continue to secure a favorable number. Do not
      record an interrupted run as zero seconds, delete it, or repeat only an unfavorable result without
      preserving the deviation.


      **Order:** Use two blocks of two runs. A fair preselected choice determines the first block''s order;
      the second reverses it. The supplied simulated sequence is **L then U; U then L**, with decks X,
      Y, Z, W respectively. The reversed second block is deliberate counterbalancing, not another independent
      random draw. State the sequence before seeing results. Rest or reset consistently between runs;
      record any difference rather than claiming all learning or fatigue vanished.


      #### Action 1 — Identify what is controlled and what remains confounded


      Write the hypothesis, primary criterion, outcome definitions, count identity, order, exclusion rules,
      and fixed number of runs. Then list at least four influences: layout, practice/order, slip sequence,
      interruption, fatigue, measurement method, or support use. For each, state whether it is held fixed,
      varied deliberately, balanced imperfectly, or merely recorded.


      Critique the supplied protocol. Different deck orders may differ in difficulty; practice can be
      nonlinear; a person may remember the prior layout; timing can include helper delay. Holding frequencies
      equal helps one comparison but does not prove equivalence. Name a result that would challenge the
      claim before reading any results.


      #### Action 2 — Inspect a complete pilot without discarding awkward results


      Save your protocol. Open **pilot-results.md** only afterward. Label the route **supplied simulation**.
      Calculate mean time by layout, mean time by first/second position within a block, and overall correct
      placements by layout. Show the denominator for each.


      Apply the chosen criterion exactly. Compare the within-block contrasts as well as the pooled contrast;
      a single favorable average may hide an order effect. Do not report repeated slips as independent
      people or infer a population effect from one simulated participant. A criterion not met is not proof
      of no possible benefit under every design.


      For an optional real route, follow your saved protocol, use the provided decks, and record actual
      results with their limitations. Do not mix the supplied simulation with your real results as if
      all observations came from one trial.


      #### Action 3 — Design a more informative replication and review


      Write a next protocol that addresses the strongest remaining confound while preserving the question.
      For example, use further matched decks, a preselected order schedule, consistent reset and timing
      rules, and clear interruption handling. A new condition order and new observations are a repeat;
      recomputing the same four times is only analysis reproducibility.


      Describe exactly what a willing independent reviewer could inspect: material identity, saved plan,
      raw run records, count conservation, deviations, arithmetic, and claim wording. An actual reviewer
      would need to supply their own feedback. Do not create an “approved” receipt from your description
      of what they might say.


      State scope limits in the conclusion: the person, task, response method, setting, and sampled occasions.
      Testing a different access method may be worthwhile, but it changes the target claim. A non-timed
      route can investigate accuracy or usability, not establish the same speed claim. Retain necessary
      supports rather than removing them for a supposedly pure test.


      ### An error-aware reporting template


      `Question | planned comparison | hypothesis and threshold | unit and assigned count | raw outcomes
      | missing/interrupted runs | deviations | descriptive contrast | alternative explanation | next
      design | unsupported stronger claim`


      A useful report says which evidence would discriminate between the explanations. “More research
      is needed” without specifying a changed measurement or comparison adds little. A negative or ambiguous
      pilot can be successful design work if it identifies a tractable flaw.


      ### Accessibility, progression, and transfer


      Use large-print letters, tactile identifiers, spoken selection, or a screen-reader-friendly list.
      Keep the chosen response method stable across the comparison. Record a helper''s role and preserve
      the learner''s decisions. Stop when the task itself is unsuitable.


      For a harder route, distinguish random sampling from randomized order, and identify the experimental
      unit separately from the number of rows. Ask whether an independently repeated personal result generalizes
      to other learners. It does not do so automatically.


      For later transfer, critique an ordinary public experiment using its actual methods, not merely
      its headline. Missing methods remain a limitation. Designing a better study is not evidence that
      it was performed, and human research may require consent and oversight beyond this lesson.


      ### Interpret the result


      **Supportive:** Materials and measures are complete, all assigned work is accounted for, and the
      conclusion separates a descriptive result from causal and population claims. **Mixed:** Both conditions
      are present but sequence or assistance is not recorded. **Contradictory:** Unfavorable runs disappear
      or a post-result criterion is represented as preplanned. **Inconclusive:** A hypothesis is stated
      but no implementable protocol or interpretable result record exists.


      **Final review:** Which remaining confound could explain the contrast, and what exact design change
      would make the next comparison more informative?'
  - id: practice-checks
