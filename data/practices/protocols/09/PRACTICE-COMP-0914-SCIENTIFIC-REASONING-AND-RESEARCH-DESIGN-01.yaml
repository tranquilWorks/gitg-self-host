  - stable_id: PRACTICE-COMP-0914-SCIENTIFIC-REASONING-AND-RESEARCH-DESIGN-01-A3
    sequence: 3
    title: Critique the design and specify a better replication
    instructions: 'Separate the observed difference from a causal conclusion. Propose a later repeat with
      new matched slips and reversed order, and name a result that would challenge the claim. Explain
      what peer review could inspect—methods, assumptions and analysis—and what it could not guarantee,
      such as correctness or generalization. Decide whether the pilot supports repeating, redesigning
      or abandoning the test rather than announcing a universal result.


      Observation checks: Observation and inference are stated separately; A replication changes order
      while keeping the comparison fair; A disconfirming result is specified; Peer review is treated as
      scrutiny rather than a truth guarantee. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which confound could still explain the result, and what change would make the next
      test more informative?


      Examples: Supportive: The layout difference was recorded with accuracy, an order effect was noticed,
      and the next repeat reversed condition order with matched new slips.


      Mixed: Both rounds were completed, but unequal materials prevented a useful comparison.


      Contradictory: Unfavorable trials were discarded or the pilot was advertised as proof that one layout
      works for everyone.


      Inconclusive: A claim and a preferred result were written without operational measures, a comparison
      or a replication plan.'
    expected_time: 15-25 minutes
    due_within_days: 10
