meaning_and_fit:
  purpose: Assess severity, likelihood, exposure, detectability and control, then choose a safeguard and
    an explicit proceed, change or stop threshold.
  why_recommended: Assess severity, likelihood, exposure, detectability and control, then choose a safeguard
    and an explicit proceed, change or stop threshold.
  claims:
  - statement: Assess severity, likelihood, exposure, detectability and control, then choose a safeguard
      and an explicit proceed, change or stop threshold.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Risk assessment and precaution practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Risk assessment and precaution as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a seated tabletop route, an accessible handling aid or an empty-handed
    rehearsal. Choose a different low-risk activity when mobility, balance or pain makes carrying unsuitable.
    Electrical, fire, road, chemical, medical and other serious hazards belong to qualified procedures.
  opportunity_considerations: 'Default: carry a stack of lightweight books across a shared room. Consider
    a blocked view, a loose object on the route and a person entering unexpectedly. Use an ordinary empty-handed
    walk-through first. Do not create obstacles, lift heavy loads or test whether someone can tolerate
    a fall.'
  prerequisites:
  - 'Default: carry a stack of lightweight books across a shared room. Consider a blocked view, a loose
    object on the route and a person entering unexpectedly. Use an ordinary empty-handed walk-through
    first. Do not create obstacles, lift heavy loads or test whether someone can tolerate a fall.'
  dependencies: []
  safe_alternatives:
  - Use a seated tabletop route, an accessible handling aid or an empty-handed rehearsal. Choose a different
    low-risk activity when mobility, balance or pain makes carrying unsuitable. Electrical, fire, road,
    chemical, medical and other serious hazards belong to qualified procedures.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Risk assessment and precaution differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Risk assessment and precaution
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: carry a stack of lightweight books across a shared room. Consider a blocked view, a
    loose object on the route and a person entering unexpectedly. Use an ordinary empty-handed walk-through
    first. Do not create obstacles, lift heavy loads or test whether someone can tolerate a fall. Goal:
    Assess severity, likelihood, exposure, detectability and control, then choose a safeguard and an explicit
    proceed, change or stop threshold. Scope: The exercise concerns a low-consequence activity you control.
    It is not a professional risk assessment, emergency plan or permission to accept danger on someone
    else’s behalf. Time and effort: Twenty minutes to assess one activity, one safe trial or tabletop
    rehearsal, and ten minutes to review. Adaptation: Use a seated tabletop route, an accessible handling
    aid or an empty-handed rehearsal. Choose a different low-risk activity when mobility, balance or pain
    makes carrying unsuitable. Electrical, fire, road, chemical, medical and other serious hazards belong
    to qualified procedures. Keep personal working notes outside the check-in; record only the listed
    observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a seated tabletop route, an accessible handling aid or an empty-handed rehearsal.
    Choose a different low-risk activity when mobility, balance or pain makes carrying unsuitable. Electrical,
    fire, road, chemical, medical and other serious hazards belong to qualified procedures.
  expected_burden: Twenty minutes to assess one activity, one safe trial or tabletop rehearsal, and ten
    minutes to review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Risk assessment and precaution protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Risk assessment and precaution action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a seated
    tabletop route, an accessible handling aid or an empty-handed rehearsal. Choose a different low-risk
    activity when mobility, balance or pain makes carrying unsuitable. Electrical, fire, road, chemical,
    medical and other serious hazards belong to qualified procedures.
  actions:
  - stable_id: PRACTICE-COMP-0910-RISK-ASSESSMENT-AND-PRECAUTION-01-A1
    sequence: 1
    title: Describe the hazard without collapsing every dimension into a score
    instructions: 'For each plausible hazard, describe the possible harm, how often exposure occurs, whether
      warning would be visible, and which part you can control. Use words such as minor, significant,
      unlikely or uncertain with a reason; do not multiply arbitrary numbers into false precision. In
      the default, a blocked view is controllable by carrying fewer books, while another person’s movement
      is not fully controllable.


      Observation checks: Hazard and possible harm are distinguished; Likelihood and exposure receive
      separate reasons; Detectability and control are considered; Uncertainty is not hidden inside an
      invented precise score. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0910-RISK-ASSESSMENT-AND-PRECAUTION-01
      action_stable_id: PRACTICE-COMP-0910-RISK-ASSESSMENT-AND-PRECAUTION-01-A1
