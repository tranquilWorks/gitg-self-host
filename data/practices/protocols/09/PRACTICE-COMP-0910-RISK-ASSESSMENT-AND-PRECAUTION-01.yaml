  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [R1 — Risk identification, controls, and review](https://www.hse.gov.uk/simple-health-safety/risk/steps-needed-to-manage-risk.htm)

      - [R2 — Practical judgment and particulars](https://classics.mit.edu/Aristotle/nicomachaen.6.vi.html)

      - [R3 — Prospective plans and transparent changes](https://www.cos.io/initiatives/prereg)

      - [R4 — Descriptive location](https://www.itl.nist.gov/div898/handbook/eda/section3/eda351.htm)

      - [R5 — Fitted regression](https://www.itl.nist.gov/div898/handbook/pmd/section1/pmd141.htm)

      - [R6 — Sampling variability and spread](https://openstax.org/books/introductory-statistics-2e/pages/2-7-measures-of-the-spread-of-the-data)

      - [R7 — Blocking and experimental comparisons](https://www.itl.nist.gov/div898/handbook/pri/section3/pri332.htm)

      - [R8 — Statistical versus causal quantities](https://www.ncbi.nlm.nih.gov/books/NBK588337/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### The skill and its boundary


      Choose a usable safeguard for a specified hazard, explain the remaining uncertainty, and change
      or stop when the conditions no longer support proceeding. Precaution is neither a promise of zero
      risk nor a reason to accept avoidable harm because a score looks small.


      **Canonical scope:** Estimate severity, likelihood, exposure, detectability, controllability, and
      mitigation without demanding zero risk.


      **Deliverable:** A six-dimension risk record, a chosen method, an owner and verification step for
      each safeguard, and a three-event proceed/change/hold review. The default takes roughly 35 minutes
      and is entirely on paper. Do not stage a physical obstruction, lift a test load, or expose anyone
      to harm. Use words, cards, dictation, or a calculator. All required conditions and events are supplied.


      The introductory identify–assess–control–review approach is consistent with the limited background
      in [R1](?resource=sources). That workplace reference does not turn this fictional exercise into
      a professional risk assessment, legal compliance finding, or permission to operate equipment.


      ### Six different questions


      A **hazard** is something that could cause harm; the **harm** is the adverse consequence. An obstructed
      view is not itself an injury. Specify the causal route from the condition to the possible consequence
      and who would bear it.


      **Severity** asks how bad a credible consequence could be, not just what happened last time. **Likelihood**
      asks how plausible that consequence is under the stated conditions. **Exposure** asks how often
      or how long a person encounters the condition. A low frequency of encounters is not the same as
      a low probability of harm per encounter.


      **Detectability** asks whether there is a useful warning early enough to act. Seeing a dropped item
      afterward is detection, but not necessarily prevention. **Controllability** asks which conditions
      you can actually change, with what authority and capability. Another person''s movement is not yours
      to command. **Mitigation** asks what measure changes the route to harm and what remains afterward.
      Sometimes a measure lowers probability, sometimes consequence, and sometimes only the time to recover.


      Use reasoned descriptions: “occupancy not known; need a fresh check,” not a made-up probability.
      Multiplying ordinal labels such as 2 × 3 × 4 can create numerical precision without a defensible
      measurement scale. Keep the dimensions visible even when an organization has a legitimate specialized
      rating system. This exercise does not replace that system.


      ### A different worked example: keep paper away from a drink


      At a personal desk, a closed drink container stands beside draft paper. Moving the container to
      a stable separate part of the desk changes the contact opportunity. A waterproof sleeve would limit
      damage if contact occurred. Looking at the desk before starting supplies detection. These are different
      controls, not three interchangeable labels.


      Record the owner, permission, and check: “I may relocate my own closed container; verify that the
      new position is stable and does not obstruct anything.” A control that moves it onto an unstable
      edge creates another problem. One spill-free session shows that no spill was observed in that session;
      it does not establish a zero spill probability. This example is not an instruction to work near
      powered equipment or hazardous liquids.


      ### Complete fictional route packet


      You are planning to move **12 paper tokens** from station S to station D. Simulate only; the room
      and tokens below are imagined. The purpose is to practice decisions, not manual handling.


      There are two possible routes: **S–A–B–D** and **S–C–D**. Route A passes a narrow shared passage.
      Route B includes an opening through which another person might enter. Route C is a longer, designated
      alternative passage even though the map uses fewer named segments. Segment count is not physical
      distance.


      | Record | Current supplied condition | What you may control |

      | --- | --- | --- |

      | V | A tall imagined stack hides the route ahead; two smaller stacks preserve the view | Choose
      a lower stack or a different method; no prescribed weight limit is supplied |

      | A | An assistive device is parked in the narrow passage; you have no permission to move it | Do
      not move it or block its user''s access; choose another route or defer |

      | B | Occupancy beyond the opening is not yet checked | Request or make an appropriate fresh check;
      do not treat unknown as empty |

      | C | The alternative passage is currently confirmed clear and available to you | Use it only while
      that confirmation remains applicable; keep it available to other users |

      | P | You may pause at S or D; no essential deadline is threatened by deferring | Pause, use an
      authorized alternative, or do not move the tokens now |


      There is no instruction to move a real object, assess a person''s medical capacity, or determine
      a generally safe load. In a real task, a comfortable amount depends on the actual person, environment,
      and established procedures. Unsupported capability is a reason to change the task, not to test tolerance.


      #### Action 1 — Make a record that does not hide unknowns


      For V, A, and B, write:


      `Condition → possible harm → affected people | severity with reason | likelihood with reason or
      unknown | exposure | warning and response time | authority/capability | existing and additional
      control | remaining concern`


      Also consider the route-C method: the alternative removes some exposures but may introduce a longer
      journey or a conflict with another user''s access. Do not claim it is risk-free just because the
      supplied initial check is favorable. Identify which concerns are established facts in the packet
      and which are possible consequences.


      A useful entry explains a mechanism. “Danger, medium, be careful” does not tell anyone what to do.
      For unknown occupancy, distinguish information missing now from a situation known to be occupied.
      Both can prevent an immediate move, but the next steps differ.


      #### Action 2 — Choose a method with executable safeguards


      Compare at least two methods: lower visible stacks on an authorized clear route; keep the tokens
      at S and arrange a later permitted transfer; or another method justified by the supplied facts.
      Do not choose the narrow route by assuming permission to relocate the assistive device.


      For the selected method, fill:


      `Safeguard | specific exposure or consequence changed | responsible role | permission | check before
      proceeding | change/hold condition | possible new burden`


      Example stop language must be observable: “Hold if the route becomes occupied, permission is missing,
      or a needed check is unavailable.” Avoid “stop when unsafe” without explaining what the person can
      notice. A control must actually be in place, not merely on a list. Record which action needs another
      person''s authority and therefore cannot be completed by your plan alone.


      Use **proceed** only for the next bounded simulated move under satisfied conditions, **hold** when
      you must wait or obtain a missing condition, and **change** when a different authorized method is
      available. None of these labels is permission for a real hazardous task.


      #### Action 3 — Test the decision rule, not the harm


      Save the method and thresholds, then apply them to these three events in order. No one needs to
      enact them physically.


      | Event | New information |

      | --- | --- |

      | E1 | For this tabletop event the chosen method’s stipulated capability check is satisfied, its
      lower stack preserves view, and C is freshly confirmed clear and authorized |

      | E2 | Before the next move, another user occupies C; there is a safe place to wait at S |

      | E3 | C remains unavailable; the only alternative would require moving the assistive device without
      permission |


      Record your decision and the specific condition responsible. Explain what would have to change before
      you could reconsider E2 or E3. A method that says proceed after any previous successful move fails
      to respond to changing exposure. A decision to hold is a successful safety decision when the condition
      requires it; it is not completed transfer work.


      Complete the separate fresh checks before opening their answer file. Keep the record of the first
      method and any revision so a later reader can see why it changed.


      ### Exposure arithmetic without pretending to know real probabilities


      This optional mathematical toy assumes independent crossings and an unchanged **1/10 chance of a
      harmless token mismatch per crossing**. It is not a probability of injury. With six crossings, the
      probability of no mismatch is (9/10)^6; at least one is 1 − (9/10)^6. The same assumptions with
      three crossings give 1 − (9/10)^3. Calculate both and state why doubling exposures can matter.


      Do not transfer these invented probabilities to the room. Smaller stacks may preserve view but increase
      trips. That tradeoff needs information about both effects; the arithmetic alone cannot choose the
      safest carrying method. Correlated encounters or changing conditions invalidate this independence
      model.


      ### Accessibility, harder work, and transfer


      A spoken route with labeled cards is equivalent to a drawn map. A helper may read conditions and
      record your chosen action without selecting it. No balance, carrying ability, or speed is being
      tested. Keep access supports rather than removing them to demonstrate independence.


      For a harder analysis, identify a safeguard that depends on a person remembering a check and compare
      it with one that removes the exposure. List its failure condition and who could notice it. Do not
      assume a hierarchy automatically settles every real case; feasibility and new harms still matter.


      For later transfer, select an ordinary low-consequence planning task you actually control and compare
      your proposed safeguard with what was usable. Stay outside electrical, machinery, fire, road, chemical,
      clinical, and other serious-risk activities. No real transfer is required to complete this fictional
      lesson, and a paper exercise cannot establish safe field performance.


      ### Interpret the result


      **Supportive:** The record distinguishes the six dimensions, a specific safeguard is verified, and
      new occupancy changes the next decision. **Mixed:** The plan is sensible but relies on a check no
      one can perform or shifts burden onto an access route. **Contradictory:** Missing permission or
      warning is ignored, or no observed incident is called proof of safety. **Inconclusive:** There is
      a score but no mechanism, owner, verification, or usable threshold.


      **Final review:** What changed the exposure, what remains unknown, and which new observation would
      invalidate proceeding? Completion is a bounded planning artifact, not a general safety qualification.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your attempts before opening check-answers.md. Both cases are fictional.


      ### Check A — A control that moves the problem


      A club''s paper display can be placed on Table X or Table Y. X is stable but blocks the only shared
      access aisle when the display is open. Y leaves the aisle clear but has not been checked for stability.
      You are allowed to use either table if suitable, but not to close the aisle. A volunteer says, “Put
      it on Y; nobody has complained, and we had no incidents last month.”


      Identify the hazard and affected people for both choices. Give separate entries for severity, likelihood,
      exposure, detectability, controllability, and mitigation. Select the next step without declaring
      unknown stability safe or treating the blocked aisle as acceptable. Specify who must verify what,
      a hold threshold, and what finding would permit a different decision. Is the month''s no-incident
      history enough to establish zero risk?


      ### Check B — Exposure and a failed warning


      For a harmless fictional sorting process only, each pass has independent mismatch probability 1/10,
      constant across passes. Compare the chance of at least one mismatch across three passes and six
      passes. Show the complement calculation, not 3/10 or 6/10 as an exact answer.


      A proposed detector notices a mismatch only after all passes finish. Explain whether that detector
      prevents the first mismatch, supports later correction, or establishes both. What changes if passes
      share one common labeling fault and are not independent? What would be wrong with using these invented
      probabilities to certify the physical route in the guide?


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      A fictional independent-event model gives each crossing a 0.2 chance of delay. Compare the chance
      of at least one delay across two and four crossings. Then explain why that calculation could mislead
      if every crossing is delayed by the same single road closure.'
