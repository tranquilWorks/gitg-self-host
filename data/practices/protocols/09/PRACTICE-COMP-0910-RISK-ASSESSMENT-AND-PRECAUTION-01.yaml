  - stable_id: PRACTICE-COMP-0910-RISK-ASSESSMENT-AND-PRECAUTION-01-A3
    sequence: 3
    title: Test the method without testing the harm
    instructions: 'Walk the safe route with a comfortable light load or rehearse the sequence with an
      empty box. Observe whether the safeguard can actually be followed and whether an unexpected interruption
      changes the decision. Record proceed, revise or stop and why. A trial without an incident does not
      prove that the risk is zero; retain the stop condition and identify when qualified help would be
      required.


      Observation checks: The trial does not deliberately create a hazard; The safeguard’s usability is
      observed; A changed condition can trigger stopping; No-incident evidence is not presented as proof
      of zero risk. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which safeguard changed exposure most, and what observation would make proceeding
      unreasonable despite the plan?


      Examples: Supportive: The participant split the load, kept the route visible and stopped when the
      path became occupied rather than relying on luck.


      Mixed: A sensible safeguard was chosen but proved too awkward to use consistently, prompting a simpler
      method.


      Contradictory: A dangerous condition was created to test courage, or another person’s safety was
      traded away without their authority.


      Inconclusive: A risk score was assigned without a hazard description, usable safeguard or stop threshold.'
