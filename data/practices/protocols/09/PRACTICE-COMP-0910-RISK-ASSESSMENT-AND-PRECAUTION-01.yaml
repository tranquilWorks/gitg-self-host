  - stable_id: PRACTICE-COMP-0910-RISK-ASSESSMENT-AND-PRECAUTION-01-A2
    sequence: 2
    title: Select safeguards and a stop condition
    instructions: 'Compare removing the hazard, changing the method and adding a simple check. For the
      default, clear only obstacles you may move, split the stack so the route remains visible, and wait
      when someone is crossing. State the condition under which you will not proceed, such as an uncleared
      route or a load you cannot comfortably manage. Consider whether a safeguard creates another burden,
      including access barriers for others.


      Observation checks: At least two kinds of safeguard are compared; The chosen method reduces a specific
      exposure; An observable stop condition is defined; The safeguard is checked for new risks and access
      barriers. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
