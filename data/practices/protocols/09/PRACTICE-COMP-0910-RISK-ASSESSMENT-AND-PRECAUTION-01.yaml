  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      A defensible plan uses an authorized, freshly checked alternative with a preserved view, or defers.
      It does not assume permission to move the assistive device. E1 allows only the bounded simulated
      move under the checked conditions. E2 requires a hold at S while the route is occupied. E3 remains
      on hold or requires a genuinely different authorized plan; the desire to finish supplies neither
      permission nor capacity.


      An occupancy check increases knowledge; a lower stack changes visibility; choosing C changes exposure
      to A and B; waiting changes timing. Name these distinct mechanisms. Another person''s access remains
      a constraint rather than a cost you may silently impose. If your record treats a hold as successful
      transfer, separate the decision result from the task result.


      ### Check A


      X''s known configuration obstructs shared access. Y''s unknown stability is a different unresolved
      condition, not evidence that Y is equally bad or safe. A proportionate next step is to leave the
      display unopened while an authorized person checks Y and its surrounding access. If Y is verified
      suitable, that addresses the specified concerns; if not, find another permitted arrangement or defer.


      For the six dimensions, reasonable entries include: possible collision, loss of access, or falling
      display as harms; severity described in relation to the actual setup rather than assigned a fabricated
      number; likelihood not quantified from the packet; exposure whenever users need the aisle or approach
      the table; detection before opening through inspection rather than after an incident; control limited
      to display placement and checks; mitigation by a verified suitable non-obstructing arrangement.
      Exact consequence judgments remain conditional because table dimensions and users'' circumstances
      are not supplied.


      Specify who can inspect, what evidence is needed, and a threshold such as “do not open while the
      aisle is blocked or stability remains unverified.” A no-incident month has an unknown denominator
      and may concern different conditions. It does not establish zero probability. The repair is not
      to demand absolute proof of no imaginable harm: it is to resolve the decision-relevant condition
      and use a proportionate reviewed method.


      ### Check B


      Three passes: 1 − (9/10)^3 = 271/1000 = 27.1%. Six: 1 − (9/10)^6 = 468559/1000000 = 46.8559%. Adding
      the per-pass probability counts overlapping multiple-mismatch possibilities more than once. The
      six-pass event is more likely under these stated assumptions, but it is not certain.


      An end-of-process detector can identify a mismatch for correction; it does not prevent its first
      occurrence. Whether correction succeeds needs a separate observation. With one common fault, the
      independence product is unjustified; dependence might change the combined probability and the packet
      does not specify enough to replace it with a new number.


      These are invented probabilities about token mismatches. They supply no measured injury rate, safe
      load, or professional clearance. If you used the arithmetic to select a real carrying method, retract
      that conclusion and identify the missing exposure, capability, and consequence evidence.


      ### Changed-case answer


      With independence, complements give 1−0.8²=0.36 and 1−0.8⁴=0.5904. The four-crossing route has greater
      modeled exposure. A shared closure violates independence, so multiplying complements is not justified
      by the marginal 0.2 alone. These are stipulated model probabilities, not measured local travel risk.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
