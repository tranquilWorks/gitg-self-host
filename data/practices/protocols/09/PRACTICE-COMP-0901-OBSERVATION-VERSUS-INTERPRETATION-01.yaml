  actions:
  - stable_id: PRACTICE-COMP-0901-OBSERVATION-VERSUS-INTERPRETATION-01-A1
    sequence: 1
    title: Sort the claim into its different parts
    instructions: 'Place the sending date and absence of a reply in observed. Put deliberate ignoring
      in interpreted. Record hurt separately as your reported feeling, not evidence of the other person’s
      intent. List delivery, availability, expectations and reasons in unknown. Underline predictions
      such as they will never reply and conclusions such as this friendship is over; neither becomes an
      observation simply because it feels certain.


      Observation checks: Events and reported feelings are distinguished; Motive claims are labeled as
      interpretations; Predictions and conclusions are not listed as facts; At least two relevant unknowns
      remain explicit. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
