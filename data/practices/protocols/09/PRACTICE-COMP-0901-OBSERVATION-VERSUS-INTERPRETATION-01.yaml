instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '09.01'
  title: 09.01 — Observation versus interpretation
  scored: false
  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Argument terminology](https://openstax.org/books/introduction-philosophy/pages/5-3-arguments)

      - [Selected bias terminology](https://openstax.org/books/psychology-2e/pages/7-3-problem-solving)

      - [Motivational reasoning — abstract-level consultation only](https://pubmed.ncbi.nlm.nih.gov/2270237/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### What you are practicing


      Separate what a record shows, what someone reports, and what you infer. Then ask a useful question
      and revise only the claims the reply actually addresses. You are not trying to eliminate interpretation:
      decisions need interpretation. You are making its basis and uncertainty visible.


      **Canonical scope:** Separate events and evidence from assumptions, stories, emotions, motives,
      predictions, and conclusions.


      **Deliverable:** An initial claim record, one clarification or explicitly labeled rehearsal, and
      an appended revision with a proportionate next action. Allow about 25 minutes for the supplied case.
      A live clarification may require a later return; do not invent a reply to finish on schedule.


      Use paper, a text editor, dictation, or a willing neutral reader. Everything needed for the fictional
      route appears here and in the separate check prompts. No account, purchase, personal disclosure,
      or actual recipient is required. This exercise is for learning, not a measure of your worth.


      ### A small reference you can use while working


      An **observation** describes something noticed under stated conditions: “The message log shows no
      reply at noon.” Its boundary matters. A missing reply in this log is not proof that no reply exists
      anywhere.


      A **report** is someone''s statement about an event or experience. “Sam said Lea was online” establishes
      that Sam made that report in this case; it does not independently establish what Lea was doing.
      Preserve the speaker and channel. Reports can be useful evidence without becoming direct observation.


      An **interpretation** supplies meaning, explanation, or motive: “Lea is trying to undermine me.”
      It may be plausible, but its confidence needs a reason. An **assumption** is a premise being taken
      for granted, such as believing Lea accepted the requested deadline. A **prediction** concerns what
      will happen. A **conclusion** is a judgment drawn from other claims. Neither becomes directly observed
      merely because it feels certain.


      An **emotion** is not a mistake to argue away. “I feel worried” can be an honest first-person report
      while “my worry proves Lea''s intent” makes an unsupported further inference. You may protect a
      boundary or seek help without first proving someone''s motive.


      An **unknown** names a question the available evidence does not settle. “I do not know whether the
      attachment opened” is more useful than a blank box or a forced optimistic explanation. Categories
      describe the role of a sentence; split a sentence that performs several roles.


      ### A different worked example


      A box is absent from its usual shelf. The stock sheet contains a return entry. You think someone
      stole it and feel annoyed. The bounded observations are that the shelf is empty when inspected and
      the sheet contains an entry. The actual return is supported by a record, not independently witnessed
      by you. Theft is one interpretation; a move or recording error could also fit. Annoyance is your
      reported experience. The location and cause remain unknown.


      A useful question is, “Where was the box placed when the return was recorded?” It seeks discriminating
      information, not a confession. If a reply names another shelf, inspecting that shelf may settle
      location. It does not retrospectively prove every earlier assumption about how the box moved.


      ### Complete practice packet: the chair-count request


      All people, records, and events below are fictional. Keep this packet as your only initial evidence.


      - **E1.** On Day 1 at 09:00, Alex''s message log records a message to Lea: “Can you confirm the
      chair count by Day 3 at noon? The proposed list is attached.” The log labels it sent. There is no
      delivery or read receipt.

      - **E2.** On Day 3 at noon, that same message thread displays no reply.

      - **E3.** Alex writes privately: “I feel worried and irritated.”

      - **E4.** Sam says, “I saw Lea online yesterday.” No screenshot or explanation of what “online”
      meant is provided.

      - **E5.** Alex remembers that Lea usually replies within two days. The packet contains no agreement
      by Lea to this deadline.


      The disputed account is: “I sent the list, so Lea definitely received and read it. She accepted
      the deadline. She is deliberately undermining me. My worry shows something is wrong with her attitude.
      She will never help, so the whole activity is doomed.”


      #### Action 1 — Preserve and sort the first account


      Copy the disputed account before revising it. Split it into its distinct claims. For each claim,
      fill in this record:


      `Claim | observed record or attributed report | interpretation/assumption/prediction/conclusion,
      if any | source ID | unknown that matters | what would clarify it`


      Write a separate line for Alex''s reported feelings. Use narrow wording: a sent label, for example,
      describes the display rather than everything that happened after sending. Include at least two relevant
      unknowns and explain why they affect the next action. Do not invent a benign motive to replace the
      hostile one.


      Before proceeding, check that a neutral reader could identify which sentence is supported by which
      E-number. Unsupported does not automatically mean false. Supported does not mean certain or complete.


      #### Action 2 — Design and carry out a fair clarification


      Write two different explanations compatible with the packet. They are candidates, not verdicts.
      Examples of questions to investigate include delivery, ability to open the list, availability, and
      whether a response deadline was agreed.


      Choose the unknown that most affects a practical next step. Draft one short question that asks for
      that information and allows an inconvenient answer. Do not demand an admission of bad intent. In
      a suitable live case, use an appropriate channel once and allow reasonable time. Do not monitor
      a person, repeatedly message them, or treat silence as an answer about motive.


      For this fictional route, write your question and mark it **rehearsal**. Only after saving it, read
      the reply packet below. You are not measuring whether your invented question caused this reply;
      the reply is supplied exercise material.


      #### Supplied reply packet — read after saving the first record and question


      - **R1.** On Day 3 at 12:20, Lea writes: “I saw the subject on my phone but could not open the attachment.
      I can confirm the list by Day 4 at 10:00 if you paste it into the message.”

      - **R2.** A screenshot supplied by Lea displays an attachment-opening error. It does not show every
      prior attempt or establish when the problem first occurred.


      #### Action 3 — Append a justified revision


      Keep your initial account. Add a revision row for each changed claim:


      `Earlier claim | new source | narrower revised claim | what remains unknown | next action and return
      point`


      Distinguish a reported explanation from independently established intent. A proposed future response
      time is not an already completed response or necessarily an agreement accepted by both parties.
      Choose a proportionate action that you control, such as sending the list in the requested format
      and deciding when to check the count. It is also legitimate to arrange an alternative if the actual
      activity needs an earlier count. State the timing constraint rather than accusing a motive.


      Record what Alex''s worry still points to: a count is needed and the earlier expectation was not
      met. Do not require the feeling to disappear in order to revise an inference. End with one sentence
      you can defend and one tempting sentence you still cannot defend.


      ### Check your understanding without copying the worked example


      Open **check-prompts.md** and write both attempts before opening **check-answers.md**. Save your
      response before opening the separate answer file. A reviewer may accept a different label when the
      sentence''s evidential role and limits are explained correctly.


      Your minimum useful artifact preserves the first account, identifies provenance, distinguishes the
      different claim types, asks a discriminating question, and appends a revision. Correct vocabulary
      without those operations is not enough.


      ### Accessibility and progression without changing the skill


      Use short claim cards, a reader who transcribes your words, audio, or a two-pass record: first “what
      supports this?”, then “what is added by me?”. Keep attribution and uncertainty even when using fewer
      columns. A helper may read or record; they should not decide the classification for you. Note any
      assistance.


      For a more demanding route, compare two attributed accounts that conflict. Identify exactly which
      claim conflicts and which additional observation could discriminate between them. Do not settle
      disagreement by counting repetitions of the same source. A second account is not necessarily an
      independent source.


      For a later transfer attempt, choose a different low-stakes context and make the first record before
      asking for clarification. Return when new information arrives. Record no reply honestly. Two successful
      examples remain bounded examples, not proof of unbiased judgment across life.


      ### How to interpret your result


      **Supportive:** The first accusation remains visible, the revised account distinguishes the log
      from Lea''s report, and the next action addresses the chair count without claiming a known motive.


      **Mixed:** The categories improve, but the person sends an accusation before clarifying or silently
      replaces the original account with the revised one.


      **Contradictory:** A guessed motive is relabeled objective evidence, or uncertainty is used to dismiss
      a credible safety concern.


      **Inconclusive:** There is a polished table but no preserved initial account, question, or revision.
      A fictional completion is evidence of this exercise only, not live relationship repair.


      Do not use this practice to challenge another person''s account of harm, delay urgent protection,
      or force direct contact in threatening or retaliatory circumstances. Select a different ordinary
      case or use appropriate support.


      **Final review:** Which claim changed, which source justified the change, and what would still be
      unfair to conclude?'
