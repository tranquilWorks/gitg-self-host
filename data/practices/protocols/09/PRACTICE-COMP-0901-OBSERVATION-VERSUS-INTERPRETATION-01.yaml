  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page with three columns: observed, interpreted, unknown. Default case: you sent
    a non-urgent message on Tuesday, received no reply by Thursday, felt hurt and concluded that the recipient
    was deliberately ignoring you. No actual recipient is required. Goal: Rewrite one disputed situation
    into observable facts, interpretations and genuine unknowns, then obtain one useful clarification.
    Scope: This practices an evidence distinction in one ordinary disagreement. It does not establish
    another person’s motives, erase feelings or adjudicate abuse. Time and effort: Twenty minutes for
    the record, one brief clarification or rehearsal, and ten minutes to revise it. Adaptation: Use speech-to-text,
    symbols or a trusted neutral reader. A fictional dispute tests classification and question design,
    not relationship repair. In threatening, abusive or retaliatory situations, use suitable support instead
    of direct contact. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use speech-to-text, symbols or a trusted neutral reader. A fictional dispute tests
    classification and question design, not relationship repair. In threatening, abusive or retaliatory
    situations, use suitable support instead of direct contact.
  expected_burden: Twenty minutes for the record, one brief clarification or rehearsal, and ten minutes
