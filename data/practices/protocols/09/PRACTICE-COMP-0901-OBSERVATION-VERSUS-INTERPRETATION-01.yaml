  - stable_id: PRACTICE-COMP-0901-OBSERVATION-VERSUS-INTERPRETATION-01-A3
    sequence: 3
    title: Revise only what the new evidence supports
    instructions: 'Add the reply or absence of one without deleting the first record. Move an item out
      of unknown only when new information addresses it. Write a proportionate next action, such as waiting
      until the agreed time, using another channel or adjusting expectations. Preserve unresolved hurt
      and uncertainty rather than demanding either a positive interpretation or a hostile verdict.


      Observation checks: New evidence is appended without rewriting the original; Only supported items
      change category; The next action fits the available information; Unresolved feelings and unknowns
      remain visible. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Which sentence changed category, what justified the change, and what would still be
      unfair to conclude?


      Examples: Supportive: The unanswered message remained a fact while the hostile-motive claim became
      uncertain; a direct clarification produced a specific response-time agreement.


      Mixed: The person separated facts and stories but still acted on the original accusation before
      checking an important unknown.


      Contradictory: A guessed motive was relabeled objective evidence, or the exercise was used to dismiss
      a credible safety concern.


      Inconclusive: Three columns were filled with synonyms for the same accusation and no clarification
      or labeled rehearsal occurred.'
