  - id: practice-answers
    title: Compare your responses
    body: 'Open after making your attempts. This file is not a formal review receipt. Different wording
      is acceptable when the evidential distinctions are preserved.


      ### Check A


      1. **Bounded observation:** the calendar displayed that status at the stated time. It does not by
      itself establish who changed it or why.

      2. **Unestablished inference about the actor:** no access log or first-person account in this packet
      identifies the person who changed the entry. Mark the actor unknown rather than asserting the opposite.

      3. **Attributed first-person report:** Robin reports embarrassment. Do not convert the feeling into
      proof of another person''s intent or treat it as disallowed because the motive is uncertain.

      4. **Attributed report containing a motive interpretation:** Pat made the allegation. The allegation''s
      occurrence is not independent verification of its content. A bare “fact” label misses this nested
      distinction.

      5. **Prediction:** the statement extends beyond the current room and time. The packet does not establish
      every future booking outcome.

      6. **Conclusion:** it draws a broad practical judgment from the cancellation and prediction. Other
      rooms or arrangements are not addressed by the packet.


      Useful unknowns include whether this was an error, which booking was cancelled, whether a replacement
      exists, who changed the entry, or what booking rule applied. A fair question is, “The Room C entry
      shows cancelled; can you clarify its current status and the available alternatives?” A question
      such as “Why are you excluding us?” assumes the disputed explanation.


      Embarrassment is a reported experience. Its presence does not settle the coordinator''s intent;
      uncertainty about intent does not erase the experience. The response can address both a practical
      booking need and how the cancellation affected Robin.


      **Repair:** When you wrote a motive as an observation, rewrite it as an attributed or personally
      held interpretation, name the missing evidence, and keep the underlying concern. Do not replace
      it with an equally unsupported reassuring story.


      ### Check B


      Initial record: the shelf was empty at 16:00 and the sheet contained no entry. “Quinn stole it”
      adds an actor, unauthorized taking, and intent beyond those observations.


      Revision: Morgan now observes the tool bearing the matching inventory number in Cabinet D. The staff
      member reports moving it during cleaning. The new observation establishes the tool''s observed location
      and identity at inspection; it supports the report''s plausibility without independently witnessing
      every step of the move. Quinn''s alleged theft remains unestablished.


      A practical next step is to restore the agreed storage/checkout record and, if the accusation was
      communicated, correct that accusation to the relevant recipients without spreading it further. A
      suitable correction is, “I found the tool in Cabinet D. My earlier claim about Quinn was not supported
      by the evidence I had.” Do not require a final explanation of every movement before acknowledging
      that evidential error.


      Keep the first account rather than rewriting it to “I always knew it was moved.” Finding the tool
      does not retroactively supply grounds for the original accusation. Equally, it is unnecessary to
      announce certainty about every person''s innocence to retract an unsupported specific claim.


      **Repair:** If your update says only “the problem is solved,” add the new observation, attribute
      the explanation, identify the remaining unknown, and address any harm from your earlier communication.


      ### Main practice self-audit


      E1 supports a sent-label claim, not a claim that the full attachment was read. E2 is bounded to
      that thread and time. E3 is a first-person report. E4 preserves Sam as the source and does not establish
      availability or motive. E5 is Alex''s memory, not Lea''s acceptance of the deadline.


      R1 supports saying that Lea reports seeing the subject and difficulty opening the attachment; R2
      corroborates the existence of a displayed error, with limited timing information. The requested
      Day 4 response remains future and conditional. A revision may reduce confidence in deliberate obstruction
      without asserting that intent has been conclusively ruled out.


      This audit is authored answer guidance. Live transfer, an independent cold-start learner review,
      and formal M6K acceptance remain separate evidence requirements.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
