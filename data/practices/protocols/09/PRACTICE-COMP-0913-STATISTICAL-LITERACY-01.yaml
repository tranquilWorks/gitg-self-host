  - stable_id: PRACTICE-COMP-0913-STATISTICAL-LITERACY-01-A2
    sequence: 2
    title: Examine selection, uncertainty and regression toward ordinary performance
    instructions: 'Ask how volunteers chose their group, whether experience differed and whether the same
      task was used. Five non-random observations per group do not settle a population effect or causation.
      Consider a person selected after an unusually slow 12-minute attempt who later takes 10 minutes:
      ordinary fluctuation could contribute, so improvement after selection alone does not identify a
      treatment effect. Name what repeated or better-sampled observations would help distinguish.


      Observation checks: Sampling and group comparability are questioned; Small-sample uncertainty is
      stated without invented precision; Correlation is not promoted to causation; An extreme-baseline
      regression explanation is considered. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
