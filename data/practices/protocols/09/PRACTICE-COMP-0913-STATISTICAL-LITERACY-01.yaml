  actions:
  - stable_id: PRACTICE-COMP-0913-STATISTICAL-LITERACY-01-A1
    sequence: 1
    title: Show the distribution and the effect rather than only the headline
    instructions: 'Calculate each group’s mean and median: A is 10 minutes and B is 8. Give the ranges,
      8–12 and 6–10, and note their overlap. The mean difference is two minutes, or 20 percent of A’s
      mean; this does not show that every individual improves by 20 percent. Sketch dots or list the values
      in order, then describe how a truncated axis or omission of spread could exaggerate the difference.


      Observation checks: Both center and spread are reported; The absolute and relative differences use
      the correct denominator; Overlapping observations remain visible; A misleading presentation choice
      is identified. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
