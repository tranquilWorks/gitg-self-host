meaning_and_fit:
  purpose: Describe a small distribution, distinguish absolute and relative effects, examine sampling
    and base rates, and state what an apparent association cannot establish.
  why_recommended: Describe a small distribution, distinguish absolute and relative effects, examine sampling
    and base rates, and state what an apparent association cannot establish.
  claims:
  - statement: Describe a small distribution, distinguish absolute and relative effects, examine sampling
      and base rates, and state what an apparent association cannot establish.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Statistical literacy practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Statistical literacy as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use counters, a calculator, an accessible table or spoken frequencies. Percentages
    are optional when clear counts convey the same distinction. Ask a qualified analyst to review consequential
    statistics; the supplied examples require no private dataset.
  opportunity_considerations: Two self-selected groups complete a harmless sorting task. Group A times
    are 8, 9, 10, 11 and 12 minutes; group B times are 6, 7, 8, 9 and 10. A headline says the new method
    makes everyone 20 percent faster. A separate classifier flags 18 items, of which 8 truly need review,
    from a batch of 100 containing 10 true review cases.
