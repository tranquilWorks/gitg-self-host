  - stable_id: PRACTICE-COMP-0913-STATISTICAL-LITERACY-01-A3
    sequence: 3
    title: Check a base-rate claim and rewrite the conclusion
    instructions: 'For the classifier, compute the true-case base rate as 10 out of 100 and the fraction
      of flags that are true as 8 out of 18, about 44 percent. It detects 8 of the 10 true cases, or 80
      percent, but those are different denominators. Rewrite the sorting headline to report the observed
      two-minute group mean difference and unresolved causes. State what the data support, what they do
      not, and which decision should wait for stronger evidence.


      Observation checks: The base rate uses all 100 items; Detection rate and the truth fraction among
      flags are distinguished; The revised headline reports a bounded effect; Unsupported individual and
      causal conclusions are removed. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which denominator or missing comparison most changed the apparent meaning of the headline?


      Examples: Supportive: The participant reported means of 10 and 8, retained overlapping ranges and
      distinguished 80-percent detection from roughly 44-percent true flags.


      Mixed: The averages were correct, but self-selection or the different classifier denominators were
      missed.


      Contradictory: A group average was claimed for every person, or association from a tiny selected
      sample was presented as causal proof.


      Inconclusive: The headline was accepted without calculating an effect, examining spread or identifying
      a denominator.'
