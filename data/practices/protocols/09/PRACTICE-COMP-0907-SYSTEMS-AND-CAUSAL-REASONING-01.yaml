  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the low-stakes default of a shared meeting agenda that keeps growing. Draw boxes for requests,
    organizer triage, agenda slots, meeting length and unresolved items. Use paper, an accessible diagram
    tool or a spoken sequence. A private simulation is sufficient when you do not control the real process.
    Goal: Map components, handoffs, feedback, delays and incentives, then test one plausible leverage
    point while keeping alternative causes visible. Scope: A causal diagram is a hypothesis about one
    system, not proof that its arrows are true. The exercise does not authorize experiments on unwilling
    people or essential services. Time and effort: Twenty minutes to map a routine, one small authorized
    change over three opportunities, and fifteen minutes to review. Adaptation: Describe the loop aloud
    or use labeled cards instead of a visual diagram. Analyze only a process you may observe and change.
    Use synthetic requests when work, family or organizational confidentiality prevents a live test. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Describe the loop aloud or use labeled cards instead of a visual diagram. Analyze
    only a process you may observe and change. Use synthetic requests when work, family or organizational
    confidentiality prevents a live test.
  expected_burden: Twenty minutes to map a routine, one small authorized change over three opportunities,
    and fifteen minutes to review.
