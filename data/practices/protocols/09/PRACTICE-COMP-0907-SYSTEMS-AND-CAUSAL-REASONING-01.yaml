    title: Draw the components and the handoffs that matter
    instructions: 'Connect requests to triage, triage to slots, slots to meeting length, and unresolved
      items back to later requests. Label what moves across each interface and who is authorized to decide.
      Note the delay between a request and a meeting, and an incentive such as rewarding quick acceptance
      of every request. Distinguish observed links from guessed ones with different labels rather than
      drawing every arrow as established fact.


      Observation checks: Components and interfaces have concrete labels; At least one delay and one incentive
      are shown; A feedback loop is traced back to its start; Observed and hypothesized links are distinguishable.
