meaning_and_fit:
  purpose: Map components, handoffs, feedback, delays and incentives, then test one plausible leverage
    point while keeping alternative causes visible.
  why_recommended: Map components, handoffs, feedback, delays and incentives, then test one plausible
    leverage point while keeping alternative causes visible.
  claims:
  - statement: Map components, handoffs, feedback, delays and incentives, then test one plausible leverage
      point while keeping alternative causes visible.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Systems and causal reasoning practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Systems and causal reasoning as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Describe the loop aloud or use labeled cards instead of a visual diagram.
    Analyze only a process you may observe and change. Use synthetic requests when work, family or organizational
    confidentiality prevents a live test.
  opportunity_considerations: Use the low-stakes default of a shared meeting agenda that keeps growing.
    Draw boxes for requests, organizer triage, agenda slots, meeting length and unresolved items. Use
    paper, an accessible diagram tool or a spoken sequence. A private simulation is sufficient when you
    do not control the real process.
  prerequisites:
  - Use the low-stakes default of a shared meeting agenda that keeps growing. Draw boxes for requests,
    organizer triage, agenda slots, meeting length and unresolved items. Use paper, an accessible diagram
    tool or a spoken sequence. A private simulation is sufficient when you do not control the real process.
  dependencies: []
  safe_alternatives:
  - Describe the loop aloud or use labeled cards instead of a visual diagram. Analyze only a process you
    may observe and change. Use synthetic requests when work, family or organizational confidentiality
    prevents a live test.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Systems and causal reasoning differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Systems and causal reasoning
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
