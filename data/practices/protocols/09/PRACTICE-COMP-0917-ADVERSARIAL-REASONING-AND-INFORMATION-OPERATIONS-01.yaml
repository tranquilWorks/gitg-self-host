    title: Choose a proportionate response and preserve a correction path
    instructions: 'Record verified, contradicted or unresolved for each claim. Do not forward the screenshot
      while uncertain. For a confirmed impersonation, use the platform or organization’s appropriate reporting
      route without contacting or targeting a suspected individual. If you previously shared the claim,
      correct it to the same audience with the verified information and clear limits. Explain what evidence,
      not emotional intensity, determined the next action.


      Observation checks: Each claim receives its own evidence status; Unverified content is not amplified;
      Reporting avoids harassment and speculative attribution; A prior mistaken share has a correction
      route. Mark only what you observed. Missing, mixed and negative results are valid; a deferred action
      is not completed.


      Final review: Which check was genuinely independent of the original narrative, and what would still
      be speculation about intent or coordination?


