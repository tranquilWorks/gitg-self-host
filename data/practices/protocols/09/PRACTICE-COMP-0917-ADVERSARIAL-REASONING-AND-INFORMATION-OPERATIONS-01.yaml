    sequence: 1
    title: Extract the claim and inspect the persuasion rather than joining it
    instructions: 'State separately the alleged closure, deadline and payment request. Note urgency, threatened
      loss, missing context and strategic ambiguity about who issued the notice. Describe who could benefit
      if people act, without asserting that this proves a fraud or a particular actor. Treat three copies
      of one screenshot as one source chain, not three independent confirmations.


