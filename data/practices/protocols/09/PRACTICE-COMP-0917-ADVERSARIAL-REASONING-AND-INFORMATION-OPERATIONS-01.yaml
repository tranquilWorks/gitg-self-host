  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      H1''s permanent whole-hall closure claim is contradicted as stated by N1, which expressly specifies
      a temporary North Studio closure and denies permanent closure. W1 independently supports South Room
      being in use during its recorded interval on Day 6. It does not verify every room or every future
      date.


      The required rescue-payment claim and its claimed official deadline are unsupported by H1''s authority
      and contradicted by N1''s explicit payment statement. This finding does not establish whether anyone
      paid, where money would have gone, or who operated the post. The packet contains no payment-account
      investigation.


      A1, A2, and A3 add copies, not independent confirmation. P1 uses a separate contact route but repeats
      N1; it helps establish that the notice is current within this fictional case, not a second independently
      observed event. W1 has its own observation basis. Its independence does not expand its scope.


      The text uses selective cropping, identity pressure, urgency, an ambiguous scope of closure, a demand
      to act, and framing that preemptively dismisses a likely correcting source. Those are reasons to
      inspect the message; they do not establish a specific operator, motive, or coordinated campaign.
      The factual contradiction can be reported without pretending those additional facts are known.


      A bounded draft correction is: “The full Day 4 notice specifies North Studio cleaning on Day 6 from
      10:00 to 12:00, not permanent hall closure. It says no rescue payment is required. South Room was
      independently recorded in use at 12:10 on Day 6. I do not know who created the cropped post.” Shorter
      corrections may omit the witness while retaining the essential scope and payment distinction.


      Repair a weak answer by replacing a global verdict with one row per claim and by separating an independent
      route from an independent observation. No actual message, payment, or contact occurred in this exercise.


      ### Check A — A genuine change inside an exaggerated story


      The pottery class at the specified Day 9 time is cancelled according to the complete notice. “All
      classes indefinitely” goes beyond that notice and conflicts with the independently recorded reading-group
      session. The two blogs repeat K and add no new observation. The group''s attendance record independently
      supports one session having occurred; it does not establish every class''s status.


      A suitable correction preserves the pottery cancellation while limiting the broader story: “The
      notice cancels the Day 9 pottery class at 14:00; the reading group did meet at 16:00. It does not
      announce indefinite cancellation of all classes.” The selective quote and broad narrative are inspectable
      features. Deliberate intent and operator identity remain unestablished.


      Do not react to misleading framing by dismissing its true fragment. That would create a different
      inaccurate message and could send someone to a genuinely cancelled class.


      ### Check B — Repetition is not attribution


      The venue schedule independently corroborates Room D for Day 10 within the supplied packet. The
      six account posts share one announcement, so they are not six independent observations. Dependence
      reduces the number of independent evidence chains; it does not make an otherwise corroborated fact
      false.


      Ordinary supporters copying an announcement, coordinated volunteers, one scheduling service, or
      automation could all produce similar timing and wording. The packet cannot distinguish them. Automation
      would not itself establish a hostile controller, and identical text is not a reliable identity proof.


      Use the verified room schedule for the bounded planning decision. Record the attribution as unresolved
      and do not identify, contact, or target private people. A credible factual update can coexist with
      an unsupported allegation about the people who shared it.'
    criteria:
