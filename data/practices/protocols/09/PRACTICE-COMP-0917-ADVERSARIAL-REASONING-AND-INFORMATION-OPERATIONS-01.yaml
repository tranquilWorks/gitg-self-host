      ### Check A — A genuine change inside an exaggerated story


      Post K says, “All community classes are cancelled indefinitely. Nobody can attend anything.” It
      quotes only “cancelled” from a notice. The complete notice, dated Day 8, says, “The pottery class
      scheduled for 14:00 on Day 9 is cancelled because its instructor is unavailable. The reading group
      at 16:00 on Day 9 remains scheduled.” Two local blogs quote Post K without adding records. A reading-group
      organizer independently shows the group''s dated Day 9 attendance record: a session occurred at
      16:00.


      Separate the true bounded cancellation from the broader claims. Trace which records add independent
      information. Write a correction that does not falsely restore the cancelled pottery class, guarantee
      all future classes, or claim that K''s operator deliberately deceived people. Which manipulation
      mechanisms are apparent from the text, and which actor claims remain unknown?


      ### Check B — Repetition is not attribution


      Six public accounts post identical wording within ten minutes and all link to one organizer''s announcement.
      You have no account-control data. The announcement states that a room changed from B to D on Day
      10; the venue''s independently issued Day 10 room schedule confirms D. One commentator says the
      identical posts prove that all six accounts are automated and controlled by a hostile group.


      Distinguish the room-change claim, source dependence, and the commentator''s attribution. Give at
      least two explanations compatible with the repeated text. State what can responsibly be concluded
      without investigating private identities. Does the fact that reposts depend on one source make the
      confirmed room change false? What information-use decision follows?'
