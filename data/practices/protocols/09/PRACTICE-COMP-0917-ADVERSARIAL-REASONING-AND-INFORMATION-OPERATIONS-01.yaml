  - id: file-later-packet-md
    title: Later packet
    body: 'Open after saving your claim map and independent checking plan. All records are fictional.
      The entire packet contains no newer contradictory notice.


      **N1 — complete public hall notice, issued Day 4:** “North Studio is closed on Day 6 from 10:00
      to 12:00 for cleaning. The South Room remains available from 12:00 to 17:00. Normal North Studio
      bookings resume after 12:00. The hall is not closing permanently. We are not collecting rescue payments
      through social-media posts. No payment is required in connection with this temporary cleaning closure.”


      **P1 — reply from the venue''s previously recorded contact route, Day 6 at 09:00:** “Please see
      notice N1. It is our current notice.” The staff member supplies no observation independent of that
      notice and no information about who created H1.


      **W1 — a volunteer''s own attendance record, Day 6:** “I entered South Room at 12:10 and attended
      its scheduled session until 12:40.” The volunteer did not inspect North Studio, interview H1''s
      operator, or examine payment accounts. This record was created from the volunteer''s visit, not
      by copying N1 or H1.


      N1 and P1 share an underlying notice. W1 is a separate observation with narrower scope. Count independence
      for the exact claim, not merely by the number of channels.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Purpose and a useful finish


      Examine a consequential message without joining its pressure to act. Separate factual claims from
      emotional framing, trace where apparent confirmation comes from, and check a claim through routes
      that do not depend on the message itself. You are practicing defensive verification, not designing
      a persuasion campaign or identifying secret enemies.


      **Canonical scope:** Recognize propaganda, deception, selective evidence, narrative warfare, coordinated
      manipulation, and strategic ambiguity.


      Your deliverable is a claim-by-claim verification record, a source-dependence map, and a proportionate
      decision about sharing, acting, or correcting. Allow 25–35 minutes. Use paper, dictation, or a text
      editor. All messages and records below are fictional, with no live links, payment destination, real
      account, or actual recipient. No purchase, contact, posting, account creation, or external investigation
      is required.


      ### Reference: inspect mechanisms without inventing intent


      **Propaganda and narrative framing** try to shape how a situation is understood, often by repeatedly
      connecting facts, identities, heroes, and threats. An emotionally framed message is not false merely
      because it is persuasive; inspect its specific claims. “Narrative warfare” here means competing
      strategic stories intended to influence interpretation, not permission to treat disagreement as
      warfare or people as targets.


      **Deception** concerns misleading another person. A demonstrably inaccurate statement can be identified
      without knowing whether its author misunderstood, copied carelessly, or deliberately deceived. Keep
      factual error and inferred intent separate.


      **Selective evidence** can make a true fragment support a false overall impression by omitting date,
      denominator, location, qualification, or contrary context. Ask for the complete record rather than
      only a more attractive summary.


      **Coordinated manipulation** involves organized influence rather than independent agreement. Similar
      text, a burst of reposts, or an account''s unfamiliarity may justify checking dependence; they do
      not by themselves prove a common controller, bot, foreign actor, or malicious plan. Shared sources
      and ordinary copying are alternatives. This practice never requires identifying private people behind
      accounts.


      **Strategic ambiguity** leaves important meanings or authority unclear while encouraging a definite
      action: “the venue is closing” may omit which room, when, for how long, and who decided. Ambiguity
      can also be accidental. Ask what the message commits to, not merely what it invites you to assume.


      An **independent channel** is useful only to the extent that its evidence is independent for the
      claim being checked. Two sites quoting one notice are not two independent observations. An official
      source can have relevant authority without settling every question; a witness can observe a particular
      event without knowing future policy. Lateral checking means leaving the suspect message''s own route
      to inspect relevant outside evidence. The source notes identify the limited background consulted.


      ### Different worked example: a library hour changes


      A post says, “They have taken away all library access.” Its attached crop reads “closed.” The full
      dated notice says the meeting room is closed from 09:00 to 10:00 while the main library remains
      open. That notice contradicts the broad claim for the stated interval, but does not establish the
      poster''s motive or whether another uninspected notice exists.


      A second blog repeating the same crop adds distribution, not an independent closure observation.
      A person who visited the main library at 09:30 adds an independent observation of access at that
      time, not a guarantee of every service forever. Correct the claim''s scope before arguing about
      character.


      ### Complete practice packet: the community hall message


      Treat the following as the entire fictional initial packet. “Day 6” is a case label, not today''s
      date.


      **H1 — message seen on Day 5:** “THE HALL CLOSES PERMANENTLY TOMORROW. Real supporters must act
      now. Send a 20-unit rescue payment through this post''s payment button by 18:00 today. Everyone
      is confirming it. Officials will deny it because they want you to stay passive.” A cropped image
      contains the words “North Studio” and “CLOSURE,” but shows no date or complete sentence. The payment
      button is described only; it is not provided or usable.


      **A1, A2, A3 — three reposts:** Each reproduces H1''s image and wording. A1 says it copied H1; A2
      credits A1; A3 credits H1. No repost provides a new observation, document, or explanation of authority.


      **Initial unknowns:** Who operates H1 is not established. No account-control records, transfer records,
      internal communications, or interview with its author are supplied. The venue has a known public
      notice board and a contact route recorded before this message. Their complete responses are in the
      later packet.


      #### Action 1 — Split the claims and map the pressure


      Preserve the initial message privately without publishing it. Create separate rows for permanent
      whole-hall closure on Day 6, a required rescue payment, the payment deadline, and the assertion
      of independent confirmation. Treat “real supporters” and the preemptive dismissal of officials as
      framing, not independent evidence for closure.


      Use this form:


      `Claim | exact scope/time | requested action | original source | copies or new evidence | missing
      context | possible incentive, explicitly hypothetical | current status`


      Draw or write the chain `A2 -> A1 -> H1` and `A3 -> H1`. State why the four appearances cannot be
      counted as four independent confirmations. Explain which scope is missing from the crop and how
      the preemptive dismissal might discourage a useful check. Do not infer a named culprit or insist
      that all members who shared it participated knowingly.


      Consider possible incentives without turning them into facts: payment collection, attention, advocacy,
      misunderstanding, and ordinary copying can motivate different parts of the chain. The packet does
      not identify which occurred. Your verification task can succeed while motive remains unknown.


      #### Action 2 — Choose independent routes before seeing the answers


      Write two checks that do not use H1''s described button or embedded contact route. For this fictional
      case, request the complete dated venue notice through the already-known board and a bounded observation
      or record from someone who independently used the venue. Specify what each could and could not establish.


      For a live public claim, use a known official address or a previously established contact route,
      not a route supplied by the suspicious message. Inspect the actual date, place, wording, and authority.
      Do not submit credentials, money, or personal records merely to “test” a message. If the only alleged
      independent confirmation copies the same source, record that limitation instead of manufacturing
      a second witness.


      Save your source map and questions, then open **later-packet.md**. Reading the supplied records
      is a simulation of verification, not evidence that you actually contacted a venue or investigated
      an account.


      #### Action 3 — Assign statuses at the level the evidence supports


      For each factual claim, use **supported within this packet**, **contradicted as stated**, or **unresolved**,
      with the exact supporting record and its boundary. Distinguish an official notice, a phone reply
      that repeats it, and a direct visit observation. Evidence of a room being open at a specified time
      cannot establish every future arrangement.


      Record a safe next action: withhold the unsupported payment request; avoid amplifying the crop;
      use an appropriate official or platform reporting channel when a genuine incident warrants it; and
      correct a prior mistaken share to the same affected audience with verified scope and limits. Do
      not contact suspected operators, collect private identities, encourage a pile-on, or turn uncertainty
      into an accusation.


      Keep a correction focused on the useful fact, not a dramatic repetition of the false demand. For
      the case, draft a short correction containing the affected room, date interval, the actual payment
      policy in the notice, and one remaining unknown. Drafting is not sending.


      ### Fresh checks and completion


      Complete both cases in **check-prompts.md** before opening **check-answers.md**. The checks deliberately
      include a true operational change amid misleading broad framing, and apparent repetition that cannot
      establish secret coordination. This is not a game in which the most suspicious verdict wins.


      A useful completion includes the separated claims, source chain, two proposed verification routes,
      later-record assessment, and a reasoned correction or non-sharing decision. Naming six manipulation
      terms without applying them to the evidence is incomplete. The canonical live verification indicator
      remains unestablished by fictional records alone.


      ### Accessibility, progression, privacy, and boundaries


      Use a reader, accessible official channel, librarian, text transcript, or trusted support person.
      Preserve dates and source attribution when summarizing. Do not share account passwords with a helper.
      A read-aloud answer selected by you differs from a helper deciding the verdict.


      For a more demanding route, add a genuine second observation that conflicts with the notice. Ask
      whether its time, service, and location match before calling either source dishonest. A later change
      can explain a conflict without proving either earlier record was fabricated. Maintain a claim-specific
      uncertainty record.


      For later transfer, choose a low-stakes public claim and document the actual independent check,
      including a failed attempt or unavailable record. Do not move into private-account investigation,
      harassment, intrusion, political targeting, or security incident response outside your role. This
      guide teaches recognition and verification, not how to exploit an audience or run influence operations.


      **Supportive:** The learner recognizes copied-source repetition, uses complete records, withholds
      the unsupported payment demand, and leaves actor identity and intent unknown.


      **Mixed:** Sharing is withheld, but the claimed second source is merely another copy, or the correction
      overstates what one visit establishes.


      **Contradictory:** A suspicion becomes a public identity accusation, or the message''s own payment
      route is used to verify its authority.


      **Inconclusive:** The post is called propaganda solely because it feels objectionable, with no claim
      decomposition, provenance, or independent checking plan.


      **Final review:** Which observation is independent for which claim, what did the missing context
      change, and what would still be speculation about coordination or intent?'
