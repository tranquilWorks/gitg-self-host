  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '09.04'
  title: 09.04 — Source and evidence evaluation
  scored: false
  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [S1 — Contextual authority](https://www.ala.org/acrl/standards/ilframework)

      - [S2 — Study limitations](https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-25)

      - [S3 — Intellectual humility: abstract-level consultation](https://dukespace.lib.duke.edu/dspace/handle/10161/23967)

      - [S3 — Intellectual humility: abstract-level consultation](https://pubmed.ncbi.nlm.nih.gov/28903672/)

      - [S4 — Forecast verification](https://jwgfvr.github.io/forecastverification/)

      - [S5 — Probability and decisions](https://www.metoffice.gov.uk/research/weather/ensemble-forecasting/decision-making)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### What you will produce


      An evidence audit of one exact claim, a confidence judgment with reasons, and a decision about what
      you may responsibly repeat. Allow 35–45 minutes. Use paper, a text editor, dictation, or a willing
      reader. The fictional source packet below supplies everything required; no subscription, account,
      or outside search is necessary.


      **Canonical scope:** Assess expertise, incentives, methodology, sample quality, replication, uncertainty,
      and competing explanations.


      This practice asks what the evidence warrants, not whether an author is a good person. The background
      on contextual authority and study limitations is identified as S1 and S2 in SOURCES.md. All packets,
      calculations, and checks here are original instructional examples. They are not actual studies.


      ### A usable reference


      Start with the claim, not a trust score for the website. Specify the population, comparison, outcome,
      and time period. An author can have relevant practical expertise yet provide weak evidence for a
      causal conclusion. A financial interest is a reason to inspect methods and reporting, not proof
      that the conclusion is false.


      **Methodology** concerns how the comparison and measurements were produced. **Sample quality** concerns
      who and what was observed, who was missing, and whether those observations support the intended
      generalization. More respondents do not repair a mismatch between a question and the behavior claimed.
      People in one shared session also do not supply independent repetitions of the whole intervention.


      **Replication** requires a new investigation or dataset appropriate to the claim. A second article
      reporting the first study is not a second study. An independent reader''s reanalysis can identify
      errors, but it does not add new participants. Keep these contributions distinct.


      A limitation should change a particular conclusion. Missing an allocation procedure weakens a causal
      comparison; missing a follow-up limits a durability claim. Neither automatically proves no effect.
      Good evaluation allows a narrow supported statement inside a broader unsupported headline.


      ### Different worked example — a reading lamp


      A seller says a new lamp improves reading speed. Eight volunteers choose it, read different passages
      than the comparison group, and say they like it. A newsletter repeats the seller''s account. The
      supplied information supports a report about those volunteers'' stated preference, not a measured
      speed gain. Different passages and self-selection are competing explanations. The newsletter does
      not add replication. The seller''s interest warrants scrutiny but cannot, by itself, establish that
      the lamp is ineffective.


      A useful request is for timed reading on comparable passages with a documented allocation method.
      Asking for a more impressive biography would not repair the missing measurement.


      ### Complete packet — the meeting-format headline


      All organizations, people, and records below are fictional. Treat supplied counts as accurate for
      this exercise, but do not fill unreported facts with guesses.


      **Card A — advertisement, Day 6.** The facilitator writes: “Our new format doubles actual participation
      for all members.” A paid training course is offered below the claim. The advertisement links to
      Report R1.


      **Card B — original Report R1, Day 5.** The facilitator has five years of meeting-facilitation experience.
      The report does not establish training in study design. Fifty-two club members were invited to choose
      between two sessions on Day 4. Twelve chose the new format; forty chose the old format. There was
      one session per format, both run by the facilitator. No allocation by chance, baseline participation
      measure, or later follow-up is reported. Both sessions used this exit question: “During this session,
      did you feel able to contribute?” It is a yes/no self-report, not a count of actual contributions.


      | Format | Selected members | Returned responses | Yes responses | Missing responses |

      | --- | --- | --- | --- | --- |

      | New | 12 | 10 | 10 | 2 |

      | Old | 40 | 40 | 20 | 0 |


      The two missing new-format responses have no known values or reasons. The report defines its comparison
      as the proportion answering yes **among returned responses**. Recruitment covers this club only.
      No other dataset or independent replication is supplied.


      **Card C — newsletter, Day 7.** A writer repeats the advertisement and cites R1. The writer collected
      no observations and states no independent method. This is another publication of the same evidence.


      **Card D — volunteer audit, Day 8.** A reader recomputes R1''s fractions and points out the two
      missing forms. The reader has no connection to the paid course but uses exactly R1''s data. This
      provides an independent arithmetic check, not a new intervention study.


      #### Action 1 — Trace the claim and its support


      Preserve the headline. Write two distinct claims beneath it: the descriptive statement R1 can directly
      address and the causal/general claim the advertisement makes. Fill this record:


      `Exact claim | population and time | outcome actually measured | comparison denominator | primary
      evidence | relevant expertise | incentive | unknowns`


      Draw or write the source chain: advertisement, newsletter, and audit back to R1. Count underlying
      datasets separately from publications. Explain what the facilitator''s experience helps establish
      and what it does not. Do not infer dishonesty, incompetence, or independence of data from a person''s
      role alone.


      #### Action 2 — Inspect the comparison, not just the headline


      Calculate each returned-response percentage and their ratio. Then examine the missing forms: calculate
      the new group''s possible yes fraction among **all selected members** if both missing answers were
      no, and if both were yes. Label these as missing-response bounds, not confidence intervals or estimates
      of a causal effect. The actual two answers are still unknown.


      For each of the seven canonical dimensions, write a finding and its consequence for the claim:


      `Expertise | incentives | methodology | sample quality | replication | uncertainty | competing explanations`


      Consider self-selection, the single session per format, and the difference between feeling able
      to contribute and actually contributing. Give at least two plausible alternatives to the advertised
      explanation. A plausible alternative is not an established cause either.


      Finally separate two kinds of repair. Better reporting could reveal a missing form or clarify recruitment.
      A new design or new observations would be needed to measure actual contributions or test whether
      the format caused a change. An exact count of participants cannot substitute for these missing steps.


      #### Action 3 — Give a bounded judgment and act on it


      Use this response form:


      `What I may repeat | what I should not repeat | confidence and reasons for this particular claim
      | important remaining uncertainty | evidence that would change the judgment | information-use decision`


      Choose a suitable judgment such as “supported for this narrow descriptive claim,” “uncertain,” “unsupported
      as stated,” or “contradicted by the supplied record.” Explain it; do not combine unrelated dimensions
      into a made-up precision score. You may have high confidence that the report lacks a behavior count
      while remaining uncertain whether the format actually helps.


      State the smallest relevant next evidence, not just “more research.” For example, a documented count
      of contributions would address measurement; a comparable allocation process and repeated sessions
      would address different design weaknesses. No single repair necessarily resolves all limitations.


      Decide whether to share a narrowed statement, seek clarification, or decline to repeat the headline.
      An optional live route uses an accessible original report on an ordinary topic and preserves the
      same record. An inaccessible original remains an access limitation; a summary alone must not be
      called a completed primary-report audit.


      ### Check and correct


      Complete Check A and Check B in `check-prompts.md` before opening `check-answers.md`. The key explains
      the calculations, allowable conclusions, and common repairs. You may keep the reference visible
      while attempting the checks. A correct verdict without its evidence trail is insufficient.


      ### Accessibility and progression


      A reader may transcribe the cards and calculations at your direction. Use a calculator, spoken source
      chain, or one audit dimension at a time. Preserve the denominators and source dependence even when
      simplifying the layout. Record help without treating access support as an error.


      For a harder route, use a paper with several outcomes. Identify which outcome was highlighted, whether
      its analysis was specified beforehand, and whether multiple reports reuse the same participants.
      Ask for suitable specialist help when the method exceeds your understanding; mark that limitation
      instead of manufacturing confidence.


      Later, evaluate another low-stakes claim from a different context. Preserve the audit before discussing
      it with someone. A live audit demonstrates this particular evaluation; it does not establish general
      resistance to misinformation or scientific expertise.


      ### Interpreting the result


      **Supportive:** The source chain and denominators are correct, measurement and selection limits
      change the stated conclusion, and a narrower information-use decision follows.


      **Mixed:** Incentives are noticed and the percentages are right, but the newsletter is counted as
      replication or the exit question is treated as a behavior measure.


      **Contradictory:** The author is believed solely for prestige, rejected solely for financial interest,
      or failure to show a causal benefit is declared proof of no benefit.


      **Inconclusive:** There is a trust label without the exact claim, original method, denominator,
      or evidence-based judgment.


      Do not use this educational audit as the sole basis for medical, legal, financial, or safety-critical
      decisions. Choose an ordinary claim within your competence.


      **Final review:** Which limitation most changed what you would repeat, and which tempting conclusion
      is still beyond the evidence?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your answers before opening the separate key. All data are fictional. Attribute each claim
      and show denominators rather than relying on a trust label.


      ### Check A — Two websites, one survey


      An event organizer advertises: “Our layout causes people to stay twice as long.” The only original
      record is survey P: twelve people chose the new room and twelve chose the old room. Six in the new
      room and all twelve in the old room returned a form. All six new-room respondents and six old-room
      respondents said, “I would like to stay longer.” Nobody timed actual stays. There is one session
      per room and no baseline. Two websites repeat P; neither collects data. The organizer sells layout
      consulting. A reviewer with no financial link recalculates P but collects no new data.


      Calculate the yes rates among respondents. Bound the new-room yes fraction among all twelve selected
      people when the six missing answers are unknown. Explain the difference between a missing-response
      bound and a statistical confidence interval. State how many underlying datasets exist. Address expertise,
      incentive, method, sample, replication, uncertainty, and at least two alternatives. Write one justified
      descriptive statement and one reason not to repeat the causal headline. Does the financial interest
      prove that the claim is false?


      ### Check B — Better evidence is not a guarantee


      Team Q, which sells a meeting timer, uses a documented random-number procedure to allocate forty
      volunteers to each of two formats. A preregistered outcome is “at least one recorded contribution
      in the session.” Every participant has a recorded outcome. Counts are 24/40 for the new format and
      16/40 for the old. Team R, with no connection to Q, recruits new volunteers, uses the same protocol,
      and records 22/40 versus 18/40. Observers can see the format. Each team studies one club and measures
      one session per participant; no durable change or other population is measured. No uncertainty analysis
      beyond the counts is supplied.


      Compute the within-team percentage-point differences. Identify what improves relative to Check A
      and which limitations remain. Is R only another publication or a new investigation? Does preregistration
      or random allocation prove a universal benefit? Is Q''s incentive alone a reason to discard the
      counts? Give a claim-specific confidence judgment and a next evidence request without asserting
      statistical significance that you have not calculated.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Open after making your attempts. These answers concern the supplied fictional evidence, not
      validation of an intervention or independent acceptance of your work.


      ### Main practice


      Among returned forms, the new group has 10/10 = 100% yes and the old group 20/40 = 50% yes. The
      ratio of those response proportions is 2. It is not a doubling in the number of actual contributions.
      Among all twelve selected new-format members, the possible yes fraction ranges from 10/12 (about
      83.33%) to 12/12 (100%). These are bounds from two missing binary responses. They do not describe
      sampling uncertainty, a population parameter, or causation. Relative to the old group''s 50%, the
      possible selected-member ratio ranges from 5/3 to 2.


      There is one underlying dataset, R1. The newsletter republishes it; the volunteer independently
      checks its arithmetic. Neither is a new study. Relevant facilitation experience and a financial
      incentive are separate facts, not automatic acceptance or rejection rules.


      Self-selection could produce groups that differed before the sessions. Session-specific events or
      expectations could affect answers. The outcome measures a reported sense of opportunity, not observed
      participation. These alternatives are plausible, not demonstrated causes. The club sample and absence
      of follow-up limit population and durability claims. The single session per format also prevents
      treating the individual questionnaires as repeated tests of the format across sessions.


      A defensible statement is: “In this report, 10 of 10 new-format respondents and 20 of 40 old-format
      respondents said they felt able to contribute; two new-format forms were missing.” The causal claim
      about actual participation for all members is unsupported as stated. That conclusion does not prove
      the format has no benefit.


      A recovered form would narrow missing-response bounds. A behavior measure would address the outcome
      mismatch. Comparable allocation, repeated sessions, independent new data, and follow-up address
      other questions. Avoid promising that any one addition fixes all of them.


      ### Check A


      Respondent yes rates are 6/6 = 100% and 6/12 = 50%. The new-room selected-member yes fraction can
      be anywhere from 6/12 = 50% to 12/12 = 100%. The six missing answers cannot be silently removed
      or set to yes. The bounds simply enumerate their possible values; they are not a confidence interval.


      There is one dataset, P, despite two websites and a reanalysis. Expertise beyond running the event
      is not established. Consulting revenue warrants examination but does not prove dishonesty or a false
      result. Self-selection, missing responses, session differences, and expectations can affect the
      reported preference. Actual duration was not measured at all.


      A justified statement describes the returned-form responses and missingness. The headline about
      caused duration changes is not supported. Better reporting might recover forms, but timed comparable
      observations and an appropriate comparison design would be needed for the stronger claim.


      **Repair:** If you wrote “twice as long,” replace it with the actual survey outcome and its denominator.
      If you wrote “three independent sources,” draw all publications back to P. If you rejected the evidence
      solely for the incentive, identify the methodological limitation instead.


      ### Check B


      Q''s rates are 60% versus 40%, a 20-percentage-point difference. R''s are 55% versus 45%, a 10-percentage-point
      difference. “Percentage points” refers to subtraction of percentages, not a relative percent increase.


      Documented random allocation, a specified recorded behavior, complete outcome capture, and a separately
      recruited new investigation address important weaknesses in A. R supplies new evidence, not just
      another report of Q. A shared protocol does not make the participants the same. Q''s commercial
      interest remains worth disclosing; it does not erase the design or settle the truth.


      Both datasets favor the new format descriptively. Their uncertainty, observer awareness, limited
      club populations, single-session measurement, and absence of durability evidence remain relevant.
      Preregistration and random allocation do not guarantee flawless execution, measurement, or generalization.
      A judgment can be more favorable than for A without claiming a universal or statistically established
      effect.


      A reasonable next request is the prespecified analysis with an appropriate uncertainty estimate
      and details of how observers recorded contributions, followed by evidence in additional contexts
      or later sessions if the claim includes those contexts or durability. Do not manufacture a p-value,
      call the difference “significant” without analysis, or demand certainty before acknowledging stronger
      evidence.


      **Repair:** Keep improved design, observed differences, and remaining uncertainty in separate sentences.
      Neither reflexive dismissal nor unqualified acceptance is the target.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
