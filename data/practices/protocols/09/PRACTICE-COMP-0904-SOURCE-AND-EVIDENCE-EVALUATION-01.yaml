  - stable_id: PRACTICE-COMP-0904-SOURCE-AND-EVIDENCE-EVALUATION-01-A2
    sequence: 2
    title: Examine what the comparison can establish
    instructions: 'Inspect recruitment, group assignment, measurement, missing observations and the comparison
      condition. In the default, volunteers may already be more willing to participate, the question may
      measure satisfaction rather than behavior, and the groups may have differed beforehand. Ask whether
      another team repeated the result and whether an equally plausible explanation fits. List which uncertainties
