  actions:
  - stable_id: PRACTICE-COMP-0904-SOURCE-AND-EVIDENCE-EVALUATION-01-A1
    sequence: 1
    title: Trace the exact claim and the author’s position
    instructions: 'Rewrite doubles participation into a measurable statement: twice what behavior, over
      what period, compared with whom? Record what expertise is relevant and what is merely a title. Describe
      the organizer’s financial incentive without assuming dishonesty. For a live report, locate the original
      study or methods rather than relying on a summary; missing provenance remains a finding.


      Observation checks: The headline becomes a bounded measurable claim; Relevant expertise is distinguished
      from prestige; Incentives are disclosed without deciding truth by motive; The primary report or
      its absence is identified. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
