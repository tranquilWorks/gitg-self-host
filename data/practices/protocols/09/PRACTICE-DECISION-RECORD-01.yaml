  independence_rule: Planning aids may help structure the record, but evidence stores no helper identity
    and distinguishes self-directed, planning-aid, and guided support.
  context_transfer_rule: Evidence concerns one decision and its review trigger; it does not establish
    judgment quality across domains or show that the resulting choice was correct.
  repetition_rule: Each decision record has one immutable origin; later updates append to that origin
    and duplicate event application is rejected.
  recency_rule: The action rules use an explicit 60-day bound; an update outside that bound is stale rather
    than silently treated as retained skill.
