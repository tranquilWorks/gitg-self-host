meaning_and_fit:
  purpose: Create a private minimum-metadata record before a reversible choice, preserve its original
    predictions and assumptions, and append a later process update.
  why_recommended: Create a private minimum-metadata record before a reversible choice, preserve its original
    predictions and assumptions, and append a later process update.
  claims:
  - statement: Knowing an outcome can distort evaluation of what was foreseeable before the outcome, so
      preserving a prospective record can support a more bounded review.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-DECISION-OUTCOME-BIAS
    limitations: Outcome-bias research does not prove that a single record improves judgment, remove bias,
      or fit high-stakes, privileged, regulated, or collective decisions.
  - statement: Create a private minimum-metadata record before a reversible choice, preserve its original
      predictions and assumptions, and append a later process update.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Is there one freely chosen, reversible, low-stakes decision due soon enough
    to record beforehand and review within 30 days without storing sensitive or third-party information?
  not_applicable_behavior: Mark not applicable or defer without penalty when no suitable prospective decision
    exists or recording it would create privacy, legal, employment, relational, or safety risk.
  readiness_considerations: Use symbols, voice input transcribed to neutral codes or a trusted planning
    aid with privacy preserved. A wholly synthetic decision rehearses the format but is not evidence of
    a real prospective choice. Defer when no suitable decision remains unresolved or documentation could
    create risk.
  opportunity_considerations: 'Use a private page or local document and a low-stakes choice not yet made.
    Default: choose between two optional reading sessions, coded A and B. Record only a neutral category,
    option codes, objective, up to three assumptions, a bounded outcome prediction, confidence band, date
    and review trigger. Keep narrative and other people’s details out.'
  prerequisites:
  - 'Use a private page or local document and a low-stakes choice not yet made. Default: choose between
    two optional reading sessions, coded A and B. Record only a neutral category, option codes, objective,
    up to three assumptions, a bounded outcome prediction, confidence band, date and review trigger. Keep
    narrative and other people’s details out.'
  dependencies: []
  safe_alternatives:
  - Use symbols, voice input transcribed to neutral codes or a trusted planning aid with privacy preserved.
    A wholly synthetic decision rehearses the format but is not evidence of a real prospective choice.
    Defer when no suitable decision remains unresolved or documentation could create risk.
  role_conditions:
  - Workplace, fiduciary, legal, clinical, safeguarding, and collective decisions must follow applicable
    authority, documentation, retention, privilege, and professional requirements instead of this protocol.
  pathway_conditions:
  - Voice input, symbols, checkboxes, a screen reader, a trusted planning aid, or a paper template may
    be used if privacy and user control are preserved.
  worldview_conditions:
  - The review may include duties, relationships, tradition, collective consequences, uncertainty, and
    practical constraints; it does not require maximizing one numeric utility.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 30
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private page or local document and a low-stakes choice not yet made. Default: choose between
    two optional reading sessions, coded A and B. Record only a neutral category, option codes, objective,
    up to three assumptions, a bounded outcome prediction, confidence band, date and review trigger. Keep
    narrative and other people’s details out. Goal: Create a private minimum-metadata record before a
    reversible choice, preserve its original predictions and assumptions, and append a later process update.
    Scope: This enriches the existing decision-record protocol without changing its typed evidence, action
    identities or completion rules. It excludes consequential, regulated, privileged and sensitive decisions.
    Time and effort: About thirty to forty-five minutes across a prospective draft, a five-minute preservation
    step and a review within thirty days. Adaptation: Use symbols, voice input transcribed to neutral
    codes or a trusted planning aid with privacy preserved. A wholly synthetic decision rehearses the
    format but is not evidence of a real prospective choice. Defer when no suitable decision remains unresolved
    or documentation could create risk. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Omit names, contact details, secrets, credentials, allegations, legal privilege,
    health details, protected work information, financial account data, sensitive third-party detail,
    and the substantive contents of the decision. Store only allowlisted criterion IDs and neutral codes
    in typed evidence; artifact contents never enter evidence. Do not use the record to monitor another
    person, justify predetermined harm, or substitute for qualified advice.
  expected_burden: About thirty to forty-five minutes across a prospective draft, a five-minute preservation
    step and a review within thirty days.
  action_count_rationale: null
  foreseeable_misuse:
  - Reconstructing an original prediction after learning the result, or treating a good outcome as proof
    that the process was sound.
  - Recording sensitive content, using the template for surveillance, or applying it to a decision requiring
    qualified, collective, or emergency judgment.
  exclusions:
  - Legal, clinical, safeguarding, emergency, high-consequence financial, credential, privileged, regulated,
    or protected-employment decisions.
  - Decisions controlled by another person or decisions whose documentation could create retaliation,
    discovery, security, or confidentiality risk.
  actions:
  - stable_id: PRACTICE-DECISION-RECORD-01-A1
    sequence: 1
    title: Draft the record before selecting an option
    instructions: 'Create the allowed fields while both options are still live. For the default, category
      is reading, objective is one uninterrupted section, assumption A1 is a quiet room is available,
      and the prediction is completed, partly completed or not completed by the review. Add low, medium
      or high confidence with a private reason. Represent a counterargument only as a neutral assumption
      or option code; do not store another person’s words or identity.


      Observation checks: The record exists before the choice; Option codes objective and bounded assumptions
      are present; A prediction confidence band and review trigger are recorded; The record contains no
      names secrets or sensitive third-party detail. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15 minutes
    due_within_days: 5
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DECISION-RECORD-01
      action_stable_id: PRACTICE-DECISION-RECORD-01-A1
      competency_stable_id: '09.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 60
      competency_measurement_ids:
      - prospective_record_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: prospective_record_criteria
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - created_before_choice
        - option_codes_present
        - objective_present
        - assumptions_bounded
        - prediction_bounded
        - confidence_band_present
        - review_trigger_present
      - measurement_id: minimum_metadata_check
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - neutral_category_only
        - no_names
        - no_secrets
        - no_sensitive_third_party_detail
      - measurement_id: sensitive_content_exposed
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DECISION-RECORD-01-A2
    sequence: 2
    title: Seal the choice-time version and schedule its review
    instructions: 'When choosing, add the selected code and date. Preserve a read-only copy, dated paper
      copy or other permitted snapshot so later outcome information cannot replace the initial prediction
      and assumptions. Schedule the review trigger within thirty days. Label a genuine clerical correction
      separately; do not rewrite uncertainty, dissent or expectations to make the eventual result look
      foreseeable.


      Observation checks: The chosen option code and decision date are added; The original prediction
      and assumptions remain intact; The review trigger is actually scheduled; Any mechanical correction
      is separately labeled. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 5 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DECISION-RECORD-01
      action_stable_id: PRACTICE-DECISION-RECORD-01-A2
      competency_stable_id: '09.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 60
      competency_measurement_ids:
      - prospective_snapshot_preserved
      transfer_disposition: context_bound
      measurements:
      - measurement_id: prospective_snapshot_preserved
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - choice_code_added
        - decision_date_added
        - original_prediction_preserved
        - original_assumptions_preserved
      - measurement_id: review_trigger_scheduled
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: hindsight_rewrite_detected
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - reviewed_artifact
        expected: true
  - stable_id: PRACTICE-DECISION-RECORD-01-A3
    sequence: 3
    title: Append the outcome and one future process change
    instructions: 'At the trigger, add a separate layer with completed, partly completed, not completed
      or unresolved outcome status. Mark each assumption supported, contradicted or unknown and choose
      one process change for the next comparable decision. Compare decision quality with outcome quality:
      a reasonable choice can turn out badly, and a weak process can be lucky. Submit only the application’s
      existing allowlisted observations, never the record’s content.


      Observation checks: The outcome update is separate from the prospective layer; Assumptions receive
      supported contradicted or unknown dispositions; One next process change follows the comparison;
      Artifact contents and identifying details stay outside evidence. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: What did the outcome reveal about the process that was knowable at choice time, and
      what remains luck or uncertainty?


      Examples: Supportive: The original moderate-confidence prediction stayed intact, one assumption
      was contradicted, and a separate update changed the next information-gathering step.


      Mixed: The record was prospective and private, but the later review mixed process quality with whether
      the outcome felt favorable.


      Contradictory: A prediction was rewritten after the result, or private decision content was copied
      into application evidence.


      Inconclusive: A past decision was reconstructed from memory and presented as a prospective record.'
    expected_time: 15 minutes
    due_within_days: 30
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DECISION-RECORD-01
      action_stable_id: PRACTICE-DECISION-RECORD-01-A3
      competency_stable_id: '09.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 60
      competency_measurement_ids:
      - decision_update_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: decision_update_criteria
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - outcome_status_added
        - assumptions_revisited
        - unknowns_preserved
        - one_process_update_selected
        - prospective_layer_unchanged
      - measurement_id: outcome_process_distinguished
        kind: conceptual
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        criteria:
        - outcome_not_equated_with_process
        - hindsight_limit_acknowledged
      - measurement_id: update_used_to_target_person
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  adaptations:
    low_resource:
    - Use a paper card kept privately or an offline file; no paid decision tool, cloud account, or data
      sharing is required.
    accessibility:
    - Use symbols, voice input transcribed to neutral codes or a trusted planning aid with privacy preserved.
      A wholly synthetic decision rehearses the format but is not evidence of a real prospective choice.
      Defer when no suitable decision remains unresolved or documentation could create risk.
    cultural_context:
    - Include collective duties and relational consequences in the chosen objective while recording only
      the participant's authorized portion of the decision.
    resource_variants:
    - Use symbols, voice input transcribed to neutral codes or a trusted planning aid with privacy preserved.
      A wholly synthetic decision rehearses the format but is not evidence of a real prospective choice.
      Defer when no suitable decision remains unresolved or documentation could create risk.
  pause_conditions:
  - Pause if the decision becomes urgent, high stakes, contested, privileged, regulated, emotionally unsafe,
    or no longer controlled by the participant.
  stop_conditions:
  - Stop and delete the draft through the participant's normal safe method if it contains sensitive information
    or creates retaliation, discovery, confidentiality, or security risk.
  escalation_conditions:
  - Use the responsible organizational, safeguarding, security, legal, financial, or emergency channel
    when the choice exceeds a private low-stakes record.
  professional_referral_conditions:
  - Obtain appropriately qualified advice for legal, clinical, financial, fiduciary, regulated, or other
    high-consequence decisions; this protocol is not a substitute.
