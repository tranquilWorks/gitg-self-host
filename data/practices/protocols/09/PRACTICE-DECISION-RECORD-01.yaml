  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [R1 — Risk identification, controls, and review](https://www.hse.gov.uk/simple-health-safety/risk/steps-needed-to-manage-risk.htm)

      - [R2 — Practical judgment and particulars](https://classics.mit.edu/Aristotle/nicomachaen.6.vi.html)

      - [R3 — Prospective plans and transparent changes](https://www.cos.io/initiatives/prereg)

      - [R4 — Descriptive location](https://www.itl.nist.gov/div898/handbook/eda/section3/eda351.htm)

      - [R5 — Fitted regression](https://www.itl.nist.gov/div898/handbook/pmd/section1/pmd141.htm)

      - [R6 — Sampling variability and spread](https://openstax.org/books/introductory-statistics-2e/pages/2-7-measures-of-the-spread-of-the-data)

      - [R7 — Blocking and experimental comparisons](https://www.itl.nist.gov/div898/handbook/pri/section3/pri332.htm)

      - [R8 — Statistical versus causal quantities](https://www.ncbi.nlm.nih.gov/books/NBK588337/)'
  - id: file-outcome-packet-md
    title: Outcome packet
    body: 'Open after saving the initial record and selected option. This is simulated evidence, not an
      event in your calendar.


      On Day 1 at 12:00, a new notice announces a room closure covering Day 3. The packet stipulates that
      the closure decision and notice did not exist at Day 0''s choice time. On Day 3 the person learns
      of the closure before starting, uses the home fallback, and has two separate 15-minute reading periods
      because of an interruption. The 45-minute available block itself remains available. No uninterrupted
      30-minute section occurs.


      At Day 7 review, code the outcome and assumption dispositions, retaining both the original choice
      and the fallback. Do not rewrite the selected choice-time option as B. Distinguish partial reading
      activity from meeting O1 in full. Consider one useful process change while acknowledging which closure
      information could not have been checked on Day 0.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: "### The skill and its boundary\n\nPreserve what you knew before choosing, then append what\
      \ happened without rewriting the first record. Review both the result and the process that produced\
      \ the choice. A reasonable decision can have a disappointing outcome; a weak process can be lucky.\n\
      \n**Canonical scope:** Document important choices, predictions, assumptions, dissent, review dates,\
      \ and outcomes.\n\n**Deliverable:** A prospective-style decision record, a preserved choice-time\
      \ copy, a separate review, and one specific improvement to the next decision process. Allow roughly\
      \ 35 minutes for the fictional route. A real route uses a genuinely undecided low-stakes choice\
      \ and an actual later review within 30 days. Writing a suggested review date in this lesson does\
      \ not create a reminder or schedule anything in your accounts.\n\nKeep the detailed decision record\
      \ private. Do not upload names, narratives, quotes from others, secrets, or the record itself merely\
      \ to demonstrate this exercise.\n\n### A compact record can retain disagreement without retaining\
      \ identities\n\nSeparate four layers. **Before choice:** the objective, live options, assumptions,\
      \ prediction, uncertainty, and a counterargument. **At choice:** the selected option and date. **After\
      \ choice:** any separately labeled clerical correction. **At review:** the observed outcome, assumption\
      \ dispositions, and a future process change.\n\nEncode dissent as a neutral counterargument or assumption\
      \ code, not someone else's identity or words. For example, A2 can mean “the session may be interrupted.”\
      \ That concern deserves consideration whether it came from your own reflection or another person.\
      \ Do not flatten disagreement into an unexplained yes/no approval field.\n\nA preserved copy supplies\
      \ comparison, not magical proof of authenticity. A dated paper copy or ordinary local file version\
      \ can help. A hash can detect changed bytes when compared with a trusted earlier hash, but a person\
      \ controlling both files can replace both. Do not call a freshly recomputed hash an independent\
      \ timestamp or tamper-proof human review.\n\nThe general distinction between a prospective plan\
      \ and later deviations is supported as background by [R3](?resource=sources). This private practice\
      \ is not a public research registration, an evidence upload, or a validated decision-improvement\
      \ intervention.\n\n### A different worked example: two storage plans\n\nBefore choosing a personal\
      \ note-storage arrangement, someone records that retrieval matters more than appearance, that one\
      \ location may be unavailable during cleaning, and that the next check is on Day 5. They choose\
      \ the simpler location with moderate confidence. A one-off closure later makes retrieval inconvenient.\n\
      \nThe review should inspect what was knowable at choice time, not simply say “bad outcome, bad decision.”\
      \ If the closure was announced before choice and ignored, that suggests a missed information check.\
      \ If it was first announced afterward, it is a different finding. Both outcomes can prompt a useful\
      \ contingency without pretending the original information was the same.\n\n### Complete fictional\
      \ choice packet — stop before the later outcome file\n\nAt **Day 0, 10:00**, the decision-maker\
      \ has not selected a reading session. The neutral objective **O1** is to complete one uninterrupted\
      \ 30-minute section within a 45-minute available block on Day 3.\n\n| Option | Choice-time facts\
      \ |\n| --- | --- |\n| A | A room is confirmed bookable for the block; a current notice designates\
      \ it quiet; no closure notice appears in the supplied choice-time material |\n| B | A home space\
      \ is available; the same block overlaps a known ordinary interruption window; uninterrupted time\
      \ is uncertain |\n\nThe person prefers A for the uninterrupted-reading objective, while acknowledging\
      \ that a designation is not a guarantee of silence. Both options are optional and reversible. There\
      \ is no purchase, duty to attend, or effect on another person's access.\n\nThe maximum three assumption\
      \ codes are **A1: room remains available**, **A2: interruptions do not prevent O1**, and **A3: the\
      \ 45-minute block remains available**. Counterargument **A2** points to a vulnerability of even\
      \ the preferred option. Use confidence words such as low, moderate, or high, with a reason kept\
      \ only in your private working notes. The planned review is **Day 7, 10:00**, earlier if the outcome\
      \ becomes impossible to determine or a material assumption changes.\n\nThe later result is in **outcome-packet.md**.\
      \ Do not open it until you have saved the first record and choice. These files are separately stored,\
      \ not access-controlled. Opening them early does not make you a bad learner; label the exercise\
      \ retrospective rather than claiming a prospective prediction.\n\n#### Action 1 — Write the minimum\
      \ useful record before selecting\n\nUse this private template:\n\n`Record code | neutral category\
      \ | objective code | live option codes | up to three assumption codes | counterargument code | predicted\
      \ status | confidence band | record date | review date or trigger`\n\nFor the supplied packet, category\
      \ is reading, options are A/B, and the allowed prediction statuses are completed, partly completed,\
      \ or not completed. Unresolved is a possible review status, not a claim that a completed outcome\
      \ was observed. Record what would count as the objective being met: an uninterrupted 30-minute section\
      \ in the defined block.\n\nAdd a short private reason for your confidence only where your chosen\
      \ local record method permits it; do not copy that reason into any application observation field.\
      \ The machine fixture supplied with this lesson uses neutral codes only. It is an optional teaching\
      \ example, not a record of an actual decision.\n\nBefore proceeding, explain how A2 could matter.\
      \ A record that lists only supporting assumptions can conceal a known weakness even when its final\
      \ choice is reasonable. Do not invent a probability unsupported by the packet.\n\n#### Action 2\
      \ — Preserve the choice-time version and establish the review\n\nAt the actual choice point, add\
      \ the selected code and choice date without changing the original expectation. Preserve that version\
      \ separately using a dated paper copy or an appropriate local snapshot. For the fictional route,\
      \ write “Day 0, 10:05; A selected; rehearsal.” That is simulated chronology, not evidence of actual\
      \ elapsed time.\n\nFor a real route, use an actual permitted calendar or local reminder method and\
      \ verify it exists. For the fictional route, record only the intended Day 7 review. Arrange your\
      \ own feasible reminder if needed.\n\nA clerical correction should identify the original field,\
      \ corrected value, reason code, and date in a separate layer. If “A chosen” was accidentally transcribed\
      \ as B, preserve both entries and identify it as a correction. Do not use a clerical correction\
      \ to change a prediction because the outcome became known. A late reconstruction must be labeled\
      \ late.\n\n#### Action 3 — Append an evidence-bounded review\n\nNow open the later packet. Make\
      \ a separate record:\n\n`Original record reference | review date | outcome status | assumption-code\
      \ dispositions: supported / contradicted / unknown | known-before versus learned-after distinction\
      \ | next-process-change code | next check`\n\nKeep the initial copy intact. Supported means the\
      \ later evidence supports that assumption in the stated trial; it is not a universal truth. Contradicted\
      \ means the assumed condition did not hold for the trial; it does not prove someone lied at choice\
      \ time. Unknown is an honest result where evidence is missing.\n\nEvaluate process quality before\
      \ congratulating or blaming the outcome. Did the original record include relevant available evidence,\
      \ a feasible alternative, a counterargument, and a review? What information could reasonably have\
      \ been checked before choosing? Which new fact could not have been obtained then from this packet?\n\
      \nChoose one concrete change such as “recheck room availability on the session day,” not “be smarter.”\
      \ A contingency can be worthwhile without proving that the earlier decision was irrational. Do not\
      \ announce that this change improves every decision; it addresses one observed vulnerability.\n\n\
      ### Privacy and evidence are part of the task\n\nUse neutral labels; keep third-party content, identity,\
      \ and consequential matters outside this exercise. A simple assumption code can preserve a concern\
      \ without exposing a person. The action is preserving and reviewing the record, not collecting more\
      \ private detail.\n\n The supplied example and its technical checks do not establish that you made\
      \ a prospective decision record. They test the example's structure. Do not infer that passing them\
      \ grants completion credit or changes any historical score.\n\n### Accessibility and progression\n\
      \nUse large-print cards or dictated neutral codes. A helper may transcribe under your privacy constraints\
      \ without choosing or revising the substance. Record assistance where appropriate. A spoken note\
      \ transcribed later is retrospective unless the original recording was actually preserved before\
      \ choice.\n\nFor a harder route, compare two records with identical choice-time information and\
      \ opposite outcomes. Ask whether their original process ratings should change merely because of\
      \ the outcome. Then introduce one relevant pre-choice warning into only one record; explain why\
      \ that changes the evaluation. Hold the information set fixed when testing outcome bias.\n\nFor\
      \ later transfer, use another real low-stakes undecided choice, preserve it before acting, and perform\
      \ its actual review. A fictional sequence or reconstructed memory cannot establish that prospective\
      \ behavior. Do not select a sensitive decision merely to make the exercise feel more important.\n\
      \n### Interpret the result\n\n**Supportive:** Initial uncertainty and the counterargument survive,\
      \ the outcome is appended, and a specific process change follows the evidence. **Mixed:** The record\
      \ is preserved but outcome quality is mistaken for proof of process quality. **Contradictory:**\
      \ The prediction is rewritten after the result or private content is uploaded into evidence. **Inconclusive:**\
      \ There is a retrospective story but no actual pre-choice version or clearly labeled rehearsal.\n\
      \n**Final review:** What did you know at choice time, what became known later, and what would a\
      \ future reviewer need to distinguish a learning update from rewritten history?"
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '### Check A — Same information, different result


      Two fictional records have identical pre-choice facts, a documented uncertainty, the same reasonable
      objective, the same options, and the same selected option. Both were preserved before acting. Record
      X later reports completed; record Y reports not completed because of an event explicitly first announced
      after the choice.


      May you conclude that X''s choice-time process was better solely from these outcomes? Write a separate
      outcome review and one possible future contingency for each without changing the original expectation.
      Now add a new fact: Y actually had a relevant warning available before choosing and omitted it from
      consideration. Explain what changes in the process review and why this is not just punishing bad
      luck.


      ### Check B — Audit an altered and over-detailed record


      A fictional learner''s original dated copy predicts partly completed with moderate confidence. The
      later copy says completed with high confidence and contains a collaborator''s name, private quotation,
      and exact personal circumstances. The learner says the change was only a clerical correction because
      the task ultimately succeeded. There is no separate change log. Another field says “review planned,”
      but no actual reminder was created for the real route.


      Identify the distinct failures. Propose a repair that preserves the original, accurately labels
      what happened, avoids claiming retroactive scheduling, and keeps identifying material out of application
      evidence. Explain why hashing only the later copy cannot prove that its prediction existed before
      the outcome.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '### Main practice and later packet


      A can be a reasonable choice under the supplied objective and current notice; its selection does
      not mean uninterrupted reading was certain. Preserve moderate or otherwise reasoned confidence and
      the A2 counterargument. The packet''s selected example uses A, Day 0, 10:05, with a Day 7 review;
      those are fictional values, not a performed calendar action.


      At review, **partly completed** is appropriate for the activity with O1 not fully met: there were
      two 15-minute periods, not the required uninterrupted 30-minute section. A1 is contradicted for
      the session because the room was unavailable. A2 is contradicted for the attempted fallback because
      interruption prevented O1. A3 is supported because the block remained available. Note the changed
      context for A2 rather than asserting that the unavailable room was noisy. There is no observation
      of reading inside that room.


      The closure notice did not exist at choice time. Do not claim it should have been read then. A same-day
      recheck and an explicit fallback are defensible future process changes. The initial A selection
      stays intact; B is recorded as a later fallback, not as a revised prediction about what was always
      intended. No digest or fixture may substitute for existing production evidence semantics.


      ### Check A


      Different realized outcomes do not alone distinguish the two identical original information-processing
      sequences. Record X''s success and Y''s failure honestly, then inspect whether either reveals a
      useful contingency for future choices. A contingent review need not change the original process
      rating.


      The added pre-choice warning breaks the identical-information premise. Omitting a relevant available
      warning is now evidence about Y''s process, independent of whether the eventual outcome happened
      to be good or bad. Explain what a proportionate earlier check could have changed. Do not require
      predicting unknowable events as the standard for a reasonable decision.


      ### Check B


      Changing the original forecast and confidence after seeing success is a substantive revision, not
      a demonstrated transcription correction. Preserve the genuine earlier copy. Append the actual outcome
      and a correction record explaining that the later forecast was not prospective. If the original
      cannot be recovered, mark that limit; do not manufacture a replacement with an earlier date.


      Remove identifying material from any proposed submission and use minimal neutral codes in the practice
      copy. Avoid making further copies of private quotations. Existing application evidence must remain
      within its own allowlist; the source template does not expand it. The real reminder was only planned,
      so acknowledge it was not scheduled at the claimed time. A future review can be scheduled prospectively
      without inventing past execution.


      A hash of today''s file shows today''s byte fingerprint. Without an independently preserved earlier
      reference it does not establish when the claims were written or prevent replacing both file and
      hash. Repair the provenance claim rather than presenting technical-looking evidence as a substitute
      for chronology.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
