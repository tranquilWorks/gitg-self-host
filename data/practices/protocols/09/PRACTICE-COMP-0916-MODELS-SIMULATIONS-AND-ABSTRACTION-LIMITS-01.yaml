    their validated purpose.
  actions:
  - stable_id: PRACTICE-COMP-0916-MODELS-SIMULATIONS-AND-ABSTRACTION-LIMITS-01-A1
    sequence: 1
    title: State the model’s purpose and what it leaves out
    instructions: 'Write the formula and predict three items as fourteen minutes and six items as twenty-three.
      Explain the setup and per-item terms. List omitted factors such as item size, special handling,
      interruptions, access needs and fatigue. Define the intended use as a rough planning estimate for
      similar ordinary items, not a rule that a person should work at a prescribed speed.


      Observation checks: The formula and two predictions are recorded; Parameters have plain-language
      meanings; At least three omitted factors are named; The intended use and excluded uses are explicit.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0916-MODELS-SIMULATIONS-AND-ABSTRACTION-LIMITS-01
      action_stable_id: PRACTICE-COMP-0916-MODELS-SIMULATIONS-AND-ABSTRACTION-LIMITS-01-A1
