meaning_and_fit:
  purpose: Use a purposeful simplification, document its assumptions, test sensitivity and compare withheld
    observations before deciding where the model may be used.
  why_recommended: Use a purposeful simplification, document its assumptions, test sensitivity and compare
    withheld observations before deciding where the model may be used.
  claims:
  - statement: Use a purposeful simplification, document its assumptions, test sensitivity and compare
      withheld observations before deciding where the model may be used.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Models, simulations, and abstraction limits practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Models, simulations, and abstraction limits as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a calculator, accessible table or spoken arithmetic. The supplied synthetic
    data remove any need to time yourself or collect others’ performance. Keep models away from worth,
    disability judgments and decisions outside their validated purpose.
  opportunity_considerations: 'Synthetic packing model: time in minutes equals five minutes of setup plus
    three minutes per item. Training examples are two items in eleven minutes and four items in seventeen.
    Holdout examples, to inspect only after writing predictions, are three items in fifteen minutes and
    six items in thirty-one when one item required special handling.'
  prerequisites:
  - 'Synthetic packing model: time in minutes equals five minutes of setup plus three minutes per item.
    Training examples are two items in eleven minutes and four items in seventeen. Holdout examples, to
    inspect only after writing predictions, are three items in fifteen minutes and six items in thirty-one
    when one item required special handling.'
  dependencies: []
  safe_alternatives:
