      gather more observations. Preserve the original version and describe why the revised model still
      needs independent validation.


      Observation checks: Holdout errors are calculated without refitting first; Contradictory observations
      are retained; The domain of use is narrowed or revised for a reason; A revised model is not declared
      validated on its own fitting data. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What did the model deliberately omit, and which observation showed that an omission
      mattered for its intended use?


