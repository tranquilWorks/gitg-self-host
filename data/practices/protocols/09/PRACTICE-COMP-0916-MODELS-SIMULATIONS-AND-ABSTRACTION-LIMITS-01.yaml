  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Synthetic packing model: time in minutes equals five minutes of setup plus three minutes per
    item. Training examples are two items in eleven minutes and four items in seventeen. Holdout examples,
    to inspect only after writing predictions, are three items in fifteen minutes and six items in thirty-one
    when one item required special handling. Goal: Use a purposeful simplification, document its assumptions,
    test sensitivity and compare withheld observations before deciding where the model may be used. Scope:
    The model predicts a harmless routine’s duration. It is not an authority over a person’s capacity
    and cannot justify medical, financial, engineering or safety-critical decisions. Time and effort:
    Thirty to forty-five minutes with paper and a calculator or a simple spreadsheet. Adaptation: Use
    a calculator, accessible table or spoken arithmetic. The supplied synthetic data remove any need to
    time yourself or collect others’ performance. Keep models away from worth, disability judgments and
    decisions outside their validated purpose. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a calculator, accessible table or spoken arithmetic. The supplied synthetic
    data remove any need to time yourself or collect others’ performance. Keep models away from worth,
    disability judgments and decisions outside their validated purpose.
  expected_burden: Thirty to forty-five minutes with paper and a calculator or a simple spreadsheet.
