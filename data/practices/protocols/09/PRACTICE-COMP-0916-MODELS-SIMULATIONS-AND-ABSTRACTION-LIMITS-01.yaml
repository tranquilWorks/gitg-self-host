  - stable_id: PRACTICE-COMP-0916-MODELS-SIMULATIONS-AND-ABSTRACTION-LIMITS-01-A3
    sequence: 3
    title: Compare unseen cases and restrict the domain of use
    instructions: 'Reveal the holdouts and calculate errors: one minute for three items and eight for
