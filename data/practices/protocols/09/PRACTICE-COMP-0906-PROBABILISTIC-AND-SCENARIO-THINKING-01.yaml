      | Forecast ID | Opening record | Cancellation | Resolution evidence |

      | --- | --- | --- | --- |

      | F1 | 2 minutes after advertised start | No | Chair''s opening record is present and unambiguous.
      |

      | F2 | 11 minutes after advertised start | No | Chair''s opening record is present and unambiguous.
      |

