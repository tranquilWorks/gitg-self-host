    advertised time. Plan three further meetings and predict each on-time outcome before seeing its result.
    For a live version, use only your own ordinary meetings. Keep the supplied outcomes sealed or below
    a page fold: on time, late, on time. Goal: Use base rates, probability ranges, scenarios and a simple
