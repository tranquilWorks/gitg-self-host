  actions:
  - stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01-A1
    sequence: 1
    title: Set the base rate and write three resolvable predictions
    instructions: 'Calculate the observed base rate as eight out of ten, or 80 percent, while noting that
      ten meetings are a small and possibly selective sample. Define on time exactly and assign a probability
      or band to each future meeting using any known difference in context. Record what observation will
      settle each forecast and when. A range such as 60–80 percent should express uncertainty, not be
      chosen afterward to fit the result.


      Observation checks: The base rate and its denominator are shown; The outcome and resolution time
      are defined; Three forecasts are preserved before resolution; Context adjustments and uncertainty
      are explained. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01
      action_stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01-A1
      competency_stable_id: '09.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
