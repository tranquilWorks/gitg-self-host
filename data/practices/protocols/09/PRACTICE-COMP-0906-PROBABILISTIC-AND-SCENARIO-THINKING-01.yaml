  - stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01-A3
    sequence: 3
    title: Resolve the forecasts without rewriting them
    instructions: 'Record each actual outcome, or label the default sequence a simulation. Compare the
      predicted probabilities with the two on-time outcomes out of three. Optionally compute mean squared
      probability error using (probability minus 1 for on time or 0 for late) squared. Explain that a
      likely event can fail to occur and that three forecasts cannot establish calibration. Choose one
      adjustment to sampling, context or confidence for the next set.


      Observation checks: Every resolved forecast retains its original probability; Observed outcomes
      and simulations are distinguished; Probability quality is not reduced to right or wrong alone; The
      next forecasting adjustment follows a specific error. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Was the largest error caused by a poor base rate, an unjustified context adjustment
      or unavoidable uncertainty?


      Examples: Supportive: The participant preserved three 80-percent forecasts, recorded one late start,
      and widened uncertainty rather than pretending that the likely outcome had been guaranteed.


      Mixed: Forecasts were dated and resolved, but the time-cost model ignored an important access requirement.


      Contradictory: A high probability was presented as certainty, or probabilities were edited after
      the outcomes were known.


      Inconclusive: Only a retrospective success rate was recorded; no prospective probability, definition
      or resolution rule existed.'
