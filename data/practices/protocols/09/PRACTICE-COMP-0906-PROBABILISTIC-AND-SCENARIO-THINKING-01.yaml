    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Probabilistic and scenario thinking practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Probabilistic and scenario thinking as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use frequencies such as eight in ten, a calculator or probability bands. Forecasting
    the supplied synthetic meetings requires no calendar access. Do not apply the exercise to medical
    prognosis, gambling, trading or safety-critical decisions.
  opportunity_considerations: 'Default synthetic history: eight of ten comparable meetings began within
    five minutes of the advertised time. Plan three further meetings and predict each on-time outcome
    before seeing its result. For a live version, use only your own ordinary meetings. Keep the supplied
    outcomes sealed or below a page fold: on time, late, on time.'
  prerequisites:
