meaning_and_fit:
  purpose: Use base rates, probability ranges, scenarios and a simple expected-value comparison, then
    score resolved forecasts without claiming broad calibration from a tiny sample.
  why_recommended: Use base rates, probability ranges, scenarios and a simple expected-value comparison,
    then score resolved forecasts without claiming broad calibration from a tiny sample.
