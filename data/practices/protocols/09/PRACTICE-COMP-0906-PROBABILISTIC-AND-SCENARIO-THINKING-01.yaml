  - stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01-A2
    sequence: 2
    title: Compare scenarios and test a decision’s sensitivity
    instructions: 'For one meeting, suppose arriving early costs five minutes but avoids a fifteen-minute
      disruption if the meeting starts promptly. Under the simplified assumption that the disruption is
      avoided only when it starts promptly, expected avoided disruption is 0.8 times 15, or 12 minutes,
      against five minutes spent. Recalculate at probabilities of 0.3 and 0.9. State what this time-only
      model omits, including access needs and obligations; do not treat expected value as a command.


      Observation checks: At least two alternative probability scenarios are compared; The simple expected-value
      arithmetic is visible; The decision’s sensitivity to probability is stated; Non-numeric duties and
      omitted consequences remain explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01
      action_stable_id: PRACTICE-COMP-0906-PROBABILISTIC-AND-SCENARIO-THINKING-01-A2
