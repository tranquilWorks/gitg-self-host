  - stable_id: PRACTICE-COMP-0915-CAUSAL-INFERENCE-AND-INTERVENTION-LOGIC-01-A3
    sequence: 3
    title: Evaluate the intervention separately from the association
    instructions: 'List intended benefits and possible unintended effects of compulsory attendance: displaced
      caregiving, reduced autonomy or less time for independent study. Rewrite the recommendation as a
      bounded proposal to test accessible voluntary support, not a mandate justified by correlation. State
      what evidence would support expanding, revising or stopping the intervention and who has authority
      to make that decision.


      Observation checks: The intervention’s effects are not assumed from the association; At least two
      unintended consequences are considered; The recommendation is revised to fit the evidence; Expansion
      and stop criteria include affected people’s interests. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which unobserved difference could reverse the recommendation, and what would make
      an intervention beneficial rather than merely correlated with success?


      Examples: Supportive: The participant identified self-selection and outside practice, rejected the
      compulsory-attendance inference and proposed an accessible comparison with explicit limits.


      Mixed: A mechanism was plausible, but the proposed comparison still ignored an important selection
      difference.


      Contradictory: Correlation was used to justify coercion, or a statistical adjustment was treated
      as proof that all confounding vanished.


      Inconclusive: The words correlation is not causation were repeated without a mechanism, counterfactual
      or improved comparison.'
