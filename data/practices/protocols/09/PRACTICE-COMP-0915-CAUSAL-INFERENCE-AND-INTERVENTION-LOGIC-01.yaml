  applicability_question: Does a voluntary, bounded Causal inference and intervention logic practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Causal inference and intervention logic as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use labeled cards or a spoken causal story instead of a diagram. Analyze only
    the synthetic case when real records contain private information. Consequential research and institutional
    interventions require appropriate expertise, consent and oversight.
  opportunity_considerations: 'Synthetic claim: members who attend an optional study group score higher,
    so requiring everyone to attend will raise everyone’s score. Known facts: attendance was voluntary,
    prior knowledge was not measured, attendees practiced more outside the group, and the meeting time
    conflicts with some members’ responsibilities. Use arrows or plain sentences.'
