intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Synthetic claim: members who attend an optional study group score higher, so requiring everyone
    to attend will raise everyone’s score. Known facts: attendance was voluntary, prior knowledge was
    not measured, attendees practiced more outside the group, and the meeting time conflicts with some
    members’ responsibilities. Use arrows or plain sentences. Goal: Trace a possible causal mechanism,
    compare counterfactual explanations and selection effects, and decide what evidence is needed before
    intervening. Scope: This is causal reasoning using synthetic educational cases. It does not authorize
    experimentation on children, patients, employees or anyone whose participation is not freely and appropriately
    governed. Time and effort: Thirty minutes for the case analysis and fifteen minutes to revise an intervention
    claim. Adaptation: Use labeled cards or a spoken causal story instead of a diagram. Analyze only the
    synthetic case when real records contain private information. Consequential research and institutional
    interventions require appropriate expertise, consent and oversight. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use labeled cards or a spoken causal story instead of a diagram. Analyze only the
    synthetic case when real records contain private information. Consequential research and institutional
    interventions require appropriate expertise, consent and oversight.
  expected_burden: Thirty minutes for the case analysis and fifteen minutes to revise an intervention
    claim.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Causal inference and intervention logic protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Causal inference and intervention logic action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use labeled
    cards or a spoken causal story instead of a diagram. Analyze only the synthetic case when real records
    contain private information. Consequential research and institutional interventions require appropriate
    expertise, consent and oversight.
  actions:
  - stable_id: PRACTICE-COMP-0915-CAUSAL-INFERENCE-AND-INTERVENTION-LOGIC-01-A1
    sequence: 1
    title: Separate the observed association from candidate causes
    instructions: 'Write attendance and score as distinct observations. Add possible common causes such
      as prior knowledge, available time and motivation, and a possible mechanism such as practice with
      feedback. Mark which links are observed, plausible or untested. Ask whether high-performing members
      selected into the group and whether the outside practice, rather than attendance itself, could explain
      part of the association.


      Observation checks: The observed association is stated without a causal verb; A plausible mechanism
      is distinguished from evidence for it; Common causes and selection into attendance are identified;
      Outside practice is considered as an alternative explanation. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0915-CAUSAL-INFERENCE-AND-INTERVENTION-LOGIC-01
