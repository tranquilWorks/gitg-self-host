  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      Prepared: 18/20 = 90% among attenders and 72/90 = 80% among nonattenders. Beginner: 27/90 = 30%
      versus 4/20 = 20%. Each within-group observed difference is **+10 percentage points**.


      Overall attenders: 45/110 = 9/22, about **40.9%**. Overall nonattenders: 76/110 = 38/55, about **69.1%**.
      The crude difference is −31/110, about **−28.2 percentage points**. The attendance group contains
      many more beginners; the nonattendance group contains many more prepared learners. Those different
      mixtures reverse the observed aggregate comparison.


      An equal-weight descriptive standardization gives (0.9+0.3)/2 = **60%** for attendance and (0.8+0.2)/2
      = **50%** for nonattendance: a **+10-point** difference for that target mix. Neither the negative
      crude contrast nor positive standardized contrast alone establishes an intervention effect. Motivation,
      time, measurement, and other unmeasured factors could remain. The selected weights also define a
      target that must be justified for any real application.


      P and R can be candidate pre-attendance common causes. M can be a proposed post-attendance mechanism.
      Practice measured before versus after attendance is not automatically the same adjustment variable.
      State which pathways you intend to estimate. The observed table does not validate every proposed
      arrow.


      A bounded next proposal evaluates an accessible voluntary offer with governed consent and a defined
      comparison, not compulsory attendance inferred from the table. Account for all assigned people or
      explicitly analyze missing outcomes; do not make an apparently improved completer-only rate the
      sole success criterion. Unintended time burdens, loss of access, and displaced learning remain part
      of the decision.


      ### Check A


      Observed attendance and nonattendance proportions are both **1/2**. One positive-effect completion
      of (Y0,Y1) is: a=(0,1), b=(0,0), c=(1,1), d=(0,1). Individual effects are 1,0,0,1, averaging **+1/2**.


      One negative-effect completion is: a=(1,1), b=(1,0), c=(1,0), d=(0,0). Effects are 0,−1,−1,0, averaging
      **−1/2**. Both preserve all observed entries. The same observed zero contrast is therefore compatible
      with opposite causal signs. There are 16 ways to fill the four binary unknowns; their possible mean
      effects range from −1/2 to +1/2 in quarter-point increments.


      The demonstration concerns lack of identification from these observations alone. Appropriate design
      information or explicit, justified assumptions connecting the groups may support further inference;
      do not claim that merely drawing a mechanism provides it. Random assignment still leaves finite-sample
      uncertainty and does not reveal both potential outcomes for each individual.


      ### Check B


      The assignment-group completion rates are **28/40 = 70%** and **24/40 = 60%**, a **+10-percentage-point**
      observed contrast. With the stipulated random assignment and complete comparable measurement, this
      is evidence about assignment to the offer in this finite study, not an automatically precise population
      effect or an effect of mandatory attendance.


      The totals do not tell how many completers attended within each group. You therefore cannot reconstruct
      attender completion rates from them. Uptake differs by 24/40 − 8/40 = 40 points, but dividing 10
      by 40 to claim a 25-point attendance effect would require additional assumptions not supplied here.
      Do not substitute that calculation for identification.


      Compulsion could displace caregiving, work, independent learning, or needed rest, and could reduce
      access or autonomy. Examine burden and participation barriers with appropriate permission, and distinguish
      voluntary support from a mandate. Larger or repeated well-designed evidence may clarify uncertainty;
      random assignment does not make the 80 people a random sample of every target population or guarantee
      an identical effect for every person.


      Repair: label the intervention in every conclusion. If your sentence starts with an offer comparison
      and ends with a compulsory-attendance recommendation, the causal question changed without evidence.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
