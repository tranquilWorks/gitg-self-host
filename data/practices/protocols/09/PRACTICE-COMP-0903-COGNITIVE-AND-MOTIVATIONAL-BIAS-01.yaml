instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '09.03'
  title: 09.03 — Cognitive and motivational bias
  scored: false
  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Argument terminology](https://openstax.org/books/introduction-philosophy/pages/5-3-arguments)

      - [Selected bias terminology](https://openstax.org/books/psychology-2e/pages/7-3-problem-solving)

      - [Motivational reasoning — abstract-level consultation only](https://pubmed.ncbi.nlm.nih.gov/2270237/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### What you are practicing


      Notice a specific vulnerability in a decision, install a countercheck that could matter, and actually
      use it. Naming a bias afterward is not the same as changing the procedure. Keeping your original
      choice can be a good result when it survives a fair check.


      **Canonical scope:** Recognize confirmation, availability, anchoring, sunk cost, overconfidence,
      tribal reasoning, and self-serving bias.


      **Deliverable:** A preserved initial preference, seven reasoned vulnerability dispositions, a performed
      countercheck, and a decision record showing what changed in the method. Allow about 35 minutes for
      the fictional packet. A live transfer needs an actual suitable choice; no purchase, attendance,
      or contact is required for the fictional route.


      Use paper, a text editor, dictation, or a willing reader. Everything needed to complete the default
      rehearsal is supplied. These materials do not diagnose irrationality or establish that bias has
      been eliminated. They do not establish mastery.


      ### Seven routes to inspect, not seven labels to attach to people


      **Confirmation:** Preferentially seeking or crediting support for your favored answer. Countercheck:
      search for a concrete fact that would make that answer fail your stated criterion.


      **Availability:** Giving a vivid or easily recalled example more weight than its relevance warrants.
      Countercheck: compare that example''s time, setting, and coverage with the current decision evidence.


      **Anchoring:** Allowing an initial number or framing to pull a later estimate without adequate adjustment.
      Countercheck: calculate from relevant components and examine sensitivity. After seeing the anchor,
      do not claim your estimate was unexposed or independent of it.


      **Sunk cost:** Treating irrecoverable past effort as a reason to incur further costs, apart from
      future consequences. Countercheck: compare future costs and benefits. Past work can create a genuinely
      reusable asset; include its future usefulness rather than mechanically discarding all history.


      **Overconfidence:** Expressing more certainty or precision than the evidence supports. Countercheck:
      name a plausible failure condition, missing information, and a response if it occurs. A confidence
      number alone is not calibration.


      **Tribal reasoning:** Applying more favorable standards to a preferred group because it is yours.
      Countercheck: swap irrelevant group labels while preserving relevant evidence, track record, and
      constraints. Equal standards do not require equal conclusions when the evidence actually differs.


      **Self-serving bias:** Applying an interpretation or standard that favors your own role without
      an evidence-based justification. Countercheck: consider the same conduct with the roles reversed
      and check whether relevant responsibilities and constraints are really comparable.


      These are working descriptions for this exercise. They overlap and are not seven diagnoses. Mark
      a route **relevant**, **uncertain**, or **unsupported in this packet**, with a reason. Do not invent
      evidence merely to fill every row. The background sources and their limits are recorded in SOURCES.md;
      they do not validate this original checklist.


      ### A different worked example: continue an illustration or switch?


      A person has already spent 90 unrecoverable minutes on a draft. Their remaining task is to produce
      a readable event sign. Finishing that draft would take 40 more minutes; a simpler alternative would
      take 15 and meet the same stated requirement. No part of the old draft can be reused, and there
      is no cancellation obligation or other future consequence in this toy case.


      The countercheck is a future-only comparison: 40 versus 15, not 130 versus 15. Selecting the simpler
      route can fit the stated requirement, while the old 90 minutes remain recorded as past effort. If
      the old draft contained a reusable illustration that saved future work, that useful asset would
      matter. The point is not “always abandon work”; it is to identify what can still change.


      ### Complete practice packet: one community-event choice


      All options, advertisements, and statements are fictional. This is a decision rehearsal, not evidence
      that you attended an event or changed a real-life choice.


      #### Initial card — record a preference before the detailed comparison


      For the fictional decision-maker, the aim is to participate in one event **if** it fits these constraints:
      at most **70 minutes door-to-door**, confirmed step-free access, and no current personal need to
      rest instead. The decision-maker reports sufficient energy today. Once these conditions are met,
      prefer the option with less total future time. Staying home remains the fallback when participation
      cannot be justified under the constraints.


      Event A is organized by a familiar club. An old advertisement calls it a “quick 35-minute activity.”
      The person spent 60 minutes preparing an A-specific card that cannot be reused or recovered. Event
      B has an unfamiliar organizer. A friend vividly recalls a noisy B event last year. Option C is to
      stay home.


      Write your initial preference, main reason, and certainty in ordinary words. If you already read
      the detailed facts, record that exposure; do not claim a blind initial judgment.


      #### Current detail card — now use the complete supplied facts


      | Option | Round-trip travel | Current session duration | Total future time | Step-free access |
      Other information |

      | --- | --- | --- | --- | --- | --- |

      | A | 40 minutes | 45 minutes | Calculate | Not confirmed in this packet | Old advertisement omits
      travel and does not give the current duration |

      | B | 20 minutes | 40 minutes | Calculate | Confirmed for this fictional session | Current notice
      offers a quiet area; actual attendance and noise are not guaranteed |

      | C | 0 minutes | 0 minutes | Calculate | No travel required | Does not meet the participation aim,
      but is the fallback and rest option |


      The 60 minutes of A-specific preparation have already occurred and cannot be recovered. There are
      no purchases, deposits, contractual duties, or cancellation penalties in this packet. The friend''s
      story concerns a different event last year and does not measure this session''s noise. Organizer
      familiarity is the only group-label difference supplied; no differing safety record, competence
      evidence, or trust history is provided.


      #### Action 1 — Preserve the preference and audit the procedure


      Fill one row for each of the seven routes:


      `Route | relevant / uncertain / unsupported | specific fact or missing fact | how it might distort
      this decision | suitable countercheck`


      Inspect your own reasoning rather than declaring that everyone choosing A is biased. The initial
      card contains opportunities for several vulnerabilities, but a cue''s presence does not prove it
      caused your preference. For overconfidence and self-serving bias in particular, evidence about your
      actual reasoning may be absent: an uncertainty or unsupported disposition can be more honest than
      a confident label.


      State the actual decision rule before judging the preferred option. Preserve constraints you would
      apply to an unfamiliar organizer, and do not invent additional favorable facts for the familiar
      one.


      #### Action 2 — Perform one countercheck that could reverse the preference


      Choose a vulnerability tied to a concrete reason you recorded. Write a finding that would make the
      preferred option fail, then perform the matching check using the supplied detail card.


      For a time-anchor or confirmation concern, compute travel plus session time for each event and compare
      the result with 70 minutes. For a sunk-cost concern, keep the 60 past minutes in the history column
      but exclude them from future time; explain why no reusable asset or obligation is lost in this packet.
      For an availability concern, compare last year''s anecdote with the current notice and keep the
      remaining noise uncertainty. For a group-label concern, swap only the organizer labels and apply
      the same constraints again.


      Record the actual calculation, source row, or comparison. “I considered the opposite” without showing
      what you inspected is insufficient. An inaccessible or missing fact stays missing. Do not label
      unconfirmed access as confirmed in order to keep a preference.


      #### Action 3 — Decide, preserve disagreement, and distinguish the route


      Apply the stated rule to the checked information. Record:


      `Initial preference | initial reason | countercheck performed | result | final preference | unchanged
      or changed, and why | remaining uncertainty | appropriate next step`


      A procedure can improve while the answer stays the same. Conversely, switching options does not
      prove a better procedure if the new choice is unsupported. Keep the actual reason for the decision
      visible.


      For this fictional packet, write a decision rehearsal only. Do not claim real-world participation
      or bias reduction. For an optional actual low-stakes choice, record your real constraints and preference
      first, check relevant available information, change the method, and carry out a reversible next
      step when appropriate. Declining to act or obtaining missing information can be a reasoned outcome.
      Do not create a purchase, confrontation, or other commitment merely to obtain evidence for this
      exercise.


      ### Check the method on fresh cases


      Open **check-prompts.md**. Complete the seven short cases and the fresh choice before opening **check-answers.md**.
      Explain the mechanism and procedural repair; do not rely on the name alone. Multiple vulnerabilities
      can coexist, and a justified alternative classification can be acceptable.


      The answer file is separately stored source material.


      ### Accessibility and advanced routes


      Use a spoken checklist or inspect one route at a time. A willing reader may present anonymized option
      cards, preserve your first preference, and record your decisions without selecting for you. Record
      assistance. No time-pressure task is required.


      For a more demanding route, identify a case where familiarity or past investment conveys relevant
      future information. Explain exactly which evidence should remain after a label swap or future-only
      comparison. Do not turn a useful countercheck into a rigid rule that discards expertise, duty, access
      needs, or legitimate relationships.


      For longitudinal transfer, try a different actual low-stakes choice later. Preserve the initial
      record and compare procedures, not just whether the final answers changed. A single before-and-after
      result cannot establish a causal effect of this checklist or reliable judgment across contexts.


      ### How to interpret your result


      **Supportive:** A specific vulnerability leads to a performed calculation or evidence check, both
      preferences remain visible, and the final action uses the same relevant standard across options.


      **Mixed:** All seven labels are accurate but the decisive comparison is never performed, or contrary
      information is recorded and then ignored without justification.


      **Contradictory:** The checklist is applied only to disliked groups, missing information is invented,
      or the user changes the rule solely to protect their preference.


      **Inconclusive:** There is no initial preference, no visible countercheck, or only a simulated choice
      presented as a real one. The fictional route cannot establish the canonical real-choice progress
      indicator by itself.


      This is not a substitute for qualified advice on high-consequence decisions. Keep the practice ordinary,
      reversible, and within your own authority.


      **Final review:** What changed in your procedure? Which result could have changed your preference?
      Would the same relevant evidence receive the same treatment after a role or group-label swap?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your responses before opening the separate answer file. These cases are fictional and
      test the stated reasoning, not the actual psychology of a person.


      ### Check A — Name the vulnerability and change the method


      For each case, identify the most directly illustrated vulnerability, explain the mechanism, and
      supply a countercheck that could change the decision. Do not require every real person in that situation
      to have the same bias.


      1. Casey wants a particular reading-group venue and reads only its favorable reviews, deliberately
      skipping the current access notice.

      2. One striking story about a crowded session dominates Drew''s judgment, although the choice concerns
      a different session with a different capacity and booking system.

      3. Ellis sees a “10-minute task” headline and keeps estimating 12 minutes even after listing five
      non-overlapping required steps of 5 minutes each.

      4. Fran plans to continue an unsuitable poster solely because 80 irrecoverable minutes have already
      been spent; an equally suitable alternative has a smaller remaining workload, and no asset or obligation
      would be lost.

      5. Gray says “There is no possible way the outdoor event will be disrupted,” despite lacking weather,
      access, or cancellation information.

      6. Harper demands a current access confirmation from an unfamiliar club but accepts an equally unsupported
      access claim from their own club; no relevant track-record difference is supplied.

      7. Indigo calls their own late cancellation reasonable but another person''s cancellation irresponsible,
      while admitting the same notice, responsibilities, and constraints applied in both cases.


      State why a familiar organizer or prior effort can sometimes be relevant evidence rather than automatically
      something to ignore.


      ### Check B — A fair check can retain the initial choice


      A fictional volunteer wants to participate in one session with confirmed step-free access and at
      most 60 minutes total future time. Both options have confirmed access and otherwise meet the stated
      requirements. Among feasible options, the rule is to minimize future time.


      - **X:** 20 minutes round-trip travel and 30 minutes in the session.

      - **Y:** 10 minutes round-trip travel and 45 minutes in the session.


      The initial preference is X. The volunteer previously spent 80 irrecoverable minutes preparing specifically
      for Y. Nothing can be reused and there is no duty or penalty attached. X belongs to an unfamiliar
      group; Y belongs to a familiar group. No relevant difference in track record is supplied.


      Preserve the first preference. Calculate both totals, perform a future-only and group-label countercheck,
      and apply the stated rule. Explain whether retaining X can count as a successful procedure check.
      Name one missing real-world fact that would matter outside this closed fictional packet without
      inventing it or overturning the packet''s stipulated facts.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Open after saving your responses. These explanations concern the supplied reasoning and data.
      They do not diagnose a participant or certify that a bias has been removed.


      ### Main practice: current event choice


      A requires 40 + 45 = 85 future minutes, exceeding the 70-minute limit. Its step-free access is also
      unconfirmed. B requires 20 + 40 = 60 future minutes and has confirmed access in the fictional packet.
      C takes no event time but does not meet the participation aim; the stipulated rule uses it as fallback
      or rest option.


      With the stated sufficient-energy condition and decision rule, B is the supported participation
      choice. A''s 60 past preparation minutes do not change its future time. The old “35-minute” wording
      is neither the current session duration nor a door-to-door total. B''s quiet-area notice is relevant
      but does not guarantee a noise-free experience. That uncertainty should remain visible rather than
      be converted into a promise.


      An initial B preference may reasonably stay B after a genuine check. An initial A preference may
      change. Neither change nor retention alone demonstrates a better procedure. The evidence is the
      preserved initial reason, a performed relevant check, and a justified final record.


      The packet makes confirmation, anchoring, sunk-cost, availability, and group-label vulnerabilities
      available to inspect. Their presence is not proof that each influenced this person. Overconfidence
      and self-serving dispositions depend on the reasoning actually recorded; “uncertain” or “unsupported”
      can be appropriate. A complete audit does not mean assigning seven positive diagnoses.


      ### Check A


      1. **Confirmation:** only favorable information is inspected. Read the current access notice and
      state the access finding that would disqualify the preferred venue.

      2. **Availability:** vividness substitutes for an appropriate comparison. Check which features of
      the earlier event differ and inspect the current session''s capacity and booking information. The
      old story may remain relevant to a specified risk; it does not automatically describe this event.

      3. **Anchoring:** the headline continues to control an estimate despite a task decomposition. Sum
      the five non-overlapping 5-minute steps: 25 minutes. Compare that result with the headline and identify
      whether any steps actually overlap. Do not claim the estimate was never exposed to the anchor.

      4. **Sunk cost:** irrecoverable effort drives further commitment without a future benefit or obligation.
      Compare remaining workload and suitability, keeping the 80 past minutes in the history record, not
      as a future cost.

      5. **Overconfidence:** certainty exceeds the supplied coverage. Identify plausible disruption conditions,
      obtain proportionate information, and state a contingency rather than inventing a precise probability
      or insisting on certainty.

      6. **Tribal reasoning:** the evidence standard changes with group identity. Apply the same access-confirmation
      requirement after swapping irrelevant labels. Preserve any genuine relevant differences if additional
      evidence later supplies them.

      7. **Self-serving bias:** equivalent constraints receive different judgments according to whose
      conduct is evaluated. Reverse the roles while holding those constraints fixed and state a consistent
      standard or a relevant difference that would justify different treatment.


      Other labels may overlap, but an acceptable answer must explain the described mechanism and perform
      or specify a matching check. A name without a procedural change is incomplete.


      A familiar organizer''s documented reliability can matter. Past work can produce a reusable asset
      or create a real future obligation. The packet removes those differences to isolate the exercise;
      real decisions must inspect them rather than mechanically erase them.


      ### Check B


      X totals 20 + 30 = 50 minutes. Y totals 10 + 45 = 55 minutes. Both satisfy the 60-minute and access
      constraints. X requires less future time and therefore remains the choice under the stated rule.


      The 80 past minutes for Y are irrecoverable and create no reusable asset, duty, or penalty in this
      packet. Exclude them from the future comparison while preserving the history. Swapping the group
      labels does not change the supplied totals, requirements, or relevant evidence. Keeping X after
      these checks can be a successful procedure check; forcing a switch would contradict the stated rule.


      Outside this closed packet, actual current access, a changed schedule, personal capacity, or a real
      commitment could matter. Name such a fact as a future verification need, not an invented problem
      that overwrites the supplied fictional stipulations.


      **Repair:** If you selected Y solely to show that you “overcame bias,” return to the prespecified
      criteria. If you selected X without calculations or a countercheck, add the missing procedure rather
      than treating the correct answer as sufficient evidence of how it was reached.


      ### Evidence boundary


      A fictional choice supplies a rehearsal artifact. The canonical real-choice indicator remains untested
      until an actual appropriate decision is recorded and its procedure is changed accordingly. A before-and-after
      choice alone is not causal evidence that this checklist reduced bias. Independent learner, specialist
      where needed, and formal owner acceptance are still separate.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
