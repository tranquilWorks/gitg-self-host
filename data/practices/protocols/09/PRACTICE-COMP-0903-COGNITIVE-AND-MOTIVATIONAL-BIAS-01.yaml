  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a reversible choice such as selecting a free community event. Default options are a familiar
    event, an unfamiliar event with a clear schedule, and staying home for needed rest. Write your initial
    preference before comparing them. No purchase or attendance is required for the default analysis.
    Goal: Identify how a specific decision could be distorted and change the procedure before making the
    choice, rather than merely naming a bias afterward. Scope: The audit identifies plausible vulnerabilities,
    not a diagnosis that a person or group is irrational. One improved process cannot establish that bias
    has been removed. Time and effort: Fifteen minutes to record the initial preference, twenty minutes
    for counterchecks, and a ten-minute decision review. Adaptation: Use a short spoken checklist or ask
    a willing person to apply the same criteria without knowing your first choice. Keep names and private
    motives out of the record. Defer high-consequence decisions to appropriate expertise rather than relying
    on a bias checklist. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a short spoken checklist or ask a willing person to apply the same criteria
    without knowing your first choice. Keep names and private motives out of the record. Defer high-consequence
    decisions to appropriate expertise rather than relying on a bias checklist.
  expected_burden: Fifteen minutes to record the initial preference, twenty minutes for counterchecks,
    and a ten-minute decision review.
  action_count_rationale: null
