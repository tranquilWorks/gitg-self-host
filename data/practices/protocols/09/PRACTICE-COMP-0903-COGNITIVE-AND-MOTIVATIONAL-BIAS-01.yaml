meaning_and_fit:
  purpose: Identify how a specific decision could be distorted and change the procedure before making
    the choice, rather than merely naming a bias afterward.
  why_recommended: Identify how a specific decision could be distorted and change the procedure before
    making the choice, rather than merely naming a bias afterward.
  claims:
  - statement: Identify how a specific decision could be distorted and change the procedure before making
      the choice, rather than merely naming a bias afterward.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cognitive and motivational bias practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cognitive and motivational bias as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a short spoken checklist or ask a willing person to apply the same criteria
    without knowing your first choice. Keep names and private motives out of the record. Defer high-consequence
    decisions to appropriate expertise rather than relying on a bias checklist.
  opportunity_considerations: Use a reversible choice such as selecting a free community event. Default
    options are a familiar event, an unfamiliar event with a clear schedule, and staying home for needed
    rest. Write your initial preference before comparing them. No purchase or attendance is required for
    the default analysis.
  prerequisites:
  - Use a reversible choice such as selecting a free community event. Default options are a familiar event,
    an unfamiliar event with a clear schedule, and staying home for needed rest. Write your initial preference
    before comparing them. No purchase or attendance is required for the default analysis.
  dependencies: []
  safe_alternatives:
  - Use a short spoken checklist or ask a willing person to apply the same criteria without knowing your
    first choice. Keep names and private motives out of the record. Defer high-consequence decisions to
    appropriate expertise rather than relying on a bias checklist.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cognitive and motivational bias differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cognitive and motivational
    bias as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
