  actions:
  - stable_id: PRACTICE-COMP-0903-COGNITIVE-AND-MOTIVATIONAL-BIAS-01-A1
    sequence: 1
    title: Name the choice and inspect seven distortion routes
    instructions: 'Write your preferred option and reason. Then check: confirmation—am I seeking only
      support; availability—am I overweighting a vivid recent story; anchoring—did the first estimate
      set the scale; sunk cost—am I protecting past effort; overconfidence—what could I be wrong about;
      tribal reasoning—would the organizer’s identity change my standard; self-serving bias—am I excusing
      costs I would criticize in someone else? Mark a route relevant, unsupported or uncertain, with a
      concrete reason.


      Observation checks: The initial preference is preserved before the audit; All seven routes receive
      reasoned dispositions; A plausible vulnerability is tied to this choice; The audit does not label
      a whole person or group. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
