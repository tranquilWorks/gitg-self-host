  - stable_id: PRACTICE-COMP-0911-PRACTICAL-WISDOM-AND-CONTEXT-01-A3
    sequence: 3
    title: Test whether the exception preserves or evades the principle
    instructions: 'Ask what would happen if someone else in the same relevant circumstances used your
      reasoning. Name the duty that remains after each adaptation, such as correcting an estimate or using
      an appropriate safe route. Apply one response to a real low-stakes commitment change, or rehearse
      the three cases aloud. Record what information the recipient would actually need, not whether your
      explanation sounds sophisticated.


      Observation checks: The reasoning can be applied symmetrically; An adapted case still has a stated
      remaining duty; A real application or labeled rehearsal occurs; The review checks practical information
      rather than rhetorical polish. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which difference justified a different action, and which proposed exception would
      merely protect your convenience?


      Examples: Supportive: The participant distinguished a simple late-arrival message from a supervisor’s
      dependency update and preserved a safety exception without abandoning responsibility.


      Mixed: The cases received different responses, but the remaining duty after an exception was unclear.


      Contradictory: Context was used to excuse avoidable harm, demand unsafe contact or treat a lower-status
      person’s needs as unimportant.


      Inconclusive: The same slogan was repeated for every case without considering role, access, timing
      or safety.'
