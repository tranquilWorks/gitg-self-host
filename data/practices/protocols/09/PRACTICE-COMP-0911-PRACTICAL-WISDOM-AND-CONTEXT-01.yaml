      - [R7 — Blocking and experimental comparisons](https://www.itl.nist.gov/div898/handbook/pri/section3/pri332.htm)

      - [R8 — Statistical versus causal quantities](https://www.ncbi.nlm.nih.gov/books/NBK588337/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### The skill and its boundary


      Preserve a principle''s purpose while changing its application for a materially different situation.
      “Always do the same thing” and “anything goes in context” both avoid the actual judgment.


      **Canonical scope:** Apply principles with sensitivity to timing, role, relationship, capability,
      culture, and exceptional circumstances.


      **Deliverable:** Six short context-to-action records, a justified exception with a remaining duty,
      and two fresh case responses. Allow roughly 40 minutes on paper or in a spoken rehearsal. No actual
      contact or personal disclosure is required. This is not legal, employment, safeguarding, or clinical
      advice.


      [R2](?resource=sources) supplies a limited historical background: practical judgment involves particulars
      as well as general principles. The six modern cases and their pluralist constraints are original
      materials, not an assertion that one philosopher settles every cultural or moral disagreement.


      ### What makes a difference relevant?


      Start with the good a principle protects. In this lesson, **give affected people usable notice when
      a commitment changes** protects their ability to plan, consent to alternatives, and avoid unnecessary
      waiting. It does not demand unlimited disclosure, unsafe communication, or certainty about an estimate
      you do not have.


      **Timing** changes what information can still help. **Role** changes the responsibilities and authority
      attached to the task. **Relationship** changes what was agreed and what communication is appropriate,
      without changing anyone''s dignity. **Capability** changes which action is feasible, not whether
      someone deserves consideration. **Culture** can shape a person''s preferred channel or form of respect;
      ask or use an explicitly stated preference rather than assigning one from a group label. **Exceptional
      circumstances** can make the ordinary procedure harmful or impossible while leaving some responsibilities
      intact.


      A relevant distinction connects a fact to the principle''s purpose. “This recipient has no text
      access, so use the agreed phone relay” does that. “This recipient is less important, so no update
      is needed” substitutes a status judgment. A principle may also conflict with another legitimate
      good: a useful update must not disclose another person''s private situation unnecessarily.


      ### A different worked example: returning borrowed cards


      You promised to return a friend''s game cards on Friday. One card remains at a second agreed storage
      location. A truthful update is useful: identify what can be returned now, when the rest can be returned,
      and whether the friend needs another arrangement. It is not necessary to disclose someone else''s
      private reason for a storage change.


      If direct speech is inaccessible, the friend''s agreed text channel can carry the same substance.
      If the card is urgently needed before your proposed time, that new fact changes the repair needed.
      “I had a good intention” does not restore the friend''s ability to plan. The principle survives
      while timing and channel change.


      ### Complete case packet


      All cases are invented. Use only the facts stated; do not infer diagnoses, ethnic norms, employment
      rules, or unrecorded permissions. The shared commitment is to help with a low-stakes community display.
      Each case is independent.


      | Case | Supplied situation and constraints |

      | --- | --- |

      | A — Partner | You and one willing friend agreed to start at 14:00. At 13:50 you learn you will
      arrive at 14:10. The agreed text channel works; the friend may decline to wait. |

      | B — Coordinator | You coordinate three consenting roles: setup, labels, and photographs. Setup
      cannot begin until your materials arrive. The latest estimate is 14:20, with uncertainty of ten
      minutes. A shared update channel is agreed; you may revise the plan but not promise other people''s
      extra time. |

      | C — Access | A participant has explicitly said that small text is inaccessible and prefers an
      agreed voice relay. You can reach that relay safely. They have not consented to having access details
      discussed in the group. |

      | D — Preference | Another participant requests a private message through an agreed coordinator
      rather than public correction. The coordinator can relay an explicit revised time and ask whether
      the new plan is acceptable. The person has not asked you to disguise uncertainty. |

      | E — Limited role | You are a volunteer, not the schedule owner. You discover that a proposed delay
      affects the display opening. You may alert the owner with known facts but cannot approve a new opening
      time. |

      | F — Protected channel | A communication channel is no longer safe to use, according to the case''s
      stipulated safety restriction. An already agreed, safe support contact exists. No immediate public
      danger needs an emergency response in this fictional case. You must not use the unsafe channel or
      disclose private details to the group. |


      #### Action 1 — Explain the principle and compare the contexts


      For each case, complete:


      `Purpose protected | relevant facts | timing | role/authority | relationship/agreement | capability/channel
      | stated preference | exception, if any | information still missing`


      Not every dimension must create a different action in every case. Mark “no distinct difference supplied”
      rather than inventing one. The six labels are prompts for inspection, not six required excuses.
      Name at least one fact whose removal would change your recommended action.


      For B, distinguish a time range from a firm promise. For C and D, describe the actual preference
      in the packet, not what people from some culture allegedly prefer. For E, notice the boundary between
      informing and authorizing. For F, the safety restriction is given; this exercise is not asking you
      to investigate or prove someone''s account of harm.


      #### Action 2 — Write an executable response


      Write one or two sentences of message content and one next action for each case. Supply the information
      the affected person needs: what changed, what is known or uncertain, what options remain, and when
      the next update will occur. Do not promise a response or time you cannot control.


      A good message is not necessarily maximally direct, long, or emotionally expressive. It must be
      understandable in the agreed channel. An indirect relay that omits the revised time fails the purpose;
      a concise private relay that conveys it can satisfy the purpose. A public disclosure that invades
      privacy is not better just because it is faster.


      For any requested exception, fill:


      `Ordinary action | material constraint | narrower substitute | duty that remains | review point
      | authority required`


      Where a safe substitute is unavailable, state that limitation. Do not invent a trusted intermediary
      or compel a person to make contact. The supplied F case includes one already agreed support contact;
      a different real case may not.


      #### Action 3 — Challenge your own exception


      Apply a **same-relevant-facts test**. Replace “my friend” with “a person I find difficult,” holding
      agreements, capability, risk, and role fixed. Would your responsibility change? If so, identify
      a relevant reason rather than preference alone. Then change one genuinely relevant fact, such as
      the recipient''s channel access or who owns the schedule. Explain why a different action is now
      justified.


      Check the practical outcome of your rehearsal: could the recipient know what to do next? Could a
      coordinator distinguish an estimate from an authorization? Was private information protected? Did
      a remaining duty disappear into the phrase “special circumstances”?


      Complete both fresh checks, then read their separate answer guidance. Unlike an arithmetic problem,
      more than one response can meet the criteria. The key states required boundaries and representative
      responses; it is not a culture-ranking rubric or a machine score for wisdom.


      ### Conflicting goods without a magic formula


      Suppose a delay update would be more understandable with someone''s personal medical details. The
      default is not to share those details. You can state the practical constraint and revised plan without
      its private cause. Ask what the recipient needs for the decision, what you have permission to share,
      and whether a narrower disclosure is sufficient. Do not treat privacy as a reason to withhold every
      useful logistical fact.


      Likewise, flexibility should not automatically transfer all inconvenience to the least powerful
      person. Offer a real option to decline or revise the arrangement. A power difference can affect
      how freely someone agrees, so a reply of “fine” may not establish every preference you hope it does.
      This lesson records the stated agreement, not a hidden psychological inference.


      ### Accessibility, progression, and actual transfer


      Use a spoken comparison, six cards, large print, or a communication aid. A helper may read and transcribe;
      the reasons and decisions remain yours. Do not make fast social performance a prerequisite for careful
      judgment.


      For a more demanding route, write two defensible responses to B that trade speed of notice against
      precision. Explain which initial notice is useful now and what later update it requires. Retain
      a stable principle rather than grading only rhetorical sophistication.


      For later transfer, use an actual ordinary commitment change within your authority. Preserve only
      the minimum information needed for your private reflection. Record whether your message was actually
      sent, merely rehearsed, or blocked by missing access. No live interaction, reconciliation, or broad
      growth in wisdom is inferred from the fictional exercise. Escalate consequential legal or safeguarding
      questions to appropriate local support rather than applying a classroom exception rule.


      ### Interpret the result


      **Supportive:** Actions differ for stated relevant reasons while usable notice, privacy, consent,
      and remaining responsibilities survive. **Mixed:** Channel choice improves but the revised time,
      uncertainty, or next owner remains unclear. **Contradictory:** Status or convenience is used to
      deny another person''s consideration, or a safety restriction is overridden in the name of duty.
      **Inconclusive:** Every case receives the same slogan, with no connection from facts to action.


      **Final review:** Which difference justified your adaptation, what duty remained, and could someone
      else use the same reasoning in the same circumstances?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '### Check A — The late shared artifact


      You promised a draft poster to two collaborators by 17:00. At 16:30 you know only the text will
      be ready. One collaborator needs the text for an accessible audio version; the other needs the complete
      image tomorrow. Both accept a private shared update. You have no permission to promise either person''s
      extra work. A friend says to wait until tomorrow because announcing incomplete work is embarrassing.


      State the protected good, the relevant timing and role differences, and a proportionate update.
      Explain what can be handed over now, what remains uncertain, and who may decide whether a revised
      arrangement works. Repeat the analysis after changing only one fact: the audio collaborator cannot
      use the shared text channel but has an agreed voice route. What should change, and what should remain
      the same?


      ### Check B — An exception or an excuse?


      A library craft group asks members to notify an agreed coordinator when they cannot attend. Case
      1: a participant has a working safe channel but prefers not to send an update because another member
      is unpopular. Case 2: the ordinary channel is unavailable; a safe, already agreed relay exists.
      Case 3: the ordinary channel is unsafe and no safe substitute is currently established. The activity
      is optional and no emergency is present in these fictional cases.


      For each, identify the relevant facts, a feasible next step, and any remaining duty or unresolved
      limit. Do not invent a new contact or require unsafe contact. Explain why the same principle need
      not require the same immediate action. State what would justify reviewing your decision later.'
