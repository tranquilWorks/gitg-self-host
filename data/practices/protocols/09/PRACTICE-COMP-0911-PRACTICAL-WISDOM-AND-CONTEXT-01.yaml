  - id: practice-answers
    title: Compare your responses
    body: '### Main practice


      A can receive a brief text with the 14:10 estimate and a genuine choice not to wait. B needs a dependency-aware
      update: materials estimated around 14:20, uncertainty about ten minutes, affected tasks identified,
      and a next update point that you can actually meet. Do not turn that uncertainty into a guarantee
      or assign extra time to the three roles without agreement.


      C uses the agreed voice relay and does not broadcast the person''s access details. D uses the agreed
      private coordinator while retaining explicit logistical information. These adaptations concern stated
      preferences, not assumptions about a culture. E alerts the owner with known facts and requests a
      decision; it does not announce an unauthorized opening time. F avoids the prohibited channel and
      uses only the already agreed safe support route when appropriate. It preserves privacy and records
      what notification remains unresolved.


      Other wording can be valid. Look for a justified channel, actionable information, acknowledgment
      of uncertainty, appropriate authority, and a remaining responsibility. A polished sentence that
      omits any of those is not fixed by calling it sensitive.


      ### Check A


      The collaborators need information in time to plan. At 16:30, send a bounded update: the text can
      be delivered by 17:00; the complete image is not yet ready; propose a further status time or state
      that the estimate is still being checked. Offer the text to the audio collaborator without assuming
      they agree to a changed workload. Ask whether the proposed next step meets each collaborator''s
      needs. Embarrassment is not a reason to deprive them of useful notice.


      With the channel-access change, use the already agreed voice route for the collaborator who needs
      it. Preserve the same facts, uncertainty, option to decline, and division of authority. There is
      no need to tell the other collaborator why that route is used. The image collaborator''s tomorrow
      need may permit a different timeline, but permission and feasibility still need to be explicit.


      Repair: if your answer insists that both must wait for a perfect artifact, separate the usable partial
      deliverable from the incomplete whole. If it promises an image time without evidence, replace certainty
      with an honest estimate and review point.


      ### Check B


      Case 1 has no relevant barrier in the packet. An unpopular member''s status does not remove the
      duty to give the agreed coordinator useful notice. Case 2 justifies using the existing safe relay:
      the channel changes, not the substantive notice. Case 3 does not justify unsafe contact or inventing
      a substitute. Preserve the limitation, prioritize the stipulated safety boundary, and revisit the
      notification question only when an appropriate safe route becomes available.


      “Remaining duty” does not mean secretly demanding the prohibited immediate action. It may mean considering
      a safe later update when feasible, within the actual circumstances. An optional group''s convenience
      does not establish authority to override safety. A newly available safe route, a corrected fact
      about the commitment, or a relevant change in who is affected could justify review; someone applying
      pressure without new evidence does not by itself remove the boundary.


      The same-relevant-facts test rejects favoritism but does not erase genuine differences. Do not require
      identical actions where feasible communication differs. These judgments remain case-bound rehearsal,
      not a resolution of real safeguarding duties.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
