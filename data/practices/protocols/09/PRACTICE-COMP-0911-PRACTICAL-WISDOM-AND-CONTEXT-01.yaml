meaning_and_fit:
  purpose: Explain how timing, role, relationship, capability and cultural context affect an action without
    using context as an excuse to abandon the underlying principle.
  why_recommended: Explain how timing, role, relationship, capability and cultural context affect an action
    without using context as an excuse to abandon the underlying principle.
  claims:
  - statement: Explain how timing, role, relationship, capability and cultural context affect an action
      without using context as an excuse to abandon the underlying principle.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Practical wisdom and context practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Practical wisdom and context as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use role cards, a spoken comparison or an interpreter. Do not assume one culture’s
    directness is universally best. Cases involving threats, safeguarding, employment obligations or law
    require suitable local support beyond this exercise.
  opportunity_considerations: 'Use the principle keep people informed when a commitment changes. Case
    A: you will be ten minutes late to meet a friend. Case B: you supervise a shared task and a delay
    affects several people. Case C: a person cannot safely contact someone who has threatened them. Write
    principle, relevant facts, possible action and remaining duty for each.'
  prerequisites:
  - 'Use the principle keep people informed when a commitment changes. Case A: you will be ten minutes
    late to meet a friend. Case B: you supervise a shared task and a delay affects several people. Case
    C: a person cannot safely contact someone who has threatened them. Write principle, relevant facts,
    possible action and remaining duty for each.'
  dependencies: []
  safe_alternatives:
  - Use role cards, a spoken comparison or an interpreter. Do not assume one culture’s directness is universally
    best. Cases involving threats, safeguarding, employment obligations or law require suitable local
    support beyond this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Practical wisdom and context differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Practical wisdom and context
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the principle keep people informed when a commitment changes. Case A: you will be ten minutes
    late to meet a friend. Case B: you supervise a shared task and a delay affects several people. Case
    C: a person cannot safely contact someone who has threatened them. Write principle, relevant facts,
    possible action and remaining duty for each. Goal: Explain how timing, role, relationship, capability
    and cultural context affect an action without using context as an excuse to abandon the underlying
    principle. Scope: This is practical-judgment rehearsal with ordinary cases. It does not decide legal
    exceptions, override consent or permit unequal dignity under the label of cultural sensitivity. Time
    and effort: Thirty minutes for the case comparison and ten minutes for an optional low-stakes application.
    Adaptation: Use role cards, a spoken comparison or an interpreter. Do not assume one culture’s directness
    is universally best. Cases involving threats, safeguarding, employment obligations or law require
    suitable local support beyond this exercise. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use role cards, a spoken comparison or an interpreter. Do not assume one culture’s
    directness is universally best. Cases involving threats, safeguarding, employment obligations or law
    require suitable local support beyond this exercise.
  expected_burden: Thirty minutes for the case comparison and ten minutes for an optional low-stakes application.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Practical wisdom and context protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Practical wisdom and context action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use role cards,
    a spoken comparison or an interpreter. Do not assume one culture’s directness is universally best.
    Cases involving threats, safeguarding, employment obligations or law require suitable local support
    beyond this exercise.
  actions:
  - stable_id: PRACTICE-COMP-0911-PRACTICAL-WISDOM-AND-CONTEXT-01-A1
    sequence: 1
    title: Identify the principle and the morally relevant differences
    instructions: 'State the good the principle protects: others should be able to plan rather than being
      left in avoidable uncertainty. Compare timing, authority, relationship, communication access and
      safety in all three cases. Separate relevant differences from irrelevant status judgments. A supervisor’s
      wider responsibility changes the notification task; a threatened person’s safety changes whether
      direct contact is appropriate.


      Observation checks: The principle’s purpose is stated; All three cases receive a context comparison;
      Role and capability are not confused with human worth; Safety differences are treated as materially
      relevant. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0911-PRACTICAL-WISDOM-AND-CONTEXT-01
      action_stable_id: PRACTICE-COMP-0911-PRACTICAL-WISDOM-AND-CONTEXT-01-A1
