  - stable_id: PRACTICE-COMP-0909-TRADEOFFS-AND-OPPORTUNITY-COST-01-A2
    sequence: 2
    title: Expose the tradeoff that the first preference hides
    instructions: 'Choose two criteria that pull in different directions, such as connection now versus
      completing a repair before next week. Ask what is reversible and what opportunity expires. Identify
      the best alternative you would forgo, not the sum of every imaginable benefit. Test one changed
      assumption, such as the friend being available next week, and note whether that would change the
      ranking.


      Observation checks: Two conflicting goods are named without dismissing either; Reversibility and
      expiring opportunities are considered; Opportunity cost is the best foregone feasible alternative;
      One assumption is varied to test the preference. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
