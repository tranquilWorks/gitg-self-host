  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Systems reasoning](https://ocw.mit.edu/courses/15-871-introduction-to-system-dynamics-fall-2013/pages/syllabus/)

      - [Discriminating tests and multiple factors](https://www.itl.nist.gov/div898/handbook/pri/section3/pri3.htm)

      - [Discriminating tests and multiple factors](https://www.itl.nist.gov/div898/handbook/pri/section3/pri331.htm)

      - [Discriminating tests and multiple factors](https://www.itl.nist.gov/div898/handbook/pri/section3/pri3331.htm)

      - [Decisions among constrained alternatives](https://www.nasa.gov/reference/6-8-decision-analysis/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### What you are practicing


      Choose among worthwhile alternatives while keeping the sacrificed good visible. First protect real
      constraints; then compare benefits, costs, time, risk, reversibility, and effects on other people.
      A table helps expose a choice. It does not make your values objective or entitle you to override
      someone else''s needs.


      **Canonical scope:** Compare alternatives across benefits, costs, reversibility, time, risk, affected
      parties, and foregone options.


      **Deliverable:** A feasibility screen, a reasoned comparison of three complete plans, the best foregone
      alternative under your stated priorities, one sensitivity check, and a next-step/review record.
      Allow about 30 minutes. Paper, speech, a text editor, or option cards are sufficient. All required
      facts for the fictional route are supplied; no spending, booking, or actual social contact is required.


      This is educational source, not personal financial advice or a general scoring algorithm. The decision-analysis
      background in SOURCES.md supports documenting criteria, alternatives, uncertainty, and rationale.
      The plans and numerical checks below are original examples, not a validated measure of human flourishing.


      ### A reference for comparing without pretending everything is equivalent


      A **constraint** determines whether an option is acceptable at all: an existing promise, essential
      access, a time limit, or a required permission. A **preference** distinguishes acceptable options.
      Do not allow enough preference points to compensate for violating a genuine non-negotiable constraint.
      When a constraint is uncertain, mark the uncertainty and obtain the required information instead
      of silently treating it as satisfied.


      A **direct cost** is something consumed by the chosen plan, including future effort and time. An
      **opportunity cost** is the value of the best feasible alternative you forgo under the same decision
      boundary and priorities. It is not the sum of every appealing activity you can imagine. Without
      a stated preference ordering, the best foregone alternative can remain unresolved; explain that
      rather than inventing precision.


      **Reversibility** has stages. You may be able to cancel before starting, stop after a small trial,
      or switch later, but spent time and expired opportunities cannot always be recovered. Distinguish
      reversing a decision from fully recovering its consequences. A cancellable invitation can still
      impose inconvenience.


      **Risk** concerns possible adverse outcomes and uncertainty about them. Do not assign a numerical
      probability without a basis. Some consequences should be discussed in words or treated as constraints.
      Affected people are stakeholders, not entries whose rights disappear when the total score is high.


      A **dominated option** is no better on any included relevant criterion and worse on at least one,
      compared with another feasible option. That judgment depends on the criteria and evidence being
      complete enough. An omitted access need, obligation, or timing difference can invalidate an apparent
      dominance claim.


      A **sensitivity check** changes one stated assumption or preference weight and asks whether the
      choice changes. This reveals dependence; it is not permission to change the rules solely to make
      your favorite win. Preserve the original comparison and identify whether the change is new evidence
      or a changed preference.


      ### A different worked example: a short reading block


      A person has 40 minutes. One complete plan is a 30-minute article and 10 minutes of notes; another
      is a 40-minute conversation with a willing reading partner. Both are feasible. Reading the article
      and taking the conversation would require 70 minutes even before notes, so that combination is not
      a live alternative in the same block.


      If the person''s priority is understanding the article today, the first plan may be preferred. Its
      best foregone alternative can be the conversation, not the article plus the conversation plus every
      other good use of time. If the partner is available only today and reading can move without cost,
      the relevant opportunity changes. There is no universally correct ranking without the person''s
      aims and actual constraints.


      ### Complete practice packet: one protected two-hour block


      All people, arrangements, and values here are fictional. You have a block from **13:00 to 15:00**.
      You already promised a brief check-in from **14:50 to 15:00**. Keep those **10 minutes protected**,
      leaving **110 minutes** for an optional plan. There is no emergency, required medical action, or
      other existing duty in this packet.


      You report enough capacity to attempt any of the three plans, while valuing recovery as a legitimate
      good. All options are free, use resources already available, and meet the stipulated access needs.
      A willing friend has confirmed availability for the specified visit today. A later visit is possible
      in principle but not confirmed. The archive task has no deadline today. No physical repair, deletion
      of originals, or hazardous tool use is involved.


      #### Complete option cards


      | Plan | Optional block allocation | Main benefit | Foreseeable cost or uncertainty | Reversibility
      and affected people |

      | --- | --- | --- | --- | --- |

      | A — Archive | 90 minutes sorting duplicate copies; 20 minutes recovery | Progress on a personally
      useful archive | Less recovery than C; no live connection today; amount finished uncertain | Can
      stop after a small batch; spent time remains spent; no one else is waiting on completion |

      | B — Visit | 20 minutes round-trip travel; 60 minutes visit; 10 minutes buffer; 20 minutes recovery
      | Time with the willing friend today | Less recovery than C; no archive progress; travel may overrun
      | Confirm timing before leaving; tell the friend promptly if changing plans; missed opportunity
      may not recur soon |

      | C — Recover | 110 minutes freely chosen quiet recovery | More protected recovery time | No archive
      progress or visit today; restoration is not guaranteed | Can change the activity within the block;
      elapsed time and today''s visit opportunity are not recoverable |


      Each complete plan fills the optional 110-minute block and preserves the check-in. For B, schedule
      travel and the visit before recovery and protect the 14:50 return boundary. The buffer is included,
      not an extra ten minutes to add afterward. If travel uncertainty cannot be reconciled with the existing
      promise, modify or decline that plan rather than sacrificing the promise silently.


      Two tempting alternatives are deliberately incomplete: **D**, doing both the full archive task and
      full visit, needs 90 + 20 + 60 + 10 = 180 minutes before any recovery; **E**, postponing the visit
      to next week, has no confirmed agreement. D is infeasible in this block. E is a possible future
      inquiry, not a guaranteed substitute for today''s visit.


      #### Action 1 — Screen constraints before ranking benefits


      Write the decision, time boundary, protected promise, access conditions, and whose agreement is
      needed. Calculate each complete plan''s total. Keep rejected and unresolved alternatives in a small
      record with their reasons instead of removing them without explanation.


      Then record your initial preference and priorities. You may prefer A, B, or C, but must explain
      what makes its benefit more important in this fictional situation. Do not invent an unmentioned
      emergency or call recovery morally superior to connection, or connection superior to useful work.


      For every feasible plan, fill this comparison:


      `Benefit | direct time/effort cost | possible harm or uncertainty | reversible step | consequence
      that cannot be recovered | affected people | information still needed`


      Avoid double counting. The 90 archive minutes are already part of A''s 110-minute plan, not an additional
      90-minute opportunity cost to subtract from an arbitrarily assigned score. An opportunity cost is
      an alternative''s forgone value; mixing raw minutes, feelings, and invented points can conceal assumptions
      rather than clarify them.


      #### Action 2 — Name the conflicting goods and test an assumption


      Choose the two strongest feasible candidates under your priorities. Describe the benefit each protects
      and what the other would sacrifice. Do not make a rejected alternative look worthless to ease the
      choice. Identify the **best foregone feasible complete plan** for your provisional choice and state
      why it outranks the other unchosen plan for you.


      Now perform one of these sensitivity checks, keeping the original record:


      - The friend genuinely confirms an equally suitable visit next week. How does that affect the cost
      of forgoing today''s visit? Does it change the ranking or only make the sacrifice easier to address?

      - The archive task acquires an agreed deadline tomorrow, and no other adequate work block is available.
      Does that create a new constraint or change a preference? State which.

      - The person reports that today''s capacity has dropped so a trip is no longer manageable. Re-screen
      feasibility before scoring the options.


      These are separate hypothetical cases, not facts to combine opportunistically. Pick one and write
      exactly what changed. Different conclusions can be defensible when their criteria are explicit and
      consistent. If the choice is close, a limited information check may be more valuable than another
      invented decimal place.


      For an optional numerical extension, use the fully specified toy preference rule in Check A. Its
      numbers are stipulated units for that case, not measured values for friendship or rest. A weighted
      total never rescues an option that violates its mandatory constraints.


      #### Action 3 — Make a bounded choice and preserve the sacrifice


      Write a short decision statement:


      `I choose __ because __ under these constraints: __. The best feasible alternative I forgo is __,
      which matters because __. The assumption most likely to change this choice is __.`


      Then record the next reversible step. For A, define the first small batch while preserving originals.
      For B, confirm the already discussed timing before leaving and keep the promised return boundary.
      For C, protect the block without claiming that a particular activity must restore you. For the fictional
      route, write the step as a **rehearsal**, not an action you actually performed.


      Use this review form after a real appropriate attempt, or as a labeled plan for this fictional one:


      `Expected benefit and burden | actual observation or not yet observed | effect on the protected
      promise | effect on others | what changed | whether the sacrificed good needs another opportunity`


      Do not invent a successful outcome to close the exercise. A decision can be reasonable given the
      evidence and still have an inconvenient outcome. Conversely, a lucky outcome does not justify having
      ignored a promise. Record process quality and outcome separately.


      A later place for the sacrificed good is a possibility, not a retroactive claim that the tradeoff
      cost nothing. Seek the relevant person''s agreement before treating another visit as scheduled.
      Do not commit another person to your revised plan without consent.


      ### Fresh checks, Accessibility, and progression


      Complete both checks in **check-prompts.md**, then inspect **check-answers.md**. Check A makes time,
      benefit, feasibility, dominance, and a preference switch numerically explicit. Check B tests the
      difference between an attractive plan and an available, permitted plan.


      For Accessibility, use one plan per card or a spoken comparison of the strongest two after screening
      all candidates. A helper may record your priorities, but should not replace them with their own.
      Keep time and consent constraints visible. A calculator may support arithmetic; no speed requirement
      applies.


      For a more demanding route, create a staged alternative such as a brief trial followed by a decision,
      then account for all setup and switching time. It is a new complete plan, not free flexibility.
      Include what information the trial could actually reveal and what opportunity would expire while
      waiting.


      For later transfer, use one ordinary decision you control, record the initial priorities and alternatives
      before acting, and return after the chosen opportunity. Keep high-consequence legal, medical, fiduciary,
      or emergency choices outside this exercise and seek suitable expertise. No self-improvement target
      authorizes overriding another person''s rights.


      ### How to interpret your result


      **Supportive:** The choice preserves real constraints, compares worthwhile alternatives, names a
      best foregone plan under explicit priorities, tests an assumption, and distinguishes a planned step
      from an actual one.


      **Mixed:** The comparison is thoughtful, but the later visit is treated as guaranteed or travel
      buffer is counted twice.


      **Contradictory:** A preferred plan wins only by dropping the promise, presuming consent, or assigning
      enough points to outweigh a mandatory access condition.


      **Inconclusive:** A table is filled but no conflict, sacrifice, sensitivity result, or next step
      is stated. A fictional decision does not establish actual follow-through or wise judgment across
      contexts.


      **Final review:** What genuine good did the decision cost, why was that sacrifice acceptable under
      the stated priorities, and what would make you reconsider?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your calculations and judgment before opening the answers. All numbers and preferences
      are stipulated for these fictional cases.


      ### Check A — Feasibility, dominance, and preference sensitivity


      A person may use at most 100 future minutes for one complete plan. All plans are free, permitted,
      and meet the same access requirements. Their risk, reversibility, and effects on others are equal
      for this toy comparison. The only varying relevant quantities are:


      | Plan | Future minutes | Benefit units |

      | --- | --- | --- |

      | P | 50 | 5 |

      | Q | 70 | 8 |

      | R | 80 | 6 |

      | S | 130 | 10 |


      First screen feasibility and identify any dominated feasible plan. Then use the explicitly stipulated
      preference score **benefit minus lambda times future minutes**. Lambda is how many benefit units
      this fictional person trades for a minute; it is not a probability or a universal human value. Evaluate
      at lambda = 0.10 and lambda = 0.20.


      For each value, identify the preferred feasible plan, its best foregone feasible alternative, and
      the score difference. Find the lambda at which P and Q tie. Explain why changing lambda changes
      a preference, not the empirical time data. Would an arbitrarily high benefit score make S feasible?
      What omitted real-world difference could invalidate the claimed dominance outside this packet?


      ### Check B — A good-looking plan is not necessarily available


      You have 60 minutes before an existing commitment. Plan F is a 45-minute shared activity with a
      friend who has **not replied** to the invitation. Plan G is 50 minutes of a solo activity you control.
      Plan H is 70 minutes of another solo activity. Travel, setup, access, and cleanup are already included
      in these totals. No deadline or other duty compels any optional activity.


      Classify each as confirmed feasible, infeasible, or contingent on missing agreement. Explain the
      difference between treating F as impossible forever and treating it as not yet confirmed. Name a
      useful, proportionate next step that preserves the existing commitment without repeatedly contacting
      the friend.


      A later message confirms F, with enough time still remaining for its complete 45-minute plan. Compare
      F and G under your stated priorities, naming the best foregone confirmed alternative for whichever
      you choose. Explain why today''s unconfirmed invitation must not be recorded as a completed shared
      activity or an already scheduled replacement next week.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '### Check A — Key


      P, Q, and R meet the 100-minute constraint; S does not. Q dominates R on the stipulated relevant
      criteria: it uses 70 rather than 80 minutes and provides 8 rather than 6 benefit units, with all
      other relevant conditions equal. P and Q are not dominated by one another: P uses less time, Q provides
      more benefit.


      At lambda 0.10, scores are P = 0, Q = 1, R = -2. Q wins; P is its best foregone feasible alternative.
      The difference is 1 benefit unit. The opportunity cost is the value of P under that stated preference,
      not the sum of P, R, and the infeasible S. A zero net score in this toy scale does not mean the
      alternative has no human worth.


      At lambda 0.20, scores are P = -5, Q = -6, R = -10. P wins; Q is the best foregone feasible alternative.
      The difference is again 1. Negative net scores do not represent moral failure, and the prompt compares
      one of these complete plans; adding a new no-action alternative would require specifying its benefit
      and conditions rather than silently changing the option set.


      Set 5 - 50 lambda = 8 - 70 lambda. Thus 20 lambda = 3, or lambda = 0.15. Both scores then equal
      -2.5. A tie does not authorize claiming a unique winner. Any tie-break must be named separately.


      Changing lambda changes how this fictional person values future time relative to the stipulated
      benefit scale. It does not alter the measured or given minutes. S stays infeasible regardless of
      its score because the time constraint is mandatory. In a real comparison, an omitted access, consent,
      risk, timing, or obligation difference could defeat the apparent Q-over-R dominance.


      **Repair:** Screen the constraint before optimizing. Preserve the two score tables and identify
      the exact preference change. Do not average raw minutes with benefit units unless the conversion
      rule is explicitly supplied and appropriate.


      ### Check B — Key


      G is confirmed feasible within the supplied conditions. H is infeasible because 70 exceeds 60. F
      is contingent on missing agreement: 45 minutes would fit, but willingness is not established by
      silence. It is not necessarily impossible forever, and it is not a confirmed alternative yet.


      A proportionate step is one ordinary clarification through the agreed channel, with a cutoff that
      still preserves the existing commitment, or choosing G without waiting. Rest or no new activity
      can also be considered explicitly because no optional activity is required. Do not repeatedly message
      the friend or treat missing agreement as consent.


      After the timely confirmation, F and G are both feasible. Either may be selected with a defensible
      preference and an explicit sacrifice; the supplied times alone do not establish that the shorter
      shared option is universally better. If choosing F, G can be the best foregone confirmed alternative
      under a stated ranking; if choosing G, the reverse can apply. Keep any explicitly introduced rest
      alternative in that ranking too.


      A future invitation, a confirmed plan, an attempted action, and a completed activity are different
      states. A replacement next week needs its own agreement. Do not use an imagined future replacement
      to pretend the current sacrifice is costless.


      **Repair:** Give missing permission its own status. Do not turn an uncertainty into either an assumed
      yes or an unsupported permanent no.


      ### Main-practice review


      The optional allowance is 120 - 10 = 110 minutes. A is 90 + 20 = 110. B is 20 + 60 + 10 + 20 = 110.
      C is 110. All preserve the protected check-in under the stipulated conditions. D needs 180 minutes
      before recovery and exceeds the allowance by 70; E is not a confirmed replacement visit.


      No unique winner among A, B, and C is supplied. An acceptable response preserves constraints, states
      priorities, identifies the strongest unchosen feasible plan, and performs a consistent sensitivity
      check. It distinguishes the time irretrievably used from a practical option to stop or reschedule.
      A justified choice need not deny the value of the sacrificed good.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
