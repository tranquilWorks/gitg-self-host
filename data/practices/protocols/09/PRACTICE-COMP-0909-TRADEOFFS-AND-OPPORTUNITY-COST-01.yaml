meaning_and_fit:
  purpose: Compare live alternatives across benefits, costs, time, reversibility, risk and affected people,
    then make a choice with an explicit opportunity cost.
  why_recommended: Compare live alternatives across benefits, costs, time, reversibility, risk and affected
    people, then make a choice with an explicit opportunity cost.
  claims:
  - statement: Compare live alternatives across benefits, costs, time, reversibility, risk and affected
      people, then make a choice with an explicit opportunity cost.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Tradeoffs and opportunity cost practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Tradeoffs and opportunity cost as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use pictures, spoken comparisons or a trusted planning aid. The supplied case
    can be rehearsed without money or another participant. Do not use the exercise for clinical, legal,
    fiduciary or emergency choices that require qualified judgment.
  opportunity_considerations: 'Default: one free two-hour block can be used for a non-urgent home task,
    a willing friend’s shared activity, or recovery time. Use three option cards and seven headings: benefit,
    direct cost, time, risk, reversibility, affected people and best foregone alternative. Protect essential
    care and existing commitments first.'
  prerequisites:
  - 'Default: one free two-hour block can be used for a non-urgent home task, a willing friend’s shared
    activity, or recovery time. Use three option cards and seven headings: benefit, direct cost, time,
    risk, reversibility, affected people and best foregone alternative. Protect essential care and existing
    commitments first.'
  dependencies: []
  safe_alternatives:
  - Use pictures, spoken comparisons or a trusted planning aid. The supplied case can be rehearsed without
    money or another participant. Do not use the exercise for clinical, legal, fiduciary or emergency
    choices that require qualified judgment.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Tradeoffs and opportunity cost differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Tradeoffs and opportunity
    cost as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: one free two-hour block can be used for a non-urgent home task, a willing friend’s
    shared activity, or recovery time. Use three option cards and seven headings: benefit, direct cost,
    time, risk, reversibility, affected people and best foregone alternative. Protect essential care and
    existing commitments first. Goal: Compare live alternatives across benefits, costs, time, reversibility,
    risk and affected people, then make a choice with an explicit opportunity cost. Scope: The exercise
    supports one ordinary tradeoff. A scoring table cannot erase duties, convert another person’s rights
    into a price or make incompatible goods simultaneously attainable. Time and effort: Twenty minutes
    to compare options, one reversible next step, and a ten-minute review. Adaptation: Use pictures, spoken
    comparisons or a trusted planning aid. The supplied case can be rehearsed without money or another
    participant. Do not use the exercise for clinical, legal, fiduciary or emergency choices that require
    qualified judgment. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use pictures, spoken comparisons or a trusted planning aid. The supplied case can
    be rehearsed without money or another participant. Do not use the exercise for clinical, legal, fiduciary
    or emergency choices that require qualified judgment.
  expected_burden: Twenty minutes to compare options, one reversible next step, and a ten-minute review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Tradeoffs and opportunity cost protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Tradeoffs and opportunity cost action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use pictures,
    spoken comparisons or a trusted planning aid. The supplied case can be rehearsed without money or
    another participant. Do not use the exercise for clinical, legal, fiduciary or emergency choices that
    require qualified judgment.
  actions:
  - stable_id: PRACTICE-COMP-0909-TRADEOFFS-AND-OPPORTUNITY-COST-01-A1
    sequence: 1
    title: Separate obligations from optional alternatives
    instructions: 'List the three options and identify any non-negotiable duty, access need or promise
      that constrains the choice. For each feasible option, fill the seven headings using plain descriptions
      rather than invented precision. Include doing nothing new when rest or maintenance is genuinely
      needed. An unavailable or unaffordable option is not a meaningful alternative merely because it
      sounds attractive.


      Observation checks: At least three feasible alternatives are compared; Duties and access constraints
      are explicit; Costs include time and effects on others; Unavailable options are not treated as live
      choices. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
