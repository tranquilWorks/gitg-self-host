  - stable_id: PRACTICE-COMP-0909-TRADEOFFS-AND-OPPORTUNITY-COST-01-A3
    sequence: 3
    title: Act on the choice and preserve the sacrificed good
    instructions: 'Choose one option with a short reason that includes what you give up. Take its next
      reversible step: begin the task, make the specific invitation or protect the recovery block. Tell
      affected people about a changed commitment when necessary. Afterward, compare the actual benefit
      and cost with your expectation and decide whether the foregone good needs a later place rather than
      pretending it never mattered.


      Observation checks: The decision names both its reason and its sacrifice; A real next step or explicitly
      labeled rehearsal occurs; Affected commitments receive appropriate communication; The review retains
      the value of the foregone option. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What worthwhile thing did this choice genuinely cost, and was that sacrifice acceptable
      under the actual constraints?


      Examples: Supportive: The person chose recovery after recognizing low capacity, acknowledged the
      missed social opportunity and made a later invitation without calling rest morally superior.


      Mixed: The choice was made deliberately, but its effect on an existing promise was discovered only
      afterward.


      Contradictory: A preferred option was made to win by ignoring another person’s rights, essential
      needs or an inconvenient cost.


      Inconclusive: Alternatives were scored but no sacrifice, changed assumption or next action was identified.'
