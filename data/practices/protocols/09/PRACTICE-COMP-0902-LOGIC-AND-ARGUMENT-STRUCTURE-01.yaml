  title: 09.02 — Logic and argument structure
  scored: false
  body_format: markdown
  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [Argument terminology](https://openstax.org/books/introduction-philosophy/pages/5-3-arguments)

      - [Selected bias terminology](https://openstax.org/books/psychology-2e/pages/7-3-problem-solving)

      - [Motivational reasoning — abstract-level consultation only](https://pubmed.ncbi.nlm.nih.gov/2270237/)'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### What you are practicing


      Reconstruct what an argument actually claims, test whether its conclusion follows, and separately
      check the premises. Finish with a judgment that states the reason for accepting, rejecting, or suspending
      it. Disliking a conclusion and finding a bad inference are different things.


      **Canonical scope:** Understand premises, conclusions, validity, soundness, contradiction, inference,
      fallacy, and burden of proof.


      **Deliverable:** Two supplied argument maps, a counterexample or explanation of entailment for each,
      a premise-evidence record, and one fresh application. Allow three 15-minute sessions. Paper, a text
      editor, dictation, or premise cards are sufficient. All required data for the fictional route are
      provided. No purchase, research subscription, or live dispute is required.


      This is educational practice, not legal or scientific adjudication.  Completion is not mastery.


      ### Eight concepts, one procedure


      A **premise** is a claim offered as a reason. A **conclusion** is the claim those reasons are meant
      to support. The **inference** is the move from reasons to conclusion. Write each separately before
      judging the whole argument.


      A deductive argument is **valid** when there is no possible case in which all its premises are true
      and its conclusion is false. It is **sound** when it is valid and its premises are true. Whether
      you have established premise truth is an evidence question: use “soundness not established” when
      the available record leaves it unresolved. Do not use “invalid” merely to mean “I think a premise
      is false.”


      A **contradiction** asserts a claim and its negation with the same meaning, time, and conditions.
      “The room was open yesterday and is not open today” is not that contradiction. An unsupported claim
      is also not automatically a contradiction.


      A **fallacy** is a defect in reasoning. Explain the defect; naming one is not a substitute for an
      argument. A defective argument does not establish that its conclusion is false. A true conclusion
      can be offered for bad reasons.


      The **burden of proof** concerns who must provide adequate support for a disputed claim. Identify
      the claimant and what evidence would address the claim. A critic need not establish the opposite
      merely to point out missing support. Conversely, a critic making a new contrary claim needs support
      for that claim too. Appropriate evidence depends on the kind and stakes of the claim, not a universal
      demand for mathematical certainty.


      These distinctions follow the argument-analysis background referenced in the cohort''s SOURCES.md.
      The cases and response forms here are original instructional materials, not a validated assessment
      instrument.


      ### A different worked example: numbered tokens


      The complete toy world contains four tokens:


      `T1: blue, in drawer. T2: blue, in drawer. T3: red, on desk. T4: red, in drawer.`


      Argument: “Every blue token in this set is in the drawer. T1 is blue. Therefore T1 is in the drawer.”


      - P1: Every blue token in this set is in the drawer.

      - P2: T1 is blue.

      - C: T1 is in the drawer.


      If P1 and P2 hold, C cannot be false. The form is valid. The complete inventory establishes both
      premises within this fictional world, so the argument is sound there. This does not assert a rule
      about tokens outside the given set.


      Notice the difference between testing a form and inspecting this inventory. If the inventory were
      not available, the inference could still be valid while premise truth remained unestablished. To
      reject an inference as invalid, supply a possible arrangement that keeps *every* stated premise
      true but makes its conclusion false. A case that makes a premise false does not do that job.


      ### Complete practice packet: event claims


      Treat the following as a complete fictional inventory, not a report about real events.


      | Event | Advertised as free | Admission cost | Required travel cost | Seats | Reservations |

      | --- | --- | --- | --- | --- | --- |

      | Cedar | Yes | 0 units | 6 units | 10 | 6 |

      | Willow | Yes | 0 units | 0 units | 10 | 10 |

      | Elm | No | 4 units | 0 units | 10 | 2 |


      For this packet, **total listed attendance cost** means admission plus required travel, and **fully
      booked** means reservations equal seats. **Many reservations** means at least six. Treat the stated
      definitions consistently; there are no other costs, events, or reservations in this toy world.


      **Argument A:** “Every event advertised as free has zero total listed attendance cost. Cedar is
      advertised as free. Therefore Cedar has zero total listed attendance cost.”


      **Argument B:** “Every fully booked event in this inventory has many reservations. Cedar has many
      reservations. Therefore Cedar is fully booked.”


      Do not open the answers yet. The inventory supplies facts, not the classification of either argument.


      #### Action 1 — Make an argument map without silently repairing it


      For each argument, write P1, P2, and C in separate lines. Define the important terms using the packet.
      Mark any assumption a real version would require, such as whether an advertisement''s “free” refers
      to admission or all attendance costs. In this supplied version the explicit definition fixes the
      meaning; do not quietly change it mid-argument.


      Preserve the original before proposing a repair. A more defensible argument is useful, but it is
      not evidence that the original was already defensible.


      Use this record:


      `Original argument | P1 | P2 | C | term definitions | unstated assumption, if any | proposed repair
      kept separate`


      #### Action 2 — Test inference and truth in separate passes


      **Inference pass:** Temporarily grant every premise. Ask whether the conclusion could still be false.
      Try to construct a counterexample. Write all premises and the conclusion beside your candidate and
      explicitly mark each true or false. If one premise is false, your candidate has not refuted validity.
      When the inference is valid, explain the link rather than saying “it looks logical.”


      **Evidence pass:** Now return to the supplied inventory and check the actual premises. Calculate
      any required total or comparison. Identify which row and definition support each judgment. Report
      the conclusion''s truth separately from the validity judgment.


      Use four labels, not one impression:


      `Inference: valid / invalid with counterexample. Premise status: supported true / false / unresolved.
      Soundness: established / not sound / not established. Conclusion: true / false / unresolved in the
      stated world.`


      For the real world, “supported true” remains a judgment based on the available evidence, not omniscience.
      For this closed fictional packet, the supplied facts and definitions settle the relevant values.


      #### Action 3 — Test a fresh argument and expose the proof burden


      Complete both checks in **check-prompts.md**, save the attempts, and then open **check-answers.md**.
      Check B includes a complete fresh packet so no live argument is necessary.


      For an optional live route, select an ordinary low-stakes recommendation, such as which room to
      use for a reading group. Record its actual words, premises, conclusion, and ambiguous terms. Identify
      a fact that would test the weakest premise. Check an appropriate source or leave it unresolved.
      Record who asserted each disputed claim, what support is needed, and what you actually inspected.
      Do not invent a source or change the claim into an easier one without saying so.


      Finish with a bounded judgment: “The inference works, but premise 1 is not established,” or “This
      counterexample defeats the inference; I have not thereby proved the opposite conclusion.” A factual
      disagreement can justify suspending a decision while you obtain relevant evidence. It need not become
      a contest over who is smarter.


      ### A compact diagnostic for common errors


      **The conclusion happens to be true.** That does not show the offered reasons establish it. Write
      a possible case that separates the reasons from the conclusion.


      **A premise is false.** That can defeat soundness without defeating validity. Repeat the inference
      pass while granting it as an assumption.


      **There is an ambiguity.** State both meanings and show where the argument changes between them.
      Do not conceal an equivocation by repairing the wording without keeping the original.


      **Someone has not disproved the claim.** Record what positive support the claimant offers. Lack
      of disproof is not itself proof, and an absence claim may need a specified search method and coverage.


      **A fallacy name comes to mind.** Explain the failed move using the actual premises. A disagreement
      or unpleasant delivery alone does not diagnose a formal fallacy.


      ### Accessibility and progression


      Use one premise per card, spoken statements with a transcript, or arrows connecting reasons to a
      conclusion. A helper may transcribe or move cards at your direction, but should not choose the verdict.
      Keep term definitions visible. No speed requirement applies.


      For a more demanding exercise, replace “all” with “some” and inspect how the conclusion must narrow.
      Then examine “Nine of the last ten meetings ended on time, so the next one probably will.” That
      is a probabilistic inference, not a guarantee. Do not call every non-guaranteeing everyday argument
      a deductive fallacy; first identify the type and strength of support it claims.


      For later transfer, analyze one argument in a different ordinary context without reading your earlier
      verdicts. Preserve the original and show your counterexample or entailment explanation. Repeated
      success is task-specific evidence, not certification of general rationality.


      ### How to interpret your result


      **Supportive:** The maps preserve the original claims, the counterexample grants all premises, and
      the final judgment distinguishes inference, premise truth, and the burden of support.


      **Mixed:** A weak premise is correctly identified, but the participant calls every argument with
      that premise invalid or silently strengthens an argument before evaluating it.


      **Contradictory:** A true conclusion is treated as proof of a good inference, or a fallacy label
      is used to claim the opposite conclusion without evidence.


      **Inconclusive:** Only agreement or disagreement is recorded. There is no argument map, evidence
      record, counterexample, or explanation of why the conclusion follows.


      **Final review:** Is your objection to a premise, an inference, an ambiguity, or a missing source?
      What precise repair would address it, and what would remain unestablished?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save your response before opening the separate answer file. Use the guide''s reference as needed
      and record any help.


      ### Check A — Inference independent of premise truth


      Analyze both arguments. Number the premises and conclusion. For each, either give an assignment
      that makes all premises true and the conclusion false, or explain why there is none. Do not infer
      actual premise truth merely from the form.


      **Voucher:** If a voucher is registered, it is stamped. Voucher V is stamped. Therefore V is registered.


      **Approval:** If a summary is approved, it carries a signature. Summary S carries no signature.
      Therefore S is not approved.


      Use only two Boolean properties for each case. A conditional “if P then Q” is false only when P
      is true and Q is false. “Not P” reverses P''s truth value. List the four P/Q combinations if helpful.
      No actual vouchers, summaries, or documents are supplied.


      Explain whether the truth of either argument''s conclusion in the real world has been established
      by this packet. Would an invalid argument''s conclusion have to be false?


      ### Check B — Premise evidence, ambiguity, contradiction, and burden


      A fictional reading group needs a room for 12 people at 18:00 on Day 5. The facility''s dated room
      sheet states: “Room M: 14 seats. Room N: 10 seats.” A reservation confirmation identifies Room M,
      Day 5, 18:00. The packet contains no current opening notice, staffing record, or access confirmation.


      An organizer argues: “Every room with enough seats is available for us at that time. Room M has
      enough seats. Therefore Room M is available for us at that time.” The organizer adds, “Nobody has
      proved that it will be locked.”


      1. Reconstruct the argument and distinguish its deductive form from the evidence for each premise.

      2. Identify what the dated sheet and reservation confirmation establish, what they do not establish,
      and who is responsible for supporting the broad availability claim.

      3. Write a bounded question or source check addressing the missing information. State what you can
      conclude before receiving an answer.

      4. Explain why “Room M is open at 18:00 on Day 5” and “Room M is not open at 18:00 on Day 5” conflict
      when meanings and conditions are held fixed, but an open notice for Day 4 and a closed notice for
      Day 5 need not conflict.

      5. Explain the ambiguity if someone replaces “available” with “big enough” only when challenged.
      Preserve the original argument and give a clearly labeled narrower repair.

      6. Identify why the lack-of-disproof remark does not, by itself, supply the missing positive support.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Open only after attempting the guide''s event arguments and both checks. These are authored
      explanations, not independent learner or formal review evidence.


      ### Main practice: event arguments


      **Argument A is valid but not sound in the supplied inventory.** If every advertised-free event
      had zero total listed attendance cost, and Cedar belonged to that group, the conclusion would follow.
      That explains validity without assuming the premise actually holds.


      The inventory shows Cedar''s total listed cost as 0 + 6 = 6 units. Its advertisement is marked free.
      The first premise is therefore false in this fictional world, the second is true, and the conclusion
      is false. The false premise defeats soundness, not the all–member–property form.


      A labeled repair is: “Every event advertised as free in this inventory has zero admission cost;
      Cedar is advertised as free; therefore Cedar has zero admission cost.” The inventory supports that
      narrower premise and conclusion. It does not thereby establish zero travel cost. Keep the original
      and repair separate.


      **Argument B is invalid and therefore not sound.** The packet defines many as at least six and fully
      booked as reservations equal seats. Cedar has six reservations for ten seats: it has many reservations
      without being fully booked. Every fully booked event in the inventory still has at least six reservations.
      This is a counterexample with both premises true and the conclusion false.


      The failed move is from “fully booked implies many” to “many implies fully booked.” The condition
      was reversed. The fallacy name “affirming the consequent” is optional; this explanation is the essential
      part. A possible repair is to obtain the actual reservation and seat totals and compare them, not
      to redefine “many” after the fact.


      ### Check A


      **Voucher is invalid.** Let registered be false and stamped be true. The conditional remains true,
      the second premise is true, and the conclusion is false. A stamp might be applied for another reason;
      the premises never state that only registered vouchers receive stamps. Adding that condition is
      a new premise, not something already established.


      **Approval is valid.** Assume approval implies a signature and that there is no signature. Approval
      being true would force the signature to be true, contrary to the second premise. Therefore approval
      must be false under those assumptions. This is the form often called modus tollens.


      The table has four combinations. For Approval, the only combination satisfying both premises is
      approval false, signature false, and the conclusion is true there. For Voucher, the combination
      registered false, stamped true supplies the required counterexample.


      No actual voucher or summary is inspected, so the packet does not establish the premises'' truth
      in an external real case. It tests the forms. An invalid argument can nevertheless have a true conclusion
      in a particular case; invalidity says the premises do not guarantee it.


      **Repair:** A counterexample that makes the conditional false is not a counterexample to validity.
      Mark every premise and the conclusion, then try again while holding every premise true.


      ### Check B


      P1: Every room with enough seats is available for this group at the stated time. P2: Room M has
      enough seats. C: Room M is available for this group at the stated time. With “available” held fixed,
      this all–member–property form is valid.


      The 14-seat listing supports the capacity comparison 14 >= 12, subject to the dated source''s scope.
      The reservation confirmation is relevant positive evidence of a booking, but it does not by itself
      establish that every sufficiently large room is available or guarantee operational access. The broad
      first premise is not established. Do not label it false merely because it is unsupported; do not
      label the argument sound merely because there is a reservation.


      The organizer making the broad availability claim bears the burden of supporting it. A critic can
      identify the gap without proving the room will be locked. A critic who asserts that the room definitely
      will be locked has made a new claim requiring support.


      A bounded check is to ask the facility contact whether this group''s confirmed booking will have
      access at the stated time and whether there are current closure conditions. Until answered, distinguish
      the supported capacity and recorded reservation from operational uncertainty. Neither “definitely
      open” nor “definitely locked” follows solely from the missing record.


      The open/not-open claims conflict only with the same room, meaning, time, and conditions. Different
      dates may describe a change rather than a contradiction. The capacity/availability substitution
      is an equivocation if it is used to defend the original access conclusion. A narrower repair can
      establish “Room M''s listed seating capacity is sufficient for 12 people”; it cannot substitute
      for an access check.


      “Nobody proved it will be locked” supplies no positive access record by itself. It is not enough
      to close the missing premise. Explain that failed move instead of relying only on a fallacy name.


      **Repair:** Report “valid form; broad availability premise unresolved; soundness not established;
      actual access unresolved.” Then identify the specific source check that could justify a narrower
      practical conclusion.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
