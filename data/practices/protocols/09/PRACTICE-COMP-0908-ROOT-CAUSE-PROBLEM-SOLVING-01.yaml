    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Root-cause problem solving practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Root-cause problem solving as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use icons, a tally or an accessible location aid. A tabletop simulation can
    practice hypothesis discrimination but cannot establish an improvement in your routine. Stop where
    the problem involves electricity, machinery, injury, essential care or another person’s privacy.
