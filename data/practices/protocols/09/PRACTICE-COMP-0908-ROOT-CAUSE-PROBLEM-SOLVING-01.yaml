  purpose: Define a repeatable problem, distinguish symptoms from causal hypotheses, change one safe variable
    and verify whether the problem actually improves.
  why_recommended: Define a repeatable problem, distinguish symptoms from causal hypotheses, change one
    safe variable and verify whether the problem actually improves.
