  - stable_id: PRACTICE-COMP-0908-ROOT-CAUSE-PROBLEM-SOLVING-01-A3
    sequence: 3
    title: Verify the result and decide what remains unexplained
    instructions: 'Compare baseline and test opportunities using the same definition of unavailable. Note
      whether the item was easier to find, merely moved to a different inconvenient place, or still failed
      under one recurring condition. Retain, revise or reject the hypothesis and write the next smallest
      test. Improvement counts as a useful observation, not proof that all future failures share the same
      cause.


      Observation checks: Baseline and test use the same outcome definition; Displacement and recurring
      exceptions are retained; The causal conclusion matches the strength of evidence; A next test or
      maintenance decision is explicit. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which observation distinguished the proposed cause from a plausible alternative, and
      what failure mode remains?


      Examples: Supportive: The marked return spot helped on ordinary days but not when the notebook was
      used elsewhere, leading to a narrower two-location explanation.


      Mixed: The item became easier to find, but several simultaneous changes made the cause uncertain.


      Contradictory: The exercise blamed someone without evidence or used an unsafe repair as an experiment.


