intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default problem: a needed reusable item is often not where you expect it. Use a harmless item
    you control, such as a notebook. Record when it is needed, its expected location and where it was
    actually found. Do not track another person or search their belongings. Goal: Define a repeatable
    problem, distinguish symptoms from causal hypotheses, change one safe variable and verify whether
    the problem actually improves. Scope: This is a bounded root-cause inquiry. One successful retry does
    not prove a unique root cause, and hazardous, medical or regulated failures require appropriate professionals.
    Time and effort: Fifteen minutes to define the problem, three to five ordinary opportunities for observation,
    and twenty minutes for the comparison. Adaptation: Use icons, a tally or an accessible location aid.
    A tabletop simulation can practice hypothesis discrimination but cannot establish an improvement in
    your routine. Stop where the problem involves electricity, machinery, injury, essential care or another
    person’s privacy. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use icons, a tally or an accessible location aid. A tabletop simulation can practice
    hypothesis discrimination but cannot establish an improvement in your routine. Stop where the problem
    involves electricity, machinery, injury, essential care or another person’s privacy.
  expected_burden: Fifteen minutes to define the problem, three to five ordinary opportunities for observation,
    and twenty minutes for the comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Root-cause problem solving protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Root-cause problem solving action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use icons,
    a tally or an accessible location aid. A tabletop simulation can practice hypothesis discrimination
    but cannot establish an improvement in your routine. Stop where the problem involves electricity,
    machinery, injury, essential care or another person’s privacy.
  actions:
  - stable_id: PRACTICE-COMP-0908-ROOT-CAUSE-PROBLEM-SOLVING-01-A1
    sequence: 1
    title: Define the failure and preserve a small baseline
    instructions: 'Describe the problem as notebook unavailable at the chosen work start, not I am disorganized.
      On two ordinary opportunities, note the expected and actual location, the preceding activity and
      the interruption caused. List at least two plausible causes: the return location is unclear, or
      the notebook is needed in two places. Missing observations stay missing; do not reconstruct exact
      details from a general impression.


      Observation checks: The failure has an observable definition; Two baseline opportunities or honest
      missing data are recorded; At least two distinct causal hypotheses are listed; Character judgments
      are not treated as causes. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0908-ROOT-CAUSE-PROBLEM-SOLVING-01
      action_stable_id: PRACTICE-COMP-0908-ROOT-CAUSE-PROBLEM-SOLVING-01-A1
