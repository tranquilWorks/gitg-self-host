  - stable_id: PRACTICE-COMP-0908-ROOT-CAUSE-PROBLEM-SOLVING-01-A2
    sequence: 2
    title: Choose a discriminating test rather than a convenient fix
    instructions: 'For the unclear-location hypothesis, place a clearly marked return spot where the notebook
      is usually set down, leaving the work task and item unchanged. Predict what should improve if that
      hypothesis is right and what finding would favor the two-location explanation instead. Use three
      ordinary opportunities and keep the old arrangement reversible. Do not change several variables
