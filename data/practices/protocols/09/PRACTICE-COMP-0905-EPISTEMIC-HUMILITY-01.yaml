meaning_and_fit:
  purpose: State confidence, assumptions and a revision condition for one meaningful low-stakes belief,
    then make a proportionate update when new evidence arrives.
  why_recommended: State confidence, assumptions and a revision condition for one meaningful low-stakes
    belief, then make a proportionate update when new evidence arrives.
  claims:
  - statement: State confidence, assumptions and a revision condition for one meaningful low-stakes belief,
      then make a proportionate update when new evidence arrives.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Epistemic humility practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Epistemic humility as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use a voice memo, confidence words or a trusted reader instead of percentages.
    A fictional record demonstrates updating mechanics only. Avoid beliefs whose testing would expose
    anyone to danger, discrimination or coerced disclosure.
  opportunity_considerations: 'Choose a practical belief such as the local library is always too noisy
    for reading after lunch. Use a private record with initial claim, confidence band, reasons, assumptions,
    unknowns and revision condition. The supplied claim can also be examined with fictional observations:
    one noisy visit, followed by two quiet visits on different days.'
  prerequisites:
  - 'Choose a practical belief such as the local library is always too noisy for reading after lunch.
    Use a private record with initial claim, confidence band, reasons, assumptions, unknowns and revision
    condition. The supplied claim can also be examined with fictional observations: one noisy visit, followed
    by two quiet visits on different days.'
  dependencies: []
  safe_alternatives:
  - Use a voice memo, confidence words or a trusted reader instead of percentages. A fictional record
    demonstrates updating mechanics only. Avoid beliefs whose testing would expose anyone to danger, discrimination
    or coerced disclosure.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Epistemic humility differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Epistemic humility as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a practical belief such as the local library is always too noisy for reading after lunch.
    Use a private record with initial claim, confidence band, reasons, assumptions, unknowns and revision
    condition. The supplied claim can also be examined with fictional observations: one noisy visit, followed
    by two quiet visits on different days. Goal: State confidence, assumptions and a revision condition
    for one meaningful low-stakes belief, then make a proportionate update when new evidence arrives.
    Scope: This practices accountable uncertainty. Humility does not require treating every claim as equally
    plausible or surrendering well-supported conclusions under social pressure. Time and effort: Ten minutes
    for the initial record, one safe evidence check during the next week, and fifteen minutes for the
    update. Adaptation: Use a voice memo, confidence words or a trusted reader instead of percentages.
    A fictional record demonstrates updating mechanics only. Avoid beliefs whose testing would expose
    anyone to danger, discrimination or coerced disclosure. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a voice memo, confidence words or a trusted reader instead of percentages.
    A fictional record demonstrates updating mechanics only. Avoid beliefs whose testing would expose
    anyone to danger, discrimination or coerced disclosure.
  expected_burden: Ten minutes for the initial record, one safe evidence check during the next week, and
    fifteen minutes for the update.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Epistemic humility protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Epistemic humility action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a voice
    memo, confidence words or a trusted reader instead of percentages. A fictional record demonstrates
    updating mechanics only. Avoid beliefs whose testing would expose anyone to danger, discrimination
    or coerced disclosure.
  actions:
  - stable_id: PRACTICE-COMP-0905-EPISTEMIC-HUMILITY-01-A1
    sequence: 1
    title: Make the belief and its uncertainty explicit
    instructions: 'Replace always with a statement you can actually check, such as this branch is usually
      unsuitable for my kind of reading between one and three. Select low, moderate or high confidence
      and explain why. Distinguish one observed visit from assumptions about every weekday, every room
      and every reader. Specify in advance what evidence would increase, decrease or leave confidence
      unchanged.


      Observation checks: The belief has a bounded context; Confidence has an evidential reason; Assumptions
      and unknowns are separated; A revision condition is recorded before new information. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-0905-EPISTEMIC-HUMILITY-01
      action_stable_id: PRACTICE-COMP-0905-EPISTEMIC-HUMILITY-01-A1
      competency_stable_id: '09.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
