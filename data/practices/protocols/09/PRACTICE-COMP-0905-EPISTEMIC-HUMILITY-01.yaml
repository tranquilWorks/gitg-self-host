    body: 'Open only after preserving the initial record and revision conditions. This is supplied fictional
      evidence, not live observation by the learner.


      | Record | Day | Room | Time | Attempt and result |

      | --- | --- | --- | --- | --- |

      | L2 | Wednesday, Week 1 | Main | 13:15–13:35 | Five audible interruptions; Rowan does not finish
