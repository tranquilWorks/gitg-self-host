      the earlier visit or record establishing the source of its interruptions is supplied. The staff
      member says Quiet Q can sometimes be reserved; there is no confirmation for Rowan''s next visit.


      **L6:** A friend says, “Your difficult visits were real. I am suggesting that a different room may
      sometimes work, not that the whole building is always quiet.”


      Keep all three observations and both attributed reports distinct. Return to the guide to make the
      update. Do not open the answer file until you have saved it.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### What you will produce


      A versioned belief record: your initial claim and confidence, its assumptions and unknowns, a fair
      evidence check, and an appended update explaining what changed or why it did not. Use about 15 minutes
      before inspecting new evidence and 20 minutes afterward. Paper, a voice memo, or a text editor is
      enough.


      **Canonical scope:** State confidence levels, assumptions, unknowns, limitations, and what would
      change a belief.


      The fictional route supplies all evidence. The optional live route uses a meaningful but low-stakes
      belief of your own. Fictional updating demonstrates the procedure, not that a personally held belief
      changed. Research background S3 in SOURCES.md is limited support for the concept of recognizing
      fallibility, not validation of this exercise.


      ### The distinction that makes humility useful


      Humility is not saying “anything could be true,” apologizing for knowing something, or agreeing
      with the last speaker. It means making your confidence answerable to relevant evidence while acknowledging
      what you do not know. Strong evidence can justify strong confidence. A demand to concede is not
      new evidence.


      Keep three things separate. The **claim** is what you believe. **Confidence** is how strongly the
      available evidence supports that claim in your judgment. An **action** also depends on practical
      consequences, duties, and alternatives. A cautious action does not necessarily mean a low estimated
      probability; you might avoid even an unlikely large cost.


      An **assumption** is a premise your inference relies on, such as treating one visit as representative.
      An **unknown** is a question the record does not settle, such as whether another room is available.
      A **limitation** identifies the boundary of your observation or ability to assess it. State them
      specifically instead of attaching “I could be wrong” to an otherwise unchangeable verdict.


      Confidence words are sufficient: low, moderate, or high, each with a reason. These are not calibrated
      numerical probabilities or measured traits. Do not invent percentages to make an uncertain judgment
      look scientific.


      ### Different worked example — the missing blue folder


      A person says, “The blue folder is not in either of the two drawers I just checked.” A colleague
      replies, “It must be somewhere; be open-minded.” That reply provides no observation contradicting
      the bounded claim. The person can retain it while admitting the folder''s location is unknown.


      Later, the colleague opens a previously overlooked compartment in the first drawer and shows the
      folder. Now the inspection''s completeness is undermined. An accountable update is: “I thought I
      had checked both drawers completely. I missed that compartment. The folder is there.” Neither self-insult
      nor pretending the first statement was never made improves the correction.


      Notice that “I did not see it” and “it was not there” are different propositions. Preserve the wording
      rather than silently retreating to the weaker one after challenge.


      ### Complete initial packet — an afternoon reading place


      All observations concern a fictional reader, Rowan, and fictional North Library. No real library
      visit or private disclosure is required.


      **L1, Tuesday of Week 1, 13:15–13:35:** Rowan tries to read in the Main room. Six audible interruptions
      occur; Rowan does not finish the planned passage. Rowan reports frustration and concludes: “No room
      at North Library is usable for my afternoon reading. It is always a waste of a trip.” No other room
      was inspected. No other afternoon visit is recorded. The task was ordinary quiet reading, not an
      emergency or essential appointment.


      For this practice, a **usable attempt** means Rowan completes the planned 20-minute reading task
      and reports the setting manageable for that task. It does not mean perfect silence, usefulness to
      every reader, or access on every future day. A different actual reader may choose a different reasonable
      criterion before testing it.


      Do not open `evidence-update.md` yet. It contains the later observations. Reading them now would
      turn the initial record into a retrospective reconstruction; record any such exposure honestly.


      #### Action 1 — Preserve the original and set a fair revision condition


      Copy Rowan''s original wording as V0. Identify its universal claims and the observation that motivated
      them. Write the emotion in a separate line without treating it as proof about every room.


      Create V1, a bounded working claim worth investigating. You might focus on which room could support
      the same reading task during weekday afternoons. Do not report that V1 was Rowan''s original position:
      record the change of scope explicitly.


      Fill this form before seeing later evidence:


      `Version and time/order | exact claim | confidence word and reason | evidence IDs | assumptions
      | unknowns | limitations | evidence that would increase confidence | evidence that would decrease
      it | evidence that would leave it unchanged | planned action`


      For the original universal claim, ask what a genuine counterexample would look like. For a weaker
      frequency claim such as “usually unsuitable,” ask what repeated observations would be needed; one
      successful visit has a different logical role there. Avoid a revision condition that only your preferred
      answer could satisfy.


      #### Action 2 — Inspect a fair challenge without turning it into a contest


      Save your first record. Now open `evidence-update.md`. List each new observation with room, date,
      task, and result. Separate the staff member''s report from Rowan''s own attempts. Do not average
      unlike settings and call the result a universal property of the whole building.


      Restate the strongest relevant challenge to the initial claim in a sentence its proponent could
      recognize. Also preserve the strongest remaining reason for caution. You are not required to agree
      with a person, deny frustration, or prove a motive to use their relevant evidence.


      For each item, mark whether it addresses the same proposition, a narrower one, or a different question.
      Explain which assumption it changes. A personal judgment of usability remains about this reader
      and task; it should not be generalized to everyone with a similar preference or identity.


      #### Action 3 — Append a change log and a proportionate next step


      Keep V0 and V1 readable. Append V2 rather than editing either in place:


      `Old claim and confidence | new evidence | revised claim | revised confidence and reason | scope
      changed or same proposition? | what remains unresolved | next action | next review condition`


      Use plain language such as: “I previously thought __ because __. The new observation __ changes
      __. I now think __ within __. I still do not know __.” Fill the blanks with this packet''s evidence
      rather than a generic admission of fallibility.


      A correct update may reject a universal claim, narrow the context, or retain a supported statement.
      It need not jump to the opposite universal claim. If you change the proposition, do not report the
      two confidence words as though they were measurements of the same claim.


      Choose an action within your authority, such as another appropriate trial or asking about room availability.
      Describe why it fits the remaining uncertainty. A precaution can remain useful even after your belief
      changes. If you communicated an overstatement, draft a brief correction to the same relevant audience
      without unnecessary embarrassment or public disclosure.


      ### Fresh checks and feedback


      Save responses to the two cases in `check-prompts.md` before opening `check-answers.md`. The checks
      include an appropriate revision and an appropriate refusal to revise under unsupported pressure.
      Both are part of the skill. There is no reward for changing your mind merely to satisfy the exercise.


      ### A complete live-transfer route


      Choose one ordinary belief whose accuracy matters to a reversible choice you actually face: a place
      is unsuitable for a particular task, a routine never works at a particular time, or a service is
      unavailable under stated conditions. Avoid claims about another person''s private motives, identity,
      diagnosis, or experience of harm.


      Record V0 before seeking new information. Set a safe discriminating check, an observation window,
      and a return point. Inspect an accessible current record or make an ordinary authorized observation.
      Preserve contradictory as well as supportive evidence. At the return point, append your update even
      when no new evidence arrived; in that case mark the test unresolved rather than inventing an event.


      This route can support the canonical indicator of updating a meaningful belief when relevant evidence
      actually warrants change. A fictional exercise or the words “I am open-minded” alone cannot establish
      that indicator. Do not provoke conflict or make an unnecessary commitment to obtain evidence.


      ### Accessibility and progression


      Use a voice recording for each version, short claim cards, or a reader who preserves your exact
      wording. Dates may be replaced by an unambiguous sequence when precise timestamps are unnecessary.
      Keep sufficient context to distinguish the visits. A helper can transcribe without deciding your
      confidence.


      For a harder route, inspect evidence that changes one assumption but leaves the main judgment reasonable.
      Explain both parts without claiming that every new fact must produce a reversal. Later compare two
      actual belief records for consistency in evidence standards, not just how often you conceded.


      ### Interpreting the result


      **Supportive:** The original remains visible, relevant evidence changes a stated assumption, the
      revision is proportionate, and the new action fits the remaining uncertainty.


      **Mixed:** The new conclusion is reasonable but the previous wording is overwritten, or a change
      of scope is hidden inside a claimed confidence update.


      **Contradictory:** Social pressure substitutes for evidence, a person is humiliated into concession,
      or humility is used to demand equal weight for unsupported and well-supported claims.


      **Inconclusive:** The record says “I could be wrong” without an assumption, revision condition,
      evidence check, or accountable update.


      **Final review:** What changed your judgment, what did not, and how could another reader distinguish
      your update from politeness or hindsight?'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Use exact claims and preserve the previous version. Both cases are fictional. Save the answers
      before opening the separate key.


      ### Check A — A counterexample is not a universal reversal


      Dara writes V0: “Every afternoon attempt in this building fails for my 20-minute reading task.”
      The only evidence then available is two unsuccessful Main-room attempts. Before further visits,
      Dara writes: “A completed manageable afternoon attempt anywhere in this building would contradict
      my every-attempt claim. It would not by itself show that most future attempts succeed.”


      Later, Dara completes the task comfortably in the Side room on Wednesday at 14:00. On Friday at
      14:00 the Main-room attempt fails again. A friend says, “So you must admit the building is always
      suitable.”


      Append a revised claim and confidence with reasons. State what is contradicted, what remains uncertain,
      and why the friend''s opposite universal claim is unsupported. Preserve the room difference and
      propose a proportionate next action. Explain how the successful observation would matter differently
      if V0 had instead said “more than half of attempts are unsuitable.”


      ### Check B — Pressure, then a relevant correction


      A dated official room notice says: “Room H closed all Day 4 for maintenance.” On Day 3, Ellis writes:
      “According to the current official notice, Room H is scheduled to be closed on Day 4. I will not
      plan to use it without a newer confirmation.” Confidence is high in what the notice says, not absolute
      certainty about what will happen. Ellis records that a newer relevant notice or authorized correction
      would change the plan.


      First, a friend says: “You are too rigid. Believe it will be open.” The friend supplies no new observation
      or record.


      Then, separately, the facility issues a later official notice on Day 3: “Maintenance is postponed.
      Room H is scheduled to be open on Day 4.” Neither notice guarantees that no unexpected closure will
      occur.


      Write two separate updates, one after each message. Identify whether to retain or revise the operational
      expectation, why, and which exact proposition changes. Does the later notice make the earlier statement
      about what the original notice said false? Write a non-humiliating acknowledgment and explain whether
      any action should change.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: 'Open after saving the update and fresh-check responses. There is no single mandatory confidence
      word; the claim, evidence, context, and explanation must fit one another.


      ### Main practice


      L1 and L2 show difficulty in the Main room during the observed periods. L3 and L4 show usable attempts
      by the same reader on the same kind of task in Quiet Q. Those successes contradict the original
      claim that no room is usable or every trip is wasted. They do not establish that Quiet Q will always
      be available or manageable, that most possible visits succeed, or that every reader will find it
      useful.


      L5 is a staff report about a usual workshop and possible reservations. It does not establish the
      cause of L1''s interruptions or reserve a future visit. L6 challenges the overgeneralization without
      denying the difficult attempts. An accurate restatement keeps that distinction.


      A reasonable change log is: “I generalized from one Main-room visit to the whole library. Two later
      Quiet-Q attempts met this reader''s criterion. I now consider that room a plausible option for this
      task, subject to availability, rather than rejecting every afternoon visit. I still lack evidence
      about other rooms, future days, and durable suitability.” State whether that is a narrower proposition
      rather than presenting it as a numeric change in one unchanged belief.


      A suitable next step is to check a particular future room opening or make another ordinary trial
      while retaining an alternative. Frustration about the original visit need not disappear. The update
      corrects an inference, not a person''s dignity. The fictional record does not establish that the
      learner revised a personally meaningful belief.


      **Repair:** If you wrote “the library is always fine,” replace that opposite universal claim with
      the observed room/task scope. If you erased V0, restore it and add the revision as a later entry.
      If you inferred a confirmed workshop cause, attribute the staff report and preserve the missing
      historical record.


      ### Check A


      One genuine successful afternoon attempt contradicts “every attempt fails,” even though the later
      Main-room failure remains real. The evidence supports acknowledging that at least one context worked.
      It does not support “always suitable.” Retain the room distinction and choose a further Side-room
      check or another bounded action rather than merging all rooms into one assured property.


      The weaker claim “more than half of attempts are unsuitable” is not logically refuted by one success.
      Evaluating that frequency claim requires a specified collection of attempts, adequate sampling,
      and awareness of context. The observed attempts in the prompt are not a representative census of
      future possibilities. Do not change “every” into “usually” after the fact and say nothing changed.


      A correction could read: “I said every afternoon attempt would fail. The Side-room attempt is a
      counterexample. I was too broad; future reliability remains uncertain.” No self-insult or forced
      apology for the earlier discomfort is needed.


      ### Check B


      After the unsupported request to believe the room will open, Ellis can retain the expectation supported
      by the current notice. The friend supplies no relevant new evidence. A fair response invites a newer
      record without attacking the friend.


      After the later official correction, the current operational expectation should be updated to scheduled-open,
      retaining ordinary uncertainty about actual operation. The earlier statement that the first notice
      scheduled a closure remains historically accurate. What changes is which schedule is current, not
      what the old document said. Preserve both with their order and provenance.


      A suitable acknowledgment is: “I was relying on the earlier closure notice. The facility has since
      changed it, so I have updated the plan.” This is not a confession that reading the old notice was
      irrational. A decision to use the room can change accordingly, with a proportionate current access
      check if needed. Neither notice establishes a guarantee.


      **Repair:** If both messages caused the same reversal, identify the source and relevance of each.
      If you refused the official correction to remain consistent, distinguish consistency in evidence
      standards from keeping an outdated conclusion. If you rewrote the original record, restore its historically
      correct content and append the new one.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
