  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [AHRQ, Teach-Back](https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/teachback.html)

      - [NHLBI, Healthy Sleep Habits](https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits)

      - [NIDDK, Diet & Nutrition](https://www.niddk.nih.gov/health-information/diet-nutrition)

      - [MedlinePlus, Protein in diet](https://www.medlineplus.gov/ency/article/002467.htm)

      - [MedlinePlus, Dietary Fiber](https://www.medlineplus.gov/dietaryfiber.html)

      - [FDA, Serving Size on the Nutrition Facts Label](https://www.fda.gov/food/nutrition-facts-label/serving-size-nutrition-facts-label)

      - [FDA, Food Allergies](https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies)

      - [NIMH, Eating Disorders: What You Need to Know](https://www.nimh.nih.gov/health/publications/eating-disorders)

      - [CDC, How to Measure Physical Activity Intensity](https://www.cdc.gov/physical-activity-basics/measuring/index.html)

      - [CDC, Strategies to Prevent Worsening of Symptoms](https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html)

      - [NHS, How to improve your strength and flexibility](https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/)

      - [Mayo Clinic, Stretching and flexibility](https://www.mayoclinic.org/healthy-lifestyle/fitness/basics/stretching-and-flexibility/hlv-20049447)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after saving the shopping/meal plan. Use the R/B/V/O/F choice in this supplied record.
      All events are simulated.


      Day 1: whole packages cost 7.00 units. Ari opens the relevant packages at 12:00, prepares the lunch
      in 7 minutes, follows the stated storage instructions and reports the meal acceptable. R/B/V/O have
      the supplied subtotal of 10 g protein and 8 g fiber; F''s contribution is unknown. This is not the
      complete meal''s known nutrient total.


      ### Branch A: repeat fits the label


      Day 2: the remaining portions are used at 11:50 after appropriate refrigeration. The elapsed time
      since opening is 23 hours 50 minutes, within the fictional 24-hour limit. Preparation again takes
      7 minutes. Ari reports the lunch acceptable but wants a different protein next time. No extra purchase
      was needed. Identify the supported claim: workable repeat under these conditions, not measured nutritional
      adequacy.


      ### Branch B: repeat delayed


      Day 2: work delays lunch until 12:30. The opened R/B/V foods'' stated 24-hour limit has passed by
      30 minutes. The remaining cash is 1.00 unit. Buying replacement R/B/V packages would cost 6.00 units;
      The existing F and O remain suitable under their separate supplied instructions and are not additional
      purchases in this branch. No other ready meal or safe replacement is stipulated. Do not declare
      that the same complete lunch is still available or that the fictional budget can pay for it. Record
      the unresolved food-access need and a request for an available safe meal/support route rather than
      instructing Ari to skip nourishment. A real situation uses actual food-storage guidance and available
      support, not this invented label.


      ### Review


      Branch A supports practical repetition. Branch B exposes a timing/access failure despite a feasible
      original calculation. A future arrangement could use portions whose actual packaging safely supports
      the needed schedule or acquire a verified ready alternative in advance; neither has been obtained
      in this branch. Preserve money already spent and the failed repeat rather than rewriting the plan.'
