meaning_and_fit:
  purpose: Apply basic nutrition literacy to an affordable, accessible eating pattern that includes energy,
    protein, fiber, micronutrient variety and hydration without rigid tracking or fad rules.
  why_recommended: Apply basic nutrition literacy to an affordable, accessible eating pattern that includes
    energy, protein, fiber, micronutrient variety and hydration without rigid tracking or fad rules.
  claims:
  - statement: Apply basic nutrition literacy to an affordable, accessible eating pattern that includes
      energy, protein, fiber, micronutrient variety and hydration without rigid tracking or fad rules.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Nutrition fundamentals practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Nutrition fundamentals as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use frozen, canned, prepared, blended or culturally familiar foods when they
    meet individual safety needs. Food assistance and help with preparation are valid routes. Follow fluid
    restrictions or swallowing plans when prescribed; the exercise never requires drinking beyond those
    limits or testing a suspected allergen.
  opportunity_considerations: 'Default meal: a familiar grain or starchy food, beans or another tolerated
    protein, a vegetable or fruit, a usual source of fat or flavor, and a suitable drink. Use ingredients
    already known to be safe for you. The supplied audit asks what supplies energy, protein, fiber, varied
    micronutrients and fluid, and what is missing across the rest of the day.'
  prerequisites:
  - 'Default meal: a familiar grain or starchy food, beans or another tolerated protein, a vegetable or
    fruit, a usual source of fat or flavor, and a suitable drink. Use ingredients already known to be
    safe for you. The supplied audit asks what supplies energy, protein, fiber, varied micronutrients
    and fluid, and what is missing across the rest of the day.'
  dependencies: []
  safe_alternatives:
  - Use frozen, canned, prepared, blended or culturally familiar foods when they meet individual safety
    needs. Food assistance and help with preparation are valid routes. Follow fluid restrictions or swallowing
    plans when prescribed; the exercise never requires drinking beyond those limits or testing a suspected
    allergen.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Nutrition fundamentals differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Nutrition fundamentals as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default meal: a familiar grain or starchy food, beans or another tolerated protein, a vegetable
    or fruit, a usual source of fat or flavor, and a suitable drink. Use ingredients already known to
    be safe for you. The supplied audit asks what supplies energy, protein, fiber, varied micronutrients
    and fluid, and what is missing across the rest of the day. Goal: Apply basic nutrition literacy to
    an affordable, accessible eating pattern that includes energy, protein, fiber, micronutrient variety
    and hydration without rigid tracking or fad rules. Scope: One meal cannot establish nutritional adequacy
    for a whole diet. Individual allergies, swallowing needs, pregnancy, disease, medication interactions
    and clinician-directed diets take precedence; no calorie deficit or supplement regimen is prescribed.
    Time and effort: Fifteen minutes to plan, one ordinary meal preparation or purchase, and a five-minute
    review after a second comparable meal. Adaptation: Use frozen, canned, prepared, blended or culturally
    familiar foods when they meet individual safety needs. Food assistance and help with preparation are
    valid routes. Follow fluid restrictions or swallowing plans when prescribed; the exercise never requires
    drinking beyond those limits or testing a suspected allergen. Keep personal working notes outside
    the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use frozen, canned, prepared, blended or culturally familiar foods when they meet
    individual safety needs. Food assistance and help with preparation are valid routes. Follow fluid
    restrictions or swallowing plans when prescribed; the exercise never requires drinking beyond those
    limits or testing a suspected allergen.
  expected_burden: Fifteen minutes to plan, one ordinary meal preparation or purchase, and a five-minute
    review after a second comparable meal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Nutrition fundamentals protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Nutrition fundamentals action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use frozen,
    canned, prepared, blended or culturally familiar foods when they meet individual safety needs. Food
    assistance and help with preparation are valid routes. Follow fluid restrictions or swallowing plans
    when prescribed; the exercise never requires drinking beyond those limits or testing a suspected allergen.
  actions:
  - stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01-A1
    sequence: 1
    title: Explain the meal’s functions and its actual constraints
    instructions: 'Use the default or a familiar cultural meal to identify the five nutrition functions.
      Energy needs depend on the person and activity; a single plate does not reveal energy balance or
      every micronutrient. Check budget, preparation time, storage, appetite, sensory needs and allergy
      information, including cross-contact where relevant. Record an unknown rather than treating a marketing
      label as proof of nutritional completeness.


      Observation checks: Energy protein fiber variety and fluid each have an identified source or gap;
      A single meal is not equated with whole-diet adequacy; Budget preparation storage and access constraints
      are included; Allergy and individual care requirements control ingredient choice. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01
      action_stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01-A1
      competency_stable_id: '12.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1203_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1203_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - energy_protein_fiber_variety_and_fluid_each_have_an_identified_source_or_gap
        - a_single_meal_is_not_equated_with_whole_diet_adequacy
        - budget_preparation_storage_and_access_constraints_are_included
        - allergy_and_individual_care_requirements_control_ingredient_choice
      - measurement_id: c1203_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1203_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01-A2
    sequence: 2
    title: Prepare or obtain the meal with one practical improvement
    instructions: 'Make or purchase the chosen meal using familiar safe methods. Change one feasible gap,
      such as adding tolerated beans, a cooked vegetable or access to a suitable drink; do not simultaneously
      eliminate entire food groups. Follow the product’s preparation and storage instructions. Eat according
      to your established needs or care plan, noting adequacy, enjoyment and convenience without classifying
      the meal as morally clean or bad.


      Observation checks: An actual meal is prepared or obtained safely; One identified gap receives a
      feasible change; No unsupported elimination or restrictive target is introduced; Nourishment enjoyment
      and convenience are all considered. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01
      action_stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01-A2
      competency_stable_id: '12.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1203_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1203_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - an_actual_meal_is_prepared_or_obtained_safely
        - one_identified_gap_receives_a_feasible_change
        - no_unsupported_elimination_or_restrictive_target_is_introduced
        - nourishment_enjoyment_and_convenience_are_all_considered
      - measurement_id: c1203_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1203_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01-A3
    sequence: 3
    title: Repeat once and test whether the pattern is sustainable
    instructions: 'Use the meal or an equivalent version at another ordinary opportunity. Compare cost,
      access, satisfaction and fit with the rest of the day. Choose one alternate protein, plant food
      or preparation that adds variety within the same constraints. If adequacy, unwanted weight change,
      restrictive eating or a medical diet remains uncertain, take the specific question to a qualified
      clinician or dietitian rather than escalate self-tracking.


      Observation checks: The pattern is repeated or the missing opportunity is explicit; Cost satisfaction
      and day-level fit are compared; A realistic variety option is identified; Persistent nutritional
      or medical uncertainty has a qualified review route. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which small change made adequate nourishment easier to repeat, and which need cannot
      be inferred from this meal alone?


      Examples: Supportive: A tolerated bean-and-rice meal with vegetables was repeated affordably, and
      an alternate protein kept the pattern flexible.


      Mixed: The meal covered several functions but preparation time made it unrealistic on workdays,
      so a prepared alternative was needed.


      Contradictory: The exercise became calorie punishment, allergy testing or an unsupported elimination
      diet.


      Inconclusive: Nutrient categories were memorized without preparing, obtaining or repeating a workable
      meal.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1203-NUTRITION-FUNDAMENTALS-01
