  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make nourishment practical without turning it into a score


      A workable eating pattern supplies energy and nutrients, fits the person''s needs and can be repeated
      with available money, time and support. One impressive label or one meal cannot establish that a
      whole diet is adequate. This guide teaches energy balance, protein, fiber, micronutrient variety,
      hydration, food quality, allergies and individual constraints through a complete meal-planning case.


      Allow 15 minutes for the meal and budget, 10 for the later repeat and 10 for checks. Use paper,
      a calculator or dictation. All foods, prices and outcomes below are invented. No purchase, tasting,
      private dietary disclosure or calorie/weight tracking is required. The default produces a practical
      meal plan and a repeat decision; it does not show that you prepared or ate a meal. Health and exercise
      content must be adapted to the person and does not replace licensed medical care.


      ### Understand the functions and the label''s limits


      Food provides energy for bodily functions and activity; energy balance concerns intake and expenditure
      over time, not the moral quality of one plate. [Protein supplies building material](https://www.medlineplus.gov/ency/article/002467.htm),
      [fiber supports digestive function](https://www.medlineplus.gov/dietaryfiber.html), and varied foods
      can contribute different vitamins and minerals. Fluid is another need, with individual restrictions
      or swallowing plans taking priority. Needs vary with the person, circumstances and care plan; no
      intake target is supplied here. [NIDDK''s nutrition overview](https://www.niddk.nih.gov/health-information/diet-nutrition)
      supports the broad energy/nutrient distinction.


      Food quality includes useful nourishment, safety, enjoyment and practical fit. Convenient canned,
      frozen or prepared foods can be suitable; “fresh” and “expensive” do not establish adequacy. A familiar
      cultural meal need not be replaced by a standardized plate. Variety is an option to make a pattern
      workable, not a demand to ignore sensory limits or eliminate tolerated foods.


      A label''s serving size describes the unit used for the listed information; it is not a personal
      portion prescription. Multiply per-serving values by the number of servings actually considered,
      and keep per-container and per-serving units separate. [FDA''s serving-size explanation](https://www.fda.gov/food/nutrition-facts-label/serving-size-nutrition-facts-label)
      supports this calculation. The numbers below teach label arithmetic, not a nutrient quota.


      Allergy information is a safety constraint. Read the applicable label, including ingredients and
      relevant cross-contact information, and follow the person''s existing allergy plan. An unreadable
      label or missing voluntary warning does not prove safety. Do not taste-test a suspected allergen.
      [FDA''s food-allergy guidance](https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies)
      concerns U.S. labeling; other jurisdictions differ. A fictional “verified for this case” status
      is not assurance about any real product.


      ### Worked example: a container has two servings


      A fictional pot lists protein 6 g and fiber 3 g per serving, two servings per pot. The entire pot
      supplies 12 g protein and 6 g fiber by label arithmetic. That says nothing about whether the person
      should eat the whole pot or whether the day is nutritionally adequate. If the pot costs 2.40 units,
      purchasing it costs 2.40 even when half is used now; allocating 1.20 to this meal does not reduce
      the cash needed at checkout.


      ### Complete materials: Ari''s two lunches


      Ari has a familiar eating plan and a sesame allergy. For this synthetic case only, R, B, V, F, P
      and O have been checked against Ari''s existing allergy plan, including relevant handling, and are
      tolerated. S contains sesame. U has unreadable ingredients and unknown cross-contact status. There
      are no other stipulated dietary restrictions. Never infer these statuses for products outside this
      case.


      Available money for the two lunches is 8.00 units. Each lunch has at most 8 minutes of preparation.
      A refrigerator, microwave, safe drinking water and the listed packaging instructions are available.
      Ari''s existing plan uses one listed portion each of R, B, V and O for this familiar lunch; this
      is a fictional personal plan, not a serving recommendation. All packs contain exactly two such portions
      except where shown. Prices are whole-package cash costs, not per-portion costs.


      | Code | Food and package | Cost units | Preparation for one lunch | Function/information |

      | --- | --- | --- | --- | --- |

      | R | Familiar ready rice, 2 portions | 2.00 | 2 minutes | Starchy energy source; protein 2 g, fiber
      1 g per portion |

      | B | Tolerated ready beans, 2 portions | 2.40 | 2 minutes | Protein 7 g, fiber 5 g per portion
      |

      | V | Ready vegetables, 2 portions | 1.60 | 1 minute | Plant variety; protein 1 g, fiber 2 g per
      portion |

      | O | Familiar oil/flavor, 2 portions | already available, 0.00 cash | 1 minute to assemble with
      R/B/V | Energy and flavor; protein 0 g, fiber 0 g per portion |

      | F | Familiar fruit, 2 portions | 1.00 | 1 additional minute | Optional additional plant variety;
      no nutrient figures supplied |

      | P | Tolerated ready alternate protein, 2 portions | 2.80 | 2 minutes | Optional replacement for
      B; no nutrient figures supplied |

      | S | Sauce, 2 portions | 0.80 | 1 minute | Contains sesame; excluded by Ari''s plan |

      | U | Loose mixed topping, 2 portions | 0.40 | 1 minute | Ingredient and cross-contact information
      unknown |


      The table''s preparation times are sequential and include all preparation for the stated foods;
      add them, do not assume overlap. Filling the already available water cup adds no preparation time
      in this toy case. R/B/V/O packaging permits the stated preparation. Unused opened R/B/V portions
      must be refrigerated promptly and used no later than the label''s 24-hour limit after opening. F
      and O have separate supplied storage instructions that permit their remaining portions on day 2;
      they do not inherit R/B/V''s limit. The first lunch is planned just after 12:00, and the second
      before 12:00 the next day, allowing preparation and use before the boundary. These are supplied
      toy package facts, not a general food-storage rule. Record the actual opening/use times when reviewing
      the repeat.


      #### Action 1 — Build a meal that fits


      Make the R/B/V/O lunch and decide whether to include F. Identify energy, protein, fiber, micronutrient
      variety and fluid sources, and at least two unknowns about the whole day. Calculate whole-package
      cash, one-lunch preparation time and the provided protein/fiber subtotal. Do not invent values for
      F or P. State the safety disposition of S and U separately: known incompatible and unverified are
      different reasons not to select them.


      Use `foods | five functions | known safety basis | unknowns | whole-package cash | preparation |
      opening/use plan | alternative`. Save this before [later-packet.md](?resource=file-later-packet-md).
      Your decision concerns the supplied plan''s fit; no one needs to eat the fictional quantities.


      #### Action 2 — Use the later meal and repeat record


      The later packet supplies actual simulated preparation and repeat times. Check the label''s storage
      boundary before claiming the second meal is usable. Compare cash already spent with extra cash required
      for a replacement. Time and storage can defeat a meal that looks nutritionally attractive. Do not
      consume questionable food to satisfy a repeat requirement; if the case no longer supplies a feasible
      safe option, record the access gap explicitly.


      #### Action 3 — Preserve nourishment and flexibility


      Choose retain, adapt or seek support based on the repeat. Name a realistic alternative protein or
      preparation within the same constraints, preserving allergy verification and the existing plan.
      Distinguish an alternative calculated on paper from an actual second meal. If a real pattern raises
      adequacy concerns, restrictive eating, unwanted weight change or medical-diet uncertainty, bring
      a specific question to a qualified clinician or dietitian rather than escalating self-tracking.


      Attempt [fresh checks](?attempt=practice-checks) before [corrective guidance](?check=practice-answers).
      A complete source artifact contains the feasible first plan, honest nutrient unknowns, storage/cash
      accounting and repeat decision. It does not establish whole-diet adequacy.


      ### Access, harder work and transfer


      Use a calculator, read-aloud labels or a consented preparation helper. Prepared, blended or culturally
      familiar equivalents may be used only when compatible with actual allergy, swallowing and other
      care needs. Food assistance and preparation support are valid practical routes; a budget shortfall
      is not a character judgment. Keep personal food/health records private.


      Harder case: before purchasing anything, replace B with P and retain R/V/O/F. Compute 7.40 units
      cash and 7 minutes preparation; both fit. Protein and fiber totals are now unknown because P and
      F lack figures. Do not keep B''s nutrient numbers after replacing it. This is a feasible alternative
      for the fictional Ari only because P''s tolerability is explicitly supplied.


      At a later ordinary real opportunity, use familiar safe foods within your established needs, make
      or obtain the meal, and compare a second occasion for satisfaction, access, cost and preparation
      burden. Keep other meals and fluid needs in view. Do not impose a deficit, supplement regimen or
      elimination diet. Actual food preparation is behavioral evidence only if performed; simulated records
      and author review are different evidence types, and two meals do not prove broad nutrition competence.


      **Supportive:** A tolerated, affordable pattern is actually repeated with appropriate storage and
      acceptable burden.


      **Mixed:** The first meal works, but timing or access makes its repeat require another arrangement.


      **Contradictory:** An allergen is tested, unsafe leftovers are used, or nourishment is withheld
      to make the numbers look favorable.


      **Inconclusive:** A menu is calculated without an actual meal on the live route, or missing label
      facts are silently filled in.


      See scope and limits described in this guide and [source notes](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A fictional container holds three servings, each with 4 g protein and 2 g fiber. The whole
      container costs 3.60 units. Calculate the label quantities for two servings and the cash needed
      to buy the container. Does the label tell the person to eat two servings?

      2. A topping says “plant based”; its ingredients are unreadable and cross-contact information is
      absent. The person has a relevant allergy. Another topping explicitly contains that allergen. Distinguish
      the statuses and explain whether either is established suitable by those facts.

      3. A planned lunch includes a food with no protein value supplied. A reviewer substitutes a different
      food''s number to reach a target. Correct the calculation and explain what additional information,
      if actually needed, could resolve the gap without prescribing a diet.


      Save your answers before opening [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Two servings give 8 g protein and 4 g fiber. Buying the package requires 3.60 units even
      though two-thirds of its cost is 2.40. Serving size is a label unit, not a portion recommendation.
      If you used the allocated cost as cash, redo the budget with whole packages.

      2. One topping is unverified; the other is known incompatible. Neither is established suitable.
      “Plant based” does not resolve an allergy, and absence of information cannot become reassurance.
      Use a known suitable alternative or obtain reliable information consistent with the existing allergy
      plan; do not taste-test uncertainty.

      3. Keep the known subtotal and mark the total unknown. A relevant verified label or appropriate
      qualified advice could resolve a genuine question. A copied number does not establish adequacy,
      and a target invented for this exercise is not an individual nutrition need.


      This is source reasoning about a synthetic meal, not a dietetic assessment.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
