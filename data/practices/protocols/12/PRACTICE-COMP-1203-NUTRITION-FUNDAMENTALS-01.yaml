  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Nutrition fundamentals; no purchase, subscription, travel, credential, or public artifact is required.
    accessibility:
    - Use frozen, canned, prepared, blended or culturally familiar foods when they meet individual safety
      needs. Food assistance and help with preparation are valid routes. Follow fluid restrictions or
      swallowing plans when prescribed; the exercise never requires drinking beyond those limits or testing
      a suspected allergen.
    cultural_context:
    - Adapt the expression of Nutrition fundamentals to direct or indirect communication, collective or
      individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use frozen, canned, prepared, blended or culturally familiar foods when they meet individual safety
      needs. Food assistance and help with preparation are valid routes. Follow fluid restrictions or
      swallowing plans when prescribed; the exercise never requires drinking beyond those limits or testing
      a suspected allergen.
  pause_conditions:
  - Pause Nutrition fundamentals when capacity, consent, authority, privacy, access, care duties, uncertainty,
    distress, fatigue, pain, resource scarcity, or changed circumstances make the next action unwise.
  stop_conditions:
  - Stop the Nutrition fundamentals practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Nutrition fundamentals situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Health and exercise content must be adapted to the person and does not replace licensed medical care.
