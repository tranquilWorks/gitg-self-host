  - stable_id: PRACTICE-COMP-1213-GROOMING-DRESS-AND-PRESENTATION-01-A2
    sequence: 2
    title: Complete a small routine using what is already available
    instructions: 'Perform the familiar hygiene step, choose a clean suitable outfit and make one simple
      repair or adjustment if needed, such as removing a stain according to the label or replacing an
      uncomfortable layer. Test sitting, reaching and walking or wheeling in the outfit. Avoid unfamiliar
      products that may irritate skin or unsafe attempts to force a particular posture; use established
      care guidance for medical or skin concerns.


      Observation checks: A concrete hygiene and clothing routine is completed; Existing items are used
      before assuming a purchase is necessary; The outfit is tested during the actual required movements;
      Irritation medical needs and unsafe posture demands are not ignored. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
