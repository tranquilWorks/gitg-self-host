meaning_and_fit:
  purpose: Use hygiene, clothing, comfort and presentation to support health, identity and participation
    without turning appearance, brand or body shape into a measure of worth.
  why_recommended: Use hygiene, clothing, comfort and presentation to support health, identity and participation
    without turning appearance, brand or body shape into a measure of worth.
  claims:
  - statement: Use hygiene, clothing, comfort and presentation to support health, identity and participation
      without turning appearance, brand or body shape into a measure of worth.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Grooming, dress, and presentation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Grooming, dress, and presentation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use fragrance-free products, seated grooming, adaptive fasteners, a helper
    with consent or culturally appropriate dress. Limited laundry, money or housing access may require
    support, not a stricter standard. A person need not look conventional to be dignified or prepared.
  opportunity_considerations: 'Default occasion: a casual meeting in a shared indoor space. Use existing
    clothes and familiar hygiene products. The supplied check is clean enough for the context, comfortable
    movement and temperature, any legitimate safety requirement, and an appearance choice that feels like
    you. No purchase, fragrance, cosmetic procedure or forced posture is required.'
  prerequisites:
  - 'Default occasion: a casual meeting in a shared indoor space. Use existing clothes and familiar hygiene
    products. The supplied check is clean enough for the context, comfortable movement and temperature,
    any legitimate safety requirement, and an appearance choice that feels like you. No purchase, fragrance,
    cosmetic procedure or forced posture is required.'
  dependencies: []
  safe_alternatives:
  - Use fragrance-free products, seated grooming, adaptive fasteners, a helper with consent or culturally
    appropriate dress. Limited laundry, money or housing access may require support, not a stricter standard.
    A person need not look conventional to be dignified or prepared.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Grooming, dress, and presentation differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Grooming, dress, and presentation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default occasion: a casual meeting in a shared indoor space. Use existing clothes and familiar
    hygiene products. The supplied check is clean enough for the context, comfortable movement and temperature,
    any legitimate safety requirement, and an appearance choice that feels like you. No purchase, fragrance,
    cosmetic procedure or forced posture is required. Goal: Use hygiene, clothing, comfort and presentation
    to support health, identity and participation without turning appearance, brand or body shape into
    a measure of worth. Scope: This is a practical readiness routine, not a beauty standard, dress-code
    legal opinion or requirement to mask disability, culture, gender expression or sensory needs. Time
    and effort: Twenty minutes to prepare for one real low-stakes occasion and five minutes afterward.
    Adaptation: Use fragrance-free products, seated grooming, adaptive fasteners, a helper with consent
    or culturally appropriate dress. Limited laundry, money or housing access may require support, not
    a stricter standard. A person need not look conventional to be dignified or prepared. Keep personal
    working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use fragrance-free products, seated grooming, adaptive fasteners, a helper with
    consent or culturally appropriate dress. Limited laundry, money or housing access may require support,
    not a stricter standard. A person need not look conventional to be dignified or prepared.
  expected_burden: Twenty minutes to prepare for one real low-stakes occasion and five minutes afterward.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Grooming, dress, and presentation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Grooming, dress, and presentation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use fragrance-free
    products, seated grooming, adaptive fasteners, a helper with consent or culturally appropriate dress.
    Limited laundry, money or housing access may require support, not a stricter standard. A person need
    not look conventional to be dignified or prepared.
  actions:
  - stable_id: PRACTICE-COMP-1213-GROOMING-DRESS-AND-PRESENTATION-01-A1
    sequence: 1
    title: Translate the occasion into functional requirements
    instructions: 'Identify the setting, temperature, activity and any verified safety or uniform requirement.
      Separate those requirements from assumptions about status or attractiveness. Check the clothing’s
      condition, comfort when sitting or moving, and the hygiene task actually needed. Keep cultural dress,
      gender expression, assistive equipment and sensory constraints visible rather than treat them as
      defects to conceal.


      Observation checks: The occasion’s actual functional requirements are identified; Status and attractiveness
      assumptions are separated from requirements; Clothing condition comfort and needed hygiene are checked;
      Identity access and sensory needs remain legitimate constraints. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1213-GROOMING-DRESS-AND-PRESENTATION-01
      action_stable_id: PRACTICE-COMP-1213-GROOMING-DRESS-AND-PRESENTATION-01-A1
      competency_stable_id: '12.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
