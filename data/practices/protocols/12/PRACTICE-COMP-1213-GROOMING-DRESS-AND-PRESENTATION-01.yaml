  - id: file-later-packet-md
    title: Later packet
    body: 'Open after preserving the provisional plan. All events are fictional.


      At 13:51 the movement check shows L over B restricts the required reach. B alone permits the familiar
      movement. Removing L and repeating the affected reach takes exactly 1 minute in this case, finishing
      at 13:52. Amari retains D/I, the usual aid and comfortable posture. The one-minute reserve is now
      used; it is not available for another task. No new product or clothing purchase occurs.


      Amari departs at 13:52 and arrives at 14:00. At the meeting, B/D/I allows participation but the
      room feels cooler than preferred without L. The organizer confirms a warmer accessible seat is available;
      Amari uses it and reports acceptable comfort. The bag is placed on the available shelf, out of the
      aisle. No compliment is recorded and none is needed to assess these functional observations.


      The initial selection was mixed; the correction and actual supplied occasion support practical readiness.
      Keep the reach check next time and choose an already available, movement-compatible layer earlier.
      Such a layer has not been specified or obtained in this case, so record it as a future preparation
      question rather than an owned item.


      Separate harder timing branch: if the same removal/recheck takes 2 minutes, departure becomes 13:53
      and arrival 14:01. Preserve the 1-minute delay and communicate appropriately; do not spend the reserve
      twice or report a 14:00 arrival. The branch does not authorize speeding or removing the aid.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Prepare for participation rather than an appearance verdict


      Presentation can support hygiene, comfort, identity and the purpose of an occasion. It does not
      determine human worth. The useful question is what the person and setting actually need: clean hands,
      a comfortable layer, usable fasteners, room for an aid, or clarification of a real rule. Brand,
      attractiveness and an imagined audience are poor substitutes for those requirements.


      This guide provides a complete fictional preparation routine for a casual library meeting. Allow
      10 minutes to plan, 10 for the later movement/occasion record and 10 for checks. Paper, dictation
      or labeled item cards suffice. No clothing purchase, new product, photograph, body rating, forced
      posture or private disclosure is required. The default produces a functional preparation plan and
      a review of supplied outcomes, not evidence that the learner groomed or attended. Health and exercise
      content must be adapted to the person and does not replace licensed medical care.


      ### Translate the occasion into requirements


      Hygiene is about the relevant care task and setting, not a demand for fragrance, hair removal, cosmetics
      or a culturally narrow look. Familiar handwashing can matter after handling dirt or before eating:
      [CDC describes wetting, lathering, scrubbing, rinsing and drying](https://www.cdc.gov/clean-hands/about/index.html),
      including at least 20 seconds of scrubbing. That is not the entire routine''s elapsed time. Use
      established care advice for skin or medical concerns; do not introduce an irritating product to
      meet a cosmetic expectation.


      Clothing needs to allow the actual activity and the person''s temperature, sensory and identity
      needs. A seated check can reveal a pressing seam; reaching can reveal restriction that standing
      still misses. Posture should support comfortable participation with usual positioning aids, not
      imitate a rigid appearance ideal. Do not force a position or hide disability to pass the exercise.


      Distinguish verified requirements from preferences and unsupported assumptions. A venue''s actual
      access or safety instruction deserves a practical response; an unverified “people like us must wear
      this” claim needs clarification. Cultural dress and gender expression are legitimate choices. If
      a requirement conflicts with access or identity, use an appropriate accommodation/clarification
      route rather than issue a legal opinion or blame the person.


      ### Worked example: the admired outfit does not fit the task


      A visitor receives a compliment on a jacket but cannot comfortably reach the tabletop activity while
      wearing it. A familiar alternative permits the movement. The compliment is evidence that someone
      expressed approval, not proof that the jacket supports participation. Changing the layer can be
      useful without rejecting the visitor''s identity or buying a new one.


      ### Complete materials: Amari''s 14:00 meeting


      Amari is attending a casual library reading group at 14:00. Travel from home to the accessible room
      takes 8 minutes using the usual aid; all route/access arrangements are already confirmed. Amari
      is comfortable using this route in the case. Preparation starts at 13:40. Room temperature is expected
      to be 18°C; Amari usually wants a removable layer there. This is a personal preference in the case,
      not a temperature standard.


      The organizer confirms: casual clothing is welcome, avoid added fragrance in the shared room, and
      keep bags out of the aisle. There is no brand, formal-dress or body-posture rule. Amari wants to
      retain a familiar identity-related accessory, which fits comfortably and does not obstruct the activity
      or aid. A shelf spot for the bag is available. Hands are dirty from potting a plant, so a familiar
      handwashing step is needed. Soap, running water and a clean towel are already available and suitable
      for Amari.


      | Item | Known state | Decision implication |

      | --- | --- | --- |

      | A, prestige shirt | clean; restricts the required seated reach | Status does not repair the movement
      problem |

      | B, familiar shirt | clean; ordinary sitting comfortable; required reach not yet checked | Candidate
      pending the movement check |

      | C, favorite stained shirt | cleaning label requires a 30-minute wash; no clean spare of this design
      | Cannot assume an instant safe cleaning method |

      | D, familiar lower garment | clean, comfortable in the required movements; usual aid fits | Suitable
      existing option |

      | L, removable layer | clean; expected warmth useful; reach over B not yet checked | Candidate,
      not already verified |

      | I, identity accessory | familiar, comfortable and compatible with activity/aid | No reason supplied
      to remove it |


      All items are already owned; no purchase is needed. The proposed B/D/L/I combination is provisional
      until its movement check. Do not label untested reach comfortable merely because the shirt is familiar.


      #### Action 1 — Build the requirements and timing card


      List hygiene, clothing condition, temperature, actual movement, usual posture/support, identity,
      sensory constraints and the two organizer rules. Separate preference from verified rule. Schedule
      the supplied tasks without overlap:


      | Interval | Task | Minutes |

      | --- | --- | --- |

      | 13:40–13:42 | Familiar handwashing including rinsing and drying | 2 |

      | 13:42–13:46 | Put on B/D/I and check fasteners/aid clearance | 4 |

      | 13:46–13:48 | Add removable L | 2 |

      | 13:48–13:51 | Test required sitting, reach and ordinary route movement with aid | 3 |

      | 13:51–13:52 | Unallocated adjustment reserve | 1 |

      | 13:52–14:00 | Confirmed journey to meeting | 8 |


      This totals 20 minutes. The reserve is one minute of capacity, not another required grooming task.
      A needed correction must fit it or prompt an honest timing change. The 30-minute wash for C cannot
      fit this schedule; do not invent an alternative cleaning method or silently shorten travel.


      #### Action 2 — Preserve the provisional choice, then use the check


      Write `chosen items | actual requirements | unchecked movement | hygiene action | intervals | adjustment
      option | departure`. Select B/D/L/I provisionally and save the plan before [later-packet.md](?resource=file-later-packet-md).
      The packet supplies the movement result and the allowed correction time. A successful plan includes
      a way to react to a failed check, not a prewritten claim that everything passed.


      #### Action 3 — Judge the occasion by function


      Review actual comfort, access, temperature, participation and verified rule issues. Record compliments,
      if present, separately; they cannot cancel pain or restriction. Keep one preparation step and change
      one avoidable obstacle. If a real condition cannot be met within available time, ask for a practical
      adjustment or arrive late honestly; do not use painful posture, identity concealment or an unsafe
      shortcut.


      Attempt [fresh checks](?attempt=practice-checks) before [corrective guidance](?check=practice-answers).
      The source artifact is complete with the requirement/timing card, provisional selection, movement
      correction and occasion review.


      ### Access, harder practice and later transfer


      Use a seated routine, familiar adaptive fasteners, a consented helper or a reader. Sensory supports
      and identity choices remain. If laundry, water, housing or clothing access is limited, record the
      practical support needed rather than tighten appearance demands. No one needs a conventional presentation
      to be dignified.


      Harder variation: the organizer changes the room and cannot yet confirm step-free access. The outfit
      and timing may still look adequate, but participation is unverified. Ask for access clarification
      or a suitable alternative; neither a compliment nor a spare clothing layer solves an inaccessible
      route.


      At a later real low-stakes occasion, use familiar safe hygiene care and existing clothes, check
      actual movements with usual support, and review participation afterward. If no occasion occurs,
      label a private rehearsal as rehearsal. An actual routine, self-review, another person''s unsolicited
      compliment and independent observation are distinct evidence. The guide is not a clinical skin-care
      plan or dress-code legal ruling.


      **Supportive:** Existing items and a small routine remove a participation obstacle while preserving
      comfort and identity.


      **Mixed:** The initial choice fits one need but a movement or access check requires a change.


      **Contradictory:** Painful posture, irritants or unwanted identity concealment are imposed for an
      imagined appearance standard.


      **Inconclusive:** Brands or compliments are counted without observing hygiene, movement, access
      or the occasion.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. An outfit receives compliments but restricts the actual seated task; a familiar clean alternative
      allows it. Which evidence should guide the choice, and must the person change an unrelated identity
      accessory?

      2. Preparation has 2 minutes of reserve. A necessary correction takes 3 minutes and travel cannot
      be shortened. Calculate the remaining delay and describe the honest response without forcing posture
      or removing support.

      3. A casual venue has no fragrance requirement, and a person has sensitive skin and a familiar care
      plan. A friend says a new scented product and expensive brand are mandatory to show respect. Separate
      verified requirement, preference and unsupported claim; identify a practical route.


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Use actual movement, comfort, hygiene and context to guide the choice; compliments do not
      establish functional fit. No reason is supplied to remove the compatible identity accessory. Choose
      the suitable familiar alternative without ranking bodies or brands.

      2. The correction consumes the 2-minute reserve and adds 1 minute beyond it. Keep the later departure/arrival
      and communicate as appropriate. Do not count the same reserve twice, invent faster travel or use
      painful posture to hide the delay.

      3. Neither added scent nor brand is a verified requirement. Use suitable familiar care and available
      clothing, preserving the skin plan and sensory needs. Ask the venue only about a genuine unresolved
      context/access question; there is no need for a purchase or an irritating trial.


      These are functional readiness checks, not an appearance or worth assessment.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
