  - stable_id: PRACTICE-COMP-1214-FUNCTIONAL-AGING-AND-LIFELONG-MOVEMENT-01-A3
    sequence: 3
    title: Build a small maintenance and adaptation plan
    instructions: 'Choose when the familiar activity can recur and one review point, such as a month or
      a change in health, environment or access. Identify a missing function that needs qualified instruction
      and one environmental improvement that can help now. State how the garden goal could continue if
      walking, carrying or transfer ability changes; preserving participation may mean more support, not
      abandoning the goal.


      Observation checks: A realistic recurrence and review trigger are set; A missing function has an
      appropriate instruction or assessment route; One present environmental or support improvement is
      identified; The goal includes a dignified pathway when capacity changes. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which current habit protects a valued future activity, and how will that activity
      remain possible if the required support changes?


      Examples: Supportive: Short familiar outings were sustainable and a bench location was identified,
      preserving the garden visit with support.


      Mixed: The movement was manageable, but inaccessible transport remained the main obstacle and needed
      a separate solution.


      Contradictory: An unsafe floor-rise or balance challenge was used to prove that assistance was unnecessary.


      Inconclusive: A distant longevity goal was named without connecting it to present function, support
      or an actual habit.'
