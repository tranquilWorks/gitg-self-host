meaning_and_fit:
  purpose: Plan lifelong movement around valued function, including strength, balance, bone-loading where
    appropriate, carrying, transfers and mobility rather than only short-term appearance or performance.
  why_recommended: Plan lifelong movement around valued function, including strength, balance, bone-loading
    where appropriate, carrying, transfers and mobility rather than only short-term appearance or performance.
  claims:
  - statement: Plan lifelong movement around valued function, including strength, balance, bone-loading
      where appropriate, carrying, transfers and mobility rather than only short-term appearance or performance.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Functional aging and lifelong movement practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Functional aging and lifelong movement as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use wheeling, seated activity, assisted movement, transport or a different
    valued destination. Bone health, pregnancy, injury and chronic disease may need individualized advice.
    A functional map without a safe movement opportunity is planning evidence only.
  opportunity_considerations: 'Default future goal: continue joining a friend at a nearby community garden.
    Map the required functions: travel to the site, move along the path, carry a light personal item,
    sit and rise or transfer with usual assistance, and remain comfortable enough to participate. Do not
    attempt an unfamiliar floor rise, unsupported balance task or loaded carry for assessment.'
  prerequisites:
  - 'Default future goal: continue joining a friend at a nearby community garden. Map the required functions:
    travel to the site, move along the path, carry a light personal item, sit and rise or transfer with
    usual assistance, and remain comfortable enough to participate. Do not attempt an unfamiliar floor
    rise, unsupported balance task or loaded carry for assessment.'
  dependencies: []
  safe_alternatives:
  - Use wheeling, seated activity, assisted movement, transport or a different valued destination. Bone
    health, pregnancy, injury and chronic disease may need individualized advice. A functional map without
    a safe movement opportunity is planning evidence only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Functional aging and lifelong movement differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Functional aging and lifelong
    movement as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default future goal: continue joining a friend at a nearby community garden. Map the required
    functions: travel to the site, move along the path, carry a light personal item, sit and rise or transfer
    with usual assistance, and remain comfortable enough to participate. Do not attempt an unfamiliar
    floor rise, unsupported balance task or loaded carry for assessment. Goal: Plan lifelong movement
    around valued function, including strength, balance, bone-loading where appropriate, carrying, transfers
    and mobility rather than only short-term appearance or performance. Scope: This is a functional planning
    and familiar-activity trial, not a fall-risk assessment, bone-health prescription or test of independent
    living. Assistance and adaptation remain valid lifelong outcomes. Time and effort: Twenty minutes
    to map functions and two short ordinary movement opportunities over one week. Adaptation: Use wheeling,
    seated activity, assisted movement, transport or a different valued destination. Bone health, pregnancy,
    injury and chronic disease may need individualized advice. A functional map without a safe movement
    opportunity is planning evidence only. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use wheeling, seated activity, assisted movement, transport or a different valued
    destination. Bone health, pregnancy, injury and chronic disease may need individualized advice. A
    functional map without a safe movement opportunity is planning evidence only.
  expected_burden: Twenty minutes to map functions and two short ordinary movement opportunities over
    one week.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Functional aging and lifelong movement protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Functional aging and lifelong movement action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use wheeling,
    seated activity, assisted movement, transport or a different valued destination. Bone health, pregnancy,
    injury and chronic disease may need individualized advice. A functional map without a safe movement
    opportunity is planning evidence only.
  actions:
  - stable_id: PRACTICE-COMP-1214-FUNCTIONAL-AGING-AND-LIFELONG-MOVEMENT-01-A1
    sequence: 1
    title: Map the future activity to present functions and supports
    instructions: 'List the actual functions needed for the chosen participation goal and mark each already
      supported, needs adaptation or needs qualified assessment. Include strength, endurance, balance,
      mobility and any appropriate bone-health discussion rather than treating one exercise as sufficient.
      Identify existing aids, transport and social support. Choose one familiar low-risk function to practice
      now, such as a short level walk or usual supported transfer.


      Observation checks: The future participation goal has concrete functional demands; Strength endurance
      balance mobility and bone-health questions receive a disposition; Aids transport and assistance
      are included rather than treated as failure; Only a familiar appropriate function is selected for
      the trial. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1214-FUNCTIONAL-AGING-AND-LIFELONG-MOVEMENT-01
      action_stable_id: PRACTICE-COMP-1214-FUNCTIONAL-AGING-AND-LIFELONG-MOVEMENT-01-A1
      competency_stable_id: '12.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
