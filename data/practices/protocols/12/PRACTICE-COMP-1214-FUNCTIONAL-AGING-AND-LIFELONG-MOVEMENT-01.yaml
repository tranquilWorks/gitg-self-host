  - stable_id: PRACTICE-COMP-1214-FUNCTIONAL-AGING-AND-LIFELONG-MOVEMENT-01-A2
    sequence: 2
    title: Practice the function within current ability twice
    instructions: 'Use the selected familiar activity on two suitable occasions with the usual aid, helper
      or established plan. Record whether it supported participation, how controlled it felt and the recovery
      cost. Keep the dose modest and unchanged; stop for concerning symptoms or instability. The point
      is to build a sustainable link to the valued activity, not to prove independence by removing support.


      Observation checks: Two suitable opportunities or their absence are recorded; Usual assistance and
      established limits remain in place; Control participation and recovery are observed together; No
      unsupported transfer balance or load challenge is introduced. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
