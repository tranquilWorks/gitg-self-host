      - [FDA, Nicotine Is Why Tobacco Products Are Addictive](https://www.fda.gov/tobacco-products/health-effects-tobacco-use/nicotine-why-tobacco-products-are-addictive)

      - [NIDA, Anabolic Steroids and Other Appearance and Performance Enhancing Drugs](https://nida.nih.gov/research-topics/anabolic-steroids)

      - [NHS, Consent to treatment](https://www.nhs.uk/tests-and-treatments/consent-to-treatment/)

      - [CDC, About Handwashing](https://www.cdc.gov/clean-hands/about/index.html)

      - [NIAMS, Exercise for Your Bone Health](https://www.niams.nih.gov/health-topics/exercise-your-bone-health)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after the full function map and round-trip plan. These events are fictional.


      Opportunity 1: transport arrives at 10:00. Lian uses the familiar route for 4 minutes, talks at
      the bench for 20 minutes, returns in 4 minutes with usual aid/support, waits 2 minutes at the accessible
      door and takes the confirmed pickup at 10:30. Ordinary recovery/function is reported usual later
      that day and before the next proposed opportunity. No concern is reported. This is 8 minutes of
      the familiar path/bench-transfer segments and 30 minutes on site before pickup begins; conversation
      and waiting are not additional route-exercise minutes. Each four-minute segment includes its supported
      bench-transfer transition. Transport boarding retains its separate existing-plan requirements, so
      the route total is not a claim about all bodily effort.


      Opportunity 2: the provider cancels the return pickup before the visit begins. Outbound travel is
      still offered, but no suitable return or safe alternative waiting arrangement is confirmed. Lian
      does not start the outing. The friend is willing to discuss a home conversation, but no time is
      agreed and no conversation has occurred. No new physical limitation is reported; the immediate barrier
      is transport.


      Record one completed movement opportunity out of two planned, with the second unavailable under
      the required access conditions. Do not call this two completed outings, infer declining ability,
      or treat the unscheduled home conversation as participation completed. Seek a confirmed round-trip
      arrangement or an agreed alternative before committing again. Keep the existing suitable movement
      plan without adding compensatory effort.


      Separate supportive branch: replace opportunity 2 with another visit under the same confirmed arrangements
      and familiar conditions, with 8 minutes movement and usual recovery reported. Only that branch supports
      two completed suitable opportunities. Neither branch demonstrates bone change, broad independence
      or lifelong effectiveness.


      The next plan may recur weekly while suitable, with review in one month and earlier review for health/access/support
      changes. A recurring calendar entry remains a plan until an actual opportunity occurs.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Connect today''s habit to a future activity worth keeping


      Lifelong movement is easier to plan around a valued activity than an abstract demand to stay young
      or independent. Visiting friends, tending a garden or joining a familiar group can require strength,
      endurance, balance, carrying, transfers and mobility—but also transport, accessible environments
      and willing support. Assistance can preserve participation; it is not the opposite of a worthwhile
      outcome.


      This guide supplies a complete fictional garden-participation map and two-opportunity review. Allow
      15 minutes for the map and schedule, 10 for later outcomes and 10 for checks. No walk, floor rise,
      balance challenge, loaded carry, purchase or health disclosure is required for the default. Its
      output is a maintenance/adaptation plan based on supplied facts, not a claim of improved bone health
      or decades of preserved function. Health and exercise content must be adapted to the person and
      does not replace licensed medical care.


      ### A whole function map without a universal exercise program


      Strength supports producing force; endurance supports sustained activity; balance and stability
      matter when managing position; mobility provides usable movement. Carrying and getting up or transferring
      combine several capacities and environmental conditions. They are not tests someone must perform
      unaided to deserve participation.


      Bone health belongs in the map even when the chosen activity cannot establish a bone outcome. NIAMS
      describes [exercise and bone health](https://www.niams.nih.gov/health-topics/exercise-your-bone-health),
      including the need for appropriate individual advice with low bone density or physical limitations.
      This guide does not prescribe loading, impact, a fall-risk test or a bone-density measurement. A
      qualified plan may address a training need while access supports remain in place.


      Current habits can support a future participation goal without guaranteeing future ability. Record
      a recurrence that fits the person''s existing plan, a review date and earlier review triggers such
      as changed health, support or access. Calendar recurrence is not evidence of actual habit. Two suitable
      opportunities can test practical fit, not lifelong adaptation.


      ### Worked example: the limiting factor is access


      Taylor comfortably uses a familiar short indoor route with their usual aid, but a venue moves upstairs
      with no usable lift. Repeating the route faster does not solve the venue barrier. Asking for a suitable
      room or another participation format can protect the goal while movement continues under the existing
      plan. Declining an inaccessible visit is not evidence that Taylor''s physical capacity declined.


      ### Complete materials: Lian''s community garden plan


      Lian wants to keep joining a friend for conversation at the community garden over coming years.
      Lian already has an individualized plan for a familiar supported route: up to 8 minutes total for
      the familiar garden-path segments and bench-transfer transitions on a suitable outing, including
      return, with a seated break and usual aid. Transport boarding is separately covered by the existing
      plan; it is not silently assigned zero physical effort. It is already appropriate and familiar in
      the case; no increase is authorized. Ordinary function and recovery must be suitable before each
      opportunity. No new symptoms are reported at the starting checkpoint. These fictional limits are
      not instructions for the reader.


      | Function / need | Current information | Disposition to preserve |

      | --- | --- | --- |

      | Travel to site | Accessible transport is needed; initial outbound and return bookings confirmed
      | Support is part of the plan |

      | Endurance / path mobility | Door-to-bench segment takes 4 minutes each way with the usual aid,
      including the familiar bench-transfer transition | Familiar 8-minute round trip fits current plan
      |

      | Carrying / strength | Friend has agreed to carry the shared supplies; Lian''s own item uses the
      existing aid''s suitable storage | No new loaded carry test |

      | Sitting, rising / transfer | Existing suitable bench and usual agreed assistance available | Keep
      assistance; no unfamiliar floor rise |

      | Balance / stability | Familiar path and usual aid currently suitable; uneven outer path unassessed
      | Use familiar path; do not test unsupported balance |

      | Bone-health / broader training question | No individual loading advice is supplied beyond existing
      plan | Prepare a qualified question; do not infer bone training from sitting or visiting |

      | Ongoing participation | Conversation at bench is the valued activity | Adapt place, transport
      or support if ability/access changes |


      Initial visit plan: transport arrives at 10:00, route to bench 10:00–10:04, seated conversation
      10:04–10:24, return route 10:24–10:28, confirmed pickup at 10:30. Each four-minute segment includes
      its familiar supported bench-transfer transition: settling at the bench on arrival and leaving it
      on return. The two minutes before pickup are supported waiting at the accessible door, not extra
      movement or a spare exercise. The 30-minute on-site schedule ends when pickup begins; boarding follows
      its separate existing support arrangement. The seated conversation fits Lian''s established needs
      in this case. The friend has explicitly agreed to both the assistance and the stated timing. Do
      not allocate their help beyond that agreement.


      #### Action 1 — Build the present-to-future map


      For every row write `valued purpose | current function | support | unresolved question | suitable
      next action`. Identify strength, endurance, balance, mobility and bone-health questions separately.
      Select the familiar route as the bounded current habit; it does not replace the other rows. Verify
      both return and transport timings before calling the whole visit feasible.


      Write the existing 8-minute limit and the pre-opportunity check: usual recovery/function, no concerning
      change, suitable conditions, aid and agreed assistance/transport. If a relevant condition fails
      or is unknown, adapt or defer rather than attempt a new test. Serious symptoms require appropriate
      medical help.


      #### Action 2 — Preserve the first plan and analyze two opportunities


      Save the map and timing before [later-packet.md](?resource=file-later-packet-md). The packet contains
      one completed opportunity and a later planned opportunity whose conditions change. Use `opportunity
      | movement actually performed | support/access confirmed | participation | recovery | next decision`.
      A missed trip is not zero ability; an unknown recovery is not ordinary recovery. No one should do
      extra movement to make up an inaccessible outing.


      #### Action 3 — Make maintenance and adaptation concrete


      Set a provisional recurrence at the next ordinary weekly opportunity only while the existing plan
      remains suitable. Review in one month or sooner if health, ordinary function, recovery, transport,
      environment or consented support changes. Preserve a qualified question about any unaddressed function,
      including appropriate bone-health considerations. Name an access improvement available now and a
      fallback for changed capacity, such as a confirmed accessible meeting place or a conversation at
      home with consent. A proposed alternative is not already agreed.


      Attempt [fresh checks](?attempt=practice-checks) before [corrective guidance](?check=practice-answers).
      A complete source artifact is a whole function/support map, round-trip plan, honest two-opportunity
      review and a recurring plan with triggers. Keep the paper interpretation separate from an actual
      inquiry or action.


      ### Access, harder practice and real transfer


      Use text, a reader or a helper to analyze the case. Seated participation, wheeling, assistive transport
      and supported transfers remain legitimate options. No movement is needed for the default. A live
      route requires a familiar suitable action or an appropriate qualified plan; preparation alone is
      not movement evidence.


      Harder variation: the usual bench becomes unavailable, and the only offered seat requires an unfamiliar
      transfer. Identify the missing suitability and assistance information. Find an already suitable
      alternative or use an appropriate advice/access route; do not practice an unsupported transfer to
      keep the booking. Participation may need a different setting while the physical question is addressed.


      At later real opportunities, use one familiar appropriate activity twice under existing limits and
      supports, with ordinary recovery checked before repeating. Record absent opportunities honestly.
      Keep the meaningful activity visible when capacity changes; more support may sustain the goal. Over
      longer periods, actual comparable functional and qualified observations could inform a maintenance
      plan, but this simulation and two outings cannot prove future independence, bone change or injury
      prevention. Self-review, independent observation and clinical assessment remain distinct.


      **Supportive:** A familiar habit and confirmed supports enable actual valued participation with
      tolerable aftermath.


      **Mixed:** Movement is manageable but transport, seating, assistance or recovery prevents the next
      planned visit.


      **Contradictory:** Aids are removed or an unfamiliar balance/transfer/load challenge is used to
      prove independence.


      **Inconclusive:** A future goal or calendar exists without linking functions, support and actual
      opportunities.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A current familiar plan allows 10 minutes total movement. A route needs 6 minutes to the
      bench and 6 to return. Does a 20-minute seated conversation make it fit? Identify the practical
      correction without prescribing training.

      2. One outing occurs; the next is cancelled because return transport is unavailable. A proposed
      home visit has no agreed time. State completed movement opportunities and participation status without
      treating the cancellation as lost ability.

      3. A future goal needs a transfer and bone-health discussion not covered by the current plan. A
      friend suggests an unfamiliar floor-rise test without support to prove independence. What can be
      done now, and what remains for an appropriate qualified route?


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The stated route movement requires 12 minutes, exceeding the limit by 2. Seated conversation
      is not negative movement time and cannot cancel the return demand. Use an already suitable shorter/access-supported
      arrangement or defer until a feasible option is confirmed; do not add training to rescue the arithmetic.

      2. One movement opportunity is completed out of two planned. The cancelled outing is an access barrier,
      not evidence of lost physical capacity. The home visit is proposed, not agreed or completed. Preserve
      both the prior success and the unresolved return/alternative arrangement.

      3. Keep accessible participation and current supports while preparing the specific transfer and
      bone-health questions for an appropriately qualified person. Do not perform an unfamiliar unsupported
      floor rise. Planning or advice is not a measured functional or bone outcome, and assistance is compatible
      with a valued lifelong goal.


      These keys assess planning and evidence distinctions, not independence or physical capacity.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
