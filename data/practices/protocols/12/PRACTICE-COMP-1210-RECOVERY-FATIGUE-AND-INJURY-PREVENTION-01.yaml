  - id: file-later-packet-md
    title: Later packet
    body: 'Open after preserving the next-session decision. These are separate fictional branches.


      ### Main branch


      Day 1: Jules defers the optional 30-minute session and sends the advice request. Day 2: fatigue
      is reported less intrusive. During an unavoidable ordinary task with usual support, stair control
      is still different from baseline. No deliberate test is performed. Pain and illness information
      remain incomplete. The clinic acknowledges the message but has not yet supplied a return plan.


      Do not resume from a calendar date or an acknowledgement. Keep the changed function and missing
      information visible; use appropriate clinical follow-up, with urgent help if concerning symptoms
      arise. No specific exercise dose is authorized by this branch.


      ### Separate favorable branch


      Replace day 2 entirely: the clinician actually reviews the concern and supplies an individualized
      return plan; ordinary function is reported back to baseline with no relevant concern reported. The
      plan permits a specified familiar session with usual support and no additional increase. The session
      has not occurred. Record advice received and a planned return, not a completed return or proof of
      injury prevention. If later conditions change, reassess rather than use the earlier advice as unconditional
      clearance.


      ### Arithmetic check


      Previous duration was 20 × 3 = 60 minutes; changed duration was 30 × 4 = 120 minutes. The increase
      is 60 minutes, or 100% relative to the previous total. Duration and frequency both rose. Unknown
      intensity prevents equating the time ratio with a physiological stress ratio. The deferred session
      contributes zero performed minutes; it is not a completed 30-minute workout.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let a warning change the next action


      Training stress and useful adaptation are not the same event. Fatigue after effort can have many
      explanations; pain, illness and changed daily function deserve attention without a diagnosis from
      a worksheet. The practical question is what the next activity decision should be while uncertainty
      remains.


      This guide supplies a complete fictional load-and-recovery review. Allow 10 minutes for the five-part
      record, 10 for the next-action plan and later update, and 10 for checks. No exercise, painful movement,
      sleep loss, fitness tracker or private health disclosure is required. You produce a changed-session/care
      decision, not evidence that you recovered or prevented injury. Health and exercise content must
      be adapted to the person and does not replace licensed medical care.


      ### Read load and resources together


      Duration, frequency, intensity, equipment and environment can each change demand. Multiplying session
      minutes by sessions counts time, not physiological stress. Doubling minutes does not establish “twice
      the training stimulus,” an overtraining diagnosis or a safe progression. Sleep opportunity, nourishment,
      fluid needs, illness and competing duties affect the context in which an activity occurs; do not
      treat them as resources to remove for better performance.


      Ordinary-function changes can matter more than enthusiasm. A formerly controlled stair descent becoming
      unsteady is a reason to stop assuming the same plan still fits. A painful movement should not be
      repeated to verify that pain is real, and medication should not be used merely to mask a warning
      and continue. Existing prescribed treatment remains unchanged unless the relevant clinician advises
      otherwise.


      NIAMS advises [stopping activity that causes injury pain and seeking care for serious signs](https://www.niams.nih.gov/health-topics/sports-injuries/diagnosis-treatment-and-steps-to-take).
      Sudden severe pain, major swelling, inability to bear weight or obvious deformity needs prompt medical
      evaluation; an emergency needs the local emergency route. Persistent or worsening problems require
      appropriate assessment. This guide supplies no diagnosis, injury treatment, imaging decision or
      fixed return-to-activity interval.


      Recovery is not simply “a day passed.” Review symptoms, usual function and relevant advice before
      return. For chronic illness or post-exertional worsening, use individualized guidance rather than
      automatic graded increases. Protect sleep, adequate nourishment, prescribed fluid limits and support
      while the next step is clarified.


      ### Worked example: duration is not the whole load


      Mika keeps two 15-minute sessions but changes from a familiar flat route to a hilly one. Weekly
      duration remains 30 minutes. The environment and effort changed, so the record cannot say “load
      unchanged” from minutes alone. If the next ordinary day brings unfamiliar difficulty, use that information
      to reconsider the plan rather than adding a third session to prove resilience.


      ### Complete materials: Jules''s changed week


      Jules has a familiar activity plan whose recent observations were comfortable. No new load increase
      was agreed within that plan. Jules nevertheless changed session length and frequency. The details
      are fictional, not doses for a reader.


      | Record | Previous week | Changed week |

      | --- | --- | --- |

      | Session duration | 20 minutes | 30 minutes |

      | Sessions performed | 3 | 4 |

      | Equipment and environment | familiar | same |

      | Intensity description | familiar effort | not recorded |

      | Sleep opportunity | usual | reduced by an essential care interruption |

      | Nourishment/fluid access | existing needs met | meals less predictable; actual adequacy unknown
      |

      | Illness information | no concern reported | no information recorded |

      | Ordinary stairs | usual control | unusual difficulty and poorer control reported |

      | Symptoms | no concern reported | unusual fatigue; pain status unknown |


      Tomorrow''s calendar still contains a 30-minute session. Jules can defer that optional session without
      affecting anyone''s essential care. Their usual clinician has an accessible advice channel; no contact
      has yet been made. The case does not establish that any new exercise is safe. Ordinary tasks may
      use existing assistance, with no deliberate stair test or removal of support.


      #### Action 1 — Make a five-part warning record


      Use `recent load | sleep | nourishment/hydration | symptoms/illness | daily function`. Calculate
      both weekly minute totals and the difference. Identify two known load changes and at least three
      important unknowns. Describe the loss of usual stair control without calling it productive soreness,
      overtraining or structural injury.


      #### Action 2 — Change the next decision before opening outcomes


      Write a concrete plan: defer the provoking session, preserve sleep/nourishment and needed assistance,
      and contact the appropriate clinician about the unusual function change and missing symptom context.
      Ask what should control return and when to seek more urgent help. Do not prescribe a reduced workout
      simply because it is shorter. A live emergency does not wait for an ordinary message response.


      Use `planned session | actual decision | reason | protected resources | care channel | return authority
      | next review trigger`. A draft care message is not a sent contact. Save your plan before [later-packet.md](?resource=file-later-packet-md);
      state that function and applicable advice, not elapsed days alone, govern return.


      #### Action 3 — Recheck without provoking the problem


      Use only the later packet''s ordinary observations. Compare symptoms and function with baseline,
      preserve unknowns and follow any actual qualified advice. Write the next disposition and a future
      method change, such as avoiding simultaneous unagreed changes in duration and frequency. That is
      a planning lesson, not an injury-prevention guarantee.


      Attempt [fresh checks](?attempt=practice-checks) before [the corrective key](?check=practice-answers).
      The source artifact requires the load arithmetic, five-part record, changed session and later disposition.
      Keep these case-analysis outputs separate from an actual health inquiry.


      ### Access, challenge and transfer


      Use voice notes, a reader or a consented support person. Private medical details stay in appropriate
      care channels. Unavailable sleep, food or care access calls for practical support, not a stricter
      training target. The fictional route can be completed entirely without movement.


      Harder variation: Jules''s duration and frequency both return to the previous values, but equipment
      is unfamiliar and pain status is still unknown. Explain why matching 60 minutes does not establish
      suitability or clearance. The appropriate next step is to resolve the relevant uncertainty, not
      conduct a physical test.


      At a later real ordinary warning, record observed changes and use the suitable care/plan route;
      do not manufacture a warning to complete the task. A future return must follow the person''s actual
      guidance and conditions. Log naturally observed daily function without repeatedly testing pain or
      instability. Actual contact, recovery, independent observation and qualified assessment are separate
      events; two notes cannot establish prevention or broad load-management mastery.


      **Supportive:** The warning changes the next session, relevant advice is obtained, and an appropriate
      later return follows actual conditions.


      **Mixed:** Fatigue eases while function remains different, so return stays unresolved.


      **Contradictory:** Pain is masked, sleep or nourishment reduced, or load raised despite unresolved
      warnings.


      **Inconclusive:** A recovery day is named without symptom/function information or a next-action
      decision.


      See scope and limits described in this guide and [source limits](?resource=sources).'
