  - stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01-A2
    sequence: 2
    title: Change the next session or obtain care within the observed limit
    instructions: 'Choose a concrete response: defer the provoking session, reduce a familiar non-provocative
      task, use an existing rehabilitation plan or contact a clinician. Preserve sleep and adequate nourishment
      rather than compensate with stimulants or extra training. State what activity remains safe and useful,
      if any, and what sign means stop. Do not test a painful movement repeatedly or take medication simply
      to mask the signal and continue.


      Observation checks: The next session is changed or care is sought for a stated reason; Sleep nourishment
      and necessary hydration are protected; Any continuing activity has a clear safe boundary; Pain is
      not provoked or masked to meet a target. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01
      action_stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01-A2
      competency_stable_id: '12.10'
