        - symptoms_are_described_without_a_self_diagnosis
        - daily_function_is_compared_with_the_person_s_usual_baseline
        - serious_injury_signs_trigger_timely_qualified_evaluation
      - measurement_id: c1210_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
