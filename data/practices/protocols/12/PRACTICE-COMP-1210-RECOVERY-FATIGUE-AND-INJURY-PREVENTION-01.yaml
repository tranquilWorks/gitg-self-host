meaning_and_fit:
  purpose: Distinguish ordinary training effort from warning signs of inadequate recovery, illness or
    injury, and make a proportionate load or care decision using observed function.
  why_recommended: Distinguish ordinary training effort from warning signs of inadequate recovery, illness
    or injury, and make a proportionate load or care decision using observed function.
  claims:
  - statement: Distinguish ordinary training effort from warning signs of inadequate recovery, illness
      or injury, and make a proportionate load or care decision using observed function.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Recovery, fatigue, and injury prevention practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Recovery, fatigue, and injury prevention as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use voice notes or a support person to compare function without fitness tracking.
    For chronic illness or post-exertional symptom worsening, use individualized guidance rather than
    an automatic increase schedule. A fictional warning case exercises judgment but not actual recovery.
  opportunity_considerations: 'Use the default of a familiar exercise session followed by unusual fatigue
    and poorer control on stairs. Make five headings: recent load change, sleep, nourishment and hydration,
    symptoms, and daily function. Do not repeat the provoking activity to prove whether pain is real.
    Use a fictional case when there is no current issue.'
  prerequisites:
  - 'Use the default of a familiar exercise session followed by unusual fatigue and poorer control on
    stairs. Make five headings: recent load change, sleep, nourishment and hydration, symptoms, and daily
    function. Do not repeat the provoking activity to prove whether pain is real. Use a fictional case
    when there is no current issue.'
  dependencies: []
  safe_alternatives:
  - Use voice notes or a support person to compare function without fitness tracking. For chronic illness
    or post-exertional symptom worsening, use individualized guidance rather than an automatic increase
    schedule. A fictional warning case exercises judgment but not actual recovery.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Recovery, fatigue, and injury prevention differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Recovery, fatigue, and injury
    prevention as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the default of a familiar exercise session followed by unusual fatigue and poorer control
    on stairs. Make five headings: recent load change, sleep, nourishment and hydration, symptoms, and
    daily function. Do not repeat the provoking activity to prove whether pain is real. Use a fictional
    case when there is no current issue. Goal: Distinguish ordinary training effort from warning signs
    of inadequate recovery, illness or injury, and make a proportionate load or care decision using observed
    function. Scope: This is a conservative recovery decision process, not a diagnosis of overtraining
    or an injury-treatment protocol. Serious or worsening symptoms require timely qualified care. Time
    and effort: Ten minutes to review a recent ordinary activity and brief checks before and after the
    next appropriate session. Adaptation: Use voice notes or a support person to compare function without
    fitness tracking. For chronic illness or post-exertional symptom worsening, use individualized guidance
    rather than an automatic increase schedule. A fictional warning case exercises judgment but not actual
    recovery. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use voice notes or a support person to compare function without fitness tracking.
    For chronic illness or post-exertional symptom worsening, use individualized guidance rather than
    an automatic increase schedule. A fictional warning case exercises judgment but not actual recovery.
  expected_burden: Ten minutes to review a recent ordinary activity and brief checks before and after
    the next appropriate session.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Recovery, fatigue, and injury prevention protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Recovery, fatigue, and injury prevention action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use voice notes
    or a support person to compare function without fitness tracking. For chronic illness or post-exertional
    symptom worsening, use individualized guidance rather than an automatic increase schedule. A fictional
    warning case exercises judgment but not actual recovery.
  actions:
  - stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01-A1
    sequence: 1
    title: Compare the recent load with recovery and usual function
    instructions: 'Record any change in duration, intensity, frequency, equipment or environment and compare
      it with recent sleep, food access, fluid needs and illness. Describe symptoms and daily function
      without assigning a diagnosis. For the default, unusual stair difficulty is a reason to reconsider
      the next session, not evidence of productive soreness. Sudden severe pain, major swelling, inability
      to bear weight or a visibly abnormal joint needs prompt medical evaluation.


      Observation checks: Load changes and recovery resources are reviewed together; Symptoms are described
      without a self-diagnosis; Daily function is compared with the person’s usual baseline; Serious injury
      signs trigger timely qualified evaluation. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01
      action_stable_id: PRACTICE-COMP-1210-RECOVERY-FATIGUE-AND-INJURY-PREVENTION-01-A1
      competency_stable_id: '12.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
