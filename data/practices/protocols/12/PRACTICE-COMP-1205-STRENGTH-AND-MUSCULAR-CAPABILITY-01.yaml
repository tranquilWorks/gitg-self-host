meaning_and_fit:
  purpose: Map the major strength patterns, choose an entry, established-plan or instruction-first route,
    and compare two bounded sessions before making one justified progression decision.
  why_recommended: Map the major strength patterns, choose an entry, established-plan or instruction-first
    route, and compare two bounded sessions before making one justified progression decision.
  claims:
  - statement: Map the major strength patterns, choose an entry, established-plan or instruction-first
      route, and compare two bounded sessions before making one justified progression decision.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The 2026 ACSM position-stand summary distinguishes strength, hypertrophy, power and physical-function
      outcomes; emphasizes consistent resistance training over needless complexity; and recommends individualizing
      training to goals, enjoyment and safety rather than using one rigid prescription.
    classification: professional_or_public_standard
    source_ids:
    - SRC-ACSM-2026-RESISTANCE-TRAINING
    limitations: Guidance for resistance training in healthy adults, not medical clearance, rehabilitation
      direction, a sport-specific program or evidence that this product-authored two-session practice
      causes strength or power gains. Specific loads and volumes in the source are not adopted as universal
      learner instructions.
  - statement: Professional exercise programming treats strength, endurance and power as muscular-fitness
      components and balance, agility and reaction time as neuromotor components; progression and modification
      should respond to current health status, goals, conditioning and accessibility, with periodic reevaluation.
    classification: professional_or_public_standard
    source_ids:
    - SRC-ACSM-EP-COMPONENT-PROGRESSION
    limitations: A certification task outline defining professional knowledge and skill, not a complete
      training prescription, participant assessment, medical clearance or validation of the product-authored
      route matrix and evidence checks.
  applicability_question: Does a voluntary, bounded Strength and muscular capability practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Strength and muscular capability as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use seated, assisted, isometric, band, machine, bodyweight or other familiar
    equivalents already appropriate to the person; support is a legitimate condition, not a failed version.
    Use the instruction-first route when safety, technique, equipment or progression is uncertain. Preserve
    a rehabilitation or clinician plan and do not practice through injury, remove fall support, reveal
    private health information or use exercise as a test of worth.
  opportunity_considerations: Use the supplied pattern map, capability screen, two-session record and
    separately revealed decision checks. Select one route. The entry route uses a familiar supported movement
    such as the stable-chair rise default. The established-plan route uses one movement already present
    in a qualified or competently established program. The instruction-first route prepares a useful consultation
    instead of attempting an unfamiliar movement. No maximum effort, forced fatigue, new ballistic exercise
    or removal of ordinary support is required.
  prerequisites:
  - Use the supplied pattern map, capability screen, two-session record and separately revealed decision
    checks. Select one route. The entry route uses a familiar supported movement such as the stable-chair
    rise default. The established-plan route uses one movement already present in a qualified or competently
    established program. The instruction-first route prepares a useful consultation instead of attempting
    an unfamiliar movement. No maximum effort, forced fatigue, new ballistic exercise or removal of ordinary
    support is required.
  dependencies: []
  safe_alternatives:
  - Use seated, assisted, isometric, band, machine, bodyweight or other familiar equivalents already appropriate
    to the person; support is a legitimate condition, not a failed version. Use the instruction-first
    route when safety, technique, equipment or progression is uncertain. Preserve a rehabilitation or
    clinician plan and do not practice through injury, remove fall support, reveal private health information
    or use exercise as a test of worth.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Strength and muscular capability differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Strength and muscular capability
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied pattern map, capability screen, two-session record and separately revealed
    decision checks. Select one route. The entry route uses a familiar supported movement such as the
    stable-chair rise default. The established-plan route uses one movement already present in a qualified
    or competently established program. The instruction-first route prepares a useful consultation instead
    of attempting an unfamiliar movement. No maximum effort, forced fatigue, new ballistic exercise or
    removal of ordinary support is required. Goal: Map the major strength patterns, choose an entry, established-plan
    or instruction-first route, and compare two bounded sessions before making one justified progression
    decision. Scope: This practice teaches strength-program reasoning and observes one already-safe movement.
    It is not medical clearance, rehabilitation, a maximal-strength test or a universal prescription.
    Two sessions cannot establish measurable strength gain across major patterns. Time and effort: About
    thirty to forty-five minutes of planning, two short sessions on separate suitable days, and a ten-minute
    recovery and progression review. Adaptation: Use seated, assisted, isometric, band, machine, bodyweight
    or other familiar equivalents already appropriate to the person; support is a legitimate condition,
    not a failed version. Use the instruction-first route when safety, technique, equipment or progression
    is uncertain. Preserve a rehabilitation or clinician plan and do not practice through injury, remove
    fall support, reveal private health information or use exercise as a test of worth. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    ACSM Unveils Landmark 2026 Resistance Training Guidelines — First Update in 17 Years: https://acsm.org/resistance-training-guidelines-update-2026/

    ACSM Certified Exercise Physiologist Exam Content Outline: https://acsm.org/wp-content/uploads/2024/12/ACSM-Certified-Exercise-Physiologist-Exam-Content-Outline.pdf'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use seated, assisted, isometric, band, machine, bodyweight or other familiar equivalents
    already appropriate to the person; support is a legitimate condition, not a failed version. Use the
    instruction-first route when safety, technique, equipment or progression is uncertain. Preserve a
    rehabilitation or clinician plan and do not practice through injury, remove fall support, reveal private
    health information or use exercise as a test of worth.
  expected_burden: About thirty to forty-five minutes of planning, two short sessions on separate suitable
    days, and a ten-minute recovery and progression review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Strength and muscular capability protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Strength and muscular capability action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use seated,
    assisted, isometric, band, machine, bodyweight or other familiar equivalents already appropriate to
    the person; support is a legitimate condition, not a failed version. Use the instruction-first route
    when safety, technique, equipment or progression is uncertain. Preserve a rehabilitation or clinician
    plan and do not practice through injury, remove fall support, reveal private health information or
    use exercise as a test of worth.
  actions:
  - stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01-A1
    sequence: 1
    title: Map the patterns and choose a capability-fit route
    instructions: 'Open the guide and map squat or rise, hinge, push, pull and carry to a familiar example,
      accessible equivalent, not-currently-relevant status or instruction-needed status. Complete the
      capability screen before selecting one pattern. Choose entry, established-plan or instruction-first;
      do not select by pride or peer comparison. Record the movement, support, planned dose already known
      to be tolerable, four technique and boundary criteria, recovery interval and stop conditions. If
      the route is instruction-first, complete the supplied consultation brief and do not improvise a
      physical test.


      Observation checks: All five patterns receive an honest route or status; The selected route matches
      current experience and support; Dose criteria recovery and stop conditions are fixed before action;
      Instruction-first produces a complete consultation brief without a physical attempt. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01
      action_stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01-A1
      competency_stable_id: '12.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1205_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1205_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_five_patterns_receive_an_honest_route_or_status
        - the_selected_route_matches_current_experience_and_support
        - dose_criteria_recovery_and_stop_conditions_are_fixed_before_action
        - instruction_first_produces_a_complete_consultation_brief_without_a_physical_attempt
      - measurement_id: c1205_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1205_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01-A2
    sequence: 2
    title: Record one controlled session against fixed criteria
    instructions: 'For an entry or established-plan route, perform only the predeclared familiar dose
      with the same equipment, range and support. Record completed work, the four selected technique or
      boundary criteria, perceived effort in ordinary words, and any symptom or equipment change. Stop
      at the preset boundary or earlier when technique, control or normal tolerance changes; an incomplete
      session remains valid evidence. For instruction-first, use the guide to ask the prepared questions
      of an appropriately qualified person and record only the resulting category-level decision, not
      private health detail or credentials.


      Observation checks: The attempt follows the selected route and predeclared boundary; Observations
      use the same four criteria fixed before the session; Support symptoms and any early stop remain
      visible; No maximum fatigue challenge or unplanned escalation is added. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01
      action_stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01-A2
      competency_stable_id: '12.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1205_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1205_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_attempt_follows_the_selected_route_and_predeclared_boundary
        - observations_use_the_same_four_criteria_fixed_before_the_session
        - support_symptoms_and_any_early_stop_remain_visible
        - no_maximum_fatigue_challenge_or_unplanned_escalation_is_added
      - measurement_id: c1205_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1205_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01-A3
    sequence: 3
    title: Recheck recovery and make one progression decision
    instructions: 'After a suitable recovery interval, record whether ordinary function returned to its
      prior state and whether delayed symptoms or unusual fatigue appeared. Repeat the same dose only
      when it remains appropriate under the selected route. Compare technique, effort, support and recovery,
      not merely repetitions or load. Choose exactly one disposition—repeat unchanged, regress one variable,
      progress one variable inside the established plan, seek instruction, or stop and use appropriate
      care. Open the progression check only after recording the reason. Do not label two successful sessions
      as measurable strength improvement.


      Observation checks: Recovery is checked before any repeat or progression; Comparable sessions preserve
      technique support and dose unless a regression is declared; One disposition follows the observed
      technique effort and recovery evidence; Progression stays inside established guidance and no strength-gain
      claim is inferred. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.


      Final review: Which route and evidence justify repeating, regressing, progressing one variable,
      seeking instruction or stopping while preserving technique and recovery?


      Examples: Supportive: A person mapped all five patterns, used an existing supported row from their
      established plan, observed the same four criteria twice with ordinary recovery, and retained the
      dose rather than adding load automatically.


      Mixed: The first familiar session met three criteria, but delayed discomfort made the repeat inappropriate;
      the disposition changed to instruction before progression.


      Contradictory: Support was removed, load was added outside the plan and repetitions continued after
      technique loss so that the record would appear stronger.


      Inconclusive: A generic program was copied without selecting a capability-fit route, performing
      an appropriate attempt or completing an instruction-first consultation.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01
      action_stable_id: PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01-A3
