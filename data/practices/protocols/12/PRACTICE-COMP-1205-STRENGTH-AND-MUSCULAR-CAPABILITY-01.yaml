  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Strength and muscular capability explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Strength and muscular capability context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Strength and muscular capability observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Strength and muscular capability rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Map the patterns and choose a capability-fit route. Observed checks:
    All five patterns receive an honest route or status; The selected route matches current experience
    and support; Dose criteria recovery and stop conditions are fixed before action; Instruction-first
    produces a complete consultation brief without a physical attempt. Action 2: Record one controlled
    session against fixed criteria. Observed checks: The attempt follows the selected route and predeclared
    boundary; Observations use the same four criteria fixed before the session; Support symptoms and any
    early stop remain visible; No maximum fatigue challenge or unplanned escalation is added. Action 3:
    Recheck recovery and make one progression decision. Observed checks: Recovery is checked before any
    repeat or progression; Comparable sessions preserve technique support and dose unless a regression
    is declared; One disposition follows the observed technique effort and recovery evidence; Progression
    stays inside established guidance and no strength-gain claim is inferred.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A generic program was copied without selecting a capability-fit
    route, performing an appropriate attempt or completing an instruction-first consultation.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Strength
    and muscular capability contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
