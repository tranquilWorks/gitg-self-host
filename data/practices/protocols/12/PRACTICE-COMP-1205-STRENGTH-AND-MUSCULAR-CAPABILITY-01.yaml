instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '12.05'
  title: Choose, observe and progress one strength pattern without guessing a program
  scored: false
  sections:
  - id: strength-concepts
    kind: concept
    title: What strength practice is and is not
    body: Strength is the capacity to produce force against resistance. Muscular endurance concerns sustaining
      or repeating force, and power concerns producing force rapidly; those outcomes are related but not
      interchangeable. A useful strength pathway considers the movement being trained, current experience,
      technique, dose, recovery and progression. A supported chair rise can be an appropriate entry or
      adapted observation, but it cannot represent every major pattern or prove a strength increase. Current
      professional guidance supports individualizing resistance training to goals, enjoyment and safety
      and distinguishes ordinary general participation from sport-specific programming. This guide therefore
      supplies decision tools rather than a universal load or repetition prescription.
  - id: pattern-map
    kind: material
    title: Five-pattern capability map
    body: 'Make five rows: squat or rise | hinge | push | pull | carry. For each row record: a familiar
      current example or accessible equivalent | current route [entry / established plan / instruction
      first / not currently relevant] | equipment and support | what competent technique would require
      | what remains unknown. Examples are descriptive only: rising from a stable chair, moving an object
      from a raised surface with an already learned hinge, a wall or machine push, a band or machine pull,
      and carrying an ordinary object with a usual aid. Do not attempt an example merely because it appears
      here. The map is complete when every pattern has an honest status; it is not a requirement to train
      all five during this practice.'
  - id: capability-screen
    kind: material
    title: Capability and boundary screen
    body: 'Before physical action record yes, no or unknown: the exact movement is already familiar; the
      equipment and environment are available and stable; required support can remain; the planned dose
      has been tolerated or belongs to an existing plan; technique criteria are known; a suitable recovery
      interval is available; and stop conditions are understood. Any no or important unknown moves the
      route to instruction-first or defer. Stop the attempt for chest discomfort, faintness, new or increasing
      pain, unusual breathlessness, loss of control, equipment instability or any existing clinician or
      rehabilitation stop rule. This screen does not provide medical clearance.'
  - id: route-card
    kind: pathway
    title: Choose one of three complete routes
    body: 'Entry or adapted route: choose one already-safe, familiar movement and a modest dose known
      to be tolerable. The supplied default is three controlled rises from a stable chair that cannot
      slide, using usual hand support, only for someone who already performs that movement safely. Established-plan
      route: select one familiar movement and dose already present in a qualified or competently established
      program; record the plan source and do not change load, volume, range, equipment or tempo during
      the comparison. Instruction-first route: do no new physical test. Prepare the consultation brief,
      identify who is qualified for the uncertainty, and obtain a route decision. Any route may end in
      defer or stop without penalty.'
  - id: consultation-brief
    kind: material
    title: Instruction-first consultation brief
    body: 'Prepare: the function or goal sought; current experience; the exact movement considered; available
      equipment, support and access needs; existing restrictions or plans stated only as needed; and what
      is unknown. Ask: Which movement or prerequisite should come first? What technique cues can be observed?
      What starting dose and recovery fit this person and goal? Which one variable could later change,
      under what criterion? What warning signs or equipment conditions require stopping or referral? Record
      only one category-level result: appropriate as proposed | appropriate with modification | different
      prerequisite first | needs another qualified route | defer. The consultation informs a plan; it
      is not evidence that strength improved.'
  - id: session-record
    kind: material
    title: Two-session private record
    body: 'Route and movement: __. Existing plan or instruction source: __. Equipment, range and support:
      __. Planned dose and recovery interval: __. Four observable technique or boundary criteria: T1 __;
      T2 __; T3 __; T4 __. Stop conditions: __. Session 1 actual work, T1-T4 [observed / mixed / not observed
      / unknown], ordinary-word effort, symptoms, support and early stop: __. Recovery before session
      2: ordinary function returned [yes / no / unknown], delayed symptoms or unusual fatigue: __. Session
      2 comparable conditions and T1-T4: __. Disposition [repeat / regress one variable / progress one
      variable inside plan / seek instruction / stop]: __. Evidence-limited reason: __. Keep private details
      here; the application check-in receives only allowlisted observations.'
  - id: worked-pathway
    kind: worked_example
    title: Worked example with no automatic progression
    body: A person already uses a supported cable row in an established plan. They map the other four
      patterns but select only the row. Their criteria are stable seated support, planned range, controlled
      path and completion before technique loss. Both sessions meet those criteria with ordinary recovery.
      They repeat the same dose next time because the plan has not yet reached its progression condition.
      This is supportive evidence for executing that movement under recorded conditions; it is not a measured
      strength gain. If the second session instead produced unusual delayed symptoms, the proper record
      would be mixed and the next step would be instruction, not added load.
  - id: route-selection
    kind: prompt
    title: Select and justify the route
    body: Complete the five-pattern map and capability screen. Select entry, established-plan or instruction-first
      for one pattern. State the evidence supporting that route, list every no or unknown, and predeclare
      equipment, support, dose, four criteria, recovery interval and stop conditions. If selecting instruction-first,
      complete the consultation brief and do not substitute a physical attempt. Preserve the response
      before opening the check.
    check_id: route-key
    attempt_mode: open_explanation
    references:
    - pattern-map
    - capability-screen
    - consultation-brief
  - id: progression-case
    kind: prompt
    title: Decide what the evidence permits
    body: 'Case: Session 1 used the planned familiar dose and met T1, T2 and T4, but control criterion
      T3 was mixed. The person repeated after ordinary recovery under the same conditions; T3 was again
      mixed. They feel eager to add load. Choose one disposition from repeat unchanged, regress one variable,
      progress one variable inside the established plan, seek instruction, or stop. Explain what evidence
      supports the decision and what the two sessions cannot establish. Preserve the answer before opening
      the check.'
    check_id: progression-key
    attempt_mode: unaided
    references:
    - session-record
  - id: next-cycle
    kind: next_step
    title: Progress one variable only when the route supports it
    body: A progression decision follows the established plan or qualified instruction and the observed
      technique and recovery criteria. Change only the authorized variable, such as load, repetitions,
      range, support or movement complexity, while retaining the other comparison conditions. If the default
      is well below present ability, use the established-plan route rather than manufacturing fatigue.
      If technique, recovery or route authority is uncertain, repeat, regress or seek instruction. A future
      measurement needs comparable conditions and sufficient time; this practice does not award a strength-gain
      claim.
  checks:
  - id: route-key
    title: Check the route selection
    body: A complete response assigns all five patterns an honest status, selects one pattern and one
      route, and uses the capability screen rather than ability stereotypes or peer comparison. Entry
      and established-plan routes require an already-familiar tolerable movement, fixed support, dose,
      criteria, recovery and stop conditions. Instruction-first requires the supplied brief and a qualified
      route decision, not a guessed exercise. A missing safety unknown cannot be converted to yes merely
      to permit an attempt.
    criteria:
    - Every major pattern has a current route or explicit status.
    - The selected route is supported by current experience and available support.
    - Dose, four criteria, recovery and stop conditions are fixed before action.
    - Unknown safety, technique or progression information leads to instruction or defer.
  - id: progression-key
    title: Check the progression decision
    body: Progress is not supported in this case because the same control criterion remained mixed twice.
      A defensible disposition is repeat unchanged with a correction only if the established plan supplies
      one, regress one variable, or seek instruction; the exact choice depends on the recorded cause and
      plan. Adding load contradicts the evidence. The two sessions cannot establish measurable strength
      improvement, broad pattern competence, cause, or safety for a different movement.
    criteria:
    - The unresolved repeated criterion prevents automatic progression.
    - The disposition is one of the declared options and cites observed evidence.
    - Load, repetitions or complexity are not added to prove effort.
    - The conclusion remains limited to the selected movement and recorded conditions.
