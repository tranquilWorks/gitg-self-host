  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after the three starting-card rehearsals. Each branch is separate and fictional.


      ### Branch A: withdraw before action


      In a different mutually willing rehearsal, Sasha and Toni both agree at 10:00 to one handshake.
      At 10:01, before any touch, Toni says “Actually, no touch.” Sasha stops the approach and asks nothing
      further. No handshake occurs. At 10:02 Sasha asks whether a photo would be welcome; Toni gives no
      clear response. No photo is taken. The earlier handshake yes supports neither touch after withdrawal
      nor a photo.


      ### Branch B: acknowledge an overstep


      Start again from no touch permission: Toni clearly asks for a wave. Sasha mistakenly starts unwanted
      contact, immediately stops and says, “I touched you after you asked for a wave. I''m sorry. I''ll
      give you space.” Toni asks for space and no further discussion. Sasha steps back; no photo or private
      explanation is retained. The overstep occurred and remains in the record. Stopping and respecting
      space are repair actions; forgiveness and renewed touch permission are not supplied.


      ### Branch C: assistance and privacy


      Toni uses a written “wave only” card. A helper accurately reads it aloud with Toni''s permission.
      The helper has no permission to share why Toni prefers it. Sasha waves if Toni still wants that
      greeting and does not request a reason. Communication assistance is compatible with Toni''s own
      choice; it does not turn the helper into the owner of that choice.


      Your review should distinguish no touch after withdrawal, an actual overstep followed by bounded
      repair, and supported communication. None establishes real participant consent or a universal medical/legal
      rule.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Let the answer change what happens


      Bodily autonomy involves touch, privacy, medical choice and freedom from coercion or exploitation.
      In an ordinary voluntary interaction, permission belongs to the specific action and current situation.
      Familiarity, a previous yes, silence or politeness is not a substitute for a clear current choice.
      Respect is demonstrated by what happens after the answer, including when it changes.


      This guide supplies a complete low-stakes greeting and privacy rehearsal. Allow 10 minutes to prepare,
      10 to trace the exchanges and repair, and 10 for checks. No actual touch, photograph, personal history,
      live participant or confrontation is required. Use text, spoken rehearsal, AAC or cards. Health
      and exercise content must be adapted to the person and does not replace licensed medical care. The
      medical-choice companion below is literacy, not legal advice about capacity, emergencies or safeguarding.


      ### Current, specific and free to change


      A greeting question should make a non-contact option easy: “Would you prefer a wave, another greeting,
      or no greeting?” Asking does not create permission to touch. If the response is uncertain, wait
      or choose a mutually suitable non-contact interaction; do not keep asking until a yes appears. Either
      person may decline contact. A legitimate boundary does not require the other person to agree that
      it is reasonable.


      Touch and disclosure are separate permissions. A yes to a handshake is not a yes to a photo, a posted
      caption or sharing a private explanation. Collect the least information needed for the interaction.
      An apology after an overstep does not create retroactive permission. Stop, acknowledge what happened,
      offer a practical repair and respect whether further discussion is welcome; forgiveness is not owed.


      For a medical encounter, prepare questions about what is proposed, why, benefits and risks, alternatives,
      privacy, support, and how a pause or changed choice is handled. The [NHS consent overview](https://www.nhs.uk/tests-and-treatments/consent-to-treatment/)
      describes voluntary informed consent and the relevant care process in its UK context. Actual legal
      rules and exceptions vary with jurisdiction and circumstance; this greeting exercise cannot settle
      capacity, emergency treatment or safeguarding duties. Use the responsible clinician, patient advocate
      or appropriate qualified adviser for those questions.


      If dependence, coercion, exploitation or an unsafe relationship makes refusal risky, do not stage
      a boundary demonstration. Use the fictional route and a suitable confidential support/safety process.
      You do not need to prove courage through confrontation or disclose why a boundary exists.


      ### Worked example: permission does not transfer


      Robin agrees to a private audio description of an activity for access. A helper proposes posting
      that description and Robin''s health explanation publicly. Private access support did not authorize
      publication. The helper can provide the agreed description, leave private reasons out and seek a
      separate voluntary choice if any sharing is actually needed. No answer means no newly granted publication
      permission.


      ### Complete materials: Sasha and Toni at a community welcome


      Both fictional adults are willingly participating in an ordinary greeting rehearsal, without a coercive
      relationship. Sasha prefers a wave and has not offered touch. Toni''s preference is initially unknown.
      There is no photography requirement, no reason for recording private explanations and no penalty
      for declining the greeting. Either person can end the interaction.


      Use these three independent starting cards; do not combine their answers:


      | Card | Prompt and answer | Current permission |

      | --- | --- | --- |

      | W | Sasha asks about a non-contact greeting; Toni says “A wave is good” | A wave, not touch or
      a photo |

      | U | Sasha asks; Toni says “I''m not sure” | No touch permission; allow space or a comfortable
      non-contact option |

      | T | Toni asks for a handshake; Sasha says “I prefer a wave” | Sasha''s no-touch boundary stands
      without Toni''s approval |


      A separate medical-preparation card says: “At a routine non-urgent appointment, the person wants
      an explanation before a proposed examination and wants to ask about a support person and pause signal.”
      No examination, clinical recommendation or legal-capacity assessment is supplied. The default output
      for that card is a question list only.


      #### Action 1 — State the boundary and reciprocal question


      Write Sasha''s preference, a no-pressure question Toni can answer in their chosen communication
      mode, and a pause/end sentence. Identify separately touch and photo/disclosure permissions. For
      each starting card, say which action is supported and which is not. Do not add a demand for an explanation.


      #### Action 2 — Rehearse the response before opening the change


      Speak, type or arrange the three card responses. For U, practice tolerating uncertainty without
      escalating the request. For T, respect both people''s preferences: no handshake occurs when one
      person declines. A wave is optional; no interaction remains a valid outcome. Save the responses
      before [later-packet.md](?resource=file-later-packet-md).


      Use `time | actor | specific proposal | response | current permission | action actually taken |
      repair status`. Record only minimal categories, not personal reasons. The role-play is real rehearsal
      only if performed; its scripted yes does not establish another real person''s consent.


      #### Action 3 — Trace withdrawal, privacy and repair


      Apply the later branches. Preserve an overstep when it occurred rather than rewriting the earlier
      response. A stop takes effect before repair discussion; do not continue unwanted contact to finish
      an apology. For the medical card, produce four questions: what will happen and why; what options
      and consequences should be understood; who will be present and how privacy/support works; how to
      ask for a pause or discuss a changed decision under the applicable process. You do not need an actual
      examination to finish this companion exercise.


      Attempt [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). Complete
      source output includes all three rehearsals, the later permission/repair record and medical questions.
      These rehearsals do not establish a stated or maintained real boundary.


      ### Access, harder work and real transfer


      Accept AAC, written choices, interpreters and a chosen support person; needing communication support
      does not itself mean inability to decide. Allow time without converting a delay into assent. Cultural
      greetings can be adapted, including no touch. Never remove assistance to make a boundary look independent.


      Harder variation: a volunteer says a hug is required to join the group, although the verified organizer
      rule says no contact is required. Identify the coercive condition and seek an appropriate organizer/support
      route, or leave safely, without touching to prove willingness. Do not generalize this toy rule into
      a legal ruling about every organization.


      At a later safe, ordinary opportunity, ask and respect a willing person''s greeting preference or
      use your own non-contact boundary. Stop if the setting is unsafe. Record actual behavior and minimal
      outcomes; a changed choice or declined interaction can be successful boundary use. Independent observation
      and any qualified care discussion must actually occur, not be inferred from a script.


      **Supportive:** The action follows current permission, including a no or changed preference, without
      penalty.


      **Mixed:** A question is asked but pressure makes declining awkward; the interaction is stopped
      and the delivery repaired.


      **Contradictory:** Past permission is reused for unwanted touch, private information is shared,
      or an apology is treated as consent.


      **Inconclusive:** Consent words are memorized while no response-dependent action is demonstrated
      or recorded.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. Both people agree to a handshake, but one withdraws before contact. The other says the earlier
      yes must be honored. What current action is permitted, and must the withdrawal be justified?

      2. Someone agrees to a private greeting photo but says nothing about posting it. A helper also knows
      a private health explanation. Identify what permission exists, what remains absent and what the
      helper should retain or disclose.

      3. An overstep occurs; the person asks for space and no more discussion. The actor wants to keep
      apologizing until forgiven. State the immediate action, honest record and limit on repair. Does
      the greeting example decide medical-capacity law?


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Stop the approach; current touch permission is withdrawn. No justification or acceptance
      of the reason is required. A non-contact alternative is optional, not a bargaining step toward touch.

      2. Permission covers the specified private photo only; publication and the health explanation have
      no permission supplied. Do not post or disclose them. Retain only the minimum necessary for the
      agreed activity, and respect later changed choices through the applicable process.

      3. Stop, give space and end the unwanted discussion. Preserve the overstep and the actual stopping/repair
      action without inventing forgiveness or renewed permission. The greeting case does not determine
      medical capacity, emergency exceptions or local law; those require the appropriate qualified process.


      These keys assess an educational permission trace, not another person''s consent or legal competence.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
