  - stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01-A3
    sequence: 3
    title: Review privacy and repair any overstep
    instructions: 'Check whether either person’s preference changed and whether the response remained
      easy to give. If an overstep occurred, stop, acknowledge it and ask what practical repair is welcome
      without demanding forgiveness. For a care appointment, use the prepared questions with the clinician
      and clarify the applicable process rather than assume universal legal rules. Retain only a minimal
      observation, not someone’s private explanation.


      Observation checks: The review includes freedom to change or withdraw a preference; An overstep
      prompts stopping and accountable repair; Medical or legal process questions are referred to the
      appropriate professional; Private explanations are not retained as evidence. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Was declining or changing the preference genuinely possible, and did the action follow
      that preference without penalty?


      Examples: Supportive: A wave was chosen and accepted without explanation, and the greeting remained
      friendly.


      Mixed: The question was asked, but a joke made declining awkward, so the delivery needed repair.


      Contradictory: Past consent or a relationship role was treated as permission for unwanted touch
      or disclosure.


      Inconclusive: Consent language was memorized while the person’s actual answer had no effect on the
      action.'
