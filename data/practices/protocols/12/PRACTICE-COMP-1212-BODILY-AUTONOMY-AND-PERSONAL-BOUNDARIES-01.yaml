  - stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01-A2
    sequence: 2
    title: Ask once and let the answer determine the action
    instructions: 'With a willing person in a safe ordinary setting, ask the prepared question and wait
      for a clear response. Accept a decline, uncertainty or a changed preference without bargaining,
      teasing or demanding a reason. Use the wave or other non-contact option when permission is absent
      or unclear. If practicing alone, speak both sides of the default and label it rehearsal rather than
      evidence of another person’s consent.


      Observation checks: A clear question is asked without pressure; Decline uncertainty or changed preference
      is respected; The actual action follows the permission given; Rehearsal is not reported as live
      consent or touch. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01
      action_stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01-A2
