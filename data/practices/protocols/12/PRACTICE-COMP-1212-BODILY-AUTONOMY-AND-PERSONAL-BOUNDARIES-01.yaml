meaning_and_fit:
  purpose: Make consent, privacy and control of touch explicit while respecting another person’s equal
    right to decline, pause or choose a different form of participation.
  why_recommended: Make consent, privacy and control of touch explicit while respecting another person’s
    equal right to decline, pause or choose a different form of participation.
  claims:
  - statement: Make consent, privacy and control of touch explicit while respecting another person’s equal
      right to decline, pause or choose a different form of participation.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Bodily autonomy and personal boundaries practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Bodily autonomy and personal boundaries as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use AAC, signs, written choices, an interpreter or a support person chosen
    by the participant. Respect cultural greetings without requiring contact. In coercion, exploitation
    or unsafe dependency, prioritize a safety plan and qualified support rather than a boundary demonstration.
  opportunity_considerations: 'Default: a greeting in which one person prefers a wave rather than a hug.
    Prepare two sentences: Would you prefer a wave or a hug? and A wave works for me. No actual touch
    is needed. For a medical visit, the parallel literacy task is preparing questions about what will
    happen, privacy, alternatives and how to ask for a pause; clinical decisions remain with the appropriate
    care process.'
  prerequisites:
  - 'Default: a greeting in which one person prefers a wave rather than a hug. Prepare two sentences:
    Would you prefer a wave or a hug? and A wave works for me. No actual touch is needed. For a medical
    visit, the parallel literacy task is preparing questions about what will happen, privacy, alternatives
    and how to ask for a pause; clinical decisions remain with the appropriate care process.'
  dependencies: []
  safe_alternatives:
  - Use AAC, signs, written choices, an interpreter or a support person chosen by the participant. Respect
    cultural greetings without requiring contact. In coercion, exploitation or unsafe dependency, prioritize
    a safety plan and qualified support rather than a boundary demonstration.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Bodily autonomy and personal boundaries differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Bodily autonomy and personal
    boundaries as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: a greeting in which one person prefers a wave rather than a hug. Prepare two sentences:
    Would you prefer a wave or a hug? and A wave works for me. No actual touch is needed. For a medical
    visit, the parallel literacy task is preparing questions about what will happen, privacy, alternatives
    and how to ask for a pause; clinical decisions remain with the appropriate care process. Goal: Make
    consent, privacy and control of touch explicit while respecting another person’s equal right to decline,
    pause or choose a different form of participation. Scope: Use a low-stakes, safe situation only. This
    is not legal advice about medical capacity, emergency treatment or safeguarding, and it must not be
    used to confront an abusive or coercive person. Time and effort: Fifteen minutes of preparation, one
    brief willing interaction or rehearsal and a five-minute review. Adaptation: Use AAC, signs, written
    choices, an interpreter or a support person chosen by the participant. Respect cultural greetings
    without requiring contact. In coercion, exploitation or unsafe dependency, prioritize a safety plan
    and qualified support rather than a boundary demonstration. Keep personal working notes outside the
    check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use AAC, signs, written choices, an interpreter or a support person chosen by the
    participant. Respect cultural greetings without requiring contact. In coercion, exploitation or unsafe
    dependency, prioritize a safety plan and qualified support rather than a boundary demonstration.
  expected_burden: Fifteen minutes of preparation, one brief willing interaction or rehearsal and a five-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Bodily autonomy and personal boundaries protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Bodily autonomy and personal boundaries action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use AAC, signs,
    written choices, an interpreter or a support person chosen by the participant. Respect cultural greetings
    without requiring contact. In coercion, exploitation or unsafe dependency, prioritize a safety plan
    and qualified support rather than a boundary demonstration.
  actions:
  - stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01-A1
    sequence: 1
    title: Name the boundary and separate permission from assumption
    instructions: 'Describe the touch, privacy or examination situation without assuming that familiarity,
      politeness or previous agreement supplies current permission. Write the participant’s own preference
      and a respectful way to ask another person’s preference. Include a no-touch option and a way to
      pause. Identify any power or safety concern that makes a live interaction inappropriate; do not
      make disclosure of personal history a condition of the boundary.


      Observation checks: The bodily or privacy boundary is specific; Current permission is not inferred
      from familiarity or prior agreement; A no-touch option and pause route are explicit; Power and safety
      concerns determine whether live practice is suitable. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01
      action_stable_id: PRACTICE-COMP-1212-BODILY-AUTONOMY-AND-PERSONAL-BOUNDARIES-01-A1
      competency_stable_id: '12.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
