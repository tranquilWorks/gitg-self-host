  - stable_id: PRACTICE-COMP-1204-FOOD-RELATIONSHIP-AND-BODY-IMAGE-01-A2
    sequence: 2
    title: Perform one ordinary care action without compensation
    instructions: 'Follow your established meal or care plan, wear a comfortable available garment, or
      remove one unwanted comparison cue with no deprivation or compensatory exercise. In the default,
      keep the planned meal rather than using it as a reward for appearance. If a treatment plan already
      exists, use that plan and its support person; do not substitute this exercise for it.


      Observation checks: A concrete nourishment or comfort action actually occurs; Care is not conditional
      on appearance or earned through punishment; No restriction purging or compensatory exercise is introduced;
      Existing treatment and support plans remain authoritative. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
