meaning_and_fit:
  purpose: Separate health and appearance preferences from shame, comparison and compulsive control, then
    practice a concrete action that supports nourishment and bodily dignity.
  why_recommended: Separate health and appearance preferences from shame, comparison and compulsive control,
    then practice a concrete action that supports nourishment and bodily dignity.
  claims:
  - statement: Separate health and appearance preferences from shame, comparison and compulsive control,
      then practice a concrete action that supports nourishment and bodily dignity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Food relationship and body image practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Food relationship and body image as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the fictional case when personal reflection is too activating. Skip mirrors,
    scales and photographs. Choose a familiar care action consistent with cultural practice, disability
    needs and any dietitian or clinician plan; not everyone needs or wants an appearance goal.
  opportunity_considerations: 'Use the low-stakes default: after seeing an idealized image, a person calls
    their body unacceptable and considers skipping a normal meal. Write three columns—observed fact, appearance
    judgment and care need. Do not use before-and-after photos, body measurements, calorie targets or
    exposure to triggering material as part of the exercise.'
  prerequisites:
  - 'Use the low-stakes default: after seeing an idealized image, a person calls their body unacceptable
    and considers skipping a normal meal. Write three columns—observed fact, appearance judgment and care
    need. Do not use before-and-after photos, body measurements, calorie targets or exposure to triggering
    material as part of the exercise.'
  dependencies: []
  safe_alternatives:
  - Use the fictional case when personal reflection is too activating. Skip mirrors, scales and photographs.
    Choose a familiar care action consistent with cultural practice, disability needs and any dietitian
    or clinician plan; not everyone needs or wants an appearance goal.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Food relationship and body image differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Food relationship and body
    image as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the low-stakes default: after seeing an idealized image, a person calls their body unacceptable
    and considers skipping a normal meal. Write three columns—observed fact, appearance judgment and care
    need. Do not use before-and-after photos, body measurements, calorie targets or exposure to triggering
    material as part of the exercise. Goal: Separate health and appearance preferences from shame, comparison
    and compulsive control, then practice a concrete action that supports nourishment and bodily dignity.
    Scope: This is an educational reflection and ordinary care action, not treatment for an eating disorder
    or a body-image condition. Restriction, bingeing, purging, compulsive exercise or serious distress
    warrants qualified support. Time and effort: Fifteen minutes privately, one ordinary meal or clothing-related
    action and a ten-minute review. Adaptation: Use the fictional case when personal reflection is too
    activating. Skip mirrors, scales and photographs. Choose a familiar care action consistent with cultural
    practice, disability needs and any dietitian or clinician plan; not everyone needs or wants an appearance
    goal. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case when personal reflection is too activating. Skip mirrors,
    scales and photographs. Choose a familiar care action consistent with cultural practice, disability
    needs and any dietitian or clinician plan; not everyone needs or wants an appearance goal.
  expected_burden: Fifteen minutes privately, one ordinary meal or clothing-related action and a ten-minute
    review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Food relationship and body image protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Food relationship and body image action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case when personal reflection is too activating. Skip mirrors, scales and photographs. Choose a familiar
    care action consistent with cultural practice, disability needs and any dietitian or clinician plan;
    not everyone needs or wants an appearance goal.
  actions:
  - stable_id: PRACTICE-COMP-1204-FOOD-RELATIONSHIP-AND-BODY-IMAGE-01-A1
    sequence: 1
    title: Separate the comparison from a defensible health concern
    instructions: 'Describe the actual event without ranking bodies. Identify the rule it activated, such
      as I must earn lunch by looking a certain way, and distinguish that rule from a legitimate health
      or comfort goal. State one body function or care need that remains valid regardless of appearance.
      Do not require gratitude, positive body feelings or denial of a genuine medical concern.


      Observation checks: The comparison event is distinct from the body judgment; A shame-based rule
      is stated without endorsing it; A legitimate health or comfort concern remains visible; One care
      need is recognized without requiring positive appearance feelings. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1204-FOOD-RELATIONSHIP-AND-BODY-IMAGE-01
      action_stable_id: PRACTICE-COMP-1204-FOOD-RELATIONSHIP-AND-BODY-IMAGE-01-A1
      competency_stable_id: '12.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1204_a1_primary
      transfer_disposition: context_bound
      measurements:
