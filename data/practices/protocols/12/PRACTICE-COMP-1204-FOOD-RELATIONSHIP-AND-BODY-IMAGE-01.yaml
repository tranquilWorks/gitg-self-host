  - stable_id: PRACTICE-COMP-1204-FOOD-RELATIONSHIP-AND-BODY-IMAGE-01-A3
    sequence: 3
    title: Review the rule’s effect and set a support threshold
    instructions: 'Record whether the action was possible, how the rule affected it and what remained
      distressing. Replace the rule with a practical statement such as regular nourishment supports my
      day even when I dislike a photo. Identify a trusted or qualified support route if the pattern recurs,
      impairs eating or becomes compulsive. Current concerning behavior requires real support rather than
      a completed worksheet.


      Observation checks: The action and remaining distress are both recorded; A practical replacement
      rule supports care rather than forced positivity; A specific recurrence or impairment threshold
      prompts help; Concerning current behavior is not normalized as a willpower exercise. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Could you meet a care need without first changing how you felt about your appearance?


      Examples: Supportive: The planned meal remained in place despite an unpleasant comparison, and the
      person muted the triggering account without compensatory exercise.


      Mixed: The care action occurred, but the rule still repeatedly disrupted eating and a support appointment
      became the next step.


      Contradictory: Food was withheld or exercise escalated to erase guilt about body size.


      Inconclusive: A positive affirmation was copied while the actual harmful rule and care behavior
      stayed unexamined.'
