  - id: file-later-packet-md
    title: Later packet
    body: 'Open after preserving the four lines and care card. These are independent fictional branches.


      ### Branch A


      At 12:00 Rowan follows the existing lunch plan. At 12:15 they mute the unwanted cue. Their uncomfortable
      appearance feelings remain. No compensation is reported. No support message is sent. Review the
      concrete care action as supportive while leaving feelings unchanged and support contact absent.
      Muting the cue is not the reason Rowan was allowed to eat.


      ### Branch B


      At 12:00 Rowan follows the lunch plan. Over the following ordinary days the same rule repeatedly
      interferes with planned eating. The supplied record does not describe the amount eaten, body size
      or a diagnosis. Rowan drafts a message to Jo but does not send it, and no qualified contact has
      occurred. Do not invent a reply or a completed support step. The next action is to use the agreed
      support route and appropriate qualified care for the current concern; a repeated affirmation is
      not its resolution.


      ### Author''s review after your attempt


      The immediate meal is supportive in both branches. Branch B is mixed because the continuing interference
      remains unresolved. A sent support request would establish an attempt, not acceptance or care received;
      an unsent draft establishes even less. Neither branch demonstrates a treatment effect, general food-relationship
      improvement or an independent assessment. A person need not become more distressed or meet a worksheet
      threshold before seeking help.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Keep ordinary care available when appearance feelings are difficult


      An appearance preference, a health concern and a person''s dignity are different things. Someone
      may want a different outfit, dislike a photo or have a legitimate medical question without making
      nourishment conditional on changing their body. This guide practices identifying a shame-based rule
      and replacing its effect with one concrete care choice. It does not require positive body feelings
      or denial of distress.


      The complete default uses a fictional text vignette, with no images, mirrors, scales, calorie targets,
      private disclosure or exposure to triggering material. Allow 10 minutes for the fact/judgment/care
      distinction, 10 for an action card and later review, and 10 for checks. You may use dictation or
      have a reader omit the quoted judgment and refer simply to “the harmful rule.” If even the fictional
      case is unwelcome, use the garment-access variation below. The output is an educational care decision,
      not treatment or proof that your relationship with food changed.


      Health and exercise content must be adapted to the person and does not replace licensed medical
      care. Eating disorders can occur across body sizes; appearance cannot establish whether someone
      needs help. Persistent restriction, bingeing, purging, compulsive exercise or serious distress calls
      for qualified support. [NIMH''s overview](https://www.nimh.nih.gov/health/publications/eating-disorders)
      supports those boundaries. An existing treatment plan remains authoritative; this reflection does
      not replace it or supply a diagnostic test.


      ### Separate four kinds of statement


      An **observed fact** describes what happened: an image appeared, a garment pinches, a meal is scheduled.
      An **appearance judgment** evaluates looks, often through comparison. A **care need** remains relevant
      whatever the judgment: nourishment, comfort, access or appropriate evaluation. An **appearance preference**
      may guide ordinary choices without becoming a condition of worth or care.


      The important change is practical. “I must feel attractive before eating” makes a necessary action
      depend on an unstable feeling. “I can follow my existing meal plan while feeling uncomfortable about
      the image” preserves care without requiring the feeling to vanish. A positive affirmation can be
      welcome, but copying one does not show that a meal, support contact or clothing change occurred.


      Do not turn this exercise into food monitoring or a contest in resisting distress. Removing an unwanted
      comparison cue is optional and should not require revisiting it. Clothing choices can serve comfort,
      expression, culture or access; choosing a different fit does not concede a moral failure. A real
      health concern deserves qualified attention, not dismissal as “just body image.”


      ### Worked example: comfort without a body verdict


      Casey notices a shirt''s seam rubbing while seated. They prefer its color but also have a comfortable
      shirt already available. The fact is friction in that position, not a defective body. Casey changes
      shirts for comfort and keeps the preferred color as a future clothing preference. No purchase, body
      change or positive affirmation is required. If a painful skin problem persists, changing a shirt
      does not replace appropriate care.


      ### Complete materials: Rowan''s lunchtime choice


      All events are fictional. At 11:50 Rowan sees an idealized image accidentally in a feed. The exercise
      supplies no image and requires no search. Rowan thinks, “I should postpone lunch until I look different.”
      That is the rule to examine, not advice. Rowan''s existing care plan includes a prepared lunch at
      12:00. No change to that plan has been advised. They have a comfortable garment available and permission
      to mute their own unwanted feed cue. They need not change clothes or mute it to earn lunch.


      Rowan has no present emergency described in this case. They prefer a different clothing style and
      want to discuss ongoing comfort concerns at their next existing care review. Their chosen support
      person, Jo, has agreed to receive a short message if the rule repeatedly interferes with eating.
      Jo is a trusted contact, not assumed to be a clinician. Rowan can also contact their existing qualified
      care service if concerning behavior is happening now; they need not wait for repetition to deserve
      help. No one has consented to sharing pictures, body measurements or meal details publicly.


      #### Action 1 — Make the distinction before offering reassurance


      Write four lines: observed event, appearance judgment, valid care need and optional preference.
      Keep the planned lunch and comfort concern visible. Name what is not known: the image does not establish
      Rowan''s health, other people''s eating or whether Rowan has a disorder. Do not diagnose from this
      vignette.


      #### Action 2 — Produce a concrete care card


      Write `next action | when | existing support | optional cue change | no compensation | help route`.
      For the default, the proposed action is following the existing lunch plan at 12:00. Add a sentence
      Rowan could use: “This feeling can be here while I keep the care already planned.” If desired, draft
      a brief message to Jo asking for support without sending it. A draft remains a draft.


      Keep care independent of changing appearance, earning food, extra exercise or making the distress
      score fall. Preserve your card before [later-packet.md](?resource=file-later-packet-md), then use
      each branch''s actual supplied behavior to assess it. The learner''s real work is the written decision;
      Rowan''s behavior is simulated.


      #### Action 3 — Review the action and what remains difficult


      Record whether the care action occurred, whether distress remains, whether support was requested
      and whether any response arrived. These are separate facts. Use the branch to select one next step:
      retain the practical rule, ask the agreed support person, or use qualified care for current concerning
      behavior. Do not label a person noncompliant or morally better based on the case outcome.


      Attempt [fresh checks](?attempt=practice-checks) before the [key](?check=practice-answers). The
      source artifact is complete with the four-way distinction, bounded care card, both branch reviews
      and a concrete support threshold. These are reading checks, not evidence of an actual health action.


      ### Access, harder practice and later transfer


      For a less activating supplied alternative, use Casey''s garment case alone: record friction, optional
      style preference, available comfortable shirt and the unknown cause of any persistent discomfort.
      Draft the care action, then analyze these two supplied outcomes: shirt changed and comfort improved;
      or shirt changed but discomfort persisted. The first supports practical fit, the second supports
      further attention, and neither establishes a medical cause. This is a complete supported route with
      the same fact/care distinctions and no food reflection.


      Harder case: Rowan''s friend says “you look fine, so you do not need help,” while the later record
      shows repeated interference with planned eating. Write a response that accepts the friend''s care
      without accepting appearance as an assessment: “Thank you; the concern is what is happening with
      eating, and I want support for that.” Preserve the option of qualified help and do not require Rowan
      to persuade the friend before seeking it.


      For later real transfer, choose a naturally occurring low-stakes comfort or nourishment choice within
      your existing care plan. No deliberate exposure is needed. Record the action and support used privately,
      with no body ranking. If behavior is currently concerning, move to appropriate support rather than
      using the exercise as self-treatment. A self-review, actual support contact and qualified assessment
      are distinct; no independent observer or improvement claim is supplied by this guide.


      **Supportive:** Ordinary care occurs while appearance feelings remain, with no punishment or compensatory
      action.


      **Mixed:** Care occurs but the rule continues to interfere, so a support step is needed.


      **Contradictory:** Care is withheld, compensation added or a legitimate concern dismissed because
      of appearance.


      **Inconclusive:** Reassuring words are copied but no action or follow-up is documented.


      See scope and limits described in this guide and [source limits](?resource=sources). Dignity is
      never an outcome score.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A person changes to an already available comfortable garment but still dislikes how they
      look. A reviewer marks the care action failed because body positivity did not increase. What happened,
      what remains, and what criterion needs correction?

      2. A friend says a person looks healthy, so repeated interference with eating cannot merit qualified
      help. The person has drafted but not sent a support message. Correct both the health inference and
      the support status; name an available next action without diagnosing.

      3. Someone chooses a preferred style and keeps their existing meal plan. Must they abandon the style
      preference to demonstrate dignity? Explain the boundary between a preference and a harmful condition
      of care.


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The clothing action occurred; appearance feelings remain. Care does not require a favorable
      feeling. Review whether the garment supports comfort and access, and leave the feeling honestly
      recorded. Do not invent a positive emotion to make the action count.

      2. Appearance does not establish health or rule out an eating disorder. Repeated interference deserves
      appropriate support without a diagnosis from this exercise. The message is drafted, not sent, and
      no response or care is established. Using the chosen support route and qualified service is an available
      next action; it has not yet happened.

      3. No. A style preference can coexist with nourishment, comfort and dignity. The boundary is making
      care contingent on achieving an appearance, using deprivation or compensation, or dismissing real
      concerns. Do not replace one compulsory appearance rule with compulsory body positivity.


      These checks assess the supplied reasoning. They are not an eating-disorder screen or treatment
      evaluation.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
