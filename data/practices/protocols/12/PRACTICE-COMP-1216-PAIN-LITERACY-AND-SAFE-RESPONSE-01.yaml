  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [CDC — Chronic Conditions & Disabilities Activity](https://www.cdc.gov/physical-activity-basics/guidelines/chronic-health-conditions-and-disabilities.html)

      - [CDC — Pregnant & Postpartum Activity](https://www.cdc.gov/physical-activity-basics/guidelines/healthy-pregnant-or-postpartum-women.html)

      - [NIAMS — Sports Injuries](https://www.niams.nih.gov/health-topics/sports-injuries)

      - [MedlinePlus — Pain](https://medlineplus.gov/pain.html)

      - [NHS — Back pain](https://www.nhs.uk/conditions/back-pain/)

      - [University Hospitals Sussex — Low back pain A&E leaflet](https://www.uhsussex.nhs.uk/resources/low-back-pain/)

      - [Cleveland Clinic — Referred Pain](https://my.clevelandclinic.org/health/symptoms/25238-referred-pain)

      - [Apple — Allow or silence notifications for a Focus](https://support.apple.com/guide/iphone/allow-or-silence-notifications-for-a-focus-iph21d43af5b/ios)

      - [NCSC — Backing up your data](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/always-back-up-your-most-important-data)

      - [NCSC — Install the latest software and app updates](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/install-the-latest-software-and-app-updates)

      - [NCSC — Managing your passwords](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers)

      - [FTC — How Websites and Apps Collect and Use Your Information](https://consumer.ftc.gov/articles/how-websites-and-apps-collect-and-use-your-information)

      - [ICO — Your right to get your data deleted](https://ico.org.uk/for-the-public/your-right-to-get-your-data-deleted/)

      - [FTC — Use Two-Factor Authentication](https://consumer.ftc.gov/articles/use-two-factor-authentication-protect-your-accounts)

      - [NIST SP 800-63B-4](https://pages.nist.gov/800-63-4/sp800-63b.html)

      - [Microsoft — Find your BitLocker recovery key](https://support.microsoft.com/en-us/windows/security/encryption/find-your-bitlocker-recovery-key)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Imani chose familiar ordinary activity rather than repeating the unfamiliar outing. The next-day
      note says the ache decreased and ordinary function remained usual. There is still no diagnosis or
      test of readiness for a harder activity.


      Devon stopped the loading test and contacted the local urgent-care service. Its appointment acknowledgement
      arrived, but the case contains no attended assessment, diagnosis or treatment. Preserve that gap.


      Kit has two **alternative** branches:


      | Branch | Newly supplied information | What has actually occurred |

      | --- | --- | --- |

      | C1 | Kit checked for changes and reports the familiar pattern covered by the existing plan; used
      its agreed option | Activity attempt recorded; next-day function and care-team response are absent
      |

      | C2 | Back pain is now accompanied by new bladder-control difficulty and loss of feeling around
      the genital area | New symptoms are reported; no emergency contact or assessment is yet recorded
      |


      Explain the next route for each branch. C2 requires emergency help rather than a routine-message
      wait or a movement test. Do not mark that contact completed until it occurs. The symptom combination
      changes urgency; it does not establish a diagnosis from this page.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Describe the change before explaining it away


      Pain is a real experience. A useful response considers onset, location, associated changes, ordinary
      function and any existing care plan. Intensity alone cannot tell you which tissue is involved or
      whether it is safe to continue. The purpose here is to communicate and choose an appropriate help
      route while preserving uncertainty, not to diagnose yourself from a checklist.


      Allow 30 minutes with the supplied fictional records and an accessible notes tool. No exercise,
      pain provocation, medication change or personal health disclosure is required. Health and exercise
      content must be adapted to the person and does not replace licensed medical care. If you are experiencing
      a possible emergency, use local emergency care now rather than finishing a learning exercise.


      ### Six distinctions that improve a response


      **Post-activity soreness** is a possible explanation for discomfort after unfamiliar effort, not
      an automatic verdict. **Acute injury** involves a new event or sudden change; severe pain or loss
      of function should not be tested repeatedly to prove toughness. **Chronic pain** persists or recurs
      over time and may need a continuing individualized plan. A familiar label never rules out a new
      problem. **Referred symptoms** are felt away from their source, so pointing to the sore area does
      not locate the cause with certainty. **Red flags** are concerning features that require an appropriate
      urgent response, not proof of a particular diagnosis. **Fear-driven avoidance** can restrict valued
      activity; the answer is a supported, appropriate plan rather than forcing a feared task or dismissing
      pain as imaginary.


      The [NIAMS injury overview](https://www.niams.nih.gov/health-topics/sports-injuries) distinguishes
      sudden injury from gradually developing injury and lists functional warning signs. The [NHS back-pain
      page](https://www.nhs.uk/conditions/back-pain/) distinguishes ordinary follow-up, urgent worsening
      symptoms and emergency combinations. Its emergency examples include back pain with new bladder/bowel
      changes, loss of feeling around the genitals/anus, symptoms in both legs, chest pain, or a serious
      accident. These examples are not an exhaustive screening tool. Absence of a listed item does not
      establish safety. Use the equivalent local service; UK service numbers in the source are not universal.


      For a real concern, communicate the facts and ask what activity is appropriate now, which changes
      require urgent help, and when/how to review. Medication choices and a return-to-activity progression
      belong to the applicable care process. Do not impose complete indefinite inactivity from fear, but
      do not apply a generic “keep moving” slogan to a possible serious injury.


      ### Worked example: a familiar label loses its authority


      A person with a known recurring back problem develops a new symptom absent from their usual pattern.
      “It is always my back” is an interpretation, not a comparison. A useful record says what changed,
      when, how function changed, and whether the current plan covers it. New concerning features can
      require a different route even when the previous plan worked well. This is a communication principle,
      not a diagnosis of the new symptom.


      ### Complete material: three first-contact cards


      | Card | Supplied observations | Existing plan / missing information |

      | --- | --- | --- |

      | A — Imani | General thigh aching the morning after an unfamiliar outing; no sudden incident reported;
      can perform usual ordinary activities; symptoms described as mild | No assessment of cause; no other
      symptom information supplied; wants to repeat the unfamiliar outing immediately |

      | B — Devon | Ankle twisted during an outing today; sudden severe pain; cannot bear weight normally
      | No examination or diagnosis; another person proposes walking on it repeatedly to see whether it
      is serious |

      | C — Kit | Recurring pain for four months under an individual care plan; familiar discomfort has
      increased; concerned about giving up an enjoyable weekly activity | Existing plan says use its previously
      agreed lower-demand option for a familiar flare, contact the team for new/changed features, and
      review function the following day; whether any new features are present has not yet been checked
      |


      The supplied facts deliberately do not support a diagnosis. Kit''s lower-demand option is already
      known to Kit, not taught by this page and not a prescription for a reader.


      #### Action 1 — Make an observation-first note


      For each card write `onset/event | location/description | function | associated changes known/unknown
      | existing plan | question needing assessment`. Use the actual words and mark unknowns. Then state
      a possible concept **and** why it remains uncertain. A could be post-activity soreness; the timing
      alone does not prove it. B has concerning acute functional loss. C is persistent pain with a possible
      familiar flare, pending a check for changes.


      #### Action 2 — Rehearse a proportionate response


      For A, do not prescribe another unfamiliar effort as a diagnostic test. Describe a conservative
      choice within ordinary familiar activity, ask about concerning changes, and seek advice if symptoms
      worsen, persist or cause concern. For B, stop repeatedly loading the ankle and seek prompt medical
      evaluation; severity, transport and local urgent/emergency advice determine the practical route.
      For C, check whether the existing plan still applies; new concerning symptoms supersede the familiar-flare
      branch. Do not infer that fear makes the pain false or that reassurance is treatment.


      Say or type a short message for B using the six headings. It must communicate the functional loss
      and request appropriate evaluation without claiming a sprain or fracture. Save the three responses
      before [the later packet](?resource=file-later-packet-md).


      #### Action 3 — Let new information change the route


      Read the later records and retain what was actually done, what was merely requested, and what remains
      unknown. For Kit''s two alternative branches, choose separately; do not blend their facts. Produce
      one question about ongoing activity and one about the review trigger. Attempt [the fresh checks](?attempt=practice-checks),
      then use [the corrective key](?check=practice-answers).


      A complete output contains three observation notes, three proportionate responses, the spoken/typed
      handoff and the later revision. A polished diagnostic label with no appropriate response is not
      success. Sending a request does not establish that evaluation occurred.


      ### Access, harder cases and transfer


      Use a body diagram, a communication aid, interpreter or trusted support person. Describe personal
      changes from baseline rather than comparing pain tolerance with someone else. Keep private health
      details out of public practice records; case labels and response categories are enough.


      Harder case: two reports use the same pain number. One follows familiar mild aching with usual function;
      the other follows an accident with new functional loss. Explain why the number cannot select the
      same route. Include the possibility of referred symptoms without speculating about the organ or
      tissue involved.


      For later real transfer, use the note at an appropriate care conversation if a concern actually
      exists, preserve the received advice, and record the agreed follow-up. Without a concern, rehearse
      an unseen fictional card rather than manufacture symptoms. This differs from 12.10''s load/recovery
      accounting: the focus here is symptom uncertainty, communication and changed help routes. A case
      exercise cannot certify triage skill, recovery or safe physical capacity.


      **Supportive:** The response follows the observed change and actual guidance, with uncertainty and
      later review retained.


      **Mixed:** The initial response was reasonable, but new information requires escalation or revision.


      **Contradictory:** Pain is repeatedly provoked, dismissed as psychological, or a chronic label overrides
      emergency features.


      **Inconclusive:** Categories are memorized, but no communication, appropriate route or follow-up
      is demonstrated.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A person says a new sharp symptom must be harmless because it is only “3 out of 10.” They
      have not checked onset, functional change or associated symptoms. Write a better first response
      without diagnosing the problem or offering a movement test.

      2. A person has a familiar chronic back-pain plan. Today they report back pain and new difficulty
      controlling their bladder. A routine clinician message has been drafted, not sent. What should happen
      next, and what is the honest current action status?

      3. A learner''s note says, “I requested an appointment, so the injury was assessed; the pain is
      felt at the shoulder, so its cause is definitely in the shoulder.” Correct both conclusions and
      name the facts a useful handoff would retain.


      Save your responses before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. A pain number alone cannot establish cause or safety. Ask about onset/event, location/description,
      changed ordinary function, associated changes, and an applicable care plan; choose appropriate help
      from the actual situation. Do not infer “mild means harmless” or repeatedly provoke it to collect
      evidence. Missing information remains missing rather than normal.

      2. The new bladder-control change with back pain warrants local emergency help. The familiar plan
      does not override it. A draft message is not a sent request, contact or assessment, and waiting
      for routine correspondence is the wrong route for this case. Do not add a diagnosis or claim emergency
      help was already obtained.

      3. An appointment request is not an attended assessment. The location of a symptom does not establish
      its source; referred symptoms are possible. Preserve onset, symptom description, functional change,
      associated features, existing guidance and what was actually communicated or received. Do not name
      a remote cause from the possibility of referral.


      In the default later records, Imani has a favorable observation with limited scope; Devon has contacted
      a service but not a documented examination. C1 has an attempted plan option and incomplete follow-up.
      C2 requires emergency action not yet performed. These classifications assess written reasoning only.
      They are not a validated triage instrument or proof of clinical competence.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
