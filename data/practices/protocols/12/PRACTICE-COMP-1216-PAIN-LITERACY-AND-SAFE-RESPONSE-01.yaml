meaning_and_fit:
  purpose: Describe pain and its functional effects, distinguish common pain concepts from a diagnosis,
    and choose appropriate modification or evaluation rather than reckless persistence or blanket withdrawal.
  why_recommended: Describe pain and its functional effects, distinguish common pain concepts from a diagnosis,
    and choose appropriate modification or evaluation rather than reckless persistence or blanket withdrawal.
  claims:
  - statement: Describe pain and its functional effects, distinguish common pain concepts from a diagnosis,
      and choose appropriate modification or evaluation rather than reckless persistence or blanket withdrawal.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Pain literacy and safe response practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Pain literacy and safe response as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use body diagrams, descriptive words, an interpreter or a chosen support person.
    People with communication differences still deserve their pain to be taken seriously. Keep health
    details outside app evidence; case reasoning alone is not evidence of a personal recovery.
  opportunity_considerations: 'Use three fictional cases: mild familiar muscle soreness after an ordinary
    session; sudden severe ankle pain with inability to bear weight after a twist; and a long-standing
    pain flare under an existing clinical plan. Make headings for onset, location and quality, associated
    changes, function, existing plan and next help route. Do not provoke pain to create an example.'
  prerequisites:
  - 'Use three fictional cases: mild familiar muscle soreness after an ordinary session; sudden severe
    ankle pain with inability to bear weight after a twist; and a long-standing pain flare under an existing
    clinical plan. Make headings for onset, location and quality, associated changes, function, existing
    plan and next help route. Do not provoke pain to create an example.'
  dependencies: []
  safe_alternatives:
  - Use body diagrams, descriptive words, an interpreter or a chosen support person. People with communication
    differences still deserve their pain to be taken seriously. Keep health details outside app evidence;
    case reasoning alone is not evidence of a personal recovery.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Pain literacy and safe response differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Pain literacy and safe response
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use three fictional cases: mild familiar muscle soreness after an ordinary session; sudden severe
    ankle pain with inability to bear weight after a twist; and a long-standing pain flare under an existing
    clinical plan. Make headings for onset, location and quality, associated changes, function, existing
    plan and next help route. Do not provoke pain to create an example. Goal: Describe pain and its functional
    effects, distinguish common pain concepts from a diagnosis, and choose appropriate modification or
    evaluation rather than reckless persistence or blanket withdrawal. Scope: This is pain literacy and
    communication, not triage certification, diagnosis or treatment. New severe symptoms, possible serious
    injury or emergency signs require prompt care; a known chronic-pain plan does not rule out a new problem.
    Time and effort: Fifteen minutes with the supplied cases and, when relevant, one appropriate care
    or load-modification action. Adaptation: Use body diagrams, descriptive words, an interpreter or a
    chosen support person. People with communication differences still deserve their pain to be taken
    seriously. Keep health details outside app evidence; case reasoning alone is not evidence of a personal
    recovery. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use body diagrams, descriptive words, an interpreter or a chosen support person.
    People with communication differences still deserve their pain to be taken seriously. Keep health
    details outside app evidence; case reasoning alone is not evidence of a personal recovery.
  expected_burden: Fifteen minutes with the supplied cases and, when relevant, one appropriate care or
    load-modification action.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Pain literacy and safe response protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Pain literacy and safe response action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use body diagrams,
    descriptive words, an interpreter or a chosen support person. People with communication differences
    still deserve their pain to be taken seriously. Keep health details outside app evidence; case reasoning
    alone is not evidence of a personal recovery.
  actions:
  - stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01-A1
    sequence: 1
    title: Describe the case and separate concepts from conclusions
    instructions: 'For each case, record onset and functional change before choosing a label. Explain
      that acute injury, familiar post-activity soreness and chronic pain are different possibilities,
      not diagnoses from a word list; pain can also be felt away from its source. Fear and stress may
      affect experience without making pain imaginary. Mark information that only a qualified assessment
      can resolve.


      Observation checks: Onset symptoms and function precede any interpretation; Soreness acute injury
      chronic pain and referred symptoms are distinguished conceptually; Psychological influences do not
      invalidate the pain report; Diagnostic uncertainty and missing information remain explicit. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01
      action_stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01-A1
      competency_stable_id: '12.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1216_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1216_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - onset_symptoms_and_function_precede_any_interpretation
        - soreness_acute_injury_chronic_pain_and_referred_symptoms_are_distinguished_conceptually
        - psychological_influences_do_not_invalidate_the_pain_report
        - diagnostic_uncertainty_and_missing_information_remain_explicit
      - measurement_id: c1216_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1216_a1_adverse
        kind: boolean
        role: adverse
