        expected: true
  - stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01-A2
    sequence: 2
    title: Choose the proportionate immediate response
    instructions: 'For the severe ankle case, stop loading the injury and obtain prompt qualified evaluation
      rather than repeatedly testing it. For the chronic-pain case, follow the existing individualized
      flare plan while checking for new or changed symptoms. For familiar mild soreness, choose a conservative
      non-provocative activity modification and monitor function. Emergency symptoms such as chest pain,
      severe breathing difficulty or new neurological deficit require urgent local emergency help, not
      this worksheet.


      Observation checks: The response matches the observed severity and functional change; Possible serious
      injury is not repeatedly provoked; An existing chronic-pain plan does not erase new-symptom concerns;
      Emergency symptoms bypass the exercise for urgent help. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01
      action_stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01-A2
      competency_stable_id: '12.16'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1216_a2_primary
      transfer_disposition: context_bound
      measurements:
