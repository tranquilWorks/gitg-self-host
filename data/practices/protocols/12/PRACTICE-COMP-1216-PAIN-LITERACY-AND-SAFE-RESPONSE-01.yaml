  - stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01-A3
    sequence: 3
    title: Communicate clearly and review the response
    instructions: 'When a real concern exists, use the six headings to contact the appropriate clinician
      and ask what activity is appropriate, which changes need urgent attention and when to review. Carry
      out the agreed modification or care step and note whether ordinary function improves, worsens or
      remains uncertain. Do not stop all movement indefinitely from fear or resume a painful task merely
      because a preset number of days passed.


      Observation checks: A real concern receives an appropriate communication or care action; Activity
      limits warning signs and review timing are clarified; Function is rechecked after the chosen response;
      Neither indefinite avoidance nor calendar-only return substitutes for a plan. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: What did the description make clear to the care decision, and what uncertainty still
      requires assessment rather than reassurance or force?


      Examples: Supportive: The sudden injury was evaluated promptly, while the familiar chronic flare
      followed its existing plan with a check for new symptoms.


      Mixed: The initial modification reduced burden, but function remained limited and the review appropriately
      led to further assessment.


      Contradictory: Pain was dismissed as psychological or deliberately provoked to prove that continuing
      was safe.


      Inconclusive: Pain categories were memorized without a proportionate response, help route or follow-up
      of function.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1216-PAIN-LITERACY-AND-SAFE-RESPONSE-01
