  - stable_id: PRACTICE-COMP-1202-SLEEP-AND-CIRCADIAN-HEALTH-01-A3
    sequence: 3
    title: Compare function and choose continuation or clinical review
    instructions: 'Compare the three usual nights with the four trial nights using rest and daytime function,
      not a claim of measured sleep architecture. Keep the change only if useful and sustainable; an unclear
      result remains unclear. Persistent sleep problems, breathing concerns during sleep or dangerous
      daytime sleepiness warrant qualified evaluation. Do not drive or do hazardous work while dangerously
      sleepy merely to finish the experiment.


      Observation checks: Both periods are compared using the same simple indicators; An uncertain result
      is not presented as a cure; The next choice considers feasibility and burden; Persistent or safety-relevant
      sleep concerns lead to qualified help. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Did the change improve usable rest or daytime function without making sleep itself
      another performance task?


      Examples: Supportive: The dimmer wind-down was feasible and mornings felt less disrupted, so it
      was retained without claiming insomnia was treated.


      Mixed: Rest improved on two nights, but work shifts changed too, leaving the cause uncertain.


      Contradictory: Sleep time was deliberately shortened or severe daytime sleepiness ignored to meet
      the logging target.


      Inconclusive: A sleep score was watched repeatedly without changing a factor or comparing daily
      function.'
