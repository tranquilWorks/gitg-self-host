meaning_and_fit:
  purpose: Connect sleep opportunity and regularity with light, caffeine, environment, stress and recovery,
    then test one feasible change against ordinary daytime functioning.
  why_recommended: Connect sleep opportunity and regularity with light, caffeine, environment, stress
    and recovery, then test one feasible change against ordinary daytime functioning.
  claims:
  - statement: Connect sleep opportunity and regularity with light, caffeine, environment, stress and
      recovery, then test one feasible change against ordinary daytime functioning.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Sleep and circadian health practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Sleep and circadian health as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: For shift work or caregiving, compare similar shifts and choose a light, noise
    or caffeine-timing change that fits the existing care plan. Audio relaxation, a dim night light or
    sensory supports may remain necessary. A sleep clinician’s individualized plan takes precedence over
    this habit trial.
  opportunity_considerations: 'Use a private note with approximate sleep opportunity, perceived rest,
    daytime functioning and unusual circumstances. Default change: create a quieter, dimmer wind-down
    period before the existing bedtime while preserving enough opportunity to sleep. Keep medicines, clinical
    plans and essential nighttime care unchanged. No wearable or precise sleep-stage score is required.'
  prerequisites:
  - 'Use a private note with approximate sleep opportunity, perceived rest, daytime functioning and unusual
    circumstances. Default change: create a quieter, dimmer wind-down period before the existing bedtime
    while preserving enough opportunity to sleep. Keep medicines, clinical plans and essential nighttime
    care unchanged. No wearable or precise sleep-stage score is required.'
  dependencies: []
  safe_alternatives:
  - For shift work or caregiving, compare similar shifts and choose a light, noise or caffeine-timing
    change that fits the existing care plan. Audio relaxation, a dim night light or sensory supports may
    remain necessary. A sleep clinician’s individualized plan takes precedence over this habit trial.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Sleep and circadian health differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Sleep and circadian health
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a private note with approximate sleep opportunity, perceived rest, daytime functioning and
    unusual circumstances. Default change: create a quieter, dimmer wind-down period before the existing
    bedtime while preserving enough opportunity to sleep. Keep medicines, clinical plans and essential
    nighttime care unchanged. No wearable or precise sleep-stage score is required. Goal: Connect sleep
    opportunity and regularity with light, caffeine, environment, stress and recovery, then test one feasible
    change against ordinary daytime functioning. Scope: This is a short sleep-habit observation, not treatment
    for insomnia, sleep apnea or a circadian disorder. It does not prescribe sleep restriction, supplements
    or a universal shift-work schedule. Time and effort: A two-minute morning note for seven days, ten
    minutes of setup and a ten-minute comparison. Adaptation: For shift work or caregiving, compare similar
    shifts and choose a light, noise or caffeine-timing change that fits the existing care plan. Audio
    relaxation, a dim night light or sensory supports may remain necessary. A sleep clinician’s individualized
    plan takes precedence over this habit trial. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. For shift work or caregiving, compare similar shifts and choose a light, noise
    or caffeine-timing change that fits the existing care plan. Audio relaxation, a dim night light or
    sensory supports may remain necessary. A sleep clinician’s individualized plan takes precedence over
    this habit trial.
  expected_burden: A two-minute morning note for seven days, ten minutes of setup and a ten-minute comparison.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Sleep and circadian health protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Sleep and circadian health action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. For shift work
    or caregiving, compare similar shifts and choose a light, noise or caffeine-timing change that fits
    the existing care plan. Audio relaxation, a dim night light or sensory supports may remain necessary.
    A sleep clinician’s individualized plan takes precedence over this habit trial.
  actions:
  - stable_id: PRACTICE-COMP-1202-SLEEP-AND-CIRCADIAN-HEALTH-01-A1
    sequence: 1
    title: Observe the current pattern and choose one controllable factor
    instructions: 'For three ordinary mornings, note approximate bed and wake windows, perceived awakenings,
      daytime sleepiness and major care or work interruptions. Review six possible influences: schedule,
      light, caffeine timing, bedroom conditions, stress and recovery opportunity. Choose one feasible
      factor; for the default, reduce avoidable bright entertainment light before bed rather than move
      bedtime later. Record the other factors as unchanged or constrained.


      Observation checks: Three ordinary observations include daytime function; All six influences are
      considered without causal certainty; One feasible factor is selected for change; Needed sleep and
      essential care are not reduced. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1202-SLEEP-AND-CIRCADIAN-HEALTH-01
      action_stable_id: PRACTICE-COMP-1202-SLEEP-AND-CIRCADIAN-HEALTH-01-A1
      competency_stable_id: '12.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
