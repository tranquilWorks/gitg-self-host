  - stable_id: PRACTICE-COMP-1202-SLEEP-AND-CIRCADIAN-HEALTH-01-A2
    sequence: 2
    title: Use the chosen change on four nights with honest exceptions
    instructions: 'Arrange the quieter wind-down space before the first trial night and use it on four
      nights when feasible. Keep the sleep window and other major conditions as similar as ordinary life
      permits. Record disruptions and whether the change added stress. Do not lie awake clock-watching
      to obtain precise data, force yourself to remain awake or compensate for a missed night by an extreme
      schedule shift.


      Observation checks: The selected environmental or schedule change is actually used; Exceptions and
      other changing conditions remain visible; No deliberate sleep deprivation or punitive compensation
      is introduced; The observation burden does not become a new sleep obstacle. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
