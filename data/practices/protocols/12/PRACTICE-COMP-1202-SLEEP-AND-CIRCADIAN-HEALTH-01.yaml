      - [CDC, How to Measure Physical Activity Intensity](https://www.cdc.gov/physical-activity-basics/measuring/index.html)

      - [CDC, Strategies to Prevent Worsening of Symptoms](https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html)

      - [NHS, How to improve your strength and flexibility](https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/)

      - [Mayo Clinic, Stretching and flexibility](https://www.mayoclinic.org/healthy-lifestyle/fitness/basics/stretching-and-flexibility/hlv-20049447)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after saving the baseline, prediction and decision rule. These are fictional reports,
      not device measurements.


      | Night | Opportunity | Change used | Daytime functioning | Context |

      | --- | --- | --- | --- | --- |

      | T1 | 23:00–07:00 | yes | manageable | Same shift; no added burden |

      | T2 | 23:00–07:00 | yes | manageable | Same shift; no added burden |

      | T3 | 23:00–07:00 | yes | missing | Morning note interrupted; outcome unknown |

      | T4 | 00:00–07:00 | no | difficult | Essential care; no hazardous sleepiness reported |


      Lee says the audio was acceptable on the three nights used. Safety light and care alert remained;
      no medication or caffeine change is reported. Do not infer that “no hazardous sleepiness reported”
      proves none existed.


      Calculate opportunity, feasibility, observed functioning and missingness before reading onward.


      ### Comparison and next step


      Baseline opportunities are 480, 450 and 480 minutes: 1,410 total, 470 mean. Trial opportunities
      are 480, 480, 480 and 420: 1,860 total, 465 mean. This is five minutes less mean opportunity, not
      five minutes less measured sleep.


      The change was used on 3/4 trial nights. Manageable functioning was reported on 2/3 baseline nights
      and 2/3 observed trial nights, with 1/4 trial outcomes missing. Calling trial functioning 3/4 manageable
      fabricates T3; calling it 2/4 manageable silently treats missing as non-manageable unless explicitly
      labeled a conservative sensitivity calculation. With T3 unfavorable the trial proportion would be
      2/4; with it favorable, 3/4. The missing report can change the decision.


      The observed proportion meets Lee''s toy “no worse” rule, but missingness and a care-related interruption
      make benefit inconclusive. A defensible decision is retain the acceptable audio provisionally for
      convenience, make no sleep-benefit claim, and revisit on comparable ordinary nights without increasing
      tracking or reducing care. Rejection is also reasonable if Lee finds the routine unwanted; completion
      does not require a favorable result.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Protect sleep opportunity, then test one feasible change


      Time available for sleep, time actually asleep and next-day functioning are related but different
      observations. A long window can contain awakenings; a brief morning note cannot identify sleep stages
      or diagnose a disorder. Regularity concerns timing across days, not perfect adherence to an arbitrary
      bedtime.


      This guide teaches schedule, light, caffeine, environment, stress and recovery through a complete
      seven-night fictional comparison. Allow 10 minutes to plan, 10 to analyze the later packet and 10
      for fresh checks. No wearable, clock-watching, purchase, personal sleep disclosure or deliberate
      sleep deprivation is needed. You produce a preserved prediction, comparison and next decision. The
      case does not demonstrate that you slept differently. Health and exercise content must be adapted
      to the person and does not replace licensed medical care.


      ### Six influences, one manageable experiment


      Schedule creates an opportunity that must fit work, care and individual needs. Light can affect
      the body clock; caffeine can interfere with sleep. Noise, temperature and necessary sensory supports
      affect the environment. Stress may make settling harder, while extra monitoring can itself add burden.
      Recovery needs and existing clinical plans take priority over the experiment. NHLBI describes [healthy
      sleep habits](https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits); those general
      suggestions do not specify an individual''s treatment or shift-work schedule.


      Choose one controllable factor and record the others as unchanged, constrained or unknown. A quieter
      entertainment period can be tested while keeping a safety light and caregiving alert. Turning off
      every light is not a requirement. Do not postpone bedtime to finish a log, suppress essential care,
      change medicines or use sleep restriction to manufacture a difference.


      Compare the same simple indicator across periods: for example, the person''s description of ordinary
      daytime functioning. Keep exceptions, missing records and changed shifts visible. A short comparison
      can inform whether a habit is feasible; it cannot prove the habit caused a change. Persistent problems,
      breathing concerns during sleep or dangerous sleepiness need qualified evaluation. Do not drive
      or perform hazardous work while dangerously sleepy to complete a trial.


      ### Worked example: a long window is not measured sleep


      Taylor has an opportunity from 22:45 to 06:45: 75 minutes before midnight plus 405 after it, or
      480 minutes. They report a prolonged awakening but do not time it. The record can say “480-minute
      opportunity; actual sleep unknown.” Subtracting a guessed 60 minutes would create false precision.
      If the next day''s functioning was not recorded, leave it missing rather than treating it as good.


      ### Complete materials: Lee''s ordinary week


      Lee has a stable daytime shift, an existing 23:00–07:00 sleep opportunity and a required dim safety
      light. No medicine changes or current dangerous sleepiness are reported. A care alert must remain
      audible. These are stipulated case facts, not medical clearance. Lee wants a less intrusive wind-down,
      not a sleep score.


      Here “manageable” means Lee reported ordinary daytime duties felt manageable; “difficult” means
      they reported unusual difficulty staying engaged. These original descriptive categories are not
      a validated scale. Blank means missing. All windows cross midnight once.


      | Baseline night | Opportunity | Daytime functioning | Context |

      | --- | --- | --- | --- |

      | B1 | 23:00–07:00 | manageable | Bright entertainment screen until bed |

      | B2 | 23:30–07:00 | difficult | Late essential care shortened opportunity |

      | B3 | 23:00–07:00 | manageable | Bright entertainment screen until bed |


      The proposed single change is to replace bright entertainment with familiar quiet audio from 22:30,
      keeping the dim safety light, care alert and 23:00–07:00 opportunity. Audio is already available.
      Caffeine routine, work shift and room setup stay unchanged unless a later record says otherwise.
      Lee will spend at most two minutes on a morning note; no overnight measurement is requested.


      #### Action 1 — Preserve the plan before outcomes


      Compute each baseline opportunity and the mean; retain the care disruption. Write a six-factor map
      and the prediction “this may be easier to use and may support manageable daytime function; cause
      will remain uncertain.” Define a practical continuation rule before opening results: consider retaining
      the change if it is feasible on at least three of four trial nights, observed functioning is no
      worse in proportion than baseline, and no new safety concern or unwanted burden appears. Missing
      or substantially changed conditions can make this inconclusive. This is Lee''s toy decision rule,
      not a health threshold.


      Use `night | planned window | actual opportunity | change used yes/no/unknown | functioning | interruption
      | logging burden`. Save the plan before opening [later-packet.md](?resource=file-later-packet-md).


      #### Action 2 — Analyze all four trial nights


      Separate exposure (whether the change occurred) from the outcome (functioning). Use the number of
      observed functioning reports as its denominator; also state how many nights are missing. Compare
      opportunity minutes separately. Do not add missing nights to the favorable count or omit inconvenient
      disruptions from the case narrative. Explain whether the predeclared rule is met, contradicted or
      uncertain.


      #### Action 3 — Make a bounded next decision


      Choose retain provisionally, revise one method, reject an unwanted change or seek qualified help
      for a relevant concern. State exactly what happens next and what would change that choice. “Sleep
      improved” without a comparable observation is not enough. A real follow-up uses similar shifts and
      unchanged supports; if opportunity is constrained by care or work, address access/support rather
      than blame.


      Attempt [check-prompts.md](?attempt=practice-checks) before the [key](?check=practice-answers).
      The source learning artifact includes the preserved rule, baseline and trial arithmetic, missingness,
      burden and next decision. The actual seven-day practice remains distinct from this case analysis.


      ### Access, challenge and transfer


      A reader can calculate elapsed windows; approximate morning descriptions are enough for live use.
      Use relative anchors for shift work and compare similar shifts. Keep assistive audio, dim lighting
      and clinical instructions. If recording becomes distressing, reduce or stop this optional observation;
      more tracking is not the goal.


      Harder supplied variation: keep the same four trial records, but T2 and T3 are now after a newly
      changed night shift. Recalculate nothing falsely: the arithmetic is the same, but comparability
      is weaker. Plan a future comparison of similar shifts without forcing a return to a daytime schedule
      or cutting sleep.


      For later real transfer, use three ordinary baseline mornings and four feasible trial nights under
      the existing source route, with a brief comparison. Record actual behavior only when it happens.
      Unsupported self-report is distinct from device measurement, qualified assessment and an independent
      observer; none may be invented to satisfy a score. A week cannot establish a general circadian-health
      outcome.


      **Supportive:** A feasible change accompanies useful functioning under comparable conditions and
      can be retained provisionally.


      **Mixed:** The change is feasible, but interruptions, burden or different shifts weaken the comparison.


      **Contradictory:** Needed sleep or care is removed, worsening is hidden, or hazardous sleepiness
      is ignored.


      **Inconclusive:** Missing observations or a plan without actual use cannot establish a benefit.


      See scope and limits described in this guide and [source limits](?resource=sources).'
