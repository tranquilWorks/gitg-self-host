  - stable_id: PRACTICE-COMP-1206-CARDIOVASCULAR-ENDURANCE-01-A2
    sequence: 2
    title: Complete the familiar effort and observe recovery
    instructions: 'Use the planned activity at the selected comfortable pace without racing or extending
      the route. Record approximate time, whether the effort stayed conversational or within the existing
      plan, and how ordinary breathing and function returned afterward. Stop at the boundary and retain
      any symptom or interruption in the record. A shorter safe attempt is more informative than hiding
      a difficult finish.


      Observation checks: The planned familiar activity is actually attempted; Effort stays within the
      chosen appropriate range or prompts stopping; Duration and recovery are observed without a maximal
      test; Symptoms interruptions and shortened attempts remain visible. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
