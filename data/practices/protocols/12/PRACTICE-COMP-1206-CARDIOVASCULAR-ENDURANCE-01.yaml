  - stable_id: PRACTICE-COMP-1206-CARDIOVASCULAR-ENDURANCE-01-A3
    sequence: 3
    title: Repeat comparably and decide whether the dose fits
    instructions: 'On another suitable day, repeat only after usual recovery and compare effort, access
      and aftermath. Keep the dose, shorten it, change the route or seek qualified guidance. If a future
      goal needs higher intensity, identify the required instruction and individualized progression rather
      than adding sprints now. The review concerns sustainable participation and recovery, not a claimed
      change in aerobic capacity.


      Observation checks: A comparable repeat occurs only after appropriate recovery; Effort and aftermath
      are compared alongside duration; The next dose or support choice follows the observations; Higher-intensity
      goals remain separate from this easy trial. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Was the effort repeatable without an unacceptable recovery cost, and what would make
      a different intensity appropriate?


      Examples: Supportive: Both short level outings remained comfortable and recovery fit the rest of
      the day, supporting repetition of the same dose.


      Mixed: The second outing took similar time but caused greater delayed fatigue, so the plan needed
      reduction or review.


      Contradictory: Unplanned sprints were added or alarming symptoms ignored to finish a distance target.


      Inconclusive: A route and heart-rate goal were selected without an actual safe effort or recovery
      observation.'
    expected_time: 15-25 minutes
    due_within_days: 10
