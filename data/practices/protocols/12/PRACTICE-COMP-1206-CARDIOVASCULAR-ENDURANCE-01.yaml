meaning_and_fit:
  purpose: Practice a familiar cardiovascular activity at an appropriate sustainable level and distinguish
    endurance, higher-intensity work and recovery without confusing exhaustion with fitness.
  why_recommended: Practice a familiar cardiovascular activity at an appropriate sustainable level and
    distinguish endurance, higher-intensity work and recovery without confusing exhaustion with fitness.
  claims:
  - statement: Practice a familiar cardiovascular activity at an appropriate sustainable level and distinguish
      endurance, higher-intensity work and recovery without confusing exhaustion with fitness.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cardiovascular endurance practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cardiovascular endurance as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use indoor, seated, supported or shorter activity under an existing plan when
    weather, disability or access requires it. For chronic illness with post-exertional worsening, do
    not use automatic graded increases; follow individualized clinical guidance. A route plan without
    movement is preparation only.
  opportunity_considerations: 'Choose walking, wheelchair propulsion, easy cycling on a familiar safe
    route or another already-tolerated aerobic activity. Default: five minutes on a level, nearby route
    at a pace that permits comfortable conversation, with an easy return and usual aids. Choose a shorter
    existing tolerated duration when five minutes is inappropriate. No traffic exposure, heat challenge
    or performance target is required.'
  prerequisites:
  - 'Choose walking, wheelchair propulsion, easy cycling on a familiar safe route or another already-tolerated
    aerobic activity. Default: five minutes on a level, nearby route at a pace that permits comfortable
    conversation, with an easy return and usual aids. Choose a shorter existing tolerated duration when
    five minutes is inappropriate. No traffic exposure, heat challenge or performance target is required.'
  dependencies: []
  safe_alternatives:
  - Use indoor, seated, supported or shorter activity under an existing plan when weather, disability
    or access requires it. For chronic illness with post-exertional worsening, do not use automatic graded
    increases; follow individualized clinical guidance. A route plan without movement is preparation only.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cardiovascular endurance differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cardiovascular endurance as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose walking, wheelchair propulsion, easy cycling on a familiar safe route or another already-tolerated
    aerobic activity. Default: five minutes on a level, nearby route at a pace that permits comfortable
    conversation, with an easy return and usual aids. Choose a shorter existing tolerated duration when
    five minutes is inappropriate. No traffic exposure, heat challenge or performance target is required.
    Goal: Practice a familiar cardiovascular activity at an appropriate sustainable level and distinguish
    endurance, higher-intensity work and recovery without confusing exhaustion with fitness. Scope: The
    trial is not a stress test, fitness clearance or prescription for vigorous intervals. Existing medical
    advice controls activity choice, and two outings cannot prove cardiovascular adaptation. Time and
    effort: Ten minutes to prepare and two short familiar activity periods on separate suitable days,
    each followed by a brief recovery note. Adaptation: Use indoor, seated, supported or shorter activity
    under an existing plan when weather, disability or access requires it. For chronic illness with post-exertional
    worsening, do not use automatic graded increases; follow individualized clinical guidance. A route
    plan without movement is preparation only. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use indoor, seated, supported or shorter activity under an existing plan when weather,
    disability or access requires it. For chronic illness with post-exertional worsening, do not use automatic
    graded increases; follow individualized clinical guidance. A route plan without movement is preparation
    only.
  expected_burden: Ten minutes to prepare and two short familiar activity periods on separate suitable
    days, each followed by a brief recovery note.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cardiovascular endurance protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Cardiovascular endurance action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use indoor,
    seated, supported or shorter activity under an existing plan when weather, disability or access requires
    it. For chronic illness with post-exertional worsening, do not use automatic graded increases; follow
    individualized clinical guidance. A route plan without movement is preparation only.
  actions:
  - stable_id: PRACTICE-COMP-1206-CARDIOVASCULAR-ENDURANCE-01-A1
    sequence: 1
    title: Set a sustainable route dose and stop plan
    instructions: 'State the activity’s purpose, current comfortable duration, route access and recovery
      opportunity. Distinguish this easy base effort from higher-intensity training, which may require
      separate preparation or advice. Check weather, surface, equipment and a way to stop or return early.
      Fix duration and a comfortable effort description before starting; symptoms such as chest discomfort,
      faintness or unusual breathlessness require stopping and appropriate care.


      Observation checks: The dose is based on current ability rather than an age or peer target; Easy
      base effort is distinguished from unprescribed high-intensity work; Route conditions access aids
      and an early return are checked; Concerning symptoms override the activity plan. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1206-CARDIOVASCULAR-ENDURANCE-01
      action_stable_id: PRACTICE-COMP-1206-CARDIOVASCULAR-ENDURANCE-01-A1
      competency_stable_id: '12.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
