      - [CDC, Strategies to Prevent Worsening of Symptoms](https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html)

      - [NHS, How to improve your strength and flexibility](https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/)

      - [Mayo Clinic, Stretching and flexibility](https://www.mayoclinic.org/healthy-lifestyle/fitness/basics/stretching-and-flexibility/hlv-20049447)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after choosing the route. Every observation is fictional and belongs to Dev, not the
      learner.


      Session 1: indoor loop, usual aid, suitable conditions. Dev completes 6 minutes within the easy
      cue. Ordinary breathing is reported back after 3 minutes; later that day and the next morning ordinary
      function is reported usual. No warning sign is reported. Before session 2 on a later suitable day,
      the existing plan and usual recovery are rechecked and remain appropriate.


      Session 2: same loop, aid and planned effort. After 4 minutes Dev notices unusual breathlessness,
      stops at the accessible exit and uses the appropriate urgent medical advice route. The record does
      not include a diagnosis, a measured recovery time or clearance to resume. A friend suggests completing
      the remaining 2 minutes later to reach the target.


      Preserve actual work as 6 + 4 = 10 minutes across two attempts, not 12 completed minutes. The missing
      recovery record is unknown, not a quick recovery. Stopping is consistent with the plan; resuming
      to earn the remaining minutes is not supported. The next step follows the medical advice obtained,
      with no exercise repeat or escalation assumed in this record.


      The first session supports tolerability under its conditions. The second supplies an adverse observation
      requiring the stated help route; this is mixed evidence about the two-session participation plan,
      not a claim that stopping was poor behavior. Two sessions cannot establish fitness gain or diagnose
      the cause.


      Alternative supportive branch, replacing session 2 entirely: 6 easy minutes, same conditions and
      usual aid, ordinary breathing after 3 minutes, later function usual, no concern reported. This supports
      repeating the unchanged plan, not automatic progression. Keep the branches separate; do not borrow
      the alternative''s recovery for the main session.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Higher intensity: instruction before participation


      Higher intensity changes the effort and recovery demand; it is not established by finishing the
      same route faster. This lesson’s easy-effort trial does not teach interval technique or authorize
      increasing exertion. If higher-intensity activity is an appropriate goal, begin with an existing
      individualized plan or a qualified instructor who can assess suitability, explain the intended effort
      and recovery cues, demonstrate the chosen activity and observe an accessible first attempt. Bring
      the actual activity, current supports, prior response and recovery questions; keep medical details
      with the appropriate clinician. Before any such attempt, confirm the prescribed work/recovery limits,
      stop conditions and who may change them. A missing dose, uncertain technique or unresolved recovery
      problem means preparation or consultation, not an improvised interval. After an authorized attempt,
      record actual effort, assistance, recovery and any early stop, then seek the agreed review before
      progression. This is a preparation pathway; exact physical instruction and suitability remain matters
      for qualified review.


      ### Ask whether an effort is repeatable, including its aftermath


      Cardiovascular endurance concerns sustaining activity and recovering appropriately for the person''s
      health and goals. A faster time can come from greater effort, an easier route or changed assistance;
      it does not automatically show improved capacity. Easy aerobic participation, higher-intensity training
      and a maximal test are different tasks with different preparation needs.


      This guide provides a complete fictional route-and-recovery comparison. Allow 10 minutes to choose
      the route, 10 for the later sessions and 10 for fresh checks. Paper, dictation and simple time arithmetic
      suffice. No exercise, wearable, purchase, fitness disclosure or physical challenge is required for
      the default. Its output is an evidence-based decision about supplied records, not a claim that the
      learner exercised. Health and exercise content must be adapted to the person and does not replace
      licensed medical care.


      ### Duration, intensity, frequency and recovery


      Duration is how long an effort lasts; frequency is how often it occurs; intensity describes how
      demanding it is. A useful record also includes the activity type, environment, equipment, support
      and recovery afterward. Increasing several at once makes both tolerability and the explanation harder
      to assess. More exhaustion is not a required sign of a useful session.


      The CDC describes [relative intensity and the talk test](https://www.cdc.gov/physical-activity-basics/measuring/index.html).
      Conversational ease can be a rough description for someone able to use it; it is not medical clearance
      or a universal instrument. Speech, respiratory conditions and communication differences may make
      it unsuitable. Keep the person''s established nonverbal effort cues or qualified plan instead of
      requiring speech. A numerical heart-rate formula is unnecessary here.


      Base activity usually emphasizes repeatable sustainable effort. Higher-intensity goals may need
      different preparation, progression and recovery; this guide supplies no interval prescription. A
      previously tolerated activity may still be inappropriate today if health, symptoms or conditions
      change. Check the opportunity to stop and return before choosing a route. New chest discomfort,
      faintness or unusual breathlessness means stop and obtain appropriate urgent medical help; use local
      emergency services for severe symptoms or an emergency. Existing stop rules also apply. Do not wait
      for the next log entry.


      Immediate recovery and later ordinary functioning are different observations. Delayed worsening
      remains relevant even after breathing settles. For conditions involving post-exertional worsening,
      use individualized clinical guidance; no automatic graded increase is required. [CDC''s ME/CFS guidance](https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html)
      supports that specific limitation, not a diagnosis from fatigue alone.


      ### Worked example: equal duration, changed conditions


      Jamie completes an eight-minute familiar activity twice. The first is indoors with usual assistance;
      the second is outdoors in heat with less support and requires substantially more recovery. Equal
      minutes do not make the efforts comparable. The second record should preserve changed conditions
      and the recovery cost. Restore suitable conditions or seek relevant guidance before repeating; do
      not interpret the harder aftermath as proof of better training.


      ### Complete materials: Dev''s route choice


      Dev has an existing individualized activity plan for a familiar indoor accessible loop using their
      usual mobility aid. It permits up to 6 minutes total of easy movement, including the return, on
      suitable days. The present observation cycle makes no dose increase. Ordinary function and usual
      recovery must be restored before another session; calendar spacing alone does not establish this.
      The movement, support, equipment and stop rules are already familiar in the case. These are fictional
      personal-plan facts, not instructions for the reader to perform six minutes.


      The loop takes about 2 minutes at Dev''s planned pace; distance and speed are not goals. An accessible
      exit and seat are available after every loop. No public road crossing is involved. The alternative
      is a familiar level out-and-back path taking 4 minutes outbound and 4 minutes to return, with no
      earlier safe exit. Conditions today are suitable indoors. There is no current symptom concern reported,
      and the usual aid is available. If any important condition is unknown in a real setting, obtain
      appropriate information or defer the physical attempt.


      | Plan item | Fixed case value |

      | --- | --- |

      | Purpose | Reach a nearby indoor activity without unacceptable later burden |

      | Total movement limit | 6 minutes including return |

      | Intensity | Existing easy effort cue; usual conversational comfort is available for Dev |

      | Support | Usual aid retained; accessible seat and exit |

      | Boundary | No racing, extra loop, heat challenge or vigorous interval |

      | Before repeat | Ordinary recovery/function restored; no concerning change; existing plan remains
      appropriate |

      | After effort | Record immediate recovery and later same-day/next-day function |


      #### Action 1 — Choose and predeclare


      Calculate which route fits total movement and return. For the loop, 3 × 2 = 6 minutes is the planned
      ceiling, not a reason to hurry or finish when a stop condition occurs. The alternative requires
      8 minutes; “only four minutes out” omits the return. Write a plan containing type, duration, effort
      cue, aid, exit, stop rules and recovery review. Preserve it before [later-packet.md](?resource=file-later-packet-md).


      Use `session | conditions | planned/actual minutes | effort | support | stop/interruption | immediate
      recovery | later function | next decision`. Missing recovery is unknown, not zero burden. If a real
      route cannot meet these requirements, a route/consultation brief completes preparation only, not
      physical practice.


      #### Action 2 — Read the two sessions honestly


      Apply the later observations without changing the original limit. Compare effort, support, immediate
      recovery and later burden alongside duration. Distinguish an appropriately shortened effort from
      a violation such as adding an unplanned sprint. A stop can be a responsible action while evidence
      about sustainable participation remains limited.


      #### Action 3 — Choose a defensible next step


      Choose repeat unchanged, reduce or adapt within existing guidance, seek qualified advice, or stop
      and use appropriate care. No disposition is a reward for finishing. Cite the observation that controls
      the decision and what remains uncertain. If the goal later requires higher intensity, name the individualized
      instruction/preparation needed; do not append intervals to this easy trial.


      Complete [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). The
      source artifact needs the route calculation, preserved plan, session comparison and next disposition.
      The actual two-outing practice is separate; reading the case does not demonstrate aerobic adaptation.


      ### Access, harder practice and later transfer


      Use familiar indoor, seated, supported or shorter activity only within an already suitable plan.
      Assistance is a legitimate comparison condition, not a failed version. A reader may analyze the
      entire default without movement. If access, safety or recovery is uncertain, write the exact question
      for a qualified person: appropriate activity and cue, current tolerable dose, stop/return arrangement,
      recovery criteria and progression authority. An unanswered consultation is preparation, not clearance.


      Harder case: someone completes the loop in 5 minutes by increasing pace, then claims a 1-minute
      gain at the same dose. Identify the intensity change, withhold a capacity-improvement claim and
      preserve the original easy-effort boundary. No sprint or maximal test is needed to answer.


      At a later suitable real opportunity, use an already tolerated activity and existing limits, observe
      a first effort and its aftermath, and repeat comparably only after appropriate recovery. Preserve
      shortened attempts and naturally changed conditions. Longer-term evidence of endurance change would
      require a suitable comparable measure and adequate repeated observation; two outings, a self-review
      or this simulation do not supply it. Independent and qualified observations must actually occur
      and remain distinct from self-report.


      **Supportive:** Both efforts remain within the existing plan and ordinary recovery supports repeating
      the same dose.


      **Mixed:** Similar minutes conceal greater effort or delayed burden, prompting adaptation or review.


      **Contradictory:** A warning sign is ignored, support is removed or intensity is added to produce
      a faster result.


      **Inconclusive:** A route is planned but no activity or recovery is observed on the live route.


      See scope and limits described in this guide and [source notes](?resource=sources).'
