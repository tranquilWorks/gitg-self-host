      - [NHS, How to improve your strength and flexibility](https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/)

      - [Mayo Clinic, Stretching and flexibility](https://www.mayoclinic.org/healthy-lifestyle/fitness/basics/stretching-and-flexibility/hlv-20049447)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Open after preserving the A/B comparison and four criteria. All observations are fictional;
      none describe the learner.


      First occasion, A: usual supports retained; cup placed/retrieved under control; no new pain, dizziness
      or instability reported; reach described as more effortful but still within the familiar comfortable
      task. Grip and immediate aftermath are tolerable.


      First occasion, B: same support and cup; controlled placement/retrieval; no new pain, dizziness
      or instability reported; less reach effort; grip and immediate aftermath tolerable. The height stayed
      20 cm. No joint angles were measured.


      Second ordinary occasion, B: usual supports remain; placement/retrieval is controlled; no new pain,
      dizziness or instability is reported. Grip fatigue is now reported and the task is stopped without
      extra repetitions. Its cause and later recovery are unknown. C is never attempted.


      ### Interpret after your attempt


      The horizontal task demand fell from 35 to 25 cm, a 10 cm reduction; height did not change. Initial
      observations support easier access at B. The second occasion is mixed because grip/tolerance remains
      a concern despite controlled movement. Retain the closer arrangement as an access option, avoid
      forcing further attempts, and obtain appropriate advice about the persistent/new limitation before
      prescribing training. Do not assert that the shelf caused the fatigue or cured a joint limitation.


      The unknown later recovery prevents declaring the fourth criterion fully met on repeat. Three observed
      criteria plus one unknown/limited criterion are not four passes. A real concern follows the relevant
      clinical advice, with no need to remove support or test C to collect more data.


      Alternative supportive second occasion: same B setup, all four criteria met and ordinary aftermath
      reported tolerable. That supports repeatable access in this task. It still does not establish increased
      joint range or tissue adaptation. Keep this alternative separate from the grip-fatigue branch.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make a useful movement accessible before asking for more range


      A daily movement needs enough usable range, control, stability and tolerance for its task. Reaching
      farther is not automatically better. Moving an object closer can improve access immediately without
      changing the person''s joint range. That distinction makes environmental adaptation a real success
      while keeping claims about physical capacity honest.


      This guide teaches a task-specific comparison using complete fictional shelf records. Allow 10 minutes
      to analyze the arrangement, 10 for the later repeat and 10 for fresh checks. No reaching, stretching,
      balance test, measurement of your body, purchase or private disclosure is required for the default.
      Paper, labeled cards or dictation suffice. Its output is an access decision and a limited interpretation
      of supplied observations, not a physical examination. Health and exercise content must be adapted
      to the person and does not replace licensed medical care.


      ### What the task demands


      **Range of motion** is the movement available at a joint; **flexibility** concerns the capacity
      of tissues to permit movement. **Usable mobility** also needs control for the actual task. **Stability**
      helps maintain a controlled position; **balance** concerns maintaining the body in relation to its
      support. **Tissue tolerance** concerns how the body''s structures tolerate the demands placed on
      them, including repeated use and aftermath. These are working educational distinctions, not diagnoses
      or independent clinical measures.


      The NHS connects [flexibility with movement needed for daily tasks](https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/).
      That does not mean every limitation needs stretching. A grip problem, inaccessible shelf, dizziness
      or fatigue can affect the same task. Observe the limiting feature and label its cause unknown when
      appropriate. A larger movement accompanied by pain, loss of control or removed support does not
      establish better usable capacity.


      Keep ordinary supports and familiar limits. Do not force or bounce a joint, test an unstable stance
      or deliberately provoke pain. [Mayo Clinic''s stretching guidance](https://www.mayoclinic.org/healthy-lifestyle/fitness/basics/stretching-and-flexibility/hlv-20049447)
      supports avoiding painful or bouncing stretches; this case prescribes none. New limitations, pain,
      instability or dizziness need appropriate assessment rather than more force. A clinical mobility
      or rehabilitation plan governs any live exercise route.


      ### Worked example: the task became easier


      A drawer handle is moved from a distant position to a closer one while the person uses the same
      seat and support. The person can now open it without leaning. That supports improved access in the
      changed environment. It does not show a larger shoulder range, stronger grip or a treatment effect.
      If grip fatigue persists, the adaptation can remain while the unresolved need is assessed.


      ### Complete materials: Noor''s cup station


      Noor uses a familiar seated position with usual back and foot supports. A light unbreakable empty
      cup is placed on a stable surface. Three shelf arrangements are described below. Distances are supplied
      task geometry, not recommended reach ranges for anyone. Noor''s existing task plan allows only familiar
      comfortable arrangements with supports retained. No new clinical limitation is reported at baseline;
      that report is not clearance for an unfamiliar reach.


      | Arrangement | Horizontal distance | Shelf above starting surface | Existing knowledge |

      | --- | --- | --- | --- |

      | A, usual shelf | 35 cm | 20 cm | Familiar and previously comfortable with usual support |

      | B, proposed closer shelf | 25 cm | 20 cm | Familiar and previously comfortable with usual support
      |

      | C, high display shelf | 45 cm | 35 cm | Unfamiliar; safe control and tolerance unknown |


      B changes horizontal distance only. C changes two demands and has no established safe route. Do
      not physically test it. Noor''s goal is to place and retrieve this cup during an ordinary break,
      not to maximize reach or become independent of aids.


      The four predeclared criteria are: usual supports retained; cup placed and retrieved under control;
      no new pain, dizziness or instability; and tolerable grip/aftermath in ordinary use. Use yes/no/unknown
      for each; a missing observation is not a pass. Distance alone cannot satisfy a criterion. The planned
      comparison includes one placement/retrieval at A and one at B only if each remains appropriate that
      day, followed by another ordinary occasion using the selected arrangement. No repetitions to fatigue,
      forced end range or support removal are permitted.


      #### Action 1 — Define the demand and choose the comparison


      Write the task, supports, four criteria and why A/B are the bounded candidates. Calculate the 10
      cm horizontal reduction and record unchanged height; do not compute a joint-angle gain from shelf
      distances. State how range, balance, stability, control and tolerance might each matter without
      diagnosing the person. Preserve your plan before [later-packet.md](?resource=file-later-packet-md).


      Use `arrangement | distance/height | support | control | symptoms/instability | grip/aftermath |
      actual task | unknowns | next disposition`.


      #### Action 2 — Compare the supplied observations


      The later packet separates initial access from a second occasion. Identify which criteria are met,
      which remain unknown and what changed. Do not average away a warning sign or call an unobserved
      high-shelf attempt successful. If a real usual arrangement is already unsafe, adapt the environment
      or seek instruction without first performing a baseline challenge; safety does not require a paired
      physical test.


      #### Action 3 — Keep access and clarify the remaining need


      Choose retain the useful arrangement, adapt another task feature within familiar safe limits, or
      seek appropriate qualified assessment. Preserve the accessible option while any training need is
      considered. Better access and persistent limitation may coexist. Ask a useful question: is the unresolved
      feature grip, range, balance, stability, tolerance or something that needs evaluation before choosing
      training? A worksheet cannot answer that clinical question from shelf geometry.


      Complete [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). A complete
      source artifact has the geometry comparison, observed criteria, repeat interpretation and an honest
      next step. These reading outputs do not measure your flexibility.


      ### Access, challenge and transfer


      Analyze the case entirely through text or tactile labeled cards. A consented helper can arrange
      an already suitable work surface; assistance is part of the setup, not evidence against capability.
      Keep seated access, mobility aids and occupational/rehabilitation supports. If the ordinary task
      is not suitable, choose a familiar safe equivalent under the existing plan or produce a consultation
      brief only. Consultation preparation does not establish movement performed.


      Harder case: B stays 25 cm away, but the usual chair support is removed and a heavier cup is introduced.
      A successful placement would not isolate the effect of shelf position, and known support conditions
      have been violated. Restore supports and an appropriate object rather than claiming that the person
      should adapt through effort.


      At a later ordinary live opportunity, choose one already safe useful task, preserve support and
      compare a closer/easier arrangement only when both are appropriate. Retain the better arrangement
      on another ordinary occasion; never deliberately induce fatigue to test it. If training is needed,
      an appropriately qualified plan should specify the relevant capacity, technique, dose and review
      rather than withholding access aids. Longer-term range or tolerance evidence needs a suitable comparable
      measure; two cup placements do not provide it. Actual movement, self-review, a helper''s report
      and qualified observation are separate evidence.


      **Supportive:** Controlled task access remains useful on another occasion with supports and tolerable
      aftermath.


      **Mixed:** Access improves but grip fatigue or another limitation remains unresolved.


      **Contradictory:** Range is forced, support removed or pain ignored to claim a larger movement.


      **Inconclusive:** Only shelf dimensions are known, or control and aftermath were not observed.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A shelf moves from 40 to 28 cm away and remains at the same height. The person uses the
      same supports and reports easier access. Calculate the task change. Does this establish a 12 cm
      increase in joint range?

      2. A reviewer compares a supported reach with an unsupported reach using a heavier object. The second
      placement succeeds, but grip aftermath is unrecorded. Identify the changed conditions, unknown and
      evidence claim that must remain withheld.

      3. The usual task now causes pain or instability. Must the person perform it again before using
      a closer arrangement or asking for assessment? Explain how to keep access without creating a diagnostic
      or training claim.


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Horizontal demand decreased by 12 cm; height is unchanged. That is an environmental change,
      not a measured change in the person''s joint range. Retain the limited claim of easier task access
      under the stated conditions.

      2. Support and object load changed, so the comparison cannot isolate the arrangement. Aftermath
      is unknown. Withhold both “same conditions” and “improved tolerance.” Restore appropriate supports
      and known task conditions; one placement does not authorize heavier or unsupported progression.

      3. No. Do not repeat a now-unsafe task to create a baseline. Stop and use appropriate assessment/support.
      A familiar suitable adaptation may preserve access within existing advice; preparation or assistance
      is honest when movement is inappropriate. Do not diagnose the cause or force range from this vignette.


      These keys assess task reasoning, not joint health, balance or clinical competence.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
