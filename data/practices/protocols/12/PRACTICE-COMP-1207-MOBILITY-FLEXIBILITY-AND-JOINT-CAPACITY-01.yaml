  - stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01-A2
    sequence: 2
    title: Compare ordinary access with one safer arrangement
    instructions: 'During a normal opportunity, complete the task once in its usual safe arrangement and
      once with the shelf or object closer, if both are appropriate. Move slowly enough to retain control,
      keep supports and stop with pain, dizziness or instability. Record whether the adaptation changes
      compensation, reach effort or balance demand. Do not stretch further, bounce, force a joint or test
      a fall response.


      Observation checks: Two safe arrangements or a reason for deferral are recorded; Movement remains
      controlled with necessary supports; Pain dizziness or instability stops the attempt; The comparison
      concerns usable access rather than maximal range. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01
      action_stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01-A2
      competency_stable_id: '12.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1207_a2_primary
      transfer_disposition: context_bound
      measurements:
