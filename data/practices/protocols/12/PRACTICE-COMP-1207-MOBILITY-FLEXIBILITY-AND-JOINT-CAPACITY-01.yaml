  - stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01-A3
    sequence: 3
    title: Retain the useful arrangement and identify any training need
    instructions: 'Use the better arrangement on a second ordinary occasion and check whether it still
      works when mildly tired but not unsafe. Decide whether environmental redesign solves the task or
      whether a qualified plan is needed for range, strength, balance or tissue tolerance. Keep the task
      accessible while that plan is developed; do not withhold adaptations to force independence.


      Observation checks: The selected arrangement is checked on another ordinary occasion; Repeatability
      and tolerance are reviewed together; Environmental and training needs are distinguished; Access
      supports remain available while any limitation is assessed. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which part of the limitation changed with better access, and which part still needs
      assessment rather than more force?


      Examples: Supportive: A lower shelf allowed controlled cup placement without leaning, and the arrangement
      remained useful the next day.


      Mixed: Reach improved, but grip fatigue still limited the task and required a different aid or qualified
      review.


      Contradictory: The person forced a painful end range or removed support to obtain a larger movement.


      Inconclusive: A flexibility number was recorded without relating it to an everyday task or usable
      control.'
    expected_time: 15-25 minutes
    due_within_days: 10
