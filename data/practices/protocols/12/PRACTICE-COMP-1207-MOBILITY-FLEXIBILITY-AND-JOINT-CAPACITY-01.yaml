meaning_and_fit:
  purpose: Relate usable range, control, stability and tolerance to an actual daily task, then test a
    safe adaptation instead of chasing a maximal stretch.
  why_recommended: Relate usable range, control, stability and tolerance to an actual daily task, then
    test a safe adaptation instead of chasing a maximal stretch.
  claims:
  - statement: Relate usable range, control, stability and tolerance to an actual daily task, then test
      a safe adaptation instead of chasing a maximal stretch.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Mobility, flexibility, and joint capacity practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Mobility, flexibility, and joint capacity as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use seated reach, assistive equipment, a support person or a different familiar
    task. A clinician-prescribed mobility exercise may replace the task only within its existing limits.
    No unsupported balance drill, floor transfer or end-range stretching is required.
  opportunity_considerations: 'Default task: place a light, unbreakable cup on a shelf already reachable
    without strain. Use the usual stable stance or seated position and necessary support. Compare the
    current shelf with a slightly lower or closer position, not a more extreme reach. The target is controlled
    usable access, not a flexibility score.'
  prerequisites:
  - 'Default task: place a light, unbreakable cup on a shelf already reachable without strain. Use the
    usual stable stance or seated position and necessary support. Compare the current shelf with a slightly
    lower or closer position, not a more extreme reach. The target is controlled usable access, not a
    flexibility score.'
  dependencies: []
  safe_alternatives:
  - Use seated reach, assistive equipment, a support person or a different familiar task. A clinician-prescribed
    mobility exercise may replace the task only within its existing limits. No unsupported balance drill,
    floor transfer or end-range stretching is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Mobility, flexibility, and joint capacity differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Mobility, flexibility, and
    joint capacity as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default task: place a light, unbreakable cup on a shelf already reachable without strain. Use
    the usual stable stance or seated position and necessary support. Compare the current shelf with a
    slightly lower or closer position, not a more extreme reach. The target is controlled usable access,
    not a flexibility score. Goal: Relate usable range, control, stability and tolerance to an actual
    daily task, then test a safe adaptation instead of chasing a maximal stretch. Scope: This is a task-specific
    movement observation, not a joint examination or treatment for pain, instability or injury. New limitations
    and concerning symptoms require qualified assessment. Time and effort: Ten minutes to define the task
    and two five-minute observations during ordinary activity. Adaptation: Use seated reach, assistive
    equipment, a support person or a different familiar task. A clinician-prescribed mobility exercise
    may replace the task only within its existing limits. No unsupported balance drill, floor transfer
    or end-range stretching is required. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use seated reach, assistive equipment, a support person or a different familiar
    task. A clinician-prescribed mobility exercise may replace the task only within its existing limits.
    No unsupported balance drill, floor transfer or end-range stretching is required.
  expected_burden: Ten minutes to define the task and two five-minute observations during ordinary activity.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Mobility, flexibility, and joint capacity protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Mobility, flexibility, and joint capacity action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use seated
    reach, assistive equipment, a support person or a different familiar task. A clinician-prescribed
    mobility exercise may replace the task only within its existing limits. No unsupported balance drill,
    floor transfer or end-range stretching is required.
  actions:
  - stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01-A1
    sequence: 1
    title: Describe the required movement and its current limit
    instructions: 'Identify the task’s reach, bend or turn, the support used and what counts as controlled
      completion. Note whether the limit appears to be distance, balance, grip, fatigue, pain or an unknown
      factor; these are observations, not diagnoses. Choose a pain-free familiar range and a light object.
      If the task is already unsafe, plan an environmental adaptation or professional consultation before
      attempting it.


      Observation checks: The actual daily task and required range are specified; Support control and
      tolerance are observed separately; The apparent limit is not treated as a diagnosis; Only a familiar
      safe range and light object are selected. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01
      action_stable_id: PRACTICE-COMP-1207-MOBILITY-FLEXIBILITY-AND-JOINT-CAPACITY-01-A1
      competency_stable_id: '12.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1207_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1207_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_actual_daily_task_and_required_range_are_specified
        - support_control_and_tolerance_are_observed_separately
        - the_apparent_limit_is_not_treated_as_a_diagnosis
        - only_a_familiar_safe_range_and_light_object_are_selected
      - measurement_id: c1207_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1207_a1_adverse
        kind: boolean
