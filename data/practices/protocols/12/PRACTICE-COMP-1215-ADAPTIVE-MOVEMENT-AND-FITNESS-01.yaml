meaning_and_fit:
  purpose: Modify mode, environment, support, duration and progression for changing capacity while preserving
    a personally meaningful movement or participation goal.
  why_recommended: Modify mode, environment, support, duration and progression for changing capacity while
    preserving a personally meaningful movement or participation goal.
  claims:
  - statement: Modify mode, environment, support, duration and progression for changing capacity while
      preserving a personally meaningful movement or participation goal.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Adaptive movement and fitness practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Adaptive movement and fitness as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a fictional planning case when physical participation is currently unsuitable.
    For post-exertional worsening, acute injury, pregnancy complications or other medical uncertainty,
    use the relevant professional plan and do not test limits. Assistance and adaptive equipment are not
    penalties.
  opportunity_considerations: 'Default goal: join a friend for a brief outdoor conversation when a long
    walking route is unsuitable. Candidate adaptations are a shorter accessible path, a seated meeting,
    wheeling, transport to a bench or a clinician-approved movement interval. Use an existing safe plan
    and ask the participant what part of the activity matters; do not assume walking itself is the only
    valued outcome.'
  prerequisites:
  - 'Default goal: join a friend for a brief outdoor conversation when a long walking route is unsuitable.
    Candidate adaptations are a shorter accessible path, a seated meeting, wheeling, transport to a bench
    or a clinician-approved movement interval. Use an existing safe plan and ask the participant what
    part of the activity matters; do not assume walking itself is the only valued outcome.'
  dependencies: []
  safe_alternatives:
  - Use a fictional planning case when physical participation is currently unsuitable. For post-exertional
    worsening, acute injury, pregnancy complications or other medical uncertainty, use the relevant professional
    plan and do not test limits. Assistance and adaptive equipment are not penalties.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Adaptive movement and fitness differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Adaptive movement and fitness
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default goal: join a friend for a brief outdoor conversation when a long walking route is unsuitable.
    Candidate adaptations are a shorter accessible path, a seated meeting, wheeling, transport to a bench
    or a clinician-approved movement interval. Use an existing safe plan and ask the participant what
    part of the activity matters; do not assume walking itself is the only valued outcome. Goal: Modify
    mode, environment, support, duration and progression for changing capacity while preserving a personally
    meaningful movement or participation goal. Scope: This is an adaptation process, not a condition-specific
    exercise prescription. Disability, chronic illness, pregnancy, aging and injury may require different
    qualified guidance; they are not interchangeable limitations. Time and effort: Twenty minutes to prepare,
    one appropriate movement opportunity and a short follow-up after recovery. Adaptation: Use a fictional
    planning case when physical participation is currently unsuitable. For post-exertional worsening,
    acute injury, pregnancy complications or other medical uncertainty, use the relevant professional
    plan and do not test limits. Assistance and adaptive equipment are not penalties. Keep personal working
    notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional planning case when physical participation is currently unsuitable.
    For post-exertional worsening, acute injury, pregnancy complications or other medical uncertainty,
    use the relevant professional plan and do not test limits. Assistance and adaptive equipment are not
    penalties.
  expected_burden: Twenty minutes to prepare, one appropriate movement opportunity and a short follow-up
    after recovery.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Adaptive movement and fitness protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Adaptive movement and fitness action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    planning case when physical participation is currently unsuitable. For post-exertional worsening,
    acute injury, pregnancy complications or other medical uncertainty, use the relevant professional
    plan and do not test limits. Assistance and adaptive equipment are not penalties.
  actions:
  - stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01-A1
    sequence: 1
    title: Separate the meaningful aim from an unnecessary physical format
    instructions: 'State the aim in the participant’s own terms and list the actual constraints: symptoms,
      energy variability, mobility, pregnancy-related guidance, recovery, weather, equipment or access.
      Give each relevant constraint a current-information or advice-needed status. Choose what must stay,
      such as companionship or a familiar movement dose, and what can change. Do not infer a person’s
      limits from a diagnosis or visible disability alone.


      Observation checks: The meaningful aim is chosen by the participant; Relevant constraints are specific
      rather than diagnosis-based assumptions; Unknown medical or progression questions are marked for
      qualified advice; Essential aims are separated from changeable activity format. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01
      action_stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01-A1
      competency_stable_id: '12.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1215_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1215_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_meaningful_aim_is_chosen_by_the_participant
        - relevant_constraints_are_specific_rather_than_diagnosis_based_assumptions
        - unknown_medical_or_progression_questions_are_marked_for_qualified_advice
        - essential_aims_are_separated_from_changeable_activity_format
      - measurement_id: c1215_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1215_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
