  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Adaptive movement and fitness; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a fictional planning case when physical participation is currently unsuitable. For post-exertional
      worsening, acute injury, pregnancy complications or other medical uncertainty, use the relevant
      professional plan and do not test limits. Assistance and adaptive equipment are not penalties.
    cultural_context:
    - Adapt the expression of Adaptive movement and fitness to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use a fictional planning case when physical participation is currently unsuitable. For post-exertional
      worsening, acute injury, pregnancy complications or other medical uncertainty, use the relevant
      professional plan and do not test limits. Assistance and adaptive equipment are not penalties.
  pause_conditions:
  - Pause Adaptive movement and fitness when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Adaptive movement and fitness practice for harm, coercion, retaliation risk, emergency conditions,
    unsafe exposure, worsening symptoms, protected information, legal or policy conflict, or pressure
    to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Adaptive movement and fitness situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Health and exercise content must be adapted to the person and does not replace licensed medical care.
