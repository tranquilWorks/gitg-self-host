  - id: file-later-packet-md
    title: Later packet
    body: 'Open after saving the initial adaptation card. These are separate dates, not alternative facts
      about one session.


      | Date | Recorded event | Later observation / care status |

      | --- | --- | --- |

      | Monday | Setup and both three-minute bouts completed with Lee, the specified rest and usual supports
      | Ordinary function unchanged that evening and next morning; no progression decision issued |

      | Wednesday | Lee unavailable; session deferred before movement | Zero bouts; an alternate helper
      was requested but not confirmed |

      | Friday | Lee present; first three-minute bout completed; a new symptom occurred and Morgan stopped
      before the second | Message to care team sent; response and next-morning function not yet recorded
      |


      Retain Friday''s unresolved symptom and review. Do not infer its diagnosis, severity or clearance
      from the number of minutes. There are no emergency symptoms supplied in this case; if a real emergency
      occurs, use urgent local care rather than these records. No later contact or clinical decision may
      be invented.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Keep the purpose; change the fit


      Adaptation changes how a person participates so movement fits their capacity, environment and chosen
      purpose. It is not necessarily an easier version of somebody else''s activity. A familiar seated
      sequence, assistance, equipment, shorter bouts or a different location may preserve the intended
      benefit; replacing all movement with paperwork does not demonstrate physical participation. Equally,
      cancelling an unsuitable session is not a character failure.


      This guide teaches how to carry an existing individualized plan into a changing setting. The default
      is a fictional planning and review exercise, requiring paper or an accessible notes tool, about
      30 minutes, and no physical performance. Do not adopt the case''s minutes as your own exercise prescription.
      Health and exercise content must be adapted to the person and does not replace licensed medical
      care. No diagnosis, pregnancy status or disability disclosure is required.


      ### What can change, and what must be checked


      Separate **purpose** (what participation matters), **task** (the actual movement), **load** (duration,
      intensity, repetitions and frequency), and **conditions** (equipment, assistance, transport, temperature
      and recovery). Shorter duration alone does not make an unfamiliar task suitable. A helper can change
      physical demand as well as access. Write down which variable changed before comparing outcomes.


      For disability or chronic illness, useful activity and progression depend on the person. The [CDC
      guidance](https://www.cdc.gov/physical-activity-basics/guidelines/chronic-health-conditions-and-disabilities.html)
      supports appropriate activity and discussion of type and amount with a qualified professional. It
      does not authorize a universal increase after a successful attempt. If an established plan calls
      for pacing, rest or symptom-contingent limits, retain them. Delayed effects matter; finishing a
      session does not settle its fit.


      Pregnancy and postpartum changes require their own care discussion; [CDC''s pregnancy guidance](https://www.cdc.gov/physical-activity-basics/guidelines/healthy-pregnant-or-postpartum-women.html)
      advises consulting the responsible clinician about adjustments. An older age alone does not define
      capacity. An injury may change a formerly familiar activity''s suitability. For an unfamiliar restriction
      or changed symptoms, the useful next step is a precise question and an access plan, not an improvised
      movement test.


      ### Worked example: a location change is still a change


      An established plan permits a familiar supported seated movement at a quiet indoor venue. Moving
      it outside adds heat and an uneven approach. Calling the task “the same three minutes” hides those
      changes. A useful adaptation first checks the approach, temperature, seating and assistance. If
      they cannot be confirmed, the original indoor option or deferral remains available. This reasoning
      establishes planning fit, not medical clearance or actual tolerance.


      ### Complete case: Morgan''s studio session


      Morgan wants to continue a familiar movement-to-music activity with their community group. The following
      is a **stipulated fictional plan**, already agreed with Morgan''s qualified practitioner. It is
      case data only:


      | Requirement | Supplied current status |

      | --- | --- |

      | Activity | The familiar seated sequence already taught to Morgan; no new movements |

      | Amount | Two three-minute bouts, a two-minute seated rest between; no increase before review |

      | Support | Usual seat and existing positioning aids; helper Lee present throughout |

      | Setting | Quiet, cool indoor studio; accessible route confirmed open |

      | Stop/review | Stop for new or changed symptoms; contact the existing care team; do not make up
      missed bouts |

      | Follow-up | Record ordinary function later that day and next morning for the plan review |

      | Transport | Arrival 09:00; pickup 09:20; same confirmed support for both journeys |

      | Other session tasks | Four minutes setup; three minutes closing and preparing for pickup |


      These facts are sufficient to make a paper plan. They do not teach a bodily sequence and therefore
      cannot be used as instructions to perform one.


      #### Action 1 — Build an adaptation card


      Write `purpose | existing plan | task/load | required assistance | environment | transport | stop/help
      | later review`. Fill every field from the case. Arrange setup, first bout, rest, second bout and
      closing inside the transport window. Label active minutes, other session minutes and spare time
      separately. Do not count travel or waiting as performed exercise.


      Draft this clarification request with the actual missing detail filled in when needed: “My purpose
      is __. My current plan is __. The changed condition is __. Which existing option remains appropriate,
      what should stop the activity, and what later effects should prompt review?” An unanswered request
      is not permission to progress.


      #### Action 2 — Rehearse the pre-session decision


      Check all requirements, including the return journey, before classifying the session as planned.
      Use **confirmed**, **missing**, **changed** or **unknown**, rather than a single ready/not-ready
      feeling. Say what you would do if Lee were absent. Retain Morgan''s choice to decline even when
      the conditions fit. Save the plan before opening [the later packet](?resource=file-later-packet-md).


      #### Action 3 — Reconcile attempts and changes


      For each later record, enter `date | conditions actually present | bouts actually performed | change/stop
      | later function | contact sent/answered | next decision`. Count actual bouts only. Preserve an
      incomplete next-morning report as unknown. Explain why completing an earlier session cannot authorize
      a longer next session.


      Then complete these alternative planning cards. They ask for useful preparation, not generic referral:


      | Changed context | Supplied facts | Produce this concrete next step |

      | --- | --- | --- |

      | Pregnancy | Familiar activity; clinician has not yet discussed the new pregnancy | A concise request
      naming the activity, current load, pregnancy change and questions about adjustment/stop signs; no
      case-dose adoption |

      | Aging | Familiar plan still fits; transport now requires an extra transfer | Map who provides
      each transfer and where the person rests; confirm those supports before scheduling |

      | Injury | Existing guidance excludes one movement used in the familiar sequence | Mark that movement
      unavailable and ask the practitioner for an appropriate substitute; do not simply reduce its repetitions
      |

      | Variable capacity | Person''s own plan requires pacing and records next-day effects | Preserve
      its limit and later observations; no automatic catch-up or calendar-based increase |


      Attempt [the fresh checks](?attempt=practice-checks) before [the answers](?check=practice-answers).
      A complete source exercise contains the adaptation card, feasible schedule, contingency, reconciled
      later records and four context cards.


      ### Supported, harder and later routes


      Use dictated notes, a supporter reading one card at a time, or a large-print schedule. Keep aids
      and assistance; “independent” does not mean removing them. If no current plan exists, finish the
      fictional exercise and prepare the named-purpose request above. That is preparation, not exercise
      performed.


      For a harder paper case, arrival changes to 09:07 while pickup stays 09:20. Preserve the existing
      activity and support limits. Identify the shortfall and request a revised transport slot or another
      already-agreed option; do not compress rest or invent a higher-intensity substitute.


      At a later real opportunity, use your own familiar, appropriate plan and change only what it permits.
      Verify one access condition, record actual participation and subsequent effects, and bring a concrete
      question to the existing review. If changed symptoms or uncertainty make that unsuitable, use the
      care/support route. This extends 12.14''s long-term participation planning into present adaptation;
      it does not replace qualified movement instruction.


      **Supportive:** The chosen purpose remains possible with verified assistance and actual follow-up
      inside the person''s plan.


      **Mixed:** Access works, but later function changes; the record prompts review rather than progression.


      **Contradictory:** Assistance or rest is removed to make the session look more capable, or missed
      movement is made up against the plan.


      **Inconclusive:** A complete schedule exists, but no participation or later response has been observed.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Use the guide''s concepts, without copying Morgan''s schedule. Explain each decision before
      opening [the corrective key](?check=practice-answers).


      1. A fictional established plan has two four-minute bouts with three minutes rest, five minutes
      setup and two minutes closing. Confirmed arrival is 10:00 and pickup is 10:17. Does the complete
      session fit? What must be resolved without silently changing the plan?

      2. An adult uses their usual movement aid. A new instructor offers the same activity without the
      aid to “prove independence”; the person''s plan requires it. The adult wants to participate. Write
      a response and a workable next action that preserves the activity''s purpose.

      3. Two sessions were planned. One was completed within the person''s plan; the second was cancelled
      because its required support was unavailable. The first session''s next-day response is missing.
      A report claims two successful sessions and readiness to increase duration. Correct the report and
      identify the next evidence needed.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Required time is 5 + 4 + 3 + 4 + 2 = **18 minutes**. The confirmed window is **17 minutes**,
      one minute short. Resolve transport or an already-authorized alternative before treating it as feasible.
      Cutting the rest to two minutes produces a neat timetable by violating the supplied plan. An unanswered
      transport request remains unresolved.

      2. Retain the aid: “This is part of my current plan. I want to take part using it.” Check that the
      instructor and setting can support that route, or use another suitable agreed setting. Removing
      it despite the requirement is not progression; cancelling without considering an accessible route
      also fails to demonstrate adaptation. Participation still depends on the adult''s choice.

      3. Record **one completed session, one deferred opportunity**, and unknown next-day response. Obtain
      that observation and any required plan review before claiming suitability of a change. Missing data
      are not an adverse finding by themselves, but cannot become reassuring evidence. The schedule is
      not evidence of the second session occurring.


      The default case takes 15 minutes (4 + 3 + 2 + 3 + 3), leaving 5 minutes before pickup. Across the
      later dates there are 3 performed bouts and 9 active minutes, one deferral, and an unresolved Friday
      review. The harder 13-minute transport window is 2 minutes short. These are paper-case results,
      not clinical thresholds or physical outcomes of a learner.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
