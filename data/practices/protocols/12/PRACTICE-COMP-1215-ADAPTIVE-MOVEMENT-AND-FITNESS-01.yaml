        expected: true
  - stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01-A2
    sequence: 2
    title: Arrange and try the individualized version
    instructions: 'Confirm the route, equipment, assistance and exit plan before the opportunity. Use
      only the familiar or qualified-approved dose, with an option to rest, shorten or stop without social
      penalty. For the default, meet at the accessible bench and use the existing tolerated movement interval
      only if appropriate that day. Record the adaptation actually used and whether it preserved the intended
      meaning.


      Observation checks: Access equipment assistance and exit arrangements are confirmed; The dose follows
      current ability or an existing qualified plan; Rest shortening and stopping remain real options;
      The adaptation is tested against the participant’s intended aim. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01
      action_stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01-A2
      competency_stable_id: '12.15'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1215_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1215_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - access_equipment_assistance_and_exit_arrangements_are_confirmed
        - the_dose_follows_current_ability_or_an_existing_qualified_plan
        - rest_shortening_and_stopping_remain_real_options
        - the_adaptation_is_tested_against_the_participant_s_intended_aim
      - measurement_id: c1215_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
