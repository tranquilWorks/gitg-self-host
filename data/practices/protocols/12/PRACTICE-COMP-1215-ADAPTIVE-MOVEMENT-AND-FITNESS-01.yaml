        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01-A3
    sequence: 3
    title: Review immediate and delayed fit before changing the dose
    instructions: 'Check comfort, participation and recovery at the appropriate later point, including
      delayed symptom effects. Retain the version, reduce it or seek individualized guidance; do not automatically
      increase duration because one attempt succeeded. Record one change that would make the next opportunity
      more accessible. If the meaningful aim was met through a seated or assisted version, preserve that
      success without pretending the same physical demand was performed.


      Observation checks: Immediate and delayed effects are both considered; Progression is individualized
      rather than automatic; One next access improvement is identified; Meaningful participation and physical
      dose are reported separately. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.


      Final review: Did the adaptation preserve what mattered while fitting the person’s actual capacity
      before, during and after the activity?


      Examples: Supportive: A bench-based visit preserved companionship and the short approved movement
      interval did not create an unacceptable recovery cost.


      Mixed: The outing felt manageable at the time, but delayed symptoms required a lower dose and clinical
      discussion.


      Contradictory: A generic progression was imposed or aids withheld to make the activity count as
      real exercise.


      Inconclusive: An adaptation was selected from a diagnosis label without asking the person’s goal
      or checking its actual fit.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01
      action_stable_id: PRACTICE-COMP-1215-ADAPTIVE-MOVEMENT-AND-FITNESS-01-A3
