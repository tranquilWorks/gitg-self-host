  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [CDC, BMI Frequently Asked Questions](https://www.cdc.gov/bmi/faq/index.html)

      - [MedlinePlus, How to Understand Your Lab Results](https://www.medlineplus.gov/lab-tests/how-to-understand-your-lab-results/)

      - [NIAMS, Sports Injuries: Diagnosis, Treatment, and Steps to Take](https://www.niams.nih.gov/health-topics/sports-injuries/diagnosis-treatment-and-steps-to-take)

      - [NIAAA, Harmful Interactions](https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/harmful-interactions-mixing-alcohol-with-medicines)

      - [NIAAA, Alcohol Use Disorder: From Risk to Diagnosis to Recovery](https://www.niaaa.nih.gov/health-professionals-communities/core-resource-on-alcohol/alcohol-use-disorder-risk-diagnosis-recovery)

      - [FDA, Benzodiazepine Boxed Warning update](https://www.fda.gov/drugs/drug-safety-and-availability/fda-requiring-boxed-warning-updated-improve-safe-use-benzodiazepine-drug-class)

      - [FDA, Nicotine Is Why Tobacco Products Are Addictive](https://www.fda.gov/tobacco-products/health-effects-tobacco-use/nicotine-why-tobacco-products-are-addictive)

      - [NIDA, Anabolic Steroids and Other Appearance and Performance Enhancing Drugs](https://nida.nih.gov/research-topics/anabolic-steroids)

      - [NHS, Consent to treatment](https://www.nhs.uk/tests-and-treatments/consent-to-treatment/)

      - [CDC, About Handwashing](https://www.cdc.gov/clean-hands/about/index.html)

      - [NIAMS, Exercise for Your Bone Health](https://www.niams.nih.gov/health-topics/exercise-your-bone-health)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after preserving the immediate plan. These are independent simulated branches.


      ### Branch A: the plan occurs


      Remy declines the alcohol. C arrives at 20:50, accommodates the usual aid and drives Remy home;
      arrival is confirmed at 21:00. Remy did not drive. No pharmacist response is yet supplied. The 10-minute
      journey and 10-minute margin before the venue''s 21:00 closing fit the original plan. Record an
      actual simulated journey, not a medication review or treatment outcome.


      ### Branch B: confirmation changes


      At 20:40 C reports a delay: earliest pickup is now 21:10. Remy still declines alcohol and does not
      drive. The host''s existing waiting agreement ends at 21:00. No extension, alternative transport
      or new waiting location is confirmed. The pickup is 10 minutes after the existing waiting boundary;
      a future arrival home at 21:20 would not fix the gap.


      Write the next message asking the host/trusted support to arrange a suitable agreed waiting or travel
      option now. Keep transport unresolved until a feasible option is actually confirmed. Do not use
      A, invent funds for B, wait outside without assessing suitability, or resume driving to make the
      plan appear closed. No emergency is supplied here; a real medical emergency would instead require
      immediate emergency help.


      In both branches, a sent pharmacist question would establish a request only. No answer or treatment
      is invented. In branch B, maintaining a substance/driving boundary is supportive while the practical
      journey remains incomplete.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Resolve the actual risk without experimenting on yourself


      A useful substance decision identifies the product, possible interactions, current impairment, activity
      demands and whether outside help is needed. “Legal,” “natural,” “prescribed” and “everyone uses
      it” are not interchangeable safety conclusions. Neither fear nor reassurance substitutes for the
      specific facts.


      This source companion teaches risk literacy across alcohol, nicotine, recreational substances, performance
      drugs and medications. Allow 15 minutes for the five-part case review, 10 for the transport/update
      decision and 10 for checks. Use the complete fictional packet, paper or dictation. No substance
      purchase, use, withdrawal experiment, live contact or private substance history is required. Health
      and exercise content must be adapted to the person and does not replace licensed medical care. This
      is not dosing, detoxification, treatment or performance-enhancement instruction.


      ### Five questions, different risks


      Ask: what is the actual substance and label; what other medicines or substances matter; what activity
      requires alertness; is control, harm or withdrawal a concern; and which qualified or emergency route
      is appropriate? Apply the questions to each category without assuming all effects are identical.


      | Category | Useful distinction | What this exercise cannot conclude |

      | --- | --- | --- |

      | Alcohol | Impairment, interactions and a pattern of dependence are different questions | No amount
      or waiting time is declared safe for driving |

      | Nicotine | Dependence and product-related harms matter even without obvious intoxication | No
      product is called harmless or prescribed as a personal cessation treatment |

      | Recreational substances | Ingredient, strength, impairment and interaction information may be
      uncertain | A familiar seller, name or peer report does not establish contents or safety |

      | Performance drugs | An appearance/performance goal does not establish medical indication or safe
      use | No cycle, dose, combination or sourcing advice |

      | Prescription/nonprescription medicines | Appropriate treatment can coexist with impairment, interactions
      or dependence risk | A label warning is not permission to stop treatment abruptly or share a prescription
      |


      NIAAA explains [alcohol–medicine interaction risks](https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/harmful-interactions-mixing-alcohol-with-medicines);
      check the actual label and pharmacist/prescriber rather than a guessed safe interval. FDA explains
      [nicotine dependence and differing product risks](https://www.fda.gov/tobacco-products/health-effects-tobacco-use/nicotine-why-tobacco-products-are-addictive).
      NIDA describes [risks of anabolic steroid misuse](https://nida.nih.gov/research-topics/anabolic-steroids).
      These references support category distinctions, not an individual regimen or moral ranking.


      Possible alcohol or sedative dependence needs medical support before a sudden reduction or stop;
      severe withdrawal can be dangerous. See [NIAAA''s withdrawal boundary](https://www.niaaa.nih.gov/health-professionals-communities/core-resource-on-alcohol/alcohol-use-disorder-risk-diagnosis-recovery)
      and [FDA''s benzodiazepine warning](https://www.fda.gov/drugs/drug-safety-and-availability/fda-requiring-boxed-warning-updated-improve-safe-use-benzodiazepine-drug-class).
      This does not mean continue unsafe use without help: obtain timely appropriate medical advice, and
      use emergency services for suspected overdose, severe withdrawal or immediate danger. Do not wait
      for a worksheet, routine appointment or transport plan in an emergency.


      ### Worked example: the ingredient is missing


      Quinn is offered a product called “natural focus.” No ingredient list is available. They also take
      a medicine whose interaction information they do not know. The useful record is “contents and interaction
      unknown,” not “safe because natural” or “all products are equally dangerous.” Quinn does not try
      it for evidence; they can decline and ask a pharmacist a specific question if there is a real treatment/product
      concern. A refusal rehearsal is not actual use or treatment.


      ### Complete materials: Remy''s journey home


      At 20:30, Remy is at a low-stakes social meeting. Remy''s fictional prescribed product M has an
      existing label warning about drowsiness, alcohol and driving; the exercise supplies no dose or medicine
      identity. Remy is currently drowsy after taking it as prescribed and has not consumed alcohol. No
      overdose or acute emergency sign is supplied. A friend offers alcohol and says coffee will make
      driving fine. A pharmacist question about the actual product is unresolved. No medication change
      is authorized.


      Remy can decline the offered alcohol and avoid driving while arranging suitable help. The host has
      already agreed Remy can wait safely inside with support until 21:00. Remy has zero transport money
      available tonight. The following are the only currently supplied options:


      | Option | Driver / mode | Confirmation and timing | Cost and access |

      | --- | --- | --- | --- |

      | A | Friend driving | Friend reports drinking; offers 20:40 pickup | No fare; unsuitable impairment
      concern |

      | B | Paid ride | No booking or pickup confirmation | 12 units; funds unavailable |

      | C | Trusted sober, alert friend | Explicitly confirmed 20:50 pickup at accessible door; 10-minute
      journey | No fare; usual aid accommodated; no solo walk required |


      These facts make C feasible as a plan, not a completed journey. Safe waiting beyond 21:00 has not
      been agreed. A support person can help contact the service or arrange alternatives with Remy''s
      consent; no public disclosure of medicine or use history is needed.


      #### Action 1 — Separate the immediate decision from the unresolved question


      Complete the five-question record. Distinguish Remy''s current drowsiness, the offered alcohol,
      a possible interaction and the driving decision. Do not use “no alcohol consumed” as proof that
      Remy can drive. Record dependence history as not supplied, not automatically absent; this fictional
      case does not require a detoxification decision.


      #### Action 2 — Make the safe immediate plan concrete


      Draft a short decline and transport message: “I am not driving tonight. I will use the confirmed
      pickup and wait inside.” You need not share a medicine name. Calculate C''s arrival home and the
      waiting margin before closing. Explain separately why A and B fail the current constraints. State
      the fallback trigger: if pickup becomes uncertain or later than safe waiting, contact the host/trusted
      support immediately to arrange an explicitly agreed safe option; do not infer an extension or substitute
      impaired driving.


      Draft the pharmacist/prescriber question privately: what does the actual product''s warning mean
      for current activities and relevant interactions, and what instructions should be followed? Do not
      stop or change prescribed treatment from a worksheet. Save the plan before [later-packet.md](?resource=file-later-packet-md).


      #### Action 3 — Use the update and preserve help status


      Apply both later branches separately. Track `decline/rehearsal | transport planned | pickup occurred
      | arrived | qualified question sent | reply received | treatment completed`. Only supplied events
      can advance a status. A sober ride does not resolve dependence or medication questions, and a booked
      consultation is not treatment completed. If actual use is becoming unsafe, compulsive or difficult
      to control, use an appropriate confidential qualified service; support is not contingent on a moral
      judgment.


      Attempt [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). The
      default completes a risk record, refusal/transport rehearsal, update and help plan. It does not
      establish actual contact, altered-state experience or a changed real-world choice.


      ### Access, challenge and transfer


      Abstainers can complete the packet without exposure. Use text, an interpreter or a consented support
      person; keep sensitive details private. A help route that is inaccessible remains unresolved until
      an alternative is actually identified, not until a website is bookmarked.


      Harder variation: a different person reports possible dependence and asks for a weekend self-detox
      schedule. Identify timely medical support as the next step; supply no taper or abrupt-stop plan.
      Severe symptoms or suspected overdose use emergency help. The five categories do not require identical
      management.


      Later real transfer may be one appropriate pharmacist question, support contact, transport arrangement
      or low-pressure refusal. Record what actually occurs and what remains pending; never initiate use
      or provoke withdrawal to generate evidence. Qualified assessment, actual behavior, self-review and
      this author-provided simulation remain distinct.


      **Supportive:** Specific uncertainty reaches the appropriate professional and a feasible safe immediate
      choice actually occurs.


      **Mixed:** The boundary holds but a cancelled ride or inaccessible service leaves further support
      work.


      **Contradictory:** Impairment is ignored, unknown products are tested or possible dependence is
      met with unsupervised abrupt cessation.


      **Inconclusive:** General facts or a draft are recorded without resolving the actual decision or
      help access.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A person is drowsy from a medicine and has consumed no alcohol. A friend says this proves
      they can drive and suggests coffee. What immediate choice and qualified question are appropriate?
      Do not change the prescription.

      2. A confirmed pickup moves from 19:40 to 20:10; the agreed safe indoor waiting ends at 20:00. A
      15-minute journey is expected. Calculate the gap and explain why a predicted home arrival is not
      a completed or feasible waiting plan.

      3. A person reports possible alcohol or sedative dependence and wants to stop suddenly without medical
      help. Another product has no readable ingredient list. State the two distinct uncertainty/help responses
      without a dosing or detoxification schedule.


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Do not drive while drowsy; arrange appropriate safe support/transport. Absence of alcohol
      does not erase medicine-related impairment, and coffee does not establish driving fitness. Ask the
      pharmacist/prescriber about the actual product and activity/interaction instructions; do not independently
      change treatment.

      2. Pickup is 10 minutes after safe waiting ends; predicted home arrival is 20:25. Seek an explicitly
      agreed suitable waiting extension or alternative journey. Neither a timestamp nor a request creates
      that agreement, pickup or arrival.

      3. Possible dependence needs timely medical support before a sudden reduction or stop; severe withdrawal
      or overdose concerns use emergency care. Unknown ingredients remain unknown: do not test the product,
      assume “natural” means safe or invent interaction clearance. These are different risks requiring
      specific information, not a shared do-it-yourself regimen.


      These checks assess risk reasoning and do not establish clinical competence or actual substance
      behavior.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
