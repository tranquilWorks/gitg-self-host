meaning_and_fit:
  purpose: Evaluate substance use through effects, interactions, impairment, dependence and context, and
    obtain appropriate help when risk or loss of control exceeds self-management.
  why_recommended: Evaluate substance use through effects, interactions, impairment, dependence and context,
    and obtain appropriate help when risk or loss of control exceeds self-management.
  claims:
  - statement: Evaluate substance use through effects, interactions, impairment, dependence and context,
      and obtain appropriate help when risk or loss of control exceeds self-management.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Substances and altered states practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Substances and altered states as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Abstainers can use the fictional interaction case without exposure. Use confidential,
    culturally appropriate or accessible services and a trusted support person with consent. The exercise
    never requires drug purchasing, intoxication, withdrawal testing, sharing medications or recording
    another person’s use.
  opportunity_considerations: 'Default fictional case: someone taking a sedating medicine is invited to
    drink alcohol before driving home. Make a five-part check: substance and actual label, other medicines
    or drugs, activity requiring alertness, pattern of control or withdrawal, and trusted help route.
    Apply the same questions to nicotine, recreational substances, performance drugs and medicines without
    treating all risks as identical.'
  prerequisites:
  - 'Default fictional case: someone taking a sedating medicine is invited to drink alcohol before driving
    home. Make a five-part check: substance and actual label, other medicines or drugs, activity requiring
    alertness, pattern of control or withdrawal, and trusted help route. Apply the same questions to nicotine,
    recreational substances, performance drugs and medicines without treating all risks as identical.'
  dependencies: []
  safe_alternatives:
  - Abstainers can use the fictional interaction case without exposure. Use confidential, culturally appropriate
    or accessible services and a trusted support person with consent. The exercise never requires drug
    purchasing, intoxication, withdrawal testing, sharing medications or recording another person’s use.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Substances and altered states differently while preserving consent, evidence limits, safety, and equal
    dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Substances and altered states
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SAFETY-PREPARATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default fictional case: someone taking a sedating medicine is invited to drink alcohol before
    driving home. Make a five-part check: substance and actual label, other medicines or drugs, activity
    requiring alertness, pattern of control or withdrawal, and trusted help route. Apply the same questions
    to nicotine, recreational substances, performance drugs and medicines without treating all risks as
    identical. Goal: Evaluate substance use through effects, interactions, impairment, dependence and
    context, and obtain appropriate help when risk or loss of control exceeds self-management. Scope:
    This is risk literacy and help-seeking, not instructions for drug use, detoxification, dosing or performance
    enhancement. Do not start a substance for this exercise or abruptly change prescribed treatment. Time
    and effort: Twenty minutes of private review and one pharmacist, clinician or support-service contact
    when a real uncertainty exists. Adaptation: Abstainers can use the fictional interaction case without
    exposure. Use confidential, culturally appropriate or accessible services and a trusted support person
    with consent. The exercise never requires drug purchasing, intoxication, withdrawal testing, sharing
    medications or recording another person’s use. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Abstainers can use the fictional interaction case without exposure. Use confidential,
    culturally appropriate or accessible services and a trusted support person with consent. The exercise
    never requires drug purchasing, intoxication, withdrawal testing, sharing medications or recording
    another person’s use.
  expected_burden: Twenty minutes of private review and one pharmacist, clinician or support-service contact
    when a real uncertainty exists.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Substances and altered states protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Substances and altered states action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Abstainers
    can use the fictional interaction case without exposure. Use confidential, culturally appropriate
    or accessible services and a trusted support person with consent. The exercise never requires drug
    purchasing, intoxication, withdrawal testing, sharing medications or recording another person’s use.
  actions:
  - stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01-A1
    sequence: 1
    title: Identify the specific risk rather than a moral category
    instructions: 'For the default, separate alcohol’s impairment, the medicine’s effects, a possible
      interaction and the driving decision. For other substances, identify the actual ingredient and uncertainty;
      familiar, legal or natural does not establish safety. Privately review whether use is becoming hard
      to control or causing harm. Do not enter substance history or medicine names into public or application
      evidence.


      Observation checks: Substance effects interactions and context are separated; The actual ingredient
      or uncertainty is identified; Control impairment and harm are considered without moral labeling;
      Sensitive use and medicine details remain private. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01
      action_stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01-A1
      competency_stable_id: '12.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1211_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1211_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - substance_effects_interactions_and_context_are_separated
        - the_actual_ingredient_or_uncertainty_is_identified
        - control_impairment_and_harm_are_considered_without_moral_labeling
        - sensitive_use_and_medicine_details_remain_private
      - measurement_id: c1211_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1211_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01-A2
    sequence: 2
    title: Verify the uncertainty and make a safe immediate choice
    instructions: 'Use the product label and ask a pharmacist or clinician about the specific interaction
      or treatment question. In the default, do not drive impaired and do not combine uncertain sedating
      products while waiting for advice. If alcohol or sedative dependence may be present, seek medical
      support before a sudden reduction or stop; withdrawal can be dangerous. Current overdose, severe
      withdrawal or immediate danger requires emergency help, not a scheduled exercise review.


      Observation checks: The specific uncertainty is checked through a qualified source; An immediate
      impairment risk is not taken while awaiting reassurance; Possible dependence is not addressed through
      unsupervised abrupt cessation; Emergency signs or immediate danger take priority over the task.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01
      action_stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01-A2
      competency_stable_id: '12.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1211_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1211_a2_primary
        kind: artifact
