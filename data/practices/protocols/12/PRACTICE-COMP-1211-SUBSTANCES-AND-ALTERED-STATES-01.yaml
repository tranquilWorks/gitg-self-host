        expected: true
  - stable_id: PRACTICE-COMP-1211-SUBSTANCES-AND-ALTERED-STATES-01-A3
    sequence: 3
    title: Put the verified boundary and support route into use
    instructions: 'Carry out one appropriate action: arrange sober transport, ask for a medication review,
      contact treatment support or rehearse declining the fictional offer. Record the boundary, the help
      route and a sign that will trigger using it, without publishing private details. Distinguish rehearsal
      from an actual changed choice and a support appointment from treatment completed. Review whether
      the plan is feasible in the setting where pressure occurs.


      Observation checks: A safe action or explicitly labeled rehearsal occurs; The boundary is based
      on verified information rather than a myth; A feasible support route and trigger are recorded; Changed
      choice help contact and completed treatment are distinguished. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which decision became safer because the specific interaction or control risk was checked,
      and when will outside help be used?


      Examples: Supportive: The person asked a pharmacist about the medicine and arranged transport rather
      than rely on a friend’s reassurance about driving.


      Mixed: A boundary was chosen, but the help service was inaccessible, so an alternative route still
      needed verification.


      Contradictory: Alcohol or sedatives were stopped abruptly despite possible dependence, or a substance
      was tried to gather exercise evidence.


      Inconclusive: General facts about drugs were listed without resolving the actual interaction, impairment
      or help-seeking decision.'
    expected_time: 15-25 minutes
