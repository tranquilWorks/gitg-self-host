  applicability_question: Does a voluntary, bounded Body composition and metabolic health practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Body composition and metabolic health as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the fictional case throughout when body metrics are distressing or medically
    inappropriate. Existing eating-disorder treatment, pregnancy care and condition-specific guidance
    take precedence. A qualified clinician can choose appropriate monitoring without the app storing personal
    values.
  opportunity_considerations: 'Fictional case: an adult’s scale weight is unchanged, carrying groceries
    feels easier, clothing fit changed and blood-pressure results have not been reviewed. Use four columns—measurement,
    what it may show, what it cannot show, and who can interpret it. The aim is to avoid inferring health
    or tissue change from a photograph or one number.'
