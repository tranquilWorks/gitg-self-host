intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Fictional case: an adult’s scale weight is unchanged, carrying groceries feels easier, clothing
    fit changed and blood-pressure results have not been reviewed. Use four columns—measurement, what
    it may show, what it cannot show, and who can interpret it. The aim is to avoid inferring health or
    tissue change from a photograph or one number. Goal: Distinguish body weight, muscle, fat, waist measures,
    function and clinical markers, then choose evidence and a sustainable action that fit an actual health
    goal. Scope: This is interpretation and care planning, not body-composition measurement, metabolic
    diagnosis or a weight-loss prescription. No weigh-in, waist measurement, calorie target or laboratory
    test is required for the exercise. Time and effort: Twenty minutes on the supplied case and one appropriate
    next action or qualified discussion. Adaptation: Use the fictional case throughout when body metrics
    are distressing or medically inappropriate. Existing eating-disorder treatment, pregnancy care and
    condition-specific guidance take precedence. A qualified clinician can choose appropriate monitoring
    without the app storing personal values. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the fictional case throughout when body metrics are distressing or medically
    inappropriate. Existing eating-disorder treatment, pregnancy care and condition-specific guidance
    take precedence. A qualified clinician can choose appropriate monitoring without the app storing personal
    values.
  expected_burden: Twenty minutes on the supplied case and one appropriate next action or qualified discussion.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Body composition and metabolic health protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Body composition and metabolic health action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the fictional
    case throughout when body metrics are distressing or medically inappropriate. Existing eating-disorder
    treatment, pregnancy care and condition-specific guidance take precedence. A qualified clinician can
    choose appropriate monitoring without the app storing personal values.
  actions:
  - stable_id: PRACTICE-COMP-1209-BODY-COMPOSITION-AND-METABOLIC-HEALTH-01-A1
    sequence: 1
    title: Separate the evidence types and their limitations
    instructions: 'For the case, explain that total weight does not by itself identify muscle or fat change,
      clothing fit is imprecise, function measures a task, and clinical markers need context and qualified
      interpretation. Include waist as another imperfect measure rather than a compulsory target. Mark
      which observations are missing or incomparable. Do not diagnose metabolic health from appearance
      or treat a stable scale as proof of no progress.


      Observation checks: Weight tissue composition waist function and clinical markers are distinguished;
      Each measure has an explicit limitation; Missing or incomparable observations remain visible; Appearance
      and a single number do not determine a health verdict. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1209-BODY-COMPOSITION-AND-METABOLIC-HEALTH-01
      action_stable_id: PRACTICE-COMP-1209-BODY-COMPOSITION-AND-METABOLIC-HEALTH-01-A1
