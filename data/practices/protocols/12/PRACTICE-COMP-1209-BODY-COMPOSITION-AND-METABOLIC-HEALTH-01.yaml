  - id: file-later-packet-md
    title: Later packet
    body: 'Reveal after preserving the evidence map and decision. All events are simulated.


      Day 1: Ellis sends the private review request. Day 2: the office acknowledges it and confirms a
      review on day 6. No clinical interpretation has occurred yet. Day 3: a book-group trip takes 95
      seconds, but a helper carries one of the three books. The usual aid and route remain. Ellis reports
      usual aftermath. No body-composition or waist measurement exists.


      The original comparable change was 120 to 100 seconds, 20 seconds quicker, with the same task conditions.
      Day 3 is 5 seconds quicker than the previous 100-second trip, but load sharing changed. Preserve
      this as a supported trip under different conditions; do not extend a same-condition trend. A booked
      review does not establish interpreted markers or care completed.


      ### Separate alternative after day 6


      Only in this alternative branch, the review actually occurs. The clinician explains that the existing
      report needs contextual follow-up and agrees a further review; no “metabolic improvement” conclusion
      or treatment change is supplied. Ellis can now record review attended and a next step agreed. The
      next review has not occurred. Keep the unchanged-scale and useful-function facts without making
      them cancel the unresolved clinical question.


      If the expected day-6 review instead does not occur, record that absence and the next contact needed.
      Do not borrow the alternative''s clinical conversation into the main branch.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Choose evidence that can answer the health question


      Body weight is a total, not a breakdown of muscle, fat and other components. A stable total does
      not prove that nothing changed; a changed total does not identify what changed. Waist measurements,
      clothing fit, daily function and clinical markers answer different questions and have different
      limitations. A photograph cannot settle them.


      This guide helps you interpret a health-change goal and choose a sustainable next action. Its default
      is a complete fictional evidence review. Allow 15 minutes to build the evidence table, 10 for the
      later record and 10 for fresh checks. Paper, a text editor, dictation and simple arithmetic suffice.
      No weigh-in, photograph, tape measure, calorie target, laboratory test, purchase or private disclosure
      is required. Health and exercise content must be adapted to the person and does not replace licensed
      medical care.


      ### A measure is useful within its limits


      Weight includes tissues and other bodily contents; weight change alone cannot identify a muscle
      or fat change. BMI relates weight to height and is a screening measure, not direct tissue measurement.
      The [CDC''s explanation](https://www.cdc.gov/bmi/faq/index.html) distinguishes BMI from fat and
      lean mass. This guide does not calculate BMI or assign a body category.


      Waist can be one contextual indicator; methods and conditions matter, and it is not compulsory here.
      Clothing can stretch or fit differently for reasons unrelated to health. Function is task-specific:
      carrying a familiar bag more comfortably is useful evidence about that task, even if appearance
      is unchanged. But a lighter bag, different route or extra help changes the comparison. Keep those
      conditions visible instead of calling any faster result improvement.


      Blood markers, blood pressure and other clinical results need their own units, methods, context
      and appropriate interpretation. A portal flag is not a diagnosis; an in-range result does not establish
      total health. [MedlinePlus explains lab-result context and reference ranges](https://www.medlineplus.gov/lab-tests/how-to-understand-your-lab-results/).
      Do not combine unlike tests or compare numbers from different reports without checking what they
      represent.


      Sustainable methods preserve nourishment, sleep, access, relevant treatment and a personally meaningful
      goal. They may include a familiar activity in an established plan, a workable meal pattern or review
      of existing results. This exercise provides no weight-loss target, diet restriction, supplement
      regimen or extra testing schedule. If body metrics are distressing or unsuitable, the fictional
      route remains complete. Existing eating-disorder, pregnancy and condition-specific care governs
      personal monitoring.


      ### Worked example: the bag changed


      Pat takes 90 seconds to move a six-book bag along a familiar route, then 60 seconds with three books
      along the same route. The second trip is 30 seconds quicker, but it is not the same task demand.
      The record supports a faster trip with fewer books, not increased muscle or reduced fat. A usable
      next question is whether the lighter load makes ordinary participation easier; it need not become
      a physical-capacity claim.


      ### Complete materials: Ellis''s evidence folder


      Ellis wants to keep visiting a nearby book group comfortably. Their existing care plan includes
      a familiar supported activity and regular meals; neither needs escalation for this exercise. They
      have existing clinical results awaiting review, with no urgent instruction or current symptom concern
      supplied in this fictional case. That absence is not a health examination or reassurance for a real
      concern.


      | Evidence item | Earlier record | Current record | Context |

      | --- | --- | --- | --- |

      | Scale total | recorded | unchanged | Same stated device and routine; no tissue measurement |

      | Muscle/fat composition | not measured | not measured | No composition method supplied |

      | Waist | not recorded | not recorded | No measurement required |

      | Clothing fit | familiar garment | feels looser | Garment has stretched; imprecise comparison |

      | Book-group task | 120 seconds | 100 seconds | Same three-book bag, route, usual aid and helper
      role |

      | Task aftermath | ordinary function usual | ordinary function usual | Both are self-reports, not
      independent observations |

      | Existing blood-marker report | earlier report unavailable | portal says review requested | Values,
      units and interpretation not supplied |


      The clinician''s office offers a review request channel. Ellis can send a brief question privately
      and ask for an accessible written explanation; the learning exercise never sends it. The sustainable
      default is to keep the existing meal/activity plan while requesting interpretation of the existing
      report. A new symptom or urgent report instruction in real life would override this ordinary follow-up
      case.


      #### Action 1 — Build the evidence map


      For all seven rows write `what is observed | question it can address | limit or missing fact | appropriate
      interpretation route`. Separate muscle and fat even though neither was measured. Calculate the task-time
      difference and state what stayed comparable. Do not infer a clinical improvement from the absence
      of a scale change, or a tissue change from the easier task.


      #### Action 2 — Preserve one decision before more results


      Choose the question “what does the existing clinical result mean in context, and what follow-up
      is appropriate?” Draft a short request containing the question, the actual report availability and
      the written-reply need. Do not invent values or attach private details to a public learning record.
      Add a sustainable action card: keep the established routine if it remains suitable; retain nourishment
      and support; seek relevant advice for symptoms, unwanted effects or unclear restrictions.


      Before opening [later-packet.md](?resource=file-later-packet-md), write what would justify each
      claim: request sent, review booked, result interpreted, actual functional comparison, body composition
      changed. Some claims may remain unsupported throughout.


      #### Action 3 — Integrate the later record without choosing a favorite indicator


      Keep the original folder and add each later event. Distinguish an agreed next step from an action
      actually performed. If later function looks worse or becomes incomparable, keep it alongside the
      earlier favorable record. Choose repeat within the existing plan, clarify a condition, or obtain
      qualified review; do not respond to ambiguity with more body tracking or food restriction.


      Attempt [check-prompts.md](?attempt=practice-checks) before [check-answers.md](?check=practice-answers).
      Completion of this source exercise means an evidence map, a bounded plan/request and an honest later
      interpretation. Those reading outputs do not establish actual health behavior.


      ### Access, challenge and later transfer


      A reader can handle the records; use verbal categories rather than body numbers. Keep private clinical
      information in the appropriate care channel. A lack of access to records or care is a barrier to
      resolve, not a failed health character trait.


      Harder variation: the later portal report is from another laboratory and the earlier unit is missing.
      List the missing comparison facts—test identity, units, reference range, sampling context and qualified
      interpretation—without trying a guessed conversion. A same-looking number does not repair missing
      context.


      For later real transfer, choose a meaningful health or participation question and one appropriate
      action already in the person''s plan, or make a qualified contact about existing information. Record
      actual action, support and agreed follow-up only after they occur. Comparable longitudinal evidence
      may eventually support a narrower health/function claim; this artifact, two trips and author self-review
      do not supply it. Independent observation and qualified assessment remain separate.


      **Supportive:** Comparable function becomes easier and relevant clinical uncertainty receives a
      real appropriate review, without inventing tissue change.


      **Mixed:** One task improves while clinical information remains unresolved or a later task changes
      conditions.


      **Contradictory:** Appearance or a single body number becomes a health verdict or justification
      for severe restriction.


      **Inconclusive:** Metrics are collected without a question, comparison context or actual next action.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A person''s weight total is unchanged and a garment is looser, but the garment has stretched.
      Neither muscle nor fat was measured. What changed in the record, and what tissue claim remains unsupported?

      2. An unchanged task takes 150 seconds, then 130 seconds. A third trip takes 110 seconds with a
      lighter load. Calculate both differences and identify which comparison can support a same-task observation.

      3. A portal marks an existing blood result for review; the appointment is booked but not attended.
      A friend says an in-range result elsewhere proves overall metabolic health. Correct the care status
      and explain why neither result supplies the proposed verdict.


      Save answers before [the key](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The scale total is unchanged and garment fit is reported different under changed garment
      conditions. Muscle and fat remain unmeasured. Neither fat loss nor muscle gain follows. Keep a meaningful
      health/function question without demanding more body measurements.

      2. Both successive differences are 20 seconds. Only 150 to 130 preserves the stated task demand;
      130 to 110 changes the load. The first is a task observation, not proof of tissue change or a causal
      training effect. Restore the load-change note if it was omitted.

      3. Review is booked, not attended or interpreted. Clinical results need their own context, and one
      in-range result does not establish total metabolic health. Use the appropriate review channel for
      the existing question; do not invent diagnosis, reassurance, treatment or additional tests.


      These are reasoning checks, not body-composition or clinical assessments.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
