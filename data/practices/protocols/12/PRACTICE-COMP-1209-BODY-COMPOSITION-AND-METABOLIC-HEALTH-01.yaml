  - stable_id: PRACTICE-COMP-1209-BODY-COMPOSITION-AND-METABOLIC-HEALTH-01-A3
    sequence: 3
    title: Complete the next action and preserve uncertainty
    instructions: 'Carry out the selected safe action or qualified contact and record only whether it
      happened and what next step was agreed. For a functional observation, use comparable conditions;
      for clinical results, ask what they mean together and what follow-up is warranted. Retain any mismatch
      between appearance, function and markers. Do not report improved metabolism or changed body composition
      from completing this practice.


      Observation checks: A safe action or qualified contact actually occurs; Comparable conditions or
      clinical context are preserved; Conflicting indicators are not hidden; No metabolic or tissue-change
      claim follows from task completion. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which evidence would actually change the health decision, and which attractive-looking
      number is insufficient on its own?


      Examples: Supportive: The person retained the functional improvement and arranged review of existing
      clinical results without inventing a fat-loss conclusion.


      Mixed: A useful activity continued, but changing test conditions made the functional comparison
      uncertain.


      Contradictory: A photograph or scale change was treated as proof of metabolic health and used to
      justify severe restriction.


      Inconclusive: Several body metrics were collected without a health question, interpretation limit
      or sustainable next action.'
