meaning_and_fit:
  purpose: Understand the difference between prevention, symptom evaluation and treatment, organize the
    information a clinician needs, and act on one appropriate care gap.
  why_recommended: Understand the difference between prevention, symptom evaluation and treatment, organize
    the information a clinician needs, and act on one appropriate care gap.
  claims:
  - statement: Understand the difference between prevention, symptom evaluation and treatment, organize
      the information a clinician needs, and act on one appropriate care gap.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Health literacy and preventive care practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Health literacy and preventive care as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an interpreter, accessible portal, support person with consent or a community
    clinic. Keep diagnoses, sexual history and medicine names out of app check-ins. A fictional case practices
    navigation only; lack of affordable care is an access barrier, not a failed health behavior.
  opportunity_considerations: 'Use your existing care records privately, or the supplied fictional case:
    an adult has an unclear vaccination record, a medicine from two prescribers and an overdue dental
    reminder. Make six headings: screening, new symptoms, medicines, vaccination, dental care and sexual
    health. Mark current, uncertain, due according to an existing care plan, or not applicable; do not
    invent a due date.'
  prerequisites:
  - 'Use your existing care records privately, or the supplied fictional case: an adult has an unclear
    vaccination record, a medicine from two prescribers and an overdue dental reminder. Make six headings:
    screening, new symptoms, medicines, vaccination, dental care and sexual health. Mark current, uncertain,
    due according to an existing care plan, or not applicable; do not invent a due date.'
  dependencies: []
  safe_alternatives:
  - Use an interpreter, accessible portal, support person with consent or a community clinic. Keep diagnoses,
    sexual history and medicine names out of app check-ins. A fictional case practices navigation only;
    lack of affordable care is an access barrier, not a failed health behavior.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Health literacy and preventive care differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Health literacy and preventive
    care as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use your existing care records privately, or the supplied fictional case: an adult has an unclear
    vaccination record, a medicine from two prescribers and an overdue dental reminder. Make six headings:
    screening, new symptoms, medicines, vaccination, dental care and sexual health. Mark current, uncertain,
    due according to an existing care plan, or not applicable; do not invent a due date. Goal: Understand
    the difference between prevention, symptom evaluation and treatment, organize the information a clinician
    needs, and act on one appropriate care gap. Scope: This is care navigation and health literacy, not
    a screening schedule, diagnosis or instruction to start, stop or change treatment. Urgent symptoms
    take priority over completing the exercise. Time and effort: Twenty minutes of private preparation,
    one clinic or pharmacy contact and a ten-minute follow-up; appointment availability may extend the
    timeline. Adaptation: Use an interpreter, accessible portal, support person with consent or a community
    clinic. Keep diagnoses, sexual history and medicine names out of app check-ins. A fictional case practices
    navigation only; lack of affordable care is an access barrier, not a failed health behavior. Keep
    personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an interpreter, accessible portal, support person with consent or a community
    clinic. Keep diagnoses, sexual history and medicine names out of app check-ins. A fictional case practices
    navigation only; lack of affordable care is an access barrier, not a failed health behavior.
  expected_burden: Twenty minutes of private preparation, one clinic or pharmacy contact and a ten-minute
    follow-up; appointment availability may extend the timeline.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Health literacy and preventive care protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Health literacy and preventive care action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an interpreter,
    accessible portal, support person with consent or a community clinic. Keep diagnoses, sexual history
    and medicine names out of app check-ins. A fictional case practices navigation only; lack of affordable
    care is an access barrier, not a failed health behavior.
  actions:
  - stable_id: PRACTICE-COMP-1201-HEALTH-LITERACY-AND-PREVENTIVE-CARE-01-A1
    sequence: 1
    title: Build a minimum useful care summary without self-diagnosing
    instructions: 'Under the six headings, record only the questions needed for the next appointment.
      For medicines, list prescription and nonprescription products and how they are actually taken; keep
      this outside application evidence. Separate a new symptom from a preventive question. Note access,
      language, cost and consent needs. A blank vaccination record means uncertain, not automatically
      unvaccinated or protected.


      Observation checks: All six care areas receive an honest status; Symptoms are separated from preventive
      planning; The private medicine list reflects actual use without treatment changes; Access needs
      and uncertainty are explicit. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1201-HEALTH-LITERACY-AND-PREVENTIVE-CARE-01
      action_stable_id: PRACTICE-COMP-1201-HEALTH-LITERACY-AND-PREVENTIVE-CARE-01-A1
      competency_stable_id: '12.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
