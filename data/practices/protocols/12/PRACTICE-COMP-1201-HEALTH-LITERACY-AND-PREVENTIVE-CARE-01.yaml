      action_stable_id: PRACTICE-COMP-1201-HEALTH-LITERACY-AND-PREVENTIVE-CARE-01-A2
      competency_stable_id: '12.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
