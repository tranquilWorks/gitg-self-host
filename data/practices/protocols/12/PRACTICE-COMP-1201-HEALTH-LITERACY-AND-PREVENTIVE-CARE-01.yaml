  - stable_id: PRACTICE-COMP-1201-HEALTH-LITERACY-AND-PREVENTIVE-CARE-01-A2
    sequence: 2
    title: Verify one gap through the appropriate qualified channel
    instructions: 'Choose the most relevant non-urgent uncertainty and contact the existing clinician,
      dentist, pharmacist or local public-health service. Ask what information is needed, which current
      guidance applies to your age and circumstances, and the next action. For the default, request the
      vaccination record rather than booking every possible vaccine. If concerning symptoms are current,
      obtain timely clinical or emergency advice instead of waiting for the audit.


      Observation checks: The chosen question reaches an appropriate qualified service; Current individual
      guidance is requested rather than guessed; Required records costs and access arrangements are clarified;
      Current concerning symptoms are not deferred for the exercise. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
