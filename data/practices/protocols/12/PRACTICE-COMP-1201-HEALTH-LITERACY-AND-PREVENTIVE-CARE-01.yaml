  - stable_id: PRACTICE-COMP-1201-HEALTH-LITERACY-AND-PREVENTIVE-CARE-01-A3
    sequence: 3
    title: Carry out the agreed next step and use teach-back
    instructions: 'Complete the next agreed action: obtain the record, book the indicated review, resolve
      a medicine-list discrepancy with the pharmacist or attend the planned visit. Summarize in your own
      words what happens next, why and when to seek help; ask the service to correct misunderstanding.
      Record the remaining question and follow-up date. Booking a visit is not evidence that screening,
      vaccination or treatment has occurred.


      Observation checks: An agreed next step is actually completed; The next action and help threshold
      are restated and clarified; Outstanding questions retain a follow-up route; Booking preparation
      and completed clinical care remain distinct. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which uncertainty became an actionable care plan, and what still needs qualified interpretation
      rather than another internet search?


      Examples: Supportive: The vaccination record was obtained and the clinic confirmed the appropriate
      next review; an assumed missing dose was not self-prescribed.


      Mixed: An appointment was booked, but transport or interpretation remained unresolved and required
      another access step.


      Contradictory: Medication was stopped or a symptom dismissed because a self-made prevention checklist
      appeared complete.


      Inconclusive: A list of recommended tests was copied without checking individual relevance or contacting
      a care service.'
