      - [MedlinePlus, Dietary Fiber](https://www.medlineplus.gov/dietaryfiber.html)

      - [FDA, Serving Size on the Nutrition Facts Label](https://www.fda.gov/food/nutrition-facts-label/serving-size-nutrition-facts-label)

      - [FDA, Food Allergies](https://www.fda.gov/food/nutrition-food-labeling-and-critical-foods/food-allergies)

      - [NIMH, Eating Disorders: What You Need to Know](https://www.nimh.nih.gov/health/publications/eating-disorders)

      - [CDC, How to Measure Physical Activity Intensity](https://www.cdc.gov/physical-activity-basics/measuring/index.html)

      - [CDC, Strategies to Prevent Worsening of Symptoms](https://www.cdc.gov/me-cfs/hcp/clinical-care/treating-the-most-disruptive-symptoms-first-and-preventing-worsening-of-symptoms.html)

      - [NHS, How to improve your strength and flexibility](https://www.nhs.uk/live-well/exercise/how-to-improve-strength-flexibility/)

      - [Mayo Clinic, Stretching and flexibility](https://www.mayoclinic.org/healthy-lifestyle/fitness/basics/stretching-and-flexibility/hlv-20049447)'
  - id: file-later-packet-md
    title: Later packet
    body: 'These branches are separate simulated futures; neither is an actual service contact.


      ### Branch A: partial information


      Day 1, 11:00: Morgan authorizes and sends the records request privately. Day 1, 14:00: the service
      acknowledges it. Day 3, 10:00: Morgan receives a correctly identified record. It lists one historic
      entry and says earlier records were not transferred. It does not state present vaccination needs.
      Day 3, 15:00: the clinic confirms a routine review on day 8; the appointment has not happened. The
      pharmacist, dentist and private sexual-health discussion have no new event in this branch.


      Update each status. Draft a teach-back that distinguishes the received partial record from a completed
      review and asks who will resolve the remaining history. Preserve the medicine and dental next actions.
      Do not use the single entry to construct a vaccine schedule.


      ### Branch B: no record


      Day 1, 11:00: Morgan authorizes and sends the request. The service acknowledges it at 14:00. No
      further reply arrives by the start of day 4. Morgan has not contacted the records desk yet. There
      is no new symptom information and no other care event.


      Use the supplied day-4 follow-up rule. Write “follow-up due, not yet made.” Acknowledgement proves
      receipt of the request only. Do not invent a missing vaccination, repeat dose or completed clinical
      review.


      ### Review after your attempt


      Branch A supports received partial record and booked review, while interpretation and care remain
      pending. Branch B supports sent/acknowledged request and an open follow-up. In both, the information
      gap is narrower than “all preventive care complete.” If a new symptom concern arises in life, use
      timely qualified advice appropriate to it rather than treating day 4 as a symptom waiting rule.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Turn an uncertain record into a useful care question


      Health literacy includes knowing what a record establishes, what remains unknown and which service
      can resolve it. Screening looks for a condition before symptoms; symptom evaluation investigates
      a concern; treatment addresses a condition. A reminder, an appointment and completed care are different
      events. An empty record proves none of them.


      This source companion teaches navigation across screening, symptoms, medicines, vaccination, dental
      care and sexual health. Use the fictional packet below. You need paper or a text editor, no account,
      purchase, personal history or actual contact. Allow 15 minutes for the summary, 10 for the simulated
      exchange and 10 for checks. Completing this route produces a care-navigation artifact, not completed
      preventive care. Health and exercise content must be adapted to the person and does not replace
      licensed medical care.


      ### A small, trustworthy summary


      Record the source and date alongside each status. “Due according to my existing care plan” has a
      basis; “everyone my age needs this” needs current local and individual guidance. Screening can have
      benefits and harms, so ask about the relevant options rather than maximizing tests. Symptoms deserve
      their own question even when preventive records look complete. A checklist cannot rule out illness.


      For medicines, a useful private list includes prescription and nonprescription products, supplements,
      the written instructions and actual use, plus any discrepancy. A pharmacist or prescriber can clarify
      it; the worksheet cannot authorize starting, stopping or changing a medicine. For vaccination, seek
      records and applicable local advice before inferring missing doses. Dental reminders identify follow-up
      work; they do not prove either disease or completed treatment. Sexual-health questions may involve
      prevention, symptoms, testing, contraception or consent, depending on the person. No one must disclose
      sexual history to complete this learning exercise.


      Use teach-back to check the explanation: restate what happens next, who does it, when, and what
      remains unresolved; invite correction. This tests shared understanding, not the patient''s intelligence.
      See [AHRQ''s communication tool](https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/teachback.html).
      Qualified clinical advice and local emergency routes take priority over a worksheet when symptoms
      are concerning; do not wait for this exercise or a routine appointment in an emergency.


      ### Worked example: a dental reminder


      A fictional letter says “contact us to arrange the review already discussed.” Sam writes “review
      requested by existing dental plan; not booked.” The dental service offers Tuesday, but Sam cannot
      travel then. Sam asks for an accessible slot and keeps “booking unresolved.” Copying Tuesday into
      a calendar would not establish an agreed appointment. Once the service confirms Thursday and transport
      is arranged, “booked” is justified; “attended” still is not.


      ### Complete materials: Morgan''s Monday file


      All facts are invented. Today is case day 1, Monday. Morgan is an adult with no current symptom
      concern in this packet. No ages, diagnoses, medicine doses or screening/vaccine schedules are supplied
      or needed. The clinic contact and messages below are simulated; do not send anything.


      | Area | Information available on day 1 | Limit |

      | --- | --- | --- |

      | Screening | Existing clinic note: discuss individual preventive options at the next routine review
      | No test is ordered and no due date is supplied |

      | Symptoms | Morgan reports no current symptom concern | A report, not a health examination or guarantee
      |

      | Medicines | Two prescribers appear in the private medicine folder; current instructions for product
      M are unclear; no list review has occurred | Do not guess use or dose; ask pharmacist/prescriber
      to reconcile actual use with instructions |

      | Vaccination | Old clinic record is absent | Status uncertain; neither unvaccinated nor protected
      follows |

      | Dental care | Reminder says book the review in the existing plan; no booking confirmation | Follow-up
      due according to that reminder, not completed |

      | Sexual health | Morgan requests a private discussion of prevention options at routine review |
      No history, exposure or test indication is specified |


      The clinic''s fictional records service accepts a request from Morgan or a specifically authorized
      helper. Morgan consents to the learner drafting a records request only; no sending, medicine disclosure
      or broad record-sharing permission exists. Morgan can use text communication and needs a written
      reply; the clinic can provide it. The records service says allow two working days for a response,
      then contact the records desk on day 4 if nothing arrives. These times are toy service facts, not
      clinical waiting advice. The medicine uncertainty goes separately to the pharmacist/prescriber promptly;
      a vaccination-record request is not its resolution.


      #### Action 1 — Create the six-area summary


      For every row write `status | supporting fact | unknown | appropriate next channel`. Include the
      medicine discrepancy and dental reminder as open work even while selecting vaccination records for
      the worked exchange. Add the written-reply access need and the exact consent boundary. Do not fill
      missing clinical facts with assumptions.


      #### Action 2 — Draft a bounded request and preserve it


      Write two or three sentences requesting the existing vaccination record and the information required
      to release it securely. Ask who will interpret it, not which vaccine to administer. Example opening:
      “I want to check which vaccination records you hold. Please explain the secure request process and
      who can advise on my current individual needs.” Keep a separate line for the medicine clarification
      and dental booking routes.


      Save your summary and draft before opening [later-packet.md](?resource=file-later-packet-md). Predict
      what a record acknowledgement, a partial record and a booked appointment would each permit you to
      claim. The default is finished by analyzing the supplied replies; a simulated message is never an
      actual contact.


      #### Action 3 — Reconcile the reply without closing the wrong gap


      Apply each later branch separately. Preserve day 1 facts, add the dated event, write a teach-back
      and name the next actor and follow-up. Use `drafted → authorized → sent → acknowledged → record
      received → clinically interpreted` only when that exact event is supplied. These stages are evidence
      distinctions for this case, not a universal linear clinical workflow. Booking and attending care
      remain separate tracks. Missing answers stay open.


      Attempt [check-prompts.md](?attempt=practice-checks), then use the [corrective key](?check=practice-answers).
      The source artifact is complete with all six areas, the limited draft, both reply reconciliations
      and a next-step record. These reading outputs do not establish actual health behavior.


      ### Access, deeper work and transfer


      Dictation, a reader, an interpreter or a consented support person can assist. Use category labels
      instead of medicine names in shared notes; private clinical details belong only in appropriate care
      channels. An inaccessible portal, cost or missing service is an access barrier: record the barrier
      and alternative channel, not personal failure. No live route is necessary to finish the default.


      Harder case: the record received on day 3 belongs to a different person with a similar name. Do
      not use or redistribute it; contact the service through its verified privacy/correction route and
      keep Morgan''s record uncertain. Describe only the mismatch category in the learning record. A correct
      identity is a prerequisite for interpretation, not something inferred from a matching first name.


      At a later suitable real opportunity, prepare one private question, use an authorized care channel,
      and record what actually happened. Ask a qualified service to explain applicable options, access,
      benefits/harms and follow-up. Real care may take longer than the learning exercise. An author-checked
      simulation is not an independent observation or qualified review.


      **Supportive:** The correct record arrives and its uncertainty is clarified by the relevant service,
      with unresolved care explicitly retained.


      **Mixed:** A record is obtained but incomplete; navigation progresses while clinical status remains
      open.


      **Contradictory:** Missing records become invented vaccination status, a medication is changed from
      a guess, or concerning symptoms are deferred for the checklist.


      **Inconclusive:** Only a draft or acknowledgement exists; neither record receipt nor care completion
      is established.


      See the scope and limits described in this guide and [source limits](?resource=sources). This is
      original navigation practice, not proof of general health literacy or preventive-care adherence.'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: 'Save an answer before opening [check-answers.md](?check=practice-answers).


      1. Alex''s portal has no vaccination entries. A friend says that proves no vaccination occurred
      and offers to select doses. The clinic has only acknowledged Alex''s request. Write the defensible
      status, one request and a claim that must remain withheld.

      2. A service says “we can offer Friday if you confirm.” The person replies “I need transport information”;
      no further message arrives. A spreadsheet says “Friday care completed.” Correct the record, identify
      the unresolved action and explain why neither the offer nor the reply establishes attendance.

      3. A helper has permission to draft a dental booking question. They propose attaching the person''s
      complete medicine and sexual-health history to a public group message to get faster advice. State
      the authorized artifact and the privacy/permission correction.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Vaccination status is uncertain; the request was acknowledged, but the record has not arrived.
      Ask the appropriate records/clinical service what history is available and who can interpret individual
      needs. Withhold both “never vaccinated” and “protected,” and do not choose doses from absence. If
      you treated a blank as zero, separate the observation (blank portal) from the historical event it
      cannot establish.

      2. The slot is offered, not confirmed, and care is not completed. Ask about transport/access and
      confirm an achievable appointment through the service. Later attendance and the actual care provided
      need their own evidence. If you marked the offer booked, restore the conditional wording instead
      of inventing a confirmation date.

      3. Draft the bounded dental question only. Additional disclosure and public sending exceed permission
      and are unnecessary. Keep private details in authorized care channels. Faster response does not
      supply consent, qualified advice or confidentiality.


      All three require a supporting fact and an explicit unknown; polished prose without those distinctions
      is incomplete. These are author-provided educational keys, not clinical assessment or independent
      review.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
