  - stable_id: PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01-A2
    sequence: 2
    title: Practice one component and correct one observed error
    instructions: 'For the tabletop route, attempt three unhurried left-center-right-center sequences
      with rest, record exact target or order errors, change one cue, and retry at the same comfortable
      pace. For an existing-plan route, perform only the already-authorized movement and dose while recording
      its existing technique and recovery criteria; do not add timing, force, direction changes or volume.
      For instruction-first, use the prepared questions and record the route disposition instead of performing
      the movement. Stop for pain, fatigue, loss of control, unsafe surface or equipment, or any existing
      plan''s stop rule.


      Observation checks: A bounded attempt consultation or appropriate stop is recorded; The observed
      error belongs to the selected component and fixed criteria; Only one cue or plan-authorized variable
      changes; Accuracy control recovery and stop limits take priority over speed or force. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01
