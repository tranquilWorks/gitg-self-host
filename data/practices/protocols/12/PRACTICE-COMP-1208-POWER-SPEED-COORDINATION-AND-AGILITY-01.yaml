      record correctly limited the result to tabletop coordination with an unhurried cue.
    mixed: An athlete repeated one existing change-of-direction component, but the second session changed
      surface and footwear, so improvement could not be separated from conditions and no progression followed.
    contradictory: A participant improvised maximal jumps without established prerequisites, continued
      after loss of landing control and called the result evidence of power and agility.
    inconclusive: A fast time was reported without a defined component, fixed accuracy or technique criteria,
      route authority, or an observed sequence.
presentation:
  setup_copy:
    context_heading: Separate power, speed, coordination and agility into safe capability-fit learning
      routes
    boundary_heading: Not applicable, defer, support, and stop decisions carry no deficit.
    timing_hint: Work through the numbered actions at a sustainable pace. Preserve their order; use the
      review point specified in the instructions and defer if the context is unsuitable.
    applicability_heading: Confirm role, pathway, authority, consent, access, and safety for Power, speed,
      coordination, and agility.
  check_in_labels:
    c1208_a1_primary: 'Observed checks: classify the four capacities and select one honest route'
    c1208_a1_boundary: Action 1 stayed inside its stated Power, speed, coordination, and agility boundary
    c1208_a1_adverse: Action 1 produced harm, pressure, or a boundary violation
    c1208_a2_primary: 'Observed checks: practice one component and correct one observed error'
    c1208_a2_boundary: Action 2 stayed inside its stated Power, speed, coordination, and agility boundary
    c1208_a2_adverse: Action 2 produced harm, pressure, or a boundary violation
    c1208_a3_primary: 'Observed checks: compare a second exposure and choose a component-specific next
      step'
    c1208_a3_boundary: Action 3 stayed inside its stated Power, speed, coordination, and agility boundary
    c1208_a3_adverse: Action 3 produced harm, pressure, or a boundary violation
  completion_copy: Which capacity was actually practiced, what prerequisite and recovery evidence supports
    the next step, and which capacities remain untested? Completion is not mastery.
  plain_language_evidence: Numbered cards reduced two order errors to none at the same comfortable pace,
    and the record correctly limited the result to tabletop coordination with an unhurried cue.
  display_order: 153
instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '12.08'
  title: Classify and practice one movement capacity without scope inflation
  scored: false
  sections:
  - id: component-cards
    kind: concept
    title: Four capacities and one related cue skill
    body: Coordination organizes body parts or actions into an accurate, controlled sequence. Reaction
      is initiating an appropriate response to a cue. Speed is completing a defined movement or distance
      quickly. Power is producing force rapidly, so force and time both matter. Agility is rapid whole-body
      movement or change of direction in response to a task or stimulus; a preplanned change-of-direction
      drill does not capture every reactive-agility demand. These capacities interact, but one result
      does not stand in for the others. Touching cards can expose order, target and cue-response errors.
      It does not measure sprint speed, high-force power, landing ability or athletic agility.
  - id: route-matrix
    kind: material
    title: Five route choices
    body: 'Tabletop coordination and reaction: use the supplied cards, comfortable reach, accuracy criteria
      and unhurried cues; no athletic claim. Existing-plan speed: use only a movement, surface, dose,
      recovery and timing method already established for the person; no maximal trial is added. Existing-plan
      power: use only a qualified or competently established power exercise with its strength, technique,
      equipment, landing or force-absorption prerequisites already met; this guide supplies no load or
      jump. Existing-plan agility: use only an established task with known deceleration, surface, footwear,
      space and cue rules; do not infer reactive agility from a preplanned route. Instruction-first: prepare
      the supplied brief and obtain a route decision without performing the uncertain movement.'
  - id: prerequisite-screen
    kind: material
    title: Prerequisite and boundary screen
    body: 'Record yes, no or unknown for: the selected component is defined; the movement and technique
      are already familiar; the environment, surface and equipment are suitable; required mobility, strength,
      balance, deceleration or force-absorption prerequisites are established where relevant; the dose
      and recovery come from an existing plan; ordinary access support remains; and stop conditions are
      known. A no or important unknown means instruction-first or defer. Stop for pain, faintness, chest
      discomfort, unusual breathlessness, loss of control, unsafe surface or equipment, collision risk,
      or the existing plan''s stop rule. This screen is educational and is not medical or sport clearance.'
  - id: coordination-material
    kind: material
    title: Complete tabletop coordination default
    body: 'Place three large cards labeled L, C and R on a stable table within comfortable reach. Use
      a finger, pointer, eye gaze, switch or verbal selection. Fix four criteria: correct order; intended
      target; controlled initiation and stop; comfortable reach without symptom-provoking effort. Attempt
      L-C-R-C three times at an unhurried pace with rest. Record the exact missed contact or transition.
      Add one cue, such as numbers 1-2-3-2 or speaking the sequence, and retry without increasing pace.
      At the second session, change only the label order or use one willing cue giver. Timing is optional
      and is not a completion criterion.'
  - id: instruction-brief
    kind: material
    title: Speed, power or agility instruction brief
    body: 'Prepare: the exact goal and component; current training experience; relevant movement and equipment;
      surface, space and access conditions; existing dose and recovery; known technique; and each unknown
      prerequisite. Ask: Is the goal actually speed, power, coordination, reaction, change of direction
      or reactive agility? Which prerequisites and technique criteria should be established first? What
      starting task and dose fit the current plan? What recovery and stop rules apply? Which single variable
      could progress, and what evidence would permit it? Record only: appropriate as proposed | modify
      | prerequisite first | another qualified route | defer. The answer prepares training; it does not
      prove capacity.'
  - id: component-record
    kind: material
    title: Component-specific comparison record
    body: 'Goal and selected component: __. Route and source of authority: __. Materials, surface, equipment
      and support: __. Prerequisite screen unknowns: __. Fixed dose, recovery and stop conditions: __.
      Four accuracy or technique criteria: __. Exposure 1 observations, exact errors and early stop: __.
      One cue or authorized change: __. Recovery before exposure 2: __. Exposure 2 conditions and observations:
      __. Next step [repeat / regress / plan-authorized progression / instruction / stop] and reason:
      __. Capacities not tested: __. Do not place recordings, identities, private health detail or another
      person''s comments in the application evidence.'
  - id: worked-coordination
    kind: worked_example
    title: Worked example that keeps the component boundary
    body: Three unhurried L-C-R-C attempts contain two R-to-C order errors. The learner adds spoken numbers
      and retries at the same pace with no order errors and controlled contacts. On the second day, a
      willing partner gives the same four cues in an unhurried order; one target error returns. The evidence
      supports improved performance with a self-spoken cue and mixed transfer to an external cue. It does
      not show increased hand speed, rapid force, running speed, deceleration or agility.
  - id: classify-cases
    kind: prompt
    title: Classify five movement cases
    body: 'Classify the main observed capacity in each case and state one capacity the case does not establish.
      A: touch L-C-R-C in the correct order at a comfortable pace. B: begin the correct touch after an
      unpredictable L, C or R cue. C: cover a fixed straight distance in less time under comparable conditions.
      D: move a known resistance rapidly with established technique. E: change whole-body direction in
      response to an opponent or unpredictable signal. Explain why a quick tabletop sequence cannot by
      itself establish D or E. Preserve the answers before opening the check.'
    check_id: classification-key
    attempt_mode: unaided
    references:
    - component-record
  - id: select-route
    kind: prompt
    title: Select a route and declare its prerequisites
    body: Choose one current goal and name its component. Complete the prerequisite screen, select one
      of the five routes, and state the materials, environment, support, source of plan authority, fixed
      dose, four criteria, recovery and stop conditions. For an instruction-first route, complete the
      speed, power or agility brief instead of inventing a physical attempt. State which other capacities
      will remain untested. Preserve the response before opening the check.
    check_id: route-check
    attempt_mode: open_explanation
    references:
    - route-matrix
    - prerequisite-screen
    - instruction-brief
    - component-record
  - id: compare-case
    kind: prompt
    title: Interpret a changed-condition comparison
    body: 'Case: An existing-plan change-of-direction task met three of four technique criteria on the
      first exposure. On the second exposure the athlete changed shoes and surface, received extra cueing,
      and completed it faster while still missing the same deceleration criterion. Decide whether the
      evidence supports progression and explain what is comparable, what is confounded and which capacities
      remain untested. Preserve the answer before opening the check.'
    check_id: comparison-key
    attempt_mode: unaided
    references:
    - component-record
  - id: next-component
    kind: next_step
    title: Choose the next component from evidence, not ambition
    body: Repeat when the selected criteria need another comparable exposure. Regress when control, recovery
      or prerequisites are insufficient. Progress one variable only when the existing plan or qualified
      instruction permits it. Seek instruction when component choice, technique, dose, surface, equipment
      or readiness is unknown. Stop when safety or recovery rules require it. Keep coordination, reaction,
      speed, power and agility findings separate; broader athletic capability requires separately appropriate
      evidence.
  checks:
  - id: classification-key
    title: Check the component classifications
    body: A primarily observes coordination. B primarily observes reaction choice while still requiring
      coordination. C is a speed comparison. D is a power task because resistance is moved rapidly. E
      is reactive agility because whole-body direction changes in response to an unpredictable signal.
      Any case can depend on other capacities, but it does not establish them automatically. A quick tabletop
      sequence has negligible relevance to high-force output, deceleration and whole-body direction change,
      so it cannot establish D or E.
    criteria:
    - Each case has one main capacity and one explicit evidence limit.
    - Reaction is separated from movement speed and coordination.
    - Power includes rapid force rather than speed alone.
    - Agility includes whole-body direction change and task or stimulus response.
  - id: route-check
    title: Check the route and prerequisites
    body: A complete route names one component and uses either the complete low-risk coordination default,
      an unchanged existing-plan component, or instruction-first. Speed, power and agility attempts require
      their existing plan, known technique, appropriate environment and relevant prerequisites; this guide
      supplies none by implication. Materials, support, dose, criteria, recovery and stop conditions are
      fixed. Missing prerequisites lead to instruction or defer, and every untested capacity is listed.
    criteria:
    - The selected route matches the defined component and current authority.
    - Prerequisite unknowns are not hidden or converted into permission.
    - Dose and technique are not improvised from the guide.
    - The evidence boundary excludes the other untested capacities.
  - id: comparison-key
    title: Check the changed-condition decision
    body: Progression is not supported. Shoes, surface and cueing changed, so the faster result is not
      comparable, and the same deceleration criterion remained unmet. The record can show that the second
      exposure occurred under changed conditions and that one criterion remained a concern. It cannot
      establish improvement, cause, power, straight-line speed, coordination across other tasks or safe
      reactive agility. A defensible next step is to restore comparable conditions, regress, or seek plan-specific
      instruction before progression.
    criteria:
    - Changed surface footwear and cueing are identified as comparison limits.
    - Faster time does not override the repeated technique defect.
    - Progression is withheld pending comparable or qualified evidence.
    - Untested capacities remain explicitly unknown.
