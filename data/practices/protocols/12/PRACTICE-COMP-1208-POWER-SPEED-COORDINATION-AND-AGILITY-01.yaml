meaning_and_fit:
  purpose: Classify four distinct movement capacities, select a route whose prerequisites are already
    met, and compare one bounded practice component without treating a coordination drill as proof of
    athletic power, speed or agility.
  why_recommended: Classify four distinct movement capacities, select a route whose prerequisites are
    already met, and compare one bounded practice component without treating a coordination drill as proof
    of athletic power, speed or agility.
  claims:
  - statement: Classify four distinct movement capacities, select a route whose prerequisites are already
      met, and compare one bounded practice component without treating a coordination drill as proof of
      athletic power, speed or agility.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The 2026 ACSM position-stand summary distinguishes strength, hypertrophy, power and physical-function
      outcomes; emphasizes consistent resistance training over needless complexity; and recommends individualizing
      training to goals, enjoyment and safety rather than using one rigid prescription.
    classification: professional_or_public_standard
    source_ids:
    - SRC-ACSM-2026-RESISTANCE-TRAINING
    limitations: Guidance for resistance training in healthy adults, not medical clearance, rehabilitation
      direction, a sport-specific program or evidence that this product-authored two-session practice
      causes strength or power gains. Specific loads and volumes in the source are not adopted as universal
      learner instructions.
  - statement: Professional exercise programming treats strength, endurance and power as muscular-fitness
      components and balance, agility and reaction time as neuromotor components; progression and modification
      should respond to current health status, goals, conditioning and accessibility, with periodic reevaluation.
    classification: professional_or_public_standard
    source_ids:
    - SRC-ACSM-EP-COMPONENT-PROGRESSION
    limitations: A certification task outline defining professional knowledge and skill, not a complete
      training prescription, participant assessment, medical clearance or validation of the product-authored
      route matrix and evidence checks.
  - statement: The NSCA manual separates rapid-force, speed and agility demands, describes agility as
      high-speed change of direction, and emphasizes suitable strength or force-absorption preparation
      plus managed rest and volume for demanding speed, agility and plyometric work.
    classification: professional_or_public_standard
    source_ids:
    - SRC-NSCA-STRENGTH-CONDITIONING-BASICS
    limitations: An older introductory professional manual, not current medical guidance, an individualized
      readiness determination or authority for an unqualified learner to begin sprint, jump, loaded-power
      or change-of-direction training. The product supplies no such program.
  applicability_question: Does a voluntary, bounded Power, speed, coordination, and agility practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Power, speed, coordination, and agility as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use eye gaze, a switch, larger targets, verbal selection, slower cues or an
    existing therapist-approved movement for the coordination route. Use a seated or equipment-supported
    route when it preserves the selected component. A support changes conditions but does not reduce dignity.
    Never simulate disability, catch a falling person, improvise a sprint, jump, loaded explosive movement
    or rapid direction change. Existing clinical, rehabilitation and sport plans control physical progression.
  opportunity_considerations: Use the supplied component cards, route matrix, prerequisite screen and
    session record. The default requires three large labeled cards on a stable table within comfortable
    reach and an optional willing cue giver. A person with an existing suitable program may instead document
    one already-prescribed speed, power or agility component without changing its dose. Otherwise prepare
    the supplied qualified-instruction brief. Accuracy, control, recovery and stop rules take priority
    over speed or force.
  prerequisites:
  - Use the supplied component cards, route matrix, prerequisite screen and session record. The default
    requires three large labeled cards on a stable table within comfortable reach and an optional willing
    cue giver. A person with an existing suitable program may instead document one already-prescribed
    speed, power or agility component without changing its dose. Otherwise prepare the supplied qualified-instruction
    brief. Accuracy, control, recovery and stop rules take priority over speed or force.
  dependencies: []
  safe_alternatives:
  - Use eye gaze, a switch, larger targets, verbal selection, slower cues or an existing therapist-approved
    movement for the coordination route. Use a seated or equipment-supported route when it preserves the
    selected component. A support changes conditions but does not reduce dignity. Never simulate disability,
    catch a falling person, improvise a sprint, jump, loaded explosive movement or rapid direction change.
    Existing clinical, rehabilitation and sport plans control physical progression.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Power, speed, coordination, and agility differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Power, speed, coordination,
    and agility as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied component cards, route matrix, prerequisite screen and session record. The
    default requires three large labeled cards on a stable table within comfortable reach and an optional
    willing cue giver. A person with an existing suitable program may instead document one already-prescribed
    speed, power or agility component without changing its dose. Otherwise prepare the supplied qualified-instruction
    brief. Accuracy, control, recovery and stop rules take priority over speed or force. Goal: Classify
    four distinct movement capacities, select a route whose prerequisites are already met, and compare
    one bounded practice component without treating a coordination drill as proof of athletic power, speed
    or agility. Scope: The complete default is a low-risk tabletop coordination and reaction exercise.
    Speed, power and agility routes use only an existing qualified or competently established plan, or
    instruction-first preparation. No sprint, jump, loaded explosive movement, fall response or rapid
    direction change is prescribed by this practice. Time and effort: About thirty minutes for classification
    and route planning plus two five-to-ten-minute bounded sessions on separate suitable days, or one
    instruction-first consultation. Adaptation: Use eye gaze, a switch, larger targets, verbal selection,
    slower cues or an existing therapist-approved movement for the coordination route. Use a seated or
    equipment-supported route when it preserves the selected component. A support changes conditions but
    does not reduce dignity. Never simulate disability, catch a falling person, improvise a sprint, jump,
    loaded explosive movement or rapid direction change. Existing clinical, rehabilitation and sport plans
    control physical progression. Keep personal working notes outside the check-in; record only the listed
    observations.


    Reference support:

    ACSM Unveils Landmark 2026 Resistance Training Guidelines — First Update in 17 Years: https://acsm.org/resistance-training-guidelines-update-2026/

    ACSM Certified Exercise Physiologist Exam Content Outline: https://acsm.org/wp-content/uploads/2024/12/ACSM-Certified-Exercise-Physiologist-Exam-Content-Outline.pdf

    Basics of Strength and Conditioning Manual: https://www.nsca.com/contentassets/48a12160221541acbdc048498d77192d/basics_of_strength_and_conditioning_manual.pdf'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use eye gaze, a switch, larger targets, verbal selection, slower cues or an existing
    therapist-approved movement for the coordination route. Use a seated or equipment-supported route
    when it preserves the selected component. A support changes conditions but does not reduce dignity.
    Never simulate disability, catch a falling person, improvise a sprint, jump, loaded explosive movement
    or rapid direction change. Existing clinical, rehabilitation and sport plans control physical progression.
  expected_burden: About thirty minutes for classification and route planning plus two five-to-ten-minute
    bounded sessions on separate suitable days, or one instruction-first consultation.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Power, speed, coordination, and agility protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Power, speed, coordination, and agility action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use eye gaze,
    a switch, larger targets, verbal selection, slower cues or an existing therapist-approved movement
    for the coordination route. Use a seated or equipment-supported route when it preserves the selected
    component. A support changes conditions but does not reduce dignity. Never simulate disability, catch
    a falling person, improvise a sprint, jump, loaded explosive movement or rapid direction change. Existing
    clinical, rehabilitation and sport plans control physical progression.
  actions:
  - stable_id: PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01-A1
    sequence: 1
    title: Classify the four capacities and select one honest route
    instructions: 'Open the component cards and classify the supplied cases before revealing the key.
      Map the chosen real-world goal to coordination, reaction, speed, power or agility without assuming
      they are interchangeable. Complete the prerequisite screen. Select tabletop coordination, existing-plan
      speed, existing-plan power, existing-plan agility, or instruction-first. Fix the exact component,
      materials, environment, support, known dose, accuracy or technique criteria, recovery and stop conditions.
      The tabletop route cannot be relabeled as athletic testing, and missing prerequisites require instruction
      or defer.


      Observation checks: Power speed coordination reaction and agility are not treated as synonyms; The
      chosen route has its stated prerequisites and authority; Materials criteria support recovery and
      stop conditions are fixed before action; A tabletop sequence is never represented as a power speed
      or agility test. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01
      action_stable_id: PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01-A1
      competency_stable_id: '12.08'
