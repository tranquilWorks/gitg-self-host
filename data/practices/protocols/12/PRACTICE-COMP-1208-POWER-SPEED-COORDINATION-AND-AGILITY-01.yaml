  - stable_id: PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01-A3
    sequence: 3
    title: Compare a second exposure and choose a component-specific next step
    instructions: 'After suitable recovery, repeat the tabletop sequence with only the label order or
      an unhurried external cue changed, or repeat the exact existing-plan component only when its plan
      supports it. Compare component-specific accuracy, technique, cue response, support and recovery.
      Decide among repeat, regress, plan-authorized progression, instruction or stop. A faster time is
      not required and cannot compensate for an order, technique or safety error. State which of the other
      three capacities remain untested and open the comparison check only after preserving the decision.


      Observation checks: The second exposure preserves comparison conditions or declares the change;
      Evidence is interpreted only for the selected component; One next step follows accuracy technique
      recovery and prerequisite evidence; Every untested capacity remains explicit rather than inferred.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: Which capacity was actually practiced, what prerequisite and recovery evidence supports
      the next step, and which capacities remain untested?


      Examples: Supportive: Numbered cards reduced two order errors to none at the same comfortable pace,
      and the record correctly limited the result to tabletop coordination with an unhurried cue.


      Mixed: An athlete repeated one existing change-of-direction component, but the second session changed
      surface and footwear, so improvement could not be separated from conditions and no progression followed.


      Contradictory: A participant improvised maximal jumps without established prerequisites, continued
      after loss of landing control and called the result evidence of power and agility.


      Inconclusive: A fast time was reported without a defined component, fixed accuracy or technique
      criteria, route authority, or an observed sequence.'
