instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.07'
  title: Decompose one filing explanation and reconnect it in a new case
  scored: false
  sections:
  - id: decomposition-model
    kind: concept
    title: Components need dependencies and a whole-task check
    body: Decomposition turns a complex performance into observable components without pretending the
      pieces are independent. A prerequisite must be available before a dependent step can work. A milestone
      states a visible criterion, not time spent. Part practice isolates one weak component; integration
      reconnects the pieces and tests their handoffs on a fresh case. Completing every card separately
      does not establish the whole skill. This bounded design exercise does not certify teaching ability,
      expertise or permission for regulated work.
  - id: folder-system
    kind: material
    title: Supplied five-folder rule and six slips
    body: 'Today is Monday. Five folders are labeled TODAY, THIS WEEK, WAITING, REFERENCE and ARCHIVE.
      Apply the first matching rule: (1) completed or expired → ARCHIVE; (2) explicitly waiting on another
      person → WAITING; (3) an open action due today → TODAY; (4) an open action due Tuesday through Sunday
      → THIS WEEK; (5) reusable information with no action → REFERENCE. Supplied slips: A completed receipt;
      B waiting for Pat’s approval, due today; C submit form, due today; D call supplier, due Thursday;
      E torque table, no action; F expired coupon. Correct folders are A Archive, B Waiting, C Today,
      D This Week, E Reference, F Archive. The precedence rule resolves B’s overlap.'
  - id: worked-path
    kind: worked_example
    title: Example decomposition on a different sorting rule
    body: 'A learner explaining a three-bin book return first defines done: a new card reaches the correct
      bin and the learner can state the deciding field. They identify prerequisites—read return date before
      comparing it with today—and practice that comparison alone. Their milestone is four supplied cards
      classified with the deciding field named. In the whole-task check, an overdue reserved book exposes
      an untested precedence between “overdue” and “reserved.” The path returns to that handoff rather
      than claiming that separate card success proved integration.'
  - id: path-template
    kind: material
    title: Learning-path and handoff record
    body: 'Final performance and observable done condition: __. Components: audience goal | rule order
      | demonstration | understanding check | time/format boundary. For each component: input __; output
      __; prerequisite __; criterion __; current evidence [demonstrated/not tested/needs work] __. First
      weak component: __. Small exercise and stop limit: __. Milestone 1 __; Milestone 2 __; Milestone
      3 __. Whole-task case held back from part practice: __. Predicted handoff risk: __. Actual result:
      __. Broken handoff and next smaller practice: __. Reviewer [self/willing learner]: __.'
  - id: dependency-map
    kind: prompt
    title: Build the dependency map before seeing the key
    body: 'Using the five-folder rule, place these component cards in a defensible dependency order: R
      read the slip fields; P apply precedence; F choose a folder; D demonstrate and name the deciding
      rule; Q ask the learner to classify a fresh slip and explain why. Draw at least four directed links
      and state why each is required. Then classify supplied slip B and identify the exact misconception
      that would occur if due date were checked before waiting status. Preserve the map before opening
      the key.'
    references:
    - folder-system
    - path-template
    check_id: dependency-map-key
    attempt_mode: practice
  - id: progression-model
    kind: concept
    title: Progress from rule use to demonstration to integration
    body: 'Milestone 1: classify A–F with the deciding rule and at least 5/6 correct, with B necessarily
      correct. Milestone 2: explain the precedence rule and demonstrate B and one non-overlap slip without
      silently correcting yourself. Milestone 3: give the full explanation, then let a fresh slip test
      the learner’s application. If B fails, practice precedence before presentation polish. If the fresh
      case fails, locate whether the rule, example, check question or handoff failed. Timing is descriptive
      unless the real requirement makes it essential.'
  - id: integration-test
    kind: prompt
    title: Reconnect the parts on an unseen overlap case
    body: 'Hold back this slip until after the map and component attempt: G “Replace filter—waiting for
      Lee’s measurement—due Friday—open.” Give a three-minute spoken, written or AAC-supported explanation
      of the five-folder system, then ask a willing adult learner to classify G and name the deciding
      rule. If no learner is available, follow your own written explanation literally and label the result
      self-review. Record the chosen folder, stated reason, explanation text used and any prompt or rescue.
      Do not revise before preserving the first integration result.'
    references:
    - folder-system
    - path-template
    check_id: integration-test-key
    attempt_mode: practice
  - id: access-route
    kind: pathway
    title: Adapt representation without changing the rule
    body: Use large labels, color plus text, tactile folder markers, screen-reader-friendly text, signing,
      speech or AAC. Remove the timer when speed is not part of the target. A helper may manipulate cards
      while the learner chooses the rule and folder. Record a self-run as self-review rather than learner
      evidence. An advanced route may add one documented exception only after the base precedence works;
      consequential records, regulated filing and private workplace material are outside this default.
  - id: next-path
    kind: next_step
    title: Send the observed failure back to one component
    body: If G is classified and explained correctly without rescue, test one new non-overlap case before
      adding complexity. If the folder is right but the reason is wrong, practice naming the deciding
      rule. If the explanation omits precedence, revise the rule-order component and rerun a new overlap
      slip. If representation blocked access, change the medium while retaining the decision criterion.
      Record demonstrated, partial, adverse or inconclusive; do not advance from confidence or component
      count.
  checks:
  - id: dependency-map-key
    title: Check the minimum dependency structure
    body: 'A minimal valid chain is R → P → F → D → Q: fields must be read before precedence can be applied;
      precedence selects the controlling rule; a folder follows that rule; a demonstration must expose
      the rule used; and a fresh question can then test application. Additional links such as R → D are
      defensible when explained. Slip B belongs in WAITING because rule 2 is the first match after it
      is confirmed open; checking due date first would incorrectly send it to TODAY. A list without directed
      dependency reasons is partial, even if its order happens to match.'
    criteria:
    - Inputs outputs and dependencies are distinguished
    - Four or more justified links connect the components
    - The precedence misconception is identified
    - Confidence is not substituted for demonstrated status
  - id: integration-test-key
    title: Check the held-back case and evidence label
    body: G belongs in WAITING. It is open, so rule 1 does not apply; it explicitly waits on Lee, so rule
      2 controls before the Friday due date can reach rule 4. WAITING with “because it is due Friday”
      is a correct location for the wrong reason and remains partial. THIS WEEK shows a broken precedence
      handoff. A helper revealing “waiting” is a rescued attempt, not independent application. A willing
      learner’s unprompted correct folder and reason supports this one integrated explanation; self-review
      must remain labeled and neither result establishes general teaching expertise.
    criteria:
    - The held-back overlap case has one rule-grounded answer
    - Correct destination and correct reason are checked separately
    - Prompts and rescues remain visible
    - Learner evidence and self-review are not conflated
