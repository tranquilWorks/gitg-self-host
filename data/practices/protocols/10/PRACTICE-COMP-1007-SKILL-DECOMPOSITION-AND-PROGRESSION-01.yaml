        expected: true
  - stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01-A2
    sequence: 2
    title: Create a progression with supplied component exercises
    instructions: 'Use three milestones: write a four-step sequence with no missing object or location;
      demonstrate it on one slip without skipping a step; then ask a new filing question and correct one
      confusion. Attempt the first weak milestone now and compare it with the stated criterion. Increase
      complexity only after the criterion is met, or reduce the component while keeping its purpose when
      it is not.


      Observation checks: Each milestone has an observable criterion; At least one component exercise
      is attempted; Progression follows demonstrated performance; A failed milestone leads to a smaller
      or revised exercise. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01
      action_stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01-A2
      competency_stable_id: '10.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
