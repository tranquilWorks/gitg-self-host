        - at_least_one_component_exercise_is_attempted
        - progression_follows_demonstrated_performance
        - a_failed_milestone_leads_to_a_smaller_or_revised_exercise
      - measurement_id: c1007_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
