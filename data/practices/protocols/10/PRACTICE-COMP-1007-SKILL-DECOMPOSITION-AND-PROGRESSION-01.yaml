  - stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01-A3
    sequence: 3
    title: Run one integration attempt and find the broken handoff
    instructions: 'Combine the components into a three-minute explanation or equivalent short written
      guide. Use a willing adult learner when available; otherwise follow the guide literally yourself
      and label the check self-review. Test a new slip, note where the sequence or explanation failed,
      and move that weakness back into the learning path. Finishing each component separately is not assumed
      to prove that they work together.


      Observation checks: The components are recombined in an actual attempt; A new example tests more
      than memorized wording; Learner feedback and self-review are distinguished; An integration failure
      changes the next practice step. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Which component looked adequate alone but failed when connected to the rest, and what
      prerequisite did that reveal?


      Examples: Supportive: The learner’s new-slip error exposed an ambiguous category rule, so that rule
      was practiced before repeating the full explanation.


      Mixed: All milestones were listed, but the first integration attempt showed that their handoffs
      had not been tested.


      Contradictory: A checklist of component completion was represented as broad competence without an
      integration attempt.


      Inconclusive: A long course list was created without dependencies, measurable milestones or a task
      that could start immediately.'
