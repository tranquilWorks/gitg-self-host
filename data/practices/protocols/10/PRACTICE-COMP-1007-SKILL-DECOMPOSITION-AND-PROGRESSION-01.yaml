        criteria:
        - the_final_skill_has_an_observable_success_condition
        - prerequisites_and_dependent_components_are_connected
        - current_ability_is_distinguished_from_untested_confidence
        - one_weak_component_is_selected_for_initial_work
      - measurement_id: c1007_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
