meaning_and_fit:
  purpose: Build a small learning path with dependencies, component exercises, measurable milestones and
    one attempt that reconnects the parts.
  why_recommended: Build a small learning path with dependencies, component exercises, measurable milestones
    and one attempt that reconnects the parts.
  claims:
  - statement: Build a small learning path with dependencies, component exercises, measurable milestones
      and one attempt that reconnects the parts.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The 4C/ID instructional-design model organizes complex learning around whole learning tasks,
      supportive and procedural information, and bounded part-task practice, supporting the need to reconnect
      components rather than treating isolated completion as the whole skill.
    classification: professional_or_public_standard
    source_ids:
    - SRC-VAN-MERRIENBOER-4CID-2002
    limitations: An instructional-design model and synthesis, not evidence that this exact five-folder
      decomposition is optimal, not a universal component hierarchy and not certification of teaching
      or skill-design competence.
  applicability_question: Does a voluntary, bounded Skill decomposition and progression practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Skill decomposition and progression as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use written, signed, visual or AAC-supported explanation and an untimed version
    when timing is not part of the real skill. A willing reviewer is optional, but independent learner
    success must not be claimed from self-review.
  opportunity_considerations: 'Default skill: give a clear three-minute explanation of how to organize
    five labeled paper folders. Components are choosing the audience’s goal, ordering steps, demonstrating
    one example, checking understanding and staying within time. Materials are five paper labels, a page
    and an optional timer; speaking can be replaced with an accessible written demonstration.'
  prerequisites:
  - 'Default skill: give a clear three-minute explanation of how to organize five labeled paper folders.
    Components are choosing the audience’s goal, ordering steps, demonstrating one example, checking understanding
    and staying within time. Materials are five paper labels, a page and an optional timer; speaking can
    be replaced with an accessible written demonstration.'
  dependencies: []
  safe_alternatives:
  - Use written, signed, visual or AAC-supported explanation and an untimed version when timing is not
    part of the real skill. A willing reviewer is optional, but independent learner success must not be
    claimed from self-review.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Skill decomposition and progression differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Skill decomposition and progression
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-ARTIFACT-PLAN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default skill: give a clear three-minute explanation of how to organize five labeled paper folders.
    Components are choosing the audience’s goal, ordering steps, demonstrating one example, checking understanding
    and staying within time. Materials are five paper labels, a page and an optional timer; speaking can
    be replaced with an accessible written demonstration. Goal: Build a small learning path with dependencies,
    component exercises, measurable milestones and one attempt that reconnects the parts. Scope: This
    designs and pilots a path for a harmless beginner skill. It does not establish expertise, authorize
    regulated work or assume that every component can be learned independently. Time and effort: Thirty
    minutes to map the skill and two fifteen-minute practice periods. Adaptation: Use written, signed,
    visual or AAC-supported explanation and an untimed version when timing is not part of the real skill.
    A willing reviewer is optional, but independent learner success must not be claimed from self-review.
    Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Blueprints for Complex Learning: The 4C/ID-Model: https://doi.org/10.1007/BF02504993'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use written, signed, visual or AAC-supported explanation and an untimed version
    when timing is not part of the real skill. A willing reviewer is optional, but independent learner
    success must not be claimed from self-review.
  expected_burden: Thirty minutes to map the skill and two fifteen-minute practice periods.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Skill decomposition and progression protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Skill decomposition and progression action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use written,
    signed, visual or AAC-supported explanation and an untimed version when timing is not part of the
    real skill. A willing reviewer is optional, but independent learner success must not be claimed from
    self-review.
  actions:
  - stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01-A1
    sequence: 1
    title: Map the output and the dependencies that make it possible
    instructions: 'Define done as a listener or reader being able to file a new labeled slip correctly.
      Put the five components on cards and connect prerequisites: the filing rule must be clear before
      a demonstration can illustrate it; a check question must match the taught rule. Mark one component
      you can already perform and one that needs work. Do not equate familiarity with having demonstrated
      it.


      Observation checks: The final skill has an observable success condition; Prerequisites and dependent
      components are connected; Current ability is distinguished from untested confidence; One weak component
      is selected for initial work. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01
      action_stable_id: PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01-A1
      competency_stable_id: '10.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1007_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1007_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
