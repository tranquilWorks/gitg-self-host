meaning_and_fit:
  purpose: Adapt pace, medium, environment or response method to a learner’s stated needs, then check
    whether the underlying skill is more accessible without changing what the skill means.
  why_recommended: Adapt pace, medium, environment or response method to a learner’s stated needs, then
    check whether the underlying skill is more accessible without changing what the skill means.
  claims:
  - statement: Adapt pace, medium, environment or response method to a learner’s stated needs, then check
      whether the underlying skill is more accessible without changing what the skill means.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: CAST describes UDL as designing accessible and challenging learning environments, reducing
      environmental barriers and choosing options according to learning goals rather than prescribing
      a fixed checklist.
    classification: professional_or_public_standard
    source_ids:
    - SRC-CAST-UDL-ACCESS-FAQ
    limitations: Not a diagnosis, fixed learning-style taxonomy, prescribed route test, causal validation
      of the adaptation package or evidence of actual learner improvement. The grid and simulated responses
      are original educational materials.
  applicability_question: Does a voluntary, bounded Accessible and differentiated learning practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Accessible and differentiated learning as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use the learner’s chosen communication method and allow stopping without penalty.
    A self-test is valid for your own access barrier but not an independent test with another learner.
    Seek qualified educational or accessibility support for persistent or complex needs.
  opportunity_considerations: 'Default task: follow a three-position, two-move route on a paper grid from
    A1 to A2 to B2. The learning goal is interpreting ordered route instructions, not reading tiny print,
    speaking quickly or using a particular hand. Invite a willing adult to identify an unnecessary barrier,
    or examine a barrier you personally encounter. Use large print, tactile markers, audio or a slower
    presentation as appropriate.'
  prerequisites:
  - 'Default task: follow a three-position, two-move route on a paper grid from A1 to A2 to B2. The learning
    goal is interpreting ordered route instructions, not reading tiny print, speaking quickly or using
    a particular hand. Invite a willing adult to identify an unnecessary barrier, or examine a barrier
    you personally encounter. Use large print, tactile markers, audio or a slower presentation as appropriate.'
  dependencies: []
  safe_alternatives:
  - Use the learner’s chosen communication method and allow stopping without penalty. A self-test is valid
    for your own access barrier but not an independent test with another learner. Seek qualified educational
    or accessibility support for persistent or complex needs.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Accessible and differentiated learning differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Accessible and differentiated
    learning as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-AUDIT-REDESIGN
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default task: follow a three-position, two-move route on a paper grid from A1 to A2 to B2. The
    learning goal is interpreting ordered route instructions, not reading tiny print, speaking quickly
    or using a particular hand. Invite a willing adult to identify an unnecessary barrier, or examine
    a barrier you personally encounter. Use large print, tactile markers, audio or a slower presentation
    as appropriate. Goal: Adapt pace, medium, environment or response method to a learner’s stated needs,
    then check whether the underlying skill is more accessible without changing what the skill means.
    Scope: This is an access-focused teaching trial, not diagnosis or proof of a fixed learning style.
    One person’s preferred adaptation should not be generalized to everyone with a similar label. Time
    and effort: Ten minutes to agree the goal and barrier, two short attempts and fifteen minutes to compare.
    Adaptation: Use the learner’s chosen communication method and allow stopping without penalty. A self-test
    is valid for your own access barrier but not an independent test with another learner. Seek qualified
    educational or accessibility support for persistent or complex needs. Keep personal working notes
    outside the check-in; record only the listed observations.


    Reference support:

    CAST UDL Guidelines frequently asked questions: https://udlguidelines.cast.org/more/frequently-asked-questions/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the learner’s chosen communication method and allow stopping without penalty.
    A self-test is valid for your own access barrier but not an independent test with another learner.
    Seek qualified educational or accessibility support for persistent or complex needs.
  expected_burden: Ten minutes to agree the goal and barrier, two short attempts and fifteen minutes to
    compare.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Accessible and differentiated learning protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Accessible and differentiated learning action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the learner’s
    chosen communication method and allow stopping without penalty. A self-test is valid for your own
    access barrier but not an independent test with another learner. Seek qualified educational or accessibility
    support for persistent or complex needs.
  actions:
  - stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01-A1
    sequence: 1
    title: Separate the skill from the barrier around it
    instructions: 'State the skill criterion: follow the sequence to the correct destination and explain
      the order. Ask what makes the instruction hard to access—language, visual size, pace, noise, working
      load or response format. Do not infer a diagnosis. Identify which demand is essential to the skill
      and which is incidental, such as tiny type or a speed limit that the task does not require.


      Observation checks: The underlying skill has a clear criterion; The learner identifies or confirms
      the barrier; Essential and incidental demands are separated; No diagnosis or fixed learning-style
      label is assigned. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01
      action_stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01-A1
      competency_stable_id: '10.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1014_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1014_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_underlying_skill_has_a_clear_criterion
        - the_learner_identifies_or_confirms_the_barrier
        - essential_and_incidental_demands_are_separated
        - no_diagnosis_or_fixed_learning_style_label_is_assigned
      - measurement_id: c1014_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1014_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01-A2
    sequence: 2
    title: Agree an access adaptation and attempt the same kind of task
    instructions: 'Agree on one adaptation package, recording each changed component, such as presenting
      each direction as an audio step with a repeat option. Keep route complexity and the success criterion
      comparable; preserve other established supports. Use a new route of the same length and ask the
      learner to attempt it without answer-revealing hints. Record whether the change reduced the identified
      barrier and whether it created a different one.


      Observation checks: The adaptation is chosen with the learner; The skill standard and route complexity
      remain comparable; A real adapted attempt occurs; New barriers and support use are recorded. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01
      action_stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01-A2
      competency_stable_id: '10.14'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1014_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1014_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_adaptation_is_chosen_with_the_learner
        - the_skill_standard_and_route_complexity_remain_comparable
        - a_real_adapted_attempt_occurs
        - new_barriers_and_support_use_are_recorded
      - measurement_id: c1014_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1014_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1014-ACCESSIBLE-AND-DIFFERENTIATED-LEARNING-01-A3
    sequence: 3
    title: Review access and learning as separate questions
    instructions: 'Ask whether the instructions became usable and check the actual route result. A comfortable
      experience may still reveal a concept error, while a correct result may still impose excessive burden.
      Revise the teaching or adaptation accordingly and agree whether to keep it. Record the specific
      learner and task boundary without collecting sensitive identity details or claiming population-wide
      effectiveness.


      Observation checks: Usability and skill performance are reviewed separately; The learner’s feedback
      informs the next version; The retained adaptation has a specific reason; One trial is not presented
      as a universal accessibility solution. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which demand was an unnecessary barrier, and what evidence shows that the real skill—not
      a lowered or different target—was practiced?


      Examples: Supportive: Larger tactile route markers removed a visual barrier while the learner still
      had to interpret the same-length ordered route.


      Mixed: The material became easier to use, but a remaining sequence misunderstanding required a different
      explanation.


      Contradictory: The standard was abandoned without acknowledgment, or a learner’s diagnosis was guessed
      from one difficulty.


      Inconclusive: An adaptation was selected from a stereotype and declared effective without a learner
      attempt or feedback.'
    expected_time: 15-25 minutes
