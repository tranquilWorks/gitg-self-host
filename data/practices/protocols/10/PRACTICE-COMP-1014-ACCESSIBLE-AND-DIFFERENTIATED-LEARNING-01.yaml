instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.14'
  title: Reduce a barrier while preserving the learning target
  scored: false
  sections:
  - id: access-model
    kind: concept
    title: Change access demands without replacing the construct
    body: The construct is the actual skill to be demonstrated. Here it is interpreting an ordered route
      and explaining its order, not reading tiny print, responding quickly or moving a particular hand.
      Ask the learner which barrier matters. An adaptation is a testable design choice, not a diagnosis
      or proof of a fixed learning style. Preserve required supports and the meaningful target; comfort,
      correctness and burden are separate observations.
  - id: route-packet
    kind: material
    title: Complete grid and two comparable routes
    body: Draw nine cells with columns A, B, C from left to right and rows 1, 2, 3 from bottom to top.
      Bottom row is A1 B1 C1, middle A2 B2 C2, top A3 B3 C3. R1 is A1, A2, B2. Fresh R2 is C1, C2, B2.
      Each has three positions and two moves, first upward then horizontal. Criterion is to visit every
      position in order and explain the order; reaching B2 alone is insufficient. Use chosen speech, pointing,
      tactile markers or AAC without helper answer selection. No speed criterion applies. Keep reference
      and other established supports available on both attempts.
  - id: worked-shapes
    kind: worked_example
    title: Different example — usable shape cards can still be in the wrong order
    body: A learner must place circle, square, triangle in that order. Larger separate cards become easier
      to see, but the learner places circle, triangle, square. Usability improved by their report; sequence
      performance still misses the target. Keep the helpful size while explaining order and checking a
      fresh comparable case. Declaring success solely because the cards feel comfortable would discard
      the learning standard.
  - id: access-record
    kind: material
    title: Access trial record
    body: 'Route (live learner, self-test or supplied simulation): __. Voluntary participation: __. Skill
      criterion: __. Essential demands: __. Learner-stated incidental barrier: __. Established supports:
      __. R1 exact response and prompts: __. R1 usability report: __. Agreed adaptation and components:
      __. R2 exact response, explanation and prompts: __. R2 usability and new barriers: __. Comparability
      limits: __. Keep, revise or stop and reason: __. Next comparable route: __. Do not collect diagnosis
      or sensitive identity details to complete this record.'
  - id: barrier-prompt
    kind: prompt
    title: Identify the barrier and preserve the standard
    body: In this fictional case the route is printed in crowded 6-point type with all arrows together.
      The learner asks for bigger labels and one instruction at a time. Before opening the check, separate
      the essential skill from incidental demands and propose a presentation adaptation. State what stays
      comparable across R1 and R2, which existing supports stay available, what the helper may do, and
      why a correct destination alone is insufficient. Treat larger labels plus chunking as a two-component
      presentation package, not an isolated causal variable.
    references:
    - route-packet
    - access-record
    check_id: barrier-key
    attempt_mode: practice
  - id: comparison-model
    kind: concept
    title: Record usability and performance without claiming causation
    body: A fresh route reduces copying of the old answer but does not remove effects of practice, familiarity
      or support. Matched route length and criteria help comparison; they do not make one trial a controlled
      experiment. Larger labels and chunking change two components together, so this package cannot isolate
      which mattered. Correctness with excessive burden needs further adaptation; greater comfort with
      a sequence error needs further teaching. Preserve the learner's feedback rather than infer it from
      the output.
  - id: adapted-attempt
    kind: prompt
    title: Audit an adapted attempt
    body: Analyze this supplied fictional record before opening the key. R1 response is A1, B1, B2; learner
      says I lost the arrow. Agreed package is 18-point labels, one position per card and optional repetition
      without pointing to the answer. R2 response is C1, C2, B2; learner explains start at C1, move up,
      then left. Learner reports easier to follow but requests audio when fatigued. Classify route performance,
      usability, comparability and next action; identify why this is neither real learner evidence nor
      proof that print size caused learning. On a live or self route use actual responses, not this transcript.
    references:
    - route-packet
    - access-record
    check_id: adapted-attempt-key
    attempt_mode: practice
  - id: access-path
    kind: pathway
    title: Offer chosen supports without choosing the answer
    body: Use large print, tactile cells, sequential audio with repeat, AAC, quiet space or more time
      as chosen by the learner. A helper may operate a marker at the learner's direction but must not
      choose the next cell. Record assistance and new barriers. Stop without penalty; persistent or complex
      needs can require qualified accessibility or educational support. A self-test concerns your own
      barrier, and a simulation supports planning only, not an independent learner result.
  - id: next-trial
    kind: next_step
    title: Keep helpful access and check another comparable case
    body: Retain supports the learner finds useful and agree a later fresh route with the same criterion,
      such as A3, A2, B2 with its changed initial direction recorded. If testing a new component, change
      and record that component while retaining needed aids; do not remove accommodations to prove independence.
      Ask about fatigue and usability again. Success on one supported route does not establish durable
      learning, a diagnosis or a population-wide accessibility solution.
  checks:
  - id: barrier-key
    title: Check the access design
    body: The essential demand is preserving all three positions and explaining their order. Tiny print,
      crowded simultaneous arrows, speed and a specific response hand are incidental here. The requested
      presentation package can use larger labels with one instruction at a time and optional repeat; preserve
      established supports, route length and criterion on both attempts. A helper can present material
      but cannot select positions. A shared B2 destination does not validate an incorrect intermediate
      cell. Two changed presentation components do not isolate a single cause, and the fictional request
      is not a diagnosis.
    criteria:
    - Construct and incidental barriers distinguished
    - Learner request informs adaptation
    - Criterion and supports preserved
    - Package and causal limits explicit
  - id: adapted-attempt-key
    title: Check performance and usability separately
    body: R1 substitutes B1 for A2 and therefore fails the ordered-route criterion despite ending at B2.
      R2 follows C1, C2, B2 and explains up then left, satisfying this supported fictional task. The learner's
      easier-to-follow report concerns usability; the audio request identifies a remaining fatigue-related
      access need. Keep the agreed helpful package and explore audio with consent on a comparable fresh
      trial. These are simulated observations, not actual learner improvement. Practice and two changed
      presentation components prevent a causal attribution to print size alone; no durability, diagnosis
      or population claim follows.
    criteria:
    - Intermediate error identified despite correct destination
    - R2 sequence and explanation checked
    - Usability and remaining barrier retained
    - Simulation support and causal limits preserved
