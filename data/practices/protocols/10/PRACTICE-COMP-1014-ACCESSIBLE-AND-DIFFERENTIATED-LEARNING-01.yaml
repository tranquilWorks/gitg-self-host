      Accessible and differentiated learning; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use the learner’s chosen communication method and allow stopping without penalty. A self-test is
      valid for your own access barrier but not an independent test with another learner. Seek qualified
      educational or accessibility support for persistent or complex needs.
    cultural_context:
    - Adapt the expression of Accessible and differentiated learning to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use the learner’s chosen communication method and allow stopping without penalty. A self-test is
      valid for your own access barrier but not an independent test with another learner. Seek qualified
      educational or accessibility support for persistent or complex needs.
  pause_conditions:
  - Pause Accessible and differentiated learning when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Accessible and differentiated learning practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Accessible and differentiated learning situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
