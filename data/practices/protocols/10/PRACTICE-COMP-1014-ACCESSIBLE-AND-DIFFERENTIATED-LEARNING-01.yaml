  - The standard was abandoned without acknowledgment, or a learner’s diagnosis was guessed from one difficulty.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Accessible and differentiated learning explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Accessible and differentiated learning
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Accessible and differentiated learning observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Accessible and differentiated learning rules withhold observations older than
    90 days; no unrecorded retention or carry-forward assumption applies.
