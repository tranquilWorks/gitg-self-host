        expected: true
  - stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01-A3
    sequence: 3
    title: Review after a day and test a modest variation
    instructions: 'The next day, recall the original sequence before looking. Then explain how you would
      update the aid if the room changed from four to six while every other step stayed the same. Keep
      old and new versions distinct so an outdated cue is not silently reused. Choose a further review
      interval based on the actual errors and the importance of remembering, without inferring broad memory
      improvement.


      Observation checks: A next-day recall is recorded with its actual delay; Original and revised sequence
      versions are distinguished; A changed detail is incorporated without scrambling the order; The next
      review follows observed errors rather than streak pressure. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the cue help you retrieve the information, or only make it feel familiar when
      you saw it again?


      Examples: Supportive: The learner recalled five steps unaided, used a cue for the return box and
      revised that cue before the next-day check.


      Mixed: The route was remembered but a changed room number revealed interference from the older version.


      Contradictory: A necessary safety reminder was removed to test memory, or success on the sequence
      was claimed as a general intelligence gain.


      Inconclusive: The sequence was recognized on the page but never recalled after a delay.'
