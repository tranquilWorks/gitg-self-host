instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.06'
  title: Retrieve, repair and version one short sequence
  scored: false
  sections:
  - id: memory-model
    kind: concept
    title: Separate recognition, retrieval and cue use
    body: Recognition is noticing that an answer looks familiar when it is present. Retrieval is producing
      the target before seeing the complete reference. A cue can support retrieval without making the
      attempt unaided; looking up the full answer is useful correction but is not recall. Record those
      routes separately. Chunking groups related steps into a meaningful unit, and a mnemonic supplies
      a route back to them. Neither changes a fixed personal worth or proves broader memory capacity.
      A delayed attempt is informative only when the actual delay, target version and available cues remain
      visible. This original exercise is not diagnosis, rehabilitation or a validated memory program.
  - id: worked-route
    kind: worked_example
    title: Example on a different six-step route
    body: 'Example target: enter at the red gate; sign the visitor page; take a yellow tag; go to room
      two; return the tag to the green tray; leave through the red gate. One learner groups this as arrival
      [red gate, sign], visit [yellow tag, room two], departure [green tray, red gate]. Their route image
      is red pen, yellow tag, door 2, green tray, red gate. After a break they say room three. They mark
      that item incorrect before checking, then change only the cue to “yellow tag touches a large 2.”
      Seeing room two on the page would be recognition; producing it from that cue is cued recall.'
  - id: visitor-sequence
    kind: material
    title: Supplied fictional target and three chunks
    body: 'Target V1, revision 1, 8 September 2026: (1) enter at the west door; (2) check in at the desk;
      (3) collect a purple pass; (4) go to room four; (5) return the pass to the blue box; (6) leave by
      the same west door. The suggested chunks are arrival [1–2], visit [3–4], departure [5–6]. The chunk
      labels are aids, not replacement answers: order, object, color, number and repeated exit door still
      matter. This is a fictional memory target, never a real access or safety procedure.'
  - id: recall-record
    kind: material
    title: Preserve the attempt before correction
    body: 'Target version: __. Encoding route and supports: __. Encoding ended at: __. Recall began at:
      __. Actual delay: __. First response in order: __. For each position mark U [unaided], C [specific
      cue used], L [full item looked up], O [omitted] or W [wrong]: 1 __ 2 __ 3 __ 4 __ 5 __ 6 __. Exact-position
      correct count: __/6. First error or uncertainty: __. Reference checked after the attempt [yes/no].
      Exact cue repair: __. Keep the first response; do not replace it with the key.'
  - id: first-recall
    kind: prompt
    title: First retrieval after a real short break
    body: Read or hear Target V1 once and create one cue route. Put the complete target away. Do an unrelated
      activity for at least five minutes; record the actual times rather than estimating a delay. Then
      write or say all six steps in order without the reference. Mark U, C, L, O or W for every position
      before opening the key. A cue may be used, but label it. Stop after one preserved response; repeated
      guesses are practice, not the first attempt.
    references:
    - visitor-sequence
    - recall-record
    check_id: first-recall-key
    attempt_mode: practice
  - id: repair-one-error
    kind: concept
    title: Repair the smallest demonstrated retrieval failure
    body: 'Compare each position with V1. An item in the wrong position is wrong even when all nouns appear.
      For the first omission, substitution or order error, make one cue more discriminating: bind the
      color to its object, the room number to the pass, or the return container to departure. If every
      item was correct, record maintenance and test the unchanged route later; do not invent improvement.
      Keep exposure, cue use and correction separate so a perfect corrected copy is not presented as the
      initial recall.'
  - id: version-check
    kind: prompt
    title: Delayed retrieval and one controlled version change
    body: 'On the next calendar day, or after the longest honest delay available, retrieve V1 before looking
      and preserve the actual response and delay. Then read Target V2: only step 4 changes from room four
      to room six; every other word and position remains V1. Put both versions away and produce V2 once.
      Label whether step 4 came from V2, interfered from V1, used a cue or was looked up. List any other
      position that changed accidentally. If the delay did not occur, label this a prepared future check,
      not delayed evidence.'
    references:
    - visitor-sequence
    - recall-record
    check_id: version-check-key
    attempt_mode: practice
  - id: access-and-safety
    kind: pathway
    title: Keep supports available and stakes low
    body: 'Use large print, audio, tactile markers, speech entry, fewer items per displayed chunk or a
      helper who records the learner’s chosen response. Report the support in every attempt. Necessary
      medication, emergency, access-control and safety reminders must remain available; never remove one
      to create a memory test. New, worsening or concerning memory changes need appropriate clinical evaluation,
      not harder self-testing. An advanced route may use a longer harmless list, but changes only one
      variable at a time: length, delay, cue availability or version similarity.'
  - id: next-review
    kind: next_step
    title: Choose the next interval from the error record
    body: If V1 and V2 were exact with the same supports, schedule one longer interval on the same harmless
      target before raising length. If one position failed, keep length and practice the repaired cue
      on one future retrieval. If several positions failed, shorten the target or strengthen chunk meaning.
      Record improved, unchanged, worse, mixed or not comparable. One sequence does not demonstrate general
      transfer; test any later real use with its normal aids still present.
  checks:
  - id: first-recall-key
    title: Check the first response position by position
    body: 'V1 in exact order is: west door; desk check-in; purple pass; room four; blue box return; same
      west door exit. Award one exact-position item only when the object, distinguishing detail and order
      are correct. “Door, desk, pass, room, box, door” preserves categories but omits west, purple, four
      and blue; it is not 6/6. “West door, desk, room four, purple pass, blue box, west door” has positions
      3 and 4 reversed. Report U/C/L/O/W separately; C and L can support learning but are not unaided
      recall. A valid repair names the exact failed feature and changes one cue after preserving the response.'
    criteria:
    - The complete six-position key is separate from the prompt
    - Recognition cue use lookup omission and error remain distinct
    - Order and distinguishing details are checked
    - Correction follows rather than overwrites the attempt
  - id: version-check-key
    title: Check original and changed versions without blending them
    body: V1 remains west door, desk, purple pass, room four, blue box, west door. V2 is identical except
      position 4 is room six. Saying room four in the V2 attempt is old-version interference, not a correct
      answer because it was once learned. Changing purple to another color or blue box to another container
      is collateral error. A completed record includes the actual delay and retrieval route for both attempts.
      When no delay occurred, the correct disposition is prepared or immediate practice—not a delayed
      pass. A clean V2 response supports only this controlled version update under recorded supports.
    criteria:
    - V1 and V2 differ at exactly one declared position
    - Old-version interference is visible
    - Unplanned changes at other positions are retained
    - The actual delay controls the evidence label
