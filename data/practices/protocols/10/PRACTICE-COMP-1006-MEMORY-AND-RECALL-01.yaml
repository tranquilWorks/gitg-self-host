meaning_and_fit:
  purpose: Use manageable chunks, meaningful cues and spaced recall to remember a short sequence while
    distinguishing memory practice from unsupported claims about general working-memory capacity.
  why_recommended: Use manageable chunks, meaningful cues and spaced recall to remember a short sequence
    while distinguishing memory practice from unsupported claims about general working-memory capacity.
  claims:
  - statement: Use manageable chunks, meaningful cues and spaced recall to remember a short sequence while
      distinguishing memory practice from unsupported claims about general working-memory capacity.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: In the reported foreign-language vocabulary experiments, repeated retrieval after initial
      learning produced substantially better delayed recall than repeated study without continued retrieval,
      supporting the distinction between seeing material again and attempting to retrieve it.
    classification: empirical_finding
    source_ids:
    - SRC-KARPICKE-ROEDIGER-RETRIEVAL-2008
    limitations: A specific controlled vocabulary-learning study, not a universal spacing schedule, general
      working-memory intervention, clinical assessment, proof of transfer or validation of this product-authored
      visitor-sequence exercise.
  applicability_question: Does a voluntary, bounded Memory and recall practice fit the person's current
    role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Memory and recall as not applicable, consciously unchosen, or deferred
    without penalty when the role, pathway, capacity, authority, opportunity, or safe context is absent.
  readiness_considerations: Use spoken, visual or tactile cues and fewer items per chunk. Never practice
    by withholding a necessary real-world safety aid or medication reminder. New or concerning memory
    changes warrant appropriate evaluation rather than self-testing through this exercise.
  opportunity_considerations: 'Memorize this fictional visitor sequence: enter at the west door; check
    in at the desk; collect a purple pass; go to room four; return the pass to the blue box; leave by
    the same door. Use six cards or one accessible recording. No real security procedure or private information
    is involved.'
  prerequisites:
  - 'Memorize this fictional visitor sequence: enter at the west door; check in at the desk; collect a
    purple pass; go to room four; return the pass to the blue box; leave by the same door. Use six cards
    or one accessible recording. No real security procedure or private information is involved.'
  dependencies: []
  safe_alternatives:
  - Use spoken, visual or tactile cues and fewer items per chunk. Never practice by withholding a necessary
    real-world safety aid or medication reminder. New or concerning memory changes warrant appropriate
    evaluation rather than self-testing through this exercise.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Memory and recall differently while preserving consent, evidence limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Memory and recall as inferiority;
    competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Memorize this fictional visitor sequence: enter at the west door; check in at the desk; collect
    a purple pass; go to room four; return the pass to the blue box; leave by the same door. Use six cards
    or one accessible recording. No real security procedure or private information is involved. Goal:
    Use manageable chunks, meaningful cues and spaced recall to remember a short sequence while distinguishing
    memory practice from unsupported claims about general working-memory capacity. Scope: This practices
    one memory target. It is not cognitive diagnosis, rehabilitation or a promise that training a sequence
    increases intelligence or general memory ability. Time and effort: Ten minutes to encode, five minutes
    after a short break, and ten minutes the next day. Adaptation: Use spoken, visual or tactile cues
    and fewer items per chunk. Never practice by withholding a necessary real-world safety aid or medication
    reminder. New or concerning memory changes warrant appropriate evaluation rather than self-testing
    through this exercise. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    The Critical Importance of Retrieval for Learning: https://doi.org/10.1126/science.1152408'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken, visual or tactile cues and fewer items per chunk. Never practice by
    withholding a necessary real-world safety aid or medication reminder. New or concerning memory changes
    warrant appropriate evaluation rather than self-testing through this exercise.
  expected_burden: Ten minutes to encode, five minutes after a short break, and ten minutes the next day.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Memory and recall protocol to rank worth, coerce participation, demand disclosure, override
    rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Memory and recall action, a polished artifact, agreement, confidence, speed,
    independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken,
    visual or tactile cues and fewer items per chunk. Never practice by withholding a necessary real-world
    safety aid or medication reminder. New or concerning memory changes warrant appropriate evaluation
    rather than self-testing through this exercise.
  actions:
  - stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01-A1
    sequence: 1
    title: Chunk and cue the sequence without overloading it
    instructions: 'Group the six steps into arrival, visit and departure, with two actions in each. Make
      one simple story or mental route linking west door, desk, purple pass, room four and blue box. Read
      or hear the sequence once, then explain the three chunks. Use an external cue card when needed;
      the purpose is a workable memory aid, not forcing a fixed span without support.


      Observation checks: The six steps are grouped into meaningful chunks; A concrete mnemonic or route
      connects the items; The original order is checked for accuracy; Support is allowed rather than treated
      as a failure. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01
      action_stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01-A1
      competency_stable_id: '10.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1006_a1_primary
      transfer_disposition: context_bound
