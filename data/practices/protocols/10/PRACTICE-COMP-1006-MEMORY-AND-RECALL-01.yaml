        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01-A2
    sequence: 2
    title: Retrieve after a break and correct the exact error
    instructions: 'After a short unrelated activity, recall the sequence without seeing the complete reference.
      Mark each step unaided, recalled with a cue or looked up. Check the original and correct an omitted
      location, color or order using a more distinct cue. Do not restart repeatedly until a lucky perfect
      run can be presented as the first attempt.


      Observation checks: A recall attempt follows a real break; Unaided cued and looked-up items are
      separated; The error is checked against the original sequence; The cue is revised for a specific
      omission or order error. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01
      action_stable_id: PRACTICE-COMP-1006-MEMORY-AND-RECALL-01-A2
