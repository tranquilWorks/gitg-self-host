meaning_and_fit:
  purpose: Distinguish a vague curiosity from a precise descriptive, causal or evaluative question, investigate
    one and keep a useful backlog of unresolved questions.
  why_recommended: Distinguish a vague curiosity from a precise descriptive, causal or evaluative question,
    investigate one and keep a useful backlog of unresolved questions.
  claims:
  - statement: Distinguish a vague curiosity from a precise descriptive, causal or evaluative question,
      investigate one and keep a useful backlog of unresolved questions.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The ACRL framework treats research as iterative inquiry, searching as strategic exploration,
      authority as contextual, and source use as an ethical, traceable process; it also calls for refining
      questions, matching methods to information needs, monitoring gaps, organizing information and synthesizing
      multiple sources.
    classification: professional_or_public_standard
    source_ids:
    - SRC-ACRL-INFORMATION-LITERACY-FRAMEWORK
    limitations: A higher-education information-literacy framework rather than a prescriptive checklist,
      universal research method, product validation or evidence that these fictional exercises improve
      curiosity or research ability. ACRL was consulting on a draft revision when inspected; this entry
      refers to the adopted 2016 framework.
  applicability_question: Does a voluntary, bounded Curiosity and question formation practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Curiosity and question formation as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use spoken questions, sketches or a private synthetic example. Curiosity about
    people is not permission to investigate their private lives. When no live observation is accessible,
    the supplied notice-board case supports question formation but not a real-world finding.
  opportunity_considerations: Use the supplied synthetic notice-board brief, question ladder, evidence-match
    table and backlog template. The board has twelve labeled rectangles, five overlaps, four designated
    posting zones and no personal content. A live board is optional and may be used only when viewing
    it is permitted; record counts and layout categories rather than names, messages or photographs.
  prerequisites:
  - Use the supplied synthetic notice-board brief, question ladder, evidence-match table and backlog template.
    The board has twelve labeled rectangles, five overlaps, four designated posting zones and no personal
    content. A live board is optional and may be used only when viewing it is permitted; record counts
    and layout categories rather than names, messages or photographs.
  dependencies: []
  safe_alternatives:
  - Use spoken questions, sketches or a private synthetic example. Curiosity about people is not permission
    to investigate their private lives. When no live observation is accessible, the supplied notice-board
    case supports question formation but not a real-world finding.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Curiosity and question formation differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Curiosity and question formation
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied synthetic notice-board brief, question ladder, evidence-match table and backlog
    template. The board has twelve labeled rectangles, five overlaps, four designated posting zones and
    no personal content. A live board is optional and may be used only when viewing it is permitted; record
    counts and layout categories rather than names, messages or photographs. Goal: Distinguish a vague
    curiosity from a precise descriptive, causal or evaluative question, investigate one and keep a useful
    backlog of unresolved questions. Scope: This is inquiry practice around a harmless observation. A
    good question need not have an immediate answer, and one observation cannot establish a causal explanation.
    Time and effort: Ten minutes for observation, twenty minutes for one inquiry and ten minutes to refine
    the question backlog. Adaptation: Use spoken questions, sketches or a private synthetic example. Curiosity
    about people is not permission to investigate their private lives. When no live observation is accessible,
    the supplied notice-board case supports question formation but not a real-world finding. Keep personal
    working notes outside the check-in; record only the listed observations.


    Reference support:

    Framework for Information Literacy for Higher Education: https://www.ala.org/acrl/standards/ilframework'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use spoken questions, sketches or a private synthetic example. Curiosity about
    people is not permission to investigate their private lives. When no live observation is accessible,
    the supplied notice-board case supports question formation but not a real-world finding.
  expected_burden: Ten minutes for observation, twenty minutes for one inquiry and ten minutes to refine
    the question backlog.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Curiosity and question formation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Curiosity and question formation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use spoken
    questions, sketches or a private synthetic example. Curiosity about people is not permission to investigate
    their private lives. When no live observation is accessible, the supplied notice-board case supports
    question formation but not a real-world finding.
  actions:
  - stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01-A1
    sequence: 1
    title: Describe the puzzle and generate different kinds of question
    instructions: 'Read the supplied board brief without opening the classification key. Record observation,
      expectation and contradiction in separate fields. Write at least one descriptive, causal and evaluative
      question. Replace vague terms such as bad, cluttered or works with a named population, object, measure,
      comparison or criterion. Complete the classification prompt, preserve the first answer and then
      use its key to correct any question whose type or observable terms were unclear.


      Observation checks: The observation is separated from an immediate explanation; Descriptive causal
      and evaluative questions are distinguished; Vague terms are replaced with observable meanings; The
      surprising expectation or contradiction is stated. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01
      action_stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01-A1
      competency_stable_id: '10.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1003_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1003_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_observation_is_separated_from_an_immediate_explanation
        - descriptive_causal_and_evaluative_questions_are_distinguished
        - vague_terms_are_replaced_with_observable_meanings
        - the_surprising_expectation_or_contradiction_is_stated
      - measurement_id: c1003_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1003_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01-A2
    sequence: 2
    title: Choose one question and obtain a relevant piece of evidence
    instructions: 'Use the evidence-match table to rank questions by relevance, answerability, consequence,
      access and twenty-minute fit. Select one question and predeclare the evidence that could answer
      it, what result would remain ambiguous and one privacy boundary. For the complete default, count
      the supplied overlap and zone-placement observations. Explain why those counts can answer a descriptive
      question but cannot establish motive or causation. Preserve the result and any missing evidence.


      Observation checks: The selected question has a reason for priority; The evidence actually bears
      on that question; Observation respects access and privacy; A descriptive result is not promoted
      into an unsupported cause. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01
      action_stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01-A2
      competency_stable_id: '10.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1003_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1003_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_selected_question_has_a_reason_for_priority
        - the_evidence_actually_bears_on_that_question
        - observation_respects_access_and_privacy
        - a_descriptive_result_is_not_promoted_into_an_unsupported_cause
      - measurement_id: c1003_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
