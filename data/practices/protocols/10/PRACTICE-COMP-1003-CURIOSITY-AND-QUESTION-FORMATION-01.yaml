        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1003-CURIOSITY-AND-QUESTION-FORMATION-01-A3
    sequence: 3
    title: Resolve refine or defer rather than filling the gap with a story
    instructions: 'Enter every question in the supplied backlog with type, exact wording, status, evidence
      seen, uncertainty and next check. Mark the investigated question answered within scope, partly answered
      or unresolved. Refine one causal question into a safe comparison, then complete the resolution prompt
      before revealing its key. Keep unanswered questions visible with a revisit trigger; do not invent
      a cause or close an entry merely to make the backlog look complete.


      Observation checks: The question receives an honest resolution status; The answer cites the observed
      evidence; One refined next question has a feasible check; Unanswered questions remain visible without
      invented closure. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.


      Final review: Did the inquiry answer the question you actually asked, or reveal a better question
      that the original wording hid?


      Examples: Supportive: An overlap count answered the descriptive question and led to a narrower placement
      hypothesis rather than a story about careless users.


      Mixed: The inquiry produced useful observations, but the selected question was still too broad to
      resolve.


      Contradictory: A person’s motive was invented to fill an evidence gap, or curiosity became intrusive
      surveillance.


      Inconclusive: A list of interesting topics was made without one precise question, evidence check
      or refinement.'
