instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.03'
  title: Observe, form and refine questions without inventing answers
  scored: false
  sections:
  - id: inquiry-boundary
    kind: concept
    title: A question is a tool, not an answer in disguise
    body: Curiosity becomes investigable when observation, interpretation and uncertainty remain separate.
      An observation reports what the available record shows. An interpretation proposes meaning. A question
      identifies what is still unknown. Descriptive questions ask what, where, when or how much; causal
      questions ask what contributes to a change and require a defensible comparison; evaluative questions
      ask how something performs against explicit criteria for a named user or purpose. A precise question
      names its object, scope and evidence need. Precision does not require premature certainty, and one
      count cannot establish motive or cause.
  - id: question-ladder
    kind: material
    title: Question ladder and evidence-match table
    body: 'For each candidate write: observed fact | expected pattern | contradiction or gap | question
      type | exact question | evidence needed | evidence available | what that evidence cannot show |
      privacy or access limit. Test the wording: Can two readers identify the same object and measure?
      Is the population or setting bounded? Does the proposed evidence match the type? Is the answer useful
      enough to justify the effort? Rank candidates with high, medium or low for relevance, answerability,
      consequence, access and time fit. A high-consequence question requires stronger authority and is
      outside this low-stakes default.'
  - id: board-packet
    kind: material
    title: Synthetic notice-board evidence packet
    body: 'The fictional board is divided into four equal posting zones, Z1 through Z4. Twelve same-size
      notices are present. N1-N4 are in Z1, N5-N7 in Z2, N8-N10 in Z3 and N11-N12 in Z4. Overlap pairs
      are N1/N2, N2/N3, N5/N6, N8/N9 and N9/N10: five overlap pairs. Seven notices do not overlap another
      notice. Ten notices are fully inside a zone and two cross a zone boundary. A weekly log says expired
      notices were removed on schedule for four weeks. It contains no measure of readability, posting
      motives, board traffic or results from a board with clearer zones. This packet permits counting
      and question design; it does not establish why overlap occurs or what readers prefer.'
  - id: backlog-template
    kind: material
    title: Private question backlog
    body: 'Use one row per question: Q-ID | exact wording | descriptive / causal / evaluative | priority
      reason | status [unexamined / investigated / answered within scope / partly answered / unresolved
      / deferred] | evidence and date | strongest limitation | next safe check | revisit trigger. Keep
      unresolved entries rather than converting uncertainty into a confident story. Store no names, message
      content or other private detail.'
  - id: worked-refinement
    kind: worked_example
    title: Worked refinement from vague concern to testable inquiry
    body: “Why is the board bad?” hides both the criterion and the proposed cause. A descriptive refinement
      is “How many of the twelve notices overlap at least one other notice in the supplied packet?” A
      causal refinement is “Under comparable posting traffic, does a board with visibly marked zones have
      fewer overlap pairs than a board without them?” An evaluative refinement is “Can intended readers
      identify current event date and contact details at the agreed viewing distance?” The packet answers
      only the supplied overlap count. The causal comparison and actual-reader criterion need new evidence.
  - id: classify-questions
    kind: prompt
    title: Classify and repair four questions
    body: 'Before opening the key, classify each as descriptive, causal, evaluative or not yet investigable
      and repair any vague wording. A: How many overlap pairs are in the packet? B: Why are users careless?
      C: Under comparable posting traffic, do marked zones reduce overlap pairs? D: Is the board usable?
      For D, name the user, task and criterion needed. State which questions the supplied packet can answer
      and which require new evidence.'
    check_id: classification-key
    attempt_mode: practice
    references:
    - question-ladder
    - board-packet
  - id: resolve-question
    kind: prompt
    title: Record an honest resolution and next question
    body: Using only the supplied packet, answer “How many overlap pairs are present?” Then record whether
      the question is answered within scope, partly answered or unresolved. Explain whether the result
      establishes why overlap occurs. Refine one causal question into a comparison with an independent
      variable, outcome and comparable condition. Add the original and refined questions to the backlog
      with an evidence limitation and revisit trigger. Preserve this attempt before opening the key.
    check_id: resolution-key
    attempt_mode: practice
    references:
    - board-packet
    - backlog-template
  - id: pathway-options
    kind: pathway
    title: Choose a fitting inquiry route
    body: 'Default route: use the complete fictional packet. Live-observation route: inspect only a place
      you may view and retain category-level counts, not personal content. Advanced route: use a real
      low-stakes technical or civic question, but predeclare the authority, evidence and stopping boundary
      before searching. Spoken, signed, audio, tactile and supported responses are equivalent when the
      question structure remains observable. Curiosity about a person never grants access to that person’s
      private life.'
  - id: next-inquiry
    kind: next_step
    title: Progress by improving evidence fit
    body: Progress is not asking more questions. It is forming a question whose wording, consequence and
      evidence need are clearer, then revising it when inquiry exposes a gap. Transfer by applying the
      same observation-question-evidence-status record to a different harmless context. A completed packet
      shows one bounded inquiry cycle, not a stable trait or broad research competence.
  checks:
  - id: classification-key
    title: Check the question types and repairs
    body: A is descriptive and the packet can answer it. B is an unsupported interpretation of motive,
      not yet an investigable causal question; a repair would compare a named placement condition with
      a countable outcome without assigning blame. C is causal and requires a comparable marked-zone condition
      that the packet does not provide. D is evaluative but incomplete until it names intended readers,
      a task such as locating date/contact details, and an observable usability criterion. The packet
      supports the overlap count, not cause, motive or actual-reader usability.
    criteria:
    - Each question is classified by the information it asks for, not by its first word alone.
    - Vague or judgmental wording is replaced with a bounded object and observable criterion.
    - Evidence availability is distinguished from evidence that would be needed.
    - Missing causal or user evidence remains unknown rather than inferred.
  - id: resolution-key
    title: Check the resolution and refinement
    body: The packet contains five listed overlap pairs, so the descriptive count is five and is answered
      within the packet’s scope. That result does not establish why posters chose locations or whether
      zones caused the overlaps. A defensible causal refinement names a condition and outcome, for example
      comparing overlap-pair counts under similar posting traffic before and after visible zone markings.
      The backlog should retain the descriptive answer, the causal unknown, the needed comparison and
      a trigger such as access to a comparable second record.
    criteria:
    - The answer is five overlap pairs and cites the supplied list rather than guessing from the total
      notices.
    - The resolution is limited to the synthetic packet.
    - The causal refinement states condition, outcome and comparable context.
    - The backlog retains uncertainty, next evidence and a revisit trigger.
