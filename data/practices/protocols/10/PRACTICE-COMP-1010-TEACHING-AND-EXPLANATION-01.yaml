  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Teaching and explanation as
    inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default lesson: locate a cell on a three-by-three grid. Label columns A, B, C from left to right
    and rows 1, 2, 3 from bottom to top. The learner should find B2, then an unmodeled cell such as A3.
    Use paper, tactile squares or accessible row-and-column descriptions. Invite an adult who is willing
    to try; do not recruit a dependent person under pressure. Goal: Adapt language, examples, sequence
    and practice to another person’s starting knowledge, then revise the explanation based on what they
    can actually do. Scope: A willing learner’s new application is evidence about this explanation, not
    a judgment of their intelligence. Self-rehearsal is preparation and does not prove teaching success.
    Time and effort: Ten minutes to prepare, a fifteen-minute willing learning session and ten minutes
    to revise. Adaptation: Use speech, sign, AAC, tactile grids or enlarged text according to the learner’s
    preference. Remove unnecessary speed demands while keeping the coordinate task. Protect privacy and
    never record a learner without clear permission. Keep personal working notes outside the check-in;
    record only the listed observations.


    Reference support:

    CAST Universal Design for Learning Guidelines version 3.0: https://udlguidelines.cast.org/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use speech, sign, AAC, tactile grids or enlarged text according to the learner’s
    preference. Remove unnecessary speed demands while keeping the coordinate task. Protect privacy and
    never record a learner without clear permission.
  expected_burden: Ten minutes to prepare, a fifteen-minute willing learning session and ten minutes to
    revise.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Teaching and explanation protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Teaching and explanation action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use speech,
    sign, AAC, tactile grids or enlarged text according to the learner’s preference. Remove unnecessary
    speed demands while keeping the coordinate task. Protect privacy and never record a learner without
    clear permission.
  actions:
  - stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01-A1
    sequence: 1
    title: Check starting knowledge and choose a usable representation
    instructions: 'Ask whether the learner already uses letter–number coordinates and what format is accessible.
      State the goal as locating a new cell, not repeating a definition. Prepare one worked example, B2,
      and one contrasting example, B3, so the row difference is visible. Choose ordinary language for
      column and row and ask permission to continue before launching into a long explanation.


      Observation checks: The learner’s starting knowledge and access needs are asked; The goal is an
      observable application; A worked and contrasting example are prepared; Participation and pacing
      remain voluntary. Mark only what you observed. Missing, mixed and negative results are valid; a
      deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01
      action_stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01-A1
      competency_stable_id: '10.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1010_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1010_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_learner_s_starting_knowledge_and_access_needs_are_asked
        - the_goal_is_an_observable_application
        - a_worked_and_contrasting_example_are_prepared
        - participation_and_pacing_remain_voluntary
      - measurement_id: c1010_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1010_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01-A2
    sequence: 2
    title: Explain briefly and give the learner the next move
    instructions: 'Demonstrate B2 by finding column B and then row 2. Ask the learner to locate A3 without
      pointing to the answer or saying yes before they commit. Invite them to describe the step that felt
      uncertain. Distinguish a language, layout or prior-knowledge barrier from a failure to understand
      the coordinate rule; do not infer the cause from one mistake.


      Observation checks: The explanation uses a clear ordered demonstration; The learner attempts an
      unmodeled example; Prompts do not give away the answer; Observed difficulty is explored without
      labeling the learner. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01
      action_stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01-A2
      competency_stable_id: '10.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1010_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1010_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_explanation_uses_a_clear_ordered_demonstration
        - the_learner_attempts_an_unmodeled_example
        - prompts_do_not_give_away_the_answer
        - observed_difficulty_is_explored_without_labeling_the_learner
      - measurement_id: c1010_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1010_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1010-TEACHING-AND-EXPLANATION-01-A3
    sequence: 3
    title: Revise the explanation and test another new example
    instructions: 'Change the part linked to the confusion, such as explicitly naming the bottom row as
      1 or using a tactile reference edge. Have the learner locate C1 and explain how they found it. Record
      whether the revised instruction helped, what support was used and what remains unclear. With no
      willing learner, rehearse both versions and mark learner application untested rather than inventing
      a successful student.


      Observation checks: The revision addresses an observed barrier; A second new example tests the revised
      explanation; Support and remaining confusion are recorded; Rehearsal is not substituted for another
      person’s application. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: What did the learner’s attempt reveal about your explanation that their polite agreement
      did not?


      Examples: Supportive: A row-origin confusion led to a clearer reference edge, and the learner then
      located C1 independently using the agreed support.


      Mixed: The learner repeated the example correctly but still needed answer-revealing hints on a new
      cell.


      Contradictory: Confusion was treated as a character flaw, or consent and access needs were ignored
      to finish the lesson.


      Inconclusive: The explanation was delivered but no unmodeled application or responsive revision
      was attempted.'
    expected_time: 15-25 minutes
    due_within_days: 10
