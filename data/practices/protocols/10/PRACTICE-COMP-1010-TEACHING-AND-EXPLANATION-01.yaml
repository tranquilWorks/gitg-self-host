instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.10'
  title: Teach one grid rule and let a fresh move test the explanation
  scored: false
  sections:
  - id: teaching-model
    kind: concept
    title: Application tests the explanation better than agreement
    body: A bounded teaching cycle asks what the learner already knows and which representation is usable,
      states an observable goal, demonstrates one case, withholds the answer to a fresh case, and revises
      the explanation from the learner’s action. Polite agreement, repetition and teacher confidence do
      not show application. A mistake is evidence about the explanation, task and supports—not the learner’s
      intelligence or character. Self-rehearsal prepares teaching but cannot become another person’s result.
  - id: grid-card
    kind: material
    title: Supplied three-by-three coordinate grid
    body: Columns A, B and C run left to right. Rows 1, 2 and 3 run bottom to top. A coordinate gives
      column first, then row. Therefore B2 is the center cell and B3 is the top-middle cell. The first
      fresh case is A3; the post-revision case is C1. Use nine tactile or paper squares when a visual
      grid is not accessible. Orientation labels remain available; the learner is not tested on tiny print,
      speed or remembering an unstated origin.
  - id: worked-shelf
    kind: worked_example
    title: Example on a different shelf label
    body: A two-column shelf uses X and Y left to right and rows 1 and 2 bottom to top. The teacher checks
      that the learner understands “bottom,” demonstrates Y2 by choosing the right column then the top
      row, and asks for X1 without pointing. When the learner chooses bottom-left and says “X first, then
      row 1 from the bottom,” the new action supports the explanation. Repeating Y2 would test imitation,
      not the unmodeled rule.
  - id: session-record
    kind: material
    title: Consent, attempt and revision record
    body: 'Session route [willing adult/supplied simulation/self-rehearsal]: __. Permission and stop option:
      __. Starting knowledge: __. Preferred representation/support: __. Observable goal: __. Version A
      exact explanation: __. Worked and contrasting examples: __. Fresh case: __. First committed response:
      __. Prompt/rescue used: __. Learner’s stated uncertainty: __. Observed barrier versus inferred cause:
      __. One revision: __. Second fresh case and committed response: __. Remaining uncertainty: __. Keep
      identity private and record only with permission.'
  - id: lesson-plan
    kind: prompt
    title: Prepare the explanation without giving away the fresh move
    body: Use the grid card to write a Version A explanation in no more than four sentences. It must name
      column-first order, left-to-right letters and bottom-to-top row numbers; demonstrate B2; and contrast
      B3 without mentioning the location of A3. Write one starting-knowledge question, one access question
      and the exact neutral prompt for A3. Identify two teacher behaviors that would reveal the answer
      before the learner commits. Preserve the plan before opening the key.
    references:
    - grid-card
    - session-record
    check_id: lesson-plan-key
    attempt_mode: practice
  - id: responsive-model
    kind: concept
    title: Diagnose the explanation before diagnosing the learner
    body: 'If A3 is wrong, first check whether Version A stated the row origin, order and labels clearly
      and whether the representation was accessible. Ask which step felt uncertain. Use a hint ladder
      only after a committed attempt: repeat the rule; name the relevant edge; then model a different
      example. Record the hint because a rescued response is not independent application. Revise one supported
      barrier and test C1, a new coordinate, rather than repeating the demonstrated answer.'
  - id: learner-application
    kind: prompt
    title: Run or analyze the two fresh applications
    body: 'Preferred route: with a willing adult, use Version A, obtain a committed A3 response, ask what
      was uncertain, revise one supported barrier and request C1 without pointing. If no willing learner
      is available, use this supplied simulation and label actual learner evidence untested: after B2,
      the learner asks “Do rows start at the top?”; the teacher points at A3 before commitment; the learner
      selects it. The teacher then revises, “Row 1 starts at the bottom edge and rows count upward,” and
      the learner selects C1 without a hint. Classify both attempts, the prompt, the revision and what
      the simulation can and cannot establish before opening the key.'
    references:
    - grid-card
    - session-record
    check_id: learner-application-key
    attempt_mode: practice
  - id: access-consent
    kind: pathway
    title: Preserve the coordinate rule across accessible routes
    body: Use speech, sign, AAC, tactile squares, large text or the learner’s chosen medium. Remove speed
      when it is not part of the goal. Participation, pacing and recording require permission and may
      stop without penalty; never recruit a dependent person under pressure. A helper may operate the
      medium while the learner chooses the cell. The supplied simulation supports planning and analysis
      only, not a claim of successful teaching with an actual person.
  - id: next-lesson
    kind: next_step
    title: Revise the smallest evidenced barrier
    body: If a willing learner applies C1 unprompted and explains the rule, retain the revision and test
      a different grid later. If a prompt was needed, keep that support visible and change only the linked
      explanation. If access blocked the action, change the medium without lowering the coordinate rule.
      If no learner participated, the next step is a consented session—not a harder self-rehearsal. One
      session says nothing about learner intelligence or general teaching expertise.
  checks:
  - id: lesson-plan-key
    title: Check the plan for rule, contrast and non-revealing prompt
    body: 'A complete short explanation may say: “Coordinates name a column first and a row second. Columns
      A–C go left to right; rows 1–3 start at the bottom and go upward. For B2, choose column B and then
      row 2, the center. B3 stays in column B but moves to the top row.” The fresh prompt is simply “Please
      locate A3 and tell me how you chose it.” Pointing toward top-left or saying “top row” before commitment
      reveals part of the answer; moving the learner’s hand reveals it entirely. Starting knowledge and
      preferred representation must be asked, not inferred.'
    criteria:
    - Column-first order and both axis directions are explicit
    - B2 and B3 show a meaningful contrast
    - A3 remains unmodeled before commitment
    - Starting knowledge access and answer-revealing behavior are addressed
  - id: learner-application-key
    title: Check the fresh moves and evidence boundary
    body: A3 is the top-left cell. In the simulation, pointing before commitment makes that response prompted,
      so it cannot show independent application. The question about row origin identifies a plausible
      explanation gap but does not diagnose the learner. The revision explicitly anchors row 1 at the
      bottom. C1 is the bottom-right cell; the simulated unhinted selection is consistent with the revised
      rule. Because the record is fictional, both events support analysis of a teaching response—not an
      actual learner outcome. A live willing learner’s actions must be recorded separately if they occur.
    criteria:
    - A3 and C1 are located correctly
    - The answer-revealing prompt limits the first result
    - The revision addresses the stated row-origin uncertainty
    - Simulation rehearsal and actual learner evidence remain distinct
