meaning_and_fit:
  purpose: Adapt language, examples, sequence and practice to another person’s starting knowledge, then
    revise the explanation based on what they can actually do.
  why_recommended: Adapt language, examples, sequence and practice to another person’s starting knowledge,
    then revise the explanation based on what they can actually do.
  claims:
  - statement: Adapt language, examples, sequence and practice to another person’s starting knowledge,
      then revise the explanation based on what they can actually do.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: CAST's current UDL framework recommends options for engagement, representation, interaction
      and expression; clarifying goals and symbols; connecting prior knowledge; monitoring progress; and
      action-oriented feedback while preserving meaningful challenge.
    classification: professional_or_public_standard
    source_ids:
    - SRC-CAST-UDL-GUIDELINES-3
    limitations: A living educational-design framework, not a script for this coordinate lesson, proof
      that one adaptation works for a particular learner, a diagnosis, empirical validation of the fictional
      transcript or evidence of actual teaching success.
  applicability_question: Does a voluntary, bounded Teaching and explanation practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Teaching and explanation as not applicable, consciously unchosen, or
    deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use speech, sign, AAC, tactile grids or enlarged text according to the learner’s
    preference. Remove unnecessary speed demands while keeping the coordinate task. Protect privacy and
    never record a learner without clear permission.
  opportunity_considerations: 'Default lesson: locate a cell on a three-by-three grid. Label columns A,
    B, C from left to right and rows 1, 2, 3 from bottom to top. The learner should find B2, then an unmodeled
    cell such as A3. Use paper, tactile squares or accessible row-and-column descriptions. Invite an adult
    who is willing to try; do not recruit a dependent person under pressure.'
  prerequisites:
  - 'Default lesson: locate a cell on a three-by-three grid. Label columns A, B, C from left to right
    and rows 1, 2, 3 from bottom to top. The learner should find B2, then an unmodeled cell such as A3.
    Use paper, tactile squares or accessible row-and-column descriptions. Invite an adult who is willing
    to try; do not recruit a dependent person under pressure.'
  dependencies: []
  safe_alternatives:
  - Use speech, sign, AAC, tactile grids or enlarged text according to the learner’s preference. Remove
    unnecessary speed demands while keeping the coordinate task. Protect privacy and never record a learner
