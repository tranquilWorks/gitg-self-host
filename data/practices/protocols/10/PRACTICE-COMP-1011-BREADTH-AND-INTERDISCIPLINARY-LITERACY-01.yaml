instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.11'
  title: Connect seven disciplinary lenses without pretending depth
  scored: false
  sections:
  - id: breadth-model
    kind: concept
    title: Breadth changes a question; labels alone do not
    body: Interdisciplinary breadth uses each field to ask a different concrete question, identify a fitting
      kind of evidence and show how at least two lenses change one decision. Science asks what can be
      observed or measured; history asks what changed over time and why accounts differ; technology asks
      how a designed system works; economics asks about scarcity, incentives and tradeoffs; humanities
      examine meaning, interpretation and justified values; arts examine how form shapes experience; and
      society asks who participates, is affected and decides. Naming fields is not expertise, and combining
      weak evidence does not make it strong.
  - id: waiting-area-packet
    kind: material
    title: Supplied fictional waiting-area records
    body: 'W0: six seats occupy a 4-by-6-meter room; four receive afternoon shade; three sound readings
      are 70, 72 and 71 dB at the same marked point, with no comfort threshold supplied. H1: a 2024 memo
      says the stop moved indoors after summer heat complaints; it does not explain who was consulted.
      D1: the route display uses 8-millimeter characters and refreshes each minute; no legibility standard
      is supplied. E1: the improvement budget is $2,400; either eight $300 high-contrast signs or four
      $600 shaded seats fit before maintenance, but mixed options are allowed. U1: in a voluntary fictional
      test at the intended distance, two of two readers could not identify the route number; the sample
      cannot represent all users. A1: one designer describes the current gray surface as calm; one rider
      describes it as hard to distinguish. S1: a meeting roster lists operations and one designer but
      no riders or disability advocate. These records are synthetic and contain no real people.'
  - id: worked-library
    kind: worked_example
    title: Example connection on a different public library question
    body: 'A library-entry question connects technology—whether an automatic door’s sensor detects a slow
      approach—with society—whose mobility patterns were included in testing. The technical specification
      may describe the detection range, while a small user observation reveals one missed condition. The
      connection changes the decision: a range number alone is insufficient if the test population omits
      relevant approaches. It still does not answer historical preservation, budget or aesthetic questions,
      and one observation does not establish population-wide performance.'
  - id: lens-map
    kind: material
    title: Seven-lens map and synthesis record
    body: 'Shared decision: __. One row per lens: field | concrete question | evidence needed | supplied
      record or external source | what it supports | what it cannot show | relevant expertise or affected
      voice. Selected lenses A and B: __. Claim from A with record code: __. Claim from B with record
      code: __. Connection—B changes A by: __. Decision implication: __. Tension or tradeoff retained:
      __. Five lenses mapped but not investigated: __. Scope limit: __. Small next learning step and fitting
      source or person: __. Do not convert a field name into a conclusion.'
  - id: seven-lens-prompt
    kind: prompt
    title: Map one evidence-shaped question for every lens
    body: For the supplied waiting area, write one concrete question from each of the seven lenses and
      pair it with the most fitting W0/H1/D1/E1/U1/A1/S1 record or mark “not supplied.” Include at least
      one measurement question, one change-over-time question, one mechanism question, one resource tradeoff,
      one justified-value question, one form/experience question and one participation/decision question.
      Identify which proposed answer would exceed its record. Preserve the map before opening the key.
    references:
    - waiting-area-packet
    - lens-map
    check_id: seven-lens-key
    attempt_mode: practice
  - id: connection-model
    kind: concept
    title: A connection must alter interpretation or action
    body: Two adjacent summaries are not yet a synthesis. A real connection shows that one lens changes
      the question, interpretation, criterion or action under another. D1 says how the display is built;
      U1 shows a small access problem at the intended distance. Together they justify further legibility
      testing or a bounded redesign, not a claim about all riders. E1 adds a cost tradeoff but cannot
      decide which option is fair without stated values and affected voices. Retain disagreements and
      unknowns.
  - id: two-lens-synthesis
    kind: prompt
    title: Connect display technology and social access
    body: 'Use D1 and U1 to write a five-part synthesis: exact supported technical fact; exact observed
      access result; how the access result changes the display-design question; one bounded next decision;
      and three important unknowns. Then state one tension introduced by E1 without pretending the budget
      record identifies the best option. Name the five lenses not investigated beyond the map and the
      source, specialist or affected voice needed before a consequential redesign. Cite record codes after
      every factual claim and preserve the draft before opening the key.'
    references:
    - waiting-area-packet
    - lens-map
    check_id: two-lens-key
    attempt_mode: practice
  - id: access-route
    kind: pathway
    title: Use the fictional case or a permitted public record
    body: Use spoken mapping, cards, large text, audio or a supported scribe. The complete fictional packet
      requires no internet or observation. A live route may use public specifications and records but
      must retain provenance, access permission and population limits; do not photograph or profile people
      without consent. An advanced route may add a third lens only when it changes the decision, not to
      make the map look comprehensive. Consequential design needs relevant specialists and affected users.
  - id: next-connection
    kind: next_step
    title: Deepen one boundary rather than adding more labels
    body: If the two-lens synthesis is supported and limited, choose one missing evidence item such as
      a larger voluntary legibility check or the applicable display standard. If the connection is only
      adjacent summaries, rewrite how one finding changes the other question. If a value judgment is hidden
      as a measurement, label it and identify whose reasons matter. Transfer the seven-lens map to another
      harmless decision without claiming disciplinary mastery.
  checks:
  - id: seven-lens-key
    title: Check the seven questions against evidence type and scope
    body: 'A defensible map includes: science—how do sound readings vary across comparable times? W0 is
      only one three-reading snapshot; history—why was the stop moved in 2024 and whose accounts differ?
      H1 supplies the stated heat reason but not consultation; technology—how do character size and refresh
      work? D1; economics—which sign/seat mix fits $2,400 plus maintenance? E1 lacks maintenance costs;
      humanities—which values justify comfort, dignity and fairness? no record decides them; arts—how
      do contrast and surface form shape legibility and atmosphere? A1 supplies two perspectives, not
      a rule; society—who participated and who was absent? S1. Treating 71 dB as acceptable, two readers
      as all users or the calm description as consensus would exceed the supplied evidence.'
    criteria:
    - Every lens has a concrete question rather than a label
    - Evidence type fits the question or is marked missing
    - Measurement and justified-value questions remain distinct
    - At least one overclaim is identified
  - id: two-lens-key
    title: Check the cross-field inference and retained limits
    body: D1 supports that the fictional display uses 8-millimeter characters and one-minute refreshes.
      U1 supports that two willing readers in this fictional test could not identify the route number
      at the intended distance. Together they justify treating legibility as an unresolved design requirement
      and testing a bounded high-contrast or larger-character alternative. They do not show that character
      size caused the failures, represent other users, identify an applicable standard or choose the best
      redesign. E1 introduces a $2,400 allocation tension between signs and shade but omits maintenance
      and mixed-option performance. History, economics, humanities, arts and society remain only mapped
      unless separately investigated; a correct synthesis names those limits and the next fitting expertise.
    criteria:
    - Technical and access claims cite D1 and U1 separately
    - The connection changes a bounded design question
    - Causation population and standard gaps remain explicit
    - Budget tension and five uninvestigated lenses stay visible
