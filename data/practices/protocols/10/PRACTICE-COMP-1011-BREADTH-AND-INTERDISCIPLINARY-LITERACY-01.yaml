meaning_and_fit:
  purpose: Use foundational questions from several disciplines, investigate two connections and mark the
    boundary between useful breadth and genuine subject expertise.
  why_recommended: Use foundational questions from several disciplines, investigate two connections and
    mark the boundary between useful breadth and genuine subject expertise.
  claims:
  - statement: Use foundational questions from several disciplines, investigate two connections and mark
      the boundary between useful breadth and genuine subject expertise.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The consensus study treats interdisciplinary work as integrating information, methods,
      concepts or perspectives from multiple disciplines to advance understanding beyond one field's scope,
      supporting a connection requirement rather than adjacent field labels.
    classification: professional_or_public_standard
    source_ids:
    - SRC-NASEM-INTERDISCIPLINARY-RESEARCH-2005
    limitations: A consensus report about interdisciplinary research, not a complete map of the seven
      product-authored lenses, not evidence that the waiting-area synthesis is professionally adequate
      and not permission to substitute breadth for domain or community expertise.
  applicability_question: Does a voluntary, bounded Breadth and interdisciplinary literacy practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Breadth and interdisciplinary literacy as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a spoken mind map, cards or the fictional records. A library or accessible
    introductory resource can replace internet access. Do not photograph or profile public-space users
    without appropriate consent.
  opportunity_considerations: 'Question: how should a small public waiting area be improved? Use seven
    lenses: science asks what can be measured; history asks what changed and why; technology asks how
    a designed system works; economics asks about scarce resources and tradeoffs; humanities asks about
    meaning and justified values; arts asks how form shapes experience; society asks who participates
    and who decides. Use a fictional waiting area when no safe public case is available.'
  prerequisites:
  - 'Question: how should a small public waiting area be improved? Use seven lenses: science asks what
    can be measured; history asks what changed and why; technology asks how a designed system works; economics
    asks about scarce resources and tradeoffs; humanities asks about meaning and justified values; arts
    asks how form shapes experience; society asks who participates and who decides. Use a fictional waiting
    area when no safe public case is available.'
  dependencies: []
  safe_alternatives:
  - Use a spoken mind map, cards or the fictional records. A library or accessible introductory resource
    can replace internet access. Do not photograph or profile public-space users without appropriate consent.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Breadth and interdisciplinary literacy differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Breadth and interdisciplinary
    literacy as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Question: how should a small public waiting area be improved? Use seven lenses: science asks
    what can be measured; history asks what changed and why; technology asks how a designed system works;
    economics asks about scarce resources and tradeoffs; humanities asks about meaning and justified values;
    arts asks how form shapes experience; society asks who participates and who decides. Use a fictional
    waiting area when no safe public case is available. Goal: Use foundational questions from several
    disciplines, investigate two connections and mark the boundary between useful breadth and genuine
    subject expertise. Scope: The seven-lens map is a product-authored learning device. It is not a complete
    account of any discipline or permission to make professional claims outside your knowledge. Time and
    effort: Twenty minutes for the map, thirty minutes for two source checks and ten minutes for synthesis.
    Adaptation: Use a spoken mind map, cards or the fictional records. A library or accessible introductory
    resource can replace internet access. Do not photograph or profile public-space users without appropriate
    consent. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    Facilitating Interdisciplinary Research: https://www.nationalacademies.org/publications/11153'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a spoken mind map, cards or the fictional records. A library or accessible
    introductory resource can replace internet access. Do not photograph or profile public-space users
    without appropriate consent.
  expected_burden: Twenty minutes for the map, thirty minutes for two source checks and ten minutes for
    synthesis.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Breadth and interdisciplinary literacy protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Breadth and interdisciplinary literacy action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a spoken
    mind map, cards or the fictional records. A library or accessible introductory resource can replace
    internet access. Do not photograph or profile public-space users without appropriate consent.
  actions:
  - stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01-A1
    sequence: 1
    title: Generate one concrete question from each lens
    instructions: 'Apply the seven supplied definitions to the waiting area: measure shade or noise; trace
      a past relocation; inspect the information display; compare maintenance tradeoffs; examine dignity
      and fairness; consider legibility and atmosphere; identify whose access needs are unheard. State
      what kind of evidence each field would need. Do not use a discipline’s name as a substitute for
      an actual question.


      Observation checks: All seven fields receive a concrete question; Each question names a relevant
      kind of evidence; At least one value question is distinguished from a measurement; The map does
      not claim expertise from terminology alone. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01
      action_stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01-A1
      competency_stable_id: '10.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1011_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1011_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - all_seven_fields_receive_a_concrete_question
        - each_question_names_a_relevant_kind_of_evidence
        - at_least_one_value_question_is_distinguished_from_a_measurement
        - the_map_does_not_claim_expertise_from_terminology_alone
      - measurement_id: c1011_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1011_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01-A2
    sequence: 2
    title: Investigate two connected questions with traceable evidence
    instructions: 'Choose two lenses that affect the same decision, such as display technology and access.
      Consult a public specification, historical record, scholarly introduction or experienced professional
      appropriate to each. Offline alternative: use these fictional records—display D1 requires reading
      small print; user test U1 reports that two willing readers could not identify the route number at
      the intended distance. Explain what the pair supports and what it leaves unknown about other users
      or designs.


      Observation checks: Two distinct lenses receive actual evidence checks; Sources or fictional records
      are identified; The connection affects a concrete decision; Small or synthetic evidence is not generalized
      to a whole population. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01
      action_stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01-A2
      competency_stable_id: '10.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1011_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1011_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - two_distinct_lenses_receive_actual_evidence_checks
        - sources_or_fictional_records_are_identified
        - the_connection_affects_a_concrete_decision
        - small_or_synthetic_evidence_is_not_generalized_to_a_whole_population
      - measurement_id: c1011_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1011_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1011-BREADTH-AND-INTERDISCIPLINARY-LITERACY-01-A3
    sequence: 3
    title: Write a synthesis that keeps disciplinary limits visible
    instructions: 'Explain one insight gained by connecting the two fields and one tension that remains,
      such as a visually attractive display that is difficult to read. Name the five lenses not investigated
      beyond the initial map and the expert or source needed before a consequential decision. Propose
      one small next learning step rather than claiming that interdisciplinary vocabulary has solved the
      waiting area.


      Observation checks: The synthesis contains a genuine cross-field connection; A tradeoff or disagreement
      remains explicit; Uninvestigated lenses are honestly identified; The next step names an appropriate
      source or expertise. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.


      Final review: Which connection improved the question, and where would confidence now exceed the
      depth of your actual study?


      Examples: Supportive: The learner connected display design with readable access, identified a meaningful
      tradeoff and kept unstudied historical and economic questions open.


      Mixed: Seven lenses were named and two sources read, but the synthesis did not explain how one field
      changed the other’s question.


      Contradictory: A superficial overview was presented as authority over specialists or affected users.


      Inconclusive: Interesting facts were collected from different fields without a shared question,
      traceable evidence or limits.'
