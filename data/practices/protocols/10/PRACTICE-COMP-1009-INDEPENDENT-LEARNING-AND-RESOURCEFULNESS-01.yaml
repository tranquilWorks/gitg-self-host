  - stable_id: PRACTICE-COMP-1009-INDEPENDENT-LEARNING-AND-RESOURCEFULNESS-01-A3
    sequence: 3
    title: Explain the result and test a limited extension
    instructions: 'Without copying the reference, explain 110 as 4 plus 2. Then predict how a fourth place
      with value 8 would represent 9, and verify 1001 by adding its included values. State what you now
      understand and what remains outside the exercise, such as signed values or computer encodings. Choose
      the next small learning question only after preserving the checked first result.


      Observation checks: The learner explains a row in their own words; A new four-place example is attempted
      and checked; Known and unlearned material are distinguished; The next question follows demonstrated
      initial work. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.


      Final review: Where did independent effort help, and where did a precise question or reference prevent
      wasted effort?


      Examples: Supportive: The learner built and checked all eight rows, corrected a place-value error
      and explained 1001 without treating that success as knowledge of all computing.


      Mixed: The table was completed, but the extension exposed reliance on memorized patterns rather
      than place value.


      Contradictory: The learner refused useful help or copied an unchecked answer while claiming independent
      understanding.


      Inconclusive: Many resources were saved but no first artifact, correction or explanation was produced.'
