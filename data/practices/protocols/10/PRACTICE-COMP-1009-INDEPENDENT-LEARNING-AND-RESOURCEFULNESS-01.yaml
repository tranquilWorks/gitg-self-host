instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.09'
  title: Learn one unfamiliar representation through a checked first artifact
  scored: false
  sections:
  - id: independence-model
    kind: concept
    title: Independence means directing help, not refusing it
    body: Independent learning fixes a bounded outcome, identifies minimum prerequisites, attempts something
      checkable, asks a precise question when evidence exposes a gap, and uses the answer to revise the
      work. It is not collecting resources, guessing without a reference or avoiding appropriate experts.
      Record what was known, attempted, looked up, explained and still unknown. A correct first artifact
      supports one beginner result under these materials; it does not establish expertise in computing
      or a general trait of resourcefulness.
  - id: binary-reference
    kind: material
    title: Supplied three-bit place-value reference
    body: 'Read a three-bit row from left to right as places worth 4, 2 and 1. A 1 includes that place
      value; a 0 contributes zero. Add the included values to obtain the decimal value. Example: 101 includes
      4 and 1, so it equals 5. Leading zeroes retain the three-place layout: 010 includes only 2. The
      target artifact contains every bit pattern from 000 through 111 exactly once, paired with decimal
      0 through 7 exactly once. This card covers unsigned place value only—not signed numbers, storage,
      encoding or computer architecture.'
  - id: worked-two-bit
    kind: worked_example
    title: Worked example on a different two-bit system
    body: 'With two places worth 2 and 1, the complete patterns are 00 = 0, 01 = 1, 10 = 2 and 11 = 3.
      For 10, include 2 and omit 1. The check is structural: all four patterns appear, all four decimal
      values appear, and each row equals its selected weights. This demonstrates the method without supplying
      the requested three-bit table.'
  - id: learning-log
    kind: material
    title: Minimum plan and help ledger
    body: 'Outcome and pass condition: __. Prerequisite 1: __; evidence it is available: __. Prerequisite
      2: __; evidence: __. Three steps: build __; check __; explain __. First attempt preserved at: __.
      Row or idea that exposed uncertainty: __. Precise question: __. Source or willing helper and access
      date: __. Answer in my own words: __. Exact correction made: __. Items checked: __/__. Known now:
      __. Still outside scope: __. Next question justified by the artifact: __. Keep the target and stop
      limit small enough to execute before gathering another general resource.'
  - id: three-bit-table
    kind: prompt
    title: Build and audit the complete three-bit table
    body: Before opening the key, write rows 000, 001, 010, 011, 100, 101, 110 and 111. For each row,
      show the included 4/2/1 weights and your decimal total. Audit that every pattern appears once, decimal
      values 0–7 appear once and each total matches its weights. Preserve the first error rather than
      silently replacing it. Explain why 011 is three rather than the decimal-looking text eleven, and
      record any precise question or lookup used.
    references:
    - binary-reference
    - learning-log
    check_id: three-bit-table-key
    attempt_mode: practice
  - id: help-model
    kind: concept
    title: Ask only after the artifact identifies the obstacle
    body: “Teach me binary” is too broad for this cycle. “Why does the left 1 in 101 contribute four?”
      names a specific place-value obstacle. Prefer the supplied reference first; consult a traceable
      source or willing knowledgeable person when it cannot resolve the question. Copying a finished table
      can hide the obstacle. Refusing a needed reference wastes effort. Independence is visible when the
      learner selects, evaluates and applies help while retaining the correction trail.
  - id: four-bit-extension
    kind: prompt
    title: Transfer the rule to one added place
    body: A fourth place is added on the left with value 8, giving places 8, 4, 2 and 1. Without copying
      a table, calculate 1001, 1010 and 1111 by listing included values. Then explain one answer in your
      own words and name two topics this extension still does not cover. Preserve the attempt and any
      help before opening the key. If the three-bit table was not checked, return to it rather than presenting
      the extension as a substitute.
    references:
    - binary-reference
    - learning-log
    check_id: four-bit-extension-key
    attempt_mode: practice
  - id: access-route
    kind: pathway
    title: Change the representation while keeping place value visible
    body: Use three labeled physical counters, large-print columns, tactile on/off markers, audio descriptions
      or a helper who records the learner’s selected weights. A calculator may check addition after the
      included places are identified. An experienced learner may start at four bits but must retain the
      same check trail. Hazardous, regulated, medical, legal or safety-critical topics require appropriate
      instruction and are not suitable for proving independence through trial and error.
  - id: next-topic
    kind: next_step
    title: Let the checked artifact choose the next question
    body: If every three-bit row and the extension are explained correctly, choose one bounded next topic
      such as converting decimal 8–15 to four bits. If a weight-selection error remains, practice only
      that prerequisite on new rows. If addition caused the error, keep binary structure fixed and use
      an accessible arithmetic support. Record completed, partial, adverse or inconclusive; do not equate
      a resource list, effort or one correct guess with independent learning.
  checks:
  - id: three-bit-table-key
    title: Check all eight rows and the place-value explanation
    body: The complete table is 000 = 0; 001 = 1; 010 = 2; 011 = 3; 100 = 4; 101 = 5; 110 = 6; 111 = 7.
      The selected-weight forms are 0; 1; 2; 2+1; 4; 4+1; 4+2; 4+2+1. Thus 011 is 0×4 + 1×2 + 1×1 = 3;
      its symbols are a base-two place-value representation, not the base-ten text 11. Duplicate, omitted
      or unchecked rows remain partial even if the visible endpoints are correct. A correction counts
      only when the first output, exact question or reference and changed row remain visible.
    criteria:
    - All eight patterns and decimal values appear exactly once
    - Every total matches the included 4/2/1 weights
    - The 011 explanation uses place value rather than memorized appearance
    - Help and correction remain traceable
  - id: four-bit-extension-key
    title: Check the new place without extending the claim
    body: 1001 includes 8 and 1, so it equals 9. 1010 includes 8 and 2, so it equals 10. 1111 includes
      8, 4, 2 and 1, so it equals 15. A correct explanation names the selected places and their sum. Signed
      values, text encodings, storage order, arithmetic circuits and software representation all remain
      outside this exercise. Correct extension rows support transfer of this place-value rule to one added
      place, not broad computing knowledge or expertise.
    criteria:
    - All three totals are independently correct
    - At least one answer is explained from included values
    - Known and unlearned material are distinguished
    - The extension follows a checked first artifact
