  - stable_id: PRACTICE-COMP-1009-INDEPENDENT-LEARNING-AND-RESOURCEFULNESS-01-A2
    sequence: 2
    title: Construct the artifact and ask a targeted question when stuck
    instructions: 'Build rows from 000 through 111 and calculate each weighted sum. Check that the decimal
      values are exactly 0, 1, 2, 3, 4, 5, 6 and 7 with no duplicate or missing value. When an error appears,
      ask a precise question such as why does 011 equal 3 rather than 11. Use the reference or a willing
      knowledgeable person, then record the explanation that resolves that specific obstacle.


      Observation checks: A complete first table is produced; Every row is checked rather than spot-approved;
      A help request targets a specific obstacle; The answer is used to correct the artifact. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1009-INDEPENDENT-LEARNING-AND-RESOURCEFULNESS-01
