meaning_and_fit:
  purpose: Build a small independent learning plan, use references and help selectively, and produce an
    initial artifact that can be checked against a clear standard.
  why_recommended: Build a small independent learning plan, use references and help selectively, and produce
    an initial artifact that can be checked against a clear standard.
  claims:
  - statement: Build a small independent learning plan, use references and help selectively, and produce
      an initial artifact that can be checked against a clear standard.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Independent learning and resourcefulness practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Independent learning and resourcefulness as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use physical counters, large-print place values or audio explanation. An experienced
    learner may use the extension as the initial target and explain why 1111 is 15. Do not practice independent
    learning on hazardous or regulated tasks without required supervision.
  opportunity_considerations: 'Default unfamiliar topic: three-bit binary numbers. Supplied reference:
    the left, middle and right places are worth 4, 2 and 1; a 1 includes the place value and a 0 omits
    it. Thus 101 means 4 plus 1, or 5. Target artifact: a checked table for decimal 0 through 7. Use paper
    or a plain text editor.'
  prerequisites:
  - 'Default unfamiliar topic: three-bit binary numbers. Supplied reference: the left, middle and right
    places are worth 4, 2 and 1; a 1 includes the place value and a 0 omits it. Thus 101 means 4 plus
    1, or 5. Target artifact: a checked table for decimal 0 through 7. Use paper or a plain text editor.'
  dependencies: []
  safe_alternatives:
  - Use physical counters, large-print place values or audio explanation. An experienced learner may use
    the extension as the initial target and explain why 1111 is 15. Do not practice independent learning
    on hazardous or regulated tasks without required supervision.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Independent learning and resourcefulness differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Independent learning and resourcefulness
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default unfamiliar topic: three-bit binary numbers. Supplied reference: the left, middle and
    right places are worth 4, 2 and 1; a 1 includes the place value and a 0 omits it. Thus 101 means 4
    plus 1, or 5. Target artifact: a checked table for decimal 0 through 7. Use paper or a plain text
    editor. Goal: Build a small independent learning plan, use references and help selectively, and produce
    an initial artifact that can be checked against a clear standard. Scope: This is beginner resourcefulness,
    not a claim of expertise or a reason to avoid appropriate instruction. Safe use of experts and documentation
    is part of independence. Time and effort: Forty-five minutes for a first attempt and fifteen minutes
    for a correction or extension. Adaptation: Use physical counters, large-print place values or audio
    explanation. An experienced learner may use the extension as the initial target and explain why 1111
    is 15. Do not practice independent learning on hazardous or regulated tasks without required supervision.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use physical counters, large-print place values or audio explanation. An experienced
    learner may use the extension as the initial target and explain why 1111 is 15. Do not practice independent
    learning on hazardous or regulated tasks without required supervision.
  expected_burden: Forty-five minutes for a first attempt and fifteen minutes for a correction or extension.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Independent learning and resourcefulness protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Independent learning and resourcefulness action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use physical
    counters, large-print place values or audio explanation. An experienced learner may use the extension
    as the initial target and explain why 1111 is 15. Do not practice independent learning on hazardous
    or regulated tasks without required supervision.
  actions:
  - stable_id: PRACTICE-COMP-1009-INDEPENDENT-LEARNING-AND-RESOURCEFULNESS-01-A1
    sequence: 1
    title: State the outcome and locate the minimum prerequisites
    instructions: 'Write what the table must contain and identify the two prerequisites: place value and
      adding selected weights. Read the supplied reference, attempt 010 and 111, and mark what is unclear
      before seeking more material. Make a three-step plan: generate the table, verify every row, explain
      one unfamiliar row. Avoid gathering a long resource list instead of attempting the topic.


      Observation checks: The first artifact has a concrete completion standard; Prerequisites are separated
      from advanced topics; An initial attempt reveals an actual question; The plan is short enough to
      execute now. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1009-INDEPENDENT-LEARNING-AND-RESOURCEFULNESS-01
      action_stable_id: PRACTICE-COMP-1009-INDEPENDENT-LEARNING-AND-RESOURCEFULNESS-01-A1
      competency_stable_id: '10.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
