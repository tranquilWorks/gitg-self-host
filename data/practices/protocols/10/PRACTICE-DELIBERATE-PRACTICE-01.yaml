meaning_and_fit:
  purpose: Isolate a safe skill component, record a bounded baseline, use criterion-based feedback and
    retry under comparable conditions without equating time spent with improvement.
  why_recommended: Isolate a safe skill component, record a bounded baseline, use criterion-based feedback
    and retry under comparable conditions without equating time spent with improvement.
  claims:
  - statement: Practice designed around a specific component, informative feedback, and another attempt
      is a reasonable basis for this bounded skill-rehearsal protocol.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-DELIBERATE-PRACTICE
    limitations: Findings about deliberate practice vary by domain and do not show that this protocol
      guarantees improvement, expertise, transfer, or equal access to coaching and time.
  - statement: Deliberate practice is not a complete explanation of expert performance and should not
      be represented as sufficient, universal, or independent of opportunity and domain conditions.
    classification: empirical_finding
    source_ids:
    - SRC-M6D-DELIBERATE-PRACTICE-LIMITS
    limitations: This scope limit does not calibrate the protocol or determine an appropriate training
      dose for any specific skill.
  applicability_question: Is there one safe, lawful, low-stakes skill with a component that can be observed
    in two short comparable attempts without physical danger, professional stakes, public exposure, or
    coerced feedback?
  not_applicable_behavior: Mark not applicable or defer without penalty when the skill cannot be isolated
    or practiced safely and lawfully; ordinary novice performance and access needs do not imply deficit.
  readiness_considerations: Use paper, slower pacing, an accessible input method, a model or a freely
    consenting coach. Keep adaptations present in both attempts where possible. Exclude hazardous equipment,
    driving, clinical rehabilitation, regulated practice and coerced public evaluation.
  opportunity_considerations: Use a blank spreadsheet or the supplied paper route, with synthetic values
    only. The learning guide supplies exact cell locations, four fixed criteria, a different worked example,
    a baseline prompt, a comparable retry and separately revealed checks. Copy the private attempt record
    first. Keep the two timed attempts at the same difficulty and with the same supports. No paid software,
    coach or private data is needed.
  prerequisites:
  - Use a blank spreadsheet or the supplied paper route, with synthetic values only. The learning guide
    supplies exact cell locations, four fixed criteria, a different worked example, a baseline prompt,
    a comparable retry and separately revealed checks. Copy the private attempt record first. Keep the
    two timed attempts at the same difficulty and with the same supports. No paid software, coach or private
    data is needed.
  dependencies: []
  safe_alternatives:
  - Use paper, slower pacing, an accessible input method, a model or a freely consenting coach. Keep adaptations
    present in both attempts where possible. Exclude hazardous equipment, driving, clinical rehabilitation,
    regulated practice and coerced public evaluation.
  role_conditions:
  - Employment, licensure, coaching, education, and apprenticeship rules take precedence; this protocol
    must not authorize work beyond competence or supervision.
  pathway_conditions:
  - Assistive technology, adapted technique, rest, alternative modalities, models, prompts, and guided
    support are legitimate practice conditions and not penalties.
  worldview_conditions:
  - The practice does not rank talent, intelligence, productivity, professional worth, or moral character
    and does not require competitive comparison.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 14
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use a blank spreadsheet or the supplied paper route, with synthetic values only. The learning
    guide supplies exact cell locations, four fixed criteria, a different worked example, a baseline prompt,
    a comparable retry and separately revealed checks. Copy the private attempt record first. Keep the
    two timed attempts at the same difficulty and with the same supports. No paid software, coach or private
    data is needed. Goal: Isolate a safe skill component, record a bounded baseline, use criterion-based
    feedback and retry under comparable conditions without equating time spent with improvement. Scope:
    Practice one safely bounded component using a fixed standard, a baseline attempt, specific feedback
    and a comparable retry. The evidence concerns that component under the recorded conditions; it does
    not establish mastery of a larger skill. Use the comparison to choose the next correction or a reason
    to pause. Time and effort: About forty-five to sixty minutes across planning, two five-to-fifteen-minute
    attempts and one feedback pass within fourteen days. Adaptation: Use paper, slower pacing, an accessible
    input method, a model or a freely consenting coach. Keep adaptations present in both attempts where
    possible. Exclude hazardous equipment, driving, clinical rehabilitation, regulated practice and coerced
    public evaluation. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use paper, slower pacing, an accessible input method, a model or a freely consenting
    coach. Keep adaptations present in both attempts where possible. Exclude hazardous equipment, driving,
    clinical rehabilitation, regulated practice and coerced public evaluation.
  expected_burden: About forty-five to sixty minutes across planning, two five-to-fifteen-minute attempts
    and one feedback pass within fourteen days.
  action_count_rationale: null
  foreseeable_misuse:
  - Escalating difficulty through pain, danger, exhaustion, humiliation, or unauthorized professional
    work.
  - Treating one improved attempt, a coach's authority, or time spent as proof of talent, mastery, broad
    transfer, or worth.
  exclusions:
  - Physical danger, clinical rehabilitation, licensed or regulated work, emergency response, weapons,
    driving, hazardous equipment, abusive instruction, and high-consequence performance.
  - Skills involving sensitive people, protected data, public evaluation, or feedback that cannot be freely
    refused.
  actions:
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A1
    sequence: 1
    title: Define one component and fix its success criteria
    instructions: 'Choose the supplied four-cell summation component. Read the guide’s method and contrasting
      example, then copy criteria C1–C4 and the attempt record before opening Baseline. Choose a five-to-fifteen-minute
      limit and a spreadsheet or paper route. In a spreadsheet the skill is selecting a live input range,
      not typing a known total. On paper it is including exactly the intended addends and recalculating
      after a change; automatic spreadsheet updating remains untested. If the method is already routine,
      use the supplied harder-route plan for a future cycle instead of inventing errors or claiming this
      is your weak component.


      Observation checks: One observable component is selected; Two to four criteria are fixed before
      the attempt; Difficulty time and feedback method are safely bounded; Synthetic material and a privacy
      boundary are selected. Mark only what you observed. Missing, mixed and negative results are valid;
      a deferred action is not completed.'
    expected_time: 15 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A1
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - component_plan_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: component_plan_criteria
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_component_named
        - criteria_fixed_before_attempt
        - safe_difficulty_selected
        - feedback_method_selected
        - privacy_boundary_selected
      - measurement_id: unsafe_component_selected
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A2
    sequence: 2
    title: Make a baseline attempt without changing the target
    instructions: 'Open Baseline and make one attempt within the chosen interval before revealing its
      check. Preserve the original formula or written addition and the result before and after the input
      change. Then check C1–C4 individually and record observed criteria divided by four, including zero
      if none are observed. Keep the actual duration, aids and errors in the private attempt record. Stop
      at the declared limit. Use only the application’s existing bounded indicators; do not paste spreadsheet
      content or recordings into evidence.


      Observation checks: A real bounded baseline attempt occurs; The observed fraction uses the fixed
      criterion count; The attempt ends at its declared limit; Errors and support conditions remain visible.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 10 minutes
    due_within_days: 6
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A2
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - baseline_component_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: baseline_component_criteria
        kind: bounded_frequency
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '0.5'
        maximum: '1'
      - measurement_id: baseline_attempt_duration
        kind: duration
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        direction: at_most
        minimum: '0'
        target: '15'
        maximum: '20'
        unit: minutes
      - measurement_id: baseline_safety_boundary_breached
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A3
    sequence: 3
    title: Select exactly one feedback correction
    instructions: 'Use the Baseline check and diagnostic examples to identify one missed or unstable criterion
      and one correction. For an omitted endpoint, trace the first and last selected input before accepting
      the formula; for a typed total, replace it with a reference-based calculation and test an input
      change. Keep other conditions fixed and record the chosen correction before retrying. If all criteria
      were met, say so and test a preventive check without inventing weakness. A freely willing reviewer
      may check the same criteria; keep their identity and comments private.


      Observation checks: Feedback uses the criteria fixed in advance; One missed component and one adjustment
      are selected; The retry condition is defined explicitly; Feedback is voluntary private and free
      of humiliation. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 10 minutes
    due_within_days: 9
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A3
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - feedback_correction_criteria
      transfer_disposition: context_bound
      measurements:
      - measurement_id: feedback_correction_criteria
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - fixed_criteria_used
        - one_component_selected
        - one_adjustment_selected
        - retry_condition_defined
      - measurement_id: feedback_consent_and_privacy
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - self_review_or_consent_confirmed
        - no_observer_identity
        - no_feedback_narrative
        - no_public_artifact
      - measurement_id: abusive_or_coerced_feedback
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A4
    sequence: 4
    title: Retry once and compare performance rather than effort
    instructions: 'Open Comparable retry and use its new four-value dataset with the same criteria, time
      limit, tool and supports, plus the one chosen correction. Keep the attempt before revealing the
      retry check; record the observed fraction out of four and actual duration. Compare each criterion
      with baseline, allowing improved, unchanged, worse, mixed or not comparable. Do not add repetitions
      or raise difficulty within this retry. Only after reviewing the comparison, choose the guide’s concrete
      next-cycle progression or a reason to pause. Improvement on this small component does not establish
      transfer to a larger skill.


      Observation checks: A comparable or easier retry is actually attempted; The same criterion denominator
      is used both times; Unchanged worse and improved results are all permitted; The next progression
      decision follows the observed performance. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Which criterion changed after the one correction, under what support conditions, and
      what comparable attempt would help check whether that change lasts? If all four were already met,
      report maintenance rather than improvement. Choose the next-cycle challenge only when the component
      is controlled; time spent alone is not evidence of a skill gain.


      Examples: Supportive: The baseline formula omitted the first input: C1 and C3 were not met, and
      its changed-input result also failed C4. After an endpoint check, the comparable retry met all four
      criteria. The private comparison is 1/4 to 4/4; it supports this small component under these conditions,
      not general spreadsheet mastery.


      Mixed: The retry improved, but changed support or easier material made the size of the skill change
      uncertain.


      Contradictory: Difficulty was escalated through pain or humiliation, or extra practice time was
      represented as proof of competence.


      Inconclusive: A practice plan and feedback opinion were recorded without a baseline and comparable
      retry.'
    expected_time: 15 minutes
    due_within_days: 14
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-DELIBERATE-PRACTICE-01
      action_stable_id: PRACTICE-DELIBERATE-PRACTICE-01-A4
      competency_stable_id: '10.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 45
      competency_measurement_ids:
      - retry_component_criteria
      - correction_applied
      transfer_disposition: context_bound
      measurements:
      - measurement_id: retry_component_criteria
        kind: bounded_frequency
        role: primary
        weight: '1'
        allowed_provenance:
        - firsthand_self_report
        direction: at_least
        minimum: '0'
        target: '0.5'
        maximum: '1'
      - measurement_id: correction_applied
        kind: boolean
        role: primary
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: retry_comparability
        kind: artifact
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - same_component
        - same_criteria
        - comparable_or_lower_difficulty
        - result_category_recorded
      - measurement_id: retry_harm_or_overpractice
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
