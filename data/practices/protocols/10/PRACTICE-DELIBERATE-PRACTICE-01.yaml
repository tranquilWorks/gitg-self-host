instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.02'
  title: Repair one summation error and compare a fresh retry
  scored: false
  sections:
  - id: method
    kind: concept
    title: Practice a component, not just a duration
    body: A component is a small operation you can inspect separately. Here it is selecting exactly four
      input cells for a sum and keeping the result linked when an input changes. First fix success criteria,
      preserve a baseline, obtain criterion-specific feedback, choose one correction and retry with comparable
      inputs. Difficulty should permit harmless mistakes while letting you inspect what went wrong. A
      single improved retry is a useful observation, not proof that practice caused lasting improvement.
      This original exercise is not a validated training program.
  - id: worked-example
    kind: worked_example
    title: Example on different cells
    body: For an example, put 2 in B1 and 6 in B2. In B3 enter =SUM(B1:B2); the result is 8. The colon
      names the inclusive range, from the first endpoint through the last. If B2 changes to 7, the result
      becomes 9. Typing 8 into B3 produces the original total but will not update; =SUM(B2:B2) omits the
      first input. On paper, write 2+6=8, cross-reference each addend to its input, then write a separate
      2+7=9 after the change. Paper tests selection and recalculation, not spreadsheet behavior. Restore
      any changed input before starting another attempt.
  - id: criteria
    kind: material
    title: Four criteria fixed before the attempt
    body: 'C1 — The calculation includes every one of the four designated input cells or paper values
      exactly once.

      C2 — It excludes the unrelated value and the result cell itself.

      C3 — The first result equals the independently checked total for the original input set.

      C4 — After changing only the designated last input, the same spreadsheet formula updates to the
      correct new total; on paper, preserve the original and make a correct separate recalculation.


      Use observed / not observed / uninspected for each criterion. A correct number alone does not establish
      C1 or C2: inspect the formula or written addends. The recorded fraction is the number observed divided
      by four, with uninspected criteria excluded from the numerator. Retain uninspected separately from
      inspected failures; if a comparison depends on an uninspected criterion, mark that comparison inconclusive.
      This private checklist does not replace the application’s existing evidence fields.'
  - id: attempt-record
    kind: material
    title: A record for each attempt
    body: 'Route and tool: __. Planned time limit (5–15 minutes): __. Actual duration: __. Access and
      content supports: __. Original input copy and formula/written addends: __. First result: __. Changed
      input and resulting calculation: __. C1 [observed / not observed / uninspected], reason: __. C2:
      __. C3: __. C4: __. Observed fraction: __/4. Original attempt preserved at: __. One correction chosen
      after the baseline: __. Retry result category and comparability limits: __. Keep this record private;
      do not overwrite a failed attempt with the answer key.'
  - id: baseline
    kind: prompt
    title: 'Baseline: include the right cells'
    body: In a blank sheet put 3 in A1, 5 in A2, 7 in A3 and 9 in A4. Put the unrelated value 100 in A5.
      Use A6 for a formula summing only A1 through A4. On paper label the same five values and write an
      addition using only A1–A4. Preserve the first result and formula/addends. Change only A4 from 9
      to 10; record the new result without replacing a formula with a typed total. Stop at the chosen
      limit, keep the original attempt, then reveal the check. Do not use the worked example’s B cells.
    references:
    - criteria
    - attempt-record
    check_id: baseline-key
    attempt_mode: practice
  - id: diagnosis
    kind: concept
    title: Turn a failed criterion into one correction
    body: If an endpoint is missing, trace the source list from its first through its last intended input.
      If an unrelated cell is included, compare the selected range with the four permitted inputs. If
      the formula is correct but the total differs, inspect the entered values before changing the method.
      If the total stays fixed after the change, inspect whether you entered a number rather than a live
      formula. Choose exactly one correction supported by the preserved output, not a new goal such as
      speed or attractive formatting. If all criteria were met, report no demonstrated weakness; a preventive
      check can test maintenance but cannot establish improvement.
  - id: retry
    kind: prompt
    title: 'Comparable retry: new values, same component'
    body: Start a fresh sheet or paper copy. Put 4 in A1, 6 in A2, 8 in A3 and 10 in A4; A5 is the unrelated
      value 100. Use A6 for the sum of A1–A4, or write those addends on paper. Apply your one recorded
      correction, keeping the original time limit, tool, supports and four criteria. Preserve the first
      result. Change only A4 from 10 to 11 and record the result. Keep both outputs before revealing the
      check, then compare C1–C4 with baseline individually.
    references:
    - criteria
    - attempt-record
    check_id: retry-key
    attempt_mode: practice
  - id: access
    kind: pathway
    title: Keep the access route honest
    body: Use zoom, a screen reader, keyboard navigation or speech entry already available to you. Preserve
      these supports in both attempts. If cell navigation is unfamiliar, use paper for the complete default;
      learning an unfamiliar interface is a different component. State when a helper supplies the formula
      rather than only entering your dictated response. Extra help on retry can be useful, but it prevents
      attributing the difference solely to your correction. Never use consequential financial, medical
      or work data as practice input.
  - id: next-cycle
    kind: next_step
    title: When and how to raise difficulty
    body: 'Do not increase difficulty in the scored retry. If C1–C4 are reliably met with comparable supports,
      plan a separate future cycle that changes only input selection: put 4, 6, 8 and 10 in A1, A3, A5
      and A7; put unrelated 100s in A2, A4 and A6, and place the result in A8. Keep the same four criterion
      meanings and change the last intended input from 10 to 11 for C4. Before attempting, fix the same
      time limit and checking route; inspect each selected reference, then independently add only the
      four intended values on paper to check both totals. This introduces nonadjacent selection, not larger
      numbers, speed or more criteria at once. If the original component still fails, repeat a new comparable
      cycle with the specific correction instead. Stop when tired or frustrated; more elapsed practice
      is not itself a better result.'
  checks:
  - id: baseline-key
    title: Check the baseline after keeping it
    body: 'An inclusive reference formula is =SUM(A1:A4). Original total: 24. After A4 changes to 10:
      25. Inspect the selected inputs for C1 and C2; matching totals alone are insufficient. The paper
      route must show 3+5+7+9 and then 3+5+7+10 separately. A plausible omission =SUM(A2:A4) gives 21
      and then 22: C2 is observed, but C1, C3 and C4 are not, giving 1/4. A typed 24 looks right initially
      but has no input references and remains 24: it cannot pass C1 or C4. A blank calculation is unattempted,
      not a failed completed attempt. Preserve the actual first result before correcting anything.'
    criteria:
    - Inspect all four intended inputs exactly once, not just the result.
    - Exclude A5 and A6 from the sum.
    - Check original 24 and changed-input 25 independently.
    - Keep observed, not observed and uninspected distinct; choose one specific correction.
  - id: retry-key
    title: Check and compare the retry
    body: 'The intended formula is =SUM(A1:A4). Original total: 28. After A4 changes to 11: 29. The paper
      route shows 4+6+8+10 and then 4+6+8+11. A range including A5 gives 128 and then 129; it includes
      the intended inputs but fails exclusion and both result checks. A typed 28 does not establish a
      live range or updating. Compare each of the same four criteria with baseline. A change from 1/4
      to 4/4 with the endpoint correction is improvement on the supplied tasks. From 4/4 to 4/4 is maintenance.
      More time or new content help makes the comparison limited even if the result improves. No long-term
      retention or larger-skill transfer was tested.'
    criteria:
    - Apply C1–C4 with the same denominator of four.
    - Check original 28 and changed-input 29 independently.
    - Record worse, unchanged and mixed results as well as improvement.
    - Explain changed supports or conditions before claiming a comparable improvement.
