instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.01'
  title: Learn, retrieve, correct and check a new application
  scored: false
  sections:
  - id: how-to-use
    kind: concept
    title: What this practice can show
    body: This is a small learning-method trial. Reading a solution, retrieving it from memory, explaining
      it with help, and applying it to unfamiliar material provide different observations. None alone
      establishes broad learning ability. Use each prompt once before opening its check, keep the first
      response, then correct a specific error. The intended schedule is day one, the next day, and about
      a week later; record what actually happened. A gap on a calendar does not prove retention.
  - id: learning-methods
    kind: concept
    title: What each learning method asks you to do
    body: Retrieval means producing an answer before reopening its explanation; recognizing a familiar
      sentence is different. Spacing means returning after a recorded interval rather than doing every
      attempt together. Interleaving means switching between question types so you must choose the method,
      rather than applying the same operation repeatedly. Elaboration means explaining why a method works
      and when it would be wrong. Worked and contrasting examples let you compare those choices. Feedback
      is checking the preserved attempt and correcting a specific error, not replacing the first response
      with a neat copy. Keep ordinary sleep, rest and necessary access supports; this exercise neither
      measures sleep nor prescribes a sleep schedule. The sessions below put these methods into a small
      trial; they cannot determine which method caused any change.
  - id: six-ideas
    kind: concept
    title: Six ideas to learn
    body: 'Mean: add the values and divide by their count. Median: sort the values; select the middle
      value for an odd count, or average the two middle values for an even count. Range: subtract the
      smallest value from the largest. Numerator: the number above the fraction bar; in a parts-of-a-whole
      example it counts the chosen equal parts. Denominator: the number below the bar; in that example
      it states how many equal parts form the whole, and it cannot be zero. Unit: the named quantity scale,
      such as minutes or meters; it gives a measured number meaning.


      For the mean, a fair-share interpretation helps: redistribute the total equally across the recorded
      items. Sorting changes order, not the values. A median uses position after sorting; the mean uses
      every value. A range describes the distance between the extremes, not the typical value. These are
      definitions and a bounded teaching example, not a claim that this exercise is a validated intervention.'
  - id: worked-even
    kind: worked_example
    title: 'Worked example: an even set'
    body: Four waiting times are 2, 4, 6 and 8 minutes. Their sum is 20 minutes and count is 4, so the
      mean is 20/4 = 5 minutes. The middle values are 4 and 6, so the median is (4+6)/2 = 5 minutes. The
      range is 8−2 = 6 minutes. In 3/4 of a one-meter strip, 3 is the numerator and 4 is the denominator;
      the length is three quarters of a meter.
  - id: session-record
    kind: material
    title: Private session record
    body: 'Use one copy per session. Session: [first / second / delayed]. Actual date and interval since
      first and previous attempt: __. Intended next session: __. For each of the six ideas record: original
      explanation | unaided / cued / looked-up / open explanation | correct / partial / incorrect / unattempted
      | correction with reason. For each application keep calculation, unit and explanation before checking.
      Access aids used: __. Content help used: __. Specific unresolved error: __. Next question or example
      to try, and planned interval: __. A blank is unattempted, a wrong answer is an attempt, and a corrected
      answer does not erase the first result.'
  - id: worked-skew
    kind: worked_example
    title: 'Worked example: the summaries differ'
    body: 'For 1, 2 and 9 minutes, the sum is 12 minutes and count is 3: mean 4 minutes. The sorted middle
      value gives median 2 minutes. Range is 9−1 = 8 minutes. The mean and median answer different questions;
      an unusually large value affects the mean while it may leave the middle position unchanged. If you
      obtained median 4, check whether you averaged when the question asked for the sorted middle.'
  - id: first-recall
    kind: prompt
    title: First recall and application
    body: '1. Explain mean.

      2. Explain median, including what happens with an even count.

      3. Explain range.

      4. Identify and explain a numerator.

      5. Identify and explain a denominator, including its nonzero condition.

      6. Explain why a unit belongs with a measured number.


      Apply: for 2, 4 and 6 minutes, find the mean, median and range. Explain your method. Then explain
      why mean and median need not be equal in every dataset. Keep this response before opening the check.'
    check_id: first-key
    attempt_mode: unaided
    references:
    - session-record
  - id: second-mixed
    kind: prompt
    title: Second mixed practice
    body: '1. Explain range, then find it for 3, 5 and 8 minutes.

      2. Explain numerator and denominator; identify both in 3/7 and state the denominator restriction.

      3. Explain mean and how its operation differs from range.

      4. Explain why five minutes and five meters cannot be added as one measured quantity.

      5. Explain median, including an even count, and why it can differ from the mean.

      6. Explain why units belong with measured numbers.


      Switch between definitions and applications without reopening the teaching. Record the actual interval
      and keep your original responses before checking.'
    check_id: second-key
    attempt_mode: unaided
    references:
    - session-record
  - id: delayed-transfer
    kind: prompt
    title: Delayed recall and new application
    body: '1. Explain mean.

      2. Explain median, including what happens with an even count.

      3. Explain range.

      4. Identify and explain a numerator.

      5. Identify and explain a denominator, including its nonzero condition.

      6. Explain why a unit belongs with a measured number.


      New application: three waiting times are 2, 5 and 11 minutes. Find the mean, median and range. Now
      change only the largest time from 11 to 17 minutes. Recalculate all three summaries, state each
      change in minutes, and explain which summary changes most and why. Record the actual delay and any
      help. Keep the attempt before opening its check.'
    check_id: delayed-key
    attempt_mode: unaided
    references:
    - session-record
  - id: support-paths
    kind: pathway
    title: Choose an honest way to attempt
    body: Audio, large print, accessible input and tactile counters can remain available throughout. Distinguish
      access support from content assistance. Unaided means the response preceded content cues or answer
      access; cued means a hint was used; looked-up means the reference supplied information; open explanation
      means you intentionally reasoned with the reference available. Do not erase supported responses.
      If recalling math definitions is already easy, use six unfamiliar ideas from a source you can actually
      inspect, predeclare an equivalent unseen application and a reliable checking method, and preserve
      those materials; the supplied arithmetic route remains the complete default.
  - id: next-review
    kind: next_step
    title: Choose the next review from the error
    body: Privately note idea, original response, support, check result, corrected reasoning and next
      review. A complete answer with a wrong method needs a method correction; a correct definition with
      a wrong application needs a new example. Missing units need an explicit quantity check. Keep one
      specific unresolved point for another spaced attempt and record the interval you can actually use.
      The exercise observes these responses; it does not establish long-term change beyond the sessions
      performed.
  checks:
  - id: first-key
    title: Check the first attempt
    body: 'Mean: add the values and divide by their count. Median: sort the values; select the middle
      value for an odd count, or average the two middle values for an even count. Range: subtract the
      smallest value from the largest. Numerator: the number above the fraction bar; in a parts-of-a-whole
      example it counts the chosen equal parts. Denominator: the number below the bar; in that example
      it states how many equal parts form the whole, and it cannot be zero. Unit: the named quantity scale,
      such as minutes or meters; it gives a measured number meaning.


      For 2, 4 and 6 minutes: sum 12, count 3, mean 4 minutes; median 4 minutes; range 4 minutes. Equality
      here does not make the definitions interchangeable. A valid explanation distinguishes using all
      values from using sorted middle position.'
    criteria: &id001
    - Check the original response before correcting it; do not replace the first attempt with the key.
    - Each definition must explain its operation or meaning, not merely name the word.
    - Calculations must match the supplied values and use the given units.
    - Separate an incorrect response from an unattempted one; record support and actual delay without
      treating either as a personal score.
  - id: second-key
    title: Check the second attempt
    body: 'Mean: add the values and divide by their count. Median: sort the values; select the middle
      value for an odd count, or average the two middle values for an even count. Range: subtract the
      smallest value from the largest. Numerator: the number above the fraction bar; in a parts-of-a-whole
      example it counts the chosen equal parts. Denominator: the number below the bar; in that example
      it states how many equal parts form the whole, and it cannot be zero. Unit: the named quantity scale,
      such as minutes or meters; it gives a measured number meaning.


      Range is 8−3 = 5 minutes. The denominator in 3/7 is 7. Minutes measure time and meters measure length,
      so these cannot be combined by adding their bare numbers into one of those quantities. In 3/7, the
      numerator is 3. The mean uses the total and count, whereas range uses only the smallest and largest
      values.'
    criteria: *id001
  - id: delayed-key
    title: Check the delayed application
    body: 'Mean: add the values and divide by their count. Median: sort the values; select the middle
      value for an odd count, or average the two middle values for an even count. Range: subtract the
      smallest value from the largest. Numerator: the number above the fraction bar; in a parts-of-a-whole
      example it counts the chosen equal parts. Denominator: the number below the bar; in that example
      it states how many equal parts form the whole, and it cannot be zero. Unit: the named quantity scale,
      such as minutes or meters; it gives a measured number meaning.


      For 2, 5 and 11 minutes: sum 18 and count 3 give mean 6 minutes; median 5 minutes; range 9 minutes.
      For 2, 5 and 17: sum 24 gives mean 8 minutes; median 5 minutes; range 15 minutes. Changes are mean
      +2, median 0, range +6 minutes. The range changes most: its upper endpoint increased by six while
      its lower endpoint stayed fixed. The mean spreads that six-minute increase across three observations.
      The sorted middle stays 5. A response giving median 6 confuses the mean with the middle; a response
      saying all summaries increase by six does not follow the definitions.'
