  setup: 'Use the supplied learning guide, paper or an accessible note tool. It contains six definitions,
    two worked examples, and separate first, second and delayed prompts with matching checks. Study the
    teaching first; open only the prompt for the current session. Keep your original response before revealing
    its check. No purchased materials or private information are needed. Goal: Use retrieval, spacing,
    mixed practice, explanation and feedback to learn a small set of ideas, then test retention and a
    new application after a delay. Scope: This is a learning-method trial, not an intelligence test or
    proof that one schedule suits every learner. Ordinary sleep and access supports remain protected.
    Time and effort: Fifteen minutes on day one, ten minutes on day two, and fifteen minutes about a week
    later. Adaptation: Use audio cards, large print, tactile counters or supported recall. Adjust the
    spacing to available capacity and report the actual delay. A same-day repetition is useful practice
    but must not be labeled a week-delayed retention test. Keep personal working notes outside the check-in;
    record only the listed observations.'
