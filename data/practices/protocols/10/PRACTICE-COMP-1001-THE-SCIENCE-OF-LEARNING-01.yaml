    sequence: 1
    title: Study an example and retrieve before looking again
    instructions: 'Read the six definitions and both worked examples in the learning guide. Explain why
      the mean uses the count and why the median can differ from it. Close the teaching, open First recall
      and application, and answer all six ideas plus the application before opening its check. Preserve
