instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.13'
  title: Preserve knowledge without taking over its authority
  scored: false
  sections:
  - id: transmission-model
    kind: concept
    title: Preserve reasons, relationships and permission
    body: Knowledge transmission preserves why a practice works, when it changes and who may correct or
      receive the account. It is not extraction of a story into unrestricted content. An experienced holder
      can decline, restrict recording or correct the draft. Age alone does not make one account infallible.
      A useful record retains variation and provenance instead of declaring one official tradition. The
      supplied packet is fictional and cannot provide actual holder verification.
  - id: holder-packet
    kind: material
    title: H0 — fictional tool-library holder packet
    body: H0 is an experienced volunteer describing this shift's first ten minutes with a newcomer. Permission
      is notes yes, audio no; attribution is experienced volunteer; audience is the volunteer team only,
      not the public. Do not include member names. Five actions are greet the newcomer; ask their preferred
      name and pronunciation; explain the checkout board; offer a quiet walk or paired tour; arrange a
      willing buddy if requested. The reason is to avoid overwhelming a new person. Exception is a return-only
      visit, when the tour is skipped. A common mistake is lecturing about tools before asking what the
      person needs. Another shift starts at the return desk. These are fictional practice facts, not universal
      tool-library policy or a living community's testimony.
  - id: worked-garden
    kind: worked_example
    title: Different example — a garden handoff
    body: A fictional garden note says water every morning. Its holder corrects it to check soil first
      and skip watering when already wet; that exception prevents the bare schedule from replacing judgment.
      The note is for plot stewards only, with no public attribution. A repaired instruction can be accurate
      yet still unauthorized for a public blog. The writer returns both content and destination for confirmation;
      a missing reply is not approval.
  - id: permission-record
    kind: material
    title: Permission and verification record
    body: 'Route (live holder or supplied simulation): __. Holder relationship to practice: __. Agreed
      scope: __. Written notes allowed: __. Audio or images allowed: __. Attribution: __. Audience and
      destination: __. Excluded details: __. Purpose: __. Steps: __. Reason: __. Exception: __. Common
      mistake: __. Variation: __. Remembered fact versus interpretation: __. Draft returned on: __. Holder
      corrections: __. Final content and sharing confirmation: __. Review date: __. Blank permission or
      verification means do not share as endorsed.'
  - id: draft-prompt
    kind: prompt
    title: Draft a bounded handoff from H0
    body: Before revealing the check, write a short handoff with the five actions, reason, return-only
      exception, common mistake and other-shift variation. Attach the exact recording, attribution and
      audience boundaries. Identify what remains unverified in this fictional route. Do not add a claim
      of official policy, treat age as proof or invent a real holder's approval. On the live route, return
      the draft to the willing holder before any agreed handoff.
    references:
    - holder-packet
    - permission-record
    check_id: draft-key
    attempt_mode: practice
  - id: verification-model
    kind: concept
    title: Accuracy and distribution are separate checks
    body: Ask what is inaccurate, missing, too private or overgeneralized, then revise and confirm the
      intended audience. Consent to a conversation is not publication consent. An accurate draft awaiting
      holder response is pending; a verified team-only record posted publicly is adverse, not a successful
      transmission. A public archive can support source study but cannot supply personal permission or
      a verification conversation that never occurred.
  - id: correction-prompt
    kind: prompt
    title: Repair a flawed handoff
    body: Audit fictional D1 against H0 before opening the check. D1 says all tool libraries must publicly
      introduce a newcomer's full name, give a compulsory tool lecture and assign a buddy; the oldest
      volunteer guarantees this is official policy; an audio recording should be posted online. Identify
      each unsupported or forbidden change, produce a corrected short replacement, and state the permission
      and verification still required before a real handoff. Do not silently repair the text while retaining
      its false endorsement.
    references:
    - holder-packet
    - permission-record
    check_id: correction-key
    attempt_mode: practice
  - id: access-path
    kind: pathway
    title: Let the holder choose a usable and bounded process
    body: Offer readback, large print, a jointly drawn sequence or a mutually agreed interpreter. Audio
      requires separate permission; refusing it does not obstruct participation. Stop if material becomes
      sacred, private, commercially protected or outside the holder's authority. If no holder is available,
      complete H0 analysis as simulation, not community endorsement. A later real encounter may preserve
      legitimate disagreement rather than force consensus.
  - id: next-handoff
    kind: next_step
    title: Complete only the permitted handoff
    body: After actual holder confirmation, offer the corrected record to a willing recipient in the agreed
      audience or store it at the agreed location with a review date. Invite a recipient question and
      return uncertain points to the holder. For advanced practice, compare a second willing holder's
      version with separate consent and preserve both contexts. The simulation does not authorize contacting,
      recording or publishing a real community.
  checks:
  - id: draft-key
    title: Check content and permission together
    body: A complete H0 handoff greets, asks preferred name and pronunciation, explains the checkout board,
      offers a quiet walk or paired tour, and arranges a willing buddy only if requested. Keep the overwhelm
      reason, skip-tour return-only exception, avoid-lecture mistake and other shift's return-desk variation.
      Notes yes and audio no remain separate; attribution is experienced volunteer and sharing is volunteer-team-only
      with no member names. This is a fictional reconstruction awaiting any real holder's verification,
      not an endorsed universal policy.
    criteria:
    - Five actions retained with optional choices
    - Reasons exceptions and variation preserved
    - Recording attribution and audience explicit
    - Fictional reconstruction is not holder approval
  - id: correction-key
    title: Check the flawed draft repair
    body: D1 violates scope by turning one shift into all libraries, preferred name into a public full-name
      announcement, an optional tour into a compulsory lecture, and a requested willing buddy into an
      assignment. Age does not establish official authority. Posting audio violates both audio refusal
      and team-only sharing. Replace it with the five H0 actions and their reason, exception and variation;
      preserve attribution and no-member-name limits. A live holder must confirm the final content and
      destination before an endorsed handoff. No response means pending, not consent; the supplied fictional
      packet cannot confer real approval.
    criteria:
    - Every unsupported change identified
    - Replacement restores H0 choices and context
    - Content and distribution checked separately
    - No fictional or silent endorsement inferred
