meaning_and_fit:
  purpose: Document or teach one practical story, procedure or tradition through a relationship, verify
    it with an experienced holder and preserve the agreed limits on sharing.
  why_recommended: Document or teach one practical story, procedure or tradition through a relationship,
    verify it with an experienced holder and preserve the agreed limits on sharing.
  claims:
  - statement: Document or teach one practical story, procedure or tradition through a relationship, verify
      it with an experienced holder and preserve the agreed limits on sharing.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Articles 2, 13, 14 and 15 connect safeguarding with intergenerational transmission, context-sensitive
      renewal, non-formal education, community participation and respect for customary access restrictions.
    classification: professional_or_public_standard
    source_ids:
    - SRC-UNESCO-ICH-TRANSMISSION-2003
    limitations: Not legal advice, a designation of the fictional tool-library practice as cultural heritage,
      validation of this exercise or permission to publish any holder's knowledge. The granular consent
      and readback record is an original product safeguard, not a quoted Convention procedure.
  applicability_question: Does a voluntary, bounded Communal and intergenerational knowledge transmission
    practice fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Communal and intergenerational knowledge transmission as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use audio only with permission, a large-print draft, an interpreter or a jointly
    drawn sequence. A public archive can support source study when no holder is available, but it does
    not supply personal permission or verification that did not occur.
  opportunity_considerations: 'Default: ask a willing experienced person how a small group welcomes a
    new member or hands over a shared task. Use a page with purpose, steps, reasons, exceptions, source
    holder and sharing permission. The holder may choose a different ordinary practice or decline. Do
    not request family secrets, protected work procedures or cultural knowledge they are not authorized
    to share.'
  prerequisites:
  - 'Default: ask a willing experienced person how a small group welcomes a new member or hands over a
    shared task. Use a page with purpose, steps, reasons, exceptions, source holder and sharing permission.
    The holder may choose a different ordinary practice or decline. Do not request family secrets, protected
    work procedures or cultural knowledge they are not authorized to share.'
  dependencies: []
  safe_alternatives:
  - Use audio only with permission, a large-print draft, an interpreter or a jointly drawn sequence. A
    public archive can support source study when no holder is available, but it does not supply personal
    permission or verification that did not occur.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Communal and intergenerational knowledge transmission differently while preserving consent, evidence
    limits, safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Communal and intergenerational
    knowledge transmission as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-RELATIONAL-CONVERSATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: ask a willing experienced person how a small group welcomes a new member or hands over
    a shared task. Use a page with purpose, steps, reasons, exceptions, source holder and sharing permission.
    The holder may choose a different ordinary practice or decline. Do not request family secrets, protected
    work procedures or cultural knowledge they are not authorized to share. Goal: Document or teach one
    practical story, procedure or tradition through a relationship, verify it with an experienced holder
    and preserve the agreed limits on sharing. Scope: This preserves one contribution to communal memory.
    It does not make the participant the owner of another person’s knowledge or authorize disclosure of
    sacred, private, restricted or commercially protected material. Time and effort: Ten minutes to agree
    scope, a twenty-minute demonstration or conversation, and fifteen minutes for a verified revision.
    Adaptation: Use audio only with permission, a large-print draft, an interpreter or a jointly drawn
    sequence. A public archive can support source study when no holder is available, but it does not supply
    personal permission or verification that did not occur. Keep personal working notes outside the check-in;
    record only the listed observations.


    Reference support:

    Convention for the Safeguarding of the Intangible Cultural Heritage: https://www.unesco.org/en/legal-affairs/convention-safeguarding-intangible-cultural-heritage'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use audio only with permission, a large-print draft, an interpreter or a jointly
    drawn sequence. A public archive can support source study when no holder is available, but it does
    not supply personal permission or verification that did not occur.
  expected_burden: Ten minutes to agree scope, a twenty-minute demonstration or conversation, and fifteen
    minutes for a verified revision.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Communal and intergenerational knowledge transmission protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Communal and intergenerational knowledge transmission action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use audio only
    with permission, a large-print draft, an interpreter or a jointly drawn sequence. A public archive
    can support source study when no holder is available, but it does not supply personal permission or
    verification that did not occur.
  actions:
  - stable_id: PRACTICE-COMP-1013-COMMUNAL-AND-INTERGENERATIONAL-KNOWLEDGE-TRANSMISSION-01-A1
    sequence: 1
    title: Agree what may be learned recorded and passed on
    instructions: 'Explain that you want to prevent one useful practice from being lost. Ask what may
      be written, whether attribution is wanted, who may receive it and what should remain unrecorded.
      Identify the holder’s relationship to the practice without assuming that age or status alone guarantees
      accuracy. Agree on a small scope, such as the first ten minutes of welcoming a newcomer.


      Observation checks: The holder freely chooses the scope; Recording attribution and sharing permissions
      are explicit; Restricted or private knowledge is excluded; The holder’s experience is described
      without treating status as infallible. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1013-COMMUNAL-AND-INTERGENERATIONAL-KNOWLEDGE-TRANSMISSION-01
      action_stable_id: PRACTICE-COMP-1013-COMMUNAL-AND-INTERGENERATIONAL-KNOWLEDGE-TRANSMISSION-01-A1
      competency_stable_id: '10.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1013_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1013_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_holder_freely_chooses_the_scope
        - recording_attribution_and_sharing_permissions_are_explicit
        - restricted_or_private_knowledge_is_excluded
        - the_holder_s_experience_is_described_without_treating_status_as_infallible
      - measurement_id: c1013_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1013_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1013-COMMUNAL-AND-INTERGENERATIONAL-KNOWLEDGE-TRANSMISSION-01-A2
    sequence: 2
    title: Learn through a demonstration or concrete story
    instructions: 'Ask the holder to walk through an actual or fictionalized example. Record not just
      what happens but why a step matters, what changes with context and which mistake a newcomer commonly
      makes. Participate in a safe demonstration when invited. Distinguish remembered fact, personal interpretation
      and a version that differs across families or groups; do not flatten variation into a single official
      tradition.


      Observation checks: A concrete example or demonstration is obtained; Reasons exceptions and a common
      mistake are captured; Observation and interpretation remain distinguishable; Legitimate variation
      is preserved. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1013-COMMUNAL-AND-INTERGENERATIONAL-KNOWLEDGE-TRANSMISSION-01
      action_stable_id: PRACTICE-COMP-1013-COMMUNAL-AND-INTERGENERATIONAL-KNOWLEDGE-TRANSMISSION-01-A2
      competency_stable_id: '10.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1013_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1013_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
