instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.04'
  title: Plan, trace and audit a bounded research answer
  scored: false
  sections:
  - id: research-model
    kind: concept
    title: Match the source to the claim and decision
    body: 'Research is an iterative inquiry, not link collection. Start with the decision and its subquestions.
      A primary source is closest to issuing the rule, measurement or original record; an expert source
      interprets within demonstrated relevant expertise; an affected-person or community source can reveal
      experience and missing perspectives. None is automatically best for every claim. Authority is contextual:
      a service policy fits the service’s own current borrowing rule, while a user post may identify a
      practical concern but cannot amend that policy. Currency means the version effective for the decision,
      not merely the newest timestamp. Preserve uncertainty when authority, scope or evidence is absent.'
  - id: research-plan
    kind: material
    title: Research plan and stopping rule
    body: 'Decision: __. Subquestions: eligibility | limit | duration | effective date | exceptions. For
      each write: evidence needed | likely issuing body or expert | search terms or offline card | alternate
      perspective | consequence if wrong. Stop when every material claim has a fitting inspectable source
      or is explicitly unknown, the decision can be made within its stated scope, and one additional search
      is unlikely to change it. Stop earlier for unauthorized access, private data, paid access outside
      the plan or stakes requiring qualified advice.'
  - id: source-cards
    kind: material
    title: Fictional lending-service source cards
    body: 'P1 — Northstar Tool Library, “Standard Borrowing Policy,” issued 10 January 2026, effective
      10 January 2026, locator northstar.example/policy. Text: members may borrow one item at a time for
      seven calendar days. The card does not define member eligibility or exceptions.


      P2 — Northstar Tool Library, “April Limit Update,” issued 15 March 2026, effective 1 April 2026,
      locator northstar.example/april-update. Text: beginning 1 April, the simultaneous item limit changes
      from one to two. All other Standard Borrowing Policy terms remain unchanged. The card does not define
      eligibility or exceptions.


      P3 — River District Neighbors forum, post by “HelpfulNeighbor,” issued 20 February 2026, no official
      effective date, locator forum.example/thread-44. Text: “I think returns are monthly now.” The writer
      provides no policy link or role. These are fictional records; the locators must not be opened or
      treated as real rules.'
  - id: claim-matrix
    kind: material
    title: Source and claim matrix
    body: 'One row per claim: C-ID | exact claim | source code and locator | issuer/author | source role
      [primary / expert / community] | publication date | effective date | relevant passage in your own
      words | authority for this claim | conflict or limitation | disposition [supported / qualified /
      rejected / unknown]. Keep rejected and unknown rows. An answer is traceable only when another reader
      can locate the same source and see why it does or does not support the exact claim.'
  - id: answer-template
    kind: material
    title: Bounded research answer and audit log
    body: 'Question and decision context: __. Checked on: __. Confirmed: [claim plus source code]. Interpretation:
      [reasoning clearly labeled]. Unknown: [missing fact and consequence]. Before acting: [specific clarification
      route]. Scope limit: __. Audit one row per material claim: wording matches source [yes/no] | number/date
      matches [yes/no] | source has authority for this claim [yes/no] | current/effective for context
      [yes/no] | uncertainty retained [yes/no] | correction. A clean citation format cannot rescue a source
      that does not support the claim.'
  - id: worked-answer
    kind: worked_example
    title: Worked claim trail for the fictional case
    body: For borrowing on or after 1 April 2026, the simultaneous limit is two items [P2]. The seven-calendar-day
      period remains because P2 leaves other P1 terms unchanged [P2; P1]. The cards do not state who qualifies
      as a member or what exceptions exist, so both are unknown. P3’s monthly statement is rejected for
      the policy claim because it has no issuing authority or supporting policy. Before acting on an exception,
      ask the service through its official public contact route. This answer applies only to the fictional
      cards and is not advice about a real library.
  - id: source-role
    kind: prompt
    title: Assign source roles and identify missing evidence
    body: Classify P1, P2 and P3 by source role for the borrowing-rule question. Which card can change
      the item limit? Which can support the loan period after 1 April? What can P3 legitimately contribute?
      List the provenance fields present and the two required subquestions for which no card supplies
      an answer. Preserve the response before opening the key.
    check_id: source-role-key
    attempt_mode: practice
    references:
    - source-cards
    - research-plan
  - id: conflict-resolution
    kind: prompt
    title: Resolve the dates and conflicting claims
    body: 'A draft says: “The March document immediately allows two items for one month, and everyone
      may borrow.” Audit each clause against P1-P3. Write the corrected bounded answer for 20 March and
      for 2 April. State what remains unknown and why the community post does not settle it. Preserve
      the audit before opening the key.'
    check_id: conflict-key
    attempt_mode: practice
    references:
    - source-cards
    - claim-matrix
    - answer-template
  - id: live-and-advanced
    kind: pathway
    title: Move from the packet to a live or advanced question
    body: 'Live route: replace each fictional card with an inspectable current public source and retain
      its provenance. Advanced route: add scholarly or technical claims, searching more than one database
      or vocabulary and comparing methods, populations and limitations rather than counting sources. Use
      a librarian or qualified expert when the domain or access path is unfamiliar. AI may suggest search
      terms or summarize inspected text, but generated citations and quotations are unverified until opened
      and checked against the original.'
  - id: next-research
    kind: next_step
    title: Progress by increasing decision fit and auditability
    body: Transfer the same research plan, matrix and audit to a different low-stakes decision. Increase
      difficulty through a more ambiguous source set, competing expert interpretations or a version history—not
      through higher consequences. One correct fictional policy summary demonstrates a bounded traceable
      answer, not expertise in a domain or general immunity to misinformation.
  checks:
  - id: source-role-key
    title: Check source roles and gaps
    body: P1 and P2 are primary official sources for the fictional service’s own rules. P2 is the only
      card that changes the item limit; P1 supplies the seven-day period and P2 explicitly retains other
      terms. P3 is a community claim that may reveal a question worth checking but has no authority to
      change policy. All cards supply a title or identifier, issuer/author, publication date and locator;
      P1 and P2 also supply effective dates. No card defines eligibility or exceptions.
    criteria:
    - Source role is assigned in relation to the exact borrowing-rule claim.
    - P2 changes only the item limit from its effective date.
    - P3 is retained as a perspective or lead but not treated as policy authority.
    - Eligibility and exceptions remain explicit evidence gaps.
  - id: conflict-key
    title: Check the date-sensitive answer
    body: Every clause in the draft is defective. On 20 March, P2 has been published but is not effective,
      so P1 permits one item for seven days. On 2 April, P2 permits two simultaneous items and retains
      the seven-day period from P1. No card supports a one-month period or universal eligibility. P3’s
      unsupported belief cannot override the official sources. A correct answer labels eligibility and
      exceptions unknown and gives a specific official clarification route.
    criteria:
    - Publication and effective dates are applied separately.
    - The two-item limit begins on 1 April and the seven-day duration remains.
    - Unsupported monthly duration and universal eligibility claims are rejected.
    - The correction retains unknowns, source codes, check date and scope.
