meaning_and_fit:
  purpose: Search beyond a first summary, distinguish primary and expert sources, compare conflicting
    information and attach each conclusion to an identifiable source.
  why_recommended: Search beyond a first summary, distinguish primary and expert sources, compare conflicting
    information and attach each conclusion to an identifiable source.
  claims:
  - statement: Search beyond a first summary, distinguish primary and expert sources, compare conflicting
      information and attach each conclusion to an identifiable source.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The ACRL framework treats research as iterative inquiry, searching as strategic exploration,
      authority as contextual, and source use as an ethical, traceable process; it also calls for refining
      questions, matching methods to information needs, monitoring gaps, organizing information and synthesizing
      multiple sources.
    classification: professional_or_public_standard
    source_ids:
    - SRC-ACRL-INFORMATION-LITERACY-FRAMEWORK
    limitations: A higher-education information-literacy framework rather than a prescriptive checklist,
      universal research method, product validation or evidence that these fictional exercises improve
      curiosity or research ability. ACRL was consulting on a draft revision when inspected; this entry
      refers to the adopted 2016 framework.
  applicability_question: Does a voluntary, bounded Research and information gathering practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Research and information gathering as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a librarian, screen reader, printed policy or accessible official phone
    channel. Keep the same source-to-claim trace when using AI to summarize; generated citations must
    be checked directly. The offline case is research rehearsal, not advice about an actual service.
  opportunity_considerations: Use the supplied fictional lending-service question, three complete source
    cards, research-plan worksheet, claim matrix and audit prompt. No live search is required. An optional
    live route may use current public documents, but every material claim must retain issuer, title, publication/effective
    date, locator, access date and a stated authority/fit limit.
  prerequisites:
  - Use the supplied fictional lending-service question, three complete source cards, research-plan worksheet,
    claim matrix and audit prompt. No live search is required. An optional live route may use current
    public documents, but every material claim must retain issuer, title, publication/effective date,
    locator, access date and a stated authority/fit limit.
  dependencies: []
  safe_alternatives:
  - Use a librarian, screen reader, printed policy or accessible official phone channel. Keep the same
    source-to-claim trace when using AI to summarize; generated citations must be checked directly. The
    offline case is research rehearsal, not advice about an actual service.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Research and information gathering differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Research and information gathering
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied fictional lending-service question, three complete source cards, research-plan
    worksheet, claim matrix and audit prompt. No live search is required. An optional live route may use
    current public documents, but every material claim must retain issuer, title, publication/effective
    date, locator, access date and a stated authority/fit limit. Goal: Search beyond a first summary,
    distinguish primary and expert sources, compare conflicting information and attach each conclusion
    to an identifiable source. Scope: This is a bounded research workflow, not expert certification. Absence
    of a source is an uncertainty, and a polished summary cannot compensate for unverifiable provenance.
    Time and effort: Forty-five minutes, including a ten-minute provenance check. Adaptation: Use a librarian,
    screen reader, printed policy or accessible official phone channel. Keep the same source-to-claim
    trace when using AI to summarize; generated citations must be checked directly. The offline case is
    research rehearsal, not advice about an actual service. Keep personal working notes outside the check-in;
    record only the listed observations.


    Reference support:

    Framework for Information Literacy for Higher Education: https://www.ala.org/acrl/standards/ilframework'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a librarian, screen reader, printed policy or accessible official phone channel.
    Keep the same source-to-claim trace when using AI to summarize; generated citations must be checked
    directly. The offline case is research rehearsal, not advice about an actual service.
  expected_burden: Forty-five minutes, including a ten-minute provenance check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Research and information gathering protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Research and information gathering action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a librarian,
    screen reader, printed policy or accessible official phone channel. Keep the same source-to-claim
    trace when using AI to summarize; generated citations must be checked directly. The offline case is
    research rehearsal, not advice about an actual service.
  actions:
  - stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01-A1
    sequence: 1
    title: Plan a search that can find more than the expected answer
    instructions: 'Open the fictional question and source cards. Split the decision into eligibility,
      item limit, loan period, effective date and exceptions. For each information need name the source
      type and authority that would fit it, then record issuer, title, publication date, effective date,
      locator and access date. Complete the source-role prompt before opening its key; do not infer that
      a polished or recent document has authority over a rule it does not issue.


      Observation checks: The research question is divided into answerable subquestions; A primary source
      is sought rather than only a summary; At least one alternate perspective or interpretation is considered;
      Source title issuer date and locator are recorded. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01
      action_stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01-A1
      competency_stable_id: '10.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1004_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1004_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_research_question_is_divided_into_answerable_subquestions
        - a_primary_source_is_sought_rather_than_only_a_summary
        - at_least_one_alternate_perspective_or_interpretation_is_considered
        - source_title_issuer_date_and_locator_are_recorded
      - measurement_id: c1004_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1004_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01-A2
    sequence: 2
    title: Compare claims and preserve unresolved discrepancies
    instructions: 'Create one claim-matrix row per subquestion and attach exact source codes. Compare
      each source’s scope, authority and effective date. In the fictional case, determine which rule P2
      changes, which P1 rule remains, and why P3 cannot override either official card. Record the missing
      eligibility and exception information as unknown. Complete the conflict prompt before revealing
      its key, preserving rejected claims and the reason for rejection rather than silently deleting them.


      Observation checks: Each factual claim points to a source code; Publication and effective dates
      are distinguished; Conflicting information is resolved by relevant authority and context; Unanswered
      subquestions are not silently filled in. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01
      action_stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01-A2
      competency_stable_id: '10.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1004_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1004_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - each_factual_claim_points_to_a_source_code
        - publication_and_effective_dates_are_distinguished
        - conflicting_information_is_resolved_by_relevant_authority_and_context
        - unanswered_subquestions_are_not_silently_filled_in
      - measurement_id: c1004_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
