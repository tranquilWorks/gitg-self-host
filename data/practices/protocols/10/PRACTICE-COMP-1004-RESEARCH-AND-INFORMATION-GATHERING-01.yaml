      Research and information gathering; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a librarian, screen reader, printed policy or accessible official phone channel. Keep the same
      source-to-claim trace when using AI to summarize; generated citations must be checked directly.
      The offline case is research rehearsal, not advice about an actual service.
    cultural_context:
    - Adapt the expression of Research and information gathering to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a librarian, screen reader, printed policy or accessible official phone channel. Keep the same
      source-to-claim trace when using AI to summarize; generated citations must be checked directly.
      The offline case is research rehearsal, not advice about an actual service.
  pause_conditions:
  - Pause Research and information gathering when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Research and information gathering practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Research and information gathering situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
