        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1004-RESEARCH-AND-INFORMATION-GATHERING-01-A3
    sequence: 3
    title: Write and audit a concise answer
    instructions: 'Write the supplied answer template with confirmed rules, bounded interpretation, unresolved
      questions and scope/date checked. Place a source code immediately after each material claim. Run
      the audit by reopening all three cards, checking claim wording, number, date, authority and omission.
      A claim passes only if its cited source supports that wording. Correct unsupported text while retaining
      the original audit result and one specific official clarification question.


      Observation checks: The summary distinguishes facts interpretation and unknowns; Every material
      claim survives a source recheck; The answer includes its checking date and scope; One unresolved
      issue has a concrete clarification route. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Could another reader follow your source trail and discover the same limitation without
      trusting your confidence or writing style?


      Examples: Supportive: The researcher used the official effective date, retained the seven-day rule
      and explicitly left eligibility unanswered.


      Mixed: The answer was broadly right but one claim lacked a source locator or confused publication
      with effective date.


      Contradictory: A community post or fabricated citation was presented as authoritative policy without
      verification.


      Inconclusive: Several links were collected but no claim-by-claim answer or provenance check was
      produced.'
    expected_time: 15-25 minutes
