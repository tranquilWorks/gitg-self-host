  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Research and information gathering explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Research and information gathering context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Research and information gathering observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Research and information gathering rules withhold observations older than 90
    days; no unrecorded retention or carry-forward assumption applies.
