instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.05'
  title: Make a small knowledge system prove itself through reuse
  scored: false
  sections:
  - id: useful-note-model
    kind: concept
    title: Notes are interfaces to sources and future work
    body: Capture records a source and relevant facts. Compression rewrites enough meaning to be useful
      without copying everything. Connection names where or why the idea matters; a tag with no explained
      relationship is not a connection. Retrieval uses a cue or index that can be tested. Revision changes
      the note when use reveals an error, omission or poor route. A sustainable system minimizes maintenance
      while preserving provenance, findability and use. Finding a note is different from recalling its
      contents without help, and a large archive is not evidence that either occurred.
  - id: averages-source
    kind: material
    title: Supplied source card — comparing averages
    body: Source S1, “Small-set summary definitions,” Grounded Growth fictional teaching card, revision
      1, 8 September 2026. Mean equals the sum of all values divided by their count. Median is the middle
      value after sorting an odd-sized set; for an even-sized set it is the mean of the two middle values.
      For 1, 2 and 9 minutes, mean = (1+2+9)/3 = 4 minutes and median = 2 minutes. The high value pulls
      the mean above the median. Neither summary alone describes the full spread; range or the original
      values may still matter. This card is supplied instructional material, not an external research
      source.
  - id: note-template
    kind: material
    title: Atomic note and revision template
    body: 'Note ID and findable title: __. Source ID, title and revision: __. In my own words: __. Worked
      example with units: __. Meaningful connection—this helps when __ because __. Future-use question:
      __. Retrieval cue or index path: __. Known limit: __. Revision log: date | observed problem | exact
      change | reason. Keep one idea cluster that can stand alone; split the note only when two parts
      need different sources, cues or revision histories.'
  - id: index-template
    kind: material
    title: Three-entry retrieval index and test log
    body: 'The fictional index begins with: Planning estimates → Comparing averages → Note N1; Shopping
      quantities → Unit conversion → Note N2; Reading queue → Source triage → Note N3. Replace N1’s title/path
      with your final choice but leave N2 and N3 as distractors. Retrieval test: cue used | expected note
      | found / alternate route / not found / support needed | elapsed band [under 1 minute / 1-3 / over
      3] | barrier | repair | retest result. Time is diagnostic only, not a score, and accessibility support
      remains available.'
  - id: worked-note
    kind: worked_example
    title: Worked note that is compressed, connected and limited
    body: 'N1 — “Mean reacts to extremes; median uses sorted position.” Source S1 rev 1. Mean shares the
      total across all observations; median selects the middle position after sorting. For 1, 2, 9 minutes:
      mean 4, median 2. Connection: when one planning estimate is unusually high, compare both before
      presenting a typical duration. Future question: which summary changes more if only the highest value
      increases? Cue: Planning estimates → Comparing averages. Limit: neither value reports the full spread.
      This example supports later use without reproducing the entire source card.'
  - id: note-quality
    kind: prompt
    title: Diagnose three candidate notes
    body: 'Evaluate each candidate before opening the rubric. A: “Averages stuff,” no source, pasted full
      card, tags math/data/useful. B: “Mean reacts to extremes; median uses position,” source S1 rev 1,
      own-words distinction, correct 1-2-9 example, planning-estimate connection, cue and spread limit.
      C: descriptive title and source, but says the median of 1, 2, 9 is 4 and has no future-use question.
      Classify each as usable, partial or adverse and name the specific repair.'
    check_id: note-rubric
    attempt_mode: practice
    references:
    - averages-source
    - note-template
  - id: delayed-application
    kind: prompt
    title: Apply the retrieved note to a new dataset
    body: After recording the actual delay and retrieval route, use the note to analyze 2, 3, 4, 5 and
      16 minutes. Calculate mean and median with units. Explain which is more affected by the high value
      and what information is still missing if these summaries are used for planning. State whether you
      found the note, recalled the content without it, used a content hint or looked up the source. Propose
      one exact revision, then preserve the attempt before opening the key.
    check_id: application-key
    attempt_mode: practice
    references:
    - note-template
    - index-template
  - id: format-pathways
    kind: pathway
    title: Keep the function while changing the medium
    body: Use paper, local text, audio, images with alternative text, tactile labels or a supported index.
      A helper may operate the medium while the learner chooses the title, source, explanation, connection
      and revision. Advanced users may use a real technical note and test it against a new problem, but
      confidential or licensed source material must stay in an authorized system. If the default arithmetic
      is already routine, raise conceptual novelty, not archive size or software complexity.
  - id: next-note
    kind: next_step
    title: Progress through spaced reuse and selective maintenance
    body: Reuse the same note in another genuine task, or create one new note with a different source
      and retrieval route. Periodically sample whether notes can be found and applied; revise or retire
      failures instead of reorganizing everything. This exercise observes one note, one route and one
      application. It does not establish long-term retention, broad knowledge management ability or the
      superiority of one note-taking method.
  checks:
  - id: note-rubric
    title: Check the candidate notes
    body: 'B is usable for the supplied future task: it is accurately compressed, source-linked, connected,
      cued and limited. C is partial but materially wrong; correct the median to 2 and add a future-use
      question before relying on it. A is adverse for this purpose: copying preserves text but does not
      provide a findable own-words explanation, source control, meaningful connection or tested cue. Decorative
      tags do not repair those gaps.'
    criteria:
    - Accuracy and provenance are required before formatting or apparent completeness receives credit.
    - Compression retains the mean-median distinction and correct example.
    - A meaningful connection states where and why the note will be used.
    - The cue, limitation and repair remain inspectable.
  - id: application-key
    title: Check the new application and revision
    body: The sum is 30 across five values, so the mean is 6 minutes. The sorted middle is 4, so the median
      is 4 minutes. The value 16 pulls the mean upward more than it changes the median’s position. Neither
      summary states the range, individual values or shape of the set; here the range is 14 minutes. A
      useful revision could add “inspect spread or original values before treating either summary as a
      planning guarantee.” The evidence record must preserve the actual delay and distinguish note retrieval,
      recall, cues and source lookup.
    criteria:
    - Mean is 6 minutes and median is 4 minutes with the calculation preserved.
    - The explanation relates the extreme value to mean and median differently.
    - Missing spread or distribution information is named.
    - The revision responds to the observed use problem and the support/delay record is honest.
