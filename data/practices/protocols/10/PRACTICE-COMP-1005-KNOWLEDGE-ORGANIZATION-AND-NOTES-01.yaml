meaning_and_fit:
  purpose: Capture, compress, connect and retrieve a small piece of knowledge, then revise the note after
    attempting to use it on a new task.
  why_recommended: Capture, compress, connect and retrieve a small piece of knowledge, then revise the
    note after attempting to use it on a new task.
  claims:
  - statement: Capture, compress, connect and retrieve a small piece of knowledge, then revise the note
      after attempting to use it on a new task.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: Cornell's learning-strategy guidance presents note-taking as a purpose-driven practice,
      encourages examining current methods, trying different strategies and assessing which strategy fits
      the situation rather than imposing one medium or system.
    classification: professional_or_public_standard
    source_ids:
    - SRC-CORNELL-NOTE-TAKING-SYSTEM
    limitations: General university learning guidance, not a comparative validation of paper over every
      accessible digital method and not evidence that the product-authored atomic note, index or delayed
      application improves retention. The proprietary Canvas module and videos were not reproduced.
  applicability_question: Does a voluntary, bounded Knowledge organization and notes practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Knowledge organization and notes as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use an audio note, large print, a tactile index or a single accessible document.
