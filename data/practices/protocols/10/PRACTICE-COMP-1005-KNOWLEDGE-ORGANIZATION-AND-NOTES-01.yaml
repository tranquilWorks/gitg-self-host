    examples and avoid automatically syncing confidential material.
  opportunity_considerations: Use the supplied averages source card, atomic-note template, three-entry
    index and delayed application. Paper, local text, audio or another accessible private medium is sufficient.
    Keep the source label, your own compressed explanation, a worked example, one meaningful connection,
    a retrieval cue and a revision history; no particular note application or large archive is required.
