intervention:
  protocol_class: PF-KNOWLEDGE-APPLICATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use the supplied averages source card, atomic-note template, three-entry index and delayed application.
    Paper, local text, audio or another accessible private medium is sufficient. Keep the source label,
    your own compressed explanation, a worked example, one meaningful connection, a retrieval cue and
    a revision history; no particular note application or large archive is required. Goal: Capture, compress,
    connect and retrieve a small piece of knowledge, then revise the note after attempting to use it on
    a new task. Scope: This tests a minimal knowledge system, not a requirement to build a large archive
    or adopt a particular application. Stored volume is not evidence of learning or usefulness. Time and
    effort: Twenty minutes to make one note and fifteen minutes to retrieve and apply it several days
    later. Adaptation: Use an audio note, large print, a tactile index or a single accessible document.
    External supports are legitimate; distinguish finding a note from unaided recall. Use non-sensitive
    examples and avoid automatically syncing confidential material. Keep personal working notes outside
    the check-in; record only the listed observations.


    Reference support:

    The Cornell Note Taking System: https://lsc.cornell.edu/how-to-study/taking-notes/cornell-note-taking-system/'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use an audio note, large print, a tactile index or a single accessible document.
    External supports are legitimate; distinguish finding a note from unaided recall. Use non-sensitive
    examples and avoid automatically syncing confidential material.
  expected_burden: Twenty minutes to make one note and fifteen minutes to retrieve and apply it several
    days later.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Knowledge organization and notes protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Knowledge organization and notes action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use an audio
    note, large print, a tactile index or a single accessible document. External supports are legitimate;
    distinguish finding a note from unaided recall. Use non-sensitive examples and avoid automatically
    syncing confidential material.
  actions:
  - stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01-A1
    sequence: 1
    title: Capture only enough to answer a future question
    instructions: 'Read the supplied source card, then close it and draft one note with a descriptive
      title, source label, own-words explanation, worked 1-2-9 example, future-use question and retrieval
      cue. Reopen the card, correct any distorted definition or arithmetic and retain the original correction.
      Complete the note-quality prompt before revealing its rubric. Do not copy the entire card or replace
      a missing idea with decorative formatting, links or a large tag hierarchy.


      Observation checks: The note has a findable descriptive title; Definitions and example are compressed
      accurately; The source can be identified; A concrete future-use question guides what is retained.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01
      action_stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01-A1
      competency_stable_id: '10.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1005_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1005_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_note_has_a_findable_descriptive_title
        - definitions_and_example_are_compressed_accurately
        - the_source_can_be_identified
        - a_concrete_future_use_question_guides_what_is_retained
      - measurement_id: c1005_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1005_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01-A2
    sequence: 2
    title: Connect the note to one existing task and test retrieval
    instructions: 'Add the note to the supplied three-entry index under one meaningful work or learning
      context. Close it and use only the declared cue or index to find it; record found, found with alternate
      route, not found or support needed, plus the actual route. Explain the example without reading every
      sentence, then distinguish retrieval of the note from unaided recall of its contents. Repair one
      barrier such as an ambiguous title, broken locator or unexplained connection and retest once.


      Observation checks: One meaningful task connection is explicit; The note is found through its intended
      retrieval route; The connection is not merely an unexplained tag; A discovered retrieval barrier
      is corrected. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01
      action_stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01-A2
      competency_stable_id: '10.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
