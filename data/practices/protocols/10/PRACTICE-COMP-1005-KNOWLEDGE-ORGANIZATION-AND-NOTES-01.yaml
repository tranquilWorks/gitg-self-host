        expected: true
  - stable_id: PRACTICE-COMP-1005-KNOWLEDGE-ORGANIZATION-AND-NOTES-01-A3
    sequence: 3
    title: Use it on a new problem and revise its weak point
    instructions: 'After an actual delay when feasible, use the index to find the note before opening
      the application key. Apply it to 2, 3, 4, 5 and 16; preserve calculations, units, interpretation
      and any content help. Explain which summary is pulled by the extreme and what neither number says
      about spread. Open the key, then append one precise correction, limitation or better cue with date
      and reason. Same-session use is practice but must not be labeled delayed retrieval.


      Observation checks: A delayed retrieval is attempted; A new problem is solved using the note; The
      note’s limitation is identified during use; A specific revision improves future retrieval or application.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.


      Final review: What did the later task reveal that your original note captured poorly or made hard
      to find?


      Examples: Supportive: The note was retrieved through a simple planning index, used on a new dataset
      and amended to include a spread warning.


      Mixed: The information was accurate but buried under an unhelpful title, so retrieval required rebuilding
      the index.


      Contradictory: A large copied archive was called knowledge despite no source control, retrieval
      test or use.


      Inconclusive: The note was formatted and tagged but never found again or applied to another problem.'
