instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.12'
  title: Observe, imitate and check one tacit adjustment
  scored: false
  sections:
  - id: tacit-model
    kind: concept
    title: A sequence is not the whole judgment
    body: Written motions say what comes next; demonstration can expose tension, timing and stopping cues.
      Ask a willing skilled person to show their judgment at normal and slower pace, then observe your
      imitation and correct one cue. A recording or the supplied fictional case can prepare questions
      but cannot establish live guided participation, community immersion or competence. Correction concerns
      a movement, never your worth; consent can be withdrawn.
  - id: bow-card
    kind: material
    title: Complete loose-cord bow reference
    body: Use about 80 cm of soft cord loose on a table. Cross the ends, pass one end under the crossing
      and pull gently into a flat first knot. Fold one end into a loop. Wrap the other end around the
      loop's base, fold a bight of that end and push the folded bight through the opening behind the first
      loop. Hold both loops and pull them gently apart; leave free tails rather than pulling a tail through.
      Release by pulling one free tail. A willing demonstrator may show their equivalent method. Keep
      the cord away from bodies, animals, machinery and loads. This is not restraint, climbing, rescue
      or a safety knot. Stop for strain or confusion and ask the teacher to demonstrate again.
  - id: worked-paper
    kind: worked_example
    title: Different example — align before creasing
    body: A learner folds a paper strip into thirds but presses the first crease before comparing panel
      widths. The teacher slowly brings the two loose folds together, checks the three widths, then presses.
      The correction is to align before pressure, not to be a more talented folder. The learner restates
      the cue and repeats while the teacher observes. A neater strip with that prompt is a supported retry,
      not evidence of independent performance on every folding task.
  - id: observation-record
    kind: material
    title: Observation and correction record
    body: 'Route (live, recording or supplied simulation): __. Task and teacher permission: __. Recording
      permission or no recording: __. Normal demonstration noticed: __. Slowed demonstration noticed:
      __. Written step: __. Judgment cue: __. Preserved first attempt: __. Exact correction: __. My restatement:
      __. Teacher confirmation or untested: __. Retry and supports: __. Release result: __. Remaining
      dependence: __. Permission to keep this note: __. Leave unobserved fields untested; never invent
      a teacher response.'
  - id: observation-prompt
    kind: prompt
    title: Separate the step from the judgment
    body: 'Before revealing the check, classify what the bow card supplies and what you must elicit from
      a teacher. Ask what they notice before tightening and when they stop. If no teacher is available,
      analyze this fictional demonstrator statement instead: compare loop sizes before tightening; stop
      while both free tails remain longer than a finger width. Record one written step, one demonstrated
      judgment cue, and which live evidence remains untested. The simulation is analysis only.'
    references:
    - bow-card
    - observation-record
    check_id: observation-key
    attempt_mode: practice
  - id: correction-model
    kind: concept
    title: Preserve the error so the correction has a target
    body: Keep the first attempt description before changing it. Request one observable cue, restate it
      and ask the teacher whether the restatement is accurate. Retry and check release. Merely repeating
      the teacher's words does not show the adjustment was made. One successful guided attempt supports
      a narrow result; partial success still needing prompts, strain or coercion, and a recording without
      feedback are different outcomes, not equivalent evidence.
  - id: corrected-attempt
    kind: prompt
    title: Audit a corrected attempt
    body: Analyze this fictional record before revealing the check. First attempt has loops 9 cm and 3
      cm and a right tail nearly swallowed. Teacher correction is to form the bight farther from the tip
      and equalize loops before adding tension. Learner restates leave enough tail and equalize first;
      teacher confirms. Retry has loops 7 cm and 6 cm, both tails longer than 8 cm, and releases when
      a free tail is pulled. Identify the preserved error, correction, change in disparity, functional
      check, and what this does not demonstrate. If practicing live, record actual observations instead
      of copying these measurements.
    references:
    - bow-card
    - observation-record
    check_id: corrected-attempt-key
    attempt_mode: practice
  - id: access-path
    kind: pathway
    title: Keep the participation voluntary and the task harmless
    body: Use thicker high-contrast cord or agree another accessible low-risk task with the teacher. Assistance
      may stabilize the material but must be recorded; do not claim unsupported execution. Stop rather
      than force painful movement. Without a willing teacher, finish the supplied classification exercise
      and mark live demonstration, imitation and correction untested. A lawful recording is preparation,
      not membership in a community of practice.
  - id: next-practice
    kind: next_step
    title: Return to a guided attempt with one question
    body: Ask the teacher to observe a later safe attempt with the same supports and one question about
      when the cue changes. Record any continuing dependence. If only simulation was possible, the next
      step is arranging voluntary live guidance, not claiming apprenticeship complete. Broader community
      immersion and professional qualification remain outside this small encounter.
  checks:
  - id: observation-key
    title: Check the step and judgment distinction
    body: The written-step example is wrapping the second end around the loop base. The fictional judgment
      is comparing loop sizes before tension and preserving visible tails when stopping. Naming the next
      motion alone misses that judgment. The simulation supplies words to analyze, not an observed normal/slowed
      demonstration, learner imitation or live feedback. On a live route, cite what the teacher actually
      demonstrated rather than substituting the fictional statement.
    criteria:
    - Written motion and judgment are distinct
    - Observation route is explicit
    - Missing live evidence stays untested
    - Consent and harmless scope remain intact
  - id: corrected-attempt-key
    title: Check the correction without overclaiming
    body: The disparity decreases from 6 cm to 1 cm in the fictional record. The first near-swallowed
      tail and unequal loops justify the specific bight-position and equalizing cue. Restatement plus
      teacher confirmation checks understanding; the retry and successful release check this harmless
      result. It remains a simulated supported improvement, not actual learner evidence, independent retention,
      community membership or a safety-knot qualification. Failure to release would make the result partial
      despite better-looking loops; pain or humiliation calls for stopping.
    criteria:
    - First error and exact correction retained
    - Restatement and retry distinguished
    - Release checked separately from appearance
    - Simulation and supported-result limits explicit
