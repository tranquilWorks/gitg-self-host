meaning_and_fit:
  purpose: Observe a safe skill, imitate it, obtain correction on an otherwise hidden judgment and repeat
    with that correction in view.
  why_recommended: Observe a safe skill, imitate it, obtain correction on an otherwise hidden judgment
    and repeat with that correction in view.
  claims:
  - statement: Observe a safe skill, imitate it, obtain correction on an otherwise hidden judgment and
      repeat with that correction in view.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Apprenticeship and tacit knowledge practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Apprenticeship and tacit knowledge as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Choose an accessible low-risk skill with the teacher, allow assistive methods
    and shorten the session. Defer when no willing skilled person or suitable task is available. Never
    turn this exercise into rope restraint, climbing, rescue or load-bearing knot practice.
  opportunity_considerations: 'Default skill: tie and release an ordinary shoelace-style bow in loose
    cord lying on a table. Use no body, load-bearing line, animal, machinery or safety function. Ask a
    willing person who already does this comfortably to demonstrate slowly and watch one attempt. When
    hand movement is inaccessible, use an equally low-risk skill selected with the teacher, such as arranging
    a simple visual layout.'
  prerequisites:
  - 'Default skill: tie and release an ordinary shoelace-style bow in loose cord lying on a table. Use
    no body, load-bearing line, animal, machinery or safety function. Ask a willing person who already
    does this comfortably to demonstrate slowly and watch one attempt. When hand movement is inaccessible,
    use an equally low-risk skill selected with the teacher, such as arranging a simple visual layout.'
  dependencies: []
  safe_alternatives:
  - Choose an accessible low-risk skill with the teacher, allow assistive methods and shorten the session.
    Defer when no willing skilled person or suitable task is available. Never turn this exercise into
    rope restraint, climbing, rescue or load-bearing knot practice.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Apprenticeship and tacit knowledge differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Apprenticeship and tacit knowledge
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default skill: tie and release an ordinary shoelace-style bow in loose cord lying on a table.
    Use no body, load-bearing line, animal, machinery or safety function. Ask a willing person who already
    does this comfortably to demonstrate slowly and watch one attempt. When hand movement is inaccessible,
    use an equally low-risk skill selected with the teacher, such as arranging a simple visual layout.
    Goal: Observe a safe skill, imitate it, obtain correction on an otherwise hidden judgment and repeat
    with that correction in view. Scope: This is a small apprenticeship encounter, not professional qualification.
    Written steps or a video can prepare observation, but they are not live guided correction or community
    membership. Time and effort: A voluntary twenty-to-thirty-minute demonstration and practice, followed
    by ten minutes to record the learned adjustment. Adaptation: Choose an accessible low-risk skill with
    the teacher, allow assistive methods and shorten the session. Defer when no willing skilled person
    or suitable task is available. Never turn this exercise into rope restraint, climbing, rescue or load-bearing
    knot practice. Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Choose an accessible low-risk skill with the teacher, allow assistive methods and
    shorten the session. Defer when no willing skilled person or suitable task is available. Never turn
    this exercise into rope restraint, climbing, rescue or load-bearing knot practice.
  expected_burden: A voluntary twenty-to-thirty-minute demonstration and practice, followed by ten minutes
    to record the learned adjustment.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Apprenticeship and tacit knowledge protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Apprenticeship and tacit knowledge action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Choose an accessible
    low-risk skill with the teacher, allow assistive methods and shorten the session. Defer when no willing
    skilled person or suitable task is available. Never turn this exercise into rope restraint, climbing,
    rescue or load-bearing knot practice.
  actions:
  - stable_id: PRACTICE-COMP-1012-APPRENTICESHIP-AND-TACIT-KNOWLEDGE-01-A1
    sequence: 1
    title: Observe the judgment that a written sequence leaves out
    instructions: 'Agree on the safe task and permission to ask questions. Watch one normal demonstration
      and one slower pass. Ask what the teacher notices about loop size, tension and when to stop pulling;
      distinguish those judgments from merely naming the next hand movement. Do not film without permission.
      Identify one cue that you would have missed from reading a sequence alone.


      Observation checks: The task and teacher participation are freely agreed; Both normal and slowed
      demonstrations are observed; A question elicits a judgment cue rather than only a step; Recording
      and privacy boundaries are respected. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1012-APPRENTICESHIP-AND-TACIT-KNOWLEDGE-01
      action_stable_id: PRACTICE-COMP-1012-APPRENTICESHIP-AND-TACIT-KNOWLEDGE-01-A1
      competency_stable_id: '10.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
