  - stable_id: PRACTICE-COMP-1012-APPRENTICESHIP-AND-TACIT-KNOWLEDGE-01-A2
    sequence: 2
    title: Imitate once and invite a specific correction
    instructions: 'Attempt the bow with loose cord on the table while the teacher observes. Ask for one
      correction tied to the agreed cue, such as keeping the loops similar in size before tightening.
      Repeat the cue back in your own words and ask whether that matches the teacher’s meaning. Stop if
      the method causes strain or the task moves beyond the safe setup; correction never requires humiliation.


      Observation checks: A real imitation attempt occurs; The correction concerns a specific observable
      cue; The learner checks their understanding of the correction; The teacher’s authority does not
      override safety or dignity. Mark only what you observed. Missing, mixed and negative results are
      valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
