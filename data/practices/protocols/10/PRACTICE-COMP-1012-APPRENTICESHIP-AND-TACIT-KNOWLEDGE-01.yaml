  - stable_id: PRACTICE-COMP-1012-APPRENTICESHIP-AND-TACIT-KNOWLEDGE-01-A3
    sequence: 3
    title: Repeat with the correction and identify the remaining dependence
    instructions: 'Make another attempt using the cue, then release the bow to check that it functions
      for this harmless purpose. Ask what still needs practice and what circumstances would require a
      different method. Record the cue, one mistake and the improvement in a private learning note with
      the teacher’s permission. Without a willing teacher, use a lawful recorded demonstration and label
      guided feedback untested.


      Observation checks: The corrected attempt is actually performed; The task’s harmless functional
      check is completed; Remaining dependence and context limits are named; Recorded observation is not
      claimed as live guided feedback. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: What judgment did the teacher make visible that the written steps did not, and when
      do you still need their correction?


      Examples: Supportive: The learner noticed loop tension through demonstration, corrected it after
      feedback and could explain the cue while acknowledging further practice was needed.


      Mixed: The imitation improved, but the learner could not yet recognize the cue without the teacher’s
      prompt.


      Contradictory: Authority was used to shame the learner or a harmless table task was escalated into
      a safety-critical application.


      Inconclusive: A tutorial was watched and described as apprenticeship despite no imitation or clearly
      labeled feedback limitation.'
