        expected: true
  - stable_id: PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01-A2
    sequence: 2
    title: Turn the feedback into one precise correction
    instructions: 'Compare the observed result with the intended one. Select the most consequential error,
      such as correct folder failing to name Today, and rewrite that sentence to specify the action and
      destination. Do not change unrelated formatting just to feel productive. If feedback conflicts,
      ask which interpretation the instructions actually support and choose a testable correction rather
      than deferring automatically to the most confident reviewer.


      Observation checks: The error is linked to a stated standard; One correction targets the identified
      cause; Unrelated polishing is separated from error correction; Conflicting feedback is resolved
      with a checkable interpretation. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01
      action_stable_id: PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01-A2
      competency_stable_id: '10.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
