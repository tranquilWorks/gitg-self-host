meaning_and_fit:
  purpose: Use a test, model or willing reviewer to reveal a specific weakness, make one targeted correction
    and verify whether the correction actually helps.
  why_recommended: Use a test, model or willing reviewer to reveal a specific weakness, make one targeted
    correction and verify whether the correction actually helps.
  claims:
  - statement: Use a test, model or willing reviewer to reveal a specific weakness, make one targeted
      correction and verify whether the correction actually helps.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  - statement: The reported meta-analysis found substantial variation in feedback-intervention effects,
      including performance decreases in a meaningful subset, supporting task-grounded checks and caution
      against treating all feedback as beneficial.
    classification: empirical_finding
    source_ids:
    - SRC-KLUGER-DENISI-FEEDBACK-1996
    limitations: A broad historical meta-analysis across heterogeneous settings, not a prescription for
      one feedback script, not authority for coercive or identity-directed criticism and not validation
      that the product-authored slip exercise improves performance.
  applicability_question: Does a voluntary, bounded Feedback and error correction practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Feedback and error correction as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use pictures, tactile labels, accessible text or a spoken procedure. Self-review
    is legitimate but should not be described as independent user testing. Keep reviewers free to decline
    and avoid public criticism or protected workplace material.
  opportunity_considerations: 'Default instruction to improve: put the blue slip in the correct folder
    and leave the rest there. Supply three folders labeled Today, Later and Reference, a blue slip labeled
    due today and two unmarked slips. The intended result is the blue slip in Today and the unmarked slips
    beside the folders. Use synthetic paper only.'
  prerequisites:
  - 'Default instruction to improve: put the blue slip in the correct folder and leave the rest there.
    Supply three folders labeled Today, Later and Reference, a blue slip labeled due today and two unmarked
    slips. The intended result is the blue slip in Today and the unmarked slips beside the folders. Use
    synthetic paper only.'
  dependencies: []
  safe_alternatives:
