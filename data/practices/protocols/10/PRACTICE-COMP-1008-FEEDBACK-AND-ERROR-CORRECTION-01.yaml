intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default instruction to improve: put the blue slip in the correct folder and leave the rest there.
    Supply three folders labeled Today, Later and Reference, a blue slip labeled due today and two unmarked
    slips. The intended result is the blue slip in Today and the unmarked slips beside the folders. Use
    synthetic paper only. Goal: Use a test, model or willing reviewer to reveal a specific weakness, make
    one targeted correction and verify whether the correction actually helps. Scope: This tests an error-correction
    loop, not the learner’s character. Feedback is useful only insofar as it is relevant, understandable
    and connected to a real standard. Time and effort: Fifteen minutes to prepare a short instruction,
    ten minutes to test it and fifteen minutes for revision and retest. Adaptation: Use pictures, tactile
    labels, accessible text or a spoken procedure. Self-review is legitimate but should not be described
    as independent user testing. Keep reviewers free to decline and avoid public criticism or protected
    workplace material. Keep personal working notes outside the check-in; record only the listed observations.


    Reference support:

    The Effects of Feedback Interventions on Performance: A Historical Review, a Meta-Analysis, and a
    Preliminary Feedback Intervention Theory: https://doi.org/10.1037/0033-2909.119.2.254'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use pictures, tactile labels, accessible text or a spoken procedure. Self-review
    is legitimate but should not be described as independent user testing. Keep reviewers free to decline
    and avoid public criticism or protected workplace material.
  expected_burden: Fifteen minutes to prepare a short instruction, ten minutes to test it and fifteen
    minutes for revision and retest.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Feedback and error correction protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Feedback and error correction action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use pictures,
    tactile labels, accessible text or a spoken procedure. Self-review is legitimate but should not be
    described as independent user testing. Keep reviewers free to decline and avoid public criticism or
    protected workplace material.
  actions:
  - stable_id: PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01-A1
    sequence: 1
    title: Define the result and invite a test before polishing
    instructions: 'Write the intended result separately from the instruction. Give the instruction to
      a willing adult or follow it literally yourself without filling in hidden assumptions. Observe which
      object, location or sequence is ambiguous. Ask where did the instruction leave you uncertain, not
      did you like it. Keep the first version so the feedback can be tied to an actual failure.


      Observation checks: The intended result is explicit before the test; The first version is preserved;
      A literal test or freely consented review occurs; Feedback identifies an object location or sequence
      problem. Mark only what you observed. Missing, mixed and negative results are valid; a deferred
      action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01
      action_stable_id: PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01-A1
      competency_stable_id: '10.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
