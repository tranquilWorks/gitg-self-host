        - one_correction_targets_the_identified_cause
        - unrelated_polishing_is_separated_from_error_correction
        - conflicting_feedback_is_resolved_with_a_checkable_interpretation
      - measurement_id: c1008_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
