instructional_content:
  schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
  competency_id: '10.08'
  title: Expose one instruction error and verify a targeted repair
  scored: false
  sections:
  - id: feedback-model
    kind: concept
    title: Feedback is useful when it changes a tested gap
    body: Feedback is information about the difference between an intended result and an observed result.
      It is not automatically correct, kind, relevant or actionable. Fix the standard before testing,
      preserve the first output, identify one specific object/location/sequence gap, make one targeted
      change and retest on a comparable fresh case. Praise, confidence and visual polish do not show that
      the gap closed. Feedback about the task is evaluated against the task; feedback about identity or
      worth is out of scope. One repaired instruction does not validate a universal feedback method.
  - id: first-packet
    kind: material
    title: Supplied ambiguous instruction and intended result
    body: 'Folders: TODAY, LATER and REFERENCE, arranged left to right. Objects: one blue slip labeled
      “due today” and two unmarked white slips, all initially in a row below the folders. Version A instruction:
      “Put the blue slip in the correct folder and leave the rest there.” Intended result, kept separate
      from Version A during the literal test: the blue slip is inside TODAY; both white slips remain in
      their original row below the folders. A test succeeds only if both destination and non-target location
      are unambiguous from the instruction, not from private knowledge of the intended result.'
  - id: worked-feedback
    kind: worked_example
    title: Example on a different object and location
    body: 'Intended result: place the red card on shelf 2 and leave the black card on the desk. Version
      A says “Put the red one away and leave that one.” A literal tester pauses at “away” and cannot resolve
      what “that one” names. The author records location and reference as the two gaps, selects location
      first, and revises only to “Place the red card on shelf 2; leave the black card on the desk.” A
      fresh green card/gray card case reaches the intended locations. “The tester liked it” would not
      test either gap.'
  - id: correction-record
    kind: material
    title: Error-correction record
    body: 'Intended result fixed before test: __. Version A exact text: __. Test mode [willing reviewer/self
      literal run]: __. First output or point of uncertainty: __. Gap category [object/location/order/
      exception/other]: __. Evidence connecting gap to text: __. Feedback wording: __. Accepted, qualified
      or rejected and why: __. One selected correction: __. Version B exact text: __. Fresh case and fixed
      criteria: __. Retest result: __. Remaining gap: __. Keep identities and comments private.'
  - id: literal-test
    kind: prompt
    title: Test Version A before repairing it
    body: Hide the intended-result paragraph from a willing adult tester, or run Version A yourself literally
      without supplying missing assumptions. Preserve where the blue slip was placed, what happened to
      each white slip, and every clarification request. Ask “Which words determined the destination and
      where the other slips stay?” rather than “Did you like it?” Identify all supported gaps, then select
      the most consequential one for a single correction. Do not open the key before recording Version
      A.
    references:
    - first-packet
    - correction-record
    check_id: literal-test-key
    attempt_mode: practice
  - id: correction-rule
    kind: concept
    title: Resolve feedback with the stated standard
    body: Accept feedback when the preserved output exposes a mismatch the instruction permits. Qualify
      it when the issue is real but outside the fixed target. Reject it when it conflicts with the materials
      or asks for unrelated preference. Confident wording and majority agreement do not outrank a literal
      test. For this packet, the smallest complete repair must name TODAY and the original row below the
      folders. Changing fonts, colors or tone alone cannot repair those semantic gaps.
  - id: fresh-retest
    kind: prompt
    title: Retest Version B on a comparable green slip
    body: 'Write Version B before seeing the key. Replace the blue slip with a green slip labeled “due
      today”; keep two unmarked white slips in the original row below the same three folders. Give only
      Version B to a willing adult or follow it literally yourself. Criteria fixed before the retest:
      green is inside TODAY; both white slips remain in the original row below the folders; no clarification
      or rescue is needed. Preserve the result and any remaining ambiguity, then open the key and classify
      solved, partial, adverse or inconclusive.'
    references:
    - first-packet
    - correction-record
    check_id: fresh-retest-key
    attempt_mode: practice
  - id: access-and-consent
    kind: pathway
    title: Make the test accessible, private and voluntary
    body: Use pictures with text, tactile labels, large print, audio, signing, AAC or a helper who moves
      the slips according to the tester’s directions. Record that support in both runs. A reviewer may
      decline without consequence; do not use public criticism, humiliation, surveillance or protected
      work material. Self-review is valid development evidence but is not independent user evidence. For
      an advanced route, test one more semantic ambiguity—not higher stakes or a less consenting audience.
  - id: next-loop
    kind: next_step
    title: Retain remaining errors and choose one next loop
    body: If all three fixed criteria pass, retain Version B and test it once in the real low-stakes medium.
      If the destination passes but white-slip location fails, preserve that partial result and repair
      only the location clause on a new case. If conditions changed, label the comparison inconclusive.
      If feedback concerns preference rather than the intended result, track it separately. Stop for coercion,
      distress, private data or consequences that require a qualified reviewer.
  checks:
  - id: literal-test-key
    title: Check what Version A can and cannot specify
    body: 'Version A does not name TODAY and “the correct folder” depends on a rule the tester was not
      given. “Leave the rest there” has an unclear referent and location: there could mean beside the
      blue slip, in a folder or in the original row. A tester who happens to produce the intended result
      does not make the wording unambiguous. The first output must remain visible. Relevant feedback names
      one of those textual gaps; “make it prettier” is unrelated to the fixed semantic target. A complete
      selected correction must eventually specify both target destination and non-target location.'
    criteria:
    - Destination and non-target-location gaps are identified
    - Lucky success is not treated as clear instruction
    - Feedback is connected to preserved output and text
    - One semantic correction is selected before retest
  - id: fresh-retest-key
    title: Check Version B against the three fixed criteria
    body: 'A complete Version B is: “Place the green slip labeled due today inside TODAY. Leave both unmarked
      white slips in their original row below the folders.” Equivalent accessible wording passes when
      it fixes the same object, destination and non-target location. Green in TODAY plus moved white slips
      is partial. Green in LATER is adverse for the stated result. No preserved retest, a prompted destination
      or a changed folder layout is inconclusive for comparison. Record self-review separately from an
      unprompted willing tester; either can reveal defects, but only the latter is independent for this
      run.'
    criteria:
    - The fresh object reaches TODAY
    - Both non-target objects retain the declared location
    - Clarification prompts and changed conditions remain visible
    - Result labels follow the fixed criteria rather than approval
