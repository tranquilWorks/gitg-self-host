  - stable_id: PRACTICE-COMP-1403-DIGITAL-IDENTITY-PRIVACY-AND-DATA-RIGHTS-01-A2
    sequence: 2
    title: Choose one proportionate change with its tradeoff
    instructions: 'Decide whether to remove a precise profile location, restrict an audience, disable
      optional contact discovery or stop using a feature. Check the effect on recovery, accessibility
      and legitimate shared use before changing it. Save only a private note of the setting name and reason,
      not screenshots containing contacts. If a deletion or access request is appropriate, use the service’s
      verified process and understand that processing may take time.


      Observation checks: The change addresses the stated privacy priority; Recovery accessibility and
      shared-use effects are considered; Only authorized account settings or official request routes are
      used; The privacy benefit and lost convenience are both stated. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1403-DIGITAL-IDENTITY-PRIVACY-AND-DATA-RIGHTS-01
      action_stable_id: PRACTICE-COMP-1403-DIGITAL-IDENTITY-PRIVACY-AND-DATA-RIGHTS-01-A2
      competency_stable_id: '14.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
