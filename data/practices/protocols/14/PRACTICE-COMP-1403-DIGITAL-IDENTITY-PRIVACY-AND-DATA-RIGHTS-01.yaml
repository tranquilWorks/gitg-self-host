  resources:
  - id: sources
    title: Sources and further reading
    body: 'These references support the bounded concepts described in the guide. They do not validate
      the fictional case or establish personal results.


      - [CDC — Chronic Conditions & Disabilities Activity](https://www.cdc.gov/physical-activity-basics/guidelines/chronic-health-conditions-and-disabilities.html)

      - [CDC — Pregnant & Postpartum Activity](https://www.cdc.gov/physical-activity-basics/guidelines/healthy-pregnant-or-postpartum-women.html)

      - [NIAMS — Sports Injuries](https://www.niams.nih.gov/health-topics/sports-injuries)

      - [MedlinePlus — Pain](https://medlineplus.gov/pain.html)

      - [NHS — Back pain](https://www.nhs.uk/conditions/back-pain/)

      - [University Hospitals Sussex — Low back pain A&E leaflet](https://www.uhsussex.nhs.uk/resources/low-back-pain/)

      - [Cleveland Clinic — Referred Pain](https://my.clevelandclinic.org/health/symptoms/25238-referred-pain)

      - [Apple — Allow or silence notifications for a Focus](https://support.apple.com/guide/iphone/allow-or-silence-notifications-for-a-focus-iph21d43af5b/ios)

      - [NCSC — Backing up your data](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/always-back-up-your-most-important-data)

      - [NCSC — Install the latest software and app updates](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/install-the-latest-software-and-app-updates)

      - [NCSC — Managing your passwords](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers)

      - [FTC — How Websites and Apps Collect and Use Your Information](https://consumer.ftc.gov/articles/how-websites-and-apps-collect-and-use-your-information)

      - [ICO — Your right to get your data deleted](https://ico.org.uk/for-the-public/your-right-to-get-your-data-deleted/)

      - [FTC — Use Two-Factor Authentication](https://consumer.ftc.gov/articles/use-two-factor-authentication-protect-your-accounts)

      - [NIST SP 800-63B-4](https://pages.nist.gov/800-63-4/sp800-63b.html)

      - [Microsoft — Find your BitLocker recovery key](https://support.microsoft.com/en-us/windows/security/encryption/find-your-bitlocker-recovery-key)'
  - id: file-later-packet-md
    title: Later packet
    body: '| Observation | Actual supplied status |

      | --- | --- |

      | Profile location | Cleared, saved, and absent in the service''s public preview |

      | Audience | Private setting persisted after reopening settings |

      | Contact discovery | Off after saving; future matching disabled under P3 |

      | Stored contact list | Request sent; acknowledgement received; deletion not yet confirmed |

      | Old caption | Location removed from the provider-hosted caption and checked in its authorized
      preview |

      | Recovery email | Still linked and unchanged; no recovery drill performed |

      | Sign-in records | Still collected under P4; no deletion requested or confirmed |

      | Downloaded drawing | Follower''s copy remains outside this inspection; no deletion evidence |


      An **alternative later reply**, to consider separately, says: “We have deleted the stored contact
      list associated with this request.” If that reply is supplied, update only the contact-list row
      to provider-confirmed deletion. It is not independent inspection of every internal copy, and says
      nothing about sign-in records or the downloaded drawing.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Follow the information beyond the visible profile


      Privacy choices concern what information is collected, how identities are linked, who can use it,
      for what purpose and for how long. Hiding a public profile field changes an audience; it may not
      change the provider''s collection or erase a recipient''s copy. A useful audit names the specific
      data flow that changed and the uncertainty that remains.


      The default uses a complete fictional service packet and takes about 30 minutes. You need only a
      notes tool. No real account, legal request, private screenshot or contact upload is required. The
      optional real route is limited to an account you control and current official instructions. This
      is privacy literacy, not a legal determination or a guarantee of anonymity.


      ### A practical vocabulary


      **Supplied data** are entered or uploaded by a person. **Observed data** come from activity or device
      interactions. **Inferences** are conclusions drawn from those records; they can be wrong. **Identity
      linkage** connects records through a login, address, device signal or shared identifier. A pseudonym
      does not necessarily break those links. **Audience** concerns who sees something; **purpose** concerns
      what may be done with it. Consent to one purpose should not be silently treated as agreement to
      every other use.


      The [FTC''s tracking explanation](https://consumer.ftc.gov/articles/how-websites-and-apps-collect-and-use-your-information)
      distinguishes collection and settings; private browsing does not make activity invisible to websites.
      For a real service, inspect current policy and settings, retain dates, and mark ambiguous language
      unknown. A privacy setting, a deletion request and verified processing are three different states.


      Legal rights depend on applicable law and circumstances. The [UK ICO''s erasure guidance](https://ico.org.uk/for-the-public/your-right-to-get-your-data-deleted/)
      describes a right with conditions and exceptions. Do not import its rules or deadlines into another
      jurisdiction, or treat a fictional policy below as a real legal promise. Use the relevant regulator/service''s
      verified process and appropriate qualified advice for a disputed case.


      ### Worked example: the consent changed, but a copy remains


      Someone allowed a club to publish a picture on its own page, but did not agree to advertising use.
      Removing the club post can change future visibility without retrieving a copy already downloaded
      by a viewer. Record the request, the page result and the outside copy separately. A useful follow-up
      asks the responsible party about the additional use; it does not claim the person became anonymous
      after one toggle.


      ### Complete fictional packet: Mira''s Sketchyard account


      Mira''s purpose is to show drawings to approved hobby contacts without publicly revealing a precise
      location or inviting automated contact matching. Mira needs email access for recovery. **Sketchyard
      is invented.** The following six records are the entire policy/control packet for this exercise,
      dated 1 September 2026:


      | Record | Current fact or stipulated policy |

      | --- | --- |

      | P1 — Profile | Mira supplied nickname MiraDraws and location “Cedar House, Unit 4”; profile currently
      public. Location can be cleared without deleting the account. |

      | P2 — Audience | Private mode limits future profile/post viewing to approved followers. It does
      not remove already downloaded copies. |

      | P3 — Contacts | Contact discovery is on and a list was previously uploaded. Turning it off stops
      future uploads/matching; deleting the stored list requires a separate request. |

      | P4 — Collection | Provider stores sign-in device/time records for its stated security purpose;
      the private-profile setting does not stop that collection. Optional personalized recommendations
      are a separate switch. |

      | P5 — Deletion | The service accepts a specific stored-contact-list deletion request and reports
      its status. The packet supplies no processing deadline or promise to remove recipients'' copies.
      |

      | P6 — Identity | Recovery email is linked to the account; clearing public location does not alter
      recovery. An old public drawing included the same location in its caption. |


      One approved follower has already downloaded that drawing. No statement about this follower deleting
      it is available. No real people, addresses or service terms are represented by the invented names.


      #### Action 1 — Draw a data-flow ledger


      Use `item | supplied/observed/inferred | identity link | audience/recipient | purpose | available
      control | retention unknown`. Fill rows for profile location, uploaded contacts, sign-in records,
      recovery email and the old caption. Note which record supports each conclusion. No inference model
      is described in the packet, so do not claim one was inspected; the general concept does not establish
      a specific practice.


      #### Action 2 — Choose changes that match the purpose


      Write a minimal sequence that removes the precise public location, limits future audience, stops
      contact discovery and addresses the old caption/stored list separately. Preserve recovery email.
      State the tradeoffs: new viewers will need approval and automatic contact finding is lost. Use this
      request template: “For this account, please explain the status and process for deleting the previously
      uploaded contact list. Please identify any retained categories, reasons and further steps.” Do not
      include actual contact details or secret values.


      Mark each proposed change **planned** until the supplied record establishes it was performed. Save
      the ledger before [the later packet](?resource=file-later-packet-md). A request about contacts is
      not a request to delete the whole account.


      #### Action 3 — Verify each claim at its own boundary


      Apply the later observations to the ledger. Distinguish the public preview, persisted settings,
      request acknowledgement, provider response and outside copy. Write a short truthful result using
      “changed,” “requested,” “confirmed by provider” and “unknown” precisely. Choose a future trigger
      such as adding a linked app or a policy change. Attempt [fresh checks](?attempt=practice-checks)
      before [the separate key](?check=practice-answers).


      A complete output includes all five data rows, policy references, the change/request sequence, tradeoffs,
      later status and residual-copy statement. “Private now” without these distinctions is incomplete
      even if the public preview looks correct.


      ### Access, harder work and real transfer


      Use an accessible dashboard or one setting at a time. A helper can read explanations without receiving
      credentials or seeing contacts. On a shared account, separate your authority from another person''s
      choices. In a stalking or coercion situation, settings changes may have consequences; use a safe
      device and suitable specialist support instead of this ordinary-account exercise.


      Harder case: a linked drawing app retains a copy under its own account. Add a separate recipient,
      control and policy row; revoking future access does not establish deletion of earlier transfers.
      If policy is vague, write a focused question rather than invent a retention period.


      Later, choose one real privacy priority and one account you own. Inspect the current official settings/policy,
      make a reversible authorized change if appropriate, and verify through the service''s own preview
      or another authorized view. Keep a private minimized receipt without names or identifiers. Record
      any rights request as pending until its response is known. This is distinct from 14.02''s data recovery
      and 14.04''s protection against unauthorized access: a service may securely retain information you
      prefer it not to collect.


      **Supportive:** Specific flows change as intended; collection and copies outside the tested control
      remain explicit.


      **Mixed:** Future sharing is reduced, but older material needs another request or recipient review.


      **Contradictory:** Private mode is represented as anonymity or a request acknowledgement as universal
      erasure.


      **Inconclusive:** A policy was skimmed without linking its statements to an item, control or observed
      result.


      See scope and limits described in this guide and [source limits](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A fictional service''s private mode restricts the public profile but its policy still permits
      the described security log collection. A learner says “No one collects my activity now.” Correct
      that claim and identify the two separate controls or questions needed.

      2. A contact-upload switch is off. The service explicitly says this stops future uploads but existing
      records require a separate deletion request. The learner receives “Request received.” Which states
      are known, and which remain unconfirmed?

      3. An old public post was removed from the provider''s page. A recipient saved a copy earlier, and
      another app received the post under its own account. Write a bounded result and a next audit action
      without claiming universal erasure or a particular legal deadline.


      Save responses before [the key](?check=practice-answers).


      ### Changed-case attempt


      Save your response before opening the matching answer. This is a new fictional case.


      Fictional app policy V2: location is collected only while navigation is on; route history is stored
      for 14 days; deleting history removes route records but not the separate account; diagnostic sharing
      is optional and initially on. An offline map is available. Choose settings for someone who needs
      a map but wants no route history or optional diagnostics. Identify one uncertainty.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Public audience is restricted; the described provider collection continues. Inspect the
      visibility control and the separate policy/control governing collection and retention. Do not turn
      absence from public preview into absence from provider systems or a promise of anonymity.

      2. Future uploading is disabled under the stipulated policy, and the deletion request was received.
      Existing-record deletion is **unconfirmed**. Retain the request scope and seek its actual disposition
      through the verified process. Acknowledgement is progress in a request, not evidence the data disappeared.

      3. The provider-hosted post is no longer visible in the checked location. The recipient''s copy
      and linked app''s records are separate and unresolved. Inspect the linked app''s official controls/policy
      and, where appropriate, request a specific action from its responsible party. Do not infer an applicable
      legal right, response deadline or guaranteed retrieval of every copy from this fictional case.


      For Mira, the public location, audience, future discovery and hosted caption changed. Stored-list
      deletion remains pending in the initial later packet. The alternative provider reply supports only
      a provider-confirmed contact-list result. Recovery remains linked; security logs continue; the outside
      drawing is unverified. These are educational status distinctions, not a legal opinion or independent
      provider audit.


      ### Changed-case answer


      Use the offline map if it meets the need, keep navigation off when unnecessary, disable diagnostic
      sharing and use the stated history deletion control for existing route records. Account deletion
      is a separate issue. The policy does not specify backups or whether offline use records anything
      else: ask rather than promise zero collection. Do not import the earlier policy’s retention or controls.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
