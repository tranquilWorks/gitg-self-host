        - the_visible_audience_is_separate_from_provider_collection
        - retention_or_deletion_information_is_checked_in_current_official_material
        - unknowns_are_retained_rather_than_replaced_with_privacy_guarantees
      - measurement_id: c1403_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
