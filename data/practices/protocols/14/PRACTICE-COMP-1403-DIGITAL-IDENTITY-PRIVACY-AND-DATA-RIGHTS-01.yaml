meaning_and_fit:
  purpose: Trace what an account collects, links, shares and retains, then make one informed privacy choice
    rather than assume a toggle guarantees anonymity or deletion.
  why_recommended: Trace what an account collects, links, shares and retains, then make one informed privacy
    choice rather than assume a toggle guarantees anonymity or deletion.
  claims:
  - statement: Trace what an account collects, links, shares and retains, then make one informed privacy
      choice rather than assume a toggle guarantees anonymity or deletion.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Digital identity, privacy, and data rights practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Digital identity, privacy, and data rights as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use one setting at a time, an accessible privacy dashboard or a trusted helper
    without sharing credentials. In stalking or abuse concerns, changing settings can have safety implications;
    use a safe device and appropriate specialist support rather than a public confrontation or surprise
    account change.
  opportunity_considerations: 'Choose an ordinary account you control, not a workplace system or another
    person’s profile. Default priority: a hobby profile should not publicly reveal a precise location
    or link automatically to unrelated contacts. Use four headings—data supplied, data observed, identity
    links and retention or sharing—and the service’s current official privacy information.'
  prerequisites:
  - 'Choose an ordinary account you control, not a workplace system or another person’s profile. Default
    priority: a hobby profile should not publicly reveal a precise location or link automatically to unrelated
    contacts. Use four headings—data supplied, data observed, identity links and retention or sharing—and
    the service’s current official privacy information.'
  dependencies: []
  safe_alternatives:
  - Use one setting at a time, an accessible privacy dashboard or a trusted helper without sharing credentials.
    In stalking or abuse concerns, changing settings can have safety implications; use a safe device and
    appropriate specialist support rather than a public confrontation or surprise account change.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Digital identity, privacy, and data rights differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Digital identity, privacy,
    and data rights as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose an ordinary account you control, not a workplace system or another person’s profile.
    Default priority: a hobby profile should not publicly reveal a precise location or link automatically
    to unrelated contacts. Use four headings—data supplied, data observed, identity links and retention
    or sharing—and the service’s current official privacy information. Goal: Trace what an account collects,
    links, shares and retains, then make one informed privacy choice rather than assume a toggle guarantees
    anonymity or deletion. Scope: This is a bounded account audit, not a legal determination of data rights
    or a guarantee that previously shared information disappears. Applicable rights and procedures vary
    by location and service. Time and effort: Twenty minutes to inspect one account and ten minutes to
    make and verify one chosen change. Adaptation: Use one setting at a time, an accessible privacy dashboard
    or a trusted helper without sharing credentials. In stalking or abuse concerns, changing settings
    can have safety implications; use a safe device and appropriate specialist support rather than a public
    confrontation or surprise account change. Keep personal working notes outside the check-in; record
    only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use one setting at a time, an accessible privacy dashboard or a trusted helper
    without sharing credentials. In stalking or abuse concerns, changing settings can have safety implications;
    use a safe device and appropriate specialist support rather than a public confrontation or surprise
    account change.
  expected_burden: Twenty minutes to inspect one account and ten minutes to make and verify one chosen
    change.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Digital identity, privacy, and data rights protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Digital identity, privacy, and data rights action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use one setting
    at a time, an accessible privacy dashboard or a trusted helper without sharing credentials. In stalking
    or abuse concerns, changing settings can have safety implications; use a safe device and appropriate
    specialist support rather than a public confrontation or surprise account change.
  actions:
  - stable_id: PRACTICE-COMP-1403-DIGITAL-IDENTITY-PRIVACY-AND-DATA-RIGHTS-01-A1
    sequence: 1
    title: Trace the data from collection to visible audience
    instructions: 'Inspect the profile and official privacy settings for the chosen priority. Identify
      one supplied item, one activity or device signal the policy says may be collected, an identity-linking
      feature and a retention or deletion statement. Separate public visibility from collection by the
      provider. Mark unclear policy language as unknown; do not assume a private profile means no tracking
      or that consent is all-or-nothing.


      Observation checks: Supplied observed and linked data are distinguished; The visible audience is
      separate from provider collection; Retention or deletion information is checked in current official
      material; Unknowns are retained rather than replaced with privacy guarantees. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1403-DIGITAL-IDENTITY-PRIVACY-AND-DATA-RIGHTS-01
      action_stable_id: PRACTICE-COMP-1403-DIGITAL-IDENTITY-PRIVACY-AND-DATA-RIGHTS-01-A1
      competency_stable_id: '14.03'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
