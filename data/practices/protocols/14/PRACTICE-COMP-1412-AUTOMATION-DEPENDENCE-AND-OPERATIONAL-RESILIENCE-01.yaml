      - [Causes and prevention: overview](https://www.hse.gov.uk/slips/preventing-overview.htm)

      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Compare these fictional branches with your actual local/paper result; do not substitute them
      for it.


      | Branch | Retrieval and contents | Disposition |

      | --- | --- | --- |

      | O1 | Card opens; September 24, 14:00, Birch, east entrance/level-route reception directions and
      in-person coordinator route present | Meets this case''s four minimum answers |

      | O2 | Card opens but says Willow | Retrieval succeeded; freshness failed |

      | O3 | Card has time and Birch, but says “contact in app” | Contact dependency remains unavailable
      |

      | O4 | File exists but cannot be opened without cloud authorization | Storage is recorded; usable
      fallback not demonstrated |


      Version 2 changes the room and directions, not the meeting time. Retyping a corrected answer after
      opening the normal source is a repair, not evidence the first fallback had it. Repeat retrieval
      after updating.


      The complete server record confirms R-41 accepted and R-42 not received at this check. Reconcile
      R-41 as accepted; do not create a new request for another map. R-42 may be submitted once in the
      paper plan under the toy service''s same-ID rule, followed by acknowledgment verification. Submission
      and acknowledgment have not actually occurred.


      Alternative branch: the server cannot be queried. Both statuses remain uncertain relative to the
      local pending labels. Do not assume zero accepted requests. Hold or use the service''s documented
      status/retry procedure; actual systems may have different idempotency rules.


      Your evidence should distinguish a real harmless file/card retrieval from these simulated service
      outcomes and retain any unresolved contact, access or freshness gap.'
  - id: file-materials-readme-md
    title: Readme
    body: 'All records are original fiction. No address, account, telephone number or request endpoint
      is live.


      - [event-v1.txt](?resource=file-materials-event-v1-txt): stale baseline, room Willow.

      - [event-v2.txt](?resource=file-materials-event-v2-txt): current source, room Birch. Make a separate
      fallback from this; preserve both originals.

      - [outbox.txt](?resource=file-materials-outbox-txt): simulated locally pending requests for Action
      3.

      - [server-receipts.txt](?resource=file-materials-server-receipts-txt): open only after writing the
      local-state assumption in Action 3.


      Use a new temporary folder or paper. Do not delete files, disconnect services or submit requests.
      The material files are learning records, not executable programs.'
