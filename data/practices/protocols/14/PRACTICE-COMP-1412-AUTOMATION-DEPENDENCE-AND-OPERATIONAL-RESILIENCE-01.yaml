meaning_and_fit:
  purpose: Identify a critical cloud, AI, algorithm or connected-device dependency and test a manual or
    offline fallback without disrupting the real service.
  why_recommended: Identify a critical cloud, AI, algorithm or connected-device dependency and test a
    manual or offline fallback without disrupting the real service.
  claims:
  - statement: Identify a critical cloud, AI, algorithm or connected-device dependency and test a manual
      or offline fallback without disrupting the real service.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Automation dependence and operational resilience practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Automation dependence and operational resilience as not applicable,
    consciously unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity,
    or safe context is absent.
  readiness_considerations: Use paper, large print, an accessible local file or a chosen helper. For medical,
    financial or safety-critical dependencies, follow the provider’s approved continuity plan and test
    only a harmless representation. No real outage, account deletion or device reset is required.
  opportunity_considerations: 'Default activity: access a meeting’s time, location and contact route when
    the usual calendar app is unavailable. Use a fictional event or a private minimal copy with no sensitive
    attendee information. Prepare an offline text or paper version and keep the live calendar untouched.
    The test assumes the app is unavailable; it does not actually revoke credentials or disconnect essential
    services.'
  prerequisites:
  - 'Default activity: access a meeting’s time, location and contact route when the usual calendar app
    is unavailable. Use a fictional event or a private minimal copy with no sensitive attendee information.
    Prepare an offline text or paper version and keep the live calendar untouched. The test assumes the
    app is unavailable; it does not actually revoke credentials or disconnect essential services.'
  dependencies: []
  safe_alternatives:
  - Use paper, large print, an accessible local file or a chosen helper. For medical, financial or safety-critical
    dependencies, follow the provider’s approved continuity plan and test only a harmless representation.
    No real outage, account deletion or device reset is required.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Automation dependence and operational resilience differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Automation dependence and
    operational resilience as inferiority; competing reasonable interpretations and conscientious refusal
    remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default activity: access a meeting’s time, location and contact route when the usual calendar
    app is unavailable. Use a fictional event or a private minimal copy with no sensitive attendee information.
    Prepare an offline text or paper version and keep the live calendar untouched. The test assumes the
    app is unavailable; it does not actually revoke credentials or disconnect essential services. Goal:
    Identify a critical cloud, AI, algorithm or connected-device dependency and test a manual or offline
    fallback without disrupting the real service. Scope: This is a small continuity rehearsal, not a full
    outage or cyberattack exercise. Do not disable safety systems, medical devices, workplace services
    or another person’s access. Time and effort: Twenty minutes of preparation and a ten-minute harmless
    fallback test. Adaptation: Use paper, large print, an accessible local file or a chosen helper. For
    medical, financial or safety-critical dependencies, follow the provider’s approved continuity plan
    and test only a harmless representation. No real outage, account deletion or device reset is required.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use paper, large print, an accessible local file or a chosen helper. For medical,
    financial or safety-critical dependencies, follow the provider’s approved continuity plan and test
    only a harmless representation. No real outage, account deletion or device reset is required.
  expected_burden: Twenty minutes of preparation and a ten-minute harmless fallback test.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Automation dependence and operational resilience protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Automation dependence and operational resilience action, a polished artifact,
    agreement, confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use paper,
    large print, an accessible local file or a chosen helper. For medical, financial or safety-critical
    dependencies, follow the provider’s approved continuity plan and test only a harmless representation.
    No real outage, account deletion or device reset is required.
  actions:
  - stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01-A1
    sequence: 1
    title: Map the dependency and the minimum service that must survive
    instructions: 'Trace the activity through device, power, network, cloud account, authentication and
      any AI or automation layer. Identify one single point of failure and define a minimum useful fallback:
      knowing where and when to go and how to contact the organizer. State how fresh the information must
      be and who is allowed to see it. More backup data is not automatically a better privacy decision.


      Observation checks: Device power network account and automation dependencies are traced; A specific
      single point of failure is identified; The minimum useful service and freshness requirement are
      defined; Fallback access is limited to an appropriate audience. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01
      action_stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01-A1
      competency_stable_id: '14.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1412_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1412_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - device_power_network_account_and_automation_dependencies_are_traced
        - a_specific_single_point_of_failure_is_identified
        - the_minimum_useful_service_and_freshness_requirement_are_defined
        - fallback_access_is_limited_to_an_appropriate_audience
      - measurement_id: c1412_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1412_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01-A2
    sequence: 2
    title: Create the fallback and test it without the normal route
    instructions: 'Export or copy the minimum authorized information to an accessible offline format.
      Put the device or app aside rather than disabling it, then use only the fallback to answer the event’s
      time, location and contact questions. For an AI-dependent writing task, draft a short answer manually
      from the source instead of calling the model. Record missing information and do not assume an export
      is usable until opened.


      Observation checks: A minimal authorized fallback is actually created; The test does not use the
      normal app or model route; The fallback is opened and used to complete the defined task; Missing
      information remains visible without disrupting the live service. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01
      action_stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01-A2
      competency_stable_id: '14.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1412_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1412_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_minimal_authorized_fallback_is_actually_created
        - the_test_does_not_use_the_normal_app_or_model_route
        - the_fallback_is_opened_and_used_to_complete_the_defined_task
        - missing_information_remains_visible_without_disrupting_the_live_service
      - measurement_id: c1412_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1412_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01-A3
    sequence: 3
    title: Define refresh recovery and safe retirement
    instructions: 'Choose a review or refresh trigger, such as a changed event or monthly check, and record
      how to return to the normal service without duplicating actions. Decide when the offline copy should
      be destroyed or updated and how it remains private. Identify any unresolved dependency, such as
      the contact number still being available only online. A single successful rehearsal does not prove
      continuity for every outage.


      Observation checks: A concrete refresh trigger keeps the fallback current; Return to normal service
      avoids duplicate actions; Retention and privacy of the fallback are addressed; Residual dependencies
      and limited test coverage are explicit. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Could the important activity still proceed through the fallback, and what dependency
      did the rehearsal reveal rather than remove?


      Examples: Supportive: The offline event card supplied the time, location and verified contact route,
      and a change-triggered refresh was scheduled.


      Mixed: The event details were available, but the map required a network connection and the fallback
      needed a written route.


      Contradictory: A real service or safety device was disabled to make the test more realistic.


      Inconclusive: An export was saved but never opened or used without the original service.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01
      action_stable_id: PRACTICE-COMP-1412-AUTOMATION-DEPENDENCE-AND-OPERATIONAL-RESILIENCE-01-A3
      competency_stable_id: '14.12'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
