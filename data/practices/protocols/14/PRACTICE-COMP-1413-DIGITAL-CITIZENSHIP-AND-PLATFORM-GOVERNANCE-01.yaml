  transfer_limit: This is civic policy reasoning, not a legal judgment or authority to moderate a real
    community. No particular political position, platform or identity disclosure is required.
  reflection:
    before: 'What would count as doing this honestly? Goal: Analyze a digital platform policy across user
      safety, expression, privacy, accessibility, competition and due process, then propose an implementable
      improvement with acknowledged tradeoffs.'
    during: Which checks have actually been observed? The policy balanced several values, but the proposed
      review workload exceeded available moderators and needed a simpler process.
    after: Which protection improved, what cost did it impose, and how would someone challenge a mistaken
      decision in practice?
  review_guidance:
    repeat: Repeat the same bounded Digital citizenship and platform governance design only when the context
      and burden remain appropriate.
    adapt: Use a small club forum rather than a commercial platform, and discuss cases through text or
      voice. Avoid reproducing slurs, threats or private abuse reports. For actual policy adoption, consult
      affected users and applicable legal or institutional guidance before implementation.
    stop: Stop Digital citizenship and platform governance when the practice becomes coercive, unsafe,
      privacy-invasive, role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
      safe access.
  evidence_examples:
    supportive: The revised rule preserved urgent threat removal while adding proportionate sanctions,
      private evidence handling and an accessible appeal.
    mixed: The policy balanced several values, but the proposed review workload exceeded available moderators
      and needed a simpler process.
    contradictory: Safety was used to justify unlimited surveillance or expression used to dismiss targeted
      harassment entirely.
    inconclusive: A policy preference was stated without affected users, operational details, edge cases
      or an appeal route.
