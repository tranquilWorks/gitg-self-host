meaning_and_fit:
  purpose: Analyze a digital platform policy across user safety, expression, privacy, accessibility, competition
    and due process, then propose an implementable improvement with acknowledged tradeoffs.
  why_recommended: Analyze a digital platform policy across user safety, expression, privacy, accessibility,
    competition and due process, then propose an implementable improvement with acknowledged tradeoffs.
  claims:
  - statement: Analyze a digital platform policy across user safety, expression, privacy, accessibility,
      competition and due process, then propose an implementable improvement with acknowledged tradeoffs.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Digital citizenship and platform governance practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Digital citizenship and platform governance as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a small club forum rather than a commercial platform, and discuss cases
    through text or voice. Avoid reproducing slurs, threats or private abuse reports. For actual policy
    adoption, consult affected users and applicable legal or institutional guidance before implementation.
  opportunity_considerations: 'Fictional platform rule: Every removed post causes an automatic permanent
    account ban, with no explanation or appeal; all users must publish legal names. Use six lenses: safety,
    expression, privacy and surveillance, accessibility, platform incentives and competition, and notice
    or appeal. The task is to redesign the rule, not to prove that every restriction is censorship or
    every appeal is harmless.'
  prerequisites:
  - 'Fictional platform rule: Every removed post causes an automatic permanent account ban, with no explanation
    or appeal; all users must publish legal names. Use six lenses: safety, expression, privacy and surveillance,
    accessibility, platform incentives and competition, and notice or appeal. The task is to redesign
    the rule, not to prove that every restriction is censorship or every appeal is harmless.'
  dependencies: []
  safe_alternatives:
  - Use a small club forum rather than a commercial platform, and discuss cases through text or voice.
    Avoid reproducing slurs, threats or private abuse reports. For actual policy adoption, consult affected
    users and applicable legal or institutional guidance before implementation.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Digital citizenship and platform governance differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Digital citizenship and platform
    governance as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-COMMUNITY-CONTRIBUTION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Fictional platform rule: Every removed post causes an automatic permanent account ban, with
    no explanation or appeal; all users must publish legal names. Use six lenses: safety, expression,
    privacy and surveillance, accessibility, platform incentives and competition, and notice or appeal.
    The task is to redesign the rule, not to prove that every restriction is censorship or every appeal
    is harmless. Goal: Analyze a digital platform policy across user safety, expression, privacy, accessibility,
    competition and due process, then propose an implementable improvement with acknowledged tradeoffs.
    Scope: This is civic policy reasoning, not a legal judgment or authority to moderate a real community.
    No particular political position, platform or identity disclosure is required. Time and effort: Thirty
    minutes with the supplied fictional rule and ten minutes to test edge cases. Adaptation: Use a small
    club forum rather than a commercial platform, and discuss cases through text or voice. Avoid reproducing
    slurs, threats or private abuse reports. For actual policy adoption, consult affected users and applicable
    legal or institutional guidance before implementation. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a small club forum rather than a commercial platform, and discuss cases through
    text or voice. Avoid reproducing slurs, threats or private abuse reports. For actual policy adoption,
    consult affected users and applicable legal or institutional guidance before implementation.
  expected_burden: Thirty minutes with the supplied fictional rule and ten minutes to test edge cases.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Digital citizenship and platform governance protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Digital citizenship and platform governance action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a small
    club forum rather than a commercial platform, and discuss cases through text or voice. Avoid reproducing
    slurs, threats or private abuse reports. For actual policy adoption, consult affected users and applicable
    legal or institutional guidance before implementation.
  actions:
  - stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01-A1
    sequence: 1
    title: Identify whose interests and risks the rule changes
    instructions: 'Describe the rule’s intended safety benefit and identify at least three differently
      situated users, such as a harassment target, a mistaken poster and a person who needs pseudonymity
      for safety. Examine each lens, including moderation workload and business incentives. Separate a
      value judgment from a factual claim that would need data or current law. Do not assume a legal-name
      requirement reliably establishes trustworthy behavior.


      Observation checks: The intended safety benefit is stated fairly; At least three differently situated
      users are considered; All six policy lenses receive a concrete consequence or uncertainty; Legal
      factual and normative claims are distinguished. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01
      action_stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01-A1
      competency_stable_id: '14.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1413_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1413_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_intended_safety_benefit_is_stated_fairly
        - at_least_three_differently_situated_users_are_considered
        - all_six_policy_lenses_receive_a_concrete_consequence_or_uncertainty
        - legal_factual_and_normative_claims_are_distinguished
      - measurement_id: c1413_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1413_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01-A2
    sequence: 2
    title: Draft a proportionate rule with notice and review
    instructions: 'Replace the blanket rule with a specific misconduct definition, proportionate responses,
      an urgent safety exception, a plain-language notice and an accessible appeal route. State what evidence
      moderators retain, who can see it and when it is deleted. Consider pseudonymous participation with
      appropriate anti-abuse controls rather than public identity by default. Identify the staff or technical
      capacity needed so the appeal is not merely decorative.


      Observation checks: The proposed rule defines conduct and proportionate responses; Urgent safety
      and ordinary review paths are distinct; Notice appeal access and evidence privacy are specified;
      Operational capacity and pseudonymity tradeoffs are acknowledged. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01
      action_stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01-A2
      competency_stable_id: '14.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1413_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1413_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_proposed_rule_defines_conduct_and_proportionate_responses
        - urgent_safety_and_ordinary_review_paths_are_distinct
        - notice_appeal_access_and_evidence_privacy_are_specified
        - operational_capacity_and_pseudonymity_tradeoffs_are_acknowledged
      - measurement_id: c1413_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1413_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01-A3
    sequence: 3
    title: Test three edge cases and revise one weak point
    instructions: 'Apply the draft to a mistaken quotation, repeated targeted harassment and an urgent
      credible threat. Explain what action occurs, what the user is told and when review happens in each
      case. Look for inconsistent enforcement, inaccessible appeals or incentives to over-remove content.
      Revise one weakness and state the unresolved tradeoff or data needed; a well-written policy is not
      proof of fair implementation.


      Observation checks: Three distinct edge cases receive explicit dispositions; Notice action and review
      timing are clear in each case; Implementation incentives and access failures are considered; One
      revision and an unresolved evidence need are recorded. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which protection improved, what cost did it impose, and how would someone challenge
      a mistaken decision in practice?


      Examples: Supportive: The revised rule preserved urgent threat removal while adding proportionate
      sanctions, private evidence handling and an accessible appeal.


      Mixed: The policy balanced several values, but the proposed review workload exceeded available moderators
      and needed a simpler process.


      Contradictory: Safety was used to justify unlimited surveillance or expression used to dismiss targeted
      harassment entirely.


      Inconclusive: A policy preference was stated without affected users, operational details, edge cases
      or an appeal route.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01
      action_stable_id: PRACTICE-COMP-1413-DIGITAL-CITIZENSHIP-AND-PLATFORM-GOVERNANCE-01-A3
      competency_stable_id: '14.13'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1413_a3_primary
      transfer_disposition: context_bound
