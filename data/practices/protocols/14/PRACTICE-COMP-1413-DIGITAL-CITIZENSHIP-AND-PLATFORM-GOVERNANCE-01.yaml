  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Digital citizenship and platform governance; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use a small club forum rather than a commercial platform, and discuss cases through text or voice.
      Avoid reproducing slurs, threats or private abuse reports. For actual policy adoption, consult affected
      users and applicable legal or institutional guidance before implementation.
    cultural_context:
    - Adapt the expression of Digital citizenship and platform governance to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a small club forum rather than a commercial platform, and discuss cases through text or voice.
      Avoid reproducing slurs, threats or private abuse reports. For actual policy adoption, consult affected
      users and applicable legal or institutional guidance before implementation.
  pause_conditions:
  - Pause Digital citizenship and platform governance when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Digital citizenship and platform governance practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Digital citizenship and platform governance situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Digital citizenship and platform governance actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1413_a1_primary
  - c1413_a1_boundary
  - c1413_a1_adverse
  - c1413_a2_primary
  - c1413_a2_boundary
  - c1413_a2_adverse
  - c1413_a3_primary
  - c1413_a3_boundary
  - c1413_a3_adverse
  adverse_or_contradictory_indicators:
  - Safety was used to justify unlimited surveillance or expression used to dismiss targeted harassment
    entirely.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Digital citizenship and platform governance explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Digital citizenship and platform governance
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Digital citizenship and platform governance observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Digital citizenship and platform governance rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Identify whose interests and risks the rule changes. Observed checks:
    The intended safety benefit is stated fairly; At least three differently situated users are considered;
    All six policy lenses receive a concrete consequence or uncertainty; Legal factual and normative claims
    are distinguished. Action 2: Draft a proportionate rule with notice and review. Observed checks: The
    proposed rule defines conduct and proportionate responses; Urgent safety and ordinary review paths
    are distinct; Notice appeal access and evidence privacy are specified; Operational capacity and pseudonymity
    tradeoffs are acknowledged. Action 3: Test three edge cases and revise one weak point. Observed checks:
    Three distinct edge cases receive explicit dispositions; Notice action and review timing are clear
    in each case; Implementation incentives and access failures are considered; One revision and an unresolved
    evidence need are recorded.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A policy preference was stated without affected users,
    operational details, edge cases or an appeal route.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Digital
    citizenship and platform governance contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L19
  - L30
  - L31
  - L33
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Digital citizenship and platform governance evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
