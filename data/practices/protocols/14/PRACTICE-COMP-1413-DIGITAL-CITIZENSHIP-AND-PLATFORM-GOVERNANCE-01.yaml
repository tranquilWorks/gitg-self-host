      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Baseline capacity is 2 × 30 = 60 moderator-minutes. Four ordinary reviews at ten minutes plus
      one urgent review at twenty consume all 60. The plan has zero reserve; it cannot honestly promise
      spare same-day capacity.


      The next day has six ordinary reviews plus one urgent review: 80 minutes. With unchanged staffing
      there is a 20-minute shortfall. Prioritizing the urgent case leaves 40 minutes for four ordinary
      reviews and two ordinary reviews pending. This is a model calculation, not a required legal triage
      policy or proof which cases are truly urgent.


      One appellant cannot use the slider. Another is banned and cannot reach the form behind login. Adding
      “appeals welcome” did not fix either barrier. Revise access and notice so the alternative is actually
      reachable, verify ownership proportionately and ensure an available reviewer receives the case.
      An unstaffed inbox is not an immediate response service.


      Illustrative case dispositions: Q needs context review and correction of an erroneous removal if
      the supplied context is confirmed. H warrants protective action against repeated targeted contact
      with a reason and review route. T needs prompt safety escalation appropriate to the facts and location,
      restricted necessary evidence, and review of protective action; a volunteer forum cannot promise
      emergency response.


      A defensible revision publishes a daily review window, sends pending-status notices, prioritizes
      urgent safety handling, limits additional queue promises and identifies the need for backup capacity.
      It still leaves off-hours coverage unresolved until a real arrangement exists. No actual appeal,
      policy adoption or fair-enforcement result is established here.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### A policy must work for the people who need to challenge it


      Platform governance decides who can participate, what gets removed, how errors are corrected and
      what information is collected along the way. A rule can pursue a legitimate safety goal and still
      impose unnecessary privacy costs or silence people through mistakes. A policy evaluation should
      explain both the protection and its tradeoffs, then test whether the process is usable with the
      available staff and technology.


      Allow 45 minutes for the fictional Harbor Forum policy below. Use paper or an accessible editor.
      You are proposing a rule, not moderating real users or giving a legal judgment. No abusive text,
      identity documents or private reports need to be collected. Your output is a short policy, three
      case decisions, a capacity calculation and a revision.


      ### Six lenses with different questions


      Safety asks whether users can participate without targeted abuse. Expression asks what legitimate
      speech could be mistakenly restricted. Privacy and surveillance ask what data are collected, who
      can access them and how long they persist. Accessibility asks whether people can read notices and
      use controls. Incentives and competition ask what behavior the platform rewards and whether users
      can leave without losing essential access. Due process asks whether a person can understand and
      challenge a decision.


      The [European Commission''s DSA user-rights overview](https://digital-strategy.ec.europa.eu/en/factpages/user-rights-under-digital-services-act)
      describes transparency and challenge mechanisms in the EU framework. It is a jurisdiction-specific
      example, not proof that the same obligations apply to every small forum worldwide. Our invented
      policy deadlines below are design choices, not statutory periods. [W3C accessibility guidance](https://www.w3.org/WAI/tips/developing/)
      supports keyboard-operable controls and usable forms; adding the word “accessible” to a policy does
      not establish that its interface works.


      Worked example: a ban notice says only “rules broken” and provides an appeal button visible only
      after sign-in. A banned person cannot sign in. The appeal exists in the document but is unusable
      at the moment it matters. A repair needs an appropriate authenticated-by-alternative route, clear
      reasons and a responsible reviewer, with careful protection against someone else taking over the
      appeal.


      ### Complete platform case


      Harbor Forum has 200 adult members discussing local hobbies. It earns advertising income when people
      keep reading. Pseudonyms currently help several members participate safely. Users can export their
      own posts in plain text, but the export excludes their saved topic organization; moving communities
      therefore has a real cost. No evidence shows whether legal names reduce abuse on this forum.


      Proposed rule: “Every removed post produces an automatic permanent account ban. No explanation or
      appeal is provided. Every member must publish their legal name. All private messages are retained
      forever for future safety investigations.”


      The stated purpose is to stop repeated harassment and reduce moderator workload. Consider at least
      these affected users: a person being targeted, a member whose quotation was mistaken for endorsement,
      a person needing pseudonymity for safety, and someone who uses keyboard navigation. Do not assume
      these needs are mutually exclusive.


      Available capacity: two moderators each have 30 minutes per day for this review queue. An ordinary
      review requires ten minutes; an urgent safety case requires twenty minutes in the model. Today''s
      expected workload is four ordinary reviews and one urgent review. There is no 24-hour coverage or
      guaranteed outside support. The current appeal form requires dragging an image slider and a logged-in
      account, both defects for some users or banned accounts.


      #### Action 1 — State consequences and uncertainties


      Make six short rows, one per lens. For each, identify a concrete effect, affected person and uncertain
      factual assumption. Fairly state the proposed rule''s intended benefit before evaluating costs.
      Separate a value choice (“we should preserve pseudonymity”) from a factual claim (“public legal
      names prevent repeat abuse”) that would need evidence.


      Include the incentive conflict: a platform paid for engagement may benefit from heated threads while
      moderators bear the work. This is a plausible incentive in the stipulated model, not proof of any
      actual company''s intent. Consider competition beyond “people can leave”: exports, community ties
      and switching effort can constrain that option.


      #### Action 2 — Draft a feasible replacement


      Write a policy of roughly 200–300 words. Define prohibited conduct through behavior, such as repeated
      targeted contact after a clear stop request, rather than disagreement or identity. Distinguish removing
      harmful material, temporary protective restrictions and permanent sanctions after proportionate
      review. Permit urgent protective action while preserving later review; an imminent real-world danger
      needs appropriate emergency routes beyond an unstaffed hobby forum.


      Specify a notice containing the affected item, rule, reason, action and review route while protecting
      reporters'' private details. Provide an appeal route usable without the banned account''s ordinary
      session and without the slider-only barrier; include an alternative contact method and identity
      verification proportionate to the appeal. Preserve pseudonymity unless a specific justified process
      requires private verification.


      Choose who can see necessary evidence, a limited retention/review period and exceptions that require
      explicit justification. Do not adopt permanent collection of all private messages as the default.
      State the daily review window and capacity limit honestly. Pick a modest operational target rather
      than claiming immediate around-the-clock decisions. Plan how a person learns that a case is pending.


      #### Action 3 — Test cases and capacity


      Apply your rule to Q: a quoted offensive claim clearly criticized in surrounding text; H: repeated
      targeted messages after a stop request; and T: an apparently credible imminent threat that needs
      urgent assessment. No actual wording is supplied or required. For each, state the initial protection,
      notice and review route without exposing a reporter or deciding legal guilt.


      Calculate today''s review minutes, then open [the later packet](?resource=file-later-packet-md)
      for a demand surge and accessibility failure. Revise one operational weakness. A triage scheme can
      prioritize harm; it cannot create staff time or turn an acknowledgment into a decision. Keep unresolved
      coverage and legal-review needs visible.


      Complete [fresh checks](?attempt=practice-checks), then [the key](?check=practice-answers). Compare
      policy intent with actual usability, not just how balanced the prose sounds.


      ### Adapt and transfer


      Discuss through text or voice and use case labels rather than reproducing abuse. A supported route
      evaluates a small club''s rule, one lens at a time. A harder route adds a reporter who fears retaliation
      and an appellant seeking evidence: explain what can be disclosed enough to challenge the decision
      without exposing the reporter unnecessarily. Mark unresolved conflicts rather than promising perfect
      transparency and perfect secrecy at once.


      For real transfer, inspect one platform''s published rule, notice and actual appeal entry point
      without submitting a fake report. Identify a concrete barrier and propose a correction through an
      authorized feedback route if desired. Actual adoption requires affected-user input, applicable legal/institutional
      review and practical testing.


      **Supportive:** A proportionate rule survives cases, access checks and realistic capacity. **Mixed:**
      Rights improve but backlog or off-hours coverage remains unresolved. **Contradictory:** Safety becomes
      unlimited surveillance or expression becomes dismissal of targeted harm. **Inconclusive:** A preferred
      slogan has no implementable notice, review or staffing process.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. One moderator has 45 minutes. Three ordinary reviews take ten minutes each and one urgent
      case takes twenty. What is the shortfall, and how many full ordinary reviews fit after the urgent
      case?

      2. A policy promises appeal within a day, but banned users can access the form only after signing
      in. What concrete repairs and verification are needed?

      3. A platform claims public legal names will eliminate abuse and proposes retaining every private
      message forever. Separate the intended benefit, evidence need and privacy alternative.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Demand is 50 minutes; shortfall is five. After the twenty-minute urgent case, 25 minutes
      remain, allowing two complete ordinary reviews with five minutes left and one ten-minute review
      pending. A five-minute arithmetic shortfall does not mean half a case can be declared reviewed.

      2. Provide a reachable alternative that does not require the unavailable session, proportionate
      ownership checks, keyboard-accessible controls and a staffed receiving process. Test the actual
      banned-user route. A written deadline alone repairs neither access nor capacity.

      3. Accountability and abuse prevention are plausible aims, but elimination is an unsupported empirical
      claim. Compare proportionate anti-abuse controls, pseudonymous participation, restricted case-specific
      evidence and justified retention limits. Actual law and safety requirements need contextual review;
      indefinite surveillance should not be assumed necessary by definition.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
