meaning_and_fit:
  purpose: Combine strong authentication with usable recovery, device protection and data resilience so
    account security is not reduced to a password change alone.
  why_recommended: Combine strong authentication with usable recovery, device protection and data resilience
    so account security is not reduced to a password change alone.
  claims:
  - statement: Combine strong authentication with usable recovery, device protection and data resilience
      so account security is not reduced to a password change alone.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Cybersecurity and account resilience practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Cybersecurity and account resilience as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use hardware, passkey, authenticator or other methods supported by the service
    and suitable for access needs; not every method fits every person. A trusted helper may explain controls
    without receiving secrets. Suspected abuse or managed-account restrictions require appropriate specialist
    or organizational guidance.
  opportunity_considerations: Choose a non-emergency account you control and keep a working signed-in
    session available. Use the provider’s official security page, an existing trusted password manager
    if available and a private place for recovery material. Do not paste passwords, authentication codes
    or recovery keys into the practice record. Do not remove a working recovery method before its replacement
    is verified.
  prerequisites:
  - Choose a non-emergency account you control and keep a working signed-in session available. Use the
    provider’s official security page, an existing trusted password manager if available and a private
    place for recovery material. Do not paste passwords, authentication codes or recovery keys into the
    practice record. Do not remove a working recovery method before its replacement is verified.
  dependencies: []
  safe_alternatives:
  - Use hardware, passkey, authenticator or other methods supported by the service and suitable for access
    needs; not every method fits every person. A trusted helper may explain controls without receiving
    secrets. Suspected abuse or managed-account restrictions require appropriate specialist or organizational
    guidance.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Cybersecurity and account resilience differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Cybersecurity and account
    resilience as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Choose a non-emergency account you control and keep a working signed-in session available. Use
    the provider’s official security page, an existing trusted password manager if available and a private
    place for recovery material. Do not paste passwords, authentication codes or recovery keys into the
    practice record. Do not remove a working recovery method before its replacement is verified. Goal:
    Combine strong authentication with usable recovery, device protection and data resilience so account
    security is not reduced to a password change alone. Scope: This is a bounded personal-account hardening
    exercise, not penetration testing or a claim that an account cannot be compromised. Follow current
    vendor instructions and organizational policy. Time and effort: Twenty to thirty minutes for one authorized
    account and a short recovery-plan review. Adaptation: Use hardware, passkey, authenticator or other
    methods supported by the service and suitable for access needs; not every method fits every person.
    A trusted helper may explain controls without receiving secrets. Suspected abuse or managed-account
    restrictions require appropriate specialist or organizational guidance. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use hardware, passkey, authenticator or other methods supported by the service
    and suitable for access needs; not every method fits every person. A trusted helper may explain controls
    without receiving secrets. Suspected abuse or managed-account restrictions require appropriate specialist
    or organizational guidance.
  expected_burden: Twenty to thirty minutes for one authorized account and a short recovery-plan review.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Cybersecurity and account resilience protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Cybersecurity and account resilience action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use hardware,
    passkey, authenticator or other methods supported by the service and suitable for access needs; not
    every method fits every person. A trusted helper may explain controls without receiving secrets. Suspected
    abuse or managed-account restrictions require appropriate specialist or organizational guidance.
  actions:
  - stable_id: PRACTICE-COMP-1404-CYBERSECURITY-AND-ACCOUNT-RESILIENCE-01-A1
    sequence: 1
    title: Map authentication recovery and device prerequisites
    instructions: 'Check whether the account uses a unique strong password or an appropriate supported
      passkey, what multifactor methods exist, and how recovery works if the usual phone is unavailable.
      Identify the device lock, update status and any encryption or backup prerequisite. Verify that recovery
      contact information is yours and current through the official account page. Record only status,
      never secret values.


      Observation checks: Authentication and recovery methods are separately identified; The account and
      recovery contacts are authorized and current; Device lock updates and relevant backup or encryption
      prerequisites are checked; No secret values enter the practice record. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1404-CYBERSECURITY-AND-ACCOUNT-RESILIENCE-01
      action_stable_id: PRACTICE-COMP-1404-CYBERSECURITY-AND-ACCOUNT-RESILIENCE-01-A1
      competency_stable_id: '14.04'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
