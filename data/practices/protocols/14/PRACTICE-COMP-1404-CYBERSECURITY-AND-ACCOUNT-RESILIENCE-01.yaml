  - stable_id: PRACTICE-COMP-1404-CYBERSECURITY-AND-ACCOUNT-RESILIENCE-01-A3
    sequence: 3
    title: Rehearse the loss scenario and close the remaining gaps
    instructions: 'Without actually losing access, explain how you would sign in or contact official support
      if the normal device were unavailable. Check whether the recovery instructions themselves depend
      on the missing account. Review active sessions or linked apps through official controls and flag
      unexplained entries for the provider’s incident process. Record one unresolved gap and a follow-up
      date rather than claiming full security.


      Observation checks: The lost-device scenario has a plausible verified route; Circular dependencies
      in the recovery plan are identified; Unexplained sessions or apps use an official incident route;
      Unresolved gaps remain visible with a next review. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Did the improvement reduce a real compromise path while leaving a recovery route you
      can actually use?


      Examples: Supportive: A supported second factor was enabled and tested, and recovery material was
      available without relying on the same phone.


      Mixed: Authentication improved, but recovery instructions were stored only inside the protected
      account and needed a separate safe location.


      Contradictory: All recovery methods were removed or codes shared with a helper to make the account
      appear more secure.


      Inconclusive: A password was changed without checking reuse, recovery, device access or whether
      the new method worked.'
    expected_time: 15-25 minutes
    due_within_days: 10
