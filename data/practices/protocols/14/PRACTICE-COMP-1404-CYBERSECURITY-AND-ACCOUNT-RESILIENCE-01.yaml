  - stable_id: PRACTICE-COMP-1404-CYBERSECURITY-AND-ACCOUNT-RESILIENCE-01-A2
    sequence: 2
    title: Make one supported improvement and verify access safely
    instructions: 'Follow the provider’s current instructions to enable a suitable additional authentication
      method, replace a reused password or correct an obsolete recovery contact. Store any recovery codes
      through an appropriate private method before testing. Confirm the new method in a separate authorized
      session while retaining the known working session. Do not trigger account recovery, disable every
      fallback or factory-reset a device as a test.


      Observation checks: One supported security improvement is completed; Recovery material is stored
      privately before access testing; The new method is verified while known working access remains available;
      No destructive lockout or device-reset experiment is performed. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
