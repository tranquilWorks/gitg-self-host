  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Online communication and community conduct explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Online communication and community conduct
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Online communication and community conduct observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Online communication and community conduct rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Identify the audience and the information you are not entitled to share.
    Observed checks: Public claims are separated from private information and motive assumptions; Consent
    and context are checked before sharing another person’s words; Potential persistence and audience
    expansion are considered; The community rule and moderation route are identified proportionately.
    Action 2: Write and use a narrow respectful response. Observed checks: The response addresses one
    specific claim or question; Private material and personal attacks are removed; The interaction avoids
    recruitment repeated pressure and pile-ons; Live posting and private rehearsal are distinguished.
    Action 3: Choose whether to continue disengage or use moderation. Observed checks: New evidence can
    correct the participant’s own claim; Disengagement is available without retaliatory posting; Moderation
    uses factual proportionate reporting rather than mass pressure; Any prior harm receives correction
    without claiming complete erasure.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A polite tone was added while the message still exposed
    private information and demanded public agreement.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Online
    communication and community conduct contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
