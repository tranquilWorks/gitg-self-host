      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: '**Ordinary branch:** Morgan publicly replies, “Version 2. Its manual says default margin 8;
      I should have said which version.” A supplied public version 2 manual confirms 8. Your version 3
      manual still says 6. A useful response acknowledges both and makes the version distinction clear.
      Morgan''s appointment and private chat remain unnecessary. There is no basis here for a misconduct
      report about the original technical claim.


      **Separate targeting branch:** Instead of the reply above, another account posts three public messages
      in ten minutes calling for everyone to tag Morgan repeatedly. No threat or private information appears
      in this branch. Under the supplied forum rules, coordinate targeting is a moderation concern. A
      factual private report could name the three public post references, the repeated-targeting rule
      and the behavior. Do not request a mass ban campaign or reproduce private chats.


      The moderator form acknowledges receipt only. No review decision or removal is supplied. “Reported”
      is accurate; “resolved” is not. You can disengage and use suitable controls without repeatedly contacting
      Morgan or the targeting account.


      **Correction branch:** If you had already posted a screenshot in a real interaction, taking down
      your copy would be a useful repair, but not proof that all copies disappeared. In this default case
      nothing was posted, so do not claim an actual deletion or actual apology occurred.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Make the disagreement easier to resolve


      A useful online reply makes the disputed claim clearer while respecting the people and information
      involved. Politeness alone is insufficient if the message exposes a private conversation, recruits
      a crowd or demands public agreement. Conversely, disagreement with a public claim is not automatically
      harassment. Attend to content, audience, consent, repetition and the community''s actual rules.


      Allow 30 minutes for a fictional hobby-forum exchange. Use paper or an accessible editor. No post,
      message to a real person or moderator report is required. Your output is an audience/privacy decision,
      a revised public reply, a response to new evidence and a proportionate moderator note if one is
      justified.


      ### Context and permission travel differently


      A private message may make sense within a relationship while becoming misleading or exposing when
      copied into a public thread. Permission to read it is not permission to publish it. Cropping a screenshot
      or removing a name may not prevent recognition through context. A post can also outlive deletion
      through copies. Think about likely audience expansion before sharing, rather than treating removal
      as guaranteed erasure.


      Pseudonymous participation can protect privacy. Creating a deceptive second identity to manufacture
      agreement or bypass moderation undermines the conversation. Do not confuse those behaviors. The
      question is what the account is doing, not whether its display name is a legal name.


      Worked example: “You never know what you are talking about; everyone should report this person”
      turns a checkable claim into a personal campaign. “The manual I have gives a different setting;
      which revision are you using?” identifies the evidence and leaves room for you to be wrong. The
      second message is useful only if it also omits private material and stops short of repeated pressure.


      ### Complete forum packet


      The fictional PaperCraft forum discusses a harmless desktop paper-layout application. It is not
      advice about wiring, machinery or other hazardous equipment.


      **Public thread:** Morgan says, “Set PaperCraft''s margin to 8 units; that''s the default in the
      manual.” You have manual version 3: “Default margin: 6 units.” Neither participant has yet specified
      a version in the public thread.


      **Private chat:** Morgan previously wrote, “I''m using version 2, and I can only answer next week
      because of a family appointment.” Morgan has not consented to publication of any of this chat. It
      contains an appointment detail irrelevant to the technical question.


      **Your unposted draft:** “You always give terrible advice. Here is our private chat proving it.
      Everyone tag Morgan until they admit they are wrong.” No screenshot or message has actually been
      posted.


      **Complete relevant forum rules:** Discuss a specific claim and source; do not publish private messages
      or personal details without permission; do not coordinate repeated targeting; pseudonyms are allowed;
      deceptive accounts and impersonation are prohibited. Report a rule concern through the private moderator
      form with the public post link and a concise factual description. Do not attach private material
      unless the moderation process appropriately requests necessary evidence. Ordinary technical disagreement
      is not grounds for punishment.


      #### Action 1 — Decide what belongs in the audience


      Create four rows: public claim, public manual, private version information, private appointment.
      For each, state whether you can use it in a public reply, what consent/context is missing and a
      less exposing alternative. Even a relevant private version detail can be elicited through a neutral
      public question instead of publishing the chat.


      Name the actual rule at issue in your unposted draft. The problem is your proposed personal attack,
      exposure and pile-on, not Morgan''s unverified intent. Because the draft is unposted, do not invent
      a completed privacy breach or pretend deletion is needed. If an actual breach had occurred, correction/removal
      and appropriate acknowledgment would matter, while copies could remain.


      #### Action 2 — Draft one narrow response


      Write no more than 50 words: cite the version 3 default you can support, ask which version the public
      advice refers to and remove the screenshot, appointment, attack and recruitment. You may say: “My
      version 3 manual lists a default margin of 6 units. Which version is your 8-unit advice for? Adding
      the version would help readers choose the right setting.”


      Save the response without posting. State a stopping rule: one question, then allow time; do not
      send repeated reminders to demand agreement. If you discover your own error, the correction should
      be as visible to affected readers as the original claim where reasonably possible.


      #### Action 3 — Choose the next action from the reply


      Open [the later packet](?resource=file-later-packet-md). Handle the ordinary clarification and the
      separate targeting branch separately. A helpful reply may warrant acknowledgment and a revised shared
      answer. Refusal to debate does not itself justify moderator punishment. Repeated targeted messages,
      private disclosure or threats require a different response from a technical disagreement.


      For a rule violation, draft a short factual moderator note identifying the relevant behavior and
      rule. Do not organize mass reports or use another account to continue contact. For real serious
      abuse, use the platform''s current safety guidance and appropriate local support. [Australia''s
      eSafety guidance](https://www.esafety.gov.au/key-topics/adult-cyber-abuse/report-adult-cyber-abuse)
      explains evidence/reporting steps and its specific jurisdictional threshold; that threshold is not
      a universal definition of all bad conduct. Where safe and lawful, preserve necessary report evidence
      before controls that may hide it. Immediate safety takes priority over completing this exercise.


      Attempt [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). Record
      whether each action is a private rehearsal, a plan, or an actual authorized interaction. A fictional
      moderator reply is not a real resolution.


      ### Adapt and transfer


      Use asynchronous text, a trusted reader or careful translation. No legal name, personal vulnerability
      or private life story is required. A supported route uses the public claim and public manual only.
      A harder route has your manual turn out to be the wrong revision: write an explicit correction without
      blaming the other person for your inference.


      For real transfer, choose an existing low-stakes exchange you are already authorized to participate
      in. Read its rules, ask one focused question or make one supported correction, then observe the
      response without creating conflict for practice. If there is no suitable exchange, the offline rehearsal
      is sufficient for this bounded writing task and remains labeled as such.


      **Supportive:** The version issue is clarified with privacy and consent preserved. **Mixed:** Wording
      improves, but repeated follow-ups still exert pressure. **Contradictory:** Screenshots or deceptive
      accounts recruit a pile-on. **Inconclusive:** A polite tone masks an unresolved privacy violation
      or no actual draft is examined.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A private message contains the exact missing version number. The writer has not consented
      to sharing it. Can you post a cropped screenshot if the name is removed? Give a less exposing route.

      2. Someone answers your public question with a source showing your earlier claim was wrong. Write
      a correction that does not add private context.

      3. A user declines further discussion. You create another account to ask again and ask five friends
      to tag them. Which conduct problems arise, and is using a pseudonym itself the issue?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Cropping does not create consent or guarantee anonymity. Ask a neutral public version question,
      seek specific permission where appropriate, or rely on a public source. If you chose the screenshot
      because it was relevant, separate relevance from publication authority.

      2. For example: “The version 4 manual you linked supports your setting. I used the version 3 manual
      and overstated its scope. My earlier statement should have specified version 3.” Preserve the source
      and correct the exact error rather than saying vaguely that “mistakes were made.”

      3. The problems are evading disengagement through a deceptive account and coordinating repeated
      pressure. A permitted pseudonym is different from manufacturing identities to bypass boundaries.
      Stop the repeated contact; a refusal alone is not a reason to punish the user.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
