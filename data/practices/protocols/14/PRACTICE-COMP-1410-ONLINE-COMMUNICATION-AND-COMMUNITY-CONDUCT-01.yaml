meaning_and_fit:
  purpose: Communicate in an online community with consent, context, privacy and proportionate moderation,
    avoiding pile-ons and treating permanence as a reason for care rather than silence.
  why_recommended: Communicate in an online community with consent, context, privacy and proportionate
    moderation, avoiding pile-ons and treating permanence as a reason for care rather than silence.
  claims:
  - statement: Communicate in an online community with consent, context, privacy and proportionate moderation,
      avoiding pile-ons and treating permanence as a reason for care rather than silence.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Online communication and community conduct practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Online communication and community conduct as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use asynchronous text, accessible formatting, translation with care or a trusted
    moderator. Do not require disclosure of identity or personal vulnerability to participate. Threats,
    stalking or intimate-image abuse need the relevant platform and specialist safety routes rather than
    ordinary debate techniques.
  opportunity_considerations: 'Default draft in a hobby forum: You always give terrible advice; here is
    a screenshot of our private chat proving it. Replace it using three supplied components: the specific
    public claim, the evidence or question, and a proportionate request. Read the community’s current
    rules before posting; use a fictional draft when no suitable live disagreement exists.'
  prerequisites:
  - 'Default draft in a hobby forum: You always give terrible advice; here is a screenshot of our private
    chat proving it. Replace it using three supplied components: the specific public claim, the evidence
    or question, and a proportionate request. Read the community’s current rules before posting; use a
    fictional draft when no suitable live disagreement exists.'
  dependencies: []
  safe_alternatives:
  - Use asynchronous text, accessible formatting, translation with care or a trusted moderator. Do not
    require disclosure of identity or personal vulnerability to participate. Threats, stalking or intimate-image
    abuse need the relevant platform and specialist safety routes rather than ordinary debate techniques.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Online communication and community conduct differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Online communication and community
    conduct as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-QUALIFIED-CONSULTATION
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default draft in a hobby forum: You always give terrible advice; here is a screenshot of our
    private chat proving it. Replace it using three supplied components: the specific public claim, the
    evidence or question, and a proportionate request. Read the community’s current rules before posting;
    use a fictional draft when no suitable live disagreement exists. Goal: Communicate in an online community
    with consent, context, privacy and proportionate moderation, avoiding pile-ons and treating permanence
    as a reason for care rather than silence. Scope: Use an ordinary low-stakes disagreement, not active
    abuse, threats or a situation requiring specialist moderation or emergency intervention. No public
    conflict needs to be created for practice. Time and effort: Fifteen minutes to revise a draft and
    one safe interaction or offline rehearsal. Adaptation: Use asynchronous text, accessible formatting,
    translation with care or a trusted moderator. Do not require disclosure of identity or personal vulnerability
    to participate. Threats, stalking or intimate-image abuse need the relevant platform and specialist
    safety routes rather than ordinary debate techniques. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use asynchronous text, accessible formatting, translation with care or a trusted
    moderator. Do not require disclosure of identity or personal vulnerability to participate. Threats,
    stalking or intimate-image abuse need the relevant platform and specialist safety routes rather than
    ordinary debate techniques.
  expected_burden: Fifteen minutes to revise a draft and one safe interaction or offline rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Online communication and community conduct protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Online communication and community conduct action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use asynchronous
    text, accessible formatting, translation with care or a trusted moderator. Do not require disclosure
    of identity or personal vulnerability to participate. Threats, stalking or intimate-image abuse need
    the relevant platform and specialist safety routes rather than ordinary debate techniques.
  actions:
  - stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01-A1
    sequence: 1
    title: Identify the audience and the information you are not entitled to share
    instructions: 'Separate the public technical disagreement from private conversation, identity details
      and assumptions about motive. Check whether the person consented to any screenshot or quotation
      being shared and whether context would change its meaning. Assume a post may be copied beyond the
      original audience. Identify the relevant community rule and an appropriate moderator route without
      treating disagreement itself as misconduct.


      Observation checks: Public claims are separated from private information and motive assumptions;
      Consent and context are checked before sharing another person’s words; Potential persistence and
      audience expansion are considered; The community rule and moderation route are identified proportionately.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01
      action_stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01-A1
      competency_stable_id: '14.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1410_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1410_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - public_claims_are_separated_from_private_information_and_motive_assumptions
        - consent_and_context_are_checked_before_sharing_another_person_s_words
        - potential_persistence_and_audience_expansion_are_considered
        - the_community_rule_and_moderation_route_are_identified_proportionately
      - measurement_id: c1410_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1410_a1_adverse
        kind: boolean
        role: adverse
