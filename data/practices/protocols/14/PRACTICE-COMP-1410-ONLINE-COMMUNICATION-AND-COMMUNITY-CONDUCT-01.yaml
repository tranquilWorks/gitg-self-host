        expected: true
  - stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01-A2
    sequence: 2
    title: Write and use a narrow respectful response
    instructions: 'Replace the default with a specific correction or question, such as The manual lists
      a different connector rating; which revision are you using? Omit the private screenshot and personal
      attack. Ask once, allow processing time and do not recruit others to overwhelm the person. Post
      only if appropriate and authorized; otherwise rehearse the revised exchange privately and label
      it as such.


      Observation checks: The response addresses one specific claim or question; Private material and
      personal attacks are removed; The interaction avoids recruitment repeated pressure and pile-ons;
      Live posting and private rehearsal are distinguished. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01
      action_stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01-A2
      competency_stable_id: '14.10'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1410_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1410_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_response_addresses_one_specific_claim_or_question
        - private_material_and_personal_attacks_are_removed
        - the_interaction_avoids_recruitment_repeated_pressure_and_pile_ons
        - live_posting_and_private_rehearsal_are_distinguished
      - measurement_id: c1410_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1410_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01-A3
    sequence: 3
    title: Choose whether to continue disengage or use moderation
    instructions: 'Review the actual reply or a supplied hypothetical refusal. Correct your own error
      when evidence warrants it, acknowledge a useful answer and stop if the exchange becomes repetitive
      or unsafe. Use mute, block or a factual moderator report where appropriate rather than retaliatory
      posting or deceptive accounts. If harm was already caused, remove or correct your contribution where
      possible and acknowledge that copies may remain.


      Observation checks: New evidence can correct the participant’s own claim; Disengagement is available
      without retaliatory posting; Moderation uses factual proportionate reporting rather than mass pressure;
      Any prior harm receives correction without claiming complete erasure. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Did the response make the issue easier to resolve while reducing unnecessary exposure
      and pressure on the people involved?


      Examples: Supportive: The connector question was clarified with the manual revision, and the private
      chat was never posted.


      Mixed: The factual correction was useful, but repeated follow-up messages became pressure and needed
      to stop.


      Contradictory: Private screenshots were posted or alternate accounts used to recruit a pile-on.


      Inconclusive: A polite tone was added while the message still exposed private information and demanded
      public agreement.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1410-ONLINE-COMMUNICATION-AND-COMMUNITY-CONDUCT-01
