  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Online communication and community conduct; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use asynchronous text, accessible formatting, translation with care or a trusted moderator. Do not
      require disclosure of identity or personal vulnerability to participate. Threats, stalking or intimate-image
      abuse need the relevant platform and specialist safety routes rather than ordinary debate techniques.
    cultural_context:
    - Adapt the expression of Online communication and community conduct to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use asynchronous text, accessible formatting, translation with care or a trusted moderator. Do not
      require disclosure of identity or personal vulnerability to participate. Threats, stalking or intimate-image
      abuse need the relevant platform and specialist safety routes rather than ordinary debate techniques.
  pause_conditions:
  - Pause Online communication and community conduct when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Online communication and community conduct practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Online communication and community conduct situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
