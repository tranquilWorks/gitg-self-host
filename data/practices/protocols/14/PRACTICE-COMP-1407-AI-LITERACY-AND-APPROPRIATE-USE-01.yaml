      - [Causes and prevention: overview](https://www.hse.gov.uk/slips/preventing-overview.htm)

      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Compare with your saved version; alternative wording is acceptable if all facts and limits
      remain.


      “Cedar Club welcomes new and returning members on Tuesday at 18:00 in Room B, Cedar Hall. Attendance
      is free. New members should bring a notebook. For questions about access arrangements, contact the
      organizer through the club''s existing contact route.”


      This example has 39 whitespace-delimited words. It promises no equipment and cites no nonexistent
      report. It does not say an AI service was used, because the default exercise uses an authored sample.


      Fictional effort log: manual drafting took six minutes and a source check took two. An assisted
      attempt took one minute to request, one to receive/read, five to audit and four to correct and review.
      Manual total: eight minutes. Assisted total: eleven minutes. The assisted route took three more
      minutes for these attempts. Different authors, tasks and tools could produce other results; this
      is not a benchmark.


      A second proposed notice restores Tuesday and free attendance but says “accessible equipment provided
      on request.” That remains unsupported. An organizer''s later acknowledgment that they received an
      access question would still not confirm the requested arrangement.


      Decide whether to use assistance for this task and give a reason tied to the observed correction
      burden. No publication, actual service use or human reviewer acceptance has occurred merely because
      you read this packet.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### The useful draft still needs an accountable reader


      Generative models learn patterns from data and generate content conditioned on inputs. That can
      help with wording, summarizing and exploring alternatives, but plausible output is not a guarantee
      that a claim was retrieved or checked. A model may confidently add a fact, misread a constraint
      or invent a citation. Tools that retrieve sources still need checks that those sources support the
      specific statements made.


      Allow 35 minutes with the fictional source and sample draft below. You need no AI account, subscription
      or upload. The sample is deliberately authored for this exercise; it is not an observed output from
      a named model. Your job is to define an acceptable task, audit claims and framing, and decide whether
      assistance was worth using.


      [NIST''s generative-AI risk profile](https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf) discusses
      confabulation, privacy, harmful bias and human oversight. Those are possible risk categories, not
      a finding that any particular error here was caused by a particular training source. This exercise
      cannot establish a model''s general accuracy or fairness.


      ### Task boundaries make verification possible


      “Make this sound inviting” leaves room for invented offers. A better boundary identifies the audience,
      authorized facts, permitted transformation and accountable reviewer. For a short notice, facts should
      remain fixed while wording can change. When the source is silent, ask the owner or leave the claim
      out.


      Worked example: a source says “registration opens Monday.” A draft says “places are guaranteed for
      everyone who registers Monday.” The day is supported; the guarantee is an addition. Asking the model
      “are you sure?” creates another generated statement, not independent evidence. Inspect the actual
      source or ask the responsible organizer.


      Automation increases the consequence of an error by passing it to another step. An unverified notice
      sent automatically to hundreds of people is harder to correct than a private draft. Set a human
      release point before distribution. For medical, legal, financial or safety decisions, a small drafting
      success provides no authority to automate the decision or replace qualified judgment.


      ### Complete source packet


      The fictional Cedar Club organizer supplies these authoritative facts for this exercise:


      | Fact | Approved content |

      | --- | --- |

      | Day and time | Tuesday at 18:00 local time |

      | Place | Room B, Cedar Hall |

      | Cost | Attendance is free |

      | Preparation | New members should bring a notebook |

      | Accessibility | Arrangements have not yet been confirmed; questions may be sent to the organizer
      through the club''s existing contact route |

      | Audience | New and returning members; no age or occupation restriction is stated |


      The authorized task is a notice of no more than 70 words. No external facts are needed. The club''s
      invented publication rule requires a human to approve the final wording and requires disclosure
      if a real AI tool assisted drafting. The offline sample is a training exercise, so you must not
      claim actual tool use.


      **Sample unverified draft:** “Young professionals: join Cedar Club on Thursday at 18:00 in Room
      B, Cedar Hall. A ten-dollar fee includes a notebook. Our fully accessible venue guarantees suitable
      equipment for everyone. The club welcomes new members. These details were verified in the Cedar
      Access Report 2026.” No such report is supplied.


      #### Action 1 — Specify the permitted work


      Write a four-line brief: audience, fixed facts, permitted wording changes and human release point.
      Add an input rule: only this fictional packet. If using a real service later, inspect current data-use
      settings and organizational rules before providing material; “I have access to it” does not mean
      “I may upload it.” Do not use private membership lists, accommodation details or workplace records
      here.


      State what the system may do when it cannot answer: identify the missing fact and return it to the
      human. This is a workflow rule you will enforce, not a guarantee that a prompt prevents errors.


      #### Action 2 — Audit claims and framing separately


      Mark each factual unit **supported**, **contradicted**, or **unsupported**. A contradiction conflicts
      with an explicit fact; unsupported means the packet does not settle it. The day and fee conflict
      with the packet. Included notebooks, universal accessibility and the supposed report lack support.
      The time, room, hall and welcome to new members have source support. Split sentences that mix categories.


      Then inspect the audience framing. “Young professionals” unnecessarily narrows an audience for which
      neither youth nor occupation is a requirement. This matters even if the logistical facts are repaired.
      Conversely, you cannot cure exclusion by promising unconfirmed accommodations. Preserve the request
      to bring a notebook and direct access questions to the organizer without claiming equipment will
      be supplied.


      Record why the citation cannot verify itself: its existence and contents have not been established.
      For a real citation, open the actual record and inspect the relevant passage. A real-looking title
      or link is not enough.


      #### Action 3 — Correct, compare and decide


      Write the notice within 70 words, preserving Tuesday, 18:00, Room B/Cedar Hall, free attendance
      and the notebook request. Remove the unsupported guarantees and invented report. Include the existing
      contact route for access questions if space permits. Review the output as the accountable publisher,
      then save it before opening [the later packet](?resource=file-later-packet-md).


      Use the packet''s effort records to compare manual drafting with assisted drafting **including verification
      and correction**. The faster initial draft is not necessarily the faster usable result. Either accept
      a reviewed draft, revise the workflow or choose manual drafting for this small task. The decision
      should follow this use case, not a blanket opinion about AI.


      Complete [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). Retain
      the brief, claim audit, corrected notice and use/reject decision. Do not publish anything as part
      of the default exercise.


      ### Adaptations and transfer


      Use speech-to-text, a screen reader or a trusted reader with the same fictional facts. A supported
      route audits the six source rows one at a time. A harder route adds a conflicting second source:
      preserve both versions and ask which controls publication rather than silently blending them. Neither
      majority vote among model outputs nor repeated confident assurances resolves authority.


      For real transfer, choose an authorized, low-stakes paragraph with a short inspectable source. Record
      actual tool involvement, check every factual addition and follow the setting''s disclosure rule.
      Keep sensitive input out. If checking takes more effort than writing, use the manual route. A future
      tool or model update requires renewed evaluation of the actual task and policies.


      **Supportive:** Facts and framing are reviewed before human release. **Mixed:** Facts are corrected
      but an access promise remains unsupported. **Contradictory:** The model''s assurance is treated
      as evidence or publication is automated without review. **Inconclusive:** Risks are listed without
      auditing the draft or making a use decision.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. Source: “Applications close Friday; places are limited.” Draft: “Everyone who applies Friday
      gets a place.” Classify the deadline and guarantee separately, then repair the sentence.

      2. A generated citation resolves to a real report, but the cited page discusses another town. What
      has been verified, and what remains unsupported?

      3. An assisted draft takes two minutes plus nine minutes checking/correction; manual drafting and
      review take seven. It also includes a private attendee list in its prompt. Decide whether to use
      this workflow and whether a disclosure note cures the input problem.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Friday is the stated deadline, not an allocation guarantee. Limited places leave the guarantee
      unsupported and potentially misleading; they do not specify an exact allocation rule. Repair: “Applications
      close Friday; places are limited.” If you called the guarantee a settled fact, separate timing from
      entitlement.

      2. The report exists. Support for the particular town-level claim is still absent. Check the relevant
      primary record or omit/suspend the claim; neither a real URL nor the model''s confidence verifies
      the proposition.

      3. Eleven minutes versus seven makes this attempt four minutes slower. More seriously, the private
      list requires authority and policy review before input; disclosure afterward does not grant permission
      retroactively. Use the authorized fictional/minimized manual route here, and follow the organization''s
      incident process if real protected input was exposed. Do not claim this one example proves all AI
      drafting inefficient.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
