  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      AI literacy and appropriate use; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use the supplied fictional draft entirely offline, an accessible editor or a trusted reader. This
      demonstrates output auditing even without an AI account. Do not upload classmates’, clients’ or
      employers’ information or test bias by generating degrading content.
    cultural_context:
    - Adapt the expression of AI literacy and appropriate use to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use the supplied fictional draft entirely offline, an accessible editor or a trusted reader. This
      demonstrates output auditing even without an AI account. Do not upload classmates’, clients’ or
      employers’ information or test bias by generating degrading content.
  pause_conditions:
  - Pause AI literacy and appropriate use when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the AI literacy and appropriate use practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a AI literacy and appropriate use situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
