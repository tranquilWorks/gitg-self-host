    multipliers.
  recency_rule: Generated AI literacy and appropriate use rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Set the task boundary and protect the input. Observed checks: The permitted
    transformation and factual boundary are explicit; Plausible generation is distinguished from verified
    retrieval; Only authorized non-sensitive input is used; Human responsibility and any required disclosure
