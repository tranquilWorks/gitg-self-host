  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for AI literacy and appropriate use explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen AI literacy and appropriate use context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each AI literacy and appropriate use observation requires a distinct immutable origin;
