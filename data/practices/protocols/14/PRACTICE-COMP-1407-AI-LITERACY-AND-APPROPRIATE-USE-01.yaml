meaning_and_fit:
  purpose: Treat generative output as a draft with uncertainty, verify its claims against a source, protect
    private data and retain human responsibility for use.
  why_recommended: Treat generative output as a draft with uncertainty, verify its claims against a source,
    protect private data and retain human responsibility for use.
  claims:
  - statement: Treat generative output as a draft with uncertainty, verify its claims against a source,
      protect private data and retain human responsibility for use.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded AI literacy and appropriate use practice fit the person's
    current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record AI literacy and appropriate use as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use the supplied fictional draft entirely offline, an accessible editor or
    a trusted reader. This demonstrates output auditing even without an AI account. Do not upload classmates’,
    clients’ or employers’ information or test bias by generating degrading content.
  opportunity_considerations: 'Source card: The fictional Cedar Club meets Tuesday at 6 p.m. in Room B.
    Attendance is free. New members should bring a notebook. Sample unverified draft: Join Cedar Club
    on Thursday at 6 p.m. in Room B; a ten-dollar fee includes a notebook. Use this sample without claiming
    a real model generated it, or ask an authorized AI tool to rewrite the source without adding facts.'
  prerequisites:
  - 'Source card: The fictional Cedar Club meets Tuesday at 6 p.m. in Room B. Attendance is free. New
    members should bring a notebook. Sample unverified draft: Join Cedar Club on Thursday at 6 p.m. in
    Room B; a ten-dollar fee includes a notebook. Use this sample without claiming a real model generated
    it, or ask an authorized AI tool to rewrite the source without adding facts.'
  dependencies: []
  safe_alternatives:
  - Use the supplied fictional draft entirely offline, an accessible editor or a trusted reader. This
    demonstrates output auditing even without an AI account. Do not upload classmates’, clients’ or employers’
    information or test bias by generating degrading content.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    AI literacy and appropriate use differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about AI literacy and appropriate
    use as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Source card: The fictional Cedar Club meets Tuesday at 6 p.m. in Room B. Attendance is free.
    New members should bring a notebook. Sample unverified draft: Join Cedar Club on Thursday at 6 p.m.
    in Room B; a ten-dollar fee includes a notebook. Use this sample without claiming a real model generated
    it, or ask an authorized AI tool to rewrite the source without adding facts. Goal: Treat generative
    output as a draft with uncertainty, verify its claims against a source, protect private data and retain
    human responsibility for use. Scope: This tests one low-stakes drafting workflow, not a model’s general
    reliability, fairness or suitability for medical, legal, financial or safety decisions. No paid AI
    service or personal data is required. Time and effort: Twenty minutes using the supplied source and
    sample draft, or one authorized low-stakes AI interaction. Adaptation: Use the supplied fictional
    draft entirely offline, an accessible editor or a trusted reader. This demonstrates output auditing
    even without an AI account. Do not upload classmates’, clients’ or employers’ information or test
    bias by generating degrading content. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use the supplied fictional draft entirely offline, an accessible editor or a trusted
    reader. This demonstrates output auditing even without an AI account. Do not upload classmates’, clients’
    or employers’ information or test bias by generating degrading content.
  expected_burden: Twenty minutes using the supplied source and sample draft, or one authorized low-stakes
    AI interaction.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the AI literacy and appropriate use protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed AI literacy and appropriate use action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use the supplied
    fictional draft entirely offline, an accessible editor or a trusted reader. This demonstrates output
    auditing even without an AI account. Do not upload classmates’, clients’ or employers’ information
    or test bias by generating degrading content.
  actions:
  - stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01-A1
    sequence: 1
    title: Set the task boundary and protect the input
    instructions: 'State the intended audience and permitted transformation: clearer wording of the three
      source facts, no added dates, fees or promises. Explain that a generative model produces plausible
      content and may invent details; fluency is not verification. Use only the fictional source, check
      the tool’s current data-use policy if using one, and exclude private or protected material. Identify
      a human who remains responsible for publication.


      Observation checks: The permitted transformation and factual boundary are explicit; Plausible generation
      is distinguished from verified retrieval; Only authorized non-sensitive input is used; Human responsibility
      and any required disclosure are identified. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01
      action_stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01-A1
      competency_stable_id: '14.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1407_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1407_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_permitted_transformation_and_factual_boundary_are_explicit
        - plausible_generation_is_distinguished_from_verified_retrieval
        - only_authorized_non_sensitive_input_is_used
        - human_responsibility_and_any_required_disclosure_are_identified
      - measurement_id: c1407_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1407_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01-A2
    sequence: 2
    title: Audit every factual claim and one framing choice
    instructions: 'Compare the draft sentence by sentence with the source card. Mark supported, contradicted
      or unsupported claims; in the sample, Thursday contradicts Tuesday and the fee and included notebook
      are unsupported or contradictory. Check whether the wording excludes an audience through unnecessary
      assumptions, such as every attendee can write by hand. Do not accept invented citations or the model’s
      own assurance as independent evidence.


      Observation checks: Every factual claim is checked against the source; Contradicted and unsupported
      additions are specifically identified; One audience or bias-related framing assumption is examined;
      Model confidence or invented citations are not used as verification. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01
      action_stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01-A2
      competency_stable_id: '14.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1407_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1407_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - every_factual_claim_is_checked_against_the_source
        - contradicted_and_unsupported_additions_are_specifically_identified
        - one_audience_or_bias_related_framing_assumption_is_examined
        - model_confidence_or_invented_citations_are_not_used_as_verification
      - measurement_id: c1407_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1407_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01-A3
    sequence: 3
    title: Produce a corrected draft and decide whether to use it
    instructions: 'Rewrite the notice with the verified day, time, room, free attendance and request to
      bring a notebook, allowing an accessible note-taking alternative without claiming the club supplies
      one. Label AI assistance where the setting requires it and preserve a human review note. Compare
      the time saved with correction effort; choose manual drafting when verification costs exceed the
      benefit. Do not automate publication or a consequential decision from this test.


      Observation checks: The final draft preserves all source facts and removes inventions; An accessibility
      suggestion is not turned into an unverified promise; Disclosure and human review match the setting’s
      requirements; Use or rejection considers verification effort and consequence. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which error would have reached the audience without your source check, and was AI
      assistance actually worth the verification effort?


      Examples: Supportive: The wrong day and invented fee were removed before sharing, and the writer
      retained responsibility for the final notice.


      Mixed: The factual errors were corrected, but an accessibility accommodation was accidentally promised
      without confirmation.


      Contradictory: A fluent draft or fabricated citation was published without verification or private
      data was uploaded without authority.


      Inconclusive: AI risks were described abstractly without checking a draft or making a real use-versus-reject
      decision.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01
      action_stable_id: PRACTICE-COMP-1407-AI-LITERACY-AND-APPROPRIATE-USE-01-A3
      competency_stable_id: '14.07'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
