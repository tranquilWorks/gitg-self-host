  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Digital creation, ownership, and attribution; no purchase, subscription, travel, credential, or
      public artifact is required.
    accessibility:
    - Use entirely self-created text and shapes when rights are unclear, and accessible alt text where
      appropriate. Ask a qualified legal or institutional adviser for consequential uncertainty. No purchase
      or public upload is required, and collaborators’ work is not yours to license without authority.
    cultural_context:
    - Adapt the expression of Digital creation, ownership, and attribution to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use entirely self-created text and shapes when rights are unclear, and accessible alt text where
      appropriate. Ask a qualified legal or institutional adviser for consequential uncertainty. No purchase
      or public upload is required, and collaborators’ work is not yours to license without authority.
  pause_conditions:
  - Pause Digital creation, ownership, and attribution when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Digital creation, ownership, and attribution practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Digital creation, ownership, and attribution situation exceeds a
    voluntary low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
