meaning_and_fit:
  purpose: Distinguish creating, owning, licensing and attributing digital material, then assemble a small
    work whose reuse permissions and creator credit can be inspected.
  why_recommended: Distinguish creating, owning, licensing and attributing digital material, then assemble
    a small work whose reuse permissions and creator credit can be inspected.
  claims:
  - statement: Distinguish creating, owning, licensing and attributing digital material, then assemble
      a small work whose reuse permissions and creator credit can be inspected.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Digital creation, ownership, and attribution practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Digital creation, ownership, and attribution as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use entirely self-created text and shapes when rights are unclear, and accessible
    alt text where appropriate. Ask a qualified legal or institutional adviser for consequential uncertainty.
    No purchase or public upload is required, and collaborators’ work is not yours to license without
    authority.
  opportunity_considerations: 'Default work: a one-page hobby-event notice using your own text and either
    your own simple drawing or a clearly licensed image from its original source. Keep a record of creator,
    source, exact license version, permitted use, changes and required credit. Publishing is optional;
    do not use private faces, logos, copyrighted music or unclear scraped assets merely for practice.'
  prerequisites:
  - 'Default work: a one-page hobby-event notice using your own text and either your own simple drawing
    or a clearly licensed image from its original source. Keep a record of creator, source, exact license
    version, permitted use, changes and required credit. Publishing is optional; do not use private faces,
    logos, copyrighted music or unclear scraped assets merely for practice.'
  dependencies: []
  safe_alternatives:
  - Use entirely self-created text and shapes when rights are unclear, and accessible alt text where appropriate.
    Ask a qualified legal or institutional adviser for consequential uncertainty. No purchase or public
    upload is required, and collaborators’ work is not yours to license without authority.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Digital creation, ownership, and attribution differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Digital creation, ownership,
    and attribution as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default work: a one-page hobby-event notice using your own text and either your own simple drawing
    or a clearly licensed image from its original source. Keep a record of creator, source, exact license
    version, permitted use, changes and required credit. Publishing is optional; do not use private faces,
    logos, copyrighted music or unclear scraped assets merely for practice. Goal: Distinguish creating,
    owning, licensing and attributing digital material, then assemble a small work whose reuse permissions
    and creator credit can be inspected. Scope: This is rights literacy and a conservative permission
    exercise, not legal advice or a ruling on fair use, employment ownership, AI copyright or every jurisdiction’s
    law. Attribution alone does not supply permission. Time and effort: Twenty-five minutes to prepare
    a private one-page draft and its rights record. Adaptation: Use entirely self-created text and shapes
    when rights are unclear, and accessible alt text where appropriate. Ask a qualified legal or institutional
    adviser for consequential uncertainty. No purchase or public upload is required, and collaborators’
    work is not yours to license without authority. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use entirely self-created text and shapes when rights are unclear, and accessible
    alt text where appropriate. Ask a qualified legal or institutional adviser for consequential uncertainty.
    No purchase or public upload is required, and collaborators’ work is not yours to license without
    authority.
  expected_burden: Twenty-five minutes to prepare a private one-page draft and its rights record.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Digital creation, ownership, and attribution protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Digital creation, ownership, and attribution action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use entirely
    self-created text and shapes when rights are unclear, and accessible alt text where appropriate. Ask
    a qualified legal or institutional adviser for consequential uncertainty. No purchase or public upload
    is required, and collaborators’ work is not yours to license without authority.
  actions:
  - stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01-A1
    sequence: 1
    title: Establish what you own and what you are only allowed to use
    instructions: 'List every ingredient in the notice: text, image, font or template if relevant. Mark
      created by you, permission verified or unresolved. Check whether employment, collaboration, identifiable
      people or third-party rights affect your authority. For a licensed asset, read the exact license
      and distinguish attribution, commercial-use, adaptation and share-alike conditions. An image appearing
      in search results is not a permission grant.


      Observation checks: Every ingredient has an ownership or permission disposition; Third-party employment
      collaboration and identity issues are considered; The exact license version and relevant conditions
      are checked; Search availability and attribution are not mistaken for permission. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01
      action_stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01-A1
      competency_stable_id: '14.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1411_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1411_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - every_ingredient_has_an_ownership_or_permission_disposition
        - third_party_employment_collaboration_and_identity_issues_are_considered
        - the_exact_license_version_and_relevant_conditions_are_checked
        - search_availability_and_attribution_are_not_mistaken_for_permission
      - measurement_id: c1411_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1411_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01-A2
    sequence: 2
    title: Assemble the draft and make its credit inspectable
    instructions: 'Use only ingredients with a suitable permission basis, replacing unresolved material
      with your own simple alternative. Add a credit that identifies the creator, source, license and
      any changes in a reasonable location. Keep required notices and do not imply endorsement. For software
      rather than an image, use the project’s actual license and contribution rules; do not assume a Creative
      Commons image rule covers code.


      Observation checks: Only suitable authorized ingredients enter the draft; Credit includes creator
      source license and changes as required; Required notices remain and endorsement is not implied;
      Software and non-software licensing are not conflated. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01
      action_stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01-A2
      competency_stable_id: '14.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1411_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1411_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - only_suitable_authorized_ingredients_enter_the_draft
        - credit_includes_creator_source_license_and_changes_as_required
        - required_notices_remain_and_endorsement_is_not_implied
        - software_and_non_software_licensing_are_not_conflated
      - measurement_id: c1411_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1411_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01-A3
    sequence: 3
    title: Review distribution and compensation before sharing
    instructions: 'Check the intended audience, commercial context, adaptation terms and any creator request
      or agreed payment. Confirm that the final format preserves credit and does not add restrictions
      incompatible with the license. Keep the permission record privately. Publish only through an authorized
      channel after this review, or retain the draft as a completed rights-preparation exercise; do not
      claim public distribution occurred when it did not.


      Observation checks: The intended distribution fits the verified terms; Creator compensation or permission
      agreements are respected; The final format retains required credit and notices; Private preparation
      and actual publication are distinguished. Mark only what you observed. Missing, mixed and negative
      results are valid; a deferred action is not completed.


      Final review: Could a later reader trace each reused ingredient to a permission basis and credit
      without relying on your memory?


      Examples: Supportive: The notice used an appropriately licensed image with source, license and change
      credit, and the private record preserved the terms.


      Mixed: The draft was ready, but a noncommercial restriction conflicted with the planned use and
      the image had to be replaced.


      Contradictory: A creator’s name was added while permission was absent or a license condition was
      ignored.


      Inconclusive: A list of copyright concepts was produced without checking any actual ingredient or
      credit line.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01
      action_stable_id: PRACTICE-COMP-1411-DIGITAL-CREATION-OWNERSHIP-AND-ATTRIBUTION-01-A3
      competency_stable_id: '14.11'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
