  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Digital creation, ownership, and attribution explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Digital creation, ownership, and attribution
