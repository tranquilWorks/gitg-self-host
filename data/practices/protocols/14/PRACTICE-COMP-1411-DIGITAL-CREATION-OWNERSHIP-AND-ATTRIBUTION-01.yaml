      - [Make a Plan](https://www.redcross.org/get-help/how-to-prepare-for-emergencies/make-a-plan.html)

      - [Causes and prevention: overview](https://www.hse.gov.uk/slips/preventing-overview.htm)

      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'The company''s proposed upload terms now say, “All included artwork is exclusively ours; recipients
      may not reuse it.” That statement cannot accurately describe the A motif under its CC BY 4.0 grant.
      Separate claims about the company''s own contributions from rights in the reused motif and do not
      impose restrictions that prevent exercise of its licensed rights. If the channel cannot accommodate
      those terms, choose a suitable alternative or another channel.


      A preview also crops away the credit line. The internal ledger survives, but the public-format credit
      no longer accompanies the work. Repair the layout or provide a reasonable accessible attribution
      route appropriate to the medium before distribution.


      The company asks to add E''s attendee names “because we paid for the event database.” Payment and
      access do not supply the missing publication authority. Exclude those personal records.


      Sol''s voluntary support request remains optional under the supplied B offer. Paying a voluntary
      contribution would not remove B''s NonCommercial condition. A separate suitable permission grant
      would be needed for this stipulated commercial use. No payment or new grant has occurred.


      Final case status: private draft prepared; distribution review found defects; actual permission
      contact, publication and creator payment not performed. If you used only F, review your own draft
      for the same data/credit claims rather than adding an unnecessary fictional third-party license.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### A credit line answers only one of the questions


      Before reusing digital work, distinguish who created it, who controls relevant rights, what permission
      covers your use, what credit is required and what compensation was agreed. Naming a creator does
      not itself grant permission. Purchasing a copy does not automatically transfer copyright. Permission
      also does not make presenting another person''s expression as your own good attribution practice.


      Allow 40 minutes to prepare a private fictional event notice and its rights record. No purchase,
      external image search or public distribution is required. Use paper or a plain-text editor. The
      asset offers below are invented training facts, not licenses to actual third-party works. Your output
      demonstrates permission reasoning; actual publication would require verification of actual ingredients
      and authority.


      ### Read the permission for the intended use


      Copyright protects qualifying expression under the applicable law; ownership can differ from authorship,
      including some employment arrangements. The [US Copyright Office''s overview](https://www.copyright.gov/what-is-copyright/)
      provides a US introduction, not a ruling about every jurisdiction or this user''s work. Data can
      involve privacy, contracts and database rights as well as copyright. Possessing a spreadsheet does
      not settle authority to publish its personal records.


      [CC BY 4.0''s legal code](https://creativecommons.org/licenses/by/4.0/legalcode) permits sharing
      and adaptation subject to its conditions, including retaining supplied attribution/notices, linking
      the license and indicating changes. It does not license every possible personality or trademark
      right or imply endorsement. Other CC variants add conditions such as NonCommercial, NoDerivatives
      or ShareAlike; inspect the exact version. A deed is a summary; consult the legal terms when the
      use is consequential or uncertain.


      Software has its own licenses and project contribution rules. For example, [MIT](https://opensource.org/license/mit)
      requires retention of its copyright and permission notice in copies or substantial portions. A CC
      image credit does not satisfy a code license. A repository without a clear license is not permission
      to reuse its code just because it is public.


      Worked example: a commissioned photo costs 40 units and the agreement allows one print flyer. Uploading
      it to a public merchandise store is a different use. Payment fulfilled one obligation; it did not
      silently expand the permission. Ask for additional permission or replace the image.


      ### Complete fictional publishing brief


      Create a private draft for a commercial company''s paid craft workshop: “Paper Shapes Workshop —
      June 20, 14:00 — East Studio — ticket 12 units.” The intended real-world analogue would promote
      the company''s paid service. For this exercise the use is explicitly **primarily commercial**, and
      the company wants a blue recoloring of any reused motif. All offers below come from their purported
      creators, whose authority is stipulated only inside this fictional case.


      | Ingredient | Supplied offer / information |

      | --- | --- |

      | A: “Two Squares,” creator Mira | Original motif described completely: two equal outlined squares
      side by side. Creator page record A, dated June 1, supplies CC BY 4.0, copyright “Mira, 2026,” source
      record A and no other notices. Recoloring and commercial use fit the stated license if its conditions
      are met. No people, logos or third-party content are included. |

      | B: “Leaf Window,” creator Sol | CC BY-NC 4.0; no separate commercial permission. Sol requests
      voluntary support but requires no payment under this offer. |

      | C: “Folded Fan,” creator Lee | CC BY-ND 4.0. The proposed redesign changes the creative drawing,
      not just file format. No separate permission to share that adaptation. |

      | D: “Bright Star” | Found in a repost with “credit to owner”; actual creator and permission unknown.
      |

      | E: collaborator''s attendee spreadsheet | Includes names and contact details; collaborator authorized
      event administration only. No publication or upload permission is supplied. |

      | F: your new text and a simple shape you draw yourself | No copied expression, employment claim
      or collaborator contribution is stipulated in this case. Keep it separate from actual works whose
      ownership you have not checked. |


      A complete fictional source record is enough for the exercise, but “record A” would be replaced
      by the actual original-source link and preserved terms for real reuse. Do not fabricate an internet
      URL or imply that Mira is a real rights holder you contacted.


      #### Action 1 — Make an ingredient ledger


      For A–F record `creator/owner | permission basis | planned use/change | conditions | include/replace/hold
      | payment status`. A is suitable within the stipulated case; B lacks permission for the stipulated
      commercial use; C cannot be publicly shared as the planned creative adaptation under the supplied
      grant; D remains unresolved; E stays private; F is the self-created alternative.


      Do not broaden those decisions into “all charging is commercial” or “all file changes are adaptations.”
      Those questions can require legal interpretation. The case deliberately supplies the relevant facts.
      Likewise, ShareAlike conditions concern relevant licensed adaptations; do not assume every separate
      work placed beside an image inherits its license.


      #### Action 2 — Assemble a traceable private draft


      Write the event facts and draw the two-square motif as a representation of A, or use your own new
      shape under F. If using the A scenario, add: “Two Squares — Mira, 2026, source record A; CC BY 4.0;
      recolored blue.” Include the actual [license link](https://creativecommons.org/licenses/by/4.0/)
      in the draft record, retain supplied notices and avoid claiming endorsement. Label the whole artifact
      **fictional rights exercise — private draft**.


      For F, record exactly which elements you created; do not claim ownership of E''s data or copied
      material. Plain-text layout avoids needing an external template, decorative font asset or photograph.
      If you add an ingredient, add its permission basis before using it. Keep an accessible text description
      of the visual.


      #### Action 3 — Review distribution and compensation


      Inspect the final credit in the format a recipient would see. A credit hidden in an inaccessible
      internal note would not reliably accompany the work. Check the intended audience, permitted changes,
      required notices and any actual payment agreement. Voluntary support, required license fee and assignment
      of rights are different arrangements.


      Save your draft and ledger before reading [the later packet](?resource=file-later-packet-md). Revise
      for the proposed distribution change and missing credit. A file prepared privately is not proof
      of public publication or full legal clearance. For real uncertainty, use a self-created replacement
      or appropriate legal/institutional advice rather than inventing an exception.


      Attempt [fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers). The
      output should let someone trace every included element without relying on your memory.


      ### Adapt and transfer


      Use a text-only notice or your own geometric shapes when rights are unclear. A trusted reader can
      inspect the permission ledger. Harder route: adapt a CC BY-SA work and distribute the adaptation;
      identify the applicable version and compatible terms before assuming your preferred exclusive license
      fits. Do not infer a rule for code from this image example.


      For real transfer, inspect one actual ingredient in a small work you are authorized to prepare.
      Retain the original source, date, exact terms, changes, credit and payment agreement. Check third-party/personality
      rights and the platform''s distribution requirements. Publish only through an authorized channel;
      this practice does not require publication.


      **Supportive:** Every included ingredient has suitable permission and inspectable credit. **Mixed:**
      A credit is correct but the planned use requires a replacement or further grant. **Contradictory:**
      Attribution is substituted for permission or private data is published as “owned.” **Inconclusive:**
      Concepts are listed without reviewing the actual draft ingredients.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A commercial advertisement uses a BY-NC image and includes impeccable credit. Does the credit
      solve the permission issue? Would a voluntary donation automatically solve it?

      2. A project copies a substantial MIT-licensed code component but keeps only the author''s name
      and removes the copyright/permission notice. What needs repair?

      3. A creator is paid for a single-use flyer image. The buyer wants to upload it to a reusable template
      library. What evidence is needed, and what should happen while it is absent?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. No. Suitable permission for the use and correct credit are separate requirements. A voluntary
      donation does not alter license terms. Obtain a separate applicable grant or use a suitable replacement;
      do not equate payment with ownership.

      2. Restore the required copyright and permission notice with the substantial copied component; preserve
      the applicable license text and disclaimers as required. An author''s name alone is insufficient.
      Review that component''s actual version and any other included licenses rather than applying a generic
      image-credit rule.

      3. An actual grant covering the new distribution/reuse is needed unless another valid legal basis
      applies. The stated single-use agreement does not supply it. Hold the new use or replace the asset
      while clarification is pending. Do not claim a broader grant because the invoice was paid.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
