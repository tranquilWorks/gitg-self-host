meaning_and_fit:
  purpose: Understand how ranking, personalization and feedback can shape attention, then redesign one
    media route around chosen purposes rather than assume the feed is neutral or all-powerful.
  why_recommended: Understand how ranking, personalization and feedback can shape attention, then redesign
    one media route around chosen purposes rather than assume the feed is neutral or all-powerful.
  claims:
  - statement: Understand how ranking, personalization and feedback can shape attention, then redesign
      one media route around chosen purposes rather than assume the feed is neutral or all-powerful.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Algorithmic feeds and persuasive design practice fit
    the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Algorithmic feeds and persuasive design as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use a fictional ten-card feed or a browser without a signed-in profile when
    personal observation is unsuitable. Avoid recording other people’s handles or private posts. A paper
    simulation practices classification and choice, not the behavior of an actual recommender.
  opportunity_considerations: 'Default purpose: find one practical gardening explanation. Observe up to
    ten ordinary recommendations without seeking harmful content. Classify each as directly useful, adjacent,
    unrelated or emotionally provocative, and note the invitation to continue. Read the platform’s current
    official explanation of recommendation signals and user controls; do not assume every system optimizes
    the same metric.'
  prerequisites:
  - 'Default purpose: find one practical gardening explanation. Observe up to ten ordinary recommendations
    without seeking harmful content. Classify each as directly useful, adjacent, unrelated or emotionally
    provocative, and note the invitation to continue. Read the platform’s current official explanation
    of recommendation signals and user controls; do not assume every system optimizes the same metric.'
  dependencies: []
  safe_alternatives:
  - Use a fictional ten-card feed or a browser without a signed-in profile when personal observation is
    unsuitable. Avoid recording other people’s handles or private posts. A paper simulation practices
    classification and choice, not the behavior of an actual recommender.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Algorithmic feeds and persuasive design differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Algorithmic feeds and persuasive
    design as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default purpose: find one practical gardening explanation. Observe up to ten ordinary recommendations
    without seeking harmful content. Classify each as directly useful, adjacent, unrelated or emotionally
    provocative, and note the invitation to continue. Read the platform’s current official explanation
    of recommendation signals and user controls; do not assume every system optimizes the same metric.
    Goal: Understand how ranking, personalization and feedback can shape attention, then redesign one
    media route around chosen purposes rather than assume the feed is neutral or all-powerful. Scope:
    A small feed sample cannot reveal a platform’s proprietary model, prove a filter bubble or establish
    intentional manipulation. Platform explanations describe their systems and are not independent effectiveness
    audits. Time and effort: Fifteen minutes of observation and two brief purposeful sessions. Adaptation:
    Use a fictional ten-card feed or a browser without a signed-in profile when personal observation is
    unsuitable. Avoid recording other people’s handles or private posts. A paper simulation practices
    classification and choice, not the behavior of an actual recommender. Keep personal working notes
    outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a fictional ten-card feed or a browser without a signed-in profile when personal
    observation is unsuitable. Avoid recording other people’s handles or private posts. A paper simulation
    practices classification and choice, not the behavior of an actual recommender.
  expected_burden: Fifteen minutes of observation and two brief purposeful sessions.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Algorithmic feeds and persuasive design protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Algorithmic feeds and persuasive design action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a fictional
    ten-card feed or a browser without a signed-in profile when personal observation is unsuitable. Avoid
    recording other people’s handles or private posts. A paper simulation practices classification and
    choice, not the behavior of an actual recommender.
  actions:
  - stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01-A1
    sequence: 1
    title: Separate observed feed behavior from claims about the algorithm
    instructions: 'Record the ten-item sample and your intended purpose, then note which items invite
      novelty, repetition or emotional reaction. Compare observations with the official explanation of
      signals such as prior activity, feedback or satisfaction. Distinguish what you saw from a hypothesis
      about engagement optimization or a filter bubble. Intermittently appealing items can encourage continued
      checking, but the sample alone does not establish a psychological mechanism.


      Observation checks: A bounded sample is classified against a stated purpose; Continuation and emotional
      invitations are observed without harmful exposure; Officially described signals are separate from
      inferred motives; Filter-bubble and reward-mechanism claims remain hypotheses. Mark only what you
      observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01
      action_stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01-A1
      competency_stable_id: '14.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1406_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1406_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_bounded_sample_is_classified_against_a_stated_purpose
        - continuation_and_emotional_invitations_are_observed_without_harmful_exposure
        - officially_described_signals_are_separate_from_inferred_motives
        - filter_bubble_and_reward_mechanism_claims_remain_hypotheses
      - measurement_id: c1406_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1406_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01-A2
    sequence: 2
    title: Build a route that reaches the purpose more directly
    instructions: 'Choose one supported change: use a saved source, a direct search, subscriptions or
      an official recommendation-control setting. Include one deliberate source outside the usual cluster
      when it is credible and relevant, rather than equating novelty with truth. Set an endpoint such
      as one usable answer and a source note. Preserve legitimate entertainment as an explicit separate
      choice rather than pretend all browsing must be educational.


      Observation checks: One route or control is changed for a stated purpose; A credible relevant alternative
      reduces dependence on a single cluster; An endpoint is defined before the session; Entertainment
      remains a legitimate chosen activity. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01
      action_stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01-A2
      competency_stable_id: '14.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1406_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1406_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - one_route_or_control_is_changed_for_a_stated_purpose
        - a_credible_relevant_alternative_reduces_dependence_on_a_single_cluster
        - an_endpoint_is_defined_before_the_session
        - entertainment_remains_a_legitimate_chosen_activity
      - measurement_id: c1406_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1406_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01-A3
    sequence: 3
    title: Compare two sessions and keep only useful control
    instructions: 'Use the direct route once and the usual route once on comparable harmless questions.
      Note whether the answer was found, how often attention shifted and whether the stopping point worked.
      Record convenience and discovery benefits as well as distraction. Keep or revise the route without
      claiming the platform has been retrained from two sessions; changes in the feed may have other causes.


      Observation checks: Two routes are tried on comparable harmless purposes; Answer quality attention
      shifts and stopping are observed; Discovery and convenience benefits are retained in the comparison;
      No causal claim about retraining the algorithm is made. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.


      Final review: Which part of the feed served your purpose, and which route gave you a more deliberate
      choice about continuing?


      Examples: Supportive: Direct search found a useful explanation and a second credible source, while
      the usual feed’s unrelated suggestions made stopping harder.


      Mixed: The direct route reduced drift but also missed useful discovery, so the person retained a
      separate bounded exploration session.


      Contradictory: Two recommendations were treated as proof of a platform’s hidden motive or used to
      justify consuming upsetting material for analysis.


      Inconclusive: The algorithm was blamed in general terms without a sample, stated purpose or tested
      alternative route.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01
      action_stable_id: PRACTICE-COMP-1406-ALGORITHMIC-FEEDS-AND-PERSUASIVE-DESIGN-01-A3
      competency_stable_id: '14.06'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
