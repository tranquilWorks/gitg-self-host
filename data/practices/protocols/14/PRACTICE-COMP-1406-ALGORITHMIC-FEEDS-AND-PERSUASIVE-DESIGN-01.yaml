      - [Making an Emergency Plan](https://www.cdc.gov/disability-emergency-preparedness/people-with-disabilities/make-a-plan.html)

      - [Make a Plan](https://www.redcross.org/get-help/how-to-prepare-for-emergencies/make-a-plan.html)

      - [Causes and prevention: overview](https://www.hse.gov.uk/slips/preventing-overview.htm)

      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'All observations are fictional. The usual-route session ran 18:00–18:12. It produced a correct
      D/water, B/wait answer from Garden G only, involved four departures from the question, and continued
      after the answer to see an enjoyable pot-design idea. The second-source endpoint was not met.


      The direct-route session on the next day ran 18:00–18:07. It produced the correct answer with Garden
      G and the independent nursery explanation, involved one departure, and ended at the planned point.
      Its question used a different fictional pot, so the attempts are similar but not identical. It produced
      no unexpected discovery.


      A third scheduled attempt was canceled before starting. There is no duration or answer. There are
      **two observed sessions, 19 total minutes and one fully met endpoint**; the mean observed duration
      is 9.5 minutes. Five fewer minutes in the direct session describes this pair, not a causal time-saving
      estimate.


      You may keep the direct route for narrow questions and preserve a separate chosen discovery session.
      There is no record of StreamGarden''s subsequent rankings or training updates. “The algorithm changed”
      is unsupported.


      Alternative branch: a later direct-source copy contains an obsolete rule, and an official correction
      appears in the feed. The method needs a freshness check. A faster wrong answer is not success. In
      a real case, verify the correction at its original source.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### A ranked feed is an invitation, not your agenda


      A recommender selects and orders candidates using signals and objectives. Personalization can help
      you discover relevant material, but a prediction that you will engage does not necessarily match
      what you intended to accomplish. Ranking, autoplay and a bottomless list also make continuing easy.
      The practical question is which route serves your purpose and leaves room for a deliberate stop.


      Allow 35 minutes for a ten-card paper analysis and two supplied session audits. Use paper or an
      accessible editor; no account or exposure to upsetting material is needed. The cards and system
      description below are invented. The offline exercise practices reasoning about a feed, not observation
      of a live algorithm. An optional real route comes later.


      ### Separate mechanism, evidence and hypothesis


      An engagement objective might use clicks or viewing duration as signals. A system can also consider
      satisfaction, quality, subscriptions or explicit feedback. [YouTube''s own explanation](https://support.google.com/youtube/answer/16089387?hl=en)
      describes several signals, including surveys; it does not justify saying that every feed simply
      maximizes outrage or watch time. A provider''s description is evidence of what it says, not an independent
      audit of outcomes.


      A filter bubble is a concern about narrowed exposure through selection and feedback. Ten similar
      items can suggest a cluster worth examining, but cannot establish your whole information environment
      or its cause. Your subscriptions, available content and recent topic choice may contribute. Variable
      reward means that a rewarding result is not obtained predictably on every attempt. Intermittently
      appealing items can invite another check, but that is a hypothesis to examine here, not a measured
      mechanism. [Lindström and colleagues](https://www.nature.com/articles/s41467-020-19607-x) studied
      social rewards and posting behavior; their work does not by itself establish the cause of someone’s
      feed scrolling. A short session cannot diagnose addiction. [Bakshy and colleagues’ study](https://solomonmg.github.io/publications/bakshy-2015-exposure/)
      also distinguishes network composition, ranked exposure and user choice in a particular news setting;
      it does not settle filter-bubble effects for every service.


      Worked example: you arrive for a bus timetable, find it in the second item, and continue through
      eight entertaining clips. The clips can be enjoyable while the route misses your chosen endpoint.
      You could retain a separate entertainment session and use a saved timetable link for travel. “Spent
      less time” would still be a poor success measure if the timetable was outdated.


      ### Complete fictional feed


      Purpose: find the **training garden''s rule for checking whether a pot needs water**, obtain a second
      relevant explanation, and stop after writing a two-sentence answer. These are fictional garden rules,
      not horticultural advice.


      The made-up StreamGarden service says it ranks candidates using previous views, follows, completion
      and “useful” feedback. It does not publish weights or user-level explanations. An autoplay switch
      and a search box are available. A route using saved sources does not change these ranking rules.


      | Card | Supplied content | Invitation |

      | --- | --- | --- |

      | F1 | Garden G rule: check the marked indicator; water only when its card reads D | “Read the full
      rule” |

      | F2 | Tour of Garden G''s painted pots; no care rule | “Next tour starts automatically” |

      | F3 | “Everyone else is ruining their garden”; no care instruction | “Join the argument” |

      | F4 | Garden G explanation: D means the case''s agreed watering condition; B means wait | “Save
      this reference” |

      | F5 | Short comedy unrelated to gardening | “Another surprise clip” |

      | F6 | Garden G merchandise; no care rule | “Offer ends tonight” |

      | F7 | Neighborhood nursery''s independent training note: read the supplied indicator before choosing
      D/water or B/wait | “Compare the diagram” |

      | F8 | Celebrity kitchen tour | “Keep watching” |

      | F9 | Garden G''s republished F1 text | “Share the tip” |

      | F10 | Compost collection timetable; no pot-watering rule | “Follow the collection series” |


      Treat F1, F4, F7 and F9 as directly useful; F2, F6 and F10 as adjacent; F3 as provocative without
      useful rule content; F5 and F8 as unrelated. Those labels are relative to this exact purpose, not
      quality ratings. F9 is another occurrence of F1, not another independent explanation. You may disagree
      about a secondary label if you preserve what each card actually supplies.


      #### Action 1 — Audit the invitations


      Make a ten-row table: `card | relevance | source cluster | continuation invitation | observation
      or inference`. Count useful cards and distinct relevant source groups separately. Write one observed
      pattern and one hypothesis that requires more evidence. “Four directly useful cards appear” is observable;
      “the company knows I am vulnerable” is not established by these materials.


      Then write the point at which your purpose could be met. F1/F4 supply Garden G''s rule, and F7 supplies
      another relevant explanation. A novel source with no usable evidence would not satisfy the second-source
      requirement.


      #### Action 2 — Design a purposeful route


      Use saved Garden G instructions plus the nursery note, or a direct search for those supplied sources.
      Write an endpoint before beginning: the two-sentence answer and source note, then a choice to stop
      or consciously start another activity. You may turn off autoplay as an additional control, but identify
      which change you are evaluating. Changing five settings at once makes the comparison less interpretable.


      Record a possible cost: direct retrieval may reduce pleasant discovery. Preserve a bounded discovery
      route if it serves a chosen purpose. The target is usable control, not a rule that entertainment
      must earn its place through productivity.


      #### Action 3 — Examine two sessions


      Save your plan, then open [the later packet](?resource=file-later-packet-md). Compare answer completeness,
      source independence, shifts away from purpose, stopping and discovery benefits. Calculate duration
      only for sessions that occurred. A canceled opportunity is not a zero-minute success; a missing
      stop time gives an unknown duration.


      Make a keep/change decision for this case. Two sessions with different questions and order cannot
      isolate a causal effect of the route. State the smaller conclusion the observations support and
      what another comparable attempt could clarify. Do not claim to have retrained StreamGarden''s model
      by using saved links.


      Attempt [fresh checks](?attempt=practice-checks), then read [the answers](?check=practice-answers).
      Your completed artifact includes the card audit, purpose/endpoint, session comparison and a bounded
      route decision.


      ### Access, challenge and real use


      Read cards aloud or group them on paper. If live feeds cause distress or interfere with functioning,
      keep the fictional route; no harmful exposure is needed. Avoid recording private posts or other
      people''s handles. A companion can help describe controls without taking over your account.


      Harder route: the direct source is stale, while the feed surfaces a genuine correction. Decide how
      your source-checking rule should change without abandoning purposeful access. This tests whether
      the endpoint includes answer quality rather than mere speed.


      For real transfer, choose one harmless question, inspect the platform''s current official controls
      and try a small change during two ordinary opportunities. Note question difficulty, interruptions
      and the actual outcome. Keep the practice small enough to resume the activity you wanted to do.


      **Supportive:** The route reaches a checked answer and chosen stop. **Mixed:** Drift decreases but
      useful discovery or answer quality suffers. **Contradictory:** A tiny sample becomes proof of hidden
      motives or justifies distressing exposure. **Inconclusive:** A setting changes, but the purpose
      and session outcome are not observed.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A feed shows six posts from one outlet and two reposts of its work. What can you observe,
      and what additional evidence would a filter-bubble claim require?

      2. Sessions last eight and six minutes; a third was canceled. Only the six-minute session meets
      its full purpose. Give observed count, total, mean and successful endpoints.

      3. Autoplay is disabled, but the user gets an unchecked answer and repeatedly reopens the feed.
      Is the control successful? Propose one revision without diagnosing the user.'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The sample is concentrated in one source group, with dependent reposts. A broader and repeated
      sample, other routes used and evidence about selection would be needed to assess narrowed exposure
      and its causes. Eight cards are not eight independent perspectives.

      2. Two observed sessions, 14 minutes, mean seven minutes, one met endpoint. Dividing by three incorrectly
      gives an absent opportunity a performed duration. If a stop time were missing instead, preserve
      duration as unknown.

      3. Only the setting change is established. The full purpose and deliberate stop failed. Add a checked-source
      endpoint and a direct route for this question, then observe another ordinary attempt. Avoid claims
      about compulsion, model retraining or universal benefit from this small case.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
