meaning_and_fit:
  purpose: Practice file organization, device maintenance, account hygiene and recovery through a small
    reversible test that proves a copy can actually be opened.
  why_recommended: Practice file organization, device maintenance, account hygiene and recovery through
    a small reversible test that proves a copy can actually be opened.
  claims:
  - statement: Practice file organization, device maintenance, account hygiene and recovery through a
      small reversible test that proves a copy can actually be opened.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Digital competence and data hygiene practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Digital competence and data hygiene as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use a plain-text, audio or accessible document and a trusted helper who does
    not receive passwords. On managed equipment, follow organizational policy and use a training area.
    Without a second destination, label the exercise a file-copy rehearsal and leave disaster recovery
    untested.
  opportunity_considerations: 'Create a new folder named practice-recovery and a new text file containing
    three invented items: blue notebook, spare pencil, meeting at noon. Keep the original. Use an existing
    authorized backup destination or a second local storage location; a second folder on the same device
    tests copying only, not protection from device loss. Never delete real files or reset a device for
    this exercise.'
  prerequisites:
  - 'Create a new folder named practice-recovery and a new text file containing three invented items:
    blue notebook, spare pencil, meeting at noon. Keep the original. Use an existing authorized backup
    destination or a second local storage location; a second folder on the same device tests copying only,
    not protection from device loss. Never delete real files or reset a device for this exercise.'
  dependencies: []
  safe_alternatives:
  - Use a plain-text, audio or accessible document and a trusted helper who does not receive passwords.
    On managed equipment, follow organizational policy and use a training area. Without a second destination,
    label the exercise a file-copy rehearsal and leave disaster recovery untested.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Digital competence and data hygiene differently while preserving consent, evidence limits, safety,
    and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Digital competence and data
    hygiene as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Create a new folder named practice-recovery and a new text file containing three invented items:
    blue notebook, spare pencil, meeting at noon. Keep the original. Use an existing authorized backup
    destination or a second local storage location; a second folder on the same device tests copying only,
    not protection from device loss. Never delete real files or reset a device for this exercise. Goal:
    Practice file organization, device maintenance, account hygiene and recovery through a small reversible
    test that proves a copy can actually be opened. Scope: This is a personal digital-hygiene exercise,
    not a full security audit or disaster-recovery certification. Use only devices and accounts you own
    or are authorized to administer. Time and effort: Twenty-five minutes for a harmless file test and
    ten minutes for one maintenance check. Adaptation: Use a plain-text, audio or accessible document
    and a trusted helper who does not receive passwords. On managed equipment, follow organizational policy
    and use a training area. Without a second destination, label the exercise a file-copy rehearsal and
    leave disaster recovery untested. Keep personal working notes outside the check-in; record only the
    listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use a plain-text, audio or accessible document and a trusted helper who does not
    receive passwords. On managed equipment, follow organizational policy and use a training area. Without
    a second destination, label the exercise a file-copy rehearsal and leave disaster recovery untested.
  expected_burden: Twenty-five minutes for a harmless file test and ten minutes for one maintenance check.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Digital competence and data hygiene protocol to rank worth, coerce participation, demand
    disclosure, override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Digital competence and data hygiene action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use a plain-text,
    audio or accessible document and a trusted helper who does not receive passwords. On managed equipment,
    follow organizational policy and use a training area. Without a second destination, label the exercise
    a file-copy rehearsal and leave disaster recovery untested.
  actions:
  - stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01-A1
    sequence: 1
    title: Map the file and the services it depends on
    instructions: 'Give the test file a clear name and date, then identify where the original, backup
      and account recovery information reside. Note whether both copies depend on the same device, cloud
      login or internet connection. Review one device’s update status, screen lock and unused account
      access using official settings without changing managed policies. Mark an unfamiliar warning for
      qualified help rather than dismiss it.


      Observation checks: The harmless original has a clear name and known location; Original backup and
      access dependencies are distinguished; Same-device or same-account failure limits are recorded;
      One device-maintenance check is completed without bypassing policy. Mark only what you observed.
      Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01
      action_stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01-A1
      competency_stable_id: '14.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1402_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1402_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_harmless_original_has_a_clear_name_and_known_location
        - original_backup_and_access_dependencies_are_distinguished
        - same_device_or_same_account_failure_limits_are_recorded
        - one_device_maintenance_check_is_completed_without_bypassing_policy
      - measurement_id: c1402_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1402_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
