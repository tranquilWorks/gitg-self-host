      - [CDC — Pregnant & Postpartum Activity](https://www.cdc.gov/physical-activity-basics/guidelines/healthy-pregnant-or-postpartum-women.html)

      - [NIAMS — Sports Injuries](https://www.niams.nih.gov/health-topics/sports-injuries)

      - [MedlinePlus — Pain](https://medlineplus.gov/pain.html)

      - [NHS — Back pain](https://www.nhs.uk/conditions/back-pain/)

      - [University Hospitals Sussex — Low back pain A&E leaflet](https://www.uhsussex.nhs.uk/resources/low-back-pain/)

      - [Cleveland Clinic — Referred Pain](https://my.clevelandclinic.org/health/symptoms/25238-referred-pain)

      - [Apple — Allow or silence notifications for a Focus](https://support.apple.com/guide/iphone/allow-or-silence-notifications-for-a-focus-iph21d43af5b/ios)

      - [NCSC — Backing up your data](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/always-back-up-your-most-important-data)

      - [NCSC — Install the latest software and app updates](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/install-the-latest-software-and-app-updates)

      - [NCSC — Managing your passwords](https://www.ncsc.gov.uk/collection/top-tips-for-staying-secure-online/password-managers)

      - [FTC — How Websites and Apps Collect and Use Your Information](https://consumer.ftc.gov/articles/how-websites-and-apps-collect-and-use-your-information)

      - [ICO — Your right to get your data deleted](https://ico.org.uk/for-the-public/your-right-to-get-your-data-deleted/)

      - [FTC — Use Two-Factor Authentication](https://consumer.ftc.gov/articles/use-two-factor-authentication-protect-your-accounts)

      - [NIST SP 800-63B-4](https://pages.nist.gov/800-63-4/sp800-63b.html)

      - [Microsoft — Find your BitLocker recovery key](https://support.microsoft.com/en-us/windows/security/encryption/find-your-bitlocker-recovery-key)'
  - id: file-later-packet-md
    title: Later packet
    body: 'These are separate fictional attempts. Compare them with the required v2 source; do not add
      their files together to manufacture one success.


      | Branch | Tool message | File actually opened |

      | --- | --- | --- |

      | R1 | Copy complete | Community meeting; Room Birch; Bring one pencil |

      | R2 | Copy complete | Community meeting; Room Cedar; Bring one pencil |

      | R3 | Destination full | No file created |

      | R4 | Copy complete | Community meeting; Room Birch |


      A second scenario concerns a fictional sync service with **no retained history**. The current original
      is accidentally deleted and that deletion is propagated to the synced folder. An independent earlier
      backup remains readable but contains v1 only. Identify what can and cannot be recovered. Do not
      perform this deletion in the working area or on real data.'
  - id: file-materials-readme-md
    title: Readme
    body: 'Both files below contain original fictional meeting information, with no personal data or credentials.
      Download or copy them into a new working area using [the guide](?). Keep the source copies and all
      existing files intact.


      - [meeting-v1.txt](?resource=file-materials-meeting-v1-txt): earlier Cedar version.

      - [meeting-v2.txt](?resource=file-materials-meeting-v2-txt): required Birch version.


      Do not use another person''s folder or upload these as part of a real account recovery request.
      A local copy demonstrates only the route actually used.'
