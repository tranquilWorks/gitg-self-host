      Digital competence and data hygiene; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use a plain-text, audio or accessible document and a trusted helper who does not receive passwords.
      On managed equipment, follow organizational policy and use a training area. Without a second destination,
      label the exercise a file-copy rehearsal and leave disaster recovery untested.
    cultural_context:
    - Adapt the expression of Digital competence and data hygiene to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use a plain-text, audio or accessible document and a trusted helper who does not receive passwords.
      On managed equipment, follow organizational policy and use a training area. Without a second destination,
      label the exercise a file-copy rehearsal and leave disaster recovery untested.
  pause_conditions:
  - Pause Digital competence and data hygiene when capacity, consent, authority, privacy, access, care
    duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the
    next action unwise.
  stop_conditions:
  - Stop the Digital competence and data hygiene practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Digital competence and data hygiene situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
