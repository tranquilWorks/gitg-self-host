        expected: true
  - stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01-A2
    sequence: 2
    title: Copy and restore to a new location without overwriting
    instructions: 'Back up the test file using the chosen method, then restore or download it into a different
      new folder. Open the restored file and compare all three lines with the untouched original. If the
      tool reports success but the content is missing, unreadable or older, keep that failure visible.
      Do not overwrite originals, remove existing backups or upload personal documents merely to make
      the test realistic.


      Observation checks: A backup or copy of the harmless file is actually made; Restoration uses a new
      destination with originals preserved; The restored content is opened and compared line by line;
      A failed or incomplete restore is not counted as recovery. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01
      action_stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01-A2
      competency_stable_id: '14.02'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1402_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1402_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - a_backup_or_copy_of_the_harmless_file_is_actually_made
        - restoration_uses_a_new_destination_with_originals_preserved
        - the_restored_content_is_opened_and_compared_line_by_line
        - a_failed_or_incomplete_restore_is_not_counted_as_recovery
      - measurement_id: c1402_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1402_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01-A3
    sequence: 3
    title: Turn the result into a small maintenance routine
    instructions: 'Record the successful recovery steps or the exact non-sensitive failure message, plus
      who or what official help route can resolve it. Choose a sustainable review point for updates, backup
      checks and account access, and one important category of real data that later needs protection.
      Do not move that data until destination privacy, retention and recovery are understood. A tested
      sample is not proof that every file is backed up.


      Observation checks: The recovery procedure or unresolved failure is recorded; A maintenance review
      covers updates backups and access; A real data category is identified without exposing its contents;
      The sample test’s coverage limit remains explicit. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.


      Final review: Could you recover the sample without the original location, and which shared dependency
      would still defeat the plan?


      Examples: Supportive: The three-line file was restored and opened from a separate destination, while
      the shared cloud-login dependency remained documented.


      Mixed: The backup job completed, but the restored file was an older version and the procedure needed
      correction.


      Contradictory: Real originals were deleted or confidential files uploaded to an unverified service
      to test recovery.


      Inconclusive: A backup-success icon was observed without opening and comparing a restored file.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01
      action_stable_id: PRACTICE-COMP-1402-DIGITAL-COMPETENCE-AND-DATA-HYGIENE-01-A3
      competency_stable_id: '14.02'
