  - id: file-later-packet-md
    title: Later packet
    body: 'At 11:00 on May 5, the established library page publishes N2: “Because a water supply fault
      has developed, the whole library will close May 6 only. Reopening on May 7 is planned, subject to
      a further update at 17:00 on May 6. West-door repairs remain scheduled May 6–8.”


      This fictional current record supersedes N''s continued-service statement for May 6. It establishes
      a one-day whole-library closure plan, not permanent closure. Reopening is planned and conditional,
      not observed. W''s earlier visit remains an actual supplied observation on May 5; it cannot refute
      a future closure.


      Update: “The May 5, 11:00 library notice announces whole-library closure on May 6 because of a water
      fault. It plans reopening May 7 subject to a further update. The permanent-closure claim remains
      unsupported by the supplied records. West-entrance repairs still run May 6–8; the cropped image''s
      origin remains unresolved.”


      Alternative branch: N2 is visible only as an unattributed screenshot without a retrievable official
      record. Mark the apparent conflict unresolved and seek confirmation from the established library
      route. Do not present the screenshot as independently verified or assume the earlier notice is still
      current. No actual library search was performed by reading either branch.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Find the record that bears on the exact claim


      Verification starts by making a claim precise enough to check. “The library is closing” could mean
      a doorway, a service, a day or an institution. Ten reposts of the same vague sentence do not clarify
      it. Identify the place, time, extent and asserted permanence before searching for evidence.


      Allow 35 minutes with the fictional record set below. It provides complete text and search-result
      descriptions, so no live browsing is required for the default. Use paper or an accessible notes
      tool. You will produce a source-dependency map, a chronology and a short correction that can survive
      a later conflicting update.


      ### Read outward, then return to the proposition


      Lateral reading means leaving a source''s own presentation to investigate it elsewhere, locate original
      evidence and compare relevant independent accounts. [Brodsky and colleagues'' study](https://link.springer.com/article/10.1186/s41235-021-00291-4)
      examines instruction in these strategies in a particular college setting. It supports the method''s
      research context, not a promise that this exercise makes every reader accurate.


      Source independence concerns how information was obtained, not whether different websites display
      it. A reporter who copies a notice and an aggregator that copies the reporter form one evidence
      chain for the notice''s contents. A direct inspection can be another chain, but its observer may
      have seen only one entrance at one time. Primary records also have scope, dates and possible errors;
      “official” is a reason to inspect closely, not suspend judgment.


      Worked example: three posts say a train line is canceled. Their only source is one alert about the
      09:10 departure on Tuesday. That alert supports the cancellation of that departure. It does not
      establish all-day suspension or permanent line closure. The correction should identify exactly what
      changed, with the alert''s date, rather than calling every post wholly invented.


      ### Complete library records


      It is May 5, 2026. All times are local. The question is: **Will the whole Alder Library close permanently
      from May 6?** Treat the following as invented training records, not events at a real library.


      | Record | Full relevant content and provenance |

      | --- | --- |

      | A, May 4 at 18:00 | A neighborhood post: “Alder Library closes permanently tomorrow. Look at this
      CLOSED sign.” No named witness or document link; image P attached. |

      | B, May 5 at 08:00 | Community roundup: “Alder is closing permanently,” linking only to A. |

      | C, May 5 at 08:15 | Another feed item: “Confirmed by local roundup,” linking only to B. |

      | N, published May 3 at 12:00 | Library notice: “West entrance closed May 6–8 for repairs. East
      entrance remains open during ordinary opening hours. Library services continue.” The established
      library notice page is its original location. |

      | P | Cropped photo of a CLOSED sign. No visible date, library name or entrance. No original upload
      is supplied. |

      | W, May 5 at 09:00 | Independent visitor''s observation: “I entered Alder through the east door
      this morning and used the library.” It addresses that visit only. |

      | R, supplied reverse-search result | A visually matching wider photo appeared in a public repair
      article dated May 2024 about Birch Library''s west door. Whether P is exactly that file is not established.
      |


      A''s word “tomorrow,” anchored to its publication on May 4, means May 5. B''s May 5 repost can make
      a reader mistakenly shift it to May 6. Preserve the original timestamp; the question''s date must
      not silently move as the content travels.


      #### Action 1 — Trace the dependency chain


      Draw `C → B → A` as citation dependencies. Mark N and W separately, and P as context-limited. Write
      what each record can directly support. Do not count B and C as independent confirmations of A. R
      is a possible image-context lead, not proof that a particular current claim is false.


      List missing information that would matter: A''s original source, P''s full context and whether
      a current notice supersedes N. Avoid general credibility scores for the people involved. The task
      concerns one proposition and its evidence.


      #### Action 2 — Build the chronology and compare scope


      Make a short table with publication time, event time and proposition. N has a May 3 publication
      date but a May 6–8 closure interval. W supports actual access on May 5, not future access. For the
      question as posed, N contradicts whole-library permanent closure by specifying one entrance and
      continued services.


      Explain what a reverse-image search can contribute: earlier contexts or candidate originals. A match
      requires inspection of the actual result, including differences and dates; a no-match result cannot
      prove an image new, authentic or false. In a live case, use only appropriate public images and respect
      privacy and access controls. Do not upload private images to perform this exercise.


      #### Action 3 — Write a verdict that can be updated


      Before opening [the later packet](?resource=file-later-packet-md), write up to 70 words that answer
      the exact question using N, explain the copied-source chain and preserve uncertainty about P. Include
      the relevant notice date and closure interval. Do not promise that no future closure will occur
      or attack the original poster''s motives.


      Then use the later record to update only what it changes. Current records can supersede older ones
      for a particular interval without vindicating every element of a rumor. Keep both versions in your
      notes so readers can see why your conclusion changed.


      Complete [fresh checks](?attempt=practice-checks), then [the key](?check=practice-answers). The
      final artifact includes the initial conclusion and dated revision. Revising in response to better
      evidence is part of verification, not a reason to hide the first record.


      ### Access and transfer


      An offline route compares these supplied documents; it does not demonstrate actual lateral browsing
      or reverse-search skill. For a supported route, read the timestamps aloud and underline the words
      that limit place or duration. For a harder route, remove N and W. The permanent-closure claim then
      remains unverified; copying volume cannot fill the gap. Name the next original record or responsible
      source needed.


      For real transfer, choose a harmless current service announcement. Open the source behind a headline,
      inspect its dated original record, compare one genuinely independent relevant source where available,
      and save a minimal link-and-claim note. If access fails, say what you could not inspect. End when
      the decision is adequately supported or a clear unresolved question has been identified; endless
      searching is not itself better evidence.


      **Supportive:** Scope and chronology support a calibrated conclusion. **Mixed:** The initial rumor
      is overstated but a new limited closure requires revision. **Contradictory:** Reposts become independent
      confirmations or an old image becomes a current event. **Inconclusive:** The key record is missing
      and judgment is appropriately suspended with a specific next check.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. Five websites cite one press release. A sixth describes its own visit on the previous day.
      How many independent origin chains are supplied, and do they address the same time?

      2. A post published August 2 says “closed tomorrow.” It is reposted August 4 without an original
      timestamp. What event date does the original wording refer to?

      3. A valid new notice closes a station for one weekend after an old notice said normal service.
      Does this confirm a rumor that the station is permanently shut? What if reopening is only planned?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Two independent origin chains: the release and the visitor''s observation. The five repetitions
      are dependent. A prior visit may not address the release''s future interval. Independence without
      temporal relevance does not settle the claim.

      2. August 3. Reposting does not move the original relative date to August 5. If the original publication
      date cannot be recovered, retain that uncertainty instead of guessing.

      3. It supports the limited weekend closure and supersedes the older service expectation for that
      interval. It does not establish permanence. A planned reopening is a plan with any stated conditions;
      confirm later rather than recording it as an observed event.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
