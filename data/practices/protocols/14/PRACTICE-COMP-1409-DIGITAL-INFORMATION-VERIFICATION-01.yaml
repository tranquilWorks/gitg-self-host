  review_guidance:
    repeat: Repeat the same bounded Digital information verification design only when the context and
      burden remain appropriate.
    adapt: Use accessible text versions or the fictional set entirely offline. A trusted reader can help
      trace links without receiving private account access. Do not investigate private people, bypass
      paywalls or access controls, or treat a lack of search results as proof of absence.
    stop: Stop Digital information verification when the practice becomes coercive, unsafe, privacy-invasive,
      role-inappropriate, professionally restricted, or harmful.
    escalate: Obtain appropriate help if the next action exceeds the setup's limits, your authority or
