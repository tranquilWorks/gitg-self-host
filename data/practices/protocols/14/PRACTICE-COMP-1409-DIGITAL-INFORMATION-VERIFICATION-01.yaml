        expected: true
  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Digital information verification; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use accessible text versions or the fictional set entirely offline. A trusted reader can help trace
      links without receiving private account access. Do not investigate private people, bypass paywalls
      or access controls, or treat a lack of search results as proof of absence.
    cultural_context:
    - Adapt the expression of Digital information verification to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use accessible text versions or the fictional set entirely offline. A trusted reader can help trace
      links without receiving private account access. Do not investigate private people, bypass paywalls
      or access controls, or treat a lack of search results as proof of absence.
  pause_conditions:
  - Pause Digital information verification when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Digital information verification practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Digital information verification situation exceeds a voluntary low-stakes
    practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
evidence_and_scoring:
  accepted_evidence_types:
  - structured criteria observations for the bounded Digital information verification actions
  - explicit contradiction, adverse, defer, not-applicable, and unknown states
  observation_contract_version: typed-evidence-rules-v1
  check_in_fields:
  - c1409_a1_primary
  - c1409_a1_boundary
  - c1409_a1_adverse
  - c1409_a2_primary
  - c1409_a2_boundary
  - c1409_a2_adverse
  - c1409_a3_primary
  - c1409_a3_boundary
  - c1409_a3_adverse
  adverse_or_contradictory_indicators:
  - Two reposts and an undated image were counted as three independent confirmations.
  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Digital information verification explicitly; support can enable access and never reduces dignity
    or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Digital information verification context,
    action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Digital information verification observation requires a distinct immutable origin;
    duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Digital information verification rules withhold observations older than 90 days;
    no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Extract the exact claim and trace who is copying whom. Observed checks:
    The claim includes location time and scope; Original sources and commentary copies are distinguished;
    The copying relationship is explicitly mapped; Unseen or inaccessible source content is not guessed.
    Action 2: Compare the primary record and the image’s missing context. Observed checks: The full primary
    record is compared with each claim component; Publication date event date and scope are kept distinct;
    Image context and reverse-search limits are recognized; Independent corroboration is not confused
    with repeated copying. Action 3: Write a calibrated verdict and a useful correction. Observed checks:
    The verdict matches the primary evidence and exact claim; Remaining image or timing uncertainty is
    retained; The correction points to the relevant record without personal attack; Insufficient evidence
    permits a clear unresolved outcome.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. A verdict was issued from the headline without reading
    the underlying record or checking dates.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Digital
    information verification contribution under typed evaluation; protocol performance remains distinct
    and is never counted twice.
  canonical_lever_allocation: parent_competency_mapping
  recommendation_target_lever_ids:
  - L12
  - L13
  - L19
  minimum_evidence_before_state_update: Composite-version practices require the configured completed-action
    minimum, meaningful-attempt criterion and explicit final closeout; check-ins award no credit.
  withholding_conditions:
  - Withhold unattempted, unknown, not-observed, not-applicable, deferred, inconclusive, stale, duplicate-origin,
    or adverse Digital information verification evidence.
  - Withhold any record containing private narrative, artifact contents, another person's identity, unsupported
    inference, or evidence outside its assessment epoch.
