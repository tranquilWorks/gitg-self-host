meaning_and_fit:
  purpose: Use lateral reading, source tracing, dates, image context and independent comparison to verify
    a claim or suspend judgment when evidence is insufficient.
  why_recommended: Use lateral reading, source tracing, dates, image context and independent comparison
    to verify a claim or suspend judgment when evidence is insufficient.
  claims:
  - statement: Use lateral reading, source tracing, dates, image context and independent comparison to
      verify a claim or suspend judgment when evidence is insufficient.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Digital information verification practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Digital information verification as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use accessible text versions or the fictional set entirely offline. A trusted
    reader can help trace links without receiving private account access. Do not investigate private people,
    bypass paywalls or access controls, or treat a lack of search results as proof of absence.
  opportunity_considerations: 'Fictional record set: Post A says the town library is closing permanently.
    Post B repeats A. An official notice dated May 3 says the west entrance is closed May 6–8 for repairs
    and the east entrance remains open. A photo shows a CLOSED sign but no date or entrance. Treat these
    as supplied fictional documents; do not claim a real library event occurred.'
  prerequisites:
  - 'Fictional record set: Post A says the town library is closing permanently. Post B repeats A. An official
    notice dated May 3 says the west entrance is closed May 6–8 for repairs and the east entrance remains
    open. A photo shows a CLOSED sign but no date or entrance. Treat these as supplied fictional documents;
    do not claim a real library event occurred.'
  dependencies: []
  safe_alternatives:
  - Use accessible text versions or the fictional set entirely offline. A trusted reader can help trace
    links without receiving private account access. Do not investigate private people, bypass paywalls
    or access controls, or treat a lack of search results as proof of absence.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Digital information verification differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Digital information verification
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Fictional record set: Post A says the town library is closing permanently. Post B repeats A.
    An official notice dated May 3 says the west entrance is closed May 6–8 for repairs and the east entrance
    remains open. A photo shows a CLOSED sign but no date or entrance. Treat these as supplied fictional
    documents; do not claim a real library event occurred. Goal: Use lateral reading, source tracing,
    dates, image context and independent comparison to verify a claim or suspend judgment when evidence
    is insufficient. Scope: One verification chain is not a general credibility score for a person or
    outlet. Repeated copies of the same claim are not independent corroboration. Time and effort: Twenty
    to thirty minutes on the supplied record set or a harmless current claim. Adaptation: Use accessible
    text versions or the fictional set entirely offline. A trusted reader can help trace links without
    receiving private account access. Do not investigate private people, bypass paywalls or access controls,
    or treat a lack of search results as proof of absence. Keep personal working notes outside the check-in;
    record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use accessible text versions or the fictional set entirely offline. A trusted reader
    can help trace links without receiving private account access. Do not investigate private people,
    bypass paywalls or access controls, or treat a lack of search results as proof of absence.
  expected_burden: Twenty to thirty minutes on the supplied record set or a harmless current claim.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Digital information verification protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Digital information verification action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use accessible
    text versions or the fictional set entirely offline. A trusted reader can help trace links without
    receiving private account access. Do not investigate private people, bypass paywalls or access controls,
    or treat a lack of search results as proof of absence.
  actions:
  - stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01-A1
    sequence: 1
    title: Extract the exact claim and trace who is copying whom
    instructions: 'Write the testable claim with location, date and scope: the entire library will close
      permanently. Open the source behind a post rather than staying inside its presentation, and draw
      the A-to-B copying link. Distinguish an original witness, an official record and a commentary copy.
      For a real claim, use only lawful public material and note access limits rather than infer unseen
      content.


      Observation checks: The claim includes location time and scope; Original sources and commentary
      copies are distinguished; The copying relationship is explicitly mapped; Unseen or inaccessible
      source content is not guessed. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01
      action_stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01-A1
      competency_stable_id: '14.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1409_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1409_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_claim_includes_location_time_and_scope
        - original_sources_and_commentary_copies_are_distinguished
        - the_copying_relationship_is_explicitly_mapped
        - unseen_or_inaccessible_source_content_is_not_guessed
      - measurement_id: c1409_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1409_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01-A2
    sequence: 2
    title: Compare the primary record and the image’s missing context
    instructions: 'Read the full supplied notice and compare each part of the viral claim. It concerns
      one entrance for three days, not the entire library permanently. The photograph lacks enough context
      to settle the broader claim. For a public real image, a reverse-image search may reveal earlier
      uses, but absence of a match proves little; never upload private images without permission. Seek
      a genuinely independent record when the first remains ambiguous.


      Observation checks: The full primary record is compared with each claim component; Publication date
      event date and scope are kept distinct; Image context and reverse-search limits are recognized;
      Independent corroboration is not confused with repeated copying. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01
      action_stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01-A2
      competency_stable_id: '14.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1409_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1409_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_full_primary_record_is_compared_with_each_claim_component
        - publication_date_event_date_and_scope_are_kept_distinct
        - image_context_and_reverse_search_limits_are_recognized
        - independent_corroboration_is_not_confused_with_repeated_copying
      - measurement_id: c1409_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1409_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01-A3
    sequence: 3
    title: Write a calibrated verdict and a useful correction
    instructions: 'Produce a short conclusion: The supplied notice contradicts permanent whole-library
      closure; it describes temporary west-entrance repairs. State what remains unknown about the photo.
      Include the primary record and date when sharing a correction, and avoid insulting the original
      poster. If evidence were missing or conflicting, use unresolved and name the next record needed
      rather than force a true-or-false verdict.


      Observation checks: The verdict matches the primary evidence and exact claim; Remaining image or
      timing uncertainty is retained; The correction points to the relevant record without personal attack;
      Insufficient evidence permits a clear unresolved outcome. Mark only what you observed. Missing,
      mixed and negative results are valid; a deferred action is not completed.


      Final review: Which source actually carried the conclusion, and which apparently supporting item
      was only a copy or an image without context?


      Examples: Supportive: The permanent-closure claim was narrowed to a temporary entrance closure using
      the dated notice, while the photograph remained context-limited.


      Mixed: The copied posts were identified, but a newer conflicting notice required suspending the
      verdict pending clarification.


      Contradictory: Two reposts and an undated image were counted as three independent confirmations.


      Inconclusive: A verdict was issued from the headline without reading the underlying record or checking
      dates.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01
      action_stable_id: PRACTICE-COMP-1409-DIGITAL-INFORMATION-VERIFICATION-01-A3
      competency_stable_id: '14.09'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1409_a3_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1409_a3_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_verdict_matches_the_primary_evidence_and_exact_claim
        - remaining_image_or_timing_uncertainty_is_retained
        - the_correction_points_to_the_relevant_record_without_personal_attack
        - insufficient_evidence_permits_a_clear_unresolved_outcome
      - measurement_id: c1409_a3_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1409_a3_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
