  transfer_limit: One verification chain is not a general credibility score for a person or outlet. Repeated
    copies of the same claim are not independent corroboration.
  reflection:
    before: 'What would count as doing this honestly? Goal: Use lateral reading, source tracing, dates,
      image context and independent comparison to verify a claim or suspend judgment when evidence is
