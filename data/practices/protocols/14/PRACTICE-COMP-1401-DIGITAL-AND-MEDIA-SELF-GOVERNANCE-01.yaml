meaning_and_fit:
  purpose: Set a purposeful boundary around notifications, feeds, gaming, adult media, outrage or checking,
    and test friction that preserves useful access without punitive restriction.
  why_recommended: Set a purposeful boundary around notifications, feeds, gaming, adult media, outrage
    or checking, and test friction that preserves useful access without punitive restriction.
  claims:
  - statement: Set a purposeful boundary around notifications, feeds, gaming, adult media, outrage or
      checking, and test friction that preserves useful access without punitive restriction.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Digital and media self-governance practice fit the
    person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Digital and media self-governance as not applicable, consciously unchosen,
    or deferred without penalty when the role, pathway, capacity, authority, opportunity, or safe context
    is absent.
  readiness_considerations: Use device accessibility controls, an external cue or a paper reminder when
    settings are confusing. Rehearse with a harmless feed category if the original material is triggering.
    Shared devices and dependent access require agreement; do not disable another person’s communication.
  opportunity_considerations: 'Default: opening a phone to answer one message repeatedly turns into an
    unplanned feed session. Write the intended purpose, the specific entry cue, a natural stopping point
    and a useful alternative. Consider notifications, news or outrage, gaming, adult media and repeated
    checking only where relevant; no exposure to upsetting or sexual content is required.'
  prerequisites:
  - 'Default: opening a phone to answer one message repeatedly turns into an unplanned feed session. Write
    the intended purpose, the specific entry cue, a natural stopping point and a useful alternative. Consider
    notifications, news or outrage, gaming, adult media and repeated checking only where relevant; no
    exposure to upsetting or sexual content is required.'
  dependencies: []
  safe_alternatives:
  - Use device accessibility controls, an external cue or a paper reminder when settings are confusing.
    Rehearse with a harmless feed category if the original material is triggering. Shared devices and
    dependent access require agreement; do not disable another person’s communication.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Digital and media self-governance differently while preserving consent, evidence limits, safety, and
    equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Digital and media self-governance
    as inferiority; competing reasonable interpretations and conscientious refusal remain visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Default: opening a phone to answer one message repeatedly turns into an unplanned feed session.
    Write the intended purpose, the specific entry cue, a natural stopping point and a useful alternative.
    Consider notifications, news or outrage, gaming, adult media and repeated checking only where relevant;
    no exposure to upsetting or sexual content is required. Goal: Set a purposeful boundary around notifications,
    feeds, gaming, adult media, outrage or checking, and test friction that preserves useful access without
    punitive restriction. Scope: One media-use experiment does not diagnose addiction or establish that
    a category of lawful adult media is inherently harmful. Serious loss of control or distress may need
    qualified support. Time and effort: Fifteen minutes of setup and three ordinary sessions with a two-minute
    review each. Adaptation: Use device accessibility controls, an external cue or a paper reminder when
    settings are confusing. Rehearse with a harmless feed category if the original material is triggering.
    Shared devices and dependent access require agreement; do not disable another person’s communication.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use device accessibility controls, an external cue or a paper reminder when settings
    are confusing. Rehearse with a harmless feed category if the original material is triggering. Shared
    devices and dependent access require agreement; do not disable another person’s communication.
  expected_burden: Fifteen minutes of setup and three ordinary sessions with a two-minute review each.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Digital and media self-governance protocol to rank worth, coerce participation, demand disclosure,
    override rest or care, certify competence, or justify decisions beyond the recorded context.
  - Treating a completed Digital and media self-governance action, a polished artifact, agreement, confidence,
    speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use device
    accessibility controls, an external cue or a paper reminder when settings are confusing. Rehearse
    with a harmless feed category if the original material is triggering. Shared devices and dependent
    access require agreement; do not disable another person’s communication.
  actions:
  - stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01-A1
    sequence: 1
    title: Map the entry cue and the point where intention is lost
    instructions: 'Describe one recent ordinary session as cue, intended action, actual continuation and
      practical cost or benefit. Give each relevant media category a chosen, unwanted or not-applicable
      status rather than making blanket judgments. For the default, the diversion begins when a notification
      opens the feed after the reply. Choose one stopping rule tied to purpose, such as reply and close,
      not an arbitrary purity target.


      Observation checks: A specific cue and intended purpose are identified; The actual continuation
      and its benefit or cost are distinguished; Relevant media categories receive a nonjudgmental disposition;
      The stopping rule is tied to an endorsed purpose. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01
      action_stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01-A1
      competency_stable_id: '14.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
