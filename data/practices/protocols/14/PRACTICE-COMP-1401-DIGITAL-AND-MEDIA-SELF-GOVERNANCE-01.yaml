  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Digital and media self-governance; no purchase, subscription, travel, credential, or public artifact
      is required.
    accessibility:
    - Use device accessibility controls, an external cue or a paper reminder when settings are confusing.
      Rehearse with a harmless feed category if the original material is triggering. Shared devices and
      dependent access require agreement; do not disable another person’s communication.
    cultural_context:
    - Adapt the expression of Digital and media self-governance to direct or indirect communication, collective
      or individual decision structures, local norms, faith or secular commitments, and role obligations
      while preserving consent and dignity.
    resource_variants:
    - Use device accessibility controls, an external cue or a paper reminder when settings are confusing.
      Rehearse with a harmless feed category if the original material is triggering. Shared devices and
      dependent access require agreement; do not disable another person’s communication.
  pause_conditions:
  - Pause Digital and media self-governance when capacity, consent, authority, privacy, access, care duties,
    uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make the next action
    unwise.
  stop_conditions:
  - Stop the Digital and media self-governance practice for harm, coercion, retaliation risk, emergency
    conditions, unsafe exposure, worsening symptoms, protected information, legal or policy conflict,
    or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Digital and media self-governance situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
