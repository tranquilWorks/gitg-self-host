  - id: file-later-packet-md
    title: Later packet
    body: 'Noor installed option B. An agreed direct test message arrived; an ordinary phone call and
      an accessibility alert also worked. These are stipulated fictional observations, not a guarantee
      for future real alerts.


      | Session | Actual record | Access / consequence |

      | --- | --- | --- |

      | Monday | Opened at 18:00; reply sent and app closed at 18:04 | Pickup message alerted normally;
      news read deliberately later |

      | Wednesday | Opened at 18:00; reply sent at 18:03; then deliberately opened feed and closed at
      18:14 | Essential access worked; Noor describes the extra feed period as unwanted and dinner preparation
      was delayed |

      | Friday | No meeting reply was needed; no session occurred | No duration or access test that day
      |


      Noor proposes keeping B and adding a visible “reply done: close” cue. The two observed sessions
      do not establish causation or long-term change. Friday is not a zero-minute successful session.
      Review the Wednesday detour without retrospectively rewriting the original purpose.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Decide what the session is for


      Self-governance means choosing how media fits your purposes, including enjoyment, connection and
      rest. Minutes alone cannot decide whether a session was useful. The important distinction is between
      an endorsed activity and a continuation you did not mean to choose. A boundary makes the choice
      visible; friction makes an unwanted continuation less automatic while preserving access you need.


      Allow 25 minutes for the complete fictional exercise. You need only a notes tool. An optional live
      version adds three ordinary sessions and a short manual review; it requires no monitoring software,
      account credentials or exposure to upsetting or sexual content. It is not a treatment for compulsive
      use or a test of moral worth.


      ### Locate the choice, not just the screen


      A **cue** is what starts the action: a notification, boredom, habit or a deliberate plan. The **entry
      route** is how you arrive: a direct conversation link, a feed or a game lobby. The **stopping point**
      is tied to purpose: send the reply, finish a chosen round, or read one item. **Friction** changes
      one of those transitions, such as removing a feed shortcut. A total communication blackout may reduce
      interruptions while defeating care, work or accessibility needs.


      Different media require different choices. For notifications, distinguish who or what must reach
      you from promotional prompts. For feeds and outrage, ask whether the next item serves the current
      question or simply continues reaction. For gaming, keep chosen play and social commitments visible.
      For pornography or other lawful adult media, a relevant adult can choose a private boundary consistent
      with consent and their values; this exercise requires no consumption, disclosure or moral verdict.
      Repeated checking needs a defined question or next check opportunity, not punishment. Mark categories
      not relevant to you as not applicable. Persistent loss of control or significant distress warrants
      appropriate support beyond a harsher app rule.


      Real settings vary by version. For example, [Apple''s Focus documentation](https://support.apple.com/guide/iphone/allow-or-silence-notifications-for-a-focus-iph21d43af5b/ios)
      describes people/app choices and exceptions. Use your provider''s current instructions, confirm
      what a setting actually does, and test essential routes with an agreed ordinary message. A setting
      name does not guarantee every urgent communication can reach you.


      ### Worked example: fewer minutes can be a worse result


      A person plans a 20-minute game with friends and finishes as agreed. Another spends six minutes
      repeatedly opening a news app without answering their original question, then misses an expected
      transport message. The longer session may better fit its purpose. Compare intended action, stopping
      point, necessary access and aftermath; do not award success simply to the shorter number.


      ### Complete case: Noor''s message-to-feed detour


      Noor opens the fictional Linkspace app at 18:00 to confirm a community meeting room. The goal is
      to send the reply and close it by 18:05. Noor also wants a separate chosen news-reading session
      after dinner. A household contact must be able to send a time-sensitive pickup message through Linkspace;
      ordinary phone calls and the device''s accessibility alerts must remain available.


      The current app opens its home feed. Promotional alerts lead to that feed. Direct conversation bookmarks
      are available. These are the complete stipulated control options:


      | Option | What changes | Cost or limitation |

      | --- | --- | --- |

      | A | Disable every Linkspace notification | Pickup messages stop alerting; phone calls still work
      |

      | B | Disable promotional alerts only; retain direct-message alerts; bookmark the meeting conversation
      | News must be opened deliberately; other messages can still interrupt |

      | C | Give another person the device passcode and let them choose when access is allowed | Control
      of access and private information leaves Noor |


      No actual app login or setting change is needed to solve the case. Treat the controls as fictional,
      not instructions for a real product.


      #### Action 1 — Write a purpose and route card


      Record the cue, intended reply, detour, stopping point, desired later leisure and three access requirements.
      Select an option and explain its tradeoff. Write an undo instruction in plain language. A valid
      plan preserves voluntary control and the three requirements; it need not eliminate all interruptions.


      #### Action 2 — Rehearse installation and essential access


      Describe the specific setting and bookmark change. List checks for direct messages, calls and accessibility
      alerts, identifying which are only planned tests. Write a one-sentence stop cue: “After __, I will
      __; news remains available at __.” Save this before [the later session records](?resource=file-later-packet-md).
      Do not report installed settings or delivered messages unless the supplied record says so.


      #### Action 3 — Judge three opportunities without moral arithmetic


      For each record, note whether Noor sent the reply, used or bypassed the stopping point, retained
      necessary access, and experienced an unwanted cost or useful benefit. Separate an unavailable opportunity
      from a failed one. Calculate minutes only where start and end are given; do not invent missing durations
      or an average with missing data. Recommend keep, adjust or remove based on fit, not shame.


      Attempt [the fresh checks](?attempt=practice-checks) before [the key](?check=practice-answers).
      A complete output includes the route card, reversible change, access-test plan, three-session review
      and one revision. No real-media history needs to be stored or shared.


      ### Adaptations and development beyond the default


      Use a paper cue, accessible shortcut or a supporter explaining settings without receiving credentials.
      On a shared or managed device, use only authorized controls and preserve other users'' needs. If
      coercive control or stalking is a concern, do not make a surprise account change to prove autonomy;
      seek a safe, appropriate support route.


      Harder task: Noor now needs live group updates during an event. The original “reply and close” boundary
      does not fit that purpose. Write a time-bounded exception, a natural ending and a return to the
      ordinary setting. Legitimate exceptions are not secret failures. For an experienced learner, repeat
      across a second media category and compare the actual entry mechanism; copying the same timer into
      every activity misses the skill.


      At three later natural opportunities, implement one reversible change you control, manually record
      the observations above and revise it. Retain meaningful enjoyment and essential communication. A
      successful small experiment does not establish long-term control, diagnose addiction or validate
      this exercise as treatment. Unlike 08.02''s attention experiment, this task audits media entry routes,
      permissions and voluntary boundaries across purposes.


      **Supportive:** The chosen task and essential access work, and later leisure remains deliberate.


      **Mixed:** The default route improves but a real exception needs an explicit revision.


      **Contradictory:** Necessary messages are blocked or another person controls access to enforce compliance.


      **Inconclusive:** A limit is selected but no session or access check is observed.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A learner planned 30 minutes of cooperative gaming and finished at the chosen endpoint with
      essential calls available. Another spent 8 minutes repeatedly checking without answering their question
      and missed a required update. Which facts matter more than the raw duration, and why?

      2. A proposed notification rule blocks promotional alerts and a required caregiving channel. A learner
      calls it successful because screen time fell. Give a correction and a concrete access test before
      accepting a revised rule.

      3. Three ordinary opportunities were planned. One session lasted 7 minutes and met its purpose.
      One lasted 12 minutes with an unwanted detour. The third did not occur. A report gives a 6.33-minute
      average over three sessions and three completions. Correct the arithmetic and the claims.


      Try these before [the answers](?check=practice-answers).'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. Endorsed purpose, chosen stopping point, essential access and unwanted consequences matter.
      The 30-minute session fits its supplied purpose; the shorter session does not automatically do so.
      Do not classify a media category or duration as inherently virtuous or harmful from these cards.

      2. Restore/preserve the required channel and narrow the friction to the unwanted entry route. Arrange
      an ordinary agreed test message on the caregiving channel and verify it arrives through the intended
      path, while keeping emergency access intact. Reduced screen time does not compensate for a known
      access failure. A planned test is not a passed test.

      3. There were two sessions, totaling 19 minutes, with an observed-session mean of **9.5 minutes**.
      Only one met its stated purpose; one had a detour; one opportunity was absent. Neither the absent
      event nor its missing duration is zero-valued success. The small sample does not prove a lasting
      effect.


      Noor''s default observed sessions total 18 minutes, mean 9 minutes. Wednesday includes 3 minutes
      through the reply and 11 minutes afterward; the five-minute endpoint was exceeded by 9 minutes.
      Friday stays absent. B preserves the supplied access requirements; A fails the direct-message requirement
      and C gives up voluntary control. Keeping B with a cue is a testable next choice, not a guaranteed
      remedy.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
