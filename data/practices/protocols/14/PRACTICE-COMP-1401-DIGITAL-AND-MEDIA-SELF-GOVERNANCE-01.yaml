  - stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01-A3
    sequence: 3
    title: Use three sessions and revise from actual fit
    instructions: 'On three natural opportunities, perform the intended action and note whether the stopping
      point was used, bypassed or unsuitable. Record any valuable activity accidentally blocked and the
      burden of the change. Keep, adjust or remove the friction using these results; a lapse is information,
      not a reason for deprivation or escalating punishment. Persistent impairment calls for appropriate
      support rather than a harsher app rule.


      Observation checks: Three natural sessions or missing opportunities are recorded; Use bypass and
      poor fit are distinguished; Lost benefits and friction burden are considered; Revision follows evidence
      rather than shame or punishment. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.


      Final review: Did the change help you finish the purpose you chose while leaving legitimate enjoyment
      and necessary access intact?


      Examples: Supportive: A direct message shortcut allowed the reply and exit on two of three occasions
      without blocking urgent contacts.


      Mixed: The feed diversion decreased, but a useful group update was missed and the notification rule
      needed refinement.


      Contradictory: Access was controlled by another person or ordinary leisure punished to create an
      appearance of discipline.


      Inconclusive: A screen-time limit was selected without identifying a purpose, entry cue or actual
      session result.'
    expected_time: 15-25 minutes
