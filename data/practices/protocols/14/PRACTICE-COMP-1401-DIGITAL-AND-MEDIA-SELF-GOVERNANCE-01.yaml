  - stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01-A2
    sequence: 2
    title: Install one reversible friction while preserving essential access
    instructions: 'Change one setting or route you control: silence a nonessential notification, move
      the feed shortcut, use a direct message bookmark or disable an optional autoplay feature through
      current official settings. Keep emergency, accessibility, care and work communications available.
      Test the route once to ensure the intended message can still be answered. Do not share credentials
      or give another person coercive control of access.


      Observation checks: One specific reversible friction is installed; Essential and accessibility-related
      access remains available; The intended task is tested after the change; The boundary remains voluntary
      and under the participant’s control. Mark only what you observed. Missing, mixed and negative results
      are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01
      action_stable_id: PRACTICE-COMP-1401-DIGITAL-AND-MEDIA-SELF-GOVERNANCE-01-A2
      competency_stable_id: '14.01'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
