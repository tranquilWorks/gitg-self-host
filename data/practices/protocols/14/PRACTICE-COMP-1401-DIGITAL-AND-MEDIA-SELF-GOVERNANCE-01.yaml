        - the_actual_continuation_and_its_benefit_or_cost_are_distinguished
        - relevant_media_categories_receive_a_nonjudgmental_disposition
        - the_stopping_rule_is_tied_to_an_endorsed_purpose
      - measurement_id: c1401_a1_boundary
        kind: boolean
