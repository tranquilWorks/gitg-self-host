  independence_rule: Record self-directed, planning-aid, guided, artifact, observer, or qualified support
    for Synthetic media, deepfakes, and provenance explicitly; support can enable access and never reduces
    dignity or silently changes the typed value.
  context_transfer_rule: Evidence remains limited to the chosen Synthetic media, deepfakes, and provenance
    context, action, role, pathway, and assessment epoch; it does not establish cross-context reliability.
  repetition_rule: Each Synthetic media, deepfakes, and provenance observation requires a distinct immutable
    origin; duplicate origins are rejected and later repetitions use the typed contract's explicit diminishing
    multipliers.
  recency_rule: Generated Synthetic media, deepfakes, and provenance rules withhold observations older
    than 90 days; no unrecorded retention or carry-forward assumption applies.
  performance_rubric: 'Action 1: Separate the asset’s history from the claim it makes. Observed checks:
    Supplier original context provenance and factual claim are separated; Realistic appearance is not
    equated with authenticity; Missing or valid provenance is interpreted within its limits; No identity
    inference from voice or appearance substitutes for verification. Action 2: Corroborate through a known
    independent source. Observed checks: The route is independent of the media’s embedded instructions;
    Venue fee date and context are checked separately; Private media is not sent to an unverified detection
    service; The uncertain clip is not amplified during checking. Action 3: Choose a proportionate action
    and communicate the uncertainty. Observed checks: Each consequential claim has an evidence-based disposition;
    Payment or other consequential action waits for adequate verification; Any correction states evidence
    and uncertainty without unsupported accusations; Evidence retention is minimal lawful and privacy-conscious.'
  evidence_quality_rubric: Record the listed checks only after reviewing the actual work or a privately
    kept record of the attempt. A participant's checked criteria remain self-attested observations, not
    an independent assessment or proof of mastery. The clip was forwarded to a group with an alarming
    caption before any independent check.
  scoring_eligibility: Check-ins capture immutable evidence only for composite-version practices. Completion
    credit requires an explicit human final closeout. Historical event-level scoring retains its own versioned
    contract.
  competency_contribution: Designated primary measurements may produce one context-bound direct Synthetic
    media, deepfakes, and provenance contribution under typed evaluation; protocol performance remains
    distinct and is never counted twice.
