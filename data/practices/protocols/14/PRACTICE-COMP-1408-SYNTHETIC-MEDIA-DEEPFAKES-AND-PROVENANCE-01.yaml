meaning_and_fit:
  purpose: Distinguish media provenance, alteration and factual truth, and corroborate a consequential
    claim before acting on a convincing image, audio clip, video or document.
  why_recommended: Distinguish media provenance, alteration and factual truth, and corroborate a consequential
    claim before acting on a convincing image, audio clip, video or document.
  claims:
  - statement: Distinguish media provenance, alteration and factual truth, and corroborate a consequential
      claim before acting on a convincing image, audio clip, video or document.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Synthetic media, deepfakes, and provenance practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Synthetic media, deepfakes, and provenance as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use text transcripts, captions or a fully written scenario when audio or visual
    media is inaccessible. A consented practice clip can be analyzed without identifying a real person.
    Threatening or intimate material requires appropriate specialist reporting and must not be redistributed.
  opportunity_considerations: 'Fictional scenario: a short voice clip apparently from a community organizer
    says tomorrow’s venue has changed and attendees must pay a new fee. You have an existing official
    event page and a known organizer contact route. No real person’s voice needs to be cloned, no suspicious
    file opened and no biometric identification performed.'
  prerequisites:
  - 'Fictional scenario: a short voice clip apparently from a community organizer says tomorrow’s venue
    has changed and attendees must pay a new fee. You have an existing official event page and a known
    organizer contact route. No real person’s voice needs to be cloned, no suspicious file opened and
    no biometric identification performed.'
  dependencies: []
  safe_alternatives:
  - Use text transcripts, captions or a fully written scenario when audio or visual media is inaccessible.
    A consented practice clip can be analyzed without identifying a real person. Threatening or intimate
    material requires appropriate specialist reporting and must not be redistributed.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Synthetic media, deepfakes, and provenance differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Synthetic media, deepfakes,
    and provenance as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Fictional scenario: a short voice clip apparently from a community organizer says tomorrow’s
    venue has changed and attendees must pay a new fee. You have an existing official event page and a
    known organizer contact route. No real person’s voice needs to be cloned, no suspicious file opened
    and no biometric identification performed. Goal: Distinguish media provenance, alteration and factual
    truth, and corroborate a consequential claim before acting on a convincing image, audio clip, video
    or document. Scope: This is verification practice, not forensic authentication or a reliable deepfake-detection
    test. Missing provenance does not prove fabrication, and valid credentials do not prove that a depicted
    event or claim is true. Time and effort: Twenty minutes on a supplied scenario and one verification-route
    rehearsal. Adaptation: Use text transcripts, captions or a fully written scenario when audio or visual
    media is inaccessible. A consented practice clip can be analyzed without identifying a real person.
    Threatening or intimate material requires appropriate specialist reporting and must not be redistributed.
    Keep personal working notes outside the check-in; record only the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use text transcripts, captions or a fully written scenario when audio or visual
    media is inaccessible. A consented practice clip can be analyzed without identifying a real person.
    Threatening or intimate material requires appropriate specialist reporting and must not be redistributed.
  expected_burden: Twenty minutes on a supplied scenario and one verification-route rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Synthetic media, deepfakes, and provenance protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Synthetic media, deepfakes, and provenance action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use text transcripts,
    captions or a fully written scenario when audio or visual media is inaccessible. A consented practice
    clip can be analyzed without identifying a real person. Threatening or intimate material requires
    appropriate specialist reporting and must not be redistributed.
  actions:
  - stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01-A1
    sequence: 1
    title: Separate the asset’s history from the claim it makes
    instructions: 'Write four questions: who supplied the clip, where the original full version is, what
      edits or credentials are available, and whether the venue or fee claim is independently supported.
      Explain that convincing sound, a familiar face or a document logo can be altered, while obvious
      glitches are not required. If Content Credentials exist, inspect what they attest to rather than
      treating their presence as a truth stamp.


      Observation checks: Supplier original context provenance and factual claim are separated; Realistic
      appearance is not equated with authenticity; Missing or valid provenance is interpreted within its
      limits; No identity inference from voice or appearance substitutes for verification. Mark only what
      you observed. Missing, mixed and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01
      action_stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01-A1
      competency_stable_id: '14.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1408_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1408_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - supplier_original_context_provenance_and_factual_claim_are_separated
        - realistic_appearance_is_not_equated_with_authenticity
        - missing_or_valid_provenance_is_interpreted_within_its_limits
        - no_identity_inference_from_voice_or_appearance_substitutes_for_verification
      - measurement_id: c1408_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1408_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01-A2
    sequence: 2
    title: Corroborate through a known independent source
    instructions: 'Open the previously known event page directly and contact the organizer through the
      established route, not a number or payment link embedded in the clip. Ask about the venue and fee
      separately. Compare dates, time zone and the full announcement if available. Do not upload private
      media to an unknown detector or forward the clip widely while asking whether it is real.


      Observation checks: The route is independent of the media’s embedded instructions; Venue fee date
      and context are checked separately; Private media is not sent to an unverified detection service;
      The uncertain clip is not amplified during checking. Mark only what you observed. Missing, mixed
      and negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01
      action_stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01-A2
      competency_stable_id: '14.08'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1408_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1408_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_route_is_independent_of_the_media_s_embedded_instructions
        - venue_fee_date_and_context_are_checked_separately
        - private_media_is_not_sent_to_an_unverified_detection_service
        - the_uncertain_clip_is_not_amplified_during_checking
      - measurement_id: c1408_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1408_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01-A3
    sequence: 3
    title: Choose a proportionate action and communicate the uncertainty
    instructions: 'Mark each claim corroborated, contradicted or unresolved. If unresolved, do not pay
      or change a consequential plan solely on the clip; seek a verified update. Draft a neutral correction
      for someone already affected, such as The fee claim is not confirmed by the official channel, rather
      than accusing a named person of fabrication. Preserve only the minimum lawful evidence needed for
      an official report.


      Observation checks: Each consequential claim has an evidence-based disposition; Payment or other
      consequential action waits for adequate verification; Any correction states evidence and uncertainty
      without unsupported accusations; Evidence retention is minimal lawful and privacy-conscious. Mark
      only what you observed. Missing, mixed and negative results are valid; a deferred action is not
      completed.


      Final review: What established the decision-worthy fact, and what remained unknown about how the
      media was produced?


      Examples: Supportive: The known organizer confirmed the original venue and no fee, so the participant
      corrected the claim without pretending to identify the clip’s creator.


      Mixed: The date was verified, but provenance remained incomplete and the media itself stayed unclassified.


      Contradictory: A detector score, familiar voice or valid credential was treated as conclusive proof
      of truth or fraud.


      Inconclusive: The clip was forwarded to a group with an alarming caption before any independent
      check.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01
      action_stable_id: PRACTICE-COMP-1408-SYNTHETIC-MEDIA-DEEPFAKES-AND-PROVENANCE-01-A3
