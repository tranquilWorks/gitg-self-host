  adaptations:
    low_resource:
    - Use paper, an offline note, a library resource, a public example, or a no-cost conversation for
      Synthetic media, deepfakes, and provenance; no purchase, subscription, travel, credential, or public
      artifact is required.
    accessibility:
    - Use text transcripts, captions or a fully written scenario when audio or visual media is inaccessible.
      A consented practice clip can be analyzed without identifying a real person. Threatening or intimate
      material requires appropriate specialist reporting and must not be redistributed.
    cultural_context:
    - Adapt the expression of Synthetic media, deepfakes, and provenance to direct or indirect communication,
      collective or individual decision structures, local norms, faith or secular commitments, and role
      obligations while preserving consent and dignity.
    resource_variants:
    - Use text transcripts, captions or a fully written scenario when audio or visual media is inaccessible.
      A consented practice clip can be analyzed without identifying a real person. Threatening or intimate
      material requires appropriate specialist reporting and must not be redistributed.
  pause_conditions:
  - Pause Synthetic media, deepfakes, and provenance when capacity, consent, authority, privacy, access,
    care duties, uncertainty, distress, fatigue, pain, resource scarcity, or changed circumstances make
    the next action unwise.
  stop_conditions:
  - Stop the Synthetic media, deepfakes, and provenance practice for harm, coercion, retaliation risk,
    emergency conditions, unsafe exposure, worsening symptoms, protected information, legal or policy
    conflict, or pressure to exceed the stated boundary.
  escalation_conditions:
  - Use the appropriate local safeguarding, emergency, organizational, legal, medical, financial, accessibility,
    or other qualified channel when a Synthetic media, deepfakes, and provenance situation exceeds a voluntary
    low-stakes practice.
  professional_referral_conditions:
  - Use qualified, local, or emergency support whenever the situation exceeds a voluntary low-stakes developmental
    practice.
