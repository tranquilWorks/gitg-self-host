      - [Burns](https://www.redcross.org/take-a-class/resources/learn-first-aid/burns)

      - [Poison exposure](https://www.redcross.org/take-a-class/resources/learn-first-aid/poison-exposure)

      - [Making an Emergency Plan](https://www.cdc.gov/disability-emergency-preparedness/people-with-disabilities/make-a-plan.html)

      - [Make a Plan](https://www.redcross.org/get-help/how-to-prepare-for-emergencies/make-a-plan.html)

      - [Causes and prevention: overview](https://www.hse.gov.uk/slips/preventing-overview.htm)

      - [A computational reward learning account of social media engagement](https://www.nature.com/articles/s41467-020-19607-x)

      - [publisher correction](https://www.nature.com/articles/s41467-021-22067-6)

      - [author-hosted abstract of Exposure to ideologically diverse news and opinion on Facebook](https://solomonmg.github.io/publications/bakshy-2015-exposure/)'
  - id: file-later-packet-md
    title: Later packet
    body: 'Open after saving your six assessments and two scripts. All outcomes are supplied fiction.


      The bank''s independently reached app support confirms it issued no safe-account transfer request.
      It has no record of a transfer by the learner. This contradicts S1''s asserted authorization, without
      proving who sent it.


      The club portal confirms membership expires tomorrow and offers its normal renewal form. It says
      renewal requires no downloaded program. A real renewal need does not validate S6''s attachment.
      No renewal payment has been made.


      There is no additional verification for S2, S4 or S5. Their harmful requests remain declined; identities
      and S5''s claimed possession remain unverified. Do not manufacture proof of fraud or intimate material
      from the lack of a reply.


      **Separate exposure branch:** Before asking for help, a fictional learner gave S3''s caller a one-time
      code. Through independently reached Postbox support, they reported the exposure. The provider revoked
      an unfamiliar session and began its recovery process. The record does not confirm whether messages
      were accessed, whether all recovery settings are secure, or whether recovery is complete. Describe
      the remaining provider-led steps without inserting real credentials.


      **Separate payment branch:** A learner sent 300 in response to S2 and asked the issuer to recover
      it. The issuer acknowledged the report. No refund decision is recorded. The lost amount must not
      be recorded as zero because a report was filed.


      Revise your table with the exact supported status of each branch. Neither branch describes an action
      you performed.'
  sections:
  - id: teaching
    kind: concept
    title: Learn and try
    body: '### Verify the request, not the performance


      A convincing message can still ask you to do something harmful. Social engineering uses authority,
      affection, fear, opportunity or time pressure to move a decision outside your normal checks. Phishing
      asks you to disclose information or follow a harmful route while impersonating a trusted source.
      Neither requires spelling mistakes. A real name, an accurate account detail or a familiar voice
      is evidence about what the sender knows, not permission to transfer money or reveal a code.


      Allow 30 minutes with paper or an accessible editor. The supplied messages, institution and replies
      are fictional. There are no live links, real accounts or actual reports to submit. Your output will
      be six request assessments, an independent verification script and an exposure-specific response.
      This is a defensive practice; do not engage suspected scammers to gather more material.


      ### Independence is a property of the route


      Calling a number inside the suspicious message asks the same channel to vouch for itself. Instead,
      start from a previously trusted app, statement or contact record. [FTC guidance](https://consumer.ftc.gov/articles/how-avoid-scam)
      supports resisting pressure and contacting the purported organization through a separately trusted
      route. Do not treat the first sponsored search result as independently verified support.


      Separate three questions: **Who is contacting me? What exact action is requested? What evidence
      authorizes that action?** A genuine service can have an urgent issue, but it does not follow that
      an unsolicited caller''s proposed remedy is genuine. Conversely, an odd-looking notice can describe
      a real task that you can complete safely through the normal interface. Verification should resolve
      the particular request, not label all future messages from an organization safe.


      Worked example: a message says a club subscription expires tomorrow. The existing club portal independently
      shows the same renewal date and normal payment options. You can use that portal without deciding
      whether the message itself was authentic. You have verified the task and its legitimate route, not
      the sender''s identity from its logo.


      ### Complete message packet


      For each row, extract the requested action, claimed relationship, pressure and known facts. The
      absence of independent confirmation is deliberate.


      | ID | Entire relevant message |

      | --- | --- |

      | S1 | “Harbor Bank security: move your savings to our safe account within ten minutes. Use the
      transfer instructions in this message. Tell nobody while we investigate.” |

      | S2 | “We''ve been talking for months. My flight is held up. Send 300 by gift card tonight so we
      can finally meet. If you trusted me, you would help.” |

      | S3 | “I''m Postbox support. Read me the one-time sign-in code you just received so I can stop
      your account being closed.” |

      | S4 | “Our investment group guarantees a 20% weekly return. Your friend appears in our testimonial
      video. Deposit cryptocurrency before this invitation expires.” |

      | S5 | “I have private material about you. Pay now or I''ll distribute it. Don''t ask anyone for
      help.” No material or evidence is supplied. |

      | S6 | “Your club membership may need renewal. Open the attached renewal program and disable its
      security warning if necessary.” |


      Available independent routes: Harbor Bank''s app was installed and used before these messages; a
      paper bank statement is already held privately; Postbox''s help page is reachable from its existing
      saved home page; the club''s saved member portal shows status and normal renewal controls. A testimonial,
      a second account recommended by the sender and a caller-ID display are not additional trusted routes.
      S2''s contact has never been met in person. None of the six requests has yet been acted on.


      #### Action 1 — Build the request assessments


      Use one short row per message: `request | pressure | independent fact missing | immediate boundary
      | next route`. Include romance, investment and extortion separately; “phishing” alone loses the
      relationship-specific pressure. For S5, distinguish the threat from proof that the claimed material
      exists. You can take a threat seriously and seek support without accepting every claim in it.


      Do not open an attachment, supply a code, send a small “test payment” or repeat intimate material
      to friends. Record each initial disposition as **suspected scam / harmful request**, with any underlying
      account or membership question still unresolved. You do not need forensic certainty to decline a
      dangerous requested action.


      #### Action 2 — Rehearse two independent checks


      Write a bank question: “I received a request to transfer funds to a new account. Did your service
      issue that request, and what action is actually required?” Specify how you reached the bank without
      using the message. Then write a club check that examines membership status inside the existing portal
      without opening S6''s attachment. Save both before opening [the later packet](?resource=file-later-packet-md).


      For romance or investment pressure, a neutral trusted person can help you pause and identify official
      consumer or financial-regulator information. They cannot authenticate a stranger merely by liking
      the story. Do not use the suspicious sender''s recommended “verification agent.” An apparently convincing
      live call or video does not replace checking the consequential request.


      #### Action 3 — Respond to the exposure that actually occurred


      Use the later facts to distinguish **requested**, **sent**, **reported**, **recovery requested**
      and **recovered**. [The FTC''s recovery guidance](https://consumer.ftc.gov/articles/what-do-if-you-were-scammed)
      recommends promptly contacting the payment provider when money was sent and using the relevant account
      or device recovery route when those were exposed. A request for reversal is not a refund guarantee.


      For a real incident, use the provider''s current official reporting controls and your location''s
      consumer/cybercrime services. The FTC is a US route, not a universal authority. Immediate physical
      danger calls for local emergency help. Extortion involving intimate material warrants appropriate
      specialist support; avoid further payment, additional material and redistribution. Keep only the
      lawful evidence the report needs. Do not hire an unsolicited “recovery expert” who demands an advance
      fee.


      Complete [three fresh checks](?attempt=practice-checks), then read [the corrective key](?check=practice-answers).
      Your final artifact must say which action is supported now and what remains unknown.


      ### Adapt and transfer


      A trusted reader or interpreter can help parse pressure without taking control of your account or
      learning secrets. Use only two messages initially if fatigue is high, then return to the remaining
      patterns. Being targeted is not evidence of stupidity; shame can make independent help harder to
      obtain.


      Harder route: suppose the bank app itself cannot be trusted because the device may be compromised.
      Identify a separately trusted device or previously held official contact route; do not keep using
      the suspect route simply because it was once legitimate.


      For transfer, prepare a private verification route for one service you actually use and rehearse
      locating it. Record a real safe lookup separately from a fictional scam response. You need not wait
      for a scam or contact an organization with a fake incident.


      **Supportive:** The request pauses and an independent source determines the next action. **Mixed:**
      The dangerous action stops, but account recovery remains pending. **Contradictory:** A code or test
      payment is shared to establish trust. **Inconclusive:** “Scam” is written without a usable verification
      or exposure-response route.


      See scope and limits described in this guide and [sources](?resource=sources).'
  - id: practice-checks
    kind: prompt
    title: Practice checks
    body: '1. A caller knows the last four digits of an account and supplies a second number for “independent
      security.” What does that knowledge establish, and what route would you use?

      2. A genuine renewal is visible in an existing portal, while a text demands a gift-card payment.
      Decide separately about the renewal and payment instruction.

      3. A person sent 120, reported it and received a case number. An unsolicited recovery agent promises
      a guaranteed refund for 25. What amount is confirmed recovered, and what should happen next?'
    check_id: practice-answers
    attempt_mode: practice
  checks:
  - id: practice-answers
    title: Compare your responses
    body: '1. The caller knows an account detail; authorization and identity remain unverified. Their
      second number is part of the same untrusted chain. Use the already trusted app or independently
      held official contact. If you chose the supplied number, redraw the route from a source that predates
      the request.

      2. The renewal need is independently supported. The gift-card instruction is not. Use only the portal''s
      verified normal procedure if renewal is wanted; do not endorse the text as authentic because one
      fact matches.

      3. No recovered payment is confirmed; the 120 remains an exposed payment with recovery unresolved.
      A case number establishes a report, not reimbursement. Follow up with the actual payment provider
      through its trusted route and reject the unsolicited advance-fee offer. Do not pay another 25 to
      “unlock” recovery.'
    criteria:
    - Compare each saved response with its matching explanation; keep revisions separate from your initial
      attempt.
