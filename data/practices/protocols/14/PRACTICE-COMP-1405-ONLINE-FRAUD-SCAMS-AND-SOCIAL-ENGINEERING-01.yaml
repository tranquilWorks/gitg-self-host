meaning_and_fit:
  purpose: Recognize common social-engineering pressures and independently verify identity, purpose and
    payment or data requests before responding.
  why_recommended: Recognize common social-engineering pressures and independently verify identity, purpose
    and payment or data requests before responding.
  claims:
  - statement: Recognize common social-engineering pressures and independently verify identity, purpose
      and payment or data requests before responding.
    classification: product_design_judgment
    source_ids:
    - SRC-CANONICAL-CURRICULUM-V2
    limitations: Original educational practice design, not evidence of effectiveness, specialist acceptance
      or comprehensive competency coverage.
  applicability_question: Does a voluntary, bounded Online fraud, scams, and social engineering practice
    fit the person's current role, pathway, capacity, authority, resources, and safety conditions?
  not_applicable_behavior: Record Online fraud, scams, and social engineering as not applicable, consciously
    unchosen, or deferred without penalty when the role, pathway, capacity, authority, opportunity, or
    safe context is absent.
  readiness_considerations: Use printed sample messages, an interpreter or a trusted support person who
    does not ask for codes. People of any experience level can be targeted. Extortion involving intimate
    material or safety threats may require specialist support; do not redistribute the material as evidence
    to friends.
  opportunity_considerations: 'Use these fictional messages: a bank text says transfer savings now to
    protect them; an online romantic contact asks for an urgent travel payment; a supposed support agent
    asks for a one-time code to stop account closure. No live links or phone numbers are supplied. Use
    a known official app, bookmarked site or independently verified contact route, not the message’s contact
    details.'
  prerequisites:
  - 'Use these fictional messages: a bank text says transfer savings now to protect them; an online romantic
    contact asks for an urgent travel payment; a supposed support agent asks for a one-time code to stop
    account closure. No live links or phone numbers are supplied. Use a known official app, bookmarked
    site or independently verified contact route, not the message’s contact details.'
  dependencies: []
  safe_alternatives:
  - Use printed sample messages, an interpreter or a trusted support person who does not ask for codes.
    People of any experience level can be targeted. Extortion involving intimate material or safety threats
    may require specialist support; do not redistribute the material as evidence to friends.
  role_conditions:
  - This competency is cross context core; roles, duties, and authority must be explicitly chosen or actually
    held before the practice applies.
  pathway_conditions:
  - Religious, secular, cultural, disability-adapted, collective, and individual pathways may express
    Online fraud, scams, and social engineering differently while preserving consent, evidence limits,
    safety, and equal dignity.
  worldview_conditions:
  - The practice does not require one worldview or treat disagreement about Online fraud, scams, and social
    engineering as inferiority; competing reasonable interpretations and conscientious refusal remain
    visible.
intervention:
  protocol_class: PF-SKILL-REHEARSAL
  duration_days: 10
  cadence: Work through the numbered actions at a sustainable pace. Preserve their order; use the review
    point specified in the instructions and defer if the context is unsuitable.
  setup: 'Use these fictional messages: a bank text says transfer savings now to protect them; an online
    romantic contact asks for an urgent travel payment; a supposed support agent asks for a one-time code
    to stop account closure. No live links or phone numbers are supplied. Use a known official app, bookmarked
    site or independently verified contact route, not the message’s contact details. Goal: Recognize common
    social-engineering pressures and independently verify identity, purpose and payment or data requests
    before responding. Scope: This is defensive scam literacy, not an exercise in deceiving others or
    engaging criminals. Current financial loss, threats or account compromise requires prompt official
    help rather than prolonged investigation. Time and effort: Fifteen minutes on three supplied messages
    and one five-minute verification-route rehearsal. Adaptation: Use printed sample messages, an interpreter
    or a trusted support person who does not ask for codes. People of any experience level can be targeted.
    Extortion involving intimate material or safety threats may require specialist support; do not redistribute
    the material as evidence to friends. Keep personal working notes outside the check-in; record only
    the listed observations.'
  privacy_and_boundaries: Keep working notes private. Record only the listed observation checks, not document
    contents, identifying details or another person's private information. Participation and any help
    must be voluntary. Use printed sample messages, an interpreter or a trusted support person who does
    not ask for codes. People of any experience level can be targeted. Extortion involving intimate material
    or safety threats may require specialist support; do not redistribute the material as evidence to
    friends.
  expected_burden: Fifteen minutes on three supplied messages and one five-minute verification-route rehearsal.
  action_count_rationale: null
  foreseeable_misuse:
  - Using the Online fraud, scams, and social engineering protocol to rank worth, coerce participation,
    demand disclosure, override rest or care, certify competence, or justify decisions beyond the recorded
    context.
  - Treating a completed Online fraud, scams, and social engineering action, a polished artifact, agreement,
    confidence, speed, independence, or output as mastery or universal transfer.
  exclusions:
  - Follow the material, equipment, consent and scope limits in the setup and each action. Use printed
    sample messages, an interpreter or a trusted support person who does not ask for codes. People of
    any experience level can be targeted. Extortion involving intimate material or safety threats may
    require specialist support; do not redistribute the material as evidence to friends.
  actions:
  - stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01-A1
    sequence: 1
    title: Identify the request and the pressure mechanism
    instructions: 'For each message, state what the sender wants, what authority or relationship is claimed,
      what urgency or secrecy is imposed, and what information is independently known. Include investment
      promises, extortion and malicious attachments as related patterns without opening anything. A familiar
      logo, caller ID, personal detail or convincing tone does not settle authenticity; legitimate-looking
      details may coexist with a fraudulent request.


      Observation checks: The requested money data code or action is explicit; Claimed identity and pressure
      or secrecy are separated; Known facts are distinguished from persuasive details; Links attachments
      and codes are not used to investigate the request. Mark only what you observed. Missing, mixed and
      negative results are valid; a deferred action is not completed.'
    expected_time: 15-25 minutes
    due_within_days: 3
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01
      action_stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01-A1
      competency_stable_id: '14.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1405_a1_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1405_a1_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_requested_money_data_code_or_action_is_explicit
        - claimed_identity_and_pressure_or_secrecy_are_separated
        - known_facts_are_distinguished_from_persuasive_details
        - links_attachments_and_codes_are_not_used_to_investigate_the_request
      - measurement_id: c1405_a1_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1405_a1_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01-A2
    sequence: 2
    title: Rehearse an independent verification path
    instructions: 'For the bank case, locate the institution’s official contact route through an existing
      trusted app or known statement, not a search advertisement or the suspicious message. State the
      neutral question: Did you send this request, and what action is actually required? For the romance
      or support case, decline immediate payment or code sharing and consult a trusted independent source.
      Rehearse without calling emergency lines or submitting fake reports.


      Observation checks: The verification route is independent of the suspicious channel; The question
      checks the request rather than repeats the sender’s story as fact; Payment and sensitive disclosure
      pause while uncertainty remains; No fake incident report or unnecessary emergency call is made.
      Mark only what you observed. Missing, mixed and negative results are valid; a deferred action is
      not completed.'
    expected_time: 15-25 minutes
    due_within_days: 7
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01
      action_stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01-A2
      competency_stable_id: '14.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1405_a2_primary
      transfer_disposition: context_bound
      measurements:
      - measurement_id: c1405_a2_primary
        kind: artifact
        role: primary
        weight: '1'
        allowed_provenance:
        - reviewed_artifact
        criteria:
        - the_verification_route_is_independent_of_the_suspicious_channel
        - the_question_checks_the_request_rather_than_repeats_the_sender_s_story_as_fact
        - payment_and_sensitive_disclosure_pause_while_uncertainty_remains
        - no_fake_incident_report_or_unnecessary_emergency_call_is_made
      - measurement_id: c1405_a2_boundary
        kind: boolean
        role: supporting
        weight: '0.5'
        allowed_provenance:
        - firsthand_self_report
        expected: true
      - measurement_id: c1405_a2_adverse
        kind: boolean
        role: adverse
        weight: '0'
        allowed_provenance:
        - firsthand_self_report
        expected: true
  - stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01-A3
    sequence: 3
    title: Choose the report and recovery route for the actual situation
    instructions: 'Mark each fictional message verified legitimate, suspected scam or unresolved based
      only on available evidence; the supplied cases remain suspicious until independently checked. Identify
      the service’s reporting control and the relevant local consumer or cybercrime route. If a real payment,
      credential or code was already shared, contact the affected provider promptly through a trusted
      channel and follow its recovery process. Do not pay a recovery scammer or confront the sender.


      Observation checks: The disposition reflects evidence rather than confidence alone; A legitimate
      report route is identified for the service and location; Actual exposure triggers prompt provider-led
      recovery; No confrontation additional payment or vigilante investigation is introduced. Mark only
      what you observed. Missing, mixed and negative results are valid; a deferred action is not completed.


      Final review: Which independent fact would change your decision, and what would you do first if
      money or credentials had already been exposed?


      Examples: Supportive: The person paused the transfer request and verified it through the known bank
      channel rather than the text link.


      Mixed: The pressure pattern was recognized, but the supposed verification number still came from
      the suspicious message.


      Contradictory: A one-time code or payment was sent to prove cooperation, or an alleged recovery
      expert was paid without verification.


      Inconclusive: The messages were labeled scams by intuition without an independent route or a response
      plan for actual exposure.'
    expected_time: 15-25 minutes
    due_within_days: 10
    typed_evidence_identity:
      protocol_stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01
      action_stable_id: PRACTICE-COMP-1405-ONLINE-FRAUD-SCAMS-AND-SOCIAL-ENGINEERING-01-A3
      competency_stable_id: '14.05'
      scoring_policy_id: SP-STRUCTURED-EVIDENCE-ELIGIBLE
    evidence_rules:
      schema_version: typed-evidence-rules-v1
      max_age_days: 90
      competency_measurement_ids:
      - c1405_a3_primary
      transfer_disposition: context_bound
      measurements:
