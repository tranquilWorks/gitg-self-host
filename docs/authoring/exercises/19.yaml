schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '19'
exercises:
  '19.01':
    title: Interrupt one inherited family pattern without erasing its good
    goal: Distinguish a family pattern’s protective purpose from its present costs and make one proportionate
      change in your own participation.
    scope_note: One ordinary pattern can be examined without diagnosing relatives, reconstructing trauma,
      requiring reconciliation or deciding the whole family’s character.
    burden: Two private 20-minute passes and one naturally occurring low-stakes opportunity within two
      weeks.
    setup: 'Use the supplied case: family plans are always passed through one person, who feels responsible
      for everyone’s response. On paper make columns for occasion, visible roles, who speaks to whom,
      inherited rule, benefit and cost. Use neutral role labels, not identifying histories.'
    actions:
    - title: Map the pattern and the loyalty it serves
      instructions: Describe two ordinary occasions when the same coordination pattern occurred. Draw
        the communication routes and distinguish an observed alliance from an assumed motive. For the
        default, retaining a trusted organizer may preserve connection while making that person carry
        every refusal. Name one inherited belief, one loyalty worth preserving and one burden. Mark unknown
        history as unknown; neither estrangement nor a trauma explanation may be inferred from this small
        map.
      checks:
      - Two specific occasions are distinguished
      - Observed routes are separated from presumed motives
      - A protective good and a present burden are both named
      - Unknown history is not filled with a diagnosis
    - title: Choose a change that belongs to you
      instructions: 'Replace one part of the pattern with a controllable action: send your own attendance
        answer directly to the organizer and decline to interpret another adult’s silence. Prepare wording
        such as I will answer for myself; please ask them about their plans. Keep a family good, such
        as the shared meal, while removing an unnecessary intermediary role. Check whether contact, disclosure
        or changing the pattern could create retaliation; use private planning and appropriate support
        instead when unsafe.'
      checks:
      - The change concerns your own participation
      - A valued continuity is deliberately preserved
      - The proposed boundary avoids speaking for another adult
      - Safety and contact limits determine whether to proceed
    - title: Observe the response without demanding transformation
      instructions: At a safe natural opportunity, carry out the new communication once. Record your action,
        the actual response and whether you resumed the old intermediary role. Make a small repair if
        your wording added unnecessary hurt without retracting a legitimate limit. Decide whether to repeat,
        adjust the channel or seek support. A family member’s disagreement is not proof that your map
        was correct, and one success is not evidence that an intergenerational pattern is healed.
      checks:
      - A real use or explicitly labeled rehearsal is recorded
      - Your action and others’ responses remain separate
      - A proportionate repair or next boundary is specified
      - No broad family-healing claim is made
    adaptation: Use a diagram, oral reflection or a fictional family when personal mapping would expose
      sensitive history. Do not contact an estranged or unsafe relative for this exercise. Qualified family,
      trauma, legal or safeguarding support takes precedence over an attempted repair.
    review: Which inherited good survived the change, which burden shifted, and what did the response
      show that your original map missed?
    examples:
      supportive: The participant answered directly and stopped carrying a sibling’s response while preserving
        a welcome family gathering.
      mixed: The direct answer helped, but the participant still explained another adult’s absence and
        revised the boundary.
      contradictory: The map became a diagnosis of relatives or an excuse to confront an unsafe person
        and demand reconciliation.
      inconclusive: Family labels were listed without an observed pattern, controllable change or actual
        rehearsal.
  '19.02':
    title: Guide one child’s ordinary routine with security and growing choice
    goal: Respond to a child’s current abilities and needs while combining warmth, predictable safety
      limits, demonstration and a genuine chance to act independently.
    scope_note: This is for an authorized parent or caregiver in an ordinary safe routine. It is not a
      developmental assessment, treatment plan, safeguarding investigation or permission to take responsibility
      for someone else’s child.
    burden: Fifteen minutes to prepare and two 10-minute routine opportunities over one week, with breaks
      as needed.
    setup: Use putting away a few soft toys or books already familiar to the child. Confirm your caregiving
      authority and the existing care plan. Choose a small, accessible space and a task the child can
      reasonably try. No small parts, food, hazardous objects or public recording are needed.
    actions:
    - title: Match the expectation to this child rather than an ideal age
      instructions: 'Observe what the child already does with these items, what needs a demonstration
        and what is inaccessible or tiring today. Ask or offer a simple choice: books first or soft toys
        first. Explain the safety limit and what will happen next in a form the child understands. Consult
        the authorized care plan or qualified professional for developmental questions; do not use the
        exercise to declare a delay or compare siblings.'
      checks:
      - Authority and relevant care instructions are confirmed
      - Current ability and access needs shape the task
      - A understandable choice and predictable next step are offered
      - No diagnosis or sibling comparison is used
    - title: Model, accompany and then leave room to try
      instructions: Demonstrate one return to its place, describe what you are doing and invite the child
        to try a manageable part. Stay available without grabbing control at the first error. Notice frustration,
        offer a pause or simpler step and maintain the safety limit calmly. Model your own regulation
        by correcting a mistake without ridicule. Give specific information about the action rather than
        demanding affection, gratitude or perfect obedience as evidence that the relationship is secure.
      checks:
      - One action is demonstrated before independent expectation
      - The child has a genuine opportunity to act
      - Distress changes support rather than triggering humiliation
      - Safety is maintained without affection or obedience tests
    - title: Repeat with a support adjustment and review the relationship
      instructions: 'On the next ordinary opportunity, repeat the routine with one appropriate change:
        fewer items, a visual label or less prompting when welcomed. Compare what the child attempted,
        where help was requested and whether your response remained predictable. Ask in an accessible
        way what helped or was difficult. Keep the observation private and ordinary; the outcome is a
        better-matched caregiving interaction, not a score of attachment, intelligence or parenting worth.'
      checks:
      - A second ordinary opportunity is observed
      - One support adjustment is made for a stated reason
      - The child’s response or inability to respond remains visible
      - Growing participation is distinguished from forced compliance
    adaptation: Use gestures, pictures, AAC, sensory-friendly materials or a shorter task. A person without
      a caregiving role may rehearse with the written case only; that is not live parenting evidence.
      Follow professional guidance for disability, distress, safety or developmental concerns.
    review: Where did your support create security and room to learn, and where did your expectation exceed
      the child’s current capacity?
    examples:
      supportive: After a demonstration and picture label, the child returned two books and asked for
        help with another while the caregiver stayed calm.
      mixed: The routine was safe, but too many instructions led to frustration; the caregiver shortened
        the next attempt.
      contradictory: The adult used shame, physical punishment or withdrawal of affection to obtain a
        tidy result.
      inconclusive: A parenting principle was discussed without an observed routine or clearly labeled
        case rehearsal.
  '19.03':
    title: Complete one agreed care handoff without taking away agency
    goal: Coordinate a bounded practical, emotional, administrative or advocacy contribution that respects
      the care recipient’s choices and the caregiver’s capacity.
    scope_note: Use an existing authorized care arrangement. Medication, lifting, feeding, clinical assessment,
      financial authority and other specialist tasks must remain with appropriately authorized and trained
      people.
    burden: Twenty minutes to agree the handoff, one ordinary care-support task and a 15-minute review.
    setup: Default to arranging transport and a question list for an already planned appointment, not
      providing medical care. With permission, use a private card for the recipient’s preference, task
      owner, access need, expense limit, backup and completion signal. Keep health details and account
      information outside application evidence.
    actions:
    - title: Ask what support is wanted and who may decide
      instructions: Ask the person how they want to participate and which part of the appointment logistics
        they want help with. Distinguish choosing the transport, paying for it, communicating an access
        need and speaking during the visit; authority for one is not authority for all. Identify an emotional
        concern they want acknowledged, any practical barrier and a financial question requiring the authorized
        person. Where decision support is needed, use the established supported-decision or legal arrangement
        rather than assuming incapacity.
      checks:
      - The recipient’s preference or authorized decision process is recorded
      - Practical emotional financial and advocacy needs are separated
      - Authority is checked for each offered task
      - Private clinical and account details are excluded from check-ins
    - title: Carry out the agreed part with a backup
      instructions: 'Confirm the chosen transport or equivalent low-risk support, accessibility arrangements,
        expected cost and who will receive the arrival update. Rehearse what happens if the vehicle does
        not arrive: contact the agreed backup and the appointment provider instead of improvising unsafe
        transport. During the actual task, offer the recipient the agreed opportunity to speak and decline
        assistance. Do not change treatment, impersonate them or promise availability beyond the stated
        window.'
      checks:
      - One agreed practical contribution is actually performed
      - Access cost and completion communication are confirmed
      - A workable backup is named without unsafe improvisation
      - The recipient can speak choose or decline within the arrangement
    - title: Close the handoff and rebalance the burden
      instructions: Confirm with the recipient or authorized recipient of the handoff what was completed
        and what remains. Ask whether the help felt useful or controlling. Record time and burden broadly
        enough to decide whether the same arrangement is sustainable, then renegotiate one overloaded
        or unowned part. An appointment attended is not evidence that the clinical issue was resolved;
        an unsuccessful transport attempt still needs an explicit safe next owner.
      checks:
      - Completion and remaining tasks have named owners
      - Usefulness and agency are reviewed separately
      - Caregiver burden informs one adjustment
      - No clinical outcome is inferred from logistics
    adaptation: Use a phone call, written preferences, an interpreter or trusted decision supporter with
      permission. Without an appropriate care role, use the supplied transport scenario and label the
      handoff untested. Urgent deterioration or unsafe care requires appropriate medical, safeguarding
      or emergency help, not this exercise.
    review: Did the support remove a burden while preserving the person’s say, and who now owns the part
      that remains?
    examples:
      supportive: Transport and access were confirmed, the recipient kept control of visit questions and
        a backup owner accepted the return trip.
      mixed: The journey worked, but the helper answered too quickly for the recipient and changed that
        arrangement next time.
      contradictory: The helper took over treatment or finances without authority, or left a dependent
        person without a safe handoff.
      inconclusive: A care checklist was written but neither an agreed task nor an actual or labeled simulated
        handoff occurred.
  '19.04':
    title: Prepare an informed reproductive-health conversation without guessing treatment
    goal: Use medically reliable information and explicit personal values to identify reproductive questions,
      uncertainty and the appropriate qualified care route.
    scope_note: This is education and consultation preparation, not a fertility prediction, contraceptive
      prescription, pregnancy diagnosis or obligation to pursue parenthood.
    burden: Two 20-minute source-and-question sessions, followed by a routine qualified inquiry when a
      real question is current.
    setup: 'Use three supplied cases: an adult wants to avoid pregnancy; another is considering pregnancy
      and prenatal care; another has questions about difficulty conceiving or reproductive aging. Use
      current public information from a health authority or relevant clinical professional body, noting
      country and review date. No private sexual history belongs in application evidence.'
    actions:
    - title: Separate the decision, values and medical unknowns
      instructions: For each case, identify the desired outcome, whose body and decision are involved,
        and one value or practical constraint such as reversibility, privacy, access or timing. Write
        what remains medically unknown rather than estimating fertility from appearance, age alone or
        a calendar guess. Distinguish contraception, infection prevention, pregnancy care, infertility
        evaluation and age-related questions; an answer about one does not settle the others.
      checks:
      - All three cases have an explicit desired outcome
      - Bodily autonomy and relevant values are identified
      - Medical unknowns are left unresolved rather than guessed
      - Five different reproductive topics are not conflated
    - title: Build a small source-to-question record
      instructions: Inspect one current official contraception source and one qualified fertility or pregnancy-care
        source. For each, write the exact limited question it answers, its intended population and what
        requires individualized advice. Prepare questions such as Which options fit my health and preferences,
        What preparation or prenatal care should I discuss, and When should my situation receive evaluation.
        Do not turn a population guideline into a personal deadline or change a method based only on this
        worksheet.
      checks:
      - Sources have an identifiable medical authority and date
      - Each source is tied to a limited question
      - Population guidance is separated from personal suitability
      - No treatment method or timing is prescribed by the exercise
    - title: Take the appropriate information-gathering step
      instructions: For a real current question, contact an appropriate licensed service through its verified
        channel to ask about appointment type, access, confidentiality and information to bring. Use a
        qualified interpreter or accessible format when needed. For the fictional cases, rehearse a concise
        question and mark the referral uncontacted. Record the next step and remaining uncertainty, including
        the legitimate choice not to pursue a reproductive pathway; urgent symptoms are not held for a
        routine educational review.
      checks:
      - A real inquiry or clearly labeled rehearsal occurs
      - Access confidentiality and appropriate service type are checked
      - Unanswered questions have a qualified next route
      - No reproductive role or outcome is treated as compulsory
    adaptation: Use publicly available cases, translated clinical material or a supported consultation
      instead of disclosing personal history. Follow local law and professional guidance. A current safety
      concern, coercion, pregnancy complication or urgent symptom requires appropriate immediate support
      rather than completing the study sequence.
    review: Which question became clearer, which remains individual and medical, and how will the next
      decision preserve informed voluntary choice?
    examples:
      supportive: The participant distinguished contraception from infection protection and prepared an
        individualized consultation without choosing a method from a generic rule.
      mixed: The sources were reliable, but one age-related statistic was initially treated as a personal
        prediction and corrected.
      contradictory: The worksheet became a prescription, a fertility guarantee or pressure for a partner
        to accept a reproductive choice.
      inconclusive: Several websites were collected without evaluating scope or forming a qualified-care
        question.
  '19.05':
    title: Build a pregnancy-to-postpartum support handoff centered on the person receiving care
    goal: Prepare an agreed support arrangement that protects the pregnant or postpartum person’s safety,
      consent, recovery and access to care without transferring decision authority to helpers.
    scope_note: This is support planning around qualified maternity and infant care, not birth management,
      medical triage, infant-care certification or a substitute for urgent evaluation.
    burden: A 30-minute planning conversation, one 15-minute tabletop interruption and a short confirmed
      support handoff.
    setup: Use an existing maternity care plan with permission, or the supplied fictional case of a person
      returning home after birth who wants meals and visitor limits. Prepare headings for care contacts,
      the person’s choices, recovery support, infant-care responsibilities, mental-health support, visitor
      rules and backup coverage.
    actions:
    - title: Let the pregnant or postpartum person set the support priorities
      instructions: Ask what assistance is welcome and what decisions they want protected from interference.
        Distinguish a support person, an authorized medical decision-maker where applicable and an infant
        caregiver; these are not interchangeable roles. Read the care team’s current instructions and
        an official maternal warning-sign resource together when appropriate. Identify how concerns will
        reach qualified care promptly, including mental-health or safety concerns, without asking a family
        helper to decide whether symptoms are serious enough.
      checks:
      - Support preferences come from the person or authorized process
      - Helper medical and infant-care roles are distinguished
      - Current professional instructions are identified
      - Physical mental-health and urgent-help routes are explicit
    - title: Assign recovery and infant-support work with consent
      instructions: Allocate one meal, household or transport task and the accompanying completion signal.
        Separately identify who is qualified and willing to provide any infant care, following the established
        care instructions rather than improvising handling, feeding or sleep arrangements. Agree visitor
        and privacy limits, a rest opportunity and how a helper asks before touching or sharing information.
        Keep an uncovered task visible; do not solve it by presuming the recovering person will silently
        absorb it.
      checks:
      - One concrete support task has an accepting owner
      - Infant-care responsibilities follow qualified existing guidance
      - Visitor privacy and bodily-consent limits are stated
      - Uncovered work is visible rather than silently reassigned
    - title: Test one disruption and confirm the real handoff
      instructions: 'Use a spoken scenario: the planned helper becomes unavailable and the person reports
        feeling unexpectedly unwell. Rehearse contacting the agreed qualified care route and backup; do
        not simulate symptoms, interrupt treatment or call an emergency line for practice. Then confirm
        one actual support arrangement and its review time. Ask whether the plan reduces burden and preserves
        agency. If concerning symptoms are present now, seek appropriate care immediately instead of treating
        the scenario as a rehearsal.'
      checks:
      - A helper-unavailable disruption is rehearsed without false emergency calls
      - Current symptoms trigger real qualified help rather than practice
      - One actual support handoff is confirmed
      - Safety agency and burden are reviewed together
    adaptation: Use an accessible written plan, interpreter or trusted supporter chosen by the person.
      A fictional plan is useful preparation but not evidence of live perinatal support. Clinical instructions
      and local emergency services remain authoritative; no one must disclose birth experiences or mental-health
      history to complete a rehearsal.
    review: Which decision stayed with the pregnant or postpartum person, which burden gained a reliable
      owner, and what happens before the next helper fails to arrive?
    examples:
      supportive: The person chose visitor limits, a meal owner confirmed the handoff and the backup knew
        how to contact the maternity team promptly.
      mixed: Tasks were assigned, but the first plan treated infant care and medical authority as the
        same role; they were separated.
      contradictory: Helpers overrode consent, dismissed concerning symptoms or delayed real urgent care
        to finish the planning exercise.
      inconclusive: A birth checklist was copied without the person’s preferences, confirmed task owners
        or an interruption test.
  '19.06':
    title: Offer reproductive-grief support without fixing its meaning
    goal: Provide a specific, consented form of support after miscarriage, infertility or another reproductive
      loss while respecting privacy, ambiguity and differences in grief.
    scope_note: The practice concerns the supporter’s behavior, not a grief timetable, medical recovery,
      the cause of a loss or whether another pregnancy would resolve it.
    burden: Fifteen minutes to prepare, one brief welcome contact and one agreed follow-up; use a fictional
      case when contact is not appropriate.
    setup: 'Use the default of someone mentioning that fertility treatment or a pregnancy did not go as
      hoped. Prepare three possible offers: quiet listening, a meal or transport, and help finding a qualified
      support resource. Do not seek out someone’s private loss to create a practice opportunity.'
    actions:
    - title: Remove assumptions before choosing your words
      instructions: 'Write a short acknowledgment such as I am sorry this has been difficult; you do not
        have to explain. Identify three assumptions to avoid: that you know the meaning of the loss, that
        partners grieve identically, and that a future child or positive lesson cancels it. Notice possible
        medical burden and relationship strain without asking for details. Choose a message that permits
        silence and does not attach blame, spiritual explanation or a demand for disclosure.'
      checks:
      - The acknowledgment does not presume the meaning of the loss
      - Different grief responses remain legitimate
      - Medical burden and privacy are recognized without interrogation
      - Blame replacement and forced-positive explanations are excluded
    - title: Ask once what kind of support is welcome
      instructions: 'In an appropriate existing relationship, offer one or two concrete choices: I could
        leave a meal Tuesday, listen, or give you space. Accept a refusal or no answer without repeated
        probing. If they want to talk, follow their language, listen without comparing losses and ask
        before suggesting a resource. Keep practical help independent of whether they share details or
        express gratitude. A fictional rehearsal must include a declined offer and a response that respects
        it.'
      checks:
      - Contact is welcome or clearly labeled as rehearsal
      - Support choices are concrete and limited
      - A decline silence or different preference is respected
      - Practical care is not conditional on disclosure or gratitude
    - title: Deliver the promised support and review your assumptions
      instructions: Carry out the accepted low-risk offer at the agreed time or send one appropriate update
        if you cannot. Follow up only as welcomed, asking whether the support should continue, change
        or stop. Note what you learned about your own tendency to minimize, solve or impose meaning, not
        the person’s private story. Current medical concerns, severe distress or safety concerns call
        for appropriate qualified help; this exercise does not require waiting for a particular duration.
      checks:
      - An accepted promise is fulfilled or explicitly renegotiated
      - Follow-up follows the recipient’s preference
      - The review concerns the supporter’s conduct not private grief details
      - Current medical or safety concerns are not delayed
    adaptation: Use a note, practical errand or quiet presence instead of conversation. A supporter without
      a live opportunity can rehearse the supplied case; no fabricated loss or emotional disclosure is
      needed. Use qualified reproductive-health, grief or crisis support when the situation exceeds ordinary
      friendship care.
    review: Did your support leave room for the person’s own meaning and pace, and what did you refrain
      from saying that would have made the burden heavier?
    examples:
      supportive: The supporter accepted a request for a meal and no discussion, delivered it and did
        not treat a later pregnancy as erasing the loss.
      mixed: The initial message offered reassurance too quickly; the supporter acknowledged that and
        asked what would actually help.
      contradictory: The loss was blamed on the person, minimized, moralized or used to pressure treatment
        or future parenthood.
      inconclusive: A sympathy script was drafted but not rehearsed or connected to a concrete support
        action.
  '19.07':
    title: Make one family-belonging practice leave room for origins and loyalty
    goal: Create a small, authorized belonging practice in an adoptive, foster, stepfamily or chosen-family
      context without erasing history, identity or competing loyalties.
    scope_note: This is an ordinary family inclusion exercise, not placement advice, attachment treatment,
      legal-parentage determination or permission for contact that conflicts with a safety or legal plan.
    burden: Twenty minutes of preparation, one short willing conversation and one small shared activity
      or labeled case rehearsal.
    setup: 'Use a fictional family deciding how to display names and photographs in a shared space, or
      a similarly low-stakes situation in your actual authorized role. Prepare optional choices: a private
      keepsake, a chosen name label, a shared image, an empty space or no participation. Do not require
      anyone to call a person parent or reveal an origin story.'
    actions:
    - title: Identify whose history the proposed tradition could erase
      instructions: List who has authority over the space and who is affected by the decision, including
        the child’s or dependent person’s voice where relevant. Distinguish practical household membership
        from legal responsibility and emotional attachment. Ask what existing names, relationships or
        memories should not be overwritten. A prior loss or loyalty conflict may be relevant, but do not
        infer it from behavior or demand disclosure to justify keeping a memory private.
      checks:
      - Affected people and legal or care authority are distinguished
      - The child or dependent person has an accessible voice
      - Origins names and prior relationships are not overwritten by default
      - No attachment diagnosis or forced history is required
    - title: Offer a choice that permits more than one belonging
      instructions: Invite each willing participant to choose one low-risk element for the space or activity.
        Explain that retaining an earlier family connection or choosing privacy is not rejection of the
        current household. Use the same freedom for biological and nonbiological relationships without
        demanding equal feelings or labels. Check existing contact, confidentiality and safeguarding requirements
        before displaying a name or image; when unclear, use a neutral symbol or postpone that element.
      checks:
      - Participation and the chosen form are voluntary
      - More than one legitimate connection can coexist
      - Affection labels and equal feelings are not demanded
      - Contact image and confidentiality limits are checked
    - title: Try the arrangement and let the person revise it
      instructions: Install only the agreed element or conduct the fictional choice conversation, then
        ask privately after an ordinary use whether it feels comfortable, exposing or inaccurate. Allow
        removal or revision without a loyalty argument. Record the decision process and adjustment, not
        family history or a child’s words in application evidence. If the activity raises significant
        loss, conflict or legal questions, stop expanding it and use the relevant qualified family or
        placement support.
      checks:
      - Only agreed elements are put into use
      - A later revision or opt-out is genuinely available
      - Private family and child information stays outside evidence
      - Significant care or legal questions are referred appropriately
    adaptation: Use a story, language choice, meal or private object rather than photographs. People without
      an actual role use the fictional case only. Follow placement, custody, guardianship and child-safety
      requirements; chosen-family belonging does not itself confer legal authority.
    review: Whose history gained room rather than being replaced, and did the person truly have permission
      to belong in more than one way?
    examples:
      supportive: A child kept a private origin keepsake and chose a neutral shelf label without being
        asked to prove loyalty to the new household.
      mixed: The first display exposed more history than intended, so the family removed it and adopted
        a private option.
      contradictory: A person was required to reject an earlier relationship, use a parental title or
        violate a contact restriction to demonstrate belonging.
      inconclusive: Family inclusion was praised in general without a concrete choice, consent check or
        revised arrangement.
  '19.08':
    title: Rehearse a child-safety report without investigating the child
    goal: Recognize when a child-safety concern needs prompt protective action and use the correct local
      reporting route while avoiding leading questions, confrontation or concealment.
    scope_note: This is reporting-route preparation, not an investigation, diagnosis of abuse, legal certification
      or substitute for immediate protection. A current concern requires the appropriate real response
      rather than a rehearsal.
    burden: Twenty minutes to verify routes, a 10-minute fictional report rehearsal and a five-minute
      retrieval check.
    setup: 'Use a wholly fictional case: a child says an adult has asked them to keep frightening contact
      secret. Do not use a real child, make a false report or store identifying allegations in this application.
      Prepare headings for immediate safety, local reporting authority, role-specific obligations, minimal
      factual record and safe follow-up.'
    actions:
    - title: Verify who actually receives a report in your location
      instructions: Find the current child-protection or equivalent official reporting route and the emergency
        route for immediate danger. Check whether your actual role has mandatory-reporting duties, a deadline
        or a required reporting method; use authoritative local guidance or a qualified professional for
        uncertainty. Distinguish an informational website or support hotline from the agency that accepts
        reports. Record jurisdiction, date checked and channel privately, with a backup if the first route
        is unavailable.
      checks:
      - Jurisdiction and current receiving authority are verified
      - Immediate danger has a separate urgent route
      - Role-specific reporting obligations are checked rather than assumed
      - Information services are not mistaken for report-receiving agencies
    - title: Practice a factual protective response to the fictional disclosure
      instructions: 'Rehearse a calm response: Thank you for telling me; this is not your fault; I may
        need to involve people who can help keep you safe. Do not promise secrecy, ask the child to repeat
        details for practice, test credibility or question them about motives. In the fictional report,
        distinguish what was directly said, what you observed and what you do not know. Do not contact
        the alleged perpetrator, gather proof or protect family reputation before reporting.'
      checks:
      - The response avoids secrecy promises and blame
      - Direct statements observations and unknowns are separated
      - No leading interview credibility test or amateur investigation occurs
      - Protection takes priority over reputation and confrontation
    - title: Test retrieval and identify the next accountable step
      instructions: Retrieve the reporting channel without relying on memory and rehearse a concise handoff
        using fictional facts only. Identify how receipt or follow-up is handled under the local process
        and who can advise on safe ongoing support. Do not call an emergency line or submit a false concern
        for the exercise. If a genuine concern is present, stop rehearsing and make the appropriate prompt
        report or emergency contact; do not wait to complete this worksheet or obtain certainty.
      checks:
      - The correct channel can be retrieved promptly
      - The handoff contains only relevant factual information
      - No practice call or false report is made
      - A current concern triggers the real appropriate protective response
    adaptation: Use translated official guidance, an interpreter or your organization’s safeguarding lead
      without allowing an internal discussion to replace an externally required report. Keep any real
      record only in the authorized secure system. Requirements differ by location; professional or legal
      advice resolves uncertainty, not an invented universal rule.
    review: Could you move from concern to the correct protective route promptly while saying only what
      you know and leaving investigation to the authorized people?
    examples:
      supportive: The participant distinguished the information website from the receiving agency and
        rehearsed a factual report without questioning a child.
      mixed: The first route was outdated; the participant verified the current authority and added a
        backup before calling the plan ready.
      contradictory: The participant confronted an alleged perpetrator, conducted an amateur interview
        or delayed a real concern to preserve family reputation.
      inconclusive: Warning signs were memorized but no local receiving route or usable handoff was identified.
  '19.09':
    title: Replace one control-heavy instruction with supported responsibility
    goal: Match a child’s responsibility to current age, ability and context while using explanation,
      predictable limits and nonviolent proportionate follow-through.
    scope_note: Use only an authorized ordinary caregiving role. This is not behavior therapy, a discipline
      prescription for a clinical condition or permission to impose deprivation or physical punishment.
    burden: Twenty minutes of preparation and two short ordinary opportunities over a week.
    setup: 'Use the low-risk task of returning borrowed books to a basket. Prepare two versions: one book
      with a picture cue and a larger independently chosen group. Select the version from observed ability
      and existing care guidance, not a rigid age stereotype. Keep necessary food, rest, affection, medicine
      and communication unrelated to task performance.'
    actions:
    - title: Separate the actual limit from the adult’s preferred control
      instructions: 'State the practical reason: books need a known place so people can find them and
        walk safely. Identify which part is a genuine safety or shared-use limit and which is merely your
        preferred order or speed. Choose a small responsibility the child can understand and attempt with
        support. Explain what help is available and what a reasonable repair looks like if a book is left
        elsewhere; do not announce an unrelated punishment.'
      checks:
      - The practical reason and safety limit are explicit
      - Adult preference is separated from a necessary rule
      - The task matches observed ability and available support
      - A related repair replaces unrelated punishment
    - title: Give a real choice and help the child complete the repair
      instructions: Offer a bounded choice such as Which book will you return first, or Shall we carry
        one together. Model the action when needed, allow processing time and acknowledge a specific effort
        without buying compliance with affection. If the book remains out, calmly help restore the shared
        space and restate the expectation in an understandable form. Do not humiliate, threaten abandonment,
        hit or make the child responsible for managing your emotions.
      checks:
      - A bounded genuine choice is offered
      - Support and processing time are available
      - Follow-through is calm related and nonviolent
      - Affection and essential care are not conditional on performance
    - title: Review the expectation and adjust responsibility
      instructions: On the next ordinary opportunity, use what you observed to simplify, retain or modestly
        increase responsibility. Ask or notice whether the child understands the reason and can request
        help; independent obedience alone is not the goal. Record your own use of explanations, support
        and proportionate limits, not a character score for the child. Persistent difficulty, distress
        or safety concerns require appropriate qualified guidance rather than escalating the consequence.
      checks:
      - A second opportunity informs the adjustment
      - Understanding help-seeking and capability are considered
      - The adult’s conduct is reviewed rather than the child’s worth
      - Difficulty does not automatically escalate punishment
    adaptation: Use pictures, AAC, tactile markers, a seated task or a shorter sequence. A person without
      authority can compare the two fictional task versions and rehearse the explanation. Respect professional
      care plans and seek guidance for significant behavioral, developmental or safety concerns.
    review: What responsibility was genuinely learnable, and which part of your original instruction served
      adult control rather than safety or growth?
    examples:
      supportive: A picture cue and shared demonstration let the child return a book and later choose
        to do the next one independently.
      mixed: The rule was reasonable, but the first task was too large; the caregiver reduced it and preserved
        the explanation.
      contradictory: The adult used humiliation, pain, deprivation or threats of lost affection to secure
        compliance.
      inconclusive: A rule and consequence were written without explaining the reason or testing a supported
        responsibility.
  '19.10':
    title: Teach one family skill while making your own example visible
    goal: Transmit a practical skill and its ethical or cultural meaning through demonstration, guided
      participation and the learner’s own explanation rather than mere compliance.
    scope_note: Use a willing family member and an age-appropriate safe task within your role. Teaching
      a family value does not require agreement with every belief or surrender of the learner’s voice.
    burden: Fifteen minutes to prepare, one 15-minute learning interaction and a short independent retry
      or labeled rehearsal.
    setup: Default to returning a borrowed book with a clear note about its condition. Use your own or
      fictional book, paper and a willing learner. The practical sequence is inspect, identify the owner,
      prepare a truthful return message and choose a permitted return route. Do not use private accounts,
      online posting or valuable borrowed property for practice.
    actions:
    - title: Select what your example will actually teach
      instructions: 'Name the practical capability and two meanings: care for another person’s property
        and honest communication about damage. Identify a family or cultural custom that may shape the
        return, such as a greeting or thanks, while distinguishing it from a universal rule. Prepare to
        model a mistake calmly: noticing a bent page is a reason to disclose and repair, not hide or blame.
        Ask what the learner already knows and what they would do differently.'
      checks:
      - The practical capability and ethical meaning are distinct
      - A cultural or worldview element is identified without universalizing it
      - The adult prepares an honest regulated response to a mistake
      - The learner’s prior knowledge and voice are invited
    - title: Demonstrate and let the learner explain a decision
      instructions: Show the inspection and a short return message, thinking aloud about why truth matters
        more than looking flawless. Let the learner choose words and explain how they know the return
        route is legitimate. When a message or online claim is involved, compare the actual owner’s instruction
        with an unverified forwarded instruction rather than teaching automatic trust. Correct the task,
        not the learner’s identity, and welcome a question about the custom or value.
      checks:
      - The skill is demonstrated with reasons
      - The learner makes and explains a real choice
      - An information or media judgment is checked against an actual source
      - Questions about the value or custom are permitted
    - title: Step back for a safe retry and revise your teaching
      instructions: Ask the learner to repeat the safe sequence with another ordinary or fictional book,
        using the support they need. Notice whether they can explain the purpose, identify uncertainty
        and request help, not just copy your words. Ask what instruction was unclear or unnecessary and
        change one part. For an actual return, preserve the owner’s rules and your authority. Record only
        the learning process, not a child’s private response or family belief profile.
      checks:
      - A safe retry gives room for independent action
      - Purpose uncertainty and help-seeking are observed
      - Learner feedback changes one teaching choice
      - Private beliefs and child information stay outside evidence
    adaptation: Use drawing, oral storytelling, signed or supported communication, and a different safe
      household skill. Without a willing learner, rehearse both teacher and learner responses on the case
      and label teaching transfer untested. Do not use indoctrination, humiliation, unsafe tools or unauthorized
      online access.
    review: What did your behavior teach beyond the words, and could the learner question, explain and
      adapt the skill rather than merely obey?
    examples:
      supportive: The learner wrote an honest return note in their own words and explained why a forwarded
        instruction needed checking.
      mixed: The practical steps were learned, but the teacher treated a family greeting as compulsory;
        the next attempt allowed a respectful alternative.
      contradictory: The adult concealed their own error, punished a question about a belief or treated
        compliance as the only evidence of learning.
      inconclusive: Family values were recited without a demonstration, learner decision or retry.
  '19.11':
    title: Prepare a later-life care decision without assuming loss of personhood
    goal: Clarify the person’s preferences, available decision support, appropriate authority and sustainable
      next step when memory or care needs change.
    scope_note: This is planning and qualified-consultation preparation, not a capacity assessment, dementia
      diagnosis, legal directive or permission to remove someone’s autonomy.
    burden: Two 20-minute planning periods and one actual qualified or authorized coordination inquiry
      when relevant.
    setup: Use the fictional case of an older adult who wants to remain involved in appointments but is
      missing some reminders. Prepare separate headings for preference, observed change, immediate safety,
      decision support, legal authority, care task, respite and disputed issue. Do not infer incapacity
      from age, diagnosis or forgetfulness alone.
    actions:
    - title: Separate observed changes from the decision needing support
      instructions: Describe only the missed reminders and what consequence followed, keeping explanations
        open. Ask the person what matters about appointments, familiar routines and privacy, using their
        preferred communication supports. Identify any immediate safety concern for qualified care rather
        than diagnosing it yourself. Distinguish everyday assistance from decisions requiring a legally
        authorized person, and note which existing care or advance-planning documents should be reviewed
        by the appropriate professional.
      checks:
      - Observed change is separated from a diagnosis or capacity verdict
      - The person’s preferences are actively sought
      - Immediate safety concerns have a qualified route
      - Everyday help and formal decision authority are distinguished
    - title: Compare a less-restrictive support with its practical burden
      instructions: For the default, compare a visible reminder plus a chosen support call with another
        person taking over all appointment communication. Ask which option preserves participation, what
        risk remains and who can reliably provide it. Include memory support, transport, respite and family
        disagreements as separate tasks or questions. Do not hold a family vote that substitutes for the
        person’s rights or required authority; unresolved legal or clinical questions go to qualified
        local guidance.
      checks:
      - Two support options are compared for participation and risk
      - The less-restrictive workable option is considered
      - Care respite and disagreement have explicit dispositions
      - A family preference is not mistaken for legal or clinical authority
    - title: Arrange the next supported decision and review point
      instructions: With the appropriate permission, contact the relevant care team, planning professional
        or authorized coordinator about the unresolved question and what information they need. Confirm
        one ordinary support task and a review trigger such as another missed appointment or a stated
        change in preference. A fictional case may rehearse this handoff but cannot claim a professional
        decision was obtained. Revisit the plan when needs change; completing a document does not eliminate
        the need to listen to the person.
      checks:
      - A real qualified inquiry or labeled rehearsal occurs
      - One ordinary support task has an accepting owner
      - Changing needs or preferences trigger review
      - Planning documents do not replace ongoing participation
    adaptation: Use accessible communication, supported decision-making, a trusted person selected by
      the individual and more time. Keep clinical, financial and legal records in their proper secure
      systems. Urgent confusion, unsafe care or other current medical concerns require qualified assessment
      rather than a planning exercise.
    review: Which choice stayed with the person, which uncertainty needs qualified judgment, and who will
      carry the support without becoming exhausted?
    examples:
      supportive: The person chose a reminder call, an authorized coordinator checked the planning question
        and a respite backup was named.
      mixed: The family agreed on help, but the first version assumed a diagnosis removed all decision
        rights; that assumption was corrected.
      contradictory: Relatives took over finances or care decisions without authority, ignored the person’s
        wishes or treated age as incapacity.
      inconclusive: A dementia checklist was completed without a specific decision, preference or accountable
        next step.
  '19.12':
    title: Make one family workflow’s invisible labor negotiable
    goal: Expose the noticing, planning, emotional, financial and practical work behind one recurring
      family responsibility and negotiate a fairer complete handoff.
    scope_note: This is a small workload agreement among willing participants, not a valuation of human
      worth or a demand that unequal capacity produce equal hours.
    burden: A 20-minute workflow map, one 20-minute willing discussion and a review after the next occurrence.
    setup: 'Use arranging a routine family meal: noticing the need, checking preferences, planning, obtaining
      supplies, paying, preparation, welcoming, cleanup and remembering what ran out. Choose a simpler
      shared task when meals involve health or safety complexity. Record broad effort and ownership, not
      private budgets or sensitive care details.'
    actions:
    - title: Map the whole responsibility before counting visible effort
      instructions: Write who notices, decides, reminds, coordinates, pays, performs, comforts and follows
        up for the selected task. Mark work nobody currently owns and work completed silently by default.
        Include the cost of interruptions and emotional reassurance without treating someone’s feelings
        as an invoice. Ask each willing participant to correct the map. Distinguish a present capacity
        constraint from an unexamined assumption about gender, age, income or who is naturally better
        at care.
      checks:
      - Noticing planning doing and follow-up are all visible
      - Emotional logistical and financial work are included
      - Unowned and default-owned tasks are identified
      - Participants can correct role assumptions and capacity estimates
    - title: Negotiate a complete unit rather than assigning more reminders
      instructions: Choose one unit to transfer, such as planning and obtaining the needed supplies within
        an agreed limit, not merely carrying bags when prompted. Define the outcome, authority, resources,
        access needs and when help should be requested. Ask the proposed owner to accept or suggest a
        feasible alternative. Keep essential care covered and do not use income, gratitude or relational
        pressure to force agreement. Fairness may require unequal tasks because capacity and other responsibilities
        differ.
      checks:
      - The transferred unit includes its planning and follow-up
      - Authority resources and a help trigger are agreed
      - The receiving person explicitly accepts the unit
      - Essential care and unequal capacity remain protected
    - title: Review the next occurrence for hidden rework
      instructions: At the next ordinary occurrence, let the accepted owner manage the unit within the
        agreement. Review whether someone else still had to notice, remind, rescue or redo it, and whether
        the standard was clear or unnecessarily exacting. Adjust one ownership boundary or resource rather
        than silently returning everything to the original person. Record what was delivered and what
        remains; a pleasant conversation alone does not demonstrate redistribution.
      checks:
      - The agreed unit is attempted in a real occurrence
      - Reminder rescue and rework burdens are checked
      - Standards and resources are reviewed alongside performance
      - One concrete ownership adjustment follows the review
    adaptation: Use a visual map, short voice notes or a facilitated discussion. Solo caregivers may map
      a task with an external support provider; a fictional case tests negotiation only. Do not withdraw
      essential care, expose private finances or conduct a confrontation where coercion or retaliation
      is likely.
    review: Who stopped carrying the task in their head, who gained real authority, and what hidden work
      still needs a fair owner?
    examples:
      supportive: The new owner planned supplies and noticed the next shortage without reminders, while
        the family adjusted the spending limit together.
      mixed: Visible work moved, but the original person still managed every reminder; the unit was redefined
        more completely.
      contradictory: The map became a gendered blame ledger or a reason to withdraw essential care until
        someone complied.
      inconclusive: Tasks were listed but no complete unit was accepted, tried or reviewed.
  '19.13':
    title: Protect a dependent person during one family-transition handoff
    goal: Create a clear, authorized transition handoff that protects children or dependents from being
      messengers, leverage or collateral in adult conflict.
    scope_note: Use existing custody, guardianship, care and safety arrangements. This does not draft
      a parenting order, mediate abuse, determine contact rights or require direct communication with
      an unsafe person.
    burden: Twenty minutes to prepare, a 10-minute fictional disruption and one permitted real handoff
      or rehearsal.
    setup: 'Default to a routine pickup after a change in household arrangements. Prepare only the necessary
      neutral facts: permitted time and place, authorized adults, required belongings, access or care
      instructions, confirmation channel and exception route. Keep allegations, relationship arguments
      and private child statements outside the handoff.'
    actions:
    - title: Separate the dependent person’s needs from the adult dispute
      instructions: 'Identify what the child or dependent needs for continuity: a predictable explanation,
        required items, authorized care information and a safe arrival. Check the current legal or professional
        arrangement and who may communicate or collect them. State the adult issue separately without
        asking the dependent to choose sides or carry it. When authority or safety is disputed, seek the
        appropriate qualified route rather than inventing a compromise that bypasses an order or protection
        plan.'
      checks:
      - Continuity needs are explicit and age or ability appropriate
      - Current authority and safety arrangements are checked
      - The dependent is not made a messenger or decision-maker for adult conflict
      - Unresolved legal or safety questions are escalated appropriately
    - title: Write a neutral handoff with one exception process
      instructions: 'Prepare a concise message containing the permitted plan, necessary items and how
        receipt will be confirmed. Add a process for a delay: the authorized adult uses the approved channel
        and follows the existing exception arrangement. Do not insert criticism, demand a relationship
        discussion or condition care on a concession. Rehearse the message through a neutral third party
        or approved system when direct contact is unsafe or prohibited.'
      checks:
      - The message contains only necessary handoff facts
      - Receipt and delay handling use an approved channel
      - Care is not conditional on an adult concession
      - Unsafe or prohibited direct contact is not required
    - title: Test a disruption and complete the accountable transfer
      instructions: Use a paper scenario in which the planned collector is delayed or a new partner offers
        to collect instead. Check authorization before changing the plan and identify the safe existing
        fallback; do not experiment with a child’s pickup. For a real permitted handoff, confirm transfer
        through the approved method and review any confusion with the responsible adults, not through
        the dependent. Revise the communication within existing rules and use qualified help for changes
        those rules do not permit.
      checks:
      - A delay or substitute-collector scenario checks authorization
      - No live child-safety test is staged
      - A real transfer or labeled rehearsal has a clear endpoint
      - Review avoids triangulation retaliation and unauthorized changes
    adaptation: Use an accessible shared schedule, approved co-parenting system, interpreter or authorized
      intermediary. People without such a role use the fictional case. In coercive or abusive situations,
      follow specialist safety and legal guidance rather than ordinary collaborative co-parenting advice.
    review: What made the transition predictable for the dependent person, and which adult issue stayed
      out of their responsibilities?
    examples:
      supportive: The approved channel confirmed the pickup and a delay was handled by adults without
        using the child to carry messages.
      mixed: The facts were clear, but unnecessary criticism entered the first message and was removed
        before use.
      contradictory: A child was asked to choose sides, essential care was withheld for leverage or a
        contact restriction was bypassed.
      inconclusive: A transition plan was described without checking authority or defining a safe transfer
        endpoint.
  '19.14':
    title: Carry one family tradition forward with permission to revise it
    goal: Transmit a meaningful story, language, celebration, mourning practice, value or practical skill
      while allowing participants to question or change harmful elements.
    scope_note: One chosen tradition can support continuity without becoming a test of loyalty, cultural
      authenticity, religious agreement or compulsory disclosure.
    burden: Twenty minutes to prepare, one 20–40 minute accessible activity and a short participant-led
      review.
    setup: 'Use the supplied low-cost tradition of sharing the story and method of a familiar household
      object or recipe without preparing food. Bring a picture, safe object or spoken description. Offer
      alternatives: listen, tell a different memory, translate a word, demonstrate a safe step or opt
      out.'
    actions:
    - title: Separate the inherited good from the inherited pressure
      instructions: 'Identify what this tradition carries: a story, language phrase, celebration or mourning
        meaning, value and practical knowledge. Mark which elements are genuinely present rather than
        forcing all forms into one event. Name a good worth preserving and an element that could exclude
        or harm, such as compulsory attendance, a derogatory story or pressure to profess a belief. Ask
        the relevant person’s permission before sharing their story, especially where loss or private
        history is involved.'
      checks:
      - The actual forms of heritage are identified without invented coverage
      - A valuable continuity and a possible harm are distinguished
      - Permission is checked for another person’s story
      - Attendance belief and disclosure are not loyalty tests
    - title: Host a small version with a legitimate alternative
      instructions: Introduce the activity and explain why it matters to you without claiming it must
        mean the same to everyone. Demonstrate the safe practical element, explain a chosen word or tell
        the consented story, then invite questions and other memories. Provide a real alternative such
        as listening quietly, using another language or contributing a different tradition. Stop or revise
        a derogatory or coercive element instead of defending it solely because it is old.
      checks:
      - The activity conveys a concrete story word or skill
      - Personal meaning is not imposed as a shared requirement
      - Participants can choose an accessible alternative or decline
      - A harmful element can be interrupted or revised
    - title: Let the next generation or participant shape the continuation
      instructions: Ask what should be kept, changed, recorded privately or left unrecorded. Agree one
        small revision and test it in the next short retelling or demonstration, such as adding another
        language or omitting an exclusionary line. Credit the contributor and respect permission for storage
        or sharing. Record only the process and agreed change in evidence; a warm event does not prove
        that every participant felt belonging or that a family conflict was repaired.
      checks:
      - Participants influence what continues
      - One revision is tried rather than merely welcomed in principle
      - Credit and recording permission are respected
      - Belonging and repair are not inferred for everyone
    adaptation: Use oral, tactile, visual or signed forms and no-cost materials. Chosen family or a solo
      reflection on inherited practices can be used, but solo work does not establish communal transmission.
      Mourning rituals remain optional and should not force grief disclosure or replace needed support.
    review: What meaning survived because you allowed change, and whose voice now has a place in the tradition’s
      next version?
    examples:
      supportive: A family story retained its practical lesson while a younger participant added another
        language and removed an exclusionary joke.
      mixed: The activity was welcoming, but recording permission was unclear; the organizer kept it unrecorded
        and clarified future consent.
      contradictory: Nostalgia was used to require belief, excuse derogatory content or pressure someone
        to disclose a painful history.
      inconclusive: A tradition was named without any transmission, participant choice or concrete revision.
  '19.15':
    title: Replace one exhausted-caregiver gap with a confirmed respite handoff
    goal: Make caregiver limits explicit and distribute one care responsibility safely enough that rest
      does not depend on abandoning the person receiving care.
    scope_note: This is a bounded support arrangement, not a burnout diagnosis, substitute for professional
      respite assessment or permission to stop essential care without a safe transfer.
    burden: Twenty minutes to identify the gap, one coordination conversation and one short confirmed
      coverage period with review.
    setup: Use an actual authorized care role or the fictional case of a caregiver who handles every appointment
      reminder and cannot take an uninterrupted afternoon. Prepare a private coverage card with the essential
      task, authorized competent backup, permitted scope, urgent route, start and end, and confirmation
      signal. Exclude clinical details from application evidence.
    actions:
    - title: Name the limit before resentment becomes the only signal
      instructions: 'Describe one recurring sign that the present arrangement is unsustainable, such as
        missed sleep opportunity, repeated errors or having no protected time, without diagnosing yourself.
        Separate exhaustion, resentment and a sense of being trapped from the recipient’s worth or need
        for care. List essential tasks, optional extras and work that can be shared. State one bounded
        limit: I need a two-hour coverage period, not I will disappear until people notice.'
      checks:
      - A concrete sustainability problem is identified
      - Caregiver feelings are separated from blame or recipient worth
      - Essential optional and shareable tasks are distinguished
      - The proposed limit has a safe specific scope
    - title: Find an accepting competent backup and test the information
      instructions: Ask an appropriate family member, authorized service or coordinator to cover one defined
        period or task. Check willingness, competence, authority, access and cost before counting the
        gap as covered. Give only the necessary information through the permitted secure channel, and
        ask the backup to explain the task, boundaries and when to seek help. If nobody can safely accept
        it, contact an appropriate support service; do not claim the plan works or leave essential care
        uncovered.
      checks:
      - The backup explicitly accepts the task and interval
      - Competence authority access and cost are checked
      - A teach-back confirms limits and escalation
      - An unfilled gap remains visible and triggers further support
    - title: Take the agreed break and close the transfer
      instructions: After the safe handoff is confirmed, use the protected period for a freely chosen
        restorative activity rather than monitoring every detail unless the care plan requires it. At
        the end, confirm what occurred, any issue and who now holds responsibility. Ask whether the arrangement
        relieved burden for the caregiver without shifting an unmanageable burden to someone else. Retain,
        change or seek professional support for the next coverage period; one break does not establish
        that chronic exhaustion is resolved.
      checks:
      - A real protected period follows a confirmed safe transfer
      - The return handoff closes responsibility clearly
      - Burden on both caregiver and backup is reviewed
      - Long-term exhaustion is not declared resolved from one break
    adaptation: Start with a smaller task, remote administrative support or a qualified service when hands-on
      coverage is not available. A fictional rehearsal is preparation only. Imminent unsafe care, medical
      deterioration, abuse or a caregiver unable to maintain safety requires immediate appropriate help
      rather than waiting for routine respite.
    review: Was the break genuinely protected, was care safely owned throughout, and what recurring support
      is still missing?
    examples:
      supportive: A competent backup accepted a bounded interval, the caregiver took a real break and
        both confirmed the return handoff.
      mixed: The backup covered the task, but repeated unnecessary check-ins prevented rest; the communication
        arrangement was revised.
      contradictory: Essential care was withdrawn to make a point or an untrained unwilling person was
        treated as a safe replacement.
      inconclusive: Respite was scheduled on paper without an accepting backup or an actual safe transfer.
