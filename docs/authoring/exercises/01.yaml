schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '01'
exercises:
  '01.01':
    title: Compare three good lives through one ordinary choice
    goal: Explain competing accounts of flourishing and use their differences to make one defensible choice.
    scope_note: This compares three lenses on one choice. Wider flourishing includes faith, freedom, relationships,
      service and contentment; the optional fourth lens begins that extension without settling every account.
    burden: About 30 minutes of comparison, one ordinary choice, and a 10-minute review.
    setup: Use paper or an offline note. Work with a free afternoon divided between rest, keeping a promise,
      and learning something useful; substitute an equally small real choice if preferred. The learning guide
      contains a complete fictional practice and a separate changed-case check. Choose that route when a real
      situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Give three accounts a fair hearing
      instructions: Describe a good afternoon through character development, obligations to others, and overall
        benefit. For each, write its recommended choice, strongest reason, and one good it might neglect. Add
        a faith, freedom, care, or contentment perspective if it changes the answer. Do not rank people by
        their preferred account.
      checks:
      - Three distinct reasons are explained
      - Each account has a genuine limitation
      - The same choice is used for comparison
    - title: Make the tradeoff visible
      instructions: Allocate the afternoon's actual available time. Explain which account drives the allocation
        and what another account would change. For example, keeping a short promise before resting may protect
        reliability and recovery while postponing learning. Try the allocation once, or walk through the supplied
        case if no free time is available.
      checks:
      - An allocation is specified
      - A forgone good is named
      - The allocation is tried or explicitly simulated
    - title: Test the account against changed circumstances
      instructions: Reconsider the afternoon with an exhausted person, a dependent needing help, or an urgent
        promise. State what changes and why. Keep or revise your original reasoning, explaining how circumstances
        influence flourishing without making one lifestyle mandatory.
      checks:
      - A changed circumstance is considered
      - Reasoning is revised or defended
      - A limit on generalization is recorded
    adaptation: Explain the comparison aloud or with three symbols. Rest and receiving care may be the whole
      appropriate afternoon; no purchase, productivity target, or religious commitment is required.
    review: Which account illuminated a neglected good, and where would your chosen rule fail?
    examples:
      supportive: The allocation protected a promise and rest, and its author explained why urgent care would
        change it.
      mixed: Three accounts were named but two gave indistinguishable reasons; the comparison needs clarification.
      contradictory: The comparison dismissed rest as laziness or treated another person's way of life as inferior.
      inconclusive: A preference was stated without explaining any competing account or testing a choice.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.01'
      title: Compare three good lives through one ordinary choice
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: Character accounts ask what habits a choice cultivates; duty accounts ask what is owed; consequence
          accounts compare benefits and burdens. A freedom account protects meaningful choice; care attends
          to particular dependency; contentment asks what is enough. Faith traditions may locate flourishing
          in relationship to the sacred, with differing interpretations. These are lenses, not exhaustive summaries
          or personality types.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: Neri has 180 discretionary minutes, no spending and no urgent duty. A previously promised neighbor
          call takes 20 minutes; the neighbor expects it today. Rest could use 60–160 minutes; an available
          reading lesson takes 50. Neri slept poorly but has no supplied medical concern. No one has agreed
          to cancel the call.
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Compare three accounts, then one additional lens. Allocate 180 minutes or less, name what each
          reason protects and what it leaves out. Reconsider if an essential care duty takes 70 minutes.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A person has 90 minutes, a promised 15-minute call and optional 60-minute class. They choose
          call 15/rest 75. Explain two genuinely different reasons and a cost; does missing the class establish
          a worse life?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'A defensible first plan is call 20, rest 100, lesson 50, spare 10. Duty explains the promise;
          character may emphasize reliable habits; consequences compare fatigue and benefit. These reasons
          need not select different plans. After care 70 only 110 discretionary minutes remain: call 20/rest
          90 is defensible, with learning forgone. Partial: totals fit but all reasons say only “best.” Incorrect:
          add care without reducing 180. Other allocations can meet the same responsibilities.'
        criteria:
        - Distinct reasons are explained
        - Time and commitments fit the facts
        - A legitimate forgone good remains visible
      - id: changed-case-check
        title: Check the changed case
        body: Duty can support the promised call; care or contentment can support room for recovery. The class
          opportunity is lost, not worthless. No global life ranking follows; a sound alternative may use the
          class if capacity fits.
        criteria:
        - Distinct reasons are explained
        - Time and commitments fit the facts
        - A legitimate forgone good remains visible
  '01.02':
    title: Write a worldview that can be questioned
    goal: Articulate present convictions, unresolved questions, and conditions for revising them.
    scope_note: The six headings connect the principal worldview questions. One tension check develops coherence;
      it cannot establish the truth of every belief or replace sustained philosophical study.
    burden: About 30 minutes to draft and examine one tension; 10 minutes for a later reread.
    setup: 'Use six headings: reality, human nature, knowledge, morality, suffering, and freedom/responsibility.
      Uncertainty is an acceptable entry under every heading. The learning guide contains a complete fictional
      practice and a separate changed-case check. Choose that route when a real situation is unavailable; its
      results are rehearsal, not performed real-world work.'
    actions:
    - title: State convictions and uncertainty separately
      instructions: 'Under each heading write one current belief or open question, one reason for it, and how
        confident you are in ordinary language. Distinguish experience, trusted testimony, inference, and faith.
        Example: people can change; a repaired relationship supports this; the circumstances that make change
        possible remain uncertain.'
      checks:
      - All six headings are addressed
      - Reasons are distinguished from convictions
      - Uncertainty is explicit
    - title: Examine one tension between beliefs
      instructions: Select two entries that could conflict, such as strong personal responsibility and unequal
        opportunity. Describe one case in which both matter. Explain whether the beliefs genuinely contradict,
        apply at different levels, or require revision. Include the strongest objection you can fairly state.
      checks:
      - Two beliefs are compared
      - A concrete case tests their relationship
      - A serious objection is represented
    - title: Add a revision clause and one implication
      instructions: Rewrite one entry after the tension check. State what evidence, experience, reasoning,
        or unresolved question could change your view, and one small decision affected by it. Schedule a later
        reread; agreement with a particular worldview is never a completion criterion.
      checks:
      - A revision condition is stated
      - A practical implication is identified
      - A dated reread is chosen
    adaptation: Keep this private, dictate it, or use fictional positions if disclosure is unsafe. No conversion,
      debate, trauma disclosure, or resolution of every philosophical question is needed.
    review: Which conviction is better supported now, and which is simply more clearly uncertain?
    examples:
      supportive: Responsibility was retained while the decision rule explicitly accounted for resources and
        constraints.
      mixed: The worldview is coherent on paper but no imaginable revision condition was identified.
      contradictory: Disagreement was treated as proof of another person's ignorance or lesser dignity.
      inconclusive: Six slogans were copied without reasons, questions, or implications.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.02'
      title: Write a worldview that can be questioned
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: 'A contradiction affirms and denies the same claim under the same conditions. Different levels
          of explanation can coexist: a person can choose while resources constrain which choices are available.
          Coherence alone does not establish truth.'
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: 'Fictional worldview A: reality includes material processes; people can learn; testimony is useful
          but fallible; promises matter; suffering sometimes has preventable causes; responsibility depends
          partly on available choices. B shares these positions except that it says every adult always has
          exactly the same opportunities. Case: two learners can study, but one has an accessible library and
          the other has no available transport or accessible copy.'
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Use all six headings to compare A/B. Identify the tension, a strong objection, a justified revision
          condition and one practical implication. Keep unresolved metaphysical questions unresolved.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A position says testimony is always unreliable but treats one admired speaker’s testimony as
          conclusive without corroboration. What needs examination, and what would a narrower position allow?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'A can retain agency while recognizing unequal options. B’s equal-opportunity claim conflicts
          with the stipulated access difference; revise that claim rather than deny the learner’s agency. At
          a fictional later review an accessible copy arrives but transport remains unavailable: update the
          particular options, not a universal equality claim. Partial: identify unfairness without locating
          the proposition. Incorrect: announce all responsibility impossible.'
        criteria:
        - Claims are represented fairly
        - Contradiction is distinguished from different explanatory levels
        - Revision follows a stated reason
      - id: changed-case-check
        title: Check the changed case
        body: The exception conflicts with “always” unless independently justified. A narrower view treats
          testimony as fallible and checks source access, reasons and corroboration. Agreement with the admired
          speaker does not settle reliability.
        criteria:
        - Claims are represented fairly
        - Contradiction is distinguished from different explanatory levels
        - Revision follows a stated reason
  '01.03':
    title: Trace and deliberately choose three values
    goal: Distinguish inherited commitments from values consciously reaffirmed, revised, or declined.
    scope_note: Three values provide a sample of family, cultural and personal influences. Deliberate endorsement
      requires later conduct as well as this initial historical account.
    burden: About 25 minutes of reflection, one small ordinary choice, and a brief review.
    setup: Choose three values affecting a small decision, such as reliability, independence, generosity, privacy,
      or achievement. Use a private page; identifying relatives or communities is unnecessary. The learning
      guide contains a complete fictional practice and a separate changed-case check. Choose that route when
      a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Draw each value's history
      instructions: 'For each value, note where you encountered it, an experience that strengthened or challenged
        it, and a current behavior it influences. Separate admiration or belonging from fear of disapproval.
        Example: reliability came from a household expectation and now affects how quickly you accept requests.'
      checks:
      - Three origins are traced
      - Experiences are distinguished from assumptions
      - Each value connects to behavior
    - title: Decide what you actually endorse
      instructions: Mark each value retain, reinterpret, question, or decline. Give a reason you endorse today
        and a boundary against its excess. Reliability might mean making fewer realistic promises rather than
        accepting every request. Inherited values may be freely reaffirmed; rejecting tradition earns no extra
        credit.
      checks:
      - Each value has a present disposition
      - Endorsement has a current reason
      - An excess or boundary is identified
    - title: Act on one deliberate interpretation
      instructions: Apply one revised interpretation to a low-stakes request, purchase, schedule, or conversation.
        Record the choice and its cost privately, then check whether it reflects your reason rather than merely
        reversing an old expectation. A role-play can rehearse the decision but does not demonstrate changed
        conduct.
      checks:
      - A specific choice is made
      - The choice traces to a stated value
      - Real action and rehearsal are distinguished
    adaptation: Use broad labels such as family or school without naming anyone. Keep the exercise private
      where disagreeing could threaten safety, housing, employment, or belonging.
    review: What did you choose freely to retain, and what behavior will reveal whether the reinterpretation
      lasts?
    examples:
      supportive: Reliability was reaffirmed and one unrealistic promise was renegotiated before its deadline.
      mixed: The reasoning changed but the first opportunity to act has not occurred.
      contradictory: The exercise became an accusation against relatives or pressure to reject a tradition.
      inconclusive: Values were listed without origins, present reasons, or a decision.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.03'
      title: Trace and deliberately choose three values
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: An origin explains how a value became salient; it does not decide whether to endorse it. Admiration,
          belonging, threat of disapproval, temperament and deliberate reasoning can coexist. Reversing a family
          rule can remain controlled by that rule.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: Rae learned reliability from adults who kept promises and also feared criticism for saying no.
          Rae enjoys solitary work and calls independence a virtue, but acknowledges this may partly reflect
          temperament. A friend’s freely offered help showed Rae that accepting assistance need not surrender
          choice. Rae values privacy after thinking through who should control personal information.
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Trace three value histories, separating reported influence from your inference. Give each a current
          disposition and boundary; choose one response to an optional request requiring an unavailable hour.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: Sam declines every family custom solely to avoid resembling a parent, then calls every choice
          freely reasoned. What is missing?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'Reliability can be retained as making realistic promises, so a clear decline may express it.
          Independence can be reinterpreted as agency with chosen help. Privacy can be retained with voluntary
          sharing. Later fiction: Rae declines the hour and offers a genuinely available 10 minutes; acceptance
          is unknown. Partial: name origins without present reasons. Incorrect: claim independence must be
          rejected because it has temperamental roots.'
        criteria:
        - Origin is separated from endorsement
        - Current reasons and limits are stated
        - Action and proposed interpretation are distinguished
      - id: changed-case-check
        title: Check the changed case
        body: A present reason for each disposition is missing. Sam may still choose to decline, but reversal
          alone does not show considered endorsement. A retained custom can also be freely chosen.
        criteria:
        - Origin is separated from endorsement
        - Current reasons and limits are stated
        - Action and proposed interpretation are distinguished
  '01.04':
    title: Resolve one conflict between worthwhile goods
    goal: Use an explicit, revisable priority order when two legitimate goods cannot both be fully served.
    scope_note: A priority order is tested in one conflict. Other goods and emergencies may require different
      judgments; this is a revisable ordering, not a universal numerical ranking.
    burden: About 20 minutes of comparison plus one small decision and its review.
    setup: Use a minor conflict such as rest versus volunteering or candor versus confidentiality. Write two
      feasible options and keep essential care and safety outside the tradeoff. The learning guide contains
      a complete fictional practice and a separate changed-case check. Choose that route when a real situation
      is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Name the goods and the actual conflict
      instructions: 'For each option, name who benefits, which good it serves, and which good it sacrifices.
        Example: accepting an extra shift supports income but displaces a promised family visit. Separate needs,
        promises, preferences, and status concerns before ordering them.'
      checks:
      - Both options serve a real good
      - Affected people are considered
      - The unavoidable tradeoff is specified
    - title: Choose a priority with an exception
      instructions: State which good takes precedence in this case and why. Name a threshold that would reverse
        the choice, such as an essential expense rather than discretionary spending. Test whether you would
        accept the same reasoning if the inconvenience fell on you instead of someone else.
      checks:
      - A priority is explicit
      - A reversal condition is defined
      - The role-reversal check is performed
    - title: Make and review the bounded choice
      instructions: Carry out the small choice or rehearse the supplied case. Communicate any changed commitment
        to the affected person where appropriate. Afterward note the preserved good, the remaining cost, and
        whether the priority should change next time. Do not rewrite the cost as though nothing was lost.
      checks:
      - The choice is enacted or explicitly rehearsed
      - Consequences are reviewed
      - The forgone good remains acknowledged
    adaptation: Sort cards or speak the comparison instead of writing. A person receiving care can prioritize
      care and rest without justifying those needs as productivity.
    review: Would your stated hierarchy still make sense if you received less benefit from this choice?
    examples:
      supportive: A prior promise took precedence over optional income, with an explicit essential-expense
        exception.
      mixed: A defensible priority was chosen but another person's inconvenience was not discussed.
      contradictory: Every good was called equally important and the choice was justified only after the fact.
      inconclusive: No conflict, consequence, or feasible choice was identified.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.04'
      title: Resolve one conflict between worthwhile goods
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: A priority is a reason for this decision under these conditions, not a permanent ranking of people
          or goods. An exception should identify a relevant changed need rather than favor whoever benefits
          from it.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: Lee has promised a 60-minute family visit on Saturday. An optional extra shift conflicts with
          it and pays 40 units. Essentials are covered this week;40 would increase a repair reserve, with no
          urgent repair. The relative welcomes asking about Sunday, but has not agreed. Lee values both reliability
          and financial security.
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Compare keeping Saturday with asking to move the visit. State what must happen before either
          plan is settled, a reversal condition and the strongest cost of your preference.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: An optional event conflicts with an agreed care shift. The organizer says “your contribution
          matters.” Does that remove the care obligation?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'Keeping Saturday protects an existing promise and forgoes 40. Asking about Sunday can be responsible
          if the shift is not accepted on assumed consent. Later fiction: Sunday is declined, so the original
          promise remains unless genuinely renegotiated. A newly essential uncovered expense could justify
          revisiting the balance, not silently erasing the promise. Partial: choose plausibly but omit the
          lost good. Incorrect: call the unconfirmed Sunday visit agreed.'
        criteria:
        - Actual obligations and optional goods differ
        - Alternatives depend on real agreement
        - Reversal conditions are relevant and reciprocal
      - id: changed-case-check
        title: Check the changed case
        body: No. The event’s good is real, but suitable accepted coverage or an appropriate renegotiation
          is needed before relying on release from care. Praise does not provide coverage.
        criteria:
        - Actual obligations and optional goods differ
        - Alternatives depend on real agreement
        - Reversal conditions are relevant and reciprocal
  '01.05':
    title: Turn a possible calling into a small commitment
    goal: Explore purpose through a useful contribution and honest reflection on its fit and demands.
    scope_note: One contribution tests the fit of a possible calling. Sustained vocation also involves repeated
      service, changing responsibilities and long-term costs that this trial cannot establish.
    burden: About 15 minutes to plan, a contribution small enough for current capacity, and a 10-minute review.
    setup: List one responsibility you hold, one problem you care about, and one ability or form of presence
      you can offer. Reserve a small amount of time that does not displace essential obligations. The learning
      guide contains a complete fictional practice and a separate changed-case check. Choose that route when
      a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Form a contribution hypothesis
      instructions: 'Complete this sentence: I may contribute to this person, community, craft, or problem
        by doing this specific useful act. Include who defines usefulness and what permission or competence
        is needed. Example: help a willing neighbor organize a shared notice, rather than decide what the neighbor
        needs without asking.'
      checks:
      - A contribution and recipient are specified
      - Usefulness has a way to be checked
      - Permission and limits are considered
    - title: Deliver a modest piece of useful work
      instructions: Offer and, if welcomed, complete one bounded contribution. It may be listening, repairing
        a small document, sharing a resource, or doing an existing responsibility more attentively. Keep the
        recipient free to decline. Record what was delivered and the actual demand on time, energy, and other
        duties.
      checks:
      - An agreed contribution is attempted
      - Its actual demands are recorded
      - The recipient can decline or redirect it
    - title: Decide whether to deepen the commitment
      instructions: Compare expected meaning with what the contribution actually required. Seek brief feedback
        if appropriate without demanding gratitude. Choose continue, change role, or stop; name a realistic
        next commitment and a review point. One unpleasant attempt neither disproves a calling nor obliges
        lifelong persistence.
      checks:
      - Fit and cost are both reviewed
      - A next disposition is chosen
      - The commitment has a bounded review point
    adaptation: Receiving care, maintaining a home, or offering attentive presence can be meaningful contributions.
      Use a fictional service plan if a real opportunity is unavailable; label it preparation.
    review: Did the work serve something you value, and what would make continued commitment sustainable?
    examples:
      supportive: A welcomed contribution was delivered and followed by a realistic recurring commitment.
      mixed: The work mattered but its time cost requires a smaller role.
      contradictory: Help was imposed despite refusal or essential personal care was sacrificed to prove purpose.
      inconclusive: An inspiring mission sentence was written without testing a contribution.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.05'
      title: Turn a possible calling into a small commitment
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: A calling hypothesis connects an offered ability to a need someone actually recognizes. Meaning
          for the contributor and usefulness for the recipient are separate; disappointment can prompt a change
          without deciding an entire vocation.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: 'Fictional room coordinator Jo requests a private 20-minute transcription of three notice facts:
          book swap, June 12 at 14:00, Room B. Jo wants plain text, no graphic design or participant names,
          delivered by Friday 16:00. Ari has 25 free minutes and suitable typing access. Jo agrees to inspect
          one draft but promises no continuing role.'
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Write the contribution hypothesis, produce the three-fact text and account for time, permission
          and the recipient’s requested format. Save the draft before the response in the check.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A helper offers publicity; the recipient requests quiet filing and declines a public post. Which
          purpose should govern the proposed contribution?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'A fitting artifact preserves event/date/time/place with no invented details. Later fiction:
          Jo receives it Friday 15:30, confirms all facts and asks for no further work. That supports one useful
          supplied contribution, not sustained calling or actual service by the reader. Partial: facts right
          but unwanted design added. Incorrect: invent a recurring role or gratitude. Next choose another bounded
          offer only if both need and capacity remain.'
        criteria:
        - Contribution matches a stated need
        - Permission and capacity are explicit
        - One outcome is not inflated into a vocation
      - id: changed-case-check
        title: Check the changed case
        body: The requested useful work and actual permission govern. Offer filing if competent and willing,
          change the offer, or stop. Public visibility cannot be imposed to make the helper feel purposeful.
        criteria:
        - Contribution matches a stated need
        - Permission and capacity are explicit
        - One outcome is not inflated into a vocation
  '01.06':
    title: Test a goal without its audience
    goal: Separate meaningful motives from comparison and revise one goal accordingly.
    scope_note: The trial separates substance from audience rewards for one goal. Motives can remain mixed,
      and one session cannot determine an entire career or life direction.
    burden: About 15 minutes of motive review, one 10–30 minute activity, and 10 minutes to revise the goal.
    setup: Pick a discretionary goal with a small next step, such as learning a skill, changing a room, or
      joining an activity. Avoid irreversible career or financial decisions in this exercise. The learning
      guide contains a complete fictional practice and a separate changed-case check. Choose that route when
      a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Compare visible and invisible rewards
      instructions: Write what the goal gives you if nobody learns about it, then what it gives you through
        approval or comparison. Mixed motives are allowed. Ask whether you would still want the activity with
        a plain title, modest equipment, and no public progress display.
      checks:
      - Private benefits are identified
      - Social rewards are acknowledged without shame
      - The audience-free version is considered
    - title: Try the substance without the display
      instructions: Spend one short session on the underlying activity without announcing it or buying a status
        upgrade. For example, practice a few musical phrases rather than shopping for an impressive instrument.
        Note attention, frustration, enjoyment, usefulness, and effort; an unexciting session is valid evidence.
      checks:
      - The underlying activity is attempted
      - Public display is unnecessary
      - The experience includes costs as well as appeal
    - title: Rewrite the goal around what remains
      instructions: Keep, shrink, replace, or retire the goal using the trial. Write a next action and remove
        one audience-dependent condition if it has no useful function. Preserve professional recognition or
        social participation when those serve a real purpose rather than treating all visibility as vanity.
      checks:
      - A goal disposition follows the trial
      - A meaningful next action is specified
      - Legitimate social purposes are distinguished
    adaptation: Use existing materials, a library resource, or a simulated private comparison. Necessary public
      collaboration need not be hidden; this is a motive check, not enforced secrecy.
    review: Which part of the goal survives without applause, and which external reward is still legitimately
      useful?
    examples:
      supportive: A prestige purchase was dropped while a modest weekly learning goal was retained.
      mixed: The activity still matters, but recognition is also a significant motive.
      contradictory: The exercise became shame about enjoying recognition or a reason to abandon necessary
        paid work.
      inconclusive: Motives were guessed without trying the underlying activity or revisiting the goal.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.06'
      title: Test a goal without its audience
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: Intrinsic interest, useful outcomes and recognition can coexist. An audience-free trial asks
          what remains when optional display is removed; it does not make necessary collaboration or professional
          credit suspect.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: 'Complete novice activity: arrange the words cloud, pocket, rain, key into a two-sentence imaginary
          scene on existing paper. There is no correct story, purchase or publication. Fictional Mira wants
          the title “writer,” likes surprising images and dislikes revising. Mira has 10 free minutes and no
          deadline. Compare trying the scene privately with buying an impressive notebook.'
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Make one scene, identify which parts of the goal depend on an audience and choose what to inspect
          after 10 minutes. Do not grade artistic talent from this trial.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A musician needs a willing ensemble to practice coordination. Does an audience-free motive test
          require abandoning the ensemble?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'A scene such as a cloud storing rain in a pocket with a lost key meets the material constraint,
          but other scenes work. Later fiction: Mira writes for 7 minutes, enjoys one image and finds revision
          tedious; no public post occurs. Keeping a small private writing opportunity is defensible; a book
          purchase would not test writing interest. Partial: report enjoyment without actual activity. Incorrect:
          declare all recognition vain or one mixed session proof of inability.'
        criteria:
        - An executable underlying activity is attempted or explicitly simulated
        - Mixed motives remain visible
        - The revision follows the trial rather than status pressure
      - id: changed-case-check
        title: Check the changed case
        body: No. Collaboration serves the activity’s actual purpose. Remove an unnecessary status condition,
          not the partners needed to exercise the skill. Record what publicity adds separately.
        criteria:
        - An executable underlying activity is attempted or explicitly simulated
        - Mixed motives remain visible
        - The revision follows the trial rather than status pressure
  '01.07':
    title: Make one reversible decision with known unknowns
    goal: Act under uncertainty using explicit assumptions, a limited downside, and a review trigger.
    scope_note: A reversible trial practices assumptions and review under uncertainty. Consequential or irreversible
      decisions require additional information and safeguards beyond this exercise.
    burden: About 15 minutes of decision preparation, one ordinary trial, and a 10-minute reassessment.
    setup: Pick a reversible ordinary decision, such as trying a different study time or asking about an activity.
      Exclude contracts, treatment changes, investments, and choices with serious consequences. The learning
      guide contains a complete fictional practice and a separate changed-case check. Choose that route when
      a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Separate facts from decision assumptions
      instructions: Write the decision, two feasible options, three facts you know, and two assumptions you
        are making. Identify one missing fact that would genuinely change the choice. Give information gathering
        a small time limit so investigation serves the decision rather than postpones it indefinitely.
      checks:
      - Facts and assumptions are separated
      - Options are feasible
      - A decision-relevant unknown is named
    - title: Choose the smallest informative trial
      instructions: Select the option that offers useful information with an acceptable, reversible cost. State
        the trial length, maximum time or resource cost, and stop condition. Carry it out once; for a study-time
        trial, use one ordinary session and keep other conditions as similar as practical.
      checks:
      - A bounded trial is selected
      - Downside and stop conditions are explicit
      - The trial is actually attempted
    - title: Reassess at the promised point
      instructions: At the chosen review point, compare observations with the assumptions. Decide continue,
        alter, or stop, and name what is still unknown. If the result is inconclusive, choose whether another
        bounded trial is worth its cost rather than declaring success to justify the decision.
      checks:
      - The review occurs at a stated point
      - Observations test the assumptions
      - Uncertainty survives where evidence is missing
    adaptation: Use the study-time example as a paper simulation when live experimentation is impractical.
      Simulation exercises decision structure but does not show real-world results.
    review: What did acting teach you that more speculation would not, and what remains worth investigating?
    examples:
      supportive: A one-session trial overturned an assumption and the next session was rescheduled accordingly.
      mixed: The trial occurred but an interruption prevented a fair comparison.
      contradictory: The trial exceeded its resource limit or its review point was repeatedly avoided.
      inconclusive: The options were compared but no trial or explicit simulation occurred.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.07'
      title: Make one reversible decision with known unknowns
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: 'A reversible experiment specifies an information question, bounded cost and stop condition.
          A consequential decision needs additional preparation: affected people, irreversible commitments,
          qualified input where needed and a decision date that does not outrun essential facts.'
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: 'Fictional study choice: Tue18:00–18:20 or Wed08:00–08:20. Both are free; usual evening noise
          may occur, morning transport begins 08:40. Study card: north is top, the desk is south of the hall,
          the shelf is east of the hall. Question: can the available setting support reading without displacing
          transport? Maximum cost 20 minutes; stop before required preparation.'
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Choose a trial and prediction, identify one missing fact and state the review decision before
          the outcome. Do not treat a trial as permission for a consequential commitment.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A trial subscription is reversible only before Friday, but its cancellation process is unconfirmed.
          Is “I can always undo it” a known fact?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'Both windows can be defended with a stated uncertainty. Later fiction for morning:08:00–08:15
          reading occurs,08:15 transport preparation starts unexpectedly early; session stops. This supports
          only 15 minutes of study and a revised preparation constraint. Partial: observe success but ignore
          changed timing. Incorrect: count 20 completed or generalize to all mornings. For a consequential
          course decision, separately gather fees, accessibility, withdrawal terms and affected commitments
          before agreeing; use appropriate advice for legal/financial questions.'
        criteria:
        - Known facts and assumptions differ
        - Cost and stop condition are workable
        - Next commitment respects remaining uncertainty
      - id: changed-case-check
        title: Check the changed case
        body: No. Verify the actual cancellation route and deadline before relying on reversibility; defer
          commitment if an essential condition is unknown. A reassuring assumption is not a stop mechanism.
        criteria:
        - Known facts and assumptions differ
        - Cost and stop condition are workable
        - Next commitment respects remaining uncertainty
  '01.08':
    title: Find one actionable responsibility inside a constraint
    goal: Distinguish control, influence, and external conditions while taking one proportionate action.
    scope_note: The three categories apply responsibility without denying constraint. One successful action
      does not remove structural limits or establish control over another person.
    burden: About 15 minutes to sort the situation, one proportionate action, and a brief review.
    setup: Choose a current minor frustration, such as a delayed response, a crowded schedule, or an unavailable
      resource. Do not use abuse, crisis, or traumatic events for this exercise. The learning guide contains
      a complete fictional practice and a separate changed-case check. Choose that route when a real situation
      is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Sort the situation without assigning blame
      instructions: 'Make three columns: my direct choices, things I can influence, and conditions I cannot
        decide. Place concrete facts in each. For a delayed reply, your follow-up timing is a choice, clarity
        may influence the response, and the other person''s availability is outside your control.'
      checks:
      - All three categories are distinguished
      - Entries describe concrete conditions
      - Responsibility is not expanded into blame
    - title: Take one proportionate action
      instructions: Choose one useful direct action and, if appropriate, one respectful request. Send a clear
        follow-up, adjust your own schedule, or use an available alternative. Specify when you will stop checking
        or escalating. Do not treat another person's refusal as permission to pressure them.
      checks:
      - A controllable action is attempted
      - Any request respects refusal
      - An escalation or checking limit is set
    - title: Review agency and remaining constraint
      instructions: Record what your action changed and what it could not change. Decide whether to ask for
        support, pursue a different option, wait, or accept the limit. Retain the external obstacle in the
        explanation instead of interpreting a poor outcome as personal failure.
      checks:
      - Action and outcome are separated
      - Remaining constraints are acknowledged
      - A proportionate next disposition is chosen
    adaptation: A support person can help communicate or implement your choice. Choosing rest, declining an
      unsafe demand, or seeking assistance is an exercise of agency.
    review: Where did you have a choice, and where would demanding more control become unfair to yourself or
      others?
    examples:
      supportive: A clear follow-up was sent and an alternative was chosen without blaming anyone for the delay.
      mixed: The action was useful but the main constraint remains outside the person's influence.
      contradictory: The person accepted blame for another's conduct or repeatedly pressured them to respond.
      inconclusive: The columns contain only broad labels such as everything or nothing.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.08'
      title: Find one actionable responsibility inside a constraint
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: Agency concerns choices one can actually make; influence is an uncertain effect on another person
          or system. External barriers remain real even after a responsible attempt. Support can expand available
          choices without making refusal illegitimate.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: A shared printer is unavailable today. Jo needs an optional flyer tomorrow, controls the wording
          and may send an accepted text version instead. The room manager can authorize another printer but
          has not replied. Jo cannot enter the locked office or require the manager to work late.
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Sort direct choices, possible influence and outside control. Choose one bounded action and one
          respectful request, with a time to stop waiting.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A student requests an accessible copy and receives no answer. Does agency require solving the
          access barrier alone or accepting fault for it?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'Jo can prepare accurate text and use the already accepted text route; a request may influence
          printer access but cannot guarantee it. Later fiction: manager declines extra access; Jo sends text.
          Physical printing did not occur. Partial: ask clearly but leave the feasible alternative unexamined.
          Incorrect: treat locked access as an obstacle to override or blame Jo for the refusal.'
        criteria:
        - Choice and influence are separated
        - Requests respect another person’s agency
        - External barriers remain in the account
      - id: changed-case-check
        title: Check the changed case
        body: Neither. The student may use an appropriate support/escalation route, retain the unmet request
          and choose what is feasible now. Requesting help is an action; institutional access failure is not
          established as the student’s fault.
        criteria:
        - Choice and influence are separated
        - Requests respect another person’s agency
        - External barriers remain in the account
  '01.09':
    title: Compare a stated belief with an ordinary week
    goal: Turn a recurring life review into a concrete revision of conduct or belief.
    scope_note: The weekly loop connects belief and conduct across several moments. A lasting philosophical
      revision requires later reviews and evidence from more than one week.
    burden: About 20 minutes now, one small adjustment, and 10 minutes at the following week's review.
    setup: Choose one stated priority and reconstruct three ordinary moments from the last week. Use memory
      or your own calendar; no surveillance, detailed diary, or productivity scoring is needed. The learning
      guide contains a complete fictional practice and a separate changed-case check. Choose that route when
      a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Collect supporting and conflicting moments
      instructions: 'Write one moment that reflected the priority, one that did not, and one that is ambiguous.
        For each, note circumstances, competing obligations, and available choices. Example: valuing friendship
        may appear in checking on someone, while a missed call may reflect a necessary care duty rather than
        indifference.'
      checks:
      - Three different observations are considered
      - Context accompanies each observation
      - Conduct is not reduced to a total identity judgment
    - title: Revise the belief or its expression
      instructions: Decide whether the mismatch calls for a behavior change, a more realistic priority, or
        acceptance of a legitimate tradeoff. Make one specific adjustment, such as arranging a ten-minute call
        or admitting that rest takes precedence this week. Explain why that adjustment addresses the actual
        mismatch.
      checks:
      - A mismatch is interpreted rather than assumed
      - One concrete adjustment is chosen
      - The adjustment follows the evidence
    - title: Close the review loop
      instructions: Try the adjustment and set a brief review for the following week. At that review, record
        whether it happened and whether it helped express the priority. Keep, modify, or remove it. Do not
        accumulate corrective tasks when the evidence calls for fewer obligations.
      checks:
      - An adjustment is tried
      - A follow-up review occurs
      - The resulting disposition is recorded
    adaptation: Review aloud, with a trusted supporter, or using three calendar symbols. A week dominated by
      illness or caregiving can justify a smaller expectation rather than another task.
    review: What changed because you reviewed your life, and what did you learn about the belief itself?
    examples:
      supportive: A vague friendship priority became one realistic call, then was reviewed for fit.
      mixed: The adjustment occurred but competed with needed rest and should be reduced.
      contradictory: The review produced escalating self-criticism and more obligations without acknowledging
        constraints.
      inconclusive: The same priority was restated without an adjustment or follow-up.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.09'
      title: Compare a stated belief with an ordinary week
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: A mismatch may require changing conduct, revising an overbroad belief or accepting a legitimate
          competing duty. Three moments are a sample, not an identity verdict. A later observation should test
          the adjustment rather than retell the intention.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: 'Pat says “friendship means answering every message immediately.” Monday: a welcome 10-minute
          call occurred. Wednesday: a necessary care task delayed a reply until evening. Friday: Pat browsed
          optional videos and forgot a promised reply by 17:00. A friend agrees a Saturday 10:00 check-in would
          work; no broader reassurance is supplied.'
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Classify reflected, conflicting and ambiguous moments. Decide which belief and which behavior
          need revision. Plan an inspectable Saturday adjustment before reading the check.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A person says family matters most but declines an optional gathering to keep an urgent agreed
          care duty elsewhere. Must the belief be false?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'Monday reflects friendship; Wednesday supports revising “immediately” to fit necessary care;
          Friday still contains a missed promise. Later fiction: the Saturday call occurs 10:00–10:10; trust
          repair is not reported. A sound adjustment combines realistic response agreements and a reminder
          for explicit promises. Partial: revise only the slogan. Incorrect: use Wednesday’s care duty to excuse
          Friday’s unrelated omission.'
        criteria:
        - Different causes of mismatch are retained
        - Revision targets the actual problem
        - Later action is separate from intention
      - id: changed-case-check
        title: Check the changed case
        body: No. The event has competing duties and may express a broader care commitment. Examine actual
          promises and alternatives before deciding whether belief or conduct needs revision; one event does
          not settle identity.
        criteria:
        - Different causes of mismatch are retained
        - Revision targets the actual problem
        - Later action is separate from intention
  '01.10':
    title: Rebuild one commitment after disappointment
    goal: Identify what a disappointed expectation no longer supports and choose one modest commitment that
      remains worthwhile.
    scope_note: A manageable disappointment provides a first step in rebuilding meaning. Catastrophic loss,
      trauma and persistent impairment call for support beyond this bounded reflection.
    burden: About 15 minutes of optional reflection and one low-demand commitment; pause whenever needed.
    setup: Use a manageable disappointment such as an unrewarding achievement or a group that no longer fits.
      Do not revisit traumatic detail; choose a fictional case or stop if the reflection is destabilizing.
      The learning guide contains a complete fictional practice and a separate changed-case check. Choose that
      route when a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Separate the failed promise from the whole story
      instructions: 'Finish three statements privately: I expected this to provide something; that expectation
        failed in this way; this does not tell me everything about my life. Distinguish a particular outcome,
        institution, relationship, or belief from the value it once represented. No forced positive reinterpretation
        is required.'
      checks:
      - The failed expectation is specific
      - The loss is acknowledged
      - A broader totalizing conclusion is questioned
    - title: Identify what remains worth protecting
      instructions: Name one relationship, responsibility, pleasure, principle, or source of support that does
        not require the old promise to be restored. Explain why it matters in its own right. If nothing is
        clear, identify a person or service with whom uncertainty can be held without pressure to solve it.
      checks:
      - A remaining good or support is identified
      - Its value is independent of the old outcome
      - Uncertainty is permitted
    - title: Make a commitment small enough to keep
      instructions: Take one low-demand action toward the remaining good, such as keeping a meal appointment
        or spending time on an enjoyed craft. Afterward describe what the action sustained, not whether it
        cured disappointment. Choose a gentle review point or seek appropriate support if functioning or safety
        is affected.
      checks:
      - A modest action is attempted
      - Its limited effect is described
      - Further support or review is considered
    adaptation: Use a fictional disappointed achievement, respond by drawing, or ask a trusted person to help
      identify practical support. Distress is not material that must be mined for growth.
    review: What can you commit to without pretending the disappointment has disappeared?
    examples:
      supportive: A disappointing promotion did not regain its meaning, but a modest valued commitment was
        restored.
      mixed: A remaining good was identified while energy for action remained limited.
      contradictory: The exercise demanded gratitude for harm or rushed someone into a replacement identity.
      inconclusive: Only a general inspirational statement was produced, with no specific expectation or commitment.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.10'
      title: Rebuild one commitment after disappointment
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: Disillusionment can challenge a particular promise without invalidating every good. Reconstruction
          may change an institutional affiliation, a role or a belief; none requires forced gratitude or immediate
          replacement certainty.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: Fictional Sol expected a certificate to produce belonging. After receiving it, no group contact
          followed. Sol still enjoys drawing small landscapes, has an already welcome Thursday meal with a
          friend and owes no further course fee. Sol questions the marketing promise, not whether every kind
          of learning has value. No traumatic event or acute crisis is supplied.
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Separate failed expectation, supported facts and global interpretations. Choose one remaining
          good and a low-demand action, without claiming the disappointment was beneficial.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: A group breaks one explicit promise. Someone concludes every possible community is unsafe. What
          can be challenged without denying the breach?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'A meal or private drawing can retain its own value. Later fiction: Sol attends the meal and
          remains disappointed; companionship occurred, not a cure. Partial: name a remaining good without
          a feasible action. Incorrect: infer all relationships or learning are fraudulent. For an institution,
          examine specific governance/complaint evidence before affiliation decisions; for faith, compare authorized
          interpretations with a willing trusted adviser if desired; for role identity, try a reversible expression
          of the valued good. These are distinct inquiries, not compelled conversions.'
        criteria:
        - The failed promise is stated specifically
        - A remaining good is not used to erase loss
        - Next steps fit the kind of disillusionment
      - id: changed-case-check
        title: Check the changed case
        body: The universal inference exceeds the supplied breach. Preserve the specific harm, appropriate
          boundaries and need for support while leaving other groups unknown. Joining a replacement group is
          optional, not proof of recovery.
        criteria:
        - The failed promise is stated specifically
        - A remaining good is not used to erase loss
        - Next steps fit the kind of disillusionment
  '01.11':
    title: Cooperate across a real difference in priorities
    goal: Represent a competing vision of a good life fairly and identify cooperation without false agreement.
    scope_note: The comparison practices fair representation and bounded cooperation. Some differences remain
      incompatible, and agreement in one arrangement does not erase deeper disagreement.
    burden: About 25 minutes to compare positions, plus an optional welcomed exchange and a 10-minute plan.
    setup: Use two reasonable preferences, such as quiet stability and ambitious exploration. Compare written
      positions or speak with a willing person; disagreement about anyone's equal dignity is outside the exercise.
      The learning guide contains a complete fictional practice and a separate changed-case check. Choose that
      route when a real situation is unavailable; its results are rehearsal, not performed real-world work.
    actions:
    - title: Explain each position from the inside
      instructions: 'Give each position its strongest reason, the good it protects, and the cost it accepts.
        Avoid labels such as lazy or selfish. Example: stability may protect care commitments, while exploration
        may create discovery and opportunity. Write one question whose answer could improve your understanding.'
      checks:
      - Both positions have serious reasons
      - Costs as well as goods are acknowledged
      - A non-accusatory question is formulated
    - title: Check the account without demanding agreement
      instructions: Ask a willing person whether your account is recognizable, or compare it with a substantive
        statement of that position. Correct one omission or caricature. State the remaining disagreement plainly;
        do not replace it with a claim that everyone secretly wants the same life.
      checks:
      - The account is checked against another perspective
      - An omission is corrected or explicitly considered
      - Real disagreement remains visible
    - title: Design a limited shared arrangement
      instructions: Choose one shared issue, such as planning a weekend or dividing a common resource. Propose
        an arrangement that protects one important good from each position, along with an opt-out or review
        point. Identify a conflict it does not solve and check that neither person must profess the other's
        values.
      checks:
      - A specific shared arrangement is proposed
      - Both positions retain a protected good
      - An unresolved conflict and exit are named
    adaptation: Use written exchanges, translated material, or the stability/exploration case. No debate partner,
      travel, disclosure of beliefs, or forced reconciliation is required.
    review: What can be shared while the disagreement remains, and which compromise would ask too much?
    examples:
      supportive: A shared plan allowed one quiet interval and one optional outing without requiring identical
        preferences.
      mixed: Each position was understood but resource limits prevented a mutually acceptable plan.
      contradictory: Cooperation depended on one person pretending agreement or abandoning a basic boundary.
      inconclusive: The positions were summarized only as stereotypes without checking their reasons.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '01.11'
      title: Cooperate across a real difference in priorities
      scored: false
      sections:
      - id: purpose-and-method
        kind: concept
        title: Understand the distinction
        body: Fair representation preserves the other position’s reason and accepted cost, not merely its preferred
          outcome. A cooperative arrangement can protect different goods without requiring shared beliefs.
      - id: supplied-case
        kind: material
        title: Complete fictional practice material
        body: 'Complete fictional statements. Alex: “A predictable Saturday lets me keep a 16:00 care handoff;
          I enjoy discovery but cannot return late.” Bea: “I want one unfamiliar experience; repeating the
          same cafe feels limiting, but I do not need an all-day trip.” Options: familiar cafe 13:00–14:00;
          new nearby exhibition 13:00–14:30 plus 30-minute return; distant outing returning 16:30. Both may
          decline; no booking is made.'
      - id: case-attempt
        kind: prompt
        title: Work through the supplied case
        body: Represent both voices, ask one useful clarification and propose a shared option with its remaining
          cost. Save the proposal before reading the clarification.
        references:
        - supplied-case
        check_id: case-check
        attempt_mode: practice
      - id: changed-case
        kind: prompt
        title: Try a different case before checking
        body: One person wants quiet conversation; another wants a crowded concert. Is saying “you both really
          want entertainment” adequate representation?
        check_id: changed-case-check
        attempt_mode: unaided
      checks:
      - id: case-check
        title: Compare reasoning and review the supplied result
        body: 'Later clarification: Alex welcomes an unfamiliar venue if home by 15:30; Bea prefers the exhibition
          but accepts a private no-photo visit. Nearby exhibition returns 15:00 and fits both; distant outing
          does not. Cafe remains feasible but does not serve Bea’s stated exploration preference as well. Partial:
          fit the clock while calling Alex afraid of novelty. Incorrect: invent agreement to stay late. No
          real consent or visit occurred.'
        criteria:
        - Both reasons and constraints are represented
        - The arrangement fits supplied facts
        - Agreement is not invented
      - id: changed-case-check
        title: Check the changed case
        body: No. It erases the different desired experiences. Ask about an actually welcome quieter shared
          time or separate participation; no arrangement must manufacture identical values or force agreement.
        criteria:
        - Both reasons and constraints are represented
        - The arrangement fits supplied facts
        - Agreement is not invented
