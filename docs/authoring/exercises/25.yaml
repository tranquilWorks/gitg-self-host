schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '25'
exercises:
  '25.01':
    title: Make three small creative pieces on ordinary days
    goal: Establish a repeatable act of making without waiting for inspiration, a creative identity or
      permission to be excellent.
    scope_note: Three brief pieces test continuity of production, not artistic mastery, productivity or
      the obligation to publish. Small and imperfect work is legitimate evidence of making.
    burden: Three fifteen-minute sessions within seven days and a ten-minute comparison.
    setup: Use paper, a text editor or an accessible voice recorder. The supplied writing prompt is a
      six-sentence scene in which an ordinary object is unexpectedly missing. Session one uses a cup,
      session two a key and session three a chair. Use fictional people and no private history; another
      safe medium is acceptable if the same small scope can be completed.
    actions:
    - title: Choose a small form and finish the first attempt
      instructions: Set three ordinary session times and a limit of fifteen minutes each. For the first
        scene, write where the cup should be, what someone notices, what they try, an unexpected detail,
        a small choice and an ending. Do not stop to decide whether you are a writer or search for a better
        tool. Save the piece when the interval ends, even if it is rough, and record what material you
        actually made rather than how inspired you felt.
      checks:
      - Three realistic session times and a small form are selected
      - The first piece contains an observable beginning change and ending
      - A rough completed attempt is retained instead of endlessly prepared
      - Making is recorded separately from inspiration or self-judgment
    - title: Return twice without raising the required standard
      instructions: At the next two chosen times, use the key and chair versions of the prompt. Keep the
        same scope and time limit rather than turning the second session into a major project. Change
        one detail freely, such as point of view, place or mood, while still producing a finished small
        piece. If a session is missed, record the actual reason and reschedule once; do not invent a streak
        or compensate with an exhausting marathon.
      checks:
      - Two further actual making sessions occur or are honestly marked missed
      - The same bounded scope survives changing motivation
      - Each piece includes at least one freely chosen variation
      - Missed work is not hidden or repaid through excessive effort
    - title: Select a sustainable return rather than a talent verdict
      instructions: Place the three pieces together and identify one detail worth keeping and one process
        obstacle that recurred. Choose the next manageable form, material and session time based on actual
        burden and enjoyment. You may keep every piece private. State whether the evidence shows repeated
        making, only one attempt or no workable routine yet; none of those is a judgment of creative worth.
      checks:
      - The actual pieces are compared rather than only intentions
      - One useful detail and one recurring obstacle are identified
      - The next session has a concrete sustainable scope
      - The conclusion concerns practice continuity rather than talent or worth
    adaptation: Dictate, use symbols, make a short sound sequence or use another accessible safe medium.
      A five-minute version is legitimate when capacity is limited, but record its actual size. Avoid
      hazardous tools, copyrighted copying presented as original work and pressure to monetize or expose
      unfinished work publicly.
    review: What made returning possible on an ordinary day, and what small constraint helped you produce
      rather than prepare?
    examples:
      supportive: Three imperfect scenes were completed at the planned times and a simpler opening helped
        the person return without needing inspiration.
      mixed: Two pieces were made and one session was missed; the next plan reduced the scope instead
        of claiming perfect consistency.
      contradictory: The person exhausted themselves to protect a streak or copied another work while
        claiming original production.
      inconclusive: Tools and ideas were collected without a finished small piece or a repeated making
        attempt.
  '25.02':
    title: Turn close observation into three imaginative alternatives
    goal: Notice concrete form, pattern, language, movement and sound before using those details to imagine
      possibilities that are not merely generic impressions.
    scope_note: One observation-to-making sequence tests attention and imaginative transformation. It
      does not authorize surveillance, recording strangers or claims about another person’s inner life.
    burden: Ten minutes of observation, twenty minutes of alternatives and a ten-minute comparison.
    setup: Choose an ordinary safe object and setting, such as a cup on a table near a window. Use a private
      page with headings for shape, surface, light, position, sound, movement and possible associations.
      Internal bodily focus, touching and visual observation are optional; choose accessible senses without
      forcing them.
    actions:
    - title: Record details before assigning meaning
      instructions: Observe for five minutes and record at least eight specific details across available
        senses or descriptive sources. For the default, notice an uneven rim reflection, a handle shadow
        or the sound when the cup is set down rather than writing only beautiful or boring. Mark an unavailable
        sense as unavailable. Separate what was noticed from an inference, such as the cup being abandoned,
        and do not infer a person’s feelings from a posture or expression.
      checks:
      - At least eight specific details or accessible observations are recorded
      - Descriptions are more concrete than broad judgments
      - Unavailable senses are not filled with invented observations
      - Observed facts and imagined meanings are separated
    - title: Generate alternatives that use the actual details
      instructions: 'Create three short possibilities: describe the cup as a place, make the shadow rather
        than the cup the main character, and imagine the same scene after one small change in light or
        position. Each version must retain two observed details while changing their relationship or significance.
        Do not merely replace a noun with a fantastical one. Note one unexpected connection and one possibility
        that did not work.'
      checks:
      - Three distinct transformations are attempted
      - Each transformation retains two actual observed details
      - Relationships or viewpoint change rather than only surface labels
      - An unsuccessful possibility remains part of the record
    - title: Make one miniature and compare it with the first impression
      instructions: Choose one alternative and produce a six-sentence passage, short sound sketch or simple
        arrangement using the selected details. Compare it with your first broad impression and identify
        what became noticeable only after looking or listening closely. State what is factual observation
        and what is creative invention. Keep the miniature private or share only with a willing audience;
        the aim is richer attention, not proof of originality.
      checks:
      - A small creative output is actually made
      - Its details can be traced to the observation
      - One previously missed connection is identified
      - Factual and invented elements remain clearly distinguished
    adaptation: Use a tactile object, sound, accessible image description or verbal scene when a sense
      is unavailable. Observe objects or willing participants, not private behavior. Use familiar safe
      materials and a short duration; no sensory overload or forced public performance is required.
    review: Which detail changed the imagined possibilities, and what would have been lost if you had
      stopped at the first impression?
    examples:
      supportive: A moving handle shadow became the scene’s focus, and the finished passage used details
        absent from the initial description of a boring cup.
      mixed: The observations were specific, but two alternatives only changed labels, so one was revised
        around a different relationship.
      contradictory: A stranger’s behavior was secretly recorded or an invented motive was presented as
        observed fact.
      inconclusive: Imaginative adjectives were listed without close observation, alternatives or a made
        miniature.
  '25.03':
    title: Explain why three versions work differently
    goal: Develop appreciation and criticism through choices, effects, context and standards rather than
      treating personal liking as the entire aesthetic judgment.
    scope_note: A comparison of original sample sentences teaches a small aesthetic judgment. It does
      not establish a universal ranking of art or dismiss different cultural standards.
    burden: Twenty minutes for comparison and twenty minutes for a revision and reader check.
    setup: 'Compare these original teaching samples describing a person leaving home: A: The room was
      sad and everything was very emotional. B: She left the room and closed the door. C: She took the
      key, then set it beside the cup and closed the door without locking it. The intended effect is a
      restrained sense of departure with room for uncertainty, not a rule that one style is always superior.'
    actions:
    - title: State the intended effect before ranking the samples
      instructions: Read each sample aloud or silently and note your immediate response separately from
        analysis. Compare specificity, rhythm, implied action, ambiguity and fit to the stated purpose.
        A names emotion directly, B reports action plainly and C uses selected actions to invite an inference;
        these are choices to test, not automatic grades. Name a context in which each approach could be
        useful, such as direct explanation, concise stage direction or a suggestive story opening.
      checks:
      - Immediate preference is separated from analysis
      - Five supplied comparison dimensions are considered
      - Each version’s choices are connected to possible effects
      - A legitimate context is considered even for a less preferred version
    - title: Make a reasoned criticism with a counterexample
      instructions: Choose the version that best serves the stated purpose and support the judgment with
        two exact features. Explain one weakness or ambiguity in that same version and one merit in another.
        Change the purpose to urgent factual instructions and reconsider the ranking. This tests whether
        your standard follows the task rather than loyalty to a style. Avoid claims about the author’s
        intelligence, culture or character.
      checks:
      - The judgment cites two specific textual choices
      - A weakness in the preferred sample remains visible
      - A changed purpose can change the ranking
      - Criticism concerns the work rather than the author’s worth
    - title: Revise one version and test the intended effect
      instructions: Rewrite A or B in no more than three sentences to serve the original restrained-departure
        aim without simply copying C. Give it to a willing reader and ask what they noticed and what remains
        uncertain, or compare it yourself after a break. Record whether the effect was communicated and
        one reason for keeping or changing the revision. A reader’s disagreement is evidence about reception,
        not a final verdict on taste.
      checks:
      - A new revision is produced rather than copied
      - The intended effect guides concrete choices
      - A reader or delayed self-review examines reception
      - The next judgment includes evidence and uncertainty rather than only liking
    adaptation: Use spoken phrases, simple drawings, music fragments created by you or accessible descriptions
      under the same purpose-and-effect comparison. Do not require familiarity with prestigious works.
      Cultural conventions can change interpretation; name the assumed audience and keep alternative standards
      discussable.
    review: Which choice explains your appreciation beyond preference, and how did changing the purpose
      alter what counted as effective?
    examples:
      supportive: The learner favored C for the story opening, acknowledged its ambiguity and selected
        B when the purpose changed to factual direction.
      mixed: The revision was vivid but communicated a different mood, leading to a more precise choice
        of action.
      contradictory: A preferred style was declared universally superior or a reader’s background was
        used to dismiss their response.
      inconclusive: The samples were ranked good or bad without identifying choices, context, effects
        or a tested revision.
  '25.04':
    title: Use one idea in two media and learn a foundational technique
    goal: Discover how a medium’s tools, constraints and conventions shape expression by executing a small
      technique and choosing a form for a reason.
    scope_note: The default compares written and spoken language without equipment purchases. It is a
      foundational experiment, not training for hazardous tools or professional performance.
    burden: Two fifteen-minute technique sessions and a fifteen-minute comparison.
    setup: 'Use the original line: I thought the door was closed. Prepare a written version and a spoken
      or rhythm-marked version. For writing, use punctuation, sentence breaks and one added concrete detail.
      For speech, use a comfortable pause and emphasis without strain. A non-speaking participant can
      mark pauses and emphasis on paper or use a preferred communication device.'
    actions:
    - title: Learn the small technique through controlled variations
      instructions: Write the line as a statement, a question and two short clauses separated by a pause.
        Read or mark each version and note how punctuation or emphasis changes certainty and implication.
        Practice one chosen variation three times while preserving the words so the changed technique
        is visible. Use a comfortable volume or silent notation; do not force a voice, movement or sensory
        task that is painful or inaccessible.
      checks:
      - Three variations isolate punctuation pause or emphasis
      - The words remain stable while the technique changes
      - One foundational variation is practiced three times
      - Comfort and access limits are respected
    - title: Make a short piece in two forms
      instructions: Create a four-line written exchange about the door using one concrete detail and deliberate
        line breaks. Then render the same exchange in speech, a communication device or a marked performance
        script, deciding where timing carries meaning that the written page supplied differently. Record
        one affordance and one limitation of each medium. Do not judge the second form solely by how closely
        it imitates the first.
      checks:
      - A short written piece uses the chosen technique
      - A second accessible rendering is actually attempted
      - Each medium has an identified affordance and limitation
      - The comparison allows different means to serve the same expressive purpose
    - title: Choose the medium that serves a named audience and effect
      instructions: Select an intended effect, such as uncertainty, humor or urgency, and a willing audience
        or private-use context. Choose one medium and revise the piece using what the comparison revealed.
        Ask a reader or listener to describe the effect, or conduct a delayed self-review. Explain the
        choice in terms of material, technique, constraint and audience access rather than equipment prestige
        or a belief that one medium is inherently more artistic.
      checks:
      - A specific effect and audience guide the choice
      - The piece is revised from the two-medium comparison
      - Reception is checked without requiring approval
      - The medium choice has a technique and access rationale
    adaptation: Use text, tactile arrangement, gesture, sound notation or another familiar safe medium
      with equivalent comparison. Assistive technology is part of the medium, not a penalty. Do not introduce
      solvents, cutting tools, loud sound or physical strain to make the task more authentic.
    review: What could one medium express with less effort or greater clarity, and which foundational
      technique made that difference possible?
    examples:
      supportive: A pause carried uncertainty in the spoken version while a concrete detail did it on
        the page, leading to a deliberate audience-fit choice.
      mixed: Both forms were attempted but the second lacked an accessible delivery method, so the final
        form was changed.
      contradictory: A painful technique was forced or expensive equipment was treated as proof of expressive
        quality.
      inconclusive: A medium was selected without practicing a technique, producing two forms or explaining
        their constraints.
  '25.05':
    title: Combine three influences through a problem rather than a copied style
    goal: Create an original small work by integrating observed details, a useful structure and a chosen
      constraint while honestly identifying its influences.
    scope_note: The exercise tests synthesis, not a legal originality determination or permission to copy
      protected expression. Influences must be available for the intended use and credited appropriately.
    burden: Twenty minutes to map influences, thirty minutes to make and fifteen minutes to review.
    setup: 'Make a short fictional invitation to a neighborhood reading evening. Use three supplied influences:
      the rhythm of an ordinary knock you can tap safely, the structure of a clear event notice and the
      image of a light left on for someone arriving late. Limit the result to eight lines. These prompts
      are original teaching material; no external artwork needs to be copied.'
    actions:
    - title: Extract a function from each influence
      instructions: 'Describe what each influence contributes: rhythm can shape pacing, the notice structure
        can preserve practical clarity and the light image can convey welcome. Write the actual problem
        the work must solve: invite without pressure and make time, place and access clear. Identify which
        parts are your observations and which are supplied prompts or borrowed ideas. Do not begin by
        imitating a recognizable creator’s surface manner or copying their wording.'
      checks:
      - Each influence is translated into a function
      - The work has a concrete communicative problem
      - Observed supplied and borrowed material are identified
      - No external wording or surface style is copied as a substitute for synthesis
    - title: Make a draft in which the influences interact
      instructions: Write the eight-line invitation using the rhythm to vary line length, the notice structure
        to place essential facts and the light image to shape the tone. Include fictional event details
        and mark them as fictional. Change one feature when influences conflict, such as preserving an
        access instruction even when it disrupts the rhythm. Keep a brief note of the decision so the
        work shows integration under constraints rather than three unrelated decorations.
      checks:
      - An eight-line draft combines all three functions
      - Essential practical details remain clear and fictional
      - A conflict between influences is resolved deliberately
      - The influences alter the structure rather than merely decorate it
    - title: Explain the synthesis and revise a borrowed-looking element
      instructions: Ask a willing reader what feels coherent, confusing or too derivative, or review after
        a break. Identify one element that is mostly imitation and transform it by returning to the actual
        invitation problem. Add a short influence note stating what was supplied, observed or otherwise
        borrowed and any required attribution. Explain what the finished work does differently; do not
        claim originality merely because many sources were mixed.
      checks:
      - A reader or delayed review examines coherence and derivation
      - One weakly integrated element is revised
      - Influences and any required permissions are acknowledged
      - The explanation identifies a transformed function rather than a number of sources
    adaptation: Use an accessible spoken invitation, simple graphic arrangement or another safe form with
      the same three functions. For external works, verify permission and license conditions before reuse,
      and remember that credit does not itself grant permission. Cultural or restricted material needs
      the appropriate community and rights-holder context.
    review: Which influence changed because it had to serve the same problem as the others, and what debt
      should remain visible in the finished work?
    examples:
      supportive: The light image shaped the invitation’s tone while the event facts controlled its structure,
        and the influence note honestly named the supplied prompts.
      mixed: All influences appeared, but one remained decorative and was revised to solve an actual clarity
        problem.
      contradictory: Uncredited copied expression was called original because it was mixed with other
        material.
      inconclusive: Influences were collected without an integrated work, a resolved constraint or an
        honest account of debts.
  '25.06':
    title: Run three low-stakes creative experiments and invite useful critique
    goal: Generate alternatives, tolerate an unsuccessful attempt and use feedback on unfinished work
      without turning each result into a verdict about identity.
    scope_note: Three small experiments test willingness to explore and revise, not courage as a trait
      or a requirement for public exposure. Critique must be voluntary and respectful.
    burden: Three ten-minute drafts, a fifteen-minute critique or self-review and one ten-minute retry.
    setup: 'Use the original prompt of a lost umbrella being returned. Produce three six-sentence versions:
      one told backward, one using only dialogue and one from the umbrella’s fictional point of view.
      Set a small private audience and a feedback question about clarity or surprise. Do not use real
      private incidents or imitate someone’s trauma.'
    actions:
    - title: Make alternatives before choosing a winner
      instructions: Create the three constrained versions within the same short time limit. Keep each
        draft even if it is awkward and mark one uncertainty you were testing, such as whether backward
        order creates curiosity or confusion. Do not quietly replace an unsuccessful draft with a polished
        one before review. Identify one surprise and one failure without attaching either to being talented
        or untalented.
      checks:
      - All three distinct constraints are attempted
      - Each draft has a stated creative uncertainty
      - An unsuccessful draft is retained honestly
      - Observations concern the experiment rather than personal identity
    - title: Ask for bounded feedback on unfinished work
      instructions: Show one or two drafts to a willing reader and state that they are experiments. Ask
        where they became interested and where they lost the thread. Request observations, not a global
        rating of you or the work. Accept a declined review and do not seek escalating reassurance. If
        no reviewer is available, return after a break and mark the exact sentence where your own understanding
        falters, labeling this self-review rather than independent feedback.
      checks:
      - The unfinished status and feedback purpose are clear
      - Feedback asks about specific moments and effects
      - Participation is voluntary and no reassurance pressure is used
      - Self-review is not represented as another person’s judgment
    - title: Retry one choice and state what remains unknown
      instructions: Select one concrete suggestion or observed problem and revise only that feature, such
        as moving one clue or shortening a line. Compare the revised passage with the original and explain
        whether the change served the tested purpose. Keep an unsuccessful retry as useful information
        and choose a next experiment or a stop. The goal is a learning cycle, not proving that every risk
        produces better art.
      checks:
      - One concrete feature is revised rather than everything at once
      - The comparison refers to the original experimental question
      - An unsuccessful retry can remain a valid result
      - The next choice is bounded and does not require proving talent
    adaptation: Use audio, drawing, movement notation or another accessible safe form. Share privately
      with a trusted person or use delayed self-review. Do not expose sensitive material, accept humiliating
      feedback or perform physically risky acts to demonstrate creative courage.
    review: Which failed attempt taught something that a safe first draft would not, and what kind of
      critique helped without taking control of the work?
    examples:
      supportive: The backward version confused the reader, one clue was moved and the retry clarified
        the intended surprise without erasing the original experiment.
      mixed: All drafts were made, but self-review rather than outside critique left audience reception
        uncertain.
      contradictory: A critical response became a worth verdict or a reviewer was pressured to praise
        the unfinished work.
      inconclusive: Only one safe draft was polished repeatedly, with no alternatives, retained failure
        or specific critique.
  '25.07':
    title: Finish a small creation and release it to an appropriate audience
    goal: Define done, revise for purpose, present accessibly and obtain actual audience response instead
      of indefinitely preparing or treating release as the end of learning.
    scope_note: One small release samples completion and reception, not public acclaim, commercial publication
      or broad artistic success. An invited private audience is sufficient.
    burden: Twenty minutes to define and revise, one short release and a fifteen-minute feedback review.
    setup: Use a short original paragraph, poem, sketch description or audio piece already made, or create
      a six-sentence scene about finding a lost object. Choose one willing reader or listener. Define
      done as a coherent beginning and ending, one deliberate expressive choice, corrected distracting
      errors and a format the audience can access. No public platform is required.
    actions:
    - title: Set completion criteria and perform two different edits
      instructions: 'Write the piece’s purpose and the four supplied completion criteria. First edit for
        meaning: remove a confusing turn or add a necessary detail. Then edit for presentation: correct
        distracting errors and check readability, audio clarity or accessible description. Stop after
        these two passes unless a criterion is still unmet; perfection is not the standard. Preserve an
        earlier version so the revision can be explained.'
      checks:
      - Purpose and four completion criteria are explicit
      - Meaning and presentation receive separate editing passes
      - A previous version is preserved for comparison
      - Completion is based on criteria rather than endless polish
    - title: Present the work with consent and accurate attribution
      instructions: Ask the intended person whether they are willing to receive a brief piece and through
        which format. Share the finished version with a title, any necessary context and honest attribution
        for borrowed material. State one feedback question, such as what moment remained with them or
        where the meaning became unclear. Do not post publicly, disclose private stories or reuse protected
        material without appropriate permission merely to satisfy release.
      checks:
      - A real willing audience and accessible format are confirmed
      - The finished version is actually shared
      - Attribution and privacy are checked before release
      - One focused feedback question accompanies the work
    - title: Use reception to close or deliberately reopen the piece
      instructions: Record the audience’s actual response or lack of response without inventing impact.
        Compare the response with the intended effect and identify one supported insight. Choose leave
        finished, make one justified revision or carry the lesson into a new work. If you revise, label
        the version and share again only if welcome. A quiet or mixed response does not undo the fact
        of a responsible release.
      checks:
      - Actual audience response or nonresponse remains honest
      - Intention and reception are compared
      - Closure or revision has a specific reason
      - Further sharing respects the audience’s willingness
    adaptation: Use a private accessible exchange, read aloud, provide a transcript or choose a small
      trusted audience. A self-only review can prepare the piece but does not count as reaching another
      person. Defer release when safety, privacy or permission cannot be protected.
    review: What did an actual audience reveal that editing alone did not, and is the work finished or
      being reopened for a concrete reason?
    examples:
      supportive: The piece met its defined criteria, reached a willing reader and a specific response
        informed the next work rather than another endless edit.
      mixed: The release occurred but the intended effect was only partly received, leading to one bounded
        revision.
      contradictory: Private material was posted without consent or imagined audience praise was recorded
        as feedback.
      inconclusive: The work was repeatedly polished but never shared with an appropriate audience or
        reviewed against a definition of done.
  '25.08':
    title: Make a joint miniature with shared decisions and honest credit
    goal: Combine different strengths in a small creative work while negotiating authorship, disagreement
      and credit without one person quietly taking over.
    scope_note: One voluntary collaboration tests a shared process, not a professional contract or proof
      of equal contribution. Ownership and publication terms need explicit agreement appropriate to the
      context.
    burden: Fifteen minutes to agree, thirty minutes to make together and a fifteen-minute joint review.
    setup: With one willing adult, create a six-line invitation to a fictional celebration or a short
      original dialogue. One person proposes images or ideas and the other shapes order and clarity, then
      exchange roles once. Agree that the draft stays private unless both later approve a specific use.
      No payment or legal transfer is involved.
    actions:
    - title: Agree on purpose decision rights and credit before making
      instructions: 'State the desired effect, the small scope and each person’s available time. Ask what
        contribution each wants to make and how disagreements will be resolved: explain the effect sought,
        try both versions and choose together. Decide how credit will name actual contributions and who
        may share or reuse the result. A more experienced person can guide technique without acquiring
        unilateral control over the other’s words or identity.'
      checks:
      - Purpose scope and time are mutually agreed
      - Each collaborator chooses a contribution and a turn at shaping the work
      - A disagreement method is agreed before conflict
      - Credit sharing and reuse expectations are explicit
    - title: Create two alternatives at the point of disagreement
      instructions: Build the miniature together and deliberately pause at one genuine difference, such
        as a comic versus quiet ending. Each person explains the intended effect, then make both short
        alternatives without ridicule. Compare them against the shared purpose and audience rather than
        rank or confidence. Select, combine or leave the disagreement visible by agreement, and record
        how the second person’s contribution changed the result.
      checks:
      - Both collaborators make a substantive contribution
      - A real difference receives two trial alternatives
      - The shared purpose guides the choice
      - The result visibly incorporates rather than merely tolerates the other contribution
    - title: Review control credit and the work’s actual strength
      instructions: Read the final miniature together and ask each person what is stronger because of
        collaboration and what felt constrained. Correct an inaccurate credit or an unagreed edit before
        any sharing. Decide jointly whether to finish, revise once or keep separate versions. Record a
        failed collaboration honestly if consent or control could not be balanced; the existence of a
        joint file alone is not evidence of mature collaboration.
      checks:
      - Each person can name the other’s effect on the work
      - Control and discomfort are discussed without retaliation
      - Credit and unagreed changes are corrected before release
      - The final sharing or revision decision is genuinely mutual
    adaptation: Use asynchronous text, AAC, translated communication or a small accessible division of
      labor. A solo rehearsal can practice negotiating alternatives but cannot establish actual collaboration.
      For paid or public work, clarify rights and compensation through an appropriate agreement rather
      than relying on this exercise.
    review: What became possible because the other person had real influence, and did the credit and decision
      process reflect that influence?
    examples:
      supportive: Two endings were tried and a combined version served the invitation better; both collaborators
        approved credit and private sharing.
      mixed: The output was useful, but one person felt rushed, so the next collaboration changed decision
        timing.
      contradictory: One contributor’s work was published or claimed without permission, or seniority
        replaced the agreed decision process.
      inconclusive: A file had two names but only one person made decisions or contributions.
  '25.09':
    title: Use a fictional scene to hold more than one moral perspective
    goal: Explore ambiguity, memory, identity, suffering and hope through artistic choices that reveal
      more than a straightforward statement of the lesson.
    scope_note: A fictional scene practices moral imagination, not testimony, therapy or representation
      of a community’s lived experience. Personal trauma or disclosure is not required.
    burden: Twenty minutes to prepare two perspectives, thirty minutes to make and a fifteen-minute reception
      review.
    setup: Use a fictional community room being closed for repairs. One person values the place because
      it holds memories; another wants the repair because unsafe access excludes people. Write a short
      scene of no more than 300 words or an accessible equivalent. No actual tragedy, private history
      or harmful confrontation is needed.
    actions:
    - title: Give both people a genuine good and an uncertainty
      instructions: For each fictional person, state what they are protecting, what they fear losing and
        what they do not know about the other. Add one ordinary object that carries memory, such as a
        worn sign, and one practical access detail. Do not make one person a villain merely to make the
        message easy. Write a direct summary of the conflict first so you can later compare what the artistic
        form adds.
      checks:
      - Both perspectives protect a legitimate good
      - Each person has an uncertainty rather than complete moral knowledge
      - A concrete memory object and access detail are included
      - The conflict is summarized plainly before artistic treatment
    - title: Write the scene through action rather than a final sermon
      instructions: Show the two people encountering the object while a repair notice is posted. Give
        each one action and one line of dialogue that reveals their concern without announcing the correct
        moral. Let the ending contain a choice, unresolved tension or small hope consistent with the facts.
        Avoid using suffering as spectacle or assigning a real cultural identity you have not responsibly
        researched simply to add emotional weight.
      checks:
      - Both perspectives appear through action and dialogue
      - The object and access detail carry part of the meaning
      - The ending permits a truthful unresolved tension or bounded hope
      - No real group or trauma is used as decorative suffering
    - title: Compare what the work carries with the plain explanation
      instructions: Share with a willing reader and ask what each person might be protecting, what remains
        ambiguous and which detail mattered. Compare that response with the initial direct summary. Identify
        something the scene communicated differently, such as the coexistence of memory and exclusion,
        and one risk of misreading. Revise a caricature or unintended implication while preserving complexity;
        the work need not force agreement or a single moral conclusion.
      checks:
      - A reader or delayed self-review examines both perspectives
      - The scene is compared with the original direct summary
      - A distinct artistic contribution and a possible misreading are identified
      - Revision removes caricature without erasing legitimate ambiguity
    adaptation: Use a dialogue, audio description, collage of original words or another safe accessible
      form. Keep the case fictional when real experience is painful or private. Art is not a substitute
      for professional support, historical research or the right of people to tell their own stories.
    review: What could the scene let a reader feel or notice that the summary could not fully carry, and
      where did imagination risk misrepresenting someone?
    examples:
      supportive: The reader understood both attachment to the room and the exclusion caused by its access,
        and the worn sign carried their tension without a moral speech.
      mixed: The scene conveyed loss but flattened the access concern, so the second person gained a more
        concrete action.
      contradictory: A real person’s trauma was exposed or a cultural stereotype was used to make the
        story emotionally persuasive.
      inconclusive: The piece merely restated a lesson and gave no concrete action, ambiguity or comparison
        with a direct explanation.
  '25.10':
    title: Read two cultural works with context rather than a ranking of peoples
    goal: Study creative inheritance across time and place while distinguishing observation, historical
      context, interpretation and the limits of one work’s representativeness.
    scope_note: Two museum records begin cultural literacy; they do not represent entire cultures or establish
      authority to reproduce restricted material. Historical interpretation remains revisable.
    burden: Two twenty-minute study periods and a twenty-minute contextual comparison.
    setup: Use The Metropolitan Museum of Art’s official records for Hokusai’s Under the Wave off Kanagawa,
      object 45434, and Vincent van Gogh’s Wheat Field with Cypresses, object 436535, or accessible catalog
      descriptions of them. Read the objects’ own dates, materials and context rather than relying on
      a social-media caption. No museum travel or image copying is required.
    actions:
    - title: Separate visible choices from the catalog’s historical claims
      instructions: For each work, note three formal details available through the image or accessible
        description, then separately record maker, date or date range, medium and one contextual fact
        supported by the museum record. Mark uncertainty and distinguish the museum’s interpretation from
        your own response. Do not infer the artist’s mental state or the values of an entire nation from
        one work. Keep enough source information to revisit the record.
      checks:
      - Three formal observations are separated from contextual claims
      - Maker date medium and one sourced context fact are recorded
      - Interpretation and uncertainty are labeled
      - One object is not treated as a complete culture or psychological diagnosis
    - title: Compare material tradition and historical change
      instructions: Ask how a woodblock print and an oil painting make different expressive choices and
        what production, circulation or audience questions arise. Identify one inherited convention, one
        possible adaptation and one missing perspective, using an additional museum or community-authored
        source when needed. Compare without ranking the cultures as advanced or primitive. Note that surviving
        museum collections are selective and that absence from a collection is not absence of cultural
        achievement.
      checks:
      - The two media and their expressive constraints are compared
      - Inheritance adaptation and a missing perspective are considered
      - A further claim is sourced or explicitly left unresolved
      - The comparison avoids ranking cultures or treating collections as complete
    - title: Write a contextual appreciation and an unanswered question
      instructions: Write a short appreciation of each work that links a specific choice to its effect
        and historical setting. Add one way your first impression changed and one question requiring further
        study, such as circulation, audience or a later reinterpretation. Choose a next work in a different
        form, such as music, ritual, literature or craft, without claiming the two examples complete cultural
        literacy. Preserve attribution and check rights before any later reproduction.
      checks:
      - Each appreciation connects choice effect and context
      - A changed first impression is named
      - A specific unanswered historical or cultural question remains
      - The next study broadens form without claiming completed cultural expertise
    adaptation: Use museum audio, text descriptions, large print or a library’s accessible catalog. Choose
      other publicly documented works if the defaults are inaccessible or unsuitable. Respect customary
      access, religious meaning and community authority; availability online does not settle every ethical
      reuse question.
    review: Which contextual fact changed the work’s meaning for you, and what did these two records leave
      outside their frame?
    examples:
      supportive: The learner connected medium and composition to different effects, revised an initial
        impression and kept a question about original audiences open.
      mixed: Formal details were clear, but a claimed influence lacked support and was changed into a
        research question.
      contradictory: One work was used to rank whole cultures or a museum caption was treated as proof
        of an artist’s diagnosis.
      inconclusive: Images were recognized by title without studying materials, context, historical change
        or missing perspectives.
  '25.11':
    title: Make one small aesthetic change serve use and welcome
    goal: Choose a coherent arrangement of dress, space or objects that expresses identity and beauty
      while respecting function, access and hospitality rather than copying status cues.
    scope_note: One small arrangement tests fit and consideration, not a makeover, a purchase recommendation
      or a universal standard of taste.
    burden: Twenty minutes to define the effect, a twenty-minute rearrangement and two short use checks.
    setup: 'Choose a small surface or reading corner already under your control. Use only existing safe
      items: a book, a useful container and one object you enjoy. The intended effect is calm and welcoming
      while keeping the surface usable. Do not move another person’s possessions or obstruct exits, mobility
      routes, ventilation or necessary equipment.'
    actions:
    - title: Name the function and aesthetic intention together
      instructions: Write what the space must enable, who uses it and what feeling or identity you hope
        it expresses. Choose two organizing principles, such as a clear working area and a repeated material
        or shape, rather than an expensive brand or copied photograph. Identify a practical constraint
        and another user’s access need. Distinguish what you genuinely enjoy from what you hope will impress
        someone.
      checks:
      - Function users and intended effect are explicit
      - Two coherent organizing principles guide the change
      - A practical and an access constraint are identified
      - Personal enjoyment is separated from status imitation
    - title: Rearrange existing items within permission and safety
      instructions: Remove only items you control from the small area, restore the necessary functional
        objects first and then place the enjoyed object deliberately. Check reach, visibility, stability,
        lighting and clear passage without modifying electrical fittings or furniture structure. Compare
        the arrangement with the two principles and make one adjustment. No purchase is required and another
        person’s different taste does not authorize replacing their belongings.
      checks:
      - The change uses existing items within the participant’s control
      - Function and safe access are restored before decoration
      - Placement follows the chosen principles
      - No unauthorized possession change or hazardous modification occurs
    - title: Test ordinary use and another person’s welcome
      instructions: Use the area for its intended task on two occasions. If another person uses it, ask
        whether it is easier or harder to use and whether anything feels excluding or inconvenient. Record
        actual function and enjoyment, not how prestigious the result looks. Keep, adjust or reverse the
        change based on those observations, and explain how it expresses identity without requiring everyone
        else to share the same aesthetic.
      checks:
      - Two ordinary use opportunities test the arrangement
      - A relevant other user’s feedback or its absence is recorded
      - Function enjoyment and consideration are reviewed separately
      - The final choice permits adjustment or reversal without a taste contest
    adaptation: Use a clothing combination, digital workspace or tactile arrangement when a physical corner
      is unavailable. Preserve assistive devices and sensory needs. Aesthetic coherence can be achieved
      without buying, discarding useful possessions or conforming to gender, class or cultural stereotypes.
    review: Did the change make ordinary use and welcome better as well as looking intentional, and which
      detail was for you rather than for an imagined audience?
    examples:
      supportive: The reading area kept an accessible clear surface and a personally meaningful object;
        two uses confirmed that the arrangement worked.
      mixed: The appearance was coherent but a frequently used item became harder to reach, so the layout
        was revised.
      contradictory: Another person’s belongings were removed without consent or access was sacrificed
        to imitate a fashionable image.
      inconclusive: A style was named without a concrete permitted change or any test of use and consideration.
  '25.12':
    title: Learn one shareable form from a willing tradition bearer
    goal: Practice a creative form with attention to its lineage, community standards and permitted transmission
      rather than treating inherited craft as raw material for isolated self-expression.
    scope_note: One short lesson is an introduction, not membership, mastery or authority to teach restricted
      knowledge. The community or practitioner’s boundaries govern access and sharing.
    burden: Fifteen minutes to arrange permission, one bounded lesson or documented tutorial and a twenty-minute
      practice review.
    setup: Choose a form explicitly offered for learning, such as a simple ensemble rhythm, ordinary family
      stitch or publicly taught folding pattern. Ask a willing knowledgeable practitioner or use a clearly
      authorized community-produced beginner resource. Prepare questions about where the form comes from,
      its purpose, one foundation technique and what may be shared. Do not assume a sacred or restricted
      form is available because it appears online.
    actions:
    - title: Ask about the form’s history standards and sharing limits
      instructions: Confirm that the teacher or resource is authorized and willing to share this beginner
        form. Ask what community or lineage sustains it, what makes an attempt recognizable, what should
        not be changed yet and whether you may later demonstrate it. Agree on time, any fair compensation
        and recording rules before the lesson. A person can speak from their own practice without being
        required to represent an entire culture.
      checks:
      - The learning invitation and teacher’s scope are confirmed
      - History purpose and one recognizable standard are discussed
      - Recording teaching and later sharing limits are explicit
      - Time compensation and representation are handled respectfully
    - title: Practice the foundation and accept a specific correction
      instructions: Follow the demonstrated beginner sequence using safe accessible materials. Attempt
        it twice and compare with the teacher’s stated standard, such as sequence, rhythm or alignment,
        rather than making your own version immediately. Ask for one concrete correction or use the authorized
        resource’s guidance, then repeat that component. Keep the attempt private when sharing has not
        been permitted and do not describe it as authentic mastery.
      checks:
      - Two foundation attempts follow the taught sequence
      - A community or teacher-defined standard guides comparison
      - One specific correction is practiced
      - Privacy and the learner’s limited status remain clear
    - title: Return the learning with attribution and a permitted next step
      instructions: Explain the form’s purpose and your learning source in your own words, checking accuracy
        with the teacher when possible. Ask whether the appropriate next step is more practice, joining
        a group, supporting the teacher’s work or a limited demonstration. Share only what was permitted
        and credit the actual lineage and contribution without implying endorsement. Record what remains
        inaccessible or not yours to transmit.
      checks:
      - The form’s purpose and learning source are accurately acknowledged
      - A next step is chosen with the teaching context in mind
      - Any demonstration stays within explicit permission
      - Restricted or unlearned knowledge is not claimed or transmitted
    adaptation: Use a publicly shared accessible beginner form or an ordinary inherited practice freely
      offered by someone you know. Declining access is a legitimate boundary, not an obstacle to bypass.
      Do not record secretly, commercialize the lesson or pressure a practitioner to share protected knowledge.
    review: What did learning from the practice’s keepers change about your technique or responsibility,
      and what are you not yet entitled or able to pass on?
    examples:
      supportive: A willing teacher explained an ordinary stitch, corrected alignment and approved a limited
        demonstration with attribution to the teaching source.
      mixed: The technique improved, but permission to teach others was not given, so practice remained
        private.
      contradictory: A restricted form was copied from an online recording and presented as the learner’s
        original or authoritative tradition.
      inconclusive: A cultural product was admired or bought without learning its technique, standards,
        history or transmission boundaries.
  '25.13':
    title: Evaluate a cultural use before borrowing or publishing it
    goal: Distinguish respectful exchange from extraction, stereotype or misrepresentation by checking
      context, permission, attribution, benefit and power in a specific proposed use.
    scope_note: This is an ethical and permission review, not a universal rule about who may create what
      or a legal determination of copyright. Community, rights-holder and individual perspectives may
      differ.
    burden: Thirty minutes to compare three cases and twenty minutes to revise one proposed use.
    setup: 'Use three fictional cases: a community teacher offers a public beginner pattern with attribution
      conditions; a sacred ceremony recording appears online without clear authorization; and a commercial
      seller uses a community motif while claiming to represent that community. No actual motif, ceremony
      or protected expression needs to be reproduced.'
    actions:
    - title: Separate access from permission and representation
      instructions: For each case, identify the source, context, proposed use, audience and who could
        authorize or object to that use. Distinguish viewing, learning privately, adapting, teaching and
        selling; permission for one is not permission for all. Note legal rights, customary restrictions
        and ethical concerns separately. Avoid assuming either that online availability permits everything
        or that one person can give universal consent for an entire community.
      checks:
      - Source context use and audience are explicit in all three cases
      - Viewing learning adaptation teaching and sale are distinguished
      - Legal customary and ethical questions remain separate
      - No online availability or single representative is treated as unlimited permission
    - title: Trace attribution benefit and power before choosing
      instructions: Ask who receives credit, money, visibility or risk and who controls how the material
        is described. Identify stereotype, false authenticity or missing community benefit where supported
        by the fictional facts. For the public lesson, retain the stated attribution conditions; for the
        unverified ceremony, defer use pending appropriate authorization; for the seller, remove unsupported
        representation and investigate legitimate permission and benefit. State what remains uncertain
        rather than treating a slogan as the analysis.
      checks:
      - Credit benefit control and risk are traced concretely
      - Misrepresentation is identified from facts rather than identity assumptions
      - Each case receives a proportionate permission disposition
      - Uncertainty and different perspectives are retained
    - title: Rewrite the proposed use into a respectful or declined action
      instructions: 'Choose one case and write the exact revised plan: what will be used, what will not,
        who must consent, how attribution appears and how benefit or compensation will be handled. A valid
        result may be not to use the material and create an original alternative. Recheck that credit
        is not being used as a substitute for permission and that consent can be revisited if the scope
        changes. No publication or commercial sale occurs during the exercise.'
      checks:
      - The revised plan specifies use limits consent and attribution
      - Benefit or compensation is addressed where relevant
      - Declining use and making an original alternative remain legitimate
      - A scope change requires renewed permission rather than presumed consent
    adaptation: Use the fictional cases when cultural access or power dynamics are uncertain. Seek an
      appropriately authorized practitioner, community institution, rights holder or legal adviser for
      real use. Do not demand free cultural education, force consensus among community members or disclose
      restricted material while asking whether it is restricted.
    review: Which part of the proposed use changes the power or benefit relationship, and what permission
      or representation claim must be corrected before proceeding?
    examples:
      supportive: The learner retained attribution for the public lesson, deferred the unverified recording
        and replaced a false community endorsement with an honest limited description.
      mixed: Legal reuse looked possible, but customary restrictions and benefit questions remained unresolved,
        so publication was deferred.
      contradictory: Credit was treated as permission or a community’s disagreement was dismissed because
        the material could be downloaded.
      inconclusive: Appropriation was approved or condemned in general terms without examining a specific
        use, authority, benefit or context.
