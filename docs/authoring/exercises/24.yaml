schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '24'
exercises:
  '24.01':
    title: Prepare an earnings conversation from value and real alternatives
    goal: Connect capability, contribution, bargaining position and mobility to an informed income decision
      rather than treating confidence or aspiration as evidence of market value.
    scope_note: A low-stakes preparation and rehearsal is not a salary forecast, promise of promotion
      or instruction to leave employment. Employment, pay disclosure and negotiation rights vary by role
      and jurisdiction.
    burden: Thirty minutes to assemble evidence, a fifteen-minute rehearsal and one bounded next action.
    setup: Use a fictional worker who reliably completes an agreed service, has taken on scheduling responsibility
      and is considering a pay discussion or a different role. Prepare columns for demonstrated contribution,
      relevant capability, credible comparison, constraints, alternatives and requested outcome. Use public
      role descriptions or a fictional employer brief; no confidential employer or coworker salary information
      is required.
    actions:
    - title: Build a contribution and position brief
      instructions: Separate work actually delivered from effort, title and hoped-for future value. Record
        two examples of benefit to a customer or team and one capability gap that limits the next role.
        Compare at least two appropriately similar public role descriptions, noting location, duties,
        hours and qualification differences rather than treating an advertised range as an offer. List
        mobility constraints such as care, disability, contract obligations or training costs and one
        realistic alternative to immediate departure.
      checks:
      - Two contributions are supported by concrete outcomes
      - A capability gap and role-comparison limitations are named
      - Mobility and personal constraints remain part of the economics
      - An advertised range is not represented as a promised offer
    - title: Rehearse a specific request and a non-threatening alternative
      instructions: State the requested pay, responsibility, development support or review process with
        a reason tied to the brief. Rehearse a response to yes, no and not yet. For not yet, ask which
        observable requirements and decision date would permit reconsideration. Do not bluff another offer,
        fabricate results, threaten or disclose another person’s private compensation. Explain the best
        legitimate alternative available if agreement is not reached and what it would cost in time, money
        and uncertainty.
      checks:
      - The request is specific and grounded in contribution
      - Yes no and not-yet responses are rehearsed
      - A follow-up criterion and decision date are requested
      - Alternatives are credible rather than fabricated leverage
    - title: Take one information or capability step before deciding
      instructions: 'Choose one actual safe next action: request the applicable review process, ask a
        permitted role-information question or practice the identified weak capability. Record what new
        information changed the options. Compare stay, improve the present role and pursue another opportunity
        without assuming higher gross pay is better after hours, costs and risk. A rehearsal remains preparation;
        a real negotiation, offer or income change must be recorded only if it occurs.'
      checks:
      - One bounded information or capability action occurs
      - The resulting information revises or confirms the options
      - Total tradeoffs include more than gross pay
      - Preparation is distinguished from an offer or increased earnings
    adaptation: Use an accessible written request, independent career adviser, union representative or
      trusted mentor within applicable rules. The fictional case is adequate when a real discussion could
      trigger retaliation or reveal protected information. Resolve legal, immigration, contract or benefits
      consequences through appropriate qualified support before acting.
    review: Which evidence strengthens the request, and which constraint or missing capability makes the
      next step more useful than an immediate demand?
    examples:
      supportive: The worker brief linked scheduling responsibility to a concrete benefit and led to a
        specific review request with a development criterion rather than a vague demand.
      mixed: The comparison suggested a possible opportunity, but location and hours made the earnings
        advantage uncertain.
      contradictory: Results or another offer were fabricated, confidential pay data was exposed or the
        exercise was treated as a guarantee of a raise.
      inconclusive: A desired income was stated without contribution evidence, alternatives, constraints
        or a concrete next action.
  '24.02':
    title: Deliver a tiny requested offer and learn whether it creates value
    goal: Identify a costly recurring problem, make a bounded offer, deliver something usable and revise
      it from actual stakeholder experience.
    scope_note: One tiny offer tests a problem-and-delivery loop, not a viable business, paid demand or
      permission to sell regulated services. No company formation, investment or public launch is required.
    burden: Twenty minutes of discovery, up to forty minutes to make a small prototype and a fifteen-minute
      use review.
    setup: 'Default to a willing organizer who repeatedly answers the same questions about a small community
      event. Offer a one-page factual attendee guide using only approved public information. The organizer
      may decline. Prepare four fields: recurring problem, current workaround, promised small outcome
      and evidence of usefulness. Do not collect attendee personal data.'
    actions:
    - title: Confirm the problem before designing the offer
      instructions: Ask the organizer about the most recent repeated question, how often it occurs, what
        they currently do and what time or confusion it creates. Record an actual example with permission,
        not an imagined complaint. Ask who uses the information and who can approve it. If the problem
        is not important or already solved, change or stop the offer rather than persuading the person
        that they need your idea.
      checks:
      - A recent actual problem and current workaround are described
      - Frequency and cost are explored without leading the answer
      - User and approver roles are identified
      - A weak problem signal can lead to stopping
    - title: Agree on and deliver one small usable outcome
      instructions: Propose an approved guide containing event purpose, time, location or access method,
        what to bring and one contact route. Agree on a delivery date and a limit of one revision. Produce
        the guide using accurate approved information, accessible formatting and no unsupported claims.
        Have the organizer confirm facts before any permitted use. Do not call interest a purchase, use
        fake testimonials or promise a full service beyond the small offer.
      checks:
      - The offered result and delivery limit are agreed
      - The guide contains the five specified practical elements
      - Facts and accessibility are checked before permitted use
      - No commercial demand or testimonial is invented
    - title: Observe use and revise the offer from the result
      instructions: Ask a willing intended reader to find the event time and next action using the guide
        without coaching. Record a success, confusion or missing fact and revise the one most important
        issue. Ask the organizer whether the result actually reduced an avoidable task or merely moved
        work elsewhere. Decide whether to repeat, narrow or abandon the offer. Keep free prototype usefulness
        separate from willingness and ability to pay.
      checks:
      - An intended reader attempts two real information tasks
      - A concrete failure or success informs one revision
      - The organizer’s burden is checked rather than assumed reduced
      - Usefulness is not equated with paid demand or business viability
    adaptation: Use a fictional organizer and a clearly labeled usability rehearsal when access to a willing
      stakeholder is unavailable; actual customer value then remains untested. Use a spoken or accessible
      digital guide. Avoid sensitive information, regulated advice, spam, deceptive sales pressure or
      spending beyond a preselected small limit.
    review: Which part of the delivered offer solved a demonstrated problem, and what evidence would still
      be needed before asking someone to pay for it?
    examples:
      supportive: An organizer’s repeated arrival question shaped the guide, a reader found the time unaided
        and a confusing access instruction was corrected.
      mixed: The reader found the information, but maintaining the guide added work, so the offer was
        narrowed.
      contradictory: Praise was represented as paying demand or a prototype was publicly distributed with
        unapproved facts.
      inconclusive: A product idea was described without a real problem conversation, delivered output
        or observed use.
  '24.03':
    title: Explain how a small service works beyond its sales number
    goal: Connect customer incentives, competition, pricing, marketing, operations, accounting and regulation
      in one coherent business model.
    scope_note: The fictional service map is business literacy, not a compliance determination or prediction
      of commercial success. Revenue alone is not profit or cash available.
    burden: Thirty minutes for the operating map and twenty minutes for a failure-scenario explanation.
    setup: Use a fictional service that formats approved event notices. It receives four orders at 50
      each, pays direct labor and materials of 25 per order and has 60 in period overhead. Two customers
      pay this period and two next period. Opening cash is 100; all stated costs are paid now. No other
      costs, taxes or movements are included in the example.
    actions:
    - title: Map why each participant chooses the service
      instructions: Identify user, buyer, worker, supplier and any approver or regulator. State the problem
        solved, an alternative such as doing the task internally, the buyer’s reason to pay 50 and the
        worker’s incentive to deliver accurately. Describe one truthful marketing channel and one potential
        conflict between attracting sales and maintaining quality. Mark privacy, licensing, contract,
        employment and tax questions for local verification rather than assuming a tiny service is exempt.
      checks:
      - User buyer worker supplier and oversight roles are distinct
      - The offer is compared with a real alternative to buying
      - Incentives and a quality-versus-sales tension are explained
      - Relevant compliance questions are left for actual verification
    - title: Reconcile orders profit and cash with the supplied numbers
      instructions: Calculate revenue of 200, direct costs of 100 and period overhead of 60, leaving 40
        before omitted taxes or other costs. Cash receipts are only 100 now, so opening cash 100 plus
        receipts 100 less payments 160 leaves 40. The unpaid 100 is a receivable, not spendable cash.
        Draw the sequence from inquiry to approval, production, delivery, invoice and collection; identify
        where errors or delays create costs.
      checks:
      - Revenue direct cost overhead and provisional profit reconcile
      - Current receipts are distinguished from total orders
      - Closing cash equals 40 under the stated assumptions
      - The operating sequence includes approval delivery and collection
    - title: Explain a disruption across the whole system
      instructions: Test a customer correction that requires unpaid rework and a payment delay affecting
        the remaining two orders. Trace the consequences for capacity, quality, cash, customer trust and
        future pricing without inventing a new forecast. Propose one operational control, such as approved
        source text before formatting, and one information needed to judge whether the price covers all
        costs. Explain the service in plain language to a listener or recording, correcting any claim
        that sales alone establish health.
      checks:
      - Rework and payment delay are traced beyond the sales figure
      - A concrete preventive control is proposed
      - An omitted cost or demand uncertainty is identified
      - The final explanation distinguishes business mechanisms from a success prediction
    adaptation: Use tokens or a diagram and keep all transactions fictional. An actual enterprise requires
      its own accounting, worker, privacy, consumer and tax obligations. Do not enter customer identifiers
      or perform a real regulated service to complete the case.
    review: Which operating or cash constraint could make the service fail despite positive sales, and
      what would you verify first?
    examples:
      supportive: The learner distinguished 40 provisional profit from the timing of cash and identified
        approval-before-production as a control on rework.
      mixed: The operating map was sound, but an omitted tax or labor cost prevented a viability conclusion.
      contradictory: Receivables were treated as available cash or the small size of the service was used
        to dismiss legal and worker obligations.
      inconclusive: Revenue was calculated without explaining costs, incentives, competition, delivery
        or collection.
  '24.04':
    title: Let three problem interviews challenge a proposed offer
    goal: Find out whether a specific problem is real, recurring, costly and poorly served through evidence
      from actual users or buyers rather than agreement with a pitch.
    scope_note: Three interviews are a small discovery sample, not statistical market validation, paid
      demand or permission to gather sensitive data. No sales commitment is sought.
    burden: Fifteen minutes to prepare, three willing ten-minute conversations and a twenty-minute synthesis.
    setup: 'Use the hypothesis that volunteer organizers struggle to keep event instructions current.
      Prepare five questions: last occurrence, current workaround, consequence, frequency and who decides
      or pays for a solution. Recruit willing relevant adults through an appropriate existing connection;
      do not pressure subordinates, customers or strangers or imply that participation buys access.'
    actions:
    - title: Predeclare the problem and what would disconfirm it
      instructions: Write the user group, the exact recurring difficulty and why you think it matters.
        List two observations that would weaken the idea, such as an existing reliable workaround or the
        problem occurring too rarely to justify change. Prepare neutral questions about past behavior,
        not whether the person likes your imagined product. Decide what minimal notes are permitted and
        how to omit identities, private details and recordings unless separately and freely authorized.
      checks:
      - The hypothesis specifies user problem and consequence
      - Two disconfirming observations are declared in advance
      - Questions ask about past behavior rather than praise for an idea
      - Consent and minimal note boundaries are explicit
    - title: Conduct the conversations without selling the answer
      instructions: Ask the five prepared questions of three willing relevant people, allowing not applicable
        and decline. Request a concrete recent example and distinguish what was experienced from an opinion
        about the future. Clarify whether the user and buyer are the same person. Do not defend the idea,
        promise a solution or turn a compliment into a commitment. If fewer interviews occur, keep the
        actual sample size visible instead of inventing the missing voices.
      checks:
      - Actual sample size and participation remain honest
      - Each conversation seeks a recent example and workaround
      - User and buyer roles are checked
      - The interviewer does not pitch pressure or convert praise into demand
    - title: Change the offer or the decision from the evidence
      instructions: Make a three-row evidence comparison with recurrence, cost, workaround quality and
        decision authority. Identify a pattern, a contradiction and a major missing group or bias in the
        sample. Choose to narrow the problem, change the offer, seek a different group or stop. State
        one observable next test, such as a freely accepted prototype-use session, and what result would
        change the decision again. No market-size or revenue claim follows from these interviews alone.
      checks:
      - The synthesis includes contradiction as well as a pattern
      - Sampling limits and a missing perspective are named
      - The offer or next decision changes explicitly from evidence
      - The next test has an observable result and no invented demand
    adaptation: Use accessible written or asynchronous interviews with the same neutral questions. A supplied
      fictional three-person case can rehearse analysis but does not substitute for actual discovery.
      Avoid minors, vulnerable groups, employer-confidential problems or regulated settings without proper
      permission and safeguards.
    review: What did the interviews make less certain, and what changed in the offer because of something
      a participant actually experienced?
    examples:
      supportive: Two organizers already had a working system while one described a specific update failure,
        leading to a narrower problem and a small prototype test.
      mixed: All three liked the idea, but none described a costly recent event, so demand remained unvalidated.
      contradictory: Leading questions manufactured agreement or invented interviews were used to claim
        market proof.
      inconclusive: Conversation notes were collected without a specific hypothesis, disconfirmation or
        a changed next decision.
  '24.05':
    title: Calculate a tiny offer’s unit economics and cash strain
    goal: Relate price, variable cost, fixed cost, acquisition, retention and payment timing to a conditional
      viability judgment rather than revenue enthusiasm.
    scope_note: This is a fictional single-product model with deliberately stated assumptions. It is not
      a valuation, accounting standard, investment recommendation or demand forecast.
    burden: Thirty minutes for the model and twenty minutes for price, volume and cash stress tests.
    setup: A fictional label-formatting service charges 12 per unit. Variable cost is materials 2, direct
      labor 4 and transaction cost 1. Monthly fixed cost is 100. The base month sells 40 units. Separately,
      a 30 acquisition campaign brings ten new customers; repeat purchase and future retention are unknown.
      Treat the campaign as an additional cost, not included in the base fixed or variable figures.
    actions:
    - title: Calculate contribution and break-even with all assumptions visible
      instructions: Total variable cost as 7 and contribution per unit as 5. Calculate the base 40-unit
        revenue as 480, variable cost as 280 and profit before the separate campaign, taxes and omitted
        costs as 100. Break-even is 100 divided by 5, or 20 units. Identify what labor, capacity, refunds,
        tax or support costs may still be missing in an actual offer. If contribution is zero or negative,
        more units do not cover positive fixed costs under this model.
      checks:
      - Variable cost equals seven and contribution equals five
      - Base revenue cost and provisional profit reconcile
      - Break-even equals twenty units under the stated assumptions
      - Omitted costs and nonpositive contribution are addressed explicitly
    - title: Test acquisition pricing and payment timing separately
      instructions: Calculate acquisition cost as 30 divided by ten, or 3 per new customer, and reduce
        the base month’s 100 provisional profit to 70 if that campaign occurs in the same month. Do not
        invent lifetime value from unknown retention. At a price of 10 with unchanged variable cost, contribution
        becomes 3 and at least 34 whole units are needed to cover 100 fixed cost. If customers pay later
        but labor and materials are due now, describe the funding gap separately from accounting profit.
      checks:
      - Acquisition cost equals three per new customer
      - The separate campaign is counted once and leaves seventy in the base case
      - The lower-price break-even is rounded up to thirty-four units
      - Unknown retention and collection timing remain separate uncertainties
    - title: Make a conditional viability decision and the next measurement
      instructions: Choose proceed to a bounded test, redesign or stop, citing the decisive assumption.
        Set a maximum affordable trial cost and a capacity limit, and specify one measurement such as
        actual support time per order, paid conversion or repeat use. State a stop condition for negative
        contribution, poor delivery or unacceptable harm. A mathematically positive model is not proof
        that forty customers exist or that scaling preserves labor, quality and cost.
      checks:
      - The decision names its most consequential assumption
      - A bounded trial budget and capacity limit are specified
      - One real-world measurement would resolve a stated uncertainty
      - Scale and demand are not inferred from the arithmetic alone
    adaptation: Use a calculator, counters or a simple handwritten table. Keep all inputs fictional unless
      authorized to use non-sensitive business records. Actual pricing, tax, employment and financing
      decisions may require qualified advice; no sale, loan or securities offer is required.
    review: Which assumption could reverse the viability judgment, and what is the cheapest honest way
      to measure it before increasing commitment?
    examples:
      supportive: The learner calculated contribution correctly, counted the campaign once and selected
        actual support time as the next uncertainty to test.
      mixed: The model was positive at forty units but payment delay and unknown demand made a larger
        launch premature.
      contradictory: Revenue was called profit, acquisition was double-counted or omitted, or a lifetime
        value was invented from one purchase.
      inconclusive: A price was chosen without variable costs, break-even, timing or a conditional next
        test.
  '24.06':
    title: Make a small service handoff inspectable from order to record
    goal: Create a repeatable delivery and record path with clear approvals, quality checks and compliance
      questions so another authorized person can understand what happened.
    scope_note: A fictional order packet is an operations rehearsal, not a registered enterprise, tax
      filing, contract drafted for use or certification of legal compliance.
    burden: Forty minutes to build the packet and twenty minutes for an independent walkthrough.
    setup: Use a fictional approved event-notice order for 50 due on Friday. Prepare an order code, approved
      source text, scope and price, owner, delivery date, quality checklist, invoice or receipt example,
      correction log and retention decision. Use no actual customer identity, payment details or regulated
      service.
    actions:
    - title: Define the order and the applicable unanswered obligations
      instructions: Write what will be delivered, what is excluded, who approves facts, when payment is
        due and what happens if the requester changes the scope. Make a short register of local questions
        about business registration, tax, employment, consumer terms, accessibility, privacy and any sector-specific
        permission. Assign each to an official source or qualified adviser rather than marking it compliant
        because a template exists. Record how long the fictional packet should be retained and who may
        see it.
      checks:
      - Scope price approval and payment terms are explicit
      - Change handling and delivery ownership are defined
      - Each compliance topic has a verification route rather than an assumed answer
      - Access and retention are decided before creating more records
    - title: Run one synthetic order through the whole workflow
      instructions: Produce the notice from the approved text, check time, place, access instructions
        and contact accuracy, and mark approval before release. Create an invoice or receipt labeled synthetic
        and a record of whether payment is due or received. Introduce a corrected time as a test change,
        retain the superseded version internally and issue a clear replacement. Do not erase the correction
        or expose unnecessary customer information to make the packet seem thorough.
      checks:
      - The output is checked against approved source information
      - Approval precedes the simulated release
      - Due and received payments are not conflated
      - A correction remains traceable without unnecessary private data
    - title: Have another reader reconstruct the order without rescue
      instructions: Ask a willing reader, or perform a separated self-review after a break, to identify
        the current version, approval, amount due, delivery status and unresolved obligation. Let them
        use the packet without verbal hints. Fix the first ambiguity and repeat the affected question.
        State which real professional checks would still be needed before operating this service; a readable
        packet is only one part of lawful and reliable delivery.
      checks:
      - Five operational facts are recoverable from the packet
      - The walkthrough occurs without author coaching
      - A concrete ambiguity is corrected and retested
      - Unverified compliance remains open despite a successful workflow rehearsal
    adaptation: Use accessible forms, voice records or a paper folder with the same minimal fields. A
      sole operator can use delayed self-review but should label independence limits. Do not process actual
      payments, sign terms, collect sensitive customer data or perform licensed work as a test.
    review: Could someone continue or audit the order from the records alone, and which missing authority
      or compliance check still prevents real operation?
    examples:
      supportive: The reader found the corrected notice and unpaid invoice without help, while a local
        tax-registration question stayed explicitly open.
      mixed: The order could be delivered but the approval trail was ambiguous and required a clearer
        version marker.
      contradictory: A template was treated as proof of compliance or a correction was deleted to hide
        an error.
      inconclusive: A checklist existed without a completed synthetic order, traceable records or a reconstruction
        test.
  '24.07':
    title: Distinguish useful advantage from exclusion in a fictional market
    goal: Explain how competition, entry barriers, network effects, lock-in and market power affect users
      without equating success with wrongdoing or treating exclusion as ordinary value creation.
    scope_note: The cases teach economic and ethical analysis, not an antitrust ruling. Legal market definition,
      power and unlawful conduct require fact-specific qualified analysis.
    burden: Thirty minutes to map three cases and fifteen minutes to compare possible remedies.
    setup: 'Use three fictional booking services: A wins users through reliable accessibility and low
      error rates; B becomes more useful as more venues join but permits usable data export; C has many
      venues and blocks exporting customer-owned schedules while imposing an exclusive-dealing term. No
      market shares or legal conclusions are supplied.'
    actions:
    - title: Map value and switching options for each service
      instructions: For each case, identify the benefit to users, available substitutes, cost of switching,
        barriers facing a new entrant and whether scale itself improves the service. Distinguish A’s quality
        advantage from B’s network effect and C’s potential lock-in. Ask what evidence would establish
        a relevant market and durable power; a large user count or high price alone does not settle the
        legal question.
      checks:
      - Quality network effects and lock-in are distinguished
      - Substitutes switching costs and entry barriers are considered
      - User benefit is retained even when power raises concern
      - Missing market and power evidence prevents a legal verdict
    - title: Trace who benefits and who loses from a restrictive practice
      instructions: Choose C’s export restriction and describe effects on existing customers, potential
        entrants, workers and service quality. Write one possible legitimate justification and what evidence
        would test it, then one less restrictive way to meet that aim. Explain how predatory or exclusionary
        conduct differs from simply competing well, without asserting that the fictional facts satisfy
        a legal test. Do not contact competitors to coordinate prices, customers or market allocation.
      checks:
      - The restriction is traced across several affected groups
      - A possible justification is tested rather than dismissed or accepted automatically
      - A less restrictive alternative is considered
      - No illegal coordination or unsupported legal determination is proposed
    - title: Recommend an evidence-seeking response with limits
      instructions: Compare transparency, interoperability or export improvements, user switching, independent
        oversight and qualified competition advice. Select a proportionate response for the fictional
        case and state what additional fact would change it. Explain the tradeoff between preserving genuine
        innovation and preventing avoidable exclusion. A consumer-welfare claim must address price, quality,
        choice and innovation rather than assuming the cheapest option is always best.
      checks:
      - Several proportionate responses are compared
      - The selected response has an explicit revising fact
      - Innovation and exclusion risks are both considered
      - Consumer effects include quality choice and innovation as well as price
    adaptation: Use a familiar non-sensitive service category and public educational material. Avoid accusations
      about a real business without adequate evidence. Current competition law and remedies vary by jurisdiction;
      use a qualified authority for actual conduct, merger or contract decisions.
    review: Which advantage comes from making the service better, which depends on preventing alternatives,
      and what evidence still separates a concern from a justified conclusion?
    examples:
      supportive: The learner preserved B’s genuine network benefit while identifying C’s export restriction
        as a concern needing market and justification evidence.
      mixed: Lock-in was clear, but the absence of substitute and contract facts kept a legal judgment
        open.
      contradictory: Market success was automatically called illegal or competitors were encouraged to
        coordinate prices to improve fairness.
      inconclusive: Monopoly was used as a label without examining substitutes, barriers, conduct or effects
        on users.
  '24.08':
    title: Find and reduce one cost shifted outside a transaction
    goal: Identify effects on workers, neighbors, public systems, future people or the environment that
      are not fully reflected in a private price, then propose a meaningful mitigation.
    scope_note: One small externality analysis does not measure a complete social footprint or prove a
      policy is optimal. The practical action must remain safe, permitted and proportionate.
    burden: Twenty minutes to map the case, one small permitted mitigation and a later fifteen-minute
      review.
    setup: Default to a permitted small meeting that benefits attendees but leaves avoidable disposable
      material and cleanup for venue staff. Prepare a map of organizer, attendee, worker, neighbor, public
      service and future/environmental effects. Use actual non-sensitive observations with permission
      or a labeled fictional case.
    actions:
    - title: Locate benefits and costs beyond the payer
      instructions: State what the organizer and attendees receive and what the venue is paid. Identify
        labor, waste, noise, energy, access or public-service burdens that may fall elsewhere. Separate
        a transfer already agreed and compensated from an unaccounted external effect. Mark unknown size
        and avoid inventing environmental quantities. Include a possible positive spillover, such as publicly
        useful information, so the analysis does not assume every indirect effect is harmful.
      checks:
      - Private benefits and agreed payments are identified
      - At least three potentially affected groups are considered
      - Unaccounted effects are distinguished from agreed costs
      - Unknown magnitude and possible positive spillovers remain visible
    - title: Choose mitigation with the affected people rather than for them
      instructions: Ask the appropriate venue contact which avoidable burden actually matters. Compare
        reducing materials, changing the meeting setup, providing an agreed cleanup role or compensating
        a legitimate added service. Check that the remedy does not shift work onto an unwilling volunteer
        or exclude someone who needs a particular format. Select one permitted change and state who does
        it, when and how its effect will be observed.
      checks:
      - An affected person or responsible contact informs the priority
      - At least two mitigations and their shifted burdens are compared
      - The chosen action has an owner timing and observation
      - Access and voluntary participation are preserved
    - title: Check whether the burden was reduced or merely moved
      instructions: 'Carry out the agreed small change and compare the next meeting’s actual cleanup or
        material use with the prior observation. Record new effort or costs and ask the venue contact
        whether the change helped. Keep the conclusion narrow: a smaller visible cleanup burden does not
        establish total environmental benefit. Retain, revise or stop the mitigation and identify a larger
        policy question beyond this small experiment.'
      checks:
      - The agreed mitigation actually occurs
      - A later observation checks the originally identified burden
      - New costs and effects on other people are retained
      - The conclusion distinguishes a local improvement from a full social-impact claim
    adaptation: Use a tabletop when no real event or authority exists; label the actual mitigation untested.
      A remote event may have different energy, access and labor effects. Do not impose fees, alter public
      infrastructure or make environmental claims beyond reliable evidence and appropriate permission.
    review: Whose cost became visible only after looking beyond the transaction, and did the remedy reduce
      it without making someone else silently absorb it?
    examples:
      supportive: The venue identified cleanup as the main burden and an agreed reusable setup reduced
        it without shifting unpaid work to a reluctant attendee.
      mixed: Waste fell but washing work increased, so the next plan explicitly allocated that burden.
      contradictory: The organizer declared the event sustainable from one visible change while ignoring
        worker time and accessibility.
      inconclusive: Externalities were listed without an affected-person check, permitted mitigation or
        later observation.
  '24.09':
    title: Explain a fictional economic shock without household analogies
    goal: Distinguish inflation, unemployment, productivity and growth, then trace monetary and fiscal
      responses with uncertainty rather than treating a national economy as a household budget.
    scope_note: The supplied economy is a teaching model, not current statistics, a forecast or investment
      advice. Simple indicators cannot identify all causes or determine one correct policy.
    burden: Thirty minutes for the indicators and twenty minutes for a causal explanation and correction.
    setup: In the fictional economy, a fixed basket rises from 100 to 108, a defined labor force of 100
      has 92 employed, and output rises from 100 to 110 units using the same ten labor-hours. A separate
      household’s nominal income rises 5%. No migration, quality adjustment, labor-force participation
      change, monetary regime or current policy data are supplied.
    actions:
    - title: Calculate indicators and state what they do not show
      instructions: 'Calculate the basket increase as 8%, unemployment in the supplied labor force as
        8%, and labor productivity as ten then eleven units per hour, a 10% increase. Explain that these
        are different quantities: output per hour, people seeking work within the defined labor force
        and a selected basket’s price level. Compare the household’s income growth with the basket increase;
        its purchasing power for that basket falls despite higher nominal income. Do not call this basket
        an official national index.'
      checks:
      - The three supplied indicator calculations are correct
      - Price level employment and productivity are distinguished
      - Higher nominal income is not automatically higher purchasing power
      - Indicator definitions and omitted information remain explicit
    - title: Trace two possible causes and two policy channels
      instructions: Draw one demand-pressure explanation and one supply-disruption explanation for rising
        prices, marking the missing evidence that would distinguish them. Explain a monetary-policy channel
        through financing conditions, spending and later activity, and a fiscal channel through taxes,
        transfers or public spending. Include delays and different effects on borrowers, savers, workers
        and firms. Do not assume an interest-rate change immediately controls every price or that a government
        has the same powers and constraints as one household.
      checks:
      - Demand and supply explanations have different evidence needs
      - Monetary and fiscal mechanisms are separated
      - Delays and unequal effects are included
      - Household and national-budget reasoning are not treated as interchangeable
    - title: Compare responses under a changed condition
      instructions: Consider a second case with falling output and higher unemployment but continuing
        supply-driven price pressure. Compare the risks of stimulating demand, restraining it and addressing
        a supply bottleneck without claiming a certain result. State which data and institutional constraints
        would be needed for a responsible policy judgment. Explain the case to a willing listener or recording
        and correct any leap from one indicator to a confident recession, growth or inflation forecast.
      checks:
      - The second case contains an explicit policy tradeoff
      - At least two responses and adverse possibilities are compared
      - Needed evidence and institutional constraints are named
      - The final explanation avoids a deterministic economic forecast
    adaptation: Use a simple arrow diagram and spoken arithmetic. No live market or national data are
      required. For real economic claims, use dated official statistics with definitions and revisions;
      do not use this exercise to make personal trades or claim policy expertise.
    review: Which causal link remains uncertain even after the arithmetic is correct, and what would you
      need to know before recommending a policy response?
    examples:
      supportive: The learner separated productivity from employment and compared monetary and fiscal
        channels while retaining uncertainty about supply versus demand causes.
      mixed: The indicators were correct, but a delayed policy effect was initially omitted and added
        during explanation.
      contradictory: A single price change was called proof of national inflation or a household austerity
        rule was treated as an automatic solution for an entire economy.
      inconclusive: Economic terms were named without calculating the supplied indicators or tracing competing
        causal explanations.
  '24.10':
    title: Evaluate a public budget with incidence and behavior included
    goal: Compare a tax-and-spending proposal across revenue, public benefit, incentives, distribution,
      debt and administrative burden rather than considering its headline rate alone.
    scope_note: The fictional budget is public-finance literacy, not a tax calculation or endorsement
      of a current proposal. Actual legal liability and economic incidence are distinct and require context.
    burden: Thirty minutes for a budget and sensitivity calculation, followed by a twenty-minute distribution
      review.
    setup: A fictional local project has a taxable base of 1,000 and a proposed 10% levy, with spending
      of 80 and administration of 10. A behavioral scenario reduces the base to 900. Separately, consider
      a 10-unit charge legally collected from a seller where the supplied hypothetical price response
      shifts six units to buyers and leaves four with the seller. These responses are assumptions, not
      empirical estimates.
    actions:
    - title: Reconcile revenue expenditure and the public purpose
      instructions: Calculate base revenue as 100 and total project plus administration cost as 90, leaving
        10. Describe the public benefit, who can use it and whether exclusion or free-riding affects provision.
        State what maintenance and future obligations are omitted. Explain the difference between a current
        surplus, a one-period deficit and accumulated debt; no single annual balance proves sustainability
        or waste.
      checks:
      - Revenue of one hundred and costs of ninety reconcile
      - The public purpose and access question are explicit
      - Future maintenance and omitted obligations are identified
      - Annual balance is distinguished from accumulated debt and sustainability
    - title: Test behavior and who ultimately bears the charge
      instructions: Under the smaller base, recalculate revenue as 90 and the balance as zero. Explain
        that a rate alone does not fix revenue when behavior or the tax base changes. In the separate
        incidence case, distinguish the legal collector from the assumed six-unit buyer burden and four-unit
        seller burden. Ask who might be excluded, compensated or unable to adapt, and mark the evidence
        needed to estimate actual pass-through rather than treating the supplied split as universal.
      checks:
      - The smaller-base scenario produces ninety revenue and zero balance
      - Behavioral response is not assumed away
      - Statutory collection and economic burden are distinguished
      - The supplied incidence split remains an assumption requiring evidence in real use
    - title: Compare a revised proposal and preserve tradeoffs
      instructions: 'Compare the original with one specific alternative: a smaller project, a different
        base, a targeted offset or phased implementation. Describe effects on adequacy, administrative
        complexity, distribution, incentives and future financing without inventing a free improvement.
        Choose a conditional recommendation and a monitoring trigger such as lower-than-expected revenue
        or exclusion of intended users. State what legal, fiscal and community review would still be required
        before a real decision.'
      checks:
      - A specific alternative is compared across five practical dimensions
      - A sacrificed benefit or added burden is acknowledged
      - A monitoring trigger can reopen the recommendation
      - No educational calculation is presented as legal or fiscal approval
    adaptation: Use counters and a diagram rather than a spreadsheet. People may reasonably weigh equity
      and efficiency differently; require reasons rather than ideological agreement. Actual tax, borrowing
      or spending decisions belong to the relevant lawful institutions and qualified advisers.
    review: Who bears the proposal’s cost after behavior changes, and which public benefit or fiscal risk
      matters most to the conditional recommendation?
    examples:
      supportive: The learner found that a smaller base erased the apparent surplus and separated who
        remits the tax from who bears its economic cost.
      mixed: The alternative improved access but raised administration costs, so the tradeoff remained
        explicit.
      contradictory: A tax rate was treated as guaranteed revenue or debt was called harmless or catastrophic
        without scale, timing and institutional context.
      inconclusive: Only a headline rate or spending total was discussed, with no distribution, incentive
        or sensitivity analysis.
  '24.11':
    title: Compare social-protection designs under need and access stress
    goal: Evaluate adequacy, access, incentives, dignity and sustainability when comparing universal,
      contributory and means-tested forms of social protection.
    scope_note: The fictional pool and eligibility cases teach policy tradeoffs, not current benefit rules
      or personal eligibility. No enrollment, claim or contribution is made.
    burden: Thirty minutes for the pool and design comparison, plus twenty minutes for an access stress
      test.
    setup: A fictional pool collects 10 from each of 200 participants. Twenty claims of 80 and administration
      of 200 occur in the base period. The stress period has 35 claims of 80 with the same receipts and
      administration. Compare this contributory pool with a universal payment and a means-tested payment
      whose detailed financing and rules are deliberately unspecified.
    actions:
    - title: Calculate adequacy and sustainability separately
      instructions: Calculate receipts of 2,000, base claims of 1,600 and total base spending of 1,800,
        leaving 200. Under 35 claims, spending becomes 3,000 and the shortfall is 1,000. Explain that
        a solvent pool can still provide inadequate support, while adequate individual payments may need
        additional financing. Identify the risk covered and distinguish unemployment, health, disability,
        retirement and family-support needs rather than assuming one benefit solves all of them.
      checks:
      - Receipts base balance and stress shortfall are correct
      - Adequacy and financing are treated as separate questions
      - Different protected risks are distinguished
      - The model does not assume stable claim rates or unlimited funds
    - title: Compare three designs using the same questions
      instructions: For contributory, universal and means-tested approaches, ask who is eligible, how
        people learn about and claim support, what contributions or taxes finance it, how benefits change
        with earnings and what dignity or privacy costs arise. Do not fill missing rules with stereotypes.
        Identify a possible exclusion in each design and a possible administrative or incentive tradeoff.
        State what evidence would show whether the intended population actually receives adequate support.
      checks:
      - All three designs are compared on common criteria
      - Eligibility access financing and earnings interactions are considered
      - Privacy dignity and administrative burden remain visible
      - Missing program details are not replaced with ideological assumptions
    - title: Test the design on an overlooked applicant
      instructions: Use a fictional applicant with variable earnings, a disability-related access need
        and limited ability to complete repeated forms. Walk through information, application, verification,
        decision, payment and appeal. Propose one concrete improvement, such as an accessible assisted
        route or less duplicative evidence, then examine fraud-control, cost and privacy implications.
        Choose a conditional design improvement and a measure of take-up or timely receipt, not merely
        the number of applications started.
      checks:
      - The applicant’s journey includes decision payment and appeal
      - An access barrier is identified at a specific step
      - A concrete remedy includes its cost or control tradeoff
      - Success concerns actual receipt and adequacy rather than only application volume
    adaptation: Use local official examples only with dates and clear jurisdiction labels. Personal eligibility,
      benefit cliffs and appeals require current qualified assistance. Never ask a participant to disclose
      health or income records or submit a false claim for practice.
    review: Which person could remain unprotected even when the program’s headline budget balances, and
      how would the proposed change make that failure visible?
    examples:
      supportive: The learner separated the pool’s financing gap from payment adequacy and redesigned
        an inaccessible verification step while retaining audit and privacy questions.
      mixed: A universal option reduced eligibility burden but left financing unresolved, so no final
        recommendation was claimed.
      contradictory: Applicants were stereotyped as fraudulent or fictional calculations were used to
        promise a real person benefits.
      inconclusive: Program labels were compared without arithmetic, access steps, adequacy or sustainability
        tradeoffs.
  '24.12':
    title: Choose an enterprise form by control and mission constraints
    goal: Compare ownership and organizational forms by who supplies capital, controls decisions, bears
      risk and holds the enterprise accountable to its purpose.
    scope_note: This is a fictional governance comparison, not entity formation or legal, tax, securities
      or liability advice. Legal forms and ownership models are related but not interchangeable.
    burden: Thirty minutes to map alternatives and twenty minutes to test two governance conflicts.
    setup: A fictional group wants to operate a small shared learning-resource service. Its goals are
      reliable access, fair worker treatment and enough income to maintain the service. Compare sole ownership,
      partnership, investor-owned corporation, worker or user cooperative, employee ownership, nonprofit
      and public provision. Do not assume all are legally available in every jurisdiction.
    actions:
    - title: Make control and financing visible for every option
      instructions: For each of the seven options, record who could contribute capital, who appoints decision
        makers, how surplus is used, who bears losses and whom the organization must answer to. Use official
        educational material for definitions and mark local legal and tax details unknown. Distinguish
        an employee share arrangement from democratic worker control and a nonprofit mission from an absence
        of revenue or paid staff. Identify which models conflict with the supplied mission before choosing
        one.
      checks:
      - All seven options receive capital control and accountability entries
      - Employee ownership and democratic control are not conflated
      - Nonprofit status is not equated with no revenue or no paid labor
      - Local legal tax and liability questions remain unverified
    - title: Test capital pressure and member disagreement
      instructions: 'Apply two fictional conflicts: a funder offers essential capital in exchange for
        control that could reduce access, and users want lower prices while workers need sustainable compensation.
        For two plausible forms, trace who can decide, who has voice, what disclosure or vote is required
        and how an affected person can challenge the result. Do not assume any form guarantees fairness;
        write one governance failure each could still produce.'
      checks:
      - Both conflicts are tested under two plausible forms
      - Decision rights voice and challenge routes are specified
      - Capital conditions are evaluated against mission rather than accepted automatically
      - Each form retains a possible governance failure
    - title: Write a conditional form choice and professional question list
      instructions: Select a provisional arrangement or defer. Explain the capital, control and mission
        tradeoff, the stakeholder protections needed and what fact would change the choice. Prepare three
        concrete questions for an appropriate local legal or accounting adviser, including eligibility,
        duties and reporting or tax treatment. No registration, investment solicitation, membership contract
        or transfer of ownership is part of this exercise.
      checks:
      - The choice states a real tradeoff rather than a preferred label
      - Needed stakeholder protections are explicit
      - Three local professional questions are specific
      - No educational choice is represented as a formed or compliant entity
    adaptation: Use a diagram or role cards with an accessible explanation. A sole person can compare
      models without pretending to speak for future members. Actual worker, cooperative, nonprofit, public
      and investor arrangements require their own lawful authority and informed consent.
    review: Which form best protects the stated purpose under pressure, and what control or financing
      compromise would still need explicit acceptance?
    examples:
      supportive: The group distinguished capital ownership from voting control and chose a provisional
        cooperative model only after naming funding and local-law questions.
      mixed: A nonprofit fit the purpose, but its proposed funder influence required a stronger accountability
        design.
      contradictory: A legal label was treated as proof of fairness or liability protection, or ownership
        was offered without qualified legal review.
      inconclusive: Forms were listed without comparing decision rights, losses, capital or a pressure
        scenario.
  '24.13':
    title: Give a new tool a harm-aware trial and a real stop rule
    goal: Assess a proposed innovation’s benefits and displaced burdens, then define safeguards, monitoring
      and conditions for revision or stopping before wider use.
    scope_note: A low-risk prototype review is not safety certification, regulatory approval or proof
      of social benefit. High-stakes systems need appropriate expert, user and institutional review.
    burden: Thirty minutes for impact mapping, a bounded synthetic trial and a twenty-minute stop-rule
      review.
    setup: Use a fictional tool that drafts public event reminders from approved facts. It may save organizer
      time but could introduce incorrect information, exclude readers using assistive technology or encourage
      unnecessary personal-data collection. Use only synthetic events and no automatic sending, real attendee
      records or consequential decisions.
    actions:
    - title: Map the benefit and who might bear the downside
      instructions: State the exact intended benefit and who receives it. Map workers whose tasks change,
        readers with different access needs, data subjects, maintainers, environmental resource use and
        anyone excluded from the tool. Separate a measured benefit from an assumed one. Identify safety,
        privacy, labor, distribution and environmental questions that the small trial cannot settle, and
        consult an appropriate affected perspective before treating the design as ready.
      checks:
      - Benefit and affected groups are specified
      - Labor access privacy safety and resource effects are considered
      - Measured and assumed benefits remain separate
      - At least one affected perspective or its absence is recorded honestly
    - title: Run a synthetic trial with safeguards already in place
      instructions: Prepare three fictional events including one missing time and one changed location.
        Require human verification against the approved facts, no invented details, accessible output
        and no automatic release. Record correct facts, unsupported additions, omitted uncertainty and
        review time. Stop the trial on any unsafe data exposure or uncorrected consequential falsehood;
        a fast draft does not count as useful when checking and repair exceed the old workload.
      checks:
      - Three supplied cases include missing and changed facts
      - Safeguards precede the trial rather than follow a failure
      - Accuracy uncertainty access and total review burden are observed
      - A predefined unsafe result stops the trial
    - title: Decide whether to revise stop or cautiously repeat
      instructions: Compare benefit with error burden and affected-person feedback. Define a concrete
        change, an owner, a monitoring measure and a condition for ending further use. Explain what additional
        evidence and authority would be required before using real data or expanding scale. Keep a no-tool
        alternative available and do not treat user resistance, job displacement or accessibility problems
        as mere friction to overcome.
      checks:
      - Benefits and burdens are compared rather than reported separately
      - Revision monitoring and stop conditions are assigned
      - Expansion requires new evidence and appropriate permission
      - A viable no-tool alternative and affected people’s concerns remain respected
    adaptation: Use paper mockups and a manually drafted reminder instead of software. No artificial-intelligence
      service or external upload is required. Do not test on vulnerable users, real emergencies, health,
      hiring, benefits or other high-consequence decisions without the proper specialist and institutional
      process.
    review: What result would genuinely make you stop rather than explain away the harm, and who has enough
      authority and information to enforce that decision?
    examples:
      supportive: A missing time produced an unsupported draft, so the trial stopped and the design added
        an explicit unknown-field rule before any real use.
      mixed: Drafting was faster but review burden erased the benefit, leading to a narrower use case.
      contradictory: Synthetic success was called safety approval or a real user’s privacy and access
        concerns were dismissed to accelerate deployment.
      inconclusive: A benefit statement was written without a trial, safeguards, affected groups or an
        enforceable stop rule.
  '24.14':
    title: Trace a trade advantage through the whole supply chain
    goal: Distinguish comparative advantage from absolute productivity and examine how logistics, labor,
      exchange rates, bargaining power and disruption change a cross-border trade judgment.
    scope_note: The fictional production model illustrates opportunity cost, not a trade forecast, sanctions
      determination or instruction to import or export goods.
    burden: Thirty minutes for the production example and twenty minutes for a supply-chain stress explanation.
    setup: In one hour, fictional producer A can make six bread units or three cloth units; B can make
      four bread or four cloth. Assume linear production only for this example. A proposed exchange is
      one cloth for one and a half bread. Draw a separate generic cross-border chain from raw material
      to worker, producer, shipper, customs, buyer and end user; no real shipment is planned.
    actions:
    - title: Calculate opportunity costs before claiming an advantage
      instructions: For A, one cloth costs two bread forgone; for B, one cloth costs one bread. Thus B
        has the lower opportunity cost in cloth, while A has the lower opportunity cost in bread. Explain
        why A’s greater bread output and B’s greater cloth output are absolute productivity facts, not
        the definition of comparative advantage. Show why one cloth for 1.5 bread lies between the two
        cloth opportunity costs under the assumptions, without claiming every participant must benefit
        in real life.
      checks:
      - Both cloth opportunity costs are calculated correctly
      - Comparative advantage is defined by opportunity cost
      - Absolute output and comparative advantage are distinguished
      - The proposed terms are evaluated only within the simple model
    - title: Add the costs and people absent from the simple model
      instructions: Trace transport time, storage, quality, labor conditions, energy, customs, exchange-rate
        exposure and buyer or supplier bargaining power through the chain. Identify who bears a delay,
        currency change or rejected shipment. Mark sanctions, export controls, tariffs and product rules
        as current jurisdiction-specific checks requiring authoritative guidance; do not infer permission
        from a low price. Explain how aggregate gains can coexist with losses for particular workers or
        places.
      checks:
      - The chain includes logistics labor and currency exposure
      - Risk-bearing and bargaining power are assigned explicitly
      - Legal trade restrictions remain subject to current verification
      - Aggregate gains are not assumed to benefit every affected person
    - title: Stress a disruption and compare resilience options
      instructions: Introduce a fictional shipping delay and a single-source supplier failure. Compare
        holding a modest buffer, a second lawful source, local production or accepting a longer lead time,
        naming cost and environmental or labor tradeoffs. Choose a conditional response and the information
        needed to judge it. Explain the original comparative-advantage result alongside these limits rather
        than using the extra complexity to deny all gains from trade or using the arithmetic to dismiss
        resilience.
      checks:
      - Two disruptions are traced to actual chain consequences
      - At least three resilience options have costs and benefits
      - The response identifies missing evidence and lawful verification
      - The final explanation retains both trade gains and their practical limits
    adaptation: Use tokens and a hand-drawn chain. Real cross-border transactions can involve complex
      legal, safety, labor and tax requirements; consult current official authorities and qualified professionals.
      Do not contact restricted parties, move controlled goods or attempt to evade any rule as an exercise.
    review: Which assumption makes the simple trade beneficial, and which supply-chain or distributional
      fact could change the responsible real-world choice?
    examples:
      supportive: The learner calculated the opportunity costs and then showed how a supplier failure
        could justify a costlier second source without denying the original trade advantage.
      mixed: The arithmetic was sound, but exchange and customs costs remained unknown, preventing a real
        sourcing decision.
      contradictory: A low foreign price was treated as legal permission or aggregate gains were used
        to dismiss worker harm and concentration risk.
      inconclusive: Trade was praised or rejected without opportunity-cost calculations, a chain map or
        a disruption comparison.
