schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '22'
exercises:
  '22.01':
    title: Apply one leadership standard to yourself before asking it of others
    goal: Make influence credible through preparation, regulated conduct and ownership of your own shortfall
      rather than relying on a title or a polished image.
    scope_note: Use a low-stakes group responsibility or a fictional leadership rehearsal. This is not
      a measure of charisma, authority, personality or general leadership effectiveness.
    burden: Fifteen minutes to choose the standard, one ordinary group interaction and a 15-minute follow-up.
    setup: Default to leading a short planning meeting where you expect others to arrive prepared and
      state uncertainty honestly. Choose one visible standard, such as bringing the current facts and
      identifying what is unverified. Prepare the same materials and limits you intend to ask of participants.
    actions:
    - title: Translate the expected standard into your own observable behavior
      instructions: 'Write exactly what you expect from others and the purpose it serves. Apply it to
        yourself: check the source facts, prepare a short agenda and mark unresolved questions before
        the meeting. Identify where your role gives you an easy exemption, such as arriving late without
        explanation or changing the task after others prepare. Choose one such exemption to remove, while
        preserving legitimate differences in responsibility rather than pretending every role is identical.'
      checks:
      - The standard has a stated practical purpose
      - Your own preparation meets the same relevant expectation
      - A role-based double standard is identified
      - Legitimate role differences are distinguished from convenience
    - title: Model the response when something does not go to plan
      instructions: During the interaction, state a real uncertainty or correct a small factual mistake
        without blaming a participant. When challenged, pause, ask what evidence you missed and respond
        to the issue rather than status. Do not manufacture an error or provoke conflict for the exercise.
        If the standard was not met by you, acknowledge the specific effect and name the repair you control
        instead of giving a speech about accountability.
      checks:
      - A natural uncertainty or error is handled honestly
      - Challenge is addressed without a status defense
      - No conflict or mistake is staged
      - Any personal shortfall receives a specific owned repair
    - title: Follow through and check what your conduct taught
      instructions: Complete the promised correction or preparation change and inform the affected people
        through the ordinary channel. Ask a willing peer a narrow question about clarity or reliability,
        not whether they admire you. Compare your behavior with the standard you requested and record
        one inconsistency still needing work. An agreeable meeting does not prove leadership credibility;
        the evidence is the conduct and repair that others could actually observe.
      checks:
      - The promised repair is completed or its status is explicit
      - Feedback concerns observable conduct rather than admiration
      - Your behavior is compared with the stated standard
      - Remaining inconsistency is not hidden by a positive impression
    adaptation: Use a peer-led volunteer task, accessible written meeting or private fictional rehearsal
      when no leadership role exists. Do not pressure a subordinate to evaluate you or disclose private
      organizational material. Emotional regulation means accountable conduct, not suppression or accepting
      abuse.
    review: What did your behavior authorize others to do, and did you remove the exemption you would
      have disliked in someone else?
    examples:
      supportive: The leader arrived with checked facts, acknowledged an uncertainty and completed a promised
        correction before asking others for the same discipline.
      mixed: Preparation was good, but a defensive reply undercut the standard; the leader repaired that
        specific interaction.
      contradictory: The leader demanded accountability while hiding their own error or used feedback
        to obtain admiration from dependent participants.
      inconclusive: Leadership values were announced without an observable self-standard or follow-through.
  '22.02':
    title: Turn a worthwhile direction into three priorities people can explain
    goal: Describe a meaningful future, explain its value and identify a small immediate priority set
      with explicit tradeoffs and a shared understanding check.
    scope_note: Use a limited group project or fictional organization. This is not a mandate to impose
      a personal vision, predict the future or claim consensus from silence.
    burden: Twenty minutes to draft direction, one 20-minute discussion and a short revised priority brief.
    setup: Default to a community workshop that wants newcomers to participate without confusion. The
      future condition is a newcomer can find, join and contribute to an event. Prepare a brief with destination,
      why it matters, current obstacle, no more than three priorities, non-priorities and a review date.
    actions:
    - title: Describe the future in terms of who can do what
      instructions: 'Write the desired future as an observable experience rather than a slogan: a newcomer
        can find accurate information, enter accessibly and know how to contribute. Explain why that matters
        to the group’s legitimate purpose and identify who should help define it. Name one constraint
        and one competing good, such as volunteer time or maintaining the existing community. Do not assume
        your preferred future is worthwhile merely because you can state it confidently.'
      checks:
      - The destination describes a concrete future experience
      - Its value is tied to a legitimate group purpose
      - Affected people can shape the direction
      - A constraint and competing good are explicit
    - title: Choose a limited focus and say what will wait
      instructions: Select at most three immediate priorities that directly advance the destination, such
        as correcting event information, confirming the access route and assigning a welcome contact.
        For each, name the next action, owner and evidence of progress. Identify at least two attractive
        activities that will not be pursued now and explain the opportunity cost. A priority list that
        retains every project is not a choice.
      checks:
      - There are no more than three immediate priorities
      - Each has an action owner and progress signal
      - At least two non-priorities are explicit
      - Tradeoffs connect the focus to actual capacity
    - title: Check whether others understand both direction and next step
      instructions: Ask willing participants to explain the destination and what they would do first in
        their own words. Listen for confusion or a different understanding of why the work matters, then
        revise the brief rather than blaming them for not absorbing the vision. Confirm ownership and
        a review trigger for changed conditions. Record unresolved disagreement separately from misunderstanding;
        a clear direction does not require pretending everyone endorses every tradeoff.
      checks:
      - Participants explain the destination and immediate focus
      - Confusion leads to a revised brief
      - Ownership and review conditions are confirmed
      - Disagreement is distinguished from lack of understanding
    adaptation: Use a one-page, spoken, signed or visual brief. A fictional group rehearsal tests clarity
      but not actual shared commitment. Do not use the exercise to collect political preferences or override
      organizational authority.
    review: Could a participant explain where the group is going and what not to do this week, and which
      tradeoff made that clarity possible?
    examples:
      supportive: Participants could state the newcomer experience and the three immediate actions, while
        optional publicity work was explicitly deferred.
      mixed: The vision was understandable, but too many priorities competed; the group removed two and
        reassigned ownership.
      contradictory: A leader’s slogan was treated as unquestionable direction or every attractive project
        remained a top priority.
      inconclusive: A future statement was written without limited priorities, non-priorities or a shared
        understanding check.
  '22.03':
    title: Use authority without making agreement the price of participation
    goal: Recognize formal and informal power, dependency and conflicts of interest, then structure one
      decision so people can contribute or decline without coercion.
    scope_note: Use an authorized low-stakes decision or fictional case. This does not determine legal
      authority, remove an institutional duty or certify that a power imbalance has disappeared.
    burden: Twenty minutes to map power, one bounded decision conversation and a 15-minute accountability
      review.
    setup: Default to a group leader choosing who receives a visible presentation opportunity. The leader
      also controls scheduling and gives references, creating potential dependence. Prepare a decision
      record with authority, informal influence, affected people, criteria, interests, refusal route,
      reviewer and appeal.
    actions:
    - title: Map the power that exists beyond the title
      instructions: Identify who formally decides, who influences access or reputation and who may find
        refusal costly. Name any personal connection, desired admiration or benefit that could affect
        your judgment. Distinguish having a conflict from having already acted corruptly, and check the
        applicable disclosure or recusal process. Ask what information a less powerful participant would
        need to make a genuine choice without exposing private circumstances.
      checks:
      - Formal and informal sources of power are identified
      - Dependency and the cost of refusal are considered
      - Personal interests and connections are disclosed through the proper process
      - Conflict is distinguished from an established misconduct finding
    - title: Make the decision criteria and freedom to decline real
      instructions: State the purpose and relevant criteria for the opportunity, such as readiness, interest
        and fair access to development. Invite participation through a channel that does not require public
        refusal or praise of the leader. Provide an alternative route or later opportunity where feasible
        and make clear that declining does not itself lower standing. Where your conflict prevents fair
        judgment, use the authorized recusal or independent-review arrangement rather than privately deciding
        you can be objective.
      checks:
      - Criteria are tied to purpose and fair opportunity
      - Interest or refusal can be communicated without public pressure
      - Declining is not used as a loyalty test
      - A conflict receives an appropriate independent disposition
    - title: Record reasons and check whether the process increased capacity
      instructions: Document the decision and relevant reasons without exposing private personal information.
        Explain how a participant can ask for correction or review. After the opportunity, check whether
        the chosen person gained useful support and whether others retained a fair path, rather than asking
        whether they admired your leadership. If a concern about coercion or favoritism arises, preserve
        it and use the appropriate review channel instead of treating it as ingratitude.
      checks:
      - Reasons and review routes are documented appropriately
      - Privacy is protected in the decision record
      - Developmental capacity and fair future access are checked
      - Concerns are not dismissed as disloyalty or ingratitude
    adaptation: Use a fictional case, peer rotation or accessible private response channel. Actual hiring,
      promotion, procurement and protected opportunities require their governing policies and qualified
      review. Do not test consent by making people refuse someone who controls essential resources.
    review: What did your power make hard for someone else to say, and what concrete safeguard made the
      choice less dependent on pleasing you?
    examples:
      supportive: The leader disclosed a connection, used an independent selector and gave participants
        a private way to express interest or decline.
      mixed: The criteria were fair, but public volunteering still created pressure; the process moved
        to a private response channel.
      contradictory: Access to an opportunity depended on praise, personal loyalty or accepting an undisclosed
        conflict.
      inconclusive: Power was acknowledged abstractly without changing criteria, refusal or accountability.
  '22.04':
    title: Make a timely decision with a recorded reason to revise it
    goal: Choose responsibly under incomplete information by using expertise, dissent, risk and affected-person
      needs, then own and update the decision as evidence changes.
    scope_note: Use a reversible low-stakes decision or tabletop case. This is not emergency command,
      clinical judgment or authority to override a qualified safety decision.
    burden: Twenty minutes to frame the choice, one time-bounded decision and a review after a specified
      new fact.
    setup: Default to choosing between two permitted rooms for a small workshop when attendance is uncertain.
      Both must already meet the responsible owner’s safety and access requirements. Prepare a decision
      card with deadline, options, known facts, unknowns, expert input, dissent, affected users, risk,
      choice and review trigger.
    actions:
    - title: Define when a decision is needed and what cannot be guessed
      instructions: State the latest useful decision time and the consequence of waiting. List the two
        viable options and the facts required before either is acceptable, including verified safety and
        access rather than assumptions. Identify who has relevant expertise and whose experience of the
        room matters. Separate a missing fact that blocks the decision from uncertainty that can be managed
        through a reversible choice.
      checks:
      - A real decision deadline and cost of delay are stated
      - Blocking facts are separated from manageable uncertainty
      - Safety and access are verified by the appropriate owner
      - Expertise and affected users are identified
    - title: Hear the strongest concern and make the bounded choice
      instructions: Ask for the strongest reason against your preferred room and record it fairly. Compare
        likely benefits, downside, reversibility and what support each option needs. Decide by the deadline
        within your authority, explaining why the choice is reasonable on current evidence and what risk
        remains. Assign the next action and communication owner. Do not wait for perfect agreement or
        present uncertainty as certainty to look decisive.
      checks:
      - A serious dissenting concern is considered
      - Risk reversibility and support needs inform the choice
      - The decision is timely and within authority
      - Remaining uncertainty and the next owner are communicated
    - title: Review the outcome without rewriting the original reasoning
      instructions: When the attendance estimate or another specified fact changes, compare it with the
        recorded assumptions. Retain or revise the room choice and explain the reason to affected people.
        Own any preventable error, while distinguishing an unlucky outcome from an unsound process. Preserve
        the original decision record and add the update rather than editing it to make foresight look
        better. A revision can be responsible leadership, not evidence that the initial decision should
        have been delayed forever.
      checks:
      - New evidence is compared with the original assumptions
      - Retention or revision has an explicit reason
      - Process quality and outcome luck are distinguished
      - The original reasoning is preserved with an added update
    adaptation: Use a paper tabletop case or accessible asynchronous input. If a required safety, legal
      or professional fact is unresolved, defer that option and use the appropriate qualified route. Do
      not stage a risky real event to test decisiveness.
    review: What made the choice reasonable at the time, what evidence changed it, and did you own the
      update as clearly as the original decision?
    examples:
      supportive: The leader chose a verified suitable room by the deadline and revised the plan when
        a recorded attendance trigger was reached.
      mixed: The choice was reasonable but the communication owner was missing; the review corrected that
        handoff gap.
      contradictory: Dissent was suppressed, safety facts were guessed or the original record was rewritten
        after the outcome.
      inconclusive: Options were analyzed indefinitely without a decision deadline, accountable choice
        or review trigger.
  '22.05':
    title: Delegate a complete outcome with enough authority to achieve it
    goal: Match a task to someone’s readiness, provide purpose and decision room, agree checkpoints and
      let them perform real work without constant interference.
    scope_note: Use a willing authorized collaboration. This is not permission to assign regulated work,
      transfer duties you legally retain or disguise abandonment as empowerment.
    burden: Twenty minutes to agree delegation, one short work period and a 15-minute outcome and learning
      review.
    setup: Default to delegating preparation of a five-item meeting agenda. Provide the purpose, required
      topics, deadline, accessible format, source facts and decisions the person may make. Separate decisions
      they own from those requiring approval. Use a willing peer or a fictional role when you have no
      supervisory authority.
    actions:
    - title: Match the outcome to readiness and ask for acceptance
      instructions: Ask what experience and support the person has for the task and what they need to
        succeed, without turning the discussion into a character judgment. Explain the intended outcome
        and why it matters, then agree the scope and acceptance criteria. Identify one stretch that is
        safe and manageable and one part beyond their present authority or competence. The task is not
        delegated until the person accepts or an appropriate role process establishes responsibility.
      checks:
      - Readiness and support needs are discussed concretely
      - Purpose outcome and acceptance are clear
      - A manageable stretch and an excluded responsibility are identified
      - Responsibility is explicitly accepted through an appropriate process
    - title: Provide decision rights, resources and a useful checkpoint
      instructions: Give access to the permitted inputs and state which choices the person can make, such
        as ordering the topics or choosing wording. Agree one checkpoint for a risk or draft, not continuous
        status demands. Define when to ask for help and what requires approval. During the work, avoid
        silently redoing their decisions or sending conflicting instructions; when a genuine safety or
        scope issue emerges, intervene clearly and explain the reason.
      checks:
      - Resources and permitted inputs are available
      - Decision rights and approval boundaries are explicit
      - A proportionate checkpoint and help trigger are agreed
      - The delegator avoids covert rework and conflicting instructions
    - title: Review the result and transfer the next degree of responsibility
      instructions: At the agreed handoff, compare the agenda with the acceptance criteria and ask the
        person to explain a decision they made. Recognize useful judgment and address a specific gap without
        reclaiming the entire task reflexively. Ask what support was missing or excessive and agree what
        they can own next time. Record both the work outcome and the learning, including a reason to keep
        support when needed; independence is not the removal of legitimate access aids.
      checks:
      - The actual result is checked against agreed criteria
      - The person explains their own judgment
      - Feedback concerns specific work and support
      - The next responsibility level is agreed without removing needed supports
    adaptation: Use accessible instructions, a smaller task, paired work or a fictional delegation rehearsal.
      Preserve employment, safeguarding, professional and safety requirements. A person may need ongoing
      support while still exercising meaningful responsibility.
    review: What real decision did the other person own, and did your checkpoint support progress or merely
      relieve your urge to control?
    examples:
      supportive: The delegate chose a clear topic order, met the agreed criteria and identified one additional
        responsibility to own next time.
      mixed: The work progressed, but unclear approval limits caused delay; the next delegation clarified
        decision rights.
      contradictory: The leader assigned responsibility without resources, continually rewrote the work
        or called abandonment empowerment.
      inconclusive: A task was assigned without acceptance, authority, checkpoints or an outcome review.
  '22.06':
    title: Coach one learner from a specific gap to a checked retry
    goal: Use observation, useful questions, demonstration, proportionate challenge and encouragement
      to help a willing learner perform a small task with more capability.
    scope_note: This is educational coaching of a safe task, not clinical diagnosis, therapy, professional
      certification or a measure of the learner’s worth.
    burden: A 15-minute learning conversation, one short demonstration and two comparable practice attempts.
    setup: Default to a learner writing a clear meeting reminder from five supplied facts. Use fictional
      material, a willing learner and a fixed check for accuracy, order and a usable contact route. The
      learner chooses whether to continue and can use accessibility supports.
    actions:
    - title: Locate the learning need through an attempt and questions
      instructions: Ask the learner what they want to improve and have them make a short first attempt.
        Compare it with the agreed criteria and ask what they were trying to do, where they felt uncertain
        and what feedback would be useful. Select one observable gap, such as burying the changed time
        in a long paragraph. Do not diagnose motivation, intelligence or a learning style from the error,
        and do not assume your preferred solution is the only competent one.
      checks:
      - The learner’s own goal is elicited
      - A real attempt reveals a specific gap
      - Questions explore reasoning and uncertainty
      - No identity or clinical diagnosis is inferred from performance
    - title: Teach one correction and create a safe stretch
      instructions: Demonstrate a concise version that puts the changed time first and explain the reason.
        Ask the learner to adapt the principle to a different fictional event rather than copy your sentence.
        Offer a challenge slightly beyond the first attempt while keeping the task safe and supported.
        Give specific encouragement about a useful action and correction about a missed criterion; neither
        empty praise nor humiliation supplies informative feedback.
      checks:
      - One correction is demonstrated with a reason
      - The learner adapts rather than copies the example
      - The stretch is manageable and supported
      - Encouragement and correction are specific to observable work
    - title: Step back for a retry and ask what support should remain
      instructions: Let the learner complete a new comparable reminder with their preferred aids, then
        check the fixed criteria together. Ask them to explain what they changed and when the principle
        might not apply. Identify a next practice opportunity and what support they still want. Record
        the observed change without claiming independence if you supplied the answer throughout, and do
        not make the learner’s gratitude the measure of your mentoring.
      checks:
      - A new comparable task is completed
      - The learner explains the correction and a limit
      - Observed capability is separated from coach-provided answers
      - The next opportunity and remaining support are jointly chosen
    adaptation: Use oral, signed, visual or accessible text tasks and a smaller step. A fictional two-role
      rehearsal tests coaching preparation but not another person’s development. Feedback must be voluntary
      and must not expose private student, employee or client information.
    review: What can the learner now explain and do that they could not do in the first attempt, and what
      support remains genuinely useful?
    examples:
      supportive: The learner placed the changed time clearly in a new reminder and explained why it mattered,
        using a retained checklist.
      mixed: The second result improved but relied on repeated prompts, so the coach kept the independence
        claim limited and planned another attempt.
      contradictory: The coach labeled the learner’s character, used humiliation or treated praise and
        gratitude as proof of development.
      inconclusive: Advice was given without observing a gap, demonstrating a correction or checking a
        learner-led retry.
  '22.07':
    title: Address a missed standard with clarity, fairness and follow-through
    goal: Set a purpose-linked expectation, observe actual performance, recognize what worked and address
      a specific shortfall through a humane accountable next step.
    scope_note: Use a low-stakes agreed responsibility within your authority or a fictional case. This
      is not an employment disciplinary decision, legal finding or license to shame someone.
    burden: Fifteen minutes to clarify the standard, one short review conversation and a later check on
      the agreed correction.
    setup: Default to an event notice delivered with an incorrect time after the correct source had been
      agreed. Prepare fields for expectation, observed result, impact, the person’s explanation, support
      or system issue, correction, owner and follow-up. Do not use a real sensitive performance record
      in application evidence.
    actions:
    - title: Check whether the expectation was actually clear and fair
      instructions: Compare the agreed source, due time and accuracy requirement with the delivered notice.
        Identify the specific mismatch and practical impact without using always, never or character labels.
        Ask whether the standard and resources were communicated in advance and whether you apply the
        same standard to yourself and others. If your instruction was ambiguous or an input changed, own
        that contribution before attributing the whole shortfall to the person.
      checks:
      - The standard and observed mismatch are specific
      - Impact is described without character judgment
      - Prior clarity resources and consistent application are checked
      - The leader’s or system’s contribution is acknowledged
    - title: Discuss the gap and agree a proportionate correction
      instructions: State what was done well and the factual shortfall, then ask for the person’s account
        before choosing a response. Distinguish lack of information, skill, capacity, unclear authority
        and an unfulfilled commitment without pretending you can infer motive. Agree a concrete correction,
        such as issuing the right time and adding a source check, with necessary support and an owner.
        Any formal consequence must follow the authorized process, not an improvised threat.
      checks:
      - Success and shortfall are both recognized accurately
      - The person can explain relevant context
      - A specific correction and support are agreed
      - Formal consequences are not invented outside authority
    - title: Follow through and check consistency at the next opportunity
      instructions: At the agreed time, verify the correction and communicate its status to affected people.
        On the next comparable notice, check whether the source-verification step occurred and whether
        the same standard was applied consistently. Recognize improvement without declaring the issue
        permanently solved, or use the proper process if a material gap remains. Do not let a pleasant
        conversation replace correction, and do not keep moving the standard after it is met.
      checks:
      - The promised correction is verified
      - A later comparable opportunity checks the change
      - Improvement or remaining shortfall is reported honestly
      - The standard is not moved or selectively applied
    adaptation: Use an accessible written exchange, a facilitated peer review or a fictional rehearsal.
      Employment, disability, safety and disciplinary matters may require qualified organizational guidance.
      Humane accountability does not mean ignoring harm, and firmness does not justify humiliation.
    review: Was the standard clear, consistent and connected to purpose, and what actual follow-through
      distinguishes this from either avoidance or punishment?
    examples:
      supportive: The leader acknowledged an unclear handoff, the notice was corrected and the next source
        check was completed under the same standard.
      mixed: The conversation was respectful but the correction was late; the follow-up kept that gap
        visible and assigned a clear next owner.
      contradictory: The leader used humiliation, invented a disciplinary threat or changed the standard
        after the person met it.
      inconclusive: A shortfall was discussed without a specific correction, owner or later verification.
  '22.08':
    title: Invite a concern and show that raising it changes the process
    goal: Make good-faith dissent usable by inviting specific challenge, responding without retaliation
      and distinguishing disagreement from harmful conduct.
    scope_note: Use an ordinary safe group decision or fictional rehearsal. One interaction cannot establish
      psychological safety across an institution, and no one must disclose a risky concern for the exercise.
    burden: Fifteen minutes to prepare, one 20-minute discussion and a short follow-up on the concern.
    setup: Default to reviewing a draft event plan before it is finalized. Prepare a prompt asking for
      a missing risk, an unclear responsibility or a reason the plan may fail. Offer an accessible private
      route as well as discussion, and state how concerns will be handled without promising confidentiality
      you cannot provide.
    actions:
    - title: Create an invitation that does not require personal courage as proof
      instructions: Explain which parts of the plan remain changeable and ask a specific question such
        as What would make this hard to carry out. Give participants time and a private or asynchronous
        option where appropriate. State the limits of confidentiality and the route for issues outside
        the meeting’s authority. Do not call on the least powerful person to demonstrate bravery, and
        do not treat silence as agreement or evidence that no risk exists.
      checks:
      - The invitation concerns a specific changeable decision
      - Time and accessible response routes are offered
      - Confidentiality and authority limits are honest
      - Silence and vulnerability are not used as tests of alignment
    - title: Respond to the concern before defending the plan
      instructions: When a genuine low-stakes concern is raised, summarize it, ask what evidence or experience
        supports it and thank the person without making them responsible for solving everything. State
        what you will check and when. If behavior becomes insulting or discriminatory, address that conduct
        separately rather than using it to dismiss all disagreement. Do not stage an attack or ask someone
        to reveal harassment merely to complete the exercise.
      checks:
      - The concern is summarized and checked before rebuttal
      - A concrete investigation or decision next step is assigned
      - Harmful conduct is separated from legitimate disagreement
      - No risky disclosure or staged conflict is required
    - title: Close the concern publicly enough to be accountable
      instructions: At the promised point, explain what was learned, what changed or why the plan remained,
        and what uncertainty is still open. Credit the useful contribution with the person’s consent and
        check that the concern did not lead to an inappropriate penalty or exclusion within your control.
        Ask whether the route itself was usable without claiming the whole team is now psychologically
        safe. A concern logged but never answered teaches a different lesson from an invitation to speak.
      checks:
      - The concern receives a timely reasoned disposition
      - Changes and remaining uncertainty are communicated
      - Credit and protection from inappropriate penalty are considered
      - No broad safety claim is inferred from one interaction
    adaptation: Use fictional cases, anonymous aggregate process feedback where genuinely appropriate
      or a qualified facilitator. Actual abuse, retaliation or legal concerns require the proper independent
      support route. Do not promise anonymity or protection beyond your authority.
    review: What happened after someone challenged the plan, and would that sequence make the next important
      problem easier or harder to raise?
    examples:
      supportive: A missing owner was identified, the leader changed the plan and reported the correction
        without penalizing the person who raised it.
      mixed: The invitation was open but the response was defensive; the leader acknowledged that and
        returned with a factual disposition.
      contradictory: Silence was called consensus, a critic was punished or a disclosure was solicited
        without a safe appropriate process.
      inconclusive: Dissent was encouraged in words but no concern received a visible answer or follow-through.
  '22.09':
    title: Change a small system so the desired behavior no longer depends on speeches
    goal: Align a group’s norms, incentives, rituals, information flow, selection and consequences with
      one concrete desired behavior.
    scope_note: Use an authorized low-stakes group process or fictional design. This is not permission
      to alter employment selection, promotion, compensation or disciplinary rules without the proper
      authority.
    burden: Twenty minutes to audit the system, one small permitted trial and a 20-minute review.
    setup: Default to a volunteer group that says it values early problem reporting but celebrates only
      on-time completion. Choose the desired behavior of raising a missing input before a deadline. Prepare
      a system map with stated norm, rewarded behavior, meeting ritual, information route, role selection,
      progression and consequence.
    actions:
    - title: Find where the system teaches the opposite of the slogan
      instructions: 'Compare the stated value with an ordinary observed or fictional event: a person who
        reports a risk is called negative, while a late surprise is excused as bad luck. Give each system
        heading a relevant example or explicit unknown. Ask who receives information early, who is selected
        for visible roles and what happens after a mistake. Do not infer a whole culture from one event,
        but identify a plausible mechanism worth testing.'
      checks:
      - Stated norms and actual signals are compared
      - Incentives rituals information selection and consequences are mapped
      - Evidence and unknowns are distinguished
      - The cultural inference remains a testable limited hypothesis
    - title: Design one reinforcing change with a misuse check
      instructions: With permission, add a brief pre-deadline risk check where each task can be marked
        ready, missing input or needing a decision. Assign an owner to resolve a raised issue and recognize
        useful early information rather than merely positive status. Check that the change does not reward
        invented problems, punish honest estimates or add burdensome reporting. Identify which selection
        or promotion-related assumptions would need a separate authorized review rather than changing
        them informally.
      checks:
      - A small change supports the desired behavior
      - Raised issues have an accountable response owner
      - Gaming burden and punishment risks are considered
      - Formal selection or promotion changes remain properly authorized
    - title: Trial the mechanism and inspect the behavior it produces
      instructions: Use the next permitted low-stakes cycle or a tabletop example. Record whether a missing
        input surfaced earlier, whether anyone acted on it and whether the discussion stayed factual.
        Ask participants what the new ritual rewarded in practice and revise one unintended incentive.
        Keep the observation limited to this cycle; a new form or meeting question does not prove that
        the institution’s culture has changed.
      checks:
      - A cycle or labeled tabletop test is completed
      - Early information and the response to it are both observed
      - Participants can identify unintended incentives
      - A limited process result is not called cultural transformation
    adaptation: Use accessible asynchronous status, a small peer group or fictional organization. Avoid
      employee surveillance, individual rankings or collection of sensitive personnel information. Actual
      incentive, hiring and promotion systems require appropriate governance and legal review.
    review: What behavior did the system reward after the change, and which old signal still contradicts
      the value you say the group holds?
    examples:
      supportive: The risk check surfaced a missing approval early and an owner resolved it, while the
        group recognized the useful warning.
      mixed: The new ritual produced many vague risks but little action; the group added clear ownership
        rather than praising reporting volume.
      contradictory: The leader used the system to surveil people, reward invented problems or change
        personnel consequences without authority.
      inconclusive: Culture was discussed through slogans without changing or testing a norm, incentive
        or information route.
  '22.10':
    title: Navigate a stakeholder disagreement without trading away principles
    goal: Understand interests, coalitions, status and informal authority well enough to pursue a defensible
      objective through legitimate negotiation rather than manipulation or naïve assumptions.
    scope_note: Use a low-stakes authorized proposal or fictional organization. This is not permission
      for bribery, secret favors, deception, coercion or collecting private political profiles.
    burden: Twenty minutes to map the decision, two short information conversations or rehearsals and
      a proposal revision.
    setup: Default to proposing an accessible time for a recurring group meeting. Stakeholders include
      the scheduler, participants, a room owner and an influential long-standing member. Prepare headings
      for legitimate interest, formal role, informal influence, constraint, possible agreement and non-negotiable
      principle.
    actions:
    - title: Map interests and influence without mind-reading
      instructions: Identify who can approve the time, who can block room access and who others listen
        to even without a title. Ask or use supplied facts about their concerns, such as work schedules,
        continuity or setup burden. Mark an apparent coalition as a hypothesis unless participants confirm
        a shared position. Name the principle you will not trade, such as truthful communication and a
        fair access process, while recognizing that not every preference can be satisfied.
      checks:
      - Formal and informal authority are distinguished
      - Interests and constraints use evidence rather than assumed motives
      - Coalitions are not treated as secret plots without evidence
      - A defensible objective and non-negotiable principle are stated
    - title: Seek context and build a transparent possible agreement
      instructions: Ask two relevant stakeholders what would make a change workable and what you may be
        missing. Summarize the overlap and the genuine conflict, then propose a limited option such as
        a trial alternate time with a review date. State who benefits, who bears inconvenience and how
        that burden could be reduced. Do not promise a private favor, conceal a material downside or tell
        different people incompatible stories to obtain support.
      checks:
      - Two perspectives inform the proposal or labeled rehearsal
      - Shared interests and real conflict are explicit
      - Benefits burdens and mitigation are transparent
      - No secret favor deception or incompatible promise is used
    - title: Present the proposal through the legitimate decision route
      instructions: Submit the bounded option to the person or body with authority, including unresolved
        concerns and the trial’s acceptance criteria. Record the decision and communicate it consistently
        to affected people. If declined, identify whether the reason changes your understanding or calls
        for a different authorized route, rather than retaliating against an influential person. Review
        whether trust and principles survived even if the objective was not achieved.
      checks:
      - The proposal uses the legitimate decision route
      - Unresolved concerns and trial criteria are included
      - The decision is communicated consistently
      - A refusal does not trigger retaliation or abandonment of principles
    adaptation: Use accessible written consultation, a facilitator or the fictional case. Do not treat
      coworkers as targets to manipulate or disclose their private interests. Formal procurement, employment,
      political and legal decisions require their own governing processes.
    review: Which interest or informal influence did you initially miss, and could you explain every promise
      you made openly to all affected people?
    examples:
      supportive: The proposer learned the setup constraint, offered a transparent trial and used the
        authorized scheduling decision route.
      mixed: The objective was declined, but the explanation revealed a real constraint and no hidden
        promises damaged trust.
      contradictory: The proposer traded private favors, misrepresented different stakeholders’ positions
        or retaliated against someone who opposed the change.
      inconclusive: A stakeholder map was made without checking interests or presenting a defensible transparent
        proposal.
  '22.11':
    title: Lead a tabletop disruption with safety, clear ownership and a reassessment time
    goal: Practice stabilizing a limited disruption, communicating known and unknown facts, assigning
      appropriate owners and revising the plan without pretending certainty under pressure.
    scope_note: This is an announced tabletop exercise, not live emergency training, incident-command
      qualification or permission to direct responders. Real emergencies follow the site plan and authorized
      services.
    burden: Fifteen minutes to prepare, a 20-minute tabletop scenario and a 15-minute review.
    setup: Use a fictional workshop whose venue becomes unavailable shortly before arrival. No real alarm,
      utility failure or emergency call is created. Prepare a status board with safety status, known facts,
      unknowns, immediate objective, owners, communication, decision time and next review. Use the site’s
      real plan only with permission and without private contact details in evidence.
    actions:
    - title: Stabilize the scenario before trying to preserve the event
      instructions: State that people’s safety and the responsible site authority’s instructions take
        precedence over continuing the workshop. Identify what is known, what needs confirmation and who
        has authority to assess the venue. Choose a limited immediate objective, such as preventing attendees
        from arriving at an unavailable location. Do not improvise electrical, medical or building-safety
        actions, and do not let an unverified rumor become the operational picture.
      checks:
      - Safety and authorized site instructions take precedence
      - Known facts unknowns and verification owners are separated
      - A limited immediate objective is stated
      - No unqualified technical or emergency action is improvised
    - title: Assign owners and communicate a useful update
      instructions: 'Give one person the venue-confirmation task, one the attendee message and one the
        permitted alternative or cancellation check, with an accepting owner for each. Draft a concise
        update: what happened, what people should do now, what remains uncertain and when the next update
        will arrive. Provide an accessible channel and avoid conflicting instructions. If the scenario
        introduces a real emergency condition, the correct tabletop response is to invoke the actual authorized
        emergency route, not personally take command.'
      checks:
      - Each critical task has one accepting owner
      - The update states action uncertainty and next update time
      - Communication is accessible and internally consistent
      - Emergency authority is not assumed by the exercise leader
    - title: Inject a changed fact and conduct a no-blame learning review
      instructions: Add a fictional update that the alternative room is also unavailable. Reassess by
        the stated time, decide to defer or cancel within authority and communicate the change without
        pretending the first plan was certain. Review whether people knew what to do, whether any task
        lacked an owner and what information arrived too late. Preserve the original decision sequence
        and choose one preparedness improvement. A smooth tabletop exercise does not demonstrate live
        crisis competence.
      checks:
      - A changed fact triggers a timely reassessment
      - The revised decision is communicated with its reason
      - Ownership and information gaps are reviewed
      - Tabletop performance is not claimed as live crisis qualification
    adaptation: Use an accessible written scenario, a small peer group or solo role cards. Do not disrupt
      actual services, call emergency lines for practice or simulate frightening events without consent.
      Follow the appropriate real emergency plan whenever a real incident occurs.
    review: At each point, could a participant say what was known, what to do, who owned the next action
      and when the plan would be reconsidered?
    examples:
      supportive: The tabletop team prevented conflicting messages, assigned clear owners and canceled
        promptly when the alternative failed.
      mixed: The first update lacked a next review time; the team corrected it and added that field to
        preparedness notes.
      contradictory: The leader improvised unsafe technical action, hid uncertainty or treated a practice
        role as authority over real responders.
      inconclusive: Crisis leadership was discussed without a status update, accountable assignments or
        a changed-fact reassessment.
  '22.12':
    title: Let a successor run one decision without your hidden instructions
    goal: Reduce dependence on one leader by distributing knowledge, preparing a replacement and documenting
      the principles and authority needed for a safe transition.
    scope_note: Use an authorized low-stakes group role or a fictional transition. This is not permission
      to transfer legal, financial or safety authority informally.
    burden: Thirty minutes to prepare a transition pack, one short successor-led task and a 20-minute
      review.
    setup: Default to a rotating facilitator running the next planning meeting. Prepare the purpose, agenda,
      decision rights, current commitments, escalation route, access permissions, governing norms and
      review date. Do not put passwords, private personnel information or protected records into the pack.
    actions:
    - title: Identify what currently depends on your personal memory or approval
      instructions: List the decisions, relationships, records and exceptions the group would struggle
        with if you were absent. Separate authority that can be delegated from authority requiring a formal
        appointment or approval. Explain the group’s principles and the reason for one important rule,
        not merely your preferred habits. Choose a willing successor or backup through the legitimate
        process and ask what preparation they need.
      checks:
      - Memory relationships records and exceptions are mapped
      - Delegable and formally retained authority are distinguished
      - Principles and rule rationale are documented
      - A successor is chosen through an appropriate willing process
    - title: Transfer knowledge and let the successor make a real bounded choice
      instructions: Walk through one ordinary decision and one harmless exception, then give the successor
        the permitted information and resources. Ask them to run the next low-stakes agenda choice or
        tabletop meeting while you observe without supplying hidden directions. Let them choose a different
        valid method within the principles. Stop only for a real scope or safety boundary, explaining
        the reason rather than reclaiming control because their style differs.
      checks:
      - Ordinary and exception knowledge are transferred
      - The successor has the required permitted resources
      - A bounded decision is genuinely made by the successor
      - Valid style differences do not trigger unnecessary takeover
    - title: Review resilience and formalize the next handoff
      instructions: Ask what information was missing, which authority was unclear and what still required
        your personal access. Revise the pack and confirm the formal owner, backup and review process
        for the role. Make sure the group knows who now decides and how to challenge an error. Record
        the remaining dependency honestly; one successful meeting is evidence of a small transition, not
        proof that the whole institution can survive any leadership loss.
      checks:
      - Missing information and authority gaps are identified
      - The pack is revised from the successor’s experience
      - Owner backup and challenge routes are communicated
      - Remaining person-dependence is not hidden
    adaptation: Use a peer rotation, accessible written handover or fictional successor case. Maintain
      required training, legal appointments, financial approvals and access controls. A successor should
      not be selected merely for personal loyalty or similarity to the current leader.
    review: What can the group now do without your permission or memory, and which principle would still
      guide a successor who chooses a different method?
    examples:
      supportive: The successor led a bounded decision using the documented norms, and the group clarified
        one approval gap for the next transition.
      mixed: The meeting worked but depended on the old leader’s account access; the authorized access
        arrangement was corrected.
      contradictory: The leader selected only a loyal imitation, withheld key information or transferred
        authority they had no right to delegate.
      inconclusive: A successor was named without a real decision attempt, governance context or dependency
        review.
  '22.13':
    title: Manage a conflict of interest before a small selection decision
    goal: Recognize bribery, favoritism, self-dealing and undisclosed interests, then apply proportionate
      disclosure, recusal, separated duties and review to a fictional or authorized decision.
    scope_note: This is governance education, not a corruption finding, legal procurement advice or permission
      to conduct an investigation. Real decisions follow applicable law and institutional policy.
    burden: Twenty minutes to analyze the case, one 20-minute control design and a 10-minute exception
      test.
    setup: Use a fictional group choosing a printing supplier. One decision-maker’s relative owns a bidder,
      another bidder offers a personal gift and the usual approver says small exceptions are how things
      get done. Prepare a record of criteria, interests, gifts, decision roles, approvals, review and
      escalation.
    actions:
    - title: Identify the conflict without treating disclosure as a cure
      instructions: Separate the legitimate purchasing need from each private interest or benefit. Identify
        possible favoritism, self-dealing, gift influence and the normalization of bypassed rules, while
        keeping an allegation distinct from an established fact. Read the applicable conflict and procurement
        policy or use the fictional policy requiring disclosure and independent decision review. State
        why merely announcing the relationship does not by itself make participation in the selection
        appropriate.
      checks:
      - Purchasing need and private interests are separated
      - Gift influence favoritism and normalized exceptions are identified
      - Concern and established misconduct are distinguished
      - Disclosure is not treated as automatically resolving the conflict
    - title: Assign proportionate controls and independent responsibility
      instructions: For the fictional case, disclose the relevant interest to the designated authority,
        remove the conflicted person from the affected decision under the policy and have a separate authorized
        person compare bids against predeclared criteria. Separate requesting, approving and verifying
        delivery where feasible. Define what record an independent reviewer needs without exposing unnecessary
        personal information. Real recusal, gift handling and enforcement must use the governing process
        rather than a homemade legal rule.
      checks:
      - Conflicts receive an authorized management disposition
      - Bid criteria are declared before selection
      - Key duties and review are appropriately separated
      - Records protect privacy while enabling independent scrutiny
    - title: Test the small-exception pressure and retain an audit trail
      instructions: Rehearse the response to a request to skip the comparison because the amount is small
        or the supplier is a friend. State the legitimate expedited process, if the policy provides one,
        or pause and seek the proper decision rather than inventing an exception. Check that the record
        shows who decided, on what criteria and how concerns can be escalated. Do not conduct a sting,
        offer a real gift or make a public accusation for the exercise.
      checks:
      - Pressure to normalize a small violation is tested
      - Any expedited route is authorized rather than invented
      - The decision and review trail remain inspectable
      - No sting gift or public accusation is staged
    adaptation: Use a fictional purchase with no money exchanged. Actual public procurement, employment,
      nonprofit and commercial rules differ; obtain qualified guidance. Do not upload private interests,
      bids or allegations into application evidence.
    review: Which control changed who could influence the decision, and could an independent person later
      distinguish a legitimate choice from an undisclosed favor?
    examples:
      supportive: The conflicted member stepped aside under the policy, independent criteria guided selection
        and the gift concern reached the designated authority.
      mixed: The relationship was disclosed but influence continued informally; the control design was
        revised to address the actual decision role.
      contradictory: Disclosure was used as permission for self-dealing or small rule violations were
        excused because everyone knows each other.
      inconclusive: Corruption was condemned without a conflict disposition, separated role or reviewable
        decision record.
  '22.14':
    title: Find how an oversight body could become dependent on the interest it governs
    goal: Identify a plausible capture mechanism from concrete governance arrangements and design checks
      without turning influence or disagreement into an unsupported conspiracy claim.
    scope_note: Use fictional institutions or verified public records. This is not a finding of corruption,
      political targeting or permission to investigate private people.
    burden: Two 25-minute mechanism comparisons and a 15-minute safeguard review.
    setup: 'Use three fictional cases: a venue board relies on one donor who can remove its funding; a
      regulator receives nearly all technical information from the industry it oversees; a professional
      committee selects successors only from the current leader’s allies. Prepare fields for duty, dependency,
      influence channel, missing counterweight, evidence and safeguard.'
    actions:
    - title: Trace the mechanism rather than assume bad motives
      instructions: For each case, state what the institution is supposed to govern and how money, information,
        appointments or status could narrow its choices. Distinguish legitimate expertise or support from
        a dependency that undermines independent judgment. Give regulators, boards, professions, parties,
        donors and leaders a relevant or absent role in the analysis. Identify what additional evidence
        would show actual influence over a decision rather than merely a relationship.
      checks:
      - Institutional duty and dependency are explicit in each case
      - Money information appointments and status mechanisms are distinguished
      - All named institution types receive a relevant or absent disposition
      - A relationship is not treated as proof of capture
    - title: Design a counterweight that addresses the actual dependency
      instructions: For the donor case, compare diversified support and transparent conditions; for the
        information case, compare independent evidence and documented dissent; for the succession case,
        compare transparent selection, rotation and independent review. Identify who would authorize the
        safeguard and what new cost or failure mode it could create. Do not assume rotation alone creates
        expertise or that transparency removes all pressure. Choose a proportionate combination tied to
        the mechanism.
      checks:
      - Safeguards match the specific dependency
      - Transparency rotation independent information and countervailing power are compared
      - Authority cost and new failure modes are considered
      - No single safeguard is treated as sufficient by itself
    - title: Stress-test the check against a determined but lawful influence attempt
      instructions: Use a paper scenario in which the donor threatens to withdraw support, the industry
        disputes the evidence or the leader objects to an independent successor. Ask whether the proposed
        check still permits a reasoned decision and protects legitimate participation. Revise the design
        where it depends on the powerful person’s goodwill alone. Write a limited conclusion about risk
        and governance, not a declaration that every donor, expert or leader is corrupt.
      checks:
      - Each safeguard faces a realistic paper challenge
      - The institution retains a reasoned decision route
      - Goodwill-dependent controls are identified and revised
      - The conclusion remains a bounded risk analysis
    adaptation: Use fictional cases when real politics or organizational records are sensitive. Public-record
      analysis must respect privacy and avoid unsupported allegations. Actual legal, regulatory or corruption
      concerns belong with qualified independent channels.
    review: What resource gave an outside interest disproportionate control, and what check would still
      function when that interest dislikes the decision?
    examples:
      supportive: The participant distinguished information dependence from proven corruption and proposed
        independent evidence plus an accountable review route.
      mixed: The first solution relied only on transparency; the stress test showed a need for a real
        independent decision power.
      contradictory: An ordinary funding relationship was declared proof of a conspiracy or all expertise
        was dismissed because it came from an interested party.
      inconclusive: Capture was named without tracing a mechanism or testing a counterweight.
  '22.15':
    title: Prepare a defensible escalation path without exposing protected information
    goal: Assess the evidence, seriousness, reporting options and retaliation risks of a concern while
      preserving lawful evidence handling, affected people’s safety and fair process.
    scope_note: This is a fictional escalation plan or preparation for qualified advice, not legal protection,
      a public-disclosure recommendation or permission to copy or upload classified, privileged, export-controlled
      or confidential information.
    burden: Twenty minutes to classify a fictional concern, a 25-minute route check and a short qualified-inquiry
      rehearsal.
    setup: 'Use the fictional case of a safety report marked complete despite an unresolved check. Prepare
      only neutral categories: direct observation, secondhand claim, severity, affected people, current
      danger, internal route, independent route, legal guidance, deadline and information restrictions.
      Do not put actual allegations or protected documents in this application.'
    actions:
    - title: Separate evidence, concern and immediate protective duty
      instructions: State what was directly observed in the fictional case, what is inferred and what
        remains unknown. Identify the potential consequence and whether immediate safety action through
        an authorized route is needed before ordinary reporting. Distinguish a technical disagreement,
        an error, serious misconduct and possible retaliation without deciding legal guilt. Preserve real
        evidence only through lawful authorized systems and qualified guidance; do not take restricted
        documents to make the case stronger.
      checks:
      - Direct observation inference and unknowns are separated
      - Severity and immediate safety needs are identified
      - Disagreement error misconduct and retaliation are distinguished
      - Evidence handling remains lawful authorized and privacy-protecting
    - title: Verify reporting channels, coverage and confidentiality limits
      instructions: Compare the relevant internal safety or ethics route with an appropriate independent
        authority or qualified adviser. Check jurisdiction, worker category, subject-matter coverage,
        deadlines and what confidentiality or anonymity the route actually offers. Do not assume that
        a whistleblower label protects every disclosure or that an online portal can receive classified
        material. For restricted information, use the specifically authorized secure reporting process
        and obtain guidance without transmitting the material through an ordinary channel.
      checks:
      - Internal and independent routes are compared for the actual issue
      - Coverage deadlines and practical retaliation risks are checked
      - Confidentiality and anonymity are not overpromised
      - Restricted material is not sent through an unauthorized portal
    - title: Write a minimal inquiry and an accountable next-step plan
      instructions: 'Rehearse a neutral request for guidance using fictional facts: I have a concern about
        an unverified safety check; which authorized process applies and how should evidence be preserved.
        Identify the next owner, timing, safe support and what to do if the first route is conflicted
        or unresponsive. Include protection for affected people and a fair opportunity for authorized
        fact-finding. Do not publish an allegation, contact witnesses covertly or conduct your own investigation
        to complete the exercise.'
      checks:
      - The inquiry is minimal and factual
      - Next owner timing support and conflict alternatives are explicit
      - Affected people and due process are protected
      - No unauthorized disclosure or amateur investigation is performed
    adaptation: Use the fictional case and accessible official guidance. Actual concerns may need an attorney,
      inspector general, regulator, safety authority or other specifically authorized route; availability
      and protection vary. Current danger or a legal deadline should not wait for this practice to finish.
    review: Which facts justify escalation, which channel can lawfully receive them, and what prevents
      the reporting plan from harming people or compromising evidence?
    examples:
      supportive: The participant distinguished an unresolved check from a proven offense and identified
        a qualified secure reporting route before handling any real material.
      mixed: The first route did not cover the worker category, so the participant sought the correct
        independent guidance instead of assuming protection.
      contradictory: Protected information was uploaded publicly, anonymity was promised without basis
        or a real deadline was ignored while building a perfect case.
      inconclusive: Whistleblowing was praised as courage without evidence distinctions, coverage checks
        or a lawful escalation path.
  '22.16':
    title: Build a small governance rule that can correct the leader
    goal: Define decision rights, oversight, appeal, succession and transparent records so a group can
      detect and correct an error without relying only on a leader’s virtue.
    scope_note: Use a fictional group or an authorized low-stakes governance proposal. This is not a legal
      charter, fiduciary opinion or permission to replace existing bylaws informally.
    burden: Thirty minutes to draft, a 20-minute error-and-absence tabletop test and a short revision.
    setup: Default to a small association approving use of a shared room. Prepare a one-page governance
      rule with who decides, what criteria apply, what is recorded, who checks, how to appeal, conflicts,
      temporary absence and review. Use fictional names and no actual funds or legal appointments.
    actions:
    - title: Allocate authority and oversight before a dispute occurs
      instructions: State which routine decisions the coordinator may make and which require a second
        authorized review. Define the purpose-linked criteria, required information and limits of discretion.
        Identify who can inspect the record and how privacy will be protected. Separate the decision-maker
        from the appeal reviewer where feasible, and define what happens when either has a conflict. A
        title alone does not explain the boundaries of legitimate authority.
      checks:
      - Routine and higher-consequence decisions have defined rights
      - Criteria information and discretion limits are explicit
      - Transparency and privacy are balanced
      - Independent review and conflict handling are specified
    - title: Test a leader error and a challenge from a less powerful member
      instructions: Use a fictional case where the coordinator applies the wrong booking rule and a newcomer
        notices. Walk through how the person raises the issue, what evidence is considered, who reviews
        it and how the result is communicated. Ensure the coordinator cannot simply veto review of their
        own decision and that disagreement does not automatically remove the newcomer’s access. Preserve
        fair process for the decision-maker as well as the challenger.
      checks:
      - A concrete error can be detected and challenged
      - The review does not depend on the leader’s permission alone
      - The challenger is not penalized for a good-faith concern
      - Both affected parties receive a fair reasoned process
    - title: Test absence, revise and assign maintenance
      instructions: Add a second scenario in which the coordinator is unavailable or the reviewer must
        recuse. Identify the authorized temporary replacement, what information they receive and how the
        group learns who now decides. Revise any gap exposed by the tests and assign an owner and review
        date for the rule. Do not call the institution accountable merely because a document exists; the
        test should show who can actually correct an error.
      checks:
      - Absence and recusal have authorized replacement routes
      - Knowledge and authority transfer are communicated
      - The rule is revised from concrete test failures
      - Maintenance and future review are assigned
    adaptation: Use an accessible diagram, peer group or fictional tabletop. Real legal entities must
      follow their governing documents and qualified advice for changes. Oversight should not expose private
      personal or case information beyond legitimate need.
    review: Who can correct the leader when the leader disagrees, and does the same mechanism still work
      when the usual reviewer is absent or conflicted?
    examples:
      supportive: The newcomer’s challenge reached an independent reviewer, the error was corrected and
        a recusal backup kept the process usable.
      mixed: The first rule gave the leader control over appeals; the tabletop exposed that flaw and the
        group revised it.
      contradictory: Appeal depended on personal favor, critics lost access or existing legal governance
        was overridden without authority.
      inconclusive: Accountability was described as a value without decision rights, a tested appeal or
        succession route.
  '22.17':
    title: Design an abuse-response pathway that protects people before reputation
    goal: Separate immediate safety, qualified investigation, accountability, remediation and structural
      prevention when an institution receives a serious concern.
    scope_note: This is a fictional institutional-response exercise, not an investigation, legal determination,
      trauma treatment or permission to interview affected people. A real urgent concern requires the
      appropriate prompt protective and reporting action.
    burden: Twenty minutes to map the pathway, one 20-minute case test and a 15-minute structural-repair
      review.
    setup: 'Use two fictional reports: a participant reports harassment by a leader; a separate financial
      control review finds a possible false record. Prepare a response map for safety, support, reporting
      duty, independent intake, evidence preservation, qualified investigation, fair process, decision,
      remedy, communication and recurrence prevention.'
    actions:
    - title: Prioritize protection and independent intake
      instructions: For each report, distinguish immediate danger, ongoing exposure, support needs and
        any mandatory or appropriate external reporting requirement to verify locally. Identify an intake
        route that does not require the person to report only to the accused leader or their close ally.
        Explain confidentiality limits and available support without promising a result. Do not demand
        a complete narrative, force mediation or delay protection until the institution decides how the
        story will look publicly.
      checks:
      - Safety exposure and support are addressed first
      - An appropriately independent intake route exists
      - Reporting duties and confidentiality limits are checked
      - Reputation management does not delay protection or force disclosure
    - title: Assign qualified fact-finding and fair decision authority
      instructions: Identify who is authorized and competent to preserve evidence, investigate and decide
        under the applicable process, with conflicts managed. Distinguish an allegation, a substantiated
        finding and an unresolved question. Plan a fair opportunity for relevant responses without making
        the affected person conduct the investigation or confront the accused. Protect records and prevent
        retaliation through the institution’s legitimate mechanisms; do not make a public finding or gather
        real testimony for this tabletop exercise.
      checks:
      - Investigation and decision roles are qualified and authorized
      - Conflicts and evidence preservation are addressed
      - Allegation finding and uncertainty are distinguished
      - No forced confrontation amateur investigation or public verdict occurs
    - title: Connect the outcome to remedy and structural change
      instructions: For the fictional cases, specify how a justified outcome could lead to appropriate
        accountability, support, correction of records and repair of the control or reporting failure.
        Include how harassment, discrimination, violence, fraud or cover-up would reach the relevant qualified
        route rather than treating all issues as an interpersonal misunderstanding. Set an independent
        check for recurrence and communicate process changes without exposing private details. A public
        apology or removal of one person alone does not prove institutional repair.
      checks:
      - Remedy and accountability follow the authorized findings process
      - Different serious harms have appropriate response routes
      - A structural failure and recurrence check are identified
      - Communication protects privacy and does not overclaim repair
    adaptation: Use non-graphic fictional cases and accessible process maps. Real child-safety, violence,
      discrimination, fraud or retaliation concerns require prompt appropriate professional, legal, safeguarding
      or emergency channels. Do not collect real victim, witness or personnel data in this application.
    review: Who is protected while facts are established, who can hold the institution accountable, and
      what changed beyond the wording of its public response?
    examples:
      supportive: The pathway provided independent intake, qualified investigation and a tested reporting-control
        change without forcing the affected person into mediation.
      mixed: The first response focused on a statement; the review added immediate support, evidence preservation
        and independent recurrence checks.
      contradictory: The institution hid a report, retaliated, pressured forgiveness or treated reputation
        repair as a substitute for safety and accountability.
      inconclusive: An apology plan was written without qualified roles, fair process, remedy or structural
        prevention.
