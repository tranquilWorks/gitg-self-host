schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '16'
exercises:
  '16.01':
    title: Check that you understood one speaker before offering your own view
    goal: Listen for the speaker’s actual meaning, clarify uncertainty and let them correct your summary
      before you respond with advice or disagreement.
    scope_note: This is a willing low-stakes conversation, not counseling, interrogation or an obligation
      to disclose personal material. Agreement with the speaker is not required.
    burden: Five minutes to prepare, a ten-minute conversation and a five-minute private review.
    setup: Invite a willing person to discuss an ordinary choice such as how to spend a shared afternoon.
      Ask whether they are comfortable with you practicing a brief summary before responding. Put away
      optional distractions while preserving communication aids. They may choose a fictional preference
      instead of a personal concern.
    actions:
    - title: Hear the account without building a counterargument
      instructions: 'Let the person explain their preference and reasons without interrupting to solve
        the problem. Notice the urge to rehearse your reply and redirect attention to their words. Keep
        only three private anchors if needed: what they want, why it matters and what constraint they
        named. Do not require eye contact, a particular posture or uninterrupted speech as proof of attention;
        use the communication mode that works for both people.'
      checks:
      - The speaker chooses a welcome low-stakes topic
      - Preference reason and constraint are heard as separate elements
      - Advice or rebuttal is withheld during the first account
      - Communication supports and natural pauses remain available
    - title: Offer a tentative summary and one real clarification
      instructions: 'Say the meaning in your own words: You would prefer a quiet afternoon because the
        week was tiring, but you still want some time together; have I understood? Ask one neutral question
        about a genuine uncertainty rather than a disguised objection. Invite correction and replace the
        inaccurate part of your summary. Do not treat a polite yes or silence as proof of understanding
        when the person signals uncertainty or cannot freely disagree.'
      checks:
      - The summary includes the speaker’s reason and constraint
      - A neutral question addresses a real uncertainty
      - Correction is invited and incorporated without defense
      - Silence or politeness is not automatically counted as confirmation
    - title: Respond only after the speaker has checked the meaning
      instructions: Ask whether they want your view, practical ideas or simply acknowledgment. Give the
        chosen response and, when relevant, state your own preference without erasing theirs. At the end,
        ask whether your summary captured what mattered and record only their broad confirmation, correction
        or declined feedback. A fictional role-play counts as listening rehearsal, not evidence of understanding
        this person’s real feelings.
      checks:
      - The response mode is checked rather than assumed
      - Your position is distinguished from the speaker’s position
      - The speaker’s actual feedback or refusal remains visible
      - Rehearsal and real relational understanding are distinguished
    adaptation: Use text, signing, speech-to-text, an interpreter or more processing time. A partner may
      decline the exercise or feedback without penalty. Choose a different context when power, conflict
      or privacy makes genuine correction unsafe.
    review: Which part of the speaker’s meaning changed after clarification, and did your eventual response
      address that corrected meaning?
    examples:
      supportive: The listener discovered that the issue was exhaustion rather than disinterest and changed
        the proposed activity while retaining their own wish for time together.
      mixed: The summary was mostly accurate, but one leading question pushed the speaker toward agreement
        and needed a more neutral retry.
      contradictory: The listener used the summary to trap the speaker into a concession or diagnose an
        emotion they had not reported.
      inconclusive: The listener waited silently but never checked meaning with the speaker before giving
        advice.
  '16.02':
    title: Turn one hinted request into a message another person can act on
    goal: State the observation, reasoning, feeling or need, requested action and controllable boundary
      plainly enough that the recipient does not have to decode hints.
    scope_note: Choose an ordinary request you are entitled to make. Clear expression does not guarantee
      agreement and must not become a threat, demand for disclosure or unsafe confrontation.
    burden: Fifteen minutes to draft, one brief willing exchange and five minutes to revise or confirm.
    setup: 'Default case: a shared item is repeatedly unavailable when needed. Start from the vague message
      It would be nice if people were more considerate. Use a private draft and prepare a respectful direct
      version; a fictional role-play is available when no safe real request exists.'
    actions:
    - title: Separate the message into five concrete parts
      instructions: 'Write the observable event without always, never or a motive claim. Then state its
        practical effect, the feeling or need you choose to share, the reason the issue matters and the
        specific change requested. For the default: The tool was not on its shelf yesterday; I could not
        finish the repair; I need a reliable return place; please put it back after use. Remove any claim
        that a reasonable person should simply know.'
      checks:
      - The event is observable rather than a character judgment
      - Effect feeling or need and reason are distinguishable
      - The requested action is specific enough to perform
      - Hints and mind-reading expectations are removed
    - title: Add a proportionate boundary and test the wording
      instructions: Where a boundary is necessary, name only your own future participation, such as I
        can lend it when we agree where and when it will return. Read the message aloud or in the intended
        medium and remove extra explanation that hides the request. Ask a willing reader to identify what
        happened, what is requested and what you will do. Revise any part they cannot identify without
        coaching them to the answer.
      checks:
      - Any boundary concerns your own controllable action
      - The main request is not buried in excess explanation
      - A reader identifies the intended action without being supplied the answer
      - Ambiguous wording is revised after the comprehension check
    - title: Deliver or rehearse and distinguish understanding from consent
      instructions: Ask for an appropriate time, send or speak the message in the agreed channel, and
        invite clarification. Record whether the recipient understood the request and whether they accepted,
        declined or proposed another arrangement. Respond to a refusal with a safe decision within your
        control rather than repeating the message until they submit. Label a role-play honestly and keep
        personal wording outside the application.
      checks:
      - Timing and channel are appropriate to the recipient
      - Understanding and agreement are recorded separately
      - A refusal does not trigger pressure or punishment
      - Actual delivery and rehearsal remain distinct
    adaptation: Use a shorter text, supported communication, translation or an intermediary agreed by
      both parties. Directness can be respectful without being abrupt; adapt formality while preserving
      the concrete request. Use appropriate support instead of this exercise where retaliation or abuse
      is plausible.
    review: Could the recipient accurately name the requested action even if they disagreed with it, and
      what did your first draft leave them to guess?
    examples:
      supportive: The revised message named the missing tool and return location, and the recipient understood
        it but proposed a different mutually workable shelf.
      mixed: The request was clear, but the boundary still depended on forcing an apology and was rewritten
        around lending conditions.
      contradictory: The person used clarity as an excuse for insults, threats or repeated pressure after
        a refusal.
      inconclusive: The message became longer and more emotional without stating an observable request.
  '16.03':
    title: Notice, consider alternatives and clarify one uncertain social cue
    goal: Use a contextual change in nonverbal behavior as a reason to ask, not as proof of another person’s
      emotion, intention or character.
    scope_note: This is a companion to the existing Practice Emotional Cue Detection protocol. Its runtime
      actions, evidence fields, completion rules and historical replay remain frozen; the reading checks
      here are not replacement application measurements.
    burden: About fifteen to thirty minutes across one welcome interaction and a comparison within seven
      days, following the existing ten-day practice.
    setup: 'Choose a familiar low-stakes setting where a neutral clarification question is welcome. Supplied
      case: during a discussion of weekend plans, a person’s replies become shorter and their pace changes.
      No recording, covert test or deliberate provocation is needed. A fictional scene can support rehearsal
      only.'
    actions:
    - title: Describe one change before naming an emotion
      instructions: During the welcome interaction, notice one change in tone, pace, posture, facial expression,
        gesture, distance or optional eye contact. Describe what changed relative to that interaction,
        such as replies became shorter after the location changed, without writing annoyed, dishonest
        or rejecting me as the observation. Also consider your own distance, pace and tone so that clarification
        does not add pressure. Do not insist on a cue that is inaccessible or absent.
      checks:
      - One contextual change is described without assigning a motive
      - Observation is separated from an emotion label
      - Your own delivery is checked for avoidable pressure
      - Absent or inaccessible cues are not invented
    - title: Keep at least two explanations genuinely open
      instructions: Before asking, name at least two plausible explanations and include one unrelated
        to you. Short replies might reflect tiredness, divided attention, a communication habit or discomfort
        with the proposed plan. State what you do not know and what answer would contradict your first
        impression. Culture, disability, neurotype and setting can affect expression; do not turn any
        one of them into a new stereotype or use a body-language rule to settle the question.
      checks:
      - At least two plausible explanations remain tentative
      - One explanation does not center on you
      - A possible disconfirming answer is named
      - No cue rule diagnosis or cultural stereotype resolves the uncertainty
    - title: Ask neutrally and compare with the actual answer
      instructions: When welcome, ask a non-leading question such as How is this plan working for you?
        or Would another time be easier? Accept a brief answer, uncertainty or refusal without probing
        for private reasons. Within seven days, compare the answer or later information with the initial
        impression and retain contradictions. Use only the existing application’s original fields for
        its check-in; these companion checks do not award new credit or change what the legacy protocol
        requires.
      checks:
      - Clarification is neutral and welcome
      - A brief answer or refusal is respected
      - The comparison occurs within the existing seven-day follow-up boundary
      - Legacy check-in fields and completion rules are not replaced
    adaptation: Text, signing, voice, AAC and in-person exchanges offer different partial cues; direct
      verbal clarification can be preferable to visual interpretation. Do not use this protocol for diagnosis,
      deception detection, discipline, abuse assessment or other high-stakes judgments. A fictional case
      remains rehearsal, not interpersonal accuracy evidence.
    review: What did the person’s actual answer support, contradict or leave unknown, and how did you
      prevent the first impression from becoming a verdict?
    examples:
      supportive: Short replies initially suggested annoyance, but the person explained that they were
        reading travel information; the listener retained the correction and adjusted the pace.
      mixed: A neutral question was asked, but the answer was ambiguous, so the initial interpretation
        remained uncertain rather than confirmed.
      contradictory: Eye contact or facial expression was treated as proof of lying, diagnosis or rejection,
        or the person was secretly tested.
      inconclusive: Several feelings were guessed without a welcome clarification or later comparison.
  '16.04':
    title: Practice opening, sharing and closing a conversation without taking it over
    goal: Initiate and sustain reciprocal conversation, include another participant and end or transition
      respectfully in both one-to-one and small-group settings.
    scope_note: Ordinary conversation is not a performance contest. Participation, disclosure and continued
      conversation must remain voluntary; a polite ending is a valid outcome.
    burden: Ten minutes to prepare and two short ordinary conversations over a week, followed by a ten-minute
      review.
    setup: Use a familiar social or hobby setting. Prepare a context-linked opening such as Have you tried
      this activity before? and a small relevant contribution of your own. Plan one one-to-one exchange
      and one willing small-group exchange, without approaching someone who is busy, isolated for privacy
      or signaling that they want to leave.
    actions:
    - title: Open with context and allow an easy exit
      instructions: Choose a moment when conversation is reasonably welcome, introduce yourself or refer
        to the shared activity, and ask one open but nonintrusive question. Listen to the answer and share
        one related detail rather than firing another question immediately. If the person gives little
        response or needs to leave, acknowledge it and end politely; do not treat persistence as the skill
        being practiced.
      checks:
      - The opening fits the shared setting
      - One question is balanced with a relevant contribution
      - The other person has room to choose depth and duration
      - Low interest or an exit cue is respected
    - title: Balance turns and include without spotlighting
      instructions: In a willing small group, follow the existing topic before introducing your own. Make
        one connection between contributions, leave space after speaking and invite an overlooked participant
        only in a way they can decline, such as We have been discussing routes; any thoughts you would
        like to add? Do not demand an opinion, finish someone’s sentences or turn a quiet person into
        a public inclusion project. Notice whether your contribution opens or closes space for others.
      checks:
      - The existing topic is understood before a new one is introduced
      - Your own speaking leaves space for other contributions
      - An invitation is optional rather than a demand to perform
      - Quiet participation is not interpreted as a defect
    - title: Use a clear transition or close and review reciprocity
      instructions: 'At a natural point, either bridge to a related topic or close with a brief acknowledgment:
        Good talking about the route; I am going to rejoin the activity. Make a future invitation only
        when genuinely intended. After both conversations, record one moment of listening, one of sharing,
        one inclusion choice and how the ending worked. Missing a group opportunity remains untested rather
        than being replaced by an imagined conversation.'
      checks:
      - The transition or ending is explicit and considerate
      - Future contact is suggested only when genuinely intended
      - Both listening and contribution appear in the review
      - One-to-one and group experience are reported separately
    adaptation: Use text groups, a smaller gathering, a quiet environment or prepared opening phrases.
      Different cultures and neurotypes have different turn-taking rhythms; ask or observe respectfully
      rather than enforcing a single style. Rest and opting out are legitimate.
    review: Where did the exchange become reciprocal, and what did you do when the other person’s preferred
      pace or ending differed from yours?
    examples:
      supportive: The participant opened with the shared activity, contributed briefly, invited an optional
        group response and ended without an empty promise to meet again.
      mixed: The one-to-one exchange was balanced, but the group conversation was dominated by the participant’s
        explanation and needed a shorter contribution next time.
      contradictory: A quiet person was pressured to speak or an unwilling person was pursued after trying
        to end the exchange.
      inconclusive: Conversation tips were read without an actual opening, reciprocal exchange or close.
  '16.05':
    title: Compare your imagined explanation with what the person actually says
    goal: Represent another person’s perspective fairly while keeping your inferences provisional and
      allowing their account to correct yours.
    scope_note: Use a willing ordinary disagreement, not trauma exploration, mind-reading, adjudication
      or an attempt to make someone justify private motives.
    burden: Ten minutes for a private hypothesis, a ten-minute willing conversation and a five-minute
      comparison.
    setup: 'Default disagreement: one person wants to plan an outing in advance and another prefers to
      decide later. Use three headings: what I observed, what I think may matter to them and what only
      they can tell me. The other person may choose not to explain or may use a fictional role.'
    actions:
    - title: Form more than one plausible account of the other viewpoint
      instructions: Write the observable disagreement and at least two possible priorities behind the
        other preference. Deciding later might preserve flexibility, accommodate uncertain energy or avoid
        committing before costs are known; it need not mean indifference. Include a reasoned account that
        you could respect even while choosing differently. Identify which parts are guesses and what information
        would make you revise them.
      checks:
      - The observable disagreement is separated from interpretation
      - At least two plausible priorities are considered
      - One account is represented in terms the other person could recognize
      - Guesses and revision conditions are explicit
    - title: Ask about the relevant concern without demanding a motive
      instructions: With permission, ask what matters most about their preferred timing and what makes
        the alternative difficult. Reflect their answer in ordinary language and invite correction. Do
        not ask leading questions that confirm your favorite explanation or demand access to private history.
        When they decline, accept that limit and keep the perspective uncertain; refusal is not evidence
        that the least charitable explanation was correct.
      checks:
      - Questions address the practical concern without presuming the answer
      - The person can correct the reflected account
      - Private history and disclosure remain optional
      - A refusal leaves uncertainty rather than confirming a negative story
    - title: Revise your representation before choosing a response
      instructions: Compare the reported concern with your earlier possibilities. Mark each as supported,
        contradicted or still unknown, then write a revised two-sentence account of their position and
        one remaining point of disagreement. Choose a response that acknowledges the verified concern,
        such as a refundable plan or a later decision deadline, without pretending the conflict has vanished.
        A fictional role-play tests perspective construction, not accuracy about a real person.
      checks:
      - The original hypotheses are compared with actual reported information
      - Supported contradicted and unknown elements remain distinct
      - The revised account preserves a real disagreement when one remains
      - The next response addresses the verified concern rather than the initial guess
    adaptation: Use writing, more time or a neutral facilitator for a safe low-stakes disagreement. Do
      not apply this exercise to assess dangerous intent or override evidence of harm; those situations
      require appropriate safety and professional support.
    review: Which assumption did the person correct, and how did that correction change the response without
      requiring you to agree with everything?
    examples:
      supportive: The participant learned that uncertain transport, not lack of interest, drove the delay
        and proposed a decision point that respected both constraints.
      mixed: The conversation clarified one practical concern but left the person’s broader preference
        unknown, so the account remained limited.
      contradictory: The participant insisted that they knew the person’s true motive better than the
        person did or used questions to force disclosure.
      inconclusive: A sympathetic story was written but never checked against the person’s report.
  '16.06':
    title: Explain the same change to two audiences without changing the truth
    goal: Adapt detail, language, medium, timing and tone while preserving the same material facts, uncertainty
      and required action.
    scope_note: Adaptation is not concealment or a license to stereotype an audience. Use a harmless fictional
      notice or an authorized real message, not confidential or high-stakes instructions.
    burden: Twenty minutes to prepare two versions and ten minutes for two comprehension checks.
    setup: 'Use the fictional notice: a community workshop moves from Room A to Room C this Saturday;
      the start stays at 10 a.m.; the step-free entrance is on the east side; people needing assistance
      can contact the organizer. Audience one is a first-time visitor; audience two is the setup team
      that already knows the building.'
    actions:
    - title: Fix the facts and identify each audience’s task
      instructions: Write the unchanged facts once, including what is not changing. For the visitor, identify
        the need to find the room and accessible entrance; for the setup team, identify the need to redirect
        signs and equipment. Note what each audience already knows, what terms need explanation, which
        channel reaches them and when they need the message. Do not infer needs from age, nationality
        or job title alone when they can be checked.
      checks:
      - A single factual baseline includes unchanged details
      - Each audience has a concrete different task
      - Knowledge medium timing and access needs are considered
      - Audience assumptions remain checkable rather than stereotyped
    - title: Write two versions with different emphasis and the same material content
      instructions: Draft a short visitor message leading with the new room and arrival route, and a setup
        message leading with the sign and equipment changes. Explain room directions where needed and
        keep the unchanged start time visible in both. Adjust formality and urgency to the situation without
        exaggerating inconvenience or inventing a safety claim. Include an accessible text route rather
        than relying solely on a picture of the floor plan.
      checks:
      - The versions prioritize different audience actions
      - Room time and entrance facts remain consistent
      - Tone and urgency do not distort the significance of the change
      - Essential information is available outside an image alone
    - title: Test what each reader would do next
      instructions: Ask a willing reader for each version to state where they would go or what they would
        change and when. They may role-play the audiences but should not be coached before answering.
        Compare errors with the factual baseline, revise one problem and repeat the affected question.
        Record whether the issue came from missing facts, unfamiliar language, medium or timing; do not
        equate approval of the wording with successful comprehension.
      checks:
      - Two audience-specific comprehension checks occur
      - Readers explain the action rather than merely rate the prose
      - Errors are traced to a specific communication choice
      - A revision is checked against the same factual baseline
    adaptation: Use translation, captions, audio, plain text or a supported reader. For real notices,
      verify access details with the responsible organizer and recipients. A fictional two-audience test
      demonstrates message design, not live organizational communication.
    review: What changed between the two versions, what had to remain identical, and which adaptation
      actually improved the reader’s next action?
    examples:
      supportive: The visitor could locate the east entrance while the setup volunteer knew to move signs,
        and both retained the same start time.
      mixed: One version was friendlier but omitted the unchanged time, producing a misunderstanding that
        was corrected and retested.
      contradictory: The writer hid a material restriction from one audience or used cultural stereotypes
        to decide what they could understand.
      inconclusive: Two versions used different adjectives but were never tested for distinct audience
        tasks.
  '16.07':
    title: Exchange one piece of actionable feedback and agree how to review it
    goal: Give specific feedback that can guide a change and receive correction without treating it as
      a verdict on personal worth or automatically defending the original approach.
    scope_note: Use an ordinary voluntary work sample or shared task. This is not a disciplinary process,
      performance rating, therapy or feedback to someone who cannot safely decline.
    burden: Ten minutes to prepare, a fifteen-minute exchange and one short follow-up after a revised
      attempt.
    setup: Use a harmless one-page event invitation or similar draft. Ask a willing partner to exchange
      feedback. Each person chooses the feature they want reviewed, such as whether the time and location
      are easy to find, and may decline comments on unrelated personal qualities.
    actions:
    - title: Give an observation linked to the requested outcome
      instructions: 'Inspect the agreed feature and name a specific example: I found the date quickly,
        but I had to reread the paragraph to find the room. Explain the practical effect and offer one
        possible adjustment, such as placing date, time and room together. Ask whether the observation
        fits the author’s intention. Include what should continue, not only what is wrong, and avoid interpreting
        carelessness or ability from one draft.'
      checks:
      - Feedback stays within the agreed feature and sample
      - A specific observation is linked to its practical effect
      - One actionable adjustment and one useful existing feature are named
      - Character and motive judgments are excluded
    - title: Receive one correction with clarification before judgment
      instructions: 'Invite feedback on your own sample and first restate what you heard. Ask for an example
        or the desired outcome when the comment is vague. Distinguish the observation from the suggested
        solution: you may accept that the room is hard to find while choosing a different layout. Record
        what you will try, what you will not change and why, without dismissing the person or pretending
        every suggestion must be adopted.'
      checks:
      - The received feedback is restated before defending the draft
      - Vague comments are clarified with an example or outcome
      - Observation and proposed solution are evaluated separately
      - A reasoned acceptance adaptation or refusal is explicit
    - title: Make one revision and compare the result together
      instructions: Apply the chosen change to a copy and ask the same reviewer to perform the original
        task again, such as finding when and where to attend. Compare the result with the earlier difficulty.
        Agree what should continue, what still needs change and whether another review is useful. Keep
        feedback wording and identities private; a completed exchange does not prove professional competence
        or a permanently safe feedback culture.
      checks:
      - A real revision is made rather than only promised
      - The same practical task is checked again
      - Continue change and next-review decisions are explicit
      - The outcome remains limited to the reviewed sample and exchange
    adaptation: Use asynchronous text, a model comparison or self-review when a partner is unavailable;
      self-review cannot be reported as received interpersonal feedback. In evaluative or power-imbalanced
      settings, follow the formal process and seek appropriate support instead of staging a supposedly
      voluntary exchange.
    review: Which observation led to a concrete revision, and did the second attempt solve the reader’s
      problem rather than merely satisfy the reviewer?
    examples:
      supportive: Both authors identified a usable feature and one confusing detail, revised their drafts
        and checked that the date and room could be found.
      mixed: The feedback was specific but no second attempt occurred, so the proposed improvement remained
        untested.
      contradictory: Criticism became a personality judgment or the receiver was pressured to accept every
        suggestion as proof of humility.
      inconclusive: General praise and criticism were exchanged without an example, adjustment or review
        point.
  '16.08':
    title: Build a persuasive message whose strongest appeal survives a truth check
    goal: Use credibility, feeling, reasons, framing and narrative deliberately without concealing material
      costs, uncertainty or alternatives.
    scope_note: This is an analysis and writing exercise for a harmless proposal. It does not authorize
      manipulation, fabricated evidence, targeted exploitation or claims that rhetorical effectiveness
      establishes truth.
    burden: Twenty minutes to analyze a sample and twenty minutes to write and test a short proposal.
    setup: 'Use this fictional appeal: Everyone who cares about the neighborhood must support our garden;
      imagine children learning outside, and remember that three volunteers already offered help. The
      actual proposal is one trial planting day on an approved site, with a small fixed budget and uncertain
      future maintenance.'
    actions:
    - title: Identify what each part of the appeal asks the audience to trust
      instructions: Mark the credibility appeal, emotional image and stated reason. Identify the frame
        created by everyone who cares, the implied story, any repetition and the effect of the chosen
        medium. Separate the true fictional facts from the unsupported suggestion that opponents do not
        care. Ask what the audience would still need to know about site permission, cost, maintenance
        and alternatives before making a responsible decision.
      checks:
      - Credibility emotion and reasoning are identified separately
      - Framing narrative repetition and medium are examined
      - An unsupported moral pressure claim is distinguished from the stated facts
      - Material missing information is named
    - title: Write an honest one-minute version for a defined audience
      instructions: Address willing residents deciding whether to try the planting day. State the proposal,
        the limited evidence of volunteer interest, a concrete picture of the possible benefit and the
        unresolved maintenance burden. Include the option to decline or choose a smaller trial. Use a
        memorable repeated phrase only if it summarizes the actual proposal, not if it turns uncertainty
        into certainty or paints disagreement as disloyalty.
      checks:
      - The audience and decision are explicit
      - Credibility feeling and reasons support the same bounded proposal
      - Costs uncertainty and alternatives remain visible
      - Repetition does not replace evidence or stigmatize disagreement
    - title: Ask a reader to separate persuasion from grounds for belief
      instructions: Have a willing reader identify the requested decision, strongest reason, emotional
        appeal and largest unresolved issue. Ask which sentence felt persuasive but was not evidence.
        Revise any line that caused them to infer a guarantee, false consensus or hidden obligation. Preserve
        a copy of the original and revised message so you can explain the rhetorical choice and the truth
        boundary it needed.
      checks:
      - The reader distinguishes the requested decision from its appeals
      - A persuasive sentence is checked for unsupported inference
      - A misleading implication is removed or qualified
      - The revision can be explained without claiming persuasion proves truth
    adaptation: Use a written paragraph, audio or accessible presentation. Analyze a public low-stakes
      message rather than manipulating a real audience. Political, commercial or professional communications
      may carry additional rules; this exercise does not determine compliance.
    review: Which rhetorical device made the proposal easier to understand, and which device risked making
      the audience believe more than the evidence supported?
    examples:
      supportive: The writer retained a vivid example but replaced the loyalty test with an explicit trial
        proposal, costs and an honest maintenance uncertainty.
      mixed: The revised message was clear, but the reader still inferred that volunteer interest guaranteed
        long-term staffing, prompting another qualification.
      contradictory: The writer fabricated endorsements, hid a material cost or used shame to make refusal
        socially unsafe.
      inconclusive: Rhetorical terms were labeled without producing or checking a truthful persuasive
        message.
  '16.09':
    title: Deliver a three-minute explanation and improve it from audience evidence
    goal: Structure, rehearse and deliver a short talk, respond honestly to a question and revise a specific
      weakness observed by an audience.
    scope_note: This is a small voluntary presentation, not a public-performance requirement or proof
      of broad speaking confidence. The audience may be one willing person.
    burden: Twenty minutes to prepare, two three-minute rehearsals, a short delivery and a ten-minute
      revision.
    setup: 'Default topic: how a shared borrowing shelf works. The audience needs to know where items
      go, how returns are recorded and whom to ask about a missing item. Use no more than one page or
      three simple slides, with essential information available as text or spoken description.'
    actions:
    - title: Build a talk around one audience action
      instructions: 'Write the sentence you want the audience to be able to act on: Borrow freely within
        the agreed rules and return items to the labeled shelf. Organize three parts—why the system exists,
        the borrowing and return sequence, and what to do when something is missing. Add one concrete
        example and remove facts that do not serve this purpose. Plan an opening and a closing rather
        than reading a list until time runs out.'
      checks:
      - One intended audience action guides the structure
      - The talk has a clear opening sequence and closing
      - A concrete example explains the process
      - Unnecessary material is removed rather than spoken faster
    - title: Rehearse timing access and a likely interruption
      instructions: Deliver the talk twice to an empty room, recording only if you choose and can keep
        it private. On the first pass, check whether the sequence fits roughly three minutes without rushing.
        On the second, practice describing any visual and pausing after a key instruction. Insert the
        sample question What happens if I cannot return it on time? Answer from the agreed rules or state
        what must be checked; do not invent a policy to appear composed.
      checks:
      - Two actual rehearsals occur
      - Timing is adjusted by editing rather than rushing
      - Visual information is also conveyed accessibly
      - An uncertain question receives an honest check-needed response
    - title: Deliver to a willing audience and revise one observed problem
      instructions: Give the talk to a willing person or small group and invite one question. Ask them
        afterward to explain the borrowing sequence and missing-item route. Use their actual response
        to identify one unclear transition, omitted fact or pacing issue, then revise and redeliver that
        section. Audience politeness or your own reduced nervousness is not sufficient evidence that the
        instructions were understood.
      checks:
      - A willing audience hears the actual talk
      - A question is handled without inventing information
      - Comprehension is checked through the audience’s explanation
      - One observed weakness is revised and redelivered
    adaptation: Use seated delivery, captions, AAC, a recorded or asynchronous talk and additional processing
      time. No eye-contact quota or memorization requirement applies. A solo rehearsal remains preparation
      when no audience is available.
    review: What did the audience actually misunderstand, and how did your revision change the explanation
      rather than merely make you feel more polished?
    examples:
      supportive: The audience understood borrowing but missed the late-return route, so the speaker added
        that step and successfully retested the explanation.
      mixed: Timing improved in rehearsal, but no audience delivery occurred and audience response remained
        untested.
      contradictory: The speaker hid uncertainty with an invented rule or required an unwilling person
        to serve as an audience.
      inconclusive: Slides were completed but the talk was never spoken or checked for comprehension.
  '16.10':
    title: Tell a small story that a listener can accurately retell
    goal: Use sequence, a concrete character, tension, an example and a resolution to make a point understandable
      without distorting the underlying facts.
    scope_note: Use a fictional or permission-safe story. Memorability does not justify exposing someone’s
      private experience, inventing a real event or treating an analogy as proof.
    burden: Fifteen minutes to draft, five minutes to tell and retell, and ten minutes to revise.
    setup: Use the fictional story of a volunteer who keeps arriving at the wrong room because an old
      sign was never removed. The intended point is that changing a plan includes retiring the old instructions,
      not merely adding new ones. No real person’s embarrassing incident is needed.
    actions:
    - title: Build a causal sequence rather than a collection of details
      instructions: 'Write five short beats: the volunteer’s goal, the old sign they follow, the mismatch
        they encounter, the discovery that two instructions coexist and the correction that removes the
        obsolete sign. Give the character a reasonable aim and make the tension arise from the situation
        rather than incompetence. Include only details that help explain why the problem happened and
        what changed.'
      checks:
      - The story has a goal obstacle discovery correction and result
      - Events are linked by a clear cause or decision
      - The character is treated fairly rather than used for ridicule
      - Decorative details do not hide the essential sequence
    - title: Add one analogy and mark where it stops working
      instructions: 'Explain the point with a simple analogy, such as leaving two different maps at the
        entrance. State the useful similarity—conflicting directions—and the limit: not every confusing
        interaction is caused by outdated instructions. Tell the story in about two minutes with a clear
        resolution and no claim that one example proves a universal rule. Make its fictional status clear
        before the listener interprets it as a real report.'
      checks:
      - One analogy supports the intended point
      - The analogy’s limit is stated explicitly
      - The story reaches a resolution linked to the original problem
      - Fictional status and limits of one example are clear
    - title: Use the retelling to repair the story
      instructions: Ask a willing listener to retell what happened and the lesson in their own words,
        without supplying the answer first. Note whether they remembered the causal problem or only an
        amusing detail. Correct any factual distortion, shorten a distracting passage or strengthen the
        missing transition, then tell the revised section. If working alone, use a delayed self-retelling
        and label it as a weaker check than another person’s understanding.
      checks:
      - The listener retells before receiving the intended answer
      - Remembered details are compared with the essential causal point
      - A specific distortion or omission guides the revision
      - Self-retelling is distinguished from listener evidence
    adaptation: Use pictures, text, signed storytelling or audio. A short factual sequence may be more
      suitable than a dramatic narrative in some contexts. Do not use trauma, confidential work or another
      person’s identity to make the story more compelling.
    review: What did the listener retain, and did the memorable part carry the intended meaning or distract
      from it?
    examples:
      supportive: The listener retold the conflicting-sign problem and the need to remove obsolete instructions,
        while recognizing the analogy’s limit.
      mixed: The listener remembered the volunteer but not why the error recurred, so the causal link
        was made more explicit.
      contradictory: A real person’s private mistake was exposed for humor or a fictional story was presented
        as evidence that an event occurred.
      inconclusive: A polished story was written without any retelling or check of the essential message.
  '16.11':
    title: Negotiate a small shared arrangement with a genuine walk-away option
    goal: Identify interests, constraints, alternatives and fair trades before proposing an agreement,
      and distinguish a principled refusal from reactive bargaining.
    scope_note: Use a low-stakes voluntary arrangement, not legal settlement, employment leverage, essential
      care, housing, debt collection or a power-imbalanced dispute.
    burden: Fifteen minutes to prepare, a fifteen-minute conversation or role-play and a ten-minute written
      recap.
    setup: 'Default case: two friends want to share a hobby space for two hours; one needs quiet preparation
      time and the other wants company while working. Each has the option to work separately. Use a real
      willing discussion or assign the fictional roles without money or binding commitments.'
    actions:
    - title: Separate positions from interests and alternatives
      instructions: Write your preferred arrangement, the need behind it, actual time or access constraints
        and what you will do if no agreement is reached. Imagine at least two possible interests on the
        other side but keep them tentative until asked. Identify a fair reference such as equal usable
        time or alternating the preferred period, and name any leverage you should not exploit, including
        dependency or private information. Set a walk-away condition before the discussion.
      checks:
      - Position interest constraint and alternative are separate
      - The other person’s interests remain hypotheses until checked
      - A fair reference and an unacceptable leverage tactic are named
      - A genuine walk-away condition exists before bargaining
    - title: Ask, propose a trade and preserve the option to decline
      instructions: Ask what matters most to the other person and reflect it back. Offer a specific package,
        such as thirty minutes of quiet preparation followed by ninety minutes of shared work, with an
        agreed signal for interruptions. Explain what each person gains and gives up. Invite a counterproposal
        and consider a second package rather than splitting every issue mechanically. Do not imply that
        friendship requires accepting your terms.
      checks:
      - The other person’s stated interests inform the proposal
      - The package specifies time conditions and responsibilities
      - Gains and concessions on both sides are explicit
      - A counterproposal or refusal remains socially safe
    - title: Confirm the agreement or carry out the principled refusal
      instructions: Summarize the selected arrangement, who does what, when it starts and how either person
        can request a change. Ask the other person to confirm the same understanding. If the walk-away
        condition is reached, state the reason briefly and use the prepared alternative without punishment
        or last-minute pressure. Review whether the outcome addressed the interests better than the initial
        positional demand, while keeping any untested future performance visible.
      checks:
      - The final terms or refusal are stated unambiguously
      - Both people understand responsibilities and change conditions
      - A refusal uses the alternative without retaliation
      - Agreement quality is distinguished from later follow-through
    adaptation: Use written proposals, more processing time or a neutral facilitator for a safe voluntary
      case. Where rights, livelihood, legal obligations or coercion are involved, use qualified advice
      and the appropriate formal process instead of this exercise.
    review: Which trade addressed the real interests, and what did your walk-away option prevent you from
      agreeing to merely to end discomfort?
    examples:
      supportive: The friends agreed on quiet preparation followed by shared work and both could explain
        the interruption rule and review point.
      mixed: A package was accepted, but one person’s constraint was still unclear, so the agreement remained
        provisional.
      contradictory: The negotiator used guilt, confidential information or dependency to make refusal
        costly.
      inconclusive: The conversation ended with a vague compromise but no terms, responsibilities or alternative.
  '16.12':
    title: Make one ordinary disagreement safer and more specific
    goal: Interrupt escalation, identify the actual disputed issue, own your contribution and agree a
      bounded next step or a clear safe ending.
    scope_note: Use a willing low-stakes disagreement or fictional rehearsal. Abuse, threats, retaliation
      and coercive control are not mutual communication problems to solve through this exercise.
    burden: Ten minutes to prepare, a fifteen-minute conversation or rehearsal and a brief follow-up at
      the agreed time.
    setup: 'Default disagreement: two people each believed the other would book a meeting room. The room
      is unavailable and both are frustrated. Prepare a pause-and-return phrase, a neutral event description
      and one action you can take without requiring the other person to admit fault.'
    actions:
    - title: Lower the interaction’s intensity without abandoning the issue
      instructions: Name your own early escalation cue, such as speaking faster or repeating an accusation.
        Use a short pause, changed medium or agreed later time if needed, and state when you will return.
        Describe the shared problem as the room was not booked rather than you never take responsibility.
        Check whether both people are willing and safe to continue; a refusal or threat changes the task
        to ending the exchange and seeking appropriate support.
      checks:
      - Your own escalation cue is identified
      - Any pause includes a clear return or ending condition
      - The issue is described without global blame
      - Willingness and safety are checked before continuing
    - title: Clarify the mismatch and own a specific contribution
      instructions: Ask what each person understood about the booking responsibility and when that understanding
        arose. Separate the missed room from questions of respect or reliability that may need another
        conversation. State your own concrete contribution, such as not confirming the owner, without
        taking responsibility for everything or demanding an equal confession. Reflect one point the other
        person reports before proposing a solution.
      checks:
      - Each person’s understanding of the task is elicited
      - The immediate issue is separated from broader character claims
      - Your contribution is specific and proportionate
      - The other account is reflected before a solution is proposed
    - title: Agree a next action and test the repaired process
      instructions: Choose an immediate remedy within both people’s authority, such as finding another
        room or rescheduling, and define a future booking owner with a confirmation deadline. Confirm
        who will send the acknowledgment and when you will check it. If no safe agreement is possible,
        end with a clear boundary rather than an endless argument. At the next booking, verify whether
        the confirmation occurred; a calm conversation alone is not evidence that the process changed.
      checks:
      - The next action has an owner and a time
      - Future responsibility includes a confirmation mechanism
      - An unresolved conflict can end with a safe explicit boundary
      - Follow-through is checked separately from reduced tension
    adaptation: Use writing, accessible communication, a smaller issue or an agreed neutral mediator.
      Do not require direct confrontation with an unsafe person or use a pause as silent punishment. Formal
      workplace, legal or safeguarding processes may take priority.
    review: What became more specific or safer, and did the agreed next step reduce the original ambiguity
      rather than merely stop the argument?
    examples:
      supportive: The pair identified an unconfirmed assumption, assigned the next booking and later verified
        the acknowledgment without settling every broader concern.
      mixed: The conversation became calmer but the new owner was never named, leaving the original failure
        mode intact.
      contradictory: The exercise pressured someone to share blame for abuse or treated a threat as a
        cue to communicate more skillfully.
      inconclusive: Both people apologized generally without clarifying the issue or taking a next action.
  '16.13':
    title: Use one small moment of playfulness without making someone the joke
    goal: Offer warmth or lightness that leaves others free not to laugh, and respond to the actual effect
      rather than performing for approval.
    scope_note: Humor is optional and culturally contextual. This is not a requirement to entertain, tolerate
      ridicule or use jokes in grief, danger or an unwelcome setting.
    burden: Ten minutes to prepare, one natural low-stakes opportunity and five minutes to review.
    setup: 'Choose a familiar willing social setting, such as a hobby session. Prepare a harmless observation
      about the shared task, not a person’s body, identity, mistake, insecurity or private life. Default
      example: when arranging an overcomplicated board-game setup, lightly call the instruction pile the
      evening’s first puzzle.'
    actions:
    - title: Check the target, timing and cost of the joke
      instructions: Write the intended light moment and identify who or what bears its cost. Prefer a
        shared harmless situation or your own small non-sensitive mishap, without turning self-deprecation
        into an invitation for reassurance. Ask whether the setting allows play, whether someone is currently
        distressed and whether the line would still be acceptable if nobody laughed. Remove any dependence
        on humiliation, insider exclusion or a person’s inability to object.
      checks:
      - The joke’s target and possible social cost are explicit
      - Timing and the current emotional setting are considered
      - No private vulnerability or identity becomes the price of humor
      - The line remains acceptable without laughter or reassurance
    - title: Offer it once and leave space for the response
      instructions: At a natural welcome moment, use the brief observation or choose a simple warm acknowledgment
        instead. Do not interrupt someone’s serious point to deliver it, explain why it is funny or repeat
        it to force a reaction. Attend to the actual verbal response and context, while keeping nonverbal
        interpretations tentative. If it does not land, return to the activity without making the group
        responsible for rescuing your performance.
      checks:
      - The moment fits rather than interrupts the interaction
      - The playful comment is offered once without pressure
      - The actual response is observed without mind-reading
      - A quiet or neutral response can be accepted gracefully
    - title: Repair a mismatch and retain what supported connection
      instructions: Review whether the moment added ease, excluded someone or distracted from the task.
        If someone says it hurt or was unwelcome, acknowledge the impact, stop the line and make a brief
        sincere repair without insisting that it was only a joke. Identify one warmth behavior independent
        of humor, such as remembering a preference or making space to join, and use it at the next ordinary
        opportunity.
      checks:
      - Connection exclusion and distraction are reviewed separately
      - Reported discomfort leads to stopping and a proportionate repair
      - Intent is not used to erase the actual effect
      - A nonperformative warmth action is identified and attempted
    adaptation: Warmth can be quiet, written, practical or nonverbal; no quick wit or extroversion is
      required. Avoid humor as a test of cultural belonging, emotional resilience or willingness to accept
      disrespect.
    review: Did the moment make participation easier for others, and could you remain socially present
      when it did not produce the response you hoped for?
    examples:
      supportive: A brief shared-task joke brought a smile, and the participant returned to including
        others without extending the performance.
      mixed: The comment was neutral rather than funny, but the participant accepted that and contributed
        warmth through a helpful invitation.
      contradictory: A person’s insecurity became the joke or an objection was dismissed as being unable
        to take humor.
      inconclusive: Jokes were collected online without an actual context check or a response review.
  '16.14':
    title: Prepare for an unfamiliar meeting as a considerate guest
    goal: Use greeting, timing, appearance, manners and attention to show respect for a setting without
      treating one class-coded or cultural style as universal superiority.
    scope_note: This is contextual courtesy, not a judgment of attractiveness, wealth, accent or social
      rank. Necessary access supports and personal dignity take priority over unexamined conventions.
    burden: Fifteen minutes to prepare, one ordinary meeting or visit and a five-minute follow-up.
    setup: 'Default setting: attending a community workshop for the first time. Use the invitation or
      organizer’s information to check arrival time, location, practical clothing needs, participation
      expectations and access arrangements. Do not buy new clothing or invent a formal dress code when
      none is stated.'
    actions:
    - title: Distinguish stated requirements from assumptions
      instructions: Read the actual invitation and note the start time, arrival route, what to bring and
        any practical safety or clothing requirement. Separate these from your guesses about formality,
        greetings or status. Verify one uncertainty with the organizer when it matters, such as whether
        late arrival disrupts the session. Plan transport and a modest arrival buffer, with a notification
        route if a delay occurs.
      checks:
      - The invitation’s actual requirements are identified
      - Assumed formality is not presented as a rule
      - One consequential uncertainty is checked when needed
      - Arrival and delay notification are planned realistically
    - title: Enter and participate with attention to the host’s work
      instructions: Use a greeting and introduction appropriate to the setting, follow the host’s direction
        about seating or materials and ask before taking photos or sharing others’ contact information.
        Keep optional device use from displacing attention while preserving access needs. Make room for
        other participants and handle shared resources as instructed. No handshake, eye contact or particular
        accent is required to demonstrate courtesy.
      checks:
      - Greeting and introduction fit the actual setting
      - Shared-space and resource instructions are followed
      - Photography and personal-information sharing require permission
      - Respect is not equated with one bodily or cultural convention
    - title: Close responsibly and check one assumption
      instructions: Thank the host for something specific, return shared items and fulfill any small commitment
        you made. If you arrived late or caused inconvenience, acknowledge the concrete effect and repair
        what is within your control. Afterward compare one initial assumption with what the setting actually
        required. Record considerate actions and remaining uncertainty rather than rating your social
        impression from imagined judgments.
      checks:
      - The interaction ends with specific acknowledgment and returned resources
      - A small commitment or inconvenience receives follow-through
      - One assumption is compared with the observed context
      - Imagined approval is not used as the evidence of courtesy
    adaptation: Use a written introduction, interpreter, support person, sensory accommodations or advance
      access request. Courtesy includes receiving accommodations without shame and respecting another
      person’s limits. A fictional visit plan is preparation, not evidence of a considerate actual interaction.
    review: Which preparation reduced a real burden on the host or participants, and which convention
      did you discover was only an assumption?
    examples:
      supportive: The visitor verified the practical clothing requirement, arrived with the needed materials
        and returned the borrowed items without assuming a formal dress standard.
      mixed: The greeting went well, but an unannounced delay disrupted the host and prompted a concrete
        apology and better notification plan.
      contradictory: A person’s disability support, accent or inexpensive clothing was treated as evidence
        of poor manners.
      inconclusive: The participant focused on looking impressive but ignored timing, shared resources
        and follow-through.
  '16.15':
    title: Respond to a pressure tactic without diagnosing the person using it
    goal: Recognize observable pressure, separate it from ordinary disagreement and choose verification,
      a boundary, support or distance appropriate to the risk.
    scope_note: This is literacy and safe response rehearsal, not a diagnostic checklist or a requirement
      to confront an abusive person. One phrase alone cannot establish a whole relationship pattern.
    burden: Twenty minutes to examine fictional examples, ten minutes to rehearse a response and ten minutes
      to verify support routes.
    setup: 'Use seven fictional pressure statements: After all I did, you owe me; You will regret saying
      no; That never happened despite the saved agreement; You are perfect, now commit immediately; Decide
      in five minutes or lose everything; Everyone else says you are the problem; I gave you a gift so
      you must agree. Do not collect private evidence about a real person for this exercise.'
    actions:
    - title: Identify the pressure mechanism and the missing information
      instructions: 'For each statement, identify the possible mechanism: guilt, intimidation, reality
        denial, intense praise tied to commitment, false urgency, triangulation or exploitative reciprocity.
        Describe the observable demand and what makes refusal harder. Then state what remains unknown,
        including context, repetition and whether the person can safely decline. Distinguish a genuine
        deadline or mistaken memory from a conclusion of manipulation; look for evidence and effects rather
        than applying a label as a weapon.'
      checks:
      - All seven pressure mechanisms receive a concrete example
      - The demand and cost of refusal are identified
      - Context pattern and safety remain explicit unknowns
      - Ordinary error or a real deadline is not automatically called abuse
    - title: Rehearse a response to the safest low-stakes example
      instructions: 'Choose the gift-obligation example for a harmless rehearsal. Say: I appreciate the
        gift, but I did not agree to that commitment; I will decide separately. Practice asking for the
        actual terms or taking time to verify them through an independent source. Repeat with the other
        person declining to clarify, and choose a controlled next action such as not committing rather
        than escalating into an accusation or a debate over their character.'
      checks:
      - A low-stakes example is selected rather than a dangerous confrontation
      - The response separates gratitude from an unagreed obligation
      - Clarification or independent verification is requested
      - Refused clarification leads to a controllable decision rather than escalation
    - title: Create a support route for patterns that exceed the rehearsal
      instructions: Identify an appropriate trusted, organizational or specialist support route for threats,
        isolation, coercion, stalking or repeated reality-undermining behavior. Verify how to contact
        it safely in your location and consider whether a monitored device makes written planning risky.
        Record only that the route is available, not sensitive allegations in the application. Immediate
        danger takes priority over gathering more examples; a person does not need a perfect label before
        seeking help.
      checks:
      - Higher-risk patterns are routed beyond ordinary communication practice
      - The support route is verified for the actual location
      - Device monitoring and safe record-keeping are considered
      - Help is not delayed until a diagnostic label or complete case is assembled
    adaptation: Use fictional cases only when real relationship material would be unsafe or overwhelming.
      A specialist advocate can help with individualized safety planning; do not surprise an unsafe person
      with a confrontation, threaten exposure or promise that a boundary will end coercion.
    review: What observable pressure did you identify, and did your response protect choice without depending
      on proving the other person’s diagnosis or motive?
    examples:
      supportive: The participant separated a gift from an unagreed demand, rehearsed declining the commitment
        and verified a specialist route for threatening patterns.
      mixed: The examples were recognized, but the first response used an accusation rather than a controllable
        decision and was revised.
      contradictory: A checklist was used to diagnose someone, justify surveillance or force a confrontation
        in an unsafe relationship.
      inconclusive: Terms such as gaslighting were memorized without identifying a demand, uncertainty
        or safe response.
  '16.16':
    title: Clarify an indirect answer without forcing a public yes or no
    goal: Interpret implication, timing, silence, hierarchy and relational context cautiously while making
      room for disagreement or refusal that preserves dignity.
    scope_note: This does not assign a communication style to a nationality or diagnose hidden meaning.
      Indirectness and directness are both context-dependent tools, not ranks of honesty.
    burden: Fifteen minutes for a fictional case and one brief welcome clarification or rehearsal.
    setup: 'Fictional case: after you propose a group event, an experienced member says That may be difficult,
      then changes the subject. The event is optional and no urgent decision is needed. Prepare two interpretations
      and a private, low-pressure way to ask what decision or constraint needs clarification.'
    actions:
    - title: List plausible meanings and the context that could distinguish them
      instructions: Consider that the answer may express a practical obstacle, a polite refusal, uncertainty,
        a wish to consult others or simply limited time to discuss it. Note who was present, whether the
        person had authority, the timing and what relationship expectations may matter. Do not infer agreement
        from silence or refusal from one phrase alone. Identify what you actually need to know to proceed
        rather than trying to decode the person’s whole inner state.
      checks:
      - Several meanings remain plausible rather than one hidden answer
      - Timing audience hierarchy and relationship are considered
      - Silence and implication are not treated as automatic consent
      - The needed practical clarification is narrower than mind-reading
    - title: Offer a private clarification with a genuine refusal route
      instructions: When welcome, say something like I heard that the plan may be difficult; should I
        pause it, change a practical detail or leave it aside? Make clear that declining is acceptable
        and that an immediate answer is not required. Use a respectful medium and timing for the actual
        person, not a stereotype. If asking in public would create pressure, choose an appropriate private
        route or defer.
      checks:
      - The clarification presents more than a forced yes-or-no choice
      - Declining and taking time are both legitimate options
      - Medium and privacy reduce avoidable social pressure
      - The wording is adapted to the person rather than a cultural caricature
    - title: Act on what was clarified and preserve what was not
      instructions: Record whether the person asked to pause, revise, decline or leave the matter uncertain.
        Confirm only the practical next step and avoid publicly explaining their private reasons. If there
        is no answer, do not advertise agreement or proceed on their behalf; choose a reversible action
        or wait as appropriate. Compare the outcome with your original interpretations and note how respect
        and clarity were both preserved.
      checks:
      - The actual disposition governs the next step
      - Private reasons are not repeated without permission
      - No answer is not converted into authorization
      - Original interpretations are revised from the clarified information
    adaptation: Use written options, translation, a trusted mutually agreed intermediary or more processing
      time. In legal, medical, sexual or other consent-sensitive situations, required explicit consent
      and qualified communication processes take priority over interpreting indirect signals.
    review: How did the clarification make the practical decision clearer without making the person pay
      a public social cost for disagreeing?
    examples:
      supportive: The member privately explained a scheduling conflict, and the organizer paused the proposal
        without announcing that the person had approved it.
      mixed: The person remained uncertain, so the organizer preserved that status rather than treating
        politeness as a commitment.
      contradictory: Silence was treated as consent or the person was publicly cornered into rejecting
        the proposal.
      inconclusive: A cultural rule was used to decode the phrase without any contextual check.
  '16.17':
    title: Adapt one communication norm while keeping an important boundary intact
    goal: Communicate across differing norms of directness, hierarchy, turn-taking, emotion, time, privacy
      and formality without falsifying your position or demanding assimilation.
    scope_note: Use an actual willing cross-context exchange or a fictional comparison. Do not treat a
      person as a representative of an entire culture or make them responsible for educating you.
    burden: Fifteen minutes to compare contexts, one short exchange and ten minutes to review what changed.
    setup: 'Default comparison: a casual peer group plans by quick informal messages, while a community
      committee prefers an agenda and time to consult before agreeing. The same proposal is a one-hour
      volunteer orientation. Your fixed boundary is that attendance remains voluntary and no private contact
      details are shared without permission.'
    actions:
    - title: Compare the interaction norms without ranking the people
      instructions: For each context, note what you know about directness, decision authority, turn-taking,
        emotional expression, timing, privacy and formality. Mark unknowns and check the most consequential
        one through a public guide, organizer or willing participant. Distinguish observed local practice
        from a claim about a whole nationality or age group. Identify the core facts and ethical boundary
        that must remain unchanged across versions.
      checks:
      - Seven communication dimensions are considered explicitly
      - Observed norms are separated from group stereotypes
      - A consequential unknown is checked respectfully
      - Core facts and a nonnegotiable ethical boundary are fixed
    - title: Communicate the same proposal in the context’s workable form
      instructions: Prepare a brief peer-group message and a committee version with the decision requested,
        agenda context and consultation time. Adjust greeting, level of detail and turn-taking expectations
        without inventing endorsement or hiding that attendance is optional. In a real willing exchange,
        use the appropriate version and ask whether the format gives people what they need to respond.
        Do not copy an accent or perform an identity as a substitute for respectful adaptation.
      checks:
      - The same substantive proposal appears in both versions
      - Form timing and detail are adapted to the decision process
      - Voluntary participation and privacy remain unchanged
      - The actual recipient can comment on the communication format
    - title: Review effectiveness, integrity and the cost of adaptation
      instructions: Compare what the recipient understood with your intended proposal. Name exactly what
        you changed, what boundary you retained and whether the adaptation imposed excessive effort or
        concealed disagreement. Revise one practical mismatch, such as allowing a longer response window,
        while retaining the person’s right to decline. A fictional comparison demonstrates design reasoning
        only, not successful cross-cultural participation.
      checks:
      - Understanding is checked rather than inferred from politeness
      - Changed features and retained boundaries are named separately
      - The effort and possible concealment costs are considered
      - A practical mismatch is revised without erasing integrity
    adaptation: Use interpreters, written follow-up or a mutually acceptable facilitator. Code-switching
      may be burdensome and is not an obligation to hide identity or tolerate discrimination. If the setting
      demands harmful concealment or coercion, seek support or another route rather than perfecting the
      performance.
    review: Which adaptation improved mutual understanding, and where would further adaptation have crossed
      from flexibility into dishonesty or self-erasure?
    examples:
      supportive: The committee received a clear agenda item with consultation time while the peer group
        received a short message; both understood the voluntary nature of the orientation.
      mixed: The format fit better, but the writer initially concealed a disagreement to appear polite
        and later stated it respectfully.
      contradictory: A person’s culture was caricatured or adaptation was used to hide a material condition
        from the audience.
      inconclusive: Different greetings were used without examining authority, privacy, timing or actual
        comprehension.
  '16.18':
    title: Remove one communication barrier and check that participation became possible
    goal: Choose an accommodation with the participant, provide essential information in a usable form
      and verify that the person can contribute rather than merely receive material.
    scope_note: Do not simulate another person’s disability or assume an accommodation from a diagnosis.
      High-stakes interpretation and regulated accessibility duties require appropriate qualified services
      and local requirements.
    burden: Twenty minutes to prepare accessible material, one short voluntary participation check and
      ten minutes to correct a barrier.
    setup: Use a low-stakes meeting invitation or a five-minute activity explanation. Ask a willing participant
      what format or support would help, without asking for a diagnosis. Available options may include
      plain language, captions, an interpreter, AAC, text, audio, advance materials or written follow-up;
      use what is actually requested and feasible.
    actions:
    - title: Identify the task and ask about the barrier privately
      instructions: State what the person needs to be able to do, such as understand the meeting choice
        and express a preference. Ask which communication format or support works for them and whether
        they want time or material in advance. Consider language, hearing, vision, processing, speech
        and connection constraints without assigning a deficit. Confirm privacy and any interpreter or
        helper role; do not automatically use a relative or child for sensitive interpretation.
      checks:
      - The intended participation task is concrete
      - The person’s preference guides the accommodation
      - No diagnosis or unnecessary personal information is demanded
      - Privacy and the helper or interpreter role are agreed
    - title: Provide the information in the agreed usable form
      instructions: Rewrite the invitation with the decision, date, location, cost if any and response
        route together. Supply text rather than only a screenshot, describe essential visuals, and arrange
        requested captioning or interpretation through a suitable service. Give interpreters or captioners
        relevant non-sensitive terms in advance when appropriate. Check that the person can access the
        material on their actual device or format; a file existing somewhere is not the same as usable
        access.
      checks:
      - Essential facts are grouped in clear language
      - Information is not restricted to an inaccessible image or channel
      - Requested support is actually arranged rather than merely offered
      - Access is checked in the person’s intended format
    - title: Check understanding and contribution without testing the person’s worth
      instructions: Ask the participant to use the information for the real task, such as choosing an
        option or asking a question, with the agreed support. Frame any misunderstanding as a chance to
        improve the communication, not an exam of the person. Correct one barrier and repeat the affected
        part. Confirm that they can decline, disagree or propose another option, and record only the barrier
        reduced and what remains unresolved.
      checks:
      - The participant can act or contribute using the material
      - The check evaluates communication rather than personal ability
      - A barrier is corrected and the affected part is retried
      - Disagreement refusal and unresolved access needs remain legitimate
    adaptation: A self-audit using accessibility guidance can identify likely issues when no participant
      is available, but it cannot establish that another person participated meaningfully. Use qualified
      interpreters and required services for medical, legal or other high-stakes communication; do not
      substitute unverified machine translation for those obligations.
    review: What could the person actually do after the change that was difficult before, and what evidence
      came from their participation rather than your assumption that the material was accessible?
    examples:
      supportive: A text version and additional response time let the participant compare options and
        disagree with the proposed date, revealing genuine participation rather than passive receipt.
      mixed: Captions were enabled but key names were wrong, so the organizer corrected the terms and
        repeated the relevant explanation.
      contradictory: The organizer guessed a disability, demanded a diagnosis or used an unqualified helper
        for sensitive interpretation.
      inconclusive: An accessible-looking file was created without checking access or giving the person
        a way to contribute.
