schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: 09
exercises:
  '09.01':
    title: Separate what happened from the story attached to it
    goal: Rewrite one disputed situation into observable facts, interpretations and genuine unknowns,
      then obtain one useful clarification.
    scope_note: This practices an evidence distinction in one ordinary disagreement. It does not establish
      another person’s motives, erase feelings or adjudicate abuse.
    burden: Twenty minutes for the record, one brief clarification or rehearsal, and ten minutes to revise
      it.
    setup: 'Use a private page with three columns: observed, interpreted, unknown. Default case: you sent
      a non-urgent message on Tuesday, received no reply by Thursday, felt hurt and concluded that the
      recipient was deliberately ignoring you. No actual recipient is required.'
    actions:
    - title: Sort the claim into its different parts
      instructions: Place the sending date and absence of a reply in observed. Put deliberate ignoring
        in interpreted. Record hurt separately as your reported feeling, not evidence of the other person’s
        intent. List delivery, availability, expectations and reasons in unknown. Underline predictions
        such as they will never reply and conclusions such as this friendship is over; neither becomes
        an observation simply because it feels certain.
      checks:
      - Events and reported feelings are distinguished
      - Motive claims are labeled as interpretations
      - Predictions and conclusions are not listed as facts
      - At least two relevant unknowns remain explicit
    - title: Write competing explanations and a fair question
      instructions: 'Offer two explanations compatible with the same facts, such as an overlooked notification
        and uncertainty about what response was expected. Do not assert that either is true. Write one
        non-accusatory clarification: Did my message reach you, and is there a better time or channel
        for this? For a real safe situation, ask once through an appropriate channel; otherwise rehearse
        the question against the supplied case.'
      checks:
      - Two compatible explanations are considered
      - The question seeks missing information rather than a confession
      - Live clarification and rehearsal are labeled separately
      - Silence is not converted into a confirmed motive
    - title: Revise only what the new evidence supports
      instructions: Add the reply or absence of one without deleting the first record. Move an item out
        of unknown only when new information addresses it. Write a proportionate next action, such as
        waiting until the agreed time, using another channel or adjusting expectations. Preserve unresolved
        hurt and uncertainty rather than demanding either a positive interpretation or a hostile verdict.
      checks:
      - New evidence is appended without rewriting the original
      - Only supported items change category
      - The next action fits the available information
      - Unresolved feelings and unknowns remain visible
    adaptation: Use speech-to-text, symbols or a trusted neutral reader. A fictional dispute tests classification
      and question design, not relationship repair. In threatening, abusive or retaliatory situations,
      use suitable support instead of direct contact.
    review: Which sentence changed category, what justified the change, and what would still be unfair
      to conclude?
    examples:
      supportive: The unanswered message remained a fact while the hostile-motive claim became uncertain;
        a direct clarification produced a specific response-time agreement.
      mixed: The person separated facts and stories but still acted on the original accusation before
        checking an important unknown.
      contradictory: A guessed motive was relabeled objective evidence, or the exercise was used to dismiss
        a credible safety concern.
      inconclusive: Three columns were filled with synonyms for the same accusation and no clarification
        or labeled rehearsal occurred.
  '09.02':
    title: Reconstruct and test an argument before judging its conclusion
    goal: Identify premises, conclusion and inference, test validity separately from truth, and assign
      the burden of supporting each contested premise.
    scope_note: This is an argument-analysis exercise. A valid form does not make premises true, and identifying
      a fallacy does not by itself prove the opposite conclusion.
    burden: Three fifteen-minute passes through the supplied argument pair and one ordinary argument of
      your choice.
    setup: 'Use paper or a text editor. Argument A: All events advertised as free have no costs; this
      event is advertised as free; therefore attending it has no costs. Argument B: Every fully booked
      event has many reservations; this event has many reservations; therefore it is fully booked. These
      are synthetic claims, not factual reports.'
    actions:
    - title: Expose the premises and hidden assumptions
      instructions: Number the premises and underline the conclusion in both arguments. For A, distinguish
        admission price from transport, time and other costs; write the implied meaning of no costs. For
        B, identify whether many reservations means every available place is reserved. Restate each argument
        so a person who disagrees can still recognize it, without strengthening it secretly.
      checks:
      - Premises and conclusion are separately numbered
      - Ambiguous terms receive explicit meanings
      - At least one hidden assumption is exposed
      - The reconstruction does not silently repair the argument
    - title: Test the inference independently of premise truth
      instructions: 'Assume each stated premise is true and ask whether the conclusion could still be
        false. A has a valid all–this–therefore form, but its first premise needs support and is implausibly
        broad. B is invalid: a 100-seat event with 60 reservations supplies a counterexample. State why
        invalid inference differs from a false premise, a contradiction or an unsupported assertion; do
        not substitute a fallacy label for the explanation.'
      checks:
      - Validity is tested while granting the premises
      - The reservation counterexample is worked through
      - Validity and soundness receive separate judgments
      - A fallacy label is accompanied by the failed inference
    - title: Evaluate a real argument with a visible proof burden
      instructions: Choose a low-stakes recommendation such as selecting a meeting venue. Reconstruct
        its premises and conclusion, identify a fact that would test the weakest premise, and check that
        fact or label it unresolved. State who is making each claim and therefore needs to support it.
        Accept, reject or suspend judgment on the conclusion with reasons that address both the inference
        and the evidence.
      checks:
      - One additional argument is reconstructed
      - The weakest factual premise receives a check or explicit unknown
      - The claimant’s burden is not shifted to a critic
      - The final judgment addresses inference and evidence separately
    adaptation: Use a spoken argument, a diagram with arrows or short premise cards. The two supplied
      cases are sufficient for a rehearsal when no suitable live claim exists. Avoid confidential disputes
      and do not treat formal analysis as a substitute for qualified legal or scientific review.
    review: Did you disagree with the conclusion, the premise evidence or the inference—and what would
      repair the weakest part?
    examples:
      supportive: The participant accepted A’s form but rejected its unsupported no-cost premise, then
        supplied a concrete counterexample to B.
      mixed: The conclusion was questioned for a good reason, but a valid inference was incorrectly called
        invalid because a premise was false.
      contradictory: The exercise became a contest of fallacy names, or lack of disproof was treated as
        proof of a contested claim.
      inconclusive: Only agreement or disagreement was recorded, with no premises, counterexample or evidential
        burden.
  '09.03':
    title: Change one decision process after checking for bias
    goal: Identify how a specific decision could be distorted and change the procedure before making the
      choice, rather than merely naming a bias afterward.
    scope_note: The audit identifies plausible vulnerabilities, not a diagnosis that a person or group
      is irrational. One improved process cannot establish that bias has been removed.
    burden: Fifteen minutes to record the initial preference, twenty minutes for counterchecks, and a
      ten-minute decision review.
    setup: Use a reversible choice such as selecting a free community event. Default options are a familiar
      event, an unfamiliar event with a clear schedule, and staying home for needed rest. Write your initial
      preference before comparing them. No purchase or attendance is required for the default analysis.
    actions:
    - title: Name the choice and inspect seven distortion routes
      instructions: 'Write your preferred option and reason. Then check: confirmation—am I seeking only
        support; availability—am I overweighting a vivid recent story; anchoring—did the first estimate
        set the scale; sunk cost—am I protecting past effort; overconfidence—what could I be wrong about;
        tribal reasoning—would the organizer’s identity change my standard; self-serving bias—am I excusing
        costs I would criticize in someone else? Mark a route relevant, unsupported or uncertain, with
        a concrete reason.'
      checks:
      - The initial preference is preserved before the audit
      - All seven routes receive reasoned dispositions
      - A plausible vulnerability is tied to this choice
      - The audit does not label a whole person or group
    - title: Install one countercheck that can change the answer
      instructions: Select the most relevant route and change the method. For confirmation, search specifically
        for a reason the preferred event will not fit. For anchoring, estimate time and access costs before
        rereading the advertisement. For sunk cost, compare only future costs and benefits. Write one
        observation that would reverse the preference, then perform that countercheck using available
        schedules or the supplied synthetic facts.
      checks:
      - One procedural correction matches the identified route
      - A preference-reversing observation is specified in advance
      - The countercheck is actually performed
      - Contrary findings are retained rather than explained away
    - title: Choose using the revised procedure and record the difference
      instructions: Compare the original and revised preference. Either keep or change it, but explain
        which evidence mattered and which uncertainty remains. For a suitable live choice, carry out the
        reversible next step; for the default, clearly label the result a decision rehearsal. Review whether
        the process would judge an out-group organizer or another person’s convenience by the same standard.
      checks:
      - Original and final preferences can be compared
      - The decision explains the role of counterevidence
      - Rehearsal is not reported as real-world follow-through
      - The standard is checked for symmetric application
    adaptation: Use a short spoken checklist or ask a willing person to apply the same criteria without
      knowing your first choice. Keep names and private motives out of the record. Defer high-consequence
      decisions to appropriate expertise rather than relying on a bias checklist.
    review: What changed in how you decided, and would that change still help when the preferred option
      belongs to someone you dislike?
    examples:
      supportive: A sunk-cost concern was identified, future costs were compared without the past effort,
        and the participant selected a smaller commitment.
      mixed: The bias vocabulary was accurate and one contrary fact was found, but the decision procedure
        remained unchanged.
      contradictory: Bias labels were used only against opponents while the participant’s preferred option
        was exempted from scrutiny.
      inconclusive: A list of biases was copied without an initial preference, countercheck or resulting
        decision.
  '09.04':
    title: Audit a source before accepting its headline
    goal: Assess expertise, incentives, methods, sampling, replication and alternative explanations, then
      state a confidence judgment with an explicit limit.
    scope_note: A source audit evaluates a bounded claim. A prestigious author, peer review, a large sample
      or a conflict of interest alone does not settle whether the claim is correct.
    burden: Thirty to forty-five minutes using the synthetic study or one accessible primary report.
    setup: 'Synthetic report: an organizer claims a new meeting format doubles participation. Twelve volunteers
      chose the new format while forty other members kept the old one. Participation was measured by one
      end-of-session question; no prior participation data or independent replication was reported. The
      organizer sells training in the format. Use seven headings: claim, expertise, incentives, method,
      sample, replication, alternatives.'
    actions:
    - title: Trace the exact claim and the author’s position
      instructions: 'Rewrite doubles participation into a measurable statement: twice what behavior, over
        what period, compared with whom? Record what expertise is relevant and what is merely a title.
        Describe the organizer’s financial incentive without assuming dishonesty. For a live report, locate
        the original study or methods rather than relying on a summary; missing provenance remains a finding.'
      checks:
      - The headline becomes a bounded measurable claim
      - Relevant expertise is distinguished from prestige
      - Incentives are disclosed without deciding truth by motive
      - The primary report or its absence is identified
    - title: Examine what the comparison can establish
      instructions: Inspect recruitment, group assignment, measurement, missing observations and the comparison
        condition. In the default, volunteers may already be more willing to participate, the question
        may measure satisfaction rather than behavior, and the groups may have differed beforehand. Ask
        whether another team repeated the result and whether an equally plausible explanation fits. List
        which uncertainties could be resolved by better reporting and which need a different design.
      checks:
      - Sample selection and group comparability are examined
      - The outcome measure is checked against the claim
      - Replication is verified or explicitly absent
      - At least two competing explanations are evaluated
    - title: Issue a calibrated decision rather than a verdict on the author
      instructions: 'Write one of supported for this limited claim, promising but uncertain, unsupported
        as stated, or contradicted, followed by two specific reasons. For the default, do not infer that
        the format is useless: the report does not establish that it caused a doubling. Name the smallest
        additional evidence that would change confidence, such as baseline participation and a comparable
        allocation process. Decide whether to use, seek more information or decline to share the headline.'
      checks:
      - The confidence judgment has claim-specific reasons
      - Failure to establish causation is not treated as proof of no benefit
      - A confidence-changing piece of evidence is named
      - A practical information-use decision follows
    adaptation: Use an accessible summary together with the original methods, a librarian or a willing
      reader. The synthetic report permits full practice without paywalls. Medical, legal and financial
      decisions require suitable qualified interpretation, not this exercise alone.
    review: Which limitation most changes what you may responsibly repeat, and what stronger claim would
      exceed the evidence?
    examples:
      supportive: The participant narrowed the claim to a small self-selected group and withheld the causal
        headline while asking for a better comparison.
      mixed: Expertise and conflicts were checked, but the self-selected sample or outcome definition
        was missed.
      contradictory: A source was accepted because of prestige or rejected solely because the author had
        an incentive.
      inconclusive: The headline was rated trustworthy without tracing the methods, comparison or sample.
  '09.05':
    title: Update a belief without erasing the version you held before
    goal: State confidence, assumptions and a revision condition for one meaningful low-stakes belief,
      then make a proportionate update when new evidence arrives.
    scope_note: This practices accountable uncertainty. Humility does not require treating every claim
      as equally plausible or surrendering well-supported conclusions under social pressure.
    burden: Ten minutes for the initial record, one safe evidence check during the next week, and fifteen
      minutes for the update.
    setup: 'Choose a practical belief such as the local library is always too noisy for reading after
      lunch. Use a private record with initial claim, confidence band, reasons, assumptions, unknowns
      and revision condition. The supplied claim can also be examined with fictional observations: one
      noisy visit, followed by two quiet visits on different days.'
    actions:
    - title: Make the belief and its uncertainty explicit
      instructions: Replace always with a statement you can actually check, such as this branch is usually
        unsuitable for my kind of reading between one and three. Select low, moderate or high confidence
        and explain why. Distinguish one observed visit from assumptions about every weekday, every room
        and every reader. Specify in advance what evidence would increase, decrease or leave confidence
        unchanged.
      checks:
      - The belief has a bounded context
      - Confidence has an evidential reason
      - Assumptions and unknowns are separated
      - A revision condition is recorded before new information
    - title: Seek a fair test instead of a humiliating contest
      instructions: Collect one observation that could disagree with you, such as checking a different
        ordinary day or asking about a designated quiet area. Do not arrange an extreme case just to win.
        In the fictional version, compare the noisy visit with the two later quiet visits and retain the
        different contexts. Listen to disagreement long enough to restate its actual evidence before responding.
      checks:
      - The check could genuinely challenge the belief
      - Context differences remain visible
      - Opposing evidence is restated accurately
      - No person must concede or disclose private experience
    - title: Append an update with an honest change log
      instructions: Keep the first entry intact. Write the new claim, confidence and reason for changing
        or retaining it. In the default, a narrower claim about one room or day may replace always noisy;
        three visits still do not establish every future condition. State what you would now do differently
        and acknowledge the prior view plainly rather than claiming you believed the revised version all
        along.
      checks:
      - The original belief remains readable
      - The update is proportional to the evidence
      - The previous view is acknowledged without self-attack
      - A changed action or remaining test is specified
    adaptation: Use a voice memo, confidence words or a trusted reader instead of percentages. A fictional
      record demonstrates updating mechanics only. Avoid beliefs whose testing would expose anyone to
      danger, discrimination or coerced disclosure.
    review: What exactly changed your confidence, and how would someone distinguish your update from merely
      agreeing with the last person who spoke?
    examples:
      supportive: The participant retained the original claim, narrowed it after conflicting observations
        and tried the quiet room rather than declaring the library universally suitable.
      mixed: The revised conclusion fit the evidence, but the original confidence or assumption record
        was overwritten.
      contradictory: Social pressure was called evidence, or humility was used to demand equal confidence
        in unsupported and well-supported claims.
      inconclusive: The person said I could be wrong but named no assumption, revision condition or actual
        update.
  '09.06':
    title: Make bounded forecasts and review how they resolved
    goal: Use base rates, probability ranges, scenarios and a simple expected-value comparison, then score
      resolved forecasts without claiming broad calibration from a tiny sample.
    scope_note: This is low-stakes forecasting practice. A few predictions can expose errors but cannot
      establish reliable calibration or justify high-consequence decisions.
    burden: Twenty minutes to prepare three forecasts, brief resolution records across one week, and a
      twenty-minute review.
    setup: 'Default synthetic history: eight of ten comparable meetings began within five minutes of the
      advertised time. Plan three further meetings and predict each on-time outcome before seeing its
      result. For a live version, use only your own ordinary meetings. Keep the supplied outcomes sealed
      or below a page fold: on time, late, on time.'
    actions:
    - title: Set the base rate and write three resolvable predictions
      instructions: Calculate the observed base rate as eight out of ten, or 80 percent, while noting
        that ten meetings are a small and possibly selective sample. Define on time exactly and assign
        a probability or band to each future meeting using any known difference in context. Record what
        observation will settle each forecast and when. A range such as 60–80 percent should express uncertainty,
        not be chosen afterward to fit the result.
      checks:
      - The base rate and its denominator are shown
      - The outcome and resolution time are defined
      - Three forecasts are preserved before resolution
      - Context adjustments and uncertainty are explained
    - title: Compare scenarios and test a decision’s sensitivity
      instructions: For one meeting, suppose arriving early costs five minutes but avoids a fifteen-minute
        disruption if the meeting starts promptly. Under the simplified assumption that the disruption
        is avoided only when it starts promptly, expected avoided disruption is 0.8 times 15, or 12 minutes,
        against five minutes spent. Recalculate at probabilities of 0.3 and 0.9. State what this time-only
        model omits, including access needs and obligations; do not treat expected value as a command.
      checks:
      - At least two alternative probability scenarios are compared
      - The simple expected-value arithmetic is visible
      - The decision’s sensitivity to probability is stated
      - Non-numeric duties and omitted consequences remain explicit
    - title: Resolve the forecasts without rewriting them
      instructions: Record each actual outcome, or label the default sequence a simulation. Compare the
        predicted probabilities with the two on-time outcomes out of three. Optionally compute mean squared
        probability error using (probability minus 1 for on time or 0 for late) squared. Explain that
        a likely event can fail to occur and that three forecasts cannot establish calibration. Choose
        one adjustment to sampling, context or confidence for the next set.
      checks:
      - Every resolved forecast retains its original probability
      - Observed outcomes and simulations are distinguished
      - Probability quality is not reduced to right or wrong alone
      - The next forecasting adjustment follows a specific error
    adaptation: Use frequencies such as eight in ten, a calculator or probability bands. Forecasting the
      supplied synthetic meetings requires no calendar access. Do not apply the exercise to medical prognosis,
      gambling, trading or safety-critical decisions.
    review: Was the largest error caused by a poor base rate, an unjustified context adjustment or unavoidable
      uncertainty?
    examples:
      supportive: The participant preserved three 80-percent forecasts, recorded one late start, and widened
        uncertainty rather than pretending that the likely outcome had been guaranteed.
      mixed: Forecasts were dated and resolved, but the time-cost model ignored an important access requirement.
      contradictory: A high probability was presented as certainty, or probabilities were edited after
        the outcomes were known.
      inconclusive: Only a retrospective success rate was recorded; no prospective probability, definition
        or resolution rule existed.
  '09.07':
    title: Trace one recurring problem through a small causal system
    goal: Map components, handoffs, feedback, delays and incentives, then test one plausible leverage
      point while keeping alternative causes visible.
    scope_note: A causal diagram is a hypothesis about one system, not proof that its arrows are true.
      The exercise does not authorize experiments on unwilling people or essential services.
    burden: Twenty minutes to map a routine, one small authorized change over three opportunities, and
      fifteen minutes to review.
    setup: Use the low-stakes default of a shared meeting agenda that keeps growing. Draw boxes for requests,
      organizer triage, agenda slots, meeting length and unresolved items. Use paper, an accessible diagram
      tool or a spoken sequence. A private simulation is sufficient when you do not control the real process.
    actions:
    - title: Draw the components and the handoffs that matter
      instructions: Connect requests to triage, triage to slots, slots to meeting length, and unresolved
        items back to later requests. Label what moves across each interface and who is authorized to
        decide. Note the delay between a request and a meeting, and an incentive such as rewarding quick
        acceptance of every request. Distinguish observed links from guessed ones with different labels
        rather than drawing every arrow as established fact.
      checks:
      - Components and interfaces have concrete labels
      - At least one delay and one incentive are shown
      - A feedback loop is traced back to its start
      - Observed and hypothesized links are distinguishable
    - title: Predict a leverage point and its possible side effects
      instructions: 'Choose one controllable change, such as requiring each optional agenda request to
        name a decision needed. Predict both the intended effect, fewer unclear items, and a possible
        unintended effect, discouraging legitimate concerns. State what you will observe at the next three
        opportunities: unclear requests, deferred issues and unresolved essential items. Preserve a route
        for urgent or access-related needs; do not optimize meeting length by hiding them.'
      checks:
      - The change targets a named link or incentive
      - An intended effect and an unintended effect are predicted
      - Observations include displaced or delayed work
      - Essential and access-related needs retain a route
    - title: Compare the system response with the diagram
      instructions: Apply the authorized change or walk three synthetic requests through it. Record where
        the predicted effect appeared and where work merely moved elsewhere. Revise at least one arrow,
        delay or boundary if observations contradict it. Decide to keep, alter or remove the change, explicitly
        accounting for downstream burden rather than judging only the visible meeting length.
      checks:
      - Actual operation or simulation is clearly labeled
      - Downstream effects are inspected
      - The model is revised when a link fails
      - The decision considers burden outside the target metric
    adaptation: Describe the loop aloud or use labeled cards instead of a visual diagram. Analyze only
      a process you may observe and change. Use synthetic requests when work, family or organizational
      confidentiality prevents a live test.
    review: Did the intervention remove a cause, shift the burden somewhere else or reveal that the original
      system boundary was too narrow?
    examples:
      supportive: A clearer request rule reduced ambiguous items without hiding urgent concerns, and the
        diagram was revised to include a previously missed triage delay.
      mixed: Meetings shortened, but unresolved work grew outside the agenda and required a revised boundary.
      contradictory: The map blamed one person while ignoring incentives, or essential needs were suppressed
        to improve a metric.
      inconclusive: Boxes and arrows were drawn without a feedback loop, testable prediction or observed
        system response.
  '09.08':
    title: Test competing causes of one recurring low-stakes failure
    goal: Define a repeatable problem, distinguish symptoms from causal hypotheses, change one safe variable
      and verify whether the problem actually improves.
    scope_note: This is a bounded root-cause inquiry. One successful retry does not prove a unique root
      cause, and hazardous, medical or regulated failures require appropriate professionals.
    burden: Fifteen minutes to define the problem, three to five ordinary opportunities for observation,
      and twenty minutes for the comparison.
    setup: 'Default problem: a needed reusable item is often not where you expect it. Use a harmless item
      you control, such as a notebook. Record when it is needed, its expected location and where it was
      actually found. Do not track another person or search their belongings.'
    actions:
    - title: Define the failure and preserve a small baseline
      instructions: 'Describe the problem as notebook unavailable at the chosen work start, not I am disorganized.
        On two ordinary opportunities, note the expected and actual location, the preceding activity and
        the interruption caused. List at least two plausible causes: the return location is unclear, or
        the notebook is needed in two places. Missing observations stay missing; do not reconstruct exact
        details from a general impression.'
      checks:
      - The failure has an observable definition
      - Two baseline opportunities or honest missing data are recorded
      - At least two distinct causal hypotheses are listed
      - Character judgments are not treated as causes
    - title: Choose a discriminating test rather than a convenient fix
      instructions: For the unclear-location hypothesis, place a clearly marked return spot where the
        notebook is usually set down, leaving the work task and item unchanged. Predict what should improve
        if that hypothesis is right and what finding would favor the two-location explanation instead.
        Use three ordinary opportunities and keep the old arrangement reversible. Do not change several
        variables at once and then assign credit to your favorite.
      checks:
      - One variable is changed with authority
      - The competing hypotheses predict different observations
      - The test has a fixed opportunity count
      - The change is reversible and other major changes are noted
    - title: Verify the result and decide what remains unexplained
      instructions: Compare baseline and test opportunities using the same definition of unavailable.
        Note whether the item was easier to find, merely moved to a different inconvenient place, or still
        failed under one recurring condition. Retain, revise or reject the hypothesis and write the next
        smallest test. Improvement counts as a useful observation, not proof that all future failures
        share the same cause.
      checks:
      - Baseline and test use the same outcome definition
      - Displacement and recurring exceptions are retained
      - The causal conclusion matches the strength of evidence
      - A next test or maintenance decision is explicit
    adaptation: Use icons, a tally or an accessible location aid. A tabletop simulation can practice hypothesis
      discrimination but cannot establish an improvement in your routine. Stop where the problem involves
      electricity, machinery, injury, essential care or another person’s privacy.
    review: Which observation distinguished the proposed cause from a plausible alternative, and what
      failure mode remains?
    examples:
      supportive: The marked return spot helped on ordinary days but not when the notebook was used elsewhere,
        leading to a narrower two-location explanation.
      mixed: The item became easier to find, but several simultaneous changes made the cause uncertain.
      contradictory: The exercise blamed someone without evidence or used an unsafe repair as an experiment.
      inconclusive: A solution was announced without a baseline, competing hypothesis or verification
        opportunity.
  '09.09':
    title: Choose between competing goods and name what you give up
    goal: Compare live alternatives across benefits, costs, time, reversibility, risk and affected people,
      then make a choice with an explicit opportunity cost.
    scope_note: The exercise supports one ordinary tradeoff. A scoring table cannot erase duties, convert
      another person’s rights into a price or make incompatible goods simultaneously attainable.
    burden: Twenty minutes to compare options, one reversible next step, and a ten-minute review.
    setup: 'Default: one free two-hour block can be used for a non-urgent home task, a willing friend’s
      shared activity, or recovery time. Use three option cards and seven headings: benefit, direct cost,
      time, risk, reversibility, affected people and best foregone alternative. Protect essential care
      and existing commitments first.'
    actions:
    - title: Separate obligations from optional alternatives
      instructions: List the three options and identify any non-negotiable duty, access need or promise
        that constrains the choice. For each feasible option, fill the seven headings using plain descriptions
        rather than invented precision. Include doing nothing new when rest or maintenance is genuinely
        needed. An unavailable or unaffordable option is not a meaningful alternative merely because it
        sounds attractive.
      checks:
      - At least three feasible alternatives are compared
      - Duties and access constraints are explicit
      - Costs include time and effects on others
      - Unavailable options are not treated as live choices
    - title: Expose the tradeoff that the first preference hides
      instructions: Choose two criteria that pull in different directions, such as connection now versus
        completing a repair before next week. Ask what is reversible and what opportunity expires. Identify
        the best alternative you would forgo, not the sum of every imaginable benefit. Test one changed
        assumption, such as the friend being available next week, and note whether that would change the
        ranking.
      checks:
      - Two conflicting goods are named without dismissing either
      - Reversibility and expiring opportunities are considered
      - Opportunity cost is the best foregone feasible alternative
      - One assumption is varied to test the preference
    - title: Act on the choice and preserve the sacrificed good
      instructions: 'Choose one option with a short reason that includes what you give up. Take its next
        reversible step: begin the task, make the specific invitation or protect the recovery block. Tell
        affected people about a changed commitment when necessary. Afterward, compare the actual benefit
        and cost with your expectation and decide whether the foregone good needs a later place rather
        than pretending it never mattered.'
      checks:
      - The decision names both its reason and its sacrifice
      - A real next step or explicitly labeled rehearsal occurs
      - Affected commitments receive appropriate communication
      - The review retains the value of the foregone option
    adaptation: Use pictures, spoken comparisons or a trusted planning aid. The supplied case can be rehearsed
      without money or another participant. Do not use the exercise for clinical, legal, fiduciary or
      emergency choices that require qualified judgment.
    review: What worthwhile thing did this choice genuinely cost, and was that sacrifice acceptable under
      the actual constraints?
    examples:
      supportive: The person chose recovery after recognizing low capacity, acknowledged the missed social
        opportunity and made a later invitation without calling rest morally superior.
      mixed: The choice was made deliberately, but its effect on an existing promise was discovered only
        afterward.
      contradictory: A preferred option was made to win by ignoring another person’s rights, essential
        needs or an inconvenient cost.
      inconclusive: Alternatives were scored but no sacrifice, changed assumption or next action was identified.
  '09.10':
    title: Choose proportionate safeguards for an ordinary risk
    goal: Assess severity, likelihood, exposure, detectability and control, then choose a safeguard and
      an explicit proceed, change or stop threshold.
    scope_note: The exercise concerns a low-consequence activity you control. It is not a professional
      risk assessment, emergency plan or permission to accept danger on someone else’s behalf.
    burden: Twenty minutes to assess one activity, one safe trial or tabletop rehearsal, and ten minutes
      to review.
    setup: 'Default: carry a stack of lightweight books across a shared room. Consider a blocked view,
      a loose object on the route and a person entering unexpectedly. Use an ordinary empty-handed walk-through
      first. Do not create obstacles, lift heavy loads or test whether someone can tolerate a fall.'
    actions:
    - title: Describe the hazard without collapsing every dimension into a score
      instructions: For each plausible hazard, describe the possible harm, how often exposure occurs,
        whether warning would be visible, and which part you can control. Use words such as minor, significant,
        unlikely or uncertain with a reason; do not multiply arbitrary numbers into false precision. In
        the default, a blocked view is controllable by carrying fewer books, while another person’s movement
        is not fully controllable.
      checks:
      - Hazard and possible harm are distinguished
      - Likelihood and exposure receive separate reasons
      - Detectability and control are considered
      - Uncertainty is not hidden inside an invented precise score
    - title: Select safeguards and a stop condition
      instructions: Compare removing the hazard, changing the method and adding a simple check. For the
        default, clear only obstacles you may move, split the stack so the route remains visible, and
        wait when someone is crossing. State the condition under which you will not proceed, such as an
        uncleared route or a load you cannot comfortably manage. Consider whether a safeguard creates
        another burden, including access barriers for others.
      checks:
      - At least two kinds of safeguard are compared
      - The chosen method reduces a specific exposure
      - An observable stop condition is defined
      - The safeguard is checked for new risks and access barriers
    - title: Test the method without testing the harm
      instructions: Walk the safe route with a comfortable light load or rehearse the sequence with an
        empty box. Observe whether the safeguard can actually be followed and whether an unexpected interruption
        changes the decision. Record proceed, revise or stop and why. A trial without an incident does
        not prove that the risk is zero; retain the stop condition and identify when qualified help would
        be required.
      checks:
      - The trial does not deliberately create a hazard
      - The safeguard’s usability is observed
      - A changed condition can trigger stopping
      - No-incident evidence is not presented as proof of zero risk
    adaptation: Use a seated tabletop route, an accessible handling aid or an empty-handed rehearsal.
      Choose a different low-risk activity when mobility, balance or pain makes carrying unsuitable. Electrical,
      fire, road, chemical, medical and other serious hazards belong to qualified procedures.
    review: Which safeguard changed exposure most, and what observation would make proceeding unreasonable
      despite the plan?
    examples:
      supportive: The participant split the load, kept the route visible and stopped when the path became
        occupied rather than relying on luck.
      mixed: A sensible safeguard was chosen but proved too awkward to use consistently, prompting a simpler
        method.
      contradictory: A dangerous condition was created to test courage, or another person’s safety was
        traded away without their authority.
      inconclusive: A risk score was assigned without a hazard description, usable safeguard or stop threshold.
  '09.11':
    title: Apply one principle differently when the context genuinely changes
    goal: Explain how timing, role, relationship, capability and cultural context affect an action without
      using context as an excuse to abandon the underlying principle.
    scope_note: This is practical-judgment rehearsal with ordinary cases. It does not decide legal exceptions,
      override consent or permit unequal dignity under the label of cultural sensitivity.
    burden: Thirty minutes for the case comparison and ten minutes for an optional low-stakes application.
    setup: 'Use the principle keep people informed when a commitment changes. Case A: you will be ten
      minutes late to meet a friend. Case B: you supervise a shared task and a delay affects several people.
      Case C: a person cannot safely contact someone who has threatened them. Write principle, relevant
      facts, possible action and remaining duty for each.'
    actions:
    - title: Identify the principle and the morally relevant differences
      instructions: 'State the good the principle protects: others should be able to plan rather than
        being left in avoidable uncertainty. Compare timing, authority, relationship, communication access
        and safety in all three cases. Separate relevant differences from irrelevant status judgments.
        A supervisor’s wider responsibility changes the notification task; a threatened person’s safety
        changes whether direct contact is appropriate.'
      checks:
      - The principle’s purpose is stated
      - All three cases receive a context comparison
      - Role and capability are not confused with human worth
      - Safety differences are treated as materially relevant
    - title: Design a proportionate response for each case
      instructions: For A, send a brief updated arrival time and a choice to reschedule. For B, identify
        affected owners, revised dependencies and the next update time. For C, do not require direct contact;
        identify a safe support or authorized intermediary route where appropriate. Explain how language,
        hierarchy or indirect communication may alter the channel while preserving clarity about what
        others need to know.
      checks:
      - Each case receives an executable response
      - The response fits role timing and communication access
      - Cultural adaptation preserves the substantive duty
      - Unsafe direct contact is not required
    - title: Test whether the exception preserves or evades the principle
      instructions: Ask what would happen if someone else in the same relevant circumstances used your
        reasoning. Name the duty that remains after each adaptation, such as correcting an estimate or
        using an appropriate safe route. Apply one response to a real low-stakes commitment change, or
        rehearse the three cases aloud. Record what information the recipient would actually need, not
        whether your explanation sounds sophisticated.
      checks:
      - The reasoning can be applied symmetrically
      - An adapted case still has a stated remaining duty
      - A real application or labeled rehearsal occurs
      - The review checks practical information rather than rhetorical polish
    adaptation: Use role cards, a spoken comparison or an interpreter. Do not assume one culture’s directness
      is universally best. Cases involving threats, safeguarding, employment obligations or law require
      suitable local support beyond this exercise.
    review: Which difference justified a different action, and which proposed exception would merely protect
      your convenience?
    examples:
      supportive: The participant distinguished a simple late-arrival message from a supervisor’s dependency
        update and preserved a safety exception without abandoning responsibility.
      mixed: The cases received different responses, but the remaining duty after an exception was unclear.
      contradictory: Context was used to excuse avoidable harm, demand unsafe contact or treat a lower-status
        person’s needs as unimportant.
      inconclusive: The same slogan was repeated for every case without considering role, access, timing
        or safety.
  '09.12':
    title: Preserve a prospective decision and append its outcome honestly
    goal: Create a private minimum-metadata record before a reversible choice, preserve its original predictions
      and assumptions, and append a later process update.
    scope_note: This enriches the existing decision-record protocol without changing its typed evidence,
      action identities or completion rules. It excludes consequential, regulated, privileged and sensitive
      decisions.
    burden: About thirty to forty-five minutes across a prospective draft, a five-minute preservation
      step and a review within thirty days.
    setup: 'Use a private page or local document and a low-stakes choice not yet made. Default: choose
      between two optional reading sessions, coded A and B. Record only a neutral category, option codes,
      objective, up to three assumptions, a bounded outcome prediction, confidence band, date and review
      trigger. Keep narrative and other people’s details out.'
    actions:
    - title: Draft the record before selecting an option
      instructions: Create the allowed fields while both options are still live. For the default, category
        is reading, objective is one uninterrupted section, assumption A1 is a quiet room is available,
        and the prediction is completed, partly completed or not completed by the review. Add low, medium
        or high confidence with a private reason. Represent a counterargument only as a neutral assumption
        or option code; do not store another person’s words or identity.
      checks:
      - The record exists before the choice
      - Option codes objective and bounded assumptions are present
      - A prediction confidence band and review trigger are recorded
      - The record contains no names secrets or sensitive third-party detail
    - title: Seal the choice-time version and schedule its review
      instructions: When choosing, add the selected code and date. Preserve a read-only copy, dated paper
        copy or other permitted snapshot so later outcome information cannot replace the initial prediction
        and assumptions. Schedule the review trigger within thirty days. Label a genuine clerical correction
        separately; do not rewrite uncertainty, dissent or expectations to make the eventual result look
        foreseeable.
      checks:
      - The chosen option code and decision date are added
      - The original prediction and assumptions remain intact
      - The review trigger is actually scheduled
      - Any mechanical correction is separately labeled
    - title: Append the outcome and one future process change
      instructions: 'At the trigger, add a separate layer with completed, partly completed, not completed
        or unresolved outcome status. Mark each assumption supported, contradicted or unknown and choose
        one process change for the next comparable decision. Compare decision quality with outcome quality:
        a reasonable choice can turn out badly, and a weak process can be lucky. Submit only the application’s
        existing allowlisted observations, never the record’s content.'
      checks:
      - The outcome update is separate from the prospective layer
      - Assumptions receive supported contradicted or unknown dispositions
      - One next process change follows the comparison
      - Artifact contents and identifying details stay outside evidence
    adaptation: Use symbols, voice input transcribed to neutral codes or a trusted planning aid with privacy
      preserved. A wholly synthetic decision rehearses the format but is not evidence of a real prospective
      choice. Defer when no suitable decision remains unresolved or documentation could create risk.
    review: What did the outcome reveal about the process that was knowable at choice time, and what remains
      luck or uncertainty?
    examples:
      supportive: The original moderate-confidence prediction stayed intact, one assumption was contradicted,
        and a separate update changed the next information-gathering step.
      mixed: The record was prospective and private, but the later review mixed process quality with whether
        the outcome felt favorable.
      contradictory: A prediction was rewritten after the result, or private decision content was copied
        into application evidence.
      inconclusive: A past decision was reconstructed from memory and presented as a prospective record.
  '09.13':
    title: Interpret a statistical headline without losing its denominator
    goal: Describe a small distribution, distinguish absolute and relative effects, examine sampling and
      base rates, and state what an apparent association cannot establish.
    scope_note: The numbers are synthetic teaching data. The exercise develops interpretation, not statistical
      certification or permission to make medical, financial or safety decisions from small samples.
    burden: Thirty to forty-five minutes with paper and a basic calculator.
    setup: Two self-selected groups complete a harmless sorting task. Group A times are 8, 9, 10, 11 and
      12 minutes; group B times are 6, 7, 8, 9 and 10. A headline says the new method makes everyone 20
      percent faster. A separate classifier flags 18 items, of which 8 truly need review, from a batch
      of 100 containing 10 true review cases.
    actions:
    - title: Show the distribution and the effect rather than only the headline
      instructions: 'Calculate each group’s mean and median: A is 10 minutes and B is 8. Give the ranges,
        8–12 and 6–10, and note their overlap. The mean difference is two minutes, or 20 percent of A’s
        mean; this does not show that every individual improves by 20 percent. Sketch dots or list the
        values in order, then describe how a truncated axis or omission of spread could exaggerate the
        difference.'
      checks:
      - Both center and spread are reported
      - The absolute and relative differences use the correct denominator
      - Overlapping observations remain visible
      - A misleading presentation choice is identified
    - title: Examine selection, uncertainty and regression toward ordinary performance
      instructions: 'Ask how volunteers chose their group, whether experience differed and whether the
        same task was used. Five non-random observations per group do not settle a population effect or
        causation. Consider a person selected after an unusually slow 12-minute attempt who later takes
        10 minutes: ordinary fluctuation could contribute, so improvement after selection alone does not
        identify a treatment effect. Name what repeated or better-sampled observations would help distinguish.'
      checks:
      - Sampling and group comparability are questioned
      - Small-sample uncertainty is stated without invented precision
      - Correlation is not promoted to causation
      - An extreme-baseline regression explanation is considered
    - title: Check a base-rate claim and rewrite the conclusion
      instructions: For the classifier, compute the true-case base rate as 10 out of 100 and the fraction
        of flags that are true as 8 out of 18, about 44 percent. It detects 8 of the 10 true cases, or
        80 percent, but those are different denominators. Rewrite the sorting headline to report the observed
        two-minute group mean difference and unresolved causes. State what the data support, what they
        do not, and which decision should wait for stronger evidence.
      checks:
      - The base rate uses all 100 items
      - Detection rate and the truth fraction among flags are distinguished
      - The revised headline reports a bounded effect
      - Unsupported individual and causal conclusions are removed
    adaptation: Use counters, a calculator, an accessible table or spoken frequencies. Percentages are
      optional when clear counts convey the same distinction. Ask a qualified analyst to review consequential
      statistics; the supplied examples require no private dataset.
    review: Which denominator or missing comparison most changed the apparent meaning of the headline?
    examples:
      supportive: The participant reported means of 10 and 8, retained overlapping ranges and distinguished
        80-percent detection from roughly 44-percent true flags.
      mixed: The averages were correct, but self-selection or the different classifier denominators were
        missed.
      contradictory: A group average was claimed for every person, or association from a tiny selected
        sample was presented as causal proof.
      inconclusive: The headline was accepted without calculating an effect, examining spread or identifying
        a denominator.
  '09.14':
    title: Design a fair small test and identify what it cannot prove
    goal: Turn a claim into a hypothesis with an observable measure, comparison, confound controls and
      replication plan, then use a safe pilot to improve the design.
    scope_note: A personal pilot tests the feasibility of a design, not a population claim. This exercise
      excludes treatment experiments, deprivation, hazardous tasks and research on other people without
      appropriate consent and oversight.
    burden: Twenty minutes to design a paper-sorting test, two short pilot rounds and fifteen minutes
      to critique it.
    setup: 'Claim: arranging five labeled folders alphabetically makes filing paper slips faster. Use
      five folders or drawn boxes and two matched sets of ten synthetic slips labeled A–E. Compare alphabetical
      layout with your usual layout. Record completion time if useful and count correctly filed slips;
      accuracy matters even when speed improves.'
    actions:
    - title: Specify the hypothesis and the measurement before testing
      instructions: Predict how the layout will affect time and accuracy and define exactly when a round
        starts and ends. Keep the number of slips, labels and instructions the same. Choose a comfortable
        pace, a maximum round length and a stopping condition for strain. List likely confounds such as
        practice on the first round, unequal label difficulty and interruptions; decide which can be controlled
        and which must be recorded.
      checks:
      - The hypothesis predicts a specific observable difference
      - Time and accuracy definitions are fixed in advance
      - The comparison holds major task features constant
      - Likely confounds and a safe stopping rule are identified
    - title: Pilot both conditions while preserving inconvenient observations
      instructions: Use a coin or another fair preselected method to decide which layout comes first.
        Complete one round in each condition and keep mistakes, interruptions and unfinished rounds in
        the record. Do not quietly repeat only a poor result. Note whether the measurement procedure itself
        was awkward or whether learning the labels made the second round easier; a coin flip does not
        magically remove every source of confounding.
      checks:
      - Both conditions are attempted in a preselected order
      - Errors and interruptions are retained
      - Outcome definitions are not changed after seeing results
      - Order and learning effects remain acknowledged
    - title: Critique the design and specify a better replication
      instructions: Separate the observed difference from a causal conclusion. Propose a later repeat
        with new matched slips and reversed order, and name a result that would challenge the claim. Explain
        what peer review could inspect—methods, assumptions and analysis—and what it could not guarantee,
        such as correctness or generalization. Decide whether the pilot supports repeating, redesigning
        or abandoning the test rather than announcing a universal result.
      checks:
      - Observation and inference are stated separately
      - A replication changes order while keeping the comparison fair
      - A disconfirming result is specified
      - Peer review is treated as scrutiny rather than a truth guarantee
    adaptation: Use large print, tactile labels, a screen reader or a non-timed accuracy comparison. Keep
      the access method constant across conditions. A paper design critique is acceptable when a live
      task is unsuitable, but it does not count as an executed experiment.
    review: Which confound could still explain the result, and what change would make the next test more
      informative?
    examples:
      supportive: The layout difference was recorded with accuracy, an order effect was noticed, and the
        next repeat reversed condition order with matched new slips.
      mixed: Both rounds were completed, but unequal materials prevented a useful comparison.
      contradictory: Unfavorable trials were discarded or the pilot was advertised as proof that one layout
        works for everyone.
      inconclusive: A claim and a preferred result were written without operational measures, a comparison
        or a replication plan.
  '09.15':
    title: Distinguish a promising association from a justified intervention
    goal: Trace a possible causal mechanism, compare counterfactual explanations and selection effects,
      and decide what evidence is needed before intervening.
    scope_note: This is causal reasoning using synthetic educational cases. It does not authorize experimentation
      on children, patients, employees or anyone whose participation is not freely and appropriately governed.
    burden: Thirty minutes for the case analysis and fifteen minutes to revise an intervention claim.
    setup: 'Synthetic claim: members who attend an optional study group score higher, so requiring everyone
      to attend will raise everyone’s score. Known facts: attendance was voluntary, prior knowledge was
      not measured, attendees practiced more outside the group, and the meeting time conflicts with some
      members’ responsibilities. Use arrows or plain sentences.'
    actions:
    - title: Separate the observed association from candidate causes
      instructions: Write attendance and score as distinct observations. Add possible common causes such
        as prior knowledge, available time and motivation, and a possible mechanism such as practice with
        feedback. Mark which links are observed, plausible or untested. Ask whether high-performing members
        selected into the group and whether the outside practice, rather than attendance itself, could
        explain part of the association.
      checks:
      - The observed association is stated without a causal verb
      - A plausible mechanism is distinguished from evidence for it
      - Common causes and selection into attendance are identified
      - Outside practice is considered as an alternative explanation
    - title: State the missing counterfactual and a fair comparison
      instructions: 'Describe the missing question: how would comparable members perform with and without
        this offer under otherwise similar conditions? Propose an ethically acceptable comparison, such
        as voluntary access offered at different convenient times with prior knowledge and outside practice
        recorded, or an appropriately reviewed randomized offer. Explain remaining limitations; matching
        measured characteristics cannot guarantee that unmeasured differences disappeared.'
      checks:
      - The counterfactual comparison is stated clearly
      - The proposed comparison respects consent and access
      - Measured and unmeasured differences are distinguished
      - The design does not claim to observe both outcomes for one person
    - title: Evaluate the intervention separately from the association
      instructions: 'List intended benefits and possible unintended effects of compulsory attendance:
        displaced caregiving, reduced autonomy or less time for independent study. Rewrite the recommendation
        as a bounded proposal to test accessible voluntary support, not a mandate justified by correlation.
        State what evidence would support expanding, revising or stopping the intervention and who has
        authority to make that decision.'
      checks:
      - The intervention’s effects are not assumed from the association
      - At least two unintended consequences are considered
      - The recommendation is revised to fit the evidence
      - Expansion and stop criteria include affected people’s interests
    adaptation: Use labeled cards or a spoken causal story instead of a diagram. Analyze only the synthetic
      case when real records contain private information. Consequential research and institutional interventions
      require appropriate expertise, consent and oversight.
    review: Which unobserved difference could reverse the recommendation, and what would make an intervention
      beneficial rather than merely correlated with success?
    examples:
      supportive: The participant identified self-selection and outside practice, rejected the compulsory-attendance
        inference and proposed an accessible comparison with explicit limits.
      mixed: A mechanism was plausible, but the proposed comparison still ignored an important selection
        difference.
      contradictory: Correlation was used to justify coercion, or a statistical adjustment was treated
        as proof that all confounding vanished.
      inconclusive: The words correlation is not causation were repeated without a mechanism, counterfactual
        or improved comparison.
  '09.16':
    title: Validate a simple model against data it did not fit
    goal: Use a purposeful simplification, document its assumptions, test sensitivity and compare withheld
      observations before deciding where the model may be used.
    scope_note: The model predicts a harmless routine’s duration. It is not an authority over a person’s
      capacity and cannot justify medical, financial, engineering or safety-critical decisions.
    burden: Thirty to forty-five minutes with paper and a calculator or a simple spreadsheet.
    setup: 'Synthetic packing model: time in minutes equals five minutes of setup plus three minutes per
      item. Training examples are two items in eleven minutes and four items in seventeen. Holdout examples,
      to inspect only after writing predictions, are three items in fifteen minutes and six items in thirty-one
      when one item required special handling.'
    actions:
    - title: State the model’s purpose and what it leaves out
      instructions: Write the formula and predict three items as fourteen minutes and six items as twenty-three.
        Explain the setup and per-item terms. List omitted factors such as item size, special handling,
        interruptions, access needs and fatigue. Define the intended use as a rough planning estimate
        for similar ordinary items, not a rule that a person should work at a prescribed speed.
      checks:
      - The formula and two predictions are recorded
      - Parameters have plain-language meanings
      - At least three omitted factors are named
      - The intended use and excluded uses are explicit
    - title: Check sensitivity before revealing the holdout results
      instructions: Recalculate the six-item estimate with setup between three and seven minutes and per-item
        time between two and four. The resulting range is fifteen to thirty-one minutes. Identify which
        assumption most affects a larger batch and whether the decision changes across that range. Write
        a failure signal in advance, such as errors consistently exceeding five minutes or a new category
        of item appearing.
      checks:
      - At least two parameters are varied
      - The resulting prediction range is calculated correctly
      - A decision-sensitive assumption is identified
      - A failure signal is specified before validation
    - title: Compare unseen cases and restrict the domain of use
      instructions: 'Reveal the holdouts and calculate errors: one minute for three items and eight for
        the special-handling batch. Do not call the second case bad data merely because it disagrees.
        Decide whether to restrict the model to ordinary items, add a separately justified handling category
        or gather more observations. Preserve the original version and describe why the revised model
        still needs independent validation.'
      checks:
      - Holdout errors are calculated without refitting first
      - Contradictory observations are retained
      - The domain of use is narrowed or revised for a reason
      - A revised model is not declared validated on its own fitting data
    adaptation: Use a calculator, accessible table or spoken arithmetic. The supplied synthetic data remove
      any need to time yourself or collect others’ performance. Keep models away from worth, disability
      judgments and decisions outside their validated purpose.
    review: What did the model deliberately omit, and which observation showed that an omission mattered
      for its intended use?
    examples:
      supportive: The participant found the eight-minute holdout error, retained it and restricted the
        model to ordinary items while planning a separate special-handling estimate.
      mixed: Predictions were calculated correctly, but the model’s applicability was not revised after
        a clear failure.
      contradictory: A contradictory case was deleted or the model was used to judge someone’s effort
        despite changed access requirements.
      inconclusive: A formula fitted the supplied examples, but no withheld prediction, sensitivity test
        or failure boundary was recorded.
  '09.17':
    title: Verify a consequential message through independent channels
    goal: Recognize selective evidence, emotional pressure and coordinated repetition, then verify an
      important claim without amplifying it or assuming hidden motives are known.
    scope_note: This is defensive information verification. It does not teach influence operations, identify
      secret coordinators from speculation or authorize harassment, intrusion or vigilantism.
    burden: Twenty to thirty minutes using the supplied synthetic message or a safely handled public claim.
    setup: 'Synthetic message: a screenshot says a community venue will close tomorrow unless members
      immediately send money through a linked account. Three reposts repeat the same cropped screenshot,
      but no original notice is linked. Use a private record with exact claim, source chain, incentives,
      independent checks and decision. Do not open suspicious links or send money.'
    actions:
    - title: Extract the claim and inspect the persuasion rather than joining it
      instructions: State separately the alleged closure, deadline and payment request. Note urgency,
        threatened loss, missing context and strategic ambiguity about who issued the notice. Describe
        who could benefit if people act, without asserting that this proves a fraud or a particular actor.
        Treat three copies of one screenshot as one source chain, not three independent confirmations.
      checks:
      - The factual claims are separated from the call to act
      - Urgency missing context and ambiguous authority are identified
      - Possible incentives remain hypotheses rather than accusations
      - Repeated copies are not counted as independent evidence
    - title: Check origin and meaning through trusted routes
      instructions: For a real public claim, navigate independently to the venue’s known official page
        or use a contact route obtained before the message, not the embedded link. Look for the complete
        notice, date and relevant context. Seek a second genuinely independent record when feasible. In
        the synthetic case, rehearse these checks and mark the actual closure claim unverified; do not
        invent a confirmation to complete the exercise.
      checks:
      - Verification avoids the message’s embedded route
      - The original notice date and full context are sought
      - Source independence is checked explicitly
      - Unavailable verification remains unavailable
    - title: Choose a proportionate response and preserve a correction path
      instructions: Record verified, contradicted or unresolved for each claim. Do not forward the screenshot
        while uncertain. For a confirmed impersonation, use the platform or organization’s appropriate
        reporting route without contacting or targeting a suspected individual. If you previously shared
        the claim, correct it to the same audience with the verified information and clear limits. Explain
        what evidence, not emotional intensity, determined the next action.
      checks:
      - Each claim receives its own evidence status
      - Unverified content is not amplified
      - Reporting avoids harassment and speculative attribution
      - A prior mistaken share has a correction route
    adaptation: Use an accessible official channel, a librarian or a trusted support person without sharing
      credentials. The synthetic message permits full verification rehearsal without exposure to a live
      malicious link. Follow local organizational procedures for genuine security incidents.
    review: Which check was genuinely independent of the original narrative, and what would still be speculation
      about intent or coordination?
    examples:
      supportive: The participant recognized copied-source repetition, independently found the venue’s
        notice and withheld the unsupported payment demand.
      mixed: The claim was not forwarded, but the supposed second confirmation traced back to the same
        screenshot.
      contradictory: Speculation about a hidden actor became a public accusation, or the suspicious payment
        link was used to verify itself.
      inconclusive: The message was labeled propaganda solely because of disagreement, with no provenance
        or independent check.
