schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: 08
exercises:
  '08.01':
    title: Find and Repair One Recurring Attention Leak
    goal: Distinguish where attention was intended to go from where it actually went, then test one reversible
      change to a recurring environment. The result is a small attention map and a tested adjustment,
      not a productivity score or a diagnosis.
    setup: 'Use paper or an offline note and a clock already available. The default is an ordinary ten-minute
      reading period interrupted by optional messages. Make six headings: devices, entertainment, work
      or necessary tasks, relationships, rumination, and deliberate practice. A period may have more than
      one label: a meaningful call belongs under relationships even though a device carries it. Select
      three convenient checkpoints in one ordinary day and the same checkpoints on a second day; do not
      install tracking software or record another person.'
    scope_note: The audit samples devices, entertainment, work, relationships, rumination, and deliberate
      practice; these are not good-versus-bad categories. A leak means a recurring mismatch with a freely
      chosen intention, not leisure, caregiving, accessible device use, or an interruption that deserved
      attention. Three brief samples cannot establish a whole-day time budget. One environmental test
      addresses one recurring mismatch and does not establish general attention capacity.
    burden: About five minutes to set up, three one-minute notes on each of two days, two ten-minute activity
      windows, and a five-minute review. Keep only coarse categories; no continuous monitoring.
    actions:
    - title: Sample intention, actual attention, and context
      instructions: 'At each chosen checkpoint, look back over the immediately preceding activity and
        write its intended focus, its actual focus, and what redirected it. For example: intended to read
        a page; followed an optional message into a feed; the unlocked phone beside the page was the cue.
        Assign one or more of the six headings. Mark headings not observed as not sampled, not as zero.
        Distinguish a needed response, such as a care request, from an optional diversion. After the third
        checkpoint, select a mismatch that appeared twice or identify a clearly recalled recurring example
        separately from the samples; do not invent recurrence from one observation.'
      checks:
      - Three planned checkpoints were recorded or the missing checkpoints were explicitly identified
      - Intended focus and actual focus were distinguished without recording private contents
      - All six categories were considered and unsampled categories remained unknown
      - A recurring mismatch was supported by observations or separately labeled retrospective evidence
    - title: Change the environment rather than blame the person
      instructions: 'Choose one reversible condition that contributed to the mismatch. For the default,
        put the phone face down out of immediate reach for ten minutes while retaining essential alerts
        and access; alternatively close one optional feed tab. Write a prediction before starting: I may
        notice the urge to check without opening the feed automatically. Run the same ordinary reading
        activity once. Do not add a timer app, silence all alerts, move locations, and change the task
        simultaneously. Record whether the change was used, whether attention returned when a diversion
        was noticed, and any necessary interruption. The aim is a more workable choice, not a higher page
        count.'
      checks:
      - One controllable environmental condition was changed and the change was reversible
      - A prediction was written before a real activity window was attempted
      - Essential alerts and accessibility or caregiving supports remained available
      - The observed redirection and return were recorded without using output as the outcome
    - title: Compare another ordinary day and decide what to retain
      instructions: 'Repeat the three checkpoints on the second day and run a comparable ten-minute activity
        with the tested condition. Compare the intended-versus-actual focus notes, not guessed totals
        for the day. Name an important difference between days, such as visitors, task difficulty, fatigue,
        or an urgent call. Decide to keep, adjust, remove, or repeat the one change, with a reason tied
        to observed attention and burden. For example: closing the feed helped at both windows, but moving
        the phone blocked a necessary call, so retain only the closed tab. Missing checkpoints or unlike
        activities limit the comparison; they are not evidence that the change worked.'
      checks:
      - A second real activity window and the second-day checkpoints were reviewed
      - Context differences and missing observations were retained in the comparison
      - The conclusion concerned attention allocation rather than productivity or character
      - A keep, adjust, remove, or repeat decision was tied to evidence and burden
    adaptation: Use voice notes, tactile category markers, or a consenting helper who records only categories;
      support is not a deficit. An offline equivalent is an unread magazine beside paperwork or background
      television. Shorten both activity windows equally. Keep medically necessary routines and all essential
      alerts. Stop for safety responsibilities or distress. Persistent intrusive thoughts are not an invitation
      to monitor them continuously; use an ordinary external activity instead and seek appropriate support
      when needed.
    review: Which mismatch actually recurred, which change was tested, and what competing explanation
      remains? Name one condition to retain and one situation in which it should not be used. Review it
      after two further naturally occurring opportunities; one successful window does not establish broad
      or durable improvement.
    examples:
      supportive: Optional feed checking interrupted two reading samples. Closing that tab, while keeping
        necessary messages available, made returning to the page workable in both later windows. The user
        retained the change without claiming a whole-day improvement.
      mixed: The first changed window was easier, but a necessary care call occupied the second. The change
        may fit quiet reading; the samples do not show whether it helps during active care duties.
      contradictory: Moving the phone out of reach caused a missed essential response and more checking
        anxiety. The user restored access and rejected that change rather than presenting fewer screen
        touches as success.
      inconclusive: Only one checkpoint was recorded and the activity changed from reading to a social
        visit. There is no defensible before-and-after comparison; the unobserved categories and effects
        remain unknown.
  '08.02':
    title: Complete an Attention-Presence Experiment
    goal: Practice noticing and returning to a chosen ordinary activity under usual conditions, one changed
      condition, and a repeat. This source-only companion explains the existing legacy exercise; its checklist
      does not replace the application evidence fields or create a new scoring rule.
    setup: 'Use a familiar non-hazardous activity, an optional clock, and a private three-row note labeled
      usual, changed, and repeat. Default: read a familiar non-distressing page for fifteen minutes while
      keeping normal supports. Choose one attention anchor, such as the sentence being read. Other legitimate
      anchors are the feel of an ordinary supported movement, a consenting conversation partner’s words,
      or a safe room sound. Choose the activity that fits; experiencing all four forms is not required.'
    scope_note: Task, body, person, and environment are alternative contexts for present attention, not
      four tests everyone must pass. Notice drift toward past, future, or stimulation and return to the
      selected anchor without counting every drift. The protocol tests a small condition comparison and
      a repeat within seven days. It does not measure meditation expertise, stillness, eye contact, productivity,
      symptom reduction, or sustained attention in untested settings. The runtime package PRACTICE-PRESENCE-01
      remains byte-for-byte unchanged.
    burden: The frozen protocol uses three fifteen-minute windows plus about five to fifteen minutes for
      setup and comparison. Its existing accessible variant permits equally shortened windows; record
      that limitation privately. These companion checks are non-scored reading aids.
    actions:
    - title: Run the existing usual-condition window
      instructions: Follow the app’s usual-condition action with the chosen ordinary activity. For reading,
        locate the sentence you are on; when you notice planning tomorrow or reaching for optional stimulation,
        recognize that attention moved and return to that sentence. Do not try to eliminate thoughts or
        manufacture discomfort. Keep movement, assistive technology, reminders, and other usual supports.
        After the window, make one private note about how returning worked, or that you cannot tell. A
        drifting mind is not a failed action. This companion note is not a replacement for the app’s established
        observation fields.
      checks:
      - A usual-condition activity window was actually attempted
      - The chosen attention anchor and any return were described without counting every drift
      - Normal accessibility and essential-response supports were retained
      - The note did not equate stillness, eye contact, or output with presence
    - title: Use the existing one-condition comparison
      instructions: 'Repeat a comparable window of the same activity and duration after changing exactly
        one controllable condition. Default: close one optional feed tab while leaving essential messages
        available. An equally valid change is adding a movement or tactile support. Compare how readily
        you noticed drift and returned; do not compare pages completed. Name differences that could explain
        the result, such as a harder passage or a needed interruption. Report no difference or worse as
        readily as better. Keep the existing app action and fields; the more detailed private comparison
        supplied here is guidance, not new evidence semantics.'
      checks:
      - Only one intentional environmental or support condition changed
      - Activity and window duration were comparable or their differences were stated
      - The comparison concerned noticing and returning rather than output
      - No-difference, adverse, and uncertain observations were preserved
    - title: Repeat within the existing seven-day boundary
      instructions: 'Within seven days, repeat the condition that was more workable. When neither was
        clearly preferable, repeat a safe condition and keep the comparison inconclusive rather than inventing
        a winner. If the change interfered with essential access, restore the usual condition. Review
        all three private rows: what was attempted, what changed, what returning felt like, and what remains
        unknown. Return to the app’s existing final-review process only for actions genuinely attempted
        and observed. Reading this companion, checking its boxes, or intending to repeat does not complete
        a legacy action.'
      checks:
      - A third real window occurred within seven days or the missed repeat remained incomplete
      - The retained condition was safe and its selection had a stated reason
      - All three windows and important context differences were reviewed
      - Companion notes were not represented as replacement app measurements or completed actions
    adaptation: Keep eyes open, movement, fidgets, assistive technology, and essential alerts. Use equally
      shorter windows under the legacy adaptation, a translated page, audio, or an ordinary external anchor.
      A body-focused anchor is optional; switch away from it if uncomfortable. Do not practice while driving,
      operating equipment, supervising a hazard, or recording another person. Stop or defer when conditions
      are unsafe. No medication, treatment, breathing, or sleep changes are part of this activity.
    review: Was noticing and returning more workable in one condition, and did the repeat support that
      impression? Preserve disagreement between windows. Select one modest repeat or no further action.
      This guide does not change the legacy minimum, markers, credit, or explicit human closeout, and
      its completion is not runtime integration or mastery.
    examples:
      supportive: Closing one optional tab left all necessary supports available. Returning to the same
        reading activity felt more workable, and a repeat three days later supported that limited conclusion.
        The ordinary legacy observations were recorded separately.
      mixed: A movement support helped during the second window, but the repeat used a harder passage
        and felt less workable. Both observations remain; there is no claim that the support always helps.
      contradictory: The changed condition removed an essential reminder. The user restored the reminder
        and rejected the change instead of treating fewer interruptions as evidence of better attention.
      inconclusive: The guide was read and a usual-condition window was completed, but no changed-condition
        window or repeat occurred. The companion is authored, but no comparison or additional completed
        legacy action is established.
  '08.03':
    title: Insert One Deliberate Choice Before an Impulse
    goal: Recognize a naturally occurring urge, create a brief safe decision interval, and choose an action
      for a reason you endorse. The exercise distinguishes a deliberate yes, no, delay, or alternative
      from automatic action; resisting every impulse is not the goal.
    setup: 'Use a private three-row note and one ordinary low-stakes context. Default: the urge to switch
      from a chosen task to an optional feed. Write the current intention in a short phrase, such as finish
      this paragraph before deciding on a break, and a permitted alternative, such as take a planned break
      now. No purchase, food restriction, intimate encounter, argument, or withdrawal from a substance
      is required. Keep urgent needs and essential messages outside the delay rule.'
    scope_note: Speech, spending, eating, sex, anger, quitting, and novelty are transfer contexts for
      deliberate choice, not mandatory exposures. This small exercise directly rehearses the choice interval
      using optional novelty or harmless speech; it does not establish safe financial, sexual, medical,
      or conflict decisions. Bodily needs, consent, a required safety response, and a reasoned decision
      to stop are not impulses that must be defeated.
    burden: Five minutes of setup, two naturally occurring opportunities during the next seven days, a
      pause of up to thirty seconds only when safe, and five minutes of review. Do not provoke stronger
      urges to obtain evidence.
    actions:
    - title: Separate the urge from the decision it suggests
      instructions: 'At the first natural urge to open the optional feed, record the cue in a few neutral
        words, the action the urge suggested, and your endorsed reason for the current task or for changing
        it. Try saying: I notice an urge to switch; I have not yet decided. Take a short pause only if
        it does not delay a real need. Then make a deliberate choice: return to the paragraph, take a
        genuine break, or choose another appropriate action. Record what you actually did, including an
        automatic switch noticed afterward. Awareness after the fact is useful information, but do not
        relabel it as a pause that occurred before action.'
      checks:
      - A naturally occurring urge and its suggested action were distinguished
      - An endorsed reason or legitimate changed need was named
      - Whether the pause occurred before or after action was recorded honestly
      - The actual chosen or automatic behavior was recorded without a character verdict
    - title: Try the choice interval at another real opportunity
      instructions: 'At a second natural opportunity, use the same brief phrase and pause for up to thirty
        seconds if safe. Compare at least two options against the reason you endorsed: finish the paragraph
        and then rest, or stop now because a real need has changed the plan. Choose one and carry it out;
        merely rehearsing options is not a completed behavioral trial. If you still switch automatically,
        record that result and the cue rather than extending the pause as punishment. Preserve any supports
        already helping you. An optional spoken-message variant uses an unsent ordinary sentence and a
        deliberate decision to say, revise, or omit it, without manufacturing an argument.'
      checks:
      - A second naturally occurring opportunity was attempted
      - At least two appropriate options were considered before the recorded choice when possible
      - The selected action was actually carried out or the automatic action was acknowledged
      - Urgent needs, consent, supports, and safety were not overridden by the delay rule
    - title: Review freedom of choice rather than a resistance streak
      instructions: 'Compare the two opportunities by cue, timing of awareness, reason, and actual behavior.
        Identify whether the brief interval helped you choose, made no difference, or became rigid or
        distracting. Name a future cue for one repeat and an exception: for example, optional scrolling
        can wait, but an essential message cannot. Include a deliberate choice to rest or quit an unsuitable
        task as a legitimate decision when its reason is stated. Do not award yourself a success streak
        for suppressing needs or import the result into high-consequence situations. A missing second
        opportunity leaves the repeated-choice claim untested.'
      checks:
      - Both opportunities were compared with their actual sequence intact
      - The review distinguished deliberate choice from mere suppression
      - One next cue and one legitimate exception were specified
      - Unobserved opportunities and untested transfer contexts were not claimed as success
    adaptation: Use a visual cue, a short spoken phrase, or an agreed nonjudgmental reminder. A pause
      can be shorter than thirty seconds; the number is a practice default, not a treatment dose. Do not
      delay food, water, medication, sleep, toileting, safety responses, or withdrawal care. Never test
      consent by provoking an intimate situation. Use a neutral context or defer when urges involve dangerous
      behavior or distress beyond an ordinary educational practice.
    review: At which point did awareness arrive, and did the interval enable a choice you could explain?
      Keep one useful cue without imposing it everywhere. Review after two further natural opportunities
      and preserve examples where the appropriate choice was a break, a response, or stopping rather than
      persistence.
    examples:
      supportive: The user noticed the urge to open a feed before acting on both occasions. One time they
        finished a paragraph; the other they deliberately took a needed break. Both choices had an endorsed
        reason.
      mixed: The first switch was automatic and noticed afterward. During the second opportunity the pause
        preceded a deliberate choice. That supports one observed use of the interval, not two successful
        pauses or general impulse control.
      contradictory: The user delayed an essential response to preserve a no-switching rule. The rule
        reduced appropriate choice, so they removed that application rather than calling it discipline.
      inconclusive: No natural urge appeared during either planned window. Writing possible responses
        rehearsed the method but did not demonstrate an actual impulse-choice interval.
  '08.04':
    title: Notice Desire Without Letting It Decide for You
    goal: Observe one ordinary desire, restore a consideration it pushed out of view, and make a bounded
      choice that respects other people and your own needs. The aim is desire with agency, not absence
      of desire, purity, or a compulsory refusal.
    setup: 'Use paper or an offline note. Default: wanting to watch one more optional video after the
      activity you chose has ended. Start only when that desire occurs naturally. Make three headings:
      what I want, what I expect it to give me, and what else matters. An example is another video, a
      pleasant distraction, and a promised ordinary call. No food, substance, money, intimate detail,
      or other person’s identity needs to be recorded.'
    scope_note: 'The exercise addresses narrowed attention, expected reward, distorted assumptions, and
      treating persons or goods as mere means. The default directly tests a non-intimate desire. A brief
      consent-and-dignity check explains a transfer boundary for attraction or lust: another person has
      independent wishes, not an obligation to satisfy desire. That check is conceptual literacy, not
      observation of sexual conduct or a requirement to disclose it. Addiction treatment and high-consequence
      impulses are outside scope.'
    burden: About five minutes to set up, one naturally occurring desire and a short optional ninety-second
      interval, then five minutes to decide and review. A second occasion within seven days is optional
      and must not be manufactured.
    actions:
    - title: Describe the desire and the promise attached to it
      instructions: 'When the ordinary desire appears, fill the three headings with neutral descriptions.
        For the default: I want another video; I expect a break from effort; I also want to honor my chosen
        call. Add one assumption that may be unverified, such as one more will definitely satisfy me.
        Do not argue that having the desire is bad. If the desire involves a person, use only a category-level
        note and state that the person’s consent, preferences, and freedom remain independent of your
        wanting. If a basic need is present, meet that need rather than using this exercise to question
        its legitimacy.'
      checks:
      - A naturally occurring desire was described without a moral or identity verdict
      - The expected reward and at least one assumption were distinguished
      - Another relevant need, commitment, or consideration was restored to view
      - Other people’s independent wishes and basic-needs boundaries were respected
    - title: Allow the feeling while recovering a wider view
      instructions: 'For an optional entertainment desire, wait up to ninety seconds before the next click
        while doing an ordinary neutral action, such as setting down the device and looking at the room.
        You do not have to make the desire fade. Ask whether the expected reward is the only relevant
        fact and identify one alternative: watch later, take a different break, make the call, or freely
        choose the video. Notice whether the urge stayed, eased, or intensified, without a numeric intensity
        requirement. End the interval early if it becomes unhelpful. This is not a rule for delaying food,
        medication, necessary communication, or relief of a health need.'
      checks:
      - A safe interval was attempted with an optional nonessential desire
      - The desire was allowed to remain rather than made a required target for elimination
      - At least one alternative and one neglected consideration were identified
      - The observed experience and any early stop were recorded honestly
    - title: Make the choice and compare its result with its promise
      instructions: Choose and carry out one appropriate action while the desire may still be present.
        For the default, either make the call as planned or consciously renegotiate an ordinary commitment
        before choosing entertainment; do not simply erase an obligation from the note. Afterwards compare
        what the choice actually gave you with the expected reward. Record whether a person or responsibility
        was treated instrumentally, whether the choice was voluntary, and whether a boundary needs repair.
        A deliberate yes is not automatically failure and a no is not automatically success. Preserve
        uncertainty when you cannot observe the predicted result.
      checks:
      - A decision was made and its actual action was distinguished from intention
      - The observed result was compared with the reward initially expected
      - Consent, commitments, and non-instrumental regard were included in the review
      - The conclusion concerned choice in this situation rather than purity or absence of desire
    adaptation: Use a spoken note or a neutral desire such as checking an optional score or choosing background
      entertainment. Do not evoke distressing material, provoke jealousy, involve an unwilling person,
      restrict nourishment, change medication, or attempt substance withdrawal. An ordinary pause need
      not last ninety seconds. Private attraction or intimate behavior need not be disclosed; a fictional
      dignity example is conceptual rehearsal only. Stop and seek appropriate support when the situation
      exceeds a safe low-stakes exercise.
    review: What did desire make salient, what did it leave out, and how did the eventual result compare
      with its promise? Identify one consideration to remember next time, without a ban on wanting. Keep
      any unkept commitment or ignored boundary visible and choose a proportionate repair where appropriate.
    examples:
      supportive: The wish to continue watching remained, but the user noticed that the promised break
        would conflict with a call they valued. They made the call and later chose entertainment without
        treating desire itself as wrongdoing.
      mixed: The user noticed the narrowed focus but clicked automatically before comparing alternatives.
        They later identified the unverified reward assumption. The reflection is useful; a prior deliberate
        choice was not observed.
      contradictory: A refusal became a purity rule and the user treated another person’s preferences
        as irrelevant to preserving that rule. The exercise is stopped or revised because agency and dignity
        were lost.
      inconclusive: A fictional desire was analyzed but no natural opportunity occurred. The worksheet
        shows conceptual rehearsal, not observed freedom from compulsory action in a live situation.
  '08.05':
    title: Stay With One Safe Frustration Without Ignoring a Need
    goal: Attempt a small worthwhile action while ordinary boredom, uncertainty, frustration, or mild
      embarrassment is present, and distinguish that discomfort from a signal to stop or obtain support.
      Finishing at any cost is not the goal.
    setup: 'Choose a safe ordinary task you already intend to do. Default: organize five non-sensitive
      loose papers into keep, discard, and unsure using your existing rules; keep uncertain items rather
      than destroying them. Use a two-minute trial and a place to stop safely. Name the likely ordinary
      discomfort, such as boredom about sorting. Do not choose an activity involving pain, sleep loss,
      strenuous exertion, financial commitment, conflict, or hazardous equipment.'
    scope_note: The canonical scope includes boredom, uncertainty, frustration, embarrassment, fatigue,
      craving, and temporary pain. This exercise directly uses only naturally occurring low-stakes boredom
      or frustration, with uncertainty handled by an unsure pile. It explicitly teaches that fatigue,
      pain, and unmet needs are not training targets here; those facets require context-appropriate judgment
      and, where appropriate, qualified guidance. It does not establish pain tolerance, clinical exposure
      outcomes, or resilience across untested discomforts.
    burden: Five minutes of preparation, two two-minute trials on separate ordinary opportunities within
      seven days, and five minutes of review. Shorter equal trials are valid. More discomfort, time, or
      output earns no additional meaning.
    actions:
    - title: Identify the feeling and attempt the bounded action
      instructions: 'Before the first trial, name the task, the worthwhile reason for it, and a concrete
        stopping boundary. For the default: sort at most five papers for two minutes, keep uncertain papers,
        and stop for pain, unsafe fatigue, an urgent duty, or escalating distress. If ordinary boredom
        or frustration is present, begin and notice whether it can coexist with the next small movement.
        Use an unsure pile instead of forcing certainty. When the time or item boundary arrives, stop
        and record what happened, including no start or an early stop. Do not claim discomfort practice
        if no relevant discomfort was actually present.'
      checks:
      - A worthwhile action and a concrete time or item boundary were chosen
      - The actual ordinary discomfort or its absence was acknowledged
      - A real small action was attempted without forcing certainty or unsafe continuation
      - Stop conditions and any early stop were preserved in the record
    - title: Repeat while distinguishing discomfort from a changed need
      instructions: At a second naturally suitable opportunity, attempt the same-sized action. Before
        continuing through a feeling, check whether the situation is still the agreed low-stakes one.
        Ordinary boredom may be compatible with another small step; pain, a required rest, an urgent responsibility,
        or growing distress changes the decision. Continue only within the chosen boundary, or stop and
        name why. Use ordinary access supports without treating them as avoidance. Record whether the
        action occurred while the named discomfort remained and whether a needed stop was honored. Do
        not increase duration or difficulty just because the first trial was easy.
      checks:
      - A second comparable opportunity was actually attempted or remained explicitly deferred
      - Ordinary task discomfort was distinguished from pain, unsafe fatigue, or an urgent need
      - Continuing or stopping stayed within the preselected boundary
      - Support use and the actual relation between discomfort and action were recorded
    - title: Choose a proportionate lesson from the two trials
      instructions: 'Compare what you did while the feeling was present with what happened when the context
        changed. A useful result might be: boredom did not prevent sorting two papers, but uncertainty
        required an unsure pile. Another might be: the second opportunity required rest, so no comparable
        trial occurred. Decide whether to repeat the same modest task, improve its supports, choose a
        different ordinary activity, or stop. Do not conclude that all discomfort is harmless or that
        a supported or incomplete action reflects less worth. Retain one clear example of an appropriate
        stopping decision.'
      checks:
      - The review compared actual trials rather than endurance claims
      - A limited lesson about action with ordinary discomfort was stated
      - At least one legitimate stopping or support condition remained explicit
      - No claim of pain, fatigue, clinical exposure, or broad distress tolerance was made
    adaptation: Use large-print or tactile categories, an accessible surface, voice labels, or a consenting
      helper; a digital five-item sort is an alternative. Shorten the task or choose a different ordinary
      activity when needed. Never induce pain, restrict sleep or food, withhold care, expose trauma, or
      persist through symptoms to complete the practice. A safe early stop is information, not failure,
      but an unattempted action is not marked completed.
    review: What ordinary feeling coexisted with a useful action, and what sign correctly changed the
      plan? Keep the task boundary and a valid support for the next opportunity. The review must be able
      to recommend stopping just as honestly as continuing.
    examples:
      supportive: Boredom remained during both two-minute sorting trials, yet a few papers were organized
        without discarding uncertain items. The user retained the small scope and did not infer a capacity
        to push through pain or fatigue.
      mixed: Frustration accompanied useful action in the first trial. The second opportunity was interrupted
        by a legitimate duty and could not be compared. One bounded observation is retained rather than
        counted as repeated endurance.
      contradictory: The user ignored a stopping condition and prolonged the task to prove toughness.
        That result contradicts the exercise’s judgment boundary even if more papers were sorted.
      inconclusive: The task was attempted without any noticed discomfort. This establishes a task attempt,
        not observed action while discomfort was present, and no stronger feeling is manufactured to complete
        the record.
  '08.06':
    title: Compare Two Small Starts Without Waiting for Motivation
    goal: Compare a usual-condition start and a one-cue-supported start of the same genuinely necessary,
      low-stakes task during two naturally occurring low-motivation windows. Evaluate the act of beginning,
      not output, speed, stamina, or personal worth.
    setup: 'Use a clock and a private two-row note labeled usual and one cue. Default: open a non-sensitive
      document you actually need to work on and type one rough heading, stopping within two to five minutes.
      If no document is needed, put materials for one ordinary necessary household task in their working
      position. Choose two realistic windows within seven days. Keep the first under usual safe conditions
      and choose exactly one cue for the second, such as a calendar prompt or an agreed reminder. No invented
      task or sleep loss is needed.'
    scope_note: 'The canonical target is repeated starts without waiting to feel inspired, confident,
      or energetic. This preserves the existing three-action protocol: a usual-condition start, a one-cue-supported
      start, and a bounded comparison. The baseline boolean, duration boundary, cued-start boolean, cue-category
      criteria, zero-to-two start count, capacity-harm indicators, and all other existing typed rules
      remain unchanged. The expanded private checks explain those actions; they do not add measurements
      or treat a rehearsal as a real start.'
    burden: About twenty to thirty minutes including setup, two starts of two to five minutes each, and
      a ten-minute comparison within seven days. Continuing after a start is optional and outside the
      measured outcome.
    actions:
    - title: Attempt the usual-condition two-to-five-minute start
      instructions: In the first feasible low-motivation window, attempt the predefined physical start
        under your usual safe conditions without adding a new cue. For the default, open the actual needed
        document and type one provisional heading; do not turn the trial into finishing the document.
        Observe whether that physical start occurred and whether the scoped attempt remained within five
        minutes. A timer, assistive technology, or help you ordinarily use remains available. Stop at
        the boundary or earlier for changed capacity. In the app, the baseline-start observation concerns
        whether beginning actually happened; the duration field concerns this scoped attempt, not a later
        freely chosen work session. Record no start honestly.
      checks:
      - A naturally occurring feasible low-motivation window was used
      - The predefined physical start actually occurred or its absence was recorded
      - The scoped attempt duration was distinguished from any optional later work
      - No new comparison cue or capacity-harming pressure was introduced
    - title: Attempt the same-sized start with exactly one cue
      instructions: In a separate feasible low-motivation window, use the same task and same-sized start
        with one chosen cue or support. For example, an existing calendar reminder says open the draft
        and type one rough heading. Do not simultaneously add a reminder, a reward, and a body double.
        Record whether the start occurred and, in a private category-level note, which single cue was
        selected. The existing cue artifact checks mean cue selected, one cue only, and no private content;
        these are not new success criteria. Preserve changed capacity, access, or an absent opportunity.
        An ignored prompt is not a start, and a deferred window is not converted into laziness or completed
        action.
      checks:
      - The second window was distinct and naturally feasible
      - Exactly one cue or support category was selected without exposing private contents
      - Whether the same-sized physical start occurred was observed
      - Changed capacity and any deferral were preserved without pressure to continue
    - title: Compare zero, one, or two actual starts
      instructions: 'Review both rows and count only the chosen starts that actually occurred: zero, one,
        or two. Compare whether the single cue was more workable, less workable, or indistinguishable,
        keeping differences in timing, energy, access, pain, and care duties as context. The existing
        comparison artifact means the two windows are distinguished, deferral is preserved, and capacity
        is not scored. Do not report two starts because two times were scheduled, a reminder appeared,
        or a worksheet was completed. Keep the start count separate from the quality of the comparison.
        Choose a modest repeat, an adaptation, rest, or support on the basis of the observations, not
        a character verdict.'
      checks:
      - The actual start count was zero, one, or two rather than the number of scheduled windows
      - The usual and cued windows were distinguished with relevant context differences
      - Deferral and capacity were retained without a deficit or coercion interpretation
      - Cue workability and the next decision were supported only as far as the observations allow
    adaptation: Use assistive technology, a planning aid, an accessible document, a consenting support
      person, or an ordinary household equivalent. Keep the physical start smaller when needed without
      describing a plan alone as the target action. Do not sacrifice sleep, recovery, food, treatment,
      care duties, or safety. No task whose delay or partial start creates a significant hazard belongs
      here. If suitable windows do not occur, preserve the missing comparison; do not manufacture low
      motivation or remove helpful supports.
    review: How many starts actually occurred, and what can the two windows tell you about the cue without
      judging capacity? Preserve an indistinguishable or adverse result. Choose whether to keep the cue,
      change one feature, obtain support, or defer. Completing a two-start experiment does not prove reliable
      initiation across tasks or life circumstances.
    examples:
      supportive: The predefined two-minute start happened in both feasible windows. The reminder made
        the second start feel easier without extending its scope. The count is two; the cue’s broader
        effectiveness remains untested.
      mixed: The usual start occurred, but a care need made the second window unsuitable. The observed
        count is one and the cue comparison remains incomplete; the deferred action is not relabeled failure
        or completion.
      contradictory: The reminder became pressure to work through a stated need for rest. The capacity-harm
        concern remains adverse even if a document was opened, and the cue is removed or revised.
      inconclusive: Two prompts were scheduled but neither physical start was observed. There is no evidence
        of two starts; planning and a zero-start count cannot be represented as successful behavioral
        initiation.
  '08.07':
    title: Make One Chosen Habit Easier to Carry Out
    goal: Install and test one small environmental arrangement that supports a recurring behavior you
      genuinely choose. Identify how a cue, default, friction, checklist, layout, or voluntary accountability
      contributes, without assuming the arrangement creates a durable habit.
    setup: 'Use existing materials and a short private note. Default: put the book you want to read in
      a safe visible place with a bookmark at the next page, after an ordinary recurring meal or other
      routine. The target is opening the book and reading one paragraph, not a daily streak. Do not block
      a shared route or remove a necessary item. Choose two naturally occurring opportunities in the next
      seven days; no purchase or app is required.'
    scope_note: The design considers cues, defaults, friction, accountability, checklists, and physical
      layout as distinct tools. It installs one small change, not all six at once. A cue signals the moment;
      a default makes the chosen next step ready; friction makes an action easier or harder; a checklist
      clarifies sequence; layout puts materials where they can be used; accountability is an optional
      consent-based check-in. Two trials can test usability, not establish automaticity or long-term habit
      strength.
    burden: Five to ten minutes of setup, two ordinary opportunities of one to five minutes, and five
      minutes of review. Keep the arrangement reversible and remove it if it creates clutter, conflict,
      access problems, or pressure.
    actions:
    - title: Locate the point where the recurring action breaks down
      instructions: 'Walk through one recent ordinary opportunity: what should have signaled the action,
        where the materials were, what the next physical step was, and what actually happened. For the
        default, the meal ended, the book was in another room, and an optional feed was already open.
        Decide whether the main obstacle is a missing cue, poor layout, unnecessary friction, unclear
        sequence, an unhelpful default, or a freely wanted reminder. Give one concrete option for that
        obstacle and explain why another tool is not needed now. A checklist is useful only if sequence
        is the problem; another person is not recruited unless both people freely agree.'
      checks:
      - A specific recent opportunity and the intended small behavior were described
      - The actual failure point was separated from a claim about weak character
      - A relevant design tool and one concrete option were selected
      - Consent, shared-space access, and unnecessary additional tools were considered
    - title: Install one reversible arrangement and use it once
      instructions: Make the smallest chosen change and attempt the target behavior at the next natural
        cue. For the default, place the bookmarked book safely where you normally sit after the chosen
        routine. This changes layout and readiness as one bounded arrangement; do not also add alarms,
        penalties, and a public streak. Record whether the cue was noticed, whether the first physical
        step was easier, whether the behavior occurred, and any burden created for you or someone sharing
        the space. If you selected voluntary accountability instead, agree the exact reminder, privacy
        limit, and easy way to decline before the trial; the other person is not made responsible for
        your performance.
      checks:
      - One bounded arrangement was actually installed and remained reversible
      - A naturally occurring cue and a real target-behavior opportunity were observed
      - Occurrence of the behavior was distinguished from readiness or intention alone
      - Burden, shared-space impact, and any reminder consent were checked
    - title: Test the second opportunity and retain only what earns its place
      instructions: At the next comparable cue, try the arrangement again. Record whether it remained
        available, was noticed, and made the chosen behavior more workable. Compare both observations
        with the original failure point. Keep the arrangement only for a stated benefit at an acceptable
        burden; adjust or remove it when it is ignored, obstructive, coercive, or no longer relevant.
        Specify when to review after two more natural opportunities. A behavior that happened once because
        a helper did all of it is not evidence that the environment now reliably supports your chosen
        action. Do not extend the test into an obligation to maintain a streak.
      checks:
      - A second naturally occurring opportunity was reviewed or remained missing
      - Cue visibility, behavior occurrence, and arrangement burden were distinguished
      - The retain, change, or remove decision addressed the original failure point
      - Long-term habit or independence claims were not inferred from two trials
    adaptation: Use accessible placement, tactile or visual cues, a one-step voice checklist, or materials
      already available. The equivalent can be setting out a chosen craft or language-practice item rather
      than a book. Retain access supports and shared-space consent. Accountability is optional, specific,
      revocable, and non-punitive. Do not introduce public reporting, financial penalties, blocked essential
      access, or surveillance. A changed need can end the habit without implying failure.
    review: Which part of the arrangement actually helped, and what did it cost in effort, access, or
      shared space? Retain one justified feature, remove unnecessary ones, and review at a defined next
      opportunity. Reliable support must be observed over time rather than declared because the design
      looks clever.
    examples:
      supportive: The safely placed bookmarked book was noticed after both chosen routines, and a paragraph
        was read each time. The user kept the arrangement while leaving long-term habit formation unclaimed.
      mixed: The arrangement helped once but was moved during a shared-space activity before the second
        opportunity. The user agreed a less intrusive location rather than blaming either person.
      contradictory: An accountability reminder became unwanted monitoring and the layout blocked another
        person’s access. The user withdrew the reminder and removed the obstruction, even though reading
        occurred.
      inconclusive: The book was placed but neither selected routine occurred during travel. Installation
        is observable; usability at the intended cue and repeated behavior remain untested.
  '08.08':
    title: Set an Honest Minimum for a Difficult Day
    goal: Define and test a small viable minimum that preserves continuity on a genuinely difficult day
      while keeping the ordinary standard explicit. A minimum, a full effort, and a necessary pause must
      remain distinguishable.
    setup: 'Use paper or an offline note and one freely chosen recurring activity. Default: practice a
      language from material you already use. Ordinary standard: a ten-minute session with three phrases
      practiced aloud or in an accessible equivalent. Difficult-day minimum: spend two minutes retrieving
      and checking one phrase. Pause condition: a day when even that conflicts with health, care, rest,
      access, or an urgent duty. Use real upcoming opportunities within seven days; do not create a difficult
      day.'
    scope_note: The task covers a viable difficult-day floor, the retained normal standard, and honest
      continuity without equating the floor to full performance. The minimum must do a real piece of the
      chosen activity rather than only tick a box, but a legitimate pause remains available. One or two
      observed opportunities cannot prove consistency across seasons. Some essential or safety-critical
      duties cannot be reduced this way and are excluded.
    burden: Five minutes to set up, one ordinary opportunity and one naturally difficult-day opportunity
      when available, and five minutes of review. The default trials use ten and two minutes respectively.
      Absence of a difficult day limits the evidence rather than requiring one.
    actions:
    - title: Define full, minimum, and pause as different states
      instructions: 'Write three observable descriptions before the next opportunity. For the default:
        full means ten minutes with three phrases practiced; minimum means two minutes retrieving and
        checking one phrase; pause means no practice because a named care, health, rest, or access condition
        takes priority. Check that the minimum retains the purpose of learning rather than merely opening
        the app. Name what the minimum omits, such as breadth and extra repetition. Set a private label
        for each state and state when the ordinary standard should return. Do not use a lower standard
        to conceal a duty to another person or reduce a safety requirement.'
      checks:
      - Full, minimum, and pause states each had a concrete observable definition
      - The minimum retained a real component of the chosen activity
      - What the minimum omits relative to the ordinary standard was stated
      - A legitimate pause condition and a return-to-normal review point were defined
    - title: Use the applicable standard at real opportunities
      instructions: 'At an ordinary opportunity, attempt the normal standard and record what actually
        occurred. At a naturally difficult-day opportunity, choose the minimum or pause according to the
        conditions you wrote; do not reduce sleep or create overload to test it. Label the result by actual
        work, not the plan: a two-minute phrase trial remains minimum even if it felt hard, and an intended
        session that never began remains unattempted. If only ordinary opportunities occur, test the normal
        standard and mark the difficult-day pathway untested. A tabletop scenario may clarify the plan
        but is not a difficult-day behavioral trial.'
      checks:
      - At least one real opportunity was attempted and its applicable standard was identified
      - Actual full, minimum, partial, or unattempted work was labeled without inflation
      - A difficult-day opportunity was natural or explicitly remained untested
      - The minimum or pause did not override rest, care, access, or essential duties
    - title: Review continuity and restore the appropriate standard
      instructions: Compare the observations with the three definitions. Ask whether the minimum preserved
        a useful connection to the activity, was still too burdensome, or became a disguised rule to never
        rest. Also ask whether normal conditions have returned and the ordinary standard remains meaningful.
        Keep, adjust, or discontinue the minimum with a reason. Set the next ordinary opportunity for
        the normal standard when suitable, without retroactively relabeling minimum efforts as full. If
        capacity has changed for longer than expected, revise the broader plan openly rather than treating
        every day as an exception or insisting on an obsolete target.
      checks:
      - Observed work was compared with the original three-state definitions
      - Continuity and burden were both evaluated
      - A suitable ordinary standard or an openly revised plan was selected
      - Minimum work, full work, and legitimate nonparticipation remained distinguishable
    adaptation: Use speech, signs, typing, audio, tactile materials, or a different chosen learning or
      creative activity. Adjust both standards to actual access and capacity before the trial. A pause
      is legitimate and carries no worth judgment, but is not a completed practice action. Do not use
      this scheme for prescribed treatment, safety checks, legally required work, or another person’s
      essential care. Avoid streak counters or catch-up punishment.
    review: Did the minimum preserve something genuinely useful, and what did it not accomplish? Does
      the next opportunity call for normal effort, minimum effort, a new realistic standard, or a pause?
      State the answer without turning continuity into a requirement to ignore needs.
    examples:
      supportive: An ordinary ten-minute language session and a naturally difficult-day two-minute phrase
        trial both occurred. The user labeled them full and minimum, identified the omitted breadth, and
        returned to the ordinary standard at a suitable later opportunity.
      mixed: The minimum preserved contact with one phrase but was still too much during a care-heavy
        evening. The user kept that attempt as partial and made the pause condition more realistic.
      contradictory: Every minimum was labeled full and the user refused a needed rest to protect a streak.
        The record concealed reduced work and created pressure, so the scheme was revised rather than
        celebrated.
      inconclusive: Only ordinary days occurred. The normal standard was tested, but the difficult-day
        minimum remains a plan rather than demonstrated continuity under difficulty.
  '08.09':
    title: Choose a Small Restraint Without Turning It Into a Test of Worth
    goal: Freely forgo one optional comfort for a short bounded interval, observe the resulting choices,
      and reconnect with gratitude rather than superiority. The result must leave you freer to choose,
      not bound to a harsher rule.
    setup: 'Use an ordinary ten-minute period that is already safe and free of urgent obligations. Default:
      do a simple familiar household activity without optional background entertainment, while keeping
      any sound or sensory support needed for access or comfort. The restraint is only the optional entertainment.
      Choose an equally benign simplicity variant, such as using a familiar existing leisure item instead
      of browsing new ones, when quiet is not suitable. No purchase, deprivation, strenuous training,
      or public announcement is required.'
    scope_note: Fasting, simplicity, silence, difficult training, abstinence, and reduced comfort are
      different possible traditions or forms, not required exposures. This exercise chooses only a safe
      optional-comfort or simplicity pathway. It does not prescribe fasting, abstinence from essential
      care, physical hardship, pain, heat, cold, sleep loss, or substance withdrawal. The directly tested
      target is voluntary choice and a modest gratitude response; religious, athletic, clinical, and high-risk
      pathways remain outside this exercise.
    burden: Five minutes to select a safe optional restraint, one ten-minute trial that may end earlier,
      and five minutes to review. One repeat within seven days is optional. Longer or harsher restraint
      is not progression by itself.
    actions:
    - title: Choose what is genuinely optional and preserve the exit
      instructions: Write the optional comfort, the short interval, why trying without it interests you,
        and how you can end the trial freely. For the default, optional entertainment is left off while
        one familiar task is done for up to ten minutes; essential alerts and sensory supports remain
        on. Check that nobody depends on you retaining the comfort or sharing the activity in another
        way. Name one support you will not remove and one circumstance that should end the trial. State
        explicitly that stopping or choosing comfort later does not lower your worth. If no safe optional
        restraint fits, defer rather than invent hardship.
      checks:
      - The chosen restraint concerned a genuinely optional comfort
      - A bounded interval, endorsed reason, and freely usable exit were specified
      - Essential supports, shared obligations, and a stopping condition were preserved
      - No deprivation, public proving, or moral ranking was made part of the task
    - title: Try the bounded restraint and notice the choices it creates
      instructions: Carry out the familiar activity under the selected restraint for up to the chosen
        interval. Notice any urge to restore the comfort, any appreciation for what it normally provides,
        and whether the activity remains safe and workable. There is no requirement to feel calm, grateful,
        stronger, or spiritually improved. Restore the comfort early if it becomes needed or the trial
        turns unhelpful. Record the actual interval and whether the exit remained genuinely available.
        Do not compensate by making the next trial harder, recruit another person without consent, or
        use your choice to criticize how anyone else rests.
      checks:
      - A real bounded optional-comfort trial was attempted
      - Urges and any appreciation were noted without requiring a preferred feeling
      - The exit and essential supports remained available throughout
      - Any early restoration or adverse response was recorded rather than hidden
    - title: Return to ordinary choice and identify a gratitude response
      instructions: End the trial and deliberately choose whether to restore the comfort now, later, or
        not at this opportunity. Explain that choice without claiming to be better than people who choose
        differently. Identify one concrete appreciation if genuinely present, such as the usefulness of
        accessible entertainment or the effort behind an existing object, and one modest response such
        as caring for that object. If no appreciation arose, say so rather than manufacture it. Review
        whether restraint increased flexibility or created pride, anxiety, obsession, or pressure. Keep,
        revise, or stop the practice accordingly; refusal to end it is not automatic evidence of success.
      checks:
      - The trial ended and a fresh ordinary choice was made
      - Any gratitude response was genuine or its absence was acknowledged
      - Freedom, burden, and possible superiority or compulsive control were reviewed
      - No escalation in duration or hardship was treated as required progress
    adaptation: Quiet is optional; retain music or sound used for accessibility, regulation, or shared
      comfort and choose a different nonessential simplification. Do not withhold food, water, sleep,
      medication, treatment, hygiene, warmth, necessary communication, or substance-withdrawal care. Do
      not train through pain or use temperature exposure. Respect religious practices without treating
      this activity as a substitute for their guidance. Stop when restraint becomes distressing, coercive,
      or difficult to end.
    review: Did you remain free to choose both restraint and comfort? What, if anything, became easier
      to appreciate, and did that change one ordinary action? Select a proportionate next step or no repeat;
      gratitude, humility, and choice cannot be inferred from tolerating a longer interval.
    examples:
      supportive: The user left optional entertainment off for ten minutes, appreciated its normal place
        in rest, and freely chose to restore it afterward. The trial remained small and was not used to
        rank anyone’s discipline.
      mixed: The quieter period was initially workable but became distracting, so entertainment was restored
        early. The user learned that this version did not fit that setting and chose a different benign
        simplicity pathway.
      contradictory: The user escalated the interval, removed a needed support, or felt unable to stop
        without shame. Those observations contradict voluntary freedom even if the planned time was exceeded.
      inconclusive: The user forgot the selected restraint and the comfort was unavailable for unrelated
        reasons. Involuntary absence is not evidence of a freely chosen restraint trial.
  '08.10':
    title: Finish or Deliberately Close One Open Commitment
    goal: Reduce competing open loops, define a meaningful finish, and either complete one bounded commitment
      or end it for a reason that addresses its consequences. Perseverance is continued worthwhile action,
      not refusing to quit regardless of new evidence.
    setup: 'Use a private note and a small commitment within your control. Default: an unfinished personal
      three-paragraph note that needs a final edit and saving in its intended location. List at most three
      current open loops without sensitive contents. Choose one that can be advanced in two ten-minute
      windows within seven days and whose partial work or cancellation creates no safety, legal, financial,
      or care hazard. Use a personal craft, learning exercise, or household organization task as an equivalent.'
    scope_note: The exercise addresses simultaneous commitments, a definition of done, plateaus, and actual
      completion or reasoned termination. A small open-loop list supports choosing one focus; it is not
      a total-life inventory. A completed personal note cannot demonstrate perseverance in every domain.
      Termination requires a concrete reason and appropriate closure, not merely declaring a difficult
      task irrelevant. Obligations to others cannot be erased by a private decision.
    burden: Five to ten minutes to choose and define the commitment, two ten-minute work windows, and
      five minutes to close and review. Reduce scope before starting if the finish is not credible at
      this scale.
    actions:
    - title: Choose one focus and define done before continuing
      instructions: List up to three open loops and their next concrete steps. Select one to finish or
        decide about, and explicitly park the others with a revisit point rather than starting another
        task when bored. For the default note, done means all three paragraphs readable, obvious omissions
        checked, and a copy saved in the intended location; publication or praise is not required. Name
        one reason that would justify changing or ending the commitment, such as the note no longer serving
        its intended purpose. Check whether anyone else relies on the outcome and what communication would
        be needed before scope changes.
      checks:
      - One commitment was selected and competing loops were explicitly parked
      - A concrete definition of done was written before the work trial
      - A legitimate reason for scope change or termination was distinguished from boredom alone
      - Any dependency or obligation to another person was identified
    - title: Work through one bounded plateau and reassess the obstacle
      instructions: 'Attempt the first ten-minute window on the selected next step. When progress stalls,
        name the obstacle specifically: an unclear sentence, missing information, too-large scope, distraction,
        or a changed purpose. Try one proportionate response within your authority, such as marking a
        sentence for a simpler rewrite or asking a necessary non-sensitive question. At the second window,
        continue the same commitment or act on new evidence that it should be reduced or ended. Do not
        switch to a new project to avoid recording the plateau. Also do not persist through unsafe conditions
        or add work that the original finish never required.'
      checks:
      - At least one real bounded work window targeted the selected commitment
      - A plateau or obstacle was described specifically when present
      - One proportionate response or evidence-based reconsideration was attempted
      - Scope drift, unsafe persistence, and substitution of a new commitment were not hidden
    - title: Close the loop by completion or accountable termination
      instructions: Inspect the actual work against the original definition of done. If it meets the definition,
        perform the final closure step, such as saving the edited note in its intended place, and mark
        it complete without adding a new perfection requirement. If ending or reducing the commitment
        is justified, record the changed evidence, what will not be delivered, and any dependency or communication
        needed; actually do the relevant closure step. If neither path is complete, leave the loop open
        with a realistic next step rather than awarding completion for a plan. Revisit the parked commitments
        only after this honest disposition.
      checks:
      - Actual work was checked against the original definition of done
      - Completion or termination included a real closure step rather than intention alone
      - A termination decision preserved its reason, undelivered scope, and affected obligations
      - Unfinished work remained explicitly unfinished without a new perfection requirement
    adaptation: Use an accessible medium, a smaller personal artifact, a checklist, or a consenting helper.
      A helper’s work and your contribution should remain distinguishable without ranking support needs.
      Do not choose high-consequence obligations for a quit experiment or silently abandon promises, shared
      work, or essential care. A change in capacity can justify renegotiation. Stop or defer when a safe
      bounded finish is unavailable, and do not manufacture a plateau.
    review: What actually closed, what stayed open, and what did the plateau teach you about the next
      step or the commitment’s value? Was stopping a reasoned closure or an avoidance story unsupported
      by evidence? Keep one workable limit on simultaneous commitments without treating every unfinished
      aspiration as a debt.
    examples:
      supportive: The user parked two optional loops, edited the selected note across two short windows,
        checked the stated finish, and saved it. Completion was observed without adding publication or
        perfection as a new requirement.
      mixed: The first work window exposed missing information. The note remains open with one specific
        question and a revisit point; the user made real progress but did not claim it finished.
      contradictory: The user called the commitment pointless only after encountering boredom, opened
        three new projects, and left a relied-on handoff unaddressed. That is not accountable termination
        or demonstrated perseverance.
      inconclusive: A polished definition of done and a schedule were written, but no work or closure
        step occurred. Planning is visible; completion, plateau handling, and reasoned termination remain
        unobserved.
  '08.11':
    title: Revise a Discipline That No Longer Serves Its Purpose
    goal: Evaluate one self-chosen rule by the health, duty, freedom, or meaning it is supposed to serve,
      then test a proportionate revision without shame or superiority. Keeping a useful structure and
      relaxing an unhelpful one are both legitimate outcomes.
    setup: 'Use a private note and one optional self-imposed rule. Default: a rule that every personal
      note must be perfectly formatted before it can be saved. Write its intended purpose, such as making
      the note usable, and choose one harmless personal note for a reversible trial. The proposed revision
      is save a readable rough note now and format only if a later use requires it. Do not choose medication,
      treatment, safety checks, legal duties, essential care, or a rule imposed under unsafe power dynamics.'
    scope_note: The target is discipline as a tool for freedom rather than self-hatred, compulsive control,
      domination, or moral superiority. This trial directly examines one optional rule and its effect
      on a small task; it does not diagnose compulsions or establish a person’s general character. Revising
      a private rule is not permission to ignore obligations to others. Clinical, religious, legal, safety-critical,
      or externally imposed rules may require appropriate guidance and are not altered by this exercise.
    burden: Five minutes of preparation, one ordinary ten-minute-or-shorter trial, a five-minute review,
      and one later ordinary check within seven days when possible. No deliberate rule-breaking with meaningful
      risk is required.
    actions:
    - title: Connect the rule to a purpose rather than an identity
      instructions: 'Write the exact optional rule, its intended benefit, and what it costs in an ordinary
        recent situation. For the default: formatting every note may help retrieval, but the unfinished
        formatting prevented saving a useful thought. Ask what observation would show that the rule serves
        its purpose and what would show that it has become excessive. Separate those observations from
        identity claims such as a disciplined person never relaxes a rule. Name whose interests are affected
        and which obligations cannot be waived. Choose a modest revision that preserves the purpose, or
        retain the rule if its benefit and proportionate cost are already clear.'
      checks:
      - The optional rule and its intended purpose were stated separately
      - A recent concrete benefit or cost was identified
      - Purpose-relevant evidence was distinguished from shame or superiority claims
      - Affected interests and non-waivable obligations were respected
    - title: Try a reversible revision while keeping the purpose intact
      instructions: Use the selected ordinary opportunity to try the revised rule. For the default, save
        one readable rough personal note without finishing decorative formatting, then check that you
        can find and understand it. Notice discomfort about relaxing the rule without making comfort a
        success requirement. Keep the trial within the chosen scope and do not use it to pressure someone
        else into changing their standards. Record the actual action, its usefulness, any cost, and whether
        you could freely return to or further revise the rule. If the original rule remains justified,
        test its bounded intended use rather than breaking it merely to prove flexibility.
      checks:
      - A real low-stakes trial of the revised or justified bounded rule occurred
      - The rule’s intended purpose was checked using an observable result
      - Discomfort, cost, and freedom to revise were recorded without a required feeling
      - The trial did not override obligations or impose a standard on another person
    - title: Keep, relax, or retire the rule for stated reasons
      instructions: 'Review the trial now and, when a natural later use occurs within seven days, check
        whether the note or equivalent result still serves its purpose. Decide to keep the original rule,
        use the revision, or retire it. State the reason in terms of health, duty, freedom, or meaning,
        not purity or being better than other people. Preserve an adverse result: a rough note that cannot
        be found may need a simple naming rule rather than perfect formatting or no structure at all.
        If shame, distress, or felt inability to stop dominates, do not escalate the experiment; end it
        and seek appropriate support. An absent later use remains untested.'
      checks:
      - The immediate result and any later natural use were distinguished
      - The final rule decision was justified by purpose and proportionate cost
      - The review allowed structure as well as relaxation without moral ranking
      - Adverse outcomes, a missing later check, and need for support remained visible
    adaptation: Choose an accessible personal rule, such as a preferred order for harmless leisure materials,
      and use voice notes or practical assistance. Retain helpful structure and sensory supports. Do not
      alter treatment, prescribed routines, safety requirements, care duties, or commitments to others
      under this exercise. No exposure to feared consequences or deliberate distress is required. Stop
      when a low-stakes trial becomes distressing, coercive, or hard to discontinue; this is not treatment
      for compulsive behavior.
    review: Which rule version best served the actual purpose, and what evidence would justify revisiting
      it? Name one sign of useful structure and one sign of excessive control. The conclusion should permit
      both keeping a good rule and relaxing an obsolete one without a verdict on anyone’s worth.
    examples:
      supportive: A readable rough note was saved and found at a later ordinary use. The user retained
        a simple title rule but dropped decorative formatting, preserving usefulness without turning relaxation
        into a new compulsory standard.
      mixed: Saving the rough note helped, but it was hard to retrieve later. The user added a simple
        naming convention rather than returning automatically to perfection or rejecting all structure.
      contradictory: The user used the trial to prove superiority over someone with different preferences,
        or felt compelled to keep breaking rules despite harm. The exercise no longer served freedom and
        was stopped or revised.
      inconclusive: The rule was discussed, but no real note or other ordinary result was produced. The
        proposed revision remains an idea, not observed flexibility or proof that the rule is unnecessary.
