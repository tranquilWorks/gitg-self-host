schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '21'
exercises:
  '21.01':
    title: Choose or redesign a work role using more than prestige
    goal: Evaluate a realistic work option through aptitude, livelihood, service, meaning, environment,
      growth, dignity and actual need, then test one important uncertainty.
    scope_note: This is a bounded role-evaluation exercise, not a prediction of career success or an instruction
      to resign, accept a contract or risk essential income.
    burden: Two 25-minute comparisons and one small information-gathering step.
    setup: 'Use the fictional choice between a prestigious role with unclear daily duties and a less visible
      role with clear useful work, or two real options you may safely investigate. Prepare eight headings:
      aptitude, livelihood, service, meaning, environment, growth, dignity and real need. Include staying
      and redesigning the current role as an option.'
    actions:
    - title: Translate each criterion into observable work conditions
      instructions: For each option, describe the actual tasks, necessary income or stability, people
        served, reasons the work matters, daily environment, learning opportunities and conditions affecting
        dignity. Separate what you know from a title’s implied status. Give each of the eight headings
        evidence, a plausible hypothesis or an explicit unknown; do not fill missing compensation or working
        conditions with optimism. Name one constraint you cannot currently trade away without unacceptable
        cost.
      checks:
      - All eight criteria have evidence or explicit uncertainty
      - Daily work is separated from title and status
      - Staying or redesigning is included as a genuine option
      - A non-negotiable livelihood or dignity constraint is stated
    - title: Compare tradeoffs rather than manufacture a perfect winner
      instructions: Identify two benefits and two costs of each option, including what would be forgone.
        Ask which option fits current capacity and what kind of service or need it actually addresses.
        Mark any serious ethical, safety or employment concern for appropriate guidance. Choose the uncertainty
        most likely to reverse your preference, such as whether the role includes the advertised craft
        work or mostly coordination. A high overall score must not cancel an unacceptable condition.
      checks:
      - Benefits costs and opportunity costs are explicit
      - Current capacity and real downstream need affect the comparison
      - Serious concerns are not averaged away
      - One decision-reversing uncertainty is selected
    - title: Run a small reversible information test
      instructions: Use a safe step such as a role-holder conversation, a public work sample or a short
        authorized task shadow to investigate the selected uncertainty. Prepare three questions about
        actual daily work, constraints and who benefits. Record what changed your view and what remains
        unverified, then decide whether to investigate further, redesign, defer or choose. Do not represent
        an exploratory conversation as a job offer or make an irreversible career move merely to finish
        the practice.
      checks:
      - A bounded information-gathering step is completed or clearly rehearsed
      - Questions address actual work rather than prestige alone
      - New evidence updates the comparison
      - The next decision remains proportionate and reversible where possible
    adaptation: Use fictional roles, public role descriptions or a smaller task redesign when access or
      income constraints limit exploration. Keep employer-confidential information and personal financial
      details out of application evidence. Qualified employment, financial or professional advice may
      be needed for real commitments.
    review: Which criterion changed the appeal of the title, and what evidence would make the work itself
      worth choosing or redesigning?
    examples:
      supportive: The participant found that the less visible role offered more relevant craft and service,
        while preserving a necessary income constraint.
      mixed: The preferred role remained attractive, but its daily work was still unclear, so the participant
        chose another information step rather than a premature commitment.
      contradictory: Prestige or a numeric total was used to dismiss an unacceptable safety, dignity or
        livelihood condition.
      inconclusive: Career values were listed without comparing actual work conditions or testing an important
        uncertainty.
  '21.02':
    title: Make a small work commitment another person can plan around
    goal: Demonstrate preparedness, punctuality, organized handoff and honest status communication on
      a bounded deliverable, including an early response when the plan changes.
    scope_note: Use low-stakes authorized work or a fictional practice deliverable. Reliability does not
      mean unlimited availability, concealing uncertainty or promising a deadline you cannot safely meet.
    burden: Ten minutes to agree the commitment, one 20–40 minute work period and a short handoff review.
    setup: Default to preparing a one-page agenda for a volunteer meeting. Agree who receives it, the
      needed information, an accessible format, the deadline and a checkpoint before that deadline. Keep
      any real workplace or client information in approved systems only.
    actions:
    - title: Make the commitment specific enough to rely on
      instructions: Confirm the recipient’s needed outcome, the due time and time zone where relevant,
        the acceptance check and what inputs you require. Inspect your actual capacity before agreeing.
        Gather the permitted materials and put the task and checkpoint in a system you use. State a known
        uncertainty and when you will raise it. Saying yes quickly is not reliability if the recipient
        cannot tell what will arrive or when.
      checks:
      - Outcome recipient deadline and acceptance are explicit
      - Capacity and required inputs are checked before agreement
      - Materials and a tracking method are prepared
      - A known uncertainty has an early communication point
    - title: Report evidence-based status before someone has to chase it
      instructions: At the checkpoint, compare completed work with the agreed endpoint. Send a brief status
        that distinguishes done, in progress, blocked and untested, with the next action and any changed
        forecast. If an input is missing, ask a specific question and propose a feasible alternative rather
        than silently waiting. Do not label a draft complete or hide a likely delay to preserve a dependable
        image.
      checks:
      - The checkpoint occurs before the recipient must chase
      - Done blocked and untested work are distinguished
      - A changed forecast or missing input is communicated early
      - Status is grounded in the actual deliverable
    - title: Deliver and close the handoff honestly
      instructions: Send the agreed artifact through the permitted channel, identifying version, remaining
        limitations and any action required from the recipient. Ask them to confirm that it meets the
        stated need or identify the gap. Correct one bounded issue or agree a revised handoff. Compare
        your original estimate with actual effort and record one change that would make the next commitment
        more reliable. A timely but unusable file is not a successful handoff.
      checks:
      - The artifact is delivered through the agreed channel
      - Version limitations and recipient action are clear
      - The recipient checks usefulness against the original need
      - One estimation or preparation lesson is retained
    adaptation: Use a written, spoken or accessible agenda and a volunteer or personal collaboration when
      employment material is sensitive. A fictional recipient rehearsal can test status wording but not
      actual trust or delivery. Preserve rest, safety and contractual boundaries.
    review: Could the other person make a justified plan from your commitment and updates, and where did
      you make them carry avoidable uncertainty?
    examples:
      supportive: The recipient received a clear checkpoint update and usable agenda on time, with one
        limitation identified rather than hidden.
      mixed: A missing input caused delay, but early notice and an accepted smaller deliverable preserved
        the recipient’s ability to plan.
      contradictory: The participant claimed completion while work remained untested or hid a foreseeable
        delay until the deadline.
      inconclusive: A task was marked done without an agreed recipient, acceptance check or confirmed
        handoff.
  '21.03':
    title: Produce three competent examples of one foundational craft task
    goal: Identify the core knowledge, tools, standards and safety limits of a small craft task and demonstrate
      repeatable acceptable work rather than one impressive attempt.
    scope_note: Choose a safe non-regulated component. This does not authorize professional practice,
      hazardous equipment use or a claim of competence in an entire occupation.
    burden: Twenty minutes to define the standard, three short attempts and a 15-minute comparison.
    setup: 'Use the three complete fictional event briefs in the learning guide: Neighborhood Seed Swap,
      Repair Café Taster and Evening Sketch Walk. Use paper or a familiar text editor. Prepare one notice
      from each brief and check against the supplied F1–F5 accuracy and U1–U2 usability criteria. No event,
      contact route or address is real; keep the notices as practice artifacts. The guide supplies the
      facts, layout example, matching checks and a fresh contact-change retest.'
    actions:
    - title: Identify the field’s basics and bound the sample task
      instructions: Read the guide’s event-notice preparation card, three briefs and F1–F5/U1–U2 standard.
        Identify the knowledge, tool and access method needed to turn supplied facts into a readable notice.
        Use this supplied product specification for the default. Separate mandatory factual accuracy and
        reading access from optional decoration. State that this samples a small communication-design
        component, not an entire profession, a legal notice or regulated work.
      checks:
      - Knowledge tools standard and safety limits are identified
      - Mandatory accuracy and access are separated from polish
      - The sample task is bounded within a broader craft
      - Unassessed professional capability is explicitly excluded
    - title: Complete three independent attempts against the same standard
      instructions: Create a separate notice from each of the three supplied briefs. Keep comparable format,
        tools and support conditions, and verify which brief you are using before entering its facts.
        Preserve the original attempt before checking. Mark an incorrect, omitted or uninspected criterion
        explicitly instead of silently fixing the first result. You may use the blank layout pattern,
        but each notice must use its own facts. These fictional notices are not for real publication.
      checks:
      - Three distinct fact sets are attempted
      - The same standard and comparable conditions are used
      - Errors remain visible in the attempt record
      - No inaccurate notice is put into real use
    - title: Have the work checked and target the unstable basic
      instructions: After preserving all three attempts, reveal each matching check or ask a freely willing
        intended reader to locate the five facts using the supplied standard. Label self-check, external
        review and untested access conditions separately. Inspect F1–F5 and U1–U2 for every output; attractive
        formatting cannot compensate for an incorrect date or missing contact. Identify an unstable basic,
        apply one specific correction and attempt the supplied contact-change retest. If no error was
        found, use the retest to check that a change is propagated accurately. Report only the component
        and conditions actually tested.
      checks:
      - All three outputs receive a consistent check
      - Self-review and external review are distinguished
      - A repeated weakness receives a concrete correction and retest
      - The claim remains limited to the sampled component
    adaptation: Use speech, large print, accessible digital text or another safe foundational task with
      a real standard. Necessary supports are legitimate work conditions. Tasks involving clinical care,
      driving, weapons, hazardous tools or licensed work require appropriate supervision and are not default
      practice material.
    review: Which basic was reliable across all three attempts, and what repeated error matters more than
      the most polished single result?
    examples:
      supportive: All three notices preserved the required facts and reading order, while an unstable
        contact label was corrected and retested.
      mixed: One notice looked excellent, but two contained copied dates; the participant targeted fact
        checking rather than claiming competence.
      contradictory: A small safe exercise was used to claim professional qualification or to justify
        unsupervised hazardous work.
      inconclusive: One attractive output was produced without a fixed standard or repeated attempts.
    instructional_content:
      schema_version: GG-INSTRUCTIONAL-CONTENT-1.0
      competency_id: '21.03'
      title: Produce and check three dependable event notices
      scored: false
      sections:
      - id: preparation
        kind: concept
        title: Turn a brief into a dependable notice
        body: 'The component is extracting required facts, arranging them for a reader, and checking the
          result against a fixed specification. Know which source controls each fact, use a tool whose
          reading order you can inspect, and distinguish accuracy from decoration. A repeatable process
          is: identify the assigned brief; enter its five facts; preserve the first output; check each
          fact against that same brief; inspect reading order and access; then correct and retry. The
          supplied standard is a product specification for this exercise, not a professional credential
          or an accessibility certification.'
      - id: layout
        kind: worked_example
        title: A reusable layout, with new facts each time
        body: 'Use a heading for the event name, then labeled lines for date, start–end time, full location
          and contact. Blank pattern:

          EVENT NAME

          Date: [day month year]

          Time: [start–end]

          Location: [venue and address]

          Contact: [route]


          For an unrelated illustration: Pocket Poetry Hour; 8 August 2027; 14:00–15:00; Maple Reading
          Room, 3 Orchard Road; poetry@events.example. The facts are fictional. In digital text, keep
          this order in the underlying text as well as visually; an image-only notice needs an equivalent
          text version for a text-reading route.'
      - id: standard
        kind: material
        title: The checking standard
        body: 'F1 — Event name matches the assigned brief.

          F2 — Day, month and year match the assigned brief.

          F3 — Both start and end times match the assigned brief.

          F4 — The full venue and address are preserved.

          F5 — The contact route is present and matches the assigned brief.

          U1 — A reader can follow the event name, date, time, place and contact in a clear reading order.

          U2 — The selected format remains legible and usable with the intended access method; record
          what was actually inspected.


          For each criterion record met, not met, or uninspected, with a short fact or location in the
          output. Any F1–F5 failure prevents an accuracy pass, regardless of polish. U1 or U2 uninspected
          means usability remains unverified, not passed. Inspect text order by reading or listening from
          start to finish. For U2, use the format you actually chose: appropriate zoom or text-reader
          access for a digital notice, or the selected large-print/speech method. Record that specific
          condition. A text comparison alone cannot certify every device, reader or print condition. Do
          not invent a fee, booking rule or access claim that the brief does not supply.'
      - id: work-record
        kind: material
        title: Keep the first attempt and its check
        body: |
          Copy this record once for each notice. Keep the notice itself alongside it.

          Brief and first-output filename/page:
          Tool, format and supports used:
          F1 event name: [met / not met / uninspected] — location or discrepancy:
          F2 date: [met / not met / uninspected] — location or discrepancy:
          F3 start and end times: [met / not met / uninspected] — location or discrepancy:
          F4 full venue and address: [met / not met / uninspected] — location or discrepancy:
          F5 contact route: [met / not met / uninspected] — location or discrepancy:
          U1 reading order: [met / not met / uninspected] — how inspected:
          U2 access condition: [met / not met / uninspected] — condition and result:
          Reviewer: [self / freely willing reader] — help used:
          Correction and separate revised-output filename/page:

          Do not turn seven boxes into an average score. One incorrect factual value means
          the first output was inaccurate. An uninspected criterion is unknown. Record the
          corrected result separately so a successful edit does not erase the original error.
      - id: access-check
        kind: material
        title: Inspect the format you actually used
        body: |
          For digital text, read or listen from the event heading through the contact line.
          Check that every fact occurs once in a sensible sequence. Enlarge the text to
          200 percent using your usual application controls and inspect every line for clipping
          or overlap. If a text-reading route matters for your use, inspect the reading order
          with that route too; visually positioned boxes may be read in an unexpected order.
          An image-only notice needs a matching text version. Record the application, enlargement
          and reading route actually checked; another device or assistive tool remains untested.

          For paper, use the intended print size, lighting and reading distance. Read all five
          facts without guessing at cramped or faint characters. Enlarge or simplify the notice
          if that fails, preserve the earlier version, and inspect the revision. A screen preview
          does not establish that the printed copy is usable.

          For speech, state the labeled facts in order and allow a replay. Have a freely willing
          listener repeat back the date, both times, full place and contact if one is available.
          Otherwise record a self-check and leave another listener's usability untested. Necessary
          supports are legitimate conditions; these checks are not an accessibility certification.
      - id: capability-fit
        kind: pathway
        title: Use an appropriately demanding component
        body: The notice route is complete and suitable for practicing a small accuracy-and-presentation
          task. Keep necessary supports present in all attempts. If this is already routine, choose a
          safe component from a craft you actually practice, with three comparable input sets and a real
          recipient or published standard available before beginning. Identify its tools, knowledge, checking
          method and limits; do not substitute a vague goal such as be professional. This alternate route
          requires those real materials and their review, so the supplied notice checks cannot certify
          it. Work requiring licenses or hazardous equipment needs its appropriate established supervision;
          this route grants no authority.
      - id: seed-swap-brief
        kind: material
        title: Neighborhood Seed Swap — supplied brief
        body: 'Neighborhood Seed Swap

          Date: 16 May 2027

          Time: 10:00–11:30

          Location: Willow Community Room, 18 Meadow Lane

          Contact: seed-swap@events.example'
      - id: seed-swap-attempt
        kind: prompt
        title: Neighborhood Seed Swap notice
        body: Prepare one notice using the assigned brief and the fixed standard. Use all five facts in
          a clear reading order, preserve your first output, then open the matching check. Record what
          access condition you inspected.
        references:
        - seed-swap-brief
        - standard
        - work-record
        - access-check
        check_id: seed-swap-key
        attempt_mode: practice
      - id: repair-cafe-brief
        kind: material
        title: Repair Café Taster — supplied brief
        body: 'Repair Café Taster

          Date: 4 June 2027

          Time: 18:15–19:30

          Location: Workshop B, Cedar Learning Centre, 42 Pine Street

          Contact: repair@events.example'
      - id: repair-cafe-attempt
        kind: prompt
        title: Repair Café Taster notice
        body: Prepare one notice using the assigned brief and the fixed standard. Use all five facts in
          a clear reading order, preserve your first output, then open the matching check. Record what
          access condition you inspected.
        references:
        - repair-cafe-brief
        - standard
        - work-record
        - access-check
        check_id: repair-cafe-key
        attempt_mode: practice
      - id: sketch-walk-brief
        kind: material
        title: Evening Sketch Walk — supplied brief
        body: 'Evening Sketch Walk

          Date: 12 July 2027

          Time: 19:00–20:15

          Location: Eastgate, Brook Park, 7 River Road

          Contact: sketch@events.example'
      - id: sketch-walk-attempt
        kind: prompt
        title: Evening Sketch Walk notice
        body: Prepare one notice using the assigned brief and the fixed standard. Use all five facts in
          a clear reading order, preserve your first output, then open the matching check. Record what
          access condition you inspected.
        references:
        - sketch-walk-brief
        - standard
        - work-record
        - access-check
        check_id: sketch-walk-key
        attempt_mode: practice
      - id: retest-input
        kind: material
        title: 'Fresh retest: one changed contact'
        body: 'Use the Neighborhood Seed Swap brief again, with exactly one authorized change: replace
          its contact route with seeds@events.example. Every other fact remains the same. Retain the first
          version and create a separately labeled revised practice notice.'
      - id: contact-retest
        kind: prompt
        title: Contact-change retest
        body: Apply the single supplied change, preserve the revised output and compare every fact against
          the updated brief. Explain which correction or pre-publication check made the change reliable.
          Record an unchanged weakness or error if one remains.
        references:
        - seed-swap-brief
        - retest-input
        - standard
        - work-record
        - access-check
        check_id: retest-key
        attempt_mode: practice
      - id: spot-the-defect
        kind: prompt
        title: Check a plausible but inaccurate notice
        body: |
          Inspect this practice notice against the Neighborhood Seed Swap brief. Use the
          same F1–F5 standard before opening the check; do not judge it by its tidy layout.

          Neighborhood Seed Swap
          Date: 17 May 2027
          Time: 10:00–11:30
          Location: Willow Community Room, 18 Meadow Lane
          Contact: seed-swap@events.example

          Which criterion is not met? Name the authoritative fact, the smallest correction,
          and the remaining facts you would recheck before calling the revised notice accurate.
        references:
        - seed-swap-brief
        - standard
        - work-record
        check_id: defect-key
        attempt_mode: practice
      - id: review-next
        kind: next_step
        title: Target the unreliable basic
        body: 'Compare a 3-by-7 private record: one row per notice, one column per criterion. Identify
          a repeated error, such as carrying a prior date into the next notice, and a specific process
          change, such as reading each source fact back after entering it. Retest that feature using the
          supplied contact change. Keep first attempts and corrected versions separate. Passing these
          three small samples supports only a bounded observation of this component and the conditions
          used; broader craft competence and live audience usability remain untested.'
      checks:
      - id: defect-key
        title: Check the inaccurate notice
        body: |
          F2 is not met: the source says 16 May 2027, but the notice says 17 May 2027.
          Replace 17 with 16 and retain the first output as inaccurate. Then recheck the
          event name, start and end times, full venue/address and complete contact against
          the same brief. A correct-looking heading or all the other facts cannot cancel
          the wrong date. This text comparison checks factual accuracy; U1 and U2 still
          need the relevant reading-order and access inspection on the actual output.
        criteria:
        - Identify F2 and the mismatch between 16 and 17 May 2027.
        - Preserve the original and make the date correction in a separate revision.
        - Recheck F1, F3, F4 and F5 instead of assuming the edit preserved them.
        - Keep uninspected reading-order or access conditions explicitly unknown.
      - id: seed-swap-key
        title: Check Neighborhood Seed Swap
        body: 'Neighborhood Seed Swap

          Date: 16 May 2027

          Time: 10:00–11:30

          Location: Willow Community Room, 18 Meadow Lane

          Contact: seed-swap@events.example


          A correct notice can use different layout and wording for labels, but must preserve all five
          facts. Compare day/month/year, both times, full venue/address and the complete contact route
          character by character. The model above supplies the factual key; apply U1/U2 to the output
          you actually made.'
        criteria: &id001
        - F1 — Event name matches the assigned brief.
        - F2 — Day, month and year match the assigned brief.
        - F3 — Both start and end times match the assigned brief.
        - F4 — The full venue and address are preserved.
        - F5 — The contact route is present and matches the assigned brief.
        - U1 — A reader can follow the event name, date, time, place and contact in a clear reading order.
        - U2 — The selected format remains legible and usable with the intended access method; record
          what was actually inspected.
      - id: repair-cafe-key
        title: Check Repair Café Taster
        body: 'Repair Café Taster

          Date: 4 June 2027

          Time: 18:15–19:30

          Location: Workshop B, Cedar Learning Centre, 42 Pine Street

          Contact: repair@events.example


          A correct notice can use different layout and wording for labels, but must preserve all five
          facts. Compare day/month/year, both times, full venue/address and the complete contact route
          character by character. The model above supplies the factual key; apply U1/U2 to the output
          you actually made.'
        criteria: *id001
      - id: sketch-walk-key
        title: Check Evening Sketch Walk
        body: 'Evening Sketch Walk

          Date: 12 July 2027

          Time: 19:00–20:15

          Location: Eastgate, Brook Park, 7 River Road

          Contact: sketch@events.example


          A correct notice can use different layout and wording for labels, but must preserve all five
          facts. Compare day/month/year, both times, full venue/address and the complete contact route
          character by character. The model above supplies the factual key; apply U1/U2 to the output
          you actually made.'
        criteria: *id001
      - id: retest-key
        title: Check the contact-change retest
        body: 'Neighborhood Seed Swap

          Date: 16 May 2027

          Time: 10:00–11:30

          Location: Willow Community Room, 18 Meadow Lane

          Contact: seeds@events.example


          The previous seed-swap@events.example contact is now incorrect. Changing only the heading or
          labeling the old route revised does not meet F5. Altering the date or location while updating
          the contact creates another factual error.'
        criteria: *id001
  '21.04':
    title: Improve one difficult craft component against an external check
    goal: Target a specific weakness, use informative critique and integrate the corrected component into
      a whole task while preserving the distinction between practice and expertise.
    scope_note: Use a safe skill within your authority and an appropriate external criterion or reviewer.
      One improvement does not establish mastery, talent or transfer to high-stakes work.
    burden: Twenty minutes to select the component, two 10–15 minute attempts, one critique pass and a
      short integration test.
    setup: Default to explaining a three-step borrowing process clearly enough that a willing reader can
      perform it without extra questions. Use fictional items and a private draft. The external check
      is the reader’s actual ability to identify the action order, return location and exception contact;
      the reader is not required to praise the explanation.
    actions:
    - title: Find the weak component from observed performance
      instructions: Make a short baseline explanation and have the willing reader attempt the harmless
        task or compare it with a published authoritative procedure. Identify one unstable component,
        such as an exception instruction appearing before the main action. Choose a difficulty just beyond
        current reliable performance while preserving safety and access supports. Record the criterion
        before revising so success cannot be redefined after seeing the result.
      checks:
      - A baseline uses an external task or authoritative criterion
      - One observable weak component is selected
      - Difficulty is challenging but safe and supported
      - The success criterion is fixed before revision
    - title: Seek specific critique and practice the correction
      instructions: Ask an appropriately skilled reviewer or the intended reader where the explanation
        failed and what information was missing. Distinguish a criterion-based correction from personal
        taste or prestige. Revise only the selected component and rehearse it twice on two fictional item
        examples. Accept a supported correction without treating the reviewer as infallible; where advice
        conflicts with the governing procedure, verify the standard before using it.
      checks:
      - Critique identifies a specific performance gap
      - A correction is distinguished from preference or authority alone
      - The component is rehearsed on two examples
      - Conflicting advice is checked against the governing standard
    - title: Reintegrate and compare the whole task
      instructions: Insert the corrected component into a full explanation and ask the reader to perform
        a new comparable fictional task. Compare the original and new outcomes on the predeclared criterion,
        including new confusion introduced elsewhere. Decide whether to repeat the component, seek more
        qualified critique or increase complexity modestly. Report the observed improvement or lack of
        it; time spent and feeling stretched are not substitutes for a better external result.
      checks:
      - The corrected component is tested within the whole task
      - A new comparable task checks the original criterion
      - Regressions elsewhere remain visible
      - The next practice choice follows observed performance rather than effort alone
    adaptation: Use a public answer key, accessible task simulation or a qualified mentor when a live
      reviewer is unavailable. Mark self-comparison and external critique separately. Do not expose protected
      work, pressure a subordinate to review you or escalate into unsafe difficulty.
    review: Which correction improved the external result, and did it still work when you put the component
      back into the whole task?
    examples:
      supportive: The reader completed the new task with the revised exception instruction and no new
        ambiguity, supporting a narrow improvement claim.
      mixed: The isolated sentence improved, but the whole explanation became confusing; the participant
        returned to integration rather than advancing difficulty.
      contradictory: Effort or a prestigious reviewer’s praise was treated as proof of expertise despite
        unchanged task performance.
      inconclusive: A weakness was named without a fixed external check, targeted correction or integrated
        retry.
  '21.05':
    title: Match craftsmanship to the consequence of a small deliverable
    goal: Produce work whose accuracy, robustness, clarity, documentation and finish fit its purpose,
      then check whether that quality is repeatable rather than performative.
    scope_note: Use a low-stakes authorized artifact. This exercise does not certify safety-critical quality
      or make reputation a score of personal worth.
    burden: Twenty minutes to set quality criteria, one work session and a second-use check.
    setup: 'Default to a reusable meeting-room setup instruction. It must identify the room, arrangement,
      access route, restore-to-normal step and responsible contact. Prepare three quality levels: necessary
      correctness, useful robustness and optional polish. Use fictional details until an authorized owner
      supplies real ones.'
    actions:
    - title: Define the consequence and the appropriate quality bar
      instructions: 'Ask the intended user what failure would cost: confusion, rework, exclusion or a
        more serious consequence outside this exercise’s scope. Set non-negotiable correctness and access
        criteria, then identify robustness features such as an exception contact and a restoration step.
        Decide what visual elegance or finish genuinely helps use and what would only display effort.
        Record the standard before making the artifact so polishing cannot excuse a missing essential.'
      checks:
      - Failure consequence and user purpose are identified
      - Correctness access and robustness criteria are explicit
      - Useful finish is separated from performative polish
      - The quality bar is fixed before production
    - title: Build and inspect the deliverable against the chosen bar
      instructions: Create the instruction, checking facts against the authorized source and writing enough
        context for a person who was not present during preparation. Inspect for ambiguous sequence, missing
        exceptions and unsupported claims of readiness. Use the quality levels to stop unnecessary embellishment
        while correcting essentials. Document one decision where you chose a simpler or more robust form
        because it served the user better, not because it looked more sophisticated.
      checks:
      - Facts are checked against an authorized source
      - Sequence exceptions and restoration are clear
      - Essential defects are corrected before polish
      - A quality tradeoff is documented in terms of use
    - title: Test a second use without your personal rescue
      instructions: Have a willing user apply the instruction to a harmless tabletop setup, then repeat
        with a second comparable case or later use. Observe whether it still works when you do not supply
        missing context. Record defects, corrections and any remaining limitations. Ask whether the user
        could rely on this class of output again, without soliciting a flattering character judgment.
        Consistent useful work supports trust; one elegant demonstration does not prove a durable reputation.
      checks:
      - The artifact is tested in two comparable uses
      - Missing context is not silently supplied by the author
      - Defects corrections and limitations remain visible
      - Reliability is discussed without equating reputation with worth
    adaptation: Use an accessible written, spoken or diagrammed instruction and a fictional room. Real
      safety, building, accessibility or equipment requirements remain with the responsible qualified
      owner. Do not move heavy objects or alter emergency access for a test.
    review: Which part of the finish made the work more useful, and which defect would matter more to
      trust than an impressive appearance?
    examples:
      supportive: The instruction worked in two tabletop uses and included a clear restore step, while
        unnecessary decoration was omitted.
      mixed: The first use succeeded only because the author explained an exception; the instruction was
        corrected before claiming repeatability.
      contradictory: Visual polish concealed an essential error or a safety-critical deliverable was treated
        as approved without qualified verification.
      inconclusive: The artifact looked professional but was never checked against purpose or used without
        the author’s help.
  '21.06':
    title: Let a downstream user change your understanding of the problem
    goal: Identify who is affected by a work product, observe the problem from their side and revise one
      requirement based on actual downstream use.
    scope_note: Use a willing participant and a harmless authorized artifact. This is not market validation,
      covert research or permission to collect client, employee or personal data.
    burden: Fifteen minutes of preparation, one 20-minute observation and a short revision test.
    setup: Default to a meeting invitation that a new participant must use to find the correct location
      and join. Use fictional details and a willing reader unfamiliar with the draft. Prepare headings
      for primary user, downstream helper, affected nonuser, intended task, friction and success.
    actions:
    - title: Map the people affected before asking for opinions
      instructions: 'Identify who uses the invitation, who answers questions when it fails and who may
        be excluded by its format or assumptions. Write the practical task from the user’s perspective:
        know where to go, when to arrive and how to request access. State your current assumption about
        the main problem and what observation would contradict it. Do not substitute a senior stakeholder’s
        preference for every user’s experience.'
      checks:
      - Primary downstream and excluded stakeholders are considered
      - The task is written in the user’s terms
      - An assumption and disconfirming observation are explicit
      - Authority or status is not treated as universal user knowledge
    - title: Observe a task without coaching the answer
      instructions: Ask the willing reader to use the fictional invitation to state the location, arrival
        time and access route. Let them describe confusion in their own words and avoid explaining what
        you meant while the task is underway. Ask a neutral follow-up about the hardest step. Record the
        observable obstacle and their voluntary feedback privately, not identity or sensitive circumstances.
        A compliment about the design is not equivalent to task success.
      checks:
      - A real harmless task is attempted by a willing user
      - The author avoids coaching during the observation
      - A neutral follow-up clarifies the actual obstacle
      - Task performance is distinguished from compliments
    - title: Revise one requirement and verify the downstream effect
      instructions: 'Change the artifact to address the observed obstacle, such as making the building
        entrance explicit rather than adding more decorative detail. Explain which assumption changed
        and which requirement now matters. Ask the reader to retry a new comparable invitation or use
        another willing reader, and check whether the change creates a problem for a downstream helper
        or another access mode. Keep a limited conclusion: this user’s task improved or did not, not every
        customer is now understood.'
      checks:
      - The revision follows an observed need
      - A changed assumption and requirement are recorded
      - A comparable retry tests the change
      - Other downstream effects and limits of generalization are checked
    adaptation: Use accessible formats, an interpreter or a fictional task with a trusted peer. People
      may decline without affecting employment or service. Keep protected workplace, client and personal
      data outside the exercise and follow organizational research permissions.
    review: What did the user need that your internal description missed, and which requirement changed
      because you watched the task rather than asked for approval?
    examples:
      supportive: The reader could not find the entrance, so the author revised that requirement and the
        next task succeeded without coaching.
      mixed: The participant liked the invitation but still missed the time zone; the author treated the
        task failure as more informative than praise.
      contradictory: The author coached success, collected private user information unnecessarily or ignored
        the user because a senior stakeholder preferred the old version.
      inconclusive: Stakeholders were named without observing a downstream task or revising a requirement.
  '21.07':
    title: Prevent a handoff failure by looking beyond your assigned step
    goal: Map the interfaces, incentives, dependencies and constraints around a small workflow and improve
      one failure point with the responsible people’s agreement.
    scope_note: Use an authorized low-stakes process or a fictional workflow. This is not permission to
      bypass organizational authority, access restricted systems or redesign other people’s jobs unilaterally.
    burden: Twenty minutes of mapping, one short coordination conversation and one tabletop or live low-risk
      handoff test.
    setup: Default to an event notice moving from writer to approver to publisher. Prepare a simple flow
      with inputs, outputs, owners, acceptance criteria, waiting points, incentives and recovery. Use
      fictional documents if real work is confidential.
    actions:
    - title: Trace what the next person needs and what the system rewards
      instructions: Map the notice from request to publication, including who supplies facts, who can
        approve and who handles corrections. For each interface, state what must arrive and how the receiver
        knows it is ready. Identify one constraint, such as an approval window, and one incentive that
        may encourage premature completion, such as counting drafts rather than usable notices. Treat
        incentives as hypotheses about behavior, not proof of anyone’s motive.
      checks:
      - Inputs outputs and owners are mapped across the workflow
      - Each interface has a readiness condition
      - A constraint and a possible incentive mismatch are identified
      - System incentives are not converted into personal motive claims
    - title: Confirm the likely failure with the affected owner
      instructions: Choose a specific failure mode, such as the publisher receiving a file with no approved
        version marker. Ask the receiver how they currently detect it and what a useful handoff would
        contain. Compare a small fix, such as an explicit approved-or-draft field, with alternatives and
        added burden. Obtain permission before changing the process and preserve required review. Do not
        solve delay by bypassing the authority whose approval is necessary.
      checks:
      - One concrete interface failure is selected
      - The receiver confirms the actual need or corrects the hypothesis
      - A small fix is compared with its burden
      - Required authority and review are preserved
    - title: Test the interface and check the wider effect
      instructions: Run a fictional notice through the revised handoff or use the next permitted low-risk
        occurrence. Ask the receiver to identify the approved version and the correction route without
        your explanation. Check whether the fix merely moved waiting or rework to another person. Record
        the result and agree who maintains the change. A problem outside your assigned step can be responsibly
        raised without claiming ownership of the entire organization.
      checks:
      - A real or labeled tabletop handoff test occurs
      - The receiver can identify readiness and correction routes
      - Shifted burden or rework is checked
      - Maintenance and authority remain explicit
    adaptation: Use a paper workflow, accessible diagram or written exchange. Do not expose internal organization
      charts, client information, credentials or protected work details. High-consequence systems require
      formal engineering, safety or change-control processes.
    review: Which dependency outside your own task caused the failure, and did your fix improve the whole
      handoff rather than make your step look faster?
    examples:
      supportive: An approval marker let the publisher select the correct file and the team confirmed
        that no extra rework was shifted downstream.
      mixed: The fix reduced one queue but created another; the participant revised it with the affected
        owner.
      contradictory: The participant bypassed review, accessed restricted information or blamed individuals
        for an unverified incentive pattern.
      inconclusive: A process diagram was drawn without confirming a failure mode or testing an interface
        improvement.
  '21.08':
    title: Deliver one small project with evidence of acceptance
    goal: Carry a bounded project from explicit requirements and ownership through risk handling, verification
      and recipient acceptance while making tradeoffs visible.
    scope_note: Use a safe authorized project that fits a short work period. This is not a substitute
      for formal project, safety, procurement or regulated acceptance requirements.
    burden: Thirty minutes to plan, one or two short work sessions and a 20-minute acceptance review.
    setup: Default to a one-page newcomer guide for a volunteer group. Required content is purpose, meeting
      time, location or access route, what to bring and contact for questions. Prepare a small project
      card with scope, exclusions, milestones, owners, risks, tests and an accepting recipient. Use fictional
      details until authorized facts are available.
    actions:
    - title: Agree a deliverable and a test before scheduling the work
      instructions: Confirm the five required information items, the intended reader and the format. Name
        what is out of scope, such as a full website or membership database. Break the work into fact
        confirmation, draft and user check with an owner and realistic date for each. Identify the main
        risk, such as an unconfirmed location, and the decision needed if it remains unresolved. A task
        list alone is not an acceptance agreement.
      checks:
      - Requirements scope and exclusions are explicit
      - Milestones have owners and realistic dates
      - A significant risk has a response and decision owner
      - Recipient acceptance is defined before execution
    - title: Execute while preserving traceable tradeoffs
      instructions: 'Build the guide using confirmed facts and track each requirement as verified, incomplete
        or blocked. When time or an input changes, choose a visible tradeoff with the recipient: defer
        optional polish, reduce scope or move the date. Do not silently remove an essential access detail
        to claim on-time delivery. Keep a short record of the decision and its consequence rather than
        a narrative of effort.'
      checks:
      - Execution tracks each requirement’s actual state
      - Changed inputs or capacity trigger an explicit tradeoff
      - Essential requirements are not silently discarded
      - Decisions and consequences are recorded briefly
    - title: Verify, obtain acceptance and close the remaining work
      instructions: Ask a willing newcomer or equivalent reader to use the guide to answer the five required
        questions, then show the result to the agreed accepting recipient. Distinguish your internal test
        from their acceptance. Correct a bounded defect or record a clear unaccepted item and owner. Hand
        over the editable source, maintenance responsibility and one lesson for the next project. Do not
        call the project complete merely because the file exists.
      checks:
      - The deliverable is tested against all requirements
      - Verification and recipient acceptance are distinct
      - Unaccepted items have explicit status and owners
      - Source maintenance and lessons are handed over
    adaptation: Use an accessible paper guide, audio guide or fictional project simulation. Actual confidential,
      licensed or safety-critical projects must follow their governing process. No public release or purchase
      is required to practice the delivery sequence.
    review: What evidence shows the recipient can use the result, and which tradeoff or remaining item
      prevents an unqualified claim of completion?
    examples:
      supportive: The newcomer answered all five questions, the recipient accepted the guide and a maintenance
        owner received the source.
      mixed: The draft passed internal checks but the recipient needed an access detail; the team kept
        acceptance open until it was corrected.
      contradictory: A missing requirement was hidden, tests were invented or the project was called complete
        without recipient acceptance.
      inconclusive: Milestones were planned but no deliverable was verified or handed over.
  '21.09':
    title: Make a team handoff stronger through contribution and constructive challenge
    goal: Coordinate a useful contribution, raise a relevant concern respectfully, document the handoff
      and share credit in a way that improves the team’s collective reliability.
    scope_note: Use a willing low-stakes collaboration. This is not a team-performance assessment, authority
      to direct peers or a requirement to challenge an unsafe supervisor directly.
    burden: A 15-minute coordination check, one shared task and a 15-minute retrospective.
    setup: Default to two people preparing a small event agenda and invitation. Agree who owns facts,
      wording, approval and sending. Prepare a handoff note with current version, decision, open question,
      next owner and credit. Keep real workplace information in approved systems.
    actions:
    - title: Offer a contribution that reduces an actual team gap
      instructions: Ask what the team needs next and identify one task you can own completely within your
        authority. Confirm the input, output and next person’s dependency rather than picking only the
        most visible work. State your capacity and an early help trigger. Name a useful contribution another
        person is making, including coordination or review work that may not appear in the final artifact.
      checks:
      - The contribution addresses a confirmed team need
      - Inputs outputs and dependencies are agreed
      - Capacity and help triggers are explicit
      - Invisible or supporting contributions are recognized
    - title: Raise one concrete concern without turning it into a status contest
      instructions: During the work, identify a factual issue such as a missing access route or conflicting
        meeting time. State the observation, likely consequence and a possible correction, then invite
        the owner to supply context you may lack. Accept a justified correction to your own view. Document
        the decision in the shared permitted place so the concern does not survive as rumor or private
        resentment.
      checks:
      - The challenge concerns a specific observable issue
      - Consequence and a possible correction are stated
      - The owner can correct missing context
      - The resulting decision is documented transparently
    - title: Close your handoff and review the team effect
      instructions: Deliver the agreed work with its version, limitations and next action, and ask the
        receiver to confirm readiness. Share credit according to actual contributions rather than claiming
        the whole result or erasing your own part. In a short retrospective, identify whether your participation
        reduced rework, confusion or dependency and what you should change next time. Team success does
        not require everyone to agree with your preferred method.
      checks:
      - The handoff is confirmed by the receiver
      - Credit reflects actual contributions
      - Collective rework or clarity is reviewed
      - Method disagreement is separated from team loyalty
    adaptation: Use asynchronous collaboration, accessible shared notes or a fictional two-role rehearsal.
      Do not pressure subordinates to praise you, expose protected information or use the exercise to
      conduct an unofficial performance review. Unsafe power dynamics call for appropriate support.
    review: Did your contribution make the team more capable when you were not explaining it, and was
      your challenge useful rather than merely visible?
    examples:
      supportive: A missing access detail was corrected, the receiver confirmed the handoff and both drafting
        and coordination work received credit.
      mixed: The concern was valid but delivered as a personal criticism; the participant repaired the
        wording and documented the actual issue.
      contradictory: The participant hoarded information, took all credit or treated disagreement as disloyalty.
      inconclusive: A team meeting was attended without an owned contribution, constructive concern or
        confirmed handoff.
  '21.10':
    title: Test whether a process change is better rather than merely new
    goal: Question a work assumption, combine useful ideas and compare a reversible change with the current
      method using a defined benefit and a cost check.
    scope_note: Use a harmless authorized process or simulation. This is not permission to experiment
      on customers, change production systems or claim causality from an uncontrolled single comparison.
    burden: Twenty minutes to define the test, two short baseline uses, two changed uses and a 15-minute
      review.
    setup: Default to finding the latest version among five fictional documents. Compare the current naming
      method with a simple dated version label and a clearly marked current file. Define success as selecting
      the correct file without opening every document, while preserving readable names and avoiding duplicate
      confusion.
    actions:
    - title: State the assumption and the useful outcome
      instructions: Describe the recurring problem and the assumption sustaining it, such as everyone
        remembers which filename is current. Ask what a better outcome would be for the user, not what
        tool would look innovative. Combine two modest ideas, a consistent label and an explicit current
        marker, and predict how they might reduce confusion. Identify a downside such as maintaining the
        marker or making names harder to read.
      checks:
      - A specific assumption and user problem are stated
      - The desired benefit is observable
      - The proposed change combines ideas for a reason
      - A maintenance or usability downside is anticipated
    - title: Compare the old and new methods on equivalent cases
      instructions: Use two fictional file sets with known correct answers for the current method and
        two comparable sets for the changed method. Record whether the correct file is selected and any
        extra checking required. Keep difficulty similar and note learning or order effects rather than
        claiming a controlled experiment. Do not delete real documents or alter a shared production workflow
        merely to create a baseline failure.
      checks:
      - Both methods receive comparable harmless trials
      - Correctness and extra checking are recorded
      - Learning and order effects are acknowledged
      - No real data or production workflow is put at risk
    - title: Keep, revise or reject the change from evidence
      instructions: Compare benefit with setup and maintenance cost, including any new ambiguity. Ask
        a willing user or owner whether the improvement is worth adopting under their constraints. Retain
        a small useful change, revise a mixed one or reject it without treating rejection as failure of
        creativity. Record one lesson about the original assumption and the limits of the test. Novelty
        alone is not a reason to institutionalize the new method.
      checks:
      - Benefits and new costs are compared
      - The affected owner or user informs adoption
      - Keep revise or reject is justified by evidence
      - Useful learning is recorded even without adoption
    adaptation: Use paper cards, accessible filenames or another low-risk reversible process. Follow change-control
      and privacy rules for any real work. A simulation demonstrates a design comparison, not a production
      improvement or general causal effect.
    review: What value did the change create after counting its burden, and what did the test teach that
      enthusiasm for a new idea would have missed?
    examples:
      supportive: The new labels improved correct selection in the test and the owner accepted a low-maintenance
        version of the change.
      mixed: Selection improved but maintaining a separate marker caused errors, so the participant revised
        rather than adopted the whole idea.
      contradictory: A new tool was declared an improvement without comparison, or real user data were
        put at risk for an experiment.
      inconclusive: Ideas were brainstormed without a predicted benefit, comparable trial or adoption
        decision.
  '21.11':
    title: Turn one changing work demand into a transferable capability plan
    goal: Distinguish durable fundamentals from changing tools or market signals and produce a small evidence-based
      adaptation rather than chasing every trend.
    scope_note: This is career learning and capability mapping, not a guarantee of employability, a recommendation
      to buy training or a forecast of an industry’s future.
    burden: Two 25-minute evidence reviews and one 30-minute safe work sample.
    setup: 'Use a fictional change in a role: reports now require an accessible summary, a reproducible
      data check and remote handoff. For a real role, use two current public job or professional sources
      plus one practitioner account with permission, recording dates and uncertainty. Prepare columns
      for changing demand, durable fundamental, current evidence, gap and sample task.'
    actions:
    - title: Separate a dated signal from a durable requirement
      instructions: Identify the technology, industry or social change described by each source and whether
        it is a requirement, preference, advertisement or prediction. For the default, accessibility,
        reproducibility and remote coordination connect to clear communication, numerical checking and
        reliable handoffs. Compare sources rather than treating one job posting as the whole market. Mark
        contradictory signals and avoid assuming that a new tool makes existing knowledge worthless.
      checks:
      - Signals are dated and classified by what they actually claim
      - Technology industry and social changes are considered
      - Durable fundamentals are linked to changing demands
      - Contradictory evidence and market-sample limits remain visible
    - title: Choose one capability gap that can be demonstrated safely
      instructions: Review a non-sensitive prior sample or the supplied fictional task against the new
        demand. Select one specific gap, such as making a calculation reproducible for a remote reader,
        and state what a competent demonstration would contain. Choose a free or already available learning
        resource and a time limit. Do not purchase a course, exaggerate credentials or copy protected
        employer work to create a portfolio item.
      checks:
      - The gap is based on a sample rather than anxiety alone
      - A demonstrable acceptance criterion is defined
      - A bounded accessible learning route is selected
      - Credentials and protected work are not misrepresented
    - title: Create a small transfer sample and update the plan
      instructions: Produce a harmless sample that uses the durable fundamental in the new format, such
        as a short report with its input assumptions, check and accessible handoff note. Ask a willing
        reader or compare against the declared criterion to see whether the new capability is visible.
        Record what you can now demonstrate, what still needs practice and which market signal remains
        uncertain. A small sample supports a narrow claim, not a declaration that you are ready for every
        role using the tool.
      checks:
      - A concrete non-sensitive adaptation sample is produced
      - The sample is checked against the declared criterion
      - Demonstrated capability and remaining learning are separated
      - Employability and broad expertise are not inferred from one sample
    adaptation: Use the supplied fictional role, public-domain material and accessible tools when real
      work samples are restricted. Career constraints, care duties and limited time are legitimate planning
      inputs. Obtain qualified advice for contractual, licensing or high-consequence career decisions.
    review: Which fundamental stayed valuable through the change, and what can you now show rather than
      merely say you are keeping up with?
    examples:
      supportive: The participant linked a new reporting format to durable communication and verification
        skills and produced a checked sample without claiming a new professional credential.
      mixed: Sources disagreed about a tool, so the participant practiced the transferable requirement
        and kept the market conclusion provisional.
      contradictory: Trend anxiety led to unsupported job forecasts, expensive training commitments or
        use of confidential work as a public sample.
      inconclusive: A list of fashionable skills was made without a dated signal, specific gap or demonstrable
        adaptation.
  '21.12':
    title: Connect one ordinary work task to a real beneficiary
    goal: Trace how a small work output serves people, reduces a problem, preserves knowledge or improves
      an institution, then verify one part of that contribution.
    scope_note: Use authorized low-stakes work. This is not a requirement to find a grand calling in every
      job or a justification for harmful work because some benefit can be named.
    burden: Twenty minutes to trace the contribution, one short recipient check and one bounded improvement.
    setup: Default to maintaining an accurate meeting schedule. Draw a short chain from your action to
      the next user, the problem reduced and the wider system served. Include a possible burden or harm,
      such as excluding someone with an inaccessible format. Use neutral role labels and public or fictional
      information.
    actions:
    - title: Trace the benefit without stopping at your own output
      instructions: Describe what you actually do and who uses the result next. Ask what problem becomes
        smaller when the schedule is accurate, what knowledge is preserved and what institutional function
        becomes more reliable. Distinguish a direct observed benefit from a hoped-for distant impact.
        Identify who could be burdened or excluded, and do not use an abstract mission statement to hide
        a harmful consequence of the task.
      checks:
      - The chain reaches a real downstream user or explicit fictional role
      - Problem reduction knowledge and institutional benefit are considered
      - Direct benefit and hoped-for impact are separated
      - Possible burden or harm is included
    - title: Check the claimed benefit with an affected person or record
      instructions: Ask a willing recipient a narrow question such as What does this schedule let you
        do, and where does it still fail you. Alternatively inspect an authorized non-sensitive record
        of a missed or successful handoff. Do not coach the recipient toward gratitude or disclose private
        client information. Compare the response with your original contribution story and retain any
        evidence that the output is less useful than you assumed.
      checks:
      - A recipient or relevant record checks the benefit claim
      - The question invites correction rather than praise
      - Private information and coerced gratitude are avoided
      - Disconfirming evidence is retained
    - title: Make one improvement tied to the verified benefit
      instructions: Change one part of the task that matters downstream, such as adding a clear update
        owner or accessible contact route. Test that specific change and tell the responsible person what
        remains outside your control. Write a brief account of who benefits, by what mechanism and with
        what limitation. If the work’s larger ethics remain troubling, name that unresolved issue rather
        than using one useful change as moral absolution.
      checks:
      - The improvement addresses a verified downstream need
      - The specific effect is checked
      - Limits of personal control are stated
      - A small benefit does not erase unresolved ethical concerns
    adaptation: Use volunteer, domestic, study or fictional work when employment content is sensitive.
      Not every contribution must be public-facing or measurable in money. No one must perform extra unpaid
      work or accept exploitation to make a role feel meaningful.
    review: Who can do something better because of this task, and which part of your contribution story
      became more honest after you checked it?
    examples:
      supportive: A recipient explained that clear update ownership prevented missed meetings, and the
        participant improved that specific part of the schedule.
      mixed: The task preserved records but did not help the intended user as expected; the participant
        revised the benefit claim.
      contradictory: A small benefit was used to excuse harmful conditions or to pressure someone into
        gratitude and extra unpaid work.
      inconclusive: A mission statement was repeated without tracing or checking an actual beneficiary.
  '21.13':
    title: Leave a small process usable when you are absent
    goal: Document decisions, operation, upkeep and recovery well enough that an authorized successor
      can perform a safe task without relying on the original worker’s memory.
    scope_note: Use a harmless authorized process or simulation. This is not permission to share credentials,
      protected work, client data or bypass required training and access controls.
    burden: Thirty minutes to document, one 15-minute successor test and a 15-minute revision.
    setup: Default to updating a fictional group meeting notice from a template. Prepare a handover with
      purpose, location of permitted source, required inputs, steps, decision rationale, checks, common
      failure, recovery, owner and review trigger. Use no passwords or real personal records.
    actions:
    - title: Record the decisions a successor cannot infer from the file
      instructions: Explain what the process is for, which source is authoritative and why the current
        format or sequence was chosen. Identify a rejected alternative and the condition that would make
        it worth reconsidering. List the permissions and knowledge a successor needs, what must not be
        changed and how to recognize a stale instruction. Keep credentials and sensitive data in their
        approved systems, not embedded in the handover.
      checks:
      - Purpose authoritative source and rationale are explicit
      - A relevant alternative and revisiting condition are recorded
      - Permissions prerequisites and change limits are stated
      - Secrets and protected information are excluded
    - title: Teach through a safe attempt rather than a tour
      instructions: Give the handover to a willing authorized peer or use a fictional successor role.
        Ask them to update a new synthetic notice, verify the facts and handle one harmless exception
        such as a missing room number. Do not rescue them immediately with undocumented knowledge; record
        the point where they need clarification and stop any step that exceeds authority. A pleasant walkthrough
        is not evidence that the process can run without you.
      checks:
      - A successor performs a concrete synthetic task
      - A harmless exception tests recovery guidance
      - Undocumented dependencies are made visible
      - Authority and safety boundaries stop inappropriate steps
    - title: Revise and hand over maintenance responsibility
      instructions: Add the missing instruction or decision context revealed by the test, then have the
        successor retry that part. Specify who now owns the document, when it should be reviewed and where
        corrections belong. Confirm that the editable source and permitted access are available without
        your personal account. Record what remains dependent on specialist knowledge or training rather
        than claiming complete independence.
      checks:
      - The handover is revised from the observed gap
      - The failed step is retried
      - Maintenance ownership and review are explicit
      - Remaining specialist dependence is honestly stated
    adaptation: Use an accessible written, audio or diagrammed guide and a private tabletop successor.
      Do not share employer-confidential material or grant access beyond your authority. Formal safety,
      operational and security documentation remains subject to its governing review.
    review: What knowledge stopped living only in your head, and could the next person maintain and correct
      the process without contacting you for every exception?
    examples:
      supportive: A peer updated a new notice and handled a missing input after the handover was revised,
        with a clear maintenance owner.
      mixed: The first test depended on the author’s personal folder, so the team moved the permitted
        source to an authorized shared location.
      contradictory: The handover exposed credentials or claimed independence while omitting essential
        training and approval requirements.
      inconclusive: A document was written but no successor attempted the task or accepted maintenance
        responsibility.
  '21.14':
    title: Choose when enough quality is enough—and when it is not
    goal: Match speed, sufficiency, robustness, elegance, reversibility and exceptional effort to the
      consequence of a deliverable rather than to haste or perfectionism.
    scope_note: Use fictional or low-stakes authorized tasks. This does not permit reduced assurance for
      safety-critical, legal, clinical or regulated work.
    burden: Twenty minutes to classify three tasks, one bounded work session and a 15-minute review.
    setup: 'Compare three supplied tasks: a disposable brainstorming note, a reusable newcomer guide and
      a safety-critical operating instruction that requires qualified formal review. Prepare a quality
      decision card with consequence, reversibility, minimum acceptable result, verification, time budget
      and stop condition. Perform only the first or second task.'
    actions:
    - title: Set a different quality bar for each consequence
      instructions: For the brainstorming note, identify what can be rough because errors are visible
        and reversible. For the newcomer guide, require accurate facts, access and maintainability because
        others depend on it. For the safety-critical instruction, identify the need for qualified standards,
        review and evidence beyond this exercise rather than inventing a quick checklist. Explain where
        elegance helps understanding and where it is optional. Do not use one universal effort level for
        all three.
      checks:
      - Three tasks receive consequence-specific quality bars
      - Reversibility changes the acceptable roughness
      - Reusable work includes maintenance and access
      - Safety-critical assurance is referred to its formal qualified process
    - title: Work to the selected standard with a visible time boundary
      instructions: Choose the harmless note or guide and set a reasonable work period. Produce the required
        content first, check the essential criteria and defer optional polish when the standard is met.
        If an essential fact remains uncertain at the time boundary, mark the deliverable unready or negotiate
        a narrower scope rather than publishing a guess. Record whether your urge to stop or keep polishing
        served the user or mainly relieved your own discomfort.
      checks:
      - Only a safe task is performed
      - Essential criteria precede optional polish
      - An unresolved essential prevents an unqualified ready claim
      - Haste or perfectionism is examined against user consequence
    - title: Inspect the result and revise the quality decision
      instructions: Have a willing reader use the result or check it against the declared purpose. Identify
        one place where more care would matter and one where extra refinement would have little value.
        Compare actual effort with the initial budget and note whether the task was misclassified. Choose
        a next-time rule such as stop after verified essentials for disposable notes or add a second-person
        fact check for reusable guidance. Do not interpret a good outcome as proof that skipped assurance
        was justified.
      checks:
      - The result is checked against its intended use
      - Valuable care and low-value refinement are distinguished
      - The original classification and time budget are reviewed
      - A good outcome does not retroactively justify skipped essentials
    adaptation: Use paper, audio or accessible digital work and shorter sessions. Organizational quality
      standards and professional duties take precedence over the exercise’s time limit. Stop rather than
      improvise when a task’s consequences exceed the safe scope.
    review: Where did additional effort buy real reliability, and where did the urge for speed or perfection
      stop serving the purpose?
    examples:
      supportive: The participant stopped polishing a disposable note but retained fact and access checks
        for the reusable guide.
      mixed: The time budget was too short for required verification, so the guide remained a draft rather
        than being rushed into use.
      contradictory: A safety-critical instruction was treated as good enough under an arbitrary timer,
        or a lucky outcome excused skipped checks.
      inconclusive: Efficiency was discussed without classifying consequence, performing a bounded task
        or checking the result.
  '21.15':
    title: Locate authoritative guidance for one workplace right or obligation
    goal: Identify the relevant jurisdiction, coverage, facts and official guidance route for a workplace
      question without turning a general summary into a personal legal conclusion.
    scope_note: This is employment-law literacy and consultation preparation, not legal advice, a coverage
      determination or an instruction to confront an employer or miss a filing deadline.
    burden: Two 25-minute source checks and one verified information inquiry when a real question is current.
    setup: Use the fictional case of a worker unsure whether a required preparation period is recorded
      as work time. Prepare headings for jurisdiction, work arrangement, dates, issue, source, coverage,
      deadline, safe record and help route. Keep real pay, medical and employer-confidential information
      outside application evidence.
    actions:
    - title: Classify the question and the facts needed to answer it
      instructions: Separate wages and hours from discrimination, accommodation, safety, leave, classification
        and contract questions. Give each area a relevant-or-not disposition for the case rather than
        assuming one agency answers everything. Identify location, sector and work arrangement as facts
        that may affect coverage, but do not decide employee or contractor status from a label alone.
        Record what is known and what a qualified adviser would need without collecting unrelated private
        details.
      checks:
      - All eight workplace issue areas are distinguished
      - Jurisdiction sector and arrangement are identified as coverage questions
      - A contractual label is not treated as a complete classification decision
      - Known facts and missing facts are separated
    - title: Verify the current official route and its limits
      instructions: Locate the relevant labor, equality, safety or other official authority for the jurisdiction
        and inspect its current guidance. Note publication or review date, who it covers and any warning
        that rules or enforcement positions are changing. Check the appropriate deadline and complaint
        or inquiry route directly rather than copying a generic time limit. In the U.S. example, Wage
        and Hour, EEOC, OSHA and labor-relations agencies have different remits; elsewhere use the corresponding
        local authorities.
      checks:
      - The source is official current and jurisdiction-matched
      - Coverage and changing-rule limitations are noted
      - Deadlines are verified for the actual route
      - Different agency remits are not conflated
    - title: Prepare a concise inquiry and a safe next step
      instructions: Write a neutral question with the relevant facts and ask what guidance, coverage test
        or professional help applies. Use the verified channel for a genuine current issue, or rehearse
        with fictional facts only. Keep a permitted accurate record of your own work and communications
        without taking restricted documents or making unlawful recordings. If a real deadline, retaliation
        or safety concern exists, seek timely qualified help; do not wait to complete the educational
        sequence.
      checks:
      - The inquiry contains relevant facts without an unsupported legal conclusion
      - Real contact and fictional rehearsal are distinguished
      - Recordkeeping respects authority privacy and local law
      - Current deadlines and safety concerns trigger timely qualified help
    adaptation: Use accessible agency channels, an interpreter, a union representative or qualified employment
      adviser as appropriate. Official sources may differ by location and worker category. The exercise
      does not guarantee confidentiality, coverage, remedy or protection from practical retaliation.
    review: Which authority can answer this specific question, what coverage fact remains unresolved,
      and what deadline or safety issue prevents casual delay?
    examples:
      supportive: The participant separated a pay-record question from classification and found a current
        official inquiry route without declaring the employer unlawful.
      mixed: An old fact sheet conflicted with a current notice, so the participant asked for clarification
        instead of applying the stale rule.
      contradictory: A generic legal summary was treated as a personal ruling, a deadline was ignored
        or restricted employer records were taken for the exercise.
      inconclusive: Worker rights were listed without a jurisdiction, coverage check or authoritative
        help route.
  '21.16':
    title: Identify exploitative leverage without assuming refusal is equally easy
    goal: Distinguish demanding but fair work from coercive dependence or exploitation and identify a
      realistic safe support route that accounts for unequal power and exit options.
    scope_note: Use a fictional case or private authorized reflection. This is not a legal finding, an
      instruction to resign or a requirement to confront a person who controls income, housing, immigration
      or safety.
    burden: Two 20-minute case comparisons and a 15-minute support-route check.
    setup: 'Compare two fictional arrangements: a clearly paid busy period with agreed limits and a role
      where pay is withheld, safety concerns are dismissed and continued housing depends on silence. Prepare
      fields for demand, agreement, compensation, safety, ability to refuse, retaliation risk, dependency
      and possible remedy.'
    actions:
    - title: Separate hard work from leverage that removes meaningful choice
      instructions: For each case, identify the demanding task and what was freely agreed, then examine
        whether pay, safety, dignity and a realistic refusal route are respected. Consider dependency
        on income, housing, status, references or care without assuming a worker can simply leave. Mark
        wage theft, retaliation and legal classification as questions for qualified guidance rather than
        conclusions from incomplete facts. Do not romanticize endurance or treat every difficult period
        as exploitation.
      checks:
      - Demand and coercive leverage are distinguished
      - Agreement compensation safety and dignity are considered
      - Unequal exit and refusal capacity are explicit
      - Legal allegations remain appropriately qualified
    - title: Map support options by safety and independence
      instructions: Identify a relevant official labor or safety authority, a qualified adviser, a worker
        organization and a trusted personal support route where available. Compare what each can do, what
        information it needs, confidentiality limits and possible practical risks. Do not assume an internal
        manager or human-resources contact is independent of the institution, nor assume an external route
        guarantees a remedy. For immediate danger, prioritize the appropriate urgent safety response over
        documenting a perfect case.
      checks:
      - Multiple support routes have distinct roles
      - Independence confidentiality and practical risk are checked
      - No route is presented as a guaranteed remedy
      - Immediate safety takes precedence over completing evidence
    - title: Choose a bounded next step that preserves options
      instructions: For a real concern, select one appropriate step such as a confidentially framed information
        inquiry through a verified channel or a qualified consultation about safe records and deadlines.
        For the fictional case, rehearse that inquiry without making a report. State what you will not
        do without advice, such as taking restricted documents, making a public allegation or abruptly
        abandoning dependent care. The aim is informed safer agency, not a dramatic refusal that increases
        vulnerability.
      checks:
      - A realistic bounded next step is selected
      - Contact and rehearsal are accurately distinguished
      - Unsafe evidence gathering and premature public allegations are excluded
      - The plan preserves options under unequal power
    adaptation: Use fictional cases when personal reflection or device access is unsafe. Seek appropriate
      legal, labor, safeguarding or emergency support for actual coercion, trafficking, threats or unsafe
      work. No one is scored as deficient for needing income or being unable to refuse immediately.
    review: Which condition changed a demanding arrangement into coercive leverage, and what next step
      respects the worker’s actual ability to choose safely?
    examples:
      supportive: The participant recognized that withheld pay and housing dependence changed the refusal
        options and prepared an appropriate independent inquiry.
      mixed: The first plan assumed the worker could quit; the dependency map led to a safer advice-first
        step.
      contradictory: The worker was blamed for not leaving, or a confrontation was encouraged despite
        foreseeable retaliation and unsafe dependence.
      inconclusive: Exploitation was used as a label without comparing agreement, leverage, safety or
        realistic remedies.
  '21.17':
    title: Compare individual and collective worker voice before choosing a route
    goal: Evaluate mechanisms for improving pay, safety and dignity through their authority, participation
      rules, benefits, costs, legal context and accountability.
    scope_note: This is education using a fictional workplace. It is not organizing advice for a specific
      campaign, a legal coverage determination or a requirement to join, oppose or disclose support for
      a union.
    burden: Two 25-minute comparisons and a 15-minute source-and-question review.
    setup: Use a fictional team concerned about unpredictable schedules. Compare an individual request,
      a joint worker request, a representative committee and collective bargaining through a union where
      legally applicable. Prepare fields for who speaks, who chooses them, scope, consent, legal coverage,
      cost, accountability and possible retaliation risk.
    actions:
    - title: Distinguish the mechanisms and whom they represent
      instructions: For each route, identify whether it conveys one person’s preference, a shared concern
        or a formal bargaining role. Ask how representatives are chosen, how dissent is heard and what
        authority they actually have. Identify potential benefits such as shared information or bargaining
        capacity and costs such as time, dues where relevant or governance burden. Do not assume a union,
        committee or manager automatically represents every worker’s view.
      checks:
      - Four voice mechanisms are distinguished
      - Representation selection and authority are explicit
      - Benefits and participation or governance costs are considered
      - Dissent and nonparticipation remain legitimate
    - title: Verify the legal context without universalizing a familiar rule
      instructions: Inspect current official labor-relations guidance for the relevant jurisdiction and
        sector. Identify coverage limits, protected and unprotected conduct, the right to participate
        or refrain where applicable and the appropriate advice route. In the U.S. example, NLRB guidance
        distinguishes covered private-sector workers from excluded categories; do not apply it automatically
        to public employees, supervisors or contractors. Record unresolved classification or legal questions
        for qualified guidance rather than deciding them from a job title.
      checks:
      - The source matches jurisdiction and sector
      - Coverage exclusions and conduct limits are checked
      - Participation and refusal are considered without coercion
      - Unresolved status questions remain with qualified guidance
    - title: Write a balanced route comparison for the fictional concern
      instructions: Compare which route could address schedule predictability, whose consent or authorization
        is needed and how a proposal would be accountable to affected workers. Include a question about
        enforcement, confidentiality and practical risk rather than promising protection from all consequences.
        State a conditional preference and one fact that would change it. Do not contact coworkers, collect
        political or union views or launch action as part of this case exercise.
      checks:
      - The route comparison addresses the actual scheduling concern
      - Consent accountability and enforcement questions are explicit
      - The preference is conditional on relevant facts
      - No real organizing or collection of workers’ private views is performed
    adaptation: Use accessible official summaries, a qualified labor adviser or a union’s own governance
      documents while distinguishing each source’s role. Workers may legitimately choose different forms
      of voice. Actual action requires current local advice and attention to safety and authority.
    review: Who would the chosen route speak for, how could workers hold it accountable, and which legal
      or practical uncertainty remains unresolved?
    examples:
      supportive: The participant compared an individual request with representative bargaining and identified
        coverage and governance questions before favoring a route.
      mixed: A familiar legal rule did not cover the fictional worker category, so the participant revised
        the analysis rather than applying it universally.
      contradictory: Participation was pressured, private union views were collected or a generic source
        was used to guarantee legal protection.
      inconclusive: Unions were praised or rejected in general without examining representation, costs,
        rights and accountability.
  '21.18':
    title: Remove one irrelevant barrier while preserving the real work requirement
    goal: Distinguish an essential job or task outcome from an unnecessary barrier in tools, communication,
      hiring or advancement, then test an accessible alternative.
    scope_note: Use a low-stakes authorized process or fictional selection task. This is not a legal accommodation
      ruling, disability assessment or permission to alter hiring decisions without authority.
    burden: Twenty minutes to analyze the requirement, one 20-minute alternative design and a short task
      test.
    setup: Use the fictional requirement that a volunteer applicant explain a simple schedule accurately
      in a timed live call. The actual task is to convey five correct facts and answer a clarification,
      not to speak quickly or use a particular accent. Prepare headings for essential outcome, current
      method, irrelevant barrier, alternative, standard and review.
    actions:
    - title: Identify what the work actually requires
      instructions: 'State the five factual outcomes and the clarification skill needed, then ask which
        current conditions are essential and which merely customary: live speech, a short timer, a specific
        tool or an unannounced prompt. Consider barriers in access, language processing, disability, communication
        and opportunity without diagnosing a participant. Check the responsible owner’s authority and
        any governing standard before changing the process. A preferred method should not be called essential
        merely because it is familiar.'
      checks:
      - The essential outcome is stated independently of method
      - Customary conditions are examined for relevance
      - Barriers are considered without diagnosing individuals
      - Authority and governing standards are checked
    - title: Design an alternative that measures the same legitimate outcome
      instructions: Offer a written, signed, supported or asynchronous explanation with the same five
        facts and a comparable clarification question, allowing necessary access supports. Define how
        accuracy and understanding will be checked consistently while removing an irrelevant speed or
        modality demand. Consider how the same principle affects training materials, everyday communication
        and advancement opportunities. Do not lower an essential safety or competence requirement or demand
        medical disclosure to try a broadly accessible design.
      checks:
      - The alternative preserves the legitimate outcome
      - Criteria remain consistent across communication modes
      - Tools communication and progression barriers are considered
      - Access does not require unnecessary medical disclosure or removal of essentials
    - title: Test the process and ask whether the barrier moved
      instructions: Use a willing participant or fictional task to test the alternative, recording whether
        the five facts and clarification can be conveyed. Ask what remains inaccessible and whether the
        change created a new burden, such as requiring an unfamiliar tool. Revise one issue and document
        the reason for the method change. For actual employment accommodations or selection, use the qualified
        organizational and legal process rather than treating this small test as approval.
      checks:
      - The alternative is tested against the same task criteria
      - Remaining or shifted barriers are checked
      - One design revision is documented
      - Formal employment decisions remain with the authorized process
    adaptation: Use accessible task material and allow participants to choose supports without identifying
      a diagnosis. In a real workplace, consult the responsible accommodation, accessibility or employment
      professional. U.S. EEOC examples are not universal legal requirements for every jurisdiction.
    review: Which barrier was unrelated to the real work, and what evidence shows the alternative preserved
      the legitimate standard?
    examples:
      supportive: A written explanation conveyed the same facts and clarification accurately, showing
        that rapid live speech was unnecessary for the sample task.
      mixed: The alternative removed a speech barrier but required an unfamiliar platform; the team changed
        the tool before adoption.
      contradictory: The process demanded a diagnosis, removed a genuine safety requirement or changed
        hiring rules without authority.
      inconclusive: Inclusion was endorsed without identifying an irrelevant barrier or testing an equivalent
        task outcome.
  '21.19':
    title: Close one work period without making work your whole identity
    goal: Set or negotiate a realistic work boundary, preserve necessary handoffs and deliberately participate
      in a valued nonwork role without treating rest as a performance failure.
    scope_note: Use an optional or negotiable low-stakes work demand. This is not advice to abandon essential
      duties, violate an employment arrangement or confront unsafe power dynamics without support.
    burden: Fifteen minutes to prepare, one boundary conversation or rehearsal and one protected nonwork
      period with review.
    setup: Default to a nonurgent request arriving near an agreed end of work. Prepare a response with
      current status, what can wait, the next availability and a genuine urgent route where your role
      requires one. Choose a small nonwork activity connected to health, family, civic life, worship,
      leisure or another freely chosen value.
    actions:
    - title: Separate a real duty from indefinite expansion
      instructions: Identify what the request actually requires, the consequence of waiting and who has
        authority to prioritize it. Distinguish contractual or safety duties from an unspoken expectation
        of constant availability. Review the cost to health, relationships and other valued roles, without
        assuming every role must be active for every person. State a boundary you can control or a prioritization
        question you can safely ask, such as Which existing task should move if this is needed today.
      checks:
      - Duty urgency and authority are distinguished
      - Indefinite availability is not assumed to be essential
      - Costs to freely chosen nonwork roles are considered
      - The proposed boundary or prioritization question is realistic
    - title: Communicate the limit and preserve the necessary handoff
      instructions: 'Use clear wording: The current draft is complete through this section; I can take
        the new request tomorrow at the agreed time. If the matter is genuinely urgent, use the established
        escalation or coverage arrangement rather than ignoring it. For an unsafe or precarious setting,
        rehearse privately and seek appropriate advice instead of direct confrontation. Do not apologize
        for having human limits or promise hidden after-hours work to make the boundary appear accepted.'
      checks:
      - Status next availability and any urgent route are clear
      - Necessary responsibilities have an appropriate handoff
      - Unsafe power conditions change the communication plan
      - The boundary is not secretly canceled by unreported extra work
    - title: Use the protected time and review identity as well as logistics
      instructions: Spend the agreed nonwork period in the chosen activity without turning it into another
        productivity target. Notice an urge to check work or justify your worth through output, and distinguish
        that urge from an actual duty. At the next work period, check whether the handoff held and repair
        any genuine missed commitment. Record what you valued outside work and whether the boundary needs
        adjustment; one restful period does not prove that work-life conflict is solved.
      checks:
      - The protected period is actually used or its failure is recorded
      - Worth is not measured by occupational output
      - Actual duty and checking urges are distinguished
      - Handoff problems are repaired without erasing the boundary
    adaptation: Use a shorter interval, an accessible leisure activity or a supported prioritization discussion.
      People with urgent care, shift or on-call duties should follow their real coverage arrangements.
      Retaliation, labor-rights or health concerns warrant appropriate qualified support.
    review: What remained responsibly covered, what nonwork good received real time, and did you allow
      yourself worth that was not earned by another deliverable?
    examples:
      supportive: The participant gave a clear next availability, preserved the urgent route and spent
        a protected period with a valued nonwork activity.
      mixed: The boundary was stated but repeatedly checked away; the participant adjusted the notification
        and handoff arrangement.
      contradictory: Essential work was abandoned without a handoff, or the participant secretly worked
        through the boundary to avoid disapproval.
      inconclusive: Rest and balance were praised without a specific boundary or any protected nonwork
        participation.
