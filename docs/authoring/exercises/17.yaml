schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '17'
exercises:
  '17.01':
    title: Begin one welcome connection without needing it to produce an advantage
    goal: Approach an acquaintance, peer or neighbor with genuine curiosity and appropriate openness while
      leaving the other person free to keep the interaction brief.
    scope_note: This is ordinary social initiation, not networking extraction, dating pressure or a requirement
      to approach strangers in an unsafe or unwelcome setting.
    burden: Ten minutes to prepare, one brief natural interaction and five minutes to review.
    setup: 'Choose a recurring place you already attend, such as a hobby group, class, common area or
      neighborhood event. Prepare an opening tied to the shared context and one small detail you are comfortable
      sharing. Default opening: I am new to this activity; what have you enjoyed about it?'
    actions:
    - title: Choose a context where conversation can be freely accepted
      instructions: 'Identify a normal social moment rather than interrupting work, isolating someone
        or approaching a person who cannot easily leave. State your intention privately: to learn a little
        about someone, not obtain a favor, contact, sale or approval. Prepare one context-linked question
        and one modest related detail about yourself. Avoid opening with sensitive identity, income, relationship
        or personal-history questions.'
      checks:
      - The setting allows an easy refusal or ending
      - The intention is connection rather than a hidden transaction
      - A relevant question and modest self-disclosure are prepared
      - Sensitive personal questions are excluded from the opening
    - title: Make the opening and follow the actual response
      instructions: Introduce yourself or use the shared context, ask the prepared question and listen
        to the answer. Offer your related detail without turning the exchange into a biography. Ask one
        follow-up only if the response suggests the topic is welcome. If the person is busy, brief or
        uninterested, thank them and return to the activity; the completed action is a respectful attempt,
        not securing a new friend.
      checks:
      - An actual welcome-context opening is attempted
      - Listening and a small contribution are both present
      - A follow-up depends on the person’s response
      - A brief or declined interaction ends without pressure
    - title: Close with an honest level of future contact
      instructions: End by acknowledging something specific from the exchange. When mutual interest is
        apparent, suggest a modest next contact such as talking at the next session, but do not ask for
        private contact details as a default. Review whether you were curious, whether you performed for
        approval and what boundary the other person communicated. Do not treat nonresponse as a verdict
        on either person’s social worth.
      checks:
      - The close acknowledges the actual exchange
      - Any future contact is proportionate and genuinely intended
      - Curiosity and performance pressure are reviewed separately
      - The other person’s response is not converted into a worth judgment
    adaptation: Use an online community with clear norms, text, a mutual introduction or an accessible
      quieter setting. A scripted rehearsal can reduce uncertainty but is not an actual connection. There
      is no obligation to disclose, exchange contact information or continue an unwelcome interaction.
    review: What did you learn about the person that was not useful merely as a transaction, and how did
      you leave them room to choose the interaction?
    examples:
      supportive: The participant asked about the shared activity, learned a preference and ended warmly
        without requesting a favor or contact details.
      mixed: The opening occurred but became a long self-introduction; the next attempt was shortened
        to leave more space.
      contradictory: The person kept pursuing a conversation after a clear refusal or concealed a sales
        request behind apparent friendship.
      inconclusive: An opening was rehearsed privately but no real social opportunity was attempted.
  '17.02':
    title: Decide how to develop one friendship from observed patterns rather than a single impression
    goal: Use reciprocity, trust, compatibility, influence and shared experience to choose a proportionate
      next step in an emerging or established friendship.
    scope_note: This is a private relationship review, not a ranking of people or a secret loyalty test.
      One pleasant or disappointing interaction does not establish a person’s character.
    burden: Twenty minutes to review existing observations, one welcome shared activity and a ten-minute
      follow-up review.
    setup: 'Choose one relationship where contact is welcome and no abuse or coercion is present. Use
      three ordinary interactions you can recall accurately, or wait for enough real experience rather
      than inventing a pattern. Default question: should this acquaintance become a closer friend, remain
      an activity companion or receive a repair conversation?'
    actions:
    - title: Separate observed patterns from hopes and labels
      instructions: For the three interactions, note who initiated, whether commitments were kept, whether
        disagreement was handled respectfully and whether both people could be themselves. Consider shared
        interests, values, practical compatibility and how you tend to behave around each other. Record
        unknowns and situational explanations, including illness, caregiving or workload, instead of using
        response speed as a complete measure of care.
      checks:
      - Several actual interactions support the review
      - Reciprocity trust and respectful disagreement have concrete examples
      - Compatibility and mutual influence are considered without ranking worth
      - Unknowns and capacity-related explanations remain visible
    - title: Create one ordinary opportunity for more information
      instructions: Offer a modest shared activity both people may genuinely enjoy, such as a short walk,
        game or conversation after the usual group meeting. Keep the invitation specific and easy to decline.
        Notice whether participation and small responsibilities are mutually negotiated rather than setting
        a hidden test. Do not manufacture jealousy, disclose a secret as bait or withhold contact to see
        whether the person proves loyalty.
      checks:
      - The activity is a genuine invitation rather than a covert test
      - Both people can shape or decline the plan
      - New observations concern ordinary participation and follow-through
      - No manipulation is introduced to obtain relationship evidence
    - title: Choose deepen, limit, repair or end with a proportionate reason
      instructions: Compare the new experience with the earlier pattern and choose one next step. Deepening
        might mean another shared activity; remaining limited might mean enjoying the existing context
        without expecting intimacy; repair might mean one safe conversation about a specific missed commitment.
        Ending or distance may be appropriate when harm or incompatibility persists. State the reason
        without a global character verdict and keep safety concerns separate from ordinary mismatch.
      checks:
      - The next step follows the combined observations
      - Deepening limiting repair and ending are all legitimate possibilities
      - The reason is specific rather than a whole-person verdict
      - Safety concerns are not minimized as mere incompatibility
    adaptation: Long-distance, low-frequency and disability-adapted friendships can be meaningful; frequency
      alone is not the criterion. Use specialist support rather than this ordinary review for abuse, stalking
      or coercive control. Keep private relationship notes outside the application.
    review: What pattern justifies the chosen level of closeness, and what important uncertainty prevents
      you from making a stronger judgment?
    examples:
      supportive: The participant recognized reliable shared activity but limited mutual interest in deeper
        disclosure and chose to value the friendship at that level.
      mixed: A missed plan initially looked like disinterest, but new information about caregiving led
        to a more flexible expectation rather than a final verdict.
      contradictory: The person staged a loyalty test or treated contacts as ranked assets to keep or
        discard.
      inconclusive: A decision to deepen or end the relationship was based on one message without considering
        context or a pattern.
  '17.03':
    title: Listen, make a specific invitation and follow up with one existing friend
    goal: Maintain a valued friendship through welcome attention, a concrete invitation and a remembered
      follow-up without treating the friend’s response as something owed.
    scope_note: This is a companion to the existing Deepen One Existing Friendship protocol. Its three
      runtime actions, original evidence fields and completion rules are unchanged; these explanatory
      reading checks do not replace them.
    burden: About twenty-five to fifty minutes plus any mutually chosen activity during the existing fourteen-day
      practice; follow up within seven days of the meaningful conversation.
    setup: 'Choose one existing friend you genuinely value and whose contact is welcome. Default context:
      you know they are working toward an ordinary personal goal or adjusting to a busy season. Prepare
      to ask what matters now, not to force depth, solve everything or evaluate reciprocity as a debt.'
    actions:
    - title: Initiate a conversation and primarily listen for at least ten minutes
      instructions: Ask whether a conversation is welcome and invite the friend to choose something currently
        meaningful. Spend at least ten minutes primarily listening, following their pace and asking a
        relevant question rather than redirecting to your own project. Remember a non-sensitive detail
        that can support a later check-in. Their ordinary good news, frustration or interest can matter;
        personal crisis or intimate disclosure is not required. If ten minutes or meaningful sharing does
        not occur, record the actual attempt rather than rounding it up.
      checks:
      - The friend freely welcomes the conversation and chooses its depth
      - At least ten minutes of primarily listening is distinguished from a shorter attempt
      - A relevant follow-up question stays with what matters to them
      - No crisis private disclosure or inflated duration is required
    - title: Offer a specific mutually workable activity and date
      instructions: Use what you know of the friendship to propose a concrete activity and date, such
        as a free walk on Saturday afternoon or a remote game on Wednesday evening. Include an easy alternative
        or decline route and account for distance, money, energy and care responsibilities. Distinguish
        proposing an invitation from actually scheduling it together. Celebration or practical assistance
        may fit the friendship, but neither is a substitute for consent or the legacy action’s specific
        invitation.
      checks:
      - The invitation includes an activity and a date
      - Cost access and capacity are considered
      - The friend can decline or suggest another arrangement
      - A proposal is not reported as a mutually scheduled interaction
    - title: Follow up on what was shared within seven days
      instructions: Within seven days of the conversation, reference the remembered topic in a nonintrusive
        way and ask how it developed. Offer congratulations, practical help or simple presence only when
        it fits the friend’s answer. Accept a delayed or limited response without repeated prompting or
        scorekeeping. Use the application’s original check-in fields honestly; do not upload the friend’s
        private story, treat these companion checks as new measurements or claim that completing the cycle
        proves friendship quality.
      checks:
      - The follow-up refers to the actual earlier conversation
      - It occurs within the existing seven-day boundary or is recorded as late
      - Support or celebration follows the friend’s response rather than an assumption
      - Original evidence fields privacy and completion limits are preserved
    adaptation: Use text, voice, signing, AAC, a free shared routine or an accessible remote activity.
      A lower-intensity contact can be appropriate but must be recorded as what actually occurred, not
      silently substituted for an uncompleted requirement. Defer when there is no suitable existing friend
      or contact is unwelcome.
    review: What did your friend actually receive from this cycle, and how did you remain caring when
      their availability or reciprocity differed from your expectation?
    examples:
      supportive: The participant listened to a friend’s current concern, scheduled a mutually suitable
        walk and checked in on the topic within seven days without storing private details.
      mixed: The conversation and follow-up occurred, but the invitation was declined; it remained an
        invitation attempt rather than a scheduled activity.
      contradictory: The friend was pressured to disclose, repay attention or respond quickly to prove
        loyalty.
      inconclusive: A vague we should catch up message was counted as a substantive conversation, scheduled
        activity and follow-up all at once.
  '17.04':
    title: Ask what kind of support is wanted and deliver one bounded part
    goal: Match support to the person’s stated need and your actual capacity rather than assuming that
      advice, rescue or constant availability is always helpful.
    scope_note: This is ordinary nonprofessional support. Crisis, abuse, medical, legal or other high-stakes
      needs require appropriate qualified help; friendship does not replace those services.
    burden: A ten-minute support conversation, the agreed small action and a five-minute follow-up.
    setup: 'Default case: a friend says an ordinary week has become overwhelming. Prepare six possible
      modes—listening, practical help, encouragement, information, advocacy or space—and a truthful limit
      such as twenty minutes today. Do not assume which mode the person needs from the intensity of their
      message.'
    actions:
    - title: Ask for the support mode and check your capacity
      instructions: Acknowledge what the person actually said and ask whether they would prefer listening,
        a practical task, ideas, encouragement, help speaking to someone or some space. State what you
        can realistically offer and when. For the default, you might say I can listen for twenty minutes
        now or help with one errand tomorrow. Acknowledge needs you cannot safely meet rather than making
        an open-ended promise.
      checks:
      - The person is asked what form of support they want
      - All offered help fits your actual time and competence
      - A limit is stated before an open-ended commitment develops
      - Needs beyond the role are acknowledged rather than hidden
    - title: Do the agreed support without switching modes uninvited
      instructions: Carry out the chosen bounded action. When listening, ask before moving to advice;
        when doing an errand, follow the agreed task rather than reorganizing the person’s life; when
        offering advocacy, obtain permission about what may be shared. If the person asks for space, respect
        the agreed contact boundary. If conditions change, renegotiate promptly instead of disappearing
        or taking control to ensure your preferred outcome.
      checks:
      - The actual action matches the agreed support mode
      - A change to advice advocacy or practical control requires permission
      - Privacy limits are followed
      - Changed capacity is communicated rather than concealed
    - title: Check usefulness and close the commitment clearly
      instructions: At the agreed point, ask whether the support helped with the stated need and whether
        anything should be different next time. Accept that a well-intended action may have been unhelpful.
        Confirm what is complete, what remains and whether another bounded step is both wanted and feasible.
        Route serious or persistent needs to appropriate support without promising to manage the person’s
        recovery or solve everything yourself.
      checks:
      - Usefulness is checked against the person’s stated need
      - Unhelpful effects can be acknowledged without defensiveness
      - Completion remaining need and any next commitment are separate
      - Professional or emergency needs are not absorbed into an unlimited friendship role
    adaptation: Support may be asynchronous, remote, translated or practical rather than verbally expressive.
      The recipient can decline feedback or further help. An unavailable friend is not a practice target;
      use a fictional rehearsal until a welcome opportunity arises.
    review: Did you provide the kind of help the person actually wanted, and where did respecting a limit
      make the support more reliable rather than less caring?
    examples:
      supportive: The friend chose listening rather than advice, received the agreed attention and later
        said that being heard was useful.
      mixed: The errand was completed, but the helper added unsolicited advice and revised the support
        boundary after feedback.
      contradictory: The helper took over decisions, shared private information without permission or
        promised availability they could not sustain.
      inconclusive: Support was offered vaguely but no mode, capacity, action or follow-up was agreed.
  '17.05':
    title: Practice both asking for and receiving a small piece of help
    goal: Share a manageable burden through a direct request, receive help without hidden debt and notice
      whether giving and receiving remain freely chosen.
    scope_note: This is ordinary mutual support, not a repayment contract or a demand that every relationship
      balance in identical units. Essential care and formal obligations require their own arrangements.
    burden: Ten minutes to prepare a request, one small exchange and a ten-minute review after the task.
    setup: Choose a task you can safely ask a willing person to help with, such as reviewing a short invitation
      or carrying a lightweight item where both are comfortable. Define a small scope and a fallback if
      they decline. Do not choose money, hazardous lifting, private credentials or a task that creates
      dependency.
    actions:
    - title: Make a clear request with a genuine no option
      instructions: 'State the exact help, expected time and when it is needed: Could you read this short
        invitation and tell me whether the date is clear before tomorrow? Explain that declining is acceptable
        and keep the fallback available. Notice whether pride makes you disguise the request or whether
        anxiety makes you overstate the need. Neither indirect hinting nor a guilt-based appeal gives
        the other person a fair choice.'
      checks:
      - The request specifies task time and timing
      - The person can decline without guilt or penalty
      - A fallback prevents the request from becoming coercive
      - Pride or anxiety is noticed without turning it into a character judgment
    - title: Receive the agreed help without taking over or creating a debt
      instructions: Allow the person to help in the agreed way and clarify only what is needed for the
        task. Thank them specifically rather than immediately promising an equal favor to erase discomfort.
        If their proposed help exceeds the request, decide together whether it is wanted. When you offer
        help in return at another ordinary opportunity, make it a free offer, not an invoice or a test
        of whether they deserve your support.
      checks:
      - The help stays within an agreed scope
      - Specific thanks do not create an unspoken repayment contract
      - Additional help is accepted or declined explicitly
      - Any reciprocal offer remains voluntary rather than exact scorekeeping
    - title: Review burden, freedom and the relationship pattern
      instructions: 'Ask yourself and, when appropriate, the other person whether the exchange was useful
        and manageable. Distinguish this one request from a longer pattern: unequal capacity can justify
        unequal contributions, while repeated entitlement or refusal to respect limits may need a conversation.
        Choose one adjustment such as asking earlier, narrowing the task or receiving without apologizing
        repeatedly. Do not calculate a friendship balance sheet.'
      checks:
      - Usefulness and burden are reviewed together
      - One exchange is not treated as a complete relationship pattern
      - Unequal capacity is distinguished from exploitation
      - A concrete adjustment replaces numerical scorekeeping
    adaptation: Requests can be written, mediated or limited to information. Receiving care may be a legitimate
      long-term condition and does not require equivalent output to preserve dignity. Declined help is
      not a failed relationship; a fictional rehearsal remains rehearsal.
    review: What made the request and acceptance genuinely free, and what did you learn about dependence
      that neither prideful self-sufficiency nor exact repayment would capture?
    examples:
      supportive: The participant asked clearly, accepted a short review and thanked the helper without
        promising a compensating favor or apologizing for having a need.
      mixed: The request was accepted but arrived too late, so the next adjustment was earlier notice
        and a smaller scope.
      contradictory: The helper treated the favor as leverage or the requester used guilt to make declining
        impossible.
      inconclusive: The person described the value of mutual aid but neither made nor received a concrete
        request.
  '17.06':
    title: Choose a safe limit for a harmful relationship pattern
    goal: Distinguish ordinary mismatch from repeated harm and choose reduced access, support, repair
      or exit without dehumanizing the other person or requiring endless tolerance.
    scope_note: This is a private boundary and support decision, not a diagnosis or a requirement to confront,
      reconcile with or immediately leave an unsafe person. Individualized safety planning may be necessary.
    burden: Twenty minutes for a private or fictional pattern review, one appropriate support contact
      when needed and a ten-minute next-step check.
    setup: 'Use a fictional case when real notes could create danger: an acquaintance repeatedly mocks
      a stated limit, offers an apology and repeats the same conduct at the next gathering. Prepare headings
      for behavior, impact, attempted repair, recurrence, safety and a response you control. Do not store
      allegations or identifying details in the application.'
    actions:
    - title: Describe the pattern and separate its possible meanings
      instructions: Record specific behavior and recurrence rather than a personality label. Distinguish
        incompatibility, a repairable mistake, chronic contempt, manipulation and abuse as different concerns,
        without assuming a checklist can adjudicate the relationship. Note whether the person respects
        no, takes responsibility and changes conduct after a repair attempt. Include safety, retaliation,
        stalking, dependency and access to support; a threat does not need repeated occurrences before
        it deserves attention.
      checks:
      - Behavior recurrence and impact are described concretely
      - Mismatch mistake and repeated harm are distinguished
      - Repair is evaluated by changed conduct rather than apology alone
      - Safety and dependency concerns can override an ordinary repair experiment
    - title: Select a controllable limit and the support it requires
      instructions: For the low-risk fictional acquaintance, a limit might be leaving the conversation
        when mocking begins or attending only group settings. State what you control, what obligation
        remains and what you will not do, such as retaliate or publicly humiliate. For real abuse or likely
        retaliation, do not announce a new limit as an experiment; verify a safe specialist or trusted
        support route and develop an individualized next step through that help.
      checks:
      - The chosen limit concerns your own access or participation
      - Remaining obligations and nonretaliation boundaries are explicit
      - Unsafe contexts are not used for direct boundary experiments
      - Needed specialist or trusted support is actually identified and verified
    - title: Carry out the safe next step and review the effect
      instructions: Implement a low-risk access change only when it is safe and within your authority,
        or make the agreed support contact instead. Record whether the step reduced exposure, created
        an unexpected consequence or needs further support. Do not make the other person’s remorse the
        success condition. A private plan, a contacted advocate and a completed exit are different outcomes
        and must be recorded separately; safety may require a slower or different path.
      checks:
      - A safe action or support contact occurs rather than only an intention
      - Exposure and unintended consequences are reviewed
      - Success does not require the other person to admit wrongdoing
      - Planning support contact and actual exit are not conflated
    adaptation: Use fictional material or a safe device when privacy is uncertain. Housing, caregiving,
      employment and legal duties can complicate distance or exit; obtain appropriate advice. Immediate
      danger warrants local emergency help, and a person is not responsible for another person’s abusive
      choices.
    review: What evidence justified the limit, and did the next step increase safety and agency without
      turning uncertainty into a global verdict or tolerating repeated harm indefinitely?
    examples:
      supportive: The participant recognized repeated non-repair, reduced low-risk social access and used
        a trusted support conversation to check remaining obligations.
      mixed: The planned limit could have triggered retaliation, so direct contact was deferred in favor
        of specialist safety support.
      contradictory: The exercise demanded confrontation with an abusive person or framed continued exposure
        as proof of forgiveness.
      inconclusive: A person was labeled toxic without identifying behavior, safety conditions or a controllable
        next step.
  '17.07':
    title: Make one gathering easier to enter and participate in
    goal: Welcome people through practical information, access, shared resources and low-pressure inclusion
      rather than assuming that an invitation alone creates belonging.
    scope_note: Use a gathering you are authorized to host or help organize. Inclusion does not require
      disclosing someone’s needs, forcing participation or promising access arrangements that do not exist.
    burden: Twenty minutes to prepare, one small gathering or existing-group contribution and a ten-minute
      feedback check.
    setup: 'Default gathering: a small board-game or conversation afternoon using existing space and materials.
      Prepare clear time, location, cost, transport or entry information, food details where relevant
      and a way to ask privately about access. Attendance and participation in each activity remain optional.'
    actions:
    - title: Remove a practical barrier before the invitation
      instructions: Walk through what a first-time guest must know and do from receiving the invitation
        to joining the activity. Check entrance, seating, sensory conditions, communication, timing, cost
        and food information without guessing anyone’s diagnosis or finances. Choose one barrier you can
        actually reduce, such as a confusing entrance or an unexplained game. Ask privately about requested
        accommodations and be honest about limitations.
      checks:
      - The invitation-to-participation route is examined
      - Practical access and resource barriers are considered
      - One feasible barrier reduction is selected
      - Needs are asked about privately without assumptions or false promises
    - title: Welcome without making the newcomer perform
      instructions: At the gathering, greet the guest, explain where useful things are and offer a simple
        way to join, observe or take a break. Introduce people through a shared interest only with appropriate
        permission, not by exposing a personal story. Explain the activity’s basic rules and invite questions
        without making the newcomer prove competence. Offer choices rather than assigning someone the
        role of outsider who must be rescued.
      checks:
      - The guest receives practical orientation and options
      - Introductions respect privacy and consent
      - Rules or expectations are explained without an expertise test
      - Observation breaks and declining an activity remain legitimate
    - title: Ask what helped and correct one exclusion
      instructions: Afterward, ask a willing participant what made joining easier and what remained difficult.
        Listen for practical exclusion you did not notice, such as background noise or an assumption that
        everyone knew the group’s history. Make one correction for the next gathering or acknowledge an
        unresolved constraint. Record what was changed, not a claim that every guest felt included or
        that the gathering was universally accessible.
      checks:
      - Participant feedback is invited without requiring praise
      - An overlooked barrier can be named without defensiveness
      - A concrete correction or unresolved constraint is recorded
      - Host intention is not equated with everyone’s felt belonging
    adaptation: A remote, no-cost, shorter or quieter gathering may fit better than an elaborate event.
      People can help by improving an existing group’s welcome rather than hosting at home. A planning
      rehearsal without guests does not establish actual inclusion.
    review: What did someone become able to do because of your change, and which part of hospitality depended
      on listening rather than anticipating everything yourself?
    examples:
      supportive: Clear entrance directions and a short game explanation let a newcomer join or observe
        comfortably, and later feedback identified a noise issue for the next event.
      mixed: The invitation was welcoming, but the promised access route was not available and needed
        an honest correction.
      contradictory: A guest’s disability or personal history was announced publicly to explain why the
        group should include them.
      inconclusive: An event was planned attractively but practical access and participant feedback were
        never checked.
  '17.08':
    title: Complete a small joint task using different strengths without creating a hierarchy of worth
    goal: Coordinate complementary capabilities, clear interfaces and shared credit so that a joint effort
      benefits from difference rather than merely dividing labor invisibly.
    scope_note: Choose a safe, low-stakes task with willing collaborators. This is not an employment assessment,
      personality typing exercise or authority to assign someone a role against their preference.
    burden: Fifteen minutes to agree roles, a thirty-minute joint task and ten minutes to review the collaboration.
    setup: 'Default task: prepare a one-page welcome guide for a hobby group. One person may know the
      group’s practical details, another may explain clearly and another may notice confusing layout.
      Use at least two willing people, existing materials and a small definition of done: a guide a newcomer
      can use.'
    actions:
    - title: Ask about strengths, interests and support needs before assigning roles
      instructions: State the shared outcome and ask each person what they can contribute, what they would
        like to learn and what constraints affect them. Distinguish a demonstrated capability from a personality
        label or status assumption. Agree roles such as fact checking, drafting and newcomer review, including
        how each person can ask for help or change scope. No role is treated as less dignified because
        it is less visible.
      checks:
      - The shared outcome is agreed before roles are assigned
      - Capabilities interests and constraints are asked rather than inferred
      - Roles and help routes are explicit
      - Visibility or status does not determine the value of a contribution
    - title: Work through a defined handoff and resolve one mismatch
      instructions: 'Create the guide using the agreed roles and a handoff point: verified facts go to
        the drafter, and the draft goes to the reviewer. Check one actual mismatch, such as a room name
        that the reviewer cannot locate, by returning to the responsible fact owner rather than blaming
        the person who noticed it. Share enough context for the next person to work and do not silently
        redo their contribution without discussion.'
      checks:
      - A real task and handoff occur
      - Each person receives the context needed for their role
      - A mismatch is resolved through the agreed interface
      - Corrections do not erase another person’s agency or contribution
    - title: Test the joint result and distribute credit accurately
      instructions: Have a willing newcomer or role-playing reviewer use the guide to answer where to
        go, when to arrive and whom to ask. Correct one issue together. Name each contribution in the
        final acknowledgment with permission, including less visible checking or coordination work. Review
        whether collaboration added value, created avoidable overhead or relied on one person rescuing
        the task, and adjust the next division of work accordingly.
      checks:
      - The joint output is tested against the intended use
      - A correction is made collaboratively
      - Credit includes visible and less visible contributions
      - Added value and coordination burden are both reviewed
    adaptation: Collaborate asynchronously, use accessible formats or choose a smaller task. A solo plan
      can prepare for collaboration but cannot prove complementary teamwork. Do not use confidential work
      or unpaid coercive labor to make the task consequential.
    review: What could the group produce because the contributions differed, and where did an unclear
      handoff prevent that difference from becoming useful?
    examples:
      supportive: The fact expert, writer and reviewer produced a guide that a newcomer could use, and
        the final acknowledgment included the checking work.
      mixed: The guide improved, but one person repeatedly rescued unclear handoffs, leading to a simpler
        role agreement next time.
      contradictory: Roles were assigned from stereotypes or one person claimed the whole result while
        hiding others’ work.
      inconclusive: A group discussed strengths but never completed or tested a shared task.
  '17.09':
    title: Add one sustainable connection setting without treating people as a quota
    goal: Understand the different forms of connection in your life and cultivate one feasible additional
      setting so that all belonging does not depend on one person or place.
    scope_note: This is a social-ecology experiment, not a treatment for loneliness or a requirement for
      a large network. Solitude, few close relationships and different social capacities can all be legitimate.
    burden: Twenty minutes to map settings, one ordinary participation opportunity and a ten-minute review
      after returning or deciding not to return.
    setup: 'Use a private page with five forms of connection: close personal, communal, professional or
      learning, intergenerational and local. Write setting descriptions rather than names in any shared
      record. Default experiment: attend one low-cost recurring interest group that can be reached within
      your actual time and access limits.'
    actions:
    - title: Map what each current setting provides and where it is fragile
      instructions: For the five forms, record present, desired, unchosen or currently inaccessible. Note
        where you receive companionship, practical support, shared purpose or ordinary recognition, without
        expecting one relationship to provide everything. Identify a dependency such as all contact occurring
        through one workplace or partner. Choose one gap that matters to you, not one that merely makes
        the map look incomplete.
      checks:
      - Five forms of connection receive an honest disposition
      - Different functions are not all assigned to one relationship
      - One meaningful dependency or desired gap is identified
      - Unchosen solitude or low social capacity is not scored as a deficit
    - title: Try one recurring setting with a small participation role
      instructions: Verify that the group or activity is open, accessible, affordable and aligned with
        an actual interest. Attend one session or use its legitimate remote route. Aim to learn how participation
        works, greet one person and take a small appropriate part rather than force instant closeness.
        Notice cost, travel, energy, welcome and whether returning would be realistic. Do not claim membership
        or belonging from simply reading the group’s page.
      checks:
      - The setting is checked against actual access and resource constraints
      - A real participation opportunity is attempted
      - The role is small and appropriate rather than an intimacy demand
      - Practical fit and welcome are observed separately
    - title: Choose a sustainable next contact or a reasoned alternative
      instructions: After the attempt, decide whether to return once, try a different setting or defer
        because the burden outweighs the value. If returning, put one realistic next occasion into your
        plan and carry out a small follow-up when appropriate. Compare the new setting’s function with
        existing relationships rather than replacing them or declaring loneliness solved. Persisting distress
        or major isolation may warrant additional support beyond a group experiment.
      checks:
      - A return alternative or deferral has a concrete reason
      - Any follow-up is proportionate to the actual contact
      - The new setting complements rather than automatically replaces existing ties
      - One visit is not presented as resolved loneliness or established belonging
    adaptation: Use a remote group, accessible community service, mutual-interest exchange or a smaller
      familiar setting. Financial, geographic, care and health barriers may be structural rather than
      motivational; choose a feasible route and seek support rather than blaming yourself for unavailable
      opportunities.
    review: What kind of connection did the new setting actually offer, and is returning sustainable enough
      to reduce a real dependency over time?
    examples:
      supportive: The participant found a recurring local activity that offered casual recognition beyond
        work and chose one realistic return date.
      mixed: The group was welcoming but travel and sensory burden made it unsuitable, so the next experiment
        used a closer quieter setting.
      contradictory: People were collected to fill network categories or one visit was declared a cure
        for loneliness.
      inconclusive: A social map was completed without testing any feasible participation route.
  '17.10':
    title: Make one useful introduction only after both people agree
    goal: Maintain community or professional relationships through contribution and trust without treating
      people’s time, contact information or status as assets you can trade.
    scope_note: Use a low-stakes introduction or knowledge offer within your authority. This is not sales
      prospecting, recruiting without consent, access brokerage or disclosure of private contact details.
    burden: Ten minutes to identify a useful connection, two brief consent checks and one follow-up after
      the introduction.
    setup: 'Default case: one hobby-group member wants advice on a beginner project and another has publicly
      offered to discuss that topic. You know both casually. Prepare a one-sentence reason the connection
      might be useful and a clear statement that either person may decline.'
    actions:
    - title: Identify a real need and a contribution that fits
      instructions: Ask the person seeking help what question they actually want answered and what format
        or time commitment would be useful. Check whether the potential helper has relevant knowledge
        and has genuinely offered availability, rather than assuming their expertise creates an obligation.
        Consider whether a public resource would meet the need without consuming another person’s time.
        Do not exaggerate either person’s credentials or promise an outcome.
      checks:
      - The need is stated by the person rather than inferred
      - Relevance and actual willingness are distinguished from status
      - A lower-burden public resource is considered
      - No credentials access or results are exaggerated
    - title: Obtain separate permission before connecting people
      instructions: Privately ask each person whether they would welcome the introduction and what information
        may be shared. Give the topic and expected scope without exposing a private problem. Only after
        both agree, make a short introduction that explains the common topic and leaves them free to continue
        or not. Never add someone to a group chat, mailing list or public thread merely because an introduction
        seems beneficial.
      checks:
      - Both people consent separately before the introduction
      - The shared information stays within agreed limits
      - The introduction states a bounded relevant purpose
      - No automatic group chat list or public exposure is created
    - title: Follow up on usefulness without monitoring the relationship
      instructions: After a reasonable interval, ask only whether the introduction was useful or whether
        any correction is needed. Do not demand details of their conversation, take credit for later outcomes
        or expect a favor in return. Thank anyone who contributed and update your own understanding of
        their availability without maintaining an intrusive dossier. If either person declined, respect
        that and offer a public resource or no further action.
      checks:
      - Follow-up asks about usefulness rather than private conversation content
      - No return favor or credit is demanded
      - Availability is treated as changeable and bounded
      - A declined introduction is not pursued through another channel
    adaptation: A useful public resource, a small knowledge contribution or a consented written introduction
      can fit when live meetings are difficult. Work and institutional contexts may have confidentiality
      and conflict-of-interest rules; follow them rather than using personal access to bypass process.
    review: Did the connection reduce a real knowledge or support gap while preserving both people’s control
      over their time and information?
    examples:
      supportive: Both people agreed to a short topic-specific introduction, and the later check confirmed
        usefulness without collecting their private discussion.
      mixed: The potential helper was unavailable, so the participant shared an appropriate public resource
        instead of pushing the introduction.
      contradictory: Contact details were shared without permission or the introduction was used to create
        a future debt.
      inconclusive: A list of influential contacts was assembled without any genuine contribution or consented
        connection.
  '17.11':
    title: Exchange a practical lesson across generations without assigning one person the expert role
      forever
    goal: Build reciprocal understanding across ages or life stages through both receiving perspective
      and offering something useful, with appropriate boundaries and consent.
    scope_note: Use a willing adult peer, relative or community contact. This is not an unsupervised relationship
      with a child, a substitute for professional mentoring or a claim that age determines wisdom.
    burden: Ten minutes to agree a topic, a twenty-minute exchange and one modest follow-up within two
      weeks.
    setup: 'Choose a person at a different life stage with whom contact is already appropriate. Default
      topic: how each person learned to manage an ordinary transition such as starting a new group or
      moving into a new role. Both may use fictional examples or decline private history.'
    actions:
    - title: Agree a reciprocal question and the limits of the exchange
      instructions: Ask whether the person would enjoy comparing experiences of a chosen transition. State
        that you are interested in their perspective, not treating them as a representative of all older
        or younger people. Agree a short time and a topic that does not require painful disclosure. Offer
        to share something from your own experience or help with a small relevant task, while making clear
        that the exchange need not be equal in identical units.
      checks:
      - The topic and time are agreed voluntarily
      - Age is not treated as a complete explanation of perspective
      - Private history and painful disclosure remain optional
      - Both receiving and contributing are possible without exact accounting
    - title: Listen for context and contribute a different perspective
      instructions: Ask what the person tried, what constraints shaped the choice and what they would
        now do differently. Reflect one lesson and one condition that may not transfer to your situation.
        Share a relevant experience or practical idea of your own and invite correction rather than teaching
        down or dismissing the past. Notice differences in technology, institutions, family responsibilities
        and opportunity without turning them into a contest over which generation had it harder.
      checks:
      - The lesson is linked to its original context
      - A transfer limit is named rather than copying advice wholesale
      - Your contribution is offered as a perspective open to correction
      - Generational comparison does not become a superiority contest
    - title: Apply one appropriate lesson and maintain a small follow-up
      instructions: Choose one safe relevant idea to test, such as introducing yourself to a new group
        before taking on a large role. Carry it out or record why it did not fit. Within two weeks, thank
        the person for the specific perspective and share only what you are comfortable sharing about
        the result. Ask whether another ordinary exchange would be welcome; do not assume ongoing mentorship
        or access from one conversation.
      checks:
      - One lesson is applied or rejected for a specific contextual reason
      - The follow-up refers to the actual exchanged perspective
      - Ongoing contact is invited rather than presumed
      - One exchange is not reported as an established mentoring relationship
    adaptation: Use letters, audio, translation, remote calls or a community program with suitable safeguarding.
      For minors or dependent adults, use the authorized program and appropriate protections rather than
      arranging private unsupervised contact through this exercise.
    review: What did you receive and contribute across the life-stage difference, and which part of the
      advice needed adaptation rather than reverence or dismissal?
    examples:
      supportive: Each person shared a transition lesson, the participant tried one adapted idea and followed
        up without presuming a permanent mentor relationship.
      mixed: The conversation was warm, but the advice depended on opportunities no longer available and
        was retained as perspective rather than copied.
      contradictory: Age was used to demand deference or dismiss someone’s experience as obsolete or naive.
      inconclusive: A biography was collected without reciprocal contribution, contextual reflection or
        follow-up.
  '17.12':
    title: Honor one inherited or communal duty without accepting an unlimited obligation
    goal: Understand a responsibility attached to family, kin, neighborhood or community membership and
      carry a fair bounded part while identifying harm, exploitation and conscience limits.
    scope_note: This is a reflection and ordinary contribution exercise, not a determination of legal
      caregiving duties, religious authority or family entitlement. Essential care and safety cannot be
      withdrawn as a test.
    burden: Twenty minutes to clarify the duty, one bounded contribution or safe consultation and a ten-minute
      review.
    setup: 'Default case: a recurring family or neighborhood gathering relies on the same few people to
      prepare and clean up. You have some inherited expectation to help, but limited time. Use a non-sensitive
      account of the task, who benefits, who bears the work and what you can realistically contribute.'
    actions:
    - title: Name the obligation’s basis and the people it affects
      instructions: Describe whether the expectation comes from care, shared history, explicit agreement,
        tradition, role or legal requirement, marking any legal question for qualified advice. Identify
        the good it protects and the actual burden distribution, including invisible planning. Ask an
        appropriate willing person how the duty is understood rather than assuming your interpretation
        is universal. Distinguish legitimate dependence from an unlimited claim on your time or conscience.
      checks:
      - The obligation’s basis and protected good are identified
      - Visible and invisible burdens are considered
      - The community’s interpretation is checked respectfully
      - Legal uncertainty and unlimited claims are not silently accepted
    - title: Offer a bounded contribution and clarify the limit
      instructions: For the gathering, offer a concrete share such as preparing one item or cleaning for
        thirty minutes, with a realistic time and backup if you cannot attend. State any limit respectfully
        and propose another fair route when possible. Do not frame all inherited duties as oppression
        or all refusal as selfishness. If the expectation involves harm, coercion or a serious conscience
        conflict, seek appropriate support instead of performing it to prove loyalty.
      checks:
      - The contribution is specific and feasible
      - The limit is stated without denying the underlying relationship
      - A fair alternative or backup is considered
      - Harm coercion and conscience conflicts can require support or refusal
    - title: Complete the agreed part and review fairness over time
      instructions: Carry out the contribution or the safe consultation you selected. Confirm that the
        responsible people know what is complete and what remains unassigned. Review whether your action
        reduced a real burden or merely made you appear dutiful while someone else absorbed the hidden
        work. Choose one future adjustment, such as rotating preparation roles, without claiming authority
        to redesign the whole community unilaterally.
      checks:
      - The agreed contribution or consultation actually occurs
      - Remaining work is not silently shifted to someone else
      - Fairness is reviewed beyond visible performance
      - A future adjustment respects shared authority
    adaptation: A remote, administrative, financial-within-means or occasional contribution may fit better
      than physical presence, but it must be genuinely agreed. For care, housing, immigration, inheritance
      or legal obligations, obtain qualified advice rather than relying on this general exercise.
    review: What legitimate communal good did you help sustain, and where did a clear limit prevent duty
      from becoming exploitation or a violation of conscience?
    examples:
      supportive: The participant completed a defined cleanup role and helped make the remaining tasks
        visible so the same relative did not absorb them unnoticed.
      mixed: The offer was useful but the time limit was never communicated, leading to a later clarification
        rather than silent resentment.
      contradictory: The person used tradition to justify harm or withdrew essential care to demonstrate
        independence.
      inconclusive: The duty was either accepted without limits or dismissed without understanding its
        purpose and burdens.
  '17.13':
    title: Keep one friendship conversation honest across a real difference
    goal: Name a meaningful disagreement while maintaining care, curiosity and boundaries, without turning
      the friendship into a conversion project or pretending the difference does not exist.
    scope_note: Choose a willing safe disagreement. Respect does not require accepting dehumanization,
      abuse or threats, and no one must debate their own dignity or disclose an identity to complete the
      practice.
    burden: Ten minutes to agree a boundary, a fifteen-minute conversation and one ordinary follow-up.
    setup: Use an existing friend with whom a difference in religion, politics, class experience, identity
      or lifestyle can be discussed safely. A supplied low-stakes default is different views on how much
      a person should prioritize career ambition over leisure. Agree that the aim is understanding, not
      reaching consensus.
    actions:
    - title: Define the difference and what is not up for debate
      instructions: State your own position in two sentences and identify the practical or moral question
        on which you differ. Ask whether the friend is willing to discuss it and what topics or language
        should be avoided. Distinguish disagreement about a claim or choice from denying someone’s dignity
        or safety. Choose a time limit and a way to pause if the conversation becomes hostile or personally
        exposing.
      checks:
      - A specific difference is named rather than a whole identity category
      - The friend freely agrees to the conversation
      - Dignity privacy and safety boundaries are explicit
      - A time limit and pause route are agreed
    - title: Represent each view before offering a challenge
      instructions: Invite the friend to explain what their position protects or fears losing. Reflect
        the account and ask whether it is fair. Then explain your own reasons, including a cost or uncertainty
        in your view, and invite one question. Ask about one genuine point of tension without setting
        a trap or assembling a rebuttal while they speak. Shared care does not require disguising a substantive
        disagreement as merely different wording.
      checks:
      - The other view is checked for fair representation
      - Your own reasons include a real cost or uncertainty
      - Questions seek understanding rather than a concession trap
      - A substantive disagreement may remain after clarification
    - title: Name what remains different and continue ordinary care
      instructions: At the end, summarize one thing understood better and one point still unresolved.
        Agree whether and how the topic may be revisited, or set it aside without pretending agreement.
        Follow through on an ordinary friendship action unrelated to winning the debate, such as the already
        planned activity or a caring check-in. If the exchange revealed harmful conduct, choose a proportionate
        boundary or support route rather than using tolerance as a reason to ignore it.
      checks:
      - Improved understanding and remaining disagreement are both stated
      - Future discussion is optional and bounded
      - Ordinary care is not made conditional on persuasion
      - Harmful conduct is not excused as mere difference
    adaptation: Use writing, a narrower topic or a fictional comparison when live discussion is not welcome.
      Deep differences can limit a relationship’s scope; preserving conscience may sometimes require distance.
      This practice does not obligate friendship across every disagreement.
    review: Could you name the disagreement truthfully while still treating the person as more than a
      position to defeat, and what boundary remained necessary?
    examples:
      supportive: The friends understood the goods behind each other’s priorities, retained a real disagreement
        and continued their planned activity without a conversion demand.
      mixed: The discussion clarified reasons but became tiring, so both agreed not to revisit it soon.
      contradictory: One person demanded that the other debate their dignity or made affection conditional
        on adopting the same view.
      inconclusive: The difference was avoided or minimized so completely that no honest understanding
        was tested.
  '17.14':
    title: Contribute to a group while stating one principled disagreement
    goal: Participate loyally in a chosen community without hiding an important concern or demanding that
      every member think and live the same way.
    scope_note: Use a safe, low-stakes group issue and an authorized channel. This is not a requirement
      to expose yourself to retaliation, breach confidentiality or remain in a harmful organization.
    burden: Fifteen minutes to prepare, one contribution and one appropriate expression of concern, followed
      by a ten-minute review.
    setup: 'Default case: a hobby group wants every member to attend an expensive annual event. You value
      the group but believe cost and availability should allow an alternative. Use the group’s actual
      decision process or a fictional rehearsal, not a surprise public confrontation.'
    actions:
    - title: Separate the group’s purpose from a contested expectation
      instructions: Write what you genuinely value and contribute to the group, then identify the specific
        expectation you question. State the good the rule may protect, such as shared experience, and
        the cost it may impose, such as excluding members with limited resources. Check whether the expectation
        is a formal rule, an informal norm or your assumption. Identify the proper decision or feedback
        channel before acting.
      checks:
      - The group’s valued purpose is distinguished from one contested norm
      - Both the rule’s intended good and its cost are considered
      - Formal rule informal norm and assumption are separated
      - An appropriate channel for concern is identified
    - title: Make a contribution and express a bounded alternative
      instructions: Complete a real agreed contribution to the group without using it as payment for being
        heard. Through the appropriate channel, state the concern and propose an alternative, such as
        a low-cost local activity or optional attendance, explaining how it could preserve the shared
        purpose. Invite disagreement and acknowledge implementation costs. Do not speak for absent members
        or demand public declarations of loyalty from others.
      checks:
      - A genuine contribution occurs independently of the disagreement
      - The concern includes a workable alternative and its costs
      - The proposal uses the group’s appropriate channel
      - Other members are not conscripted into a public loyalty test
    - title: Choose continued participation, a limit or exit from the actual response
      instructions: Record whether the group considered, accepted, rejected or deferred the proposal and
        how dissent was treated. Decide whether you can continue with a stated limit, seek another authorized
        review or leave. Preserve the dignity of members who choose differently and do not pretend your
        concern vanished merely to remain accepted. If retaliation or coercion appears, prioritize support
        and safety rather than escalating the exercise.
      checks:
      - The actual response to the concern is recorded
      - Continued participation and conscience limits are considered separately
      - Acceptance is not purchased by pretending agreement
      - Retaliation or coercion changes the response to support and safety
    adaptation: Use private written feedback, a representative or an anonymous channel only when its limits
      are understood. Some groups have legitimate role requirements; not every disagreement requires changing
      them. A fictional exercise cannot prove that a real community tolerates dissent.
    review: What did loyal contribution and honest disagreement each require, and did the group’s response
      leave room for both belonging and conscience?
    examples:
      supportive: The member completed their volunteer task, proposed a lower-cost alternative and remained
        involved with an explicit attendance limit after a respectful disagreement.
      mixed: The concern was heard but rejected; the member chose a narrower role rather than falsely
        claiming agreement.
      contradictory: The group or participant demanded sameness as proof of loyalty or punished members
        for a safe principled concern.
      inconclusive: The person complained privately but neither contributed, used an appropriate channel
        nor chose a clear boundary.
