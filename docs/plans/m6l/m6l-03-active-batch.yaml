schema_version: 1
batch:
  id: M6L-03-DIRECTION-CONNECTION
  title: Connect a practice to an explicitly chosen direction
  goal: Choose and revise a private practice intention, display it in setup and weekly planning, and offer
    a concise direction review with preserved history.
sources:
  product: gitg-self-host
  requirements:
  - docs/PRODUCT_DECISIONS.md#decision-046
  - docs/plans/m6l/README.md
  - docs/plans/m6l/actions.yaml
  milestone: M6 Phase F / M6L-03
  baseline_commit: 80faeac57c183ce9038d3479a60f0ec0a6a59e97
dependencies:
- M6L-01
- M6L-02
scope:
  allowed_paths:
