acceptance:
- Explicitly select a saved priority or authored intended outcome, or record unknown/declined; no private-prose
  interpretation, ranking or scoring change.
- Setup and weekly planning display the current user-chosen connection, allow revision, and preserve every
  prior choice in its own assessment/practice scope.
- Concise owner-initiated review edits mission, anti-goals, priorities and twelve-month direction while
  retaining principles, audit responses and prior revisions.
- Validate ownership, epoch, stale forms, immutable revisions, source priority provenance and corrupt
  records; private narrative stays out of shared exports and recommendations.
- Add new records to owner archive/deletion and backup integrity, with an additive migration and operational
  rollback guidance.
validation:
  local:
  - Focused Django and browser journeys
  - scripts/agent-verify.sh full
  - MANIFEST and scope checks
  - Desktop/mobile screenshot inspection
  focused_tests_to_add:
  - Choice states, saved priority provenance, revision history and stale writes
  - Concise review preserves other Personal OS fields; owner/epoch isolation and corruption fail closed
  - Setup and weekly integration, lifecycle, desktop/mobile browser journey
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - Changing a priority silently retargets a practice.
  - "Concurrent edits overwrite intentions or disclose another owner\u2019s private text."
  - New records are omitted from archive, deletion or backup checks.
  stop_conditions:
  - Protected source or historical data drift
  - Private authored text exposed outside existing surfaces
  - Changed assessment, context-priority or scoring mathematics
rollback:
  strategy: Revert UI and service callers; retain additive table and private revisions. Before migration
    rollback export/backup new data; do not drop the table with retained owner records.
evidence:
  output:
  - docs/evidence/M6L-03-DIRECTION-CONNECTION-20260929.md
  claim_boundary: Software and synthetic browser validation only; no new participant or specialist evidence,
    merge, release or live data operation.
