schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '11'
exercises:
  '11.01':
    title: Find and correct one mismatch between a stated priority and usable time
    goal: Distinguish where time actually goes from when usable energy is available, then change one recurring
      allocation that conflicts with an endorsed priority.
    scope_note: A three-day sample is a local audit, not a measure of personal worth or a complete account
      of seasonal workload, disability, unpaid care or structural constraint.
    burden: Three two-minute daily reconstructions, one 15-minute comparison and a short repeat on the
      next comparable day.
    setup: 'Use paper or a private note. Default: reading is an endorsed priority, but its evening slot
      repeatedly becomes exhausted scrolling. Make four columns: approximate block, actual activity, usable
      energy low/medium/high, and chosen or constrained. Include sleep, care, travel, maintenance and
      unstructured rest rather than treating them as missing productivity.'
    actions:
    - title: Reconstruct three ordinary days without continuous tracking
      instructions: At the end of each day, reconstruct the major blocks from memory or an existing calendar;
        do not install monitoring. Mark uncertain durations as ranges. Record the energy you actually
        had and whether each block was freely chosen, required or interrupted. For the default, distinguish
        an available evening hour from an hour in which reading was realistically accessible.
      checks:
      - Three ordinary days or clearly stated missing days are represented
      - Actual activities are separate from planned activities
      - Energy and unavoidable constraints accompany the time estimates
      - Uncertainty and restorative time are retained rather than erased
    - title: Identify one actionable allocation mismatch
      instructions: Choose one endorsed priority and compare its actual share with its access to usable
        energy. Name both an external constraint and a choice under your control. For the default, test
        ten minutes of reading after lunch rather than borrowing from sleep. Specify the block being moved
        or shortened, what will not be displaced, and a reason this tradeoff fits the present season.
      checks:
      - A stated priority is compared with actual time and energy
      - External constraints are not relabeled as poor discipline
      - One controllable allocation changes with an explicit tradeoff
      - Sleep care and essential obligations remain protected
    - title: Try the revised allocation and inspect its real cost
      instructions: On the next comparable day, attempt the changed block and record its actual start,
        approximate duration and energy. Check the displaced activity and any spillover into another responsibility.
        Keep, shrink, move or reverse the change using this comparison; a successful ten-minute block
        does not prove that every evening can now be reclaimed.
      checks:
      - The changed allocation is actually attempted or remains untested
      - Actual use is compared with the original mismatch
      - Displaced work and spillover costs are inspected
      - A concrete retain revise or reverse decision follows
    adaptation: Use broad blocks, symbols, voice notes or a support person instead of minute-level logs.
      For highly variable capacity, compare similar-capacity days. If no discretionary block exists, document
      the constraint and a legitimate request for help rather than manufacture free time.
    review: Did the new slot give the priority usable attention without exporting its cost to health,
      care or another person?
    examples:
      supportive: A ten-minute lunch reading block occurred twice without shortening sleep; the evening
        slot became deliberate rest.
      mixed: Reading happened, but the displaced errand moved onto a partner, so the allocation needs
        renegotiation.
      contradictory: Necessary care or disability-related recovery was labeled wasted time and removed
        to improve the chart.
      inconclusive: A perfect weekly schedule was drawn without observing actual time or testing any changed
        allocation.
  '11.02':
    title: Choose what comes first when five legitimate demands compete
    goal: Build a defensible priority order across obligations, relationships, projects, maintenance,
      growth and leisure, including what must wait and what cannot be traded away.
    scope_note: The order serves one limited planning window. It is not a universal hierarchy in which
      paid work outranks care, leisure is expendable, or every urgent request creates an obligation.
    burden: Twenty minutes to rank one week and ten minutes after the first real conflict.
    setup: 'Default case: this week contains a promised application review, a leaking-container replacement,
      a friend visit, an elective course lesson and a game night. Available discretionary time is four
      hours, not enough for all five at full size. Use the criteria already supplied: real obligation,
      consequence of delay, deadline credibility, affected people, value and available capacity.'
    actions:
    - title: Separate genuine obligations from persuasive requests
      instructions: List up to six live demands and record the promise, duty or reason behind each. Identify
        any non-negotiable safety or care floor before ranking discretionary work. For the default, ask
        whether the application review was actually promised and when it is needed; a loud message alone
        is not proof of priority. Estimate a realistic minimum duration for each demand.
      checks:
      - The duty or reason behind each demand is explicit
      - Safety care and essential maintenance floors are identified
      - Deadline credibility is checked rather than assumed
      - Minimum durations make the capacity conflict visible
    - title: Rank the demands and name the sacrificed version
      instructions: Use the supplied criteria to choose a first action, a next action, one reduced version
        and at least one deferral. Explain a close tradeoff rather than hiding it in a weighted total.
        The default might retain the promised review and friend visit, replace the leaking container briefly,
        defer the lesson and shorten game night. Record who must be told and when the deferral will be
        reconsidered.
      checks:
      - A first next reduced and deferred disposition is assigned
      - The total plan fits the stated capacity
      - A close tradeoff and its sacrificed benefit are named
      - Affected people and reconsideration dates are identified
    - title: Use the order in a real collision and revise openly
      instructions: When two demands compete, consult the order before accepting more work. Carry out
        the selected next action or communicate the deferral to the affected person. At week end, compare
        what happened with the ranking, including an interruption that legitimately changed it. Revise
        the criteria or available capacity instead of pretending the original plan was followed.
      checks:
      - The ranking guides an actual choice or remains a labeled case exercise
      - A deferral or reduction is communicated where needed
      - Unexpected obligations and ranking changes remain visible
      - The next priority order uses the observed constraint
    adaptation: Use cards, a spoken comparison or a two-choice version when six items are overwhelming.
      Rank jointly where responsibilities are shared. In poverty or unsafe dependency, distinguish the
      constrained choice set from individual preference; do not create a refusal that risks essential
      support.
    review: Which criterion actually decided the conflict, and what valuable activity must receive a protected
      later opportunity?
    examples:
      supportive: The promised review was delivered and the lesson deliberately deferred with a new date;
        the friend visit remained protected.
      mixed: The ranking was coherent, but travel time made the four-hour plan infeasible and one item
        needed an early renegotiation.
      contradictory: Leisure and another person’s unpaid care were silently treated as infinitely available
        capacity.
      inconclusive: Every demand was labeled top priority, so the first actual conflict had no usable
        decision rule.
  '11.03':
    title: Define a goal that could honestly be achieved, rejected or revised
    goal: Specify an outcome, its reason, constraints and observable success criteria so that progress
      can be judged without confusing activity with value.
    scope_note: This defines one bounded goal. A measurable target can still be misguided; neither precision
      nor completion proves that a life direction is worthwhile.
    burden: Twenty minutes for a goal card and one 15-minute test of its first deliverable.
    setup: 'Use the default of making a shared kitchen shelf easier to use, not the vague target become
      organized. The goal card has five supplied lines: by when, changed condition, evidence, protected
      constraints and why this matters. A default endpoint is that the three most-used items can be found
      and returned by willing household members without moving unrelated objects.'
    actions:
    - title: Write the changed condition and the reason it matters
      instructions: 'Describe who benefits and what observable condition should differ when the goal is
        complete. Separate the outcome from the method: buying containers is one possible method, not
        the endpoint. Give a modest review date and name the underlying reason, such as easier shared
        access rather than an impressive photograph. Ask whether that reason still matters under current
        responsibilities.'
      checks:
      - The desired changed condition is distinct from the activity
      - The beneficiary and reason are stated without assuming consent
      - A review date bounds the goal
      - The reason is checked against the present context
    - title: Set success evidence and protected constraints in advance
      instructions: 'Choose two or three observable tests before acting. For the shelf, test finding the
        three items, returning them and preserving access to medication or required equipment. Set a cost
        ceiling, permission boundary and maximum disruption. Add a failure or stop condition: do not rearrange
        another person’s necessary items without agreement. Define what partial success would look like.'
      checks:
      - Two or three observable tests are fixed before the attempt
      - Cost permission and disruption constraints are explicit
      - Partial success is distinguishable from full success
      - A failure or stop condition prevents target chasing
    - title: Attempt the smallest deliverable and challenge the goal itself
      instructions: Make one reversible change within the boundary and run the tests with a willing user
        or through clearly labeled self-review. Record both results and burden. Decide whether to continue
        toward the endpoint, revise an unrealistic criterion or abandon a goal whose benefit is too small.
        Keep the original criterion visible when revising it so a miss is not rewritten as success.
      checks:
      - A smallest useful deliverable is actually attempted
      - Predetermined tests and burden are checked
      - Any criterion revision preserves the original version
      - Continuation revision or abandonment follows the observed value
    adaptation: Use spoken, tactile or picture-based tests and preserve established accessibility layouts.
      A fictional shelf case can practice goal definition but not demonstrate household usability. Where
      other people are affected, obtain agreement before changing the shared environment.
    review: Did the goal measure the benefit you meant to create, and what would justify stopping even
      before the target is reached?
    examples:
      supportive: The revised shelf passed the find-and-return tests without displacing accessibility
        aids, and no purchase was needed.
      mixed: Items were easier to find, but returning them was harder, so one success criterion remained
        unmet.
      contradictory: Containers were purchased and photographed while the actual access problem became
        worse.
      inconclusive: The goal said be more organized without an endpoint, protected constraint or way to
        inspect the result.
  '11.04':
    title: Turn a small project into ordered milestones and a startable next action
    goal: Decompose a desired result into dependencies, stages, checkpoints and immediately executable
      actions without mistaking a long task list for a workable sequence.
    scope_note: One small project demonstrates decomposition. It does not establish estimating competence
      for large, regulated or safety-critical projects.
    burden: Twenty-five minutes to map a project and one 15-minute first action.
    setup: 'Default project: hold a free one-hour book discussion for three willing adults. The supplied
      stages are confirm purpose and interest, agree access and time, prepare two questions, hold the
      discussion, and send an optional follow-up. Use paper cards and mark dependencies with arrows; no
      project-management software is required.'
    actions:
    - title: Work backward from a visible finished result
      instructions: Write what must exist at the endpoint and split it into three to five milestones that
        each produce something inspectable. For the discussion, interest and access agreement precede
        a confirmed time, while drafting questions can begin before all replies arrive. Separate a milestone
        such as time confirmed from an activity such as sending messages.
      checks:
      - The finished result has a visible acceptance condition
      - Three to five milestones each yield an inspectable result
      - Activities are distinguished from milestone outcomes
      - Required participation and access are not assumed
    - title: Mark dependencies and expose one likely blockage
      instructions: Connect only genuine prerequisites, identify tasks that can proceed independently
        and name the longest uncertain wait. Add a checkpoint before spending money or promising a date.
        For the default, a no-response condition after three days triggers a smaller group or cancellation
        rather than endless reminders. Turn the first unblocked task into a verb, object and stopping
        point.
      checks:
      - Genuine prerequisites and parallel work are distinguished
      - An uncertain wait or likely blockage is named
      - A checkpoint includes a fallback rather than only a date
      - The first unblocked task has a verb object and stopping point
    - title: Execute the first unblocked action and update the map
      instructions: Perform the defined first action, such as sending one low-pressure interest invitation
        with two proposed time windows. Record the actual output and any new dependency. At the next checkpoint,
        mark milestones complete only when their result exists; re-sequence or stop the project if the
        prerequisite fails. Do not count planning every stage as delivering the event.
      checks:
      - The first action produces an actual output
      - New information updates the dependency map
      - Milestone completion requires its promised result
      - A failed prerequisite leads to an explicit fallback or stop
    adaptation: Use three cards instead of a detailed diagram, or have a trusted person read the next
      action aloud. A personal non-social project can replace the default when coordination is inaccessible.
      A simulated invitation map is preparation, not evidence of an event held.
    review: Which dependency controlled progress, and can the next person identify the next unblocked
      action without asking you to reinterpret the plan?
    examples:
      supportive: An interest invitation was sent, access needs were checked and question drafting began
        while the time remained provisional.
      mixed: The milestone map was usable, but the first action depended on an unanswered message that
        should have been marked blocked.
      contradictory: The meeting was announced as confirmed before participants or an accessible location
        had agreed.
      inconclusive: A list of fifty tasks was created without prerequisites, checkpoints or any task actually
        started.
  '11.05':
    title: Build a day plan that can absorb an ordinary interruption
    goal: Schedule commitments against duration ranges, usable energy, buffers, recovery and competing
      responsibilities, then revise from a real interruption rather than an ideal day.
    scope_note: The exercise tests planning realism for one day. It does not make unavoidable overload,
      unpredictable illness or insecure work an individual scheduling failure.
    burden: Fifteen minutes before the day and ten minutes afterward; no continuous timer is required.
    setup: 'Default available window: 9 a.m. to noon. It contains a fixed 30-minute appointment, a 40–60
      minute form, a 20–30 minute errand and a recovery break. Protect a 30-minute interruption buffer
      and include transitions. Use the actual energy-demanding item first only when that fits the person’s
      usable energy, not a universal morning rule.'
    actions:
    - title: Price the whole day before allocating the open blocks
      instructions: 'List fixed commitments, travel, preparation, meals, care and recovery, then identify
        the genuinely flexible window. Estimate uncertain tasks as ranges based on a previous attempt
        or a stated guess. Check the default using upper bounds: appointment 30, form 60, errand 30 and
        buffer 30 leave 30 minutes for transitions and rest. If the sum does not fit, reduce scope before
        scheduling.'
      checks:
      - Fixed duties transitions and recovery are included
      - Uncertain durations use ranges with their basis stated
      - Available capacity is calculated rather than assumed
      - Overload triggers scope reduction before promises are made
    - title: Place demanding work and define the interruption rule
      instructions: Assign tasks to suitable energy and access windows, leave the buffer uncommitted and
        identify what moves first if time is lost. For the default, the optional errand moves before a
        genuinely time-critical form, unless the errand is itself essential. Set a latest useful start
        and an early communication point for any commitment at risk; do not consume all recovery to rescue
        the plan.
      checks:
      - Energy and access influence task placement
      - A real buffer remains unallocated
      - An explicit task moves first when time is lost
      - Latest starts and early communication points are set
    - title: Run the day and compare planned with actual constraints
      instructions: Use the plan on an ordinary day and note only major start/end ranges, interruptions
        and changes. Do not create a disruption to test yourself. Afterward identify one estimate error,
        one unavoidable event and one scheduling choice. Adjust tomorrow’s task size, buffer or promise
        using those distinctions, retaining any missed obligation for repair rather than deleting it from
        the record.
      checks:
      - The plan is used without manufacturing an interruption
      - Actual timing and interruptions remain visible
      - Estimate errors external events and choices are separated
      - A specific scheduling adjustment or obligation repair follows
    adaptation: Use flexible windows rather than clock times for variable care or disability-related capacity.
      A support person or accessible calendar may carry reminders. In externally imposed overload, record
      the infeasible sum and request scope or staffing changes instead of relying on unpaid extra hours.
    review: What absorbed the interruption, and which estimate or promise must change so the next plan
      does not depend on sacrificing recovery?
    examples:
      supportive: A twenty-minute interruption used the buffer and the optional errand moved without missing
        the fixed appointment.
      mixed: The main task finished, but uncounted travel consumed the recovery break, so capacity was
        overestimated.
      contradictory: The plan was declared successful only because meals, needed care or sleep were removed.
      inconclusive: A full calendar was produced without adding durations or deciding what would move
        when a task ran long.
  '11.06':
    title: Carry a small shared deliverable through a visible workflow
    goal: Manage scope, ownership, dependencies, risks, decisions, status and a definition of done so
      a multistep commitment can be completed or closed without hidden work.
    scope_note: This is a small workflow exercise, not authority to manage people, regulated work or production
      systems outside an assigned role.
    burden: Thirty minutes of setup plus three brief status checks during a one-week deliverable.
    setup: 'Default deliverable: a one-page instruction sheet for finding materials in a shared hobby
      cupboard. Use four columns—ready, doing, blocked and done—and five cards: agree scope, inspect the
      cupboard, draft, ask a willing reader to try it, and revise. Each card has one responsible owner,
      a due window and an observable output; a solo participant may own all cards.'
    actions:
    - title: Bound the deliverable and assign accountable ownership
      instructions: Agree who may change the cupboard and who only writes instructions. Define done as
        a reader finding and returning two agreed items from the sheet, with no private information exposed.
        Put the five cards in ready or blocked, assign one consenting owner per card and name the dependencies.
        Limit doing to one card per available worker so starting everything cannot masquerade as progress.
      checks:
      - Scope permission and the acceptance test are explicit
      - Every card has a consenting owner and observable output
      - Dependencies determine ready versus blocked status
      - Work in progress is bounded by actual capacity
    - title: Advance the cards and record decisions where they occur
      instructions: Complete the first ready card, move it only when its output exists and review the
        board at three short checkpoints. For a blocked card, record the missing input, owner of the unblock
        action and next check. Keep a tiny decision log—choice, reason and date—when scope or wording
        changes. Escalate an approaching miss early instead of moving the due date without notice.
      checks:
      - Card movement follows actual outputs
      - Blocked work has a named missing input and next check
      - Scope-changing decisions retain their reason and date
      - A threatened commitment is communicated before silent slippage
    - title: Verify the deliverable and close the remaining obligations
      instructions: Ask a willing reader to use the sheet or conduct labeled self-review. Compare the
        result with the original definition of done and fix one observed gap within scope. Return borrowed
        materials, communicate delivery or cancellation and archive only necessary non-sensitive decisions.
        Mark unfinished cards deferred or canceled with a reason; do not make them disappear to produce
        a clean board.
      checks:
      - The original acceptance test is actually run
      - An observed gap is corrected or explicitly remains open
      - Delivery cancellation and borrowed resources are closed responsibly
      - Unfinished cards retain an honest disposition
    adaptation: Use index cards, spoken status or a shared accessible document instead of an app. In solo
      work, distinguish ownership from dependence on another person’s consent. Rehearse on a fictional
      cupboard when shared access is unavailable; that does not prove team delivery.
    review: Could another person tell what was done, what was blocked and who owed the next action without
      relying on your memory?
    examples:
      supportive: The sheet passed both retrieval tests, one confusing label was corrected and the board
        recorded the final handoff.
      mixed: A useful draft existed, but nobody owned reader testing, so the deliverable was not yet done.
      contradictory: Blocked cards were moved to done and ownership assigned to people who never agreed
        to help.
      inconclusive: A workflow tool was configured while no card produced an output or acceptance test.
  '11.07':
    title: Choose a sustainable pace for one demanding commitment
    goal: Match effort to urgency, duration, health, quality and importance, distinguishing a bounded
      sprint from maintenance and recovery rather than treating maximal intensity as the default.
    scope_note: The plan concerns ordinary work allocation. It does not diagnose fatigue, prescribe rehabilitation
      or justify working through pain, illness, dangerous sleepiness or unsafe conditions.
    burden: Fifteen minutes to choose a pace, two ordinary work periods and ten minutes to compare quality
      and recovery.
    setup: 'Default: a non-urgent room inventory can be done in one exhausting evening or in two 20-minute
      sections. Use three pace cards: maintenance—one small section; sprint—one time-limited priority
      block with a stop and recovery plan; recovery—only essential duties plus support. Keep existing
      clinical and workplace restrictions unchanged.'
    actions:
    - title: Choose the pace from consequences rather than pressure
      instructions: State the real deadline, consequence of delay, expected duration and quality required.
        Check current capacity and existing restrictions. For the inventory, choose maintenance because
        urgency is low; reserve sprint for a genuinely bounded need, not someone’s impatience. Define
        a stop signal and what essential task remains covered if the chosen pace becomes unsuitable.
      checks:
      - Deadline consequence duration and quality are separately stated
      - Current capacity and existing restrictions are respected
      - The pace has a reason beyond pressure or self-judgment
      - A stop signal and essential-duty fallback are defined
    - title: Use two bounded work periods without compensatory overrun
      instructions: Attempt the selected section, stop at the agreed endpoint and take the planned recovery
        or transition. Note whether errors, discomfort or attention problems changed the quality of work.
        Repeat only at the planned next opportunity; do not add an unplanned extra block to erase a slow
        start. If a stop condition appears, stop and use appropriate support rather than treating endurance
        as evidence.
      checks:
      - Work occurs within the chosen pace and stop boundary
      - Quality and burden are observed alongside quantity
      - Recovery is actually taken rather than merely scheduled
      - A safety or capacity stop overrides the output target
    - title: Select the next pace using both output and aftermath
      instructions: Compare what was completed, rework required, remaining obligations and capacity at
        the next ordinary activity. Retain maintenance, shorten the block, arrange help or choose recovery
        based on the combined result. A sprint is not complete until its recovery and outstanding commitments
        are addressed. Record a concrete condition for returning from recovery to ordinary work without
        setting a punitive deadline.
      checks:
      - Output and rework are compared with the quality requirement
      - Aftermath for health and other duties is included
      - The next pace follows the observed tradeoff
      - Return from recovery uses a suitable condition rather than punishment
    adaptation: Use supported, seated, remote or shorter work where appropriate and treat rest as legitimate
      work planning. Variable or persistent fatigue may require qualified assessment and accommodation
      rather than a new productivity technique. No physical challenge or deprivation is part of this exercise.
    review: Which pace preserved both the result and the ability to meet the next legitimate responsibility?
    examples:
      supportive: Two short inventory sections were accurate and left enough capacity for evening care,
        so maintenance remained appropriate.
      mixed: More was completed in the first block, but errors and next-day burden showed the chosen intensity
        was too high.
      contradictory: A stop signal was ignored and recovery withheld until a quantity target was reached.
      inconclusive: Intensity was rated privately without attempting a bounded period or inspecting its
        quality and aftermath.
  '11.08':
    title: Make one commitment reliable through early communication and closure
    goal: Track a promise, surface delivery risk early and either complete it or obtain an explicit renegotiation
      so another person can plan around reliable information.
    scope_note: Reliability is not unlimited availability. This exercise cannot override unsafe dependency,
      labor rights, professional duties or another person’s freedom to decline a changed arrangement.
    burden: Ten minutes to clarify a small commitment, two five-minute checks and a brief delivery or
      renegotiation.
    setup: 'Default: you agree to return a borrowed book by Friday. Record the promised object or result,
      recipient, time, return method and a Thursday risk checkpoint. Keep identifying details in private
      working notes, not in application evidence. Choose only a promise you have authority and capacity
      to make.'
    actions:
    - title: Confirm exactly what has been promised
      instructions: 'Write the result and deadline in terms the recipient could recognize. Clarify an
        ambiguous detail before relying on it: Friday means before their trip, not whenever convenient.
        Check the necessary resource and travel or contact method. Place one reminder early enough to
        correct a problem and identify who must be informed if delivery becomes doubtful.'
      checks:
      - The recipient-recognizable result and deadline are confirmed
      - Ambiguity is clarified rather than silently resolved in your favor
      - Resources and delivery method are checked
      - An early risk checkpoint and communication recipient are set
    - title: Act on a threatened miss before the deadline passes
      instructions: At the checkpoint, inspect actual progress rather than confidence. If the book cannot
        be returned as promised, send a concise message stating what is at risk, why at a non-sensitive
        level, and one feasible alternative such as a different return time or approved drop-off. Ask
        whether the alternative works; do not treat sending the message as consent. If there is no risk,
        complete the preparation for delivery.
      checks:
      - The checkpoint uses actual progress or resource availability
      - A threatened miss is communicated while alternatives remain useful
      - The proposed alternative is feasible and specific
      - Renegotiation requires agreement rather than a unilateral date change
    - title: Deliver or close the renegotiated commitment
      instructions: Complete the agreed return or alternative and confirm receipt through an appropriate
        low-burden channel. If delivery still fails, acknowledge the actual impact and carry out a proportionate
        repair within your control. Update the commitment as delivered, explicitly renegotiated or still
        open. Review the estimate or reminder that should change for the next promise.
      checks:
      - Delivery or the agreed alternative actually occurs
      - Receipt or remaining uncertainty is recorded honestly
      - A failed promise receives acknowledgment and proportionate repair
      - The commitment closes only with a truthful status
    adaptation: Use accessible reminders, supported transport or written communication; needing assistance
      does not invalidate reliability. Where contacting a person is unsafe, use an authorized intermediary
      or appropriate support. A fictional promise rehearsal demonstrates planning and wording only.
    review: Did your communication let the other person plan, and what will you change before making the
      next similar promise?
    examples:
      supportive: The Thursday check exposed a travel problem, an agreed drop-off was arranged and receipt
        confirmed before the trip.
      mixed: The book was returned, but warning came too late to prevent the recipient changing their
        plan.
      contradictory: The due date was silently edited and the recipient blamed for expecting the original
        promise.
      inconclusive: A reminder was created, but the promise was neither delivered nor explicitly renegotiated.
  '11.09':
    title: Make a weekly review produce one tested change in behavior
    goal: Compare outcomes with plans, distinguish causes from excuses and change one method so review
      leads to different action rather than repeated reflection.
    scope_note: One review cannot establish a trend or prove a causal explanation. Uncontrollable events,
      resource limits and worthwhile abandoned goals must remain visible.
    burden: Twenty minutes after one week, one comparable attempt the following week and ten minutes to
      close the loop.
    setup: 'Default plan: prepare a simple lunch on three workdays; actual result: one lunch prepared,
      one ingredient unavailable and one morning interrupted. Use four headings—planned result, actual
      result, supported explanation and next-method change. The aim is not a score or a perfect streak.'
    actions:
    - title: Compare the original plan with what actually happened
      instructions: 'Keep the original target visible and record delivered, partial, missed or no-longer-needed
        outcomes. Separate an activity count from its intended benefit: buying ingredients is not the
        same as having lunch available. Note burden and adverse effects as well as wins. For the default,
        retain the two different missed-day reasons rather than summarize them as laziness.'
      checks:
      - Original targets remain visible beside actual outcomes
      - Activities are distinguished from intended benefits
      - Burden and adverse effects are included
      - Different misses retain their distinct circumstances
    - title: Choose one explanation that suggests a testable method change
      instructions: 'For the most useful gap, distinguish evidence from a plausible story and list one
        alternative cause. Choose a change under your control that would address the supported explanation:
        prepare the shelf-stable portion the evening before, not merely try harder. Define the next comparable
        opportunity, an observable result and a cost you will watch. Keep other major conditions as similar
        as practical.'
      checks:
      - A supported explanation is separated from an untested story
      - At least one alternative cause is considered
      - One concrete method change addresses the selected gap
      - The next opportunity result and cost to watch are specified
    - title: Run the changed method and append the result
      instructions: Use the changed method at the next suitable opportunity. Record whether the intended
        benefit occurred, what conditions differed and whether a new burden appeared. Retain, revise or
        reject the method based on the attempt, including an unchanged or worse outcome. Put the next
        actual action in the calendar or workspace; a review that only produces a motivational sentence
        is not closed.
      checks:
      - The changed method is actually attempted
      - Benefit differing conditions and burden are recorded
      - Unchanged or worse outcomes can reject the method
      - The review ends with a concrete next action or reasoned stop
    adaptation: Review one item rather than a whole week, use voice notes or a trusted planning aid, and
      omit private narratives from application evidence. A synthetic review is useful for learning the
      method but does not establish a changed personal routine.
    review: What did you do differently because of the review, and what evidence would make you stop using
      that change?
    examples:
      supportive: Evening preparation produced lunch on the next comparable day without delaying bedtime,
        so the method was retained provisionally.
      mixed: Lunch was ready, but the evening preparation shifted a care task onto someone else and required
        revision.
      contradictory: The target was rewritten after the fact so every outcome looked successful and no
        method changed.
      inconclusive: A weekly reflection was completed, but the following week repeated the same plan without
        a new action.
  '11.10':
    title: State a low-stakes limit and close the obligation it changes
    goal: Decline or reduce an optional commitment directly and follow through proportionately while preserving
      legitimate duties, notice and any needed handoff.
    scope_note: This is a source-only companion to the frozen State and Maintain One Boundary runtime.
      Its three stages explain the existing define–state–follow-through actions; the additional reading
      checks are not replacement application evidence or new completion rules. Ending unsafe or consequential
      relationships requires an appropriate separate safety or professional process.
    burden: Twenty to forty minutes over the existing ten-day practice, with follow-through within seven
      days of the relevant situation.
    setup: 'Default: an optional hobby-group organizer regularly asks for last-minute extra setup help.
      Your chosen limit is one previously agreed hour, with advance notice that additional hours are unavailable.
      Use the supplied wording: I can complete the agreed setup until six; after that I will leave. Do
      not choose a person to fix or use this exercise to withdraw essential care.'
    actions:
    - title: Define the limit and the responsibility that remains
      instructions: Identify the optional request, obsolete goal or small commitment you intend to reduce.
        Name the legitimate promise that still stands and a proportionate action entirely within your
        control. For the default, complete the agreed hour and leave at six after handing over the materials.
        Privately draft a closure message for any unfinished optional task; do not classify a duty as
        optional simply because it is unpleasant.
      checks:
      - The chosen limit concerns the participant’s own involvement
      - Existing promises and legitimate duties remain explicit
      - Follow-through is proportionate and within the participant’s control
      - Any unfinished optional work has a notice or handoff plan
    - title: State the boundary directly without forcing agreement
      instructions: In a reasonably safe situation, state the specific limit before others rely on extra
        help. Give the short reason or handoff information needed for planning, not a defense of your
        worth. Ask whether any already-promised item has been overlooked, while keeping the limit clear.
        A refusal, ending or reduced commitment is not a threat, silent test, punishment or demand for
        the other person’s approval.
      checks:
      - The limit is communicated directly where safe
      - Notice and handoff information allow the other person to plan
      - Previously promised work can be clarified without unlimited bargaining
      - No threat punishment silent test or forced agreement is used
    - title: Follow through once and verify responsible closure
      instructions: Within the existing seven-day follow-through window, carry out the named action or
        calmly restate the limit when the situation arises. Complete the agreed hour, return materials
        and leave as stated. Record what remains open and whether anyone was left with an unannounced
        essential duty. Stop if retaliation, abuse or unsafe dependency appears; private rehearsal is
        not a real communicated boundary or observed follow-through.
      checks:
      - The named action or calm restatement occurs on an actual opportunity
      - Agreed work and necessary handoff are completed or remain openly unresolved
      - Reclaimed attention is not purchased through unannounced neglect
      - Emerging danger stops the exercise and prompts appropriate support
    adaptation: Use written, signed, augmentative or supported communication and culturally suitable timing.
      When no safe opportunity exists, draft privately and label it preparation only. For employment,
      housing, caregiving, abuse or material dependency, use qualified or organizational support rather
      than direct confrontation.
    review: Did the limit actually reclaim attention while leaving promises, notice and handoff in a responsible
      state?
    examples:
      supportive: The person completed the agreed setup, handed over materials and left at six without
        demanding the organizer’s approval.
      mixed: The limit was clear and maintained, but a borrowed key still needed returning to close the
        obligation.
      contradictory: Essential care was withdrawn or a silent test used to punish another person for making
        a request.
      inconclusive: A boundary sentence was drafted privately but was reported as a live refusal with
        observed follow-through.
