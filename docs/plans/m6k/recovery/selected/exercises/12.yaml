schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '12'
exercises:
  '12.01':
    title: Close one real preventive-care information gap with a qualified service
    goal: Understand the difference between prevention, symptom evaluation and treatment, organize the
      information a clinician needs, and act on one appropriate care gap.
    scope_note: This is care navigation and health literacy, not a screening schedule, diagnosis or instruction
      to start, stop or change treatment. Urgent symptoms take priority over completing the exercise.
    burden: Twenty minutes of private preparation, one clinic or pharmacy contact and a ten-minute follow-up;
      appointment availability may extend the timeline.
    setup: 'Use your existing care records privately, or the supplied fictional case: an adult has an
      unclear vaccination record, a medicine from two prescribers and an overdue dental reminder. Make
      six headings: screening, new symptoms, medicines, vaccination, dental care and sexual health. Mark
      current, uncertain, due according to an existing care plan, or not applicable; do not invent a due
      date.'
    actions:
    - title: Build a minimum useful care summary without self-diagnosing
      instructions: Under the six headings, record only the questions needed for the next appointment.
        For medicines, list prescription and nonprescription products and how they are actually taken;
        keep this outside application evidence. Separate a new symptom from a preventive question. Note
        access, language, cost and consent needs. A blank vaccination record means uncertain, not automatically
        unvaccinated or protected.
      checks:
      - All six care areas receive an honest status
      - Symptoms are separated from preventive planning
      - The private medicine list reflects actual use without treatment changes
      - Access needs and uncertainty are explicit
    - title: Verify one gap through the appropriate qualified channel
      instructions: Choose the most relevant non-urgent uncertainty and contact the existing clinician,
        dentist, pharmacist or local public-health service. Ask what information is needed, which current
        guidance applies to your age and circumstances, and the next action. For the default, request
        the vaccination record rather than booking every possible vaccine. If concerning symptoms are
        current, obtain timely clinical or emergency advice instead of waiting for the audit.
      checks:
      - The chosen question reaches an appropriate qualified service
      - Current individual guidance is requested rather than guessed
      - Required records costs and access arrangements are clarified
      - Current concerning symptoms are not deferred for the exercise
    - title: Carry out the agreed next step and use teach-back
      instructions: 'Complete the next agreed action: obtain the record, book the indicated review, resolve
        a medicine-list discrepancy with the pharmacist or attend the planned visit. Summarize in your
        own words what happens next, why and when to seek help; ask the service to correct misunderstanding.
        Record the remaining question and follow-up date. Booking a visit is not evidence that screening,
        vaccination or treatment has occurred.'
      checks:
      - An agreed next step is actually completed
      - The next action and help threshold are restated and clarified
      - Outstanding questions retain a follow-up route
      - Booking preparation and completed clinical care remain distinct
    adaptation: Use an interpreter, accessible portal, support person with consent or a community clinic.
      Keep diagnoses, sexual history and medicine names out of app check-ins. A fictional case practices
      navigation only; lack of affordable care is an access barrier, not a failed health behavior.
    review: Which uncertainty became an actionable care plan, and what still needs qualified interpretation
      rather than another internet search?
    examples:
      supportive: The vaccination record was obtained and the clinic confirmed the appropriate next review;
        an assumed missing dose was not self-prescribed.
      mixed: An appointment was booked, but transport or interpretation remained unresolved and required
        another access step.
      contradictory: Medication was stopped or a symptom dismissed because a self-made prevention checklist
        appeared complete.
      inconclusive: A list of recommended tests was copied without checking individual relevance or contacting
        a care service.
  '12.02':
    title: Test one sleep-supporting change without restricting needed sleep
    goal: Connect sleep opportunity and regularity with light, caffeine, environment, stress and recovery,
      then test one feasible change against ordinary daytime functioning.
    scope_note: This is a short sleep-habit observation, not treatment for insomnia, sleep apnea or a
      circadian disorder. It does not prescribe sleep restriction, supplements or a universal shift-work
      schedule.
    burden: A two-minute morning note for seven days, ten minutes of setup and a ten-minute comparison.
    setup: 'Use a private note with approximate sleep opportunity, perceived rest, daytime functioning
      and unusual circumstances. Default change: create a quieter, dimmer wind-down period before the
      existing bedtime while preserving enough opportunity to sleep. Keep medicines, clinical plans and
      essential nighttime care unchanged. No wearable or precise sleep-stage score is required.'
    actions:
    - title: Observe the current pattern and choose one controllable factor
      instructions: 'For three ordinary mornings, note approximate bed and wake windows, perceived awakenings,
        daytime sleepiness and major care or work interruptions. Review six possible influences: schedule,
        light, caffeine timing, bedroom conditions, stress and recovery opportunity. Choose one feasible
        factor; for the default, reduce avoidable bright entertainment light before bed rather than move
        bedtime later. Record the other factors as unchanged or constrained.'
      checks:
      - Three ordinary observations include daytime function
      - All six influences are considered without causal certainty
      - One feasible factor is selected for change
      - Needed sleep and essential care are not reduced
    - title: Use the chosen change on four nights with honest exceptions
      instructions: Arrange the quieter wind-down space before the first trial night and use it on four
        nights when feasible. Keep the sleep window and other major conditions as similar as ordinary
        life permits. Record disruptions and whether the change added stress. Do not lie awake clock-watching
        to obtain precise data, force yourself to remain awake or compensate for a missed night by an
        extreme schedule shift.
      checks:
      - The selected environmental or schedule change is actually used
      - Exceptions and other changing conditions remain visible
      - No deliberate sleep deprivation or punitive compensation is introduced
      - The observation burden does not become a new sleep obstacle
    - title: Compare function and choose continuation or clinical review
      instructions: Compare the three usual nights with the four trial nights using rest and daytime function,
        not a claim of measured sleep architecture. Keep the change only if useful and sustainable; an
        unclear result remains unclear. Persistent sleep problems, breathing concerns during sleep or
        dangerous daytime sleepiness warrant qualified evaluation. Do not drive or do hazardous work while
        dangerously sleepy merely to finish the experiment.
      checks:
      - Both periods are compared using the same simple indicators
      - An uncertain result is not presented as a cure
      - The next choice considers feasibility and burden
      - Persistent or safety-relevant sleep concerns lead to qualified help
    adaptation: For shift work or caregiving, compare similar shifts and choose a light, noise or caffeine-timing
      change that fits the existing care plan. Audio relaxation, a dim night light or sensory supports
      may remain necessary. A sleep clinician’s individualized plan takes precedence over this habit trial.
    review: Did the change improve usable rest or daytime function without making sleep itself another
      performance task?
    examples:
      supportive: The dimmer wind-down was feasible and mornings felt less disrupted, so it was retained
        without claiming insomnia was treated.
      mixed: Rest improved on two nights, but work shifts changed too, leaving the cause uncertain.
      contradictory: Sleep time was deliberately shortened or severe daytime sleepiness ignored to meet
        the logging target.
      inconclusive: A sleep score was watched repeatedly without changing a factor or comparing daily
        function.
  '12.03':
    title: Build and repeat an adequate everyday meal within real constraints
    goal: Apply basic nutrition literacy to an affordable, accessible eating pattern that includes energy,
      protein, fiber, micronutrient variety and hydration without rigid tracking or fad rules.
    scope_note: One meal cannot establish nutritional adequacy for a whole diet. Individual allergies,
      swallowing needs, pregnancy, disease, medication interactions and clinician-directed diets take
      precedence; no calorie deficit or supplement regimen is prescribed.
    burden: Fifteen minutes to plan, one ordinary meal preparation or purchase, and a five-minute review
      after a second comparable meal.
    setup: 'Default meal: a familiar grain or starchy food, beans or another tolerated protein, a vegetable
      or fruit, a usual source of fat or flavor, and a suitable drink. Use ingredients already known to
      be safe for you. The supplied audit asks what supplies energy, protein, fiber, varied micronutrients
      and fluid, and what is missing across the rest of the day.'
    actions:
    - title: Explain the meal’s functions and its actual constraints
      instructions: Use the default or a familiar cultural meal to identify the five nutrition functions.
        Energy needs depend on the person and activity; a single plate does not reveal energy balance
        or every micronutrient. Check budget, preparation time, storage, appetite, sensory needs and allergy
        information, including cross-contact where relevant. Record an unknown rather than treating a
        marketing label as proof of nutritional completeness.
      checks:
      - Energy protein fiber variety and fluid each have an identified source or gap
      - A single meal is not equated with whole-diet adequacy
      - Budget preparation storage and access constraints are included
      - Allergy and individual care requirements control ingredient choice
    - title: Prepare or obtain the meal with one practical improvement
      instructions: Make or purchase the chosen meal using familiar safe methods. Change one feasible
        gap, such as adding tolerated beans, a cooked vegetable or access to a suitable drink; do not
        simultaneously eliminate entire food groups. Follow the product’s preparation and storage instructions.
        Eat according to your established needs or care plan, noting adequacy, enjoyment and convenience
        without classifying the meal as morally clean or bad.
      checks:
      - An actual meal is prepared or obtained safely
      - One identified gap receives a feasible change
      - No unsupported elimination or restrictive target is introduced
      - Nourishment enjoyment and convenience are all considered
    - title: Repeat once and test whether the pattern is sustainable
      instructions: Use the meal or an equivalent version at another ordinary opportunity. Compare cost,
        access, satisfaction and fit with the rest of the day. Choose one alternate protein, plant food
        or preparation that adds variety within the same constraints. If adequacy, unwanted weight change,
        restrictive eating or a medical diet remains uncertain, take the specific question to a qualified
        clinician or dietitian rather than escalate self-tracking.
      checks:
      - The pattern is repeated or the missing opportunity is explicit
      - Cost satisfaction and day-level fit are compared
      - A realistic variety option is identified
      - Persistent nutritional or medical uncertainty has a qualified review route
    adaptation: Use frozen, canned, prepared, blended or culturally familiar foods when they meet individual
      safety needs. Food assistance and help with preparation are valid routes. Follow fluid restrictions
      or swallowing plans when prescribed; the exercise never requires drinking beyond those limits or
      testing a suspected allergen.
    review: Which small change made adequate nourishment easier to repeat, and which need cannot be inferred
      from this meal alone?
    examples:
      supportive: A tolerated bean-and-rice meal with vegetables was repeated affordably, and an alternate
        protein kept the pattern flexible.
      mixed: The meal covered several functions but preparation time made it unrealistic on workdays,
        so a prepared alternative was needed.
      contradictory: The exercise became calorie punishment, allergy testing or an unsupported elimination
        diet.
      inconclusive: Nutrient categories were memorized without preparing, obtaining or repeating a workable
        meal.
  '12.04':
    title: Replace one body-shaming rule with a nourishment-supporting action
    goal: Separate health and appearance preferences from shame, comparison and compulsive control, then
      practice a concrete action that supports nourishment and bodily dignity.
    scope_note: This is an educational reflection and ordinary care action, not treatment for an eating
      disorder or a body-image condition. Restriction, bingeing, purging, compulsive exercise or serious
      distress warrants qualified support.
    burden: Fifteen minutes privately, one ordinary meal or clothing-related action and a ten-minute review.
    setup: 'Use the low-stakes default: after seeing an idealized image, a person calls their body unacceptable
      and considers skipping a normal meal. Write three columns—observed fact, appearance judgment and
      care need. Do not use before-and-after photos, body measurements, calorie targets or exposure to
      triggering material as part of the exercise.'
    actions:
    - title: Separate the comparison from a defensible health concern
      instructions: Describe the actual event without ranking bodies. Identify the rule it activated,
        such as I must earn lunch by looking a certain way, and distinguish that rule from a legitimate
        health or comfort goal. State one body function or care need that remains valid regardless of
        appearance. Do not require gratitude, positive body feelings or denial of a genuine medical concern.
      checks:
      - The comparison event is distinct from the body judgment
      - A shame-based rule is stated without endorsing it
      - A legitimate health or comfort concern remains visible
      - One care need is recognized without requiring positive appearance feelings
    - title: Perform one ordinary care action without compensation
      instructions: Follow your established meal or care plan, wear a comfortable available garment, or
        remove one unwanted comparison cue with no deprivation or compensatory exercise. In the default,
        keep the planned meal rather than using it as a reward for appearance. If a treatment plan already
        exists, use that plan and its support person; do not substitute this exercise for it.
      checks:
      - A concrete nourishment or comfort action actually occurs
      - Care is not conditional on appearance or earned through punishment
      - No restriction purging or compensatory exercise is introduced
      - Existing treatment and support plans remain authoritative
    - title: Review the rule’s effect and set a support threshold
      instructions: Record whether the action was possible, how the rule affected it and what remained
        distressing. Replace the rule with a practical statement such as regular nourishment supports
        my day even when I dislike a photo. Identify a trusted or qualified support route if the pattern
        recurs, impairs eating or becomes compulsive. Current concerning behavior requires real support
        rather than a completed worksheet.
      checks:
      - The action and remaining distress are both recorded
      - A practical replacement rule supports care rather than forced positivity
      - A specific recurrence or impairment threshold prompts help
      - Concerning current behavior is not normalized as a willpower exercise
    adaptation: Use the fictional case when personal reflection is too activating. Skip mirrors, scales
      and photographs. Choose a familiar care action consistent with cultural practice, disability needs
      and any dietitian or clinician plan; not everyone needs or wants an appearance goal.
    review: Could you meet a care need without first changing how you felt about your appearance?
    examples:
      supportive: The planned meal remained in place despite an unpleasant comparison, and the person
        muted the triggering account without compensatory exercise.
      mixed: The care action occurred, but the rule still repeatedly disrupted eating and a support appointment
        became the next step.
      contradictory: Food was withheld or exercise escalated to erase guilt about body size.
      inconclusive: A positive affirmation was copied while the actual harmful rule and care behavior
        stayed unexamined.
  '12.05':
    title: Practice one familiar strength movement with fixed technique and recovery
    goal: Understand major strength patterns and use a bounded, technically controlled practice-and-review
      cycle rather than increasing load simply to prove effort.
    scope_note: This is an introductory observation of one already-safe movement, not a universal strength
      program, rehabilitation plan or demonstration of strength gain. Novel or medically constrained training
      needs appropriate instruction.
    burden: Fifteen minutes of planning and two short sessions on separate suitable days with recovery
      between them.
    setup: 'Map five movement functions: getting up or squatting, hinging, pushing, pulling and carrying.
      Choose one familiar, pain-free function already within your ordinary ability or existing qualified
      plan. Default for someone who routinely stands from a chair: three slow sit-to-stands from a stable
      chair that cannot slide, using the usual hand support. There is no requirement to remove support,
      add weight or approach fatigue.'
    actions:
    - title: Choose the function and define observable technique
      instructions: Give each of the five functions a safe current example, an adapted equivalent or an
        instruction-needed status. Select only one for this trial. For the chair default, use the same
        stable seat and footwear, keep the movement controlled, use necessary support and stop before
        technique changes. Record a modest repetition count, rest arrangement and stop conditions; chest
        symptoms, faintness, new pain or unusual breathlessness stop the attempt.
      checks:
      - All five functions receive an example adaptation or instruction-needed status
      - The selected movement is familiar and appropriate to current ability
      - Technique support repetitions and recovery are specified before starting
      - Concerning symptoms or technique loss override the target
    - title: Complete the bounded session without chasing a maximum
      instructions: Perform only the planned repetitions at a comfortable pace, breathing normally and
        retaining the chosen support. Record repetitions completed with the fixed technique, perceived
        effort and any symptoms; incomplete repetitions remain incomplete. Stop at the preset boundary
        even if comparison or enthusiasm suggests adding more. A qualified coach or therapist may observe
        with consent, but public recording and competitive testing are unnecessary.
      checks:
      - Only the preplanned familiar movement and repetitions are attempted
      - Required support and ordinary breathing are maintained
      - Completed repetitions require the fixed technique
      - No maximum load fatigue challenge or unplanned escalation is added
    - title: Repeat after recovery and choose a justified next step
      instructions: At the next suitable session, first check return to usual function and any delayed
        symptoms. Repeat the same dose only when appropriate under the existing plan. Compare control,
        effort and recovery, not merely count. Keep the dose, reduce it or ask for instruction; any future
        progression changes one variable within qualified or established guidance. Two sessions do not
        establish measurable strength improvement.
      checks:
      - Usual function and delayed symptoms are checked before repeating
      - The repeat uses comparable technique support and dose
      - Control effort and recovery inform the decision
      - Progression is conditional and no strength-gain claim is inferred
    adaptation: Use a seated, assisted or prescribed equivalent and count support as a legitimate condition.
      If the default movement is not already safe and familiar, complete the pattern map and obtain instruction
      before physical attempts. Do not practice through injury, remove fall supports or alter a rehabilitation
      plan.
    review: What evidence supports repeating or changing this dose while preserving technique and recovery?
    examples:
      supportive: Three supported chair rises were controlled on both days with normal recovery, so the
        same dose was retained provisionally.
      mixed: Repetitions were completed, but later discomfort meant the second session was deferred for
        appropriate advice.
      contradictory: Support was removed and repetitions forced through pain to make the result look stronger.
      inconclusive: A strength plan was written without a safe attempt or any observation of technique
        and recovery.
  '12.06':
    title: Compare sustainable aerobic effort with the recovery it requires
    goal: Practice a familiar cardiovascular activity at an appropriate sustainable level and distinguish
      endurance, higher-intensity work and recovery without confusing exhaustion with fitness.
    scope_note: The trial is not a stress test, fitness clearance or prescription for vigorous intervals.
      Existing medical advice controls activity choice, and two outings cannot prove cardiovascular adaptation.
    burden: Ten minutes to prepare and two short familiar activity periods on separate suitable days,
      each followed by a brief recovery note.
    setup: 'Choose walking, wheelchair propulsion, easy cycling on a familiar safe route or another already-tolerated
      aerobic activity. Default: five minutes on a level, nearby route at a pace that permits comfortable
      conversation, with an easy return and usual aids. Choose a shorter existing tolerated duration when
      five minutes is inappropriate. No traffic exposure, heat challenge or performance target is required.'
    actions:
    - title: Set a sustainable route dose and stop plan
      instructions: State the activity’s purpose, current comfortable duration, route access and recovery
        opportunity. Distinguish this easy base effort from higher-intensity training, which may require
        separate preparation or advice. Check weather, surface, equipment and a way to stop or return
        early. Fix duration and a comfortable effort description before starting; symptoms such as chest
        discomfort, faintness or unusual breathlessness require stopping and appropriate care.
      checks:
      - The dose is based on current ability rather than an age or peer target
      - Easy base effort is distinguished from unprescribed high-intensity work
      - Route conditions access aids and an early return are checked
      - Concerning symptoms override the activity plan
    - title: Complete the familiar effort and observe recovery
      instructions: Use the planned activity at the selected comfortable pace without racing or extending
        the route. Record approximate time, whether the effort stayed conversational or within the existing
        plan, and how ordinary breathing and function returned afterward. Stop at the boundary and retain
        any symptom or interruption in the record. A shorter safe attempt is more informative than hiding
        a difficult finish.
      checks:
      - The planned familiar activity is actually attempted
      - Effort stays within the chosen appropriate range or prompts stopping
      - Duration and recovery are observed without a maximal test
      - Symptoms interruptions and shortened attempts remain visible
    - title: Repeat comparably and decide whether the dose fits
      instructions: On another suitable day, repeat only after usual recovery and compare effort, access
        and aftermath. Keep the dose, shorten it, change the route or seek qualified guidance. If a future
        goal needs higher intensity, identify the required instruction and individualized progression
        rather than adding sprints now. The review concerns sustainable participation and recovery, not
        a claimed change in aerobic capacity.
      checks:
      - A comparable repeat occurs only after appropriate recovery
      - Effort and aftermath are compared alongside duration
      - The next dose or support choice follows the observations
      - Higher-intensity goals remain separate from this easy trial
    adaptation: Use indoor, seated, supported or shorter activity under an existing plan when weather,
      disability or access requires it. For chronic illness with post-exertional worsening, do not use
      automatic graded increases; follow individualized clinical guidance. A route plan without movement
      is preparation only.
    review: Was the effort repeatable without an unacceptable recovery cost, and what would make a different
      intensity appropriate?
    examples:
      supportive: Both short level outings remained comfortable and recovery fit the rest of the day,
        supporting repetition of the same dose.
      mixed: The second outing took similar time but caused greater delayed fatigue, so the plan needed
        reduction or review.
      contradictory: Unplanned sprints were added or alarming symptoms ignored to finish a distance target.
      inconclusive: A route and heart-rate goal were selected without an actual safe effort or recovery
        observation.
  '12.07':
    title: Improve access to one everyday movement without forcing range
    goal: Relate usable range, control, stability and tolerance to an actual daily task, then test a safe
      adaptation instead of chasing a maximal stretch.
    scope_note: This is a task-specific movement observation, not a joint examination or treatment for
      pain, instability or injury. New limitations and concerning symptoms require qualified assessment.
    burden: Ten minutes to define the task and two five-minute observations during ordinary activity.
    setup: 'Default task: place a light, unbreakable cup on a shelf already reachable without strain.
      Use the usual stable stance or seated position and necessary support. Compare the current shelf
      with a slightly lower or closer position, not a more extreme reach. The target is controlled usable
      access, not a flexibility score.'
    actions:
    - title: Describe the required movement and its current limit
      instructions: Identify the task’s reach, bend or turn, the support used and what counts as controlled
        completion. Note whether the limit appears to be distance, balance, grip, fatigue, pain or an
        unknown factor; these are observations, not diagnoses. Choose a pain-free familiar range and a
        light object. If the task is already unsafe, plan an environmental adaptation or professional
        consultation before attempting it.
      checks:
      - The actual daily task and required range are specified
      - Support control and tolerance are observed separately
      - The apparent limit is not treated as a diagnosis
      - Only a familiar safe range and light object are selected
    - title: Compare ordinary access with one safer arrangement
      instructions: During a normal opportunity, complete the task once in its usual safe arrangement
        and once with the shelf or object closer, if both are appropriate. Move slowly enough to retain
        control, keep supports and stop with pain, dizziness or instability. Record whether the adaptation
        changes compensation, reach effort or balance demand. Do not stretch further, bounce, force a
        joint or test a fall response.
      checks:
      - Two safe arrangements or a reason for deferral are recorded
      - Movement remains controlled with necessary supports
      - Pain dizziness or instability stops the attempt
      - The comparison concerns usable access rather than maximal range
    - title: Retain the useful arrangement and identify any training need
      instructions: Use the better arrangement on a second ordinary occasion and check whether it still
        works when mildly tired but not unsafe. Decide whether environmental redesign solves the task
        or whether a qualified plan is needed for range, strength, balance or tissue tolerance. Keep the
        task accessible while that plan is developed; do not withhold adaptations to force independence.
      checks:
      - The selected arrangement is checked on another ordinary occasion
      - Repeatability and tolerance are reviewed together
      - Environmental and training needs are distinguished
      - Access supports remain available while any limitation is assessed
    adaptation: Use seated reach, assistive equipment, a support person or a different familiar task.
      A clinician-prescribed mobility exercise may replace the task only within its existing limits. No
      unsupported balance drill, floor transfer or end-range stretching is required.
    review: Which part of the limitation changed with better access, and which part still needs assessment
      rather than more force?
    examples:
      supportive: A lower shelf allowed controlled cup placement without leaning, and the arrangement
        remained useful the next day.
      mixed: Reach improved, but grip fatigue still limited the task and required a different aid or qualified
        review.
      contradictory: The person forced a painful end range or removed support to obtain a larger movement.
      inconclusive: A flexibility number was recorded without relating it to an everyday task or usable
        control.
  '12.08':
    title: Practice a safe coordination sequence before adding speed
    goal: Distinguish power, speed, reaction and coordination, then improve control of one low-risk movement
      sequence before considering any faster or more forceful version.
    scope_note: A tabletop coordination drill does not demonstrate athletic power, running agility or
      fall-response ability. High-force, ballistic and sport-specific training require suitable conditioning
      and qualified instruction.
    burden: Ten minutes of setup and two five-minute practice sessions with rest.
    setup: 'Place three large colored or labeled cards on a table within comfortable reach. Default sequence:
      touch left, center, right, then center, using a finger or accessible pointer. Keep the arm supported
      as needed. The initial target is four correct contacts at a comfortable pace; no timer, impact,
      competition or forced speed is required.'
    actions:
    - title: Separate the skill components and fix the safe sequence
      instructions: 'Explain the distinctions using the default: coordination is the correct ordered movement,
        reaction is responding to an unexpected cue, speed is how quickly the sequence occurs, and power
        concerns rapid force rather than this light touch. Select the reachable card spacing and support.
        Fix accuracy criteria—correct order, intended target, controlled movement and no symptom-provoking
        reach—before starting.'
      checks:
      - Coordination reaction speed and power are distinguished
      - Card spacing support and movement are safe for current ability
      - Four accuracy and control criteria are fixed in advance
      - The drill is not represented as a power or athletic test
    - title: Practice accuracy and correct one specific error
      instructions: Attempt the sequence three times at a comfortable pace with a short rest between attempts.
        Record which contact was missed or out of order, then change one cue such as numbering the cards
        or speaking the sequence. Retry at the same pace. Stop with pain, fatigue or loss of control;
        do not make the drill harder simply because an error occurred.
      checks:
      - Three bounded attempts or an appropriate stop are recorded
      - Errors are located in a specific contact or transition
      - One cue correction is tested at the same pace
      - Accuracy and symptom limits take priority over speed
    - title: Test a small transfer without claiming broad agility
      instructions: On another suitable day, try the sequence with labels in a new order or a willing
        partner giving one unhurried cue. Change only one feature and keep the same comfortable reach.
        Compare accuracy, control and cue dependence. Decide whether more basic practice, a different
        adaptation or qualified sport instruction is the next step; faster is optional and is not required
        for completion.
      checks:
      - A second session changes only one sequence or cue feature
      - Accuracy control and cue dependence are compared
      - The adaptation remains safe and comfortable
      - Athletic power speed and agility remain explicitly untested
    adaptation: Use eye gaze, a switch, larger targets, verbal selection or an existing therapist-approved
      movement. Preserve the intended sequencing or reaction skill while labeling the different motor
      demands. No catching a falling person, fast direction changes, jumping or heavy lifting is part
      of the exercise.
    review: Did the correction improve the intended movement sequence, and which other physical capacities
      would need separate training?
    examples:
      supportive: Numbered cards reduced order errors and the new layout was completed with controlled
        contacts at the same pace.
      mixed: Accuracy improved with spoken cues but did not transfer when the cue changed, so cue dependence
        remained visible.
      contradictory: The person accelerated through pain or described a tabletop sequence as proof of
        athletic power.
      inconclusive: A fast time was reported without fixed accuracy criteria or an observed sequence.
  '12.09':
    title: Interpret a health-change goal without using appearance as the verdict
    goal: Distinguish body weight, muscle, fat, waist measures, function and clinical markers, then choose
      evidence and a sustainable action that fit an actual health goal.
    scope_note: This is interpretation and care planning, not body-composition measurement, metabolic
      diagnosis or a weight-loss prescription. No weigh-in, waist measurement, calorie target or laboratory
      test is required for the exercise.
    burden: Twenty minutes on the supplied case and one appropriate next action or qualified discussion.
    setup: 'Fictional case: an adult’s scale weight is unchanged, carrying groceries feels easier, clothing
      fit changed and blood-pressure results have not been reviewed. Use four columns—measurement, what
      it may show, what it cannot show, and who can interpret it. The aim is to avoid inferring health
      or tissue change from a photograph or one number.'
    actions:
    - title: Separate the evidence types and their limitations
      instructions: For the case, explain that total weight does not by itself identify muscle or fat
        change, clothing fit is imprecise, function measures a task, and clinical markers need context
        and qualified interpretation. Include waist as another imperfect measure rather than a compulsory
        target. Mark which observations are missing or incomparable. Do not diagnose metabolic health
        from appearance or treat a stable scale as proof of no progress.
      checks:
      - Weight tissue composition waist function and clinical markers are distinguished
      - Each measure has an explicit limitation
      - Missing or incomparable observations remain visible
      - Appearance and a single number do not determine a health verdict
    - title: Choose a health-relevant question and a sustainable route
      instructions: 'Select one question the evidence can reasonably address, such as whether daily carrying
        is easier without pain or whether a clinician needs to review existing results. Choose a non-restrictive
        action within an established plan: repeat a familiar strength session, maintain a workable meal
        pattern or arrange the indicated clinical review. State the expected benefit, burden and what
        would make the plan unsuitable.'
      checks:
      - The question concerns health function or an individually chosen goal
      - The selected evidence can address that question only within its limits
      - The action is sustainable and does not prescribe restriction or testing
      - Burden and a stop or review condition are explicit
    - title: Complete the next action and preserve uncertainty
      instructions: Carry out the selected safe action or qualified contact and record only whether it
        happened and what next step was agreed. For a functional observation, use comparable conditions;
        for clinical results, ask what they mean together and what follow-up is warranted. Retain any
        mismatch between appearance, function and markers. Do not report improved metabolism or changed
        body composition from completing this practice.
      checks:
      - A safe action or qualified contact actually occurs
      - Comparable conditions or clinical context are preserved
      - Conflicting indicators are not hidden
      - No metabolic or tissue-change claim follows from task completion
    adaptation: Use the fictional case throughout when body metrics are distressing or medically inappropriate.
      Existing eating-disorder treatment, pregnancy care and condition-specific guidance take precedence.
      A qualified clinician can choose appropriate monitoring without the app storing personal values.
    review: Which evidence would actually change the health decision, and which attractive-looking number
      is insufficient on its own?
    examples:
      supportive: The person retained the functional improvement and arranged review of existing clinical
        results without inventing a fat-loss conclusion.
      mixed: A useful activity continued, but changing test conditions made the functional comparison
        uncertain.
      contradictory: A photograph or scale change was treated as proof of metabolic health and used to
        justify severe restriction.
      inconclusive: Several body metrics were collected without a health question, interpretation limit
        or sustainable next action.
  '12.10':
    title: Respond to a training-load warning before adding more work
    goal: Distinguish ordinary training effort from warning signs of inadequate recovery, illness or injury,
      and make a proportionate load or care decision using observed function.
    scope_note: This is a conservative recovery decision process, not a diagnosis of overtraining or an
      injury-treatment protocol. Serious or worsening symptoms require timely qualified care.
    burden: Ten minutes to review a recent ordinary activity and brief checks before and after the next
      appropriate session.
    setup: 'Use the default of a familiar exercise session followed by unusual fatigue and poorer control
      on stairs. Make five headings: recent load change, sleep, nourishment and hydration, symptoms, and
      daily function. Do not repeat the provoking activity to prove whether pain is real. Use a fictional
      case when there is no current issue.'
    actions:
    - title: Compare the recent load with recovery and usual function
      instructions: Record any change in duration, intensity, frequency, equipment or environment and
        compare it with recent sleep, food access, fluid needs and illness. Describe symptoms and daily
        function without assigning a diagnosis. For the default, unusual stair difficulty is a reason
        to reconsider the next session, not evidence of productive soreness. Sudden severe pain, major
        swelling, inability to bear weight or a visibly abnormal joint needs prompt medical evaluation.
      checks:
      - Load changes and recovery resources are reviewed together
      - Symptoms are described without a self-diagnosis
      - Daily function is compared with the person’s usual baseline
      - Serious injury signs trigger timely qualified evaluation
    - title: Change the next session or obtain care within the observed limit
      instructions: 'Choose a concrete response: defer the provoking session, reduce a familiar non-provocative
        task, use an existing rehabilitation plan or contact a clinician. Preserve sleep and adequate
        nourishment rather than compensate with stimulants or extra training. State what activity remains
        safe and useful, if any, and what sign means stop. Do not test a painful movement repeatedly or
        take medication simply to mask the signal and continue.'
      checks:
      - The next session is changed or care is sought for a stated reason
      - Sleep nourishment and necessary hydration are protected
      - Any continuing activity has a clear safe boundary
      - Pain is not provoked or masked to meet a target
    - title: Review recovery before any return or progression
      instructions: At the next planned check, compare symptoms and ordinary function with baseline. Follow
        qualified advice when obtained. Resume or progress only within the existing safe plan; if symptoms
        persist, worsen or remain unexplained, seek further assessment instead of declaring recovery from
        elapsed time alone. Record one future load-management change, such as avoiding simultaneous increases
        in session length and difficulty.
      checks:
      - Symptoms and ordinary function are rechecked before return
      - Qualified advice remains controlling when relevant
      - Persistent worsening or unexplained symptoms prompt reassessment
      - A specific future load-management change follows
    adaptation: Use voice notes or a support person to compare function without fitness tracking. For
      chronic illness or post-exertional symptom worsening, use individualized guidance rather than an
      automatic increase schedule. A fictional warning case exercises judgment but not actual recovery.
    review: What changed in the next session because of the warning, and what evidence—not just elapsed
      time—supports returning?
    examples:
      supportive: The provoking session was deferred, a clinician reviewed persistent symptoms and the
        later return followed the agreed plan.
      mixed: Fatigue improved, but stair control had not returned to usual, so progression remained inappropriate.
      contradictory: Pain was masked and workload increased because soreness was assumed to prove an effective
        workout.
      inconclusive: A recovery day was declared without checking symptoms, function or the next load decision.
  '12.11':
    title: Check a substance-risk question before acting on reassurance or fear
    goal: Evaluate substance use through effects, interactions, impairment, dependence and context, and
      obtain appropriate help when risk or loss of control exceeds self-management.
    scope_note: This is risk literacy and help-seeking, not instructions for drug use, detoxification,
      dosing or performance enhancement. Do not start a substance for this exercise or abruptly change
      prescribed treatment.
    burden: Twenty minutes of private review and one pharmacist, clinician or support-service contact
      when a real uncertainty exists.
    setup: 'Default fictional case: someone taking a sedating medicine is invited to drink alcohol before
      driving home. Make a five-part check: substance and actual label, other medicines or drugs, activity
      requiring alertness, pattern of control or withdrawal, and trusted help route. Apply the same questions
      to nicotine, recreational substances, performance drugs and medicines without treating all risks
      as identical.'
    actions:
    - title: Identify the specific risk rather than a moral category
      instructions: For the default, separate alcohol’s impairment, the medicine’s effects, a possible
        interaction and the driving decision. For other substances, identify the actual ingredient and
        uncertainty; familiar, legal or natural does not establish safety. Privately review whether use
        is becoming hard to control or causing harm. Do not enter substance history or medicine names
        into public or application evidence.
      checks:
      - Substance effects interactions and context are separated
      - The actual ingredient or uncertainty is identified
      - Control impairment and harm are considered without moral labeling
      - Sensitive use and medicine details remain private
    - title: Verify the uncertainty and make a safe immediate choice
      instructions: Use the product label and ask a pharmacist or clinician about the specific interaction
        or treatment question. In the default, do not drive impaired and do not combine uncertain sedating
        products while waiting for advice. If alcohol or sedative dependence may be present, seek medical
        support before a sudden reduction or stop; withdrawal can be dangerous. Current overdose, severe
        withdrawal or immediate danger requires emergency help, not a scheduled exercise review.
      checks:
      - The specific uncertainty is checked through a qualified source
      - An immediate impairment risk is not taken while awaiting reassurance
      - Possible dependence is not addressed through unsupervised abrupt cessation
      - Emergency signs or immediate danger take priority over the task
    - title: Put the verified boundary and support route into use
      instructions: 'Carry out one appropriate action: arrange sober transport, ask for a medication review,
        contact treatment support or rehearse declining the fictional offer. Record the boundary, the
        help route and a sign that will trigger using it, without publishing private details. Distinguish
        rehearsal from an actual changed choice and a support appointment from treatment completed. Review
        whether the plan is feasible in the setting where pressure occurs.'
      checks:
      - A safe action or explicitly labeled rehearsal occurs
      - The boundary is based on verified information rather than a myth
      - A feasible support route and trigger are recorded
      - Changed choice help contact and completed treatment are distinguished
    adaptation: Abstainers can use the fictional interaction case without exposure. Use confidential,
      culturally appropriate or accessible services and a trusted support person with consent. The exercise
      never requires drug purchasing, intoxication, withdrawal testing, sharing medications or recording
      another person’s use.
    review: Which decision became safer because the specific interaction or control risk was checked,
      and when will outside help be used?
    examples:
      supportive: The person asked a pharmacist about the medicine and arranged transport rather than
        rely on a friend’s reassurance about driving.
      mixed: A boundary was chosen, but the help service was inaccessible, so an alternative route still
        needed verification.
      contradictory: Alcohol or sedatives were stopped abruptly despite possible dependence, or a substance
        was tried to gather exercise evidence.
      inconclusive: General facts about drugs were listed without resolving the actual interaction, impairment
        or help-seeking decision.
  '12.12':
    title: Practice asking and respecting permission around an ordinary bodily boundary
    goal: Make consent, privacy and control of touch explicit while respecting another person’s equal
      right to decline, pause or choose a different form of participation.
    scope_note: Use a low-stakes, safe situation only. This is not legal advice about medical capacity,
      emergency treatment or safeguarding, and it must not be used to confront an abusive or coercive
      person.
    burden: Fifteen minutes of preparation, one brief willing interaction or rehearsal and a five-minute
      review.
    setup: 'Default: a greeting in which one person prefers a wave rather than a hug. Prepare two sentences:
      Would you prefer a wave or a hug? and A wave works for me. No actual touch is needed. For a medical
      visit, the parallel literacy task is preparing questions about what will happen, privacy, alternatives
      and how to ask for a pause; clinical decisions remain with the appropriate care process.'
    actions:
    - title: Name the boundary and separate permission from assumption
      instructions: Describe the touch, privacy or examination situation without assuming that familiarity,
        politeness or previous agreement supplies current permission. Write the participant’s own preference
        and a respectful way to ask another person’s preference. Include a no-touch option and a way to
        pause. Identify any power or safety concern that makes a live interaction inappropriate; do not
        make disclosure of personal history a condition of the boundary.
      checks:
      - The bodily or privacy boundary is specific
      - Current permission is not inferred from familiarity or prior agreement
      - A no-touch option and pause route are explicit
      - Power and safety concerns determine whether live practice is suitable
    - title: Ask once and let the answer determine the action
      instructions: With a willing person in a safe ordinary setting, ask the prepared question and wait
        for a clear response. Accept a decline, uncertainty or a changed preference without bargaining,
        teasing or demanding a reason. Use the wave or other non-contact option when permission is absent
        or unclear. If practicing alone, speak both sides of the default and label it rehearsal rather
        than evidence of another person’s consent.
      checks:
      - A clear question is asked without pressure
      - Decline uncertainty or changed preference is respected
      - The actual action follows the permission given
      - Rehearsal is not reported as live consent or touch
    - title: Review privacy and repair any overstep
      instructions: Check whether either person’s preference changed and whether the response remained
        easy to give. If an overstep occurred, stop, acknowledge it and ask what practical repair is welcome
        without demanding forgiveness. For a care appointment, use the prepared questions with the clinician
        and clarify the applicable process rather than assume universal legal rules. Retain only a minimal
        observation, not someone’s private explanation.
      checks:
      - The review includes freedom to change or withdraw a preference
      - An overstep prompts stopping and accountable repair
      - Medical or legal process questions are referred to the appropriate professional
      - Private explanations are not retained as evidence
    adaptation: Use AAC, signs, written choices, an interpreter or a support person chosen by the participant.
      Respect cultural greetings without requiring contact. In coercion, exploitation or unsafe dependency,
      prioritize a safety plan and qualified support rather than a boundary demonstration.
    review: Was declining or changing the preference genuinely possible, and did the action follow that
      preference without penalty?
    examples:
      supportive: A wave was chosen and accepted without explanation, and the greeting remained friendly.
      mixed: The question was asked, but a joke made declining awkward, so the delivery needed repair.
      contradictory: Past consent or a relationship role was treated as permission for unwanted touch
        or disclosure.
      inconclusive: Consent language was memorized while the person’s actual answer had no effect on the
        action.
  '12.13':
    title: Prepare a presentation routine that serves the occasion and the person
    goal: Use hygiene, clothing, comfort and presentation to support health, identity and participation
      without turning appearance, brand or body shape into a measure of worth.
    scope_note: This is a practical readiness routine, not a beauty standard, dress-code legal opinion
      or requirement to mask disability, culture, gender expression or sensory needs.
    burden: Twenty minutes to prepare for one real low-stakes occasion and five minutes afterward.
    setup: 'Default occasion: a casual meeting in a shared indoor space. Use existing clothes and familiar
      hygiene products. The supplied check is clean enough for the context, comfortable movement and temperature,
      any legitimate safety requirement, and an appearance choice that feels like you. No purchase, fragrance,
      cosmetic procedure or forced posture is required.'
    actions:
    - title: Translate the occasion into functional requirements
      instructions: Identify the setting, temperature, activity and any verified safety or uniform requirement.
        Separate those requirements from assumptions about status or attractiveness. Check the clothing’s
        condition, comfort when sitting or moving, and the hygiene task actually needed. Keep cultural
        dress, gender expression, assistive equipment and sensory constraints visible rather than treat
        them as defects to conceal.
      checks:
      - The occasion’s actual functional requirements are identified
      - Status and attractiveness assumptions are separated from requirements
      - Clothing condition comfort and needed hygiene are checked
      - Identity access and sensory needs remain legitimate constraints
    - title: Complete a small routine using what is already available
      instructions: Perform the familiar hygiene step, choose a clean suitable outfit and make one simple
        repair or adjustment if needed, such as removing a stain according to the label or replacing an
        uncomfortable layer. Test sitting, reaching and walking or wheeling in the outfit. Avoid unfamiliar
        products that may irritate skin or unsafe attempts to force a particular posture; use established
        care guidance for medical or skin concerns.
      checks:
      - A concrete hygiene and clothing routine is completed
      - Existing items are used before assuming a purchase is necessary
      - The outfit is tested during the actual required movements
      - Irritation medical needs and unsafe posture demands are not ignored
    - title: Attend or rehearse and judge function rather than approval
      instructions: Use the routine at the occasion or a realistic private rehearsal. Note comfort, access,
        temperature, ability to participate and any actual rule issue; do not infer success from compliments
        or imagined judgments. Keep one useful preparation step and change one source of avoidable discomfort.
        If a rule creates an access or identity conflict, seek an appropriate accommodation or clarification
        rather than blame the body.
      checks:
      - The routine is used in the occasion or labeled rehearsal
      - Function and comfort are assessed independently of compliments
      - A useful step and a needed adjustment are identified
      - Access or identity conflicts receive a practical clarification route
    adaptation: Use fragrance-free products, seated grooming, adaptive fasteners, a helper with consent
      or culturally appropriate dress. Limited laundry, money or housing access may require support, not
      a stricter standard. A person need not look conventional to be dignified or prepared.
    review: Did the routine remove an obstacle to participation while leaving identity and comfort intact?
    examples:
      supportive: A clean existing shirt and an extra layer met the setting’s needs and allowed comfortable
        participation without buying anything.
      mixed: The outfit looked appropriate but restricted reaching, so a different fit became the practical
        improvement.
      contradictory: Painful posture or unwanted identity concealment was imposed to meet an imagined
        attractiveness standard.
      inconclusive: Brands and appearance were rated without checking hygiene, movement, context or actual
        participation.
  '12.14':
    title: Connect a present movement habit to a future participation goal
    goal: Plan lifelong movement around valued function, including strength, balance, bone-loading where
      appropriate, carrying, transfers and mobility rather than only short-term appearance or performance.
    scope_note: This is a functional planning and familiar-activity trial, not a fall-risk assessment,
      bone-health prescription or test of independent living. Assistance and adaptation remain valid lifelong
      outcomes.
    burden: Twenty minutes to map functions and two short ordinary movement opportunities over one week.
    setup: 'Default future goal: continue joining a friend at a nearby community garden. Map the required
      functions: travel to the site, move along the path, carry a light personal item, sit and rise or
      transfer with usual assistance, and remain comfortable enough to participate. Do not attempt an
      unfamiliar floor rise, unsupported balance task or loaded carry for assessment.'
    actions:
    - title: Map the future activity to present functions and supports
      instructions: List the actual functions needed for the chosen participation goal and mark each already
        supported, needs adaptation or needs qualified assessment. Include strength, endurance, balance,
        mobility and any appropriate bone-health discussion rather than treating one exercise as sufficient.
        Identify existing aids, transport and social support. Choose one familiar low-risk function to
        practice now, such as a short level walk or usual supported transfer.
      checks:
      - The future participation goal has concrete functional demands
      - Strength endurance balance mobility and bone-health questions receive a disposition
      - Aids transport and assistance are included rather than treated as failure
      - Only a familiar appropriate function is selected for the trial
    - title: Practice the function within current ability twice
      instructions: Use the selected familiar activity on two suitable occasions with the usual aid, helper
        or established plan. Record whether it supported participation, how controlled it felt and the
        recovery cost. Keep the dose modest and unchanged; stop for concerning symptoms or instability.
        The point is to build a sustainable link to the valued activity, not to prove independence by
        removing support.
      checks:
      - Two suitable opportunities or their absence are recorded
      - Usual assistance and established limits remain in place
      - Control participation and recovery are observed together
      - No unsupported transfer balance or load challenge is introduced
    - title: Build a small maintenance and adaptation plan
      instructions: Choose when the familiar activity can recur and one review point, such as a month
        or a change in health, environment or access. Identify a missing function that needs qualified
        instruction and one environmental improvement that can help now. State how the garden goal could
        continue if walking, carrying or transfer ability changes; preserving participation may mean more
        support, not abandoning the goal.
      checks:
      - A realistic recurrence and review trigger are set
      - A missing function has an appropriate instruction or assessment route
      - One present environmental or support improvement is identified
      - The goal includes a dignified pathway when capacity changes
    adaptation: Use wheeling, seated activity, assisted movement, transport or a different valued destination.
      Bone health, pregnancy, injury and chronic disease may need individualized advice. A functional
      map without a safe movement opportunity is planning evidence only.
    review: Which current habit protects a valued future activity, and how will that activity remain possible
      if the required support changes?
    examples:
      supportive: Short familiar outings were sustainable and a bench location was identified, preserving
        the garden visit with support.
      mixed: The movement was manageable, but inaccessible transport remained the main obstacle and needed
        a separate solution.
      contradictory: An unsafe floor-rise or balance challenge was used to prove that assistance was unnecessary.
      inconclusive: A distant longevity goal was named without connecting it to present function, support
        or an actual habit.
  '12.15':
    title: Adapt one movement goal without losing its meaning or safety
    goal: Modify mode, environment, support, duration and progression for changing capacity while preserving
      a personally meaningful movement or participation goal.
    scope_note: This is an adaptation process, not a condition-specific exercise prescription. Disability,
      chronic illness, pregnancy, aging and injury may require different qualified guidance; they are
      not interchangeable limitations.
    burden: Twenty minutes to prepare, one appropriate movement opportunity and a short follow-up after
      recovery.
    setup: 'Default goal: join a friend for a brief outdoor conversation when a long walking route is
      unsuitable. Candidate adaptations are a shorter accessible path, a seated meeting, wheeling, transport
      to a bench or a clinician-approved movement interval. Use an existing safe plan and ask the participant
      what part of the activity matters; do not assume walking itself is the only valued outcome.'
    actions:
    - title: Separate the meaningful aim from an unnecessary physical format
      instructions: 'State the aim in the participant’s own terms and list the actual constraints: symptoms,
        energy variability, mobility, pregnancy-related guidance, recovery, weather, equipment or access.
        Give each relevant constraint a current-information or advice-needed status. Choose what must
        stay, such as companionship or a familiar movement dose, and what can change. Do not infer a person’s
        limits from a diagnosis or visible disability alone.'
      checks:
      - The meaningful aim is chosen by the participant
      - Relevant constraints are specific rather than diagnosis-based assumptions
      - Unknown medical or progression questions are marked for qualified advice
      - Essential aims are separated from changeable activity format
    - title: Arrange and try the individualized version
      instructions: Confirm the route, equipment, assistance and exit plan before the opportunity. Use
        only the familiar or qualified-approved dose, with an option to rest, shorten or stop without
        social penalty. For the default, meet at the accessible bench and use the existing tolerated movement
        interval only if appropriate that day. Record the adaptation actually used and whether it preserved
        the intended meaning.
      checks:
      - Access equipment assistance and exit arrangements are confirmed
      - The dose follows current ability or an existing qualified plan
      - Rest shortening and stopping remain real options
      - The adaptation is tested against the participant’s intended aim
    - title: Review immediate and delayed fit before changing the dose
      instructions: Check comfort, participation and recovery at the appropriate later point, including
        delayed symptom effects. Retain the version, reduce it or seek individualized guidance; do not
        automatically increase duration because one attempt succeeded. Record one change that would make
        the next opportunity more accessible. If the meaningful aim was met through a seated or assisted
        version, preserve that success without pretending the same physical demand was performed.
      checks:
      - Immediate and delayed effects are both considered
      - Progression is individualized rather than automatic
      - One next access improvement is identified
      - Meaningful participation and physical dose are reported separately
    adaptation: Use a fictional planning case when physical participation is currently unsuitable. For
      post-exertional worsening, acute injury, pregnancy complications or other medical uncertainty, use
      the relevant professional plan and do not test limits. Assistance and adaptive equipment are not
      penalties.
    review: Did the adaptation preserve what mattered while fitting the person’s actual capacity before,
      during and after the activity?
    examples:
      supportive: A bench-based visit preserved companionship and the short approved movement interval
        did not create an unacceptable recovery cost.
      mixed: The outing felt manageable at the time, but delayed symptoms required a lower dose and clinical
        discussion.
      contradictory: A generic progression was imposed or aids withheld to make the activity count as
        real exercise.
      inconclusive: An adaptation was selected from a diagnosis label without asking the person’s goal
        or checking its actual fit.
  '12.16':
    title: Make a safe pain-response decision without diagnosing the pain yourself
    goal: Describe pain and its functional effects, distinguish common pain concepts from a diagnosis,
      and choose appropriate modification or evaluation rather than reckless persistence or blanket withdrawal.
    scope_note: This is pain literacy and communication, not triage certification, diagnosis or treatment.
      New severe symptoms, possible serious injury or emergency signs require prompt care; a known chronic-pain
      plan does not rule out a new problem.
    burden: Fifteen minutes with the supplied cases and, when relevant, one appropriate care or load-modification
      action.
    setup: 'Use three fictional cases: mild familiar muscle soreness after an ordinary session; sudden
      severe ankle pain with inability to bear weight after a twist; and a long-standing pain flare under
      an existing clinical plan. Make headings for onset, location and quality, associated changes, function,
      existing plan and next help route. Do not provoke pain to create an example.'
    actions:
    - title: Describe the case and separate concepts from conclusions
      instructions: For each case, record onset and functional change before choosing a label. Explain
        that acute injury, familiar post-activity soreness and chronic pain are different possibilities,
        not diagnoses from a word list; pain can also be felt away from its source. Fear and stress may
        affect experience without making pain imaginary. Mark information that only a qualified assessment
        can resolve.
      checks:
      - Onset symptoms and function precede any interpretation
      - Soreness acute injury chronic pain and referred symptoms are distinguished conceptually
      - Psychological influences do not invalidate the pain report
      - Diagnostic uncertainty and missing information remain explicit
    - title: Choose the proportionate immediate response
      instructions: For the severe ankle case, stop loading the injury and obtain prompt qualified evaluation
        rather than repeatedly testing it. For the chronic-pain case, follow the existing individualized
        flare plan while checking for new or changed symptoms. For familiar mild soreness, choose a conservative
        non-provocative activity modification and monitor function. Emergency symptoms such as chest pain,
        severe breathing difficulty or new neurological deficit require urgent local emergency help, not
        this worksheet.
      checks:
      - The response matches the observed severity and functional change
      - Possible serious injury is not repeatedly provoked
      - An existing chronic-pain plan does not erase new-symptom concerns
      - Emergency symptoms bypass the exercise for urgent help
    - title: Communicate clearly and review the response
      instructions: When a real concern exists, use the six headings to contact the appropriate clinician
        and ask what activity is appropriate, which changes need urgent attention and when to review.
        Carry out the agreed modification or care step and note whether ordinary function improves, worsens
        or remains uncertain. Do not stop all movement indefinitely from fear or resume a painful task
        merely because a preset number of days passed.
      checks:
      - A real concern receives an appropriate communication or care action
      - Activity limits warning signs and review timing are clarified
      - Function is rechecked after the chosen response
      - Neither indefinite avoidance nor calendar-only return substitutes for a plan
    adaptation: Use body diagrams, descriptive words, an interpreter or a chosen support person. People
      with communication differences still deserve their pain to be taken seriously. Keep health details
      outside app evidence; case reasoning alone is not evidence of a personal recovery.
    review: What did the description make clear to the care decision, and what uncertainty still requires
      assessment rather than reassurance or force?
    examples:
      supportive: The sudden injury was evaluated promptly, while the familiar chronic flare followed
        its existing plan with a check for new symptoms.
      mixed: The initial modification reduced burden, but function remained limited and the review appropriately
        led to further assessment.
      contradictory: Pain was dismissed as psychological or deliberately provoked to prove that continuing
        was safe.
      inconclusive: Pain categories were memorized without a proportionate response, help route or follow-up
        of function.
