schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '26'
exercises:
  '26.01':
    title: Keep two play windows free from an output goal
    goal: Choose, enjoy and return to a safe form of play without making improvement, publication, winning
      or measurable output the reason it must be worthwhile.
    scope_note: This is a companion to the frozen Schedule Non-Instrumental Play protocol. It explains
      the existing reserve–play–return sequence without changing its runtime instructions, observation
      fields, timing or completion rules. Companion checks are private reading aids, not new app evidence
      fields.
    burden: About fifty to seventy-five minutes across two play windows within ten days; shorter or split
      accessible variants remain legitimate.
    setup: Use an activity already available, such as an ordinary no-stakes game, playful storytelling,
      music or a harmless imaginative variation of a routine. Default to inventing an absurd story about
      a household object, alone or with a willing person. Reserve at least thirty minutes within the next
      three days under the existing protocol, or use its explicitly allowed shorter accessible variant
      when needed.
    actions:
    - title: Reserve an actual window and remove the output contract
      instructions: 'Choose the concrete activity, time and safe place, and check that essential responsibilities,
        care, cost and other participants’ consent permit it. State what you will not require from the
        window: no polished story, audience, skill gain, ranking or public post. Use materials already
        available and keep gambling, substances, unsafe physical acts and costly purchases outside the
        activity. A calendar intention is preparation; it is not evidence that play happened.'
      checks:
      - A specific freely chosen play window is reserved
      - Essential responsibilities safety cost and consent are checked
      - No output improvement or publication requirement is attached
      - A reservation is not recorded as completed play
    - title: Use the window for play rather than assessment
      instructions: Begin the chosen activity and allow harmless changes, mistakes and silliness without
        grading them. For the default, let the fictional object have an improbable problem and follow
        whatever happens next; no finished story is needed. During the window, do not time performance,
        optimize, publish or turn the activity into work. Stop or adapt if it becomes unsafe, pressured
        or compulsive. Any later private observation concerns what occurred, not how much happiness you
        produced.
      checks:
      - The reserved activity actually occurs
      - Harmless spontaneity and unfinished play are allowed
      - The window stays free of measurement optimization and publication
      - Safety or coercion overrides continuing the activity
    - title: Return once and compare without grading enjoyment
      instructions: Within seven days, return for another short period or choose a second playful activity
        as the existing protocol allows. Afterward, note what made free play possible, what constrained
        it and whether the second window supported or contradicted the first. Use only the app’s existing
        available observation fields and report honestly; do not invent missing legacy fields or translate
        these companion checks into a new score. Completion remains distinct from stable leisure capacity
        or worth.
      checks:
      - A second actual play period occurs within the existing return window
      - The two experiences are compared only afterward
      - Companion checks do not replace frozen runtime evidence fields
      - Enjoyment intensity is not treated as a performance or worth measure
    adaptation: Solo, shared, digital, analog, seated, low-sensory and supported play are legitimate.
      Shorten or split the window under the existing accessible variant without hiding the actual duration.
      Defer when rest or essential responsibilities take priority. Gambling, substance use, unsafe activity
      and pressured participation are not alternate pathways.
    review: What let play remain freely chosen, and when did the desire to improve, prove or publish begin
      to take over?
    examples:
      supportive: The person reserved a window, enjoyed an unfinished absurd story and returned once without
        converting either period into a product or performance test.
      mixed: Play occurred but repeatedly shifted into optimization, so the second window used a simpler
        activity and the difficulty stayed visible.
      contradictory: The practice displaced essential care, pressured another person or introduced money
        risk in order to count as play.
      inconclusive: A window was scheduled but no play occurred, or an imagined sense of enjoyment was
        recorded as an actual experience.
  '26.02':
    title: Find a form of leisure that restores rather than merely fills time
    goal: Use a bounded period of rest or recreation deliberately and learn whether it restores attention,
      relationship or vitality without making rest another achievement test.
    scope_note: Three ordinary leisure periods provide context-bound observations, not a sleep, fatigue,
      mental-health or addiction treatment and not proof that one activity restores everyone.
    burden: Three twenty-minute periods over a week and one ten-minute review; reduce duration to actual
      capacity.
    setup: 'Choose two safe accessible options already available: a quiet unstructured period with no
      task and a gentle chosen recreation such as reading for pleasure, listening to familiar music or
      sitting with a willing person. Keep essential care and necessary access supports in place. Prepare
      only a short after-period note about activity, fit and what felt different; no live monitoring is
      required.'
    actions:
    - title: Protect a rest window and name what it is for
      instructions: 'Identify a realistic opening and what currently needs restoration: attention, social
        ease, physical rest or simple freedom from demands. Reserve a short period without requiring a
        useful output, improved mood or completed entertainment. Choose the quiet option for the first
        occasion and state a boundary around optional interruptions while preserving urgent care or safety
        contact. Notice whether guilt or comparison tries to turn the period into another obligation.'
      checks:
      - The intended kind of restoration is named without a required result
      - A realistic window protects essential responsibilities
      - The first period has no output or improvement quota
      - Necessary safety contact and access supports remain available
    - title: Try the alternative and repeat the better-fitting condition
      instructions: After the first period, note whether it felt restorative, neutral, agitating or hard
        to interpret and why. On a second occasion try the chosen recreation, then repeat the condition
        that seems more suitable on a third ordinary occasion. Keep differences in sleep, illness, workload
        and setting visible; do not claim the activity caused every change. Stop or change an option that
        becomes compulsive, costly or makes necessary recovery harder.
      checks:
      - Two distinct leisure conditions are actually tried
      - A third period repeats a reasoned choice
      - Neutral adverse and uncertain effects remain valid observations
      - Context and possible compulsion are not ignored
    - title: Make room for rest without demanding proof every time
      instructions: Compare the three periods and identify one practical condition that helped, such as
        fewer optional notifications, a comfortable setting or a willing companion. Choose a sustainable
        next opportunity and a condition for changing the plan. A Sabbath, vacation or longer recovery
        period may express the same aim but is not required. If persistent exhaustion or severe distress
        remains, seek appropriate care rather than concluding that you failed at leisure.
      checks:
      - All actual periods inform the comparison
      - One practical enabling condition is identified
      - A sustainable next opportunity does not require continual scoring
      - Persistent concerning symptoms are not reduced to a leisure failure
    adaptation: Use shorter periods, low-sensory recreation, supported rest or accessible media. Caregiving,
      shift work, disability and scarcity can limit options; do not shame a person for those constraints.
      Screen-based leisure can be legitimate when freely chosen and fitting, and offline leisure is not
      automatically superior.
    review: Which conditions made leisure restorative or not, and how can you protect that possibility
      without demanding that every rest period earn its place?
    examples:
      supportive: The person found that quiet music restored attention more reliably than an open-ended
        feed and protected a modest repeat window without a productivity target.
      mixed: The periods were mostly neutral during a difficult week, so the plan retained rest while
        leaving broader causes of fatigue unresolved.
      contradictory: Rest was withheld until enough work was done or a compulsive activity was defended
        despite clear harm.
      inconclusive: A leisure ideal was described without trying an actual period or reviewing its fit.
  '26.03':
    title: Give a low-cost interest four chances to become part of life
    goal: Develop an enjoyable interest outside primary work through repeated participation, modest learning
      and an optional community connection without requiring prestige or monetization.
    scope_note: Four sessions begin an interest; they do not prove lifelong commitment or require turning
      enjoyment into a profession. Changing or dropping an ill-fitting hobby is legitimate.
    burden: Four fifteen-to-thirty-minute sessions over two weeks and a fifteen-minute review.
    setup: Default to making and solving small original word puzzles on paper. Session one invents a five-word
      category puzzle, session two solves or improves it, session three tries a different category and
      session four shares a puzzle with a willing person or continues privately. Another safe accessible
      interest already available may replace this default with the same modest scope.
    actions:
    - title: Choose the interest for its experience rather than its image
      instructions: 'State what attracts you: curiosity, pleasure, identity, craft or company, and what
        you do not need from it, such as income, status or expert performance. Set a small time and cost
        limit and do the first session with existing materials. For the default, choose five words linked
        by a category and write a clue that permits more than a wild guess. Keep the result even if it
        is too easy or unclear.'
      checks:
      - The chosen interest has a personal experiential reason
      - Time and cost limits precede equipment or status purchases
      - A first small session actually occurs
      - The result is kept without a mastery or prestige requirement
    - title: Return for three different kinds of engagement
      instructions: Complete the remaining three short sessions at realistic times, including one attempt
        to learn or improve a small feature and one freely chosen variation. For the puzzle, test whether
        the clue distinguishes the intended category and revise one ambiguous word. Seek an optional welcoming
        community resource or willing participant, checking norms before joining or sharing. Record missed
        sessions honestly and do not add obligations merely to make the hobby look serious.
      checks:
      - Three further actual sessions or missed opportunities are recorded
      - One small skill feature is learned or refined
      - A variation preserves enjoyment rather than only repetition
      - Any community contact is voluntary and norm-aware
    - title: Choose a sustainable place for the interest
      instructions: Review enjoyment, burden, learning and any sense of connection across the sessions.
        Decide to continue at a modest cadence, change the form, pause or stop, giving a reason grounded
        in experience. Store materials so returning is easy without taking over necessary space. State
        what would keep the interest free from monetization or status pressure, and set a future review
        instead of promising lifelong devotion after two weeks.
      checks:
      - The review uses all actual sessions
      - Continuation change pause or stop has a reason
      - Materials and cadence fit ordinary life
      - No income prestige or lifelong commitment is required
    adaptation: Use accessible puzzles, listening, collecting observations, low-movement craft or another
      safe affordable form. No public group is necessary. Avoid hobbies involving gambling, hazardous
      equipment, unaffordable collecting or pressure to overcome pain or sensory limits.
    review: What made you want to return for the activity itself, and what would preserve that reason
      as skill or community grows?
    examples:
      supportive: Four small puzzle sessions produced enjoyment and a welcome exchange, so the person
        chose a modest weekly return without trying to sell the puzzles.
      mixed: The activity was pleasant alone but the group format felt pressured, leading to a private
        version.
      contradictory: Expensive equipment or public status became the main goal, or pain and obligations
        were ignored to prove dedication.
      inconclusive: A hobby identity was adopted without repeated participation or a review of actual
        enjoyment and burden.
  '26.04':
    title: Observe one nearby place three times without disturbing it
    goal: Notice seasons, weather, land, living things and human dependence through regular contact with
      one accessible place rather than treating nature as an interchangeable backdrop.
    scope_note: Three observations support place-specific attention, not ecological expertise or a claim
      that nature contact treats a health condition. Identification uncertainty and access limits are
      expected.
    burden: Three ten-minute observations over one or two weeks and a fifteen-minute comparison.
    setup: Choose a safe permitted view of a tree, planted area, courtyard or patch of sky, including
      a window view. Use the same observation point where practical. Prepare headings for weather, light,
      land or surface, plants, animals or their absence, and human influence. Do not touch, feed, collect
      or approach wildlife to obtain a better observation.
    actions:
    - title: Notice the place before trying to name everything
      instructions: At the first visit or window observation, record what is actually visible, audible
        or available through an accessible description. Note the date, approximate conditions and three
        specific details, such as leaf movement, shade position or water on a surface. Write unknown rather
        than guessing a species. Identify one human dependence on the place, such as shade, drainage,
        food production or shared space, without claiming a measured benefit.
      checks:
      - A consistent safe observation point is chosen
      - Three concrete details and conditions are recorded
      - Unknown identification remains unknown
      - One human dependence is considered without an unsupported measurement
    - title: Return twice and distinguish change from a different viewpoint
      instructions: Repeat the observation on two later occasions. Compare light, weather, living activity
        and human use while noting any changed time or vantage point. Record absence and no visible change
        as valid results; do not provoke an animal or manipulate a plant to make the record interesting.
        Use one official local natural-history or land-manager resource to investigate a question, and
        retain a tentative identification when the evidence is insufficient.
      checks:
      - Two later observations occur without disturbing the place
      - Context differences are separated from possible ecological change
      - Absence and unchanged conditions are retained
      - One question is investigated through an appropriate source with uncertainty intact
    - title: Let attention change one ordinary relationship to the place
      instructions: Compare the three records and identify something you now notice that you previously
        missed. Choose one small responsible response within your control, such as respecting a planted
        edge, keeping a route clear or learning the site’s care rules. Carry out that response and describe
        its actual scope. Gratitude or wonder may occur but is not required, and a short observation series
        does not establish ecosystem health.
      checks:
      - The comparison identifies a previously missed detail or relationship
      - A specific permitted response follows from the observation
      - The response actually occurs or is marked unperformed
      - No emotional or ecological outcome is exaggerated
    adaptation: Use a window, accessible garden, soundscape or approved virtual observation project when
      outdoor access is limited. A virtual view can support attention but should not be called a physical
      visit. Follow current weather, access and health constraints and do not disclose sensitive wildlife
      locations publicly.
    review: What became particular about this place after returning, and what responsibility follows from
      noticing it more accurately?
    examples:
      supportive: Repeated window observations revealed how shade and runoff changed after weather, and
        the person stopped cutting across the planted edge.
      mixed: Only two observations were possible and species identity stayed uncertain, but a specific
        place relationship still became clearer.
      contradictory: Wildlife was fed or disturbed for a better record, or three visits were presented
        as proof of ecological health.
      inconclusive: Nature was described as beautiful in general without repeated observations or a concrete
        responsible response.
  '26.05':
    title: Prepare and review a modest outing with place-specific limits
    goal: Match a chosen outdoor activity to present capability, navigation, conditions and low-impact
      responsibilities rather than relying on enthusiasm or generic equipment lists.
    scope_note: The default is a short familiar maintained route or accessible park area, not remote travel,
      technical terrain, water entry or a test of survival skills. A planning exercise alone is not safe
      participation evidence.
    burden: Twenty minutes of preparation, a short outing only when suitable and a fifteen-minute return
      review.
    setup: Choose a nearby permitted maintained path with a clear return point and an accessible alternative.
      Before choosing a date, use the actual land manager’s information for access, current conditions,
      rules and closures, plus an appropriate current weather source. Set a conservative return time and
      arrange suitable support or companionship where needed.
    actions:
    - title: Match the plan to the least-supported real requirement
      instructions: Write route, start and return points, expected duration, access needs, communication
        limits and who knows the plan. Check terrain, weather, water and shade availability, daylight
        and local hazards through current authoritative information. Choose necessary clothing, water
        and other support appropriate to the actual setting without imposing a universal quantity. Set
        no-go and turn-back conditions in advance; uncertainty about an essential condition can mean choosing
        the accessible alternative or deferring.
      checks:
      - Route timing access and communication are explicit
      - Current land-manager and weather information are checked
      - Support matches the actual setting and participants
      - No-go and turn-back conditions are defined before departure
    - title: Participate within the plan and minimize impact
      instructions: If the conditions fit, follow the permitted route, check position at a known junction
        and keep the return limit. Stay within the site’s current rules for surfaces, waste, wildlife,
        objects and other users; do not create a shortcut, collect artifacts or light a fire as part of
        the exercise. Adapt or turn back when conditions change rather than completing the route at any
        cost. If the outing is deferred, record the preparation without claiming outdoor performance.
      checks:
      - An actual outing or honest deferral is recorded
      - Position and return limit are checked during participation
      - Site-specific impact and other-user rules are followed
      - Changing conditions can lead to adaptation or turning back
    - title: Review the return as a capability and responsibility check
      instructions: Confirm safe return with the appropriate person, then compare planned and actual time,
        route, effort, access and equipment usefulness. Identify one navigation or preparation gap and
        one effect on the place or other users. Choose a specific improvement before any harder outing.
        A completed easy route does not authorize remote, technical or water-based activity beyond training
        and support.
      checks:
      - Return communication is completed where applicable
      - Plan and actual conditions are compared
      - One capability and one stewardship lesson are identified
      - Future challenge is bounded by training rather than successful completion alone
    adaptation: Use a seated park visit, accessible path, supported route or tabletop when conditions
      are unsuitable. Keep prescribed and assistive supports. Do not enter heat, cold, storms, unsafe
      terrain or water to create a challenge; qualified instruction is required for specialized environments
      and skills.
    review: Which preparation mattered in the actual conditions, and what did you change to protect both
      participants and the place?
    examples:
      supportive: The participant checked a closure, used the permitted accessible route, verified a junction
        and returned early when conditions changed.
      mixed: The plan was complete but weather made the outing unsuitable, so participation remained untested
        rather than falsely completed.
      contradictory: A shortcut damaged vegetation or the return limit was ignored to finish despite worsening
        conditions.
      inconclusive: An equipment list was made without a specific route, current conditions, navigation
        check or return review.
  '26.06':
    title: Visit or study a place as someone’s home rather than a backdrop
    goal: Connect geography, history, language, etiquette and the effects of visiting to respectful curiosity
      about a specific place.
    scope_note: A modest local visit or a labeled virtual study is not a complete travel plan, cultural
      expertise or assurance of personal safety. Current access and travel requirements remain separate
      checks.
    burden: Thirty minutes of preparation, a short permitted visit or virtual study and a fifteen-minute
      reflection.
    setup: 'Choose a local public museum, library history display, neighborhood heritage site or an official
      online exhibit. Use the site’s own visitor information and one locally authored historical or community
      source. Prepare a simple map and five headings: geography, historical change, everyday use, visitor
      etiquette and visitor effects. No paid travel is required.'
    actions:
    - title: Learn enough context to arrive considerately
      instructions: Locate the place on a map and identify a geographical feature or transport connection
        that shapes its use. Read one sourced historical account and note what changed and whose perspective
        it represents. Verify current opening or online access, physical or sensory access needs and rules
        for photos, dress, quiet or participation. Learn a relevant greeting or courtesy from a reliable
        local source when another language is used; do not invent a phrase or expect local people to teach
        you on demand.
      checks:
      - The place is located geographically rather than only by attraction name
      - One sourced historical change and perspective are identified
      - Current access and visitor etiquette are checked
      - Any language preparation is accurate and not demanded from unwilling people
    - title: Attend to ordinary use and ask only welcome questions
      instructions: During the permitted visit, notice how residents, workers or regular users use the
        place in addition to visitors. Follow posted and communicated rules, ask permission before photographing
        people and avoid blocking access for a picture. Ask one welcome factual question or use the official
        exhibit to investigate it. For a virtual study, record what cannot be learned about embodied access
        or everyday interaction rather than pretending to have visited.
      checks:
      - Actual visit and virtual study are labeled correctly
      - Ordinary local use receives attention
      - Photography questions and movement respect consent and access
      - One question is investigated without extracting unpaid personal testimony
    - title: Review what visiting gives and what it costs
      instructions: Identify one learned detail, one assumption corrected and one continuing misunderstanding.
        Consider crowding, worker burden, local spending, housing or environmental effects where relevant,
        distinguishing observations from claims needing evidence. Choose one proportionate response such
        as following a less disruptive route, crediting a local source or sharing an accurate correction.
        Do not reduce the place to a personal transformation story or claim a visit automatically benefits
        residents.
      checks:
      - Learning corrected assumptions and remaining uncertainty are recorded
      - Visitor benefits and burdens are considered separately
      - A proportionate respectful response is chosen
      - The place is not treated only as a setting for the visitor’s identity
    adaptation: Use a free local site or accessible official virtual exhibit. A person can learn respectfully
      without travel, photography or spending. International journeys need current official document,
      health and safety checks; this exercise does not replace them or require contact with unsafe people
      or settings.
    review: What became visible when you treated the place as part of other people’s ordinary lives, and
      what did you change about your own way of visiting?
    examples:
      supportive: The visitor learned how the site’s geography shaped local work, respected a photo restriction
        and corrected an inaccurate story in their own notes.
      mixed: The online exhibit added historical context but left current everyday use uncertain, which
        remained explicit.
      contradictory: People were photographed without permission or the place was reduced to an exotic
        backdrop for self-presentation.
      inconclusive: Attractions were listed without geography, history, etiquette, local perspective or
        visitor-impact reflection.
  '26.07':
    title: Encounter an unfamiliar practice without ranking or romanticizing it
    goal: Learn from a different way of living while distinguishing observation, interpretation and unresolved
      meaning instead of demanding sameness or treating difference as exotic wisdom.
    scope_note: One invited encounter or community-authored account is not expertise in a culture or permission
      to participate in restricted practices. No person must serve as a cultural representative.
    burden: Twenty minutes of preparation, one bounded encounter or source study and a twenty-minute comparison.
    setup: Choose an unfamiliar ordinary practice described by its participants, such as a community meal
      custom, a public festival routine or a different way of organizing shared time. Use an explicitly
      welcoming public event or a community-authored account. Prepare columns for what happens, participants’
      stated meaning, your interpretation and what remains unknown.
    actions:
    - title: Name your expectation before the encounter
      instructions: Write one assumption you bring and what observation might revise it. Verify whether
        the practice is public, whether visitors may participate and what conduct is appropriate. Identify
        whose account you are using and whether other participants might understand it differently. Do
        not frame the group as primitive, advanced, uniformly spiritual or uniformly oppressive before
        studying the actual practice.
      checks:
      - A prior assumption and possible revision are explicit
      - Public access and participation boundaries are checked
      - The source’s perspective and limits are identified
      - No whole culture is ranked or romanticized in advance
    - title: Observe or study while preserving the participants’ meaning
      instructions: Attend or read the authorized account and record three concrete features of the practice.
        Distinguish the participants’ own explanation from your analogy to something familiar. Ask a question
        only when invited and accept that some meanings or details are not yours to access. Notice both
        a good the practice may serve and a tension or burden without using either to make a total judgment
        about the people.
      checks:
      - Three concrete features are recorded
      - Participants’ explanation is separated from the observer’s analogy
      - Questions and access respect invitation and refusal
      - Both value and possible tension can be held without a total group verdict
    - title: Revise an assumption and state the remaining distance
      instructions: Compare your initial expectation with the encounter. Write what changed, what did
        not and what remains misunderstood. Identify one lesson for your own life that does not require
        copying the practice out of context, such as asking how guests can help rather than assuming.
        If you wish to participate or reuse a form later, identify the appropriate permission and learning
        route rather than treating one encounter as authorization.
      checks:
      - The original assumption is revisited explicitly
      - Changed unchanged and unresolved interpretations are distinguished
      - A lesson does not depend on extracting or decontextualizing the practice
      - Future participation or reuse has a legitimate permission route
    adaptation: Use a reliable community-authored accessible account when an event is unavailable or participation
      would conflict with conscience. Respectful learning does not require adopting a belief or approving
      every practice. Avoid forced disclosure, intrusive photography and expectations of unpaid cultural
      education.
    review: What did the encounter make harder to stereotype, and which meaning should remain a question
      rather than your confident explanation?
    examples:
      supportive: The learner revised an assumption about a meal custom after reading participants’ accounts
        and applied a more considerate guest question without claiming the custom as their own.
      mixed: The encounter complicated the first impression but left internal differences unresolved,
        so the conclusion stayed limited.
      contradictory: A community was idealized as uniformly wise or condemned from one unfamiliar detail,
        or restricted participation was demanded.
      inconclusive: Difference was consumed as novelty without source context, an assumption check or
        an honest account of misunderstanding.
  '26.08':
    title: Take a modest new challenge with a clear retreat option
    goal: Choose an experience that extends current capability through preparation, uncertainty and adaptation
      while keeping real risk proportionate.
    scope_note: The default is unfamiliar wayfinding in a safe public setting, not clinical exposure,
      dangerous adventure or a test of toughness. A challenge may be declined when conditions do not fit.
    burden: Twenty minutes to prepare, a thirty-minute or shorter attempt and a fifteen-minute debrief.
    setup: Choose a new section of a familiar public library, museum or maintained park with staff or
      a clear support route, verified accessibility and an easy return. The task is to locate one permitted
      destination using the official map and return, asking for help when needed. No remote travel, climbing,
      water entry or hazardous equipment is involved.
    actions:
    - title: Define the worthwhile challenge and objective limits
      instructions: State what is new, why it is worth trying and what preparation is needed. Verify opening,
        access, route, current conditions and support availability. Choose a time limit, a return point
        and explicit stop conditions such as lost access, worsening weather, pain, threat or excessive
        distress. Distinguish discomfort with novelty from a real hazard; neither should be dismissed,
        and needed supports remain part of competent preparation.
      checks:
      - Novelty and worthwhile purpose are explicit
      - Access conditions and support are verified
      - Time return and stop conditions are set in advance
      - Real hazards and required supports are not reframed as weakness
    - title: Attempt the route and adapt to an ordinary uncertainty
      instructions: Use the official information to reach the selected destination within the agreed limits.
        At a confusing junction, pause safely, check the map or ask staff rather than continuing to prove
        independence. Record one point at which the plan needed adjustment, even if the adjustment was
        simply confirming a sign. Turn back when a stop condition occurs; a responsible return can be
        the correct outcome, not failure of courage.
      checks:
      - A real bounded attempt or honest deferral is recorded
      - Wayfinding uses appropriate information and support
      - An uncertainty produces a deliberate adaptation
      - Stop conditions can lead to turning back without shame
    - title: Debrief preparation capability and the next boundary
      instructions: Compare expected and actual difficulty, useful preparation, assistance and any risk
        you had underestimated. Identify one capability gained or still untested and one change for a
        future attempt. Do not escalate immediately to prove the challenge counted. Choose repeat, a small
        next step, rest or stop according to the evidence, and keep this experience distinct from competence
        in dangerous or technical environments.
      checks:
      - Expected and actual difficulty are compared
      - Support and underestimated risk are acknowledged
      - A specific capability and next preparation change are named
      - Escalation is not automatic or used as proof of courage
    adaptation: Use an accessible indoor route, supported outing or another ordinary novelty with a safe
      retreat. A tabletop rehearses preparation but not the real attempt. Trauma, panic, severe anxiety
      or dangerous settings require appropriate qualified support rather than self-directed escalation.
    review: Where did you adapt instead of forcing the plan, and what does that show about the right size
      of the next challenge?
    examples:
      supportive: The person used the map, asked staff at a confusing junction and returned within the
        limit, gaining a specific wayfinding lesson.
      mixed: Access changed and the attempt was shortened; preparation was useful but the destination
        remained untested.
      contradictory: A hazard or pain was ignored to prove toughness, or essential support was deliberately
        removed.
      inconclusive: An adventurous intention was described without preparation, a real bounded attempt
        or an adaptive response.
  '26.09':
    title: Attend to something larger than your usual frame without forcing awe
    goal: Encounter nature, science, art, sacred space or craftsmanship with sustained attention and let
      the encounter question a narrow self-centered perspective.
    scope_note: The practice invites wonder but does not require a particular emotion, belief or psychological
      benefit. No travel, religious participation or intense experience is necessary.
    burden: Twenty minutes of attentive encounter and a fifteen-minute reflection with one modest response.
    setup: Choose an accessible public artwork, an ordinary natural pattern, an official science explanation
      or a safely observed example of skilled craft. Default to examining a leaf or a detailed image or
      description of one without removing it from a protected place. Set aside an optional device or task
      only when doing so preserves needed access and safety.
    actions:
    - title: Choose an encounter and suspend the demand to extract a result
      instructions: Name what you will attend to and why it lies outside your usual focus. Spend the first
        five minutes noticing scale, detail, pattern, skill or relationship without taking a selfie, making
        a ranking or demanding to feel moved. A quiet or neutral response is allowed. In a sacred or community
        space, verify visitor permission and conduct before entering and do not imitate a ritual merely
        to intensify the experience.
      checks:
      - The encounter has a specific object or setting
      - Initial attention is not organized around performance or display
      - Neutral response remains legitimate
      - Sacred community and access boundaries are respected
    - title: Investigate one detail that exceeds the first impression
      instructions: 'Select one noticed feature and learn about it from an appropriate primary or expert
        source: how the pattern forms, what a technique requires or what the space means to its keepers.
        Separate the verified explanation from your imaginative association. Return attention to the object
        with that knowledge and record one new question rather than trying to convert the encounter into
        certainty about ultimate reality or another person’s superiority.'
      checks:
      - One specific detail is investigated through an appropriate source
      - Explanation and personal association are distinguished
      - Attention returns to the encounter after learning
      - A new question is retained without a forced metaphysical or status conclusion
    - title: Connect expanded perspective to a modest responsibility
      instructions: Describe whether attention, humility, gratitude or perspective changed, including
        no change or uncertainty. Choose one proportionate response, such as crediting a maker, respecting
        a place, thanking a willing teacher or giving a recurring ordinary thing more careful attention.
        Carry it out without turning the response into a grand life pledge. The encounter is not evidence
        that hardship is solved or that ordinary duties no longer matter.
      checks:
      - The actual response including neutrality is recorded honestly
      - One modest responsibility follows from the encounter
      - The response is actually carried out or marked pending
      - No healing transformation or escape from duties is claimed
    adaptation: Use an accessible description, sound, tactile object, window view or familiar craft. Do
      not seek dangerous heights, overwhelming sensory conditions, substances or distress to produce awe.
      A secular, religious or uncertain interpretation can be legitimate without being imposed on others.
    review: What became less centered on your own performance, and what small responsibility follows without
      exaggerating what the encounter did?
    examples:
      supportive: Learning how a familiar craft detail was made deepened attention and led to a specific
        acknowledgment of the maker rather than a claim of transformation.
      mixed: The encounter stayed emotionally quiet but raised a useful question and a more careful way
        of attending.
      contradictory: Risk or distress was deliberately intensified to force awe, or a sacred practice
        was used without permission as an experience product.
      inconclusive: Awe was claimed from an impressive label without sustained attention, inquiry or an
        honest response.
  '26.10':
    title: Create a small celebration around shared meaning rather than spectacle
    goal: Help a willing group mark something worth remembering through inclusive participation, gratitude
      and a manageable shared form.
    scope_note: One modest celebration can create an opportunity for belonging; it does not guarantee
      joy, require spending or authorize using another person’s milestone or story without consent.
    burden: Twenty minutes of preparation, a short agreed gathering or asynchronous exchange and a fifteen-minute
      review.
    setup: Default to marking the completion of a shared small project with two or more willing people.
      Offer a fifteen-minute exchange in which each may name one appreciated contribution, hear a short
      shared memory and choose a harmless game or music moment. Food, alcohol, gifts, public photos and
      attendance are not required.
    actions:
    - title: Agree on what is being marked and who can participate
      instructions: Ask the people involved whether and how they want the event marked. State the meaning,
        a modest time and cost limit, and access or cultural needs such as quiet, food restrictions, religious
        boundaries or remote participation. Offer a dignified decline and a way to contribute asynchronously.
        Do not surprise someone with public recognition, disclose a private milestone or assume a feast
        or expensive outing is the only genuine celebration.
      checks:
      - The meaning and desire for celebration are confirmed
      - Time cost and access needs are considered
      - Declining or participating differently remains dignified
      - No private milestone or story is publicized without permission
    - title: Carry out one shared form with room for different responses
      instructions: Host the agreed brief exchange. Invite, rather than require, one appreciation or memory
        from each person and include the small chosen playful or musical element. Keep contributions voluntary
        and credit less visible work as well as the most prominent roles. Notice practical barriers and
        adjust without turning the gathering into a feedback workshop. No one must perform happiness,
        disclose emotion or consume something to belong.
      checks:
      - The agreed celebration actually occurs
      - Appreciation memory and a shared enjoyable form are offered
      - Less visible contributions receive consideration
      - No forced emotion disclosure consumption or performance is required
    - title: Preserve a welcome memory and check the burden
      instructions: Afterward, ask one optional question about what felt meaningful or excluding and compare
        the actual burden with the plan. Preserve a short consensual memory, such as a shared phrase or
        private note, only with permission. Decide what to repeat or simplify next time. A mixed response
        remains visible; the existence of an event or photo is not proof that everyone felt belonging.
      checks:
      - Meaning and exclusion can both appear in the review
      - Actual effort and cost are compared with the plan
      - Any preserved memory has appropriate consent
      - The next celebration is revised from experience rather than spectacle pressure
    adaptation: Use an accessible call, messages, a quiet ritual or a small family or neighborhood form
      already welcomed by participants. Respect grief, fatigue, sobriety, disability and different beliefs.
      Celebration can be simple and need not erase serious unfinished responsibilities.
    review: What made the occasion feel shared rather than staged, and which barrier or burden should
      be removed next time?
    examples:
      supportive: The group marked the project with brief appreciation and a free game, including an asynchronous
        contribution from someone unable to attend.
      mixed: The gathering was welcome but too long for one participant, so the next plan shortened it.
      contradictory: Someone’s private milestone was announced without consent or costly consumption was
        made a condition of belonging.
      inconclusive: A celebration was planned or photographed without a shared meaning, actual participation
        or consideration of burden.
  '26.11':
    title: Adapt a simple game so more people can genuinely participate
    goal: Identify and reduce age, ability, cost, communication and dominance barriers in shared recreation
      while preserving choice and enjoyment.
    scope_note: Two rounds of an original low-stakes game test inclusion in one group. They do not prove
      universal accessibility or require anyone to disclose a diagnosis or participate.
    burden: Fifteen minutes to agree on access, two short rounds and a ten-minute voluntary review.
    setup: 'Use a no-cost word or imagination game: each willing participant may suggest an impossible
      but harmless use for an ordinary object, such as a spoon being a tiny boat’s flagpole. Contributions
      may be spoken, written, signed, drawn or passed. There is no speed score, elimination or required
      physical action. With children, use appropriate responsible adult supervision and age-fit content.'
    actions:
    - title: Ask about participation needs without demanding personal disclosure
      instructions: 'Describe the game and ask what would make it comfortable and workable: pacing, language,
        sensory level, communication mode, movement, cost or a right to watch. Agree on a pass option
        and a simple turn structure so one confident person does not occupy every opening. Do not ask
        for diagnoses or infer preferences from age or disability. Confirm that the chosen object and
        examples are appropriate to the group.'
      checks:
      - The game and voluntary participation are clear
      - Access needs are asked about without diagnostic disclosure
      - Pass and multiple communication modes are available
      - A turn structure addresses likely dominance without humiliating anyone
    - title: Run a first round and change one observed barrier
      instructions: Play a brief first round, allowing ordinary pauses and different kinds of contribution.
        Notice a specific barrier, such as a rapid speaker filling silence before written responses arrive,
        and ask whether a proposed change would help. Make one adjustment, such as a visible response
        pause or collecting responses before reading them. Do not score people’s participation or force
        equal amounts of speech as proof of inclusion.
      checks:
      - A first actual round occurs with voluntary contributions
      - A specific observable barrier is identified
      - The affected participants can accept or decline a proposed adjustment
      - Participation is not turned into a speech quota or personal score
    - title: Play again and check whether the change preserved enjoyment
      instructions: Run a second round with the agreed change. Ask a short optional question about whether
        participation became easier and whether the game still felt enjoyable. Record whose mode or access
        improved and what remains unknown without naming private conditions. Keep, revise or discard the
        adaptation based on experience; one successful round does not establish that the design fits every
        age or ability.
      checks:
      - A second round tests the agreed change
      - Ease of participation and enjoyment are both checked
      - Remaining barriers and uncertainty stay visible
      - The conclusion is limited to this group and situation
    adaptation: Use asynchronous messages, tactile or sound-based prompts, a quiet observer role or a
      different familiar game with the same consent and barrier-removal process. Nobody must compete,
      move, pay or disclose to count as included. Stop if teasing, coercion, unsafe behavior or persistent
      exclusion develops.
    review: Who gained a real way to join because of the change, and did the group reduce dominance without
      making play feel like a compulsory exercise?
    examples:
      supportive: A response pause let written contributions arrive, and the second round remained playful
        without speed scoring or forced turns.
      mixed: The adaptation improved access but made the game too long, leading to shorter rounds next
        time.
      contradictory: A person was pressured to speak or disclose a disability to justify an accommodation,
        or nonparticipation was treated as failure.
      inconclusive: Inclusion was claimed because invitations were sent, without observing or changing
        a participation barrier.
  '26.12':
    title: Make a meaningful local journey with restraint and responsibility
    goal: Use a modest journey to encounter place, history, devotion, memory or transition through preparation
      and reflection rather than collecting an experience.
    scope_note: A local physical or clearly labeled virtual journey can be meaningful without religious
      belief, long distance or hardship. It is not therapy, a spiritual achievement or permission to enter
      restricted places.
    burden: Twenty minutes of preparation, a short suitable journey and a twenty-minute return reflection.
    setup: Choose a permitted public memorial, place of learning, community site or familiar location
      connected to a transition. Default to visiting a local public place that represents something you
      have received, such as a library. Use official access information and an appropriate historical
      or community source. Select a safe accessible route, return plan and one modest restraint, such
      as no public posting during the visit.
    actions:
    - title: Prepare the purpose place and boundaries
      instructions: Write why this place matters and one question you will carry, such as what you have
        received and what responsibility follows. Learn one verified part of its history and what is not
        yet understood. Check current access, local conduct, safety, transport and physical or sensory
        needs. Choose a restraint that supports attention without restricting food, water, medication,
        communication aids or essential support. No vow or forced spiritual interpretation is required.
      checks:
      - A meaningful question and verified place context are prepared
      - Access safety and return needs are checked
      - The restraint supports attention without unsafe deprivation
      - Belief and participation remain freely chosen
    - title: Complete the journey as an encounter rather than a display
      instructions: Follow the safe plan and attend to the place, its present users and the question you
        brought. Spend a short quiet or reflective period in a manner welcome there; do not copy rituals,
        photograph people or leave objects without permission. Notice something that complicates your
        expected meaning. Turn back or use the alternative if conditions change, and distinguish virtual
        study from being physically present.
      checks:
      - An actual journey or honest alternative occurs
      - Conduct respects present users and local rules
      - A detail can complicate the intended meaning
      - Safety and truthful mode labeling override completing the plan
    - title: Return with a small obligation and an unresolved question
      instructions: Write what the journey revealed, what you may have projected onto the place and what
        remains unresolved. Choose one modest response, such as supporting an authorized local need, preserving
        an accurate memory or changing a recurring practice. Carry out a first step without making a grand
        promise. Record any cost or burden created by the journey and how to reduce it next time; significance
        does not exempt a traveler from ordinary responsibility.
      checks:
      - Observation projection and uncertainty are distinguished
      - One proportionate response is chosen
      - A first response step actually occurs or is marked pending
      - The journey’s costs and effects on others are reviewed
    adaptation: Use a short accessible route, supported visit, window view of a meaningful place or authorized
      virtual account. A religious, secular or uncertain pathway is legitimate. Do not seek exhaustion,
      trespass, unsafe travel or ritual access against local boundaries to make the journey count.
    review: What did the place ask of you beyond a personal feeling, and what responsibility remains after
      returning home?
    examples:
      supportive: A library visit prompted gratitude for public learning and a small permitted contribution,
        while the person retained an unanswered question about the site’s history.
      mixed: The visit was shortened for access reasons but still supported reflection without claiming
        a completed long pilgrimage.
      contradictory: Hardship or trespass was used to prove devotion, or a sacred place was treated as
        a stage for self-presentation.
      inconclusive: A meaningful destination was named without preparation, an encounter, restraint or
        a return response.
  '26.13':
    title: Offer a moment of lightness without making someone the target
    goal: Use harmless absurdity, surprise or affection to create a possible moment of relief while respecting
      consent and keeping serious concerns available for attention.
    scope_note: One playful exchange tests timing and care, not a requirement to cheer someone up or evidence
      that humor resolves suffering. A neutral or unwelcome response must be respected.
    burden: Ten minutes to prepare, one welcome brief exchange and a five-minute reflection.
    setup: 'Choose a low-stakes moment with a willing familiar person or use private writing. The supplied
      harmless observation is: The meeting about shorter meetings needed a follow-up meeting. Another
      option is inventing an absurd job title for an inanimate object. Avoid private insecurities, identity-based
      stereotypes, sexual pressure, cruelty and actual crisis situations.'
    actions:
    - title: Check the moment and who would bear the joke
      instructions: Ask whether a little lightness is welcome or use a moment where play is already mutually
        evident. Identify the serious issue, if any, that must not be dismissed and when it will receive
        attention. Examine the proposed joke for a target who lacks power to object. Choose situational
        absurdity or a harmless object rather than humiliation, a disguised complaint or a demand that
        someone laugh.
      checks:
      - The timing and welcome of humor are checked
      - A serious issue remains available for attention
      - The joke’s target and power relationship are considered
      - Cruelty disguised criticism and compulsory laughter are excluded
    - title: Share briefly and allow any honest response
      instructions: Offer the small observation or playful invention once. Notice the actual response
        without explaining repeatedly why it should be funny. If it lands poorly, acknowledge that and
        stop rather than accusing the other person of lacking humor. A smile, a neutral response or a
        change of subject can all be acceptable; no recording, public posting or performance score is
        needed.
      checks:
      - A brief actual exchange or labeled private rehearsal occurs
      - The recipient’s actual response is accepted
      - An unwelcome joke is stopped without blame
      - No public exposure or pressure to perform amusement is introduced
    - title: Return to what matters and keep the lesson proportionate
      instructions: If a serious matter was present, return to it at the promised time and check that
        humor did not become avoidance. Privately note what about timing, target or shared context helped
        or hurt. Choose to use similar lightness again only where welcome, revise the approach or leave
        humor aside. Do not infer that one laugh means the person is well or that humor is always the
        right response to hardship.
      checks:
      - A serious issue receives the promised return
      - Timing target and context inform the reflection
      - Future humor remains conditional on welcome
      - Relief is not treated as proof that hardship is resolved
    adaptation: Use wordplay, visual or signed humor, gentle absurdity or private delight in an ordinary
      thing. Different cultures and communication styles interpret humor differently. In grief, illness,
      conflict or crisis, prioritize the person’s stated needs and do not use humor to avoid care or accountability.
    review: Did the moment make room to breathe without making anyone smaller or making the serious issue
      disappear?
    examples:
      supportive: A shared absurdity brought a brief smile and the conversation returned to the unresolved
        task without denying it.
      mixed: The joke received a neutral response, so the person stopped and learned that the timing did
        not fit.
      contradictory: Humiliation was called humor or a person was pressured to laugh while a legitimate
        concern was dismissed.
      inconclusive: A funny line was prepared but never offered or reflected on, and no distinction between
        lightness and avoidance was made.
  '26.14':
    title: Return care to one place through an authorized repeated contribution
    goal: Learn a specific place’s ecological relationships and limits, then contribute to its care or
      understanding over time instead of treating it only as scenery.
    scope_note: A small approved contribution supports place-specific stewardship, not ecological restoration
      expertise or proof of ecosystem improvement. Land-manager and project protocols control what may
      be done.
    burden: Twenty minutes to learn the place’s needs, two bounded contribution periods separated by at
      least several days and a fifteen-minute review.
    setup: Choose a permitted local place and an authorized need, such as a land-manager-approved observation
      project or an ordinary litter task that excludes sharps, chemicals, biological hazards and traffic.
      A virtual project using its own supplied data is an accessible alternative. Identify the site or
      project contact and rules before selecting the contribution.
    actions:
    - title: Learn the place’s relationships and its actual requested need
      instructions: Read the land manager’s or project’s account of the place, including one ecological
        relationship, a current pressure and a limit on visitor action. Ask what contribution is wanted
        rather than assuming planting, removing species or collecting specimens helps. Confirm permission,
        training, access, data quality and sensitive-location rules. State what you do not know and which
        activities must remain with qualified staff.
      checks:
      - One ecological relationship pressure and visitor limit are identified
      - The contribution responds to an authorized actual need
      - Permission training and information-sharing rules are checked
      - Unqualified restoration collection or species removal is excluded
    - title: Contribute twice using the approved method
      instructions: Complete two short approved periods and follow the project’s instructions exactly.
        For observations, record uncertainty and no-find results without guessing or altering the place;
        for ordinary litter, handle only the safe permitted category and stop at any hazard. Keep dates
        and minimal non-sensitive evidence of the work. Do not publish sensitive species locations, feed
        wildlife, introduce plants or improve the method without approval.
      checks:
      - Two actual contribution periods occur or missing opportunities remain explicit
      - The approved method and safety limits are followed
      - Uncertainty and null observations are recorded honestly
      - No unauthorized ecological intervention or sensitive-location disclosure occurs
    - title: Review usefulness with the place’s keepers and plan a return
      instructions: Ask the authorized contact or use the project’s validation feedback to learn whether
        the contribution was usable and what should change. Distinguish completing a task from improving
        the ecosystem; the latter needs appropriate longer-term evidence. Choose a sustainable return
        cadence or a responsible end with any promised work handed back. Explain how your understanding
        of dependence and reciprocity changed, including any burden your participation created.
      checks:
      - Usability is checked through the project or responsible contact
      - Task completion is not called ecosystem recovery
      - A sustainable return or responsible end is specified
      - Reciprocity includes the burden created by participation itself
    adaptation: Use accessible observation, data transcription or another authorized remote task when
      physical access is limited. A virtual contribution supports the named project but is not a field
      visit. Do not undertake hazardous cleanup, restoration, wildlife handling or invasive-species removal
      without the required training and permission.
    review: What did the place or project actually need from you, and how will you know that returning
      helps rather than merely feels meaningful?
    examples:
      supportive: Two approved observations were submitted with uncertainty intact, project feedback confirmed
        their usability and the participant chose a sustainable return.
      mixed: One contribution was usable but the second lacked required conditions, so it was marked incomplete
        rather than invented.
      contradictory: Untrained planting or species removal was performed as stewardship, or sensitive
        wildlife locations were published.
      inconclusive: A place was admired without learning its limits, contributing through an authorized
        method or checking usefulness over time.
