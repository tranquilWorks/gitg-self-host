schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '20'
exercises:
  '20.01':
    title: Trace one ordinary benefit back to the people and systems carrying it
    goal: Recognize the interdependent work behind an everyday benefit and choose a proportionate reciprocal
      contribution rather than treating access as entirely self-created.
    scope_note: A dependency trace is an inquiry into one shared system, not a complete economic account
      or a claim that receiving a benefit creates unlimited personal debt.
    burden: Two 20-minute tracing sessions and one small permitted contribution over a week.
    setup: 'Use borrowing a public or community-library book as the default, or a familiar shared service.
      On paper draw the benefit in the center and six branches: physical infrastructure, labor, rules,
      knowledge, environment and inherited institution. Use public information and ordinary observation,
      not staff surveillance.'
    actions:
    - title: Follow the benefit beyond its visible front desk
      instructions: 'Trace how the book reaches the reader: acquisition, cataloging, storage, access rules,
        staff or volunteer work, the building or digital system and the resources used to keep it available.
        Give each of the six branches one supported example or an explicit unknown. Distinguish your direct
        payment or effort from benefits inherited from earlier work. Do not infer that an unseen worker
        is unpaid, mistreated or unnecessary without evidence.'
      checks:
      - All six dependency branches have supported entries or unknowns
      - Visible service and behind-the-scenes labor are distinguished
      - Personal contribution and inherited benefit are separated
      - No unsupported allegation about workers is made
    - title: Identify a reciprocal obligation that fits your actual role
      instructions: 'Ask which action would help keep this shared benefit usable: return on time, report
        a damaged item through the proper route, follow borrowing rules or offer a requested volunteer
        task. Compare its benefit with the burden it places on staff and other users. Choose one action
        you can actually perform, and name a larger institutional responsibility that cannot fairly be
        shifted to an individual user. Gratitude is not a reason to excuse unsafe labor or inaccessible
        design.'
      checks:
      - The contribution responds to a real system need
      - Burden on workers and other users is considered
      - Individual and institutional responsibilities remain distinct
      - Gratitude does not erase legitimate criticism
    - title: Make the contribution and check its effect
      instructions: Carry out the permitted action and confirm the relevant endpoint, such as a returned
        item being accepted or a maintenance report reaching the responsible channel. Record what you
        did and what remains uncertain about its benefit. Revise one assumption from the original dependency
        map. Do not collect praise, photographs of workers or recipients’ personal details as proof; the
        exercise concerns responsible participation in a shared system.
      checks:
      - One permitted reciprocal action is performed
      - Its handoff or endpoint is checked
      - An assumption in the dependency map is revised or retained with a reason
      - Praise and private personal information are not required evidence
    adaptation: Trace a shared online knowledge resource, transit service or household utility when a
      library is inaccessible. A fictional trace practices analysis but does not establish a real contribution.
      No spending, unpaid work or disclosure beyond your capacity is required.
    review: Which unseen dependency changed your sense of responsibility, and which obligation properly
      belongs to an institution rather than to you alone?
    examples:
      supportive: The reader traced cataloging and maintenance work, returned a damaged book with a clear
        report and recognized an unresolved accessibility responsibility.
      mixed: The trace was useful, but the proposed donation would have created sorting work; the participant
        asked what was needed instead.
      contradictory: The exercise became a claim that beneficiaries owe unlimited labor or must accept
        unfair treatment without complaint.
      inconclusive: A list of people to thank was made without tracing a system or completing a reciprocal
        action.
  '20.02':
    title: Find the actual public decision-maker for one local service question
    goal: Distinguish levels and branches of government, service agencies, elections, courts and funding
      decisions well enough to route one civic question responsibly.
    scope_note: This is jurisdiction-specific civic navigation, not legal advice, an endorsement of a
      party or a guarantee that an official has the power to grant a request.
    burden: Two 25-minute source checks and one concise permitted inquiry or labeled rehearsal.
    setup: Use the question Who decides the opening hours of this public library or equivalent local service.
      Start from the service’s official website and your jurisdiction’s official government directory.
      Make a small authority map with operator, rule-maker, budget approver, election route, review or
      complaint route and date verified.
    actions:
    - title: Separate service operation from authority and funding
      instructions: Find who operates the service and identify the body that sets policy and approves
        its budget. Check whether each is local, regional, national, tribal or another relevant level
        rather than assuming a familiar structure. Note where an agency implements a decision and where
        an elected or appointed body sets it. Mark any role you cannot verify. A court may review certain
        disputes but should not be invented as the ordinary service desk.
      checks:
      - Operator policy authority and budget authority are distinguished
      - Government levels are verified in the actual jurisdiction
      - Elected appointed and implementing roles are not conflated
      - Unknown authority and limits of court involvement are explicit
    - title: Locate legitimate participation and accountability channels
      instructions: Find the current official route for a service question, public meeting, written submission,
        election information and a complaint or review. For the library-hours case, identify which route
        could answer the question and which would concern a broader policy change. Check deadlines, eligibility,
        accessibility and information that would become public. Do not assume that a directory listing,
        social-media account or elected title implies authority over every issue.
      checks:
      - Participation election and complaint routes are separately identified
      - The selected route matches the actual question
      - Current deadlines access and public-record implications are checked
      - Authority is not inferred from prominence or a social-media account
    - title: Send a factual question or test the route without submitting
      instructions: 'Prepare a brief message stating the service, the neutral question and the clarification
        requested: Which body sets these hours, and where is that decision recorded. Submit only if it
        is a genuine appropriate inquiry and record receipt or the absence of a response. Otherwise rehearse
        it and leave submission unclaimed. Update the authority map if the answer redirects you; do not
        treat a nonresponse as proof of corruption or a preferred policy’s correctness.'
      checks:
      - The message asks a bounded factual question
      - Submission and rehearsal are distinguished
      - Receipt response or nonresponse is recorded honestly
      - New authority information updates the map
    adaptation: Use accessible official contact channels, a library reference service or an authorized
      civic-information service. USAGov is a U.S. directory example, not a global authority map. Use the
      appropriate official sources for your location and do not contact officials under a false identity.
    review: Who operates, who decides, who funds and who can review this issue, and which distinction
      prevented a misdirected request?
    examples:
      supportive: The participant distinguished the service manager from the budget-setting body and routed
        a factual hours question to the correct office.
      mixed: The first directory was outdated; an official response corrected the map and the inquiry
        was rerouted.
      contradictory: An official was accused or pressured about a decision outside their authority based
        on an unverified social-media claim.
      inconclusive: Government branches were memorized without locating the authority or participation
        route for an actual issue.
  '20.03':
    title: Apply the same rights-and-process rule to a group you dislike
    goal: Reason consistently about liberty, safety, obligations and fair process while separating general
      human-rights principles from enforceable local law.
    scope_note: This is a fictional case analysis, not advice about an actual protest, legal dispute or
      entitlement. Local law and qualified legal guidance determine real rights, duties and procedures.
    burden: Two 20-minute case comparisons and a 10-minute revision.
    setup: 'Use a fictional community hall with two lawful groups requesting the same room: one you agree
      with and one you dislike. Both propose the same number of attendees and ordinary discussion. A separate
      third case involves a specific credible safety concern. Prepare headings for right or interest,
      duty, evidence, restriction, process and appeal.'
    actions:
    - title: State a rule before choosing which group benefits
      instructions: Write a room-use rule based on relevant conduct, capacity and access rather than agreement
        with a viewpoint. Identify the interests in expression, association, safety and equal treatment,
        and the users’ obligations to follow legitimate conditions. Read a general human-rights source
        and distinguish its normative principles from the actual local rules that would need verification.
        Do not claim that every forum or jurisdiction applies the same legal test.
      checks:
      - The rule is written before favoring a group
      - Rights interests and corresponding obligations are named
      - General principles and local enforceability are separated
      - The rule concerns relevant conduct rather than personal agreement
    - title: Swap the identities and examine a genuine safety difference
      instructions: Apply the same rule to both ordinary requests, then swap the group labels and check
        whether your decision changes without a relevant fact changing. In the third case, ask what specific
        evidence supports a safety restriction, whether a less-restrictive response is possible and who
        has authority to decide. Dislike, rumor or group identity alone does not supply the missing evidence
        in this exercise; do not pretend that credible threats must be ignored in the name of neutrality.
      checks:
      - The identity-swap test is performed
      - Any different treatment has a relevant stated reason
      - Safety evidence and less-restrictive options are considered
      - Neither dislike nor abstract neutrality replaces factual judgment
    - title: Add notice, explanation and a review path
      instructions: Write a short decision that explains the rule, the relevant facts, any limit and how
        a person can challenge an error through an appropriate process. Identify one fact or legal question
        that would change the decision and where qualified local guidance would be obtained. Revise any
        sentence that grants your preferred group an unexplained exception. Keep the case fictional; drafting
        a fair process does not establish that you can adjudicate a real legal dispute.
      checks:
      - The decision gives reasons and relevant facts
      - Notice and a review route are included
      - A revising fact or legal uncertainty is explicit
      - An unexplained exception for a preferred group is removed
    adaptation: Choose a low-stakes fictional association rather than a traumatic or personally threatening
      example. No one must debate their own dignity or meet an unsafe group. For actual discrimination,
      legal jeopardy or safety concerns, use appropriate qualified support.
    review: Which restriction could you defend after the group labels were swapped, and which part of
      your conclusion still depends on local law?
    examples:
      supportive: The participant used the same capacity rule for both groups and required specific evidence
        and review for a safety restriction.
      mixed: The initial decision favored a familiar group, but the identity swap exposed the inconsistency
        and prompted revision.
      contradictory: Rights were withheld because a group was disliked, or a credible danger was ignored
        to perform neutrality.
      inconclusive: A rights slogan was repeated without a rule, identity swap, obligation or fair-process
        step.
  '20.04':
    title: Explain an opportunity gap without reducing people to a category
    goal: Compare individual choices and structural conditions as testable explanations of an observed
      opportunity gap, then identify a proportionate information or design response.
    scope_note: The supplied data are fictional. This exercise does not establish discrimination, causal
      effects, a group’s character or the prevalence of a real inequality.
    burden: Three 15-minute analytical passes over one case.
    setup: 'Use a fictional free evening workshop: 40 people expressed interest, 20 attended, and the
      venue required stairs, two bus changes and an online signup. No participant demographic data are
      supplied. Make columns for observed outcome, possible mechanism, missing evidence, affected people
      and possible change.'
    actions:
    - title: Separate the gap from its possible causes
      instructions: 'Record only what the case shows: interest and attendance differ, and the route and
        signup have stated features. Generate explanations at several levels: individual priorities, schedule,
        cost of transport, disability access, information access and institutional design. Consider how
        historical patterns involving class, race, sex or geography could shape resources, but mark those
        as questions rather than facts about these participants. Do not assign a motive or demographic
        identity to a nonattendee.'
      checks:
      - Observed outcomes are separated from causal explanations
      - Individual and institutional mechanisms are both considered
      - Historical and social categories are questions rather than inferred identities
      - Nonattendance is not treated as a character defect
    - title: Ask what evidence could distinguish the mechanisms
      instructions: 'For each of three plausible mechanisms, specify a respectful information source:
        a voluntary anonymous access question, the actual transit timetable or an accessibility audit
        with permission. Identify what the source cannot show and how incentives might bias the response,
        such as people fearing blame for a missed event. Do not request sensitive demographic information
        merely because the curriculum lists a category. Include a competing explanation that could remain
        true even if an access barrier is removed.'
      checks:
      - Three mechanisms have distinct evidence routes
      - Privacy voluntariness and response incentives are considered
      - Unnecessary sensitive data collection is avoided
      - A competing explanation survives the preferred account
    - title: Design one reversible barrier test with limited claims
      instructions: 'Propose a next workshop with an accessible location or an alternative signup route,
        holding other feasible features similar. State who should be consulted, what permission is needed
        and what attendance or usability observation would count as useful information. Compare possible
        benefit with cost and unintended exclusion. Write a conclusion that preserves agency and structural
        constraints together: the design may remove a barrier, but attendance alone will not prove why
        every person came or stayed away.'
      checks:
      - One reversible design change addresses a specified mechanism
      - Consultation permission cost and unintended exclusion are considered
      - An observable comparison is defined
      - The conclusion preserves both agency and structural uncertainty
    adaptation: Use the fictional case only, or work with an authorized organization and consented minimal
      data. Do not label individuals by race, class, disability or other identity from appearance. Serious
      discrimination or rights concerns require appropriate institutional or legal processes.
    review: Which explanation became more testable, and did your proposed response remove a barrier without
      pretending to explain everyone’s choices?
    examples:
      supportive: The participant identified transit and signup barriers as hypotheses and proposed an
        accessible alternative with a modest comparison plan.
      mixed: The first account blamed motivation, but the mechanism comparison exposed missing evidence
        about route and access.
      contradictory: People were stereotyped from demographic categories or a fictional attendance gap
        was declared proof of a real discriminatory cause.
      inconclusive: Structural inequality was discussed in general without separating observation, mechanism
        and needed evidence.
  '20.05':
    title: Cooperate on one small good across a genuine disagreement
    goal: Represent another person’s view fairly and coordinate a limited shared task without surrendering
      conviction or requiring ideological agreement.
    scope_note: Use a willing, low-stakes relationship. This is not mediation of abuse, a requirement
      to debate human dignity or permission to pressure someone about politics or religion.
    burden: A 15-minute preparation, one 20-minute willing exchange and one small shared task.
    setup: Choose an ordinary shared good such as an accessible neighborhood noticeboard, with someone
      who differs from you in outlook or experience. Prepare a task question, a genuine disagreement you
      can discuss safely and a boundary on topics or personal details. No sensitive political profile
      should be recorded.
    actions:
    - title: Name the shared task and your non-negotiable limit
      instructions: State what can be improved together and what agreement is not required. Identify how
        religion, politics, culture, class, age or experience may shape different concerns without assuming
        a person represents their whole group. Prepare one open question about their reason and one sentence
        stating your own conviction. Exclude situations where participation would normalize dehumanization,
        invite retaliation or force either person to defend their basic dignity.
      checks:
      - A concrete shared task is separated from ideological agreement
      - Differences are considered without making someone a group representative
      - An open question and your own conviction are prepared
      - Safety and dignity boundaries are explicit
    - title: Check your representation before proposing cooperation
      instructions: Ask about the other person’s concern and summarize it in a form they can correct.
        State where you agree, where you differ and what you still do not understand. Avoid disguising
        a rebuttal as a summary or treating politeness as consent. Then ask whether the limited noticeboard
        task is still worthwhile together, such as making one announcement readable in an accessible format.
        Accept a refusal without turning it into evidence of bad faith.
      checks:
      - The other person can correct your summary
      - Agreement disagreement and uncertainty are distinguished
      - A limited cooperative proposal is made without covert persuasion
      - Refusal is respected without a character judgment
    - title: Deliver the shared part and review the boundary
      instructions: Complete the accepted task with clear roles and credit, then ask whether the process
        allowed each person to contribute honestly. Record one change in your understanding and one conviction
        that remained, without claiming consensus. If the task revealed an unworkable boundary, close
        your responsibility transparently instead of sabotaging the result or pretending the difference
        vanished. Rehearsal can test the conversation but not actual cross-difference cooperation.
      checks:
      - An accepted shared task is completed or responsibly closed
      - Roles and credit remain fair
      - Understanding and retained conviction are both recorded
      - Consensus is not claimed from courtesy or task completion
    adaptation: Use asynchronous writing, an interpreter or a facilitated low-stakes conversation. A fictional
      exchange is appropriate when no willing safe partner exists. No one must disclose political affiliation,
      faith, income or identity to provide evidence.
    review: What could you represent more fairly afterward, and what made cooperation possible without
      pretending the disagreement was gone?
    examples:
      supportive: Both people corrected the summaries and completed an accessible announcement while openly
        retaining different views.
      mixed: The task succeeded, but one summary still smuggled in a rebuttal; the participant corrected
        it before claiming understanding.
      contradictory: The task was used as a cover for coercive persuasion, group stereotyping or demanding
        debate over someone’s dignity.
      inconclusive: Agreement was praised without a checked representation or a completed cooperative
        act.
  '20.06':
    title: Complete and repeat a service commitment the community actually requested
    goal: Choose a useful volunteer contribution from expressed community need, match it to capacity and
      deliver it reliably beyond the first enthusiastic offer.
    scope_note: This is a bounded service cycle, not permission to perform regulated care, enter private
      spaces, handle protected data or decide what a community needs without asking.
    burden: Thirty minutes to verify fit, two agreed short service periods and a 15-minute review over
      two to four weeks.
    setup: Use an established organization’s requested low-risk task, such as preparing large-print event
      notices or organizing permitted non-sensitive supplies. Confirm the coordinator, role description,
      training, access requirements and time limit. No money, travel or vulnerable-person contact is required
      by default.
    actions:
    - title: Verify the need before offering the solution
      instructions: Read the organization’s current request and ask the coordinator what useful completion
        looks like, what work is already covered and what would create extra burden. Compare the task
        with your available time, skills, access needs and foreseeable interruptions. Decline work beyond
        competence or authority and choose one modest repeatable role. Do not propose a public-facing
        campaign or collect recipients’ stories merely to make the experience feel meaningful.
      checks:
      - The task responds to a verified current request
      - The coordinator defines useful completion and constraints
      - Capacity competence and access are checked
      - Publicity and recipient stories are not prerequisites
    - title: Deliver the first agreed unit and accept task-specific feedback
      instructions: Carry out the role under the organization’s instructions, ask before changing the
        method and communicate an obstacle early. At handoff, confirm the actual output and any incomplete
        part. Ask a narrow question such as Are these notices usable in the format you requested. Accept
        correction without making the coordinator manage your feelings. Record broad task status only,
        not recipient identities, photographs or confidential organizational information.
      checks:
      - One requested service unit is actually delivered
      - Method changes and obstacles are communicated appropriately
      - The coordinator checks usability or completion
      - Feedback and evidence protect recipient and organizational privacy
    - title: Repeat once and decide whether the commitment is sustainable
      instructions: Complete a second agreed unit using the feedback, or give timely notice and arrange
        an accepted handoff if capacity has changed. Compare benefit, burden, reliability and the time
        the organization spent supporting you. Agree to continue, reduce or end the role with a clear
        final owner. Two visits do not prove long-term service, but an uncommunicated disappearance cannot
        be counted as a sustainable contribution.
      checks:
      - A second unit or responsible accepted handoff occurs
      - Feedback changes the next attempt
      - Benefit and support burden are reviewed together
      - Continuation reduction or closure is explicitly agreed
    adaptation: Use remote, accessible, low-cost tasks or a smaller role. Without an organization and
      an actual request, complete role research and a labeled inquiry rehearsal only; do not claim community
      benefit. Follow safeguarding, training and background-check requirements where applicable.
    review: What did the organization actually gain, what did your participation cost it, and what commitment
      can you keep without relying on initial enthusiasm?
    examples:
      supportive: The volunteer produced the requested accessible notices twice, used coordinator feedback
        and accepted a sustainable monthly role.
      mixed: The first task was useful, but the second exceeded capacity; an early accepted handoff prevented
        disruption.
      contradictory: The volunteer ignored the requested need, created publicity about recipients or disappeared
        from an essential commitment without notice.
      inconclusive: A cause was selected and enthusiasm recorded without a requested deliverable or actual
        service.
  '20.07':
    title: Let the recipient define whether your help is useful
    goal: Offer and deliver a bounded form of assistance that preserves the recipient’s agency, dignity
      and context rather than making them perform gratitude or dependence.
    scope_note: Use an ordinary willing relationship or an authorized service role. This does not authorize
      clinical care, financial control, unsolicited rescue or a judgment that someone cannot decide for
      themselves.
    burden: Fifteen minutes to prepare, one brief consented exchange and one agreed low-risk action.
    setup: Default to a person trying to use an unfamiliar community-event registration form. Possible
      help includes reading the instructions, explaining a term, pointing to the official contact or stepping
      back. The person keeps their credentials, choices and private information; no account access or
      submission on their behalf is assumed.
    actions:
    - title: Check the need and the limits of your interpretation
      instructions: Ask whether assistance is wanted and which part is difficult or inconvenient. Separate
        what you observed from your assumption about literacy, disability, resources or motivation. Offer
        a choice of help modes and make declining easy. Ask what would count as useful from their perspective,
        including the possibility that the form itself is poorly designed. Do not begin by correcting
        the person or presenting yourself as the solution to their life.
      checks:
      - Permission to help is requested before intervention
      - Observed difficulty is separated from identity assumptions
      - The recipient chooses the mode and desired outcome
      - A design or context problem remains a possible explanation
    - title: Do the agreed part without taking over the decision
      instructions: 'Carry out only the selected assistance: read the official instruction aloud, clarify
        a word or find the permitted support channel. Keep the device and final decision with the person
        unless an explicitly authorized arrangement says otherwise. Explain a step so it can be repeated
        when useful, but do not force independence when ongoing support is preferred or necessary. Stop
        when asked and never make help conditional on praise, personal disclosure or accepting your values.'
      checks:
      - The action stays within the agreed scope
      - Credentials and decision authority remain protected
      - Support can be repeated without forcing independence
      - No gratitude disclosure or ideological condition is attached
    - title: Ask about usefulness and remove unnecessary dependence
      instructions: 'Invite a brief correction: Did that help, would a different format be better, or
        shall I stop. Check whether the person can use the chosen next step with their preferred level
        of support. If you created an avoidable dependency, such as holding information only you can retrieve,
        return it through the proper accessible channel. Record your adjustment rather than a score of
        the recipient’s competence. A polite thank-you does not prove that help increased safety or capacity.'
      checks:
      - Usefulness is checked in the recipient’s terms
      - Preferred ongoing support remains legitimate
      - An avoidable information or control dependency is corrected
      - Gratitude is not treated as outcome evidence
    adaptation: Use accessible communication, a qualified interpreter or an authorized service. A fictional
      form can be used for rehearsal when no real request exists. Do not collect sensitive data, submit
      applications or assume legal authority merely because assistance was welcomed.
    review: What decision remained theirs, what obstacle actually became easier, and what part of your
      help would you now remove?
    examples:
      supportive: The helper read the requested instruction, left the decision and device with the person
        and changed format after feedback.
      mixed: The form was completed, but the helper took over too quickly; the next step restored the
        recipient’s choice and control.
      contradictory: Assistance became a demand for gratitude, a claim of superiority or an unauthorized
        takeover of private decisions.
      inconclusive: The helper felt useful but never asked what was needed or checked the recipient’s
        actual experience.
  '20.08':
    title: Organize one small shared improvement with accountable roles
    goal: Turn a community-defined problem into a limited cooperative project with consenting stakeholders,
      clear ownership, a useful deliverable and an honest outcome review.
    scope_note: Choose a lawful low-stakes shared-space improvement. This is not permission to speak for
      a community, access private data or pressure people into political or volunteer participation.
    burden: One 30-minute planning session, a short coordinated work period and a 20-minute review within
      two weeks.
    setup: 'Default to making a community noticeboard readable and current with the owner’s permission.
      Prepare a one-page charter: problem, affected users, owner permission, intended result, roles, resources,
      risks, deadline and acceptance check. Use two or more willing participants only when a live organizing
      opportunity exists.'
    actions:
    - title: Confirm a shared problem rather than recruit for your preferred answer
      instructions: Ask the space owner and at least one affected user what is difficult about the noticeboard.
        Distinguish outdated information, unreadable format and missing access from your personal taste.
        State a bounded outcome such as current notices can be found and read without removing authorized
        content. Invite stakeholders to correct the problem statement and identify who is not yet represented.
        Do not claim to represent absent users merely because you considered them.
      checks:
      - The problem is checked with an owner and affected user
      - A bounded observable outcome is agreed
      - Absent or unrepresented stakeholders are identified
      - Recruitment does not assume consent to a predetermined solution
    - title: Coordinate accepted roles and a reversible work plan
      instructions: Ask willing participants to choose roles such as checking dates, preparing accessible
        labels and confirming owner approval. Define each handoff, resource limit and what must not be
        changed. Include a stop point for disputed ownership, private information or safety. Run a brief
        check-back so each person can state what they will deliver and to whom. A task assigned in a document
        is not owned until the person accepts it.
      checks:
      - Each role is explicitly accepted
      - Handoffs resources and limits are clear
      - Disputed authority privacy and safety trigger a pause
      - Participants can explain their own delivery responsibility
    - title: Deliver, test with a user and close the loop
      instructions: Complete the permitted work and ask an affected user to find a current notice using
        the result. Record what worked, what failed and any unintended loss of information or access.
        Correct a small problem within the agreed scope, then hand ongoing maintenance to an accepting
        owner. Compare the result with the original outcome and capture one organizing lesson. Attendance
        at a planning meeting alone is not a community result.
      checks:
      - A permitted shared deliverable is produced
      - An affected user performs the intended task
      - Failure and unintended effects remain visible
      - Maintenance and lessons have an explicit handoff
    adaptation: Use an accessible digital noticeboard with permission, a smaller two-person project or
      a complete fictional tabletop plan. A tabletop plan does not establish recruitment, collaboration
      or community impact. No public posting, fundraising or political mobilization is required.
    review: Did the effort solve the problem stakeholders named, and where did role clarity or missing
      representation change the result?
    examples:
      supportive: Participants accepted distinct roles, a user found the correct notice and an owner agreed
        to maintain the result.
      mixed: The board looked better, but a user could not read a label; the team corrected it before
        claiming acceptance.
      contradictory: The organizer removed others’ information without authority, pressured participation
        or claimed to represent people never consulted.
      inconclusive: A charter and role list were created without a deliverable, user check or accountable
        handoff.
  '20.09':
    title: Decide whether one public claim deserves to be shared
    goal: Verify a public claim’s source, context and uncertainty, then choose a proportionate share,
      correction or non-share without feeding an outrage cycle.
    scope_note: Use a low-stakes public-service claim or the fictional default. This is not intelligence
      analysis, a guarantee of truth or a requirement to engage with harmful content.
    burden: A 20-minute verification pass, one bounded sharing decision and a 10-minute later check.
    setup: 'Use the fictional message The community center is closing next week, which links only to a
      cropped screenshot. Prepare five fields: exact claim, original source, date and context, independent
      confirmation, and what remains unknown. Do not forward the screenshot to recruit help before checking
      it.'
    actions:
    - title: Recover the claim’s origin and missing context
      instructions: 'Write the claim narrowly enough to verify: which center, what closing means and which
        dates. Trace the screenshot to an original official notice or mark that the origin is unavailable.
        Check whether the notice concerns a one-day repair, a service change or permanent closure. Separate
        a quote, interpretation and prediction. A familiar sender, large share count or strong emotional
        reaction does not establish the missing context.'
      checks:
      - The claim is made specific and checkable
      - Original source and date are sought
      - Quote interpretation and prediction are separated
      - Popularity and emotional force are not treated as verification
    - title: Seek a distinct check and assess the cost of error
      instructions: Use a separate authoritative channel, such as the center’s current official schedule
        or contact page, rather than another repost of the same image. Identify what the second source
        actually confirms and whether both depend on the same announcement. Consider who could be harmed
        by a false alarm or a premature dismissal. Set a stopping point for research and keep uncertainty
        visible; do not turn an unresolved rumor into an evening of compulsive refreshing.
      checks:
      - A genuinely distinct verification route is used
      - Shared source dependence is identified
      - Consequences of both false alarm and dismissal are considered
      - Research has a bounded stop point
    - title: Share with context, correct or decline to amplify
      instructions: 'Choose one action: share the verified original with a brief qualification, correct
        a previous inaccurate share through the same audience, or do not share because evidence remains
        weak. For the fictional case, draft the message without publishing. If you shared a real claim,
        make one later check for a correction and update the audience when needed. Record the verification
        process and uncertainty, not outrage intensity or engagement metrics.'
      checks:
      - The sharing choice follows the evidence strength
      - Context and uncertainty accompany any share
      - A prior error has an explicit correction route
      - No fictional claim is published as real news
    adaptation: Use text, audio or an accessible original source, and avoid graphic or personally distressing
      material. For urgent safety information, rely on the relevant official emergency channel rather
      than delaying necessary action for this exercise. No political affiliation or browsing history needs
      to be recorded.
    review: What changed between your first reaction and your final share decision, and could a reader
      distinguish what is known from what is inferred?
    examples:
      supportive: The cropped image proved to concern a one-day repair; the participant shared the dated
        original rather than the closure rumor.
      mixed: The claim remained uncertain, so the participant withheld it and stated what verification
        was missing.
      contradictory: A dramatic claim was forwarded because it fit a preferred narrative, or a correction
        was hidden from the original audience.
      inconclusive: News was consumed extensively without tracing a claim, making a share decision or
        preserving uncertainty.
  '20.10':
    title: Leave one shared resource easier for the next person to use
    goal: Improve a commons through a permitted maintenance or knowledge contribution while considering
      environmental effects, shared access and ongoing responsibility.
    scope_note: Use a low-risk shared resource within your authority. This is not environmental remediation,
      ecological assessment or permission to alter public property, habitats or institutional records.
    burden: Twenty minutes to inspect and obtain permission, one small improvement and a later usability
      check.
    setup: Default to a community borrowing shelf with a missing return label, or a shared knowledge page
      with an unclear maintenance note. Prepare headings for users, resource, current failure, owner or
      steward, environmental or waste effect, trust risk and maintenance. Do not remove plants, handle
      hazardous waste or edit protected systems.
    actions:
    - title: Identify the shared value and the actual steward
      instructions: 'Observe one problem that makes the resource less usable: items are returned to the
        wrong place because the label is missing. Identify who owns or stewards it and ask what changes
        are allowed. Trace how the problem affects access, waste or repeated labor, shared knowledge and
        confidence in the system. Mark any ecological effect you cannot establish rather than calling
        every tidying action environmentally beneficial.'
      checks:
      - A specific usability problem is observed
      - The responsible steward and permission are identified
      - Access waste labor knowledge and trust effects are considered
      - Unverified ecological benefits are not claimed
    - title: Make the smallest useful reversible improvement
      instructions: With permission, install a clear accessible return label or correct the maintenance
        note using verified information. Preserve existing content and avoid adding a rule you have no
        authority to impose. Use safe available materials and avoid creating more waste than the problem
        warrants. State who can update the label when the arrangement changes; a resource that only you
        understand has not become a resilient commons.
      checks:
      - The change is permitted and addresses the observed problem
      - Information and access remain correct
      - Material use and unintended waste are considered
      - The result can be maintained by someone other than you
    - title: Test use and hand back responsibility
      instructions: Ask a willing user to return an item or find the relevant information without your
        coaching. Observe confusion and correct one issue within the allowed scope. Confirm the steward
        knows what changed and when it should be reviewed. Record the limited benefit, any remaining problem
        and what you learned about the shared system. Do not treat a clean appearance as proof of ecological
        restoration or universal access.
      checks:
      - A user tests the intended function
      - Confusion or failure is preserved and addressed
      - The steward receives a clear maintenance handoff
      - Claims stay limited to observed usability and stewardship
    adaptation: Use a digital commons, accessible shared guide or fictional maintenance case. Do not publish
      private information, bypass permissions or undertake hazardous cleanup. Environmental or infrastructure
      work beyond ordinary competence belongs with the relevant qualified steward.
    review: What became more usable or understandable for the next person, and what responsibility did
      you return to the shared system rather than keep for yourself?
    examples:
      supportive: A permitted label reduced confusion in a real return test and the steward accepted the
        maintenance note.
      mixed: The label was clearer but blocked another instruction; the participant repositioned it after
        the user test.
      contradictory: The participant altered public property, removed habitat or claimed environmental
        restoration from unverified tidying.
      inconclusive: A resource was praised as a commons without a permitted improvement or a next-user
        check.
  '20.11':
    title: Write a shared-space rule that survives deep disagreement
    goal: Create and test a fair participation norm that protects coexistence and common goods without
      requiring ideological conformity or tolerating dehumanization.
    scope_note: Use a fictional or authorized low-stakes group. This does not decide constitutional rights,
      compel association or require anyone to debate their dignity.
    burden: Twenty minutes of drafting, one 20-minute case test and a short revision.
    setup: Use a shared reading room where participants differ in religion and politics but need quiet
      access, clear booking and respectful discussion. Prepare a one-page norm covering purpose, permitted
      conduct, prohibited harm, decision authority, dissent, enforcement and review. Use neutral fictional
      participants for testing.
    actions:
    - title: Distinguish a common rule from a shared belief
      instructions: 'State the common good the room exists to serve and list the conduct needed for it:
        fair booking, accessible information and no harassment. Separately identify beliefs people may
        disagree about without losing access under the proposed norm. Ask whether the rule quietly privileges
        one group’s language, schedule or custom and what legitimate accommodation could help. Do not
        confuse pluralism with requiring every participant to endorse every view.'
      checks:
      - The common purpose is concrete
      - Conduct rules and beliefs are separated
      - Hidden advantages and accommodation needs are considered
      - Agreement with every worldview is not required
    - title: Test three disagreements and one harmful behavior
      instructions: Apply the norm to a disliked opinion expressed within the room’s purpose, a scheduling
        conflict, an access request and targeted harassment. For each, identify the relevant conduct,
        who decides and a proportionate response. Swap group identities to check consistency. Preserve
        a boundary against dehumanization without treating ordinary disagreement as harassment, and preserve
        legitimate safety limits without using safety as an unexplained excuse to exclude a disliked group.
      checks:
      - Four distinct cases are tested
      - Relevant conduct authority and response are stated
      - Identity swapping checks consistency
      - Disagreement and targeted harm are not conflated
    - title: Add dissent, correction and a limited trial
      instructions: Revise the norm to explain how a person can question it, seek an accommodation or
        challenge inconsistent enforcement. In an authorized willing group, trial one ordinary booking
        or discussion under the norm and ask what it missed; otherwise rehearse the case only. Record
        unresolved disagreements openly and set a review date. Do not claim peaceful coexistence because
        nobody objected in a setting where objection may be costly.
      checks:
      - Dissent accommodation and review routes are explicit
      - A live trial or labeled rehearsal occurs
      - Unresolved disagreement remains visible
      - Silence is not treated as freely given consensus
    adaptation: Use accessible formats and a facilitator when needed. People may decline discussion without
      penalty. Real discrimination, legal rights or safety disputes require appropriate qualified processes
      rather than this small-group norm exercise.
    review: Which rule enabled cooperation without belief conformity, and could the least powerful participant
      challenge its use safely?
    examples:
      supportive: The group used one booking rule across viewpoints, accommodated an access need and kept
        a review route for disputed enforcement.
      mixed: The rule sounded neutral but favored one schedule; the case test exposed the issue and led
        to a revision.
      contradictory: A preferred ideology became a condition of ordinary participation, or harassment
        was excused as mere disagreement.
      inconclusive: Tolerance was endorsed without a tested conduct rule, dissent route or enforcement
        limit.
  '20.12':
    title: Trace a public claim through the institutions that shaped it
    goal: Follow a public claim from original evidence through institutions, incentives, editorial choices
      and accountability routes rather than treating every source as interchangeable.
    scope_note: This is a bounded source-chain analysis. It does not establish that an institution is
      trustworthy or corrupt in general, or that all public claims have the same evidentiary standard.
    burden: Two 25-minute tracing sessions and a 10-minute explanation to a willing reader or private
      rehearsal.
    setup: 'Use a low-stakes public claim about a service survey or the fictional default: a platform
      post says a university study proves a city program works. Prepare a chain with original evidence,
      researcher, funder, agency or program, news report, party or advocacy use, platform distribution
      and correction route.'
    actions:
    - title: Find the evidence beneath the institution names
      instructions: Locate the original report or mark it unavailable. Identify what was measured, who
        produced it, who funded it and what conclusion the authors actually supported. Distinguish a university
        affiliation, an agency statement, a corporation’s release and a nonprofit’s advocacy from the
        underlying evidence. A court ruling, when relevant, answers legal questions under a particular
        record rather than automatically verifying every scientific or political claim attached to it.
      checks:
      - Original evidence is located or explicitly unavailable
      - Producer funder method and supported conclusion are separated
      - Institutional labels are not substitutes for evidence
      - Legal scientific and policy claims are distinguished
    - title: Track what changed at each public handoff
      instructions: Compare the original conclusion with a news account and a public repost, or use the
        fictional chain when originals are absent. Mark changes in certainty, omitted limitations, headline
        framing and the move from association to causation. For parties, agencies, courts, universities,
        corporations, nonprofits, journalism and platforms, give a relevant role or not-in-this-chain
        disposition. Identify one incentive and one accountability mechanism for the actual institutions
        without assuming that an incentive proves dishonesty.
      checks:
      - At least two handoffs are compared
      - Changes in certainty context and causal language are identified
      - All named institution types have a relevant or absent disposition
      - Incentives and accountability are considered without motive certainty
    - title: Explain the claim with a correction path
      instructions: 'Write a brief explanation of what the evidence supports, how the public framing changed
        and what remains unknown. Name where an error should be corrected: author erratum, agency record,
        newsroom correction or platform report as appropriate. Ask a willing reader to identify the original
        evidence and the weakest handoff from your explanation, then revise any ambiguity. Do not publish
        an accusation about an institution based only on this exercise.'
      checks:
      - The final explanation distinguishes evidence from framing
      - A suitable correction or accountability route is named
      - A reader or rehearsal checks the source-chain explanation
      - No unsupported institutional allegation is published
    adaptation: Use accessible public documents or a fully fictional chain. Do not bypass paywalls, access
      confidential records or infer private funding relationships. Missing evidence is an honest conclusion,
      not a reason to fill the gap with speculation.
    review: At which institutional handoff did the claim gain more certainty than the evidence justified,
      and who can correct that particular error?
    examples:
      supportive: The participant traced a platform headline back to a limited survey and identified the
        newsroom correction route without dismissing the whole institution.
      mixed: The original report was unavailable, so the participant withheld the causal claim and explained
        the missing link.
      contradictory: A funding relationship was treated as proof of fraud, or a university label was treated
        as proof that a public claim was true.
      inconclusive: Institution names were listed without tracing evidence, altered wording or an accountability
        route.
  '20.13':
    title: Recognize a manipulative public message without reproducing its tactic
    goal: Identify dehumanization, scapegoating, conspiratorial closure and manufactured outrage while
      preserving factual uncertainty and responding without the same manipulation.
    scope_note: Use benign fictional messages or a non-graphic public example. This is not a diagnosis
      of a person, proof of an organized influence operation or permission to investigate private individuals.
    burden: Twenty minutes of message analysis and a 15-minute response rehearsal.
    setup: 'Use three fictional messages about a shared venue: Everyone from that group is the problem;
      Any evidence against this story proves the cover-up; Only our leader can fix it, so share before
      they silence us. No real protected group or named person is needed. Prepare fields for claim, emotional
      trigger, excluded evidence, implied action and accountable alternative.'
    actions:
    - title: Mark the mechanism rather than merely the side you dislike
      instructions: 'For each message, identify the tactic: a whole group blamed, an unfalsifiable explanation,
        urgency without evidence or loyalty replacing accountability. Note what information would be needed
        to assess the underlying factual concern separately. Identify where language denies equal dignity
        or narrows acceptable knowledge to one in-group source. Do not label every strong criticism as
        propaganda, and do not assume a tactic’s presence proves a coordinated campaign.'
      checks:
      - Three messages receive specific tactic analyses
      - Underlying factual questions remain separate from rhetoric
      - Dehumanization and closed evidence loops are identified
      - Strong criticism and coordinated propaganda are not automatically equated
    - title: Apply the same test to a message from your preferred side
      instructions: Rewrite one fictional message so it favors a cause you personally find attractive,
        without targeting a real audience, then apply the same evidence and dignity checks. Ask what would
        change your belief, which independent source could disagree and whether the demanded action allows
        time for judgment. Identify one feature you were tempted to excuse because the conclusion felt
        right. Do not share the manipulative rewrite; it exists only for a private consistency test.
      checks:
      - A preferred-side version is tested privately
      - A revising fact and independent check are named
      - Urgency and obedience demands are examined consistently
      - The manipulative example is not disseminated
    - title: Choose a non-amplifying response with an evidence route
      instructions: Draft a calm response that addresses the checkable issue, states uncertainty and rejects
        group blame without repeating inflammatory wording. Alternatively decide not to amplify the message
        and seek the original record privately. Include a correction if you previously shared an unsupported
        version. Rehearse how you will stop an unproductive exchange without dehumanizing the sender.
        Success is a responsible information choice, not winning an argument or making the other person
        confess manipulation.
      checks:
      - The response addresses facts without reproducing dehumanization
      - Non-amplification remains a legitimate option
      - A prior unsupported share has a correction plan
      - Ending the exchange does not require humiliation or victory
    adaptation: Use the fictional set when real material is distressing or unsafe. No one must expose
      themselves to hate content, disclose political beliefs or engage with harassment. Threats or safety
      concerns belong with appropriate support and reporting channels.
    review: Which tactic was hardest to notice when it supported your preference, and did your response
      preserve open evidence and equal dignity?
    examples:
      supportive: The participant recognized a closed evidence loop in a favored message and chose an
        original-source check rather than forwarding it.
      mixed: The first reply mocked the sender; the participant revised it to address the factual claim
        without repeating the tactic.
      contradictory: A manipulative message was amplified to attack an out-group, or all disagreement
        was dismissed as proof of conspiracy.
      inconclusive: Propaganda labels were assigned without identifying the mechanism or changing a sharing
        decision.
  '20.14':
    title: Design a proportionate nonviolent response to a shared access problem
    goal: Compare nonviolent options, stakeholder interests, risks and escalation limits to design a lawful
      low-risk first step toward a concrete shared improvement.
    scope_note: This is civic education and a fictional campaign design. Real strikes, boycotts, protest,
      civil resistance and legal rights vary by jurisdiction and require appropriate local guidance; no
      risky action is required.
    burden: Two 25-minute design passes and one 15-minute tabletop review.
    setup: Use a fictional community venue whose meeting notices omit an accessible participation option.
      Prepare a campaign card with the requested change, affected stakeholders, evidence, decision authority,
      possible methods, risk, safeguards, stop conditions and review. Do not use personal targeting, public
      shaming or unlawful entry.
    actions:
    - title: Define a change and distinguish conflict processes from pressure
      instructions: State a specific requested improvement, such as publishing an accessible contact route
        before the next meeting. Identify affected participants, the venue’s constraints and who can authorize
        a change. Compare negotiation, mediation and restorative dialogue as processes with consent and
        authority limits; compare boycott, strike, protest and civil resistance as different forms of
        collective pressure requiring separate legal and safety analysis. Do not assume every method fits
        this small problem or that affected people consent to a campaign.
      checks:
      - The requested change is specific and verifiable
      - Affected people constraints and authority are mapped
      - Dialogue processes and pressure methods are distinguished
      - Consent and legal suitability are not assumed
    - title: Choose the least risky adequate first step and its safeguards
      instructions: For this case, draft a factual written request and an invitation to discuss an accessible
        alternative. Explain why this is proportionate before considering more disruptive methods. Identify
        risks to participants, staff, uninvolved users and people with less ability to refuse. Set safeguards
        against threats, harassment, property damage, coerced participation and exposing private information.
        State what lack of progress would justify reconsidering the plan, not automatically escalating
        it.
      checks:
      - A proportionate low-risk first step is justified
      - Risks to participants and third parties are considered
      - Nonviolence privacy and voluntary participation are explicit
      - Review criteria replace automatic escalation
    - title: Tabletop a refusal and a partial concession
      instructions: 'Have a willing reader or private rehearsal test two responses: the venue declines,
        or it offers an option that solves only part of the access problem. Decide what evidence, consultation
        or qualified local advice is needed next. Include an honest way to recognize progress, correct
        your own error and close the effort. Do not treat compromise as betrayal or nonviolence as passive
        acceptance of harm; the plan must preserve both accountability and participant safety.'
      checks:
      - Refusal and partial progress are both rehearsed
      - Next steps depend on evidence consultation and appropriate guidance
      - Progress correction and closure are defined
      - No coercive or automatic escalation is introduced
    adaptation: Use a classroom or private fictional case. Actual affected people should shape any real
      effort and can decline participation. Abuse, violence, labor disputes, legal jeopardy or high-risk
      protest require qualified support beyond this exercise.
    review: Which method fits the actual authority and risk, and what would make your next step more accountable
      rather than merely louder?
    examples:
      supportive: The plan chose a factual access request, protected participants’ privacy and defined
        how to evaluate a partial improvement.
      mixed: The first plan jumped to public pressure; the risk review led to consultation and a lower-risk
        initial route.
      contradictory: The campaign used threats, harassment, coerced participation or escalating disruption
        without regard for third-party harm.
      inconclusive: Nonviolence was endorsed without a concrete goal, stakeholders, risk limits or response
        to refusal.
  '20.15':
    title: Distinguish conscientious civil disobedience from convenient rule-breaking
    goal: Evaluate a proposed breach of law through public reasons, proportionality, alternatives, nonviolence,
      transparency and accountability without confusing conviction with exemption from consequences.
    scope_note: This is analysis of fictional cases only. It is not legal advice, encouragement to violate
      a law or operational guidance for protest, evasion or avoiding accountability.
    burden: Two 25-minute case analyses and a 10-minute comparison.
    setup: 'Use two fictional cases: a group publicly proposes a nonviolent breach of a venue restriction
      to challenge an exclusionary rule; another person secretly breaks a rule for private convenience
      and later claims principle. Assume the actual legal context is unknown. Prepare columns for grievance,
      public reason, lawful alternatives, affected parties, risk, method, transparency and accountability.'
    actions:
    - title: State the strongest principled claim without endorsing the act
      instructions: For each case, identify the law or rule challenged, the claimed injustice and whose
        interests are affected. Distinguish a public moral reason from personal benefit, group loyalty
        or dislike of inconvenience. Ask whether the claimed principle could be applied consistently to
        opponents. Mark the legal status and factual grievance as unverified where the case does not supply
        them; moral conviction alone does not settle either.
      checks:
      - The challenged rule and claimed injustice are explicit
      - Public reason and private convenience are distinguished
      - Consistency toward opponents is examined
      - Unknown facts and law remain unverified
    - title: Compare necessity, proportionality and harm
      instructions: List lawful or less harmful alternatives and what evidence would show that they were
        inadequate, unavailable or too slow for the relevant harm. Examine who bears the risk, especially
        people who did not consent, and whether the method remains nonviolent and proportionate to the
        aim. Do not assume a conscientious label excuses intimidation, property harm or exposing dependents
        to danger. Identify a condition under which the proposed act should not proceed.
      checks:
      - Alternatives are seriously considered
      - Risks to nonconsenting people are explicit
      - Method and consequence are assessed for proportionality
      - A reasoned condition for not proceeding is named
    - title: Write a verdict that preserves uncertainty and accountability
      instructions: For each case, explain whether the supplied reasons distinguish principled civil disobedience
        from opportunism, what facts could change that judgment and what qualified legal advice would
        be needed for any real decision. Consider transparency about aims and responsibility for consequences
        without requiring a person to waive legal rights or accept an unjust accusation. Finish with a
        justified analytical conclusion, not a plan to carry out the breach.
      checks:
      - Both cases receive a reasoned comparative judgment
      - Revising facts and qualified legal questions are stated
      - Accountability is separated from surrendering legal rights
      - The output remains analysis rather than operational lawbreaking
    adaptation: Use less personally charged fictional rules and oral comparison when writing is difficult.
      No participant must engage in civil disobedience, risk arrest or publicize a political position.
      Real decisions require current jurisdiction-specific advice and attention to safety and affected
      people.
    review: What makes the claimed principle publicly defensible, and what prevents your sympathy for
      a cause from becoming a blanket excuse for its methods?
    examples:
      supportive: The participant distinguished a public grievance from private convenience while leaving
        legality, necessity and third-party risk unresolved where evidence was missing.
      mixed: The initial verdict excused a favored cause; the opponent-consistency test led to stricter
        proportionality requirements.
      contradictory: Conviction was treated as permission for harm, evasion or any rule-breaking that
        served a preferred group.
      inconclusive: The cases were judged solely by whether the participant liked their causes, without
        alternatives or accountability.
  '20.16':
    title: Join a reciprocal help exchange with safe boundaries and a real handoff
    goal: Contribute to and receive from a small local support system in a way that distributes capacity,
      preserves dignity and keeps essential responsibilities safely owned.
    scope_note: Use an established authorized group or a low-risk exchange among willing adults. This
      does not authorize unsupervised childcare, medical work, emergency response or access to private
      homes and data.
    burden: Twenty minutes to understand the arrangement, one low-risk exchange and a review after a second
      contact.
    setup: Default to a neighborhood group sharing verified public-service information and an occasional
      permitted errand. Prepare an exchange card with what is offered, what is requested, who can accept,
      access and cost limits, privacy, handoff and what requires a qualified service. No one must contribute
      equally or disclose hardship to receive help.
    actions:
    - title: Map capacity and need without creating a public vulnerability list
      instructions: Ask the group coordinator how requests are made, who verifies offers and how people
        can decline. Give food, transport, information, emergency help, childcare and emotional support
        a separate safe-role or outside-scope disposition. Select one low-risk contribution and one form
        of help you may appropriately request. Do not publish names, medical needs, home access details
        or a ranked list of who owes the community most.
      checks:
      - Request offer verification and refusal routes are understood
      - Six support areas have explicit scope dispositions
      - A contribution and a possible received support are identified
      - Sensitive needs and moral debt are not publicly cataloged
    - title: Complete one exchange with an accepting recipient
      instructions: Use the agreed channel to offer or request the bounded task, such as confirming a
        public opening time for someone who cannot easily access the website. Verify the information,
        communicate its source and uncertainty, and confirm the recipient wanted it. If receiving help,
        state what is useful without promising an equal repayment. For tasks involving transport, food
        or care, follow the group’s qualified safety arrangements rather than improvising a service beyond
        your role.
      checks:
      - The exchange is explicitly accepted
      - Information or task limits are verified
      - Receiving help does not require equal repayment
      - Higher-risk services follow appropriate established arrangements
    - title: Review the network rather than only your own generosity
      instructions: At the next group contact, ask whether the exchange reduced a burden, created a new
        dependency or left an unowned task. Identify one way information or capacity can be shared so
        the system does not depend on one heroic coordinator. Offer a small improvement through the agreed
        process and respect a decision not to use it. Record only the exchange status and lesson, not
        recipients’ private circumstances or a score of generosity.
      checks:
      - The exchange’s benefit and burden are checked
      - Dependency on one person is examined
      - A small network improvement is proposed through the proper process
      - Private need and generosity scores are excluded
    adaptation: Use remote information support, accessible communication or a fictional exchange. People
      with little current capacity can receive help without penalty. Urgent safety, child protection or
      medical concerns must use the appropriate real service rather than wait for an informal group response.
    review: Did help flow through a reliable relationship rather than a one-way performance, and what
      would keep the exchange working when the usual helper is unavailable?
    examples:
      supportive: A verified information exchange was accepted, the participant also requested an access
        aid and the group clarified a backup coordinator.
      mixed: The task helped, but only one person knew the process; the group documented a privacy-safe
        backup route.
      contradictory: The exchange became a debt ledger, exposed private hardship or placed an unqualified
        person in charge of essential care.
      inconclusive: Mutual aid was described as an ideal without an accepted exchange or a network-level
        review.
  '20.17':
    title: Compare two risk-pooling policies without hiding who pays or is missed
    goal: Evaluate a social-insurance design across adequacy, incentives, access, dignity, cost and distribution
      while distinguishing a simple model from real policy evidence.
    scope_note: The numbers and policies are fictional educational cases, not benefit eligibility, actuarial
      advice, a government budget forecast or a recommendation about an actual personal financial decision.
    burden: Two 25-minute model comparisons and a 10-minute explanation.
    setup: Use a fictional group of 100 adults, each contributing 10 units to a 1,000-unit fund. In one
      period, 10 people each need 80 units, leaving 200 before administration. Compare Policy A requiring
      a complex proof process with Policy B using a simpler process and later review. No fraud rate or
      administrative cost is supplied; leave them unknown.
    actions:
    - title: Explain what is pooled and what the model leaves out
      instructions: Calculate contributions and stated needs, then list unmodeled costs, unequal ability
        to contribute, correlated shocks and people outside the group. Give health, unemployment, disability,
        aging, disaster and poverty separate examples of a risk or need a society might address, without
        assuming the same insurance mechanism fits all of them. Read a social-protection framework for
        its principles, not as a claim that a particular benefit is available in your location.
      checks:
      - The arithmetic and unmodeled quantities are explicit
      - Unequal contribution capacity and correlated shocks are considered
      - Six risk or need areas are distinguished
      - Framework principles are not treated as local benefit eligibility
    - title: Compare the policies from the user and fund perspectives
      instructions: For each policy, assess whether support is adequate and timely, whether eligible people
        can navigate it, how dignity and privacy are protected, what incentives it creates and what administration
        might cost. Identify who could be wrongly excluded or wrongly included and which evidence would
        estimate those errors. Do not assume that simpler access means no accountability or that more
        paperwork always prevents misuse. State a tradeoff rather than forcing every criterion to improve
        together.
      checks:
      - Adequacy access dignity incentives cost and distribution are all assessed
      - Wrongful exclusion and inclusion are both considered
      - Unknown administrative and behavioral effects remain unknown
      - A genuine tradeoff is stated
    - title: Stress-test the pool and make a conditional judgment
      instructions: 'Change the case so 20 people need 80 units: needs become 1,600 and exceed the 1,000
        fund before administration. Compare responses such as reserves, broader funding, changed contributions
        or benefits, identifying who bears each burden. Write a conditional preference between A and B
        and name the missing evidence that could reverse it. Do not turn the toy calculation into a claim
        about the solvency or fairness of an actual national system.'
      checks:
      - The correlated-need stress case is calculated correctly
      - Funding or benefit responses identify who bears the burden
      - The policy judgment is conditional on missing evidence
      - No real-system conclusion is inferred from the toy model
    adaptation: Use counters or a calculator and discuss the cases orally. No personal income, health,
      benefit or account data are needed. For actual eligibility, contributions or appeals, consult current
      official local guidance and qualified advice.
    review: Who gains access, who bears the risk and cost, and which missing quantity most changes your
      judgment about the policy?
    examples:
      supportive: The participant calculated the shortfall, compared access with verification burden and
        made a conditional policy judgment rather than declaring one design universally best.
      mixed: The first comparison ignored administration and correlated shocks; the stress test exposed
        both limits.
      contradictory: The toy model was presented as proof that a real benefit system is solvent, fraudulent
        or available to a particular person.
      inconclusive: Solidarity or self-reliance was asserted without assessing adequacy, access, incentives,
        cost and distribution.
  '20.18':
    title: Compare reconciliation designs without equating peace with forgetting
    goal: Evaluate responses to collective harm through truth, accountability, memory, repair, institutional
      change and future coexistence while protecting affected people’s agency.
    scope_note: This is a fictional or source-based civic analysis, not a mediation process for actual
      violence, authority to collect testimony or a requirement that survivors forgive.
    burden: Two 25-minute comparisons and one 15-minute synthesis.
    setup: 'Use a fictional town emerging from serious institutional exclusion. Compare three proposals:
      a celebration asking everyone to move on; a truth-and-record process with no repair; and a combined
      proposal for truth, fair accountability, material repair and institutional safeguards. No real survivor
      testimony or graphic material is required.'
    actions:
    - title: Define the harms and the voices a process must not erase
      instructions: List what the fictional case establishes and what remains unknown about responsibility,
        affected people and ongoing risk. Identify whose participation would need to be voluntary and
        supported, who may be absent and who has legal authority over accountability. Read a transitional-justice
        source for the distinction between judicial and nonjudicial measures. Do not assume that a public
        apology or peaceful appearance means harm has ended or that every affected person wants the same
        remedy.
      checks:
      - Established harm and missing facts are separated
      - Affected voices support and voluntary participation are considered
      - Legal authority is distinguished from a civic discussion
      - Apology or apparent calm is not equated with resolved harm
    - title: Assess each proposal across six necessary questions
      instructions: 'For each proposal ask: what truth can be established, how responsibility is addressed
        fairly, how memory is preserved, what repair reaches affected people, what institution changes
        and what makes coexistence safer. Identify the cost, risk of retaliation, symbolic-only gestures
        and possible exclusion of less powerful groups. A combined proposal may still fail if it lacks
        resources or consent; do not score it as successful merely because it names more mechanisms.'
      checks:
      - All three proposals are assessed across six distinct dimensions
      - Retaliation resource and exclusion risks are considered
      - Symbolic acknowledgment and material repair are distinguished
      - Naming mechanisms is not treated as implementing them
    - title: Write a conditional design with accountability and nonrecurrence
      instructions: Recommend a bounded combination for the fictional case, explaining sequence, independent
        oversight, privacy, qualified support and how affected people can challenge errors. Name one tension
        that cannot be fully solved, such as speed versus careful fact-finding, and one sign that the
        process is reproducing harm. Distinguish reconciliation from forgiveness and coexistence from
        impunity. The output is a comparative analysis, not permission to gather testimony or promise
        a real community healing.
      checks:
      - The recommendation includes oversight and challenge routes
      - A genuine tension and warning sign are explicit
      - Reconciliation forgiveness coexistence and impunity are distinguished
      - No live testimony collection or healing claim is made
    adaptation: Use non-graphic fictional cases, accessible summaries or a facilitated educational setting.
      Do not approach survivors or perpetrators to complete the exercise. Real post-violence work requires
      qualified, locally legitimate processes and protection for affected people.
    review: Which mechanism addresses which harm, and what would prevent a call for peace from becoming
      pressure to forget or excuse responsibility?
    examples:
      supportive: The participant distinguished truth, fair accountability and repair, then proposed safeguards
        without requiring survivors to forgive.
      mixed: The initial combined proposal sounded complete, but resource and retaliation questions showed
        why implementation could still fail.
      contradictory: A demand to move on silenced affected people, or peace was defined as forgetting
        wrongdoing and removing accountability.
      inconclusive: Reconciliation models were named without comparing truth, repair, institutional reform
        and future safety.
