schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '23'
exercises:
  '23.01':
    title: Explain a fictional household balance and its cash vulnerabilities
    goal: Distinguish income, spending, debt and cash balances, then explain how interest, inflation,
      taxes, credit, risk and opportunity cost affect one ordinary financial position.
    scope_note: The supplied arithmetic is a literacy exercise, not a tax return, credit assessment or
      recommendation for any real household. Currency units and rates are fictional.
    burden: Thirty minutes for the account and calculations, followed by a ten-minute explanation and
      correction.
    setup: Use paper or a calculator. The fictional month has gross pay 3,000, withholding 600, take-home
      pay 2,400, obligations 1,500, variable spending 500 and a debt payment 100. Opening accessible cash
      is 400 and opening debt is 1,200. No other movements occur. Separately, compare a basket priced
      100 then 105 and a simple one-month interest example of 1% on 1,200 before any payment.
    actions:
    - title: Separate period flows from money owed or held
      instructions: Make separate columns for flows during the month and balances at a point in time.
        Reconcile gross pay less withholding to take-home pay, and take-home pay less the three spending
        amounts to a cash surplus of 300. Add that surplus to opening cash to obtain 700. Do not subtract
        the entire opening debt as another monthly expense or call withholding the final tax liability.
        The debt payment alone does not reveal how much principal was retired without its interest and
        fee allocation.
      checks:
      - Gross and take-home income reconcile to the supplied withholding
      - Monthly spending totals 2,100 and cash increases by 300
      - Cash and debt balances remain distinct from monthly flows
      - Unknown final tax and debt-payment allocation stay unknown
    - title: Calculate three effects without inventing a forecast
      instructions: Calculate the separate simple-interest example as 12 and the basket price increase
        as 5%. Explain that the same amount of cash buys less of that basket after the increase; this
        is not a statement of current national inflation. Compare using the 300 surplus for accessible
        reserves, debt principal or a chosen goal. Name a benefit, a foregone alternative and an uncertainty
        for each. Explain that borrowing adds an obligation and that credit terms must be read rather
        than inferred from a score or advertised rate.
      checks:
      - The separate interest example equals 12 with its assumptions stated
      - The basket increase equals five percent rather than five currency units being a rate
      - Three uses of the surplus include opportunity costs and uncertainty
      - Credit access is not treated as income or guaranteed affordability
    - title: Give a plain-language position and stress explanation
      instructions: 'Explain the household to a willing listener or an audio note in six sentences: net
        income, outflow, cash change, amount owed, unresolved tax or loan detail, and most important vulnerability.
        Test a fictional next-month take-home pay of 2,000 with unchanged spending: the deficit is 100,
        not evidence of poor character. Name the document needed to clarify one unknown and a sensible
        information-gathering next step. Correct any confusion the explanation reveals without entering
        real account identifiers.'
      checks:
      - The explanation reports stocks and flows accurately
      - The reduced-income case produces a deficit of 100
      - One missing document or disclosure is identified specifically
      - The correction records understanding without claiming financial stability
    adaptation: Use tokens, large print, spoken arithmetic or a trusted independent educator. Keep real
      account numbers, tax identifiers and login details outside the exercise. Personal tax, debt, benefits
      or investment decisions require current jurisdiction-specific information and suitable qualified
      advice; use the fictional case when privacy or distress makes personal review unsuitable.
    review: Which distinction changed your understanding of what the household could afford, and which
      unknown prevents a stronger conclusion?
    examples:
      supportive: The learner reconciled the cash surplus, retained debt-payment uncertainty and explained
        why a smaller income creates a deficit despite positive opening cash.
      mixed: The cash calculation was right, but withholding was initially described as the final tax
        bill and corrected during explanation.
      contradictory: An advertised credit limit was counted as earned income or the exercise was used
        to prescribe another person’s debt or tax strategy.
      inconclusive: Financial terms were repeated without reconciling the supplied numbers or explaining
        the income stress case.
  '23.02':
    title: Build a two-cycle spending plan that survives bill timing
    goal: Allocate money among obligations, resilience, goals, generosity and enjoyment while checking
      the dates on which the plan must actually work.
    scope_note: Two fictional cycles test budgeting mechanics and priorities. They do not prove real adherence
      or authorize delaying essential bills without agreement.
    burden: Forty minutes to construct and stress-test two calendars, plus a ten-minute review.
    setup: Start with cash 100 and income 1,200 on days 1 and 15. Bills are rent 1,000 on day 2, essentials
      400 on day 8, utilities 150 on day 18, transport 100 on day 22 and debt 100 on day 25. Optional
      allocations are enjoyment 150 and generosity 50 on day 28, reserve saving 100 and goal saving 100
      on day 29. These are fictional amounts, not recommended percentages.
    actions:
    - title: Lay out a dated plan rather than a monthly average
      instructions: Write every income, bill and allocation in date order and update the running available
        cash after each. Total the outflows as 2,150 and the month-end cash as 350, treating transfers
        to the separate reserve and goal pots as reductions in the spendable pot rather than consumption.
        Identify the day-8 balance of minus 100 before the second pay arrives. Label each obligation and
        chosen good so an apparently positive monthly total does not conceal the timing failure.
      checks:
      - Every supplied movement appears on its actual day
      - Outflows from the spendable pot total 2,150
      - The positive ending balance does not hide the day-eight shortfall
      - Obligations and the four chosen allocation purposes remain visible
    - title: Repair the timing with an explicit feasible agreement
      instructions: 'Use this additional fictional fact: the rent provider agrees to 800 on day 2 and
        200 on day 16 without fees or other consequences. Recalculate the calendar; the lowest available
        balance becomes 100 and the ending balance remains 350. Explain why this repair works and why
        a real person would need the agreement confirmed before relying on it. Compare a different repair,
        such as reducing a truly optional earlier expense, and reject any solution that assumes food,
        care, housing or legal obligations can simply disappear.'
      checks:
      - The agreed split is entered as two dated payments
      - The revised lowest available balance equals 100
      - Month-end spendable cash still equals 350
      - The repair does not invent consent or erase essential needs
    - title: Run the next cycle and retain the reason for each tradeoff
      instructions: Carry forward the available 350, repeat the revised bill calendar, and delay the second
        1,200 payment to day 17. Calculate whether all obligations can still be met on time; under the
        supplied facts they can. Mark what would need renegotiation if a further disruption exceeded the
        buffer. Choose a weekly review point and state which allocations would be reconsidered first and
        why. For personal use, compare the plan with actual private movements later; a simulated cycle
        is never recorded as real spending adherence.
      checks:
      - The second cycle uses the actual carried-forward starting cash
      - The delayed pay is tested against dated obligations
      - A threshold for revisiting the plan and a review day are specified
      - Simulation and any later real spending comparison are labeled separately
    adaptation: Use a tactile calendar, voice notes or an accessible budgeting tool with no linked-account
      requirement. Keep the fictional case for training. When essential costs exceed income, move to assistance,
      negotiation and stabilization rather than forcing a balanced-looking sheet or treating access constraints
      as a discipline failure.
    review: Did the plan work at its lowest-cash point, and what tradeoff would you revisit before the
      next cycle rather than after a missed bill?
    examples:
      supportive: The learner caught the early shortfall, used the stated rent agreement and verified
        the delayed-pay second cycle without deleting generosity or enjoyment by reflex.
      mixed: The first month balanced, but a forgotten due date required a new arrangement before the
        plan became workable.
      contradictory: Essential spending was removed on paper or an unapproved bill delay was represented
        as an agreed budget repair.
      inconclusive: Only monthly totals were written, with no running balance, timing test or second-cycle
        review.
  '23.03':
    title: Design an accessible reserve around a specific disruption
    goal: Identify a plausible cash disruption, define a proportionate reserve purpose and test whether
      the proposed money would actually be accessible when needed.
    scope_note: This produces a reserve plan and access check, not a claim that a fund exists or a universal
      target measured in months. Investment and banking rules depend on the place and product.
    burden: Two twenty-minute planning and verification periods, followed by a brief scheduled funding
      review.
    setup: Use the fictional choice of a 600 essential repair or a 900 temporary income gap. List existing
      accessible cash as 200 and an affordable possible contribution as 50 per month only for this example.
      Prepare columns for event, timing, amount, available resources, access restrictions and remaining
      gap. No real transfer or account opening is required.
    actions:
    - title: Size the need from consequences and resources
      instructions: For each supplied disruption, explain when money is needed, what happens without it
        and which resources are dependable rather than merely hoped for. Calculate gaps of 400 and 700
        after the 200 cash. Select a first reserve purpose and justify it from severity, likelihood and
        timing, not a universal three- or six-month slogan. Separate predictable annual bills from genuine
        unexpected disruptions and note debts, benefits limits or care obligations that could alter a
        real plan.
      checks:
      - Both disruptions have timing and consequence descriptions
      - Existing cash leaves gaps of 400 and 700
      - The first target has a context-based reason
      - Predictable expenses and relevant constraints are not hidden inside emergencies
    - title: Check access rather than relying on an account label
      instructions: Read the official terms for one locally available type of safe cash storage or use
        an educator-provided sample disclosure. Record withdrawal timing, access method, fees, minimums
        and applicable protection; mark anything unverified. In the United States, verify an institution
        and deposit type rather than assuming a payment app or investment is FDIC-insured. Rehearse finding
        the money-access instructions without moving funds, exposing credentials or disabling account
        security.
      checks:
      - Access timing and restrictions are checked in an actual disclosure
      - Fees minimums and protection have explicit dispositions
      - An account label is not treated as proof of deposit insurance
      - The access rehearsal shares no credentials and performs no transfer
    - title: Write a funding and use rule that can be revised
      instructions: At the fictional 50 per month, the gaps would take eight or fourteen monthly contributions
        to close before any other movements. State that emergencies may arrive sooner. Define permitted
        uses, a review trigger, a replenishment rule and a fallback such as contacting an appropriate
        assistance service when the reserve is insufficient. Schedule a capacity review before each contribution;
        any real saving must protect current essentials and applicable benefits rules. Record a plan,
        funded balance and tested withdrawal as different evidence.
      checks:
      - The contribution arithmetic and time uncertainty are explicit
      - Use and replenishment rules are tied to the chosen disruption
      - A realistic insufficient-funds fallback is named
      - Planned saving is not represented as money already available
    adaptation: Use a smaller first target, accessible banking support or a qualified benefits counselor
      when asset limits matter. Lack of surplus is a material constraint, not failure. Do not recommend
      risky investments for money needed immediately, incur fees to complete the task or share banking
      credentials with a helper.
    review: Which access or timing assumption could make the reserve fail precisely when needed, and what
      is the next achievable protection?
    examples:
      supportive: The plan identified a 400 repair gap, verified withdrawal restrictions and kept an assistance
        fallback because eight contributions would not protect against a repair tomorrow.
      mixed: A target was affordable, but the proposed storage required a delay and was changed before
        being called accessible.
      contradictory: A volatile investment or unverified app balance was described as guaranteed emergency
        cash, or essential bills were skipped to fund the exercise.
      inconclusive: A reserve target was named without a disruption, access check, contribution capacity
        or fallback.
  '23.04':
    title: Compare two debts by total cost and a credible exit
    goal: Evaluate why borrowing is considered, what it costs, what could be lost and how repayment would
      end rather than comparing advertised rates alone.
    scope_note: The case uses simple fictional loans, not current offers, APR calculations or advice to
      borrow. Real amortization, fees, collateral, default rights and affordability require the actual
      disclosure and qualified advice when appropriate.
    burden: Thirty minutes for the comparison and twenty minutes for a repayment stress test.
    setup: Both fictional loans provide principal 1,000 for exactly one year, with no interim payments
      and simple interest paid at the end. Loan A has nominal interest 10% plus a fee of 50 paid at the
      end. Loan B has nominal interest 12% and no fee. Neither has collateral in the base case. The borrower
      could set aside 94 monthly only if income remains unchanged.
    actions:
    - title: Describe the purpose and complete repayment obligation
      instructions: 'State a worthwhile purpose, one non-borrowing alternative and the cost of delaying
        the purchase or service. Calculate A as 1,000 plus 100 interest plus 50 fee, totaling 1,150; B
        totals 1,120. Label the percentages nominal simple-interest assumptions, not disclosed APRs. List
        the actual-loan information still needed: payment dates, financed fees, interest method, optional
        products, prepayment terms, late charges, collateral and default consequences. The smaller nominal
        rate does not win this case.'
      checks:
      - Purpose and a non-borrowing alternative are considered
      - Total repayments equal 1,150 and 1,120
      - Nominal rates are not mislabeled as APR
      - Missing loan terms and adverse consequences are explicitly listed
    - title: Test a repayment path against timing and income risk
      instructions: 'Calculate 94 times twelve as 1,128, enough for the fictional 1,120 balloon with eight
        left over if every contribution occurs. Now remove two contributions: only 940 is available, leaving
        180 unpaid. Explain why a monthly amount that looks manageable does not eliminate balloon-payment
        risk. For a collateral variant, name what could be lost without guessing legal recovery rights.
        Identify the earliest month in which the shortfall would become visible and an authorized renegotiation
        or independent counseling route.'
      checks:
      - The full contribution plan reaches 1,128
      - Two missed contributions leave 940 and a 180 shortfall
      - Balloon timing and any collateral risk are explained separately
      - A shortfall response does not assume refinancing or forgiveness
    - title: Make a conditional decision and preserve the exit rule
      instructions: Choose borrow, defer, seek another option or decline for the fictional case and give
        the conditions supporting that choice. State the maximum total obligation accepted, how repayments
        would be tracked and what change would trigger early contact with the creditor or a reputable
        adviser. Explain how leverage magnifies the consequence of a failed assumption. Do not apply for
        credit, guarantee someone else’s debt or move a real balance as part of this exercise.
      checks:
      - The decision includes a reason rather than only the lowest payment
      - Accepted total cost and tracking method are stated
      - The exit plan contains an early warning and legitimate help route
      - No application guarantee or balance transfer is performed
    adaptation: Use counters or an educator’s calculator and retain all assumptions with the numbers.
      Real hardship may require independent debt, legal or benefits support; verify fees and credentials
      and be cautious about promises to erase debt. Declining an unaffordable obligation is a valid outcome,
      not a failed exercise.
    review: Which term or income assumption mattered more than the advertised rate, and what would make
      the proposed exit no longer credible?
    examples:
      supportive: The learner preferred the lower total-cost option only conditionally and recognized
        that two missed contributions would make the balloon unaffordable.
      mixed: The arithmetic was correct, but repayment depended on an uncertain income assumption that
        led to deferral.
      contradictory: A loan was called affordable because approval was available, collateral loss was
        ignored, or a real guarantee was signed to demonstrate commitment.
      inconclusive: Rates were compared without total repayment, purpose, payment timing or a stress-tested
        exit.
  '23.05':
    title: Write a bounded saving and investing policy before choosing products
    goal: Relate a goal and time horizon to liquidity, risk capacity, diversification, costs, taxes and
      review rules without relying on a return prediction.
    scope_note: This is a fictional policy and disclosure-reading exercise, not a personal asset allocation,
      retirement sufficiency calculation or instruction to trade. Illustrative returns are not forecasts
      or guarantees.
    burden: Forty minutes to compare two goals and costs, then fifteen minutes to review the policy against
      a loss scenario.
    setup: 'Use two fictional goals: a necessary payment in six months and optional spending twenty years
      away. Assume an illustrative 1,000 starting amount. For arithmetic only, compare two years at constant
      net annual growth of 5% and 4%, with no deposits, withdrawals or taxes. Prepare a policy page with
      goal, deadline, loss tolerance and capacity, liquidity, diversification, fees, tax questions and
      review trigger.'
    actions:
    - title: Separate the money’s job from an attractive return story
      instructions: For each goal, describe when funds are needed and the consequence of a loss or access
        delay. Distinguish willingness to tolerate price changes from actual capacity to absorb a loss
        while meeting obligations. State what must remain accessible and which retirement or tax-advantaged
        arrangements require current eligibility and withdrawal-rule verification. Do not choose percentages
        until these constraints are understood, and do not assume a long horizon makes every investment
        suitable.
      checks:
      - Both goals have a deadline and loss consequence
      - Risk willingness and financial loss capacity are distinguished
      - Liquidity and account-rule questions are explicit
      - No universal allocation is inferred from age or horizon alone
    - title: Inspect diversification and the compounding cost example
      instructions: Calculate 1,000 times 1.05 squared as 1,102.50 and 1,000 times 1.04 squared as 1,081.60,
        a 20.90 difference under the stated assumptions. Explain why ongoing costs reduce what remains
        to compound without treating either path as an expected result. Inspect an official educational
        example or a real public fund disclosure for holdings concentration, overlapping exposures and
        fees. Two funds holding the same assets are not automatically well diversified, and diversification
        does not eliminate market loss.
      checks:
      - The two hypothetical balances and 20.90 difference are correct
      - Assumed constant returns are not presented as a forecast
      - Holdings overlap and fee disclosures are actually inspected
      - Diversification is not described as a guarantee against loss
    - title: Stress the policy before any implementation
      instructions: 'Write a provisional policy for each goal using constraints rather than product names:
        acceptable access, kinds of risk excluded, information required, cost comparison and a review
        schedule. Test an adverse scenario in which a risky holding loses value just before money is needed.
        State whether the policy would still serve the goal and what should be changed before implementation.
        Use a qualified, appropriately regulated adviser for unresolved personal suitability, tax or retirement
        questions; no purchase or account transfer is part of completion.'
      checks:
      - Each policy connects permitted risk to the goal and deadline
      - A near-deadline loss scenario changes or confirms the policy explicitly
      - Unresolved suitability tax and retirement questions remain open
      - The exercise ends without an investment transaction
    adaptation: Use a simple written or spoken policy and public educational material without sharing
      holdings or account numbers. A person with no current investable surplus can use the fictional case.
      Favor comprehension over adding products; disability, benefits, debt, dependents and local rules
      can materially change an actual plan.
    review: Which constraint would prevent an appealing product from serving the goal, and which cost
      or tax question must be resolved before acting?
    examples:
      supportive: The short-term goal retained an access-first constraint, the learner detected overlapping
        holdings and explained the hypothetical fee effect without predicting wealth.
      mixed: The policy covered risk tolerance but initially omitted the inability to absorb a loss and
        was revised.
      contradictory: A positive return was guaranteed, an allocation was prescribed from age alone or
        a trade was made without resolving suitability and access.
      inconclusive: Investment vocabulary was listed without a goal-linked policy, disclosure check, arithmetic
        or adverse scenario.
  '23.06':
    title: Prepare a continuity map without confusing contact with authority
    goal: Identify how obligations, insurance and dependent care would continue if a person were unavailable,
      and distinguish trusted contacts from people legally authorized to act.
    scope_note: This creates a location-and-question map, not a will, power of attorney, insurance recommendation
      or legal determination. Being a relative, beneficiary or emergency contact does not by itself establish
      every form of authority.
    burden: Two twenty-minute mapping periods and one bounded inquiry to an appropriate provider or professional.
    setup: 'Use the fictional case of an adult unavailable for a month who has rent, an insurance policy
      and a dependent’s scheduled support. Create five headings: ongoing obligations, coverage and claims
      contact, beneficiary questions, document locations and authorized decision roles. Use neutral labels
      only; do not copy policy numbers, passwords or another person’s private records.'
    actions:
    - title: Map what must continue and where information lives
      instructions: List the three supplied obligations and one failure consequence for each. Add the
        types of records needed to continue them, where an authorized person could locate them and who
        currently knows that location. Identify unanswered questions about insurance coverage and exclusions,
        beneficiary designations, wills or other estate arrangements, financial powers and dependent-care
        authority. Keep every role separate; a beneficiary may receive an asset without being authorized
        to pay bills now.
      checks:
      - Essential obligations and dependent support are mapped
      - Record types and secure locations are identified without secret contents
      - Insurance beneficiary estate and authority questions have separate entries
      - No person is assumed authorized solely because they are trusted
    - title: Verify one authority or coverage gap through the proper route
      instructions: Choose the most consequential unanswered question and consult the official provider’s
        instructions or an appropriately qualified local professional. Ask what document or appointment
        establishes the relevant role, when it takes effect, what it permits and how changes are made.
        Record the source and unresolved limits. Rehearse the handoff using a fictional helper who has
        a contact number but no authority; identify what they can report or ask and what they must not
        do.
      checks:
      - One real official source or qualified inquiry is used
      - Scope timing and limits of the role are checked
      - The unappointed helper is not given access or decision powers
      - Unresolved legal or coverage questions remain visible
    - title: Test the information handoff and assign the next review
      instructions: Ask a willing authorized helper, or use a labeled tabletop, to locate the correct
        contact and describe the next permitted step for the month-long absence. Correct missing information
        and set a review trigger such as a changed relationship, dependent need, move or policy renewal.
        Make one legitimate next appointment or information request if a real gap exists. Do not sign
        legal documents, change beneficiaries or transfer another person’s property merely to complete
        the practice.
      checks:
      - A helper or tabletop tests the map rather than only reading it
      - A missing contact or unclear role receives a correction
      - A specific life-change or date triggers review
      - Planning is not represented as executed legal or insurance protection
    adaptation: Use accessible document-location cards, an interpreter or independent legal assistance.
      A dependent or caregiver may need separate advocacy. Keep private documents in an appropriate secure
      place and never provide passwords to prove access. Coercion, suspected exploitation or disputed
      capacity requires qualified support rather than a family worksheet.
    review: Could the right person find the next permitted action without guessing, and which unresolved
      authority gap still prevents continuity?
    examples:
      supportive: The map distinguished a beneficiary from a bill-paying agent and led to a verified professional
        appointment before any authority was assumed.
      mixed: Contacts were easy to find, but a dependent-care role remained unresolved and was clearly
        marked.
      contradictory: A trusted relative was given credentials or instructed to move property without authority,
        or the map was called a legally valid estate plan.
      inconclusive: Documents were named without locations, role limits, a handoff test or a concrete
        next inquiry.
  '23.07':
    title: Test whether one replacement purchase solves a real need
    goal: Compare purpose, durability, maintenance, total cost and enjoyment with status pressure before
      deciding whether to keep, repair or replace an ordinary possession.
    scope_note: One low-cost possession tests consumption judgment, not moral purity, deprivation or a
      recommendation to buy a named product. Comfort and beauty can be legitimate benefits.
    burden: Fifteen minutes to compare options, two ordinary uses of the existing item and a ten-minute
      decision review.
    setup: Use a safe, serviceable chair with a cosmetic scratch as the default; do not sit on damaged
      or unstable furniture. The fictional options are keep for zero additional cost, a permitted cosmetic
      repair for 15, a used replacement for 60 plus 20 transport, or a new replacement for 150 plus 20
      delivery. State that prices are invented, not market quotes.
    actions:
    - title: Name the job and the pressure separately
      instructions: Write what the chair must do, what comfort or appearance you genuinely enjoy and what
        social impression you hope a replacement would create. Identify one dissatisfaction observable
        during use and one comparison-driven story that may or may not matter. Set a modest spending limit
        before browsing. Reject the default if there is a safety defect; necessary safe replacement is
        not a failure of restraint and cosmetic repair is not structural repair.
      checks:
      - Function safety comfort and appearance are considered separately
      - An observable dissatisfaction is distinguished from a status story
      - A spending limit is set before comparison
      - The exercise does not require using unsafe furniture
    - title: Compare lifetime burdens and try the existing option
      instructions: Total the supplied acquisition and transport costs as zero, 15, 80 and 170. Add qualitative
        entries for expected durability, cleaning, space, disposal, repair effort and uncertainty rather
        than inventing a lifespan. Use the existing safe chair on two normal occasions and record the
        actual comfort, function and enjoyment. If a safe permitted cosmetic repair is freely chosen,
        use only an appropriate ordinary method; no hazardous tool or chemical experiment is required.
      checks:
      - All four supplied costs are totaled correctly
      - Maintenance durability space and disposal have explicit entries
      - Two normal uses provide actual experience rather than imagined enjoyment
      - Any repair stays cosmetic permitted and safe
    - title: Choose enough without condemning a preference
      instructions: Choose keep, repair, replace later or replace within a justified limit. Explain what
        the two uses changed, what benefit is worth paying for and what other use of money or space is
        forgone. Wait through one preselected pause before any optional purchase, then check whether the
        reason still holds. Record the decision and, only if it occurs, the later actual use; buying nothing
        and choosing comfort are both potentially reasonable outcomes.
      checks:
      - The decision refers to observed function and enjoyment
      - A foregone alternative is named
      - An optional purchase has a deliberate pause rather than pressure
      - The outcome does not label ownership or restraint as superior worth
    adaptation: Use any safe ordinary possession already available and no actual purchase when money or
      access is limited. A support person can compare disclosures without steering the decision. Do not
      equate scarcity with virtue or shame a person for accessibility, comfort, cultural expression or
      an essential replacement.
    review: What did using the item reveal that comparison alone did not, and is the chosen expenditure
      or restraint proportionate to that evidence?
    examples:
      supportive: Two uses showed the chair worked comfortably, so a small cosmetic repair met the real
        aim without pretending appearance was unimportant.
      mixed: The function was adequate but enjoyment remained low; replacement was deferred until the
        budget and disposal questions were clearer.
      contradictory: The person kept unsafe furniture to prove discipline or bought under status pressure
        while calling the cost comparison irrelevant.
      inconclusive: A preferred option was selected without a use test, total-cost comparison or explanation
        of the actual need.
  '23.08':
    title: Make one sustainable contribution that the recipient actually wants
    goal: Share money, access, knowledge or opportunity in a way that meets a real need while preserving
      obligations, consent and the recipient’s agency.
    scope_note: One bounded contribution tests responsible provision, not the amount of generosity, the
      recipient’s gratitude or a claim of solving dependency. A non-monetary contribution is fully legitimate.
    burden: Fifteen minutes to define capacity, one agreed contribution of up to thirty minutes and a
      short follow-up.
    setup: Default to offering a willing peer help finding a public, no-cost learning resource they have
      already requested. The offer is one verified resource and, if welcome, a ten-minute explanation.
      Alternatively use an affordable contribution through an appropriately verified organization. Set
      a limit on time, money and future obligations before offering.
    actions:
    - title: Check need and capacity before making a promise
      instructions: Ask what outcome would be useful and whether the proposed help is wanted. Privately
        check essential obligations, dependents, current workload and any restriction on money or access
        you might share. State a contribution you can complete without resentment or hidden repayment
        expectations. For the default, offer to verify one learning resource rather than promising indefinite
        coaching, admission, employment or funding you cannot control.
      checks:
      - The recipient’s stated need precedes the offer
      - Existing responsibilities and real capacity are checked
      - The offer has clear time money and scope limits
      - No gratitude repayment or continuing access is secretly required
    - title: Deliver the agreed form of help without taking over
      instructions: Verify the resource’s official source, cost, accessibility and entry requirements,
        then share only what the recipient agreed to receive. Explain one useful next step and leave the
        choice to them. If providing funds instead, use a verified appropriate route and disclose whether
        it is a gift or another arrangement before action; do not attach new conditions afterward. Do
        not request passwords, control spending or publicize the recipient’s circumstances as evidence
        of your generosity.
      checks:
      - The agreed contribution is actually delivered
      - Accuracy cost and access are checked for the default resource
      - The recipient retains the decision about use
      - No surveillance private disclosure or retroactive condition is introduced
    - title: Review usefulness and the burden of continuing
      instructions: At the agreed follow-up, ask a single optional question about whether the contribution
        was useful or misplaced. Accept no answer and do not chase proof of gratitude. Compare your actual
        burden with the promised limit, then choose finish, revise a future offer or continue only by
        new mutual agreement. Record whether assistance was used, declined or remains unknown; giving
        more than intended is not automatically a better outcome.
      checks:
      - A welcome follow-up or lack of response is recorded honestly
      - Usefulness and donor burden are reviewed separately
      - Continuation requires a new freely agreed scope
      - The recipient’s response is not used as a worth or generosity score
    adaptation: Share verified knowledge, a permitted introduction, accessible materials or a small task
      when money is unavailable. Respect professional, fiduciary, workplace and privacy restrictions on
      what can be given. Ongoing dependence or essential care requires appropriate planning and qualified
      support, not abrupt withdrawal to demonstrate boundaries.
    review: Did the contribution meet the recipient’s actual need within a sustainable promise, and what
      should change before making another offer?
    examples:
      supportive: A requested resource was verified and explained, the peer chose whether to use it and
        the helper ended at the agreed limit without expecting praise.
      mixed: The help was welcome but took longer than promised, so future offers were narrowed.
      contradictory: A gift was converted into control, the recipient was publicly exposed or essential
        obligations were sacrificed to look generous.
      inconclusive: A donation intention or broad offer was recorded without a recipient-defined need
        or delivered contribution.
  '23.09':
    title: Make an intergenerational money decision preserve future agency
    goal: Consider children, elders and future stewards when planning education, inheritance, shared property
      or financial teaching without using resources to control another person’s life.
    scope_note: This is a fictional stewardship decision and an optional teaching interaction, not an
      estate, tax, benefits or property agreement. Actual transfers and authority require current qualified
      guidance.
    burden: Thirty minutes for the case, a fifteen-minute teaching or rehearsal period and a ten-minute
      review.
    setup: Use a fictional family with 600 discretionary units after essential obligations, an elder’s
      possible support need, a younger person’s learning goal and a shared tool needing upkeep. No person
      is assumed entitled to decide for the others. Prepare columns for current need, future benefit,
      decision rights, reversibility and unanswered legal or benefits questions.
    actions:
    - title: Map benefits and rights across more than one generation
      instructions: 'Describe three possible uses of the 600: learning support, a reserve for an elder’s
        agreed need, or maintenance of the shared tool. Ask who benefits now, who bears future upkeep
        and who should have a voice. Include a reason for leaving some money uncommitted when needs are
        uncertain. Identify property ownership, gift conditions, inheritance intentions and benefits or
        tax questions without guessing answers. A future inheritance does not give current control over
        the owner.'
      checks:
      - All three supplied needs receive consideration
      - Present benefit and future responsibility are separated
      - Each affected person’s decision rights remain explicit
      - Legal tax and benefits questions are not resolved by assumption
    - title: Compare a supportive offer with a controlling offer
      instructions: Write two versions of one proposed allocation. A supportive version states purpose,
        amount, permitted choices and any legitimate conditions before consent; a controlling version
        makes affection, career choice or private information the price of help. Explain why the second
        undermines agency and rewrite it. Then teach a willing learner, or rehearse, a simple 60-unit
        choice among spend now, maintain something and save for a chosen goal; ask them to explain their
        own tradeoff instead of copying yours.
      checks:
      - The supportive offer states conditions before agreement
      - A coercive condition is identified and removed
      - The learner or rehearsal includes an explicit small-budget tradeoff
      - Different reasonable preferences are accepted rather than corrected into obedience
    - title: Record a reviewable intention rather than an executed transfer
      instructions: Choose a provisional allocation or defer until the named questions are answered. State
        who must consent, which professional inquiry is needed and how a changed need would reopen the
        decision. Record what the teaching interaction revealed about understanding and independence.
        Keep intentions separate from signed documents or money actually transferred; any real gift, shared-property
        agreement or estate change must follow its own legitimate process.
      checks:
      - The decision includes required consent and unresolved questions
      - A changing-need review trigger is named
      - Teaching evidence concerns understanding not compliance
      - No intention is misrepresented as a valid transfer or estate arrangement
    adaptation: Use fictional counters, a family history example or an independent educator when real
      money discussion is unsafe. Children need age-appropriate participation and elders retain dignity
      and lawful decision rights. Do not demand financial disclosure, infer incapacity from age or disability,
      or create informal legal documents in place of qualified advice.
    review: Would this decision leave the next person better able to choose and care for what is entrusted
      to them, and where might a hidden condition undermine that aim?
    examples:
      supportive: The family case reserved room for uncertain care needs and revised an education gift
        so the learner could choose among legitimate paths.
      mixed: Future upkeep was considered, but ownership and benefit implications remained unresolved
        and prevented an actual transfer.
      contradictory: An anticipated inheritance or gift was used to demand obedience, or an elder’s property
        was allocated without authority.
      inconclusive: Future generations were praised abstractly without comparing needs, rights, conditions
        or a teaching interaction.
  '23.10':
    title: Steward one possession across its full life rather than its purchase
    goal: Consider material, energy, time, money, repair and external effects when deciding how to maintain,
      share or retire an ordinary possession.
    scope_note: One lifecycle comparison informs a practical stewardship choice. It is not a measured
      environmental footprint, a universal consumption rule or permission for hazardous repair.
    burden: Twenty minutes to map the item, up to twenty minutes for a safe care action and a later ten-minute
      use review.
    setup: 'Choose a washable reusable bag, a book or another ordinary safe item already owned. Default
      to a reusable bag with an intact structure and a care label. Prepare six stages: obtaining materials,
      manufacture, transport, use, care or repair, and eventual reuse or disposal. Mark unknown quantities
      instead of inventing carbon or water savings.'
    actions:
    - title: Map the resources and people behind the item
      instructions: 'For each lifecycle stage, identify at least one input or affected party: material,
        land, energy, labor, transport, storage space, maintenance time or capital tied up. Distinguish
        what you know from an assumption. Compare keeping the item with replacing it and note that a replacement
        may shift rather than eliminate burdens. Include practical access and hygiene needs; a low-impact-looking
        option that cannot serve its user is not automatically the right choice.'
      checks:
      - All six lifecycle stages receive an entry
      - Land energy time money and affected people are considered
      - Known facts and assumptions are separated
      - Replacement is not automatically labeled better or worse
    - title: Carry out one permitted care or sharing action
      instructions: Read the item’s actual care instructions. For the default, clean and dry the bag only
        by an allowed method, then put it where it can be used without creating an obstruction. Alternatively
        mend a non-safety-critical cosmetic defect using a familiar safe method or agree on a simple permitted
        sharing arrangement. Avoid energized equipment, structural repairs, chemicals or tasks beyond
        competence. Record the actual materials, time and cost used rather than claiming the action was
        free of burden.
      checks:
      - The action follows the item’s real instructions or permission
      - A safe care or sharing action actually occurs
      - Materials time and cost of that action are recorded
      - Hazardous or safety-critical repair is excluded
    - title: Check whether the stewardship choice works in use
      instructions: Use the item at the next ordinary opportunity and inspect whether the action preserved
        function, reduced an avoidable replacement or created a new burden. Choose a maintenance interval
        or a clear condition for responsible retirement. Verify a local disposal or donation route only
        when needed rather than assuming everything is recyclable or wanted. State the narrow observed
        result; do not claim quantified ecological benefit without reliable lifecycle evidence.
      checks:
      - A later use checks function after the action
      - A new burden or failed assumption remains visible
      - Maintenance or retirement has a concrete trigger
      - Environmental claims remain no stronger than the evidence
    adaptation: Choose a small item and a care action within available energy, space and money. An accessible
      replacement can be reasonable when repair or reuse shifts excessive burden onto a person. Use an
      observation-only case when safe care cannot be done; label the practical action untested rather
      than claiming stewardship from intention.
    review: Which lifecycle burden became visible only after the care action, and does the next choice
      serve both the person and the resources entrusted to them?
    examples:
      supportive: The bag was cleaned according to its label and used again; the review described one
        avoided replacement possibility without inventing emissions saved.
      mixed: Care preserved function but consumed more time than expected, prompting a simpler sustainable
        routine.
      contradictory: An unsafe repair was attempted or an unverified recycling claim was used to dismiss
        disposal and labor costs.
      inconclusive: A product was called sustainable without mapping its lifecycle or carrying out and
        checking a care action.
  '23.11':
    title: Build a hardship stabilization plan that acknowledges the actual gap
    goal: Prioritize harm reduction, assistance and legitimate negotiation when income cannot meet essential
      costs instead of pretending scarcity can always be solved by stricter budgeting.
    scope_note: The exercise is a fictional stabilization case and verified help-route plan, not eligibility
      advice, debt settlement, a legal instruction to stop paying or a guarantee of housing or benefits.
    burden: Thirty minutes to quantify and prioritize the case, plus one verified resource inquiry and
      a ten-minute revision.
    setup: Use fictional monthly income 1,500 and necessary housing, food, care, transport and other obligations
      totaling 1,900. Optional spending is 80. Income may arrive irregularly, disability-related support
      costs cannot simply be removed, and eligibility for assistance is unknown. Prepare columns for need,
      amount, due date, consequence, existing agreement and available help.
    actions:
    - title: State the shortfall and rank consequences without shame
      instructions: Calculate the necessary-cost gap as 400 before optional spending. Removing the 80
        optional units reduces total outflow but does not close that essential gap. List the likely consequences
        of missing each category, distinguishing immediate safety and care needs, housing continuity,
        income-enabling transport and other obligations. Mark legal deadlines and consequences that require
        confirmation rather than guessing a universal payment order. Identify irregular income and caregiving
        constraints as facts, not evidence of irresponsibility.
      checks:
      - The essential gap remains 400 after optional spending is removed
      - Consequences and timing are considered for each obligation
      - Disability and caregiving costs are not erased on paper
      - A legal or benefits uncertainty is marked for verification
    - title: Verify assistance and negotiation routes before relying on them
      instructions: Locate one official or reputable local assistance, benefits, housing, disability or
        independent counseling route appropriate to the case and check service area, eligibility questions,
        documents, cost and response time. Ask how earnings or assets could change benefits before assuming
        a new job or saving balance improves net resources. Prepare a creditor or provider message stating
        the difficulty and asking about legitimate options; a proposed arrangement is not an agreement
        until confirmed. Do not give passwords or pay an upfront fee for a promise to erase debt.
      checks:
      - One real help route is verified for location and service type
      - Eligibility response time cost and required information are checked
      - Benefit interactions and negotiation outcomes remain conditional
      - Fraud pressure and unverified debt-erasure promises are rejected
    - title: Write a near-term plan with unresolved needs still visible
      instructions: For the next seven days, assign one contact, one document-gathering step and one essential
        continuity action with dates. Show which part of the 400 gap remains after only confirmed support;
        do not count hoped-for aid as income. Define when worsening safety, housing or care needs require
        urgent professional or emergency support. In a real situation, make the appropriate contact rather
        than repeating the fictional case; record contact made, aid approved and money received as separate
        events.
      checks:
      - Three near-term actions have owners or self-assigned dates
      - Only confirmed resources reduce the displayed gap
      - Escalation is tied to actual worsening consequences
      - Inquiry approval and receipt are not conflated
    adaptation: Use an independent trusted helper, language access, disability support or a local legal-aid
      or benefits professional. Keep private case details outside the app. When circumstances involve
      coercive financial control, unsafe housing or immediate loss of essential care, prioritize suitable
      confidential and urgent support rather than a shared worksheet.
    review: Which action reduces the most immediate harm, and what material shortfall remains that cannot
      honestly be solved by a personal habit change?
    examples:
      supportive: The learner kept the 400 essential gap visible, verified a housing-support route and
        treated a requested payment arrangement as pending rather than approved.
      mixed: One resource was real but had a waiting period, so the seven-day plan needed another continuity
        route.
      contradictory: The person was blamed for structural scarcity, essential care was deleted or speculative
        benefits were counted as cash already received.
      inconclusive: A balanced-looking budget hid unpaid essentials and contained no verified assistance
        route or dated action.
  '23.12':
    title: Negotiate a shared-money agreement without financial surveillance
    goal: Make contribution, spending authority, risk, gifts and review expectations explicit while preserving
      consent, privacy and protection from coercive control.
    scope_note: This fictional negotiation or freely chosen low-stakes conversation is not a marriage,
      tenancy, property, debt or legal agreement. Unequal incomes do not determine one universally fair
      arrangement.
    burden: Twenty minutes to compare the case, a willing twenty-minute discussion or rehearsal and a
      ten-minute scenario review.
    setup: Two fictional adults have monthly take-home incomes 1,200 and 2,400 and shared costs of 900.
      Compare equal contributions with proportional contributions. Use a sample joint discretionary-spending
      discussion threshold of 100, a proposed purchase of 80, one of 110 and an offered 200 from a relative
      whose gift-or-loan status is unclear. No real purchase or disclosure is required.
    actions:
    - title: Compare contribution rules and the pressures behind them
      instructions: 'Calculate equal contributions of 450 each: 37.5% of the lower income and 18.75% of
        the higher. Calculate income-proportional contributions of 300 and 600: 25% each. Discuss how
        unpaid care, disability costs, existing obligations, ownership and financial dependence may affect
        fairness beyond those percentages. Each person states a legitimate concern and a privacy boundary.
        Do not require complete account access, secret monitoring or surrender of independently controlled
        resources to demonstrate trust.'
      checks:
      - Both contribution methods and percentages are correct
      - Care costs obligations and dependence receive explicit consideration
      - Each person’s concern and privacy boundary are heard
      - No surveillance or compulsory account access is introduced
    - title: Draft the actual rules for shared decisions
      instructions: Write a provisional agreement covering what counts as shared cost, contribution dates,
        who may commit shared money, the sample 100 discussion threshold, how risk or a shortfall will
        be disclosed, and how gifts or loans are clarified before acceptance. State what stays individually
        controlled and how either person can request review. Use plain language and check each person’s
        understanding; disagreement is a result to retain, not permission for the higher earner to decide
        everything.
      checks:
      - Shared scope contributions and timing are specific
      - Spending authority and material risk disclosure are explicit
      - Gift versus loan expectations are clarified before reliance
      - Individual control and a mutual review route remain protected
    - title: Test the agreement against ordinary and difficult cases
      instructions: Apply the rules to the 80 purchase, the 110 purchase and the ambiguous 200 offer.
        Under the sample threshold, 110 requires discussion; the 80 still must fall within the agreed
        shared scope and available budget. Do not count the 200 as a gift until the terms are clarified.
        Add an income-loss scenario and decide when to revisit contributions. Record agreement, unresolved
        disagreement and any safety concern separately; no signature or money movement is required.
      checks:
      - All three supplied cases are resolved using the written rules
      - Below-threshold spending still respects scope and available funds
      - Ambiguous support is not silently treated as a gift
      - Income change and unresolved disagreement trigger review rather than control
    adaptation: Use a neutral fictional case, separate preparation, an accessible communication method
      or a qualified mediator only when participation is safe and voluntary. Suspected financial abuse,
      retaliation, stalking or coercion calls for appropriate independent support; do not use joint disclosure
      or mediation to make an unsafe person more powerful.
    review: Could both people explain their rights and obligations under the same agreement, and what
      difference or safety concern remains unresolved?
    examples:
      supportive: The pair compared equal and proportional burdens, retained private resources and discovered
        that a below-threshold purchase could still violate the shared scope.
      mixed: A contribution method was agreed, but the family offer remained ambiguous and was excluded
        from the plan.
      contradictory: One person demanded passwords or used income to override consent, or an unclear family
        loan was counted as a gift.
      inconclusive: Fairness was asserted without amounts, authority rules, scenarios or an explicit review
        process.
