schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '27'
exercises:
  '27.01':
    title: Make one ordinary week express three chosen priorities
    goal: Translate three endorsed priorities into a workable week through time, surroundings, spending
      choices, relationships, roles and recurring action.
    scope_note: This redesigns one ordinary week, not an ideal life blueprint. Necessary care, existing
      obligations, access needs and resource limits constrain the plan; a tidy calendar is not evidence
      that the week was lived.
    burden: Twenty minutes to prepare, three small actions within seven days and a 15-minute comparison
      after the week.
    setup: Use a private weekly calendar and three cards. The supplied example is keep needed care reliable,
      give a friend welcome attention, and finish one useful household task. Put one priority on each
      card. Use only resources already available; no purchase, financial-account access or major life
      change is required.
    actions:
    - title: Find the missing everyday expression
      instructions: 'For each priority, name one visible expression in each of six places: calendar, physical
        or digital environment, money or resource use, relationships, current roles and recurring practice.
        Mark genuinely irrelevant places rather than inventing obligations. In the example, care has an
        appointment or routine, reachable materials, protected existing resources and an agreed help route.
        Contrast these expressions with what actually happened last week; identify one mismatch per card,
        including a structural barrier rather than blaming motivation.'
      checks:
      - All three priorities have concrete everyday expressions
      - The six life areas receive relevant or not-applicable dispositions
      - Last week supplies an actual comparison rather than an idealized schedule
      - A resource or access barrier remains visible where present
    - title: Install a small arrangement for each priority
      instructions: Choose one feasible action per card and put it in the next seven days with a cue and
        a modest fallback. For the supplied example, prepare existing care materials, send a welcome invitation
        with a specific time, and clear one needed household surface. Adjust the surrounding layout or
        existing resource allocation to make each action possible. Confirm any shared arrangement with
        the affected person; do not spend shared money, cancel care or assign someone a role without agreement.
      checks:
      - Each priority has one scheduled action and fallback
      - A relevant environmental or resource arrangement is changed
      - Shared arrangements are agreed rather than imposed
      - Essential care and prior responsibilities stay protected
    - title: Compare the lived week with its design
      instructions: Carry out the three actions when suitable and record happened, adapted, deferred or
        blocked after each. At the end of the week compare the actual time, arrangement and effect with
        the original cards. Keep one effective arrangement, revise one mismatch and remove one unnecessary
        planning demand. An unanswered invitation remains an invitation, not a relationship outcome; a
        blocked care arrangement calls for appropriate support rather than a favorable completion story.
      checks:
      - Actual actions and blocked opportunities are distinguished
      - The review compares the lived week with the three priorities
      - One effective arrangement and one needed revision are identified
      - An unnecessary planning burden is removed without deleting a duty
    adaptation: Use a paper strip, audio notes, tactile cards or a trusted planning aid. Reduce each action
      to a genuinely useful accessible version without substituting intentions for action. A fictional
      week tests planning only. Do not enter sensitive calendar, financial or health details into the
      application.
    review: Which priority became easier to live because the week changed, and which mismatch needs a
      different arrangement rather than greater effort?
    examples:
      supportive: The person placed care materials where used, made a welcome invitation and completed
        the selected household task, then retained two arrangements and revised the third.
      mixed: The plan fit available time, but a shared arrangement was never confirmed and one action
        remained blocked.
      contradictory: The calendar was made to look coherent by removing essential care, spending another
        person’s money or reporting unperformed actions as completed.
      inconclusive: Three values were named without changing an arrangement or comparing an actual week.
  '27.02':
    title: Make and revisit a tradeoff without hiding the sacrificed good
    goal: Choose among legitimate competing goods within a real limit, explain what is protected and sacrificed,
      and revisit the choice after seeing its consequences.
    scope_note: This concerns a low-stakes discretionary choice, not rationing essential care, overriding
      another person’s rights or deciding a major legal, medical or financial matter.
    burden: Twenty minutes before one choice, the chosen activity and a 10-minute review within a week.
    setup: Use the supplied example of a three-hour discretionary weekend window after essential responsibilities.
      Possible uses are visiting a willing friend, learning a skill, volunteering at an already approved
      short task, or resting. No option is compulsory. Use a page headed protected obligations, live alternatives,
      sacrificed goods and review.
    actions:
    - title: Keep the alternatives genuinely live
      instructions: Check what time and energy are actually discretionary before assigning the three-hour
        window. Consider work, family, health, service, rest, growth, pleasure and security, marking each
        as a protected obligation, relevant option or not relevant now. Write three feasible alternatives,
        including rest or doing less. For each name one benefit, one cost, who is affected and whether
        the choice can be reversed. Do not make the preferred option win by describing the others as laziness
        or selfishness.
      checks:
      - Actual discretionary capacity is established first
      - All eight competing goods receive an honest disposition
      - Three feasible alternatives include doing less when appropriate
      - Benefits costs affected people and reversibility are explicit
    - title: Choose with a reason that admits the loss
      instructions: Select one alternative using two reasons you endorse and state the strongest good
        it leaves unserved. In the supplied case, rest may take priority after a demanding week while
        skill practice waits; a friend visit may instead fit a rare welcome opportunity. Confirm any effect
        on a shared commitment before acting. Write a reversal condition, such as a new care duty or changed
        safety condition, and one proportionate way to revisit the sacrificed good later without promising
        to maximize everything.
      checks:
      - The chosen option has two endorsed reasons
      - The strongest sacrificed good is named fairly
      - Affected shared commitments are confirmed before action
      - A reversal condition and bounded later revisit are set
    - title: Review the consequences rather than defend the choice
      instructions: Carry out the chosen activity or record the condition that required revision. Within
        a week compare the actual benefits, costs and effects on others with the original reasons. Ask
        whether the choice was reasonable from the information available, separately from whether its
        outcome was pleasant. Keep, revise or abandon the decision rule for a similar window. An unexpected
        good outcome does not erase a foreseeable neglected obligation, and disappointment does not by
        itself prove the choice was unwise.
      checks:
      - The chosen activity or explicit revision actually occurs
      - Observed benefits costs and effects are compared with predictions
      - Decision quality and outcome pleasantness are examined separately
      - A future decision rule is retained or revised with a reason
    adaptation: Use two alternatives and spoken notes if comparing three is burdensome, but retain the
      unchosen good and actual limit. A support person may help clarify options without choosing for you.
      Defer choices involving urgent care, coercion or high consequences to the appropriate people and
      procedures.
    review: What made this sacrifice justified in this situation, and what later evidence would make the
      same tradeoff unwise?
    examples:
      supportive: The person protected existing care, chose rest over an optional lesson, informed an
        affected friend where needed and later reviewed both recovery and the missed learning opportunity.
      mixed: The chosen activity occurred, but one cost to another person had not been checked and required
        repair.
      contradictory: An essential obligation was relabeled optional, or a favorable result was used to
        conceal a foreseeable harm.
      inconclusive: A ranking of values was written without a concrete choice, action or later comparison.
  '27.03':
    title: Set a two-week emphasis that fits the current season
    goal: Identify the demands of a current life season and distinguish what must advance, what needs
      protection and what can legitimately wait.
    scope_note: Season labels are planning descriptions, not diagnoses or rules for how long grief, recovery
      or caregiving should last. Existing duties and qualified care remain authoritative.
    burden: Twenty minutes to prepare, two small adjustments during the next fortnight and a 15-minute
      review.
    setup: 'Use three columns labeled advance, protect and wait. The supplied case is a temporary increase
      in caregiving alongside ordinary work: prepare one care handoff, protect needed rest and essential
      work, and pause an elective project. Choose a similarly real current constraint or use the case
      as a labeled planning rehearsal.'
    actions:
    - title: Describe the season from observable demands
      instructions: Consider building, maintenance, caregiving, recovery, exploration, grief and transition
        as possible descriptions; more than one may fit. Name two present demands, one available support
        and one uncertain duration without disclosing private history. In the supplied case, two additional
        care visits and a changed schedule explain the caregiving emphasis. State what the label does
        not authorize, such as neglecting a dependent, forcing recovery or postponing every valued relationship
        indefinitely.
      checks:
      - The season is grounded in two present demands
      - Available support and uncertain duration are recorded
      - Multiple or uncertain season descriptions are allowed
      - The label does not excuse neglected duties or forced recovery
    - title: Make one advance and one protection workable
      instructions: Place no more than two items in advance, two in protect and three optional items in
        wait. For each give a concrete next action or boundary and an owner. Prepare the care handoff
        in the example and agree a protected rest window with anyone it affects. Communicate a paused
        shared commitment rather than silently abandoning it. Set a review date in two weeks and an earlier
        trigger for changed safety, capacity or obligations.
      checks:
      - Advance protect and wait each have bounded contents
      - One advance action and one protection are installed
      - Any shared pause or handoff is communicated and agreed
      - A two-week review and earlier change trigger are set
    - title: Review whether the emphasis served the actual demands
      instructions: During the fortnight carry out the advance action and use the protection at least
        once where feasible. At review, compare the demands and supports with the first description. Identify
        an item that should remain paused, resume or be relinquished with proper notice. Record a failed
        protection or unavailable support as a problem to address, not proof that you should push harder.
        Do not infer that a season ended simply because the calendar review arrived.
      checks:
      - Actual use of the advance action and protection is recorded
      - Changed demands and support availability inform the review
      - A paused item receives a reasoned next disposition
      - The review does not impose an artificial end to grief or recovery
    adaptation: Use symbols, a short conversation or a helper chosen by the participant. When capacity
      is very limited, one protected essential action may be the entire feasible practice. Rehearsal supports
      planning but does not demonstrate caregiving, recovery or a lived transition.
    review: What needed protection more than progress, and what observable change would justify shifting
      the emphasis?
    examples:
      supportive: A caregiver completed a consented handoff, used the protected rest window and kept an
        elective project paused after the review showed the demands remained.
      mixed: The advance action occurred, but the protection failed because the agreed support was unavailable.
      contradictory: A season label was used to abandon dependent care, demand rapid grief resolution
        or excuse an indefinite uncommunicated withdrawal.
      inconclusive: Several season labels were selected without changing or reviewing any actual commitment.
  '27.04':
    title: Repair one neglected role without letting the loudest role take over
    goal: Make current role obligations visible, distinguish held roles from unchosen ones, and address
      one neglected responsibility within honest capacity.
    scope_note: Role balance is not equal time for every role. Optional roles need not be adopted, while
      responsibilities already created by care, agreement or authority cannot simply be marked not applicable.
    burden: Twenty minutes to map current roles, one small responsibility repair and a 10-minute follow-up
      within seven days.
    setup: 'Use eight role cards: individual, partner, relative, friend, worker, citizen, caregiver and
      community member. The supplied example is a person whose work messages consume a promised friend
      check-in and necessary personal administration. No partner, child, employment or particular family
      structure is assumed.'
    actions:
    - title: Separate role identity from concrete responsibility
      instructions: 'Mark each role held, sought, not held or consciously unchosen. For held roles write
        one actual responsibility and its source: agreement, dependence, law or an endorsed commitment.
        Identify which role currently makes the most urgent noise and which real obligation has been neglected.
        In the supplied example, checking every nonurgent work message is not automatically more binding
        than an agreed check-in. Keep legal or caregiving uncertainty for appropriate advice rather than
        resolving it by a private label.'
      checks:
      - All eight roles receive a current applicability disposition
      - Held-role responsibilities have an identifiable source
      - The loudest demand is distinguished from a binding obligation
      - A specific neglected responsibility is identified without inventing roles
    - title: Renegotiate a collision and carry out a repair
      instructions: Choose one low-stakes collision within your authority. State the limit to the relevant
        person using a concrete proposal, such as replying to nonurgent messages in an agreed window while
        honoring the check-in. Confirm the arrangement rather than assuming consent. Carry out the neglected
        responsibility or make a specific repair for the missed promise. Do not reduce required care or
        workplace safety coverage to make the role map look balanced.
      checks:
      - One collision is addressed through a concrete proposal
      - Any shared limit is confirmed rather than presumed
      - A neglected responsibility receives actual action or repair
      - Required care and safety coverage remain intact
    - title: Check the whole portfolio for displaced neglect
      instructions: After the change, revisit the held-role cards. Record whether the repair occurred,
        whether the louder role remained adequately served and whether a new burden was shifted to someone
        else. Retain one boundary and remove one self-invented demand that had no genuine obligation behind
        it. If another role is still neglected, name the next conversation or support need without expanding
        this practice into an attempt to optimize all roles at once.
      checks:
      - The intended repair and effect on the louder role are checked
      - Burden shifted to another person is made visible
      - One justified boundary and one unnecessary demand are distinguished
      - Remaining neglect receives a bounded next step rather than a perfect-balance claim
    adaptation: Use only the roles actually held and allow relational or communal names that fit the participant’s
      culture. A trusted adviser can help identify obligations, but cannot erase another person’s rights.
      Sensitive role details stay in private notes; the application needs only the listed observations.
    review: Which obligation had been hidden by a louder demand, and did addressing it create an unfair
      burden elsewhere?
    examples:
      supportive: The person agreed a nonurgent reply window, repaired the missed check-in and verified
        that no essential coverage was lost.
      mixed: The neglected role received attention, but the arrangement shifted extra work to a colleague
        who had not agreed.
      contradictory: A dependent’s care was treated as an optional role, or equal time was imposed on
        every role regardless of actual obligations.
      inconclusive: Role labels were collected without identifying a responsibility or carrying out a
        repair.
  '27.05':
    title: Run a short operating review that changes the next week
    goal: Review major life areas at a sustainable interval and turn the review into one completed action,
      one scheduled commitment and one responsibly removed demand.
    scope_note: This is a practical coordination review, not a comprehensive health, financial or relationship
      assessment. It should reduce forgotten obligations rather than create a new administrative burden.
    burden: Two 15-minute weekly reviews and one small action between them.
    setup: 'Use a private page with eight headings: commitments, health, relationships, money, learning,
      work, service and direction. Under each permit only stable, needs action, not applicable or uncertain,
      followed by at most one note. The supplied default is a missed routine administrative task, an unanswered
      welcome message and an optional learning project that no longer fits.'
    actions:
    - title: Scan for decisions rather than narrate the week
      instructions: Give each heading an honest disposition based on available records or firsthand observation.
        Do not pull private account, medical or other people’s data into the application. Identify one
        overdue action, one upcoming commitment and one optional demand to stop or defer. Distinguish
        a matter needing qualified help from an ordinary task; the review is not permission to reinterpret
        a treatment plan, contract or shared agreement.
      checks:
      - All eight areas receive a bounded disposition
      - Available evidence is distinguished from uncertainty
      - One action one commitment and one removable demand are identified
      - Qualified or shared decisions remain outside unilateral review authority
    - title: Make the three decisions operational
      instructions: Complete the small overdue action now or at a specific time within the next week.
        Put the upcoming commitment in the planning method actually used, with a cue and necessary materials.
        Remove or defer the optional demand, notifying anyone who relied on it and preserving any agreed
        handoff. For the default, submit the ordinary form through its established route, answer the willing
        contact and pause the elective project; do not count deleting a task as fulfilling its original
        promise.
      checks:
      - The overdue item becomes a real action with a near date
      - The upcoming commitment has a usable cue and materials
      - The optional demand is removed with any necessary notice or handoff
      - Removing a task is not reported as completing the promised work
    - title: Use the next review to test the review itself
      instructions: At the second weekly review, check whether the action occurred and the scheduled commitment
        was remembered. Verify that removing the optional demand caused no unaddressed reliance or burden.
        Record how long the review actually took and whether the eight-heading scan was useful; simplify
        its format or adjust the interval if it crowded out the life it was meant to support. Select no
        more than one next action rather than rebuilding the entire system.
      checks:
      - The next review checks actual action and remembered commitment
      - Consequences of the removed demand are examined
      - Actual review burden is compared with its usefulness
      - The format or interval is retained or simplified with one next action
    adaptation: Use a voice checklist, accessible reminder or a ten-minute supported conversation. During
      constrained periods scan only urgent safety and binding obligations, labeling the rest unreviewed
      rather than satisfactory. A synthetic page tests review mechanics but not actual follow-through.
    review: Which decision changed the week, and what part of the review can be removed without losing
      an important responsibility?
    examples:
      supportive: The review led to a completed form, a remembered commitment and an agreed project pause;
        the second review shortened unnecessary notes.
      mixed: The page was concise, but the chosen action remained unscheduled and was still overdue a
        week later.
      contradictory: Private records were uploaded unnecessarily, a shared promise was silently deleted,
        or the review became a substitute for taking action.
      inconclusive: All headings were marked good without evidence, decisions or a second review.
  '27.06':
    title: Test a pursuit before making it an identity requirement
    goal: Treat a meaningful goal as a time-bounded hypothesis with assumptions, observable learning and
      explicit continue, adapt or stop criteria.
    scope_note: A short experiment informs a pursuit; it does not settle a career, relationship, medical
      treatment or major financial decision. Stopping an unsuitable experiment is not a verdict on personal
      worth.
    burden: Twenty minutes to design a two-week trial, three 15-minute practice periods and a 15-minute
      review.
    setup: Use the supplied pursuit of learning to explain an unfamiliar everyday topic clearly. The two-week
      trial is three short preparation sessions and one explanation to a willing adult or a labeled private
      rehearsal. Materials are a non-sensitive page, a reliable source on the topic and the participant’s
      existing communication tools.
    actions:
    - title: Write the hypothesis and its honest tests
      instructions: 'Before starting, write: I think this pursuit fits my current season because, I expect
        to learn, and this depends on. In the example, test whether three short sessions fit available
        capacity and whether a listener can identify the explanation’s main point. Set a two-week end
        date, a fixed effort limit, one process measure and one learning question. Specify a continue
        condition, an adaptation condition and a stop condition such as repeated conflict with essential
        duties. Do not make enjoyment or flawless performance compulsory.'
      checks:
      - The pursuit is expressed as a hypothesis with assumptions
      - An end date and effort limit are fixed beforehand
      - One process measure and one learning question are observable
      - Continue adapt and stop conditions do not depend on personal worth
    - title: Run the trial while preserving inconvenient observations
      instructions: Complete the three small sessions where feasible, noting actual time, interruptions
        and one thing learned after each. Give the explanation through an accessible channel to a willing
        person, or clearly label a solo rehearsal. Ask the listener only to state the main point, not
        to reassure you that you are talented. Keep missed sessions, confusion, burden and changed circumstances
        visible. Alter a safety condition immediately, but label any other mid-trial design change so
        the final comparison remains honest.
      checks:
      - Actual sessions and interruptions are recorded without invented adherence
      - A willing explanation or labeled solo rehearsal occurs
      - Feedback concerns the predeclared learning question rather than reassurance
      - Adverse observations and mid-trial changes remain visible
    - title: Choose the next commitment from what the trial showed
      instructions: At the end date compare the observations with the original assumptions and three decision
        conditions. Choose continue at a stated sustainable level, adapt one feature and retest, or stop
        with any needed notice. Identify which uncertainty the trial could not answer, such as long-term
        interest or performance in public. Preserve the original hypothesis beside the decision instead
        of rewriting it to make every outcome successful.
      checks:
      - The review uses the original assumptions and decision conditions
      - Continue adapt or stop has a specific evidence-based reason
      - An unresolved long-term or transfer question is retained
      - The original hypothesis is preserved beside the next commitment
    adaptation: Shorten sessions, use text or assistive communication, or choose another low-risk pursuit
      with an equally observable small output. A rehearsal cannot establish audience understanding. Do
      not use this trial to self-direct hazardous training, treatment changes or irreversible life decisions.
    review: What did the trial teach about fit and feasibility, and what would be the smallest justified
      next commitment?
    examples:
      supportive: Two sessions and a clear explanation fit the week, while the third conflicted with care;
        the person adapted the cadence rather than declaring either total success or failure.
      mixed: All sessions occurred, but the listener’s main-point check was missing, so learning transfer
        remained uncertain.
      contradictory: Missed sessions were erased, a stop condition was ignored, or continuing the pursuit
        became necessary to preserve a worthy identity.
      inconclusive: A goal statement was written without a time-limited trial, observations or a decision.
  '27.07':
    title: Prepare one foreseeable transition without pretending it has happened
    goal: Anticipate the practical dependencies, emotional losses, available support and first actions
      involved in one foreseeable life transition.
    scope_note: Preparation is not completion of the transition. Legal, clinical, financial, safeguarding
      and care-continuity decisions require the appropriate authority or professional rather than this
      worksheet.
    burden: Thirty minutes to map the transition, one verification contact or rehearsal and a 15-minute
      readiness review.
    setup: Use the supplied case of a work or study schedule changing next month. Prepare a page with
      first day, essentials that must continue, people affected, what may be lost and support. Other possible
      transitions include location, partnership, parenthood, health, aging, dependency or loss; only choose
      one relevant transition, not every life pathway.
    actions:
    - title: Map continuity and loss separately
      instructions: State what is known about the change, what is only possible and the first date at
        which it matters. Identify three dependencies such as transport, necessary care and communication
        with affected people. For each name who has authority and what information is missing. Separately
        name one familiar routine, relationship pattern or expectation that may be lost and one possible
        benefit without forcing optimism. For anticipated loss or health change, keep qualified care and
        the person’s own preferences central.
      checks:
      - Known changes possibilities and first relevant date are separated
      - Three essential dependencies have authority and information needs
      - A possible loss and benefit are allowed without forced optimism
      - Existing care and the affected person’s preferences remain central
    - title: Verify one dependency and rehearse the first day
      instructions: 'Through an established legitimate channel, confirm one important arrangement rather
        than assuming it exists: for the default, check the revised transport or agreed care coverage.
        Then walk through the first day on paper from waking to the final necessary responsibility. Add
        one fallback for an unavailable service and one support conversation or small closing ritual for
        what is changing. A rehearsal does not count as a confirmed service, and an unconfirmed dependency
        remains visibly open.'
      checks:
      - One arrangement is actually verified or remains explicitly unconfirmed
      - The first-day rehearsal includes essential responsibilities
      - An unavailable service has a realistic fallback or escalation need
      - Emotional support or a closing ritual is prepared without compulsory disclosure
    - title: Review readiness without giving yourself clearance
      instructions: Compare the first-day rehearsal with the verified information. Mark dependencies ready,
        awaiting confirmation or needing qualified help, and carry out one safe preparatory action such
        as placing needed existing materials together or sending the agreed schedule. Set a check before
        the transition and another after it begins. Name what cannot be known until the change is lived;
        do not mark parenting, relocation, recovery or bereavement competence from a preparation page.
      checks:
      - Readiness states distinguish verified information from open dependencies
      - One safe preparatory action actually occurs
      - Checks before and after the transition are arranged
      - Preparation does not become a claim of completed transition or competence
    adaptation: Use a visual sequence, interpreter, audio plan or trusted supporter chosen by the affected
      person. A fictional case is useful when no transition is foreseeable but proves planning only. If
      current danger, care disruption or serious symptoms appear, use appropriate timely support instead
      of continuing the exercise.
    review: Which dependency was more uncertain than it first appeared, and what practical or emotional
      support must remain available after the first day?
    examples:
      supportive: The person confirmed the transport change, found an unfilled care interval, arranged
        appropriate help and prepared the first-day materials while keeping the open dependency visible.
      mixed: The rehearsal was complete, but a service was assumed available and still needed confirmation.
      contradictory: A paper plan was treated as permission to discontinue care, make an unauthorized
        legal change or claim that a loss had been resolved.
      inconclusive: The transition was named without verified arrangements, a rehearsal or a preparatory
        action.
  '27.08':
    title: Pursue a higher standard while leaving room for enough
    goal: Combine a bounded effort toward excellence with an honest sufficiency standard, protected rest
      and appreciation that does not depend on future achievement.
    scope_note: This practices one relationship to ambition, not a prescription to lower needed standards,
      abandon commitments or feel content during hardship. Human dignity is not conditional on output.
    burden: Fifteen minutes to set standards, two 20-minute effort periods and a 10-minute review.
    setup: 'Use a small original craft, explanation or household organization project already within safe
      ability. The supplied example is a one-page guide that another person can actually follow. Draw
      two headings: good enough for its purpose and worthwhile refinement. Set two short effort windows
      with a stopping time that protects an existing rest or care commitment.'
    actions:
    - title: Separate sufficiency from the stretch
      instructions: 'Define three observable sufficiency checks for the example: the purpose is clear,
        the necessary steps are present and a willing reader can find the next action. Name one refinement,
        such as making the wording more elegant, that is desirable but not required for basic use. Identify
        the comparison pressure that could keep raising the standard and write one present good not earned
        by the project, such as available help, a relationship or a permitted period of rest.'
      checks:
      - Three purpose-based sufficiency checks are fixed
      - One stretch improvement is distinguished from necessary function
      - A comparison pressure is named without making it authoritative
      - A present good is recognized without requiring project success
    - title: Work seriously and stop at the agreed limit
      instructions: Use the first effort window to meet the sufficiency checks and the second, if needed
        and feasible, for the chosen refinement. Obtain a willing reader’s practical next-action check
        or mark it untested. Stop at the predetermined time, saving unfinished work and honoring the protected
        rest or care commitment. Do not deliberately produce poor work to prove detachment, and do not
        treat working through a necessary boundary as evidence of superior commitment.
      checks:
      - Bounded work genuinely aims at the declared standard
      - The practical reader check is performed or marked untested
      - The stopping time protects the existing commitment
      - Neither careless work nor boundary-breaking is celebrated
    - title: Review ambition and enoughness together
      instructions: Compare the artifact with the sufficiency and stretch standards separately. Name what
        improved through effort and what remains unfinished, then choose finish one necessary gap, release
        the usable version or consciously leave the refinement. Receive the protected rest or present
        good without converting it into a reward you must repay. Record any urge to move the goalposts
        and whether it served the artifact’s purpose rather than status comparison.
      checks:
      - Necessary function and optional refinement receive separate judgments
      - The next disposition reflects the artifact’s actual purpose
      - Protected rest or appreciation is not made conditional on perfection
      - A moved standard is examined for purpose versus status pressure
    adaptation: Use a smaller output, adapted craft method, spoken guide or supported reader check. Appreciation
      can be simple acknowledgement; a positive mood is not required. Required safety or professional
      standards are not negotiable sufficiency experiments.
    review: Which effort genuinely improved the work, and which extra demand merely postponed permission
      to rest or recognize what was already good?
    examples:
      supportive: The guide met its three use checks, one sentence was refined and the person stopped
        for the protected commitment without denying remaining imperfections.
      mixed: The project improved, but the stopping time slipped and the protected rest needed a revised
        boundary.
      contradictory: Essential quality was ignored in the name of contentment, or dignity and rest were
        withheld until an ever-rising performance target was reached.
      inconclusive: An aspiration and a gratitude statement were written without bounded effort or a sufficiency
        review.
  '27.09':
    title: Revise a method without abandoning the principle it served
    goal: Keep an endorsed principle visible while changing a method or belief in response to evidence,
      context and legitimate surprise.
    scope_note: Coherence is not unchanging behavior, and flexibility is not permission to excuse harm.
      This uses a low-stakes personal rule rather than altering a legal, clinical or safety requirement.
    burden: Twenty minutes to prepare, two ordinary opportunities and a 10-minute comparison.
    setup: 'Use the supplied rule I must answer every nonurgent message immediately because I value reliability.
      Prepare four headings: principle, current method, evidence against the method and alternative. Only
      use messages in a context where response timing is genuinely within your authority and no required
      coverage is lost.'
    actions:
    - title: Identify what deserves continuity and what may change
      instructions: State the principle in terms of the good it protects, then write the current method
        separately. In the default, reliability means keeping reasonable agreements and communicating
        delays, not necessarily instant replies. Find one observation supporting the method and one showing
        a cost or failure. Name a fact that could change your understanding of the principle itself; do
        not assume every inherited belief is beyond review, but distinguish evidence from mere inconvenience.
      checks:
      - Principle and current method are explicitly separated
      - Both supporting and challenging observations are retained
      - A cost or failure of the current method is concrete
      - A possible belief-revising fact is named without using inconvenience as proof
    - title: Test an alternative with affected people informed
      instructions: Choose one alternative that aims at the same good, such as an agreed reply window
        with an urgent exception. Check that relevant people understand the arrangement and that it does
        not violate a duty or shift hidden work. Use it on two natural low-stakes opportunities. Record
        whether the promised response occurred, whether anyone was left without necessary information
        and whether the alternative reduced the original cost. Do not stage an emergency or withhold required
        help to test the rule.
      checks:
      - The alternative is linked to the same protected good
      - Affected people and actual duties are considered before use
      - Two natural opportunities test the alternative
      - Necessary information and help are not withheld for the experiment
    - title: Keep a coherent revision rather than a defensive story
      instructions: Compare both opportunities with the original supporting and challenging evidence.
        Keep the revised method, restore the old one or change one condition, giving the reason. State
        what remained stable, what changed and what is still uncertain about the underlying belief. Where
        the test harmed a commitment, make a proportionate repair. Do not pretend you always held the
        new view or treat correction as the loss of an entire identity.
      checks:
      - Both opportunities inform the chosen revision
      - Stable principle changed method and remaining uncertainty are distinguished
      - Any harmed commitment receives a repair disposition
      - The prior view is acknowledged rather than rewritten out of history
    adaptation: Use a written arrangement, visual cue or planning support. When another person cannot
      safely be consulted, choose a wholly self-controlled low-stakes method or use the fictional case.
      Do not experiment with medication, emergency response, consent, professional duties or another person’s
      rights.
    review: What stayed morally important when the method changed, and what evidence would justify a deeper
      revision rather than another workaround?
    examples:
      supportive: The agreed reply window preserved promised responses on both occasions and reduced interruptions,
        so the person revised the method while retaining reliability.
      mixed: One response was missed; the person repaired it and adjusted the exception rather than declaring
        the experiment wholly successful.
      contradictory: Flexibility was used to dismiss a binding obligation, or the original belief was
        denied to avoid admitting a change.
      inconclusive: A principle was renamed without an alternative method, actual opportunities or a comparison.
  '27.10':
    title: Receive one lesson and help another person use it independently
    goal: Combine receiving guidance with a sustained, consented effort to strengthen another person’s
      capability and preserve a useful piece of knowledge.
    scope_note: Two learning contacts sample generativity, not a claim of successful long-term mentorship.
      Do not teach beyond competence or substitute this exercise for licensed instruction, safeguarding
      or professional supervision.
    burden: One short learning conversation or source study, two 15-minute learner contacts over two weeks
      and a 10-minute review.
    setup: Use a safe everyday skill you can already perform. The supplied example is checking an event
      notice for date, location and required preparation. Use a fictional notice with those three facts,
      an experienced willing adviser or reliable public guide, and an adult learner who freely wants the
      help. No employment, parenting or mentoring role is presumed.
    actions:
    - title: Receive guidance before deciding what to teach
      instructions: Ask the adviser how a novice commonly misreads the notice and what practical check
        catches the mistake, or study an appropriate public guide and label it source learning rather
        than personal mentoring. Compare the lesson with your own method and preserve one correction with
        attribution. Ask the learner what they want to do independently and have them try one fictional
        notice before instruction. Keep the baseline attempt private and use it to choose help, not to
        rank the person.
      checks:
      - A received lesson or correction is retained with attribution
      - Source learning and interpersonal mentoring are distinguished
      - The learner chooses an independent capability goal
      - A private baseline attempt informs support without ranking worth
    - title: Teach a small method and create another opportunity
      instructions: Demonstrate checking date, location and preparation while explaining why each matters.
        Let the learner try a different fictional notice through their preferred communication method,
        using prompts only where wanted. Ask them to show or explain the check in their own way rather
        than repeat your wording. Leave a short accessible reminder they control and agree a second opportunity
        within two weeks. Feedback and contact must be freely declinable; do not require gratitude or
        dependence.
      checks:
      - A small method is demonstrated with its purpose
      - The learner tries a different example with chosen support
      - Teach-back uses the learner’s own explanation or demonstration
      - An accessible reminder and freely agreed second opportunity are provided
    - title: Return to check capability rather than loyalty
      instructions: At the second contact, offer a fresh notice and let the learner perform the check
        with whatever support they normally need. Compare the result with the original baseline and ask
        which part of the help was useful or intrusive. Correct one issue only with permission and update
        the reminder together. Record independent success, supported success, remaining difficulty or
        no follow-up honestly. Name what you learned from the learner and how the knowledge could remain
        available without requiring your continued presence.
      checks:
      - A fresh follow-up task is compared with the baseline
      - Independent supported and unobserved outcomes remain distinct
      - The learner can critique or decline the help
      - Knowledge is preserved without making continued dependence the goal
    adaptation: Use text, AAC, interpretation, screen-reader-friendly material or a different safe everyday
      skill. Without a willing learner, prepare and test the reminder alone but label mentorship transfer
      untested. Minors, vulnerable adults and formal training require the setting’s proper consent, safeguarding
      and supervision.
    review: What can the learner now do with less unnecessary dependence, and what did receiving their
      feedback change in your own understanding?
    examples:
      supportive: After two willing contacts, the learner checked the fresh notice using their own accessible
        reminder and identified a confusing phrase that improved the teacher’s method.
      mixed: The learner completed the first example with prompts, but the second contact did not occur
        and independent transfer remained unknown.
      contradictory: Help became a loyalty test, required gratitude, exceeded the teacher’s competence
        or deliberately kept the learner dependent.
      inconclusive: Advice was delivered once without a learner-chosen goal, baseline or follow-up opportunity.
  '27.11':
    title: Leave one useful contribution that does not depend on your name
    goal: Create or repair a modest contribution that another willing person can maintain, while considering
      its effects on relationships, shared systems, knowledge and existing harms.
    scope_note: A maintainable contribution is not proof of a lifetime legacy. Ownership, consent, privacy,
      cultural access and any existing repair obligations take priority over recognition or permanence.
    burden: Twenty minutes to choose the contribution, one 30-minute construction or repair and a 15-minute
      handoff test.
    setup: 'Use the supplied example of a small shared household or community resource guide that its
      users actually want: where a shared item belongs, how to use it safely within ordinary ability,
      who handles questions and how corrections are made. Use only approved non-sensitive information
      and a willing future maintainer; no public publication is required.'
    actions:
    - title: Choose usefulness and repair before recognition
      instructions: Identify the people who would use the contribution and ask what problem it should
        solve. Consider five possible forms of legacy—relationships, systems, traditions, knowledge and
        repaired harms—and give each a relevant or not-relevant disposition for this small project. Check
        whether an overdue repair or existing promise should take priority over making something new.
        Agree ownership, permitted audience and a modest definition of useful; do not choose a project
        mainly because your name can remain attached.
      checks:
      - Intended users identify a genuine wanted purpose
      - Five legacy forms receive relevant dispositions
      - Existing repair obligations or promises are considered first
      - Ownership audience and usefulness are agreed without a recognition requirement
    - title: Build a small contribution with maintenance included
      instructions: Create the agreed guide or perform the bounded repair. In the supplied example include
        the item’s location, ordinary use limits, question route, correction method and last-checked date.
        Remove unnecessary personal data and credit others’ contributions appropriately. Add the minimum
        maintenance task and a clear condition for retiring the guide if it becomes inaccurate or unwanted.
        A shared system should be allowed to change; do not make preserving your wording a condition of
        receiving it.
      checks:
      - The wanted guide or repair is actually completed
      - Use limits question route and correction method are included
      - Privacy and appropriate credit are preserved
      - Maintenance and retirement conditions do not require preserving the author’s wording
    - title: Test whether it works without your narration
      instructions: Ask the willing maintainer or user to locate an item or answer one ordinary question
        using the contribution without your explanation. Observe confusion and revise one point, then
        confirm that someone has actually accepted the maintenance role or label the handoff incomplete.
        Remove yourself from one unnecessary approval step. Record what relationship, knowledge or system
        benefit was observed and what future effect remains unknown; do not infer community impact from
        handing over a document.
      checks:
      - A user tests the contribution without the author’s narration
      - Observed confusion leads to a concrete revision
      - Maintenance acceptance and incomplete handoff remain distinct
      - An unnecessary dependence on the author is removed without claiming future impact
    adaptation: Use an audio guide, tactile label, demonstration or accessible shared note instead of
      print. A private family or friend contribution is as legitimate as a public institution. Cultural
      knowledge may require restricted access or no documentation; legal or serious-harm repair needs
      appropriate processes rather than this small project.
    review: What remains useful when your name and explanation are removed, and who can change or retire
      the contribution responsibly?
    examples:
      supportive: A wanted resource guide was tested, corrected and accepted by a maintainer who could
        update it without seeking the author’s approval.
      mixed: The guide was usable, but nobody accepted maintenance, so the contribution was labeled a
        draft rather than a completed handoff.
      contradictory: The project exposed private knowledge, displaced a needed repair or required permanent
        credit and control as the price of receiving it.
      inconclusive: A legacy ambition was described without a wanted contribution, practical test or maintenance
        disposition.
  '27.12':
    title: Make an honest annual account and renew only a few commitments
    goal: Review a defined year for becoming, service, harm, change and received support, then choose
      a limited set of accountable commitments for the next season.
    scope_note: This is a personal reckoning, not a score of worth or a requirement to disclose trauma,
      confess publicly or contact someone unsafely. A shorter available period must be labeled honestly
      rather than called a full year.
    burden: Two 25-minute private review periods, one small follow-through action and a later check date.
    setup: 'Choose exact start and end dates and a few safe records such as a calendar, finished work,
      ordinary commitments or private notes. Use five headings: who I have been becoming, what I served,
      harm or neglect, what changed, and what I received. A fictional year may be used for practice but
      is not personal evidence.'
    actions:
    - title: Ground the account in a few specific episodes
      instructions: Select five to eight episodes across the defined period, including something that
        went well, something difficult, an ordinary responsibility and a received good. Place them under
        the five headings, separating observable action from interpretation. Note missing months or unreliable
        memory rather than filling them with a favorable story. Ask how repeated conduct affected people
        and commitments, not whether the year proves you were a good or bad person. Keep other people’s
        private experiences out of the account unless their inclusion is appropriate and necessary.
      checks:
      - The review period and gaps in available evidence are explicit
      - Specific varied episodes support all five headings
      - Actions and interpretations are distinguished
      - The account avoids worth verdicts and unnecessary third-party disclosure
    - title: Choose repair release and a small recommitment
      instructions: From the account identify one proportionate repair or accountability need, one optional
        pursuit to release and no more than three renewed commitments. For each renewed commitment state
        the purpose, first small action, realistic capacity and a review date. Consult affected people
        before changing a shared obligation. If a harm involves abuse, law, clinical care or serious power
        imbalance, use appropriate support and process rather than forced confession, direct contact or
        self-granted absolution.
      checks:
      - A repair need and an optional release are distinguished
      - No more than three renewed commitments have first actions and review dates
      - Shared changes are discussed with affected people
      - Serious harm follows appropriate accountability rather than unsafe contact or self-absolution
    - title: Make the account change one actual choice
      instructions: Carry out one safe first action or repair step and give any necessary notice for the
        released pursuit. Store the annual account privately with its original dates, including unresolved
        responsibility and uncertainty. At the chosen near-term check, ask whether the limited commitments
        still fit the next season and whether the account led to changed conduct rather than a large new
        checklist. Record a missed action honestly; do not rewrite the year to justify it.
      checks:
      - One first action or safe repair step actually occurs
      - Released commitments receive any required notice
      - The dated account retains unresolved responsibility and uncertainty
      - A near-term check evaluates changed conduct and sustainable scope
    adaptation: Use audio, drawings or a trusted reflective conversation with consent. Review one month
      or season when a year is unavailable, labeling the shorter scope. Grief, memory difficulty or limited
      records do not require forced reconstruction; appropriate support may matter more than completing
      an account.
    review: What does the year call you to repair, release and renew, and which few commitments can the
      next season honestly carry?
    examples:
      supportive: The person used dated episodes, retained an unresolved repair need, released an optional
        pursuit with notice and completed the first action of two renewed commitments.
      mixed: The account was specific, but five new commitments exceeded capacity and needed to be reduced
        before follow-through.
      contradictory: The review became a moral-worth score, an unsafe confession, a denial of harm or
        a rewritten history designed to look successful.
      inconclusive: A list of aspirations replaced the annual account and no first action or release occurred.
  '27.13':
    title: Leave an optional role unchosen without erasing a real duty
    goal: Distinguish broad responsibilities from optional life roles and make an informed, non-deficit
      decision about one role that is not currently held.
    scope_note: Not applicable is not a defect. Declining marriage, parenthood, leadership, entrepreneurship
      or a particular religion does not erase obligations already created by a dependent, agreement, law
      or freely held role.
    burden: Twenty minutes to distinguish responsibilities and roles, one low-stakes clarification and
      a 10-minute review.
    setup: Use five cards labeled marriage, parenthood, leadership, entrepreneurship and a particular
      religious pathway. For each allow held, actively exploring, consciously unchosen or not relevant
      now. The supplied example is someone who values contribution but does not want to start a business;
      the exercise requires no major life decision or public disclosure.
    actions:
    - title: Separate the human good from one optional vehicle
      instructions: Give the five cards current dispositions without treating a blank role as a missing
        achievement. For one unheld role, name the underlying goods it might serve and at least two other
        legitimate ways to serve them. In the example, useful work, generosity and responsibility may
        be expressed through employment, craft or community contribution without business ownership. Separately
        list any existing duty that the role decision cannot cancel, such as an agreed handoff or a dependent’s
        care.
      checks:
      - All five optional roles receive non-deficit dispositions
      - One role is separated from the goods it may serve
      - Two legitimate alternative expressions are named
      - Existing responsibilities that cannot be canceled remain explicit
    - title: Clarify the choice without turning it into a defense trial
      instructions: 'Write a short provisional statement: I am not choosing this role now; I intend to
        serve these goods through this alternative; I will reconsider if this condition changes. Test
        it against one real planning decision, such as removing an unwanted business-starting course from
        an optional study plan while keeping a chosen contribution. Discuss only what needs coordination
        with a willing affected person; nobody is owed intimate reasons merely to approve your life path.'
      checks:
      - A provisional role choice names an alternative and reconsideration condition
      - One actual optional planning decision follows from the choice
      - A chosen contribution or responsibility remains present
      - Coordination is separated from compelled personal disclosure
    - title: Check for pressure and hidden abandonment
      instructions: Review the changed plan. Ask whether the decision came from an endorsed preference,
        a real constraint, coercion or an assumption that only one kind of life counts. Keep uncertainty
        or exploration where honest. Check that no held-role obligation was silently abandoned and that
        the alternative still serves the intended good. Record the disposition for personal planning only;
        do not fabricate a lower competency score or mark an unperformed role task completed.
      checks:
      - Preference constraint coercion and uncertainty are distinguished
      - Held-role obligations remain intact
      - The alternative is checked against the intended good
      - Not applicable is neither a deficit score nor a completed task
    adaptation: Use culturally appropriate role names and a private verbal reflection. A role may be revisited
      without shame, and an inaccessible path need not become a permanent identity declaration. Seek appropriate
      support when coercion, dependence or legal responsibility makes a role decision unsafe or consequential.
    review: Which good matters independently of this role, and how can the chosen path honor it without
      pretending an existing duty disappeared?
    examples:
      supportive: The person declined an optional entrepreneurship path, retained a concrete community
        contribution and kept an existing shared responsibility visible.
      mixed: The role remained under exploration, so the person deferred the optional course rather than
        declaring a permanent identity.
      contradictory: Not applicable was used to abandon a dependent or a held responsibility, or an unchosen
        role was treated as evidence of lesser worth.
      inconclusive: Role cards were labeled without distinguishing underlying goods, existing duties or
        an actual planning choice.
  '27.14':
    title: Build an equivalent pathway that preserves the actual purpose
    goal: Adapt a standard developmental task to disability, culture, vocation, faith, family structure
      or circumstance while preserving its meaningful capability or contribution.
    scope_note: Equivalent purpose does not mean identical format or an automatic claim of equal evidence.
      Adaptations cannot replace required professional qualification, safety, consent or a real-world
      outcome with a worksheet.
    burden: Twenty minutes to identify the purpose and barrier, one adapted attempt and a 15-minute comparison.
    setup: Use the supplied standard task attend an in-person community meeting and speak. Its possible
      purpose is understand a shared issue and make a relevant contribution, not prove comfort with a
      particular room or speaking style. Alternatives include an accessible remote meeting, a written
      contribution through an accepted channel or a supported conversation authorized by the organizer.
    actions:
    - title: Find the purpose behind the prescribed form
      instructions: 'Write the standard task, its intended capability or contribution and three observable
        signs of that purpose. For the default: identify the issue accurately, account for another relevant
        perspective and submit a pertinent question or contribution through an accepted route. Identify
        the actual barrier and its context without demanding a diagnosis or intimate disclosure. Consider
        whether disability, culture, vocation, faith, family structure or current circumstance affects
        fit; these are possible contexts, not a checklist everyone must personally represent.'
      checks:
      - The prescribed form is separated from its intended purpose
      - Three observable purpose checks are specified
      - The actual barrier is identified without compelled disclosure
      - Different life contexts are treated as possible legitimate pathways
    - title: Agree and try an accessible alternative
      instructions: Choose one alternative that can meet the three purpose checks and confirm any required
        channel or participation permission. In the supplied case, read the accessible agenda, obtain
        the relevant perspective through available meeting notes or a willing conversation, and submit
        a concise question through the organizer’s accepted route. Keep ordinary access support in place.
        Record what actually happened; writing an unsent question is preparation, not a submitted contribution,
        and a rejected channel remains a barrier rather than success.
      checks:
      - The alternative can meet the same three purpose checks
      - Any necessary channel or permission is verified
      - An adapted attempt occurs with legitimate support retained
      - Preparation submitted contribution and access refusal remain distinct
    - title: Compare function and remaining limits fairly
      instructions: Review the adapted attempt against the purpose checks rather than resemblance to the
        original format. Ask what was preserved, what changed and what remains untested, such as live
        dialogue when only written exchange occurred. Obtain willing feedback when relevant and revise
        one barrier or next step. Do not claim equal expertise from different evidence, but do not discount
        a useful contribution merely because it used assistance or a culturally different form.
      checks:
      - The comparison uses purpose rather than surface resemblance
      - Preserved function changed form and untested transfer are separated
      - Feedback or an observed barrier informs one revision
      - Support is not treated as lesser worth or automatic equivalence of evidence
    adaptation: The exercise itself may be completed through AAC, interpretation, audio, tactile material
      or a trusted facilitator. Choose an alternative compatible with conscience and legitimate community
      boundaries. For regulated, clinical or safety-critical tasks, obtain the proper accessible assessment
      and qualified guidance rather than declaring an informal substitute equivalent.
    review: What part of the original task was essential to its purpose, and what part could change without
      losing the contribution?
    examples:
      supportive: A written contribution through an accepted accessible channel met the issue, perspective
        and relevance checks, while live dialogue remained explicitly untested.
      mixed: The alternative preserved understanding but the submission route was unavailable, so contribution
        remained blocked rather than counted.
      contradictory: An inaccessible format was treated as a moral deficit, or a rehearsal was declared
        equivalent to a required qualification or actual participation.
      inconclusive: An alternative format was named without a purpose test, accepted route or adapted
        attempt.
  '27.15':
    title: Receive one good without turning it into a performance bargain
    goal: Recognize help, inheritance, care, grace, contemplation or celebration as real dimensions of
      life and respond without making every received good something to earn or repay.
    scope_note: Receiving is not passivity, entitlement or permission to ignore exploitation. The exercise
      does not require religious belief, unwanted help, disclosure, gratitude toward harm or a positive
      emotional response.
    burden: Ten minutes to notice received goods, one ordinary receiving opportunity and a 10-minute reflection
      afterward.
    setup: Use a private page headed received, freely offered, appropriate response and limits. The supplied
      example is using a public library resource and accepting a willing friend’s small practical help.
      Religious participants may understand a received good through grace; secular, communal and other
      interpretations are equally legitimate here. No gift, purchase or contact with an unsafe person
      is required.
    actions:
    - title: Notice what your effort did not create alone
      instructions: 'Name three specific received goods from different sources: inherited knowledge or
        infrastructure, help or care from someone willing, and an opportunity for contemplation or celebration.
        For each distinguish what you contributed from what you did not produce. Include one good that
        cannot be repaid to its original source in any simple transaction. Do not erase injustice, cost
        or mixed history; a received inheritance can call for stewardship or repair as well as appreciation.'
      checks:
      - Three received goods come from distinguishable sources
      - Personal effort and unearned or shared contribution are separated
      - One good is recognized as not simply repayable to its original source
      - Mixed history cost or injustice is not erased by appreciation
    - title: Accept one suitable good with a clear boundary
      instructions: At a natural opportunity, use the library resource, receive the freely offered help
        or enter a modest period of contemplation or celebration. Confirm consent and limits where another
        person is involved, including the freedom to decline. Practice accepting without immediately proving
        productivity, promising disproportionate repayment or converting the experience into public performance.
        If an offer carries coercion or unsafe strings, decline it and choose another legitimate receiving
        opportunity rather than treating refusal as failure.
      checks:
      - One suitable receiving opportunity actually occurs
      - Consent limits and the freedom to decline are preserved
      - Receiving is not made conditional on immediate productivity or repayment
      - Coercive or unsafe offers are declined without a deficit claim
    - title: Respond proportionately and include receiving in the review
      instructions: Afterward record what was received, what response is appropriate and what remains
        outside your control. A response may be a simple thanks, careful use, a returned borrowed item,
        contribution when freely chosen or quiet acknowledgement; it need not equal the gift’s value.
        Name one way the experience changed your account of the day beyond accomplishments. Keep any discomfort
        or absence of gratitude visible and distinguish a genuine obligation from a self-imposed need
        to deserve care.
      checks:
      - The received good and appropriate response are named separately
      - A proportionate response respects genuine obligations without forced equivalence
      - The day’s account includes receiving rather than only achievement
      - Discomfort or absent gratitude remains visible without a worth judgment
    adaptation: Use a public resource, accessible contemplation or a remembered inheritance when interpersonal
      help is unavailable, but label remembered reflection separately from current receiving. No one must
      accept touch, care, religious framing, celebration or contact that conflicts with safety or conscience.
    review: What was present in the day because it was received rather than achieved, and what response
      honors it without turning care into a debt of worth?
    examples:
      supportive: The person used a shared learning resource, accepted a bounded offer of help and responded
        with thanks and careful use without inventing a need to earn the care.
      mixed: The help was accepted, but immediate repayment pressure overshadowed receiving and remained
        an issue for reflection.
      contradictory: The exercise excused entitlement, forced gratitude toward harm or acceptance of a
        coercive offer in order to appear receptive.
      inconclusive: A list of accomplishments was relabeled receiving without identifying a received good
        or an actual opportunity.
