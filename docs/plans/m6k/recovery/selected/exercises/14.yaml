schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '14'
exercises:
  '14.01':
    title: Put one chosen purpose back in control of a recurring media session
    goal: Set a purposeful boundary around notifications, feeds, gaming, adult media, outrage or checking,
      and test friction that preserves useful access without punitive restriction.
    scope_note: One media-use experiment does not diagnose addiction or establish that a category of lawful
      adult media is inherently harmful. Serious loss of control or distress may need qualified support.
    burden: Fifteen minutes of setup and three ordinary sessions with a two-minute review each.
    setup: 'Default: opening a phone to answer one message repeatedly turns into an unplanned feed session.
      Write the intended purpose, the specific entry cue, a natural stopping point and a useful alternative.
      Consider notifications, news or outrage, gaming, adult media and repeated checking only where relevant;
      no exposure to upsetting or sexual content is required.'
    actions:
    - title: Map the entry cue and the point where intention is lost
      instructions: Describe one recent ordinary session as cue, intended action, actual continuation
        and practical cost or benefit. Give each relevant media category a chosen, unwanted or not-applicable
        status rather than making blanket judgments. For the default, the diversion begins when a notification
        opens the feed after the reply. Choose one stopping rule tied to purpose, such as reply and close,
        not an arbitrary purity target.
      checks:
      - A specific cue and intended purpose are identified
      - The actual continuation and its benefit or cost are distinguished
      - Relevant media categories receive a nonjudgmental disposition
      - The stopping rule is tied to an endorsed purpose
    - title: Install one reversible friction while preserving essential access
      instructions: 'Change one setting or route you control: silence a nonessential notification, move
        the feed shortcut, use a direct message bookmark or disable an optional autoplay feature through
        current official settings. Keep emergency, accessibility, care and work communications available.
        Test the route once to ensure the intended message can still be answered. Do not share credentials
        or give another person coercive control of access.'
      checks:
      - One specific reversible friction is installed
      - Essential and accessibility-related access remains available
      - The intended task is tested after the change
      - The boundary remains voluntary and under the participant’s control
    - title: Use three sessions and revise from actual fit
      instructions: On three natural opportunities, perform the intended action and note whether the stopping
        point was used, bypassed or unsuitable. Record any valuable activity accidentally blocked and
        the burden of the change. Keep, adjust or remove the friction using these results; a lapse is
        information, not a reason for deprivation or escalating punishment. Persistent impairment calls
        for appropriate support rather than a harsher app rule.
      checks:
      - Three natural sessions or missing opportunities are recorded
      - Use bypass and poor fit are distinguished
      - Lost benefits and friction burden are considered
      - Revision follows evidence rather than shame or punishment
    adaptation: Use device accessibility controls, an external cue or a paper reminder when settings are
      confusing. Rehearse with a harmless feed category if the original material is triggering. Shared
      devices and dependent access require agreement; do not disable another person’s communication.
    review: Did the change help you finish the purpose you chose while leaving legitimate enjoyment and
      necessary access intact?
    examples:
      supportive: A direct message shortcut allowed the reply and exit on two of three occasions without
        blocking urgent contacts.
      mixed: The feed diversion decreased, but a useful group update was missed and the notification rule
        needed refinement.
      contradictory: Access was controlled by another person or ordinary leisure punished to create an
        appearance of discipline.
      inconclusive: A screen-time limit was selected without identifying a purpose, entry cue or actual
        session result.
  '14.02':
    title: Organize and restore a harmless file before trusting a backup routine
    goal: Practice file organization, device maintenance, account hygiene and recovery through a small
      reversible test that proves a copy can actually be opened.
    scope_note: This is a personal digital-hygiene exercise, not a full security audit or disaster-recovery
      certification. Use only devices and accounts you own or are authorized to administer.
    burden: Twenty-five minutes for a harmless file test and ten minutes for one maintenance check.
    setup: 'Create a new folder named practice-recovery and a new text file containing three invented
      items: blue notebook, spare pencil, meeting at noon. Keep the original. Use an existing authorized
      backup destination or a second local storage location; a second folder on the same device tests
      copying only, not protection from device loss. Never delete real files or reset a device for this
      exercise.'
    actions:
    - title: Map the file and the services it depends on
      instructions: Give the test file a clear name and date, then identify where the original, backup
        and account recovery information reside. Note whether both copies depend on the same device, cloud
        login or internet connection. Review one device’s update status, screen lock and unused account
        access using official settings without changing managed policies. Mark an unfamiliar warning for
        qualified help rather than dismiss it.
      checks:
      - The harmless original has a clear name and known location
      - Original backup and access dependencies are distinguished
      - Same-device or same-account failure limits are recorded
      - One device-maintenance check is completed without bypassing policy
    - title: Copy and restore to a new location without overwriting
      instructions: Back up the test file using the chosen method, then restore or download it into a
        different new folder. Open the restored file and compare all three lines with the untouched original.
        If the tool reports success but the content is missing, unreadable or older, keep that failure
        visible. Do not overwrite originals, remove existing backups or upload personal documents merely
        to make the test realistic.
      checks:
      - A backup or copy of the harmless file is actually made
      - Restoration uses a new destination with originals preserved
      - The restored content is opened and compared line by line
      - A failed or incomplete restore is not counted as recovery
    - title: Turn the result into a small maintenance routine
      instructions: Record the successful recovery steps or the exact non-sensitive failure message, plus
        who or what official help route can resolve it. Choose a sustainable review point for updates,
        backup checks and account access, and one important category of real data that later needs protection.
        Do not move that data until destination privacy, retention and recovery are understood. A tested
        sample is not proof that every file is backed up.
      checks:
      - The recovery procedure or unresolved failure is recorded
      - A maintenance review covers updates backups and access
      - A real data category is identified without exposing its contents
      - The sample test’s coverage limit remains explicit
    adaptation: Use a plain-text, audio or accessible document and a trusted helper who does not receive
      passwords. On managed equipment, follow organizational policy and use a training area. Without a
      second destination, label the exercise a file-copy rehearsal and leave disaster recovery untested.
    review: Could you recover the sample without the original location, and which shared dependency would
      still defeat the plan?
    examples:
      supportive: The three-line file was restored and opened from a separate destination, while the shared
        cloud-login dependency remained documented.
      mixed: The backup job completed, but the restored file was an older version and the procedure needed
        correction.
      contradictory: Real originals were deleted or confidential files uploaded to an unverified service
        to test recovery.
      inconclusive: A backup-success icon was observed without opening and comparing a restored file.
  '14.03':
    title: Align one account’s data sharing with a stated privacy priority
    goal: Trace what an account collects, links, shares and retains, then make one informed privacy choice
      rather than assume a toggle guarantees anonymity or deletion.
    scope_note: This is a bounded account audit, not a legal determination of data rights or a guarantee
      that previously shared information disappears. Applicable rights and procedures vary by location
      and service.
    burden: Twenty minutes to inspect one account and ten minutes to make and verify one chosen change.
    setup: 'Choose an ordinary account you control, not a workplace system or another person’s profile.
      Default priority: a hobby profile should not publicly reveal a precise location or link automatically
      to unrelated contacts. Use four headings—data supplied, data observed, identity links and retention
      or sharing—and the service’s current official privacy information.'
    actions:
    - title: Trace the data from collection to visible audience
      instructions: Inspect the profile and official privacy settings for the chosen priority. Identify
        one supplied item, one activity or device signal the policy says may be collected, an identity-linking
        feature and a retention or deletion statement. Separate public visibility from collection by the
        provider. Mark unclear policy language as unknown; do not assume a private profile means no tracking
        or that consent is all-or-nothing.
      checks:
      - Supplied observed and linked data are distinguished
      - The visible audience is separate from provider collection
      - Retention or deletion information is checked in current official material
      - Unknowns are retained rather than replaced with privacy guarantees
    - title: Choose one proportionate change with its tradeoff
      instructions: Decide whether to remove a precise profile location, restrict an audience, disable
        optional contact discovery or stop using a feature. Check the effect on recovery, accessibility
        and legitimate shared use before changing it. Save only a private note of the setting name and
        reason, not screenshots containing contacts. If a deletion or access request is appropriate, use
        the service’s verified process and understand that processing may take time.
      checks:
      - The change addresses the stated privacy priority
      - Recovery accessibility and shared-use effects are considered
      - Only authorized account settings or official request routes are used
      - The privacy benefit and lost convenience are both stated
    - title: Verify the visible result and record what remains outside control
      instructions: Check the profile through the service’s preview or another authorized view without
        impersonation. Confirm the setting persisted, and note whether linked apps or old posts need separate
        review. Record that copies, recipients and provider retention may remain outside the tested change.
        Set a review trigger such as a policy update or new linked service; do not claim the account is
        anonymous or fully erased.
      checks:
      - The selected change is checked after saving
      - Linked services and older content are considered separately
      - Residual collection retention and copied-content limits are explicit
      - A concrete future review trigger is recorded
    adaptation: Use one setting at a time, an accessible privacy dashboard or a trusted helper without
      sharing credentials. In stalking or abuse concerns, changing settings can have safety implications;
      use a safe device and appropriate specialist support rather than a public confrontation or surprise
      account change.
    review: Which data flow changed, and which privacy concern remains unresolved despite the visible
      setting?
    examples:
      supportive: The precise location was removed and contact discovery disabled, while provider activity
        collection remained an explicit limit.
      mixed: The profile audience changed, but an old public post still exposed the location and required
        separate review.
      contradictory: A private-profile toggle was treated as proof that tracking stopped or all copies
        had been deleted.
      inconclusive: A privacy policy was skimmed without connecting any data flow or setting to an actual
        priority.
  '14.04':
    title: Strengthen one account without creating a new lockout risk
    goal: Combine strong authentication with usable recovery, device protection and data resilience so
      account security is not reduced to a password change alone.
    scope_note: This is a bounded personal-account hardening exercise, not penetration testing or a claim
      that an account cannot be compromised. Follow current vendor instructions and organizational policy.
    burden: Twenty to thirty minutes for one authorized account and a short recovery-plan review.
    setup: Choose a non-emergency account you control and keep a working signed-in session available.
      Use the provider’s official security page, an existing trusted password manager if available and
      a private place for recovery material. Do not paste passwords, authentication codes or recovery
      keys into the practice record. Do not remove a working recovery method before its replacement is
      verified.
    actions:
    - title: Map authentication recovery and device prerequisites
      instructions: Check whether the account uses a unique strong password or an appropriate supported
        passkey, what multifactor methods exist, and how recovery works if the usual phone is unavailable.
        Identify the device lock, update status and any encryption or backup prerequisite. Verify that
        recovery contact information is yours and current through the official account page. Record only
        status, never secret values.
      checks:
      - Authentication and recovery methods are separately identified
      - The account and recovery contacts are authorized and current
      - Device lock updates and relevant backup or encryption prerequisites are checked
      - No secret values enter the practice record
    - title: Make one supported improvement and verify access safely
      instructions: Follow the provider’s current instructions to enable a suitable additional authentication
        method, replace a reused password or correct an obsolete recovery contact. Store any recovery
        codes through an appropriate private method before testing. Confirm the new method in a separate
        authorized session while retaining the known working session. Do not trigger account recovery,
        disable every fallback or factory-reset a device as a test.
      checks:
      - One supported security improvement is completed
      - Recovery material is stored privately before access testing
      - The new method is verified while known working access remains available
      - No destructive lockout or device-reset experiment is performed
    - title: Rehearse the loss scenario and close the remaining gaps
      instructions: Without actually losing access, explain how you would sign in or contact official
        support if the normal device were unavailable. Check whether the recovery instructions themselves
        depend on the missing account. Review active sessions or linked apps through official controls
        and flag unexplained entries for the provider’s incident process. Record one unresolved gap and
        a follow-up date rather than claiming full security.
      checks:
      - The lost-device scenario has a plausible verified route
      - Circular dependencies in the recovery plan are identified
      - Unexplained sessions or apps use an official incident route
      - Unresolved gaps remain visible with a next review
    adaptation: Use hardware, passkey, authenticator or other methods supported by the service and suitable
      for access needs; not every method fits every person. A trusted helper may explain controls without
      receiving secrets. Suspected abuse or managed-account restrictions require appropriate specialist
      or organizational guidance.
    review: Did the improvement reduce a real compromise path while leaving a recovery route you can actually
      use?
    examples:
      supportive: A supported second factor was enabled and tested, and recovery material was available
        without relying on the same phone.
      mixed: Authentication improved, but recovery instructions were stored only inside the protected
        account and needed a separate safe location.
      contradictory: All recovery methods were removed or codes shared with a helper to make the account
        appear more secure.
      inconclusive: A password was changed without checking reuse, recovery, device access or whether
        the new method worked.
  '14.05':
    title: Verify a suspicious request without using the channel that delivered it
    goal: Recognize common social-engineering pressures and independently verify identity, purpose and
      payment or data requests before responding.
    scope_note: This is defensive scam literacy, not an exercise in deceiving others or engaging criminals.
      Current financial loss, threats or account compromise requires prompt official help rather than
      prolonged investigation.
    burden: Fifteen minutes on three supplied messages and one five-minute verification-route rehearsal.
    setup: 'Use these fictional messages: a bank text says transfer savings now to protect them; an online
      romantic contact asks for an urgent travel payment; a supposed support agent asks for a one-time
      code to stop account closure. No live links or phone numbers are supplied. Use a known official
      app, bookmarked site or independently verified contact route, not the message’s contact details.'
    actions:
    - title: Identify the request and the pressure mechanism
      instructions: For each message, state what the sender wants, what authority or relationship is claimed,
        what urgency or secrecy is imposed, and what information is independently known. Include investment
        promises, extortion and malicious attachments as related patterns without opening anything. A
        familiar logo, caller ID, personal detail or convincing tone does not settle authenticity; legitimate-looking
        details may coexist with a fraudulent request.
      checks:
      - The requested money data code or action is explicit
      - Claimed identity and pressure or secrecy are separated
      - Known facts are distinguished from persuasive details
      - Links attachments and codes are not used to investigate the request
    - title: Rehearse an independent verification path
      instructions: 'For the bank case, locate the institution’s official contact route through an existing
        trusted app or known statement, not a search advertisement or the suspicious message. State the
        neutral question: Did you send this request, and what action is actually required? For the romance
        or support case, decline immediate payment or code sharing and consult a trusted independent source.
        Rehearse without calling emergency lines or submitting fake reports.'
      checks:
      - The verification route is independent of the suspicious channel
      - The question checks the request rather than repeats the sender’s story as fact
      - Payment and sensitive disclosure pause while uncertainty remains
      - No fake incident report or unnecessary emergency call is made
    - title: Choose the report and recovery route for the actual situation
      instructions: Mark each fictional message verified legitimate, suspected scam or unresolved based
        only on available evidence; the supplied cases remain suspicious until independently checked.
        Identify the service’s reporting control and the relevant local consumer or cybercrime route.
        If a real payment, credential or code was already shared, contact the affected provider promptly
        through a trusted channel and follow its recovery process. Do not pay a recovery scammer or confront
        the sender.
      checks:
      - The disposition reflects evidence rather than confidence alone
      - A legitimate report route is identified for the service and location
      - Actual exposure triggers prompt provider-led recovery
      - No confrontation additional payment or vigilante investigation is introduced
    adaptation: Use printed sample messages, an interpreter or a trusted support person who does not ask
      for codes. People of any experience level can be targeted. Extortion involving intimate material
      or safety threats may require specialist support; do not redistribute the material as evidence to
      friends.
    review: Which independent fact would change your decision, and what would you do first if money or
      credentials had already been exposed?
    examples:
      supportive: The person paused the transfer request and verified it through the known bank channel
        rather than the text link.
      mixed: The pressure pattern was recognized, but the supposed verification number still came from
        the suspicious message.
      contradictory: A one-time code or payment was sent to prove cooperation, or an alleged recovery
        expert was paid without verification.
      inconclusive: The messages were labeled scams by intuition without an independent route or a response
        plan for actual exposure.
  '14.06':
    title: Compare a feed’s invitations with the purpose you brought to it
    goal: Understand how ranking, personalization and feedback can shape attention, then redesign one
      media route around chosen purposes rather than assume the feed is neutral or all-powerful.
    scope_note: A small feed sample cannot reveal a platform’s proprietary model, prove a filter bubble
      or establish intentional manipulation. Platform explanations describe their systems and are not
      independent effectiveness audits.
    burden: Fifteen minutes of observation and two brief purposeful sessions.
    setup: 'Default purpose: find one practical gardening explanation. Observe up to ten ordinary recommendations
      without seeking harmful content. Classify each as directly useful, adjacent, unrelated or emotionally
      provocative, and note the invitation to continue. Read the platform’s current official explanation
      of recommendation signals and user controls; do not assume every system optimizes the same metric.'
    actions:
    - title: Separate observed feed behavior from claims about the algorithm
      instructions: Record the ten-item sample and your intended purpose, then note which items invite
        novelty, repetition or emotional reaction. Compare observations with the official explanation
        of signals such as prior activity, feedback or satisfaction. Distinguish what you saw from a hypothesis
        about engagement optimization or a filter bubble. Intermittently appealing items can encourage
        continued checking, but the sample alone does not establish a psychological mechanism.
      checks:
      - A bounded sample is classified against a stated purpose
      - Continuation and emotional invitations are observed without harmful exposure
      - Officially described signals are separate from inferred motives
      - Filter-bubble and reward-mechanism claims remain hypotheses
    - title: Build a route that reaches the purpose more directly
      instructions: 'Choose one supported change: use a saved source, a direct search, subscriptions or
        an official recommendation-control setting. Include one deliberate source outside the usual cluster
        when it is credible and relevant, rather than equating novelty with truth. Set an endpoint such
        as one usable answer and a source note. Preserve legitimate entertainment as an explicit separate
        choice rather than pretend all browsing must be educational.'
      checks:
      - One route or control is changed for a stated purpose
      - A credible relevant alternative reduces dependence on a single cluster
      - An endpoint is defined before the session
      - Entertainment remains a legitimate chosen activity
    - title: Compare two sessions and keep only useful control
      instructions: Use the direct route once and the usual route once on comparable harmless questions.
        Note whether the answer was found, how often attention shifted and whether the stopping point
        worked. Record convenience and discovery benefits as well as distraction. Keep or revise the route
        without claiming the platform has been retrained from two sessions; changes in the feed may have
        other causes.
      checks:
      - Two routes are tried on comparable harmless purposes
      - Answer quality attention shifts and stopping are observed
      - Discovery and convenience benefits are retained in the comparison
      - No causal claim about retraining the algorithm is made
    adaptation: Use a fictional ten-card feed or a browser without a signed-in profile when personal observation
      is unsuitable. Avoid recording other people’s handles or private posts. A paper simulation practices
      classification and choice, not the behavior of an actual recommender.
    review: Which part of the feed served your purpose, and which route gave you a more deliberate choice
      about continuing?
    examples:
      supportive: Direct search found a useful explanation and a second credible source, while the usual
        feed’s unrelated suggestions made stopping harder.
      mixed: The direct route reduced drift but also missed useful discovery, so the person retained a
        separate bounded exploration session.
      contradictory: Two recommendations were treated as proof of a platform’s hidden motive or used to
        justify consuming upsetting material for analysis.
      inconclusive: The algorithm was blamed in general terms without a sample, stated purpose or tested
        alternative route.
  '14.07':
    title: Use an AI draft only after checking what it added or changed
    goal: Treat generative output as a draft with uncertainty, verify its claims against a source, protect
      private data and retain human responsibility for use.
    scope_note: This tests one low-stakes drafting workflow, not a model’s general reliability, fairness
      or suitability for medical, legal, financial or safety decisions. No paid AI service or personal
      data is required.
    burden: Twenty minutes using the supplied source and sample draft, or one authorized low-stakes AI
      interaction.
    setup: 'Source card: The fictional Cedar Club meets Tuesday at 6 p.m. in Room B. Attendance is free.
      New members should bring a notebook. Sample unverified draft: Join Cedar Club on Thursday at 6 p.m.
      in Room B; a ten-dollar fee includes a notebook. Use this sample without claiming a real model generated
      it, or ask an authorized AI tool to rewrite the source without adding facts.'
    actions:
    - title: Set the task boundary and protect the input
      instructions: 'State the intended audience and permitted transformation: clearer wording of the
        three source facts, no added dates, fees or promises. Explain that a generative model produces
        plausible content and may invent details; fluency is not verification. Use only the fictional
        source, check the tool’s current data-use policy if using one, and exclude private or protected
        material. Identify a human who remains responsible for publication.'
      checks:
      - The permitted transformation and factual boundary are explicit
      - Plausible generation is distinguished from verified retrieval
      - Only authorized non-sensitive input is used
      - Human responsibility and any required disclosure are identified
    - title: Audit every factual claim and one framing choice
      instructions: Compare the draft sentence by sentence with the source card. Mark supported, contradicted
        or unsupported claims; in the sample, Thursday contradicts Tuesday and the fee and included notebook
        are unsupported or contradictory. Check whether the wording excludes an audience through unnecessary
        assumptions, such as every attendee can write by hand. Do not accept invented citations or the
        model’s own assurance as independent evidence.
      checks:
      - Every factual claim is checked against the source
      - Contradicted and unsupported additions are specifically identified
      - One audience or bias-related framing assumption is examined
      - Model confidence or invented citations are not used as verification
    - title: Produce a corrected draft and decide whether to use it
      instructions: Rewrite the notice with the verified day, time, room, free attendance and request
        to bring a notebook, allowing an accessible note-taking alternative without claiming the club
        supplies one. Label AI assistance where the setting requires it and preserve a human review note.
        Compare the time saved with correction effort; choose manual drafting when verification costs
        exceed the benefit. Do not automate publication or a consequential decision from this test.
      checks:
      - The final draft preserves all source facts and removes inventions
      - An accessibility suggestion is not turned into an unverified promise
      - Disclosure and human review match the setting’s requirements
      - Use or rejection considers verification effort and consequence
    adaptation: Use the supplied fictional draft entirely offline, an accessible editor or a trusted reader.
      This demonstrates output auditing even without an AI account. Do not upload classmates’, clients’
      or employers’ information or test bias by generating degrading content.
    review: Which error would have reached the audience without your source check, and was AI assistance
      actually worth the verification effort?
    examples:
      supportive: The wrong day and invented fee were removed before sharing, and the writer retained
        responsibility for the final notice.
      mixed: The factual errors were corrected, but an accessibility accommodation was accidentally promised
        without confirmation.
      contradictory: A fluent draft or fabricated citation was published without verification or private
        data was uploaded without authority.
      inconclusive: AI risks were described abstractly without checking a draft or making a real use-versus-reject
        decision.
  '14.08':
    title: Check an alarming media clip without treating appearance as proof
    goal: Distinguish media provenance, alteration and factual truth, and corroborate a consequential
      claim before acting on a convincing image, audio clip, video or document.
    scope_note: This is verification practice, not forensic authentication or a reliable deepfake-detection
      test. Missing provenance does not prove fabrication, and valid credentials do not prove that a depicted
      event or claim is true.
    burden: Twenty minutes on a supplied scenario and one verification-route rehearsal.
    setup: 'Fictional scenario: a short voice clip apparently from a community organizer says tomorrow’s
      venue has changed and attendees must pay a new fee. You have an existing official event page and
      a known organizer contact route. No real person’s voice needs to be cloned, no suspicious file opened
      and no biometric identification performed.'
    actions:
    - title: Separate the asset’s history from the claim it makes
      instructions: 'Write four questions: who supplied the clip, where the original full version is,
        what edits or credentials are available, and whether the venue or fee claim is independently supported.
        Explain that convincing sound, a familiar face or a document logo can be altered, while obvious
        glitches are not required. If Content Credentials exist, inspect what they attest to rather than
        treating their presence as a truth stamp.'
      checks:
      - Supplier original context provenance and factual claim are separated
      - Realistic appearance is not equated with authenticity
      - Missing or valid provenance is interpreted within its limits
      - No identity inference from voice or appearance substitutes for verification
    - title: Corroborate through a known independent source
      instructions: Open the previously known event page directly and contact the organizer through the
        established route, not a number or payment link embedded in the clip. Ask about the venue and
        fee separately. Compare dates, time zone and the full announcement if available. Do not upload
        private media to an unknown detector or forward the clip widely while asking whether it is real.
      checks:
      - The route is independent of the media’s embedded instructions
      - Venue fee date and context are checked separately
      - Private media is not sent to an unverified detection service
      - The uncertain clip is not amplified during checking
    - title: Choose a proportionate action and communicate the uncertainty
      instructions: Mark each claim corroborated, contradicted or unresolved. If unresolved, do not pay
        or change a consequential plan solely on the clip; seek a verified update. Draft a neutral correction
        for someone already affected, such as The fee claim is not confirmed by the official channel,
        rather than accusing a named person of fabrication. Preserve only the minimum lawful evidence
        needed for an official report.
      checks:
      - Each consequential claim has an evidence-based disposition
      - Payment or other consequential action waits for adequate verification
      - Any correction states evidence and uncertainty without unsupported accusations
      - Evidence retention is minimal lawful and privacy-conscious
    adaptation: Use text transcripts, captions or a fully written scenario when audio or visual media
      is inaccessible. A consented practice clip can be analyzed without identifying a real person. Threatening
      or intimate material requires appropriate specialist reporting and must not be redistributed.
    review: What established the decision-worthy fact, and what remained unknown about how the media was
      produced?
    examples:
      supportive: The known organizer confirmed the original venue and no fee, so the participant corrected
        the claim without pretending to identify the clip’s creator.
      mixed: The date was verified, but provenance remained incomplete and the media itself stayed unclassified.
      contradictory: A detector score, familiar voice or valid credential was treated as conclusive proof
        of truth or fraud.
      inconclusive: The clip was forwarded to a group with an alarming caption before any independent
        check.
  '14.09':
    title: Trace a viral claim back to the record that could settle it
    goal: Use lateral reading, source tracing, dates, image context and independent comparison to verify
      a claim or suspend judgment when evidence is insufficient.
    scope_note: One verification chain is not a general credibility score for a person or outlet. Repeated
      copies of the same claim are not independent corroboration.
    burden: Twenty to thirty minutes on the supplied record set or a harmless current claim.
    setup: 'Fictional record set: Post A says the town library is closing permanently. Post B repeats
      A. An official notice dated May 3 says the west entrance is closed May 6–8 for repairs and the east
      entrance remains open. A photo shows a CLOSED sign but no date or entrance. Treat these as supplied
      fictional documents; do not claim a real library event occurred.'
    actions:
    - title: Extract the exact claim and trace who is copying whom
      instructions: 'Write the testable claim with location, date and scope: the entire library will close
        permanently. Open the source behind a post rather than staying inside its presentation, and draw
        the A-to-B copying link. Distinguish an original witness, an official record and a commentary
        copy. For a real claim, use only lawful public material and note access limits rather than infer
        unseen content.'
      checks:
      - The claim includes location time and scope
      - Original sources and commentary copies are distinguished
      - The copying relationship is explicitly mapped
      - Unseen or inaccessible source content is not guessed
    - title: Compare the primary record and the image’s missing context
      instructions: Read the full supplied notice and compare each part of the viral claim. It concerns
        one entrance for three days, not the entire library permanently. The photograph lacks enough context
        to settle the broader claim. For a public real image, a reverse-image search may reveal earlier
        uses, but absence of a match proves little; never upload private images without permission. Seek
        a genuinely independent record when the first remains ambiguous.
      checks:
      - The full primary record is compared with each claim component
      - Publication date event date and scope are kept distinct
      - Image context and reverse-search limits are recognized
      - Independent corroboration is not confused with repeated copying
    - title: Write a calibrated verdict and a useful correction
      instructions: 'Produce a short conclusion: The supplied notice contradicts permanent whole-library
        closure; it describes temporary west-entrance repairs. State what remains unknown about the photo.
        Include the primary record and date when sharing a correction, and avoid insulting the original
        poster. If evidence were missing or conflicting, use unresolved and name the next record needed
        rather than force a true-or-false verdict.'
      checks:
      - The verdict matches the primary evidence and exact claim
      - Remaining image or timing uncertainty is retained
      - The correction points to the relevant record without personal attack
      - Insufficient evidence permits a clear unresolved outcome
    adaptation: Use accessible text versions or the fictional set entirely offline. A trusted reader can
      help trace links without receiving private account access. Do not investigate private people, bypass
      paywalls or access controls, or treat a lack of search results as proof of absence.
    review: Which source actually carried the conclusion, and which apparently supporting item was only
      a copy or an image without context?
    examples:
      supportive: The permanent-closure claim was narrowed to a temporary entrance closure using the dated
        notice, while the photograph remained context-limited.
      mixed: The copied posts were identified, but a newer conflicting notice required suspending the
        verdict pending clarification.
      contradictory: Two reposts and an undated image were counted as three independent confirmations.
      inconclusive: A verdict was issued from the headline without reading the underlying record or checking
        dates.
  '14.10':
    title: De-escalate an online disagreement without exposing someone else
    goal: Communicate in an online community with consent, context, privacy and proportionate moderation,
      avoiding pile-ons and treating permanence as a reason for care rather than silence.
    scope_note: Use an ordinary low-stakes disagreement, not active abuse, threats or a situation requiring
      specialist moderation or emergency intervention. No public conflict needs to be created for practice.
    burden: Fifteen minutes to revise a draft and one safe interaction or offline rehearsal.
    setup: 'Default draft in a hobby forum: You always give terrible advice; here is a screenshot of our
      private chat proving it. Replace it using three supplied components: the specific public claim,
      the evidence or question, and a proportionate request. Read the community’s current rules before
      posting; use a fictional draft when no suitable live disagreement exists.'
    actions:
    - title: Identify the audience and the information you are not entitled to share
      instructions: Separate the public technical disagreement from private conversation, identity details
        and assumptions about motive. Check whether the person consented to any screenshot or quotation
        being shared and whether context would change its meaning. Assume a post may be copied beyond
        the original audience. Identify the relevant community rule and an appropriate moderator route
        without treating disagreement itself as misconduct.
      checks:
      - Public claims are separated from private information and motive assumptions
      - Consent and context are checked before sharing another person’s words
      - Potential persistence and audience expansion are considered
      - The community rule and moderation route are identified proportionately
    - title: Write and use a narrow respectful response
      instructions: Replace the default with a specific correction or question, such as The manual lists
        a different connector rating; which revision are you using? Omit the private screenshot and personal
        attack. Ask once, allow processing time and do not recruit others to overwhelm the person. Post
        only if appropriate and authorized; otherwise rehearse the revised exchange privately and label
        it as such.
      checks:
      - The response addresses one specific claim or question
      - Private material and personal attacks are removed
      - The interaction avoids recruitment repeated pressure and pile-ons
      - Live posting and private rehearsal are distinguished
    - title: Choose whether to continue disengage or use moderation
      instructions: Review the actual reply or a supplied hypothetical refusal. Correct your own error
        when evidence warrants it, acknowledge a useful answer and stop if the exchange becomes repetitive
        or unsafe. Use mute, block or a factual moderator report where appropriate rather than retaliatory
        posting or deceptive accounts. If harm was already caused, remove or correct your contribution
        where possible and acknowledge that copies may remain.
      checks:
      - New evidence can correct the participant’s own claim
      - Disengagement is available without retaliatory posting
      - Moderation uses factual proportionate reporting rather than mass pressure
      - Any prior harm receives correction without claiming complete erasure
    adaptation: Use asynchronous text, accessible formatting, translation with care or a trusted moderator.
      Do not require disclosure of identity or personal vulnerability to participate. Threats, stalking
      or intimate-image abuse need the relevant platform and specialist safety routes rather than ordinary
      debate techniques.
    review: Did the response make the issue easier to resolve while reducing unnecessary exposure and
      pressure on the people involved?
    examples:
      supportive: The connector question was clarified with the manual revision, and the private chat
        was never posted.
      mixed: The factual correction was useful, but repeated follow-up messages became pressure and needed
        to stop.
      contradictory: Private screenshots were posted or alternate accounts used to recruit a pile-on.
      inconclusive: A polite tone was added while the message still exposed private information and demanded
        public agreement.
  '14.11':
    title: Prepare a small digital work with a traceable permission and credit record
    goal: Distinguish creating, owning, licensing and attributing digital material, then assemble a small
      work whose reuse permissions and creator credit can be inspected.
    scope_note: This is rights literacy and a conservative permission exercise, not legal advice or a
      ruling on fair use, employment ownership, AI copyright or every jurisdiction’s law. Attribution
      alone does not supply permission.
    burden: Twenty-five minutes to prepare a private one-page draft and its rights record.
    setup: 'Default work: a one-page hobby-event notice using your own text and either your own simple
      drawing or a clearly licensed image from its original source. Keep a record of creator, source,
      exact license version, permitted use, changes and required credit. Publishing is optional; do not
      use private faces, logos, copyrighted music or unclear scraped assets merely for practice.'
    actions:
    - title: Establish what you own and what you are only allowed to use
      instructions: 'List every ingredient in the notice: text, image, font or template if relevant. Mark
        created by you, permission verified or unresolved. Check whether employment, collaboration, identifiable
        people or third-party rights affect your authority. For a licensed asset, read the exact license
        and distinguish attribution, commercial-use, adaptation and share-alike conditions. An image appearing
        in search results is not a permission grant.'
      checks:
      - Every ingredient has an ownership or permission disposition
      - Third-party employment collaboration and identity issues are considered
      - The exact license version and relevant conditions are checked
      - Search availability and attribution are not mistaken for permission
    - title: Assemble the draft and make its credit inspectable
      instructions: Use only ingredients with a suitable permission basis, replacing unresolved material
        with your own simple alternative. Add a credit that identifies the creator, source, license and
        any changes in a reasonable location. Keep required notices and do not imply endorsement. For
        software rather than an image, use the project’s actual license and contribution rules; do not
        assume a Creative Commons image rule covers code.
      checks:
      - Only suitable authorized ingredients enter the draft
      - Credit includes creator source license and changes as required
      - Required notices remain and endorsement is not implied
      - Software and non-software licensing are not conflated
    - title: Review distribution and compensation before sharing
      instructions: Check the intended audience, commercial context, adaptation terms and any creator
        request or agreed payment. Confirm that the final format preserves credit and does not add restrictions
        incompatible with the license. Keep the permission record privately. Publish only through an authorized
        channel after this review, or retain the draft as a completed rights-preparation exercise; do
        not claim public distribution occurred when it did not.
      checks:
      - The intended distribution fits the verified terms
      - Creator compensation or permission agreements are respected
      - The final format retains required credit and notices
      - Private preparation and actual publication are distinguished
    adaptation: Use entirely self-created text and shapes when rights are unclear, and accessible alt
      text where appropriate. Ask a qualified legal or institutional adviser for consequential uncertainty.
      No purchase or public upload is required, and collaborators’ work is not yours to license without
      authority.
    review: Could a later reader trace each reused ingredient to a permission basis and credit without
      relying on your memory?
    examples:
      supportive: The notice used an appropriately licensed image with source, license and change credit,
        and the private record preserved the terms.
      mixed: The draft was ready, but a noncommercial restriction conflicted with the planned use and
        the image had to be replaced.
      contradictory: A creator’s name was added while permission was absent or a license condition was
        ignored.
      inconclusive: A list of copyright concepts was produced without checking any actual ingredient or
        credit line.
  '14.12':
    title: Keep one important activity usable when a digital dependency disappears
    goal: Identify a critical cloud, AI, algorithm or connected-device dependency and test a manual or
      offline fallback without disrupting the real service.
    scope_note: This is a small continuity rehearsal, not a full outage or cyberattack exercise. Do not
      disable safety systems, medical devices, workplace services or another person’s access.
    burden: Twenty minutes of preparation and a ten-minute harmless fallback test.
    setup: 'Default activity: access a meeting’s time, location and contact route when the usual calendar
      app is unavailable. Use a fictional event or a private minimal copy with no sensitive attendee information.
      Prepare an offline text or paper version and keep the live calendar untouched. The test assumes
      the app is unavailable; it does not actually revoke credentials or disconnect essential services.'
    actions:
    - title: Map the dependency and the minimum service that must survive
      instructions: 'Trace the activity through device, power, network, cloud account, authentication
        and any AI or automation layer. Identify one single point of failure and define a minimum useful
        fallback: knowing where and when to go and how to contact the organizer. State how fresh the information
        must be and who is allowed to see it. More backup data is not automatically a better privacy decision.'
      checks:
      - Device power network account and automation dependencies are traced
      - A specific single point of failure is identified
      - The minimum useful service and freshness requirement are defined
      - Fallback access is limited to an appropriate audience
    - title: Create the fallback and test it without the normal route
      instructions: Export or copy the minimum authorized information to an accessible offline format.
        Put the device or app aside rather than disabling it, then use only the fallback to answer the
        event’s time, location and contact questions. For an AI-dependent writing task, draft a short
        answer manually from the source instead of calling the model. Record missing information and do
        not assume an export is usable until opened.
      checks:
      - A minimal authorized fallback is actually created
      - The test does not use the normal app or model route
      - The fallback is opened and used to complete the defined task
      - Missing information remains visible without disrupting the live service
    - title: Define refresh recovery and safe retirement
      instructions: Choose a review or refresh trigger, such as a changed event or monthly check, and
        record how to return to the normal service without duplicating actions. Decide when the offline
        copy should be destroyed or updated and how it remains private. Identify any unresolved dependency,
        such as the contact number still being available only online. A single successful rehearsal does
        not prove continuity for every outage.
      checks:
      - A concrete refresh trigger keeps the fallback current
      - Return to normal service avoids duplicate actions
      - Retention and privacy of the fallback are addressed
      - Residual dependencies and limited test coverage are explicit
    adaptation: Use paper, large print, an accessible local file or a chosen helper. For medical, financial
      or safety-critical dependencies, follow the provider’s approved continuity plan and test only a
      harmless representation. No real outage, account deletion or device reset is required.
    review: Could the important activity still proceed through the fallback, and what dependency did the
      rehearsal reveal rather than remove?
    examples:
      supportive: The offline event card supplied the time, location and verified contact route, and a
        change-triggered refresh was scheduled.
      mixed: The event details were available, but the map required a network connection and the fallback
        needed a written route.
      contradictory: A real service or safety device was disabled to make the test more realistic.
      inconclusive: An export was saved but never opened or used without the original service.
  '14.13':
    title: Evaluate a platform rule through safety, rights and a workable appeal
    goal: Analyze a digital platform policy across user safety, expression, privacy, accessibility, competition
      and due process, then propose an implementable improvement with acknowledged tradeoffs.
    scope_note: This is civic policy reasoning, not a legal judgment or authority to moderate a real community.
      No particular political position, platform or identity disclosure is required.
    burden: Thirty minutes with the supplied fictional rule and ten minutes to test edge cases.
    setup: 'Fictional platform rule: Every removed post causes an automatic permanent account ban, with
      no explanation or appeal; all users must publish legal names. Use six lenses: safety, expression,
      privacy and surveillance, accessibility, platform incentives and competition, and notice or appeal.
      The task is to redesign the rule, not to prove that every restriction is censorship or every appeal
      is harmless.'
    actions:
    - title: Identify whose interests and risks the rule changes
      instructions: Describe the rule’s intended safety benefit and identify at least three differently
        situated users, such as a harassment target, a mistaken poster and a person who needs pseudonymity
        for safety. Examine each lens, including moderation workload and business incentives. Separate
        a value judgment from a factual claim that would need data or current law. Do not assume a legal-name
        requirement reliably establishes trustworthy behavior.
      checks:
      - The intended safety benefit is stated fairly
      - At least three differently situated users are considered
      - All six policy lenses receive a concrete consequence or uncertainty
      - Legal factual and normative claims are distinguished
    - title: Draft a proportionate rule with notice and review
      instructions: Replace the blanket rule with a specific misconduct definition, proportionate responses,
        an urgent safety exception, a plain-language notice and an accessible appeal route. State what
        evidence moderators retain, who can see it and when it is deleted. Consider pseudonymous participation
        with appropriate anti-abuse controls rather than public identity by default. Identify the staff
        or technical capacity needed so the appeal is not merely decorative.
      checks:
      - The proposed rule defines conduct and proportionate responses
      - Urgent safety and ordinary review paths are distinct
      - Notice appeal access and evidence privacy are specified
      - Operational capacity and pseudonymity tradeoffs are acknowledged
    - title: Test three edge cases and revise one weak point
      instructions: Apply the draft to a mistaken quotation, repeated targeted harassment and an urgent
        credible threat. Explain what action occurs, what the user is told and when review happens in
        each case. Look for inconsistent enforcement, inaccessible appeals or incentives to over-remove
        content. Revise one weakness and state the unresolved tradeoff or data needed; a well-written
        policy is not proof of fair implementation.
      checks:
      - Three distinct edge cases receive explicit dispositions
      - Notice action and review timing are clear in each case
      - Implementation incentives and access failures are considered
      - One revision and an unresolved evidence need are recorded
    adaptation: Use a small club forum rather than a commercial platform, and discuss cases through text
      or voice. Avoid reproducing slurs, threats or private abuse reports. For actual policy adoption,
      consult affected users and applicable legal or institutional guidance before implementation.
    review: Which protection improved, what cost did it impose, and how would someone challenge a mistaken
      decision in practice?
    examples:
      supportive: The revised rule preserved urgent threat removal while adding proportionate sanctions,
        private evidence handling and an accessible appeal.
      mixed: The policy balanced several values, but the proposed review workload exceeded available moderators
        and needed a simpler process.
      contradictory: Safety was used to justify unlimited surveillance or expression used to dismiss targeted
        harassment entirely.
      inconclusive: A policy preference was stated without affected users, operational details, edge cases
        or an appeal route.
