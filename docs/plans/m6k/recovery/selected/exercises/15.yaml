schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '15'
exercises:
  '15.01':
    title: Prepare an emergency handoff and complete a qualified first-aid skills check
    goal: Recognize the boundary between summoning help, giving accurate emergency information and performing
      first aid that requires current instruction and observed practice.
    scope_note: This combines a harmless communication rehearsal with a qualified training step. Reading,
      booking a course or rehearsing a call does not establish CPR, AED, choking or bleeding-control competence.
    burden: Twenty minutes for the handoff card, ten minutes for two spoken rehearsals, and the time required
      by an appropriate recognized practical course or refresher.
    setup: Use paper, an unconnected phone or a clearly marked practice script, and your local emergency-service
      information. The fictional case is an adult who collapses at a community hall. No real person acts
      unconscious, no emergency number is dialed for practice, and no physical treatment is rehearsed
      on a person.
    actions:
    - title: Build a location-first emergency information card
      instructions: Verify the emergency number for your actual location through its official service.
        On a private card put the address or usable location description, entrance instructions, callback
        method and known access barriers. For the hall case, rehearse reporting where you are, what happened,
        whether the scene appears safe and what you actually observe about responsiveness and breathing.
        Do not invent a diagnosis or delay a real emergency call to finish the card.
      checks:
      - The local emergency route comes from an official source
      - Location entrance and callback information are usable
      - Observable condition is separated from an assumed diagnosis
      - No real emergency service is contacted for rehearsal
    - title: Rehearse communication and delegation without simulated treatment
      instructions: Read the collapse case aloud and speak a concise location-first report to an empty
        room or a willing practice partner. Rehearse asking a specific bystander to summon help or locate
        an AED while you follow actual dispatcher instructions in a real event. Repeat with the caller
        unable to use the main entrance. Identify the differences between safe scene assessment, consent
        where possible, staying within training and acting under emergency guidance. Do not improvise
        compressions, choking maneuvers, tourniquet use or rescue breaths.
      checks:
      - Two clearly labeled communication rehearsals occur
      - A named task is delegated rather than shouted at an unspecified crowd
      - The access complication changes the handoff
      - Physical intervention is reserved for current instruction and genuine emergencies
    - title: Obtain an observed skills assessment and record its limits
      instructions: Select a recognized local course or refresher appropriate to your role. Ask how it
        covers CPR and AED use, choking, severe bleeding, shock, burns, poisoning and emergency communication,
        and whether practical skills are assessed by a qualified instructor. Complete the relevant supervised
        skills work on approved training equipment, or record this action as pending until it happens.
        Keep only course, date, assessed topics, unresolved gaps and renewal guidance; a certificate or
        online module must not be represented as proof of every listed skill.
      checks:
      - Course scope and practical assessment are verified before relying on it
      - Actual supervised performance is distinguished from enrollment or online study
      - Assessed topics and unresolved skill gaps are recorded accurately
      - The next refresher follows the provider and role requirements
    adaptation: Use an accessible course, interpreter, communication card or emergency text service only
      where that service is verified locally. Physical limitations may change the safe role you can perform;
      accurate calling and delegation remain useful but do not substitute for an unperformed skill assessment.
      In an actual emergency, use local emergency services and dispatcher guidance immediately.
    review: Which parts of the response have you actually rehearsed or demonstrated, and which still require
      instruction rather than confidence?
    examples:
      supportive: The caller gave a clear location-first report and later completed an instructor-observed
        CPR/AED session while marking poisoning and burn care as separate learning gaps.
      mixed: The handoff rehearsal improved but the selected online course did not include hands-on assessment,
        so physical competence remained unverified.
      contradictory: A person practiced forceful treatment on a friend or delayed a real emergency call
        while trying to finish the worksheet.
      inconclusive: A course was bookmarked and a list of emergencies copied without either a communication
        rehearsal or an observed skills check.
  '15.02':
    title: Walk through one household disruption without creating an emergency
    goal: Make a household plan usable when people, power, transport or communication are unavailable,
      then test one safe part and correct a discovered gap.
    scope_note: This is a planning and access check, not a fire, smoke, electrical, medical or evacuation
      stunt. Local emergency instructions and building requirements govern real incidents.
    burden: Thirty minutes to prepare, a fifteen-minute announced tabletop walk-through and ten minutes
      to fix and retest one gap.
    setup: 'Use a household sketch, paper contacts and the local emergency-management guidance. Default
      scenario: a storm interrupts electricity and phone charging for an evening while one household member
      is away. Include pets, mobility or communication needs, medication or powered-equipment dependencies
      and the possibility that the usual helper is unavailable.'
    actions:
    - title: Assign a safe route for six disruption types
      instructions: For fire, power loss, evacuation, severe weather, urgent illness and unavailable services,
        state the official warning source, immediate safe action, who needs assistance and a meeting or
        contact route. Separate leaving the building from sheltering where local guidance calls for it.
        Identify existing water, food, lighting, documents and essential-care arrangements without prescribing
        a universal stock quantity. Give each gap an owner; do not store identifying documents or medical
        details in the application.
      checks:
      - All six disruption types have a distinct response disposition
      - Assistance and essential-care dependencies are included
      - Leaving and sheltering are not treated as interchangeable
      - Supply and document gaps have named owners outside the app
    - title: Run an announced tabletop with one unavailable dependency
      instructions: Tell everyone this is practice. Read the storm scenario and ask each willing participant
        to locate the plan and explain their first action. Make the ordinary phone-charging route unavailable
        on paper only. Check whether contacts and lighting can be found without searching a locked online
        account, and whether the absent person has an agreed check-in route. Walk an ordinary clear exit
        only if it is safe and accessible; do not turn off utilities, block exits, discharge equipment
        or trigger alarms.
      checks:
      - Participants know the exercise is not a real emergency
      - One dependency is removed only in the scenario
      - The plan and contact route are retrieved rather than merely described
      - No utility alarm exit or safety system is disturbed
    - title: Repair and retest the most consequential failure
      instructions: Choose the gap that would most interfere with safe action, such as an unreadable contact
        card, unreachable flashlight or an assistance role with no backup. Make a proportionate correction
        using existing resources where possible, then repeat the failed retrieval or explanation. Record
        what now works and what still requires the landlord, care provider or emergency-management office.
        Agree a review trigger such as a move, new care dependency or changed household membership.
      checks:
      - A consequential observed gap is selected
      - A real correction is installed or an unresolved external dependency is retained
      - The failed part is tested again after the correction
      - A concrete change trigger prompts the next review
    adaptation: A person living alone can use an agreed contact and verified building assistance plan;
      do not assume a neighbor has consented to help. Use accessible print, audio, symbols and duplicate
      paper copies. Required medical-device continuity and evacuation assistance need the relevant professional
      or building plan, not improvised workarounds.
    review: What failed when a normal convenience was unavailable, and what evidence shows that the correction
      can be used under the same constraint?
    examples:
      supportive: The household could not retrieve its contacts without a phone, installed a private paper
        copy and successfully repeated the tabletop with the phone unavailable.
      mixed: The exit and contacts were clear, but powered medical equipment still lacked a professionally
        agreed outage plan and remained an urgent unresolved dependency.
      contradictory: The drill disabled electricity, blocked an exit or assumed an unwilling person would
        carry someone down stairs.
      inconclusive: A supply checklist was saved online but nobody tried to locate or use the plan.
  '15.03':
    title: Notice an ordinary environmental change and choose a proportionate response
    goal: Orient to exits, movement, access and changing conditions without treating unfamiliar people
      or every anomaly as a threat.
    scope_note: This practices ordinary awareness in a familiar public place. It is not surveillance,
      profiling, threat prediction or a requirement to remain constantly vigilant.
    burden: Two five-minute observations during normal visits and a ten-minute comparison afterward.
    setup: Choose a familiar library, workplace common area or other place you already use safely. Before
      entering, plan to notice the normal entrance, another signed exit, staff or assistance point, accessibility
      route and one environmental condition such as crowding or a wet floor. Do not record identifiable
      people.
    actions:
    - title: Orient using functional landmarks rather than suspicious-person guesses
      instructions: 'During an ordinary visit, identify how you entered, how staff direct people to leave,
        where help can be requested and any accessible route you depend on. Note one ordinary condition
        affecting movement, such as a queue narrowing a passage. Separate observed facts from interpretations:
        a person looking around is not evidence of harmful intent. End the scan and return attention to
        your actual activity instead of repeatedly checking everyone.'
      checks:
      - Entry exit help and access landmarks are identified
      - One movement or environmental condition is directly observed
      - Appearance or identity is not used as a threat category
      - Attention returns to the intended ordinary activity
    - title: Compare a second visit for one meaningful change
      instructions: At the next normal visit, compare the same landmarks and conditions. The supplied
        change case is a temporary sign directing visitors away from a closed corridor. Confirm the alternative
        route through posted information or staff rather than entering the closed area. If nothing changes,
        record that honestly. Name what would warrant asking staff, leaving or using emergency help, and
        distinguish those thresholds from mere unfamiliarity or discomfort.
      checks:
      - The second observation uses the same functional reference points
      - A change or its absence is recorded without invention
      - Unclear directions are checked through an appropriate source
      - Response thresholds depend on conditions rather than stereotypes
    - title: Take one small action and check whether it solved the actual problem
      instructions: When a real minor access issue exists, use the posted alternative, ask staff for assistance
        or choose another ordinary location. For the closed-corridor case, verify that the alternate path
        actually reaches the destination and remains suitable for your access needs. Record the action
        and its result without photographing strangers or investigating motives. If the environment becomes
        genuinely unsafe, leave or obtain appropriate help rather than turning the event into a training
        opportunity.
      checks:
      - The action addresses the observed access or environmental condition
      - The route or assistance is checked for practical usability
      - No person is monitored or confronted to test a hypothesis
      - A real safety concern ends the exercise rather than escalating it
    adaptation: Use a companion, building accessibility information, audio directions or a quieter familiar
      setting. A person affected by hypervigilance may prefer a single planned orientation rather than
      repeated scans; stop when the exercise increases distress or interferes with ordinary functioning.
    review: Which observation changed what you did, and which initial interpretation turned out to be
      unnecessary or unsupported?
    examples:
      supportive: A visitor noticed a corridor closure, confirmed an accessible alternative with staff
        and then resumed the visit without monitoring other visitors.
      mixed: The route was found, but repeated scanning distracted from the visit and the next attempt
        was reduced to one orientation.
      contradictory: A person followed or photographed strangers based on appearance and called that situational
        awareness.
      inconclusive: Threat scenarios were imagined at home without observing a real environment or checking
        a functional route.
  '15.04':
    title: Rehearse leaving a tense interaction without trying to win it
    goal: Use clear words, distance, an available exit and appropriate assistance to reduce exposure to
      an escalating interaction before considering physical confrontation.
    scope_note: This is a non-contact rehearsal for an ordinary public disagreement, not training for
      abuse, coercive control, armed threats or physical self-defense.
    burden: Fifteen minutes to prepare and two five-minute voluntary rehearsals followed by a ten-minute
      review.
    setup: 'Use an empty room or a willing partner who agrees to a calm script, no shouting, touching,
      blocking or surprise escalation. Fictional case: a stranger argues that you took their place in
      a queue. Your aim is to leave safely or involve staff, not prove entitlement to the place.'
    actions:
    - title: Define an exit-centered response before rehearsing
      instructions: 'Identify the public exit, staff point and a way to keep ordinary space without cornering
        anyone. Prepare one short phrase such as I do not want an argument; I will ask staff or step away.
        State a stop threshold for threats, pursuit, blocked movement or a weapon: the exercise ends and
        real-world safety or emergency support takes priority. Do not promise that calm words will make
        another person calm.'
      checks:
      - The response has an available exit and assistance route
      - A short nonprovocative phrase is prepared
      - Escalation thresholds are explicit before the rehearsal
      - Success does not depend on controlling the other person
    - title: Practice the words and movement at normal intensity
      instructions: In the marked practice space, say the prepared phrase at an ordinary volume, leave
        room for movement and walk to the agreed safe endpoint. The partner, if present, reads only the
        approved mild disagreement. Repeat with the staff point unavailable, using the exit instead. Do
        not add grappling, restraint, sudden pursuit, intimidation or sensory stress to make the scene
        realistic; those would change the risk and training requirements.
      checks:
      - Two predictable non-contact rehearsals occur
      - Voice words and movement support disengagement
      - An unavailable helper leads to a different safe route
      - No surprise escalation physical contact or blocked exit is introduced
    - title: Review the route and choose a real-life boundary
      instructions: 'Ask whether the phrase was brief, whether you could move without approaching the
        other person and whether your route reached help or separation. Revise one awkward part and rehearse
        it once more. Write the boundary you will use outside practice: do not seek a confrontation, do
        not follow to continue the dispute, and obtain appropriate help if safe withdrawal is not available.
        Record rehearsal only; a calm practice partner is not evidence of success against an aggressor.'
      checks:
      - Words distance and exit are reviewed separately
      - One observed problem is revised and rehearsed again
      - The real-life boundary excludes pursuing or prolonging conflict
      - Rehearsal is not reported as proven crisis performance
    adaptation: Use written communication, a speech device, a seated route or a support person. People
      facing stalking, domestic abuse, retaliation or dependency should use specialist safety planning
      rather than practice direct boundary-setting with the unsafe person. Immediate danger warrants local
      emergency help.
    review: Did the sequence actually create an exit or assistance option, or did some part still invite
      an argument you were trying to avoid?
    examples:
      supportive: The person replaced a long defense of their position with one neutral sentence and a
        clear route to staff, then rehearsed the alternative exit.
      mixed: The words were calm but the first route moved closer to the other person, so the layout was
        changed before repeating.
      contradictory: The partner blocked the doorway or the participant deliberately provoked a stranger
        to test the technique.
      inconclusive: A phrase was memorized without checking space, exit, assistance or the limits of rehearsal.
  '15.05':
    title: Choose self-protection training with clear legal and ethical limits
    goal: Distinguish avoidance, emergency assistance and qualified physical training from fantasies of
      control, punishment or guaranteed safety.
    scope_note: This does not teach fighting, weapons or the legal justification for force. Local law,
      the circumstances and qualified instruction must determine any real physical response.
    burden: Twenty minutes to review boundaries, one provider inquiry or observation and a twenty-minute
      comparison; practical participation follows the instructor’s safe program.
    setup: 'Use the supplied fictional scene: an argument ends when you can safely leave, but you feel
      tempted to return and prove a point. Prepare a training-provider checklist covering consent, injury
      prevention, de-escalation, escape, accessible alternatives, instructor qualifications and realistic
      legal limitations.'
    actions:
    - title: Separate protection from retaliation in three decision points
      instructions: For the scene, write what changes when an exit becomes available, when the other person
        stops pursuing and when help arrives. At each point identify the protective aim and the action
        that would instead become pursuit, punishment or pride. List questions for a qualified local legal
        source about necessity, proportionality, retreat or other jurisdiction-specific duties, reporting
        and aftermath. Do not answer those legal questions from a generic internet slogan.
      checks:
      - Three changing decision points receive distinct dispositions
      - Protection is separated from pursuit and retaliation
      - Jurisdiction-specific legal questions remain explicitly unresolved until checked
      - No general legal permission to use force is asserted
    - title: Evaluate a real training provider against safety and realism
      instructions: Contact or observe a qualified provider without participating in a contact drill yet.
        Ask how beginners can decline or stop, how injuries and accessibility needs are handled, whether
        avoidance and escape are taught, what instructor qualifications can be verified, and how legal
        claims are bounded. Treat guaranteed victory, humiliation, surprise attacks and pressure to train
        through injury as reasons not to proceed. Record the actual answers, not the provider’s marketing
        label alone.
      checks:
      - A real provider inquiry or observation occurs
      - Consent stopping injury prevention and accessibility are checked
      - Qualifications and claims are distinguished from advertising
      - Unsafe or unrealistic answers can lead to rejecting the provider
    - title: Take the appropriate next step without manufacturing a confrontation
      instructions: 'Choose to attend a suitable introductory session, request a non-contact adaptation,
        seek another provider or defer with an identified reason. If attending, follow only the qualified
        instructor’s agreed beginner activity and record what was actually assessed, not a claim that
        you could now prevail in an assault. Complete an aftermath card: move to safety, seek urgent medical
        or emergency help when needed, follow lawful reporting and obtain qualified legal advice after
        a serious incident.'
      checks:
      - The selected next step follows the provider evidence
      - Physical participation occurs only under suitable instruction and consent
      - Assessed performance is not generalized to an uncontrolled assault
      - Medical emergency reporting and legal aftermath routes are included
    adaptation: Non-contact awareness, accessible escape planning and calling for assistance can be legitimate
      goals when contact training is unsuitable. There is no obligation to train in violence or acquire
      a weapon. Do not rehearse with an abusive person or expose yourself to danger to obtain evidence.
    review: What made the chosen training or deferral responsible, and which legal, physical and situational
      limits still prevent a broad safety claim?
    examples:
      supportive: The participant rejected a provider promising guaranteed street success, chose consent-based
        introductory training and kept legal-force questions assigned to a qualified local source.
      mixed: A provider had credible instruction but no suitable accessible route yet, so participation
        remained deferred rather than forced.
      contradictory: The exercise became a plan to punish someone, test a weapon or stage an unexpected
        attack on a friend.
      inconclusive: A certificate or dramatic video was treated as proof of realistic self-protection
        without checking training conditions or limits.
  '15.06':
    title: Complete a supervised outdoor readiness exercise with a turnaround rule
    goal: Prioritize exposure protection, communication, navigation and safe water arrangements before
      a minor outdoor problem becomes a survival emergency.
    scope_note: This is a benign supervised preparation exercise near ordinary support, not an unsupervised
      survival test. It does not teach fire-making, wild-food identification or improvised water treatment.
    burden: Thirty minutes to prepare, a qualified instructor-led session of suitable length and a fifteen-minute
      equipment and decision review.
    setup: 'Use a local outdoor program or qualified instructor and a safe daytime setting with normal
      services nearby. Fictional scenario: a short walk takes longer than expected and the weather worsens.
      Bring ordinary clothing, a map, communication method, safe drinking water, food and instructor-approved
      shelter or warmth items; never deliberately deprive yourself of them.'
    actions:
    - title: Rank the scenario’s needs and set a no-go threshold
      instructions: 'For the delayed walk, distinguish immediate exposure and location problems from less
        immediate comfort or food concerns. Identify a known route back, a weather-information source,
        a person who knows the plan and a time or condition for turning around. Give shelter, warmth,
        water, navigation, signaling, fire and food a disposition: carried, learned with supervision,
        unnecessary here or not authorized. A phone is one tool, not the only route or communication plan.'
      checks:
      - Immediate exposure and location needs are distinguished from optional comfort
      - A turnaround time or changing-condition threshold is explicit
      - All seven survival topics have an honest disposition
      - The plan does not depend on a phone alone
    - title: Demonstrate safe tasks under suitable supervision
      instructions: With the instructor’s agreement, orient the map to the actual setting, identify the
        return route and demonstrate how your carried warmth or shelter item is used without creating
        entrapment or exposure. Rehearse a clear location-and-help message without transmitting a false
        distress call. Use supplied safe water and ordinary food; any fire, water-treatment or other specialist
        demonstration belongs to the instructor’s lawful program and is not required by this exercise.
      checks:
      - A qualified supervised session actually occurs
      - Navigation and a carried exposure-protection item are demonstrated
      - A help message is rehearsed without a false emergency signal
      - No unsafe deprivation ingestion fire or treatment experiment is introduced
    - title: Use the turnaround decision and correct one readiness gap
      instructions: When the instructor presents the fictional worsening-weather cue, explain and follow
        the agreed return or stop decision in the safe exercise area. Afterward inspect what was difficult
        to retrieve, understand or use. Correct one real gap, such as an unreadable map copy or inaccessible
        warm layer, and demonstrate that part again. Record the environment, support and untested hazards;
        a successful near-home session does not establish remote or winter survival competence.
      checks:
      - The preset condition produces a stop or return decision
      - An observed equipment or decision gap is corrected
      - The corrected component is demonstrated again
      - Remote severe-weather and unsupervised transfer remain unclaimed
    adaptation: Use an accessible outdoor route or indoor instructor-led equipment session when terrain,
      weather, disability or cost makes the default unsuitable. An indoor session can establish equipment
      familiarity but not outdoor performance. Cancel rather than create cold, heat, thirst, exhaustion
      or isolation for realism.
    review: Which decision prevented the scenario from becoming a survival problem, and what equipment
      or skill still cannot be relied on without further instruction?
    examples:
      supportive: The participant located the return route, used a carried layer and turned back at the
        agreed weather cue, then repacked the item that had been inaccessible.
      mixed: Map use was sound near the trailhead, but independent navigation and water-treatment skills
        remained untested.
      contradictory: The person intentionally went without water, started an unauthorized fire or ate
        a wild plant to make the exercise authentic.
      inconclusive: A packing list was completed without a supervised demonstration or a practiced turnaround
        decision.
  '15.07':
    title: Establish your actual water-skill boundary with a qualified instructor
    goal: Know which swimming and self-support skills you can demonstrate in a controlled setting and
      how to summon or support rescue without entering unsafe water.
    scope_note: No unsupervised swim test, breath-holding, cold-water immersion, current exposure or in-water
      rescue is part of this practice. A pool assessment does not establish competence in open, cold or
      moving water.
    burden: Fifteen minutes for the hazard card, a suitably supervised water-safety lesson or assessment
      and a ten-minute review.
    setup: Use a qualified swimming instructor or approved accessible water program. Tell them your actual
      experience, access needs and concerns before entering water. Bring no assumption that you must reach
      a particular distance today. The dry-land scenario is seeing someone struggling beyond a safe reach
      from shore.
    actions:
    - title: Compare the proposed water setting with your demonstrated ability
      instructions: List the setting’s depth, entry and exit, temperature, current or waves, visibility,
        supervision and suitable flotation arrangements. Mark swimming, floating or treading, turning,
        returning to an exit and safe entry as demonstrated, untested or requiring assistance, based on
        actual experience rather than confidence. For cold or moving water, retain an untested disposition
        unless relevant qualified training establishes otherwise. Decide with the instructor whether entering
        is appropriate at all.
      checks:
      - Environment hazards are considered separately from swimming confidence
      - Five basic skill areas have evidence-based dispositions
      - Cold current and open-water transfer are not assumed
      - The instructor and participant agree whether water entry is suitable
    - title: Complete only the instructor-approved skill progression
      instructions: During the supervised session, follow the instructor’s safe progression for entry
        and resurfacing, floating or treading, turning, swimming toward safety and exiting, using the
        supports appropriate to your needs. The instructor may shorten, adapt or omit tasks; do not remove
        flotation or enter deeper water to satisfy this list. Record which skills were actually observed,
        under what support and in what setting. Attendance alone is not a pass, and an omitted skill remains
        untested.
      checks:
      - A qualified supervised session occurs rather than a self-test
      - Only approved skills and depths are attempted
      - Support and setting accompany each observed skill
      - Omitted or incomplete tasks remain untested without shame
    - title: Rehearse a shore-based help decision and set your limit
      instructions: On dry land, respond to the struggling-person scenario by identifying a lifeguard
        or local emergency route and a safe way to alert others. Explain the reach-or-throw principle
        without entering water, leaning beyond stable footing or practicing a pull with a person. Review
        available rescue equipment only with qualified guidance. Write the water settings you will avoid
        or use only with agreed supervision, and name the next skill to learn if appropriate.
      checks:
      - The rescue response is rehearsed on dry land
      - Calling trained help comes before an improvised in-water rescue
      - No unstable reach pull or entry is attempted
      - A personal setting and supervision boundary follows the observed assessment
    adaptation: Use an accessible pool, adaptive swimming instruction, assistance with transfers and communication
      supports. A dry-land lesson remains worthwhile when water entry is unsuitable, but it does not count
      as swimming or floating evidence. Do not use another learner as a rescue victim or a person’s consent
      as a substitute for rescue qualifications.
    review: What can you demonstrate in this exact water setting, and what tempting generalization to
      deeper, colder or moving water must you reject?
    examples:
      supportive: An instructor observed supported floating and a safe exit; the participant retained
        deep-water swimming as untested and rehearsed summoning a lifeguard from shore.
      mixed: The participant swam in a pool but could not exit independently, so the supervision and access
        boundary stayed in place.
      contradictory: A person entered cold water alone or jumped after a struggling swimmer to prove readiness.
      inconclusive: An online water-safety quiz was reported as proof of swimming or rescue competence.
  '15.08':
    title: Resolve one travel disruption using a verified fallback card
    goal: Prepare for an unfamiliar place in a way that survives a transport failure or lost connection
      without relying on assumptions about laws, documents or emergency access.
    scope_note: This is proportional travel preparation, not immigration, legal or medical advice. A hypothetical
      route tests planning only; real travel requirements must be verified for the traveler’s nationality,
      documents and dates.
    burden: Forty minutes for one trip card and a fifteen-minute tabletop disruption test.
    setup: Choose a real upcoming trip or the fictional case of arriving at an unfamiliar city’s main
      station after the last local connection is canceled. Use current official transport, government
      entry, destination health and local emergency information. Store sensitive document copies privately,
      not in the practice check-in.
    actions:
    - title: Build a dated destination card around the actual traveler
      instructions: Record the travel dates, required entry and identity documents, applicable local-law
        questions, health or medication requirements, transport arrival details, communication options
        and a verified assistance route. Include one cultural convention worth learning without treating
        it as universal behavior. Mark each item verified with a date, not applicable or unresolved. Use
        the traveler’s own government and destination authorities; a different country’s consular program
        or visa advice may not apply.
      checks:
      - Dates nationality and document context determine the verification
      - Law health transport communication and assistance are covered
      - Each requirement has a dated disposition rather than an assumption
      - Sensitive document contents remain outside the application
    - title: Test the canceled-connection case without mobile data
      instructions: On paper, remove the planned onward connection and mobile data. Locate an official
        staffed help point, a safe waiting or lodging option, an alternative lawful transport route and
        a way to tell the agreed contact. Check opening hours, accessibility, payment and whether the
        fallback is genuinely available at the arrival time. Identify a scam cue such as an unsolicited
        demand to hand over documents or pay immediately, and choose independent verification rather than
        confrontation.
      checks:
      - Both transport and data loss are represented in the test
      - The fallback is checked for timing access and payment
      - A contact update can occur through a verified alternative
      - An unsolicited demand triggers verification rather than compliance
    - title: Close one gap and carry a minimal usable copy
      instructions: Resolve the most important uncertainty by checking an official source or contacting
        the relevant provider. Create a minimal offline card with arrival destination, help route, contact
        plan and fallback, omitting unnecessary identifiers. Have a willing person or your own delayed
        review use it to explain the next step in the cancellation case. If an entry, health or safety
        requirement remains unresolved, mark travel readiness conditional rather than treating the card
        as permission to depart.
      checks:
      - One consequential uncertainty is actually investigated
      - The offline card contains enough information to act
      - A delayed or second-person use test occurs
      - Unresolved requirements remain conditions rather than silently passing
    adaptation: Use accessible formats, a translated address, verified assistance booking or a trusted
      travel companion. A low-cost local unfamiliar-place exercise can practice navigation and fallback
      decisions, but it does not establish international entry or medical readiness. Never intentionally
      lose documents or strand yourself.
    review: Which fallback remained usable without the original connection or data service, and what unresolved
      requirement could still invalidate the plan?
    examples:
      supportive: The traveler found that the accessible shuttle stopped early, verified a staffed alternative
        and could retrieve the needed details offline.
      mixed: Transport was covered, but a medication import question remained unresolved and was assigned
        to the destination authority before departure.
      contradictory: The person relied on an outdated visa post or handed private documents to an unsolicited
        helper during a staged test.
      inconclusive: An itinerary was saved without testing an unavailable service or verifying traveler-specific
        requirements.
  '15.09':
    title: Rehearse a suspected account compromise without exposing credentials
    goal: Combine account protection with a trustworthy response path when a message, login alert or transaction
      may indicate fraud or identity misuse.
    scope_note: Use only accounts you own or are explicitly authorized to manage. This is not penetration
      testing, malware analysis, financial recovery advice or proof that an account is uncompromised.
    burden: Twenty minutes to map one account, fifteen minutes for a fictional alert rehearsal and one
      safe provider-guided security correction.
    setup: 'Choose a low-stakes personal account with an available official recovery route. Fictional
      alert: an email says a new device signed in and urges you to use its link immediately. Keep passwords,
      one-time codes, recovery codes, account numbers and identifying documents entirely out of the exercise
      notes and application.'
    actions:
    - title: Check protection and recovery before changing access
      instructions: Open the provider through its known official app or address, not the alert. Check
        whether the account uses a unique password or appropriate passkey, available multifactor protection,
        current recovery information and supported software. Note statuses only. Confirm that you can
        still access a trusted session and know the official support route before making changes; do not
        log out every device, remove an authenticator or reset recovery material merely to create a test.
      checks:
      - The provider is reached independently of the suspicious message
      - Authentication recovery and software status are reviewed
      - Only nonsecret status information is recorded
      - A working access route is preserved before changes
    - title: Route three fictional compromise signals to distinct actions
      instructions: For an unsolicited login alert, an unfamiliar posted payment and a message asking
        for a one-time code, state what you would verify through the provider or financial institution’s
        official channel. Separate checking account activity from replying to the sender. Include a prompt
        reporting route for actual unauthorized activity and an identity-theft assistance route appropriate
        to your location. Do not assume every alert is genuine or that deleting the message resolves an
        actual compromise.
      checks:
      - Three different signals receive distinct verification and response routes
      - No code or credential would be sent to the message sender
      - Actual unauthorized activity prompts timely official contact
      - Local reporting and identity-help routes are verified rather than guessed
    - title: Make one supported improvement and retest ordinary access
      instructions: Choose one low-risk improvement the provider explicitly supports, such as enabling
        a usable additional sign-in factor or updating a stale recovery contact. Follow current official
        instructions, preserve the working session and verify that the intended sign-in and recovery information
        remain usable without exposing secrets. If the change is high-consequence or uncertain, obtain
        provider support instead. Record the completed action or unresolved barrier; the fictional incident
        itself is not reported to authorities as real.
      checks:
      - The improvement follows current official provider instructions
      - Ordinary access is checked after the change
      - Uncertain high-consequence changes are referred rather than improvised
      - A fictional event is never submitted as a real fraud report
    adaptation: Use an accessible authenticator or provider-supported recovery method, and involve a trusted
      helper only with limited explicit permission. For work accounts, use the organization’s incident
      channel and do not alter controls outside your authority. A real fraud event should not wait for
      completion of this practice.
    review: Could you verify and report a real problem without using the suspicious message, and did your
      protective change preserve recoverable access?
    examples:
      supportive: The participant independently checked the account, rehearsed the financial-institution
        contact route and enabled a usable second factor without losing the existing session.
      mixed: Protection improved, but the recovery route still depended on an obsolete phone and remained
        an unresolved risk.
      contradictory: The person shared a one-time code, uploaded credentials to the notes or tested security
        on someone else’s account.
      inconclusive: A suspicious email was deleted without checking whether actual account activity required
        a response.
  '15.10':
    title: Remove one ordinary single point of failure and prove the fallback works
    goal: Own a dependency through prevention, detection, response and recovery rather than treating a
      backup plan as a list of reassuring possibilities.
    scope_note: Choose a low-consequence personal or volunteer process. Medical, industrial, financial,
      emergency and regulated systems require their own qualified risk-management procedures.
    burden: Twenty minutes to map the dependency, twenty minutes to install a small fallback and fifteen
      minutes for a harmless test.
    setup: 'Default process: opening a weekly community reading session when the usual organizer holds
      the only agenda and contact route. Use fictional names and no personal contact details in the application.
      A real group’s roles, access and backup sharing must be agreed by those responsible.'
    actions:
    - title: Identify failure modes and who actually owns them
      instructions: Draw the steps from preparation to the session starting. Mark dependencies on one
        person, one device, one location and one communication channel. For each plausible failure, record
        the effect, how it would be noticed, who can act and what cannot safely be shared. Select one
        meaningful single point, such as the agenda existing only on the organizer’s phone. Do not label
        a person as the problem; the issue is the unbacked dependency.
      checks:
      - People devices locations and communication dependencies are considered
      - Failure effects and detection cues are explicit
      - An authorized owner is assigned to the selected dependency
      - Private access and information limits are retained
    - title: Install a bounded fallback with a trigger and reserve
      instructions: 'For the agenda dependency, prepare a permitted minimal copy with a willing backup
        facilitator and define the trigger: the organizer has not checked in by the agreed time. Specify
        what the backup may do, the resources or time reserved, and when cancellation is safer than improvisation.
        Include prevention, such as confirming attendance beforehand, without assuming it eliminates the
        failure. Obtain consent before assigning responsibility or distributing group information.'
      checks:
      - The fallback has a concrete activation trigger
      - Backup authority resources and time are agreed
      - Prevention is distinguished from response and reserve
      - Cancellation remains an explicit safe option
    - title: Test unavailability on paper and restore normal ownership
      instructions: Announce a tabletop in which the organizer’s phone is unavailable; do not disable
        or take it. Ask the backup to retrieve the permitted agenda and explain the start or cancellation
        decision. Record the time or access obstacle, correct one gap and repeat that part. Finally state
        how the original owner will be informed and how the normal arrangement resumes. A fallback that
        cannot be retrieved is still a gap, even if a document says it exists.
      checks:
      - The test is announced and nondestructive
      - The fallback is retrieved and used to make a decision
      - An observed gap is corrected and retested
      - Recovery and return of ownership are specified
    adaptation: Use paper, audio, a trusted deputy or a simpler cancellation rule when resources are limited.
      A person working alone can test a process against an unavailable device rather than appoint an unwilling
      helper. Avoid storing sensitive rosters or credentials in backup copies.
    review: What could actually continue or recover when the chosen dependency disappeared, and where
      did the fallback still rely on the same failed resource?
    examples:
      supportive: A backup facilitator retrieved the agenda independently, applied the check-in trigger
        and knew when to cancel and notify the organizer.
      mixed: The agenda copy worked but the contact route still lived on the unavailable phone, revealing
        a second dependency.
      contradictory: The test disabled a production system or assigned an unconsenting person responsibility
        for a critical service.
      inconclusive: A risk register named failures without an owner, activation trigger or tested recovery
        route.
  '15.11':
    title: Participate in one consent-based neighborhood disruption exercise
    goal: Contribute a bounded useful role to a community plan while respecting privacy, unequal capacity
      and the limits of volunteer help.
    scope_note: This requires willing community participation or remains preparation-only. It does not
      authorize medical care, forced welfare checks, entry into homes, emergency transport or access to
      private vulnerability lists.
    burden: Twenty minutes to prepare a role offer, one short group conversation or existing community
      exercise and a fifteen-minute follow-up.
    setup: 'Use an existing neighborhood, building, community-center or mutual-aid group. Default scenario:
      a local outage interrupts ordinary communication and transport for an afternoon. Prepare an offer
      you can genuinely fulfill, such as relaying a public notice or staffing an agreed information point,
      plus limits on time and personal data.'
    actions:
    - title: Offer one bounded contribution and ask what is actually needed
      instructions: Contact an appropriate organizer through an established channel. Ask what outage or
        disaster plan already exists, how volunteers are authorized and how people request or decline
        help. Offer one skill, resource or time window without assuming that visible vulnerability means
        consent to intervention. Ask how communication, supplies, transport, welfare checks and recovery
        support are coordinated, and identify which roles require professional qualifications or formal
        safeguarding.
      checks:
      - An existing organizer or legitimate group route is contacted
      - The offer is bounded by actual capacity and authority
      - People can request or decline assistance
      - Six coordination areas and qualified-role limits are discussed
    - title: Join an announced communication or information drill
      instructions: With agreement, take part in a small tabletop or established exercise using fictional
        household details. Practice receiving an official public notice, passing it through the agreed
        channel and confirming that the intended recipient received the same message. Introduce one unavailable
        volunteer or transport option on paper and route the gap to the organizer. Do not enter homes,
        collect health details, imitate an official responder or create a real emergency alert.
      checks:
      - A willing group participates in an announced exercise
      - The public message is passed and receipt is checked
      - An unavailable resource is escalated through the agreed coordinator
      - No private household information or false emergency status is created
    - title: Close the assigned task and improve one shared gap
      instructions: Report what you actually completed, what failed and what remains outside your role.
        Agree one correction such as a clearer public meeting point, an accessible message format or a
        backup contact role, and test that correction with the group’s permission. Confirm how volunteering
        ends and how future contact or retained information can be withdrawn. If no group accepts the
        offer, record outreach and preparation only rather than claiming community participation.
      checks:
      - Completed work and unfilled needs are distinguished
      - A shared correction is agreed rather than imposed
      - The correction is tested with permission
      - Role closure withdrawal and preparation-only limits are explicit
    adaptation: A remote message-checking, translation or accessibility-review role can be as legitimate
      as physical supply work. Never promise transport or care beyond your competence. Use official emergency
      services for immediate danger and the group’s safeguarding route for concerns requiring more than
      informal support.
    review: Did the community gain a usable contribution that it actually wanted, and what coordination
      failure would still matter if the usual volunteer were absent?
    examples:
      supportive: A volunteer joined the group’s practice, found that an audio notice lacked the meeting
        location and helped correct and retest the message.
      mixed: Outreach produced a useful role offer, but no group exercise occurred, so participation remained
        pending.
      contradictory: A volunteer compiled neighbors’ medical information or entered a home for an unrequested
        welfare check.
      inconclusive: A personal stockpile was described as mutual aid without contact, consent or coordination
        with anyone else.
  '15.12':
    title: Translate one current public-health notice into a proportionate shared plan
    goal: Use dated credible guidance to protect yourself and others during a respiratory outbreak or
      environmental-health warning without inventing rules or shaming affected people.
    scope_note: This is a guidance-verification and communication exercise, not diagnosis or individualized
      advice about vaccination, treatment, isolation duration or medical vulnerability.
    burden: Twenty minutes to inspect one official notice, fifteen minutes to make a small plan and a
      ten-minute teach-back or revision.
    setup: Choose a current local public-health notice relevant to an ordinary shared activity. When none
      is active, use a clearly labeled hypothetical indoor club meeting during increased respiratory illness
      and consult current official general prevention guidance. Keep personal diagnoses, vaccination status
      and other people’s medical information out of the record.
    actions:
    - title: Check the notice’s authority date scope and uncertainty
      instructions: Find the original notice from the relevant public-health or environmental authority
        rather than a forwarded image. Record its date, location, affected settings, recommended actions
        and any update trigger. For the hypothetical respiratory case, separate routine prevention, additional
        precautions when risk is higher, staying away when ill and prompt clinical advice for concerning
        symptoms or higher-risk people. Check current local guidance for specifics instead of copying
        a fixed isolation period into the plan.
      checks:
      - The original issuing authority and date are verified
      - Location and setting limits are recorded
      - Routine and higher-risk actions are distinguished
      - Uncertain or changing medical details are referred to current guidance
    - title: Design one activity change that protects access as well as health
      instructions: For the club meeting, consider cleaner air, hygiene, a remote or postponed option,
        appropriate masking guidance and a way for an ill person to stay away without losing participation.
        Note where current immunization or individual medical questions belong with the person’s clinician.
        Choose one feasible change with the organizer’s permission and identify who bears its cost or
        burden. Do not demand health disclosure or treat a person’s need for additional protection as
        an inconvenience to dismiss.
      checks:
      - Air hygiene attendance and additional precautions are considered
      - One feasible organizer-approved change is selected
      - Individual medical and immunization decisions remain with appropriate care
      - Access cost and privacy burdens are explicitly considered
    - title: Communicate the plan with a source and a revision trigger
      instructions: Draft or send, where authorized, a short message saying what will change, when it
        applies, how to participate another way and where the current official guidance can be checked.
        Ask a willing reader to explain the action back, or review it after a delay. Correct ambiguity
        without adding certainty the source does not provide. State when the plan will be reviewed or
        withdrawn; for a hypothetical case, do not imply that an actual outbreak has been announced.
      checks:
      - The message states the action timing alternative and official source
      - A teach-back or delayed comprehension check occurs
      - Ambiguity is corrected without overstating certainty
      - A revision trigger and hypothetical status remain visible
    adaptation: Use plain language, translation, accessible remote participation and trusted community
      channels. Lack of paid leave, space or resources may limit a person’s options; route those constraints
      to support rather than blame. Immediate medical danger takes priority over finishing a communication
      exercise.
    review: Could someone follow the message without disclosing private health information, and what change
      in official guidance or local conditions would require you to revise it?
    examples:
      supportive: The organizer verified the local notice, improved the meeting’s participation alternative
        and sent a dated message that a reader could accurately explain.
      mixed: The guidance was credible, but the proposed remote option was inaccessible to some participants
        and needed another route.
      contradictory: A person announced an unverified outbreak, demanded private diagnoses or substituted
        the exercise for urgent medical care.
      inconclusive: A forwarded warning was shared without checking its date, location or issuing authority.
  '15.13':
    title: Rehearse a safe bystander choice that preserves the affected person’s agency
    goal: Recognize a concerning interaction and choose among distraction, delegation, documentation,
      delayed support and direct words without making yourself or the affected person less safe.
    scope_note: This is a scripted non-contact rehearsal, not an obligation to confront violence or investigate
      abuse. Immediate danger requires an appropriate emergency response; specialized safeguarding obligations
      vary by role and location.
    burden: Fifteen minutes to compare options, two five-minute rehearsals and ten minutes to review consent
      and follow-up.
    setup: 'Use a fictional scene at a public event: one attendee repeatedly makes unwanted comments while
      another person tries to move away. No real harassment is staged. A willing partner may read a neutral
      script, or you can rehearse alone. The goal is useful support, not public heroism or content for
      social media.'
    actions:
    - title: Compare five routes against the actual safety conditions
      instructions: 'Write one possible response for each route: distract with an ordinary question, delegate
        to appropriate staff, document only when safe and useful, delay to offer support afterward, or
        use a brief direct statement when safe. For each, consider exits, escalation, the affected person’s
        wishes and your actual role. Recording is not the default; it should not replace help, violate
        privacy or become a public post without the person’s permission.'
      checks:
      - All five routes are considered rather than assuming confrontation
      - Safety exits role and the affected person’s agency inform the choice
      - Documentation is not substituted for assistance
      - Recording and publication have separate privacy and consent limits
    - title: Practice one indirect route and one follow-up offer
      instructions: 'Choose the safest plausible route in the fictional scene, such as asking event staff
        to check on the situation without making unsupported accusations. Speak a concise report of what
        you observed and where help is needed. Then rehearse a private follow-up: I noticed that interaction;
        would you like company or help finding staff? Practice accepting no, and repeat with staff unavailable
        so that you choose another safe option rather than escalating automatically.'
      checks:
      - An indirect intervention is actually rehearsed
      - The report describes observations rather than inferred motives
      - A follow-up offer allows the person to decline
      - Unavailable staff lead to a reconsidered safe route
    - title: Review whether the intervention added protection or pressure
      instructions: Check whether your words exposed the person, demanded a story, escalated the aggressor
        or promised help you could not provide. Revise the weakest part and rehearse again. Identify a
        local emergency route and a relevant specialist or organizational support route for real violence,
        abuse or safeguarding concerns. Record the outcome as rehearsal only; do not seek a real incident
        or approach a vulnerable person to complete the practice.
      checks:
      - Exposure escalation and unwanted pressure are reviewed
      - A revised response is rehearsed after the review
      - Emergency and specialist routes are distinguished
      - No real victim or incident is sought for practice evidence
    adaptation: Remote delegation, written reporting, translation or staying with someone after an event
      may be appropriate alternatives. Do not assume police contact is always the person’s preferred non-emergency
      route; immediate danger and applicable safeguarding duties require context-sensitive appropriate
      help. Avoid promises of secrecy you cannot lawfully or safely keep.
    review: Did your chosen action increase safe options for the affected person, or mainly satisfy your
      own wish to do something visible?
    examples:
      supportive: The bystander rehearsed a factual staff report and a private support offer, then accepted
        the scripted person’s refusal without demanding details.
      mixed: The first script offered help but also pressured the person to report; the revised version
        restored a genuine choice.
      contradictory: The exercise became a confrontation, public recording or interrogation of someone
        who had not agreed to participate.
      inconclusive: Five intervention labels were memorized without choosing or rehearsing a response
        in the supplied scene.
  '15.14':
    title: Stop a low-risk task when its safety conditions are not established
    goal: Identify hazards before work, prefer controls that remove exposure and use a clear stop-and-report
      decision when equipment, authorization or conditions are uncertain.
    scope_note: The practical task is limited to arranging lightweight paper materials at a table. Machinery,
      electrical work, chemicals, lifting hazards and hazardous-energy isolation are discussed only as
      stop-and-refer cases, never practiced from this guide.
    burden: Fifteen minutes for the task review, ten minutes for a safe setup change and ten minutes for
      a stop-work rehearsal.
    setup: 'Use a table, a few lightweight folders and an ordinary clear work area. Fictional complication:
      someone asks you to clear a jam from powered equipment and says switching it off is enough. Do not
      approach, open, unplug, lock out or service equipment as part of this exercise.'
    actions:
    - title: Review the harmless task before starting it
      instructions: Break arranging the folders into retrieving, placing and returning them. Look for
        trip obstruction, awkward reach, poor lighting and damaged or unstable furniture without creating
        hazards to inspect. Consider removing the obstruction or moving the materials before relying on
        a warning or personal protective equipment. Name what would make the task no longer low-risk,
        such as heavy loads, sharp contents or powered equipment, and stop rather than expanding the exercise.
      checks:
      - The task is divided into observable steps before work
      - Existing access reach lighting and stability conditions are checked
      - Removing or reducing exposure is considered before warnings or PPE
      - Scope-changing hazards trigger a stop rather than improvisation
    - title: Install one simple control and verify the work area
      instructions: Make one authorized nonhazardous change, such as moving the folders within comfortable
        reach or clearing an ordinary loose item from the walkway when safe. Perform the small folder
        task and check that the change did not create another obstruction or burden. Record what was observed,
        not a claim of formal safety certification. If the condition cannot be corrected within your authority,
        leave the task unstarted and report it to the responsible person.
      checks:
      - One authorized simple control is actually installed
      - The task is attempted only within the safe scope
      - The change is checked for a newly created problem
      - An unresolved condition is reported rather than declared safe
    - title: Rehearse refusing the powered-equipment shortcut
      instructions: 'For the fictional jam request, say: I am not authorized to service this; it needs
        the site’s approved isolation and maintenance process. Identify the supervisor or safety reporting
        route and what factual information to provide. Explain that electrical, mechanical, pneumatic,
        hydraulic, thermal or stored energy may remain despite a normal off switch. Do not touch another
        person’s lock or tag, bypass a guard or treat this explanation as lockout training. Rehearse resuming
        only after the authorized process establishes safe conditions.'
      checks:
      - The shortcut receives an explicit stop and referral
      - The report identifies the task and uncertainty without blame
      - An off switch is not equated with verified hazardous-energy isolation
      - Resumption depends on the authorized process rather than personal reassurance
    adaptation: Use seated work, assistance or a smaller task. At work, follow the employer’s safety program,
      training, reporting and applicable legal protections; this guide does not determine a jurisdiction-specific
      right or procedure. Do not improvise PPE selection or hazardous-energy control from a general hierarchy.
    review: What evidence made the ordinary task acceptable, and what missing authorization or control
      made the equipment request a stop rather than a challenge?
    examples:
      supportive: The person moved folders to a comfortable reach, checked the clear walkway and rehearsed
        routing the powered-equipment jam to authorized maintenance.
      mixed: The table task was safe, but the reporting route was unclear and had to be verified before
        relying on the stop-work card.
      contradictory: The person bypassed a guard, removed someone else’s tag or attempted isolation after
        reading the general explanation.
      inconclusive: A PPE checklist was completed without examining the task, existing hazards or the
        authority to perform it.
