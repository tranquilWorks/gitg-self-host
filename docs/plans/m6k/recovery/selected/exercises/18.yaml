schema_version: GG-TAILORED-PRACTICE-AUTHORING-1.0
domain_id: '18'
exercises:
  '18.01':
    title: Choose a caring action that respects both people’s reality and boundaries
    goal: Distinguish affection, desire, attachment, admiration and commitment from possession, and act
      for another person’s genuine good without erasing your own limits.
    scope_note: This is a voluntary adult relationship reflection and ordinary care action. It does not
      define one universal form of love or require sacrifice, reconciliation or continued contact in an
      unsafe relationship.
    burden: Twenty minutes to examine one situation, one small agreed action and a ten-minute review.
    setup: 'Default case: someone you care about wants a quiet evening, while you strongly want their
      attention. Use a private page with eight headings: affection, desire, attachment, care, commitment,
      sacrifice, admiration and possession. The person may be a partner or another appropriate adult loved
      one; no intimate disclosure is needed.'
    actions:
    - title: Separate what you feel from what the other person may need
      instructions: For the case, describe the wish for closeness and the other person’s stated wish for
        rest. Under the eight headings, note which motives may be present and which are unknown. Affection
        or desire can coexist with care, but wanting access to someone does not establish that more contact
        serves their good. Identify a possessive impulse, if present, such as treating their separate
        time as disloyalty, without making the feeling itself a whole-person verdict.
      checks:
      - Your feeling and the other person’s stated need are separate
      - All eight dimensions receive an honest disposition
      - Desire for access is not equated with the other person’s good
      - A possessive impulse is named without justifying controlling conduct
    - title: Ask what care would look like and state your own limit
      instructions: 'Ask whether the person wants quiet, practical help, a brief check-in or another form
        of contact. State your own need without making it a demand: I would value time together; could
        we choose another time that works? Consider the commitments already made and whether a proposed
        sacrifice is freely chosen, proportionate and sustainable. Do not offer help that creates a hidden
        debt or require the person to reassure you before they can rest.'
      checks:
      - The person is asked what support or contact they want
      - Your own need is expressed without controlling their choice
      - Existing commitments and the cost of sacrifice are considered
      - Care is not exchanged for reassurance or a hidden obligation
    - title: Carry out the agreed care and review its truthfulness
      instructions: Perform the small agreed action, including respecting a request for space when that
        is the chosen care. Keep any promised later contact and review whether your behavior matched both
        the person’s request and your honest capacity. If you felt resentment, examine whether you agreed
        to more than you could freely give and revise future expectations. A caring action does not require
        pretending you had no conflicting desire.
      checks:
      - The action follows the actual agreed need
      - Any later commitment is kept or renegotiated promptly
      - Resentment or an unsustainable sacrifice is reviewed honestly
      - Conflicting feelings do not erase the value or limits of the action
    adaptation: Use writing, a smaller practical action or a fictional case when the relationship is unavailable
      or unsafe. Love does not require tolerating coercion, abandoning essential care for yourself or
      denying facts about harm. Appropriate support may be the caring next step.
    review: What made the action caring rather than possessive, and how did you preserve truth and your
      own boundaries while considering the other person’s good?
    examples:
      supportive: The participant accepted the requested quiet evening, agreed another time for connection
        and kept that plan without making rest a loyalty issue.
      mixed: Practical help was offered freely at first, but resentment revealed an unspoken expectation
        of attention that needed clarification.
      contradictory: The person used love or sacrifice to justify monitoring, isolation or control over
        another adult’s time.
      inconclusive: Different forms of love were defined abstractly without choosing or carrying out an
        appropriate caring action.
  '18.02':
    title: Make or decline one adult romantic invitation with honest intention
    goal: Express interest or lack of interest clearly, respect mutuality and pacing, and handle rejection
      without manipulation, entitlement or humiliation.
    scope_note: This applies only to lawful adult, voluntary and reasonably safe interactions without
      coercive power or dependency. No one must date, flirt or seek a partner to complete a personal-development
      program.
    burden: Ten minutes to prepare and rehearse, one appropriate invitation or decline when a genuine
      opportunity exists, and a five-minute review.
    setup: 'Use a real welcome adult context or the fictional case of two acquaintances who have enjoyed
      talking at a social group. Default invitation: I have enjoyed talking with you; would you like to
      meet for coffee as a date next week? Prepare a respectful acceptance, decline and uncertain-response
      route. Do not stage interest you do not feel.'
    actions:
    - title: Check intention, context and the ability to say no
      instructions: State whether you are seeking a date, friendship or simply more conversation, and
        avoid leaving a material intention deliberately ambiguous. Check whether the person is an adult,
        whether contact is welcome and whether work, housing, care or authority would make refusal costly.
        Choose a modest public or otherwise mutually safe meeting option with independent transport and
        no expectation of physical intimacy. If the context is unsuitable, use rehearsal or decline to
        proceed.
      checks:
      - The intention is honest and appropriate to adults
      - The person can refuse without a power or dependency cost
      - The proposed meeting has proportionate safety and pacing
      - An unsuitable context leads to rehearsal or no approach
    - title: Make the invitation or decline in plain respectful words
      instructions: Ask once in an appropriate moment, or clearly decline an invitation without insulting
        the person. Include a specific modest option and space for an alternative. Do not use jealousy,
        persistence, gifts, public spectacle or pressure to create attraction. If the answer is uncertain,
        ask whether they would prefer to leave it there rather than treating uncertainty as permission
        to keep pursuing. A declined invitation is a legitimate completed communication, not a failed
        person.
      checks:
      - The invitation or decline is direct without unnecessary humiliation
      - The request is made once with room for an alternative
      - No pressure tactic is used to manufacture attraction
      - Uncertainty and refusal are respected as limits on pursuit
    - title: Match the follow-through to the actual answer
      instructions: For a mutual yes, confirm the plan and any practical boundaries without assuming more
        than the agreed meeting. For a no, acknowledge it and stop the pursuit; maintain only contact
        that remains genuinely welcome. For a cancellation, accept the stated information and avoid interpreting
        it as a test. Review whether your conduct remained honest when the outcome disappointed you, and
        label rehearsal separately from an actual invitation.
      checks:
      - Follow-through matches the specific agreement and no more
      - A refusal ends the pursuit without retaliation
      - Cancellation is not automatically interpreted as a hidden game
      - Actual communication and scripted rehearsal are reported separately
    adaptation: Use accessible text or an appropriate mutually familiar setting. Singles may complete
      a boundaries-and-decline rehearsal without seeking romance. Stop when contact becomes unwelcome,
      and use appropriate support for stalking, harassment or coercion rather than treating it as courtship.
    review: Did the other person have a real choice, and did your behavior after the answer match the
      respect you intended before asking?
    examples:
      supportive: The participant made a clear modest invitation, accepted a decline and did not use the
        shared group to continue pressuring the person.
      mixed: The invitation was welcome, but its romantic intent was unclear and needed a respectful clarification
        before planning.
      contradictory: The person used persistence, public embarrassment or authority to make rejection
        difficult.
      inconclusive: Interest was imagined or rehearsed but reported as a mutually agreed date.
  '18.03':
    title: Review relationship compatibility using evidence beyond intensity
    goal: Consider values, conduct, conflict, direction, attraction, trust, responsibility and constraints
      before choosing the next level of adult partnership commitment.
    scope_note: This is a private decision aid, not a compatibility score, diagnosis or instruction to
      stay or leave. It must not become surveillance, a secret test or a demand that a partner disclose
      everything.
    burden: Thirty minutes to review known evidence, one willing conversation and a twenty-minute decision
      review.
    setup: 'Choose a relationship decision that is not urgent, such as whether to discuss a greater commitment.
      Use a fictional couple if no relevant adult relationship exists. Prepare eight headings: values,
      character in action, conflict style, future direction, attraction, trust, responsibility and practical
      constraints.'
    actions:
    - title: Record actual examples and uncertainty under each heading
      instructions: For each of the eight headings, write one observed example, one genuine unknown and
        any important mismatch. Distinguish intensity, loneliness, idealization or fear of losing the
        person from evidence of fit. Look at how small promises, disagreements and responsibilities have
        actually been handled over time. Do not infer values from demographic identity or treat different
        preferences as defects that the other person must change.
      checks:
      - All eight compatibility areas include evidence or an honest unknown
      - Intensity and loneliness are separated from observed fit
      - Patterns of conduct matter more than one impressive moment
      - Difference is not automatically treated as a flaw to repair
    - title: Discuss one consequential unknown without conducting an interview test
      instructions: With permission, choose a meaningful question such as how each person imagines work,
        family responsibilities or living arrangements in the next few years. Share your own current view
        and invite theirs, allowing uncertainty and change. Clarify one practical conflict and whether
        it is negotiable, role-dependent or a fundamental boundary. Do not ask questions merely to score
        the answer or conceal your own incompatible intention.
      checks:
      - The conversation addresses a consequential unknown
      - Both people can state current views and uncertainty
      - Negotiable preferences and fundamental boundaries are distinguished
      - The exchange is not a hidden compatibility examination
    - title: Choose a proportionate next decision and a review trigger
      instructions: Decide whether to continue learning, deepen the commitment, keep the relationship
        at its current level or seek a safe ending or professional support. State which evidence supports
        the choice and what remains unresolved. Do not convert a major unresolved difference about children,
        safety or life direction into a vague promise that love will solve it. Set a review trigger based
        on a real conversation or event rather than endless checking.
      checks:
      - The next step is proportionate to the evidence available
      - Unresolved differences remain visible in the decision
      - No promise of future change substitutes for present incompatibility evidence
      - A concrete review trigger replaces continuous reassessment
    adaptation: Use writing, separate reflection or a qualified relationship professional when appropriate
      and safe. Abuse, coercion and retaliation require specialist safety support rather than a mutual
      compatibility discussion. Single life is a legitimate outcome, not a failure to find a match.
    review: Which observations mattered more than attraction or fear of being alone, and what uncertainty
      would make a larger commitment premature?
    examples:
      supportive: The couple recognized strong affection but an unresolved life-direction difference and
        chose another explicit conversation before increasing commitment.
      mixed: The review identified useful patterns but relied too heavily on promises, so the decision
        remained provisional pending actual follow-through.
      contradictory: The person secretly tested, monitored or ranked the partner rather than discussing
        a relevant uncertainty honestly.
      inconclusive: A major commitment was justified only by intensity while trust, responsibility and
        constraints were left unexamined.
  '18.04':
    title: Replace one relationship test with a direct request and reliable return
    goal: Recognize a pursuing, distancing or testing reaction and use a clear request, self-regulation,
      reassurance and boundaries instead of trying to control a partner’s response.
    scope_note: This is an ordinary adult relationship experiment, not attachment diagnosis or therapy.
      It does not require remaining in an unsafe relationship or treating legitimate concerns as personal
      insecurity.
    burden: Fifteen minutes to map a pattern, one safe natural opportunity and a ten-minute follow-up.
    setup: 'Default situation: a partner’s delayed reply triggers an urge to send repeated messages or
      withdraw to see whether they chase you. Use a private four-part note: cue, story, impulse and direct
      request. Choose an ordinary nonurgent context, not a real safety emergency.'
    actions:
    - title: Describe the reaction without assigning an attachment label
      instructions: Record the observable cue and distinguish it from the story, such as a delayed reply
        versus they will leave me. Notice possible pursuing, distancing, idealizing, testing or controlling
        behavior and the fear or need it may express. Name what would make the concern a real reliability
        or safety issue rather than assuming it is all in your head. Choose a brief safe regulation action
        that does not become punishment or indefinite avoidance.
      checks:
      - The cue is separated from the abandonment or rejection story
      - The actual impulse is named without a diagnostic label
      - Legitimate reliability or safety concerns remain possible
      - A regulation step avoids punishment and indefinite withdrawal
    - title: Make a direct request that the other person can negotiate
      instructions: 'At an appropriate time, say what would help in concrete terms: When plans are uncertain,
        could we agree when to check in? Ask what communication is realistic for the other person and
        state your own limit. Offer reassurance when freely meant, but do not promise constant access,
        demand passwords or require proof of affection. Agree a small predictable contact practice only
        if both people genuinely want it.'
      checks:
      - The request names a concrete need rather than a hidden test
      - The partner can negotiate timing and availability
      - Reassurance is distinct from constant access or surveillance
      - Any contact agreement is mutually chosen and realistic
    - title: Use the agreement once and review both people’s experience
      instructions: At the next ordinary opportunity, use your regulation step and follow the agreed contact
        pattern instead of sending a test or withdrawing to provoke pursuit. Record whether each person
        followed through and what changed in the interaction, without using the partner’s response as
        a worth score. If the agreement fails, discuss the specific failure or reconsider fit; do not
        silently increase monitoring. One cycle does not establish secure attachment.
      checks:
      - A natural opportunity is attempted without a relationship test
      - Follow-through is compared with the actual agreement
      - A missed agreement leads to clarification rather than monitoring
      - One interaction is not generalized into an attachment diagnosis or cure
    adaptation: Use text, scheduled contact, a smaller request or individual support when emotional activation
      makes discussion difficult. Repeated threats, coercion or abuse require appropriate help, not better
      reassurance rituals. A fictional rehearsal remains a communication exercise only.
    review: What did the direct request reveal that the test could not, and did the agreement support
      security without taking away either person’s autonomy?
    examples:
      supportive: The participant replaced repeated messages with an agreed check-in time and used the
        interval for an ordinary activity, then reviewed a missed contact directly.
      mixed: The request was clear, but the proposed frequency exceeded the partner’s capacity and required
        renegotiation.
      contradictory: The exercise became a demand for passwords, constant location access or proof of
        love.
      inconclusive: An attachment label was assigned without changing any actual request, test or follow-through
        behavior.
  '18.05':
    title: Share one relevant truth at a depth both people can hold
    goal: Build mutual knowledge through a chosen hope, fear, need, mistake, affection or uncertainty
      without coercive disclosure, oversharing or concealment of a material issue.
    scope_note: Use a trustworthy adult partner or an explicitly fictional rehearsal. This is not trauma
      processing, confession under pressure or a requirement to reveal private history to prove intimacy.
    burden: Ten minutes to choose the topic, a fifteen-minute willing conversation and a five-minute follow-up.
    setup: 'Default topic: you feel uncertain about an upcoming change in work or routine and want the
      partner to understand why your attention has been divided. Choose a manageable truth relevant to
      the relationship, not the most painful experience you can recall. Keep all substantive private content
      outside the application.'
    actions:
    - title: Choose a disclosure with a purpose and a limit
      instructions: Identify what you want the partner to understand and why it matters now. Select the
        amount of detail needed, what you are not ready or required to share and what response you would
        welcome. Distinguish healthy privacy from withholding a material fact that affects the other person’s
        informed choices. Do not use a dramatic disclosure to secure reassurance, prevent a breakup or
        make the other person responsible for your emotional stability.
      checks:
      - The disclosure has a relevant purpose rather than maximum intensity
      - The chosen depth and privacy limit are explicit
      - Privacy is distinguished from concealing a material issue
      - The disclosure is not used as leverage over the partner
    - title: Ask for readiness and share in a bounded way
      instructions: Ask whether now is a suitable time for a short personal conversation and state the
        kind of response you want, such as listening or practical discussion. Share the chosen truth using
        your own experience rather than a demand that the partner feel the same. Pause for questions and
        allow them to say they need time. A partner’s willingness to listen does not create an obligation
        to disclose an equally intimate story in return.
      checks:
      - Timing and readiness are checked before sharing
      - The requested response mode is stated
      - The account stays with your experience and chosen scope
      - The partner is not required to reciprocate disclosure at the same depth
    - title: Check understanding and preserve boundaries afterward
      instructions: Ask what the partner understood and correct one important misunderstanding without
        insisting on a perfect emotional response. Agree whether any practical next step or later conversation
        is wanted. Confirm privacy expectations about what may be repeated to others, while recognizing
        that safety or legal duties can limit promises of secrecy. Review whether the exchange increased
        accurate mutual knowledge rather than simply emotional intensity.
      checks:
      - Understanding is checked and a misunderstanding can be corrected
      - Any next step is mutually agreed and bounded
      - Privacy expectations do not include impossible promises of secrecy
      - Accurate knowledge is distinguished from emotional intensity
    adaptation: Use writing, a slower conversation, a qualified support setting or a smaller topic. Do
      not disclose to someone who uses vulnerability to threaten, ridicule or control you. A safe decision
      not to share may be appropriate, but it is not counted as a completed disclosure.
    review: What did the partner understand more accurately, and did the chosen depth respect both your
      privacy and their capacity to receive it?
    examples:
      supportive: The participant explained a current uncertainty, asked for listening and learned that
        the partner had mistaken distraction for disinterest.
      mixed: The topic was relevant, but too many details overwhelmed the exchange, so a shorter follow-up
        was agreed.
      contradictory: Disclosure was demanded as proof of love or used to make the partner responsible
        for preventing emotional collapse.
      inconclusive: A vague statement of being vulnerable was recorded without a relevant truth, readiness
        check or understanding review.
  '18.06':
    title: Update one relationship practice for the stage you are actually in
    goal: Recognize how formation, commitment, consolidation, strain, repair, renewal or ending changes
      what a partnership needs, without forcing every relationship through a fixed sequence.
    scope_note: Stage language is an organizing aid, not a diagnosis or a universal timetable. A relationship
      may revisit several conditions at once, and ending can be a legitimate outcome.
    burden: Twenty minutes to compare past and present needs, one willing conversation and a review after
      one small trial.
    setup: 'Default change: an established couple moves from flexible schedules to a season of caregiving
      or demanding work. Use a before-and-now page covering time, communication, affection, practical
      responsibilities and future expectations. No partner is required; a fictional case can be used for
      design rehearsal.'
    actions:
    - title: Describe the changed conditions rather than declaring a stage verdict
      instructions: 'Identify what has actually changed and which stage-like needs are present: learning
        each other, making promises, maintaining routines, coping with strain, repairing a rupture, renewing
        connection or considering an ending. Compare one former expectation with current capacity. Distinguish
        a temporary pressure from a broken agreement or deeper mismatch, and note what information would
        help tell the difference.'
      checks:
      - Actual changed conditions support the review
      - Multiple stage-like needs can coexist
      - A former expectation is compared with current capacity
      - Temporary strain broken agreement and mismatch are distinguished
    - title: Negotiate one practice that fits the current season
      instructions: Discuss the changed need with the partner and choose a small adjustment, such as replacing
        a long weekly outing with a protected short conversation and a later review date. State what the
        adjustment preserves, what it gives up and what must not become permanent by default. Include
        the possibility that repair requires a concrete accountability step rather than merely more pleasant
        time together.
      checks:
      - The adjustment responds to a mutually recognized changed need
      - What is preserved and sacrificed is explicit
      - A temporary arrangement has a review date
      - Repair is not confused with avoiding the unresolved rupture
    - title: Try the adjustment and decide whether to keep, revise or end it
      instructions: Use the agreed practice once or over the short agreed interval, then compare both
        people’s experience with the intended purpose. Ask whether it reduced strain, improved connection,
        concealed a problem or proved impractical. Retain, revise or stop the arrangement with a reason.
        If the relationship itself may need to end, identify appropriate safety, care and legal support
        rather than treating renewal as the only successful answer.
      checks:
      - The agreed adjustment is actually tried
      - Both people’s experience informs the review
      - Concealed problems and impracticality remain valid outcomes
      - Renewal is not treated as the mandatory resolution
    adaptation: Use asynchronous communication, separate reflection or suitable professional support.
      Do not conduct a mutual-stage exercise where coercion or abuse makes negotiation unsafe. A fictional
      trial plan is not evidence of a relationship adapting in practice.
    review: Which expectation needed to change because conditions changed, and what did the trial reveal
      that a generic relationship-stage label would have missed?
    examples:
      supportive: The couple tried a shorter protected check-in during a care-intensive month and kept
        a review date instead of treating reduced time as permanent neglect or a permanent solution.
      mixed: The routine became easier, but the underlying broken promise remained unresolved and was
        assigned a separate repair conversation.
      contradictory: A stage label was used to normalize abuse or pressure someone to remain until the
        relationship supposedly matured.
      inconclusive: The relationship was labeled as being in a phase without changing or testing any expectation.
  '18.07':
    title: Make one shared responsibility explicit from noticing to completion
    goal: Negotiate roles, resources, privacy and decision authority so that a shared task is not silently
      assigned through stereotype, resentment or default availability.
    scope_note: This is a voluntary adult partnership agreement on an ordinary task. Sexual consent, personal
      medical decisions, legal rights and essential care are not chores to allocate or barter.
    burden: Twenty minutes to map expectations, a twenty-minute discussion and a review after one complete
      task cycle.
    setup: 'Default task: arranging a shared meal for visiting relatives. Use nine headings to surface
      connected expectations: money, home, time, sex or intimacy boundaries, family, career, caregiving,
      privacy and decision authority. Mark irrelevant or private areas as not part of this task rather
      than forcing disclosure.'
    actions:
    - title: Map the visible task and its hidden decisions
      instructions: List noticing the need, checking availability, deciding the menu, confirming dietary
        information with guests, obtaining supplies, preparing and cleaning up. Identify who currently
        carries each step and who has authority over cost, invitation and private information. Scan the
        nine expectation areas for a relevant conflict, such as work time or family pressure, without
        assuming gender or income determines responsibility.
      checks:
      - The task includes planning and follow-through rather than only execution
      - Current owners and decision authority are visible
      - Relevant expectation areas and explicit nonapplicability are recorded
      - Roles are not assigned from gender income or default availability
    - title: Agree an end-to-end owner and fair support conditions
      instructions: Choose who owns each complete part, what support is available, the budget or resource
        limit and what done means. For example, one person may own guest coordination and another preparation,
        with cleanup shared by an agreed time. State how either person can renegotiate if work or care
        demands change. No agreement about chores creates entitlement to sex, access to devices or control
        over the other person’s private decisions.
      checks:
      - Ownership includes noticing deciding and completing the agreed part
      - Resources support and done criteria are explicit
      - Changed capacity has a renegotiation route
      - Personal consent and privacy are not traded for task contribution
    - title: Run one cycle and review invisible work and fairness
      instructions: Carry out the agreed meal or another actual shared task. Afterward compare what each
        person did with the intended division, including reminders, emotional coordination and last-minute
        rescue. Ask whether the arrangement felt workable and fair given capacity rather than requiring
        identical minutes. Revise one unclear interface or unassigned step and record the next review
        trigger.
      checks:
      - A full task cycle occurs
      - Reminders coordination and rescue work are included in the comparison
      - Fairness considers capacity rather than identical units alone
      - One unclear responsibility is revised for the next cycle
    adaptation: Use writing, a smaller task or external support when illness, disability or care demands
      constrain contribution. People with unequal capacity retain equal dignity. Formal financial, legal
      or care obligations should be clarified through appropriate qualified advice.
    review: Who carried the work of noticing and coordinating, and what did the actual cycle reveal that
      the original division of chores concealed?
    examples:
      supportive: The partners assigned guest coordination, preparation and cleanup explicitly, then discovered
        and reassigned the hidden task of confirming dietary needs.
      mixed: Visible chores were balanced, but one person still had to remind everyone and the ownership
        agreement was revised.
      contradictory: A person used greater income or completed chores to claim sexual access or control
        over the partner’s privacy.
      inconclusive: Responsibilities were discussed in general terms without an owner, resource limit,
        complete cycle or review.
  '18.08':
    title: Repair one recurring partnership rupture with a behavior change you can verify
    goal: Separate the immediate rupture from a recurring pattern, acknowledge harm and test a concrete
      change rather than equating an apology or renewed warmth with repair.
    scope_note: Use a safe adult relationship and an ordinary disagreement. Abuse, intimidation and coercive
      control require specialist safety support, not a mutual communication exercise or pressure to forgive.
    burden: Fifteen minutes to prepare, a twenty-minute repair conversation and a review at the next comparable
      opportunity.
    setup: 'Default rupture: one partner repeatedly changes a shared plan without telling the other. Prepare
      a factual event record, the effect, your own contribution if any, the requested repair and a realistic
      notification change. Do not collect a dossier of every past mistake.'
    actions:
    - title: Describe the rupture and stop the escalation loop
      instructions: Name the specific changed plan and its effect without expanding immediately to always
        or never. Identify the repeated sequence if there is evidence for one, including the cue that
        leads to accusation, defense or withdrawal. Use a pause with a return time when needed and check
        whether both people can discuss the issue safely. Distinguish a small bid for connection from
        a demand to ignore the harm.
      checks:
      - The event and effect are specific
      - A recurring sequence is based on observations rather than a global accusation
      - Escalation is paused with a return or safe ending
      - Warmth is not used to erase the substantive issue
    - title: Make accountability and the requested repair concrete
      instructions: The person responsible names what they did, acknowledges the effect and states what
        can be repaired now, without adding a demand for immediate forgiveness. The other person may clarify
        the impact and choose whether they are ready to continue. Agree a behavior change such as notifying
        before changing the plan or explicitly confirming a new time. Do not require equal blame when
        responsibility is unequal.
      checks:
      - Responsibility is specific and does not require equal blame
      - Immediate repair and future prevention are separate
      - Forgiveness is not demanded as proof of cooperation
      - The behavior change is observable and within the responsible person’s control
    - title: Check the next comparable opportunity and accept the result
      instructions: At the next ordinary plan change, check whether notification and confirmation occurred
        as agreed. Record both successful follow-through and recurrence. Discuss what the result means
        for trust and whether another adjustment, a firmer boundary or qualified support is needed. If
        repair repeatedly does not occur, name that clearly rather than treating each apology as a fresh
        reset with no history.
      checks:
      - The change is checked at a real comparable opportunity
      - Success and recurrence are both retained
      - Trust is informed by conduct rather than apology alone
      - Repeated non-repair can lead to a boundary or support decision
    adaptation: Use writing or an appropriate qualified professional when both people freely agree and
      the setting is safe. Do not pursue a joint repair session with an abusive person as a requirement
      for leaving or seeking help. A fictional case tests repair reasoning only.
    review: What behavior changed after the apology, and what would count as evidence that repair is not
      occurring despite good intentions or affectionate moments?
    examples:
      supportive: The responsible partner acknowledged the missed notice, sent the next change before
        acting and confirmed the new plan, giving a concrete basis for cautious trust.
      mixed: The apology was clear, but the next comparable event repeated the same behavior and required
        a different boundary rather than another reset.
      contradictory: Forgiveness was demanded, blame was forced to be equal or abuse was reframed as a
        shared communication failure.
      inconclusive: The couple felt closer after talking but no observable repair or prevention step was
        agreed.
  '18.09':
    title: Rehearse consent decisions without making sexual activity the assignment
    goal: Recognize freely given, informed, specific, ongoing and reversible adult consent, and choose
      stopping or clarification whenever willingness or capacity is uncertain.
    scope_note: This is a nonsexual scenario and communication exercise for adults. It does not provide
      legal advice, establish someone’s capacity or require any sexual contact, disclosure or demonstration.
    burden: Twenty minutes to classify cases and ten minutes to rehearse clear asking, stopping and respectful
      follow-up.
    setup: 'Use four fictional adult cases: a person agrees to one form of closeness but not another;
      a previously willing person now says stop; a person says yes after repeated pressure; and a person
      is asleep or too impaired to make a clear choice. No real contact is initiated to test the cases.'
    actions:
    - title: Identify what is agreed and what makes agreement invalid or uncertain
      instructions: For each case, state the specific activity under discussion, what was actually communicated,
        whether the choice is free and whether the person can presently make it. A prior relationship,
        earlier agreement, gift, status, silence or lack of resistance does not supply current permission.
        In the pressure and incapacity cases, choose not to proceed; do not search for wording that would
        turn an unsafe situation into technical consent. Verify local legal requirements through qualified
        sources when needed.
      checks:
      - Each case separates specific communication from assumptions
      - Pressure and impaired capacity prevent proceeding
      - Past agreement status gifts and silence are not treated as permission
      - Legal capacity questions are not settled by this worksheet
    - title: Practice asking and stopping in ordinary words
      instructions: Alone or with a willing adult role-play partner, rehearse a neutral question, a freely
        stated no and a changed-mind response. Practice answering no or stop with acknowledgment and stopping,
        not bargaining, sulking or asking for a justification. Use no touching in the rehearsal. Include
        a check-in that makes changing one’s mind easy rather than demanding repeated reassurance that
        the other person will continue.
      checks:
      - Asking refusal and withdrawal are rehearsed without contact
      - A no or stop receives immediate respectful acceptance
      - No reason persuasion or emotional penalty is demanded
      - The check-in preserves the ability to change one’s mind
    - title: Connect consent to honesty, health and consequences
      instructions: 'Write the topics that require an honest adult conversation before relevant intimacy:
        expectations about commitment, material health information, contraception or infection prevention
        where applicable, privacy and the consequences of a changed plan. Assign medical or legal uncertainties
        to appropriate qualified help rather than guessing. Review how a person can leave, pause or seek
        support without retaliation. Keep private sexual history and health details outside the application.'
      checks:
      - Consent is connected to material honesty and expectations
      - Health and prevention questions are identified without self-prescription
      - Pause exit and support remain available without retaliation
      - Private sexual and medical details are not stored as evidence
    adaptation: Use clear accessible communication, interpretation or AAC suitable to the situation; do
      not infer consent from a communication disability. Uncertainty means pause, not pressure. Survivors
      or anyone facing coercion may use specialist support and skip personal scenarios entirely.
    review: At which point did the appropriate action become stopping rather than obtaining a different
      answer, and how did honesty and consequences matter beyond the word yes?
    examples:
      supportive: The participant correctly treated the pressured and impaired cases as no-go, rehearsed
        accepting a changed mind and identified separate health and expectation conversations.
      mixed: The cases were classified correctly, but the first script still asked why after a refusal
        and was revised to remove pressure.
      contradictory: A prior relationship or reluctant yes was treated as entitlement, or sexual contact
        was used as a training requirement.
      inconclusive: Consent terms were repeated without applying them to pressure, withdrawal, specificity
        and capacity.
  '18.10':
    title: Hold an adult intimacy conversation before making assumptions about comfort or health
    goal: Discuss desire, boundaries, comfort, pleasure, prevention and support collaboratively, with
      room for uncertainty, difference and choosing not to be sexually active.
    scope_note: The assignment is a voluntary conversation or fictional rehearsal, not sexual performance.
      It provides no medical diagnosis, technique prescription or guarantee of pregnancy or infection
      prevention.
    burden: Fifteen minutes of private preparation, a twenty-minute willing conversation and one follow-up
      or qualified question where needed.
    setup: For adults in a safe relationship, choose a calm nonsexual time to discuss what each person
      would want to understand before intimacy. A single person may use a fictional adult case. Prepare
      headings for desire, yes/no/maybe boundaries, comfort, pleasure, contraception, infection prevention,
      difficulties and aftercare or later check-in.
    actions:
    - title: Prepare preferences and questions without creating a performance standard
      instructions: Privately note what you are comfortable discussing and what remains uncertain under
        each heading. Separate a desire from an obligation, a boundary from a criticism and a medical
        question from a personal preference. Include the option of no sexual activity or nonsexual affection.
        Do not infer a partner’s preferences from gender, orientation, past behavior or media, and do
        not set a pleasure or orgasm outcome as proof of successful participation.
      checks:
      - All eight discussion areas have a preference question or explicit private limit
      - Desire obligation boundary and medical uncertainty are distinguished
      - No sexual activity remains a legitimate choice
      - No stereotype or performance outcome substitutes for the person’s account
    - title: Exchange information and identify prevention decisions that need qualified advice
      instructions: Ask whether the conversation is welcome, then share one preference and one boundary
        at a time, listening without bargaining. Discuss how either person can pause and what a comfortable
        check-in afterward would mean. Where pregnancy or STI risk is relevant, distinguish contraception
        from infection prevention and identify questions for a qualified clinician about suitable methods,
        testing or symptoms. Do not assume that one method addresses every risk or change prescribed care
        as part of the exercise.
      checks:
      - The exchange is voluntary and paced for both adults
      - Boundaries are heard without bargaining
      - Pregnancy prevention and infection prevention are distinguished
      - Method suitability testing and symptoms are routed to qualified advice
    - title: Confirm what is understood and follow up on one uncertainty
      instructions: Summarize the agreed communication boundaries and the topics that remain unresolved,
        without treating the discussion as advance permission for future activity. Take one appropriate
        next step, such as asking a clinician a general prevention question or agreeing another conversation,
        and retain the actual answer or pending status. If pain, coercion or distress is present, prioritize
        suitable care or safety support rather than trying harder to perform intimacy.
      checks:
      - Shared understanding and unresolved topics are stated separately
      - The conversation is not treated as blanket future consent
      - One uncertainty receives a real follow-up or remains explicitly pending
      - Pain coercion and distress lead to care or safety rather than performance pressure
    adaptation: Use writing, accessible communication, a qualified sexual-health professional or a fictional
      scenario. No partner is owed private history beyond what is needed for informed and safe choices,
      and no one must disclose in an unsafe context. Keep all substantive intimate details outside the
      application.
    review: What assumption became an explicit preference, boundary or medical question, and how did the
      conversation make room for comfort and pleasure without turning either into a demand?
    examples:
      supportive: The adults clarified different preferences, agreed a pause signal and asked a clinician
        about prevention without treating the talk as consent to later activity.
      mixed: The conversation covered desire but avoided a relevant health uncertainty, so that issue
        remained open before any decision.
      contradictory: A partner’s pleasure was treated as a performance target or a boundary was negotiated
        away through pressure.
      inconclusive: A checklist was completed privately and reported as mutual sexual communication without
        the other person’s participation.
  '18.11':
    title: Clarify one relationship promise before treating an assumption as betrayal
    goal: Make exclusivity, loyalty, privacy and transparency expectations explicit, then act consistently
      with the promises actually made rather than relying on surveillance or unspoken rules.
    scope_note: Use a safe adult relationship or fictional case. This does not prescribe monogamy or another
      relationship form, excuse dishonesty, require password sharing or determine legal rights.
    burden: Twenty minutes to prepare, a twenty-minute willing conversation and a review at one relevant
      ordinary opportunity.
    setup: 'Default uncertainty: partners have different assumptions about what private messaging with
      former partners means. Prepare three columns: explicitly agreed, assumed and needing discussion.
      Include the possibility that a material agreement already exists and has been broken; clarification
      must not erase that history.'
    actions:
    - title: Separate actual promises from expectations that were never stated
      instructions: 'List the relevant commitments in neutral language, including exclusivity, contact
        boundaries, privacy and what information each person has agreed to share. Mark the source of each
        expectation: explicit agreement, shared convention or your own assumption. Identify any known
        breach without redefining the promise after the fact. Consider what loyalty means in conduct and
        what privacy remains legitimate even in a committed relationship.'
      checks:
      - Explicit promises and assumptions are distinguished
      - Exclusivity loyalty privacy and transparency are considered
      - An existing breach is not erased by relabeling the agreement
      - Privacy is not automatically equated with secrecy or wrongdoing
    - title: Negotiate a clear boundary without demanding surveillance
      instructions: Discuss the uncertain area and ask what each person considers respectful, misleading
        or incompatible with the chosen relationship. State a concrete boundary and a change-notification
        rule rather than demanding access to all messages, devices or location. Acknowledge that some
        preferences may be incompatible and cannot be solved through monitoring. No agreement gives anyone
        ownership of another person or removes ongoing consent.
      checks:
      - The boundary concerns concrete conduct and information needs
      - Changes to commitments require an explicit conversation
      - Surveillance is not used as the default proof of trust
      - Incompatibility and ongoing autonomy remain possible
    - title: Match one real action to the agreement and review repair needs
      instructions: At a relevant ordinary opportunity, follow the clarified promise or disclose that
        you cannot freely agree before acting contrary to it. If a breach has occurred, identify truthful
        acknowledgment, appropriate repair and any qualified support needed, without demanding immediate
        forgiveness. Review whether the agreement is understood and sustainable; one compliant action
        is not proof that all trust has been restored.
      checks:
      - Conduct follows the actual agreement or a prior honest renegotiation
      - A breach receives acknowledgment rather than concealment
      - Repair does not demand immediate forgiveness
      - One action is not generalized into complete restored trust
    adaptation: Use written agreements in plain language or suitable professional support when both people
      freely choose it. Do not use this exercise to negotiate under threats or coercion. Legal, health
      and safety consequences may require separate qualified guidance.
    review: Which promise became clearer, and did your next action support trust through honesty rather
      than through control over the other person’s privacy?
    examples:
      supportive: The partners distinguished an unspoken assumption from an explicit commitment and agreed
        a contact boundary without requiring device access.
      mixed: The boundary was clear but one person could not freely accept it, revealing a real compatibility
        issue instead of a monitoring problem.
      contradictory: Password sharing or constant tracking was demanded as proof of fidelity, or a prior
        breach was rewritten out of the record.
      inconclusive: Trust was discussed as a feeling without identifying any promise, conduct or change-notification
        rule.
  '18.12':
    title: Plan a relationship ending around safety, clarity and real obligations
    goal: End or restructure an adult relationship without unnecessary ambiguity, cruelty or retaliation
      while protecting dependents and honoring legal and practical responsibilities.
    scope_note: This is a planning and support exercise, not advice to end a specific relationship or
      a substitute for legal, domestic-abuse or clinical guidance. A safe ending may not involve direct
      contact.
    burden: Thirty minutes to map responsibilities, one qualified or trusted support consultation when
      needed and one safe bounded next step.
    setup: 'Use a fictional case unless a real ending is already being considered safely: two adults decide
      not to continue a relationship but share a lease, belongings and care responsibilities. Prepare
      headings for safety, communication, housing or property, money, dependents, privacy, grief and support.
      Do not alter assets, access or care arrangements as a practice stunt.'
    actions:
    - title: Separate the relationship decision from obligations that continue
      instructions: State what is ending or changing and what remains your responsibility. Identify immediate
        safety concerns, dependent care, shared housing or property, financial commitments and legal questions
        that require qualified local advice. Distinguish a personal boundary from a right to remove someone’s
        access, empty shared resources or withhold essential care. Do not assume that ending emotional
        commitment automatically resolves practical or legal obligations.
      checks:
      - The ending is distinguished from continuing responsibilities
      - Safety dependents housing property and financial questions are considered
      - Legal uncertainties are assigned to qualified local advice
      - No unilateral deprivation of care or resources is treated as a relationship boundary
    - title: Choose a safe communication and transition route
      instructions: For the low-risk fictional case, draft a clear statement that does not leave false
        hope for the sake of avoiding discomfort, and specify the next practical discussion separately.
        Choose timing, medium and support appropriate to safety; direct conversation is not mandatory
        where abuse or retaliation is possible. Agree or seek professional help with handoffs, belongings
        and dependent arrangements, and avoid using children, friends or public posts as messengers or
        leverage.
      checks:
      - The message is clear without unnecessary humiliation or false hope
      - Communication mode follows safety rather than etiquette alone
      - Practical handoffs are separated from emotional argument
      - Dependents and third parties are not used as leverage or messengers
    - title: Take one supported step and make room for grief without retaliation
      instructions: Carry out one safe step within your authority, such as obtaining legal advice, confirming
        an agreed property handoff or contacting a specialist advocate. Record what actually occurred
        and what remains pending; drafting an ending is not the same as completing one. Plan ordinary
        support and space for grief without monitoring the other person, publishing private details or
        creating new contact to relieve your distress. Review whether dependents’ immediate needs remain
        covered.
      checks:
      - A safe authorized step or support contact actually occurs
      - Planning legal consultation and completed separation remain distinct
      - Grief support does not become surveillance or unwanted contact
      - Dependent needs are checked through the transition
    adaptation: Use a qualified mediator only where appropriate and safe, legal representation, accessible
      communication or specialist safety planning. Do not contact an unsafe person or change a court-ordered
      arrangement based on this exercise. Immediate danger requires appropriate emergency help.
    review: What became clearer and safer, and which responsibilities remained real even after the emotional
      relationship changed?
    examples:
      supportive: The adults separated the breakup message from lease and care questions, sought appropriate
        advice and completed one agreed practical handoff.
      mixed: The message was drafted, but safety and housing questions remained unresolved, so direct
        contact was deferred for specialist support.
      contradictory: The ending involved threats, asset deprivation, public humiliation or using a dependent
        to punish the other person.
      inconclusive: A clear emotional decision was treated as if it automatically settled legal, housing
        and caregiving responsibilities.
  '18.13':
    title: State your chosen relationship commitments without degrading another lawful consensual path
    goal: Distinguish personal commitments, orientation and relationship structure from judgments of human
      dignity, while keeping honesty, consent and consequences applicable across forms.
    scope_note: This is a values and language exercise for adults, not a requirement to change orientation,
      relationship form, religious belief or single status. Legal recognition and obligations vary by
      location.
    burden: Twenty minutes to compare fictional cases and ten minutes to write and review a personal statement.
    setup: 'Use four fictional adults or groups: a person choosing single life, an exclusive couple, adults
      discussing a consensually nonexclusive structure and a person whose orientation differs from yours.
      The task is to state your own commitments and recognize common duties without assuming that every
      arrangement is suitable for you.'
    actions:
    - title: Separate identity, chosen structure and actual conduct
      instructions: For each case, identify what is known about identity or structure and what remains
        unknown about honesty, consent, care and responsibility. Do not infer trustworthiness or health
        from the label alone. Distinguish your personal or religious commitments from a claim that people
        on another lawful consensual path have less dignity. Mark legal questions, such as recognition
        or dependent rights, for current qualified local information rather than a universal assumption.
      checks:
      - Identity structure and conduct are distinguished in all four cases
      - Honesty and care are not inferred from labels alone
      - Personal commitments do not become a hierarchy of human dignity
      - Legal recognition and obligations remain jurisdiction-specific questions
    - title: Write a commitment statement with boundaries and common duties
      instructions: 'State the form of relationship or single life you currently choose or remain uncertain
        about, what promises it entails and what you could not freely agree to. Add the duties you recognize
        across forms: truthful material information, voluntary informed consent, respect for boundaries
        and responsibility for affected dependents or commitments. Avoid a statement that requires others
        to adopt your path before you will treat them respectfully.'
      checks:
      - Your chosen path or principled uncertainty is explicit
      - Promises and personal boundaries are concrete
      - Common duties remain applicable across different forms
      - Respect is not conditional on another person adopting your choice
    - title: Test the statement against a disagreement and revise contemptuous language
      instructions: Imagine a friend choosing a different lawful consensual arrangement. Write a response
        that can name a real disagreement or incompatibility without insults, stereotypes or a demand
        for private details. Ask a willing reader or use delayed self-review to identify language that
        confuses I cannot choose this with those people are lesser. Revise that language while retaining
        your actual boundary; tolerance does not require joining the arrangement.
      checks:
      - A genuine disagreement can remain in the response
      - No private disclosure or participation is demanded
      - Contempt is distinguished from a personal boundary
      - The revision preserves both integrity and equal dignity
    adaptation: Use a fictional comparison only, especially where disclosure of orientation or relationship
      status could create danger. No public statement or coming-out action is required. Where coercion,
      exploitation or unlawful conduct is involved, do not hide it behind a diversity label.
    review: Could you state what you choose and refuse without making another adult’s lawful consensual
      difference a reason to deny their dignity?
    examples:
      supportive: The participant clearly affirmed a personal commitment to exclusivity while recognizing
        that honesty and consent also matter in other lawful adult arrangements.
      mixed: The statement was respectful but vague about personal boundaries, so it was revised to say
        what the person could not freely agree to.
      contradictory: A relationship label was used either to dehumanize people or to excuse coercion and
        broken commitments.
      inconclusive: The exercise produced a generic acceptance slogan without clarifying any actual commitment,
        boundary or common duty.
  '18.14':
    title: Clarify reproductive intentions before uncertainty becomes an assumed agreement
    goal: Discuss current wishes about children, timing, pregnancy prevention, fertility uncertainty and
      responsibility while preserving each adult’s bodily autonomy and the right to remain unsure.
    scope_note: This is an adult communication and care-question exercise, not fertility prediction, contraceptive
      prescribing or a requirement to want children, attempt pregnancy or undergo testing.
    burden: Twenty minutes of private reflection, a twenty-minute willing conversation and one appropriate
      medical or practical follow-up.
    setup: 'Default case: two adult partners have said maybe someday about children but have not discussed
      what that means. Prepare headings for current desire, timing, contraception where relevant, pregnancy
      possibility, fertility uncertainty, responsibilities and unresolved differences. A single person
      may use a private or fictional plan without seeking a partner.'
    actions:
    - title: State present intentions and separate them from predictions
      instructions: Privately distinguish want children, do not want children, uncertain and conditional
        wishes, with any current timing boundary. Note the difference between a wish and an assumption
        that pregnancy will or will not occur. Identify what health, age, anatomy, treatment, access or
        life circumstances may require qualified information, without inferring fertility from appearance,
        regular cycles or a past outcome. Do not promise future parenthood merely to preserve the relationship.
      checks:
      - Current wishes uncertainty and timing are stated honestly
      - Desire is distinguished from a prediction of fertility or pregnancy
      - Medical uncertainties are identified without self-diagnosis
      - A future promise is not made to avoid a present incompatibility
    - title: Compare intentions and allocate discussion responsibilities, not bodily control
      instructions: At a calm agreed time, share current intentions and ask the partner to explain theirs.
        Discuss who will obtain reliable contraception or fertility information, how costs and appointments
        might be supported and what conversations would be needed if circumstances changed. Make clear
        that agreement about a relationship does not transfer control over another person’s body. A major
        difference about children is not solved by pressure, contraceptive interference or assuming one
        person will eventually change.
      checks:
      - Both people’s current intentions are heard without pressure
      - Information practical support and responsibility are discussed
      - Bodily autonomy and voluntary medical choice remain explicit
      - A fundamental difference is not hidden behind an assumed future change
    - title: Follow up on one uncertainty and record what remains unresolved
      instructions: Choose one appropriate next step, such as a clinician discussion about suitable prevention
        or fertility evaluation, a practical care-capacity conversation or a later date to revisit uncertainty.
        Obtain the information or make the actual inquiry rather than merely bookmarking it. Summarize
        the current shared understanding and the unresolved points; a booked appointment is not a medical
        answer, and no test or method can be treated as a universal guarantee.
      checks:
      - One relevant uncertainty receives an actual inquiry or action
      - Booking inquiry and clinical advice are distinguished
      - Shared understanding and unresolved differences remain separate
      - No fertility prediction or prevention guarantee is invented
    adaptation: Use separate reflection, accessible communication or qualified counseling when appropriate
      and freely chosen. People may choose single life, no children, adoption or other lawful routes;
      none removes the need for honest expectations and relevant medical or legal guidance. Coercion requires
      safety support, not another negotiation.
    review: What had each person been assuming, and which difference or medical uncertainty must remain
      explicit before a responsible next decision can be made?
    examples:
      supportive: The partners discovered different meanings of someday, clarified current prevention
        questions and sought medical information without promising that either person would change their
        wishes.
      mixed: The conversation improved, but one person remained uncertain and the plan kept that uncertainty
        visible rather than treating it as consent to parenthood.
      contradictory: A partner pressured pregnancy, interfered with contraception or used a fertility
        assumption to dismiss the other person’s choice.
      inconclusive: The couple repeated that they wanted to be on the same page without discussing timing,
        prevention, uncertainty or responsibility.
