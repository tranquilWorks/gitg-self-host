name: Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Django, and pytest
    runs-on: ubuntu-24.04
    # Run 33948198395 passed pytest but reached 120 minutes during readiness.
    # Allow the remaining full-corpus gates to finish on slower runners.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify-manifest.py
      - run: make lint PYTHON=python
      - run: python scripts/author_full_competency_frontier.py --check
      - run: make test PYTHON=python
        env:
          PYTEST_ADDOPTS: "-n 4 --dist=load --maxschedchunk=1"
      - run: make pilot-check PYTHON=python
      - run: make curriculum-check PYTHON=python
      - run: make competency-evidence-check PYTHON=python
      - run: make catalog-governance-audit-check PYTHON=python
      - run: make composite-scoring-catalog-check PYTHON=python
      - run: make composite-scoring-check PYTHON=python
      - run: make applicability-coverage-check PYTHON=python
      - run: make assessment-calibration-check PYTHON=python
      - run: make assessment-calibration-collection-check PYTHON=python
      - run: make assessment-calibration-analysis-check PYTHON=python
      - run: make context-check PYTHON=python
      - run: make personal-os-check PYTHON=python
      - run: make context-priority-check PYTHON=python
      - run: make m6c-pilot-check PYTHON=python
      - run: make m6d-01-check PYTHON=python
      - run: make m6h-weekly-check PYTHON=python
      - run: make m6h-operations-check PYTHON=python

  browser:
    name: Playwright core journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: make e2e PYTHON=python
      - name: Retain browser diagnostics and walkthrough
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Docker Compose deployment drill
    runs-on: ubuntu-24.04
    # Run 34770876994 hit the one-hour limit before backup restoration.
    # Keep every recovery check and allow time for repeated corpus verification.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - run: make compose-smoke

  pilot-ready:
    name: Pilot readiness gate
    if: always()
    needs:
      - quality
      - browser
      - compose
    runs-on: ubuntu-24.04
    steps:
      - name: Require quality, browser, and deployment verification
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$COMPOSE_RESULT" = success

  publish:
    name: Publish verified container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pilot-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified revision
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/tranquilworks/gitg-self-host:latest
            ghcr.io/tranquilworks/gitg-self-host:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull and validate the published image
        env:
          IMAGE: ghcr.io/tranquilworks/gitg-self-host@${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint python "$IMAGE" manage.py validate_canonical_content
          printf 'Published and pulled `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
