name: Source repair diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/source-repair-capture.yml'

permissions:
  contents: read

jobs:
  source-repair:
    if: github.event.pull_request.number == 80 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/m6k-six-more-source-consolidation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff==0.16.7'
      - name: Apply only the locally verified test repairs
        shell: bash
        run: |
          python -m ruff format tests/test_m6k_*sources.py
          python -m ruff check --fix tests/test_m6k_*sources.py || test "$?" -eq 1
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/test_m6k_models_information_execution_sources.py')
          s = p.read_text()
          old = 'second = lambda n: model(n) + max(0, n - 6)'
          assert old in s
          s = s.replace(old, 'def second(n):\n            return model(n) + max(0, n - 6)')
          s = s.replace("f\"| {day} | {r['start']}–{r['end']} | {r['activity']} | {r['minutes']} | {r['category']} | {r['energy']} |\",", "f\"| {day} | {r['start']}\\u2013{r['end']} | {r['activity']} | \"\n                    f\"{r['minutes']} | {r['category']} | {r['energy']} |\",")
          s = s.replace("{r['start']}–{r['end']}", "{r['start']}\\u2013{r['end']}")
          s = s.replace("f\"| {r['start']}\\u2013{r['end']} | {r['activity']} | {r['minutes']} | {r['category']} |\",", "f\"| {r['start']}\\u2013{r['end']} | {r['activity']} | \"\n                f\"{r['minutes']} | {r['category']} |\",")
          p.write_text(s)
          p = Path('tests/test_m6k_risk_judgment_inference_sources.py')
          s = p.read_text()
          start = s.index('def pilot_criterion(')
          end = s.index('\n\ndef ', start + 1)
          part = re.sub(r'\bl\b', 'layout_l', s[start:end])
          part = re.sub(r'\bu\b', 'layout_u', part)
          s = s[:start] + part + s[end:]
          s = s.replace("f\"| {r['prior']} | {r['t_success']} / {r['t_total']} | {r['c_success']} / {r['c_total']} |\",", "f\"| {r['prior']} | {r['t_success']} / {r['t_total']} | \"\n                f\"{r['c_success']} / {r['c_total']} |\",")
          p.write_text(s)
          p = Path('tests/test_m6k_systems_causes_tradeoffs_sources.py')
          p.write_text(p.read_text().replace('１２', r'\uff11\uff12'))
          PY
          python -m ruff format tests/test_m6k_*sources.py
          python -m ruff check .
          python -m ruff format --check .
          python -m unittest discover -s tests -p '*sources.py' -v
      - name: Verify expected bytes and commit only the bounded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'tests/test_m6k_risk_judgment_inference_sources.py': '832c2fa88d201b6c9967f159afc28aad13f983365320454becf2d286f7fed3d9',
              'tests/test_m6k_reasoning_sources.py': '32feb079cb05a02411ec0279825c0be453710f80aaffd1cd40a1e408a1377def',
              'tests/test_m6k_models_information_execution_sources.py': '04bcd2cf4d6efe07c4f7bd6801ba29874d70cd66feb61c3b2a188fbe5acf6255',
              'tests/test_m6k_evidence_humility_forecasting_sources.py': '52d70d9fc7e66603e694a114edff4ad8af5e95db105075b781daa8b28bf7ebe0',
              'tests/test_m6k_systems_causes_tradeoffs_sources.py': '6ca7a37f942857352ad1e3c09d1d540f2aff35cac677fb0a12a81dfe90c08bdd',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          python scripts/verify-manifest.py --write
          python scripts/verify-manifest.py
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {'MANIFEST.tsv', 'tests/test_m6k_reasoning_sources.py', 'tests/test_m6k_evidence_humility_forecasting_sources.py', 'tests/test_m6k_systems_causes_tradeoffs_sources.py', 'tests/test_m6k_risk_judgment_inference_sources.py', 'tests/test_m6k_models_information_execution_sources.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= allowed, changed - allowed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.tsv tests/test_m6k_*sources.py
          git commit -m 'fix: verify and format all 283 competency source checks'
          git push origin HEAD:refs/heads/codex/m6k-six-more-source-consolidation
          mkdir -p "$RUNNER_TEMP/source-repair"
          git rev-parse HEAD > "$RUNNER_TEMP/source-repair/checkout-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source-repair/verified-repository.tar.gz"
      - name: Retain the exact repaired tracked snapshot
        uses: actions/upload-artifact@v6
        with:
          name: source-verified-snapshot
          path: ${{ runner.temp }}/source-repair/
          retention-days: 3
          if-no-files-found: error
