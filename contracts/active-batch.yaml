acceptance:
- On 14 September 2026 the owner explicitly directed "ignore cicd for now, just vett the quality of the posts" and requested the next six. For PR80 and its exact six-source successor, editorial review, source checks, manifest and scoped-diff verification govern source publication and the already-authorized normal merges. Do not wait for or rerun full application/CI/CD gates for these deliveries; retain their actual failed, cancelled and skipped evidence. This does not waive actual branch protection or authorize deployment, runtime or participant-data changes.
- Fetch full Git history only in the quality checkout so the unchanged pinned-ancestor source regression can inspect its original input; do not alter that test, its baseline revision or its comparison.
- Keep quality timeout exactly 180 minutes; add only pytest-xdist>=3.8,<4 to development requirements and run the complete existing non-browser selection with four workers using load with --maxschedchunk=1. Preserve separate worker test databases, migrations, every test ID/assertion, browser execution and all readiness commands.
- Limit verification workflow changes to increasing the Compose job time budget from 60 to 180 minutes and its explanatory comment, plus full history in the quality checkout and four pytest workers with --dist=load --maxschedchunk=1 in the existing quality test step; retain every command, assertion, gate dependency and required result.
- Align only the deployment-contract test's Compose budget expectation with the owner-approved 180 minutes; retain its quality expectation at 180 and every other assertion.
- Preserve the twenty-one source candidates and every existing test criterion.
- Repair formatting and lint without weakening or skipping checks.
- The temporary same-repository PR80-only workflow may commit exactly the five hash-verified test repairs and regenerated manifest to the existing PR branch, never main. Remove this workflow before merge.
- Export only tracked source and diagnostic results, never credentials, private application data, or untracked state.
- Keep runtime coverage at 108 tailored and 275 pending; source publication is not runtime completion.
- Verify the final manifest, source suite, Ruff, and protected-path identities.
validation:
  local:
  - python -m unittest discover -s tests -p '*sources.py' -v
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  deferred_ci:
  - Full application, browser, Compose and aggregate CI gates are deferred for these source-only deliveries by the owner's 14 September instruction; existing workflow definitions and quality 180-minute limit remain unchanged.
  focused_tests_to_add:
  - Preserve source identities and test criteria
  - Run the seventeen previously unavailable source-text checks
risk:
  class: moderate
  hazards:
  - Source publication mistaken for runtime integration
  - Repair changes assertions or hides failures
  - Automation changes unrelated paths or overwrites another author
  stop_conditions:
  - Any protected-path change
  - Expected repaired hash mismatch
  - Non-fast-forward push or falsely claimed verification
rollback:
  strategy: Revert source-only changes; no database, deployment, live-action, or historical mutation.
evidence:
  output:
  - docs/evidence/M6K-SOURCE-CONSOLIDATION-RETRY.md
  claim_boundary: The owner now explicitly defers CI/CD as a source-publication gate for these two deliveries and requests editorial quality vetting. Owner authorizes merge of PR80 and the next six, plus the bounded full-history quality checkout and four-worker test-runner/development-dependency repair while keeping quality at 180 minutes. All compiler integration, deployment, and formal human-review claims remain separate.
