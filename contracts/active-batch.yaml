acceptance:
- 'Exactly 10.01, 10.02 and 21.03 become individually authored runtime practices: 94 tailored, 289 pending.'
- Each has supplied materials, separate practice/check, observable adverse outcomes, accessible paths
  and scope trace.
- Preserve 383 protocol IDs, 1151 action IDs, parent mappings, completion rules, activation and frozen/retained
  rules; prospective generic primary checks use existing compiler and immutable event snapshots.
- Recovery archive stays byte-exact; prospective content is verified against pinned originals and exact
  compiler output.
- Formal independent, learner, qualified and owner acceptance are not inferred.
- Retain previous program dispositions verbatim as historical evidence; renew only executed software-test
  evidence and dependent proofs after the count assertion changes.
validation:
  local:
  - .venv/bin/python -m pytest tests/test_m6k_learning_craft.py tests/test_tailored_practice_authoring.py
    tests/test_m6k_recovery.py tests/test_m6k_repair_drafts.py tests/test_instructional_content.py tests/test_m6k_review_evidence.py
    -q
  - ./scripts/agent-verify.sh contract
  - make pilot-check curriculum-check competency-evidence-check
  - git diff --check
  required_ci:
  - Ruff Django pytest migration drift and manifest verification
  - all readiness and canonical report gates
  - Playwright core journeys
  - Compose backup restore and recreation
  - aggregate Pilot readiness gate
  focused_tests_to_add:
  - Three actual runtime projections and prospective invariant drift rejection
  - Deliberate-practice prompt/key separation and discriminating checks
risk:
  class: high
  hazards:
  - noun-swapped content is misrepresented as individually authored
  - revised instructions invalidate an ongoing practice
  - source support is overstated as specialist or empirical validation
  - task completion is confused with mastery
  stop_conditions:
  - historical event replay changes
  - assessment or scoring mathematics changes
  - any missing or generic exercise is hidden by the coverage report
  - a required CI gate fails
rollback:
  strategy: Revert the content release before import or restore the verified pre-upgrade backup; never
    reinterpret existing event snapshots.
evidence:
  output:
  - docs/evidence/M6K-LEARNING-CRAFT-RUNTIME.md
  claim_boundary: Authored educational practices and software verification; no automatic human review
    or empirical validation acceptance.
