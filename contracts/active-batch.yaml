acceptance:
- Owner explicitly requested next batch and merge in on 24 September 2026. Preserve twelve-per-report
  cadence and no quality compromise. Continuing source-quality workflow defers CI/CD; explicit normal
  merge authorization overrides the generic target-pr-merge prohibition only for this batch. No protection
  bypass, deployment or runtime integration.
- Exact IDs 16.02–16.13. Preserve all 69 previous additional source companions and 591 source tests. Twelve
  is a reporting batch, not permission to consume the backlog.
- Each competency requires individual conceptual teaching, worked example, complete original fictional
  case, ordered actions and inspectable output, separate later outcomes, three fresh checks and corrective
  answers, supported/harder/real transfer routes, full canonical mapping and inspected primary sources.
- Per-competency author review must check facet coverage, usability, distinctiveness, answer discrimination,
  source limits and unresolved human evidence. Length and tests are not pedagogical validation.
- 16.03 is a frozen legacy companion. Preserve its protocol, actions, evidence fields, ten-day practice,
  seven-day follow-up, completion and replay byte-for-byte. It is not new runtime integration.
- Nonverbal cues remain uncertain; no emotion dictionary, deception detection, eye-contact quota or cultural/neurotype
  stereotype. Perspective hypotheses require voluntary reports and retain contradictions and unknowns.
- Clear expression, audience adaptation, reciprocal conversation, feedback, rhetoric, public delivery,
  causal storytelling, negotiation, conflict repair and warmth require distinct tasks. Comprehension is
  not assent; fictional replies are never actual observer evidence.
- Preserve truth and material burdens across audiences; no coercive persuasion or exploitative leverage.
  Negotiation must allow feasible refusal; conflict practice excludes abuse, threats and compelled shared
  blame. Humor is optional and objections are respected.
- Expected additional source count 81; runtime remains 108 tailored, 275 pending, 383 protocols, 1151
  actions. Formal human/qualified/owner acceptance unchanged.
- Run full source suite, focused Ruff, links, canonical/input hashes, case regressions, manifest and allowed/forbidden
  scope audit. Record exact results and limits.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - ruff format --check tests/test_m6k_communication_influence_sources.py
  - ruff check tests/test_m6k_communication_influence_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Canonical/inherited/legacy integrity
  - Cue and perspective disconfirmation
  - Message fact preservation and comprehension versus acceptance
  - Feedback observation versus proposed solution
  - Rhetorical evidence and ethical burden preservation
  - Talk and story accuracy versus polish
  - Negotiation feasibility and principled refusal
  - Conflict ownership and unconfirmed follow-through
  - Humor response and nonperformative warmth
risk:
