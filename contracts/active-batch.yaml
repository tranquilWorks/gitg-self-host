acceptance:
- Owner asks to continue where competencies left off. Continue the recorded twelve-per-report individual
  quality cadence, source-quality CI/CD deferral and standing normal-merge authorization. No protection
  bypass or deployment.
- Exact IDs 26.05–26.14 and 27.01–27.02; preserve all 225 prior companions and 1078 prior source tests.
- Individually teach each canonical facet with an original worked example, complete fictional inputs,
  ordered actions and inspectable outputs, later packet, three fresh checks and separate corrective answers,
  access/support/harder routes and real-transfer limits.
- Outdoor and journey cases retain current conditions, permissions, navigation, suitable supports, turnaround
  and actual return. Fiction is never route clearance or competence in technical environments.
- Cultural cases separate observation, attributed meaning, inference and unknowns; no invented culture-wide
  norm or permission. Celebration and play retain decline, access, no-cost options and unknown enjoyment.
- Wonder and humor do not demand emotion or displace serious responsibilities. Stewardship requires authorized
  methods, null and incomplete records, feedback and no ecosystem-recovery inference.
- Life architecture maps calendar, environment, resources, relationships, roles and recurrence. Competing-goods
  work protects obligations and compares feasible options, honest sacrifice, reversal and actual outcomes
  without claiming all goods can be maximized.
- 'Canonical classifications, domain-specific formation modes, measurement and absent professional_boundary
  fields remain exact. All source-authoring coverage uses a disjoint canonical-ID partition: 108 implemented
  plus 237 companions = 345, leaving 38 (07:14,08:11,27:13). Runtime remains 108/275/383/1151.'
- Inspect primary sources with narrow claim limits and dated retrieval; review each guide, all 36 answers,
  originality and remaining breadth. Formal A/B/C, independent cold-start, actual learner, qualified and
  owner acceptance remain pending.
- Run all source tests, focused Ruff, links, canonical/current/recovery/contract input hashes, arithmetic
  and chronology checks, exact remaining coverage, manifest and allowed/forbidden-path audit. Application/browser/Compose/CI
  deferred, not passed.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - python -m ruff format --check tests/test_m6k_leisure_life_design_sources.py
  - python -m ruff check tests/test_m6k_leisure_life_design_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Exact canonical and coverage partition
  - Twelve individual cases including incomplete and contrary outcomes
  - Local links and verified source/input bytes
  - Protected predecessor/runtime paths unchanged
risk:
  class: moderate
  hazards:
  - Unsafe outing escalation or invented permission
  - Culture-wide inference or invented participant evidence
  - Leisure converted to an emotion score
  - Unknown or planned action counted as performed
  - Life planning removes obligations or ignores scarce resources
  stop_conditions:
  - Protected-path drift
  - Unresolved material source defect or failing source verification
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this source-only batch; no participant data, migration or deployment is involved.
evidence:
