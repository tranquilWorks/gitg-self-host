acceptance:
- Complete issue 118 Profile History Account presentation and accessible help/share controls.
- Complete issue 119 guided Personal OS fillout summary reuse and compatible route consolidation.
- Preserve authentication ownership CSRF explicit consent signed reuse and immutable versioning.
- Preserve canonical assessment evidence scoring ranking and all later UXA scopes.
validation:
  local:
  - scripts/agent-verify.sh full
  - Relevant browser journeys and compose-smoke where available
  focused_tests_to_add:
  - Profile real-closeout gating and accessible explanations and share.
  - Ordinary versus operator account views and explicit research consent.
  - Personal OS initial fillout summary revision reuse redirects and stale epoch rejection.
  required_ci:
