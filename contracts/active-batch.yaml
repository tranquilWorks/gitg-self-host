  title: Evaluate evidence, update beliefs, and verify forecasts
  goal: Individually author 09.04 through 09.06 as complete source candidates without claiming runtime integration or advancing the verified 108 tailored and 275 pending runtime counts.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/program.json
  - docs/authoring/evidence-humility-forecasting/SCOPE-MAP.md
