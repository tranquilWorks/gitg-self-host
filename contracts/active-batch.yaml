acceptance:
- Owner continuation “next batch please” retains twelve per report, individual quality and prior explicit
  normal merge authorization. Source-quality workflow defers CI/CD. Normal merge authorization overrides
  generic target-pr-merge prohibition for this batch only; no protection bypass, runtime integration or
  deployment.
- Exact IDs 18.06–18.14 and 19.01–19.03. Preserve 105 earlier additional source companions and 707 source
  tests. Scope ends after twelve; no new legacy companion.
- Each competency requires substantive individual teaching, worked example, complete original fictional
  case, ordered actions and inspectable outputs, separate later packet, three fresh cases and corrective
  answers, supported/harder/real transfer routes, full canonical scope/classification/measurement and
  inspected primary or first-party sources.
- Author review checks every facet, depth, usability, distinctiveness, answer discrimination, source limits
  and absent human evidence. Length and automated tests do not establish pedagogy or qualified acceptance.
- All twelve retain role-conditional applicability/normative status. Preserve exact domain-specific professional
  boundaries and measurement preferences. Partnership, sex, parenting, reproduction and caregiving are
  not required life paths.
- Relationship stages are not a fixed sequence; changed capacity does not erase a breach. Shared labor
  includes noticing and follow-through; chores cannot buy sex, privacy access or personal decision authority.
  Repair requires conduct, not compelled forgiveness or equal blame.
- 18.09 is a no-contact adult fictional consent rehearsal. 18.10 is voluntary nonsexual-time conversation
  or fiction, never sexual performance. No private sexual/medical details in app evidence; uncertainty,
  withdrawal, coercion or incapacity means stop, not obtain a technical yes.
- No contraceptive prescribing, fertility prediction, diagnostic assessment or legal conclusion. Separate
  contraception from infection prevention, intentions from predictions, and appointments from clinical
  answers. Use current qualified resources for relevant uncertainties.
- Trust follows actual promises without surveillance or retroactive erasure of a breach. Diversity preserves
  personal commitments and equal dignity without compelled participation, outing or excusing coercion.
- Endings preserve safety, dependents and actual obligations; no forced direct contact, asset deprivation,
  care withdrawal or court-order changes. Family-pattern work uses observed occasions, not diagnoses,
  reconstructed trauma or compulsory reconciliation.
- Parenting live routes require actual authorized caregiving and care-plan consistency. Demonstration,
  accessible choice, warmth and proportionate safety limits replace humiliation or compliance tests. Caregiving
  preserves recipient agency and task-specific authority, safe backups and sustainability; no medication,
  transfer, feeding, clinical or financial authority invented.
- Expected additional source count 117; runtime stays 108 tailored, 275 pending, 383 protocols and 1151
  actions. Formal M6K A/B/C, independent, actual learner, qualified and owner content acceptance remain
  pending.
- Run full source suite, focused Ruff, links, exact canonical/current/recovery hashes, meaningful case
  regressions, manifest and allowed/forbidden scope audit. Record actual results and limitations.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - ruff format --check tests/test_m6k_partnership_family_sources.py
  - ruff check tests/test_m6k_partnership_family_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Exact role-conditional and professional-boundary integrity
  - Temporary adjustment versus unresolved repair
  - Whole-task labor and decision authority
  - Apology versus comparable follow-through
  - Specific, ongoing, voluntary and reversible consent without contact
  - Prevention questions versus performance or clinical claims
  - Existing promises versus assumptions and surveillance
  - Endings versus continuing obligations and safe handoffs
  - Diversity versus forced participation or excused coercion
  - Reproductive wishes versus predictions and bodily control
  - Observed family routes versus inferred trauma
  - Authorized parenting, support adjustment and non-coercive participation
  - Care recipient agency, transport timing, backup authority and clinical uncertainty
risk:
  class: moderate
  hazards:
  - Generic repetition erasing individual scope
  - Coerced intimacy, disclosure, reproduction, repair or reconciliation
  - Unsupported medical/legal/developmental conclusions
  - Unauthorized care, financial control or unsafe handoff
  - Invented participant evidence or formal acceptance
  stop_conditions:
  - Protected-path drift
  - Unresolved material source defect or failing source verification
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this source-only batch; no participant data, migration or deployment is involved.
evidence:
