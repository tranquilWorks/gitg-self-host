schema_version: 1
batch:
  id: M6L-08-EMPIRICAL-VALIDATION
  title: Multi-cycle pilot preparation and bounded evidence workflow
  goal: Prepare an executable consented multi-cycle evaluation, private observation summary and qualified
    review handoff without inventing participant evidence.
sources:
  product: gitg-self-host
  requirements:
  - docs/PRODUCT_DECISIONS.md#decision-046
  - docs/plans/m6l/README.md
  - docs/plans/m6l/actions.yaml
  milestone: M6 Phase F / M6L-08
  baseline_commit: 941fb78d6bca780920a805a03cff9dad690a8dfd
dependencies:
- M6L-02
- M6L-03
- M6L-04
- M6L-05
- M6L-06
- M6L-07
scope:
  allowed_paths:
  - contracts/active-batch.yaml
  - docs/plans/m6l/**
  - docs/pilot/m6l08/**
  - docs/pilot/PRIVATE_PILOT_OPERATIONS.md
  - docs/PROJECT_HANDOFF.md
  - docs/evidence/M6L-0*-*.md
  - scripts/pilot_study.py
  - tests/test_pilot_study.py
  - README.md
  - MANIFEST.tsv
  forbidden_paths:
  - data/**
  - reports/**
  - docs/authoring/**
  - growth/**
  - grounded_growth/**
  - templates/**
  - Dockerfile
  - docker-compose.yml
  - docker-entrypoint.sh
  - .github/**
  - contracts/verification.commands
acceptance:
- Provide a three-cycle protocol, neutral task prompts, separate observation/calibration consent, recruitment/access
  plan, retention/withdrawal workflow and explicit launch requirements.
- Provide a private local observation workspace and deterministic aggregate with strict field validation,
  withdrawn-record exclusion, small-cell suppression, no raw participant output, no automatic upload and
  zero completed assessment axes.
- Map all eight evidence axes to available inputs, missing collection, prespecified methods, qualified
  roles and decision records; preserve failed, inconclusive and missing observations.
- Record actual evidence separately from preparation. Do not mark real-use, assessment collection or qualified
  review complete without supplied consented records and reviewer receipts.
- Preserve every runtime/content/scoring/replay contract; no participant recruitment, live data operations,
  merge or release in this implementation.
validation:
  local:
  - Focused source-only CLI tests
  - scripts/agent-verify.sh full
  - Relevant existing pilot/weekly browser journeys and compose-smoke
  - MANIFEST, schema and scope checks
  focused_tests_to_add:
  - Exercise real CLI initialization and analysis, exclusive private output, input/format/consent rejection,
    duplicate and impossible observation rejection, withdrawal, suppression and empty/synthetic claim
    boundaries.
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - Software preparation could be mistaken for actual empirical evidence.
  - Structured observations or small cells could expose private participant information.
  - Missing sessions could be mislabeled as abandonment or mastery.
  stop_conditions:
  - Unconsented participant data or unapproved new measurement collection
  - Any protected runtime or canonical change
  - Missing evidence for an empirical claim
rollback:
  strategy: Revert additive study tools and documents. No migration or runtime change. Private study files
    remain operator-controlled and require the agreed lifecycle; do not delete them implicitly.
evidence:
  output:
  - docs/evidence/M6L-08-EMPIRICAL-VALIDATION-20260930.md
  claim_boundary: Protocol and synthetic software verification only until actual consented records and
    qualified reviewer receipts are supplied; zero empirical axes closed by automation.
