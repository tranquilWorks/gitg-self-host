acceptance:
- All 383 competencies have a manifest-bound learner guide; individually authored actions replace remaining
  270 generic typed practices.
- Five frozen legacy projections remain byte-identical; four retained typed rules remain exact. Stable
  IDs, action counts, completion rules, mappings, activation and scoring mathematics are unchanged.
- Prospective primary observation criteria use the existing pure authoring compiler and immutable event
  snapshots. No historical data write or in-flight practice replacement.
- Preserve repaired source documents and historical reports. Explicit later packets, materials and answers
  reach authenticated learners with safe formatting and no unrevealed key body.
- Per-competency parity and app/browser tests distinguish software evidence from independent authorship,
  specialist acceptance and actual learner results.
- New implementation stage after the completed five-pass editorial review; no sixth editorial sweep, merge,
  release or deployment.
validation:
  local:
  - Ruff and Django checks
  - pytest and source checks
  - Playwright guide journeys
  - pilot-check
  - curriculum-check
  - competency-evidence-check
  - compose-smoke if available
  - deterministic compiler and governance reports
  - recovery invariants
  - manifest verification
  - git diff --check
  required_ci: []
risk:
  class: moderate
  stop_conditions:
  - Unexplained protected source drift
  - Historical event or active/paused practice mutation
  - Fabricated human acceptance
evidence:
  output:
  - docs/authoring/catalog-product-integration-20260928/README.md
  - docs/evidence/M6K-CATALOG-PRODUCT-INTEGRATION-20260928.md
