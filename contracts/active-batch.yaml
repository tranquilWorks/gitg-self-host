  - ruff format --check tests/test_m6k_resilience_community_listening_sources.py
  - ruff check tests/test_m6k_resilience_community_listening_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Canonical and inherited-input integrity
  - Training and observed physical skill distinctions
  - Travel fallback feasibility and stale information
  - Incident triage and unresolved recovery
  - Contingency capacity and handback
  - Volunteer task consent and unmet needs
  - Health notice revision and teach-back correction
  - Bystander consent and workplace control boundaries
  - Listening corrections versus simulated confirmation
