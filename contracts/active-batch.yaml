acceptance:
- Owner requests another twelve, retaining individual quality and previously explicit normal-merge authorization.
  Standing source-quality CI/CD deferral remains; scoped normal merge is authorized despite generic target-pr-merge
  prohibition. No protection bypass, runtime integration or deployment.
- Exact new IDs 24.08–24.14 and 25.01–25.05. Preserve all 201 prior additional companions and 1001 predecessor source
  tests; no new legacy companion.
- Each competency requires substantive individual explanation, worked example, complete original fictional materials,
  ordered inspectable outputs, separate later packet, three checks and corrective answers, supported/harder/real
  transfer routes and exact canonical metadata. Inspect actual sources and state retrieval and transfer limits.
- Seven business/economic entries retain role_conditional applicability and normative status with the exact business
  professional_boundary. Five creative entries retain elective_cultivation applicability and elective_but_flourishing_relevant
  status; their canonical records have no professional_boundary field. Preserve domain-specific formation modes
  and measurement metadata.
- Individually cover externalities, macroeconomic cycles, public finance, social insurance, enterprise forms, responsible
  innovation, cross-border trade, regular making, observation/imagination, taste, medium/technique and synthesis.
  Complete original cases retain assumptions, partial outcomes, consent, legitimate authority and source limits.
  No actual policy approval, benefit claim, business formation, deployment, shipment or independent participant
  evidence is invented.
- Unique source coverage is 108 implemented plus 213 additional companions = 321 of 383; 62 remain, including 25
  in 07–08. Preserve the exact partition; legacy status alone does not close this pass. Runtime 108 tailored / 275
  pending / 383 protocols / 1151 actions is unchanged.
- Individual author review covers breadth, depth, usability, distinctiveness, all answers and source/evidence limits.
  Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance remain pending.
  Fiction, tests, word counts and merge prove neither learning nor formal acceptance.
- Run full unfiltered source suite, focused Ruff, local links, six canonical/contract/current/recovery hashes, selected
  exercise comparisons, coverage/case regressions, manifest and allowed/forbidden scope audit. Current/recovery
  domains 24 and 25 match; preserve all full files. Record actual failures and repairs. Application/CI/CD deferred,
  not passed.
