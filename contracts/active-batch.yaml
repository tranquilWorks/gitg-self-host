schema_version: 1
batch:
  id: M6L-07-OPERATOR-CONVENIENCE
  title: Explicit installation choice, version visibility and operational recovery
  goal: Support a personal start or explicit demonstration, identify the installed revision, and guide
    verified recovery without changing existing histories.
