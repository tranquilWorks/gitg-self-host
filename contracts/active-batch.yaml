acceptance:
- Owner requests another twelve, retaining individual quality and previously explicit normal-merge authorization.
  Standing source-quality CI/CD deferral remains; scoped normal merge is authorized despite generic target-pr-merge
  prohibition. No protection bypass, runtime integration or deployment.
- Exact new IDs 22.01–22.12. Preserve all 165 prior additional companions and 890 predecessor source tests; no new
  legacy companion.
- Each competency requires substantive individual explanation, worked example, complete original fictional materials,
  ordered inspectable outputs, separate later packet, three checks and corrective answers, supported/harder/real
  transfer routes and exact canonical metadata. Inspect actual sources and state retrieval and transfer limits.
- All twelve retain role_conditional applicability and normative status, formation modes and measurement metadata.
  No canonical professional_boundary field exists. Leadership is not compulsory; actual authority, dependency, consent
  and practical safeguards remain explicit.
- Individually teach credibility, worthwhile direction and limited priorities, ethical power, responsible decisions,
  delegation, coaching, humane accountability, dissent, institutional design, legitimate stakeholder negotiation,
  tabletop crisis leadership and succession. Each case must exercise its distinctive canonical facets, with partial
  or disconfirming later evidence and honest transfer limits.
- Unique source-authoring coverage is 108 implemented plus 177 additional companions = 285 of 383; 98 remain, including
  25 in 07–08. Preserve exact partition. Legacy status alone does not close this pass. Runtime 108 tailored / 275
  pending / 383 protocols / 1151 actions is unchanged.
- Individual author review covers breadth, depth, usability, distinctiveness, all answers and source/evidence limits.
  Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance remain pending.
  Fiction, tests, word counts and merge prove neither learning nor formal acceptance.
- Run full unfiltered source suite, focused Ruff, local links, four canonical/contract/current/recovery hashes,
  selected exercise comparison, coverage and case regressions, manifest and allowed/forbidden scope audit. Current/recovery
  domain 22 match; preserve both full files. Record actual failures and repairs. Application/CI/CD deferred, not
  passed.
