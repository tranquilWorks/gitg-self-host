acceptance:
- Owner continuation request “Next chunk please” on 24 September 2026 carries forward twelve-per-report
  cadence, no quality compromise and explicit “next batch and merge in” normal merge authorization. Source-quality
  workflow defers CI/CD; normal merge authorization overrides generic target-pr-merge prohibition for
  this batch only. No bypass, deployment or runtime integration.
- Exact IDs 16.14–16.18 and 17.01–17.07. Preserve 81 previous additional source companions and 632 source
  tests. Scope ends after twelve.
- Each competency requires individual conceptual teaching, worked example, complete original fictional
  case, ordered actions and inspectable output, separate later outcomes, three fresh checks and corrective
  answers, supported/harder/real transfer routes, full canonical mapping and inspected primary sources.
- Author review checks every canonical facet, usability, distinctiveness, case and answer discrimination,
  source limits and missing human evidence. Length and passing tests are not pedagogical validation.
- 17.03 is a frozen legacy companion. Preserve its protocol/actions/evidence fields, fourteen-day practice,
  at least ten minutes primarily listening, seven-day follow-up, completion and replay byte-for-byte.
  A proposed activity is not jointly scheduled.
- Courtesy never measures wealth, accent, appearance, eye contact or human worth. Indirect signals remain
  hypotheses; silence is not consent. Adapt local communication preferences without stereotypes, compelled
  code-switching or altered material facts.
- Accommodation must allow understanding AND expression, including disagreement. Self-audit and fictional
  responses cannot establish actual access or friendship. Qualified language assistance in regulated settings
  is outside the informal peer exercise.
- Teach all seven coercion mechanisms without diagnosis by checklist. Threats, monitoring, stalking or
  unsafe dependence stop confrontation practice; use a verified safe local support route and individualized
  safety planning. Do not force exit, reconciliation or allegations into the application.
- Relationship selection, maintenance, reliable support, reciprocity and hospitality require distinct
  tasks. Respect refusal and unequal capacity. No secret loyalty tests, exact moral ledgers or rescue/control.
  Intent and promises do not prove usefulness or follow-through.
- Expected additional source count 93; runtime stays 108 tailored, 275 pending, 383 protocols, 1151 actions.
  Formal independent, learner, qualified and owner content acceptance remain pending.
- Run full source suite, focused Ruff, links, canonical/input hashes, meaningful case regressions, manifest
  and allowed/forbidden scope audit. Record actual results and limits.
