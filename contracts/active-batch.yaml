acceptance:
- Owner continuation “again next batch please” retains twelve per report, individual quality, standing
  source-quality CI/CD deferral and prior explicit normal-merge authorization. This authorizes the scoped
  normal merge despite generic target-pr-merge prohibition; no protection bypass, runtime integration
  or deployment.
- Exact IDs 19.04–19.15. Preserve 117 earlier additional companions and 743 source tests. No new legacy
  companion; stop after twelve.
- Each competency requires substantive individual teaching, worked example, complete original fictional
  case, ordered actions with inspectable outputs, separate later packet, three fresh checks with corrective
  answers, supported/harder/real transfer routes, exact canonical scope/classification/measurement and
  inspected primary or first-party sources.
- All twelve remain role_conditional in applicability and normative status; retain exact domain19 professional
  boundary and measurement preferences. Reproduction, parenting and caregiving are not required life paths.
  Actual role and task authority precede live care; fiction and no-attempt routes remain legitimate.
- Reproductive-health learning prepares qualified questions, not a fertility forecast, contraceptive prescription,
  pregnancy diagnosis, treatment decision or fixed personal referral deadline. Separate population information
  from suitability, and inquiry/booking/attendance from clinical answer.
- Pregnancy/postpartum support preserves bodily consent, helper versus infant-care versus medical authority,
  existing care instructions and prompt actual help for concerning symptoms; no false emergency calls
  or simulated symptoms. Grief support accepts silence/refusal and different meanings without blame, forced
  disclosure or replacement narratives.
- Family belonging preserves origins, privacy and child voice without forced titles, contact or legal
  authority. Safeguarding uses official jurisdiction-specific receiving routes, obligations and emergency
  paths; no amateur interviews, credibility tests, confrontation, false reports, secrecy promises or delay
  of a real concern for this exercise.
- Autonomy/discipline distinguishes safety and shared-use limits from adult preference. No humiliation,
  violence or withholding essentials/affection. Family teaching includes practical, ethical, emotional,
  cultural/worldview and media judgment through a safe demonstration and learner retry, not compliance
  or compelled belief.
- Elder-care work distinguishes observed changes, diagnosis, task-specific capacity and legal authority;
  use accessible participation, qualified planning and sustainable support. No family vote or age-based
  automatic takeover, medication change or private care records in app evidence.
- Family labor exposes complete units and hidden rework without stereotypes or withdrawal of essential
  care. Restructuring follows existing custody/care/safety authority, keeps adult disputes from dependents
  and never tests a live pickup.
- Heritage activity allows opt-out, alternative meaning, story/recording permissions and actual revision
  without coercive nostalgia. Respite requires competent willing authorized backup, start/return handoffs
  and actual protected time; an offer or booked slot is not coverage, one break is not resolved burnout.
- Individual author review covers all facets, depth, usability, distinctiveness, source limits, fresh
  answers and missing human evidence. Length and automated checks do not establish pedagogy, qualified
  acceptance or formal review.
- Additional source count expected129; runtime108 tailored/275 pending/383 protocols/1151 actions unchanged.
  Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance remain
  pending.
- Run full source suite, focused Ruff, link/anchor checks, exact canonical/current/recovery hashes, case
  regressions, manifest and allowed/forbidden scope audit. Record actual results; source publication does
  not claim application gates.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - python -m ruff format --check tests/test_m6k_family_stewardship_sources.py
  - python -m ruff check tests/test_m6k_family_stewardship_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Exact domain19 role, measurement and professional boundaries
  - Population guidance versus individual reproductive judgment
  - Postpartum disruption, distinct authority and urgent-help route
  - Grief refusal versus accepted practical support
  - Belonging choices versus privacy and legal authority
  - Verified receiving routes versus information services and fictional report
  - Proportionate repair and changed responsibility conditions
  - Own-word learning and verified source versus copied compliance
  - Memory observations versus diagnosis/capacity and qualified planning
  - Whole-task ownership, hidden rework and accepted workload
  - Collector authority, safe delay and actual transfer
  - Heritage revision, permission and limited belonging claim
  - Respite acceptance, competence, interval and return handoff
risk:
