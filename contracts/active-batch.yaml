schema_version: 1
batch:
  id: M6K-SIX-MORE-SOURCE-CONSOLIDATION
  title: Publish consolidated sources and repair source verification
  goal: Preserve twenty-one authored candidates, repair source-test formatting, and honor the explicit owner merge request without runtime integration claims.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/authoring/SOURCE-CONSOLIDATION-STATUS.md
  milestone: M6K-SIX-MORE-SOURCE-PUBLICATION
  baseline_commit: d93532696d3ea9d04e50f47350b90fa255208511
dependencies:
- PR-77-merged
scope:
  allowed_paths:
  - MANIFEST.tsv
  - contracts/active-batch.yaml
  - docs/authoring/SOURCE-CONSOLIDATION-STATUS.md
  - docs/authoring/reasoning-foundations/**
  - docs/authoring/evidence-humility-forecasting/**
  - docs/authoring/systems-causes-tradeoffs/**
  - docs/authoring/risk-judgment-inference/**
  - docs/authoring/models-information-execution/**
  - docs/evidence/M6K-SOURCE-CONSOLIDATION-RETRY.md
  - tests/test_m6k_reasoning_sources.py
  - tests/test_m6k_evidence_humility_forecasting_sources.py
  - tests/test_m6k_systems_causes_tradeoffs_sources.py
  - tests/test_m6k_risk_judgment_inference_sources.py
  - tests/test_m6k_models_information_execution_sources.py
  - .github/workflows/verification.yml
  forbidden_paths:
  - data/**
  - growth/**
  - grounded_growth/**
  - templates/**
  - docs/authoring/exercises/**
  - docs/authoring/quality/**
  - docs/plans/m6k/recovery/**
  - docs/plans/m6k/runtime-projections.json
  - contracts/tailored-practice-authoring.yaml
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/codex/**
acceptance:
- Limit verification workflow changes to increasing the Compose job time budget from 60 to 180 minutes and its explanatory comment; retain every command, assertion, dependency, and required result.
- Preserve the twenty-one source candidates and every existing test criterion.
- Repair formatting and lint without weakening or skipping checks.
- The temporary same-repository PR80-only workflow may commit exactly the five hash-verified test repairs and regenerated manifest to the existing PR branch, never main. Remove this workflow before merge.
- Export only tracked source and diagnostic results, never credentials, private application data, or untracked state.
- Keep runtime coverage at 108 tailored and 275 pending; source publication is not runtime completion.
- Verify the final manifest, source suite, Ruff, and protected-path identities.
validation:
  local:
  - python -m unittest discover -s tests -p '*sources.py' -v
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci:
  - existing repository verification commands and result requirements unchanged; Compose time budget only increased to permit the complete drill
  - source formatting and lint verification
  focused_tests_to_add:
  - Preserve source identities and test criteria
  - Run the seventeen previously unavailable source-text checks
risk:
  class: moderate
  hazards:
  - Source publication mistaken for runtime integration
  - Repair changes assertions or hides failures
  - Automation changes unrelated paths or overwrites another author
  stop_conditions:
  - Any protected-path change
  - Expected repaired hash mismatch
  - Non-fast-forward push or falsely claimed verification
rollback:
  strategy: Revert source-only changes; no database, deployment, live-action, or historical mutation.
evidence:
  output:
  - docs/evidence/M6K-SOURCE-CONSOLIDATION-RETRY.md
  claim_boundary: Owner authorizes merge of PR80 and the next six. All compiler integration, deployment, and formal human-review claims remain separate.
