acceptance:
- Exactly 09.04, 09.05 and 09.06 receive distinct complete source guides, supplied materials, two fresh checks each, separate keys, adaptations, progression and evidence limits.
- Every canonical element is individually mapped to teaching and a check.
- Source evaluation distinguishes response denominators, missingness bounds, measurement, confounding and independent new data from repeated publication.
- Belief revision preserves prior versions, states assumptions and revision conditions, and distinguishes relevant evidence from unsupported pressure.
- Forecasting preserves prospective probabilities, separately reveals outcomes, defines void and unresolved cases, checks sensitivity and separates calibration from Brier accuracy.
- No canonical package, production score, activation, completion, historical event or formal review record changes.
- Neither this cohort nor earlier draft PR-78 is counted as runtime-integrated.
- Root manifest synchronization and applicable repository gates remain prerequisites for merge; no failing gate is waived.
validation:
  local:
  - python -m unittest discover -s tests -p test_m6k_evidence_humility_forecasting_sources.py -v
  - ./scripts/agent-verify.sh contract
  - git diff --check
  required_ci:
  - existing repository verification workflow
  - manifest verification
  - existing readiness and regression gates
  focused_tests_to_add:
  - Missing response bounds verified by exhaustive assignments
  - Independent data distinguished from multiple reports of the same dataset
  - Scope-aware belief updates preserve conflicting observations and prior notices
  - Probability and outcome validation with explicit exclusion denominators
  - Exact threshold, expected-value, Brier and calibration arithmetic
  - Prompt, table, key and fixture alignment
risk:
  class: moderate
  hazards:
  - Source coverage is mistaken for compiler-selected runtime completeness
  - A financial incentive is treated as proof that a claim is false
  - Humility is confused with acquiescence or universal skepticism
  - Forecast outcomes are exposed before the initial record
  - A low Brier score is reported as proven calibration
  - Missing outcomes or respondents silently disappear
  stop_conditions:
  - Any forbidden path changes
  - A required gate fails and is represented as passing
  - A runtime or human-review count advances without evidence
rollback:
  strategy: Revert the source-only commit; this checkpoint performs no database import or deployment.
evidence:
  output:
  - docs/evidence/M6K-EVIDENCE-HUMILITY-FORECASTING-SOURCES.md
  claim_boundary: Authored source candidates, standalone source checks and standalone preview checks only; no compiler, application, historical replay, independent learner, specialist or owner acceptance claim.
