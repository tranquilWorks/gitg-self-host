acceptance:
- 'The current request to pick up competency authoring continues the recorded owner source-only six-guide
  workflow: vet quality, publish and normally merge, with CI/CD deferred. No branch-protection bypass,
  deployment, runtime change or human acceptance is authorized.'
- 'Exact IDs: 12.15, 12.16, 14.01, 14.02, 14.03, 14.04. Finish the two remaining domain-12 source companions
  and continue past already-tailored domain 13. Preserve all 39 prior companions and 478 source checks.'
- Individually supply meaningful concept explanations, worked example, complete practice materials, bounded
  ordered actions with observable outputs, later outcomes, three fresh checks with corrective answers,
  practical adaptations, harder routes, transfer, and exact canonical scope mapping.
- Adaptive movement preserves individual guidance, chosen participation, assistance, environment and variable
  capacity. Pain literacy teaches response uncertainty and escalation without diagnostic rules, pain provocation,
  universal exercise doses or equating pain with either damage or safety.
- Digital self-governance preserves useful and essential access and voluntary limits. Data hygiene supplies
  a non-destructive file restore; privacy tracks collection, linkage, purpose, permission and residual
  copies; cybersecurity traces independent recovery dependencies and attack scenarios. Never include real
  secrets or require destructive lockouts.
- Inspect primary/official sources with date, precise support and limits; retain retrieval failures. All
  case data are original synthetic materials and no simulated action is presented as actual performance.
- Expected additional-source count 45. Runtime stays 108 tailored, 275 pending, 383 protocols, 1151 actions.
  Formal quality/human-review counts remain unchanged.
- Run the full source-test suite, focused Ruff, local links, source-case checks, canonical/input hashes,
  manifest, and exact allowed/forbidden-path audit. Publish exact results and residual gaps.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - ruff format --check tests/test_m6k_adaptive_digital_sources.py
  - ruff check tests/test_m6k_adaptive_digital_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Exact six canonical entries and unchanged input hashes
  - Non-destructive source restore matches expected bytes and preserves newer originals
  - Failed copy, stale version and sync-deletion cases
  - Purpose/essential-access and unknown session statuses
  - Privacy scope, copied records and unconfirmed erasure
  - Independent recovery dependencies and missing/unknown factors
  - Health-case chronology and separate completed, deferred and unresolved activity
risk:
  class: moderate
  hazards:
  - Health information misread as diagnosis or clearance
  - Credentials or private information exposed
  - Delete, sync, account recovery and privacy claims overstated
  stop_conditions:
  - Protected-path drift
  - Unresolved material source defect or failing source verification
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this source-only batch; no participant data, migration or deployment is involved.
evidence:
  output:
  - docs/evidence/M6K-ADAPTIVE-DIGITAL-SIX.md
  claim_boundary: Author editorial and source verification only; independent, actual learner, qualified
    and owner content acceptance remain pending. CI/CD/application verification deferred, not passed.
