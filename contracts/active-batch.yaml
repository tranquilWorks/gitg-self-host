  hazards:
  - Generic content hiding distinct canonical scope
  - Unsupported medical, legal, capacity or developmental claims
  - Delayed protection or amateur child investigation
  - Coercion, disclosure or unauthorized care
  - Uncovered essential care or respite described as completed
  - Fabricated learner, specialist or acceptance evidence
  stop_conditions:
  - Protected-path drift
  - Unresolved material source defect or failing source verification
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this source-only batch; no participant data, migration or deployment is involved.
