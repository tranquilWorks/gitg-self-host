  - Willing roles and real handoff
  - Sustainable social-ecology timing
  - Separate introduction consent
  - Mentoring transfer limits and follow-up
  - Communal burden visibility
  - Disagreement versus conversion
  - Group contribution versus decision authority
  - Eight love dimensions and freely chosen care
  - Adult courtship consent and refusal
  - Compatibility beyond intensity
  - Direct request versus test or surveillance
  - Readiness and bounded truthful disclosure
