schema_version: 1
batch:
  id: M6K-CATALOG-QUALITY-AUDIT-20260927
  title: Audit all 383 competency sources against original quality corrections
  goal: Produce a revision-bound per-competency quality and distinctness evidence audit, report defects candidly, and distinguish documentary coverage from independently demonstrated instructional quality.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/AUDIT.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/REVIEW_IMPLEMENTATION.md
  - docs/authoring/quality/ledger.json
  milestone: M6K-CATALOG-QUALITY-AUDIT
  baseline_commit: 8377d21e348eda14dd5e66153637293aeaca1a5b
dependencies:
- PR-103-merged
scope:
  allowed_paths:
  - contracts/active-batch.yaml
  - docs/authoring/catalog-quality-audit-20260927/**
  - docs/evidence/M6K-CATALOG-QUALITY-AUDIT-20260927.md
  - MANIFEST.tsv
  forbidden_paths:
  - data/**
  - growth/**
  - grounded_growth/**
  - templates/**
  - scripts/**
  - tests/**
  - docs/authoring/exercises/**
  - docs/authoring/quality/**
  - docs/plans/m6k/**
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/**
acceptance:
- Cover every canonical competency with exact source identity, domain, evidence and current-review status; do not infer professional quality from coverage, uniqueness, length or tests.
- Separate mechanical checks, direct full-primary reading, targeted excerpt inspection, independent cold-start, actual learner, qualified and owner acceptance.
- Audit the original five correction examples and record reproducible material defects with exact source anchors.
- Compare source text for duplication and retain contextual evidence without claiming proof of independent authorship or plagiarism clearance.
- Do not revise lessons, runtime packages, formal review receipts, scoring or completion semantics as part of the audit.
- Application, browser, Compose and CI/CD remain deferred under the standing source-quality instruction, not passed. No deployment or merge-protection bypass.
validation:
  local:
  - python docs/authoring/catalog-quality-audit-20260927/verify.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add: []
risk:
  class: moderate
  hazards:
  - Audit coverage mistaken for full semantic acceptance or independent professional review
  - Textual differences mistaken for proof of independent creation
  - Mechanical source tests mistaken for learner or clinical evidence
  stop_conditions:
  - Protected source drift
  - Missing or duplicated canonical IDs in the report
  - Unsupported pass or review provenance claim
rollback:
  strategy: Remove the audit-only artifacts and restore the preceding contract; no curriculum or runtime change.
evidence:
  output:
  - docs/evidence/M6K-CATALOG-QUALITY-AUDIT-20260927.md
  claim_boundary: Documentary and editorial audit only. Exact review depth is recorded per competency. No blinded, participant, qualified or owner acceptance is invented.
