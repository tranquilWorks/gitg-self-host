schema_version: 1
batch:
  id: M6K-LEARNING-LOOP-RUNTIME
  title: Retrieve, decompose and correct a bounded learning task
  goal: >-
    Increase substantive tailored runtime coverage from 99 to 102 through three
    related but separately evidenced memory, skill-path and feedback practices;
    preserve separate pending formal and human review.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - docs/plans/m6k/README.md
    - docs/plans/m6k/REVIEW_RECORD.md
    - docs/plans/m6k/program.json
    - https://github.com/tranquilWorks/gitg-self-host/issues/61
    - https://github.com/tranquilWorks/gitg-self-host/issues/62
  milestone: M6K-10.06-10.08
  baseline_commit: fe9a47c2e0db2a4c50794e8b7b134ce88b2a63f9
dependencies:
  - PR-73-merged
scope:
  allowed_paths:
    - MANIFEST.tsv
    - contracts/active-batch.yaml
    - contracts/tailored-practice-authoring.yaml
    - docs/PROJECT_HANDOFF.md
    - docs/plans/m6k/README.md
    - docs/plans/m6k/runtime-projections.json
    - docs/authoring/exercises/10.yaml
    - docs/authoring/sources.yaml
    - docs/authoring/quality/10.06/**
    - docs/authoring/quality/10.07/**
    - docs/authoring/quality/10.08/**
    - docs/authoring/quality/current-report.json
    - docs/authoring/M6K-LEARNING-LOOP-*.md
    - docs/evidence/M6K-LEARNING-LOOP-RUNTIME.md
    - data/practices/protocols/10/PRACTICE-COMP-1006-MEMORY-AND-RECALL-01.yaml
    - data/practices/protocols/10/PRACTICE-COMP-1007-SKILL-DECOMPOSITION-AND-PROGRESSION-01.yaml
    - data/practices/protocols/10/PRACTICE-COMP-1008-FEEDBACK-AND-ERROR-CORRECTION-01.yaml
    - data/practices/registries/source_registry.yaml
    - data/practices/release_manifest.yaml
    - reports/**
    - tests/test_m6k_learning_loop.py
    - tests/test_m6k_inquiry_notes.py
    - tests/test_m6k_learning_craft.py
    - tests/test_m6k_physical_capacity.py
    - tests/test_m6k_review_evidence.py
  forbidden_paths:
    - data/assessment/**
    - data/model/**
    - data/curriculum/**
    - data/practices/registries/activation_ledger.yaml
    - growth/models.py
    - growth/migrations/**
    - growth/services/canonical_import.py
    - growth/domain/composite_scoring.py
    - growth/services/composite_score_state.py
    - growth/domain/context_priority.py
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
    - .github/workflows/**
    - docs/plans/m6k/recovery/**
    - docs/authoring/quality/ledger.json
acceptance:
  - 'Exactly 10.06, 10.07 and 10.08 become individually authored runtime practices: 102 tailored, 281 pending.'
  - Memory practice distinguishes recognition, unaided recall, cue use, lookup, correction, actual delay and version interference without broad capacity claims.
  - Skill decomposition supplies a complete harmless task, directed prerequisites, observable milestones, a held-back integration case and a return path for broken handoffs.
  - Feedback preserves the first output, ties one correction to a fixed standard and retests a comparable fresh case without treating approval or identity judgments as task evidence.
  - Each learner artifact includes complete fictional materials, separately revealed checks, success/partial/adverse/inconclusive examples and a concrete advanced or accessible route.
  - Preserve 383 protocol IDs, 1151 action IDs, parent mappings, completion rules, activation, scoring and immutable event replay.
  - Recovery archive stays byte-exact; prospective content is checked against pinned originals and exact compiler output.
  - Formal independent, actual learner, qualified and owner acceptance are not inferred.
validation:
  local:
    - >-
      .venv/bin/python -m pytest tests/test_m6k_learning_loop.py
      tests/test_m6k_inquiry_notes.py tests/test_m6k_learning_craft.py
      tests/test_m6k_physical_capacity.py tests/test_tailored_practice_authoring.py
      tests/test_m6k_recovery.py tests/test_m6k_review_evidence.py -q
    - ./scripts/agent-verify.sh contract
    - make pilot-check curriculum-check competency-evidence-check
    - git diff --check
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - all readiness and canonical report gates
    - Playwright core journeys
    - Compose backup restore and recreation
    - aggregate Pilot readiness gate
  focused_tests_to_add:
    - Exact identity and completion preservation for all three runtime projections
    - Prompt/key reveal isolation for six discriminating checks
    - Retrieval-route, dependency, precedence and feedback-result fixtures
    - Prospective invariant drift rejection for each selected package
risk:
  class: moderate
  hazards:
    - recognition or a corrected copy is mislabeled as unaided delayed recall
    - one sequence result is promoted into a claim about intelligence or general memory
    - isolated component success is represented as an integrated complex skill
    - confident, popular or identity-directed feedback overrides the fixed task standard
  stop_conditions:
    - historical event replay changes
    - assessment, activation or scoring mathematics changes
    - a prompt exposes its answer key before an attempt
    - a promised sequence, rule set, fresh case, record or key is missing
    - a required CI gate fails
rollback:
  strategy: >-
    Revert the content release before import or restore the verified pre-upgrade backup;
    never reinterpret existing event snapshots.
evidence:
  output:
    - docs/evidence/M6K-LEARNING-LOOP-RUNTIME.md
  claim_boundary: >-
    Authored educational practices and software verification; no automatic formal,
    independent learner, qualified, owner or empirical validation acceptance.
