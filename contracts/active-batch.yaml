acceptance:
- The owner instructed "ignore cicd for now, just vett the quality of the posts" and then "if they pass by
  your standards like the past ones move this one on and continue with the next six". Editorial/source quality
  is the gate for this source-only batch and its authorized normal merge. Full application, browser, Compose
  and CI/CD are deferred, not passed. Actual branch protection remains binding. The owner now asks "can we
  do another 6 more"; this continues that authorized delivery method.
- 'Exact IDs: 12.09, 12.10, 12.11, 12.12, 12.13, 12.14. Preserve all 33 preceding companions and 413 source
  checks, including existing strength/coordination repairs.'
- Each guide needs an individual purpose and applicability boundary, substantive explanation, distinct worked
  example, complete default materials, exact actions/burden/output, separate later outcomes, at least two fresh
  checks with separate corrective guidance, supported/harder routes, later transfer and a canonical scope map.
- 'Body composition: distinguish total weight, muscle/fat, waist, function and clinical markers; preserve measurement
  context and contradictory evidence, with no body metric or appearance verdict, diagnosis or restrictive target.'
- 'Recovery: compare load and resources with symptoms and ordinary function; no self-diagnosis, pain provocation/masking,
  calendar-only clearance, automatic progression or deprivation.'
- 'Substances: distinguish alcohol/nicotine/recreational/performance/medication risks, ingredients, impairment,
  interactions and dependence; no dosing, sourcing, use experiment or unsupervised withdrawal. Emergency care
  supersedes exercise review.'
- 'Bodily autonomy: current specific revocable permission, no-touch option, privacy and reciprocal boundaries;
  stop/repair oversteps without demanding forgiveness. Medical choice needs applicable care process; no universal
  legal assertion or unsafe confrontation.'
- 'Presentation: actual hygiene/context requirements, identity, access and movement/comfort; no purchase/beauty/posture
  demand, discrimination normalizing or compliment-based success inference.'
- 'Lifelong movement: map future participation to strength/endurance/balance/mobility/bone questions, carrying/transfers/access;
  use existing supported familiar plans, preserve unmet transport or recovery and separate two attempts from
  lifelong capacity.'
- Inspect official/primary sources with date/jurisdiction/claim limits; original synthetic cases, not clinical
  protocols or participant records. No independent/qualified/learner/owner acceptance is fabricated.
- 'After this batch: 39 additional source companions; runtime 108 tailored /275 pending /383 protocols /1,151
  actions unchanged. No compiler, runtime, action/evidence/scoring/completion, formal-review, workflow or participant-data
  changes.'
- Run complete source tests, focused Ruff, links, canonical/input pins, arithmetic/chronology/permissions/status
  regressions, manifest and exact allowed/forbidden-path audit; retain failures and final provenance.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - python -m ruff format --check tests/test_m6k_health_stewardship_sources.py
  - python -m ruff check tests/test_m6k_health_stewardship_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Measurement comparability and unknown tissue/lab status
  - Load quantities and recovery-before-return decisions
  - Transport feasibility, impairment, dependence and emergency routing
  - Scoped/revoked/unknown consent and privacy permission transitions
  - Presentation item constraints, routine timing and real movement evidence
  - Future-function map, round-trip access and supported participation chronology
  - Source/fixture alignment, malformed data, canonical pins and prior regressions
risk:
  class: moderate
  hazards:
  - Clinical/legal conclusions inferred from educational synthetic cases
  - Unconfirmed permission, transport, recovery or clinical review reported as complete
  - Body metrics or appearance made a dignity or nourishment score
  - Unsafe withdrawal, physical challenge or unsupported aging assumptions
  stop_conditions:
  - Protected-path or stable-ID drift
  - Failed verification or unresolved material source defect
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this bounded source-only batch; no migration, deployment or participant-data mutation is
    involved.
evidence:
