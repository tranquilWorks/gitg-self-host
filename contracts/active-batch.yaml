acceptance:
- The owner instructed "ignore cicd for now, just vett the quality of the posts" and then "if they pass by
  your standards like the past ones move this one on and continue with the next six". Editorial/source quality
  is the gate for this source-only batch and its authorized normal merge. Full application, browser, Compose
  and CI/CD are deferred, not passed. Actual branch protection remains binding.
- 'Exact IDs: 12.01, 12.02, 12.03, 12.04, 12.06, 12.07. Current compiler selection already includes 12.05 and
  12.08 from PR72; preserve those authored repairs rather than duplicate them.'
- Preserve the 27 prior source companions and all 348 source checks. Each new guide needs distinct explanation
  and worked example, complete default materials, prior decision and separate later results, two fresh checks
  and separate keys, access routes, harder practice, transfer and individual canonical scope mapping.
- Distinguish prevention, symptom evaluation and treatment; missing records, requested records, received records,
  booked care and completed care are separate. Do not prescribe screening, vaccination or medication changes.
- Sleep opportunity is not measured sleep. Compare three baseline and four trial nights with correct missing-data
  denominators and confounding; preserve needed sleep, essential care and existing clinical plans.
- Nutrition cases must fit cost, preparation and access constraints; use consistent serving units, honor allergy/cross-contact
  uncertainty and existing care plans, and avoid calorie targets or universal adequacy claims.
- Body-image content separates observations, judgments, care and appearance preferences without compelled positivity,
  deprivation, compensation, triggering exposure or treatment claims.
- Aerobic decisions preserve existing individualized dose and support, compare recovery and effort, stop for
  warning signs and never turn two sessions into measured adaptation or automatic progression.
- Mobility content separates task access, range, control, tissue tolerance, balance and stability; preserve
  aids, avoid forced range and separate environmental improvement from bodily adaptation.
- Use inspected primary/official sources with dates, jurisdictions, specific claim limits, originality and
  unresolved qualified/learner/independent/owner review. Synthetic outcomes never become participant evidence.
- Runtime stays 108 tailored /275 pending /383 protocols /1151 actions. The resulting 33 additional source
  companions do not change runtime, scoring, completion or review acceptance.
- Run all existing and new source tests, focused Ruff, manifest, local links, fixture arithmetic and source
  alignment, canonical/input pins and allowed/forbidden-path audit; retain failures and corrections.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - python -m ruff format --check tests/test_m6k_health_foundations_sources.py
  - python -m ruff check tests/test_m6k_health_foundations_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Care-state chronology and unknown-record handling
  - Sleep windows, missing data and comparison denominators
  - Food quantities, whole-package budget and allergen status
  - Body-care permission and evidence distinctions
  - Aerobic stop/recovery and changed-condition decisions
  - Mobility support, task access and adaptation claim boundaries
  - Exact source/fixture alignment, canonical/input pins and prior-source regressions
risk:
  class: moderate
  hazards:
  - Educational health content mistaken for clinical advice or specialist acceptance
  - Missing observations normalized into favorable evidence
  - Unsafe food or exercise choices inferred from a synthetic case
  - Existing compiled strength/coordination repairs overwritten
  stop_conditions:
  - Protected-path or stable-ID drift
  - Failed verification or unresolved material source defect
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this bounded source-only batch; no migration, deployment or participant-data mutation is
    involved.
evidence:
  output:
  - docs/evidence/M6K-HEALTH-FOUNDATIONS-SIX.md
  claim_boundary: Owner-authorized source publication and normal merge under editorial/source quality gate.
    Native [skip ci] markers defer CI without workflow changes. No clinical, specialist, learner, independent
    or owner content acceptance; no runtime integration, deployment or branch-protection bypass.
