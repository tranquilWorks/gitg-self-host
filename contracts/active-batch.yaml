acceptance:
- Owner requests resume, retaining the twelve-per-report individual quality cadence and explicit normal-merge
  authorization. Standing source-quality CI/CD deferral remains; scoped normal merge is authorized despite
  generic target-pr-merge prohibition. No protection bypass, runtime integration or deployment.
- Exact new IDs 25.06–25.13 and 26.01–26.04. Preserve all 213 prior additional companions and 1038 predecessor
  source tests. Add one source companion for frozen legacy 26.01 without changing its protocol, actions, evidence,
  timing, completion or replay.
- Each competency requires substantive individual teaching, a worked example, complete original fictional materials,
  ordered inspectable outputs, a separate later packet, three fresh checks and answers, accessible/support/harder
  routes and exact canonical metadata. Inspect actual primary sources and preserve retrieval and transfer limits.
- Eight creative entries retain elective_cultivation and elective_but_flourishing_relevant. Four leisure entries
  retain cross_context_core and cross_tradition_core_or_broadly_recurrent. All twelve lack a canonical professional_boundary
  field; do not invent one. Preserve domain-specific formation modes and measurement.
- Individually cover experimentation, revision/release, collaboration, moral imagination, historical/cultural
  literacy, aesthetic environment, tradition-bearing, cultural use, play, rest, durable interests and nature
  connection. Distinguish actual audience, collaborator, teacher, play and repeated observation from supplied
  fiction or preparation.
- 26.01 retains PRACTICE-PLAY-01, duration ten days, reserve at least thirty minutes within three days with
  existing accessible variants, play without an output goal, and return within seven days. Preserve all five
  existing check-in fields, missing user_initiated exception, exact action rules, completion and legacy compatibility.
  No new enjoyment score.
- Unique source coverage is 108 implemented plus 225 additional companions = 333 of 383; 50 remain, including
  25 in 07–08. Legacy 08.02 still lacks this source companion; 26.01 closes only the additional source gap.
  Runtime 108 tailored / 275 pending / 383 protocols / 1151 actions remains unchanged.
- Individual author review covers breadth, depth, usability, distinctiveness, all 36 answers and source/evidence
  limits. Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance
  remain pending. Fiction, tests, word counts and merge prove neither learning nor formal acceptance.
- Run full unfiltered source suite, focused Ruff, local links, seven canonical/contract/current/recovery/legacy
  input hashes, selected exercise comparisons, case and exact coverage regressions, frozen play preservation,
  manifest and scope audit. Full current/recovery domains 25 and 26 match and remain unchanged. Record actual
  failures and repairs. Application/CI/CD deferred, not passed.
