schema_version: 1
batch:
  id: M6K-01-03-GOVERNED-CONTINUATION
  title: Connect evidence-aware one-action M6K continuation
  goal: Generate bounded existing-schema contracts, retain restartable checkpoints and exclusive workspace
    leases, and dispatch through the current Portfolio Control runner without accepting content or human
    gates.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/program.json
  milestone: M6K-01-03
  baseline_commit: f03e73db4748b192bfe6fae18ac0f540874700cd
dependencies:
- M6K-PR-68-merged-review-enforcement
scope:
  allowed_paths:
  - MANIFEST.tsv
  - contracts/active-batch.yaml
  - docs/**
  - tests/test_m6k_continuation.py
  forbidden_paths:
  - data/assessment/**
  - data/model/**
  - data/curriculum/**
  - data/practices/protocols/**
  - data/practices/registries/activation_ledger.yaml
  - growth/models.py
  - growth/migrations/**
  - growth/services/canonical_import.py
  - growth/domain/composite_scoring.py
  - growth/services/composite_score_state.py
  - growth/domain/context_priority.py
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/workflows/**
acceptance:
- Current program and per-competency review evidence determine completion; advisory state and commit subjects
  do not.
- Every generated batch validates against pinned Portfolio Control schemas and has exact action scope,
  dependencies, verification and rollback.
- Persistent checkpoints survive interruption without duplicate branch/PR identities or automatic acceptance.
- Exclusive leases refuse concurrent edits across linked worktrees; abandoned leases need explicit dead-owner
  recovery.
- M6K is registered separately from legacy active work and actual human gates remain intact.
- Deterministic fixtures cover stale/missing evidence, blocked independent work, human gates, lease contention
  and resume.
validation:
  local:
  - .venv/bin/python -m pytest tests/test_m6k_continuation.py -q
  - ./scripts/agent-verify.sh contract
  - git diff --check
  required_ci:
  - Ruff Django pytest migration drift and manifest verification
  - all readiness and canonical report gates
  - Playwright core journeys
  - Compose backup restore and recreation
  - aggregate Pilot readiness gate
  focused_tests_to_add:
  - Dependency and evidence freshness
  - Existing-schema contract and exact scope
  - Durable lease contention and interruption resume
  - No fabricated completion or human approval
risk:
  class: high
  hazards:
  - noun-swapped content is misrepresented as individually authored
  - revised instructions invalidate an ongoing practice
  - source support is overstated as specialist or empirical validation
  - task completion is confused with mastery
  stop_conditions:
  - historical event replay changes
  - assessment or scoring mathematics changes
  - any missing or generic exercise is hidden by the coverage report
  - a required CI gate fails
rollback:
  strategy: Revert the content release before import or restore the verified pre-upgrade backup; never
    reinterpret existing event snapshots.
evidence:
  output:
  - docs/evidence/M6K-CONTINUATION-2026-09-08.md
  claim_boundary: Authored educational practices and software verification; no automatic human review
    or empirical validation acceptance.
