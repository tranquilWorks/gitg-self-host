schema_version: 1
batch:
  id: M6K-01-02-REVIEW-EVIDENCE
  title: Enforce current-revision competency review evidence
  goal: Implement M6K-01-02 mechanical checks, append-only review receipts and independent current-revision
    dimensions; do not accept content or human gates.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/program.json
  milestone: M6K-00 and M6K-01
  baseline_commit: 1a5ca67364a5a3025d32d17a0ebffb58688f4875
dependencies:
- M6K-PR-67-merged-instructional-implementation
scope:
  allowed_paths:
  - MANIFEST.tsv
  - contracts/active-batch.yaml
  - docs/**
  - growth/domain/instructional_content.py
  - tests/**
  forbidden_paths:
  - data/assessment/**
  - data/model/**
  - data/curriculum/**
  - data/practices/protocols/**
  - data/practices/registries/activation_ledger.yaml
  - growth/models.py
  - growth/migrations/**
  - growth/services/canonical_import.py
  - growth/domain/composite_scoring.py
  - growth/services/composite_score_state.py
  - growth/domain/context_priority.py
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/workflows/**
acceptance:
- All 383 protocol packages and 1151 scored-action identities remain unchanged.
- Receipt validation rejects stale revisions, unresolved anchors, duplicate IDs, invalid dependencies
  and unresolved blockers.
- Scope, instruction, independent cold-start, integration, actual learner, qualified and owner decisions
  remain independent.
- Per-entry and per-artifact hashes do not invalidate neighboring entries in the same YAML.
- Mechanical defects fail closed; successful checks cannot establish semantic depth or authenticate a
  human.
- No source repair is selected for runtime and no content or human acceptance is fabricated.
- Hosted/browser/Compose verification limitations are retained explicitly.
validation:
  local:
  - .venv/bin/python docs/plans/m6k/reviews.py check --base 1a5ca67364a5a3025d32d17a0ebffb58688f4875 --output
    docs/authoring/quality/current-report.json
  - make full-frontier-check PYTHON=.venv/bin/python
  - ./scripts/agent-verify.sh contract
  - ./scripts/agent-verify.sh quick
  - make practice-report-check PYTHON=.venv/bin/python
  - make catalog-governance-audit-check PYTHON=.venv/bin/python
  - make composite-scoring-catalog-check PYTHON=.venv/bin/python
  - git diff --check
  required_ci:
  - Ruff Django pytest migration drift and manifest verification
  - all readiness and canonical report gates
  - Playwright core journeys
  - Compose backup restore and recreation
  - aggregate Pilot readiness gate
risk:
  class: high
  hazards:
  - noun-swapped content is misrepresented as individually authored
  - revised instructions invalidate an ongoing practice
  - source support is overstated as specialist or empirical validation
  - task completion is confused with mastery
  stop_conditions:
  - historical event replay changes
  - assessment or scoring mathematics changes
  - any missing or generic exercise is hidden by the coverage report
  - a required CI gate fails
rollback:
  strategy: Revert the content release before import or restore the verified pre-upgrade backup; never
    reinterpret existing event snapshots.
evidence:
  output:
  - docs/evidence/M6K-REVIEW-EVIDENCE-2026-09-08.md
  - docs/authoring/quality/current-report.json
  claim_boundary: Authored educational practices and software verification; no automatic human review
    or empirical validation acceptance.
