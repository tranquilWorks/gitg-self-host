  with complete fictional materials, worked examples, ordered outputs, later records, three fresh checks
  and corrective answers, support/harder routes and exact canonical scope maps.
- Retain exact domain 07 professional boundaries and absent domain 08 professional_boundary fields, classification,
  formation modes and measurement metadata. No diagnosis or qualified acceptance invented.
