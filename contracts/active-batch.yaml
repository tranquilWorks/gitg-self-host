acceptance:
- Owner explicitly requests the next twelve. Continue the existing twelve-per-report individual source-quality
  cadence and standing normal-merge authorization; application/CI/CD remains deferred, not passed. No
  protection bypass or deployment.
- Exact IDs 27.03–27.14; preserve all 237 preceding companions and 1119 prior source checks.
- Each guide needs substantive individual teaching, worked example, complete fictional inputs, ordered
  outputs, separate later outcomes, three fresh checks and corrective answers, access/support/harder routes
  and an exact canonical scope map.
- Teach changing seasons, held roles, sustainable reviews, bounded experiments and transition preparation
  without erasing obligations or inferring actual outcomes from plans.
- Separate ambition from worth, principles from revisable methods, mentorship from preparation, and maintainable
  contributions from recognition.
- Annual accounts retain missing evidence and unresolved repair. Optional roles can remain unchosen while
  real duties persist; alternative pathways retain the actual purpose and their specific evidence limits.
- All twelve retain exact cross-context classification, formation modes, measurement and absent professional_boundary
  fields. No diagnosis, prescribed recovery timetable, identity judgment or invented legal permission.
- >-
  Source coverage becomes 108 implemented plus 249 companions = 357/383; 26 remain: 07=14, 08=11, 27=1.
  Runtime remains 108/275/383/1151. Next sequential 27.15.
- Inspect primary sources with narrow claim/retrieval limits; review all canonical facets and 36 fresh answers.
  Formal A/B/C, independent cold-start, actual learner, qualified and owner acceptance remain pending.
- Run full source suite, focused Ruff, links, canonical/current/recovery/contract hashes, cases, exact
  coverage partition, manifest and scope audit. Preserve all earlier source/runtime/workflow/dependency
  paths.
