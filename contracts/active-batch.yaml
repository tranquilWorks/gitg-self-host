acceptance:
- Owner requests twelve more, continuing twelve-per-report quality and previously explicit normal-merge authorization.
  Standing source-quality CI/CD deferral remains; scoped normal merge is authorized despite generic target-pr-merge
  prohibition. No protection bypass, runtime integration or deployment.
- Exact new IDs 20.13–20.18,21.01,21.02,21.04–21.07.21.03 is already implemented and must be skipped. Preserve
  all 141 prior additional companions and 816 predecessor source checks; no new legacy companion.
- Each competency requires substantive individual teaching, worked example, complete original fictional materials,
  ordered inspectable outputs, separate later packet, three fresh checks/corrective answers, supported/harder/real
  transfer routes and exact canonical metadata. Sources must be actually inspected and limitations explicit.
- Six civic entries preserve cross_context_core and exact professional boundary. Six work entries preserve
  context_sensitive; their canonical records have no professional_boundary, so do not invent one as canonical.
  All retain cross_tradition_core_or_broadly_recurrent. Work is context-sensitive; paid employment or public
  civic participation is not compulsory.
- 20.13 separates manipulative mechanisms from falsehood, strong criticism, conspiracy proof and preferred-side
  bias; no targeting or dissemination.20.14 distinguishes dialogue/mediation/restorative processes from pressure
  methods, with consent, authority, risk and partial-progress review; fiction only for risky methods.20.15
  compares public conscience and convenience with alternatives, proportionate harm, transparency and accountability,
  without operational lawbreaking or waiving legal rights.
- 20.16 maps all six support areas and preserves received help without equal repayment, accepted handoffs,
  privacy and actual backup ownership.20.17 compares adequacy, incentives, access, dignity, cost and distribution
  with exact toy-pool arithmetic and correlated-shock shortfall; no real eligibility, actuarial or solvency
  finding.20.18 distinguishes truth, accountability, memory, repair, institutional reform and coexistence;
  no required forgiveness or testimony collection.
- 21.01 gives eight work-choice criteria, staying/redesign, hard constraints and a decision-reversing evidence
  check.21.02 retains explicit acceptance/deadline/checkpoint, early honest status, revised commitment and
  usable handoff.21.04 fixes an external criterion, critiques a component, practices two cases and tests whole-task
  transfer without a mastery claim.
- 21.05 distinguishes correctness/robustness/useful finish and two comparable uses targeting uncoached performance, with any assistance recorded; no invented safety certification
  or reputation.21.06 lets observed downstream task difficulty change a requirement, with comparable retry
  and nonuser/helper effects.21.07 maps interfaces, incentives, dependencies, constraints and failure modes,
  obtains receiver/owner agreement, tests changed readiness and checks shifted burden.
- Unique coverage is 108 implemented IDs plus 153 additional companion IDs=261 of383;122 remain to author including 25
  in 07–08. Preserve exact remaining list and per-domain counts. Legacy status alone does not close this pass.
  Runtime108 tailored/275 pending/383 protocols/1151 actions unchanged.
- Individual author review covers breadth, depth, usability, distinctiveness, all fresh answers and source/evidence
  limits. Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance
  remain pending. Word counts, fiction, source checks and merge do not prove learning or acceptance.
- Run full unfiltered source suite, focused Ruff, local links, exact six canonical/contract/current/recovery
  input hashes, case and coverage regressions, manifest and allowed/forbidden scope audit. Record failures
  and repairs honestly. Application/CI/CD remains deferred, not passed.
