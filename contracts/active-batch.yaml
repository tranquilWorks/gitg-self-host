schema_version: 1
batch:
  id: TRANQUILWORKS-DARK-THEME
  title: Apply the TranquilWorks dark palette throughout the application
  goal: Default dark presentation with consistent native fields, controls, dialogs, states and keyboard focus.
sources:
  product: gitg-self-host
  requirements:
  - Owner request of 12 November 2026; use tranquilworks.dev swatches
  baseline_commit: cc3b56a9c4662737022540c2970032c1dad8d63f
scope:
  allowed_paths:
  - growth/static/growth/dark_theme.css
  - templates/base.html
  - tests/test_dark_theme.py
  - tests/e2e/test_dark_theme.py
  - contracts/active-batch.yaml
  - docs/PROJECT_HANDOFF.md
  - docs/evidence/DARK-THEME.md
  - MANIFEST.tsv
  forbidden_paths:
  - data/**
  - reports/**
  - docs/authoring/**
  - growth/domain/**
  - growth/services/**
  - growth/models.py
  - growth/migrations/**
  - growth/static/growth/app.css
  - .github/**
  - contracts/verification.commands
acceptance:
- Default dark shell uses exact TranquilWorks surface, foreground, amber and moss swatches.
- Native fields, errors, warnings, destructive actions, selected answers and dialogs remain readable.
- Keyboard focus, hidden state, forced colors, reduced motion and mobile reflow are preserved.
- No behavioral, assessment, canonical, evidence, scoring, storage, permission, CI or deployment change.
validation:
  local:
  - scripts/agent-verify.sh contract
  - Focused presentation and existing shell regressions
  - Palette contrast and stylesheet ordering tests
  - Browser contrast, keyboard, dialog and responsive screenshot coverage
  hosted:
  - Existing repository quality, readiness, browser and Compose gates
risk:
  class: low
  hazards:
  - Dark mode can hide field errors, selected state or keyboard focus if only background colors change.
  stop_conditions:
  - Unexpected main drift, new runtime behavior or semantic changes, approval or access required
rollback:
  strategy: Revert the shared theme layer and base metadata; no saved data changes.
evidence:
  output:
  - docs/evidence/DARK-THEME.md
  claim_boundary: Software styling checks are not human accessibility or participant validation.
