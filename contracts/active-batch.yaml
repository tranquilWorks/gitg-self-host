acceptance:
- Gate entry and navigation by actual assessment state; show real onboarding progress.
- Make Home a stage-aware command center with explicit skip and truthful input explanations.
- Move the four profile explanation blocks and how-it-works copy to quick start.
- Rewrite all assessment prompts and answer labels in a separate display-only map.
- Automatically present canonical follow-ups and support single-key answer progression.
- Collapse import and share; confirm retake accessibly; keep completed assessment concise.
- Preserve canonical IDs values scorer selection rules golden fixtures history and later UXA scopes.
validation:
  local:
  - scripts/agent-verify.sh full
  - Relevant browser journeys and compose-smoke where available
  focused_tests_to_add:
  - Fresh assessed active and completed-loop Home; owner scope and stale skip rejection.
  - Complete display-map inventory and canonical assessment golden parity.
  - Keyboard progression automatic follow-ups retake import resume save and completed states.
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - Plain language must preserve item meaning numeric mappings and golden scores.
  - Skip is explicit user-choice deferral not evidence or an inferred N/A response.
  - Direction text is displayed for planning but never analyzed or fed to ranking.
  stop_conditions:
  - Protected content scoring or participant data change
rollback:
  strategy: Revert presentation and additive entry routes together; preserve assessment and context history.
evidence:
  output:
  - docs/evidence/UXA-02-03.md
  claim_boundary: Software verification only; no participant or specialist validation or deployment.
