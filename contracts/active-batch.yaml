acceptance:
- Exactly six new competency source packages retain individual guides, complete materials, fresh checks, corrective keys, access adaptations, and claim limits.
- Preserve the preceding fifteen source packages and their four test modules while consolidating them into the branch.
- Preserve all runtime content, 383 protocol IDs, 1151 action IDs, completion rules, activation, scoring, and historical replay sources unchanged.
- Runtime coverage remains 108 tailored and 275 pending; source publication does not count as runtime completion.
- Synchronize the root manifest for the actual published files before any merge-ready claim.
- Report executed source checks separately from full application, browser, Compose, and human acceptance.
validation:
  local:
  - python -m unittest discover -s tests -p '*sources.py' -v
  - ./scripts/verify-manifest.py
  - ./scripts/agent-verify.sh contract
  - git diff --check
  required_ci:
  - existing repository verification workflow
  - manifest and contract checks
  - applicable application and readiness regressions
  focused_tests_to_add:
  - Preserve source identities across all five cohorts
  - Verify model boundaries, provenance, time accounting, capacity, consent, and dependency cases
  - Verify the exact final manifest and forbidden-path preservation
risk:
  class: moderate
  hazards:
  - Authored sources are mistaken for runtime integration or human review
  - Earlier checkpoint notes are mistaken for current execution evidence
  - Source consolidation drops a prior cohort or changes protected content
  stop_conditions:
  - Any forbidden path changes
  - Missing source objects or mismatched source identities
  - A required check is falsely represented as passing
rollback:
  strategy: Revert the source-only branch change; no database import, live operation, deployment, or historical evidence mutation occurs.
evidence:
  output:
  - docs/evidence/M6K-SOURCE-CONSOLIDATION-RETRY.md
  claim_boundary: Source authorship and publication only until separately verified integration and human acceptance. No merge or deployment is inferred from the user's push request.
