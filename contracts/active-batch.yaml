schema_version: 1
batch:
  id: M6L-01-GUIDED-ENTRY
  title: Guide entry and discovery without changing the development model
  goal: Deliver a concise home-to-practice journey with explicit demo labeling, searchable exploration
    and accurate product copy.
sources:
  product: gitg-self-host
  requirements:
  - docs/PRODUCT_DECISIONS.md#decision-046
  - docs/plans/m6l/README.md
  - docs/plans/m6l/actions.yaml
  milestone: M6 Phase F / M6L-01
  baseline_commit: c0208be6c031b37c75657f8190e50305a691c463
dependencies: []
scope:
  allowed_paths:
  - contracts/active-batch.yaml
  - docs/plans/m6l/**
  - docs/evidence/M6L-01-GUIDED-ENTRY-20260929.md
  - docs/PROJECT_HANDOFF.md
  - growth/views.py
  - growth/views_practice.py
  - growth/services/practice_discovery.py
  - growth/services/personal_os_browser.py
  - templates/growth/home.html
  - templates/growth/practice_list.html
  - templates/growth/practice_card.html
  - templates/growth/personal_os.html
  - templates/growth/weekly_execution.html
  - templates/growth/practice_review_complete.html
  - tests/**
  - MANIFEST.tsv
  - scripts/verify_http_login.py
  - growth/static/growth/guided_entry.css
  - templates/base.html
  forbidden_paths:
  - data/**
  - reports/**
  - docs/authoring/**
  - growth/models.py
  - growth/migrations/**
  - growth/domain/**
  - growth/services/canonical_import.py
  - growth/services/profile.py
  - growth/services/context_priority.py
