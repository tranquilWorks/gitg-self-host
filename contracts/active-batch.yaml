acceptance:
- 'Exactly 10.12, 10.13 and 10.14 become individually authored runtime practices: 108 tailored, 275 pending.'
- Apprenticeship includes complete harmless bow instructions, observation and correction records, simulated
  checks and a separate voluntary live route.
- Transmission includes a complete fictional holder packet, flawed handoff, permission record and holder-verification
  boundary.
- Accessible learning includes a complete grid, comparable three-position two-move routes, learner-stated
  barrier and separate usability and performance checks.
- Every guide includes complete materials, different worked example, separately revealed checks, accessible
  or advanced route and bounded outcome examples.
- Preserve 383 protocol IDs, 1151 action IDs, parent mappings, completion rules, activation, scoring and
  immutable event replay.
- Preserve 383 protocol IDs, 1151 action IDs, parent mappings, completion rules, activation, scoring and
  immutable event replay.
- Recovery archive stays byte-exact; prospective content is checked against pinned originals and exact
  compiler output.
- Formal independent, actual learner, qualified and owner acceptance are not inferred.
validation:
  local:
  - .venv/bin/python -m pytest tests/test_m6k_guided_learning.py tests/test_m6k_independent_teaching_breadth.py
    tests/test_m6k_learning_loop.py tests/test_m6k_inquiry_notes.py tests/test_m6k_learning_craft.py tests/test_m6k_physical_capacity.py
    tests/test_tailored_practice_authoring.py tests/test_m6k_recovery.py tests/test_m6k_review_evidence.py
    -q
  - ./scripts/agent-verify.sh contract
  - make pilot-check curriculum-check competency-evidence-check
  - git diff --check
  required_ci:
  - Ruff Django pytest migration drift and manifest verification
  - all readiness and canonical report gates
  - Playwright core journeys
  - Compose backup restore and recreation
  - aggregate Pilot readiness gate
  focused_tests_to_add:
  - Exact identity and completion preservation for three runtime projections
  - Six prompt/key reveal boundaries and three served Django guides
  - Task-grounded correction, permission and matched-route fixtures
  - Three prospective recovery-drift rejections
  - Desktop/mobile keyboard reveal through compiled guides
risk:
  class: moderate
  hazards:
  - Simulation is mislabeled as live guided learning
  - Accurate knowledge is distributed outside permission
  - An access adaptation abandons the construct or implies diagnosis
  - One supported trial is promoted into causal or durable learning evidence
  stop_conditions:
  - historical event replay changes
  - assessment, activation or scoring mathematics changes
  - a prompt exposes its answer key before an attempt
  - A promised cord reference, holder packet, route, record or answer check is missing
  - a required local gate fails
rollback:
  strategy: Revert the content release before import or restore the verified pre-upgrade backup; never
    reinterpret existing event snapshots.
evidence:
  output:
  - docs/evidence/M6K-APPRENTICESHIP-TRANSMISSION-ACCESS-RUNTIME.md
  claim_boundary: Authored educational practices and software verification; no automatic formal, independent
    learner, qualified, owner or empirical validation acceptance.
