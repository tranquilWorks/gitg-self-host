schema_version: 1
batch:
  id: M6K-QA01-CRAFT-REPAIR
  title: Verify instructional prerequisites and finish the supplied craft exercise
  goal: Retain actual browser and prerequisite verification; complete and desk-check the 21.03 materials
    without claiming full A/B/C or human acceptance.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/program.json
  - https://github.com/tranquilWorks/gitg-self-host/issues/60
  milestone: M6K-02-01
  baseline_commit: 6173b1e15596ac883fd08f9c4c1f4967f3450c6a
dependencies:
- M6K-01-01-evidence-reconciliation
- M6K-01-02-merged
- M6K-01-03-merged
scope:
  allowed_paths:
  - MANIFEST.tsv
  - contracts/active-batch.yaml
  - docs/plans/m6k/program-receipts.json
  - docs/plans/m6k/README.md
  - docs/plans/m6k/CONTINUATION.md
  - docs/PROJECT_HANDOFF.md
  - docs/evidence/**
  - docs/authoring/exercises/21.yaml
  - docs/authoring/quality/21.03/**
  - docs/authoring/quality/current-report.json
  - tests/test_m6k_2103.py
  - tests/e2e/test_instructional_content.py
  forbidden_paths:
  - data/assessment/**
  - data/model/**
  - data/curriculum/**
  - data/practices/protocols/**
  - data/practices/registries/activation_ledger.yaml
  - growth/models.py
  - growth/migrations/**
  - growth/services/canonical_import.py
  - growth/domain/composite_scoring.py
  - growth/services/composite_score_state.py
  - growth/domain/context_priority.py
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/workflows/**
acceptance:
- Instructional browser evidence is retained and visually reviewed against the exact tested sources.
- Only supported software prerequisite criteria and the targeted QA-01 repair receive program dispositions;
  release and human gates stay explicit.
- The default supplies three briefs, matching keys, a usable record and observable accuracy/access criteria.
- A plausible wrong date and missing contact fail the standard; a genuine default dry-run is retained.
- Only competency 21.03 authoring changes; all runtime packages, scoring, canonical IDs and neighbors
  remain exact.
validation:
  local:
  - .venv/bin/python -m pytest tests/test_m6k_2103.py tests/test_m6k_repair_drafts.py tests/test_instructional_content.py
    -q
  - ./scripts/agent-verify.sh contract
  - git diff --check
  required_ci:
  - Ruff Django pytest migration drift and manifest verification
  - all readiness and canonical report gates
  - Playwright core journeys
  - Compose backup restore and recreation
  - aggregate Pilot readiness gate
  focused_tests_to_add:
  - Supplied work record and access procedure
  - Incorrect output and separate checking
  - Exact neighbor and runtime preservation
risk:
  class: high
  hazards:
  - noun-swapped content is misrepresented as individually authored
  - revised instructions invalidate an ongoing practice
  - source support is overstated as specialist or empirical validation
  - task completion is confused with mastery
  stop_conditions:
  - historical event replay changes
  - assessment or scoring mathematics changes
  - any missing or generic exercise is hidden by the coverage report
  - a required CI gate fails
rollback:
  strategy: Revert the content release before import or restore the verified pre-upgrade backup; never
    reinterpret existing event snapshots.
evidence:
  output:
  - docs/evidence/M6K-QA01-CRAFT-REPAIR.md
  claim_boundary: Authored educational practices and software verification; no automatic human review
    or empirical validation acceptance.
