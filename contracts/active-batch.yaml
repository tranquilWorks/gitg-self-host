acceptance:
- Owner requests another twelve, retaining individual quality and previously explicit normal-merge authorization.
  Standing source-quality CI/CD deferral remains; scoped normal merge is authorized despite generic target-pr-merge
  prohibition. No protection bypass, runtime integration or deployment.
- Exact new IDs 21.08–21.19, completing domain 21 source authoring. Preserve all 153 prior additional companions
  and 853 predecessor source tests; no new legacy companion.
- Each competency requires substantive individual explanation, worked example, complete original fictional materials,
  ordered inspectable outputs, separate later packet, three checks and corrective answers, supported/harder/real
  transfer routes and exact canonical metadata. Inspect actual sources and state retrieval and transfer limits.
- All twelve retain context_sensitive and cross_tradition_core_or_broadly_recurrent, formation modes and measurement
  metadata. No canonical professional_boundary field exists for these records; do not invent one. Practical safeguards
  remain explicit. Employment, union participation, disclosure and career change are not compulsory.
- 21.08 distinguishes verified requirements, accepting authority, scope tradeoffs and maintenance handover. 21.09
  confirms dependencies, repairs constructive challenge, records shared credit and receiver readiness. 21.10 supplies
  four comparable five-file trials, outcome and maintenance costs, and honest causal limits.
- 21.11 supplies dated contradictory fictional demand signals and a complete numerical transfer sample without forecasts
  or credentials. 21.12 traces output to beneficiary, tests a contribution claim and retains harms or distant uncertainty.
  21.13 supplies executable successor materials, rationale, exception, retry and accepted upkeep ownership.
- 21.14 applies consequence-specific quality and reversibility to three tasks; timer never waives essential checks.
  21.15 classifies all eight workplace issues and distinguishes jurisdiction, coverage, source freshness, inquiry,
  charge, deadline and personal ruling. 21.16 distinguishes demanding work from coercive dependence and compares
  safe independent support routes without demanding confrontation or resignation.
- 21.17 compares four voice mechanisms, authority, governance, consent, cost and coverage; public-sector change
  must revise the private-sector analysis. 21.18 preserves five factual outcomes plus clarification across modes,
  checks shifted barriers and retains actual authority. 21.19 records urgency, coverage, negotiated boundary, real
  versus claimed protected time and worth beyond output.
- Unique source-authoring coverage is 108 implemented plus 165 additional companion IDs = 273 of 383; 110 remain,
  including 25 in 07–08. Preserve the full exact partition. Legacy status alone does not close this pass. Runtime
  108 tailored / 275 pending / 383 protocols / 1151 actions is unchanged.
- Individual author review covers breadth, depth, usability, distinctiveness, all answers and source/evidence limits.
  Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance remain pending.
  Fiction, tests, word counts and merge prove neither learning nor formal acceptance.
- Run the full unfiltered source suite, focused Ruff, local links, four canonical/contract/current/recovery file
  hashes, selected exercise entry comparison, coverage and case regressions, manifest and allowed/forbidden scope
  audit. Current/recovery domain 21 already differ at implemented 21.03; preserve both full files and compare selected
  entries. Record actual failures and repairs. Application/CI/CD deferred, not passed.
