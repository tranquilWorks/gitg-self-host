acceptance:
- Owner explicitly requests twelve more and the remaining count. Preserve twelve per report, individual
  quality, standing source-quality CI/CD deferral and prior explicit normal-merge authorization. Normal
  scoped merge is authorized despite generic target-pr-merge prohibition; no protection bypass, runtime
  integration or deployment.
- Exact IDs 20.01–20.12. Preserve all 129 earlier additional companions and 779 source tests. No implemented
  or retained-legacy ID in this new batch; stop after twelve.
- Each competency requires substantive individual teaching, worked example, complete original fictional
  case, ordered actions with inspectable outputs, separate later packet, three fresh checks/corrective
  answers, supported/harder/real transfer routes, exact canonical scope/classification/measurement and
  inspected primary or first-party sources.
- All twelve retain cross_context_core applicability, cross_tradition_core_or_broadly_recurrent normative
  status and exact domain20 professional boundary. This classification does not compel political belief,
  affiliation, voting, volunteering, public disclosure or participation. Keep civic education nonpartisan
  and safe; real legal questions require qualified local guidance.
- Interdependence traces infrastructure, labor, law, knowledge, environment and inherited institutions
  without unlimited debt. Civic navigation separates operator, policy, budget, election, complaint and
  court authority and verifies actual local routes; fiction and inquiry receipt do not establish actual
  authority or policy change.
- Rights apply consistently across disliked viewpoints with relevant conduct, safety evidence, proportionate
  response and review. General human-rights principles do not establish local enforceability. Structural
  analysis separates observed gaps, individual choices and plausible mechanisms; no identity inference,
  causal certainty or unnecessary demographic collection.
- Cross-difference cooperation preserves corrected representation, actual conviction, boundaries and accepted
  task. Volunteer work responds to a verified requested need, tracks correction/support burden and repeats
  or responsibly hands off without publicity or regulated-care overreach.
- Helping preserves recipient-selected support, credentials, choices and desired outcome; gratitude is
  not useful-capacity evidence and ongoing support is legitimate. Organizing needs consenting stakeholders,
  accepted roles, permission, a user-tested result and maintenance ownership; a charter alone is not community
  impact.
- Public information work traces original context, independent versus copied sources, bounded attention
  and correction to the original audience. Commons work is permitted, reversible and user-tested with
  stewardship; no ecological restoration claim from a label or unsupported data.
- Pluralist rules distinguish conduct from belief, accommodate access and allow dissent/review without
  excusing harassment or mistaking silence for consent. Institutional literacy distinguishes eight institution
  types, source handoffs, method, incentives and accountability without assuming prestige proves truth
  or funding proves fraud.
- Compute exact unique coverage from 108 implemented IDs and actual companion-guide paths, not incompatible
  cohort schemas or counting legacy IDs as tailored. Prior source129 to new141; disjoint union249 of383;
  authoring remaining134 including25 in domains07–08. Runtime108 tailored/275 pending/383 protocols/1151
  actions unchanged. Preserve remaining ID list and per-domain counts.
- Individual author review covers all facets, depth, usability, distinctiveness, source limits, all fresh
  answers and missing human evidence. Word counts and automated checks do not establish pedagogy, qualified
  acceptance or formal review. Formal M6K A/B/C, independent cold-start, actual learner, qualified and
  owner content acceptance remain pending.
- Run full source suite, focused Ruff, link/anchor checks, exact canonical/current/recovery hashes, case
  and coverage regressions, manifest and allowed/forbidden scope audit. Record actual results. Application/CI/CD
  gates remain deferred, not passed.
validation:
  local:
  - python -m unittest discover -s tests -p "*sources.py" -v
  - python -m ruff format --check tests/test_m6k_civic_participation_sources.py
  - python -m ruff check tests/test_m6k_civic_participation_sources.py
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci: []
  focused_tests_to_add:
  - Exact civic scope, measurement and professional boundary
  - Exact unique source/runtime coverage and remaining IDs
  - Six interdependence branches and reciprocal endpoint
  - Operator/advisor/authority versus inquiry status
  - Identity swap, credible safety fact and due process
  - Attendance arithmetic, confounding and no demographic inference
  - Corrected viewpoint versus retained conviction and accepted task
  - Repeated requested service, corrected outputs and support burden
  - Recipient choice versus helper control
  - Accepted roles, partial result and maintenance
  - Claim context, source dependence and correction
  - Permitted commons repair versus ecological claim
  - Pluralist cases, accommodation and challenge route
  - Institutional handoffs, survey denominator and accountability
risk:
  class: moderate
  hazards:
  - Generic content hiding distinct scope
  - Unverified legal, institutional or causal claims
  - Partisan or coerced participation and private identity collection
  - Claims of impact without accepted handoff or usable output
  - Source/runtime count conflation or double counting
  - Fabricated learner, specialist or acceptance evidence
  stop_conditions:
  - Protected-path drift
  - Unresolved material source defect or failing source verification
  - Non-fast-forward push requiring destructive history repair
rollback:
  strategy: Revert this source-only batch; no participant data, migration or deployment is involved.
evidence:
