acceptance:
- Complete issue 120 bounded discovery rationale and consistent owner-scoped active-attempt links.
- Complete issue 121 readable guide setup check-ins and evidence without changing captured records.
- Preserve authentication ownership CSRF explicit consent signed reuse and immutable versioning.
- Preserve canonical assessment evidence scoring ranking and all later UXA scopes.
validation:
  local:
  - scripts/agent-verify.sh full
  - Relevant browser journeys and compose-smoke where available
  focused_tests_to_add:
  - Browser work guide weekly and Home refer to the same active attempt; completion updates display.
  - Exact check-in values evidence replay and canonical instructions remain unchanged.
  - Relevant observation fields and recovery remain usable with and without JavaScript.
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - Timing presentation must not alter canonical action intervals or completion gates.
  - Human-readable summaries must not hide contrary evidence or imply scoring or mastery.
  - Selection presentation must not change ranking or infer missing context.
  stop_conditions:
  - Protected content scoring or participant data change
rollback:
  strategy: Revert this presentation batch together; preserve all saved records and original routes.
evidence:
  output:
  - docs/evidence/UXA-06-07.md
  claim_boundary: Software verification only; no participant or specialist validation or deployment.
