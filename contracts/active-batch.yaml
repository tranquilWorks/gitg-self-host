acceptance:
- The owner explicitly doubled the reporting iteration from six to twelve on 23 September 2026 and instructed
  begin. Carry forward authorized source vetting, publication and normal merge with CI/CD deferred. Do
  not bypass branch protection or claim deployment, runtime integration or human acceptance.
- 'Exact IDs: 14.05–14.13 and 15.01–15.03. Preserve all 45 earlier source companions and 512 source tests.
  Twelve is the continuing reporting cadence, not permission to consume the backlog.'
- Each competency requires individual concept teaching, worked example, complete fictional practice materials,
  ordered bounded actions and observable artifacts, later outcomes, three fresh checks with corrective
  keys, accessibility adaptations, harder and real transfer routes, exact canonical facet mapping and
  inspected sources.
- Scams use independent channels and exposure-specific recovery. Feeds separate observation from algorithm
  inference. AI audits claims, bias and human responsibility. Provenance does not prove truth; copied
  claims do not become independent evidence.
- Online conduct preserves privacy and consent. Rights records distinguish permission, credit, commercial/adaptation
  conditions and code licenses. Fallbacks require actual retrieval of harmless materials, freshness and
  duplicate-safe reconciliation. Platform policy must include accessible appeals and feasible capacity.
- First-aid procedures remain qualified-instruction work; calls are harmless rehearsal and enrollment
  is not assessed skill. Household planning must preserve individual care plans and safe drills. Awareness
  concerns observable hazards and functional access, not profiling or hypervigilance.
- Expected additional-source count 57; runtime stays 108 tailored, 275 pending, 383 protocols and 1151
  actions. Formal quality/human-review counts unchanged.
- Run the full source suite, focused Ruff, links, canonical/input hashes, actual source-material checks,
  manifest and allowed/forbidden scope audit. Record exact outcomes and remaining gaps.
