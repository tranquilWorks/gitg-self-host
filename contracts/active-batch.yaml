acceptance:
- Owner requests another twelve, retaining individual quality and previously explicit normal-merge authorization.
  Standing source-quality CI/CD deferral remains; scoped normal merge is authorized despite generic target-pr-merge
  prohibition. No protection bypass, runtime integration or deployment.
- Exact new IDs 22.13–22.17 and 23.01–23.07. Preserve all 177 prior additional companions and 927 predecessor source
  tests; no new legacy companion.
- Each competency requires substantive individual explanation, worked example, complete original fictional materials,
  ordered inspectable outputs, separate later packet, three checks and corrective answers, supported/harder/real
  transfer routes and exact canonical metadata. Inspect actual sources and state retrieval and transfer limits.
- Five governance entries retain role_conditional applicability and normative status with no canonical professional_boundary.
  Seven financial entries retain context_sensitive applicability, cross_tradition_core_or_broadly_recurrent status
  and their exact financial professional_boundary. Preserve all formation and measurement metadata.
- Individually cover anti-corruption, capture, protected dissent, accountable governance, institutional repair,
  financial literacy, cash-flow budgeting, reserves, debt, investing/retirement, dependent protection and consumption.
  Complete original cases must retain mixed outcomes, arithmetic assumptions, actual authority and source/jurisdiction
  limits. No actual investigation, disclosure, financial transaction or personal legal/financial ruling.
- Unique source coverage is 108 implemented plus 189 additional companions = 297 of 383; 86 remain, including 25
  in 07–08. Preserve exact partition. Legacy status alone does not close this pass. Runtime 108 tailored / 275 pending
  / 383 protocols / 1151 actions is unchanged.
- Individual author review covers breadth, depth, usability, distinctiveness, all answers and source/evidence limits.
  Formal M6K A/B/C, independent cold-start, actual learner, qualified and owner content acceptance remain pending.
  Fiction, tests, word counts and merge prove neither learning nor formal acceptance.
- Run full unfiltered source suite, focused Ruff, local links, six canonical/contract/current/recovery hashes, selected
  exercise comparisons, coverage/case regressions, manifest and allowed/forbidden scope audit. Current/recovery
  domains 22 and 23 match; preserve all full files. Record actual failures and repairs. Application/CI/CD deferred,
  not passed.
