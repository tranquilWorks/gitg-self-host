acceptance:
- Owner requested another twelve with no quality compromise. Carry forward explicit source-quality publication
  and normal merge authorization; CI/CD remains deferred. No branch-protection bypass, deployment or runtime
  integration.
- Exact IDs 15.04–15.14 and 16.01. Preserve all 57 earlier additional source companions and 552 source
  tests. Twelve is a reporting batch, not permission to consume the backlog.
- Each competency requires substantive individual teaching, worked example, complete fictional practice
  materials, ordered actions and observable outputs, separate later outcomes, three fresh checks with
  corrective answers, adaptations, harder and real transfer routes, exact canonical mapping and inspected
  primary sources.
- Explicit per-competency author review must address facet coverage, usable default, distinctiveness from
  adjacent/prior work, answer-key discrimination, source limits and remaining human/qualified evidence.
  Word counts and passing tests do not establish pedagogical quality.
- Physical safety practice must remain benign, consenting and within competence. Paper judgment, enrollment
  and dryland work never demonstrate defensive, outdoor, aquatic or rescue competence. Legal examples
  retain jurisdiction and setting limits.
- Cyber incident signals, verified access, containment, financial dispute and identity recovery remain
  separate statuses. Contingencies require real ownership, available reserves, finite capacity, triggers
  and recovery handback.
- Community rehearsal retains voluntary roles, privacy, welfare-check boundaries and unmet needs. Public-health
  actions require current setting-specific guidance, accessible alternatives and no invented clinical
  regimen. Bystander action preserves targeted-person agency.
- Workplace controls prioritize hazard removal and authorized qualified isolation; no machinery intervention
  drill. Listening requires actual speaker correction/confirmation for real progress, not inferred agreement
  or a canned summary.
- Expected additional source count 69; runtime stays 108 tailored, 275 pending, 383 protocols and 1151
  actions. Formal quality/human-review counts unchanged.
- Run full source suite, focused Ruff, links, canonical/input hashes, source-case checks, manifest and
  allowed/forbidden scope audit. Record exact results and limitations.
