  title: Global plain-language accessibility disclaimer and login shell
  goal: Implement issue 115 only; preserve all later UXA work as open.
sources:
  product: gitg-self-host
  requirements:
  - docs/plans/OWNER_UX_TEST_FEEDBACK_2026-10-07.md
  milestone: UXA-01 / issue 115
  baseline_commit: c85b97edce9882bffc99192e8345689f5661dbe4
dependencies:
- PR-113
scope:
  allowed_paths:
  - contracts/active-batch.yaml
  - .env.example
  - grounded_growth/urls.py
  - grounded_growth/settings.py
  - grounded_growth/middleware.py
  - growth/views_accounts.py
  - growth/static/growth/application.css
  - growth/static/growth/application.js
  - templates/base.html
  - templates/registration/login.html
  - templates/registration/create_account.html
  - templates/growth/data_policy.html
  - templates/growth/data_management.html
  - templates/growth/profile.html
  - templates/growth/weekly_execution.html
  - templates/growth/personal_os.html
  - tests/test_uxa_shell.py
  - tests/test_auth_and_health.py
  - tests/test_shadow_scoring.py
  - tests/test_personal_os_browser.py
  - tests/e2e/test_uxa_shell.py
  - docs/PROJECT_HANDOFF.md
  - docs/evidence/UXA-01.md
  - docs/uxa-shell.md
  - MANIFEST.tsv
  forbidden_paths:
  - data/**
  - reports/**
  - docs/authoring/**
  - growth/models.py
  - growth/migrations/**
  - growth/services/**
  - .github/**
  - contracts/verification.commands
acceptance:
- Deliver functional ordinary account creation with CSRF/password validation and operator disable switch.
- Consolidate shared footer limitations and hosting/data responsibilities in one public policy page.
- Add keyboard-operable dismissible help and visible focus; preserve real error and safety content.
- Preserve scoring evidence canonical content historical instructions and all later UXA scopes.
validation:
  local:
  - scripts/agent-verify.sh full
  - Relevant browser journeys and compose-smoke where available
  focused_tests_to_add:
  - Registration permission CSRF duplicate disabled and password paths; policy and keyboard help.
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - Public registration must never grant administration privileges.
  - Policy must not imply self-hosting is anonymous or erase separate backups.
  stop_conditions:
  - Protected content scoring or participant data change
rollback:
  strategy: Revert presentation and additive routes together; created accounts remain ordinary user data.
evidence:
  output:
  - docs/evidence/UXA-01.md
  claim_boundary: Software verification only; no participant or specialist validation or deployment.
