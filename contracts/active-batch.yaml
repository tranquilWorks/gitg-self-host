acceptance:
- Track at most five complete editorial passes with exact per-competency repairs and verification; do
  not equate follow-up closure with formal acceptance.
- Preserve all 383 stable protocol IDs, 1151 action IDs, canonical definitions, mappings, activation,
  scoring/completion and historical replay.
- No changes to frozen legacy packages or retained evidence rules; no runtime projection of the 275 companions
  in this content-quality scope.
- Retain original audit as a historical snapshot; superseding source changes make its current-tree hash
  checks stale by design.
- Keep source-only, simulated, desk, actual learner, qualified and owner evidence separate.
- Use existing source tests; revise literal wording checks only to enforce the corrected substantive requirement,
  never waive a failing gate.
- Application/browser/Compose/CI/CD remain deferred under the standing content priority.
validation:
