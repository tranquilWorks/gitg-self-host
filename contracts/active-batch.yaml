  - Mind-reading, cultural stereotypes or unsupported outcome promises
  - Coercive persuasion, forced blame or humiliation
  - Invented participant evidence or formal acceptance
  stop_conditions:
  - Protected-path drift
  - Unresolved material source defect or failing source verification
  - Non-fast-forward push requiring destructive history repair
rollback:
