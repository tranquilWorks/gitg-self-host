acceptance:
- Owner requests the next batch of thirteen so the remaining twenty-six can finish in two iterations.
  This iteration is 27.15 and 07.01–07.12 only; standing normal-merge authorization and source-quality
  CI/CD deferral continue.
- Preserve all 249 preceding companions and 1160 prior source checks. Each new guide needs original substantive
  teaching, complete fictional inputs, worked example, ordered outputs, separate later packet, three fresh
  checks with corrective answers, support/harder routes and canonical scope map.
- Receiving distinguishes freely offered goods, real obligations, coercive offers and absent gratitude.
  Emotional differentiation separates observation, hypothesis, intensity, meaning and urge; body cues
  are neither diagnoses nor universal signatures.
- Pauses return to the issue; ordinary graduated approach preserves access supports, actual risk and local
  stop limits without presenting a clinical exposure protocol. No prescribed-support removal, forced distress
  or generalized safety threshold.
- Anger and expression protect consent and proportion. Grief has no required timetable or meaning. Shame
  repair preserves responsibility without demanding forgiveness. Comparison cannot authorize surveillance
  or possession.
- Self-compassion keeps care, consequences and renewed effort distinct; hope retains hardship and unknown
  outcomes; adaptation preserves adverse results and causal uncertainty.
- Preserve exact canonical entries, classification, formation modes, measurement and domain 07 professional
  boundaries; 27.15 has no professional_boundary field. No invented clinical, legal, specialist or learner
  acceptance.
- 'Source coverage becomes 108 implemented + 262 companions = 370/383; thirteen remain: 07.13–07.14 and
  08.01–08.11, including legacy 08.02. Runtime remains 108/275/383/1151.'
- Inspect primary resources with dated narrow claim and retrieval limits; review all thirteen and all
  39 fresh answers. Formal A/B/C, independent cold-start, actual learner, qualified and owner acceptance
  remain pending.
- Run full source suite, focused Ruff, links, exact input/source hashes, case calculations and boundaries,
  disjoint coverage, manifest, whitespace and allowed/forbidden audit. Full application/browser/Compose/CI/CD
  deferred, not passed; no bypass or deployment.
