  - Unverified legal, policy, financial or causal claims
  - Political coercion, private data, operational lawbreaking or unsafe care
  - Claimed effectiveness, reliability or mastery beyond supplied evidence
  - Source/runtime double counting
  - Fabricated human or independent acceptance
