acceptance:
- Owner continuation “next batch” on 24 September 2026 retains twelve per report, individual quality and
  prior explicit normal merge authorization. Source-quality workflow defers CI/CD. Normal merge authorization
  overrides generic target-pr-merge prohibition for this batch only; no protection bypass, runtime integration
  or deployment.
- Exact IDs 17.08–17.14 and 18.01–18.05. Preserve all 93 earlier additional companions and 671 source
  tests. Scope ends after twelve.
- Each competency requires substantive individual teaching, worked example, complete original fictional
  case, ordered actions and inspectable outputs, separate later packet, three fresh cases and corrective
  answers, supported/harder/real transfer routes, full canonical scope/classification/measurement and
  inspected primary sources.
- Author review checks each facet, depth, usability, distinctiveness, answer discrimination, source limits
  and absent human evidence; length and tests do not validate pedagogy.
- 17.08–17.14 are cross-context core. 18.01–18.05 retain role-conditional applicability/normative status
  and the exact professional boundary. No new legacy companion; all existing legacy runtime content stays
  protected.
- Collaboration requires willing roles, actual handoff and accurate credit; discussion alone cannot establish
  added value. Belonging is not a headcount, loneliness cure or requirement to fill every social category.
- Networking uses separate consent and minimal sharing; mentorship is reciprocal and contextual with adult-only
  default. Inherited duties need a protected good and fair burden review, not unlimited entitlement or
  withdrawal of essential care.
- Deep difference and group dissent preserve real disagreement, conscience and dignity without forced
  identity debate or retaliation. Contribution does not purchase assent or create authority over others.
- Partnership exercises are voluntary lawful adult and role-conditional. Preserve single life and fictional/no-attempt
  routes. No coerced romance, surveillance, loyalty tests, diagnosis, disclosure quotas or compelled sacrifice/reconciliation.
- Abuse, threats, stalking, coercive power, unsafe dependency, medical/legal/safeguarding concerns require
  appropriate qualified resources; ordinary mutual communication exercises do not replace safety support.
  No private intimate content in the application.
- Expected additional source count 105; runtime stays 108 tailored, 275 pending, 383 protocols and 1151
  actions. Formal M6K A/B/C, independent, actual learner, qualified and owner content acceptance remain
  pending.
- Run full source suite, focused Ruff, links, exact canonical/current/recovery hashes, meaningful case
  regressions, manifest and allowed/forbidden scope audit. Record actual results and limits.
