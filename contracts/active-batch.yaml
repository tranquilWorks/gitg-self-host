schema_version: 1
batch:
  id: M6K-REASONING-FOUNDATIONS-SOURCES
  title: Individual reasoning guides and independent source checks
  goal: Author complete source candidates for 09.01 through 09.03 while preserving the verified 108 tailored and 275 pending runtime baseline until canonical integration is verified.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/program.json
  - docs/authoring/reasoning-foundations/SCOPE-MAP.md
  milestone: M6K-09.01-09.03-SOURCE-CHECKPOINT
  baseline_commit: d93532696d3ea9d04e50f47350b90fa255208511
dependencies:
- PR-77-merged
scope:
  allowed_paths:
  - contracts/active-batch.yaml
  - MANIFEST.tsv
  - docs/authoring/reasoning-foundations/**
  - docs/evidence/M6K-REASONING-FOUNDATIONS-SOURCES.md
  - tests/test_m6k_reasoning_sources.py
  forbidden_paths:
  - data/assessment/**
  - data/model/**
  - data/curriculum/**
  - data/practices/**
  - growth/**
  - docs/authoring/exercises/**
  - contracts/tailored-practice-authoring.yaml
  - docs/plans/m6k/recovery/**
  - docs/plans/m6k/runtime-projections.json
  - docs/authoring/quality/ledger.json
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/workflows/**
acceptance:
- Exactly three source candidates have distinct complete guides, separate fresh prompts, separate answer guidance, adaptations, progression, outcome distinctions and evidence limits.
- Every canonical element of 09.01, 09.02 and 09.03 is mapped individually to teaching and a check.
- All fictional facts needed to attempt the exercises are supplied; inference and numerical examples are independently checked.
- The canonical real-choice indicator for 09.03 remains unestablished by fictional exercises alone.
- No runtime source selection, scoring, activation, completion, historical event or formal review state changes.
- The source checkpoint does not count as 111 tailored runtime competencies.
- Root manifest synchronization and applicable repository checks remain merge prerequisites, not waived gates.
validation:
  local:
  - python -m unittest discover -s tests -p test_m6k_reasoning_sources.py -v
  - ./scripts/agent-verify.sh contract
  - git diff --check
  required_ci:
  - existing repository verification workflow
  - manifest verification
  - existing readiness and regression gates
  focused_tests_to_add:
  - Exact source cohort and unchanged count declarations
  - Observation provenance and prompt-key-fixture alignment
  - Exhaustive Boolean counterexamples and closed-inventory premise checks
  - Decision arithmetic, missing-access handling and unchanged-preference case
  - Learner tables matched to executable fixtures
risk:
  class: moderate
  hazards:
  - Source authorship is mistaken for canonical runtime integration
  - A report is promoted into verified motive or actor identity
  - Validity is confused with premise truth or a fallacy with the opposite conclusion
  - Bias vocabulary is substituted for a performed process correction
  - Fictional rehearsal is mislabeled as actual learner or real-choice evidence
  stop_conditions:
  - Any forbidden path changes
  - A required gate fails and is represented as passing
  - A runtime or formal-review count is advanced without corresponding evidence
rollback:
  strategy: Revert this source-only checkpoint; it performs no database import or deployment.
evidence:
  output:
  - docs/evidence/M6K-REASONING-FOUNDATIONS-SOURCES.md
  claim_boundary: Authored source material and standalone source checks only; no canonical projection, application, browser, Compose, independent learner or formal acceptance claim.
