schema_version: 1
batch:
  id: M6L-02-CONTEXT-ALTERNATIVES
  title: Respect explicit context and make alternatives reviewable
  goal: Exclude N/A/deferred choices from fallback, save partial explicit fit, and offer deliberate
    exploration and review of deferred choices.
sources:
  product: gitg-self-host
  requirements:
  - docs/PRODUCT_DECISIONS.md#decision-046
  - docs/plans/m6l/README.md
  - docs/plans/m6l/actions.yaml
  - docs/context-discovery-policy.md
  milestone: M6 Phase F / M6L-02
  baseline_commit: 1274ff1969178bd863c5ab1e2d21c436a9ea2ef5
dependencies:
- M6L-01
scope:
  allowed_paths:
  - contracts/active-batch.yaml
  - docs/plans/m6l/**
  - docs/evidence/M6L-0*-*.md
  - docs/PROJECT_HANDOFF.md
  - docs/context-discovery-policy.md
  - growth/services/personal_os_browser.py
  - growth/services/context_review.py
  - growth/views_practice.py
  - growth/forms.py
  - growth/urls.py
  - growth/static/growth/personal_os.js
  - templates/growth/practice_context.html
  - templates/growth/context_review.html
  - templates/growth/practice_list.html
  - templates/growth/home.html
  - templates/growth/personal_os.html
  - tests/**
  - MANIFEST.tsv
  forbidden_paths:
  - data/**
  - reports/**
  - docs/authoring/**
  - growth/models.py
  - growth/migrations/**
  - growth/domain/**
  - growth/services/canonical_import.py
  - growth/services/profile.py
  - growth/services/context_priority.py
  - .github/**
  - Dockerfile
  - docker-compose.yml
  - growth/static/growth/app.css
acceptance:
- Document and test no-context, partial-context, all-deferred and all-N/A flows; explicitly excluded
  choices are not presented as personalized recommendations.
- Guide a small shortlist through explicit factors progressively; unknown remains unknown; avoid
  a six-factor-times-383 worksheet.
- If no reviewed alternative exists, offer deliberate exploration and context review of another candidate
  without silently imputing context or expanding the ranked cohort.
- Show a private list of deferred choices and review horizons; reconsidering requires an explicit
  revision and produces no penalty.
- Record accepted behavior and preserve scoring, prior context snapshots and deterministic replay;
  add edge-case and browser coverage.
- Corrupt context suppresses suggestions; prior records, scoring, ranking math, and canonical content
  are unchanged.
validation:
  local:
  - Focused Django and browser journeys
  - scripts/agent-verify.sh full
  - MANIFEST and scope checks
  - Desktop/mobile screenshot inspection
  focused_tests_to_add:
  - Exclusion across fallback, context, no-capacity, all-excluded and corrupt-context cases
  - Partial saves retain unknown and explicit zero across revisions; no score/evidence mutation
  - Owner/assessment isolation, deferred review horizon and explicit reconsideration
  - Desktop/mobile partial-save, exclude, explore, reconsider journey
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - Fallback can reintroduce an excluded candidate.
  - Partial input can silently become a numeric default or rewrite saved context.
  - Review horizons can be mistaken for automatic expiry.
  stop_conditions:
  - Protected source or historical data drift
  - Private authored text exposed outside existing surfaces
  - Changed ranking or scoring semantics
rollback:
  strategy: Revert browser selection/form/template code; no migration. Existing partial and excluded
    snapshots remain valid and immutable under the unchanged context contract.
evidence:
  output:
  - docs/evidence/M6L-02-CONTEXT-ALTERNATIVES-20260929.md
  claim_boundary: Software and synthetic browser validation only; no new participant or specialist
    evidence, merge, release or live data operation.
