acceptance:
- Container startup defaults to a personal start; explicit demo opt-in seeds idempotently, while existing
  users, assessments, passwords and active practices remain intact. Legacy explicit seed command and service
  calls retain compatibility.
- Published images embed the full revision at build time; authenticated installation page and local CLI
  show it truthfully, including unknown metadata. No network version check or automatic update.
- Read-only installation diagnostics report configuration/database/migration readiness without private
  values; document login recovery, config checks, pinned update, backup verification, active-practice
  guard and offline restore/rollback.
- Exercise personal and demo startup, restarts, installed revision, authentication, narrow layouts, diagnostics
  failure cases and existing backup/recovery gates.
- No migration, scoring or content change; preserve all protected renderer inputs and historical replay.
validation:
  local:
  - Focused Django and browser journeys
  - scripts/agent-verify.sh full
  - MANIFEST and scope checks
  - Desktop/mobile screenshot inspection
  focused_tests_to_add:
  - Personal-start and demo seed idempotency, existing history/password preservation
  - Build revision propagation, malformed/missing metadata, authenticated read-only installation UI/CLI
    and diagnostic failures
  - Fresh personal container, demo container and full existing recreation/backup/restore drill
  - Mobile/keyboard installation page and existing relevant journeys
  required_ci:
  - Pilot readiness gate
risk:
  class: moderate
  hazards:
  - A startup choice could silently create or replace personal history.
  - Runtime metadata could report an incorrect revision or expose private configuration.
  - Recovery guidance could restore the wrong database or bypass an in-progress practice guard.
  stop_conditions:
  - Protected content or scoring drift
  - Destructive live-data operation
  - Unverified version or recovery claims
rollback:
  strategy: Revert startup choice and additive diagnostics/UI/build metadata. No migration. Preserve all
    existing assessments and backups; use a verified pre-upgrade database with its matching pinned image
    if an unrelated schema upgrade requires rollback.
evidence:
  output:
  - docs/evidence/M6L-07-OPERATOR-CONVENIENCE-20260930.md
  claim_boundary: Software and synthetic browser validation only; no new participant or specialist evidence,
    merge, release or live data operation.
