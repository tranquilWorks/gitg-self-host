schema_version: 1
batch:
  id: M6K-PHYSICAL-CAPACITY-RUNTIME
  title: Repair strength and movement-capacity pathways
  goal: >-
    Increase substantive tailored runtime coverage from 94 to 96 with the two remaining
    demonstrated M6K repairs; preserve separate pending human and independent review.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
    - docs/plans/m6k/README.md
    - docs/plans/m6k/REVIEW_RECORD.md
    - docs/plans/m6k/program.json
    - https://github.com/tranquilWorks/gitg-self-host/issues/60
  milestone: M6K-12.05-12.08
  baseline_commit: 574dc81aae4939b17f80411154a3f3747657914e
dependencies:
  - PR-71-content-head
scope:
  allowed_paths:
    - MANIFEST.tsv
    - contracts/active-batch.yaml
    - contracts/tailored-practice-authoring.yaml
    - docs/PROJECT_HANDOFF.md
    - docs/plans/m6k/README.md
    - docs/plans/m6k/runtime-projections.json
    - docs/authoring/exercises/12.yaml
    - docs/authoring/sources.yaml
    - docs/authoring/quality/12.05/**
    - docs/authoring/quality/12.08/**
    - docs/authoring/quality/current-report.json
    - docs/authoring/M6K-PHYSICAL-CAPACITY-*.md
    - docs/evidence/**
    - data/practices/protocols/12/PRACTICE-COMP-1205-STRENGTH-AND-MUSCULAR-CAPABILITY-01.yaml
    - data/practices/protocols/12/PRACTICE-COMP-1208-POWER-SPEED-COORDINATION-AND-AGILITY-01.yaml
    - data/practices/registries/source_registry.yaml
    - data/practices/release_manifest.yaml
    - reports/**
    - tests/test_m6k_physical_capacity.py
    - tests/test_m6k_learning_craft.py
    - tests/test_m6k_review_evidence.py
  forbidden_paths:
    - data/assessment/**
    - data/model/**
    - data/curriculum/**
    - data/practices/registries/activation_ledger.yaml
    - growth/models.py
    - growth/migrations/**
    - growth/services/canonical_import.py
    - growth/domain/composite_scoring.py
    - growth/services/composite_score_state.py
    - growth/domain/context_priority.py
    - requirements*.txt
    - pyproject.toml
    - Dockerfile
    - docker-compose.yml
    - .github/workflows/**
    - docs/plans/m6k/recovery/**
    - docs/authoring/quality/ledger.json
acceptance:
  - 'Exactly 12.05 and 12.08 become individually authored runtime practices: 96 tailored, 287 pending.'
  - Strength maps major patterns and supplies entry, established-plan and instruction-first routes with technique, recovery and bounded progression.
  - Power, speed, coordination, reaction and agility remain distinct, with separate prerequisites, materials, progression and safety limits.
  - Preserve 383 protocol IDs, 1151 action IDs, parent mappings, completion rules, activation, scoring and immutable event replay.
  - Recovery archive stays byte-exact; prospective content is checked against pinned originals and exact compiler output.
  - Formal independent, learner, qualified and owner acceptance are not inferred.
validation:
  local:
    - >-
      .venv/bin/python -m pytest tests/test_m6k_physical_capacity.py
      tests/test_m6k_learning_craft.py tests/test_tailored_practice_authoring.py
      tests/test_m6k_recovery.py tests/test_m6k_review_evidence.py -q
    - ./scripts/agent-verify.sh contract
    - make pilot-check curriculum-check competency-evidence-check
    - git diff --check
  required_ci:
    - Ruff Django pytest migration drift and manifest verification
    - all readiness and canonical report gates
    - Playwright core journeys
    - Compose backup restore and recreation
    - aggregate Pilot readiness gate
  focused_tests_to_add:
    - Exact identity and completion preservation for both runtime projections
    - Distinct component routes and prompt/key reveal boundaries
    - Prospective invariant drift rejection and current source bindings
risk:
  class: high
  hazards:
    - an introductory chair rise is misrepresented as the whole strength competency
    - tabletop coordination is misrepresented as power, speed or agility evidence
    - a generic exercise is interpreted as medical clearance or a universal program
    - task completion is confused with strength gain or athletic capability
  stop_conditions:
    - historical event replay changes
    - assessment or scoring mathematics changes
    - a required route lacks prerequisites, stop conditions or an evidence boundary
    - a required CI gate fails
rollback:
  strategy: >-
    Revert the content release before import or restore the verified pre-upgrade backup;
    never reinterpret existing event snapshots.
evidence:
  output:
    - docs/evidence/M6K-PHYSICAL-CAPACITY-RUNTIME.md
  claim_boundary: >-
    Authored educational practices and software verification; no medical clearance,
    automatic human review or empirical validation acceptance.
