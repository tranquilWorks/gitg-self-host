schema_version: 1
batch:
  id: M6K-SIX-MORE-SOURCE-CONSOLIDATION
  title: Publish consolidated sources and repair source verification
  goal: Preserve the twenty-one authored candidates, repair source-test formatting, and honor the owner's explicit merge request without claiming runtime integration.
sources:
  product: products/gitg-self-host/product.yaml
  requirements:
  - docs/plans/m6k/README.md
  - docs/plans/m6k/REVIEW_RECORD.md
  - docs/plans/m6k/program.json
  - docs/authoring/SOURCE-CONSOLIDATION-STATUS.md
  milestone: M6K-SIX-MORE-SOURCE-PUBLICATION
  baseline_commit: d93532696d3ea9d04e50f47350b90fa255208511
dependencies:
- PR-77-merged
scope:
  allowed_paths:
  - MANIFEST.tsv
  - contracts/active-batch.yaml
  - docs/authoring/SOURCE-CONSOLIDATION-STATUS.md
  - docs/authoring/reasoning-foundations/**
  - docs/authoring/evidence-humility-forecasting/**
  - docs/authoring/systems-causes-tradeoffs/**
  - docs/authoring/risk-judgment-inference/**
  - docs/authoring/models-information-execution/**
  - docs/evidence/M6K-SOURCE-CONSOLIDATION-RETRY.md
  - tests/test_m6k_reasoning_sources.py
  - tests/test_m6k_evidence_humility_forecasting_sources.py
  - tests/test_m6k_systems_causes_tradeoffs_sources.py
  - tests/test_m6k_risk_judgment_inference_sources.py
  - tests/test_m6k_models_information_execution_sources.py
  - .github/workflows/source-repair-capture.yml
  forbidden_paths:
  - data/**
  - growth/**
  - grounded_growth/**
  - templates/**
  - docs/authoring/exercises/**
  - docs/authoring/quality/**
  - docs/plans/m6k/recovery/**
  - docs/plans/m6k/runtime-projections.json
  - contracts/tailored-practice-authoring.yaml
  - requirements*.txt
  - pyproject.toml
  - Dockerfile
  - docker-compose.yml
  - .github/workflows/verification.yml
  - .github/codex/**
acceptance:
- Preserve all twenty-one individually authored source candidates and their test criteria.
- Fix formatting and lint defects without weakening or skipping tests.
- The temporary read-only diagnostic workflow may export tracked source and test repairs, never credentials, participant data, or repository writes; remove it before merge.
- Preserve all runtime content, stable IDs, completion, activation, scoring, and historical replay.
- Runtime coverage remains 108 tailored and 275 pending; publication is not runtime completion.
- Regenerate and verify MANIFEST.tsv on the actual final tracked checkout before merge.
- Report actual source, application, CI, and human evidence separately.
validation:
  local:
  - python -m unittest discover -s tests -p '*sources.py' -v
  - python scripts/verify-manifest.py
  - git diff --check
  required_ci:
  - existing repository verification workflow unchanged
  - source formatting, lint, and source regression checks
  focused_tests_to_add:
  - Preserve source identities and existing assertions across all five cohorts
  - Run previously unavailable source-text checks using the exact tracked snapshot
risk:
  class: moderate
  hazards:
  - Source publication is mistaken for runtime integration or human acceptance
  - A test repair changes an assertion or hides a failing case
  - Diagnostic material accidentally includes untracked or sensitive data
  stop_conditions:
  - Any protected runtime, data, or original verification-workflow change
  - Source-identity mismatch or lost test criteria
  - A failed or unrun check is represented as passing
rollback:
  strategy: Revert the source-only merge; no database import, live action, deployment, or historical mutation.
evidence:
  output:
  - docs/evidence/M6K-SOURCE-CONSOLIDATION-RETRY.md
  claim_boundary: The owner explicitly authorized merging PR80 and the next six source candidates. Merge does not establish runtime selection, deployment, or formal learner/specialist acceptance.
