risk:
  class: moderate
  hazards:
  - Presentation must not change consent reuse ownership or immutable record semantics.
  - Hidden progressive sections must retain values and expose validation errors accessibly.
  - Direction text is displayed for planning but never analyzed or fed to ranking.
  stop_conditions:
  - Protected content scoring or participant data change
rollback:
  strategy: Revert this presentation batch together; preserve all saved records and original routes.
evidence:
